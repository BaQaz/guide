, "level": "1", "priority": "normal", "needs_check": false, "children": ["2-05-a", "2-05-b", "2-05-c", "2-05-d"], "related": ["1-08", "2-06", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備とは、相手の打球や走塁を止めてアウトを取る側の仕事だ。グラウンドには投手と捕手を含めて9人が入り、それぞれ違う範囲と役割を受け持つ。\n\n## しくみ\n投手が投げ、打者が打った瞬間から、守備の9人は「どこに飛んだか」「走者がどこにいるか」「何アウトか」で動きを変える。ゴロなら内野手が捕って一塁へ、フライなら落下地点に近い野手が捕る、というのが基本だ。\n\nでも実際は、ボールを捕る人だけが守備をしているわけではない。ほかの野手も、送球を受ける塁へ入る、悪送球に備えて後ろを守る、中継に入る、といった動きを同時にしている。\n\nつまり守備は9人で行う連携なのだ。テレビでは打球だけを追いがちだが、球場ではボールから離れた選手の動きも見える。それが現地観戦のおもしろさの一つだ。\n\n## おもしろエピソード\nスコアブックでは守備位置を1〜9の数字で表す。たとえば「6-4-3」の併殺（ゲッツー：一度に2つアウトを取ること）なら、遊撃手から二塁手、最後に一塁手へ送ったという意味になる。\n\n数字がわかると、スコアや実況の短い表現だけでプレーの流れを読めるようになるのだ。\n\n## 今日の試合で見るなら\nロッテの予想守備では、遊撃の山崎剛と二塁の小川龍成が内野の中央を守り、中堅の髙部瑛斗や右翼の藤原恭大が外野を受け持つ。日本ハムの水野達稀や清宮幸太郎が打席に入ったら、投球前から彼らの立ち位置を見ておくといい。\n\n打球が飛んだあと、捕った選手だけでなく、ほかの野手が塁や中継地点へ動くところまで追う。そうすると、守備が「一人の好プレー」ではなく、9人の配置と連携でできているのが見えてくるのだ。"}, "2-06-a": {"meta": {"id": "2-06-a", "title": "ゴールデングラブ賞って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/news/detail/20251112_02.html", "https://npb.jp/award/2022/glove.html", "https://npb.jp/bis/players/11215151.html"]}, "body": "## ひとことで\n三井ゴールデン・グラブ賞は、その年に守備で特に高く評価された選手を選ぶ表彰だ。いわば守備版の「ベストナイン」（ポジションごとの優秀選手を選ぶ表彰）なのだ。\n\n## しくみ\n受賞者は、新聞社・通信社・テレビ局・ラジオ局のプロ野球担当記者による投票で決まる。投手、捕手、各内野手、外野手が選ばれ、セ・リーグとパ・リーグでそれぞれ表彰される。\n\nだから、単純にエラーが少ない選手を自動で選ぶ賞ではない。守備範囲、肩、捕球、送球などを含めて、記者がその年の守備を評価する賞なのだ。\n\n## おもしろエピソード\nロッテの髙部瑛斗は2022年、パ・リーグ外野手部門で初受賞した。\n\n## 今日の試合で見るなら\n予想どおり髙部が中堅に入ったら、過去の受賞歴を思い出しつつ、打球への一歩目を見てほしい。受賞歴があるから毎回好守になるわけではないが、「守備も見どころの選手」だと分かるのだ。"}, "2-06-b": {"meta": {"id": "2-06-b", "title": "どこを見るとファインプレーに気づける？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\n打球を捕る瞬間だけでなく、「打つ前の位置」と「打った直後の一歩目」を見ると、ファインプレーに気づきやすい。うまい守備ほど派手に見えないこともあるのだ。\n\n## しくみ\n見る順番は、位置取り→一歩目→捕球→送球でいい。外野手なら最短に近い道で落下点へ入れたか、内野手なら捕ったあとすぐ投げられる体勢だったかを見る。\n\nさらに走者がいる場面では、送球先も大事だ。ホームを狙う走者を止めたり、余計な進塁を防いだりする判断も好守なのだ。\n\n## 今日の試合で見るなら\nロッテの髙部瑛斗と藤原恭大に打球が飛んだら、ボールより先に2人の足を見てほしい。打った瞬間に迷わず動き、余裕を持って捕ったなら、その「余裕」自体がうまさの結果かもしれないのだ。"}, "2-06-c": {"meta": {"id": "2-06-c", "title": "ダイビングキャッチってどれくらい難しい？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\n**ダイビングキャッチ（走った勢いのまま飛び込んで捕ること）**は、届くかどうかの判断と捕球を一瞬で両立する難しい守備だ。==飛び込めばすごいのではなく、飛び込む必要がある打球をアウトにするのがすごい==のだ。\n\n## しくみ\n外野手は、打球の高さや速さを見ながら落下点へ走る。普通に追いつけないと判断した最後の一歩で体を投げ出し、グラブを球の進路へ合わせる。\n\n失敗すると、球が後ろへ抜けて長打になることもある。だから==「届きそうだから飛ぶ」ではなく、「飛ばないと届かないが、抜けてもよいか」まで含めた判断==が必要なのだ。\n\n## おもしろエピソード\nうまい外野手ほど、最初の一歩や走る角度がよく、派手に飛ばずに捕ることも多い。==ダイビングの前にある数秒の走り方==もファインプレーの一部なのだ。\n\n## 今日の試合で見るなら\n予想どおりならロッテ外野には**髙部瑛斗**や**藤原恭大**が入る。外野へ浅い打球が飛んだら、==捕る瞬間だけでなく、打った直後の一歩目から見る==と難しさが分かりやすいのだ。"}, "2-06": {"meta": {"id": "2-06", "title": "ファインプレーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-06-a", "2-06-b"], "related": ["2-05", "2-04"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\nファインプレーは、普通ならヒットや進塁になりそうな打球を、守備のうまさでアウトに変えるような好プレーのことだ。派手に飛びつく場面だけがファインプレーではないのだ。\n\n## しくみ\n守備のうまさは、捕った瞬間だけでは決まらない。打球が飛ぶ前の位置取り、打った瞬間の一歩目、落下点までの走り方、捕ってから投げる速さまでが一続きになっている。\n\nたとえば外野手が余裕を持ってフライを捕ると、簡単に見えることがある。けれど、最初から正しい方向へ走れていたから余裕が生まれたのかもしれない。逆に、飛びついて捕ったからといって、必ずしも最善の守備だったとは限らないのだ。\n\n内野なら、強いゴロに追いつくだけでなく、体勢が崩れても一塁へ正確に送れるかまで見るといい。走者がいるときは、ただアウトを取るだけでなく、次の塁へ進ませない判断も守備の価値になる。\n\n## おもしろエピソード\nロッテの髙部瑛斗は2022年に外野手として三井ゴールデン・グラブ賞を受賞している。賞の名前を知らなくても、守備で評価された選手だと分かれば、打球が飛んだときの見方が変わるのだ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは髙部瑛斗が中堅、藤原恭大が右翼に入る。外野へ打球が上がったら、ボールだけでなく、2人が打った瞬間にどちらへ動いたかを見てほしい。\n\n特にZOZOマリンの外野では、最後の捕球だけを追うより、落下点へ入るまでの動きに注目するとファインプレーに気づきやすいのだ。"}, "2-07-a": {"meta": {"id": "2-07-a", "title": "球種って？（ストレート・フォーク・チェンジアップなど）", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-13"], "sources": ["https://npb.jp/pl/", "https://pacificleague.com/news/2026/9/86605"]}, "body": "## ひとことで\n球種（速さや曲がり方の違う球）は、打者の予想を外すための道具だ。同じ腕の振りから違う球が来るほど、打つ側は対応しにくいのだ。\n\n## しくみ\n代表的なのは、ストレート（まっすぐに見える速い球）、フォーク（打者の手元で下に落ちる球）、チェンジアップ（速球に似たフォームから遅く投げる球）だ。スライダー（横や斜めに曲がる球）などもある。\n\n打者を抑えるカギは、「一番すごい球」より組み合わせにある。速球を意識させて遅い球を投げれば、打者は早く振り始めてしまう。じゃんけんで同じ手だけを出さないのと似ているのだ。\n\n## 今日の試合で見るなら\nロッテ先発のA.ジャクソンは直球とチェンジアップ、日本ハム先発の福島蓮は直球とフォークが見どころだ。空振りしたとき、球が速すぎたのか、途中で落ちたのか、タイミングを外されたのかを見ると球種の違いがわかりやすい。"}, "2-07-b": {"meta": {"id": "2-07-b", "title": "何キロ出たら速い？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-07-a"], "sources": ["https://npb.jp/pl/", "https://npb.jp/announcement/roster/"]}, "body": "## ひとことで\n「何キロから速い」という公式の境目はない。ただ、観戦では150キロ前後が出ると「かなり速い球だ」と見る目安にしやすいのだ。\n\n## しくみ\n球速は球場表示で「152 km/h」のように出る。けれど、同じ150キロでも打者の感じ方は同じではない。投手の腕が見えにくい、球が伸びて見える、変化球との速度差が大きい、といった条件で打ちにくさは変わるからだ。\n\n逆に140キロ台でも、狙った場所へ投げ分ければ十分に抑えられる。速度計は「投手の強さそのもの」ではなく、投球を読む一つの数字なのだ。\n\n## 今日の試合で見るなら\n今日はA.ジャクソンや福島蓮が直球を投げたら、まず表示された球速を覚えておくとよい。その後のフォークやチェンジアップで打者の振りが遅れたり早まったりすれば、速さと速度差がセットで効いているのが見えてくる。"}, "2-07-c": {"meta": {"id": "2-07-c", "title": "何球くらい投げたら交代する？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-09"], "sources": ["https://www.nikkansports.com/baseball/news/202609120001034.html", "https://www.nikkansports.com/baseball/news/202607220001544.html", "https://www.nikkansports.com/baseball/news/202609270001159.html", "https://www.chunichi.co.jp/article/1317229", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\nプロ野球の先発投手に「○球で必ず交代」という決まりはない。100球前後は観戦の目安になるが、点差や内容、次に投げる投手まで含めて監督が決めるのだ。\n\n## しくみ\n同じ100球でも、5回で到達するのと7回で到達するのでは意味が違う。走者を何人も出して一球ごとの負担が大きければ早めに替えることもあるし、少ない球数でアウトを重ねていれば長く投げることもある。\n\n実際に今季も、101球や104球で先発が交代した試合がある。100はルールではなく、「そろそろ継投（投手を交代してつなぐこと）がありそうだ」と考える目盛りなのだ。\n\n## 今日の試合で見るなら\n特に福島蓮は、7月12日以来の先発だ。直前まで救援で投げ、先発予定だった加藤貴之の離脱を受けて前日に先発を告げられている。だから球数が100に届く前でも、内容や回数を見て早めに日本ハムの中継ぎ（先発のあとを受けて投げる投手）へつなぐ展開は十分考えられるのだ。"}, "2-07-d": {"meta": {"id": "2-07-d", "title": "右投げと左投げで何が違う？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-07-a"], "sources": ["https://npb.jp/pl/", "https://npb.jp/announcement/roster/"]}, "body": "## ひとことで\n右投手と左投手では、打者から見えるボールの出どころと曲がる方向が変わる。同じ球速でも、対戦する打者の左右で打ちやすさが変わることがあるのだ。\n\n## しくみ\n右投手と右打者、左投手と左打者のような「同じ側」の対戦では、外へ逃げる変化球が使いやすい。反対側の打者には球の見え方が変わるので、投手は球種やコースを組み替える。\n\nまた左投手は一塁側を向いた姿勢から投げるため、一塁走者への牽制球（走者を塁へ戻す送球）も右投手とは見え方が違う。左右は単なる利き腕ではなく、作戦の材料なのだ。\n\n## 今日の試合で見るなら\n今日の先発A.ジャクソンと福島蓮はともに右腕だ。試合途中にロッテの左腕・坂本光士郎が出て、水野達稀や清宮幸太郎のような左打者と向き合えば「左対左」になる。交代した瞬間に打者との左右関係を見ると、継投（投手を交代してつなぐこと）の意図を考えやすい。"}, "2-07": {"meta": {"id": "2-07", "title": "ピッチャーって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-07-a", "2-07-b", "2-07-c", "2-07-d"], "related": ["2-08", "2-09", "2-13"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://pacificleague.com/news/2026/9/86605", "https://www.chunichi.co.jp/article/1317229"]}, "body": "## ひとことで\nピッチャー（投手：打者にボールを投げる守備の選手）は、毎回のプレーを始める役だ。速い球を投げるだけでなく、打者に強い打球を打たせないことが仕事なのだ。\n\n## しくみ\n投手はマウンド（内野の中央にある少し高い場所）から、キャッチャー（捕手：本塁の後ろで球を受ける選手）へ投げる。ストライクを3つ取れば三振だが、全部を三振にする必要はない。打ちにくいコースへ投げてゴロやフライにすれば、後ろの8人にアウトを取ってもらえるからだ。\n\nだから投球は、速さだけの勝負ではない。球種（速さや曲がり方の違う球）を混ぜ、同じフォームから違う軌道を見せる。さらにボール球も使い、打者が「次は何が来るか」を読み切れないようにするのだ。\n\n投手は守備にも参加する。自分の近くへ飛んだゴロを捕り、一塁へ送球することもあるし、走者がいるときは牽制球（走者を塁へ戻すための送球）も投げる。打者だけでなく、走者と守備全体を動かす役でもあるというわけだ。\n\n## 今日の試合で見るなら\n今日の先発（試合の最初から投げる投手）は、ロッテが右腕のA.ジャクソン、日本ハムが右腕の福島蓮だ。ジャクソンは今季9勝8敗、防御率（9回を投げたとして何点取られるかの目安）3.44で、勝てば10勝目。福島は7月12日以来の先発で、それまでは救援（試合途中から投げる役）を続けていた。\n\n同じ右投げでも、投げ方と球種はかなり違う。ジャクソンは力のある直球とチェンジアップ、福島は角度のある直球とフォークが持ち味だ。球速表示だけでなく、打者の空振り方やゴロの増え方を見ると、投手の狙いが少し見えてくるのだ。"}, "2-08-a": {"meta": {"id": "2-08-a", "title": "サインって何を決めてるの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-08", "2-07"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\n捕手のサインは、主に「どの球種を、どこへ投げるか」を投手と共有する合図だ。1球ごとの小さな作戦会議だと思えばいい。\n\n## しくみ\n同じ打者でも、ストライクやボールの数、アウト数、走者の有無、直前に投げた球で狙いは変わる。こうした一連の組み立てを配球（はいきゅう：投げる球の順番や場所の組み立て）という。\n\n捕手が案を出しても、投手が違う球を選びたいことはある。サインで確かめたいのは、投げる前に2人の考えが一致しているかどうかなのだ。\n\n## 今日の試合で見るなら\nロッテの佐藤都志也とジャクソン、日本ハムの田宮裕涼と福島蓮の組み合わせに注目してほしい。同じ打者にストレートを続けるのか、途中で変化球を混ぜるのかを見ると、サインの意味を想像しやすいのだ。"}, "2-08-b": {"meta": {"id": "2-08-b", "title": "盗塁を刺すってどういうこと？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-08", "2-11"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/71075151.html"]}, "body": "## ひとことで\n「盗塁を刺す」は、走者が次の塁を盗もうとしたとき、捕手が送球してアウトにすることだ。捕手の肩だけでなく、投手と内野手も関わる共同作業なのだ。\n\n## しくみ\nたとえば一塁走者が二塁へ走る。捕手は投球を受けたらすぐ持ち替えて二塁へ投げ、内野手がボールを受けて走者にタッチする。\n\n勝負はほんの短い時間で決まる。走者のスタート、投手が本塁へ投げる速さ、捕手の捕球と送球、内野手のタッチが全部つながっているのだ。\n\n記録では、盗塁を試みてアウトになった走者に盗塁刺が記録される。「捕手が刺した」は、その守備側から見た言い方だ。\n\n## 今日の試合で見るなら\n日本ハムの西川遥輝は9月27日終了時点で通算345盗塁だ。途中出場して一塁に出たとき、ロッテの捕手が佐藤都志也なら、投球後すぐ二塁方向を見るとよい。盗塁の攻防を追いやすいのだ。"}, "2-08-c": {"meta": {"id": "2-08-c", "title": "キャッチャーが立ち上がって構えるのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-08", "2-11"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html", "https://npb.jp/scores/2026/0927/m-f-23/roster.html"]}, "body": "## ひとことで\n**キャッチャー（捕手）**が立って構えるのは、走者の盗塁を強く警戒し、捕ってすぐ送球しやすくしたい場面などだ。==いつもの低い姿勢と違うなら、走者への警戒が強まった合図として見られる==のだ。\n\n## しくみ\n座った姿勢から二塁へ投げるには、捕球して立ち、足を送球方向へ運ぶ必要がある。最初から高く構えれば、その動きを短くできる。\n\nまた、投手に高めや外側へ外す球を要求し、走者を刺す準備をすることもある。ただし、==立っただけで必ず盗塁が来ると決まったわけではない==のだ。\n\n## 今日の試合で見るなら\n9月27日の同カードでは、ロッテは**佐藤都志也**、日本ハムは**田宮裕涼**がベンチ入りしていた。今日も出場し、一塁に走者がいる場面で捕手が急に立ったら、==打者だけでなく一塁走者にも目を移す==と次のプレーを追いやすいのだ。"}, "2-08": {"meta": {"id": "2-08", "title": "キャッチャーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-08-a", "2-08-b"], "related": ["2-07", "2-11"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\nキャッチャー（捕手）は、本塁の後ろで投手の球を受ける守備の中心だ。捕るだけでなく、投球の相談、走者への警戒、送球、ワンバウンドの処理まで担当するのだ。\n\n## しくみ\n投手が投げるたび、捕手は球を受ける。だから1試合の守備でボールに触れる回数がとても多く、投手と一緒に打者をどう打ち取るか考える役になる。\n\n投球前には、球種（ストレートや変化球の種類）や狙う場所を投手と共有する。走者がいるときは、盗塁を警戒しながら、ワンバウンドした球を体で止めて進塁を防ぐ仕事もある。\n\nさらに、打球が前へ転がれば素早く拾い、ファウルフライなら防具を着けたまま追う。本塁で走者と勝負する場面では、送球を受けてタッチする。投手の相棒であり、本塁周辺の守備をまとめる選手なのだ。\n\n## おもしろエピソード\n捕手は守備だけでなく打者としても出場する。今日の予想スタメンでは、ロッテの佐藤都志也、日本ハムの田宮裕涼はいずれも左打ちの捕手だ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは佐藤都志也がアンドレ・ジャクソン、日本ハムは田宮裕涼が福島蓮とバッテリーを組む。\n\n投手が投げる前、捕手は毎回ほぼ同じ場所に座っているようで、実は構えや要求が少しずつ変わる。投球だけでなく、その直前の捕手の動きを見ると、1球ごとの作戦が見えやすくなるのだ。"}, "2-09-a": {"meta": {"id": "2-09-a", "title": "勝ち投手・負け投手・セーブ・ホールドって？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-09"], "sources": ["https://npb.jp/npb/20050203stats.html", "https://npb.jp/news/detail/20190315_04.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nこれは「投手が試合のどの場面を担当したか」を表す記録だ。チームの勝敗と同じではなく、1試合の中で勝ち投手、セーブ、ホールドが別々の投手につくことがある。\n\n## しくみ\n勝ち投手は、勝ったチームで勝ちにつながる時点を担当した投手だ。先発（試合の最初から投げる投手）は原則5回以上を投げ、リードしたまま降り、そのリードが最後まで続くと勝ち投手になる。5回未満で降りた場合は、救援投手（途中から出てくる投手）の中から記録員が規則に沿って決める。\n\n負け投手は、相手が最後まで守ったリードにつながる走者を出した投手につくのが基本だ。セーブは、接戦の終盤を最後まで投げ切った救援投手につく記録。ホールドは、決められた接戦の場面でリードや同点を保って次へつないだ救援投手につく。\n\n## 今日の試合で見るなら\nA.ジャクソンは今日勝てば10勝目だ。一方、ロッテの横山陸人は今季33セーブ。ロッテが終盤に小差でリードし、中継ぎがつないで横山が最後を締めれば、1試合で「勝ち・ホールド・セーブ」が別々の投手につく流れを見られるかもしれない。"}, "2-09-b": {"meta": {"id": "2-09-b", "title": "先発はなぜ6日くらい空けて投げるの？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07-c", "2-09"], "sources": ["https://www.nikkansports.com/baseball/news/202607270000480.html", "https://www.nikkansports.com/baseball/news/202606160001168.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0922/m-b-24/box.html", "https://pacificleague.com/news/2026/6/10051440"]}, "body": "## ひとことで\n先発は一度に何十球も強く腕を振るので、次の登板まで回復と準備の時間が必要だ。日本のプロ野球では「中6日」、つまり登板の間に6日間休んで次に投げる形がよく使われる。\n\n## しくみ\n月曜日に投げ、火曜から日曜まで6日空け、次の月曜日にまた投げる。これが中6日だ。その間はただ休むわけでもない。体を戻し、軽い投球やブルペン（投球練習場）での投球をはさみ、次の相手への準備をする。\n\n楽天の吉井理人監督も2026年、基本は中6日で回し、一定のリズムを作る考えを説明している。毎回同じ間隔なら、投手も「何日前に何をするか」を組み立てやすいのだ。\n\n## 今日の試合で見るなら\nロッテのA.ジャクソンは9月22日に登板し、今日はそこから中5日だ。中6日は目安であって、日程やチーム事情で前後する。今日の投球では、間隔が少し短い中で何回まで球威を保てるかも見どころになる。"}, "2-09-c": {"meta": {"id": "2-09-c", "title": "ブルペンって？どこにある？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-09"], "sources": ["https://www.marines.co.jp/community/marineslinks/20250825-01.html", "https://www.marines.co.jp/community/marineslinks/20241105-01.html", "https://npb.jp/announcement/roster/", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nブルペンは、試合に出る前の投手が肩を作る（投げられる状態まで体を温める）ための投球練習場所だ。「ブルペン陣」と言うと、中継ぎや抑えの投手たち全体を指すこともある。\n\n## しくみ\n先発が苦しくなってから次の投手が準備を始めたのでは遅い。救援投手（途中から出てくる投手）はブルペンで投げ、体と球の感覚を実戦に近づけてから登板する。だからベンチは、試合の少し先を読んで準備を進めるのだ。\n\nZOZOマリンには1塁側と3塁側にブルペンがあることが、ロッテ公式の記事でも確認できる。球場で「ブルペンが動いた」と聞こえたら、投手交代が近づいている合図だと考えるとよい。\n\n## 今日の試合で見るなら\nロッテは1塁側、日本ハムは3塁側だ。A.ジャクソンの球数が増えれば、中森俊介、八木彬、横山陸人ら救援陣の出番を考える時間になる。福島蓮は久しぶりの先発なので、日本ハム側はさらに早い回から次の投手を準備する展開もあり得るのだ。"}, "2-09": {"meta": {"id": "2-09", "title": "先発とか中継ぎとか抑えって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-09-a", "2-09-b", "2-09-c"], "related": ["2-07", "2-07-c"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/announcement/roster/", "https://pacificleague.com/news/2026/9/86605", "https://www.nikkansports.com/baseball/news/202609270001159.html", "https://www.chunichi.co.jp/article/1317229", "https://npb.jp/scores/2026/0925/l-m-22/box.html", "https://npb.jp/scores/2026/0926/l-m-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n投手は、一人で9回すべてを投げるとは限らない。最初に投げる先発、途中をつなぐ中継ぎ、最後を任される抑えに役割を分けて戦うのだ。\n\n## しくみ\n先発（試合の最初から投げる投手）は、できるだけ長い回を投げて試合を作る役だ。そこから中継ぎ（試合途中から短い回を受け持つ投手）がつなぐ。勝っている終盤には、セットアッパー（主に7、8回の重要な場面を任される投手）や抑え（最後の回を締める投手）が出てくる。\n\nこの交代の流れを継投（複数の投手で試合をつなぐこと）という。監督は点差、打者の左右、各投手の疲労、前日までの登板などを見て決める。同じ「7回」でも、毎日同じ投手が出るわけではないのだ。\n\nロッテでは今季、横山陸人が33セーブを挙げて抑えを担っている。中森俊介、八木彬、鈴木昭汰らも多くの救援登板を重ねてきた。先発が降りた後も、試合では別の勝負が始まるというわけだ。\n\n## 今日の試合で見るなら\nロッテ先発のA.ジャクソンは9勝目まで挙げており、まず何回まで投げるかがポイントだ。鈴木昭汰は9月25日から27日まで3日連続で登板しているため、今日の起用は負荷との相談になる。中森、八木、横山へどうつなぐかを見ると、ロッテの継投がわかりやすい。\n\n日本ハムの福島蓮は事情が違う。7月12日を最後に先発から離れ、その後は16試合に救援登板していたが、先発予定だった加藤貴之の離脱で前日に今日の先発を告げられた。長い回を当然のように任せる日ではなく、早めに中継ぎへつなぐ展開も想定して見ると、ベンチの動きが読みやすいのだ。"}, "2-10-a": {"meta": {"id": "2-10-a", "title": "ゲッツー（併殺打）って？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-10", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nゲッツーは、守備側が一つの流れで2つアウトを取る併殺（ダブルプレー）のことだ。併殺打は、その原因になった打者の打撃を示す記録なのだ。\n\n## しくみ\n典型は一塁走者がいる場面の内野ゴロ（内野に転がる打球）だ。遊撃手（ショート）や二塁手が二塁で走者をアウトにし、すぐ一塁へ送って打者走者（打って一塁へ走る打者）もアウトにする。\n\n「併殺」と「併殺打」は完全に同じではない。たとえば三振と盗塁失敗が同じプレーで重なれば、アウトは一度に2つ増える。それでも打者の打球から起きたプレーではないので、併殺打には数えないのだ。\n\n## おもしろエピソード\n前日の9月27日、藤原恭大の打席にはNPB公式記録で「一併打」と付いた。一塁手が関わる併殺打だったと、記録だけでも読み取れるのだ。\n\n## 今日の試合で見るなら\nロッテの山崎剛と小川龍成、日本ハムの水野達稀と山縣秀が二遊間（二塁手と遊撃手のコンビ）に入れば注目だ。一塁に走者がいてゴロが飛んだら、最初の送球先が二塁かどうかを見るとゲッツーを追いやすい。"}, "2-10-b": {"meta": {"id": "2-10-b", "title": "3つ一気に取るトリプルプレーは？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-10", "2-12"], "sources": ["https://npb.jp/history/2025/review_rec_f.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。三重殺（トリプルプレー：一つのプレーで3つアウトを取ること）という、とても珍しい守備なのだ。\n\n## しくみ\n起きやすい入口は、ノーアウトで走者が2人以上いる場面だ。たとえば一・二塁で内野への強いライナー（地面につかずに飛ぶ打球）を野手が捕り、飛び出していた走者を二塁、一塁で続けてアウトにすると3アウトになる。\n\nゴロでも、三塁、二塁、一塁と送って三つ取る形がある。条件も送球もそろわないと成立しないので、普通の併殺よりずっと珍しい。\n\n## おもしろエピソード\nNPBでは2025年7月13日にソフトバンクが楽天戦で三重殺を記録した。NPB公式によると、プロ野球で175度目だった。\n\n## 今日の試合で見るなら\nノーアウト一・二塁になったら少しだけ意識するといい。水野達稀や山崎剛の近くへ鋭い打球が飛び、走者が大きく飛び出していたら、二つ目だけでなく三つ目のアウトまで続く可能性があるのだ。"}, "2-10-c": {"meta": {"id": "2-10-c", "title": "ゲッツーを防ぐために走者は何をする？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-10", "2-11"], "sources": ["https://npb.jp/npb/2017rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n一塁走者は、まず二塁でセーフになるよう全力で走る。滑り込むなら**正しいスライディング（ベースへ滑り込むこと）**を使い、==野手にわざとぶつかって邪魔するのは反則なのだ。==\n\n## しくみ\n**併殺（ゲッツー：1つの打球で2つアウトを取ること）**は、一塁に走者がいて内野ゴロが出たときに起きやすい。走者が二塁でセーフになれば、そこで1つ目のアウトを取れないので、==ゲッツーそのものを防げる==。\n\n二塁でアウトになりそうでも、走者は正規の走路を走り、滑るならベースへ向かって滑る。NPBでは2017年に、併殺を防ぐため野手へ接触しようとする不正なスライディングは妨害になると明文化された。==「野手を倒して送球を止める」はしてはいけない==というわけだ。\n\n## 今日の試合で見るなら\nたとえばロッテの**西川史礁**が一塁に出て、次の**山口航輝**が遊撃手や二塁手へゴロを打った場面だ。==西川が二塁へどう走るかまで見ると、打者だけでなく走者もゲッツーと戦っている==のが分かるのだ。"}, "2-10": {"meta": {"id": "2-10", "title": "一気に2つアウトを取ることがあるの？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-10-a", "2-10-b"], "related": ["1-08", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。一つのプレーで2人をアウトにする併殺（ダブルプレー：一度に2つアウトを取ること）があるのだ。内野ゴロで「二塁アウト、すぐ一塁アウト」がいちばん見つけやすい形だ。\n\n## しくみ\nたとえばノーアウト一塁で、打者が遊撃手（ショート：二塁と三塁の間を守る選手）の近くへゴロを打ったとする。一塁走者は二塁へ進まなければならないので、守備側はまず二塁で走者をアウトにし、すぐ一塁へ送って打者走者（打って一塁へ走る打者）もアウトにできる。\n\nこれでアウト数は0から2へ一気に増える。守る側には大きな得で、攻撃側には走者まで消える痛いプレーなのだ。\n\n二塁手や遊撃手が気にするのは、捕ってから投げる速さだけではない。次の送球がしやすい向きでボールを受けることも大事にしている。二塁ベース付近の動きが急に速くなったら、併殺を狙っている可能性が高い。\n\nただし、すでにツーアウトなら二つ目のアウトは取れない。最初の一つが三つ目のアウトになり、その瞬間に攻撃が終わるからだ。\n\n## おもしろエピソード\n前日の9月27日、ロッテの藤原恭大は一塁への打球で「一併打」と記録された。表示の「併」が、併殺打（打者の打球をきっかけに2つアウトになる打撃）の目印なのだ。\n\n## 今日の試合で見るなら\n予想どおりなら、ロッテは遊撃の山崎剛と二塁の小川龍成、日本ハムは遊撃の水野達稀と二塁の山縣秀が二遊間（二塁手と遊撃手のコンビ）を組む。ノーアウトかワンナウトで一塁に走者が出たら、打球だけでなく二塁ベースも見るといい。\n\nゴロが二遊間へ飛んだ瞬間、野手が二塁、一塁へ続けて投げればゲッツーの場面だ。スコアボードのアウト表示が一気に二つ増えるので、初めてでも結果を確認しやすい。"}, "2-11-a": {"meta": {"id": "2-11-a", "title": "牽制球って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-11", "2-08"], "sources": ["https://npb.jp/bis/players/63165155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n牽制球（けんせいきゅう）は、投手が本塁ではなく走者のいる塁へ投げる球だ。走者をアウトにするか、塁から大きく離れにくくする狙いがあるのだ。\n\n## しくみ\n一塁走者は、次の塁へ進みやすくするため少し塁から離れる。離れすぎれば、投手が一塁へ素早く投げ、野手がタッチしてアウトを狙える。\n\nアウトにならなくても意味はある。走者を塁の近くへ戻せれば、盗塁（投球の間に次の塁へ走ること）のスタートが遅れやすくなるからだ。牽制は「走るな」と圧力をかける守備でもある。\n\n## 今日の試合で見るなら\n日本ハムの1番予想・水野達稀が一塁に出たら、ロッテ先発のジャクソンを見てほしい。本塁へ投げる前に一塁を見る回数や、実際に牽制を入れるかで、水野の足をどれだけ警戒しているかが見えやすいのだ。"}, "2-11-b": {"meta": {"id": "2-11-b", "title": "誰が走るの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-11", "2-17"], "sources": ["https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html"]}, "body": "## ひとことで\n盗塁するのは足が速い選手が中心だが、それだけでは決まらない。投手の動きを読む力、スタート、成功率、試合の状況まで含めて「走れる選手」になるのだ。\n\n## しくみ\n50メートル走が速くても、投手の動き出しを読めなければ出遅れる。逆に、最初の一歩がうまい選手は、純粋な足の速さ以上に盗塁で強みを出せる。\n\nさらに、相手捕手の送球や点差も関係する。1点が重要な場面では、アウトになる危険と、二塁へ進む価値を比べて走るか決めるのだ。\n\n## 今日の試合で見るなら\n日本ハムでは水野達稀が今季15盗塁。西川遥輝は通算345盗塁で、現役最多だ。\n\n水野が先発で出塁したとき、西川が途中から代走（走者の代わり）や代打（打者の代わり）で出て塁に残ったときは、打者だけを見ず一塁走者も見てほしい。投手が投げる直前の一歩に、走る選手の技術が出るのだ。"}, "2-11-c": {"meta": {"id": "2-11-c", "title": "盗塁が成功しやすいのはどんなとき？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-11", "2-08"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n盗塁は足の速さだけで決まらない。==投手が本塁へ投げる瞬間を読んで、よいスタートを切れたとき==に成功しやすくなるのだ。\n\n## しくみ\n走者は**リード（塁から少し離れて取る準備距離）**を取り、投手の動きを見る。投手が牽制球（一塁へ投げて走者を戻す球）ではなく本塁へ投げると読めれば、早く走り出せる。\n\n捕手がワンバウンド気味の球を処理したり、投球が外れたりすると送球が遅れることもある。逆に投手が素早く投げ、捕手が捕りやすい球なら盗塁側は苦しい。==盗塁は「走者対捕手」ではなく、投手も含めた時間の競争==なのだ。\n\n## 今日の試合で見るなら\n日本ハムの**西川遥輝**は通算350盗塁まであと5だ。今日、出塁したら一塁上の動きを見てほしい。==投手が投げる前の数秒から、盗塁の勝負は始まっている==のだ。"}, "2-11": {"meta": {"id": "2-11", "title": "盗塁ってなに？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "episode": "v2", "children": ["2-11-a", "2-11-b"], "related": ["2-08", "1-06"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html", "https://ja.wikipedia.org/wiki/福本豊", "https://ja.wikipedia.org/wiki/クイックモーション", "https://en.wikipedia.org/wiki/Rickey_Henderson"]}, "body": "## ひとことで\n盗塁は、走者が打球を待たずに次の塁を狙って進むプレーだ。成功すればヒットがなくても塁を一つ進めるが、失敗するとアウトになるのだ。\n\n## しくみ\n代表的なのは、一塁走者が投手の投球動作に合わせて走り出し、二塁を狙う形だ。捕手は投球を受けると二塁へ送り、走者がタッチされる前に塁へ着けば成功になる。\n\nだから盗塁は、単純な足の速さだけの勝負ではない。投手がいつ本塁へ投げるかを読むこと、よいスタートを切ること、捕手の送球より先に着くことが必要なのだ。\n\n失敗すれば走者が一人減るので、いつでも走ればいいわけではない。アウト数、点差、打者、相手投手や捕手を見ながら、成功しやすい場面を選ぶ。\n\nまた、走者が進んでも必ず盗塁になるわけではない。守備側が進塁を止める動きをほとんど見せない場合などは、公式記録で盗塁が付かないことがあるのだ。\n\n## おもしろエピソード\n盗塁は「塁を盗む」と書く。この言葉を、本当にやってしまった選手がいるのだ。\n\nメジャーリーグで通算**1406盗塁**という、今も破られていない記録を持つ**リッキー・ヘンダーソン**だ。1991年、彼は三塁への盗塁で歴代最多記録を塗り替えた。すると、その場で三塁ベースを地面から**引っこ抜き**、両手で頭の上に高く掲げてみせたのだ。\n\n==盗んだ塁を、文字どおり持ち上げてしまった==わけだ。ちなみにベースは、差し込み式で地面に留めてあるので、力を入れれば抜けるのだ。\n\nもう一つ。走者が一塁にいると、投手は足をあまり上げずに素早く投げる（**クイックモーション**）。この投げ方は、1970年代に阪急ブレーブス（今のオリックス）の**福本豊**という、とにかく盗塁ばかり決める選手を止めるために広まったと言われている。1人の足の速い選手が、世の中の投手全員の投げ方を変えてしまったのだ。\n\n## 今日の試合で見るなら\n予想スタメンの1番・水野達稀は今季15盗塁。まず初回、水野が出塁したら、打者だけでなく一塁走者にも注目してほしい。==そのときジャクソンが足を上げずに素早く投げていたら、それがクイックモーション==なのだ。\n\n日本ハムの**西川遥輝**は、9月27日終了時点で通算345盗塁。現役選手では最多で、==通算350盗塁まであと5==だ。途中出場して塁に出た場面は見逃せない。投手が本塁を向いている間に、西川のリード（塁から離れて取る準備距離）が少しずつ変わるところから、盗塁の駆け引きは始まっているのだ。"}, "2-12-a": {"meta": {"id": "2-12-a", "title": "犠牲フライって？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-12", "1-09"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n犠牲フライ（外野フライのアウトと引き換えに走者を生還させる打撃）は、ノーアウトかワンナウトで走者が得点したときに記録されるのだ。\n\n## しくみ\nたとえばワンナウト三塁。打者が外野へ深いフライを打ち、外野手が捕ると打者はアウトになる。\n\n三塁走者は捕球後に三塁からスタートし、本塁へ帰れば1点だ。これが典型的な犠牲フライで、打者には打点（ヒットなどで走者を帰した数）が付き、打率の計算に使う打数には数えない。\n\nツーアウトでは、フライを捕られた時点で3アウトなので犠牲フライにはならない。アウト数を見る理由がここにあるのだ。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎の打席で、ノーアウトかワンナウト三塁になったら外野の位置も見るといい。深いフライが上がったら、捕球だけで終わりではなく、三塁走者のスタートと本塁への返球までが一つの勝負なのだ。\n\n右翼（ライト）に万波中正や藤原恭大が入れば、本塁へ投げる場面にも注目できる。"}, "2-12-b": {"meta": {"id": "2-12-b", "title": "ツーアウトからは全力で走るって本当？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-12", "1-09"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n本当だ。ツーアウトでは次のアウトで攻撃が終わるので、走者は打球が飛んだら先の塁を狙って強くスタートするのが基本なのだ。\n\n## しくみ\nフライなら、捕られた時点で3アウトになる。走者が元の塁で待っていても攻撃は終わるので、捕られなかった場合に備えて早く走るほうが得になる。\n\nゴロでも同じで、守備がアウトを取る前に少しでも先へ進みたい。ただし「何でも走れば点になる」わけではない。\n\n三つ目のアウトがフォースアウト（進塁義務のある走者を塁でアウトにすること）なら、その前に別の走者が本塁を踏んでも得点にならない場合がある。速さだけでなく、どこで3アウト目が成立したかも大事なのだ。\n\n## 今日の試合で見るなら\nツーアウトで髙部瑛斗や矢澤宏太が塁にいたら、打球が飛んだ瞬間のスタートを見るといい。外野の前に落ちる打球なら、一つ先ではなく一気に本塁まで狙う場面もあり得る。"}, "2-12-c": {"meta": {"id": "2-12-c", "title": "ツーアウト満塁が盛り上がるのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-12", "1-09", "2-14"], "sources": ["https://npb.jp/news/detail/20180920_03.html", "https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ツーアウト満塁（2人アウトで、一・二・三塁すべてに走者がいる状態）**は、==次のプレーで0点のまま攻撃終了にも、一気に複数点にもなりうる==。結果の振れ幅が大きいから、緊張感が高いのだ。\n\n## しくみ\nツーアウトでは、守備があと1つアウトを取ればその回は終わる。一方で満塁なら、安打が出れば複数の走者が帰る可能性があり、ホームランなら**4点**入る。==攻撃側は大得点、守備側は無失点終了が、同じ1球の先にある==わけだ。\n\nさらに満塁では、**四球（ボール4つで一塁へ進むこと）**や死球（投球が体に当たること）でも、三塁走者が押し出されて1点入る。逆に内野ゴロなら、走者が次の塁へ進まなければならない**フォースプレー（塁を踏めばアウトにできるプレー）**で3つ目のアウトを狙える。==打球だけでなく、投手がストライクを取れるかまで重要になる==のだ。\n\n## 今日の試合で見るなら\nたとえば日本ハムの**清宮幸太郎**がツーアウト満塁で打席に入った場面だ。==安打なら走者が一気に動き、四球でも1点、アウトならその回は終了==。スコアボードの「2 OUT」と満塁の表示を一緒に見ると、なぜ球場が注目する場面なのか分かりやすいのだ。"}, "2-12": {"meta": {"id": "2-12", "title": "ワンナウト、ツーアウトのちがいは？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-12-a", "2-12-b"], "related": ["1-08", "2-10"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nアウトは3つで攻守交代になる。だから同じ「走者三塁」でも、ノーアウト、ワンナウト、ツーアウトでは攻撃の選び方がかなり変わるのだ。\n\n## しくみ\nノーアウトなら、まだ3つのアウトを使える。打者がアウトになっても走者を進めれば、次の打者で点を取る余地が残る。\n\nワンナウトなら、残りは2つだ。三塁に走者がいると、外野フライを打って捕られても、走者が本塁へ帰れば犠牲フライ（アウトと引き換えに点を取るフライ）になることがある。\n\nツーアウトでは次のアウトで攻撃終了だ。フライを捕られればその瞬間に終わるので、犠牲フライは成立しない。逆に走者は、打球が抜けたときに少しでも先へ行けるよう、打った瞬間から強く走る意味が大きくなる。\n\n守る側も考え方が変わる。ワンナウト一塁なら併殺（一度に2つアウトを取ること）で一気にチェンジ（攻守交代）を狙えるが、ツーアウトならまず一つアウトを取れば十分なのだ。\n\n## おもしろエピソード\nスコアボードの「OUT」は、ただ残り時間を示す数字ではない。攻撃側が「アウト一つと引き換えに進塁や得点を狙えるか」を決める、作戦の残り回数に近いものなのだ。\n\n## 今日の試合で見るなら\n予想打順では、ロッテの山口航輝は2番、日本ハムの清宮幸太郎は3番に入る見込みだ。どちらも走者を置いて打席が回る可能性が高い。\n\nワンナウト三塁なら、強い打球だけでなく外野への深いフライも得点につながる。一方、ツーアウトで髙部瑛斗や水野達稀が塁にいたら、打球と同時にどこまで走るかを見ると、アウト数の意味がよく見えるのだ。"}, "2-13-a": {"meta": {"id": "2-13-a", "title": "打者有利・投手有利のカウントって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-13", "1-07-b"], "sources": ["https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/43745159.html"]}, "body": "## ひとことで\n一般に、ボールが先行すると打者有利、ストライクが先行すると投手有利なのだ。次の失敗で四球になるのか、三振になるのかで、余裕のある側が変わる。\n\n## しくみ\n3ボール1ストライクなら、投手はあと1球ボールを投げると四球（ボール4つで一塁へ進むこと）になる。打者は甘い球を待ちやすいので、打者有利と考えやすい。\n\n反対に0ボール2ストライクなら、打者は次のストライクで三振だ。投手はストライクゾーンぎりぎりや、そこから外れる変化球も使いやすい。\n\nただし有利不利は目安だ。強打者なら投手が慎重になるし、走者や点差でも配球（どの球をどこへ投げるかの組み立て）は変わる。\n\n## 今日の試合で見るなら\nジャクソンが山口航輝に3ボール1ストライクとしたら、山口が「打てる球だけ」に絞る場面になりやすい。逆に福島蓮が0ボール2ストライクまで追い込んだら、次にどこへ外してくるかを見ると、投手有利の意味が見えやすいのだ。"}, "2-13-b": {"meta": {"id": "2-13-b", "title": "エンドランって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-13", "2-11"], "sources": ["https://npb.jp/news/detail/20181023_02.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\nエンドラン（ヒットエンドラン）は、投手が投げるのに合わせて走者が次の塁へ走り、打者もその球を打ちにいく作戦だ。走るだけの盗塁とは違い、打者と走者がセットで動く。\n\n## しくみ\n一塁走者が先に走ると、一・二塁間を守る野手が動きやすい。そこへ打球を転がせれば、走者が一気に三塁まで進めることもある。\n\nただし打者は、普段なら見送るような球でも打たなければならない場合がある。空振りすれば走者は盗塁と同じ形になり、フライを捕られると戻れず併殺（一度に2つアウト）になる危険もあるのだ。\n\n## 今日の試合で見るなら\n日本ハムの1番・水野達稀が一塁に出て、2番・田宮裕涼の打席で水野が投球と同時に走ったら注目だ。田宮まで強く振りにいけば、単独の盗塁ではなくエンドランの可能性が見えてくる。"}, "2-13-c": {"meta": {"id": "2-13-c", "title": "ファウルで粘るってどういうこと？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-13", "2-19"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n**ファウル（打球が一・三塁線の外側などへ出ること）**で粘るとは、2ストライク後に難しい球をファウルにして打席を続けることだ。==普通のファウルなら、2ストライクから三振にはならない==のだ。\n\n## しくみ\n追い込まれた打者は、見逃せばストライクになりそうな球を簡単には捨てられない。強く前へ飛ばせなくても、バットに当ててファウルにできれば次の球へ進める。\n\nその間に投手は投球数が増え、打者は球筋を見る機会も増える。ただし、**バント（バットを振らずに当てる打ち方）**を2ストライク後にファウルすると三振になる。==「何でもファウルなら続く」わけではない==のだ。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**や日本ハム先発の**福島蓮**が2ストライクまで追い込んだあとに注目だ。打者が難しい球を何球もファウルにしたら、==三振を避けながら次の甘い球を待っている==と考えると分かりやすいのだ。"}, "2-13": {"meta": {"id": "2-13", "title": "ストライクやボールの数で何が変わるの？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-13-a", "2-13-b"], "related": ["1-07", "2-14"], "sources": ["https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\nカウント（その打席のボールとストライクの数）が変わると、打者と投手が「次の1球で何を避けたいか」が変わるのだ。3ボールなら投手は四球を避けたくなり、2ストライクなら打者は三振を避けたくなる。\n\n## しくみ\n打者は4ボールで四球（一塁へ進めること）、3ストライクで三振になる。だから同じ1球でも、0ボール0ストライクと3ボール2ストライクでは重みが違うのだ。\n\nたとえば3ボール0ストライクなら、投手は次をボールにすると四球になる。打者は無理に振らず、甘い球だけ待つこともできる。逆に0ボール2ストライクなら、打者は次のストライクで三振になるので、きわどい球にも手を出さなければならなくなる。\n\nただし「このカウントなら必ず直球」のような決まりはない。捕手と投手は、打者の得意不得意、走者、点差まで合わせて球種とコースを考える。カウントは、作戦の選択肢がどちらに多いかを見るための信号だと思えばよい。\n\n## おもしろエピソード\n投手が2ストライクまで追い込んだあと、すぐ勝負せずボール球を混ぜることがある。打者が三振を避けて振りやすくなるので、ストライクから外れる変化球で空振りを狙えるからだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは今季、四球が55ある。日本ハム打線が3ボールまで粘れた打席では、次の1球が甘くなるか、それでも厳しいコースを突くかを見ると面白い。\n\n反対に日本ハム先発の福島蓮が0ボール2ストライクまで先に追い込んだら、ロッテの山口航輝らがどこまできわどい球を見送れるかに注目だ。"}, "2-14-a": {"meta": {"id": "2-14-a", "title": "わざと歩かせる申告敬遠って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-14", "2-14-b"], "sources": ["https://npb.jp/news/detail/20180205_02.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n申告敬遠は、守備側の監督が「この打者を四球にする」と球審（捕手の後ろに立つ審判）へ伝え、投手が4球投げなくても打者を一塁へ進ませる方法だ。強打者との勝負を避けたい場面で使われる。\n\n## しくみ\nNPBでは2018年から、故意四球（わざと与える四球）を申告で成立させられる。打席の途中から申告することもでき、従来どおり実際に球を投げて敬遠する方法も残っている。\n\n一塁が空いていれば、その塁を使って強打者を避け、次の打者と勝負する狙いがある。ただし走者を1人増やすので、次の打者に打たれれば失点が大きくなる。\n\n## 今日の試合で見るなら\n終盤にロッテの山口航輝や日本ハムの清宮幸太郎が、二塁または三塁に走者を置いて打席へ入った場面に注目だ。一塁が空いていれば、相手ベンチが申告敬遠を選ぶ可能性がある。"}, "2-14-b": {"meta": {"id": "2-14-b", "title": "押し出しって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-14", "1-06-b"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/91895138.html"]}, "body": "## ひとことで\n押し出しは、満塁で四球や死球などによって打者が一塁へ進み、三塁走者が押し出されるように本塁へ進んで1点入ることだ。打球が飛ばなくても得点になる。\n\n## しくみ\n満塁では一塁、二塁、三塁が全部埋まっている。打者に一塁が与えられると、一塁走者は二塁へ、二塁走者は三塁へ、三塁走者は本塁へ進まなければならない。\n\n次の塁へ進む義務があるこの状態を、フォース（押し出されて進む状態）という。死球でも、四球と同じように1点が入る。\n\n## 今日の試合で見るなら\nジャクソンが満塁で3ボールまで来たら、次の1球はそのまま1点につながりうる。反対に福島蓮が満塁で山口航輝と勝負する場面でも同じだ。満塁では「ボール球を見送ること」自体が得点になる場合があるのだ。"}, "2-14-c": {"meta": {"id": "2-14-c", "title": "死球（デッドボール）のあと何が起きる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-14", "1-06"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/81685155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**死球（デッドボール：投球が打者の体などに当たり、一塁が与えられること）**が認められると、プレーはいったん止まり、打者は一塁へ進む。==走者がいる場合は、押し出される走者だけが必要な分だけ進む==のだ。\n\n## しくみ\nたとえば一塁に走者がいれば、打者が一塁へ行くため、その走者は二塁へ進む。満塁なら全員が押し出され、三塁走者が本塁へ進んで1点になる。\n\n一方、二塁だけに走者がいるなら、その走者は自動では三塁へ進まない。==「死球なら全員が一つ進む」ではない==のだ。\n\n強く当たったときは、トレーナーなどが状態を確認するため試合が止まることもある。\n\n## 今日の試合で見るなら\n日本ハム先発の**福島蓮**の球がロッテ打者の体に当たる場面があれば、球審の合図と走者の動きを見てほしい。==打者が一塁へ行ったあと、どの走者が進むのか==を見るとルールがすぐ分かるのだ。"}, "2-14": {"meta": {"id": "2-14", "title": "四球（フォアボール）・死球（デッドボール）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-14-a", "2-14-b"], "related": ["1-07", "2-13"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/21625150.html"]}, "body": "## ひとことで\n四球（フォアボール）はボールが4つになって一塁へ進むこと、死球（デッドボール）は投球が打者の体などに当たり、規則上認められて一塁へ進むことだ。どちらもヒットを打たなくても走者になれる。\n\n## しくみ\n四球は、投手がストライクゾーン（ストライクになる範囲）を外す「ボール」を4つ重ねると成立する。打者は一塁まで安全に進めるので、出塁という意味ではヒットと同じく攻撃のきっかけになるのだ。\n\n死球は、投球が打者の体や着衣に当たったときに宣告される。ただし、ストライクの球に当たった場合など、単に体に触れれば必ず死球になるわけではない。\n\n四球も死球も、公式記録では通常の「打数」（打率の計算に使う打席の数）には入らない。だから打率を下げずに出塁できる。一方、投手側から見ると、安打を打たれていなくても走者を増やしてしまう点が重い。\n\n## おもしろエピソード\n死球のときに審判が両手を上げてプレーを止めるのは、ボールデッド（いったんプレーが止まる状態）になるからだ。「デッドボール」という呼び名は、日本では死球そのものを指す言葉として定着している。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは今季55四球。日本ハム打線がボール球を見極めて四球を選べるかは、走者をためるうえで大事だ。\n\nロッテの西川史礁は今季11死球。内角（打者の体に近い側）の球が体の近くへ来たとき、避けたのか、当たったのか、その後に球審が一塁を示すかを見ると死球の仕組みがわかりやすい。"}, "2-15-a": {"meta": {"id": "2-15-a", "title": "送りバントとスクイズの違いは？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-15", "1-09"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/63165150.html"]}, "body": "## ひとことで\n送りバントは走者を次の塁へ進めるためのバント、スクイズは三塁走者を本塁へ返して1点を取るためのバントだ。どちらも強打より「進塁」を優先する。\n\n## しくみ\n無死（ノーアウト）一塁から一塁走者を二塁へ進めるのが、典型的な送りバントだ。打者自身はアウトになっても、次の打者がヒット1本で得点しやすい形を作る。\n\nスクイズは三塁に走者がいる場面で使う。打者がバントし、その間に三塁走者が本塁を狙うので、成功すれば安打なしでも1点を取りにいける。\n\nただし空振りや小フライになれば、三塁走者までアウトになる危険がある。守備側も三塁走者の動きを強く警戒する作戦なのだ。\n\n## 今日の試合で見るなら\n接戦の終盤、日本ハムが三塁に走者を置き、山縣秀のようにバントを使える打者が打席なら注目だ。バットを寝かせ、三塁走者も投球に合わせて動けば、スクイズの可能性が見えてくる。"}, "2-15-b": {"meta": {"id": "2-15-b", "title": "バントの構えから打つ「バスター」って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-15", "2-05"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/63165150.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**バスター**は、最初はバントの構えを見せ、投球に合わせて普通の打撃へ切り替える作戦だ。==守備が「バントだ」と前へ動いたところを逆に打つ==狙いがあるのだ。\n\n## しくみ\n走者がいると守備側は、送りバントを警戒して一塁手や三塁手が前進することがある。そこで打者がバントの構えをやめて振れば、野手が動いて空いた場所へ打球が飛ぶ可能性がある。\n\nただし構えを変えてから打つので、普通に最初から振るより準備時間は短い。==相手を驚かせる代わりに、自分の打撃も難しくなる作戦==なのだ。\n\n## 今日の試合で見るなら\n日本ハムの**山縣秀**は今季、送りバントを使う場面がある選手だ。走者がいるときに一度バントの構えを見せ、その後バットを引いて振ったら、==守備の前進を利用するバスターかどうか==を見てみるといいのだ。"}, "2-15-c": {"meta": {"id": "2-15-c", "title": "セーフティバントって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-15", "2-02"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**セーフティバント（自分も一塁でセーフになることを狙うバント）**は、送りバントと違い、打者自身が走者になるのが目的だ。==弱い打球をわざと転がし、守備が一塁へ投げる時間を足りなくする==のだ。\n\n## しくみ\n成功には、打球を投手・一塁手・三塁手の取りにくい場所へ転がす技術と、一塁まで走り切る速さが必要になる。強く転がしすぎれば普通のゴロになり、弱すぎれば捕手にすぐ拾われる。\n\n守備位置が深いときほど、前へ出て捕ってから送球する距離が増える。==打球の強さと置き場所を細かく調整する作戦==なのだ。\n\n## 今日の試合で見るなら\nロッテの**髙部瑛斗**が打席で急にバントの構えを見せたら、一塁までの競争にも注目してほしい。==走者を送るのではなく自分が生きようとしているなら、セーフティバント==と考えればよいのだ。"}, "2-15": {"meta": {"id": "2-15", "title": "バントって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-15-a"], "related": ["2-10", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/63165150.html"]}, "body": "## ひとことで\nバントは、バットを大きく振らず、ボールに当てて近くへ転がす打ち方だ。自分がヒットになることより、走者を次の塁へ進める目的で使われることが多い。\n\n## しくみ\n普通の打撃は強く遠くへ飛ばすことを狙う。バントでは、バットを構えて球の勢いを弱め、投手や一塁手、三塁手の前へ転がす。\n\n代表的なのが犠牲バント（自分のアウトと引き換えに走者を進めるバント）だ。無死（ノーアウト）一塁なら、打者が一塁でアウトになる間に走者を二塁へ進め、1死（ワンアウト）二塁にするのが典型になる。\n\n成功すれば得点圏（二塁・三塁）へ走者を送りやすいが、アウトを1つ渡す作戦でもある。点差、回、次の打者の強さによって、使う価値は変わるのだ。\n\nまた2ストライク後のバントがファウルになると、通常のファウルと違って三振になる。追い込まれてからのバントは、それだけ失敗の重みが大きい。\n\n## おもしろエピソード\n公式記録では、走者を進める目的のバントが条件を満たすと犠打として記録され、打数には入らない。つまり「自分の打率を下げずに、アウト1つで仲間を進めた」と記録される場合がある。\n\n## 今日の試合で見るなら\n日本ハムの山縣秀は今季5犠打。終盤、山縣の前に走者がいて接戦なら、構えを変えてバントするかに注目だ。\n\n一方、ロッテの山口航輝のような長打力のある打者では、同じ無死一塁でも強く打たせる選択が十分ある。誰が打席にいるかで作戦が変わるのが、バントを見る面白さなのだ。"}, "2-16-a": {"meta": {"id": "2-16-a", "title": "なぜパ・リーグだけ？（セ・リーグも導入予定）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-16"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html", "https://npb.jp/news/detail/20260925_02.html"]}, "body": "## ひとことで\n2026年までは、パ・リーグがDH制（投手の代わりに打つ専門の打者を置く制度）、セ・リーグが投手も打席に立つ9人制なのだ。だがセ・リーグは2027年シーズンからDH制を採用すると正式決定している。\n\n## しくみ\nNPBによると、パ・リーグは1975年にDH制を採用した。一方のセ・リーグは、野球発祥から続く9人野球の伝統や、パ・リーグとは違う野球の価値を重視して、長く9人制を続けてきた。\n\nそのセ・リーグも2025年8月、2027年からのDH制採用を決定した。公式説明では、高校・大学でDH導入が進んだことや、国際的な流れ、セ・パのルール統一などが背景として挙げられている。2026年は導入準備のための猶予期間という位置づけだ。\n\n## 今日の試合で見るなら\n今日はロッテも日本ハムもパ・リーグなので、両チームがDHを使える。予想スタメンではロッテが山口航輝、日本ハムが清宮幸太郎をDHに置く。2026年のパ・リーグでは見慣れた形だが、来季からはセ・リーグの公式戦でも同じ仕組みが基本になるのだ。"}, "2-16-b": {"meta": {"id": "2-16-b", "title": "指名打者はどんな選手がなる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-16", "4-02"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n**指名打者（DH：投手の代わりに打つ打者）**には、打撃を特に生かしたい選手が入ることが多い。==守備に就かなくても、その打力を打線へ置ける==のがDHの強みなのだ。\n\n## しくみ\n長打を期待される選手だけがDHになるわけではない。守備の負担を減らしたい日や、複数の守備位置を回す都合でDHに入ることもある。\n\nつまりDHは「守れない人の席」ではない。==その日の9人の守備と打順を組み合わせた結果、打撃を優先する場所==と考えるとよいのだ。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの**山口航輝**、日本ハムの**清宮幸太郎**がDHに入る想定だ。2人の名前が打順表にあって守備位置に見当たらなければ、==攻撃に専念するDHとして出ている==と分かるのだ。"}, "2-16-c": {"meta": {"id": "2-16-c", "title": "投手が打席に立たないと何が変わる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-16", "2-09"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nDH制では、投手の打順を別の打者が担当する。だから==投手交代を「次の打席が来るから」という理由で考えなくてよくなり、投球と打撃の判断を分けやすい==のだ。\n\n## しくみ\nDHがない試合では、好投している投手でも次の攻撃で得点を狙うため代打を送る選択がある。DH制なら投手のところに代打を出す必要がなく、投手は守備だけに集中できる。\n\n打線側も、投手の代わりに専門の打者を一人置ける。==9人すべての打順で打撃を期待できる形にしやすい==というわけだ。\n\n## 今日の試合で見るなら\n予告先発はロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**だ。パ・リーグのDH制を使う今日の試合では、2人が打席へ向かわなくても不思議ではない。==投手の名前は守備側の「投」にだけ出る==ところをスタメン表で確認すると分かりやすいのだ。"}, "2-16": {"meta": {"id": "2-16", "title": "指名打者（DH）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-16-a"], "related": ["2-07", "4-02"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n指名打者（DH：投手の代わりに打つ専門の打者）は、守備では投手が投げ、攻撃では別の打者がその打順に入る制度だ。投手が打席に立たなくてもよくなる。\n\n## しくみ\n野球は基本的に、守備につく9人が攻撃でも打席に入る。ただしDH制では例外があり、投手の代わりに1人の打者を打線へ置ける。\n\nたとえば先発投手が9番目の打者になる代わりに、長打力のある野手をDHとして使える。その選手は打席には立つが、DHとして出ている間は守備位置を持たない。\n\nこの制度の大きな意味は、投手が投球に集中でき、打線には打撃を期待できる選手を1人多く置けることだ。ベンチは「守備には出さないが、打撃を生かしたい選手」を起用しやすくなる。\n\nDHは「代打」とは違う。代打は途中で別の打者に交代する方法だが、DHは試合開始時から打順の一つとして置ける制度なのだ。\n\n## おもしろエピソード\nパ・リーグでは1975年からDH制が使われてきた。長くセ・リーグとの大きなルール差だったが、セ・リーグも2027年シーズンからDH制を採用することが正式決定している。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの山口航輝が2番DH、日本ハムの清宮幸太郎が3番DHだ。2人とも長打力を期待される打者で、山口は32本塁打、清宮は23本塁打を記録している。\n\n守備の回に2人の姿がグラウンドになくても、交代したわけではない。攻撃になるとまた打順どおりに打席へ来る。そこがDHを見分けるいちばん簡単なポイントだ。"}, "2-17-a": {"meta": {"id": "2-17-a", "title": "一度交代した選手は戻れる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-17"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\nNPBでは、一度ほかの選手と交代して試合から退いた選手は、その試合には戻れないのだ。\n\n## しくみ\nたとえば山口航輝に代走（走る役だけの交代選手）を送れば、山口はそこで試合から退く。後で「やはり山口に打たせたい」と思っても、もう打席へは戻せない。\n\nだから代打や代走は、強いカードを使う代わりに元の選手を手放す決断でもある。終盤に使われることが多いのは、この制約があるからなのだ。\n\n## 今日の試合で見るなら\nロッテが終盤に一塁走者の山口航輝へ池田来翔を代走で送ったら、その後の山口の打席はもうない。試合が延長（9回で決着しないときに続ける回）になりそうな場面なら、サブロー監督がいつ交代を切るかも見どころになるのだ。"}, "2-17-b": {"meta": {"id": "2-17-b", "title": "代走に出る選手はどんな人？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-17", "2-11"], "sources": ["https://npb.jp/bis/players/21225133.html", "https://npb.jp/scores/2026/0927/m-f-23/roster.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**代走（塁にいる走者と交代して走る選手）**には、足の速さだけでなく、スタートや次の塁へ進む判断がうまい選手が選ばれる。==「一つ先へ進める確率を上げたい」ときの交代==なのだ。\n\n## しくみ\n代走は盗塁だけを狙う役ではない。外野へのヒットで一塁から三塁へ行く、浅いフライでタッチアップする、といった走塁でも差が出る。\n\nまた交代後は元の選手に戻せないので、そのまま守備に入れるかも重要だ。==速さと、その後の守備まで含めて選ばれる==というわけだ。\n\n## 今日の試合で見るなら\n日本ハムの**西川遥輝**は通算350盗塁まであと5だ。今日、途中出場で走者になったら、==打者より先に一塁上の西川を見る==と代走や盗塁の狙いが見えやすい。9月27日の同カードでは西川もベンチ入りしていたのだ。"}, "2-17-c": {"meta": {"id": "2-17-c", "title": "ベンチ入りは何人まで？", "category": "2", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["2-17", "4-02"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/roster.html", "https://npb.jp/announcement/2026/", "https://npb.jp/farmchamp/2026/information.html"]}, "body": "## ひとことで\n9月27日の同カードでは、NPB公式の**ベンチ入り選手**はロッテ、日本ハムとも**26人**だった。==ただし、2026年の一軍レギュラーシーズンで「最大26人」と明記した公開規定は今回確認できていない==のだ。\n\n<!-- TODO: 2026年一軍レギュラーシーズンのベンチ入り選手上限が26人であることを、NPB公式の当該年度規定で確認 -->\n\n## しくみ\n**出場選手登録（一軍で試合に出られる選手の登録）**と、その日のベンチ入りは同じものではない。チームは登録選手の中から、その試合で使う投手、捕手、野手をベンチに入れる。\n\n2026年ファーム日本選手権の開催要項では、ベンチ入り選手は26名と公式に明記されている。一方、今日の一軍公式戦については、==前日の実際の名簿が26人ずつだったことまでは確認済み==という状態だ。\n\n## 今日の試合で見るなら\n今日のベンチ入り一覧がNPB公式で出たら、先発の**福島蓮**や**アンドレ・ジャクソン**以外に、代打・代走・救援で誰が待機しているかを見るとよい。==終盤の交代策は、ベンチに残っている選手の顔ぶれで選択肢が変わる==のだ。"}, "2-17": {"meta": {"id": "2-17", "title": "代打・代走・守備固めって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-17-a"], "related": ["2-09", "2-05"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n代打（ピンチヒッター：打つ人の交代）、代走（ピンチランナー：走る人の交代）、守備固め（守備の得意な選手への交代）は、終盤の勝負を動かす交代策なのだ。\n\n## しくみ\n代打は、その打席だけ別の打者に任せたいときに使う。長打がほしい、右投手に左打者を当てたい、といった理由で選ばれることが多い。代打が打席に入ると、元の選手は試合から退くことになる。\n\n代走は、塁に出た走者を足の速い選手へ替える作戦だ。一つ先の塁へ進める確率を上げたい終盤で使われやすい。盗塁だけでなく、外野への安打で一塁から三塁へ進むような走塁も狙いなのだ。\n\n守備固めは、リードしている終盤に守備力を上げる交代だ。たとえば打撃型の選手を下げて、守備範囲の広い外野手や内野手を入れる。1点を取りにいく交代と、1点を守る交代は、目的が正反対というわけだ。\n\n交代はベンチの人数を使う。だから監督は、今の1点に加えて、延長（9回で決着しないときに続ける回）まで続く可能性も考える。早く切り札を使いすぎると、後で必要な場面に残っていないこともあるのだ。\n\n## おもしろエピソード\n同じ選手が、代走で出たあと守備に就くこともある。交代は一つの役割だけで終わらず、その後の守備位置まで含めて組み立てられているのだ。\n\n## 今日の試合で見るなら\nロッテは終盤の代打候補にソトや上田希由翔、代走候補に池田来翔がいる。接戦の7回以降、スタメンの打順で代打が告げられたら、「ここで1点を取りにいく」と考えると流れが見えやすい。\n\n反対にロッテがリードしていれば、松川虎生が捕手に入り、佐藤都志也が別の守備位置へ回るような動きにも注目だ。スコアだけでなく、誰がベンチから出てくるかを見ると、監督の狙いが読めるのだ。"}, "2-18-a": {"meta": {"id": "2-18-a", "title": "何人いて、誰が何を見てる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-18"], "sources": ["https://npb.jp/umpires/", "https://npb.jp/umpires/2026/roster_umpire.html"]}, "body": "## ひとことで\nNPBの公式戦では、基本は球審と一塁・二塁・三塁の塁審（塁の近くで判定する審判）を合わせた4人で判定するのだ。\n\n## しくみ\n球審は本塁の後ろに立ち、投球のストライク・ボール、本塁でのセーフ・アウトなどを見る。三つの塁審は担当する塁の判定に加え、打球がフェアかファウルか、外野への大きな打球なども分担する。\n\n「一塁審は一塁だけ」というわけではない。打球と走者に合わせて位置を変え、別の審判と角度を分けて見るのだ。\n\n## 今日の試合で見るなら\n藤原恭大や万波中正のように足や肩が目立つ選手のプレーでは、一塁や三塁で際どい判定が出やすい。打球だけでなく、塁審がどこまで移動して判定しているかを見ると、仕事の分担が分かりやすいのだ。"}, "2-18-b": {"meta": {"id": "2-18-b", "title": "ボークって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-18", "2-11-a"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\nボークは、走者がいるときに投手がしてはいけない投球動作をした反則だ。原則として走者には一つ先の塁が与えられる。\n\n## しくみ\n投手は投球動作を始めたら、途中で不自然に止めたり、投げるふりから急に別の動作へ変えたりできない。走者をだます動きに制限を設け、スタートの条件を公平にするためなのだ。\n\n2026年の規則改正でも、投球に関連する動作を始めて両手を体の前で合わせた後は、投球以外へ変更できないことが明確にされた。違反すればボークになる。\n\n## 今日の試合で見るなら\n日本ハムに走者が出たとき、ロッテ先発のアンドレ・ジャクソンは打者だけでなく走者も警戒する。セットポジション（走者がいるときによく使う構え）からの動きが急に止まり、審判が両手を広げて試合を止めたら、ボークの可能性があるのだ。"}, "2-18-c": {"meta": {"id": "2-18-c", "title": "審判のジェスチャーの意味は？（アウト・セーフ・ファウル）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-08", "2-19"], "sources": ["https://npb.jp/news/detail/20260409_01.html", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n\n審判は声だけでなく、腕や手の形でも判定を伝える。==**アウトは右手を握って上げる、セーフは両腕を横へ広げる、ファウルは両腕を上げる**==、と覚えると見やすいのだ。\n\n## しくみ\n\n**アウト**では、審判が右手を握り、はっきり上げて判定を示す。**セーフ**では両腕を左右へ広げる。遠い席でも、声より先に腕の動きが見えることがあるのだ。\n\n**ファウル（打球が規定の範囲の外へ出たこと）**では、両腕を上げてプレーを止める合図をする。==打球そのものを追うだけでなく、打球の近くにいる審判を見ると結果が早く分かる==というわけだ。\n\nNPBは2026年、初心者向けに審判の基本動作を紹介する公式動画も公開している。判定の形を一度映像で見ておくと、球場ではかなり読みやすくなる。\n\n## 今日の試合で見るなら\n\n**山口航輝**が内野ゴロを打って一塁へ走る場面が来たら、一塁手だけでなく一塁塁審も見るといい。==送球と走者がほぼ同時なら、塁審の「アウト／セーフ」の腕が答えになる==のだ。\n\n**福島蓮**が投げた球を打者が三塁線や一塁線へ打ったときは、近くの審判のファウル合図も探してみよう。"}, "2-18-d": {"meta": {"id": "2-18-d", "title": "審判に抗議するとどうなる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-18-c", "2-03-c"], "sources": ["https://npb.jp/npb/2019rules.html", "https://npb.jp/npb/2026rules.html", "https://content.mlb.com/documents/2/2/4/305750224/2019_Official_Baseball_Rules_FINAL_.pdf"]}, "body": "## ひとことで\n\n審判の**アウト・セーフなどの判断そのもの**は、基本的にその場の最終判断だ。==監督が出てきても、「強く言えば判定が変わる」という仕組みではない==のだ。\n\n## しくみ\n\n野球では、フェアかファウルか、セーフかアウトかなど、審判の判断で決める判定がある。公認野球規則では、こうした判断は最終的なものとされ、選手や監督が異議を述べ続けることは認められていない。\n\n一方で、**ルールの適用を間違えていないか**を確認するため、監督が審判に説明を求める場面はある。判定への質問と、ルールの適用確認は別物なのだ。\n\n審判には試合の秩序を保つ権限があり、判定への執拗な抗議や侮辱的な言動などには**退場**を命じることができる。==監督がベンチを出たら、まず「何の説明を求めているのか」を見ると分かりやすい==。\n\n## 今日の試合で見るなら\n\nたとえば**清宮幸太郎**が一塁で際どい判定になり、監督が審判のところへ出てきたら、その時点で「判定が覆る」とは限らない。==落ち着いて話しているなら、判定やルールの確認をしている可能性がある==のだ。\n\n試合が再開したら、最終的に審判が示した判定を基準に次のプレーを見ればいい。"}, "2-18": {"meta": {"id": "2-18", "title": "審判って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-18-a", "2-18-b"], "related": ["2-03-c", "1-08"], "sources": ["https://npb.jp/umpires/", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n審判は、ストライクやアウトだけでなく、走塁、フェアかファウルか、反則まで見て試合を進める人たちなのだ。\n\n## しくみ\nいちばん目につくのは、本塁の後ろにいる球審（きゅうしん：ホーム付近を担当する審判）だ。投球がストライクかボールか、打者が振ったか、ホームで走者がセーフかアウトかなどを判定する。\n\nほかの審判は一塁、二塁、三塁の近くで、走者が先に塁へ着いたか、野手がタッチしたか、打球がフェアかファウルかを分担して見る。打球や走者の位置に合わせて大きく移動するので、審判もかなり走っているのだ。\n\n判定には、人がその場で決めるものと、映像で確認できるものがある。NPBでは監督がリクエスト（映像による判定確認）を求められる場面もあるが、すべての判定が映像確認の対象ではない。\n\n審判はルール違反も見る。投手のボーク（走者がいるときの不正な投球動作）や、危険なプレーなどを見つければ、試合を止めて処置するのだ。\n\n## おもしろエピソード\n審判は同じ場所に立ち続けるわけではない。外野へ大きな打球が飛べば、より見やすい角度へ動く。テレビでは映りにくいが、球場では審判の移動もよく見えるのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは落差の大きいチェンジアップ（直球に近い腕の振りで遅く落ちる球）を使う。低い球がストライクかボールか際どい場面では、まず球審の右手や声を見ると判定が分かる。\n\n清宮幸太郎の通算100本塁打がかかる大飛球がポール（フェアとファウルの境目に立つ柱）際へ飛んだら、塁審の判定にも注目だ。ホームランかファウルかで試合の意味が大きく変わる場面なのだ。"}, "2-19-a": {"meta": {"id": "2-19-a", "title": "ファウルとフェアの境目は？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-19", "2-03"], "sources": ["https://npb.jp/npb/2013rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ファウルライン（本塁から一塁・三塁へ伸びる境界線）**の内側がフェア地域、外側がファウル地域だ。==線そのものと一塁・三塁のベースはフェア側に入る==。\n\n## しくみ\nいちばん分かりやすいのは、外野へ飛んだ打球だ。ポール（外野の境界に立つ柱）の内側ならフェア、外側ならファウルになる。\n\nやや難しいのは内野のゴロだ。本塁と一塁・三塁の間では、打球がいったんファウル側へ転がっても、ベースを過ぎる前にフェア側へ戻ればフェアになることがある。\n\n反対に、一塁や三塁を越えるゴロは、==ベースを通過するときにフェア地域かファウル地域か==が大きな基準になる。見た目だけで即断しにくいので、審判のジェスチャーを見るのが確実なのだ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**山口航輝**の強い打球が一塁線、三塁線ぎりぎりへ飛んだら注目だ。長打になりそうでも、ほんの少し外ならファウルになる。\n\n==「白線に触れたらファウル」ではなく、「白線はフェア」==と覚えておくと、球場で迷いにくいのだ。"}, "2-19-b": {"meta": {"id": "2-19-b", "title": "ファウルは何回でも打てるの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-19", "2-13-c"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20260213_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n普通のファウルなら、**2ストライクの後は何回続いてもそれだけでは三振にならない**。==ファウルを打てる回数そのものに上限はない==のだ。\n\n## しくみ\n0ストライクや1ストライクでファウルを打つと、ストライクが1つ増える。しかし2ストライクになった後は、普通のファウルを打ってもカウントは2ストライクのまま続く。\n\nそのため打者は、すぐヒットにできない難しい球をファウルにして打席を続けることがある。これを**粘る（アウトにならず投手に次の球を投げさせ続けること）**という。\n\nただし、==2ストライク後のバントがファウルになると打者はアウト==だ。また、ファウル方向の飛球を野手が地面に落ちる前に捕れば、通常のフライと同じくアウトになる。\n\n## 今日の試合で見るなら\n**福島蓮**が**山口航輝**を2ストライクに追い込んでも、そこですぐ勝負が終わるとは限らない。山口がファウルを重ねれば、福島は何球も追加で投げることになる。\n\n==スコアが動かないファウルでも、投手の球数と打者の情報は増えていく==。2ストライク後は、その小さな攻防を見るとおもしろいのだ。"}, "2-19-c": {"meta": {"id": "2-19-c", "title": "ファウルチップって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-19", "1-08-a"], "sources": ["https://npb.jp/npb/2021rules.html", "https://npb.jp/npb/2021rules.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ファウルチップ**は、バットにかすった球が鋭く直接捕手へ飛び、地面に落ちる前に正規に捕られたものだ。==普通のファウルと違ってストライクになり、プレーも止まらない==。\n\n## しくみ\n名前に「ファウル」と付くので紛らわしいが、普通のファウルボールとは扱いが違う。ファウルチップは**ボールインプレイ（プレーが続いている状態）**なので、塁上の走者も状況に応じて動ける。\n\n2ストライクからファウルチップになれば第3ストライクなので、打者は三振になる。2021年の規則改正では、チップした球が最初に捕手の身体や用具に触れ、はね返っても地面に落ちる前に捕球すればストライクになることが明記された。\n\n==「後ろへ飛んだ＝全部ファウルで試合停止」ではない==のだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**の投球に**清宮幸太郎**のバットがわずかに触れ、その球を捕手がすぐ捕った場面では、審判のストライク判定に注目だ。\n\n特に2ストライクなら、その一球で三振になる。==観客席からは小さな接触が見えにくいので、捕手の捕球と球審の合図をセットで見る==と分かりやすいのだ。"}, "2-19": {"meta": {"id": "2-19", "title": "ファウルって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["2-19-a", "2-19-b", "2-19-c"], "related": ["1-07", "2-13-c"], "sources": ["https://npb.jp/npb/2013rules.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/npb/2021rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ファウルボール（打球がフェア地域の外と判定されたもの）**は、基本的にプレーをいったん止め、打者のストライクを1つ増やす打球なのだ。==ただし2ストライクの後は、普通のファウルを打ってもそれだけでは三振にならない==。\n\n## しくみ\n本塁から一塁、三塁へ伸びる2本の線を**ファウルライン（フェアとファウルの境目）**という。線そのものはフェア地域に含まれるので、線上に落ちたり止まったりした打球はフェアだ。\n\nファウルかどうかは「最初に落ちた場所だけ」で決まるわけではない。本塁と一塁・三塁の間では、地面を転がる球がフェア側へ戻ることもある。一塁や三塁を越える打球は、ベースを通過するときの位置などで判定される。\n\nファウルになると、通常はボールデッド（プレーが止まった状態）になる。0ストライクや1ストライクならストライクが1つ増えるが、2ストライク後の普通のファウルではカウントは2ストライクのままだ。\n\nただし例外もある。**2ストライク後のバントがファウル**になると打者はアウトになる。また、捕手が直接捕る**ファウルチップ**は普通のファウルと扱いが違い、ストライクでプレーも続く。\n\n## おもしろエピソード\n2ストライク後のファウルは、打者にとって「もう1球投げさせる」手段になる。投手の難しい球を何度もファウルにできれば、球数が増え、次の球種を見極める材料も増えるのだ。\n\n==同じ「バットに当たって後ろへ飛んだ球」でも、普通のファウルとファウルチップでは試合の動きが違う==。初心者が混乱しやすいところだが、ここを見分けられると打席がかなり読みやすくなる。\n\n## 今日の試合で見るなら\n日本ハム先発の**福島蓮**がロッテの**山口航輝**を2ストライクまで追い込んだ場面に注目するといい。山口が難しい球をファウルにすれば、三振にはならず打席が続く。\n\n逆にロッテ先発の**アンドレ・ジャクソン**に対し、通算100本塁打まであと1本の**清宮幸太郎**が何球もファウルで粘れば、それはただの失敗ではない。==「打てる球が来るまで打席をつないでいる」と見れば、ファウルも立派な攻防なのだ==。"}, "2-23-a": {"meta": {"id": "2-23-a", "title": "なぜランナーは挟まれる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-23", "2-11-a"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n走者が挟まれるのは、**次の塁へ進む判断**と**元の塁へ戻る判断**の間で、守備に先回りされるからだ。==けん制や打球への反応で、一歩出すぎた瞬間に起こりやすい。==\n\n## しくみ\n代表的なのは**けん制球（投手が走者をアウトにするため塁へ投げる球）**だ。走者が盗塁を狙って大きくリードし、投手の送球より先に元の塁へ戻れないと、次の塁へ逃げるしかなくなる。\n\n打球の判断でも起きる。前へ進めると思って走り出したあと、野手が素早くボールを処理すると、戻る道にも進む道にも野手が待つ形になる。==「足が遅いから挟まれる」とは限らず、判断と守備のタイミングの問題なのだ。==\n\n## 今日の試合で見るなら\n日本ハムの**西川遥輝**が一塁に出たら、ロッテ投手がどれくらい走者を気にするか見てみよう。西川がスタートしかけたところへけん制が来れば、==一塁へ戻るか二塁へ進むかの一瞬の判断==が挟殺につながることがあるのだ。"}, "2-23": {"meta": {"id": "2-23", "title": "挟殺（ランダウン）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-23-a"], "related": ["1-08-c", "2-11"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**挟殺（ランダウン：走者を2つの塁の間にはさんでアウトにする守備）**は、走者が前にも後ろにも進みにくくなったときに起きる。==野手がボールを投げ合い、走者との距離を少しずつ縮めてタッチを狙うプレーなのだ。==\n\n## しくみ\nたとえば一塁と二塁の間で走者が止まったとする。ボールを持った一塁側の野手が近づけば、走者は二塁へ逃げる。その先にいる野手へ送球すれば、今度は二塁側から追える。\n\nこれを必要なだけ繰り返し、最後は**タッチ（ボールを持ったグラブなどで走者に触れること）**してアウトにする。==走者は「はさまれた瞬間」にアウトなのではない。==どちらかの塁へ先に戻れれば、セーフになる余地があるのだ。\n\n守る側にも難しさがある。遠くから何度も投げるほど、悪送球や取りこぼしの危険が増える。そこで、ボールを持った野手がまず走者へ近づき、逃げる方向を絞ってから短く送るのが基本になる。\n\n走者側は、ただ逃げ回るだけではない。味方の別の走者が進む時間を作るため、あえて粘る場面もある。==1人の走者と2人以上の野手が動くので、ボールだけでなく前後の塁も見ると状況が分かりやすい==というわけだ。\n\n## 今日の試合で見るなら\n日本ハムの**西川遥輝**が一塁走者になった場面を想像すると分かりやすい。盗塁を警戒したロッテ投手のけん制で西川が大きく飛び出し、二塁へ向かうか一塁へ戻るか迷えば、挟殺が始まる可能性がある。\n\n==野手が走者へ近づいてから送球しているか==を見てみよう。最後のタッチだけでなく、どちらの塁へ追い込もうとしているかを見ると、数秒のプレーにも守備の狙いが見えてくるのだ。"}, "3-01-a": {"meta": {"id": "3-01-a", "title": "「狙い球」って？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-01", "3-03-a"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\n狙い球とは、「この種類やこの場所の球が来たら強く振る」と、打つ条件を先に決めておくことだ。\n\n## しくみ\n狙いを絞る条件は、「直球だけ」のような球種に限らない。「真ん中寄りだけ」「高めだけ」のように場所まで絞ることもある。\n\n条件に合わない球は、ストライクでも見送ることがある。逆に狙い通りなら、初球でも迷わず振れる。狙いを作る目的は、反応する選択肢を減らすことなのだ。\n\n観客には作戦そのものは聞こえないので、1球だけで断定はできない。何を振り、何を見送ったかを何球か続けて見ると分かりやすい。\n\n## 今日の試合で見るなら\n山口航輝は32本塁打で、長打（二塁打以上の当たり）が期待される打者だ。福島蓮との最初の対戦で、どの高さの球に強く反応するかを見ておくといい。\n\n次の打席で似た場所の球への反応が変われば、「さっきの打席の情報を使っているのかも」と考えながら観戦できるというわけだ。"}, "3-01-b": {"meta": {"id": "3-01-b", "title": "追い込まれたら何を変える？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-01", "1-07"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n2ストライクまで追い込まれる（あと1つで三振の状態になる）と、打者は「強く打つ」だけでなく「三振しない」ことも強く意識する。待てる球が少なくなるからだ。\n\n## しくみ\n2ストライクでは、次のストライクを見逃せば三振になる。そこで打者は、少し際どい球まで振る準備をする。\n\n大きく振る代わりに、バットを短く持つ、振りを小さくする、難しい球をファウル（打ち直しになる打球）にする、といった対応もある。ただし、長打を狙う打者が形を大きく変えないこともある。\n\nつまり「追い込まれたら全員同じ」ではない。打者ごとの考え方が出やすい場面なのだ。\n\n## 今日の試合で見るなら\n山口航輝が福島蓮に2ストライクを取られたら、その前後で振り方を比べてみよう。大きなスイングを続けるのか、ファウルで粘るのかで違いが見える。\n\n32本塁打の打者でも、毎打席が長打勝負とは限らない。追い込まれてからの1球は、その打者らしさが出やすいのだ。"}, "3-01-c": {"meta": {"id": "3-01-c", "title": "打席に入る前のルーティンって？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-01", "3-01-a", "3-01-b"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n**ルーティン**とは、打席に入る前や構えるまでに、毎回だいたい同じ順番で行う動作のことだ。==目的は「必ず打てるおまじない」ではなく、次の1球へ入る準備をそろえることなのだ。==\n\n## しくみ\nたとえば、バットを振る、手袋を直す、足場をならす、構える位置を確かめる、といった動きがある。順番を決めておけば、前の打席で凡退しても、目の前の投球へ意識を戻しやすい。\n\nただし、==同じ選手でも状況によって動作の長さや順番が変わることはある==。外から見える動きだけで、選手の心理まで決めつけることはできないのだ。\n\n## 今日の試合で見るなら\n**山口航輝**や**清宮幸太郎**が打席へ向かうとき、ネクストバッターズサークルから構えるまでを続けて見てみよう。==「毎回くり返す動き」と「その打席だけの動き」を分けて見ると、待ち時間までプレーの一部に見えてくるのだ。=="}, "3-01": {"meta": {"id": "3-01", "title": "バッターは何を考えてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-01-a", "3-01-b"], "related": ["3-03", "1-07"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\nバッターは、来る球を全部当てようとしているわけではない。カウントや投手の様子から、打ちたい球を少しずつ絞っているのだ。\n\n## しくみ\n投手の球は速さも曲がり方も場所も違う。全部に同じように反応すると、判断が遅れやすい。そこで打者は、打席に入る前から「どの球なら強く振るか」を決めておく。\n\n材料になるのは、ボール・ストライクの数、前の打席で見た球、走者、アウトの数などだ。たとえば0ストライクなら、甘い球（真ん中寄りの打ちやすい球）だけを待てる。2ストライクになると、見逃せる範囲が狭くなるので考え方も変わる。\n\nただし、これは「次は絶対この球」と当てるゲームではない。候補を減らし、来た球に反応しやすくする作業なのだ。じゃんけんで相手の癖を見ても、必ず当たるわけではないのと同じだ。\n\n観客から正確な狙いは分からない。ただし、初球を迷わず振った、外の球を続けて見送った、2ストライク後にファウルが増えた、といった動きから判断の変化は見える。\n\n## 今日の試合で見るなら\nロッテの山口航輝は今季32本塁打。日本ハム先発の福島蓮は75回1/3を投げて78三振を奪っている。\n\n山口の第1打席では、初球から振るのか、まず何球か見るのかに注目するといい。2打席目以降に同じ球へ反応が変われば、打者が情報を使っている様子が見えやすいのだ。"}, "3-02-a": {"meta": {"id": "3-02-a", "title": "リードってどれくらい取る？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-02"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\nリード（投球前に塁から離れて取る距離）に、全員共通の正解はない。次の塁へ近づきつつ、牽制（けんせい：投手が塁へ送球して走者をアウトにしようとすること）されたら戻れる範囲を探すのだ。\n\n## しくみ\n距離は、走者の足、投手の牽制の速さ、アウトの数、盗塁（投球中に次の塁を狙うこと）を狙うかどうかで変わる。大きく離れれば次の塁は近くなるが、元の塁へ戻る時間は増える。\n\nだから走者は、投手がセット（投げる前に体を止める動作）に入った後も足の位置を細かく直す。投手もそれを見て牽制を入れる。リードは、走者と投手が無言で距離を探り合う場面なのだ。\n\n## 今日の試合で見るなら\n藤原恭大が一塁に出たら、ベースではなく足元を見るといい。今季12盗塁の走者が、福島蓮の動きを見ながらどこまで離れるかが見える。\n\n牽制が1球入った後に距離が変わるかも注目だ。投球が始まる前から、すでに小さな駆け引きが始まっているのだ。"}, "3-02-b": {"meta": {"id": "3-02-b", "title": "打球を見て走るか止まるか、どう決める？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-02", "3-07-a"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/npb/2019rules.html"]}, "body": "## ひとことで\n走者は、打球の高さ・速さ・方向とアウトの数を見て、「進む」「止まる」「戻る」をすぐに選んでいる。\n\n## しくみ\nゴロ（地面を転がる打球）なら次の塁へ進みやすい場面がある。一方、フライ（高く上がった打球）は捕られる可能性があるため、走者は元の塁へ戻れる位置を残しておく必要がある。\n\nフライが捕られた後に進むなら、元の塁へ正しく触れ直してから走る。これがタッチアップ（捕球後に元の塁から次の塁へ進む走塁）だ。\n\n外野への打球では、自分で全部を見続けるとは限らない。三塁へ向かう走者は、三塁コーチ（三塁のそばで走者に指示を出す人）の止まれ・回れの合図も材料にするのだ。\n\n## 今日の試合で見るなら\n藤原恭大や水野達稀が一塁にいる場面で、外野へ打球が飛んだら走者を見るといい。打球を確認してから加速するのか、いったん止まるのかに判断が出る。\n\n二塁を回った後は三塁コーチにも注目だ。走者だけを見るより、「誰の情報を使って走っているか」まで見えるようになるのだ。"}, "3-02-c": {"meta": {"id": "3-02-c", "title": "盗塁のスタートはどこを見て切る？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-02", "3-02-a", "3-03-c"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n盗塁では、走者は主に**投手の動き**を見てスタートを決める。==「投げる」と判断できる最初の変化を見つけ、捕手へ球が届く前から走り始めるのだ。==\n\n## しくみ\n投手には、打者へ投げる動きと**牽制（けんせい：走者を元の塁へ戻そうとする送球）**がある。走者は足だけを見るのではなく、肩や腰、間の取り方などを含め、投球と牽制を見分ける手がかりを探す。\n\nただし、==「ここだけ見れば必ず成功」という一点はない==。投手ごとに動きが違い、走者側も相手を研究しているからだ。早く飛び出しすぎれば牽制でアウトになり、遅ければ二塁で刺されやすくなる。\n\n## 今日の試合で見るなら\n**藤原恭大**が一塁に出て走りそうな場面では、藤原だけでなく**福島蓮**も同時に見よう。==福島が動き始めた瞬間と、藤原の最初の一歩のどちらが先に見えるか==に注目すると、盗塁が反射ではなく読み合いだと分かるのだ。"}, "3-02": {"meta": {"id": "3-02", "title": "ランナーは何を考えてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-02-a", "3-02-b"], "related": ["1-06", "3-07-a"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\nランナーは、ただ次の塁へ全力で走ればいいわけではない。「進めるか」と「戻れるか」を同時に考えているのだ。\n\n## しくみ\n塁に出た走者は、投球前から準備を始める。アウトの数、次の打者、守っている野手の位置、投手の動きなどを見て、どこまで先を狙えるかを決める。\n\n投球の瞬間には、盗塁（投球中に次の塁を狙うこと）の可能性もある。一方で、投手が塁へ送球する牽制（けんせい：走者をアウトにしようとする送球）にも備えなければならない。前へ出すぎれば戻れず、慎重すぎれば次の塁が遠くなる。\n\n打球が飛んだ後は、判断がさらに増える。ゴロかフライか、野手がすぐ取れそうか、自分より前の走者がどう動いたかを見て、走るか止まるかを決める。三塁へ近づけば、三塁コーチ（三塁のそばで走者に指示を出す人）の合図も判断材料になる。\n\nだから走塁は、足の速さだけの勝負ではない。信号を見ながら横断歩道を渡るように、「今なら行ける」を短い時間で判断する技術なのだ。\n\n## 今日の試合で見るなら\nロッテの藤原恭大は今季12盗塁、日本ハムの水野達稀は15盗塁を記録している。どちらかが一塁に出たら、投球前にどれくらい塁から離れるかを見てみよう。\n\n打球が外野へ飛んだとき、いったん止まるのか、一気に次の塁を狙うのかにも注目だ。ボールだけでなく走者を見ると、試合の速さが急に分かりやすくなるのだ。"}, "3-03-a": {"meta": {"id": "3-03-a", "title": "配球って？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-03", "3-01-a"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\n配球とは、どんな球を、どの場所へ、どんな順番で投げるかを組み立てることだ。1球ではなく、前後のつながりで打者を打ち取りにいく。\n\n## しくみ\n速い球の後に遅い球を投げれば、打者は同じタイミングで振りにくい。内側を意識させた後に外側を使うように、場所を変える考え方もある。\n\nただし、毎回きれいな順番になるわけではない。投手が思った所へ投げられなかったり、打者が見送ったりすれば、その次の選択も変わる。\n\nだから配球は「決めた台本」より、1球ごとに更新する作戦に近いのだ。\n\n## 今日の試合で見るなら\n日本ハムの清宮幸太郎は今季23本塁打で、通算100本塁打まであと1本。ロッテ先発のジャクソンが清宮の第1打席をどんな順番で攻めるかは見どころになる。\n\n初球と2球目の高さやコースを続けて見るといい。1球ずつ切り離さずに「前の球が次の球にどうつながったか」で見ると、配球が分かりやすくなるのだ。"}, "3-03-b": {"meta": {"id": "3-03-b", "title": "決め球って？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-03", "3-01-b"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\n決め球とは、アウトや空振りを取りたい勝負どころで使う、自信のある球のことだ。同じ投手でも、相手や場面で変わることがある。\n\n## しくみ\n特に2ストライク後は、打者を三振にできる球が注目される。ただし「決め球＝必ず三振を取る球」ではない。弱いゴロやフライを狙って使うこともある。\n\n決め球は、その1球だけを見ても意味がつかみにくい。そこまでの配球（どの球をどこへどの順で投げたかの組み立て）と合わせて見るといい。前の球で速さや場所を意識させるから、最後の1球が効く場合があるのだ。\n\n観客には投手の狙いを断定できない。それでも、同じようなカウントで何度も使われる球があれば、勝負球の傾向は見えてくる。\n\n## 今日の試合で見るなら\nジャクソンは144回で133奪三振、福島蓮は75回1/3で78奪三振。どちらも三振を取れる投手だ。\n\n2ストライクになったら、球速表示だけでなく最後の1球の高さと場所を見よう。同じ終わり方が何度か続けば、「ここで勝負したい」という形が見えてくるのだ。"}, "3-03-c": {"meta": {"id": "3-03-c", "title": "投手がプレートを外すのはなぜ？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-03", "3-02-c"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/today.md"]}, "body": "## ひとことで\n投手が**プレート（投手板：マウンドにある白い板）**から足を外すのは、いったん投球の準備を切り直すためだ。==サイン、走者、間の取り方をもう一度確認したいときに使われるのだ。==\n\n## しくみ\nプレートに触れた投手は、そこから投球や牽制（けんせい：走者を元の塁へ戻そうとする送球）へ入る。足を外せば、その流れをいったん止めて、捕手とのサインを確認し直したり、走者の動きを見直したりできる。\n\nただし、==投球動作を始めてから好きなタイミングで外せるわけではない==。2026年の野球規則でも、投球に関連する動作を始めた後の中断や変更には制約がある。\n\n## 今日の試合で見るなら\n一塁に走者がいるときの**アンドレ・ジャクソン**や**福島蓮**を見よう。==プレートを外した直後に、捕手を見るのか、走者を見るのか、もう一度構え直すのか==を見ると、「投げない時間」にも判断があると分かるのだ。"}, "3-03": {"meta": {"id": "3-03", "title": "ピッチャーは何を考えているの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-03-a", "3-03-b"], "related": ["3-01", "3-03-a", "3-03-b"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\nピッチャーは、毎球「三振を取る」だけを考えているわけではない。打者、カウント、走者を見ながら、次の1球で何を起こしたいかを選んでいるのだ。\n\n## しくみ\n投手の仕事は、打者をアウトにして失点を防ぐことだ。ただし、アウトの取り方は三振だけではない。打ち損じのゴロやフライを打たせても、結果は1アウトになる。\n\nそこで投手は、まずストライクを取りたいのか、空振りを取りたいのか、弱い打球を打たせたいのかを考える。走者がいれば、盗塁や進塁も気になる。ボールが先行すれば、四球（フォアボール：ボールが4つで打者が一塁へ進むこと）を避けるためにストライクを取りに行く必要も出てくる。\n\n打者ごとに同じ投げ方をするわけでもない。長打を警戒する打者、三振がほしい場面、併殺（ゲッツー：一度に2つアウトを取ること）がほしい場面では、狙いが変わる。\n\nそして投手は捕手と一緒に球を選ぶ。観客から会話は聞こえないが、何球目にどこへ投げたかを追うと、「この打者にはこう攻めたい」という流れが少しずつ見えてくるのだ。\n\n## 今日の試合で見るなら\nロッテ先発のジャクソンは144回で133奪三振、55四球。日本ハム先発の福島蓮は75回1/3で78奪三振、24四球だ。\n\n数字だけでも、三振を取れる一方でカウントの作り方が重要な投手だと分かる。2ストライクを取った後にすぐ勝負するのか、1球外す（わざとボール球を投げる）のかを見ると、投手の考え方が追いやすいのだ。"}, "3-04-a": {"meta": {"id": "3-04-a", "title": "打者のどこを見てる？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-04", "3-01"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nキャッチャーは打者の構えだけでなく、前の球への反応を見る。どこを振ったか、どこを見送ったかが、次の1球の材料になるのだ。\n\n## しくみ\n見るのは、立つ位置、バットの出方、タイミングの早い遅いなどだ。内角（打者の体に近い側）の球に体が大きく反応したなら、内角を意識している可能性がある。外の変化球を何度も追いかけるなら、そこをもう一度使う考えも出てくる。\n\nただし「この動きなら必ずこの球」という決まりはない。打者も次の球で考えを変えるので、キャッチャーは毎球、情報を更新しているのだ。\n\n## 今日の試合で見るなら\nロッテの佐藤都志也が清宮幸太郎を迎える場面では、清宮が最初の数球にどう反応するかを見てみよう。日本ハムの田宮裕涼が山口航輝と向き合う場面も同じだ。\n\n長打のある打者ほど、捕手がどこへ構えるかを見るだけで駆け引きが分かりやすいのだ。"}, "3-04-b": {"meta": {"id": "3-04-b", "title": "ミットを構える位置の意味は？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-04", "3-03-a"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n捕手が構える**ミット**は、投手に「このあたりへ投げてほしい」と示す目標になる。==内・外、高・低のどこを狙うかが、観客にも見える手がかりなのだ。==\n\n## しくみ\n打者に近い側へ構えれば内角、遠い側なら外角を狙う目安になる。低く構えれば、低い球を要求している可能性が高い。\n\nただし、==ミットの場所と実際に球が来た場所は同じとは限らない==。投手が狙いから外すこともあるので、「捕手が構えた場所」と「球が着いた場所」を分けて見るのが大切だ。\n\n## 今日の試合で見るなら\nロッテの**佐藤都志也**が清宮幸太郎を受ける場面や、日本ハムで**田宮裕涼**が山口航輝を受ける場面に注目しよう。==長打のある打者に対して、ミットが真ん中からどれだけ離れているか==を見ると、1球ごとの慎重さが分かりやすいのだ。"}, "3-04-c": {"meta": {"id": "3-04-c", "title": "マウンドに行って何を話してる？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-04", "3-03-a", "3-07-c"], "sources": ["https://npb.jp/npb/2019rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n捕手がマウンドへ行くのは、投手と**次の作戦を短く確認する**ためだ。==球種や狙う場所だけでなく、走者や守備の約束をそろえる時間にもなるのだ。==\n\n## しくみ\n実際の会話は客席には聞こえず、毎回同じでもない。サインの確認、次の打者への攻め方、牽制（けんせい：走者を元の塁へ戻そうとする送球）や守備連携など、必要な情報をその場で合わせる。\n\nまた、連打や四球が続いた直後なら、==いったん間を作って次の1球へ切り替える役目==もある。マウンドでの相談には規則上の扱いがあり、好きなだけ長く話せるわけではない。\n\n## 今日の試合で見るなら\n**佐藤都志也**がジャクソンのもとへ行ったり、**田宮裕涼**が福島蓮のもとへ行ったりしたら、その直前の数球を思い出そう。==「なぜ今、話す必要が出たのか」を前の打者や走者までさかのぼって見る==と、相談の意味を考えやすいのだ。"}, "3-04": {"meta": {"id": "3-04", "title": "キャッチャーは何を考えてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-04-a"], "related": ["3-03", "3-02"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nキャッチャーは、球を受ける人であると同時に、守備全体を整理する案内役だ。次の1球をどうするか、走者をどう警戒するかを毎球考えている。\n\n## しくみ\n投手が投げる前、キャッチャーは打者、カウント、走者、アウト数を見る。そこに投手の得意球や、その日の球の調子を重ねて、どこへ何を投げるかを組み立てるのだ。\n\nたとえば同じ打者でも、0ボール2ストライクなら空振りを取りにいける。3ボール1ストライクなら、四球を避けるためストライクを取りやすい球を選ぶことが増える。状況が変われば、同じ相手でも答えは変わるというわけだ。\n\n走者がいると仕事はさらに増える。盗塁の気配を見ながら、二塁や三塁へ送球できる姿勢を作る。打球が転がれば、どの塁でアウトを取るかを内野手へ伝えることもある。\n\nだから観戦するときは、投手だけでなくキャッチャーの動きも見るといい。構えた場所、返球の速さ、内野への声かけには、次のプレーへの準備が表れているのだ。\n\n## 今日の試合で見るなら\nロッテは予想どおりなら佐藤都志也がジャクソンを受ける。力のある直球と落ちるチェンジアップを、どの高さやコースで組み合わせるかを見ると面白い。\n\n日本ハムは田宮裕涼が先発マスク（先発で捕手を務めること）の候補だ。福島蓮は久しぶりの先発になる。序盤からどの球が使えているかを田宮がどう見極めるかに注目すると、バッテリー（投手と捕手の組）の相談が見えてくるのだ。"}, "3-05-a": {"meta": {"id": "3-05-a", "title": "打球の前に何を準備してる？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-05", "2-10"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n内野手は投球前に、アウト数と走者を確認し、「自分に来たらどこへ投げるか」まで決めている。迷う時間を先に使っておくのだ。\n\n## しくみ\n無走者なら、多くのゴロはまず一塁アウトを狙う。一塁に走者がいれば、二塁で先にアウトを取ってから一塁へ送る併殺（ゲッツー：一度に2つアウトを取ること）も考えられる。\n\nバント（軽く当てて走者を進める打ち方）がありそうなら、三塁手や一塁手は前へ出やすくする。盗塁の気配があれば、二塁手（セカンド）と遊撃手（ショート）は、どちらが二塁へ入るかも確認するのだ。\n\n## 今日の試合で見るなら\nロッテ守備で一塁に走者が出たら、小川龍成と山崎剛の立ち位置を見よう。日本ハム守備なら水野達稀や山縣秀も同じだ。投手が投げる直前に一歩動けば、その一歩には次のアウトの設計図が入っている。"}, "3-05-b": {"meta": {"id": "3-05-b", "title": "ショートとセカンドは何を声かけしてる？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-05", "3-02-c", "2-10"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nショート（遊撃手）とセカンド（二塁手）は、打球が来る前から**誰がどこへ入るか**を確認している。==二塁ベースを2人で守るからこそ、先に役割を決めておく必要があるのだ。==\n\n## しくみ\n一塁に走者がいれば、盗塁のときに誰が**ベースカバー（送球を受けるため塁に入ること）**をするかを決める。ゴロなら、どちらが二塁でアウトを取り、どちらが一塁への送球をつなぐかも重要になる。\n\n外野へ打球が飛んだときは、中継に入る位置も変わる。==声や合図は「打ってから相談する」のではなく、打つ前に迷いを減らすためにある==のだ。\n\n## 今日の試合で見るなら\nロッテなら**小川龍成**と**山崎剛**、日本ハムなら予想スタメンの**水野達稀**と**山縣秀**に注目しよう。==一塁に走者がいるとき、投球前に二塁付近で互いを見たり位置を変えたりする瞬間==が見えれば、守備の準備が始まっているのだ。"}, "3-05-c": {"meta": {"id": "3-05-c", "title": "前進守備って？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-05", "3-05-a"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n**前進守備**とは、内野手が普段より本塁側へ前に出て守ることだ。==三塁走者をゴロで本塁へ返したくない場面で、送球までの距離と時間を短くする狙いがあるのだ。==\n\n## しくみ\nたとえば0アウトや1アウトで三塁に走者がいると、内野ゴロの間に1点入ることがある。前へ出ていれば、捕ってから本塁へ投げるまでが短くなり、走者を止めやすくなる。\n\nその代わり、==内野手の横や後ろを抜ける打球には弱くなりやすい==。1点を防ぐために、ヒットになる危険を少し大きくする守り方というわけだ。\n\n## 今日の試合で見るなら\n終盤の接戦で三塁に走者が進んだら、ロッテの**寺地隆成**や**山崎剛**、日本ハムの**有薗直輝**や**水野達稀**の立ち位置を見よう。==いつもより本塁に近ければ、「まずこの1点を止める」という守備の優先順位が形になって見えるのだ。=="}, "3-05": {"meta": {"id": "3-05", "title": "内野は何を考えてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-05-a"], "related": ["3-02", "2-10"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n内野手は、打球が来てから考え始めるのでは遅い。投球前に「どこへ飛びそうか」「来たらどこでアウトを取るか」を決めているのだ。\n\n## しくみ\nまず見るのは、打者の左右、走者、アウト数、得点差だ。右打者と左打者では打球が飛びやすい方向が違うし、一塁走者がいれば二塁でフォースアウト（走者に触らず、先に塁を踏んで取るアウト）を狙える。\n\nさらに、投手がどこへ投げる予定かでも守る位置は少し変わる。外角なら逆方向（右打者なら右側）への打球、内角なら引っ張った打球（右打者なら左側）を想定しやすい。もちろん予想どおりになるとは限らないので、一歩目を出せる姿勢を崩さないことが大切なのだ。\n\n打球が転がった後は、捕る人だけが主役ではない。二塁手や遊撃手はベースカバー（塁に入って送球を受けること）に入り、一塁手は送球を受ける。別の内野手は悪送球に備えて後ろへ回る。4人が同時に次の場所へ動くので、内野守備は小さな交通整理に近い。\n\n## 今日の試合で見るなら\nロッテは小川龍成と山崎剛、日本ハムは水野達稀と山縣秀が二遊間（二塁手と遊撃手）の候補だ。ゴロが飛ぶ前から、走者の有無で立つ場所が変わるかを見てみよう。\n\n一塁に走者がいる場面では、二塁ベースの近くへ寄る動きも見やすい。打球だけを追わず、打つ前の二遊間を見ると準備の意味が分かるのだ。"}, "3-06-a": {"meta": {"id": "3-06-a", "title": "海風の日の外野手は何が大変？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-06", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n風が強い日は、外野フライの「いつもの落下点」がずれる。外野手は打球だけでなく、風向きと高さまで読まなければならないのだ。\n\n## しくみ\n高く上がった打球ほど、空中にいる時間が長い。その間に風を受けるので、最後に横へ流れたり、思ったより伸びたり戻されたりする。\n\nだから外野手は、試合中の旗や体で感じる風、直前までの打球の動きを材料にする。最初から落下点を一点に決めつけず、走りながら細かく修正するのだ。\n\nZOZOマリンは、海側から風が吹くことがある球場だ。球団も、花火の打ち上げ位置を風向きで変えるほど風の影響を確認している。\n\n## 今日の試合で見るなら\n風が強ければ、右翼の藤原恭大と万波中正を見よう。高いフライで2人がいったん走り出したあと、最後の数歩で横へ動くなら、風を読んで落下点を修正している可能性がある。1塁側の席では、その動きが近くで見やすいのだ。"}, "3-06-b": {"meta": {"id": "3-06-b", "title": "打者ごとに外野の守る位置が変わるのはなぜ？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-06", "3-05-c"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n外野手は、打球が飛んでから走るだけではない。==**打者の打ち方を予想して、投球前から数歩ぶん有利な場所へ動く**==のだ。\n\n## しくみ\n守る位置を決める材料は、**右打ち・左打ち**、長打の多さ、打球の傾向、走者、点差などだ。強い打球が奥まで来そうなら深め、前に落ちる一打を防ぎたいなら浅めに構える。\n\n外野は広いので、最初の数歩が遅れるだけで届かないことがある。だから==「打ってから判断」ではなく「打つ前に確率を上げる」==わけだ。ただし予想と逆へ飛べば、そのぶん長く走ることになる。\n\n位置は固定ではない。投手が代わったり、走者が進んだりすれば、同じ打者でも少し変わる。==投球前に外野手が左右や前後へ歩くところも、立派な守備の一部==なのだ。\n\n## 今日の試合で見るなら\nロッテの**藤原恭大**が打席に入ったら、日本ハム右翼の**万波中正**の立ち位置を見よう。藤原は左打ちなので、前の右打者のときから万波が数歩動くことがある。\n\n==打球ではなく、投手が投げる前の万波を見る==と、「守備は打つ前から始まっている」と分かりやすいのだ。"}, "3-06-c": {"meta": {"id": "3-06-c", "title": "外野からの強い返球（レーザービーム）って？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-06", "2-04"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md", "https://www.nikkansports.com/baseball/news/202605200002048.html"]}, "body": "## ひとことで\n**レーザービーム**は、外野から塁やホームへ飛ぶ、速くて低くて正確な返球の呼び名だ。==速さだけでなく「走者より先に、狙った場所へ届くか」が大事==なのだ。\n\n## しくみ\n外野手は捕ってから、足を止めずに投げる方向へ体を運ぶ。大きく山なりに投げるより、==低い軌道で一直線に近く送るほど、到着までの時間を短くできる==。\n\nただし遠い場所からは、**中継（カット：内野手を経由する送球）**を使うこともある。無理に一人で投げて逸らすより、中継した方が速く正確な場合があるからだ。\n\n2026年5月20日には、日本ハムの**万波中正**が右翼から本塁へ返し、満塁の場面で三塁走者をアウトにした。==強肩は「投げる姿」ではなく、走者の判断そのものを変える武器==になるのだ。\n\n## 今日の試合で見るなら\n右翼にはロッテの**藤原恭大**、日本ハムの**万波中正**と、選手カードで強肩が見どころに挙がる2人がいる。外野へ安打が出て走者が二塁や三塁へ向かったら、捕球後の一歩目から見よう。\n\n==返球の高さと、走者が次の塁へ行くか止まるかをセットで見る==と面白いのだ。"}, "3-06": {"meta": {"id": "3-06", "title": "外野は何を考えてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-06-a"], "related": ["3-02", "3-05"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n外野手は「フライを捕る人」だけではない。打球の落下点、次に投げる塁、ほかの野手のカバーまでを同時に考えているのだ。\n\n## しくみ\n外野守備は、まず一歩目が勝負だ。打球が上がってから止まって見ていると、頭上を越される。音、打球の角度、打者の振り方を手がかりに、前か後ろか、右か左かを早く決める。\n\n捕れそうなフライでも、誰が捕るかの判断が必要だ。中堅手（センター）と右翼手（ライト）の間なら、両方が追うことがある。声を出して担当を決めないと、ぶつかったり、互いに譲ったりしてしまう。\n\n安打（ヒット）になった後も仕事は続く。二塁へ投げるのか、本塁へ返すのかを走者の位置で変える。送球する外野手の後ろには、別の野手が悪送球に備えて動く。外野守備は、捕球より先の一手まで含めて完成するのだ。\n\n## 今日の試合で見るなら\n1塁側からは右翼手の動きが見やすい。ロッテは藤原恭大、日本ハムは万波中正が右翼の予想だ。\n\n2人とも肩の強さが見どころに挙がる外野手なので、右前打（ライト前に落ちるヒット）が出たときは、打球だけでなく走者も見よう。走者が二塁や本塁を狙うか、それを見て右翼手がどこへ投げるかまで追う。そうすると、1本の安打の中にある判断が見えてくるのだ。"}, "3-07-a": {"meta": {"id": "3-07-a", "title": "三塁コーチが腕を回すのはなぜ？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-07", "3-02"], "sources": ["https://npb.jp/npb/2026rules.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n三塁コーチが腕を大きく回すのは、「止まらず本塁まで行け」という合図だ。走者の代わりに打球と守備の動きを見て、進むか止まるかを判断しているのだ。\n\n## しくみ\n走者は全力で走りながら、後ろの外野手まで確認するのが難しい。そこで三塁コーチが、打球の速さ、外野手が捕る位置、返球の強さ、走者の位置をまとめて見る。\n\n本塁まで行かせるなら腕を大きく回し、三塁で止めるなら両手を使って分かりやすく制止する。判断は一瞬で行われる。ただし、どれほどきわどくても、コーチが走者の体をつかんで助けてはいけない。2026年の公認野球規則でも、ベースコーチが走者に触れて帰塁や離塁を助ける行為は認められていない。\n\n## 今日の試合で見るなら\n髙部瑛斗や藤原恭大が一塁から長打（二塁打以上の当たり）で走る場面では、三塁コーチを先に見てみよう。腕を回した瞬間、走者は打球を見ずに本塁へ向かうことがある。日本ハムでも同じで、走者とコーチを同時に見ると「行ける」と判断した瞬間が分かるのだ。"}, "3-07-b": {"meta": {"id": "3-07-b", "title": "一塁コーチは何をしてる？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-07", "3-02"], "sources": ["https://npb.jp/npb/2018rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n**一塁コーチ**は、一塁付近から打者走者や一塁走者を助ける案内役だ。==アウトの数や守備の動きを伝え、次のプレーに備えさせる==。\n\n## しくみ\n打者は一塁へ全力で走ると、送球や外野の動きを全部見る余裕がない。そこで一塁コーチが、駆け抜けるのか次の塁を狙うのか、戻るのかを声や身ぶりで知らせる。\n\n一塁に走者が出た後も仕事は続く。投手の動きや守備位置を見ながら、走者へ注意点を伝えるのだ。==走者の視界の外にある情報を補う「もう一組の目」==と考えると分かりやすい。\n\n公認野球規則では、ベースコーチは指示のためコーチスボックスを離れることが認められる一方、プレー中に走者へ触れて助けることはできない。==助けるのは手ではなく、情報なのだ==。\n\n## 今日の試合で見るなら\nロッテの**西川史礁**や日本ハムの**水野達稀**が一塁へ出たら、その選手だけでなく一塁コーチも見よう。投球前に短く話したり、打球後に腕で方向を示したりする。\n\n==一塁上の選手とコーチが同じ方向を見る瞬間==を探すと、何を確認しているか想像しやすいのだ。"}, "3-07-c": {"meta": {"id": "3-07-c", "title": "投手コーチがマウンドに行くのはなぜ？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-07", "3-03"], "sources": ["https://npb.jp/npb/2025rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n投手コーチがマウンドへ行くのは、すぐ交代させるためとは限らない。==**投手を落ち着かせ、次の打者への方針を整理する短い作戦会議**==でもあるのだ。\n\n## しくみ\n連打や四球が続くと、投手は投げ急いだり、同じ失敗を気にしたりしやすい。そこでコーチが間をつくり、捕手も交えて**配球（どの球をどこへ投げるか）**や守備の確認をする。\n\n同時に、腕や足に異変がないかを見る場合もある。ブルペンで次の投手が準備しているなら、==その準備時間を確保する意味を持つこともある==。\n\nNPBでは、投手交代を伴わないマウンド訪問にも回数のルールがある。だから==何度でも気軽に行けるわけではなく、行く場面そのものが判断==なのだ。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**、日本ハム先発の**福島蓮**が走者を続けて出した場面に注目しよう。コーチが出てきたら、まず「交代か」と決めつけず、投手がそのまま残るかを見る。\n\n==訪問後の最初の1球が、いちばん分かりやすい答え合わせ==なのだ。"}, "3-07": {"meta": {"id": "3-07", "title": "コーチは何を考えてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-07-a"], "related": ["3-08", "3-02"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nコーチは、監督の作戦を選手が実行できる形にする人たちだ。試合中は、打者や走者への合図、投手への助言、守備位置の確認などを分担している。\n\n## しくみ\nテレビに映りやすいのは、一塁と三塁のベースコーチだ。走者に止まるか進むかを伝え、打者にはベンチからの作戦を伝える役目もある。\n\nベンチには打撃、投手、守備などを担当するコーチもいる。打者のタイミングがずれていれば修正点を伝え、投手が苦しんでいれば球の状態や相手打線を整理する。監督が全部を一人で見るのではなく、専門ごとの観察を集めて判断するのだ。\n\nコーチは「答えを出す人」というより、選手が迷わないよう情報を減らす人でもある。試合中は考える時間が短いので、「この場面はこれ」と行動を絞ることに価値がある。\n\n## 今日の試合で見るなら\n髙部瑛斗や藤原恭大のような走者が出たら、三塁側のコーチにも目を移そう。コーチは、外野へ打球が飛んだ瞬間から、走者より先に打球と外野手の動きを見ている。\n\n日本ハムでも、万波中正や清宮幸太郎の長打で一塁走者が一気に三塁や本塁を狙う場面があるかもしれない。走者だけでなく、コーチの腕の動きを一緒に見ると、走塁が個人競技ではないことが分かるのだ。"}, "3-08-a": {"meta": {"id": "3-08-a", "title": "投手交代はどう決める？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-08", "3-03"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://www.nikkansports.com/baseball/news/202609220001724.html", "https://news.yahoo.co.jp/articles/5571b262e4b293d9c417be9b77d1f173dd87434d", "https://npb.jp/scores/2026/0922/m-b-24/box.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\n投手交代は「何球投げたら自動で交代」ではない。球数、球の強さ、相手打者、走者、得点差、次に使える投手をまとめて決めるのだ。\n\n## しくみ\n同じ90球でも、楽に投げた90球と、走者を何度も背負った90球では負担が違う。直球の速さが落ちる、制球が乱れる、同じ打者に合い始めるなども交代の材料になる。\n\n監督は今日だけでなく、翌日以降のブルペン（救援投手陣）の状態も考える。先発を早く代えれば安全とは限らず、後ろの投手を使い切る危険もあるのだ。\n\n## 今日の試合で見るなら\nロッテのジャクソンは、家族の出産立ち会いのため一時帰国していた。9月22日に9月4日以来、約3週間ぶりに登板し、5回77球で交代している。今日はそこから中5日（登板の間を5日空けること）での先発なので、前回より長く投げるかも見どころだ。\n\n日本ハムの福島蓮は7月12日以来の先発で、9月は救援（先発の後を受けて投げる役）で投げてきた。新庄監督が何回まで任せ、どの打者を境に継投（投手を交代してつなぐこと）へ入るかを見ると、投手交代が数字だけではないと分かるのだ。"}, "3-08-b": {"meta": {"id": "3-08-b", "title": "ベンチから出すサインって？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "related": ["3-08", "3-07"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nベンチのサインは、「次の1球で何をするか」を選手へ短く伝える合図だ。バント（軽く当てて転がす打ち方）、盗塁、ヒットエンドラン（投球と同時に走者が走り、打者は必ず打ちにいく作戦）など、声に出せない作戦を共有するために使う。\n\n## しくみ\n監督が決めた作戦は、ベースコーチなどを通して打者や走者へ伝わることがある。相手に読まれないよう、腕や体の複数の動きを組み合わせ、本当の合図がどれか分かりにくくする。\n\n観客がサインの中身まで当てる必要はない。投球前に打者や走者がコーチを見る、次の瞬間にバントの構えをする、走者がスタートする。その順番を見ると「何かの指示が出た」と気づけるのだ。\n\n## 今日の試合で見るなら\nロッテでは小川龍成が打席にいて一塁に走者がいる場面、日本ハムでは山縣秀が同じ場面なら、投球前の視線を見てみよう。2人とも小技（バントなどの細かい技術）を使えるタイプだ。\n\nただし、実際のサインの内容はチーム内の情報で、外から断定はできない。作戦が起きた後に「その前に誰を見ていたか」を振り返るくらいが、観戦ではちょうどいいのだ。"}, "3-08-c": {"meta": {"id": "3-08-c", "title": "代打を出すタイミングはどう決める？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-08", "3-09"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md", "https://github.com/BaQaz/guide/blob/main/data/players/managers.md"]}, "body": "## ひとことで\n**代打**は、予定されていた打者の代わりに別の選手を打席へ送ることだ。==監督は「今この1打席を強くする価値」と、その後の守備を天秤にかける==。\n\n## しくみ\n判断材料は、点差、回、走者、アウトの数、相手投手、控え選手の特徴だ。たとえば終盤の得点圏（ヒット1本で点が入りやすい場所）なら、長打や出塁を期待できる打者を切り札にしやすい。\n\nただし交代した選手は、通常はその試合へ戻れない。だから==早く使えば得をするとは限らず、「後で必要になるか」まで考える==のだ。\n\n守備の上手さも関係する。打つだけなら有利でも、その後に守る場所がなくなるなら別の交代も必要になる。==代打は1打席だけで終わらない采配==というわけだ。\n\n## 今日の試合で見るなら\nロッテの**サブロー監督**なら、安田尚憲がスタメン外だった場合、終盤の好機で左の代打として残しておく選択肢がある。日本ハムの**新庄剛志監督**も、田宮裕涼がスタメン外なら打撃を生かす場面を考えられる。\n\n==7回以降にネクストサークルへ誰が出てくるか==を見ると、監督の次の一手を少し早く読めるのだ。"}, "3-08": {"meta": {"id": "3-08", "title": "監督は何をしてるの？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "children": ["3-08-a", "3-08-b"], "related": ["3-07", "3-03"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/games/gm20260928.html", "https://www.nikkansports.com/baseball/news/202609170002074.html", "https://www.nikkansports.com/baseball/news/202609240001679.html", "https://www.nikkei.com/article/DGXZQODH249YM0U6A920C2000000/", "https://github.com/BaQaz/guide/blob/main/data/players/managers.md"]}, "body": "## ひとことで\n監督は、試合中の「誰を、いつ、何のために使うか」を決める責任者だ。先発メンバーだけでなく、代打（打者を途中で入れ替えること）、代走（走者を入れ替えること）、守備交代、投手交代まで全体をつないで考える。\n\n## しくみ\n野球は、一度出した選手を自由に出し入れできる競技ではない。だから監督は、今の1点だけでなく、次の回や終盤まで見て選手を残す必要がある。\n\nたとえば序盤のチャンスで代打を出せば、打てる可能性は上がるかもしれない。一方で、その選手を終盤のもっと大きな場面では使えなくなる。投手交代も同じで、早く代えれば失点を防げるかもしれないが、後ろの投手を多く使うことになる。\n\n監督は一人で全部を見るわけではない。投手コーチや打撃コーチから情報を受け、選手の状態や相手との相性を整理して、最後に方針を決めるのだ。\n\n## 今日の試合で見るなら\nロッテのサブロー監督は就任1年目で、9月も若い選手を積極的に使っている。寺地隆成や井上広大をどこで起用し続けるかは、来季も見据えた采配の一部になる。\n\n日本ハムの新庄剛志監督は、9月24日に来季続投を明言した。チームは9月27日終了時点で3位で、2位西武を追っている。捕手を田宮裕涼と進藤勇也のどちらにするか、一塁を野村佑希と郡司裕也のどちらにするかなど、勝つための組み替えにも注目だ。"}, "3-09-a": {"meta": {"id": "3-09-a", "title": "ベンチ前で素振りしているのは誰？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-09", "3-08-c"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https:/
