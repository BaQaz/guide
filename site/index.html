<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロッテ×日本ハム観戦ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f4f6f6; --ink:#08131a; --sub:#5d6a70; --line:#e2e7e9; --accent:#18917e; --accent-ink:#ffffff;
  --board:#0f1d19; --board-line:#26372f; --board-ink:#e9efe9; --led:#ffd449; --ball:#3fd26a; --strike:#ffd449; --out:#ff5a4f; --lamp-off:#2c3b35;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
header .meta{margin-left:auto;color:var(--sub);font-size:.78rem}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;line-height:1.5;margin:.2em 0 .5em;text-wrap:balance}
h2{font-size:1.2rem;line-height:1.5;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:1.4em 0 .3em}
p{margin:0 0 1.1em}
a{color:var(--accent)}
.lead{color:var(--sub);font-size:.88rem;line-height:1.7}
.eyebrow{font-size:.75rem;color:var(--sub);letter-spacing:.08em;margin:0 0 4px}
.back{display:inline-block;margin-bottom:14px;font-size:.88rem;color:var(--sub);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px}
.section-title{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:30px 0 10px}

/* ガイド切り替え（TOP上部） */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.guide{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);background:var(--bg)}
.guide b{font-size:.98rem;line-height:1.45}
.guide span{font-size:.75rem;color:var(--sub)}
.guide:hover,.q:hover{border-color:var(--accent)}
.guide.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}
.guide.wide span{margin-left:auto}

/* 質問ボタン（横2列） */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.5;font-weight:700}
.q small{font-weight:400;font-size:.72rem;color:var(--sub)}
.q.off{background:var(--surface);color:var(--sub);font-weight:400}
.q .mark{color:var(--accent);font-size:.72rem;font-weight:700}

/* 速報ボード */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.board .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.board .inning{font-family:"Roboto Mono",ui-monospace,monospace;color:var(--led);font-weight:700;font-size:1.05rem}
.board .status{font-size:.78rem;opacity:.8}
.board .upd{margin-left:auto;font-size:.72rem;opacity:.7}
.board a{color:var(--led)}
.ls{overflow-x:auto}
.ls table{border-collapse:collapse;width:100%;font-family:"Roboto Mono",ui-monospace,monospace}
.ls th,.ls td{border-bottom:1px solid var(--board-line);padding:5px 1px;text-align:center;font-size:.9rem}
.ls th{font-weight:500;opacity:.65;font-size:.75rem}
.ls td.team{font-size:.8rem;text-align:left;font-family:"Noto Sans JP",sans-serif;font-weight:700;white-space:nowrap;padding-right:8px}
.ls td.r{color:var(--led);font-weight:700}
.ls td.sum{border-left:1px solid var(--board-line)}
.sit{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lamps{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:.85rem}
.lamps button{all:unset;display:flex;gap:6px;cursor:pointer;padding:2px 0}
.lamps button:focus-visible,.bases button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.lamp{width:15px;height:15px;border-radius:50%;background:var(--lamp-off)}
.lamp.b{background:var(--ball)}.lamp.s{background:var(--strike)}.lamp.o{background:var(--out)}
.bases{position:relative;width:96px;height:78px;justify-self:end}
.bases button{all:unset;position:absolute;width:26px;height:26px;transform:rotate(45deg);border:2px solid var(--board-ink);opacity:.55;cursor:pointer}
.bases button.on{background:var(--led);border-color:var(--led);opacity:1}
.bases .b1{right:6px;top:30px}.bases .b2{left:35px;top:4px}.bases .b3{left:6px;top:30px}
.who{font-size:.82rem;line-height:1.6;opacity:.9;grid-column:1/-1}
.hint{font-size:.72rem;opacity:.65}

/* スタメン */
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-col{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.team-col h4{margin:0;padding:8px 10px;font-size:.85rem;background:var(--surface);display:flex;justify-content:space-between}
.team-col h4 small{font-weight:400;color:var(--sub)}
.team-col ol{list-style:none;margin:0;padding:0}
.team-col li{display:grid;grid-template-columns:1.3em 1.6em 1fr;gap:4px;padding:6px 10px;border-top:1px solid var(--line);font-size:.86rem;line-height:1.5;font-variant-numeric:tabular-nums}
.team-col li .n{color:var(--sub)}
.team-col li .pos{color:var(--sub);font-size:.78rem}
.team-col li a{color:var(--ink);text-decoration:none;font-weight:700}
.team-col li.p{background:var(--surface)}

/* 記事 */
.article h2{margin:2.2em 0 .6em}
.sec-head{display:flex;align-items:flex-start;gap:10px;margin:2.2em 0 .7em}
.sec-head h2{margin:0;flex:1}
.gpt{font:inherit;font-size:.74rem;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:7px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.gpt svg{width:12px;height:12px}
.gpt:hover{color:var(--accent);border-color:var(--accent)}
.gpt.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gpt:focus-visible,.q:focus-visible,.guide:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:.86rem;line-height:1.7;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.article table th,.article table td,.plain th,.plain td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
ul,ol{padding-left:1.3em;margin:0 0 1.1em}
li{margin:.2em 0}
.src{font-size:.78rem;color:var(--sub);word-break:break-all;line-height:1.7}
mark{background:linear-gradient(transparent 55%,#fff176 55%);color:inherit;padding:0 1px}
strong{font-weight:700}
figure{margin:20px 0}figure img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:8px;background:var(--surface)}
figcaption{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:6px}figcaption span{font-size:.72rem}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.btn{font:inherit;font-size:.9rem;border:0;border-radius:999px;padding:9px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin:4px 6px 4px 0}
.btn.sub{background:var(--surface);color:var(--ink)}
@media (max-width:380px){.lineup{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}, {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "check": false}]}, {"id": "1-08", "title": "アウトってどうやって取るの？", "star": true, "check": false, "children": [{"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "check": false}, {"id": "1-08-b", "title": "フライとゴロって？", "check": false}, {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "check": false}]}, {"id": "1-09", "title": "点ってどうやって入るの？", "star": true, "check": false, "children": [{"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "check": false}, {"id": "1-09-b", "title": "打点って？", "check": false}]}]}, {"no": "2", "title": "打つ・投げる・守る（プレーの仕組み）", "items": [{"id": "2-01", "title": "何点入ることが多いの？", "star": false, "check": false, "children": [{"id": "2-01-a", "title": "1点差の試合ってどれくらいある？", "check": false}, {"id": "2-01-b", "title": "大量点が入るのはどんなとき？", "check": false}]}, {"id": "2-02", "title": "Hやヒットって？", "star": true, "check": false, "children": [{"id": "2-02-a", "title": "二塁打・三塁打って？", "check": false}, {"id": "2-02-b", "title": "内野安打って？", "check": false}, {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "check": false}]}, {"id": "2-03", "title": "ホームランって？", "star": true, "check": false, "children": [{"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "check": false}, {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "check": false}, {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "check": false}]}, {"id": "2-04", "title": "エラーって？", "star": false, "check": false, "children": [{"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "check": false}, {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "check": false}]}, {"id": "2-05", "title": "守備って？", "star": false, "check": false, "children": [{"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "check": false}, {"id": "2-05-b", "title": "内野と外野は何が違う？", "check": false}, {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "check": false}, {"id": "2-05-d", "title": "中継プレーって？", "check": false}]}, {"id": "2-06", "title": "ファインプレーって？", "star": false, "check": false, "children": [{"id": "2-06-a", "title": "ゴールデングラブ賞って？", "check": ck": false}, {"id": "7-11-b", "title": "ブルペンやベンチは見える？", "check": false}]}, {"id": "7-12", "title": "帰りの混雑を避けるには？🔍", "star": false, "check": true, "children": []}]}, {"no": "8", "title": "もっと楽しむ（任意）", "items": [{"id": "8-01", "title": "野球をもっと知るには？", "star": false, "check": false, "children": [{"id": "8-01-a", "title": "テレビや配信で観るには？", "check": false}]}, {"id": "8-02", "title": "次はいつ観に行ける？", "star": false, "check": false, "children": [{"id": "8-02-a", "title": "CSや来季のチケットは？🔍", "check": true}]}]}], "articles": {"5-01-a": {"meta": {"id": "5-01-a", "title": "日本ハムは何を懸けてる？（西武との2位争い）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n日本ハムは、西武との2位争いを続けるために勝ちたい試合だ。9月27日終了時点で西武が2位、日本ハムが3位、その差は1.5ゲームになっている。\n\n## しくみ\n日本ハムの残り試合は、今日と10月1日のロッテ戦だけだ。一方、西武は残り4試合ある。日本ハムが2連勝しても、西武が残り4試合で2勝すれば西武が2位になる。日本ハムは勝ち続けたうえで、西武が負けるのを待つ立場なのだ。\n\n2位と3位はどちらもCSに出られる。ただしファーストステージは、2026年も2位球団の本拠地で全試合を行う。さらに勝利数が同じなら2位球団が勝ち上がるので、2位にははっきりした利点があるのだ。\n\n## 今日の試合で見るなら\n日本ハム先発は福島蓮。7月12日以来の先発で、9月は救援7試合を無失点でつないできた。短いイニングで継投するのか、それとも福島を長く引っぱるのか。新庄監督の投手交代も、2位争いを背負った采配として見ると意味が分かりやすい。"}, "5-01-b": {"meta": {"id": "5-01-b", "title": "ロッテにとってはどんな試合？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-02-c", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nロッテは5位で、CS進出の可能性はもうない。それでも、選手の記録と来季につながる競争が残っている試合だ。\n\n## しくみ\nサブロー監督は就任1年目。順位だけを見れば消化試合（順位争いへの影響が小さくなった試合）に近いが、若い選手にとっては来季の役割をつかむ場でもある。\n\n西川史礁は打率3割を狙える位置にいて、山口航輝は32本塁打。先発ジャクソンは9勝で、今日勝てば10勝目だ。チーム順位が決まっても、個人の目標は終わっていないのだ。\n\n## 今日の試合で見るなら\n前日は井上広大が勝ち越し打、寺地隆成が3安打を記録した。今日もこの2人がスタメンなら、結果だけでなく「来季も使いたいと思わせる内容か」という見方ができる。終盤に若手が代打や守備で出てきたら、そこも見逃しにくい場面だ。"}, "5-01-c": {"meta": {"id": "5-01-c", "title": "今日の結果で何が決まりうる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-01-a", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n今日だけで日本ハムの2位が決まるわけではない。ただし日本ハムが負けて、同じ時間に楽天と戦う西武が勝つと、日本ハムの3位が確定する。\n\n## しくみ\n9月27日終了時点で、日本ハムは2位西武と1.5ゲーム差で、残り2試合だ。西武は残り4試合ある。日本ハムが今日負けると、2位の望みは「残り1試合に勝ち、西武が残り4試合すべてに負ける」場合だけになる。\n\n逆に今日勝てば、2位争いは10月1日のロッテ戦まで続く。NPBの2026年CS要項では、ファーストステージの球場はすべて2位球団の専用球場と決まっている。日本ハムのCS出場（3位以内）はすでに決まっているので、今日の1勝はCSの開催地を争う1勝なのだ。\n\n## 今日の試合で見るなら\n日本ハムが終盤でリードしていたら、継投が普段より細かくなる可能性がある。清宮幸太郎や万波中正の一発だけでなく、新庄監督が福島蓮から誰へつなぐかにも注目すると、試合の重さが見えやすい。"}, "5-01": {"meta": {"id": "5-01", "title": "今日はどんな試合なの？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-01-a", "5-01-b", "5-01-c"], "related": ["5-05", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n日本ハムには2位争いがかかった、かなり重い一戦だ。ロッテはCS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）には行けないが、記録や来季につながる見どころが多い。\n\n## しくみ\n9月27日終了時点で、パ・リーグはソフトバンクの優勝が決まっている。2位は西武、3位は日本ハムで、その差は1.5ゲームだ。日本ハムの残りは今日と10月1日のロッテ戦、2試合しかない。\n\nCSのファーストステージは2位と3位が戦う。2026年は全試合を2位球団の本拠地で行うので、2位になる意味は「順位が一つ上」だけではないのだ。ただし西武は残り4試合あり、日本ハムが2連勝しても西武が2勝すれば西武が2位だ。日本ハムは勝ち続けて、西武の負けを待つしかない。\n\n一方のロッテは5位で、CS進出の可能性はない。ただし、先発のジャクソンは勝てば10勝目。山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。勝敗とは別に、個人の節目がいくつも残っている試合なのだ。\n\n## おもしろエピソード\n前日の9月27日は、ロッテが日本ハムに6対1で勝った。日本ハムから見れば、2位争いの最中に連敗は避けたい。ロッテから見れば、順位が決まっていても上位争いの相手に簡単には譲らない、という構図になっている。\n\n## 今日の試合で見るなら\nまず日本ハムの3番候補・清宮幸太郎に注目だ。通算100本塁打まであと1本なので、1打席ごとに球場の空気が変わるかもしれない。\n\nロッテでは先発ジャクソンの10勝目と、山口の33号が分かりやすい見どころだ。試合の勝敗、順位争い、個人記録を同時に追うと、今日がただの「シーズン終盤の1試合」ではないことが見えてくる。"}, "5-02-a": {"meta": {"id": "5-02-a", "title": "球団の歴史は？（名前の変遷）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/corp/history/1955.html", "https://www.marines.co.jp/corp/history/1960.html", "https://www.marines.co.jp/corp/history/1965.html", "https://www.marines.co.jp/corp/history/1990.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\nいまの千葉ロッテは、1950年の「毎日オリオンズ」から続く球団だ。会社や本拠地の変化に合わせて名前を変え、1992年から「千葉ロッテマリーンズ」になった。\n\n## しくみ\n大きな流れはこうだ。毎日オリオンズから、大毎オリオンズ、東京オリオンズ、ロッテオリオンズへと変わり、千葉移転で現在の名前になった。\n\n1969年にロッテとの業務提携で「ロッテオリオンズ」が誕生。1991年に千葉への本拠地移転を決め、公募で「マリーンズ」という名前が選ばれた。1992年が千葉ロッテの最初のシーズンだ。\n\n## 今日の試合で見るなら\nZOZOマリンでロッテを応援していると「最初から千葉の球団」に見えるかもしれない。でも球団史は東京や川崎の時代まで続いている。今日サブロー監督や山口航輝を見るとき、その長い歴史の最新版だと思うと見え方が少し変わる。"}, "5-02-b": {"meta": {"id": "5-02-b", "title": "日本一の年は？（2005年・2010年の下剋上）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-05"], "sources": ["https://npb.jp/nippons/2005/index.html", "https://npb.jp/nippons/2010/", "https://www.marines.co.jp/corp/history/2005.html", "https://www.marines.co.jp/corp/history/2010.html"]}, "body": "## ひとことで\nロッテの日本一は1950年、1974年、2005年、2010年の4回だ。最近の2回は、レギュラーシーズン1位ではない位置から短期決戦を勝ち上がった。\n\n## しくみ\n2005年はレギュラーシーズン2位からプレーオフを勝ち抜き、リーグ優勝。日本シリーズでは阪神に4連勝し、31年ぶりの日本一になった。当時は現在と制度が違うので、今のCSと完全に同じではない。\n\n2010年はレギュラーシーズン3位からCSを突破。日本シリーズでは中日を4勝2敗1分で破り、5年ぶり4度目の日本一になった。3位から日本一まで進んだため、「下剋上」の象徴として語られる年だ。\n\n## 今日の試合で見るなら\n現在のサブロー監督は、2005年の日本一で主力だった選手だ。今日ベンチの監督を見たら、「この人はロッテが日本一になった時代をグラウンドで経験している」と覚えておくと、球団史が急に近くなる。"}, "5-02-c": {"meta": {"id": "5-02-c", "title": "今年のロッテは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01-b", "5-02", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n2026年のロッテは、9月27日終了時点でパ・リーグ5位。CS進出の可能性はなく、サブロー監督の1年目は上位争いに届かなかった。\n\n## しくみ\nチーム打率は.236で、得点を安定して作るのに苦しんだ。一方で山口航輝は32本塁打まで伸ばし、西川史礁も規定打席以上の打率でリーグ上位にいる。順位は低くても、打線の軸になりそうな選手は見えてきているのだ。\n\n終盤は若手や新戦力の評価も重要になる。前日の日本ハム戦では寺地隆成が3安打、井上広大が勝ち越し打を記録し、ロッテが6対1で勝った。\n\n## 今日の試合で見るなら\n山口の一発だけでなく、寺地、井上、西川史礁の打席を続けて見るといい。今日の結果が順位を大きく変えなくても、「来年の打線に誰が残るか」という視点では一打席ずつに意味がある。"}, "5-02-d": {"meta": {"id": "5-02-d", "title": "有名なOBは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1980.html", "https://www.marines.co.jp/corp/history/1985.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\nロッテの昔のスターなら、落合博満、村田兆治、有藤道世を知っておくと話がつながりやすい。打者、投手、生え抜きの象徴という三つの方向から球団史を見られる。\n\n## しくみ\n落合博満はロッテ時代に三冠王（打率・本塁打・打点の3部門すべて1位）を1982年、1985年、1986年の3度獲得した大打者だ。\n\n村田兆治は豪快な「マサカリ投法」で知られ、右肘の手術から復活。1989年に通算200勝を達成した。有藤道世は長くロッテ一筋でプレーし、1985年に2000安打を達成。「ミスター・ロッテ」と呼ばれた存在だ。\n\n## 今日の試合で見るなら\n山口航輝が30本塁打を超えたことで、球団の長打者の歴史がまた話題になっている。今日33号が出たら、昔の落合のような大打者と比べる材料が一つ増える。記録は、昔の選手と今の選手をつなぐ物差しなのだ。"}, "5-02": {"meta": {"id": "5-02", "title": "ロッテってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-02-a", "5-02-b", "5-02-c", "5-02-d"], "related": ["5-01", "5-06", "5-07"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/special/70th/history.html", "https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n千葉ロッテマリーンズは、1950年の毎日オリオンズを出発点に持つパ・リーグの球団だ。1992年から千葉を本拠地にし、いまの「マリーンズ」という名前になった。\n\n## しくみ\n球団の歴史はかなり長い。1950年に毎日オリオンズとして始まり、大毎オリオンズ、東京オリオンズ、ロッテオリオンズと名前を変え、1992年に千葉ロッテマリーンズになった。\n\n日本一は1950年、1974年、2005年、2010年の4回。特に2005年と2010年は、上位チームを短期決戦で倒して頂点まで進んだ年として記憶されている。2010年はレギュラーシーズン3位から日本一になった。\n\n2026年は9月27日終了時点で5位。CSには進めないが、山口航輝の長打力や、西川史礁ら若い打者の成長など、来季につながる材料を探す終盤になっている。\n\n## 歴史・由来\n「マリーンズ」は海に近い千葉を本拠地にすることと相性のよい名前だ。球団は1991年に千葉への移転を決め、公募で「マリーンズ」を採用。1992年から千葉ロッテマリーンズとしてスタートした。\n\n## おもしろエピソード\n1980年代には落合博満がロッテで三冠王を3度獲得した。1989年には村田兆治が通算200勝を達成している。いまのチームだけでなく、個性的な大打者や投手が何人もいた球団なのだ。\n\n## 今日の試合で見るなら\n2番候補の山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。1番候補の西川史礁は打率3割が見える位置だ。\n\nそして監督のサブローも、2005年の日本一メンバーだった。今日のベンチを見ると、球団の過去と現在が同じ場所につながっているのが分かる。"}, "5-03-a": {"meta": {"id": "5-03-a", "title": "東京から北海道へ移ったのはなぜ？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-03-b"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://www.fighters.co.jp/news/detail/00000742.html"]}, "body": "## ひとことで\n東京ドームを本拠地にしていた日本ハムは、2004年に北海道へ移った。大きく言えば、北海道に根を張る「地域密着の球団」へ転換するための移転だった。\n\n## しくみ\n東京時代は、東京ドームを巨人と分け合う形で16年間使っていた。球団は2002年7月、2004年から札幌ドームへ本拠地を移すことを正式決定した。\n\n北海道移転後は「Sports Community（スポーツを通じた地域づくり）」を企業理念に掲げ、北海道各地との活動を広げていった。単に試合をする場所を東京から札幌へ替えただけではなく、球団の土台そのものを北海道につくり直した、と考えるとわかりやすい。\n\n## 歴史・由来\n2004年は新庄剛志が加入した年でもある。移転3年目の2006年にはリーグ優勝、日本一まで進んだ。\n\n## 今日の試合で見るなら\n今日、日本ハムはビジターとしてZOZOマリンに来ている。ユニフォームの胸にある「FIGHTERS」は、22年前に北海道へ移り、地域と一緒に育ってきた球団の名前なのだ。"}, "5-03-b": {"meta": {"id": "5-03-b", "title": "エスコンフィールドって？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/00003788.html", "https://www.fighters.co.jp/news/detail/202500696362.html", "https://npb.jp/games/2026/info_cs.html", "https://prtimes.jp/main/html/rd/p/000000099.000079562.html"]}, "body": "## ひとことで\nエスコンフィールドHOKKAIDOは、2023年3月に北海道北広島市で開業した日本ハムの本拠地だ。開閉式の屋根と天然芝を組み合わせた球場で、約3万5000人を収容する。\n\n## しくみ\n正式には北海道ボールパークFビレッジの中心にある球場だ。大きなガラス壁、開閉式屋根、天然芝が特徴で、球場内には飲食店やホテル、温泉・サウナなどもある。\n\nつまり「野球を見るためだけの建物」というより、一日過ごせる街の中心に球場がある設計なのだ。\n\n## おもしろエピソード\n屋根は巨大な一枚屋根が移動して開閉する。2023年には、屋根を開けた状態で初めて公式戦も行われた。\n\n## 今日の試合で見るなら\n日本ハムが今季2位で終われば、10月10日からのCSファーストステージは2位球団の本拠地で行われる。つまり今日の勝利は、「エスコンでCSを開く」可能性を残すためにも必要なのだ。"}, "5-03-c": {"meta": {"id": "5-03-c", "title": "大谷翔平やダルビッシュがいたって本当？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-03-d"], "sources": ["https://www.fighters.co.jp/news/detail/00003549.html", "https://npb.jp/bis/players/61965110.html", "https://npb.jp/bis/players/01305137.html"]}, "body": "## ひとことで\n本当だ。ダルビッシュ有は2005〜2011年、大谷翔平は2013〜2017年に日本ハムでプレーした。二人とも、北海道移転後のファイターズを代表する選手なのだ。\n\n## しくみ\nダルビッシュは高校から入団し、日本ハムで7年間に93勝。2006年の日本一や2007年のリーグ連覇を支えるエースになった。\n\n大谷は2012年ドラフト1位で入り、2013年から投手と打者の「二刀流」に挑戦した。2016年には投打の両方で活躍し、チームの日本一に貢献している。\n\n二人はその後、米大リーグへ移った。だから日本ハムは、世界で知られる選手が日本で育った球団でもあるわけだ。\n\n## 今日の試合で見るなら\n今日の日本ハム先発は23歳の福島蓮だ。育成ドラフトから支配下を勝ち取った若い右腕で、5勝4敗、防御率3.35。ダルビッシュや大谷とはタイプも歩みも違うが、「若い投手が大舞台を任される」という日本ハムの歴史を思い出して見ると面白い。"}, "5-03-d": {"meta": {"id": "5-03-d", "title": "新庄監督ってどんな人？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/202500780959.html", "https://www.fighters.co.jp/news/detail/202600951850.html", "https://www.nikkansports.com/baseball/news/202609240001679.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n新庄剛志監督は、現役時代にも日本ハムでプレーした元外野手だ。2022年から監督を務め、選手起用や試合前後の発信まで含めて注目を集めるタイプなのだ。\n\n## しくみ\n現役では阪神から米大リーグへ渡り、2004年に日本ハムへ加入した。ちょうど球団が北海道へ移った年で、2006年の日本一を最後に引退している。\n\n監督には2022年に就任した。最初の2年は6位だったが、2024年、2025年は2年連続2位。2026年は9月27日終了時点で3位にいる。\n\n9月24日の本拠地最終戦後には、2027年も続投する意向を明らかにした。来季は監督6年目になる。\n\n## おもしろエピソード\n選手として北海道移転元年に加わり、今は監督としてエスコンフィールドのベンチにいる。日本ハムの北海道時代を、選手と監督の両方で知る人物なのだ。\n\n## 今日の試合で見るなら\n日本ハムが2位へ上がるには、残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日の先発は、9月に救援で7試合無失点だった福島蓮。約2カ月半ぶりの先発をどこまで投げさせ、どの投手につなぐかは、新庄監督の大きな判断になる。"}, "5-03": {"meta": {"id": "5-03", "title": "日本ハムってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-03-a", "5-03-b", "5-03-c", "5-03-d"], "related": ["5-01", "5-05", "5-06"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n北海道日本ハムファイターズは、2004年から北海道を本拠地にするパ・リーグの球団だ。北海道移転後は2006年と2016年に日本一になっている。\n\n## しくみ\nもともとは東京を本拠地にしていたが、2004年から札幌ドームへ移り、現在は北広島市のエスコンフィールドHOKKAIDOが本拠地だ。\n\n球団の特徴を一つに決めるのは難しい。けれど、ダルビッシュ有や大谷翔平のような若い選手が大きく育った歴史があり、今も清宮幸太郎、万波中正、水野達稀らが中心になっている。\n\n2026年は9月27日終了時点でパ・リーグ3位だ。2位の西武とは1.5ゲーム差で、残りはロッテとの2試合だけ。2位で終われば、クライマックスシリーズ（CS：日本シリーズ進出を争う短期決戦）の最初の舞台を自分たちの本拠地で戦える。\n\n## 歴史・由来\n球団は1974年に「日本ハムファイターズ」として発足した。2004年の北海道移転は大きな転換点で、2006年には44年ぶりの日本一を達成した。その後も北海道を代表する球団として歩み、2023年からエスコンフィールドを本拠地にしている。\n\n## おもしろエピソード\n北海道移転元年の2004年には、新庄剛志が選手として加入した。今、その新庄が監督としてベンチにいるのだ。球団の「北海道時代」の始まりと現在が、一人の人物でつながっている。\n\n## 今日の試合で見るなら\n日本ハムは今日を含む残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日負けて西武が勝てば、3位が確定する。予想スタメンでは清宮が3番の指名打者（守備につかず打撃を担当する選手）で、通算100本塁打まであと1本。まずは「日本ハムは順位を上げるために勝ちが必要な側」と覚えておけば、攻撃の一球ごとの重さが見えやすくなる。"}, "5-04-a": {"meta": {"id": "5-04-a", "title": "セ・リーグとの違いは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-04", "5-04-b"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html"]}, "body": "## ひとことで\n2026年の大きな違いは、パ・リーグには指名打者（DH：投手の代わりに打つ専門選手）がいて、セ・リーグでは投手も打席に立つことだ。ただし、この違いは2026年で終わる。\n\n## しくみ\nパ・リーグは1975年からDH制を使っている。投手は基本的に投げることへ集中し、打線には別の打者が1人入る。\n\nセ・リーグは長く「9人野球」を続けてきたが、2027年からDH制を採用すると正式決定した。だから2026年は、セ・リーグの投手が公式戦で普通に打席へ入る最後のシーズンなのだ。\n\n球の数やアウトの取り方など、野球の基本ルールが別物なわけではない。所属する6球団と、DHの扱いが主な違いだ。\n\n## 今日の試合で見るなら\n今日のロッテと日本ハムはどちらもパ・リーグなのでDHを使える。予想ではロッテの山口航輝、日本ハムの清宮幸太郎が指名打者。守備につかず、「打つ仕事」に集中する選手として見ればいい。"}, "5-04-b": {"meta": {"id": "5-04-b", "title": "交流戦って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-04", "5-04-a"], "sources": ["https://npb.jp/interleague/2026/schedule_note_il.html", "https://npb.jp/interleague/2026/"]}, "body": "## ひとことで\n交流戦は、普段は別リーグにいるセ・リーグとパ・リーグの球団が対戦する公式戦だ。2005年に始まり、2026年は各球団18試合を戦った。\n\n## しくみ\n各チームは、別リーグの6球団と3試合ずつ対戦する。合計18試合で、ホーム9試合、ビジター9試合だ。\n\n「特別なイベント試合」ではなく、勝敗はそのままシーズンの成績に入る。交流戦で大きく勝ち越せば、その後のリーグ順位にも効くというわけだ。\n\n2026年の交流戦は5月26日から行われた。\n\n## 歴史・由来\n交流戦が始まる前は、日本シリーズなどを除けば別リーグの球団が公式戦で当たる機会は少なかった。今は毎年、普段見ない組み合わせを楽しめる期間になっている。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは交流戦ではなく、パ・リーグ同士の試合だ。だから日本ハムの勝敗は、目の前の2位争いにそのまま響く。"}, "5-04": {"meta": {"id": "5-04", "title": "ロッテや日ハムがあるパ・リーグって？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "children": ["5-04-a", "5-04-b"], "related": ["5-03", "5-05"], "sources": ["https://npb.jp/news/detail/20260326_02.html", "https://npb.jp/games/2026/", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\nパ・リーグは、日本のプロ野球12球団を二つに分けたうちの一方だ。ロッテ、日本ハム、ソフトバンク、西武、オリックス、楽天の6球団が所属している。\n\n## しくみ\n正式にはパシフィック・リーグという。もう一方がセントラル・リーグ、略してセ・リーグだ。\n\n普段の公式戦では、同じリーグの6球団どうしで多く対戦する。2026年は1球団143試合で、そのうち125試合が同じリーグとの対戦、18試合がセ・パ交流戦（別リーグとの公式戦）だ。\n\nシーズン終了時の順位は、まずリーグ内で決まる。1位がリーグ優勝で、1〜3位がクライマックスシリーズ（CS）へ進む。そこから勝ち上がった1球団が、セ・リーグ側の勝者と日本シリーズで戦う。\n\n## 歴史・由来\nセ・リーグとパ・リーグの2リーグ制は1950年に始まった。長く大きな違いだったのが指名打者（DH：投手の代わりに打つ専門選手）の有無で、パ・リーグは1975年から採用している。\n\n## おもしろエピソード\n2026年は、長く続いた「パはDH、セは投手も打つ」という違いの最後の年だ。セ・リーグも2027年からDH制を採用することが決まっている。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは、同じパ・リーグ同士の公式戦だ。ロッテは5位でCS進出の可能性がなく、日本ハムは3位で2位西武を1.5ゲーム差で追っている。同じ1勝でも、今の両チームでは順位への意味が違うのだ。"}, "5-05-a": {"meta": {"id": "5-05-a", "title": "日本シリーズまでの流れは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-05", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/event/2026/", "https://npb.jp/nippons/2025/information.html"]}, "body": "## ひとことで\n道順は「レギュラーシーズン→CSファースト→CSファイナル→日本シリーズ」だ。セ・リーグとパ・リーグから1球団ずつが勝ち残り、最後に日本一を争う。\n\n## しくみ\nパ・リーグなら、まず2位と3位がCSファーストステージを戦う。その勝者が1位球団とファイナルステージで対戦し、勝った球団がパ・リーグ代表として日本シリーズへ進む。\n\nセ・リーグでも同じ流れで1球団を決める。最後の日本シリーズは最大7試合で、一方が4勝した時点で終了する。\n\n2026年の日本シリーズは10月24日に開幕予定だ。\n\n## 今日の試合で見るなら\n日本ハムにとって今日の先にある最短ルートは、まず2位を取りにいき、10月10日からのCSファーストステージを勝ち、リーグ1位のソフトバンクとのファイナルを突破することだ。今日のロッテ戦は、その長い階段の入口にある1試合なのだ。"}, "5-05": {"meta": {"id": "5-05", "title": "クライマックスシリーズ（CS）って？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-05-a"], "related": ["5-01", "5-03", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\nクライマックスシリーズ（CS）は、リーグ戦のあとに1〜3位が日本シリーズ進出を争う短期決戦だ。リーグ優勝そのものは1位の球団だが、CSを勝ち抜かないと日本シリーズには行けない。\n\n## しくみ\nまず「ファーストステージ」で2位と3位が対戦する。3試合制で先に2勝したほうが勝ち上がり、全試合を2位球団の本拠地で行う。同じ勝利数になった場合も、上位の2位球団が進む。\n\n次の「ファイナルステージ」は1位球団対ファーストステージ勝者だ。基本は1位球団に最初から1勝を与え、最大6試合で、アドバンテージ込みの4勝に先に届いた側が日本シリーズへ進む。\n\n2026年からは追加ルールができた。1位と勝ち上がり球団のレギュラーシーズンの差が10ゲーム以上、または勝ち上がり球団の勝率が5割未満なら、1位に2勝のアドバンテージを与え、最大7試合・5勝先取になる。\n\nつまり、レギュラーシーズンで上にいるほど有利に作られているのだ。\n\n## 歴史・由来\n今の形のCSは2007年から両リーグで行われている。2026年はファーストステージが10月10日、ファイナルステージが10月14日に始まる。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、2位西武とは1.5ゲーム差だ。西武は残り4試合あり、日本ハムは勝ち続けたうえで西武の負けを待つ立場だ。2位になればCSの最初の最大3試合をエスコンフィールドで戦えるので、CS出場はすでに決まっている日本ハムにとって、今日の1勝は「どこでCSを戦うか」に関わる。"}, "5-06-a": {"meta": {"id": "5-06-a", "title": "清宮幸太郎の100号って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/41545136.html", "https://www.nikkansports.com/baseball/news/202609260001489.html?mode=all"]}, "body": "## ひとことで\n「100号」は、清宮幸太郎がプロ野球の公式戦で打った通算100本目のホームランという意味だ。9月27日終了時点で99本なので、今日1本出れば到達するのだ。\n\n## しくみ\n通算本塁打は、その年だけではなくプロ入り後の本塁打を全部足した数字だ。清宮は2018年に7本を打ち、2026年はここまで23本。積み上げた合計が99本になっている。\n\n100という数字そのものに得点が増える特別ルールはない。ただ、長く一軍で長打を重ねたことが目に見える節目なのだ。\n\n## 今日の試合で見るなら\n清宮の打席では、打球が外野フェンスを越えるかだけを追えばいい。ジャクソンの失投を一振りで仕留めれば、その一発が通算100号になるのだ。"}, "5-06-b": {"meta": {"id": "5-06-b", "title": "山口航輝の「40年ぶり」って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/91895138.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/86265", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n山口航輝が今季30本塁打に到達したのが、ロッテの日本人選手では1986年の落合博満以来40年ぶりだった、という意味だ。\n\n## しくみ\n「30本」は1シーズンで打ったホームラン数の区切りだ。外国人選手を含めればロッテにも30本以上の例はあるが、日本人選手に限ると長い空白があったのだ。\n\n山口は9月15日の日本ハム戦で29号と30号を2打席連続で放った。30号は9回の決勝本塁打で、一発がそのまま試合の勝敗と40年ぶりの記録を動かした。\n\n## 今日の試合で見るなら\n今日の相手も日本ハムだ。山口は今季32本塁打まで伸ばしているので、打席では「もう30本を超えた長距離打者」として、外野へ上がる大きな打球に注目するといいのだ。"}, "5-06-c": {"meta": {"id": "5-06-c", "title": "ジャクソンの10勝目って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nアンドレ・ジャクソンは今季9勝8敗で、今日勝てばシーズン10勝目になる。2025年もDeNAで10勝しているので、達成すれば2年連続の2桁勝利なのだ。\n\n## しくみ\n投手の「勝ち」は、登板した試合でチームが勝てば自動で付くわけではない。先発投手（試合の最初から投げる投手）なら、基本は5回以上を投げ、交代したあとも味方がリードを守ると勝ち投手になる。\n\n「10勝」は1年で10試合の勝ち投手になった、という区切りだ。ジャクソンは今季ロッテで9勝しており、チーム内でも最多タイの勝ち星を持っている。\n\n## 今日の試合で見るなら\nロッテが先に点を取り、ジャクソンが5回以降までリードを守れるかを見るといい。そのままロッテが勝てば、今日が今季10勝目になる可能性があるのだ。"}, "5-06": {"meta": {"id": "5-06", "title": "今日の注目選手は？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-06-a", "5-06-b", "5-06-c"], "related": ["5-07"], "sources": ["https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/43745159.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n今日なら、日本ハムの清宮幸太郎、ロッテの山口航輝、ロッテ先発のアンドレ・ジャクソンを追うと分かりやすい。3人とも、きょう動くかもしれない節目を持っているのだ。\n\n## しくみ\n清宮は通算本塁打（プロ入り後に打ったホームランの合計）が99本で、あと1本で100号だ。これは今季だけの数字ではなく、2018年の1年目から積み上げた合計なのだ。\n\n山口は今季32本塁打。9月15日に30号へ到達し、ロッテの日本人選手では1986年の落合博満以来40年ぶりに、1シーズン30本へ乗せた。\n\nジャクソンは今季9勝8敗、防御率3.44。今日勝てば10勝目で、2025年の10勝に続く2年連続の2桁勝利になる。\n\n## おもしろエピソード\n山口の節目の30号は、今日と同じ日本ハム戦だった。9回に決勝本塁打を打ち、29号との2打席連続本塁打で一気に30本へ届いたのだ。\n\n## 今日の試合で見るなら\n日本ハムの攻撃では、清宮の打席で「あと1本」を思い出せばいい。ロッテの攻撃では山口の大きな打球、ロッテの守りではジャクソンが勝ち投手の権利を持って降板できる展開になるかを見ると、3つの節目を同時に追えるのだ。"}, "5-07-a": {"meta": {"id": "5-07-a", "title": "各スタメンのカード（18人）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n両チームの予想スタメン18人は、それぞれカードで特徴と見どころを確認できる。全員を先に覚える必要はないのだ。\n\n## しくみ\nスタメン（試合開始時に出る選手）は両チーム9人ずつだ。カードには、打つ特徴、守る場所、最近の調子など、観戦中に使いやすい情報をまとめている。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。まず1番打者、次に得点につながりやすい中軸（打線の中心になる打者）だけ見ておくと、試合の流れを追いやすいのだ。"}, "5-07-b": {"meta": {"id": "5-07-b", "title": "両先発投手のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n今日の予告先発（試合の最初から投げる予定の投手）は、ロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。2人とも右投手なのだ。\n\n## しくみ\n先発投手は、試合の最初の数回を任される投手だ。ジャクソンは今季9勝8敗、防御率3.44、福島は5勝4敗、防御率3.35。数字だけでなく、球種や最近の登板もカードで確認できる。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。ロッテの守りではジャクソン、日本ハムの守りでは福島のカードを開き、どんな球で打者を抑えようとしているかを見るといいのだ。"}, "5-07-c": {"meta": {"id": "5-07-c", "title": "スタメン候補・ブルペン・代打代走のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n試合はスタメン（試合開始時に出る選手）だけで終わらない。途中から出る選手を見ると、監督がどこで勝負をかけたか分かるのだ。\n\n## しくみ\nブルペンは、途中から投げる投手たちのことだ。代打は打つために交代で出る選手、代走は走るために交代で出る選手を指す。\n\nスタメン候補も含め、実際に誰が出るかは試合展開で変わる。だから先に全員を覚えるより、交代が告げられた時にカードを開く方が効率がいいのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。場内アナウンスで新しい名前が呼ばれたら、その選手だけ確認すれば十分なのだ。"}, "5-07-d": {"meta": {"id": "5-07-d", "title": "両監督のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://www.marines.co.jp/news/detail/202500743647.html", "https://www.fighters.co.jp/news/detail/202500796590.html"]}, "body": "## ひとことで\n今日の監督は、ロッテがサブロー、日本ハムが新庄剛志だ。選手交代や投手交代を決める、試合中の指揮役なのだ。\n\n## しくみ\n監督は、誰をスタメン（試合開始時に出す選手）にするか、いつ投手を代えるか、誰を代打や代走で送るかを決める。スコアだけでは見えないが、交代のタイミングには監督の考えが出やすいのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から両監督のカードが見られます。選手交代が続いた場面でカードを開くと、「なぜこの選手を今出したのか」を考える手がかりになるのだ。"}, "5-07": {"meta": {"id": "5-07", "title": "スタメン表（選手・監督カード）", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-07-a", "5-07-b", "5-07-c", "5-07-d"], "related": ["4-02", "5-06"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nスタメン（試合開始時に出る選手）は、打順と守る場所を見るための名簿だ。このガイドでは、選手名を覚えるより先にカードを開けば十分なのだ。\n\n## しくみ\n今日の予想スタメンは、ロッテ9人、日本ハム9人の計18人だ。これに両チームの先発投手（試合の最初から投げる投手）、途中から出る候補、両監督のカードがある。\n\n実際のスタメンは試合前の発表で変わることがある。予想と違う名前が出ても異常ではなく、その日の相手投手や選手の状態で入れ替わるのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。名前が分からなくなったら、打席に入った選手やマウンド（投手が投げる場所）にいる投手のカードだけ開けばいいのだ。"}}, "players": [{"team": "監督", "section": "監督カード", "name": "サブロー", "title": "サブロー（本名・大村三郎、#86、ロッテ監督、50歳）", "body": "- 特徴：「昭和のキャンプ」を掲げる猛練習派で、就任会見では「甘さを取り除く」と宣言。一方で「伸び悩む若手は我慢して使わないと開花しない」と、起用は辛抱強いタイプです。<!-- TODO: 確認（原文「昨和のキャンプ」を「昭和のキャンプ」と推定） -->\n- 見どころ：消化試合でも若手（寺地・井上・西川）を並べるのか。前々日に逆転サヨナラを喫した横山を、接戦の9回にまた送るのかも注目です。\n- 出立ち：背番号86、50歳。現役引退会見で「マリーンズを愛しています」と泣いた熱血漢です。\n- プロまで：岡山出身。PL学園から1994年ドラフト1位。知り合いのいない東京で偶然入ったちゃんこ店の店主に「出世払いでいいよ」と子どものように可愛がられ、「東京の親父」と慕った話が有名です。\n- プロで：最初のキャンプで打撃投手の伊良部秀輝の球が前に飛ばず「とんでもない世界に入った」と頭を抱えたそうです。1軍定着まで5年。山本功児監督に抜擢され、「お前がマリーンズを引っ張れ」と言われ続けました。2005年は主力として日本一。一時巨人へ移籍後に戻り、2016年に引退しました。2軍監督、ヘッドコーチを経ています。\n- 直近1年：2軍監督時代に山本大斗・寺地・西川史礁らを鍛えました。昨年6月から1軍ヘッドになりましたが、チームは8年ぶりの最下位。吉井監督の辞任で昇格しました。就任1年目の今季は5位ですが、複数年契約で来季も続投。課題は先発投手と明言しています。\n- 直近数試合：9/17にBクラスが確定し、「僕が下手くそだったのもある」と発言。一方で「山口の30本は自信になる」「小川はセカンドとして十分」と、我慢の起用の手応えを語っています。チームは直近3試合2勝1敗です。"}, {"team": "監督", "section": "監督カード", "name": "新庄剛志", "title": "新庄剛志（#1、日本ハム監督、54歳）", "body": "- 特徴：大胆な起用と演出力。先発を多めに回すローテーション運用が評価されてきました。今季は進塁打を重視する「自己犠牲」がテーマです。\n- 見どころ：勝つしかない試合。水谷・レイエス不在の打線の組み方と、福島を何回で代えて左腕をどうつぎ込むかが腕の見せどころです。\n- 出立ち：背番号1、54歳。現役時代から派手な演出で知られ、試合前後の発言も話題になります。\n- プロまで：福岡出身。西日本短大付高から阪神へ。ロッテの小野郁は高校の後輩です。\n- プロで：阪神→メッツ・ジャイアンツ（2002年にワールドシリーズ出場）→日本ハム。北海道移転初年の2004年に加入し、2006年に日本一で引退。2022年に「ビッグボス」として監督に就任し、順位は6位・6位・2位・2位と伸ばしてきました。\n- 直近1年：開幕前に「ぶっちぎりの優勝」を公言。ところが4月末は最下位で、交流戦の9連勝で持ち直しました。ソフトバンク戦は5勝18敗2分と大きく負け越しています。7/2には史上初の「初回先頭から4者連続本塁打」を記録し、「甲子園の3連発と並ぶ記憶」と大喜びしました。3年連続Aクラスは確定済みです。\n- 直近数試合：9/24の本拠地最終戦後に来季の続投（6年目）を表明。骨折した水谷には「もう塩の上で寝てほしい」、インフルエンザの加藤貴には「流行りに乗らなくても」と語っています。チームは直近3試合1勝2敗、得点は0・2・1です。<!-- TODO: 確認（「塩の上で寝てほしい」は原文ママ。意味が取れないため公開前に出典で確認） -->"}, {"team": "ロッテ", "section": "先発投手", "name": "アンドレ・ジャクソン", "title": "アンドレ・ジャクソン（#42、先発、右投右打、30歳）", "body": "- 特徴：力強い直球と落差の大きいチェンジアップ。今季144回で133奪三振と空振りを取れる一方、四球は55個と多めです。\n- 見どころ：9勝8敗、防御率3.44でチーム最多勝。勝てば2年連続の2桁勝利で、ロッテでは今季初の10勝投手になります。強風のマリンでチェンジアップがどう変化するかも注目。獲得時にサブロー監督は「マリンの風を味方につければ、打たれることはなかなかない」と評しました。\n- 出立ち：190cm・95kg。たくましい顎髭と、トレードマークのもじゃもじゃヘア。\n- プロまで：米アリゾナ州出身、ユタ大学でプレーしました。\n- プロで：ドジャース傘下（2017〜23年）からメジャーに上がり、2023年はパイレーツ。2024年にDeNAへ来日し、8勝・防御率2.90でした。日本シリーズでは初戦に先発し、中4日で第5戦にも投げました。26年ぶりの日本一に貢献し、シリーズ優秀選手になっています。2025年は10勝7敗、防御率2.33。\n- 直近1年：DeNAの保留者名簿から外れ、昨年12月にロッテと契約。開幕投手候補でしたが、3月に家事中に右手の指を負傷し出遅れました。移籍初登板は4/1の日本ハム戦（エスコン）で、5回1安打無失点で初勝利。今日はその相手との再戦です。\n- 直近数試合：9/4のオリックス戦で敗戦。その後は家族の出産に立ち会うため一時帰国しました。復帰戦の9/22オリックス戦は5回77球3安打2失点。今日は中5日です。復帰戦の球数から考えると100球前後での交代が妥当で、横山につなぐまでの6〜8回を誰で埋めるかが論点です。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "西川史礁", "title": "西川史礁（#6、左翼・1番、右投右打、23歳）", "body": "- 特徴：広角に強い打球を飛ばす中距離打者。打率.291、144安打、28二塁打と、チームのヒットメーカーです。死球は10個で、内角を強く攻められています。\n- 見どころ：残り試合で打率3割に届くか。福島・右腕陣との右対右です。\n- 出立ち：182cm・88kgのがっしり型。\n- プロまで：和歌山・日高川町出身。龍谷大平安高から青山学院大へ進み、2024年ドラフト1位で入団しました。\n- プロで：1年目の昨季は序盤こそ苦しみましたが、規定打席に到達。打率.281、リーグ最多の27二塁打で新人王になりました。\n- 直近1年：2年目のジンクスはなく、126試合で打率・安打ともチームトップ。4月には3ランを含む4安打5打点の試合もありました。1番にも中軸にも入る打線の要です。\n- 直近数試合：9/25西武戦は4番で、1点を追う8回に中越えの逆転3ラン。9/26はノーヒット（死球1）、昨日は1番で初回に内野安打で出塁し先制のホームを踏みました。3試合で10打数3安打と状態は悪くありません。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "山口航輝", "title": "山口航輝（#51、指名打者・2番、右投右打、26歳）", "body": "- 特徴：フルスイングの長距離砲。今季は32本塁打、70打点、長打率.588。直球に絞って1球で仕留めるのが信条です。\n- 見どころ：33号が出ればレイエスを抜いて本塁打単独2位。記念の30号も日本ハム戦で打っています。\n- 出立ち：183cm・100kgの巨体。\n- プロまで：秋田・明桜高から2018年ドラフト4位。入団時の発表会で「30本以上打ってホームラン王を獲りたい」と宣言しました。\n- プロで：2021年のCSでは21歳で本塁打。2022年は3打席連続本塁打を含む16本でチーム最多でした。引退する井上晴哉から後を託され、「晴哉さんの24本と99打点を超えたい」と誓っています。\n- 直近1年：昨年8月にパ・リーグタイの4打席連続本塁打。1イニング2本塁打も記録しましたが、昨季は35試合出場にとどまりました。今季は開幕から量産し、8月には月間MVPを初受賞。9/15の日本ハム戦では29・30号を放ちました。30号は9回に守護神の柳川から打った決勝弾です。球団の日本人では1986年の落合博満以来40年ぶりの30本で、「僕の夢だった」と語りました。\n- 直近数試合：9/22に32号を放ちました。一度は二塁打でしたが、ビデオ判定で本塁打になっています。9/25は2安打2打点、9/26は5打数ノーヒット。9/27は2安打で、4回に2点適時打を放ちました。9月は打率が落ち気味ですが、単打でも得点に絡んでいます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "藤原恭大", "title": "藤原恭大（#1、右翼・3番、左投左打、26歳）", "body": "- 特徴：俊足・強肩の外野手。出塁率.355で12盗塁と、出塁してかき回すタイプです。右翼からのレーザービームで、レイエスの当たりを「ライトゴロ」にしたこともあります。\n- 見どころ：3試合連続ノーヒットから抜け出せるか。右翼の守備も見どころです。\n- 出立ち：181cm・80kgのスマートな体型。\n- プロまで：大阪桐蔭で2018年に春夏連覇を達成。根尾昂らと同期の黄金世代で、同年のドラフト1位で入団しました。\n- プロで：高卒で入団してから数年は、故障や伸び悩みが続きました。毎年「今年こそ」と言われてきた選手です。\n- 直近1年：今季は99試合で打率.264、8本塁打、40打点。死球は11個です。\n- 直近数試合：3試合で12打数ノーヒットと大ブレーキ中です。9/26は3三振、昨日は併殺打もありました。ただ四球は2つ選んでおり、選球眼までは崩れていません。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "佐藤都志也", "title": "佐藤都志也（#32、捕手・4番、右投左打、28歳）", "body": "- 特徴：「打てる捕手」。今季は自己最多の17本塁打、55打点で、四球を46個選んでいます。\n- 見どころ：四球の多いジャクソンをどうリードするか。打っては4番として当たりを取り戻せるかです。\n- 出立ち：181cm・91kg。\n- プロまで：聖光学院高から東洋大。2019年ドラフト2位で入団しました。\n- プロで：田村龍弘や松川との正捕手争いを勝ち抜き、2024年にブレイク。初めて規定打席に到達し、打率.278でベストナインを初受賞しました。大学時代に慣れ親しんだ神宮でのオールスターでは6打数5安打でMVP。球団35年ぶりの球宴MVPです。プレミア12の侍ジャパンにも選ばれました。\n- 直近1年：123試合で打率.233。打率は落としましたが、長打力を大きく伸ばしました。\n- 直近数試合：3試合で13打数1安打（二塁打）と低調です。昨日は終盤に一塁へ回り、松川がマスクをかぶりました。疲労を考えると、捕手松川・一塁佐藤という並びもあり得ます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "寺地隆成", "title": "寺地隆成（#65、三塁・5番、右投左打、21歳）", "body": "- 特徴：本職は捕手ですが、打撃を生かすため今季は三塁と兼任しています。解説のT-岡田氏から「素晴らしいスイング」と評された打撃が持ち味です。\n- 見どころ：長い不振からの復活途中。今の勢いが本物かどうかです。\n- 出立ち：177cm・82kg。\n- プロまで：明徳義塾高から2023年ドラフト5位で入団しました。\n- プロで：2軍でサブロー監督（当時は2軍監督）の指導を受けました。高卒2年目の昨季には規定打席に到達し、次世代の主力と期待されています。\n- 直近1年：開幕直後は打率3割超え。ところが5月は月間打率.095と落ち込み、6月と8月の2度、2軍へ落ちました。足を上げた後の間の取り方を変えて昇格し、「とにかく2割台に乗せたい」と語っていました。\n- 直近数試合：9/16に今季初の猛打賞。9/19には3試合連続複数安打で、約4カ月ぶりに打率2割台に戻しました。昨日は初回の先制タイムリー二塁打を含む3安打で、3試合で10打数4安打です。今、打線で最も当たっている一人です。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "小川龍成", "title": "小川龍成（#57、二塁・6番、右投左打、28歳）", "body": "- 特徴：守備と小技が武器。犠打11個と、打線をつなぐ役割を担っています。\n- 見どころ：二塁の守備と、チャンスでのバントやコース打ち。\n- 出立ち：171cm・74kgの小柄な内野手。\n- プロまで：前橋育英高から國學院大。2020年ドラフト3位で入団しました。\n- プロで：長く守備固めや控えの立場でした。一年を通してフルに出場したシーズンは、今季までありませんでした。\n- 直近1年：今季は131試合に出場し打率.262。初めて二塁のレギュラーをつかみ、サブロー監督に「セカンドとして十分な成績」と評されました。\n- 直近数試合：3試合で10打数1安打。打撃は下降気味ですが、昨日は犠打と四球で得点に絡みました。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "髙部瑛斗", "title": "髙部瑛斗（#0、中堅・7番、右投左打、28歳）", "body": "- 特徴：2022年の盗塁王（44盗塁）。俊足と中堅の守備が売りです。\n- 見どころ：今いちばん当たっている打者。復帰後の勢いが続くかです。\n- 出立ち：178cm・72kgの細身。\n- プロまで：東海大甲府高から国士舘大。2019年ドラフト3位で入団しました。\n- プロで：2022年に盗塁王とゴールデングラブ賞を獲得。その後は肩の故障や手術が続きました。2024年7月に月間MVP、2025年には侍ジャパンに選ばれています。\n- 直近1年：今季は打撃不振で6月に2軍落ち。さらに7月上旬、ファームで死球を受けて右肩甲骨を骨折しました。2カ月近く実戦を離れ、その間に打撃を全て見直したそうです。\n- 直近数試合：9/25に約3カ月ぶりに1軍復帰し、当日適時打。9/26は三塁打を含む2安打2打点、昨日は2点二塁打を含む3安打。3試合で計6安打5打点です。本人は「来年に向けたアピール」と語っています。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "井上広大", "title": "井上広大（#39、一塁・8番、右投右打、25歳）", "body": "- 特徴：長打力が売りの右の大砲です。打率.171と確実性は低いものの、当たれば一発です。\n- 見どころ：9月は14試合4本塁打と量産中。「伸び悩む若手は我慢して使う」というサブロー起用の象徴です。\n- 出立ち：189cm・100kgと、チームでも指折りの大柄。\n- プロまで：履正社高の4番として、2019年夏の甲子園で優勝。同年のドラフト2位で阪神に入りました。\n- プロで：阪神では1軍に定着できず、昨オフの現役ドラフトでロッテに移りました。\n- 直近1年：移籍1年目で出場機会が大幅に増え、初めて100打席を突破しました。本人は好調の秘訣を「誰にも負けない練習量」と語り、サブロー監督も「練習のたまもの」と評価しています。\n- 直近数試合：9/26は7回に一時逆転となる7号2ラン。9/27は4回に勝ち越しの適時打を放ち、「1点欲しいところで取れた」と語りました。2試合連続で得点に絡んでいます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "山崎剛", "title": "山崎剛（#38、遊撃・9番、右投左打、30歳）", "body": "- 特徴：内外野を守れるユーティリティです。打率.226ですが、守備で存在感を示しています。\n- 見どころ：戦力外からの再起物語と、遊撃の守備。\n- 出立ち：173cm・74kgと小柄です。\n- プロまで：福岡出身。日章学園高（甲子園出場なし）から國學院大へ。小川龍成と同じ大学です。2017年ドラフト3位で楽天に入りました。\n- プロで：楽天では2023年に遊撃中心に117試合に出場。その後は故障や自律神経の病気に苦しみ、昨年は左膝の手術で1軍出場なし。オフに戦力外になりました。それでも「やれる自信がある、育成でもかまわない」と現役続行を訴えました。\n- 直近1年：ロッテと育成契約し、「サブロー監督を男にする」と誓いました。6/5に支配下に復帰して背番号38に。「何回も戻れないかもと思った」と語り、6/13には3年ぶりの安打を放っています。今季は56試合に出場しました。\n- 直近数試合：9/26は2安打、9/27は犠打を決めました。宮崎竜成との遊撃争いで、直近は山崎が先発を引き寄せています。"}, {"team": "ロッテ", "section": "スタメン候補", "name": "安田尚憲", "title": "安田尚憲（#5、内野、右投左打、27歳）", "body": "- 特徴：左の長距離砲。今季は73試合で打率.262、6本塁打、16二塁打と、確実性も上がっています。\n- 見どころ：高校時代のライバル清宮が、今日通算100号に王手。同じ試合で安田の一発も見られるかです。\n- 出立ち：188cm・100kgの大柄。\n- プロまで：履正社高時代は「東の清宮、西の安田」と並び称されました。清宮と同じ2017年のドラフト1位で入団しています。\n- プロで：若くして4番を任された時期もありました。その後は三塁・一塁のレギュラー争いに揺れ、打撃フォームも試行錯誤を重ねてきました。\n- 直近1年：キャンプでは「ライバルに勝てるように」と競争に臨みました。寺地の三塁起用と並行して出番を分け合っています。\n- 直近数試合：9/25は7番一塁で先発し、3打数ノーヒット。9/26・27は井上が一塁に入り、出番はありませんでした。右投手の福島相手なら、左の安田が起用される可能性もあります。"}, {"team": "ロッテ", "section": "スタメン候補", "name": "松川虎生", "title": "松川虎生（#2、捕手、右投右打、22歳）", "body": "- 特徴：高卒ルーキーで開幕マスクをかぶった、落ち着きのあるリードの捕手です。打撃は打率.189と課題です。\n- 見どころ：リード時の守備固めで登場し、横山とのバッテリーで試合を締められるか。\n- 出立ち：178cm・98kgのがっしりした体格。\n- プロまで：市立和歌山高から2021年ドラフト1位で入団しました。\n- プロで：1年目の2022年に開幕マスク。同年には佐々木朗希の完全試合を、高卒ルーキーとしてリードしました。その後は佐藤の台頭で控えに回っています。\n- 直近1年：今季は44試合に出場。解説者からは「リードはまだまだ勉強」と指摘されるなど、成長途上です。\n- 直近数試合：昨日は終盤に佐藤からマスクを引き継ぎ、1打数ノーヒット（三振）。佐藤が低調なので、先発マスクもあり得ます。"}, {"team": "ロッテ", "section": "スタメン候補", "name": "宮崎竜成", "title": "宮崎竜成（#44、内野、右投左打、25歳）", "body": "- 特徴：走攻守の三拍子型で、広角に長打を打てる内野手。入団時に「将来はトリプルスリーを狙える選手に」と語っています。\n- 見どころ：遊撃での先発チャンスを生かせるか。\n- 出立ち：173cm・90kgの小柄なパワー型。\n- プロまで：徳島出身。母はアトランタ五輪のソフトボール日本代表、児玉千佳さんです。創志学園高で春夏の甲子園に出場しました。立命館大では指名漏れを経験しています。社会人のヤマハでは「他の人が遊びに行く時に休養し、寝る時間も決めた」という野球漬けの2年間を過ごしました。2024年ドラフト2位で入団。好きなロッテのお菓子はアーモンドチョコレートとクランキーだそうです。\n- プロで：1年目の昨季は2軍で6本塁打。1軍では7月にプロ初安打を放ちましたが、打率.194と壁に当たりました。\n- 直近1年：今季は41試合で打率.132、1本塁打。山崎剛の加入で遊撃の出番を争っています。\n- 直近数試合：9/25は8番遊撃で先発し、2打数2三振で途中交代。その後2試合は山崎が先発しています。"}, {"team": "ロッテ", "section": "ブルペン", "name": "横山陸人", "title": "横山陸人（#15、抑え、右投右打、25歳）", "body": "- 特徴：力強い直球で押すクローザー。52登板で33セーブ、防御率2.50です。\n- 見どころ：前々日の逆転サヨナラ負けから立ち直れるか。\n- 出立ち：180cm・90kg。\n- プロまで：千葉の専大松戸高から2019年ドラフト4位で入団しました。\n- プロで：中継ぎで頭角を現し、2024年には佐藤・鈴木とともにプレミア12の侍ジャパンに選ばれました。\n- 直近1年：今季は守護神に定着し、リーグ上位の33セーブ。\n- 直近数試合：9/25は1回無失点。9/26は2点リードの9回に4連打を浴び、1死も取れず逆転サヨナラ負けでした。昨日は登板なしです。"}, {"team": "ロッテ", "section": "ブルペン", "name": "鈴木昭汰", "title": "鈴木昭汰（#47、セットアッパー、左投左打、28歳）", "body": "- 特徴：横山と並ぶチーム最多の52登板、30ホールド、防御率2.54。左の勝ちパターンの柱です。\n- 見どころ：3連投中で、今日は休養が濃厚。登板すれば、それだけ勝負をかけた場面ということです。\n- 出立ち：175cm・80kg。\n- プロまで：常総学院高から法政大。2020年ドラフト1位で入団しました。\n- プロで：先発から救援に転じて開花。横山らと共にプレミア12の代表に選ばれました。\n- 直近1年：今季は救援で6勝も挙げています。\n- 直近数試合：9/23に敗戦投手。その後9/25〜27に3連投し、9/26は1失点でした。疲労が気になる時期です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "中森俊介", "title": "中森俊介（#56、勝ちパターン、右投左打、24歳）", "body": "- 特徴：救援で7勝1敗、16ホールド、防御率2.35。接戦の終盤を任され、味方の逆転を呼ぶ投手です。\n- 見どころ：鈴木が休むなら、7・8回の大事な場面は彼か八木です。\n- 出立ち：183cm・90kg。\n- プロまで：明石商高のエースとして2019年の甲子園で春夏ともベスト4。同期にはオリックスの来田涼斗がいます。2020年ドラフト2位で入団しました。\n- プロで：先発と中継ぎの両方を経験しながら、救援で居場所をつかみました。\n- 直近1年：今季は救援で勝ち星を重ね、9月だけで3勝。<!-- TODO: 確認（原文「勝利を呼ぶ変化で」を言い換え） -->\n- 直近数試合：9/9の楽天戦、9/15の日本ハム戦（山口の30号決勝弾）、9/25の西武戦で勝利投手。2日間の休養明けです。"}, {"team": "ロッテ", "section": "ブルペン", "name": "八木彬", "title": "八木彬（#33、勝ちパターン、右投右打、29歳）", "body": "- 特徴：150キロ前後の力強い直球。44登板で救援9勝1敗、11ホールド、防御率2.17と、キャリアハイの年です。\n- 見どころ：救援での2桁勝利まであと1。同点や僅差の場面で出てくると実現します。\n- 出立ち：180cm・94kgのがっしり型。\n- プロまで：和歌山出身。八戸学院光星高で甲子園に出場し、東北福祉大から社会人の三菱重工Westへ。都市対抗で151キロを記録し、2021年ドラフト5位で入団しました。\n- プロで：昨季は自己最多の27登板でしたが防御率5点台。終盤に7試合連続無失点と、手応えをつかみました。\n- 直近1年：4/15にプロ初勝利（記念グッズの名は「まさかこんな形で」）。4/29には球団史上8人目の「1球勝利」でハーラートップに並び、「日ごろの行いがいいんかな」と笑わせました。美馬学コーチの「しっかり勝負しよう」という助言で良くなったそうです。<!-- TODO: 確認（記念グッズ名） -->\n- 直近数試合：9/22のオリックス戦で今季初黒星を喫しています。その後は登板間隔が空いており、今日は待機濃厚です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "益田直也", "title": "益田直也（#52、ベテラン右腕、右投右打、36歳）", "body": "- 特徴：ルーキーからロッテ一筋で投げ続ける「幕張の鉄腕」。今季は36登板で防御率3.22。\n- 見どころ：節目を積み重ねるレジェンドの登板そのものが見どころです。\n- 出立ち：179cm・80kg。\n- プロまで：関西国際大から2011年ドラフト4位で入団しました。\n- プロで：中継ぎと抑えを行き来しながら、長年ロッテのブルペンを支えてきました。\n- 直近1年：今季は通算250セーブで名球会入り。「250は通過点」と語り、9月には通算800試合登板も達成しました。\n- 直近数試合：昨日は8回から登板し、1回1安打3奪三振で無失点と健在です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "小野郁", "title": "小野郁（#37、中継ぎ、右投右打、29歳）", "body": "- 特徴：剛速球とチェンジアップが武器。昨季は自己最速の159キロを記録しています。今季は38登板で防御率2.40。\n- 見どころ：新庄監督の高校の後輩が、先輩のチーム相手に投げる場面。\n- 出立ち：175cm・78kgと投手としては小柄です。\n- プロまで：福岡の西日本短大付高から2014年ドラフト2位で楽天へ。入団時には二刀流を打診されたこともありました。\n- プロで：楽天では1軍未勝利。鈴木大地のFA移籍の人的補償として2019年オフにロッテへ移り、中継ぎで開花しました。\n- 直近1年：昨季は47登板、10ホールド。今季も安定した数字を残しています。\n- 直近数試合：9/5に敗戦投手。直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "澤田圭佑", "title": "澤田圭佑（#54、中継ぎ、右投左打、32歳）", "body": "- 特徴：41登板、11ホールドのタフな右腕。四球が少なく、40回1/3で与四球は7です。\n- 見どころ：四球を出さない安定感で、走者を溜めた場面の火消しを担います。\n- 出立ち：178cm・96kgのがっしり型。\n- プロまで：大阪桐蔭高では藤浪晋太郎と同期で、2012年の春夏連覇を経験。立教大から2016年ドラフト8位でオリックスに入りました。\n- プロで：オリックスで戦力外になり、ロッテで育成から支配下に這い上がった苦労人です。\n- 直近1年：今季も中継ぎの一角として1年を投げ抜いています。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "坂本光士郎", "title": "坂本光士郎（#36、左の中継ぎ、左投左打、32歳）", "body": "- 特徴：球威のある直球が持ち味の左腕。33回2/3で39奪三振と、投球回を超える三振を奪っています。\n- 見どころ：清宮や水野、田宮といった日本ハムの左打者に当てるワンポイント起用。\n- 出立ち：179cm・80kg。\n- プロまで：広島出身。如水館高で甲子園に出場し、日本文理大、社会人の新日鉄住金広畑を経て、2018年ドラフト5位でヤクルトに入りました。\n- プロで：ヤクルトでは2021年に36登板し、リーグ優勝に貢献。プロ初勝利も挙げました。2022年7月に山本大貴とのトレードでロッテへ移籍しています。\n- 直近1年：昨季は8登板、防御率6点台と不振。今季は27登板で防御率3.21と復活し、交流戦では故郷の広島で好投しました。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "髙橋快秀", "title": "髙橋快秀（#93、若手右腕、右投右打、20歳）", "body": "- 特徴：最速154キロの伸びのある直球と、キレのあるスライダー。プロではフォークも磨いています。\n- 見どころ：育成出身ルーキーの成長。昨日のように勝ち試合でも起用され始めています。\n- 出立ち：178cm・82kg。支配下を目指す過程で体重が約3キロ増え、球速も上がったそうです。\n- プロまで：香川・多度津高から、大学の誘いを断って独立リーグの徳島インディゴソックスへ。「1年でも早くNPBに入りたかった」からだそうです。昨秋の育成ドラフト2位で入団しました。\n- プロで：1年目の今季、2軍で16試合に登板して防御率0.00。7/30に支配下を勝ち取りました。「同期の独立リーグ出身者の中で一番活躍したい」が原動力だそうです。\n- 直近1年：8/7の1軍デビュー戦では自己最速154キロを計測。フォークで来田から初奪三振を奪い、1回無失点でした。本人は「ファームでも投げたことのないくらい落ちた」と語っています。\n- 直近数試合：今季4登板で防御率9.00。ただ昨日は7回に1回無失点1奪三振で、ホールドを記録しました。"}, {"team": "ロッテ", "section": "ブルペン", "name": "宮﨑颯", "title": "宮﨑颯（#66、左腕、左投左打、26歳）", "body": "- 特徴：威力のある直球が武器のサウスポーです。\n- 見どころ：大差がついた場面での登板が中心。来季へのアピールの場です。\n- 出立ち：180cm・93kg。\n- プロまで：埼玉栄高から東京農大。2022年の育成ドラフト8位でソフトバンクに入りました。\n- プロで：1年目に左肘のトミー・ジョン手術。3年目の昨年7月に支配下となり、8/5のロッテ戦では藤原からプロ初奪三振。ところがオフに戦力外となりました。ソフトバンクからは育成再契約を打診されましたが、ロッテが支配下で獲得しています。\n- 直近1年：野球を始めた頃から書き続けるノートがホークス時代に18冊。それを携えて幕張に来ました。今季は10登板で防御率6.17です。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "ソト", "title": "ソト（#99、内野、右投右打、37歳）", "body": "- 特徴：経験豊富な助っ人スラッガー。今季は打率.222ながら17本塁打、47打点です。\n- 見どころ：終盤の勝負所での代打。一発で流れを変えられます。\n- 出立ち：185cm・97kg。\n- プロまで：プエルトリコ出身で、米国のマイナーでプレーした後に来日しました。\n- プロで：DeNA時代に2年連続で本塁打王。ロッテ移籍後も主軸を担ってきました。\n- 直近1年：6月の巨人戦でNPB通算200号。「NPBで200本打てるなんて…」と感慨を語りました。\n- 直近数試合：9/25は代打から一塁に入り、9回に中前打でチャンスを広げました。9/26・27は出番なしです。"}, {"team": "ロッテ", "section": "代打・代走", "name": "上田希由翔", "title": "上田希由翔（#10、内野、右投左打、25歳）", "body": "- 特徴：左の強打者。今季は57試合で打率.221、7本塁打です。\n- 見どころ：右投手相手の代打。山崎・小川の打席で送られる可能性があります。\n- 出立ち：183cm・96kg。\n- プロまで：愛産大三河高から明治大。2023年ドラフト1位で入団しました。\n- プロで：定位置はつかめていません。ドラフトでの指名順を指した自虐ネタのぼやきが、ファンの笑いを誘ったこともあります。\n- 直近1年：一塁・三塁で安田や寺地と競いながら、出場機会を増やしました。\n- 直近数試合：直近3試合の出場はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "池田来翔", "title": "池田来翔（#00、内野・代走、右投右打、26歳）", "body": "- 特徴：内野をどこでも守れるユーティリティ。今季は80試合出場で打席は88と、代走・守備固めが主な仕事です。\n- 見どころ：終盤に一塁走者が出たときの代走。\n- 出立ち：180cm・95kgと、代走要員にしてはがっしりした体格です。\n- プロまで：千葉出身で、小学時代はマリーンズジュニアに選ばれました。習志野高から国士舘大へ進み、「強打の二塁手」として2021年ドラフト2位で入団しました。\n- プロで：昨季は自己最多の83試合に出場し、5本塁打とパンチ力を見せました。\n- 直近1年：今季は打率.224、本塁打は0です。キャンプ地・都城市とのコラボメニューがZOZOマリンで販売されるなど、球場内での露出もあります。\n- 直近数試合：9/25・26と連日、終盤に一塁走者の代走で出場。打席はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "山本大斗", "title": "山本大斗（#61、外野、右投右打、24歳）", "body": "- 特徴：吉井前監督が「ダイナマイト」と命名した右の大砲。今季は打率.183、2本塁打と苦しんでいます。\n- 見どころ：左腕が出てきた場面の代打。山口とも仲が良く、ベンチの盛り上げ役です。\n- 出立ち：180cm・88kg。登場曲にはケンドリック・ラマーやサンボマスターを使っています。\n- プロまで：鳥取出身。島根の開星高から2020年の育成ドラフト3位で入団しました。\n- プロで：2022年途中に支配下。イースタンでタイトルを獲るなどし、2025年は4月にプロ初本塁打。6・7月は4番を打ち、オールスターにも初出場しました。107試合で11本塁打です。\n- 直近1年：今季は確実性を課題に挑みましたが、71試合で打率.183。7月にはファームで3試合連続複数安打を記録しました。\n- 直近数試合：直近3試合の出場はありません。"}, {"team": "日本ハム", "section": "先発投手", "name": "福島蓮", "title": "福島蓮（#45、先発、右投右打、23歳）", "body": "- 特徴：テイクバックの小さいフォーム。長身から角度のある直球とフォークが武器です。75回1/3で78奪三振と、投球回を超える三振を奪っています。\n- 見どころ：負けたらほぼ終わりの試合で、約2カ月半ぶりの先発。中継ぎからの転換で、何回まで持つか。調子の良い山口や西川史礁との右対右も注目です。\n- 出立ち：190cm・81kgの細身長身。登場曲は嵐で、嵐のラストライブに感動したと語っています。\n- プロまで：青森・八戸西高で、21世紀枠で創部初の甲子園に出場。「憧れは大谷翔平」と語り、2021年の育成ドラフト1位で入団しました。本人は「日本ハムからの指名はないかなと思っていた」そうです。\n- プロで：2024年3月に支配下契約。育成からのエース、ソフトバンクの千賀滉大を目指す「千賀2世」を掲げました。4月のデビュー戦は5回5奪三振2失点。昨季は春先の不調を乗り越え、8先発で5勝0敗、防御率2.25。クライマックスシリーズでも8回途中2失点10奪三振と好投しました。\n- 直近1年：背番号が94から45になり、ローテ定着と2桁勝利を目指したシーズン。前半は先発ローテーションに入り、後半は救援に回りました。「代理守護神」としてプロ初セーブも挙げ、「マウンドでハイタッチは初めて」と喜びました。今季は26登板で5勝4敗1S5H、防御率3.35。\n- 直近数試合：9月は救援7試合すべて無失点、3ホールド、1セーブです。状態の良さを買われての先発ですが、長いイニングは投げていません。球数は60〜80球、3〜5回での継投が濃厚です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "水野達稀", "title": "水野達稀（#43、遊撃・1番、右投左打、26歳）", "body": "- 特徴：今季大ブレイクした「打てる遊撃手」。打率.285、11本塁打、29二塁打、チーム最多の15盗塁です。積極的に打ちにいくスタイルで、三塁打も多く打っています。\n- 見どころ：初回の第1打席。出塁して清宮の前に走者を置けるかが、得点の鍵になります。\n- 出立ち：171cm・80kgの小柄でがっしり型。他球団から「近藤健介と重なる」と評されています。\n- プロまで：香川出身。丸亀城西高から社会人のJR四国を経て、2021年ドラフト3位で入団しました。\n- プロで：1・2年目は打率1割台。そこから打率.220、.247と毎年数字を上げ、2年連続で100試合に出場しました。\n- 直近1年：契約更改では「ボスを日本一監督にする」と誓いました。5月からはリードオフマンに定着し、一時は打率リーグ2位に。「ショートが打てるチームは強い」と語っています。7/2の史上初の「初回先頭から4者連続本塁打」では、2人目として勝ち越し弾を放ちました。\n- 直近数試合：3試合で10打数1安打と下降気味です。9/26は死球と犠打でつなぎ、昨日は初回に右前打。当たりが止まっているのが、打線の得点力低下につながっています。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "田宮裕涼", "title": "田宮裕涼（#64、捕手・2番、右投左打、26歳）", "body": "- 特徴：打てて走れる捕手。強肩の送球は「ゆあビーム」と呼ばれます。打率.266、三塁打4本です。\n- 見どころ：福島とのバッテリー、ロッテの走者への送球、そして地元千葉での凱旋打。\n- 出立ち：175cm・84kg。\n- プロまで：千葉・成田高から2018年ドラフト6位で入団しました。\n- プロで：下位指名から道を切り開き、プロ6年目の2024年に初スタメンからブレイク。一時はリーグトップの打率を残しました。\n- 直近1年：今季は93試合で打率.266、7本塁打。進藤と捕手を分け合い、新庄監督は試合途中に捕手を代える采配もよく見せます。\n- 直近数試合：9/24は代打で三振。9/26のオリックス戦は2番捕手で出場し、0-0の8回に決勝タイムリーを放ちました。昨日は出場なしで、今日は捕手で先発の番と見ています。<!-- TODO: 確認（原文「零行列の8回」を「0-0の8回」と推定） -->"}, {"team": "日本ハム", "section": "予想スタメン", "name": "清宮幸太郎", "title": "清宮幸太郎（#21、指名打者・3番、右投左打、27歳）", "body": "- 特徴：今季は23本塁打、65打点と長打力を発揮。四球を47個選んでいます。\n- 見どころ：通算100号まであと1本。今日最大の節目です。\n- 出立ち：184cm・95kg。\n- プロまで：早稲田実業で高校通算111本塁打。履正社の安田（現ロッテ）と「東の清宮、西の安田」と称されました。2017年ドラフトでは7球団が競合した超目玉です。\n- プロで：初本塁打はルーキーの2018年5月9日、オリックス戦でした。その後は故障や伸び悩みが長く、「ブレイク待ち」と言われ続けました。2018年のルーキーが、今日100本目を狙っています。\n- 直近1年：開幕直後のロッテ戦では1試合2本塁打。どちらもレイエスとの2者連続弾でした。シーズンを通して中軸を打ち、132試合に出場しています。\n- 直近数試合：9月は14安打のうち7本が本塁打という極端な当たり方。9/24はノーヒット、9/26は9回にダメ押しの23号ソロ。昨日は3打数ノーヒット（1四球）です。単打より一発に賭ける状態なので、ジャクソンの失投を一振りで仕留められるかが論点です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "野村佑希", "title": "野村佑希（#5、一塁・4番、右投右打、26歳）", "body": "- 特徴：右の中軸打者。今季は115試合で打率.260、17本塁打、60打点です。\n- 見どころ：レイエス不在の4番として、ジャクソンの直球を打てるか。\n- 出立ち：187cm・95kgの大柄。\n- プロまで：花咲徳栄高で夏の甲子園優勝を経験。2018年ドラフト2位で入団しました。\n- プロで：高卒数年で中軸を任された生え抜きです。三塁と一塁を行き来してきました。後輩の有薗は入団時に「目標は野村さん」と弟子入りを志願しています。\n- 直近1年：レイエス・清宮・万波と中軸を組み、チームの本塁打量産を支えました。レイエス離脱後は4番を担っています。\n- 直近数試合：9/24は3番指名打者で投手内野安打。9/26は途中から左翼に入り右前打。昨日は4番一塁で2三振の後、9回に左前打でした。3試合で9打数3安打と、打線では数少ない当たりが続いている打者です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "万波中正", "title": "万波中正（#66、右翼・5番、右投右打、26歳）", "body": "- 特徴：巨体からの長打と、右翼からの強肩。今季は21本塁打ですが、三振も109と多いです。\n- 見どころ：右翼からの返球と、海風に負けない一発。\n- 出立ち：192cm・102kgの大柄で、父はコンゴ出身です。\n- プロまで：横浜高から2018年ドラフト4位で入団。清宮の1学年下にあたります。\n- プロで：新庄監督の下で開花し、2023年には25本塁打で本塁打王争いを演じました。\n- 直近1年：春には「定位置の確約なし」と言われるほど外野の競争が激しかった年です。7/2の4者連続本塁打では4人目を担い、「ちょっと理解できない」と漏らしました。8/21に下半身の不調で離脱。ファーム復帰戦では4安打を放ち、9/15に1軍に戻りました。\n- 直近数試合：3試合で11打数1安打。昨日も2三振と、復帰後は調子が上がりきっていません。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "有薗直輝", "title": "有薗直輝（#39、三塁・6番、右投右打、23歳）", "body": "- 特徴：広角に長打を飛ばす右の長距離砲。肩の強さも売りです。\n- 見どころ：実は小6の時にマリーンズジュニアに選ばれた千葉育ち。ZOZOマリンでの一発なるかです。\n- 出立ち：185cm・104kgの巨体。\n- プロまで：マリーンズジュニア時代は、体育のバスケで右手中指を痛めて大会では控えでした。中学の佐倉シニアでは本塁打を量産するタイプではありませんでした。それが千葉学芸高で開花し、甲子園出場なしながら高校通算70本塁打。2021年ドラフト2位で入団しました。\n- プロで：1年目から新庄監督に「思い切りがいい」と評され、1軍に初昇格しました。昨季はイースタンで首位打者・本塁打王・最高出塁率の3冠。8月に1軍で待望のプロ初安打を放ちました。\n- 直近1年：「1軍でホームラン量産」を誓った今季は、32試合で打率.240、1本塁打。8月上旬には5試合連続安打も記録しました。\n- 直近数試合：3試合で9打数ノーヒット、5三振。昨日は途中で奈良間に交代しており、郡司や奈良間が三塁で先発する可能性もあります。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "山縣秀", "title": "山縣秀（#54、二塁・7番、右投右打、24歳）", "body": "- 特徴：「リアル殿馬」と呼ばれる守備職人。打率.222ですが、犠打やセーフティーバントもこなします。\n- 見どころ：二遊間で水野と組む守備。\n- 出立ち：176cm・82kg。特技はピアノで、起業にも関心がある文武両道型です。\n- プロまで：東京・国分寺出身。都内屈指の難関校、早大学院から早稲田大へ進みました。入学時の目標は「4年秋に守備固めでベンチ入り」でしたが、2年秋には遊撃のレギュラーに。小宮山悟監督に「六大学で一番うまいショートになる可能性がある」と言わしめました。4年春には打率.366でベストナインとリーグ優勝。大学日本代表でも世界大会優勝を経験し、2024年ドラフト5位で入団。同校出身のプロは66年ぶり2人目です。\n- プロで：指名時の目標は「何回でもゴールデングラブ賞を」。1年目の昨季は球団新人で一番乗りの1軍昇格を果たしました。初スタメン初打席初安打、6月にはプロ1号が決勝弾になりました。\n- 直近1年：2年目の今季は「二遊間に山縣がいなきゃいけない選手に」と誓いましたが、58試合の出場。ルーキーの大塚と二塁を分け合っています。推しは球団マスコットのポリーちゃんだそうです。\n- 直近数試合：9/24・26は大塚が先発しました。昨日は7番二塁で中前打を放ち、9回に西川遥輝が代打に出ました。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "矢澤宏太", "title": "矢澤宏太（#12、中堅・8番、左投左打、26歳）", "body": "- 特徴：身体能力が高く、走塁と守備が売りです。今季は三塁打4本。登録上は投手の二刀流です。\n- 見どころ：中堅の広い守備範囲と全力疾走。大差がつけば投手としての登板もゼロではありません。\n- 出立ち：173cm・72kgと、プロでは小柄な体格です。\n- プロまで：藤嶺藤沢高から日体大。大学3年で二刀流が開花し、「投手でも野手でも1位」と評されました。2022年ドラフト1位で入団しています。\n- プロで：入団後は二刀流に挑戦。昨季は外野に専念して自己最多の86試合に出場し、打率.247でした。CSでは「打球は1秒も見ず、歓声と三塁コーチの反応で走った」という全力疾走を見せています。\n- 直近1年：今季は「外野手でレギュラーを獲る。センターが固まれば強いチームになる」と宣言。ところが5/23のソフトバンク戦では、9点ビハインドの8回に2年ぶりに投手として登板しました。近藤を遊飛に打ち取り、場内を騒然とさせています。\n- 直近数試合：9/26は三塁打を含む3安打と大活躍。昨日は内野ゴロ3つでした。調子の波はありますが、今の打線では貴重な当たりです。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "宮崎一樹", "title": "宮崎一樹（#36、左翼・9番、右投右打、25歳）", "body": "- 特徴：パワーとスピードを兼ね備える外野手。今季の1軍は数試合で、昨日が抜擢でした。\n- 見どころ：水谷の骨折で回ってきたチャンスを生かせるか。昨日は2番で起用されました。\n- 出立ち：184cm・91kg。登場曲はMrs. GREEN APPLEの「Soranji」です。\n- プロまで：実家は東京・日野市のそば屋「増田屋」。山梨学院高ではレギュラーになれませんでしたが、臨時コーチの小倉清一郎氏が素質を見抜いていました。山梨学院大で開花し、3年秋は打率.600、5本塁打。日米大学野球の代表にも選ばれ、2023年ドラフト3位で入団しました。<!-- TODO: 確認（原文「謎屋」を「そば屋」と推定） -->\n- プロで：1年目の5月31日に初昇格し、新庄監督から「鎌ヶ谷だと思ってやれ」と声をかけられました。昨季は2軍で85試合に出場し、1軍ではプロ初タイムリーを放っています。\n- 直近1年：今季も多くの時間を2軍で過ごしました。1軍では昨日までに17打数2安打、1本塁打です。\n- 直近数試合：昨日は2番左翼で先発し、3回に右前打を放っています。実は高校時代の2019年センバツで、今のチームメイト進藤勇也がいた筑陽学園と対戦しています。"}], "lineup": [["1", "西川史礁（左翼）", ".291・8", "水野達稀（遊撃・左）", ".285・11"], ["2", "山口航輝（指名）", ".275・32", "田宮裕涼（捕手・左）", ".266・7"], ["3", "藤原恭大（右翼・左）", ".264・8", "清宮幸太郎（指名・左）", ".242・23"], ["4", "佐藤都志也（捕手・左）", ".233・17", "野村佑希（一塁）", ".260・17"], ["5", "寺地隆成（三塁・左）", ".204・5", "万波中正（右翼）", ".255・21"], ["6", "小川龍成（二塁・左）", ".262・2", "有薗直輝（三塁）", ".240・1"], ["7", "髙部瑛斗（中堅・左）", ".225・0", "山縣秀（二塁）", ".222・0"], ["8", "井上広大（一塁）", ".171・7", "矢澤宏太（中堅・左）", ".221・3"], ["9", "山崎剛（遊撃・左）", ".226・1", "宮崎一樹（左翼）", ".077・1"], ["投", "ジャクソン（右）9勝8敗・防御率3.44", "", "福島蓮（右）5勝4敗・防御率3.35", ""]], "today": "# 今日の試合の基本情報（2026/9/28 時点。記事執筆の前提）\n\n- 試合：千葉ロッテマリーンズ（ホーム・後攻・1塁側）vs 北海道日本ハムファイターズ（ビジター・先攻・3塁側）\n- 日時：2026年9月28日（月） 16:00開場 / 18:00試合開始\n- 球場：ZOZOマリンスタジアム（屋外。海風が強い）\n- 天気予報：くもり時々雨（NPB公式の日程ページ表示）\n- 観戦席：1塁側 内野指定席B（Cゲート＝コアラゲート、フロア4）。企画「2026 秋の夜空にみんなで叫ぼう！特別招待」\n\n## 順位・状況（9/27終了時点）\n- ソフトバンクがリーグ3連覇を決定済み\n- 2位 西武、3位 日本ハム。差は1.5ゲームで、日本ハムの残りは2試合（9/28・10/1、ともにロッテ戦）\n- CSファーストステージ（10/10〜）は2位球団の本拠地で開催。日本ハム（76勝62敗3分・残り2）と西武（76勝59敗4分・残り4）は勝率で並べるため、日本ハムは2連勝しても西武が2勝すれば3位。今日日本ハムが負けて西武が勝つと日本ハムの3位が確定（CS出場自体は両球団とも決定済み）\n- ロッテは5位でCS進出の可能性なし。サブロー監督は就任1年目\n- 今季の対戦成績：日本ハムの13勝10敗\n- 前日9/27：ロッテ6-1日本ハム（高野脩が6回1失点、井上広大が決勝打）\n\n## 予告先発\n- ロッテ：アンドレ・ジャクソン（9勝8敗・防御率3.44。勝てば10勝目）\n- 日本ハム：福島蓮（5勝4敗・防御率3.35。7/12以来の先発、9月は救援7試合無失点）\n\n## 今日かかっている記録・話題\n- 清宮幸太郎（日）：通算100本塁打まであと1本（初本塁打はルーキーの2018/5/9）\n- 山口航輝（ロ）：32本塁打でパ・リーグ2位タイ。33号で単独2位。9/15に球団の日本人選手で落合博満以来40年ぶりの30本\n- 西川遥輝（日）：通算350盗塁まであと5\n- 益田直也（ロ）：今季に通算250セーブ（名球会入り）、通算800試合登板を達成済み\n- 離脱中：レイエス（日・右ハムストリングの肉離れ）、水谷瞬（日・左手の骨折）\n\n## 予想スタメン\n`data/players/` を参照（選手ごとに 特徴／見どころ／出立ち／プロまで／プロで／直近1年／直近数試合 の7項目）\n\n## 主な出典\n- NPB 日程・結果：https://npb.jp/games/2026/schedule_09_detail.html\n- パ・リーグ勝敗表：https://npb.jp/bis/2026/stats/std_p.html\n- 9/27 投打成績：https://npb.jp/scores/2026/0927/m-f-23/box.html\n"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[^"])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
function md(src){
  src = src.replace(/<!--[\s\S]*?-->/g,'');
  const out=[]; let list=null, para=[], table=null;
  const flush=()=>{ if(para.length){out.push('<p>'+inline(para.join(''))+'</p>');para=[]}
    if(list){out.push('<ul>'+list.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>');list=null}
    if(table){out.push('<div class="scroll"><table>'+table.filter(r=>!/^\|\s*-/.test(r)).map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>i?'<td>'+inline(c.trim())+'</td>':'<th>'+inline(c.trim())+'</th>').join('')+'</tr>').join('')+'</table></div>');table=null} };
  for(const raw of src.split('\n')){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){flush();continue}
    if(l.startsWith('|')){ if(!table){flush();table=[]} table.push(l); continue }
    if((m=l.trim().match(/^!\[([^\]]*)\]\((https:\/\/[^\s)]+)(?:\s+"([^"]*)")?\)$/))){flush();out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy" onerror="this.closest('figure').hidden=true"><figcaption>${esc(m[1])}${m[3]?`<br><span>${esc(m[3])}</span>`:''}</figcaption></figure>`);continue}
    if((m=l.match(/^(#{1,4}) (.+)/))){flush();const n=Math.max(3,m[1].length);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue}
    if((m=l.match(/^\s*[-*] (.+)/))){ if(para.length||table)flush(); (list=list||[]).push(m[1]); continue }
    if(list){flush()} para.push(l.trim());
  }
  flush(); return out.join('');
}

};
// 記事の見出し：その見出しの本文と、記事全体を添えて深掘りしてもらう
const deepSec = (id, head, text) => `${CTX}\n\n観戦ガイドの記事${artText(id)?'':'「'+id+'」'}を読んでいます。その中の見出し「${head}」について、もっと詳しく知りたいです。\n\n# 知りたい部分（見出し「${head}」の本文）\n-----\n${plain(text)}\n-----\n\n# 記事の全文（参考）\n-----\n${artText(id)}\n-----\n\nこの部分を、背景・具体的な数字や場面・よくある誤解・実際に球場で見るとどう見えるか、を足して詳しく説明してください。ガイドの記述に誤りや古い情報があれば指摘してください。${RULES}${TODAY()}`;
const deepPlayer = (p) => `${CTX}\n\n観戦ガイドの選手カード「${p.title}」（${p.team}・${p.section}）を読みました。\n\n-----\n${plain(p.body)}\n-----\n\nこの人物について、さらに詳しく教えてください。特に、(1) 今季の成績と最近の調子（直近の試合結果）、(2) 人柄がわかるエピソードや名言、(3) 今日の試合で注目すべき場面、を知りたいです。カードの記述に誤りや古い情報があれば指摘してください。${RULES}${TODAY()}`;
const deepPlayerSec = (p, head, text) => `${CTX}\n\n観戦ガイドの選手カード「${p.title}」（${p.team}）の「${head}」を読みました。\n\n# 知りたい部分\n-----\n${plain(text)}\n-----\n\n# カードの全文（参考）\n-----\n${plain(p.body)}\n-----\n\nこの部分を、Wikipedia・ニュース・高校野球や大学野球の記録なども調べて、具体的なエピソードや数字を足して詳しく教えてください。カードの記述に誤りや古い情報があれば指摘してください。${RULES}${TODAY()}`;
const newPlayer = (name, team) => `${CTX}\n\n${team}の「${name}」選手が今日出ています。観戦ガイドにこの選手のカードがないので、次の7項目で教えてください。\n- 特徴：\n- 見どころ：\n- 出立ち：（体格・背番号・投打など）\n- プロまで：\n- プロで：\n- 直近1年：\n- 直近数試合：${RULES}${TODAY()}`;

/* ---- 疑問ツリーとガイド ---- */
const allQ = {}; D.tree.forEach(c=>c.items.forEach(i=>{allQ[i.id]={...i,cat:c};i.children.forEach(ch=>allQ[ch.id]={...ch,parent:i.id,cat:c})}));
const has = id => !!D.articles[id];
const GUIDES = {
  basics: {title:'野球初心者ガイド', desc:'ルール、プレーのしくみ、選手の考えていること', cats:['1','2','3','4','8']},
  game:   {title:'ロッテ対日本ハムを楽しむガイド', desc:'今日の試合の見どころ、両チーム、応援', cats:['5','6']},
  stadium:{title:'マリーンズスタジアムガイド', desc:'ZOZOマリンのご飯、イベント、過ごし方', cats:['7']},
};
const BOARD_QS = ['4-01','1-07','1-06','4-02','1-04','1-05','2-12','2-13','1-08','1-09','2-02','2-14','2-11','2-10','2-09','2-17','4-03','4-04','4-06','5-06'];
const clean = t => t.replace(/🔍/g,'').replace(/[（(]→[^）)]*[）)]/g,'').trim();
function qBtn(q){
  if(q.id==='5-07' && !has(q.id)) return `<a class="q" href="#/lineup">${esc(clean(q.title))}<small>スタメンと選手カード</small></a>`;
  return has(q.id) ? `<a class="q" href="#/q/${q.id}">${esc(clean(q.title))}</a>`
                   : `<a class="q off" href="#/q/${q.id}">${esc(clean(q.title))}<small>準備中・GPTに聞けます</small></a>`;
}

/* ---- ライブ（写真・タップで更新。この端末だけに保存） ---- */
function loadLive(){ try{ return JSON.parse(localStorage.getItem('live')||'{}') }catch(e){ return {} } }
function saveLive(v){ try{ localStorage.setItem('live', JSON.stringify(v)); return true }catch(e){ return false } }
const norm = x => String(x).replace(/[（(].*$/,'').replace(/\s/g,'').replace(/髙/g,'高').replace(/﨑/g,'崎');
function findP(cell){ const name = norm(cell); if(!name) return -1;
  return D.players.findIndex(p=>{ const n=norm(p.name); return n===name || n.endsWith(name) || (name.length>=2 && name.startsWith(n)) }) }
function pLink(cell, team){ const i = findP(cell);
  return i<0 ? esc(norm(cell))+(team?' '+gptBtn(newPlayer(norm(cell),team),'カード'):'') : `<a href="#/p/${i}">${esc(norm(cell))}</a>` }
const POS = {'左翼':'左','中堅':'中','右翼':'右','一塁':'一','二塁':'二','三塁':'三','遊撃':'遊','捕手':'捕','指名':'指','投手':'投'};
const posOf = cell => { const m=String(cell).match(/[（(]([^・）)]+)/); return m ? (POS[m[1]]||m[1]) : '' };

function lineScore(sc){
  sc = sc||{}; const n=Math.max(9,(sc.lotte||[]).length,(sc.fighters||[]).length), cols=[...Array(n)].map((_,i)=>i+1);
  const g=(o,k)=>o&&o[k]!=null?esc(o[k]):'';
  const row=(lab,arr,k)=>`<tr><td class="team">${lab}</td>${cols.map(i=>`<td>${arr&&arr[i-1]!=null?esc(arr[i-1]):''}</td>`).join('')}<td class="r sum">${g(sc.R,k)}</td><td>${g(sc.H,k)}</td><td>${g(sc.E,k)}</td></tr>`;
  return `<div class="ls"><table><tr><th></th>${cols.map(i=>`<th>${i}</th>`).join('')}<th class="sum">R</th><th>H</th><th>E</th></tr>`+
    row('日ハム',sc.fighters,'fighters')+row('ロッテ',sc.lotte,'lotte')+'</table></div>';
}
function board(){
  const v = loadLive(), sc = v.score||{}, st = {B:0,S:0,O:0,bases:[0,0,0],...(sc.count||{}),...(v.state||{})};
  if(sc.bases && !(v.state&&v.state.bases)) st.bases = sc.bases;
  const lamps = (k,n,cls)=>`<span>${k}</span><button data-k="${k}" aria-label="${k}を変更">${[...Array(n)].map((_,i)=>`<span class="lamp ${i<st[k]?cls:''}"></span>`).join('')}</button>`;
  const pre = !v.score;
  return `<div class="board">
    <div class="top"><span class="inning">${esc(sc.inning||'試合前')}</span><span class="status">${pre?'18:00 プレーボール（先攻 日本ハム／後攻 ロッテ）':esc(sc.memo||'')}</span><span class="upd">${sc.updated?esc(sc.updated)+' 更新':''}</span></div>
    ${lineScore(sc)}
    <div class="sit">
      <div class="lamps">${lamps('B',3,'b')}${lamps('S',2,'s')}${lamps('O',2,'o')}</div>
      <div class="bases">${[3,2,1].map(b=>`<button class="b${b} ${st.bases[b-1]?'on':''}" data-base="${b}" aria-label="${b}塁"></button>`).join('')}</div>
      <div class="who">${sc.pitcher?'投手 '+esc(sc.pitcher)+'　':''}${sc.batter?'打者 '+esc(sc.batter):''}
        <div class="hint">ランプと塁はタップで変えられます ・ <a href="#/live">写真からスコアとスタメンを更新</a></div></div>
    </div></div>`;
}
function bindBoard(){
  document.querySelectorAll('.lamps button').forEach(b=>b.onclick=()=>{ const v=loadLive(), k=b.dataset.k, max={B:3,S:2,O:2}[k];
    const cur = {B:0,S:0,O:0,bases:[0,0,0],...((v.score||{}).count||{}),...(v.state||{})}; cur[k]=(cur[k]+1)%(max+1); v.state=cur; saveLive(v); home() });
  document.querySelectorAll('.bases button').forEach(b=>b.onclick=()=>{ const v=loadLive(), i=+b.dataset.base-1;
    const cur = {B:0,S:0,O:0,bases:[0,0,0],...((v.score||{}).count||{}),...(v.state||{})}; cur.bases=[...cur.bases]; cur.bases[i]=cur.bases[i]?0:1; v.state=cur; saveLive(v); home() });
}
function lineupCols(){
  const L = loadLive().lineup, useLive = L && (L.lotte||L.fighters);
  const rows = D.lineup.filter(r=>r[0]!=='投'), pit = D.lineup.find(r=>r[0]==='投')||[];
  const col = (team, key, idx, pcell) => {
    let items;
    if(useLive && L[key]) items = L[key].map(x=>({n:x.order??'', pos:x.pos||'', name:x.name||''}));
    else items = rows.map(r=>({n:r[0], pos:posOf(r[idx]), name:r[idx]}));
    const p = useLive && L.pitchers && L.pitchers[key] ? L.pitchers[key] : pcell;
    return `<div class="team-col"><h4>${team}<small>${useLive?'発表':'予想'}</small></h4><ol>${items.map(x=>`<li><span class="n">${esc(x.n)}</span><span class="pos">${esc(x.pos)}</span><span>${pLink(x.name, useLive?team:'')}</span></li>`).join('')}
      <li class="p"><span class="n"></span><span class="pos">投</span><span>${p?pLink(p, useLive?team:''):''}</span></li></ol></div>`;
  };
  return `<div class="lineup">${col('日本ハム','fighters',3,pit[3])}${col('ロッテ','lotte',1,pit[1])}</div>`;
}

/* ---- ページ ---- */
function home(){
  PROMPTS.length = 0;
  let h = `<div class="guides">
    <a class="guide" href="#/g/basics"><b>野球初心者ガイド</b><span>ルールとしくみ</span></a>
    <a class="guide" href="#/g/game"><b>ロッテ対日本ハムを楽しむガイド</b><span>今日の見どころ</span></a></div>`;
  h += `<p class="eyebrow">速報</p>${board()}`;
  h += `<p class="section-title">スタメン</p>${lineupCols()}<p class="lead" style="margin-top:8px">名前を押すと選手カードが開きます。<a href="#/lineup">選手・監督カードの一覧</a></p>`;
  h += `<p class="section-title">この画面の見方がわからないとき</p><div class="qs">${BOARD_QS.filter(id=>allQ[id]).map(id=>qBtn(allQ[id])).join('')}</div>`;
  h += `<p class="section-title">球場のこと</p><div class="guides"><a class="guide wide" href="#/g/stadium"><b>マリーンズスタジアムガイド</b></a></div>`;
  $('#app').innerHTML = h; bindBoard();
}
function guide(key){
  const g = GUIDES[key]; if(!g) return home();
  let h = `<a class="back" href="#/">← トップ</a><h1>${esc(g.title)}</h1><p class="lead">${esc(g.desc)}</p>`;
  if(key==='game') h += `<div class="qs" style="margin-bottom:8px"><a class="q" href="#/lineup">スタメンと選手カード<small>両チームと監督</small></a><a class="q" href="#/today">今日の試合データ<small>順位・予告先発・記録</small></a></div>`;
  D.tree.filter(c=>g.cats.includes(c.no)).forEach(c=>{
    h += `<p class="section-title">${esc(c.title)}</p><div class="qs">${c.items.map(qBtn).join('')}</div>`;
  });
  $('#app').innerHTML = h;
}
function guideOf(q){ const no = q.cat&&q.cat.no; return Object.keys(GUIDES).find(k=>GUIDES[k].cats.includes(no)) }
function article(id){
  const q = allQ[id]||{title:id}, a = D.articles[id], title = clean(a&&a.meta.title||q.title);
  const back = q.parent ? `#/q/${q.parent}` : (guideOf(q) ? `#/g/${guideOf(q)}` : '#/');
  const backLabel = q.parent ? clean(allQ[q.parent].title) : (guideOf(q) ? GUIDES[guideOf(q)].title : 'トップ');
  let h = `<a class="back" href="${back}">← ${esc(backLabel)}</a><p class="eyebrow">${esc(q.cat?q.cat.title:'')}</p><h1>${esc(title)}</h1>`;
  if(!a){ h += `<div class="note">この記事はまだ準備中です。下のボタンを押すと、この疑問と、関係する記事・今日の試合データをまとめた質問文がコピーされます。ChatGPT に貼ると、ガイドと同じ形で答えてもらえます。</div>${gptBtn(askQ(q),'この疑問をGPTに聞く（プロンプトをコピー）')}` }
  else{
    if(a.meta.needs_check) h += '<div class="note">この記事には、まだ公式情報で確認できていない内容が含まれます。</div>';
    h += '<div class="article">';
    a.body.split(/^(?=## )/m).forEach(sec=>{ const m=sec.match(/^## (.+)\n?([\s\S]*)$/);
      h += m ? `<div class="sec-head"><h2>${inline(m[1])}</h2>${gptBtn(deepSec(id, m[1], m[2]),'ここを詳しく聞く')}</div>${md(m[2])}` : md(sec) });
    h += '</div>';
    const src = a.meta.sources||[]; if(src.length) h += `<hr><p class="eyebrow">出典</p><div class="src">${src.map(inline).join('<br>')}</div>`;
  }
  const kids = (q.children||[]).map(c=>allQ[c.id]);
  if(kids.length) h += `<p class="section-title">さらに気になる？</p><div class="qs">${kids.map(qBtn).join('')}</div>`;
  const rel = ((a&&a.meta.related)||[]).filter(r=>allQ[r]);
  if(rel.length) h += `<p class="section-title">関連する疑問</p><div class="qs">${rel.map(r=>qBtn(allQ[r])).join('')}</div>`;
  if(id.startsWith('5-07')||id.startsWith('4-02')) h += '<p style="margin-top:20px"><a href="#/lineup">スタメンと選手カードを見る</a></p>';
  $('#app').innerHTML = h;
}
function lineup(){
  let h = `<a class="back" href="#/">← トップ</a><h1>スタメンと選手カード</h1><p class="lead">予想スタメンは試合前の発表で変わります。発表後は<a href="#/live">写真から更新</a>できます。</p>${lineupCols()}`;
  let last='';
  D.players.forEach((p,i)=>{ const g=p.team+'｜'+p.section; if(g!==last){h+=(last?'</div>':'')+`<p class="section-title">${esc(g)}</p><div class="qs">`;last=g}
    h+=`<a class="q" href="#/p/${i}">${esc(p.name)}<small>${esc(p.title.replace(p.name,'').replace(/^[（(]|[）)]$/g,''))}</small></a>` });
  if(last) h += '</div>';
  $('#app').innerHTML = h;
}
function player(i){
  const p = D.players[i]; if(!p) return lineup();
  let h = `<a class="back" href="#/lineup">← スタメンと選手カード</a><p class="eyebrow">${esc(p.team)}｜${esc(p.section)}</p><h1>${esc(p.title)}</h1><p>${gptBtn(deepPlayer(p),'この選手をGPTで深掘り')}</p><div class="article">`;
  p.body.split(/^(?=### )/m).forEach(sec=>{ const m=sec.match(/^### (.+)\n?([\s\S]*)$/);
    h += m ? `<div class="sec-head"><h2>${inline(m[1])}</h2>${gptBtn(deepPlayerSec(p, m[1], m[2]),'ここを詳しく聞く')}</div>${md(m[2])}` : md(sec) });
  $('#app').innerHTML = h + '</div>';
}
const PHOTO_PROMPT = `${CTX}\n\n添付した写真（球場のビジョンのスタメン表、またはスコアボード）を読み取って、観戦ガイドに貼り付けるデータを作ってください。\n\n# 出力のしかた（厳守）\n- 次の形のJSONだけを、1つのコードブロックで出してください。説明はコードブロックの外に短く\n- 写っていない項目は省略してください（推測で埋めない）。読み取れない文字は「?」にしてください\n- 選手名はフルネームの漢字（外国人選手はカタカナ）。守備位置は「投 捕 一 二 三 遊 左 中 右 指」の1文字\n- fighters＝日本ハム（先攻）、lotte＝ロッテ（後攻）。取り違えないこと\n\n## スタメン表の写真のとき\n{"lineup": {"lotte": [{"order": 1, "pos": "左", "name": "西川史礁"}], "fighters": [{"order": 1, "pos": "遊", "name": "水野達稀"}], "pitchers": {"lotte": "ジャクソン", "fighters": "福島蓮"}}}\n（片方のチームしか写っていなければ、そのチームだけ）\n\n## スコアボードの写真のとき\n{"score": {"inning": "5回裏", "fighters": [0, 0, 1, 0, 0], "lotte": [0, 2, 0, 0], "R": {"fighters": 1, "lotte": 2}, "H": {"fighters": 4, "lotte": 6}, "E": {"fighters": 0, "lotte": 1}, "count": {"B": 1, "S": 2, "O": 1}, "bases": [1, 0, 0], "pitcher": "福島蓮", "batter": "山口航輝", "memo": "球速など、ボードに出ている情報を短く"}}\n（まだ攻撃していない回は配列に入れない。bases は1塁・2塁・3塁の順に、ランナーがいれば1）\n\n最後に、コードブロックの外で「この状況で初心者が見るポイント」を2〜3行で書いてください。`;
const SCORE_ASK = sc => `${CTX}\n\n今の試合状況は次のとおりです（fighters＝日本ハム・先攻、lotte＝ロッテ・後攻）。\n${JSON.stringify(sc)}\n\nこの状況を初心者向けに解説してください。どちらが有利か、次の見どころ、日本ハムの2位争い（西武との差）への影響を、ウェブ検索で今日の西武戦の途中経過も確認したうえで教えてください。${RULES}${TODAY()}`;
function live(){
  const v = loadLive();
  let h = `<a class="back" href="#/">← トップ</a><h1>写真から更新</h1><p class="lead">写真を ChatGPT に読んでもらい、返ってきた内容をここに貼ると、トップのスコアとスタメンが変わります。</p>
  <ol><li>ビジョンのスタメン表やスコアボードを写真に撮る</li><li>下のボタンでプロンプトをコピーし、ChatGPT に<b>写真と一緒に</b>送る</li><li>返ってきたコードブロックの中身（{ から } まで）をコピーして、下の欄に貼って「反映」</li></ol>
  <p>${gptBtn(PHOTO_PROMPT,'写真読み取りプロンプトをコピー')}</p>
  <textarea id="livein" placeholder='{"lineup": …} または {"score": …} を貼る'></textarea>
  <div><button class="btn" id="apply">反映</button><button class="btn sub" id="clear">全部消す</button></div><p id="msg" class="lead"></p>
  <div id="confirm" hidden class="note">写真から更新したスタメンとスコアを消します。<br><button class="btn" id="yes">消す</button><button class="btn sub" id="no">やめる</button></div>`;
  if(v.score) h += `<p class="section-title">いまの状況を解説してもらう</p><p>${gptBtn(SCORE_ASK(v.score),'この状況をGPTに解説してもらう')}</p>`;
  h += '<p class="lead">データはこの端末のこのブラウザにだけ保存されます。</p>';
  $('#app').innerHTML = h;
  $('#apply').onclick = ()=>{
    const t = $('#livein').value; let obj;
    try{ obj = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}')+1)) }catch(e){ $('#msg').textContent='JSON として読めませんでした。コードブロックの中身だけを貼ってください。'; return }
    if(!obj.lineup && !obj.score){ $('#msg').textContent='"lineup" か "score" が見つかりませんでした。'; return }
    const now = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); const cur = loadLive();
    if(obj.lineup){ cur.lineup = {...(cur.lineup||{}), ...obj.lineup, updated: now} }
    if(obj.score){ cur.score = {...obj.score, updated: now}; delete cur.state }
    $('#msg').textContent = saveLive(cur) ? '反映しました。トップに戻ると確認できます。' : '保存できませんでした（プライベートブラウズでは保存できないことがあります）。';
  };
  $('#clear').onclick = ()=>{ $('#confirm').hidden=false };
  $('#no').onclick = ()=>{ $('#confirm').hidden=true };
  $('#yes').onclick = ()=>{ saveLive({}); live() };
}
function route(){
  PROMPTS.length = 0;
  const h = location.hash.slice(2).split('/');
  if(h[0]==='q') article(h[1]); else if(h[0]==='g') guide(h[1]); else if(h[0]==='lineup') lineup(); else if(h[0]==='p') player(+h[1]); else if(h[0]==='live') live();
  else if(h[0]==='today') $('#app').innerHTML='<a class="back" href="#/g/game">← ロッテ対日本ハムを楽しむガイド</a><h1>今日の試合データ</h1><div class="article">'+md(D.today.replace(/^# .+\n/,''))+'</div>';
  else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
</script>
