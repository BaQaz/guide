<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロッテ×日本ハム観戦ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f4f6f6; --ink:#08131a; --sub:#5d6a70; --line:#e2e7e9; --accent:#18917e; --accent-ink:#ffffff;
  --board:#0f1d19; --board-line:#26372f; --board-ink:#e9efe9; --led:#ffd449; --ball:#3fd26a; --strike:#ffd449; --out:#ff5a4f; --lamp-off:#2c3b35;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
header .meta{margin-left:auto;color:var(--sub);font-size:.78rem}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;line-height:1.5;margin:.2em 0 .5em;text-wrap:balance}
h2{font-size:1.2rem;line-height:1.5;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:1.4em 0 .3em}
p{margin:0 0 1.1em}
a{color:var(--accent)}
.lead{color:var(--sub);font-size:.88rem;line-height:1.7}
.eyebrow{font-size:.75rem;color:var(--sub);letter-spacing:.08em;margin:0 0 4px}
.back{display:inline-block;margin-bottom:14px;font-size:.88rem;color:var(--sub);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px}
.section-title{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:30px 0 10px}

/* ガイド切り替え（TOP上部） */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.guide{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);background:var(--bg)}
.guide b{font-size:.98rem;line-height:1.45}
.guide span{font-size:.75rem;color:var(--sub)}
.guide:hover,.q:hover{border-color:var(--accent)}
.guide.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}
.guide.wide span{margin-left:auto}

/* 質問ボタン（横2列） */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.5;font-weight:700}
.q small{font-weight:400;font-size:.72rem;color:var(--sub)}
.q.off{background:var(--surface);color:var(--sub);font-weight:400}
.q .mark{color:var(--accent);font-size:.72rem;font-weight:700}

/* 速報ボード */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.board .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.board .inning{font-family:"Roboto Mono",ui-monospace,monospace;color:var(--led);font-weight:700;font-size:1.05rem}
.board .status{font-size:.78rem;opacity:.8}
.board .upd{margin-left:auto;font-size:.72rem;opacity:.7}
.board a{color:var(--led)}
.ls{overflow-x:auto}
.ls table{border-collapse:collapse;width:100%;font-family:"Roboto Mono",ui-monospace,monospace}
.ls th,.ls td{border-bottom:1px solid var(--board-line);padding:5px 1px;text-align:center;font-size:.9rem}
.ls th{font-weight:500;opacity:.65;font-size:.75rem}
.ls td.team{font-size:.8rem;text-align:left;font-family:"Noto Sans JP",sans-serif;font-weight:700;white-space:nowrap;padding-right:8px}
.ls td.r{color:var(--led);font-weight:700}
.ls td.sum{border-left:1px solid var(--board-line)}
.sit{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lamps{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:.85rem}
.lamps button{all:unset;display:flex;gap:6px;cursor:pointer;padding:2px 0}
.lamps button:focus-visible,.bases button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.lamp{width:15px;height:15px;border-radius:50%;background:var(--lamp-off)}
.lamp.b{background:var(--ball)}.lamp.s{background:var(--strike)}.lamp.o{background:var(--out)}
.bases{position:relative;width:96px;height:78px;justify-self:end}
.bases button{all:unset;position:absolute;width:26px;height:26px;transform:rotate(45deg);border:2px solid var(--board-ink);opacity:.55;cursor:pointer}
.bases button.on{background:var(--led);border-color:var(--led);opacity:1}
.bases .b1{right:6px;top:30px}.bases .b2{left:35px;top:4px}.bases .b3{left:6px;top:30px}
.who{font-size:.82rem;line-height:1.6;opacity:.9;grid-column:1/-1}
.hint{font-size:.72rem;opacity:.65}

/* スタメン */
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-col{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.team-col h4{margin:0;padding:8px 10px;font-size:.85rem;background:var(--surface);display:flex;justify-content:space-between}
.team-col h4 small{font-weight:400;color:var(--sub)}
.team-col ol{list-style:none;margin:0;padding:0}
.team-col li{display:grid;grid-template-columns:1.3em 1.6em 1fr;gap:4px;padding:6px 10px;border-top:1px solid var(--line);font-size:.86rem;line-height:1.5;font-variant-numeric:tabular-nums}
.team-col li .n{color:var(--sub)}
.team-col li .pos{color:var(--sub);font-size:.78rem}
.team-col li a{color:var(--ink);text-decoration:none;font-weight:700}
.team-col li.p{background:var(--surface)}

/* 記事 */
.article h2{margin:2.2em 0 .6em}
.sec-head{display:flex;align-items:flex-start;gap:10px;margin:2.2em 0 .7em}
.sec-head h2{margin:0;flex:1}
.gpt{font:inherit;font-size:.74rem;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:7px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.gpt svg{width:12px;height:12px}
.gpt:hover{color:var(--accent);border-color:var(--accent)}
.gpt.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gpt:focus-visible,.q:focus-visible,.guide:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:.86rem;line-height:1.7;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.article table th,.article table td,.plain th,.plain td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
ul,ol{padding-left:1.3em;margin:0 0 1.1em}
li{margin:.2em 0}
.src{font-size:.78rem;color:var(--sub);word-break:break-all;line-height:1.7}
mark{background:linear-gradient(transparent 55%,#fff176 55%);color:inherit;padding:0 1px}
strong{font-weight:700}
figure{margin:20px 0}figure img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:8px;background:var(--surface)}
figcaption{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:6px}figcaption span{font-size:.72rem}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.btn{font:inherit;font-size:.9rem;border:0;border-radius:999px;padding:9px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin:4px 6px 4px 0}
.btn.sub{background:var(--surface);color:var(--ink)}
@media (max-width:380px){.lineup{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const D = {"tree": [{"no": "1", "title": "野球ってそもそも？（はじめの一歩）", "items": [{"id": "1-01", "title": "野球って何？", "star": true, "check": false, "children": [{"id": "1-01-a", "title": "何人でやるの？", "check": false}, {"id": "1-01-b", "title": "勝ち負けはどう決まる？引き分けはある？", "check": false}, {"id": "1-01-c", "title": "1試合は何時間くらい？今日は何時に終わりそう？", "check": false}, {"id": "1-01-d", "title": "延長戦って？何回までやるの？🔍", "check": true}]}, {"id": "1-02", "title": "野球ってなんで流行ったの？", "star": false, "check": false, "children": [{"id": "1-02-a", "title": "日本に野球が来たのはいつ？", "check": false}, {"id": "1-02-b", "title": "プロ野球はいつ始まった？", "check": false}, {"id": "1-02-c", "title": "甲子園（高校野球）とプロの関係は？", "check": false}, {"id": "1-02-d", "title": "メジャーリーグ（大谷翔平など）とのつながりは？", "check": false}]}, {"id": "1-03", "title": "どんな感じで進むの？", "star": true, "check": false, "children": [{"id": "1-03-a", "title": "1打席ってどう進む？", "check": false}, {"id": "1-03-b", "title": "攻撃と守備が入れ替わるのはいつ？", "check": false}, {"id": "1-03-c", "title": "試合が止まるのはどんなとき？（投手交代・リクエスト・雨）", "check": false}]}, {"id": "1-04", "title": "オモテとウラって何？", "star": true, "check": false, "children": [{"id": "1-04-a", "title": "なぜホームチームが後攻なの？", "check": false}, {"id": "1-04-b", "title": "9回ウラをやらない試合があるのはなぜ？", "check": false}, {"id": "1-04-c", "title": "サヨナラって？", "check": false}]}, {"id": "1-05", "title": "1回2回（イニング）って何？", "star": true, "check": false, "children": [{"id": "1-05-a", "title": "ラッキーセブンって？", "check": false}, {"id": "1-05-b", "title": "雨で試合が終わる「コールド」って？🔍", "check": true}, {"id": "1-05-c", "title": "何回まであるの？9回で終わらないことは？", "check": false}, {"id": "1-05-d", "title": "1イニングは何分くらい？", "check": false}]}, {"id": "1-06", "title": "塁って？", "star": true, "check": false, "children": [{"id": "1-06-a", "title": "一塁・二塁・三塁・本塁はどこ？", "check": false}, {"id": "1-06-b", "title": "満塁って？", "check": false}, {"id": "1-06-c", "title": "得点圏って？", "check": false}, {"id": "1-06-d", "title": "残塁って？", "check": false}]}, {"id": "1-07", "title": "SBOや青・黄・赤に光るあれは何？", "star": true, "check": false, "children": [{"id": "1-07-a", "title": "カウントはどの順番で読む？（ボール→ストライク）", "check": false}, {"id": "1-07-b", "title": "フルカウントって？", "check": false}, {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "check": false}]}, {"id": "1-08", "title": "アウトってどうやって取るの？", "star": true, "check": false, "children": [{"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "check": false}, {"id": "1-08-b", "title": "フライとゴロって？", "check": false}, {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "check": false}]}, {"id": "1-09", "title": "点ってどうやって入るの？", "star": true, "check": false, "children": [{"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "check": false}, {"id": "1-09-b", "title": "打点って？", "check": false}, {"id": "1-09-c", "title": "1回に何点でも入るの？", "check": false}, {"id": "1-09-d", "title": "ランナーがホームに滑り込むのはなぜ？", "check": false}]}, {"id": "1-10", "title": "試合前に何をしてるの？（練習・スタメン発表・始球式）", "star": true, "check": false, "children": [{"id": "1-10-a", "title": "試合前の練習はどこから見られる？", "check": false}, {"id": "1-10-b", "title": "スタメン発表はいつ？", "check": false}, {"id": "1-10-c", "title": "始球式って？", "check": false}]}, {"id": "1-11", "title": "ボールやバットって？", "star": true, "check": false, "children": [{"id": "1-11-a", "title": "ボールの重さや大きさは？", "check": false}, {"id": "1-11-b", "title": "木のバットが折れるのはなぜ？", "check": false}, {"id": "1-11-c", "title": "ファウルボールはもらえるの？", "check": false}]}, {"id": "1-12", "title": "「タイム」で試合が止まるのはなぜ？", "star": true, "check": false, "children": [{"id": "1-12-a", "title": "マウンドに人が集まるのはなぜ？", "check": false}, {"id": "1-12-b", "title": "1試合に何回まで集まっていい？🔍", "check": true}, {"id": "1-12-c", "title": "投球の時間制限（ピッチクロック）はある？🔍", "check": true}]}, {"id": "1-13", "title": "野球の1年ってどう進むの？", "star": false, "check": false, "children": [{"id": "1-13-a", "title": "1チーム何試合するの？", "check": false}, {"id": "1-13-b", "title": "キャンプ・オープン戦って？", "check": false}, {"id": "1-13-c", "title": "オフシーズンは何をしてる？", "check": false}]}]}, {"no": "2", "title": "打つ・投げる・守る（プレーの仕組み）", "items": [{"id": "2-01", "title": "何点入ることが多いの？", "star": false, "check": false, "c ことが普通だ。\n\n## 今日の試合で見るなら\nロッテの守備では、アンドレ・ジャクソンが投手、佐藤都志也が捕手に入る予想だ。日本ハムの攻撃が始まったら、まず「投手と捕手の2人」と、その後ろに広がる7人を見ると、9人の役割がつかみやすいのだ。"}, "1-01-b": {"meta": {"id": "1-01-b", "title": "勝ち負けはどう決まる？引き分けはある？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-01-d", "1-04-b", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n試合が終わった時点で、得点の多いチームが勝ちだ。同点のまま規定の回まで終われば、NPBの公式戦では引き分けも記録される。\n\n## しくみ\n得点は、走者が一塁、二塁、三塁を回って本塁に戻ると1点ずつ入る。途中まで何本ヒットを打っていても、最終的にはこの得点の合計で勝敗が決まるのだ。\n\n9回を終えて同点なら、そこで必ず終わるとは限らない。延長戦（9回で決着しないときに追加で行う回）に入る場合がある。2026年のパ・リーグ勝敗表にも「分」という欄があり、引き分けは実際に順位計算へ残る。\n\n## 今日の試合で見るなら\n今日は日本ハムが3位、ロッテが5位で迎える試合だ。日本ハムは2位西武を追っているので、終盤に同点なら「負けない」だけでなく「勝ち切れるか」が大きな意味を持つ。\n\nたとえば清宮幸太郎の一打で同点になっても、それだけでは勝ちではない。最後にスコアボードの合計得点がどちらに傾いたかを見るのだ。"}, "1-01-c": {"meta": {"id": "1-01-c", "title": "1試合は何時間くらい？今日は何時に終わりそう？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-01-d", "1-03-c"], "sources": ["https://npb.jp/statistics/2026/time.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日は18時開始なので、目安は21時すぎだ。2026年のパ・リーグは、9回で終わった試合の平均が3時間03分、延長などを含む全試合平均が3時間08分となっている。\n\n## しくみ\n野球には「90分で終了」のような固定時間がない。3アウトを取るまで攻撃が続くので、打者がよく出塁する試合、投手交代が多い試合、延長戦に入る試合ほど長くなりやすいのだ。\n\nNPB公式の9月27日時点の数字を18時に足すと、9回試合の平均なら21時03分ごろ、全試合平均なら21時08分ごろになる。ただし平均は予定時刻ではない。雨で中断すれば、その時間だけ終了も後ろへずれる。\n\n## 今日の試合で見るなら\n先発はロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。福島は救援（試合の途中から投げる役割）から先発（試合の最初に投げる役割）へ戻る登板だ。早い回から継投（投手を次々に交代すること）になれば、平均より長くなる材料になる。\n\n帰りの時間は21時台を目安にしつつ、延長や雨の中断で遅くなる場合も見込んでおくとよいのだ。"}, "1-01-d": {"meta": {"id": "1-01-d", "title": "延長戦って？何回までやるの？", "category": "1", "level": "2", "priority": "normal", "needs_check": true, "related": ["1-01-b", "1-01-c"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/history/2026/review_rec_p.html", "https://www.nippon.com/ja/news/kd1471489503175951051/"]}, "body": "## ひとことで\n延長戦は、9回を終えて同点のときに追加で行う回のことだ。2026年にも12回まで進んだ公式戦がNPBの記録に残っている。\n\n## しくみ\n10回、11回と、通常の回と同じように表と裏の攻撃を続ける。どこまで行うかは大会や年度の規定で決まるので、「野球はいつでも同じ上限」と考えないほうがよいのだ。\n\n<!-- TODO: 2026年のセ・パ公式戦について、延長の上限と上限到達時の引き分けを定めたNPBまたはパ・リーグの規定本文を公式ページで確認 -->\n\n2026年のNPB公式記録には12回の試合が複数ある。たとえば9月12日の西武対日本ハムは、延長十二回を終えて3-3の引き分けだった。ただし、今回確認できた公式ページでは、「レギュラーシーズンは何回を上限とするか」を定めた規定本文そのものを特定できなかった。そのため、上限はここでは断定しない。\n\n## 今日の試合で見るなら\n9回が終わって同点なら、「もう終わり」と席を立つ前に場内表示を確認するのだ。清宮幸太郎や山口航輝の一打で終盤に同点へ動けば、その先に追加の回が続く可能性がある。"}, "1-01": {"meta": {"id": "1-01", "title": "野球って何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-01-a", "1-01-b", "1-01-c", "1-01-d"], "related": ["1-03", "1-05", "1-06", "1-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球は、2チームが交代で「点を取りにいく側」と「止める側」になり、最後に得点の多いほうが勝つ競技なのだ。攻撃では打った人が一塁、二塁、三塁、本塁と進み、本塁まで戻ると1点になる。\n\n## しくみ\n試合は回（イニング：攻撃と守備を1度ずつ行う区切り）に分かれる。1回の表は先攻チーム、裏は後攻チームが攻撃し、これを基本的に9回まで繰り返すのだ。\n\n攻撃側は打者が順番に打席へ入る。ボールを打って塁に出たり、四球（フォアボール：ボール球が4つになって一塁へ進むこと）などで走者になったりして、本塁を目指す。\n\n守備側には9人がいて、投手が投げ、捕手や内野手、外野手が打球を処理する。3つアウトを取ると、その回の攻撃は終わる。だから野球は、「3アウトになる前に、何人を本塁へ帰せるか」を何度も比べる競技だと考えると分かりやすい。\n\nサッカーのように時計がゼロになって終わるのではない。アウトという区切りを積み重ねて進むので、試合時間は毎回変わるのだ。\n\n## おもしろエピソード\n同じ「1点」でも作り方はいろいろある。長打（二塁打や本塁打のように、一気に2つ以上の塁へ進める当たり）を重ねても、四球と小さな打球をつないでも、走者が本塁を踏めば得点は同じ1点なのだ。\n\n## 今日の試合で見るなら\n18時に始まる今日は、日本ハムが先攻、ロッテが後攻だ。最初は日本ハムの水野達稀らが打ち、ロッテ先発のアンドレ・ジャクソンと9人の守備が止めにいく。\n\nその攻撃で3アウトになると、今度はロッテの西川史礁や山口航輝が、日本ハム先発の福島蓮に向かう。まずは「どちらが攻撃中か」「走者はどの塁か」「アウトはいくつか」の3つだけ追えば、試合の骨組みが見えるのだ。"}, "1-02-a": {"meta": {"id": "1-02-a", "title": "日本に野球が来たのはいつ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-02", "1-02-b"], "sources": ["https://baseball-museum.or.jp/exhibitions/history/", "https://npb.jp/archives/japanesebaseball150th/history/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==日本にベースボールが伝わったのは**1872年**なのだ。== アメリカ人教師の**ホーレス・ウィルソン**が、学校の生徒に教えたのが始まりとされている。\n\n## しくみ\n当時の日本には、今のようなプロ野球も甲子園もなかった。まず学校で遊びや運動として広まり、その後に大学や地域のチームが増えていった。\n\n==最初から「観るための興行」だったのではなく、先に自分たちでプレーする文化が育ったのだ。== 大きな大会やプロの試合は、そのあとに生まれた。\n\n## 歴史・由来\n野球殿堂博物館は、1872年に第一大学区第一番中学の教師だったウィルソンが生徒へベースボールを伝えたと紹介している。翌年には運動場が整い、試合ができるようになった。\n\n## 今日の試合で見るなら\n今日、ロッテの**アンドレ・ジャクソン**が日本ハムの打者へ投げる1球も、その歴史の延長線上にある。==あなたがZOZOマリンで見るのは、154年前に学校から始まった競技の現在形なのだ。=="}, "1-02-b": {"meta": {"id": "1-02-b", "title": "プロ野球はいつ始まった？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-02", "1-02-a"], "sources": ["https://npb.jp/slogan/2004/", "https://npb.jp/archives/japanesebaseball150th/history/", "https://npb.jp/bis/yearly/yakyuremmei_1936s.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今のNPBにつながる日本プロ野球の歴史は、NPBでは**1934年**から数えている。==全国的なリーグ戦が始まったのは**1936年**なのだ。==\n\n## しくみ\n少しややこしいのは、「最初のプロチーム」と「今につながるプロ野球」が同じ年ではないことだ。日本初のプロチームは1920年に誕生したが、のちに解散した。\n\n1934年には**大日本東京野球倶楽部**が設立された。現在の読売ジャイアンツにつながる球団で、NPBはここを日本プロ野球の歴史の始まりとしている。\n\nさらに1936年、**日本職業野球連盟**が7球団で発足した。==ここから公式のリーグ戦が始まり、現在のセ・リーグ、パ・リーグへつながっていくのだ。==\n\n## 歴史・由来\n1936年のリーグ戦には東京巨人、大阪タイガース、阪急など7球団が参加した。球団名や仕組みは変わっても、同じ相手と年間を通じて勝敗を競う土台はこの時代にできた。\n\n## 今日の試合で見るなら\n今日の予告先発は、ロッテが**アンドレ・ジャクソン**、日本ハムが**福島蓮**だ。==2人の勝敗が同じリーグの公式記録として積み上がるのも、1936年から続く「リーグ戦」の仕組みがあるからなのだ。=="}, "1-02-c": {"meta": {"id": "1-02-c", "title": "甲子園（高校野球）とプロの関係は？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-02", "1-02-b"], "sources": ["https://www.jhbf.or.jp/pro-aspiring/2026.html", "https://www.jhbf.or.jp/summary/proteam/rule_proteam.html", "https://draft.npb.jp/draft/2026/", "https://npb.jp/news/detail/20260819_01.html", "https://npb.jp/bis/players/41545136.html", "https://draft.npb.jp/draft/2017/draftlist_f.html"]}, "body": "## ひとことで\n**甲子園**（高校野球の全国大会）とプロ野球は、別の大会、別の組織だ。==ただし高校生が卒業後にプロへ進む道はあり、その入口が**プロ野球志望届**とドラフトなのだ。==\n\n## しくみ\n甲子園に出たから、自動的にプロへ行けるわけではない。逆に甲子園に出ていなくても、条件を満たして志望届を出せば**ドラフト**（球団が新人選手との交渉権を得る会議）の対象になりうる。\n\n高校野球部員がプロ球団との交渉や入団テストを希望する場合は、先にプロ野球志望届を提出する決まりがある。==2026年も日本高野連が提出者を公表しており、NPBのドラフト会議は10月22日に予定されている。==\n\n## 歴史・由来\n高校野球は学校の大会、NPBは職業として野球をするリーグだ。役割は別だが、高校で活躍した選手がドラフトを経てプロへ進むことで、観る側には物語がつながって見えるのだ。\n\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**は早稲田実業から2017年ドラフト1位で入団した選手だ。今日の時点で通算100本塁打まであと1本に迫っている。\n\n==高校時代から知っている選手を、何年後もプロで追える。== それが高校野球とプロ野球の大きなつながりのひとつなのだ。"}, "1-02-d": {"meta": {"id": "1-02-d", "title": "メジャーリーグ（大谷翔平など）とのつながりは？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-02", "1-02-c"], "sources": ["https://www.mlb.com/glossary/transactions/japanese-posting-system", "https://www.mlb.com/news/a-look-at-the-history-of-shohei-ohtani-c262589034", "https://www.mlb.com/press-release/mlb-clubs-ratify-new-posting-system-agreement-with-npb-262712102", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**NPB**と**MLB**（アメリカ・カナダの最高峰リーグ）は別のリーグだが、選手は条件を満たせば移れる。==大谷翔平も日本ハムでプレーしたあと、ポスティングを使ってMLBへ進んだのだ。==\n\n## しくみ\nNPBの選手がMLBへ行く道のひとつが**ポスティング**だ。所属するNPB球団が選手を、MLB球団と契約交渉できる対象として出す仕組みなのだ。\n\n国際FA（一定の在籍期間を満たし、海外球団とも自由に交渉できる資格）を得る前でも、所属球団が認めれば利用できる。交渉が成立すると、MLB球団から元のNPB球団へ譲渡金が支払われる。\n\n**大谷翔平**は2012年に日本ハムからドラフト1位指名を受け、投手と打者の両方でプレーした。==2017年オフに日本ハムがポスティングし、MLBへ移ったのだ。==\n\n## 今日の試合で見るなら\n今日の相手、日本ハムは大谷がNPB時代に所属した球団だ。**福島蓮**や**清宮幸太郎**がいる同じ球団で、大谷もプロ野球選手として経験を積んだ。\n\n==NPBとMLBは完全に別の世界ではなく、選手の進路でつながっている。== 今日ZOZOマリンで見る選手も、その大きな流れの中でプレーしているのだ。"}, "1-02": {"meta": {"id": "1-02", "title": "野球ってなんで流行ったの？", "category": "1", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["1-02-a", "1-02-b", "1-02-c", "1-02-d"], "related": ["1-01", "8-01"], "sources": ["https://npb.jp/archives/japanesebaseball150th/history/", "https://baseball-museum.or.jp/exhibitions/history/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/teams/index_m.html"]}, "body": "## ひとことで\n==日本の野球は、学校で広まり、大会と放送で「見る文化」が育ち、プロ野球で長く応援できる形になったのだ。== ひとつの出来事で急に流行ったのではなく、野球に触れる入口が少しずつ増えていった。\n\n## しくみ\n日本に**ベースボール**が伝わったのは1872年だ。最初は学校で教えられたので、まず「自分でやるスポーツ」として若い人の間に広がった。\n\n1915年には、今の夏の甲子園につながる**全国中等学校優勝野球大会**が始まった。==地元や学校という「応援する理由」ができたことで、プレーしない人にも野球が届きやすくなったのだ。==\n\n1927年には夏の大会がラジオで実況された。球場へ行かなくても試合を追えるようになり、野球は家でも楽しめる娯楽になっていった。\n\n1936年には、今のNPBにつながる**日本職業野球連盟**が7球団で発足した。学校、大会、放送、プロという入口が重なり、「する人」だけでなく「見る人」も増えたというわけだ。\n\n## 歴史・由来\n1872年、アメリカ人教師の**ホーレス・ウィルソン**が生徒にベースボールを教えたことが、日本の野球伝来として記録されている。その後、大学、高校、社会人、プロへと舞台が増えた。\n\n==夏の甲子園につながる大会は、全国的なプロ野球リーグより約20年早く始まっている。== 日本では、高校野球の人気が先に育ち、その後にプロのリーグが大きくなった面もあるのだ。\n\n## おもしろエピソード\n今の球場観戦には、学校野球、ラジオ、プロリーグなど別々の歴史が重なっている。応援歌や選手記録だけを見ても、その長い積み重ねの一部なのだ。\n\n## 今日の試合で見るなら\n18時からは、ロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**が先発予定だ。1872年に学校で始まった野球が、154年後には大きな球場でプロ同士の試合として続いている。\n\nさらに**清宮幸太郎**は通算100本塁打まであと1本、**山口航輝**は今季32本塁打だ。==今日の1球を「長く続いてきた記録の続きを見ている」と考えると、野球の歴史が少し身近になるのだ。=="}, "1-03-a": {"meta": {"id": "1-03-a", "title": "1打席ってどう進む？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "2-13", "2-14"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scoring/scoring_howto.pdf"]}, "body": "## ひとことで\n1打席は、1人の打者が投手と向き合い、アウトになるか塁へ出るなどして結果が決まるまでだ。投手の1球ごとに、ストライク、ボール、打球などの結果が積み重なる。\n\n## しくみ\n打者が振って空振りしたり、ストライクと判定されたりするとストライクが増える。3ストライクで三振（打者がアウトになること）となるのが基本だ。\n\nストライクゾーンを外れた球を打者が振らず、ボールと判定されるとボールが増える。4ボールなら四球（フォアボール：一塁を与えられること）になる。\n\n途中でフェア（ファウルラインの内側）に打球を打てば、守備との勝負に移る。ヒットで出塁することも、ゴロ（地面を転がる打球）やフライ（高く上がった打球）でアウトになることもあり、そこでその打席の結果が決まるのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は長打（二塁打以上の当たり）を打てる打者だ。だから福島蓮との対戦では、最初の1、2球から勝負が動くことがある。まず「今は何ボール、何ストライクか」を追い、打球が飛んだ瞬間に塁とアウトを見ると、1打席の流れがつながるのだ。"}, "1-03-b": {"meta": {"id": "1-03-b", "title": "攻撃と守備が入れ替わるのはいつ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-05", "1-07-c"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n攻撃側が3つアウトを取られたら、攻撃と守備が入れ替わる。1回表が終われば1回裏、1回裏が終われば2回表へ進むのだ。\n\n## しくみ\nアウトは打者だけでなく、塁にいる走者が取られることもある。誰がアウトになったかに関係なく、その攻撃中の合計が3つになれば交代だ。\n\n交代の間には、守っていた選手がベンチへ戻り、攻撃していたチームの選手が守備位置へ向かう。次の回に投げる投手は準備投球（守備につく前の短い練習投球）をするので、プレーが少し止まって見える。\n\nスコアボードの「O」が2なら、あと1アウトで交代だと分かる。初心者には、打球そのものより先にこの数字を見るのも有効なのだ。\n\n## 今日の試合で見るなら\n1回表は日本ハムが攻撃し、ロッテのアンドレ・ジャクソンが3アウトを取りにいく。3つ目のアウトが入った瞬間、今度はロッテの西川史礁らが打つ側へ回る。その切り替わりを1度見れば、以後も同じ繰り返しだ。"}, "1-03-c": {"meta": {"id": "1-03-c", "title": "試合が止まるのはどんなとき？（投手交代・リクエスト・雨）", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-01-c", "2-03-c", "2-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/npb/2020rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球は、選手交代や判定の確認、天候などでしばしば止まる。止まったから異常というより、次のプレーを安全かつ正しく始めるための時間なのだ。\n\n## しくみ\n投手交代では、新しい投手がマウンドへ来て準備する。その間は打者も待つので、継投（投手を次々に替えること）が多い終盤ほど停止時間も増えやすい。\n\nリクエストでは、監督が対象となる判定についてリプレー検証（映像で判定を確認すること）を求める。審判が映像を確認している間はプレーが止まるのだ。\n\n雨などで安全に試合を続けにくい場合も、審判やリーグの判断で中断や打ち切りがあり得る。2026年度の野球規則にも、天候状況による試合の打ち切りに関する規定がある。\n\n## 今日の試合で見るなら\n日本ハム先発の福島蓮は、9月は救援で登板してきた投手だ。早めに交代すれば、そのたびに試合はいったん止まる。\n\nまた、山口航輝の長打性の打球などで、リクエストの対象となる微妙な判定が出れば、リプレー検証に入ることがある。今日の舞台は屋外のZOZOマリンで、雨予報もある。グラウンド整備や天候による中断にも注意するとよいのだ。"}, "1-03": {"meta": {"id": "1-03", "title": "どんな感じで進むの？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-03-a", "1-03-b", "1-03-c"], "related": ["1-01", "1-04", "1-05", "1-07"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球は、「1球投げる→打者の結果が決まる→3アウトで攻守交代」を繰り返して進む。これを表と裏で1回（イニング：攻撃と守備のひと区切り）として、基本は9回まで続けるのだ。\n\n## しくみ\nまず投手が打者へ1球投げる。打者が打てば、打球を守備側が処理し、その間に打者や走者が塁を進む。打たなくても、ストライクやボールが数えられ、三振（3ストライクでアウト）や四球（フォアボール：4ボールで一塁へ進むこと）につながる。\n\n1人の打者について結果が出るまでを打席という。打者がアウトになることもあれば、一塁へ出て走者になることもある。走者がいると、次の打者の一球で複数の人が同時に動くので、試合が急に忙しく見えるのだ。\n\n攻撃側が3アウトになると、表なら裏へ、裏なら次の回の表へ進む。ここで選手が守備位置へ走り、投手が準備投球をするので、少し間ができる。\n\n試合中には「タイム」がかかって動きが止まることもある。選手交代、けが、リプレー検証、天候など理由はさまざまだ。時計が動き続ける競技ではないので、止まっている時間も試合の一部なのだ。\n\n初心者のうちは、全部のルールを同時に追わなくてよい。「今は何回か」「どちらの攻撃か」「アウトはいくつか」「走者はどこか」の4点を見ると、かなり迷いにくくなる。\n\n## おもしろエピソード\n同じ1球でも、何も起きないこともあれば、一気に数点が入ることもある。満塁（すべての塁に走者がいる状態）で長打が出れば、球場の状況が数秒で大きく変わるわけだ。\n\n## 今日の試合で見るなら\n1回表は日本ハムの攻撃から始まる。予想では1番の水野達稀が、ロッテ先発のアンドレ・ジャクソンと最初の打席を作る。\n\n3アウトになればロッテの攻撃へ替わり、西川史礁や山口航輝が福島蓮と対戦する。最初の1回だけ、この流れを意識して見れば、その後の回も同じ骨組みで追えるのだ。"}, "1-04-a": {"meta": {"id": "1-04-a", "title": "なぜホームチームが後攻なの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-04-b", "1-04-c"], "sources": ["https://npb.jp/phoenix/2026/information.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球では、ホームチームを後攻にするのが基本の組み合わせだ。後攻には「相手の最後の攻撃を見てから、自分たちの最後の攻撃ができる」という特徴がある。\n\n## しくみ\n後攻は、各回の裏に攻撃する。特に9回では、表が終わった時点の点差を知ったうえで攻撃できる。何点必要かがはっきりしているので、1点を取りに行く作戦か、一気に長打を狙うかも考えやすい。\n\nNPBの開催要項でも「ホームチーム（後攻）」という組み合わせで扱われている。試合ごとにじゃんけんで決めるものではないのだ。\n\n## 今日の試合で見るなら\nZOZOマリンではロッテがホームなので後攻だ。9回表に清宮幸太郎ら日本ハムの攻撃を終えたあと、必要なら山口航輝らロッテ打線に最後の攻撃機会が回ってくる。"}, "1-04-b": {"meta": {"id": "1-04-b", "title": "9回ウラをやらない試合があるのはなぜ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-04-c", "1-05"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2025/0905/l-m-20/playbyplay.html"]}, "body": "## ひとことで\n9回表が終わった時点で後攻のホームチームが勝っていれば、9回裏はやらない。相手にはもう攻撃が残っていないので、点を追加する必要がないからだ。\n\n## しくみ\nたとえば8回終了でロッテが3対2でリードしているとする。9回表の日本ハムが無得点なら、3対2のままロッテの勝ちが確定する。\n\nこのときスコアボードのホーム側の9回には「×」が表示されることがある。「攻撃したが0点」ではなく、「攻撃そのものを行っていない」という意味だ。\n\n## 今日の試合で見るなら\nロッテがリードして9回表を迎え、清宮幸太郎ら日本ハム打線を抑え切れば、その瞬間に試合終了だ。山口航輝らロッテ打線の9回裏は回ってこない。"}, "1-04-c": {"meta": {"id": "1-04-c", "title": "サヨナラって？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-04-b"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n「サヨナラ」は、9回裏や延長の裏にホームチームが勝ち越し、その得点が入った瞬間に試合が終わることだ。後攻だけに起こる終わり方なのだ。\n\n## しくみ\n同点の9回裏でロッテが1点取れば、日本ハムにはもう次の攻撃がない。だから3アウトまで続けず、勝ち越しの走者が本塁（ホームベース）を踏んだところで終了する。\n\n安打（ヒット）ならサヨナラ安打、本塁打ならサヨナラ本塁打と呼ぶ。四球や相手のミスなどで決勝点が入る場合もあるので、必ずヒットで終わるわけではない。\n\n## 今日の試合で見るなら\n9回裏が同点で、32本塁打の山口航輝が一発を打てば、それは33号のサヨナラ本塁打になる。今日のZOZOマリンでは「GRAB THE WIN」も予定されている。9回表が終わったあと、条件がそろった場合だけ、球場全体でフラッグを振ってサヨナラ勝利を後押しする演出だ。"}, "1-04": {"meta": {"id": "1-04", "title": "オモテとウラって何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-04-a", "1-04-b", "1-04-c"], "related": ["1-05"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/phoenix/2026/information.html"]}, "body": "## ひとことで\n「オモテ」は先攻チームの攻撃、「ウラ」は後攻チームの攻撃だ。1回の中を前半と後半に分けた呼び方なのだ。\n\n## しくみ\n野球の1回（イニング：攻撃と守備を1度ずつ行うまとまり）は、まず「表」から始まる。表では先攻チームが打ち、後攻チームが守る。3アウトになると攻守が入れ替わり、「裏」になる。\n\n裏では後攻チームが打ち、先攻チームが守る。ここでも3アウトになれば、その回は終わりだ。次は2回表、2回裏という順番で進み、通常は9回まで行う。\n\nNPBではホームチームが後攻になる。今日なら、ビジター（相手の本拠地へ出向くチーム）の日本ハムが表、ホームのロッテが裏だ。スコアボードで「1」「2」「3」と回数が並んでいても、その中では必ず表と裏の2つに分かれているわけだ。\n\nただし、9回裏は必ずあるわけではない。9回表が終わった時点でホームのロッテが勝っていれば、日本ハムにはもう逆転の攻撃機会が残っていない。だから、その場で試合終了になる。\n\n## 今日の試合で見るなら\n1回表は、ロッテ先発のアンドレ・ジャクソンが清宮幸太郎ら日本ハム打線を相手にする。3アウトを取ったら1回裏へ移り、日本ハム先発の福島蓮が山口航輝らロッテ打線と対戦する。\n\n「表は日本ハム、裏はロッテ」と覚えておけば、途中から見てもどちらが攻撃中なのか迷いにくい。9回まで来たら、ロッテがリードしているかにも注目するといい。"}, "1-05-a": {"meta": {"id": "1-05-a", "title": "ラッキーセブンって？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-05"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n「ラッキーセブン」は7回の攻撃を特別に盛り上げる呼び方だ。7回だけ得点が増えるようなルールではなく、応援上の節目なのだ。\n\n## しくみ\n試合が終盤に入る7回は、球場の応援演出が大きくなることが多い。得点方法やアウトの数は1回や2回と同じで、3アウトになれば攻守交代する。\n\n今日のZOZOマリンでは、7回表終了後に「MARINES LUCKY 7」が予定されている。球団歌「WE LOVE MARINES」を歌い、タオルを掲げてロッテを応援する時間だ。\n\n## 今日の試合で見るなら\n7回表は日本ハムの攻撃なので、清宮幸太郎らの攻撃が3アウトで終わったところが合図になる。その演出の直後、7回裏で山口航輝らロッテ打線の攻撃が始まる。"}, "1-05-b": {"meta": {"id": "1-05-b", "title": "雨で試合が終わる「コールド」って？", "category": "1", "level": "2", "priority": "normal", "needs_check": true, "related": ["1-05"], "sources": ["https://npb.jp/npb/2025rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nコールドゲーム（試合途中で打ち切られた試合）は、雨などで安全に続けられないと判断され、試合完了前に終了を命じられた試合だ。雨が降っただけで自動的に終わるわけではない。\n\n## しくみ\nNPBの公認野球規則では、球審またはリーグ事務局が天候やグラウンド状態などを理由に試合を中止できる。正式試合（結果が記録として成立する試合）になった後なら、その時点の状況を基に結果を扱うのが原則だ。\n\nただし、NPBのセ・パ公式戦ではサスペンデッドゲーム（後日、途中から再開する試合）は採用されていない。そのため、同点のまま打ち切れば引き分けになるのが一般的だ。\n\nビジターチームが途中の回で追いついたり逆転したりして、ホーム側の攻撃が終わっていない場合は、前の回が終わった時点のスコアで扱われる。正式試合になる前なら、ノーゲーム（試合がなかったことになる扱い）になる場合もある。<!-- TODO: 確認（2026年セ・パ公式戦でサスペンデッド不採用・打ち切り時の扱いを定めた規定本文を公式ページで確認） -->\n\n## 今日の試合で見るなら\n今日のZOZOマリンは屋外で、NPB日程ページの予報は「くもり時々雨」だ。ジャクソンや福島蓮が投げている途中に雨が強まっても、すぐコールドとは限らない。審判団の中断・再開・打ち切りの判断を見る場面になる。"}, "1-05-c": {"meta": {"id": "1-05-c", "title": "何回まであるの？9回で終わらないことは？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-01-d", "1-04-c"], "sources": ["https://npb.jp/scores/2026/0607/g-m-03/", "https://npb.jp/games/2026/"]}, "body": "## ひとことで\n野球の公式戦は**9回**が基本だ。9回を終えて同点なら、**延長戦（9回のあとに続ける回）**に入ることがある。==「9回＝必ず試合終了」ではないのだ。==\n\n## しくみ\n1回から9回まで、両チームが表と裏で攻撃する。9回までに点差がつけば、そこで勝敗が決まる。\n\n同点なら10回、11回と続くことがある。2026年6月7日の巨人―ロッテは**2対2**のまま12回を終え、引き分けで試合終了した。==今季も9回を超えて12回まで続いた実例がある==ということだ。\n\n## 今日の試合で見るなら\n今日のロッテ―日本ハムも、9回終了時に同点ならそこで席を立たないほうがいい。スコアボードに「10」が加われば延長だ。\n\n先発はロッテが**アンドレ・ジャクソン**、日本ハムが**福島蓮**だが、延長まで行けば救援投手も含めた総力戦になりやすい。==9回が終わって同点なら、まだ試合は続く==と覚えておけば十分なのだ。"}, "1-05-d": {"meta": {"id": "1-05-d", "title": "1イニングは何分くらい？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-01-c", "1-03-b"], "sources": ["https://npb.jp/news/detail/20260730_01.html", "https://npb.jp/games/2026/"]}, "body": "## ひとことで\n**1イニング（1回の表と裏）**に決まった時間はない。2026年前半戦のNPBでは、9回で終わった試合の平均がセ・パとも**3時間4分**だったので、単純に9で割ると==1イニング約20分がひとつの目安==になる。\n\n## しくみ\n野球は時計で区切る競技ではなく、基本的に**3アウト**を取るまで攻撃が続く。三者凡退（打者3人で3アウト）なら短く終わるが、安打や四球が続けば打者が何人も出て長くなる。\n\nさらに表と裏の間には攻守交代がある。だから「毎回20分」ではなく、==回ごとに長さがかなり変わる==のだ。\n\n## 今日の試合で見るなら\n今日の先発はロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**だ。2人が次々とアウトを取れば回は速く進む。\n\n逆に走者がたまり、**山口航輝**や**清宮幸太郎**のような打者を迎える場面では、一球ごとの駆け引きも増える。==「今の1回、ずいぶん長いな」と感じても、それは普通なのだ。=="}, "1-05": {"meta": {"id": "1-05", "title": "1回2回（イニング）って何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-05-a", "1-05-b"], "related": ["1-04", "1-07-c"], "sources": ["https://npb.jp/scoring/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n1回、2回という数字は「イニング」と呼ばれる試合の区切りだ。1イニングは、先攻と後攻がそれぞれ1度ずつ攻撃するまとまりなのだ。\n\n## しくみ\n1回は「1回表」と「1回裏」に分かれる。表では先攻チームが攻撃し、3アウトになると裏へ移る。裏では後攻チームが攻撃し、3アウトになれば1回終了だ。\n\nそこから2回表、2回裏、3回表……と進んでいく。通常の試合は9回までなので、基本の流れはこの往復を9回繰り返すことになる。ただし、ホームチームが9回表終了時点で勝っていれば9回裏は行わない。同点なら延長戦に入る場合もある。\n\nイニングは「何分たったか」で区切るものではない。3アウトを取るまで攻撃は続くので、打者3人で短く終わる回もあれば、何人も出塁して長くなる回もある。\n\nスコアボードの「1 2 3 4…」は、このイニングごとの得点を並べたものだ。0が続いていても、その回に何も起きなかったとは限らない。走者を出しながら得点できなかった回も同じ0なのだ。\n\n## 今日の試合で見るなら\n1回表はロッテのアンドレ・ジャクソンが日本ハム打線を抑える側、1回裏は日本ハムの福島蓮がロッテ打線を抑える側になる。\n\n山口航輝の本塁打や清宮幸太郎の通算100号が出たら、「何回の表か裏か」も一緒に見ると試合の流れを覚えやすい。終盤の7回、8回、9回になるほど、残された攻撃回数も少なくなるわけだ。"}, "1-06-a": {"meta": {"id": "1-06-a", "title": "一塁・二塁・三塁・本塁はどこ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n本塁から外野を見ると、右が一塁、正面奥が二塁、左が三塁なのだ。走者は本塁→一塁→二塁→三塁→本塁の順に進む。\n\n## しくみ\n打者が立つ場所のそばにある五角形の白い板が本塁（ホームベース）だ。そこから右前方が一塁、いちばん奥が二塁、左前方が三塁になる。\n\n進む向きはいつも同じだ。打ったあと、いきなり三塁へ走ることはできない。\n\n## 今日の試合で見るなら\nロッテの西川史礁が打って一塁へ走ったら、その次にどこまで進むかを追ってみよう。日本ハムの清宮幸太郎が長打（二塁打以上の当たり）を打てば、一塁を回って二塁まで進む場面もある。\n\n四つの塁の位置が分かるだけで、「今どこまで来たのか」がかなり見やすくなるのだ。"}, "1-06-b": {"meta": {"id": "1-06-b", "title": "満塁って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-09"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/pl/"]}, "body": "## ひとことで\n満塁は、一塁・二塁・三塁の全部に走者がいる状態なのだ。安打はもちろん、四球（フォアボール）でも1点が入ることがある、とても得点が動きやすい場面だ。\n\n## しくみ\n満塁で打者が四球になると、打者は一塁へ進む。一塁走者は二塁、二塁走者は三塁へ押し出され、三塁走者は本塁へ進むので1点になる。\n\nこれを押し出しという。逆に守備側は、どの塁にも次の走者が来るため、フォースアウト（走者より先に塁へ送球して取るアウト）を狙いやすい。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎の打席で三つの塁が埋まったら、球場の空気が一段変わるはずだ。一発なら大量点、四球でも1点という状況なので、打者と同じくらい、投手の制球（狙ったところへ投げる力）にも注目するといい。\n\n満塁は「打者が打てるか」に加えて、「投手がストライクを取れるか」も勝負を左右する場面なのだ。"}, "1-06-c": {"meta": {"id": "1-06-c", "title": "得点圏って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/pl/"]}, "body": "## ひとことで\n得点圏（とくてんけん）は、走者が二塁か三塁にいる状態を指す野球の言い方なのだ。安打1本で本塁まで帰り、得点できる可能性が高い位置だからそう呼ぶ。\n\n## しくみ\n一塁走者は、単打（シングルヒット）1本では三塁までしか進めないことも多い。二塁や三塁なら、外野へ安打が飛ぶだけで本塁を狙いやすくなる。\n\nだから「得点圏に走者がいる」は、「今は点が入りやすい場面」という目印になる。ルール上の特別な区域ではなく、試合を見るための便利な呼び方なのだ。\n\n## 今日の試合で見るなら\nロッテの西川史礁が二塁にいて山口航輝が打席に入ったら、まさに得点圏の場面だ。日本ハムなら、水野達稀が二塁にいて清宮幸太郎を迎える形も同じだ。\n\n打者の結果だけでなく、二塁走者が打球と同時にどこまで走るかを見ると、得点圏の意味がよく分かる。"}, "1-06-d": {"meta": {"id": "1-06-d", "title": "残塁って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-07-c"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n残塁（ざんるい）は、攻撃が終わったとき、得点にもアウトにもならず塁に残った走者のことなのだ。公式記録ではLOB（Left On Base）とも表す。\n\n## しくみ\nたとえば二死（ツーアウト）一・二塁で打者が三振すると、3アウトで攻撃終了になる。一塁と二塁の走者は本塁へ帰れないままなので、2残塁だ。\n\n残塁が多いことは、「走者は出したが得点に結びつかなかった」場面が多いということだ。ただし、残塁だけで攻撃の良し悪しを全部決める数字ではない。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎の前に走者がたまったのに、その回が0点で終わったら残塁が増える。反対に、そこで安打が出れば残塁になるはずだった走者が得点に変わるのだ。\n\nイニング終了時に塁を一度見るだけで、「チャンスを残したまま終わったか」が分かる。"}, "1-06": {"meta": {"id": "1-06", "title": "塁って？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-06-a", "1-06-b", "1-06-c", "1-06-d"], "related": ["1-08", "1-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/pl/"]}, "body": "## ひとことで\n塁（ベース）は、走者が順番に進んで得点を目指す「中継地点」なのだ。本塁から一塁、二塁、三塁と進み、最後に本塁へ戻ると1点になる。\n\n## しくみ\nグラウンドには、本塁・一塁・二塁・三塁の4つがひし形に並んでいる。打者はボールを打つなどして走者になると、まず一塁へ向かうのだ。\n\nそこから二塁、三塁、本塁の順に進む。途中の塁に触れながら一周するので、すごろくのマスを順番に進むイメージに近い。\n\n塁にいる走者は、次の打者の安打（ヒット）や四球（フォアボール：ボールが4つになること）などで進む。守備側は、その走者が安全に塁へ着く前にアウトを取ろうとするわけだ。\n\nだから野球を見るときは、打者に加えて「今、どの塁に誰がいるか」を見ると分かりやすい。一塁だけならまだ本塁まで遠いが、二塁や三塁まで進むと、1本の安打で得点になる可能性が上がるのだ。\n\n## おもしろエピソード\n塁は、攻撃側にとっては休める場所であり、守備側にとっては次のアウトを取る目印でもある。同じ白いベースが、攻撃と守備でまったく違う意味を持っているのだ。\n\n## 今日の試合で見るなら\nロッテでは西川史礁や山口航輝、日本ハムでは水野達稀や清宮幸太郎の打席で、まず走者の位置を確認するといい。二塁や三塁に走者がいる場面では、外野への安打1本で得点まで動くことがある。\n\n球場の大型画面や一球速報もよいが、実際の塁を見ると状況が早く読める。打球が飛んだ瞬間、打者だけでなく塁上の走者も動くところを見ると、野球が急に立体的に見えてくるのだ。"}, "1-07-a": {"meta": {"id": "1-07-a", "title": "カウントはどの順番で読む？（ボール→ストライク）", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "1-07-b"], "sources": ["https://www.marines.co.jp/stadium/application/baseball/howto.html", "https://npb.jp/scoring/officialrule_900.pdf"]}, "body": "## ひとことで\n今のカウントは「ボール→ストライク」の順で読むのだ。たとえばBが2、Sが1なら「2ボール1ストライク」になる。\n\n## しくみ\nBはBall（ボール）、SはStrike（ストライク）だ。0ボール2ストライクなら、投手はあと1ストライクで基本的に三振を取れる。\n\n反対に3ボール1ストライクなら、あと1ボールで四球（フォアボール：打者が一塁へ進めること）になる。数字の並びだけを見るなら「B-S」と覚えるのが早い。\n\n## 今日の試合で見るなら\nジャクソン対清宮幸太郎、福島蓮対山口航輝のような打席で、投球ごとにB-Sだけ追ってみよう。3-1なら投手はボールを出しにくく、0-2なら打者は三振まであと1つだ。\n\n同じ1球でも、カウントで意味が変わる。それが分かると配球（どの球をどこへ投げるか）の見え方も変わるのだ。"}, "1-07-b": {"meta": {"id": "1-07-b", "title": "フルカウントって？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "1-07-a"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/pl/"]}, "body": "## ひとことで\nフルカウントは、3ボール2ストライクの状態なのだ。次がボールなら四球、ストライクなら基本的に三振なので、1球の重みが大きい。\n\n## しくみ\nただし「次の1球で必ず決着」ではない。2ストライクのあとに普通のファウル（線の外に飛んだ打球）を打っても、原則としてストライクは増えず、3ボール2ストライクのまま続くからだ。\n\nそのため、フルカウントから何球も粘る打席もある。投手は四球を避けたいが、甘い球を投げれば打たれる。このせめぎ合いが見どころなのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝の打席が3ボール2ストライクになったら、投手と打者の両方に注目するといい。長打のある打者に対して、ジャクソンや福島蓮がどこへ投げるかで勝負が動く。\n\n球場で「3-2」と表示されたら、それがフルカウントだ。"}, "1-07-c": {"meta": {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "1-03-b"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_faq_20250901.html", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n野球は、攻撃側が3つアウトになると、その回の表または裏の攻撃が終わるルールなのだ。3アウトをひと区切りにして、両チームが交互に同じだけ攻撃する。\n\n## しくみ\n3アウトは「打者3人で必ず交代」という意味ではない。安打や四球で塁に出ればアウトは増えないので、3アウトになるまで何人でも打席に立てる。\n\n逆に三者凡退（3人の打者が出塁せず3アウトになること）なら、最短の3人で攻撃終了だ。NPBの説明でも、各イニングの表・裏は3つのアウトなどで終了するとされている。\n\n## 今日の試合で見るなら\nOが2つ点いている場面では、次のアウトで攻守交代になる。たとえば二死（ツーアウト）で山口航輝や清宮幸太郎が打席に立てば、安打で攻撃を続けるか、アウトでその回が終わるかの分かれ目だ。\n\n「2アウトからの一打」が大きく感じるのは、この最後の1アウトをめぐる勝負だからなのだ。"}, "1-07": {"meta": {"id": "1-07", "title": "SBOや青・黄・赤に光るあれは何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-07-a", "1-07-b", "1-07-c"], "related": ["1-03-a", "1-08"], "sources": ["https://www.marines.co.jp/stadium/application/baseball/howto.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nあれは、今の打者に対するボールとストライク、そしてその回のアウト数を示す表示なのだ。ZOZOマリンの公式施設案内では「BSO」と呼んでいる。\n\n## しくみ\nBはボール、Sはストライク、Oはアウトだ。見る順番は、まずB、次にS、最後にOと覚えるといい。\n\nボールは3つまで表示され、4つ目で四球（フォアボール：打者が一塁へ進めること）になる。ストライクは2つまで表示され、基本的には3つ目で三振になる。\n\nアウトも2つまで表示される。3つ目のアウトが成立すると、その回の表または裏が終わり、攻撃と守備が入れ替わるのだ。\n\n「SBO」という言い方を耳にすることもあるが、少なくともZOZOマリンの現在の施設案内はBSO表記だ。色は設備や見え方で迷うことがあるので、B・S・Oの文字と数で読むのが確実だ。\n\n## おもしろエピソード\n表示が「3ボール2ストライク」になるとフルカウントと呼ぶ。次の1球の意味が大きくなるので、観客の注目が一気に投手と打者へ集まりやすい場面だ。\n\nただし、2ストライクから普通のファウル（線の外に飛んだ打球）を打っても、原則としてそのまま三振にはならない。だからフルカウントの勝負が何球も続くこともある。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソン、日本ハム先発の福島蓮が投げるたび、まずBSOを一度見ると試合を追いやすい。たとえばBが3なら、投手はあと1つボールを出すと四球になる。\n\n山口航輝や清宮幸太郎の打席でSが2になったら、投手は三振まであと1ストライクだ。Oが2なら、その打者の結果次第で攻守交代になる可能性がある。\n\nBSOは、今の1球がどれだけ重要かを教える小さな信号機なのだ。"}, "1-08-a": {"meta": {"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-08", "1-07"], "sources": ["https://npb.jp/news/detail/20180621_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n三振は、打者に3つ目のストライクが宣告されることだ。最後の球を振って当たらなければ空振り三振、振らずにストライクなら見逃し三振になるのだ。\n\n## しくみ\n空振りは、打者がバットを振ったのに球へ当てられないことだ。見逃しは、打者が振らず、球審がストライクと判定することだ。\n\nどちらも結果は三振だが、見え方は違う。空振りなら投手の球威（球の勢い）や変化に打者が合わせられなかったと分かりやすい。見逃しなら、打者がボールだと思った球がストライクになった場合もあるのだ。\n\nなお、第3ストライクを捕手が正規に捕れなかった場合など、三振が記録されても打者がすぐアウトにならない例外がある。\n\n## 今日の試合で見るなら\nジャクソン対清宮幸太郎、福島蓮対山口航輝の打席で、2ストライクになった後を見てみるといい。最後に打者が振ったか、振らなかったかを見るだけで、「空振り三振」と「見逃し三振」をその場で区別できるのだ。"}, "1-08-b": {"meta": {"id": "1-08-b", "title": "フライとゴロって？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-08", "1-08-c"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nフライは空中に上がった打球、ゴロは地面を転がる打球だ。アウトの取り方がかなり違うので、打った瞬間の高さを見ると守備が分かりやすくなるのだ。\n\n## しくみ\nフライ（飛球）は、地面に落ちる前に守備側が正しく捕れば打者アウトだ。走者は捕球後なら次の塁を狙えるが、捕る前に進みすぎると元の塁へ戻る必要がある。\n\nゴロ（地面を転がる打球）は、捕っただけでは普通は打者アウトにならない。たとえば遊撃手（ショート：二塁と三塁の間を守る内野手）が捕り、打者より先に一塁へ送球してアウトを完成させるのだ。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎が打った瞬間、まず「上か、下か」を見るといい。フライなら、外野手の藤原恭大や万波中正が捕るまでを追う。ゴロなら、水野達稀や山縣秀ら内野手が捕って、どの塁へ投げるかまで追う。\n\n打球の種類で守備の動きが変わるのだ。"}, "1-08-c": {"meta": {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-08", "1-06"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nタッチアウトは、ボールを持った野手が走者の体に触れて取るアウトだ。フォースアウト（封殺）は、走者が進まなければならない塁を、守備側が先にボールを持って踏めば成立するのだ。\n\n## しくみ\nたとえば一塁に走者がいて打者がゴロを打つと、打者は一塁へ行くので、一塁走者は二塁へ進まなければならない。このとき二塁を先に踏めば、走者へ触らなくてもフォースアウトになる。\n\n反対に盗塁（投球の間などに次の塁を狙うこと）は、走者に進む義務がない。そこでアウトにするには、原則として走者へタッチする必要があるのだ。\n\n## 今日の試合で見るなら\n西川史礁が一塁にいる場面で山口航輝が内野ゴロを打ったら、日本ハム守備は二塁でフォースアウトを狙える。終盤、池田来翔が代走（走る役目の交代選手）で出て盗塁を狙う場面なら、今度はタッチが勝負になる。田宮裕涼の送球を受けた野手が走者へタッチできるかを見ると、違いがはっきりするのだ。"}, "1-08": {"meta": {"id": "1-08", "title": "アウトってどうやって取るの？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-08-a", "1-08-b", "1-08-c"], "related": ["1-07", "1-09"], "sources": ["https://npb.jp/news/detail/20180621_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nアウトは、守備側が攻撃側の選手を「そのプレーでは先へ進めない状態」にすることだ。基本は3アウトで攻守交代になるのだ。\n\n## しくみ\nよく見る取り方は、まず三振（ストライクを3つ取ること）だ。打者が振って空振りしても、見送ってストライクになっても、3つ目のストライクなら三振として記録される。\n\n打った後なら、フライ（地面に落ちる前の打球）を野手が捕れば打者はアウトだ。ゴロ（地面を転がる打球）なら、打者が一塁へ着く前に一塁手へ送球してアウトにする形が多い。\n\n走者をアウトにする方法もある。進まなければならない塁を先に守備側が押さえるフォースアウト（封殺）と、走者の体にボールを持ったグラブなどで触れるタッチアウトが代表例だ。\n\nつまり、アウトは「三振だけ」ではない。打球の高さ、走者の位置、どの塁へ送球するかを見れば、守備側が何を狙っているかが分かってくるのだ。\n\n## おもしろエピソード\n三振しても、必ず打者アウトになるとは限らない。第3ストライクを捕手が正規に捕れず、条件を満たすと打者が一塁へ走れる場合がある。いわゆる振り逃げで、NPBでは1イニングに4三振が記録された例もあるのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンが、清宮幸太郎や万波中正から三振を取る場面では、捕手が第3ストライクを捕ったところまで見てみるといい。\n\n反対に日本ハム先発の福島蓮が山口航輝や西川史礁に打たせたら、今度は打球を見る。高く上がればフライ、地面を転がればゴロだ。そこから野手がどの方法でアウトを完成させるかまで追うと、守備が一続きの動きに見えてくるのだ。"}, "1-09-a": {"meta": {"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-09", "1-08-c"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。走者が本塁を先に踏んでも、そのプレーの第3アウトがフォースアウト（進塁義務のある走者を封殺するアウト）などなら、得点が認められない場合があるのだ。\n\n## しくみ\n典型は一死（ワンアウト）満塁だ。打者がゴロを打ち、守備側が二塁と一塁でフォースの併殺（1プレーで2アウト）を完成させると、それで第3アウトになる。\n\nこのとき三塁走者が一塁でのアウトより先に本塁を踏んでいても、得点は0だ。第3アウトがフォースアウトだからなのだ。\n\n一方、第3アウトが走者へのタッチアウトなら、本塁到達とアウトのどちらが先かで得点が決まる場合がある。同じ「3アウト目」でも、その種類で結果が変わるというわけだ。\n\n## 今日の試合で見るなら\n一死満塁で山口航輝が内野ゴロを打ち、日本ハムが二塁から一塁へ併殺を完成させる場面を想像すると分かりやすい。三塁走者の西川史礁が先に本塁へ滑り込んでも、最後がフォースの第3アウトなら点は入らないのだ。"}, "1-09-b": {"meta": {"id": "1-09-b", "title": "打点って？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-09", "1-06-c"], "sources": ["https://npb.jp/news/detail/20180920_03.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n打点は、打者の打撃などによって味方の得点を生んだとき、その打者に付く記録だ。ホームを踏んだ走者に付く「得点」とは別物なのだ。\n\n## しくみ\nたとえば一塁走者がいて、打者が二塁打を打って走者が本塁へ帰れば、走者には1得点、打者には通常1打点が付く。\n\n打点はヒットだけで付くわけではない。犠牲フライ（フライアウトと引き換えに走者を返すこと）や内野ゴロでも、打者のプレーで走者が得点すれば打点になる場合がある。満塁で四球になり、押し出し（満塁の四球で三塁走者が本塁へ押し出されること）で1点入った場合も打者に打点が付くのだ。\n\nただし、守備の失策（普通なら処理できる打球のミス）が得点の主な原因なら、打点が付かない場合もある。\n\n## 今日の試合で見るなら\n西川史礁が出塁した後、山口航輝の安打で西川が本塁へ帰れば、西川に「得点」、山口に「打点」が付く。日本ハムなら、水野達稀を清宮幸太郎が返す場面でも同じだ。この違いが、スコア表示の「R」（得点）と「RBI」（打点）を見分ける土台になるのだ。"}, "1-09-c": {"meta": {"id": "1-09-c", "title": "1回に何点でも入るの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-07-c", "1-09-b"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_faq_20250901.html", "https://npb.jp/scoring/", "https://npb.jp/games/2026/"]}, "body": "## ひとことで\n入る。野球には、**1イニング（1回の表または裏の攻撃）に入れられる点数の上限**がない。==3アウトになるまで、得点は何点でも積み重なる==のだ。\n\n## しくみ\n攻撃は「3点取ったら終了」のような仕組みではない。守備側が**3アウト**を取るまで続くので、その前に走者が次々と本塁へ帰れば、その人数ぶん得点が増える。\n\n打線がつながれば、**打者一巡（9人の打順が一周すること）**して同じ選手が同じ回にもう一度打席へ立つこともある。大量得点の回が長く感じるのは、アウトがなかなか3つそろわないからなのだ。\n\n## 今日の試合で見るなら\nたとえばロッテの攻撃で**山口航輝**が打ったあと、後ろの打者が次々に出塁して打順が一周すれば、山口が同じ回でもう一度打つこともある。\n\n日本ハム側なら**清宮幸太郎**の前に走者が何人もたまれば、一打で複数点が入る場面になる。==「この回は何点で終わる」と決まっていない==ところが野球のおもしろさなのだ。"}, "1-09-d": {"meta": {"id": "1-09-d", "title": "ランナーがホームに滑り込むのはなぜ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-08-c", "1-09"], "sources": ["https://npb.jp/npb/2016rules_2.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/"]}, "body": "## ひとことで\nホームへの滑り込みは義務ではない。主な狙いは、**タッチプレー（ボールを持つ野手が走者に触れてアウトにするプレー）**で捕手のタッチをかわしながら、本塁に手や足を届かせることだ。==速さだけでなく「どう触るか」の勝負なのだ。==\n\n## しくみ\n送球と走者がほぼ同時に本塁へ来ると、立ったまま走るより、体を低くして足や手を本塁へ伸ばしたほうがタッチを避けやすい場面がある。一方、余裕があれば滑らずに本塁を踏むこともある。\n\n本塁付近では安全も重要だ。NPBでは走者が守備者へ意図的に体当たりすることを禁じ、捕手側もボールを持たずに走路をふさぐことはできない。==滑り込みは「ぶつかるため」ではなく、塁に触れて得点するための動き==と考えると分かりやすい。\n\n## 今日の試合で見るなら\nもし日本ハムの**水野達稀**が二塁から一気に本塁を狙い、ロッテ捕手の**佐藤都志也**が送球を受ける場面になったら、走者の手足と捕手のミットを見よう。\n\n==本塁への到達とタッチのどちらが先か==。一瞬の差でセーフかアウトかが決まる場面なのだ。"}, "1-09": {"meta": {"id": "1-09", "title": "点ってどうやって入るの？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-09-a", "1-09-b"], "related": ["1-06", "1-08"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n攻撃側の走者が、一塁、二塁、三塁と進み、本塁へ正しく戻ると基本的に1点入る。1本のヒットで必ず点が入るわけではない。走者を少しずつ進めて得点することもできるのだ。\n\n## しくみ\n打者は打った後、まず一塁を目指す。そこから二塁、三塁、本塁の順に進み、本塁へ戻れば得点になる。四球（ボール4つで一塁へ進むこと）、盗塁（投球の間などに次の塁を狙うこと）、相手のミスなどでも走者は進めるのだ。\n\n本塁打なら分かりやすい。走者がいなければ打者自身が一周して1点、走者がいればその人数分も加わる。けれど野球では、単打、ゴロ、犠牲フライ（外野フライのアウトと引き換えに走者を返すこと）をつないで1点を取る場面も多い。\n\n注意したいのは、「本塁を踏んだ瞬間に必ず得点確定」ではないことだ。第3アウトの種類によっては、その前に走者が本塁へ着いていても得点が認められない場合がある。ここが最初は少し不思議に見えるところなのだ。\n\n## おもしろエピソード\nNPBの2026年8月の記録員コラムでは、次のような例が説明されている。一死満塁で三塁走者が先に本塁を踏んでも、その後に守備側がフォースで併殺（1つのプレーで2アウト）を完成させて第3アウトを取れば、得点は認められない。野球は「誰が先に本塁へ着いたか」だけで決まらないのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝が本塁打を打てば、得点の仕組みは一番見やすい。打者と塁上の走者が順に本塁へ戻り、その人数だけ点が入るからだ。\n\n本塁打でなくても見る価値はある。西川史礁や水野達稀が出塁した後、次の打者の安打やゴロでどこまで進むかを追ってみよう。「打った人」より「すでに塁にいた人」が本塁へ帰って点になる場面が見えてくるのだ。"}, "1-10-a": {"meta": {"id": "1-10-a", "title": "試合前の練習はどこから見られる？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-10", "7-02-c"], "sources": ["https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/news/detail/202600788769.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\n通常の観客なら、**開場後に自分の席や場内からグラウンドを見る**のが基本だ。==今日のZOZOマリンは16:00開場なので、そこから試合前の様子を見られる==のだ。\n\n## しくみ\n\nロッテの2026年公式戦は、原則として**試合開始2時間前に開場**する。今日も18:00開始なので16:00開場だ。\n\n入場後にグラウンドで練習が続いていれば、通常の観戦席から見ることができる。一方、球団は日によって**練習見学会**のような特別イベントも実施しており、これはTEAM26会員向けの事前抽選など、通常入場とは別の参加条件がある。\n\n==「特別イベントに当たらないと練習を一切見られない」という意味ではない==。まず席へ行き、グラウンドに選手がいるかを確かめればいいのだ。\n\n## 今日の試合で見るなら\n\n1塁側の内野席に着いたら、まずグラウンド全体を見よう。**アンドレ・ジャクソン**や**福島蓮**が準備している姿を見つけたら、試合中よりゆっくりフォームを観察できる。\n\n==試合前は「誰がどんな動きで体を作っているか」を見る時間==だと思えばいいのだ。"}, "1-10-b": {"meta": {"id": "1-10-b", "title": "スタメン発表はいつ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-10", "4-02"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\n今日のロッテは、**17:55ごろ**に球場演出の中でスタメンを1人ずつ紹介する予定だ。==18:00の試合開始直前なので、17:50までには席にいると見逃しにくい==のだ。\n\n## しくみ\n\n球団公式タイムテーブルでは、17:20ごろに**MARINES ROSTER**としてベンチ入り全選手を紹介する。そのあと17:55ごろの**MARINES STARTING LINEUP**で、最初から出場する選手を1人ずつ紹介する。\n\n「ベンチ入り」と「スタメン」は同じではない。ベンチ入りしていても最初は出ず、代打や守備交代で途中から出る選手もいる。==17:55ごろに名前を呼ばれる選手が、まず試合の中心になる9人だ==と考えると分かりやすい。\n\n## 今日の試合で見るなら\n\n**山口航輝**の名前が呼ばれたら、そのあと守備位置や打順の表示も見てみよう。日本ハム側では**清宮幸太郎**など、今日気になる選手が最初から出るかを確認するといい。\n\n==スタメン発表は「今日まず誰を追えばいいか」を決める時間==なのだ。"}, "1-10-c": {"meta": {"id": "1-10-c", "title": "始球式って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-10", "6-04"], "sources": ["https://npb.jp/news/detail/20251022_06.html", "https://npb.jp/allstar/2026/event.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\n**始球式**は、試合開始前にゲストなどが記念の1球を投げるセレモニーだ。==その1球は試合の投球数やボール・ストライクには数えない==ので、終わったあとに本当の試合が始まるのだ。\n\n## しくみ\n\nプロ野球では、俳優、スポーツ選手、地域の代表者、子どもたちなどが始球式を務めることがある。NPBの日本シリーズやオールスターでも、**試合開始前**の公式行事として始球式が組まれている。\n\n普通の投手のように完璧な球を投げる必要はない。捕手へ向かって1球を投げ、会場が拍手して終わるのが基本だ。==「誰が投げるか」も含めて、試合前のイベントとして楽しむもの==なのだ。\n\nなお、始球式は毎試合必ずあるわけではない。今日9月28日のロッテ公式タイムテーブルには、14:58時点で始球式の案内は掲載されていない。\n\n## 今日の試合で見るなら\n\n今日の予告先発はロッテの**アンドレ・ジャクソン**と、日本ハムの**福島蓮**だ。始球式がなくても、18:00になればこの2人のうち守備側の先発投手が「試合として数える最初の1球」を投げる。\n\n==セレモニーの1球と、勝負が始まる1球は別物==だと覚えておけば迷わないのだ。"}, "1-10": {"meta": {"id": "1-10", "title": "試合前に何をしてるの？（練習・スタメン発表・始球式）", "category": "1", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["1-10-a", "1-10-b", "1-10-c"], "related": ["1-03", "3-11"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/202600775376.html"]}, "body": "## ひとことで\n\n試合前は、選手の練習、ベンチ入り選手の紹介、スタメン発表、表彰や始球式などが続く時間だ。==**18:00に始まるのは試合であって、観戦は16:00の開場からもう始まっている**==のだ。\n\n## しくみ\n\n選手は試合開始ぎりぎりに来るわけではない。打撃、守備、投球などの準備をし、体を温めながらその日の状態を確かめる。観客は開場後、席からグラウンドを見ていると、試合中とは違うゆっくりした動きを見られることがある。\n\n今日のZOZOマリンは**16:00開場、18:00試合開始**だ。球団公式タイムテーブルでは、17:20ごろに**MARINES ROSTER（ベンチ入り選手紹介）**、17:30ごろに試合の見どころを紹介するWarm Up Showが予定されている。\n\nさらに17:45ごろには、**山口航輝**の2026年8月度月間MVP表彰式がある。17:55ごろにはロッテの選手が守備位置へつき、**MARINES STARTING LINEUP（スタメン紹介）**が行われる。\n\n==「練習→選手紹介→スタメン→試合開始」と順に見ると、試合前の時間が一本の流れに見えてくる==のだ。\n\n## おもしろエピソード\n\n同じ「選手紹介」でも、17:20ごろのMARINES ROSTERは**ベンチ入り全選手**、17:55ごろのSTARTING LINEUPは**最初から出場する選手**の紹介だ。初心者には同じに見えやすいが、役割が違う。\n\nまた、始球式は毎試合必ず行われるものではない。今日の球団公式タイムテーブルには、14:58時点で始球式の案内は掲載されていない。\n\n## 今日の試合で見るなら\n\nまず17:45ごろの**山口航輝**の表彰を見て、そのまま17:55ごろのスタメン紹介まで席にいると流れが分かりやすい。\n\n予告先発はロッテが**アンドレ・ジャクソン**、日本ハムが**福島蓮**だ。==18:00になる前に「今日の中心になる選手」を2、3人覚えておくと、最初の一球から迷いにくい==のだ。"}, "1-11-a": {"meta": {"id": "1-11-a", "title": "ボールの重さや大きさは？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-11", "2-07"], "sources": ["https://bis.npb.or.jp/npb/20130927chosahokokusho.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nプロ野球の硬式球は、重さ**141.7〜148.8グラム**、周囲**22.9〜23.5センチ**だ。==片手に収まる大きさだが、かなり硬い==のだ。\n\n## しくみ\n中には芯があり、その周りに糸を巻き、外側を革で包む。直径にするとおよそ7センチ台で、手のひらに収まる。\n\nただし、プロの投球や打球は高速だ。==小さいから安全、という道具ではない==。スタンドではファウルボール（打った球が横へ切れたもの）の行方も見ておく必要がある。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**と日本ハム先発の**福島蓮**が投げるのも、この同じ規格のボールだ。==同じ大きさの球を、握り方や指のかけ方で違う動きにする==ところが投手の技術なのだ。"}, "1-11-b": {"meta": {"id": "1-11-b", "title": "木のバットが折れるのはなぜ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-11", "2-03"], "sources": ["https://npb.jp/npb/2026rules.html", "https://www.asics.com/jp/ja-jp/mk/support/help/eq/bat", "https://npb.jp/npb/2026rules_2.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n木製バットは、細い部分や**芯（しん：いちばん打ちやすい部分）**から外れた場所に強い力がかかると折れることがある。==特に、ボールが手元寄りに当たる「詰まった打球」は折れるきっかけになりやすい==のだ。\n\n## しくみ\n木は天然素材なので、金属の棒のように全体が同じ強さではない。メーカーも、打芯を外すと折れる場合があると案内している。\n\nNPBでは金属製バットなどは原則使えず、木製バットが基本だ。折れた破片も危険なので、==打球だけでなく折れたバットの方向にも注意==したい。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**山口航輝**の打席で、内角の速い球を打った直後に短い鈍い音がしたらバットも見てみよう。==折れても打球自体は飛ぶので、プレーはボールを追い続ける==のだ。"}, "1-11-c": {"meta": {"id": "1-11-c", "title": "ファウルボールはもらえるの？", "category": "1", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["1-11", "2-19"], "sources": ["https://www.marines.co.jp/stadium/rule/fulltext.html", "https://npb.jp/freshas/2026/ticket_notes.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンで客席に入ったファウルボールを**持ち帰ってよいか**は、今回確認できた球団公式の公開ルールでは明記を確認できなかった。==拾ったときは自己判断せず、場内係員の案内に従うのが確実==だ。\n<!-- TODO: ZOZOマリンスタジアムで客席に入ったファウルボールの持ち帰り可否を球団公式で確認 -->\n\n## しくみ\n**ファウルボール（打球が規定のフェア地域から外れた球）**が客席へ飛び込むことはある。球団の観戦約款は、ホームラン球やファウル球の行方を常に見て、安全に注意するよう求めている。\n\n==ボールを取りに行くより、まず自分と周りの人の安全が先==だ。硬式球は硬く、跳ね返って別の人に当たることもあるからだ。\n\n## 今日の試合で見るなら\n今日は**1塁側の内野席**から観る。**清宮幸太郎**や**山口航輝**の打席でも、打球がこちらへ切れてきたらスマホではなくボールを見る。==記念球より先に、飛んでくる球を避ける準備なのだ==。"}, "1-11": {"meta": {"id": "1-11", "title": "ボールやバットって？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["1-11-a", "1-11-b", "1-11-c"], "related": ["1-08", "2-03", "2-19"], "sources": ["https://bis.npb.or.jp/npb/20130927chosahokokusho.pdf", "https://npb.jp/npb/2026rules.html", "https://npb.jp/npb/2026rules_2.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nプロ野球で使うのは、硬い**硬式球（こうしききゅう：革で包んだ硬いボール）**と、基本的に木でできたバットだ。==小さな道具だけれど、重さや材質までルールで細かく決まっている==のだ。\n\n## しくみ\n硬式球は、芯に糸を巻き、革で包んで作る。公認野球規則の規格では、重さは**141.7〜148.8グラム**、周囲は**22.9〜23.5センチ**だ。==見た目よりずっしりしていて、硬い==ので、スタンドへ飛んできた打球にも注意が必要なのだ。\n\nNPBでは、金属製バットや木片をつないだバットなどは、コミッショナーの許可があるまで使えない。だから打席で見えるのは、一本の木から作るタイプの**木製バット**が基本になる。\n\n木は金属ほど均一ではない。ボールが芯から外れ、細い部分に大きな力がかかると折れることがある。==「折れた＝失敗作」ではなく、強い衝撃を受ける木製道具なら起こりうる現象==なのだ。\n\n## おもしろエピソード\n2026年には、スイング途中でバット全体を投げ出してしまう**危険スイング**への罰則がNPBで明文化された。警告だけでなく、同じ試合で繰り返した場合や、飛んだバットが人に当たった場合などには退場もあり得る。\n\nつまり、見るべきなのは打球だけではない。==ボールとバットの行方そのものが安全に関わる==というわけだ。\n\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**は通算100本塁打まであと1本、ロッテの**山口航輝**は33号ならリーグ単独2位になる。二人の打席では、打った瞬間の音と、ボールがバットのどこに当たったかを見てみるといい。\n\n芯に近ければ乾いた大きな音がしやすく、詰まれば鈍い音や折れる場面もある。==記録がかかった一打を「道具とボールの衝突」として見ると、打席が少し立体的に見える==のだ。"}, "1-12-a": {"meta": {"id": "1-12-a", "title": "マウンドに人が集まるのはなぜ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-12", "2-08", "2-20"], "sources": ["https://npb.jp/npb/2019rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nマウンドに集まるのは、投手を休ませるためだけではない。**次の打者への攻め方、守備の確認、投手の状態**を短時間でそろえるためなのだ。\n\n## しくみ\n捕手や内野手、監督・コーチが投手と話すために守備位置を離れると、**マウンド訪問**として扱われる場合がある。だから何度でも長話できるわけではない。\n\nたとえば「次は低め中心」「走者が動きそうなら警戒」といった確認をする。==全員の考えをそろえてから次の1球へ進むための短い作戦会議==なのだ。\n\n## 今日の試合で見るなら\n**福島蓮**は7月12日以来の先発で、9月は救援で7試合無失点だった。序盤に走者を背負ったとき、周りがマウンドへ集まるかを見るといい。\n\nロッテの**アンドレ・ジャクソン**も10勝目がかかる。==集まった直後の1球で、配球や守り方がどう変わるかまで見ると面白い==のだ。"}, "1-12-b": {"meta": {"id": "1-12-b", "title": "1試合に何回まで集まっていい？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-12", "1-12-a", "2-20"], "sources": ["https://npb.jp/npb/2019rules.html", "https://npb.jp/npb/2025rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n2026年の規則では、**投手交代を伴わないマウンド訪問は9イニングで1チーム4回まで**だ。延長戦では、==1イニングにつき1回ずつ追加される==のだ。\n\n## しくみ\n回数に数えるのは、監督・コーチが投手と話すために行く場合や、野手が守備位置を離れて投手と相談する場合などだ。けがの確認など、規則上の例外もある。\n\nまた、監督・コーチが同じイニングに同じ投手のところへ2度行く場合は、投手交代につながる別の制限もある。==「4回あるから、同じ回に何度でも行ける」という意味ではない==のだ。\n\n## 今日の試合で見るなら\n**福島蓮**や**アンドレ・ジャクソン**が走者を背負い、捕手やコーチがマウンドへ向かったら1回を意識してみよう。==後半ほど、残してある訪問回数にも意味が出る==のだ。"}, "1-12-c": {"meta": {"id": "1-12-c", "title": "投球の時間制限（ピッチクロック）はある？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-12", "2-07", "3-10"], "sources": ["https://www.nikkansports.com/baseball/news/202608030001287.html", "https://www.nikkansports.com/baseball/news/202609070001217.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==今日のNPB公式戦には、MLBのようなピッチクロックはまだ導入されていない==。ただしNPBと12球団は2026年8月に導入方針を決めており、9月時点では**早ければ2028年の開始**を目指している段階だ。\n\n## しくみ\n**ピッチクロック（投球までの時間を時計で制限する仕組み）**は、投手だけでなく打者側にも準備時間のルールを設ける方式だ。NPBでは導入そのものは決まったが、秒数や罰則、球場設備などの細部はまだ検討中と報じられている。\n\nだから2026年9月28日の試合では、==球場にカウントダウン時計がなくてもルール違反ではない==のだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**と**福島蓮**が、走者の有無や打者との駆け引きで投球間隔を変えるところを見てみよう。==今は時計ではなく、投手と打者が作る「間」も観戦の一部==なのだ。"}, "1-12": {"meta": {"id": "1-12", "title": "「タイム」で試合が止まるのはなぜ？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["1-12-a", "1-12-b", "1-12-c"], "related": ["1-03", "2-07", "2-20"], "sources": ["https://npb.jp/m/news/detail/20190405_01.html", "https://npb.jp/npb/satsuei_haisin_kitei_text_20250201.html", "https://npb.jp/npb/2025rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球の**タイム**は、審判がプレーをいったん止める合図だ。==止まっている間は、走者をアウトにしたり勝手に次のプレーを進めたりできない==のだ。\n\n## しくみ\n野球は、球審が「プレイ」と宣告してから、規則で**ボールデッド（プレー停止中）**になるか、審判が「タイム」を宣告するまで動き続ける。\n\nタイムになる理由はいくつもある。選手のけがや用具の確認、監督・コーチが投手のところへ行くとき、打者が認められて打席を外すときなどだ。==「誰かが手を上げたら必ず止まる」のではなく、審判が認めて初めて止まる==のが大事なのだ。\n\n投手が投球動作に入ったあとなど、好きな瞬間にタイムを取れるわけでもない。審判は試合の安全と公平を保ちながら、必要な中断だけを認める。\n\n## おもしろエピソード\nマウンドへ集まる回数には制限がある。2025年の規則改正で、投手交代を伴わない**マウンド訪問**は9イニングで1チーム4回までになった。\n\nつまりタイムは休憩ではない。==作戦確認に使える回数そのものが、試合の資源になっている==というわけだ。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**や日本ハム先発の**福島蓮**がピンチを迎えたとき、捕手やコーチが近づき、審判がタイムをかける場面があるかもしれない。\n\nそのときは「試合が止まった」とだけ思わず、誰がマウンドへ行ったかを見る。==数十秒の中断でも、次の1球に向けた相談や立て直しが行われている==のだ。"}, "1-13-a": {"meta": {"id": "1-13-a", "title": "1チーム何試合するの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-13", "4-09"], "sources": ["https://npb.jp/games/2026/schedule_note_pl.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\n2026年のパ・リーグは、**1球団143試合**のレギュラーシーズンを戦う。==リーグ内125試合と、セ・リーグ相手の交流戦18試合を合わせて143試合なのだ==。\n\n## しくみ\n同じパ・リーグの5球団とは、それぞれ25試合ずつ戦う。これで125試合になる。さらに**交流戦（セ・リーグ球団との公式戦）**を18試合行う。\n\n143試合すべてが順位を決める成績に入る。勝ち、負け、引き分けを積み重ねた結果で、リーグ優勝やCS進出が決まるというわけだ。\n\n残り試合が少なくなるほど、1試合の重みは見えやすくなる。==「あと何試合あるか」は、順位表を見るときの大事な数字なのだ==。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、残りは**2試合**だ。今日のロッテ戦と10月1日のロッテ戦しか残っていない。\n\nだから**福島蓮**が先発する今日の1試合は、143試合のうちの「ただの1試合」ではない。==残り2試合の最初の1試合==として見ると、ベンチの継投や代打の判断にも緊張感があるのだ。"}, "1-13-b": {"meta": {"id": "1-13-b", "title": "キャンプ・オープン戦って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-13", "1-10"], "sources": ["https://npb.jp/preseason/2026/", "https://www.marines.co.jp/news/detail/202500746925.html", "https://www.fighters.co.jp/news/detail/202500806240.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**春季キャンプ**は開幕へ向けて体とチームを作る期間、**オープン戦**は他球団と実戦で仕上がりを確かめる試合なのだ。==どちらも公式戦の順位には入らないが、開幕メンバーを決める大事な準備になる==。\n\n## しくみ\n2026年はロッテも日本ハムも2月1日から春季キャンプを始めた。ロッテ一軍は宮崎県都城市と沖縄県糸満市、日本ハム一軍は沖縄県名護市で練習した。\n\nキャンプでは守備連係、打撃、投球などを繰り返し、途中から紅白戦（同じ球団内で分かれて行う試合）や練習試合も入る。そこから**オープン戦（春季非公式試合）**へ進み、2026年は2月21日から3月22日まで行われた。\n\n==キャンプで作り、オープン戦で試し、公式戦で勝負する==。この順番を覚えると分かりやすいのだ。\n\n## 今日の試合で見るなら\n今日先発する**福島蓮**も、春の準備から長いシーズンを通って9月末のマウンドに立つ。しかも7月12日以来の先発で、9月は救援で7試合無失点だった。\n\n==春に決めた役割が1年ずっと固定されるとは限らない==。今日の福島のように、シーズン中の状態やチーム事情で役割が変わるところもプロ野球のおもしろさなのだ。"}, "1-13-c": {"meta": {"id": "1-13-c", "title": "オフシーズンは何をしてる？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-13", "8-02"], "sources": ["https://npb.jp/event/2026/", "https://draft.npb.jp/draft/2026/", "https://npb.jp/news/detail/20251202_01.html", "https://www.fighters.co.jp/news/detail/202500810460.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**オフシーズン（公式戦がない時期）**も、野球が完全に止まるわけではない。==選手は休養やトレーニングを行い、球団はドラフト、契約、移籍など来季の準備を進める==のだ。\n\n## しくみ\nレギュラーシーズン後も、上位球団はCSや日本シリーズを戦う。2026年はドラフト会議が10月22日、日本シリーズが10月24日から予定されている。\n\nその後は、球団が翌年の選手契約や編成を進める時期になる。年が明けると**自主トレ（選手が主体となって行う練習）**が増え、2月の春季キャンプへつながる。日本ハムでは2026年1月7日から新人合同自主トレが行われた。\n\n==オフは「休み」より、「次のシーズンへの切り替え期間」と考えると近い==のだ。\n\n## 今日の試合で見るなら\nロッテは今日の時点でCS進出の可能性がなく、日本ハムはまだ2位を争っている。つまり、同じ球場にいる2球団でも、==シーズンの終わり方とオフへ入る時期が違う==。\n\n**清宮幸太郎**や**山口航輝**の個人記録も、残り試合が終われば2026年の最終成績になる。今日の一打が、そのままオフに持ち越す「今年の数字」になるのだ。"}, "1-13": {"meta": {"id": "1-13", "title": "野球の1年ってどう進むの？", "category": "1", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["1-13-a", "1-13-b", "1-13-c"], "related": ["8-02", "4-09"], "sources": ["https://npb.jp/event/2026/", "https://npb.jp/games/2026/schedule_note_pl.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\nプロ野球の1年は、**春季キャンプ（開幕前の集中的な練習期間）**から始まり、オープン戦、レギュラーシーズン、クライマックスシリーズ、日本シリーズへ進むのだ。==今日9月28日は、長い1年の「レギュラーシーズン最終盤」にいる==。\n\n## しくみ\n2026年は、2月に各球団が春季キャンプを行い、2月21日から**オープン戦（順位に直接は入らない開幕前の実戦）**が始まった。セ・パ両リーグの公式戦は3月27日に開幕し、パ・リーグは1球団143試合を戦う。\n\n143試合が終わるころにリーグ順位が決まり、上位3球団は**クライマックスシリーズ（日本シリーズ出場権を争う短期決戦）**へ進む。2026年はファーストステージが10月10日から、ファイナルステージが10月14日から、日本シリーズは10月24日からの予定だ。\n\nつまり、野球は「春に始まって秋に終わる」だけではない。==2月の準備、約半年の公式戦、10月以降の短期決戦までが一本につながっている==のだ。\n\n## おもしろエピソード\nシーズン終盤は、同じ1勝でも意味が変わる。4月の1勝も9月の1勝も順位表では同じ1勝だが、残り試合が少ないほど取り返す時間がなくなるからだ。\n\n今日の日本ハムは3位で、2位西武とは1.5ゲーム差。残りは今日を含めて2試合なので、==「残り何試合か」を知るだけで試合の緊張感が見えやすくなる==。\n\n## 今日の試合で見るなら\n日本ハムは**福島蓮**が先発する。チームはCS（クライマックスシリーズ）を2位で迎えるために、今日を含む残り2試合を連勝することが最低条件だ。\n\n一方、ロッテはCS進出の可能性がない。それでも**山口航輝**には33号本塁打でリーグ単独2位になる個人記録がかかっている。==同じ9月末の1試合でも、チーム順位と個人記録の両方が動いている==と見ると、終盤戦がぐっと分かりやすいのだ。"}, "2-01-a": {"meta": {"id": "2-01-a", "title": "1点差の試合ってどれくらいある？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-01", "2-09", "4-01"], "sources": ["https://pacificleague.com/news/2024/1/57720", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n1点差の試合は、かなり珍しいものではない。==2023年のパ・リーグ球団の試合（交流戦を含む）483試合のうち157試合が1点差で決まり、約**32.5％**だったのだ。==\n\n## しくみ\n約3試合に1試合が1点差だった計算になる。もちろん年によって割合は変わるが、==「1点しか違わないまま終盤へ行く」のは十分ありうる展開なのだ。==\n\n1点差では、**四球**（ボール4つで打者が一塁へ進むこと）ひとつ、守備のミスひとつ、**犠牲フライ**（外野フライの間に三塁走者が生還するプレー）ひとつでも同点になりうる。終盤ほど、1人の走者と1つのアウトが重くなる。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で2位西武を**1.5ゲーム差**で追っている。今日の1勝が重要な状況なので、1点差なら投手交代や代打（別の打者を代わりに打たせること）の意味も大きくなる。\n\n**アンドレ・ジャクソン**や**福島蓮**が1点だけを守っている場面では、==スコアの「差が1」なら、次の1人が試合全体を変えられると考えるといいのだ。=="}, "2-01-b": {"meta": {"id": "2-01-b", "title": "大量点が入るのはどんなとき？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-01", "1-09", "2-03", "2-14"], "sources": ["https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/teams/index_m.html"]}, "body": "## ひとことで\n大量点は、走者がたまったところで長打が出たり、四球や守備のミスで攻撃が切れずに続いたりすると入りやすい。==大事なのは「大当たり1本」より、**3アウトを取れない時間**が続くことなのだ。==\n\n## しくみ\n野球の攻撃は3アウトになるまで続く。**ヒット**、四球（ボール4つで一塁へ進むこと）、**エラー**（守備のミスとして記録されるプレー）が重なると、走者が次々にたまる。\n\nそこで二塁打やホームランが出れば、走者がまとめてホームへ帰る。==さらに次の打者も出塁すれば攻撃は終わらず、1イニング（攻撃1回分）だけで4点、5点と増えることもある。==\n\n投手交代の直後も見どころだ。新しい投手が最初の打者をアウトにできるか、それとも四球や安打で攻撃をつなげられるかで、流れが変わるのだ。\n\n## 今日の試合で見るなら\n**山口航輝**は今季32本塁打、**清宮幸太郎**は通算100本塁打まであと1本だ。==2人の前に走者が何人いるかを見ると、同じホームランでも増える点数が違うと分かる。==\n\n前日の試合はロッテが日本ハムに6対1で勝った。今日も走者が2人、3人とたまったら、次の1球でスコアが大きく動く場面だと考えればいいのだ。"}, "2-01-c": {"meta": {"id": "2-01-c", "title": "野球で逆転が起きやすいのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-01", "1-09", "2-03"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_faq_20250901.html", "https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/teams/index_m.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n野球は時間切れまで逃げ切る競技ではなく、攻撃は**3アウト**になるまで続く。==走者がたまれば、1本の長打で2点、3点と入り、点差が一気にひっくり返るのだ。==\n\n## しくみ\nたとえば1点負けていても、一塁に走者がいる状態でホームランが出れば2点入って逆転できる。満塁なら、**満塁ホームラン**（走者3人と打者の計4人が得点する本塁打）で4点入る。\n\n四球やヒットが続くと、アウトを増やさずに走者だけがたまることもある。==点差より「何アウトで、走者が何人いるか」を見ると、逆転の近さが分かりやすいのだ。==\n\nホームのチームが9回裏以降に勝ち越すと、その得点で試合が終わる。これが**サヨナラ**で、終盤の逆転が特に大きく感じられる理由のひとつだ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は今季32本塁打、日本ハムの**清宮幸太郎**は通算100本塁打まであと1本だ。どちらも、走者がいる場面なら1球で複数点を動かせる。\n\n==9回裏にロッテが1点負け、走者を1人置いて山口に回れば、ホームラン1本で逆転サヨナラになる。== まず点差だけでなく、アウト数と塁上の走者を一緒に見るといいのだ。"}, "2-01": {"meta": {"id": "2-01", "title": "何点入ることが多いの？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-01-a", "2-01-b", "2-01-c"], "related": ["1-09", "2-03", "4-01"], "sources": ["https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n==2026年9月27日までのパ・リーグでは、1チームが1試合で取る点は平均すると約**3.8点**なのだ。== 3対2や4対3も自然だし、0点の日や10点近く入る日もある。\n\n## しくみ\nパ・リーグ6球団は合計830「チーム試合」を戦い、合計3167得点している。3167÷830なので、**1チーム1試合あたり約3.82点**だ。\n\n「チーム試合」は、同じ1試合を両チームそれぞれ1回として数える言い方だ。両軍を合わせた平均なら約7.6点になるが、毎試合同じように点が入るわけではない。\n\n==平均は「今日も4点入る」という予言ではなく、だいたいの物差しなのだ。== 先発投手の出来や四球、長打、エラー（守備のミスとして記録されるプレー）が重なると、点数は大きく上下する。\n\n今季は日本ハムが141試合で580得点、1試合平均約4.11点。ロッテは134試合で473得点、約3.53点だ。==同じリーグでも、チームによって点の入り方には差がある。==\n\n## おもしろエピソード\n前日の9月27日は、ロッテが日本ハムに**6対1**で勝った。平均より多く点が入る試合も、1点しか入らない試合も、同じシーズンの中で普通に起こるのだ。\n\n## 今日の試合で見るなら\n序盤が0対0でも、すぐ「動かない試合」と考えなくていい。ロッテ先発の**アンドレ・ジャクソン**と日本ハム先発の**福島蓮**が走者を出さずに抑えているなら、それ自体が見どころだ。\n\n走者がたまったところで**山口航輝**や**清宮幸太郎**に回れば、1球でスコアが大きく動く。==まずは「4点前後」を目安にしつつ、実際の試合がそこからどう外れるかを見ると分かりやすいのだ。=="}, "2-02-a": {"meta": {"id": "2-02-a", "title": "二塁打・三塁打って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-02", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/lb_2b_p.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html"]}, "body": "## ひとことで\n二塁打は、1本のヒットで打者が二塁まで進むこと。三塁打は三塁まで進むヒットだ。まとめて長打（1本で二つ以上の塁を取る安打）と呼ぶ。\n\n## しくみ\n外野手の間を抜けたり、フェンス近くまで転がったりすると、打者は一塁で止まらず先の塁を狙える。記録では、ヒットで進んだ塁の数を「塁打」と数える。二塁打なら2塁打、三塁打なら3塁打だ。\n\n三塁打は二塁打より、打球の行き先と走る速さの両方が必要になりやすい。外野手がボールを取りに行く間に、打者は二塁を回って三塁へ向かうのだ。\n\n## おもしろエピソード\n前日9月27日は、ロッテの寺地隆成が初回に先制の適時二塁打（点が入るタイムリーの二塁打）を放った。二塁まで進めると、次の単打でも本塁へ帰りやすくなる。\n\n## 今日の試合で見るなら\nロッテの西川史礁は9月27日時点で二塁打28本。打球が外野の間を抜けたら、一塁で止まるか二塁まで走るかを見てみよう。二塁を蹴ってさらに三塁へ向かったら、球場の空気が一段変わるはずだ。"}, "2-02-b": {"meta": {"id": "2-02-b", "title": "内野安打って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-02", "2-04"], "sources": ["https://npb.jp/news/detail/20260701_02.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html"]}, "body": "## ひとことで\n内野安打は、内野に転がった打球なのに、守備側が一塁で打者をアウトにできずヒットになることだ。遠くへ飛ばさなくても、足で作れるヒットがある。\n\n## しくみ\nたとえば三遊間（三塁手と遊撃手の間）へのゴロを三塁手が捕って一塁へ投げても、打者の足が先ならセーフだ。守備の普通のプレーでアウトにできなかったと公式記録員が判断すれば、内野安打になる。\n\n一方、捕った野手の悪送球などが原因なら失策（エラー）になることがある。見た目が同じ「一塁セーフ」でも、記録は違うわけだ。\n\n## おもしろエピソード\nNPBは2026年7月、ある打球の公式記録を「一塁野選」（野選：守備側が別の走者を狙った結果の出塁）から「投手内野安打」へ訂正した。ヒットかどうかは、試合後に公式記録が見直されることもあるのだ。\n\n## 今日の試合で見るなら\n前日9月27日、ロッテの西川史礁は初回に内野安打で出塁した。今日も打球が内野に転がったら、ボールだけでなく打者と一塁送球の競争を見るとよい。"}, "2-02-c": {"meta": {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-02", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\n打率は「打数のうち、何割がヒットだったか」を表す数字だ。打率.300、つまり3割なら、10打数で約3本ヒットを打つ計算になる。\n\n## しくみ\nNPBの計算式は「安打数÷打数」だ。四球（フォアボール）や犠打（バントで走者を進める打撃など）は、そもそも打数に入らない。だから、単純な「打席の3割」ではない。\n\n3割がすごいのは、投手と守備が強いからだ。プロでは10打数のうち7本近くヒットにならなくても、一流と呼ばれる。9月27日時点のパ・リーグで、規定打席（打率ランキングに載るのに必要な打席数）に達して打率.300以上なのは4人だけ。3割は今季でもはっきり上位の水準なのだ。\n\n## 今日の試合で見るなら\nロッテの西川史礁は9月27日時点で打率.292でリーグ5位。3割まであと少しの位置にいる。今日4打数2安打のように複数安打を重ねれば打率は上がるし、4打数0安打なら下がる。打席ごとに数字が動く終盤戦なのだ。"}, "2-02": {"meta": {"id": "2-02", "title": "Hやヒットって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-02-a", "2-02-b", "2-02-c"], "related": ["2-04", "4-01", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\nヒットは安打（あんだ：打ったボールで安全に塁へ出る記録）のことだ。スコアボードの「H」は、チームが打ったヒットの合計を表す。\n\n## しくみ\n打者が打ったボールで一塁以上へ進み、守備側の失策（エラー：普通なら処理できる打球をミスすること）などによらず出塁すると、基本的にヒットになる。外野まで飛ばなくてもよい。内野に転がった打球でも、送球より先に一塁へ着けば内野安打になることがあるのだ。\n\nヒットには単打（シングル：一塁まで進む安打）、二塁打、三塁打、本塁打がある。NPBの記録では、長打率（1打数あたりに進んだ塁の多さ）を計算するとき単打を1、二塁打を2、三塁打を3、本塁打を4の「塁打」として数える。\n\nただし、打った人が一塁へ着いたら全部ヒット、というわけではない。野手のミスなら失策、先の走者をアウトにしようとして打者が残った場合は野選（フィルダースチョイス：守備側が別の走者を狙った結果の出塁）になることがある。公式記録員がプレーを見て記録を決めるのだ。\n\n## おもしろエピソード\n前日の9月27日、ロッテの西川史礁は初回に内野安打で出塁し、そのあと先制のホームを踏んだ。強い打球だけがヒットではなく、足の速さも「H」を増やせるという例だ。\n\n## 今日の試合で見るなら\nロッテでは西川史礁が9月27日時点で打率.292。派手なホームランだけでなく、まず一塁へ生きる打球をどれだけ作れるかを見るとよい。\n\n日本ハムでは水野達稀や清宮幸太郎の打席で、スコアボードの「H」が増えるか確認してみよう。1本のヒットが次の打者につながり、得点の形ができていくのだ。"}, "2-03-a": {"meta": {"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-03", "1-06-b", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n名前の違いは、そのホームランで何点入るかだ。走者なしはソロで1点、1人いれば2ラン、2人いれば3ラン、満塁なら満塁ホームランで4点入る。\n\n## しくみ\nホームランでは、打者と塁上の走者が全員得点する。だから「塁にいる人数＋1」が、そのまま入る点になる。\n\nたとえば一塁に走者がいる時の本塁打は2点。満塁（すべての塁に走者がいる状態）なら、走者3人と打者の計4人が帰る。これを満塁ホームラン、またはグランドスラムという。\n\n## 今日の試合で見るなら\nロッテは1番の西川史礁が出塁し、2番の山口航輝に回れば、山口の一発は2ランになりうる。日本ハムも水野達稀や田宮裕涼が塁に出て清宮幸太郎を迎えると、通算100号が2点以上入る一発になるかもしれない。\n\n打者を見る前に塁上の人数を数えると、「この一発なら何点か」がすぐ分かるのだ。"}, "2-03-b": {"meta": {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-03", "7-04", "7-04-b"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/31335151.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/11815138.html"]}, "body": "## ひとことで\n変わりうる。向かい風なら大きな打球が押し戻され、追い風なら伸び、横風なら左右へ流される。マリンでは風もプレーの一部なのだ。\n\n## しくみ\nZOZOマリンは球場に風速計があり、上空と地上の風速情報を自動表示している。球団公式も、海側からの風を前提に花火の打ち上げ位置を変えている。それほど風向きの影響を受ける球場なのだ。\n\nただし「海風なら必ずホームランが増える」とは言えない。見るべきなのは、その瞬間にどちら向きへ、どれくらい吹いているかだ。同じ角度の大飛球でも、風向次第でフェンス手前に落ちたり、逆にひと伸びしたりする。\n\n## 今日の試合で見るなら\n山口航輝は32本、井上広大は7本、清宮幸太郎は23本、万波中正は21本塁打で今日を迎える。4人の大きなフライが上がったら、風速表示も一緒に見てみよう。\n\n「打った瞬間は入ったように見えたのに失速した」「逆に最後まで伸びた」という差が出れば、マリンらしさを体感できる場面だ。"}, "2-03-c": {"meta": {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-03", "1-03-c", "2-18"], "sources": ["https://npb.jp/news/detail/20260611_02.html", "https://www.nikkansports.com/baseball/news/202609220001618.html", "https://www.daily.co.jp/baseball/2026/09/22/0020848833.shtml"]}, "body": "## ひとことで\nリクエストは、監督がプレーの判定について映像での確認を求める仕組みだ。審判が映像を見直し、元の判定を維持することも、覆すこともある。\n\n## しくみ\n一瞬のタッチやフェンス際の打球は、人の目だけでは判断が難しいことがある。そこで映像を使って確認する。検証中は試合が止まり、判定が出ると再開する。\n\n2026年6月には、盗塁のアウト判定に阪神がリクエストを使い、検証後もアウトのままだった例がある。NPBは、映像検証後の判定への異議申し立ては認められないと説明している。\n\n## おもしろエピソード\n9月22日のZOZOマリンでは、山口航輝の打球が最初は二塁打と判定された。サブロー監督がリクエストを出そうとする前に審判団が協議し、映像確認の結果、本塁打へ変更された。映像判定でも、必ずしも監督のリクエストから始まるとは限らないのだ。\n\n## 今日の試合で見るなら\n本塁や塁上のきわどいセーフ・アウト、フェンス際の大飛球で監督がベンチを出たら注目しよう。ビジョンに映像が出ても、最終的な判定は審判の発表を待つのがポイントだ。"}, "2-03": {"meta": {"id": "2-03", "title": "ホームランって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-03-a", "2-03-b", "2-03-c"], "related": ["1-09", "2-02-a", "4-03", "4-06"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/31335151.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.nikkansports.com/baseball/news/202609260001489.html", "https://www.daily.co.jp/baseball/2026/09/22/0020848833.shtml"]}, "body": "## ひとことで\nホームランは、打者が一気に本塁まで帰って得点できる安打だ。ふつうは、フェアの打球が外野フェンスを越えると本塁打になる。\n\n## しくみ\nフェンス越えの本塁打なら、打った本人だけでなく、その時に塁にいた走者も全員が本塁へ帰れる。走者なしなら1点、満塁なら一度に4点だ。だから同じ1本でも、塁上に何人いるかで試合への影響が大きく変わる。\n\n打者は一塁、二塁、三塁、本塁の順にすべての塁を踏む。守備側がボールを追ってアウトにする必要はなく、走者も基本的には落ち着いて一周できる。外野フェンスを越えず、守備がボールを処理する間に一周するランニングホームランもあるが、こちらはかなり珍しい。\n\nホームランはヒットの一種で、記録上は4塁打（ヒットで進んだ塁の数が4）だ。1打席で最大4点を生み出せるので、試合の流れを一振りで変えやすい。\n\n## おもしろエピソード\nロッテの山口航輝は9月22日、いったん二塁打と判定された大飛球が映像確認で本塁打に変わり、今季32号になった。ホームランかどうかは、フェンス付近のほんの少しの違いで決まることもあるのだ。\n\n## 今日の試合で見るなら\n山口は9月27日時点で32本塁打。日本ハムの清宮幸太郎は9月26日に23号を放ち、通算100本塁打まであと1本で今日を迎える。\n\nさらにロッテの井上広大は今季7本、日本ハムの万波中正は21本。大きな打球が上がったら、まず外野手ではなく打球そのものを追い、フェンスを越えるかを見るとよい。今日もっとも分かりやすく球場全体が動く瞬間の一つだ。"}, "2-04-a": {"meta": {"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-04", "2-02"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/news/detail/20170425_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nヒットかエラーかを決めるのは、球場の公式記録員だ。審判のセーフ・アウト判定とは別の仕事なのだ。\n\n## しくみ\nまず審判がプレーを判定する。そのあと公式記録員が、「普通に守っても一塁でアウトにできなかった打球」なら安打、「普通ならアウトにできたのに守備のミスで生かした」なら失策、と記録する。\n\n判断が微妙なときは、規則上は打者に有利な記録を与える考え方がある。だから同じ「野手が触って一塁セーフ」でも、ヒットとエラーの両方があり得るのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎の速いゴロを遊撃（ショート：二塁と三塁の間を守る内野手）の山崎剛が横っ飛びで触っただけなら、ヒットになることがある。逆に正面のゆるいゴロをはじいて一塁に投げられなければ、エラーになりやすい。\n\n球場ではプレー直後だけでなく、その後のスコアボードにも注目するといい。HかEかが表示されれば、公式記録員の判断が見えるのだ。"}, "2-04-b": {"meta": {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-04", "2-09-a"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。守備側がうまくいかなかったように見えても、野選（野手選択）、暴投、捕逸という別の記録になり、エラーがつかない場合があるのだ。\n\n## しくみ\n野選（野手選択：打者ではなく先の走者をアウトにしようとした結果、打者を一塁に生かすこと）は、送球先の選び方に関係する記録だ。たとえば一塁で打者をアウトにできそうなのに、二塁の走者を狙って両方セーフになれば、安打ではなく野選になる場合がある。\n\n暴投（ワイルドピッチ：捕手が普通には止めにくい投球で走者を進めること）は投手側の記録だ。捕逸（パスボール：普通なら捕れる投球を捕手が処理できず走者を進めること）は捕手側の記録で、どちらも失策とは別扱いなのだ。\n\n## 今日の試合で見るなら\n走者がいる場面では、ロッテ先発のアンドレ・ジャクソンが投げる低い変化球と、それを受ける捕手の佐藤都志也を見てみるといい。ボールが後ろへ抜けて走者が進んだとき、暴投か捕逸かは投球の難しさで分かれる。\n\n内野では山崎剛がゴロを捕ったあと、どの塁へ投げるかにも注目だ。捕る技術だけでなく、アウトを取りやすい場所を瞬時に選ぶのも守備なのだ。"}, "2-04-c": {"meta": {"id": "2-04-c", "title": "エラーした選手はどうなる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-04", "2-04-a", "4-01"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scoring/calculation.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nエラー（失策：守備のミスとして記録されるプレー）をしても、その選手が自動的に退場したり、交代させられたりするわけではない。==まず起きるのは、公式記録に**失策1**がつくことなのだ。==\n\n## しくみ\n失策は個人とチームの守備記録に残る。**守備率**は「刺殺＋補殺」を「刺殺＋補殺＋失策」で割るので、失策が増えると数字にも反映される。\n\nただし、1回の失策で試合に出られなくなる規則はない。そのまま守備を続けることもあり、交代させるかどうかは監督の選手起用の判断になる。\n\n失策のあとに走者が得点した場合は、投手の**自責点**（投手が責任を負う失点）にならないこともある。==「点は入ったが、投手の自責点ではない」という記録が起こるのだ。==\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**や日本ハム先発の**福島蓮**の後ろでエラーが出たら、スコアボードの「E」に注目するといい。\n\n==その走者があとでホームへ帰ったら、「この失点は投手の自責点になるのか」まで見ると、エラーが記録にどう影響するかが分かるのだ。== 選手が次の守備機会でどうプレーするかも、そのまま見続けられる。"}, "2-04": {"meta": {"id": "2-04", "title": "エラーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-04-a", "2-04-b"], "related": ["2-02", "4-01"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nエラー（失策：普通ならアウトにできた守備で、ミスによって走者を生かしたり進めたりした記録）とは、守備のミスにつく公式記録なのだ。見た目に失敗していても、必ずエラーになるわけではない。\n\n## しくみ\n基準は「その野手なら普通の守備で処理できたか」だ。ゴロをはじく、捕れるフライを落とす、アウトにできる送球を大きくそらす、といった場面では失策になることがある。\n\n逆に、強烈な打球に飛びついたが届かなかった、難しい体勢から送球して間に合わなかった、という場面は失策にならないことも多い。公認野球規則でも、判断だけの誤りは原則として失策にしないと定めている。\n\nだから、観客から見て「今のはミスでは？」と思っても、記録はヒットになることがあるのだ。スコアボードの「E」は、守備側の失策数を表している。\n\n## おもしろエピソード\nエラーかヒットかを決めるのは審判ではなく、公式記録員だ。公式記録員は試合を見ながら、安打・失策などの記録を独自に判断する役目を持っている。\n\n## 今日の試合で見るなら\nロッテの遊撃・山崎剛や二塁・小川龍成のところへ、日本ハムの清宮幸太郎が強いゴロを打った場面を見てみるといい。取り切れずに一塁がセーフでも、強烈な打球ならヒット、普通に処理できたと判断されればエラーになり得るのだ。\n\n外野では、海風のあるZOZOマリンで藤原恭大や髙部瑛斗がフライを追う。落球したから即エラー、ではなく、「普通の守備で捕れたか」が基準になるところが見どころだ。"}, "2-05-a": {"meta": {"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "4-01"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備位置には1〜9の番号がある。背番号ではなく、スコアを短く書くための「住所」のような番号なのだ。\n\n## しくみ\n番号は次の順番だ。\n\n- 1＝投手、2＝捕手、3＝一塁手\n- 4＝二塁手、5＝三塁手、6＝遊撃手\n- 7＝左翼手、8＝中堅手、9＝右翼手\n\nたとえば「6-3」なら、遊撃手がゴロを処理して一塁手へ送球し、アウトを取ったという意味になる。\n\n## 今日の試合で見るなら\nロッテの予想守備を番号にすると、アンドレ・ジャクソンが1、佐藤都志也が2、井上広大が3、小川龍成が4、寺地隆成が5、山崎剛が6、西川史礁が7、髙部瑛斗が8、藤原恭大が9だ。\n\n山崎から小川、井上へ渡る併殺（ゲッツー：一度に2つアウトを取ること）が出れば「6-4-3」になる。スコア表示や実況で数字が出ても、誰が動いたかを頭の中でたどれるようになるのだ。"}, "2-05-b": {"meta": {"id": "2-05-b", "title": "内野と外野は何が違う？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n内野（4つの塁に近い範囲）は、ゴロを素早くアウトにする仕事が多い。外野（そのさらに奥の範囲）は、飛んだ打球を広く追い、長打の被害を小さくする仕事が多いのだ。\n\n## しくみ\n内野手は一塁手・二塁手・三塁手・遊撃手の4人だ。打球を捕ってから一塁へ送るまでの時間が短いので、捕球から送球への速さが重要になる。\n\n外野手は左翼手・中堅手・右翼手の3人だ。守る面積が広く、頭上を越されると二塁打や三塁打になりやすい。フライの落下地点を読むことと、進塁を防ぐ返球が大切なのだ。\n\n## 今日の試合で見るなら\nロッテでは小川龍成と山崎剛が内野中央、髙部瑛斗と藤原恭大が外野の中心になる。日本ハムの万波中正が強い打球を放ったら、ゴロなら内野の速い処理、外野を抜く打球なら外野手の追い方と返球を見れば違いがわかりやすい。\n\nZOZOマリンでは風でフライの落下地点が変わることもある。内野と外野では、同じ「捕る」でも準備する距離と時間がかなり違うのだ。"}, "2-05-c": {"meta": {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05-a"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nシフト（打者の特徴に合わせて守る位置を変える作戦）とは、打球が来そうな場所へ先回りする守備なのだ。二塁手や遊撃手は、いつも同じ場所に立つわけではない。\n\n## しくみ\nたとえば引っ張る打球が多い打者なら、その方向を少し厚く守る。逆方向へ流す打球が多い打者なら、そちらへ寄ることもある。\n\n動かすのは左右だけではない。強い打球が多ければ少し深く、バントの可能性があれば前へ出るなど、走者やアウト数でも位置は変わる。2026年の規則改正で、NPBでも投球時に内野手4人が二塁ベースの両側に2人ずつ分かれていなければならなくなった。守備側はその範囲で配置を工夫するのだ。\n\n## 今日の試合で見るなら\n日本ハムの清宮幸太郎や田宮裕涼が打席に入る前、ロッテの二塁・小川龍成と遊撃・山崎剛の位置を見てみるといい。右打者の万波中正のときと比べると、立つ場所が変わるかもしれない。\n\n投球のたびに打球だけを見るのではなく、投げる直前の内野手を見る。数歩の移動にも「ここへ飛ぶ確率が高い」という守備側の読みが表れているのだ。"}, "2-05-d": {"meta": {"id": "2-05-d", "title": "中継プレーって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n中継プレー（遠い場所からの送球を途中の野手が受け、次の塁へつなぐ連携）は、外野から本塁などへ正確に速く返すための仕組みだ。\n\n## しくみ\n外野の深い場所から本塁までを一人で投げると、距離が長くなり、送球がそれやすい。そこで内野手が途中に入り、外野手の送球を受けて本塁や三塁へ投げ直す。\n\n中継に入る野手は、外野手と狙う塁を結ぶ線上に立つ。送球が十分強ければそのまま通し、弱かったり方向を変えたいときは捕って投げる。だから中継役は「ただ間に立つ人」ではないのだ。\n\n## 今日の試合で見るなら\n日本ハムの万波中正が右中間（右翼手と中堅手の間）を破る長打を打った場面を想像するとわかりやすい。ロッテの藤原恭大や髙部瑛斗が打球を処理し、小川龍成や山崎剛が中継地点へ走り、最後は本塁の佐藤都志也へつなぐ。\n\nあなたはボールだけでなく、打球が外野へ飛んだ瞬間の内野手も見るといい。誰かが外野方向へ走り出したら、その選手が送球の道を作ろうとしている可能性が高いのだ。"}, "2-05": {"meta": {"id": "2-05", "title": "守備って？", "category": "2"
