<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロッテ×日本ハム観戦ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f4f6f6; --ink:#08131a; --sub:#5d6a70; --line:#e2e7e9; --accent:#18917e; --accent-ink:#ffffff;
  --board:#0f1d19; --board-line:#26372f; --board-ink:#e9efe9; --led:#ffd449; --ball:#3fd26a; --strike:#ffd449; --out:#ff5a4f; --lamp-off:#2c3b35;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
header .meta{margin-left:auto;color:var(--sub);font-size:.78rem}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;line-height:1.5;margin:.2em 0 .5em;text-wrap:balance}
h2{font-size:1.2rem;line-height:1.5;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:1.4em 0 .3em}
p{margin:0 0 1.1em}
a{color:var(--accent)}
.lead{color:var(--sub);font-size:.88rem;line-height:1.7}
.eyebrow{font-size:.75rem;color:var(--sub);letter-spacing:.08em;margin:0 0 4px}
.back{display:inline-block;margin-bottom:14px;font-size:.88rem;color:var(--sub);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px}
.section-title{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:30px 0 10px}

/* ガイド切り替え（TOP上部） */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.guide{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);background:var(--bg)}
.guide b{font-size:.98rem;line-height:1.45}
.guide span{font-size:.75rem;color:var(--sub)}
.guide:hover,.q:hover{border-color:var(--accent)}
.guide.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}
.guide.wide span{margin-left:auto}

/* 質問ボタン（横2列） */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.5;font-weight:700}
.q small{font-weight:400;font-size:.72rem;color:var(--sub)}
.q.off{background:var(--surface);color:var(--sub);font-weight:400}
.q .mark{color:var(--accent);font-size:.72rem;font-weight:700}

/* 速報ボード */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.board .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.board .inning{font-family:"Roboto Mono",ui-monospace,monospace;color:var(--led);font-weight:700;font-size:1.05rem}
.board .status{font-size:.78rem;opacity:.8}
.board .upd{margin-left:auto;font-size:.72rem;opacity:.7}
.board a{color:var(--led)}
.ls{overflow-x:auto}
.ls table{border-collapse:collapse;width:100%;font-family:"Roboto Mono",ui-monospace,monospace}
.ls th,.ls td{border-bottom:1px solid var(--board-line);padding:5px 1px;text-align:center;font-size:.9rem}
.ls th{font-weight:500;opacity:.65;font-size:.75rem}
.ls td.team{font-size:.8rem;text-align:left;font-family:"Noto Sans JP",sans-serif;font-weight:700;white-space:nowrap;padding-right:8px}
.ls td.r{color:var(--led);font-weight:700}
.ls td.sum{border-left:1px solid var(--board-line)}
.sit{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lamps{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:.85rem}
.lamps button{all:unset;display:flex;gap:6px;cursor:pointer;padding:2px 0}
.lamps button:focus-visible,.bases button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.lamp{width:15px;height:15px;border-radius:50%;background:var(--lamp-off)}
.lamp.b{background:var(--ball)}.lamp.s{background:var(--strike)}.lamp.o{background:var(--out)}
.bases{position:relative;width:96px;height:78px;justify-self:end}
.bases button{all:unset;position:absolute;width:26px;height:26px;transform:rotate(45deg);border:2px solid var(--board-ink);opacity:.55;cursor:pointer}
.bases button.on{background:var(--led);border-color:var(--led);opacity:1}
.bases .b1{right:6px;top:30px}.bases .b2{left:35px;top:4px}.bases .b3{left:6px;top:30px}
.who{font-size:.82rem;line-height:1.6;opacity:.9;grid-column:1/-1}
.hint{font-size:.72rem;opacity:.65}

/* スタメン */
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-col{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.team-col h4{margin:0;padding:8px 10px;font-size:.85rem;background:var(--surface);display:flex;justify-content:space-between}
.team-col h4 small{font-weight:400;color:var(--sub)}
.team-col ol{list-style:none;margin:0;padding:0}
.team-col li{display:grid;grid-template-columns:1.3em 1.6em 1fr;gap:4px;padding:6px 10px;border-top:1px solid var(--line);font-size:.86rem;line-height:1.5;font-variant-numeric:tabular-nums}
.team-col li .n{color:var(--sub)}
.team-col li .pos{color:var(--sub);font-size:.78rem}
.team-col li a{color:var(--ink);text-decoration:none;font-weight:700}
.team-col li.p{background:var(--surface)}

/* 記事 */
.article h2{margin:2.2em 0 .6em}
.sec-head{display:flex;align-items:flex-start;gap:10px;margin:2.2em 0 .7em}
.sec-head h2{margin:0;flex:1}
.gpt{font:inherit;font-size:.74rem;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:7px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.gpt svg{width:12px;height:12px}
.gpt:hover{color:var(--accent);border-color:var(--accent)}
.gpt.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gpt:focus-visible,.q:focus-visible,.guide:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:.86rem;line-height:1.7;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.article table th,.article table td,.plain th,.plain td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
ul,ol{padding-left:1.3em;margin:0 0 1.1em}
li{margin:.2em 0}
.src{font-size:.78rem;color:var(--sub);word-break:break-all;line-height:1.7}
mark{background:linear-gradient(transparent 55%,#fff176 55%);color:inherit;padding:0 1px}
strong{font-weight:700}
figure{margin:20px 0}figure img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:8px;background:var(--surface)}
figcaption{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:6px}figcaption span{font-size:.72rem}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.btn{font:inherit;font-size:.9rem;border:0;border-radius:999px;padding:9px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin:4px 6px 4px 0}
.btn.sub{background:var(--surface);color:var(--ink)}
@media (max-width:380px){.lineup{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}, {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "check": false}]}, {"id": "1-08", "title": "アウトってどうやって取るの？", "star": true, "check": false, "children": [{"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "check": false}, {"id": "1-08-b", "title": "フライとゴロって？", "check": false}, {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "check": false}]}, {"id": "1-09", "title": "点ってどうやって入るの？", "star": true, "check": false, "children": [{"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "check": false}, {"id": "1-09-b", "title": "打点って？", "check": false}]}]}, {"no": "2", "title": "打つ・投げる・守る（プレーの仕組み）", "items": [{"id": "2-01", "title": "何点入ることが多いの？", "star": false, "check": false, "children": [{"id": "2-01-a", "title": "1点差の試合ってどれくらいある？", "check": false}, {"id": "2-01-b", "title": "大量点が入るのはどんなとき？", "check": false}]}, {"id": "2-02", "title": "Hやヒットって？", "star": true, "check": false, "children": [{"id": "2-02-a", "title": "二塁打・三塁打って？", "check": false}, {"id": "2-02-b", "title": "内野安打って？", "check": false}, {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "check": false}]}, {"id": "2-03", "title": "ホームランって？", "star": true, "check": false, "children": [{"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "check": false}, {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "check": false}, {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "check": false}]}, {"id": "2-04", "title": "エラーって？", "star": false, "check": false, "children": [{"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "check": false}, {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "check": false}]}, {"id": "2-05", "title": "守備って？", "star": false, "check": false, "children": [{"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "check": false}, {"id": "2-05-b", "title": "内野と外野は何が違う？", "check": false}, {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "check": false}, {"id": "2-05-d", "title": "中継プレーって？", "check": false}]}, {"id": "2-06", "title": "ファインプレーって？", "star": false, "check": false, "children": [{"id": "2-06-a", "title": "ゴールデングラブ賞って？", "check": ck": false}, {"id": "7-11-b", "title": "ブルペンやベンチは見える？", "check": false}]}, {"id": "7-12", "title": "帰りの混雑を避けるには？🔍", "star": false, "check": true, "children": []}]}, {"no": "8", "title": "もっと楽しむ（任意）", "items": [{"id": "8-01", "title": "野球をもっと知るには？", "star": false, "check": false, "children": [{"id": "8-01-a", "title": "テレビや配信で観るには？", "check": false}]}, {"id": "8-02", "title": "次はいつ観に行ける？", "star": false, "check": false, "children": [{"id": "8-02-a", "title": "CSや来季のチケットは？🔍", "check": true}]}]}], "articles": {"1-01-a": {"meta": {"id": "1-01-a", "title": "何人でやるの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "2-16"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備でグラウンドに出るのは1チーム9人だ。攻撃も9人の打順を順番に回していく。\n\n## しくみ\n守備の9人は、投手1人、捕手1人、内野手4人、外野手3人に分かれる。誰か1人で全部を守るのではなく、打球が飛びそうな場所を9人で分担する仕組みなのだ。\n\nベンチには控え選手もいて、代打（打つ選手の交代）や代走（走る選手の交代）、投手交代などで途中から出場できる。だから試合全体では、9人より多くの選手が登場することが普通だ。\n\n## 今日の試合で見るなら\nロッテの守備では、アンドレ・ジャクソンが投手、佐藤都志也が捕手に入る予想だ。日本ハムの攻撃が始まったら、まず「投手と捕手の2人」と、その後ろに広がる7人を見ると、9人の役割がつかみやすいのだ。"}, "1-01-b": {"meta": {"id": "1-01-b", "title": "勝ち負けはどう決まる？引き分けはある？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-01-d", "1-04-b", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n試合が終わった時点で、得点の多いチームが勝ちだ。同点のまま規定の回まで終われば、NPBの公式戦では引き分けも記録される。\n\n## しくみ\n得点は、走者が一塁、二塁、三塁を回って本塁に戻ると1点ずつ入る。途中まで何本ヒットを打っていても、最終的にはこの得点の合計で勝敗が決まるのだ。\n\n9回を終えて同点なら、そこで必ず終わるとは限らない。延長戦（9回で決着しないときに追加で行う回）に入る場合がある。2026年のパ・リーグ勝敗表にも「分」という欄があり、引き分けは実際に順位計算へ残る。\n\n## 今日の試合で見るなら\n今日は日本ハムが3位、ロッテが5位で迎える試合だ。日本ハムは2位西武を追っているので、終盤に同点なら「負けない」だけでなく「勝ち切れるか」が大きな意味を持つ。\n\nたとえば清宮幸太郎の一打で同点になっても、それだけでは勝ちではない。最後にスコアボードの合計得点がどちらに傾いたかを見るのだ。"}, "1-01-c": {"meta": {"id": "1-01-c", "title": "1試合は何時間くらい？今日は何時に終わりそう？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-01-d", "1-03-c"], "sources": ["https://npb.jp/statistics/2026/time.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日は18時開始なので、目安は21時すぎだ。2026年のパ・リーグは、9回で終わった試合の平均が3時間03分、延長などを含む全試合平均が3時間08分となっている。\n\n## しくみ\n野球には「90分で終了」のような固定時間がない。3アウトを取るまで攻撃が続くので、打者がよく出塁する試合、投手交代が多い試合、延長戦に入る試合ほど長くなりやすいのだ。\n\nNPB公式の9月27日時点の数字を18時に足すと、9回試合の平均なら21時03分ごろ、全試合平均なら21時08分ごろになる。ただし平均は予定時刻ではない。雨で中断すれば、その時間だけ終了も後ろへずれる。\n\n## 今日の試合で見るなら\n先発はロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。福島は救援から先発へ戻る登板なので、早い回から継投（投手を次々に交代すること）になれば、平均より長くなる材料になる。\n\n帰りの時間を考えるなら、まず21時台を中心に考えつつ、延長や雨の中断で遅くなる余地も残しておくとよいのだ。"}, "1-01-d": {"meta": {"id": "1-01-d", "title": "延長戦って？何回までやるの？", "category": "1", "level": "2", "priority": "normal", "needs_check": true, "related": ["1-01-b", "1-01-c"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/history/2026/review_rec_p.html", "https://www.nippon.com/ja/news/kd1471489503175951051/"]}, "body": "## ひとことで\n延長戦は、9回を終えて同点のときに追加で行う回のことだ。2026年にも12回まで進んだ公式戦がNPBの記録に残っている。\n\n## しくみ\n10回、11回と、通常の回と同じように表と裏の攻撃を続ける。どこまで行うかは大会や年度の規定で決まるので、「野球はいつでも同じ上限」と考えないほうがよいのだ。\n\n<!-- TODO: 2026年のセ・パ公式戦について、延長の上限と上限到達時の引き分けを定めたNPBまたはパ・リーグの規定本文を公式ページで確認 -->\n\n2026年のNPB公式記録には12回の試合が複数ある。たとえば9月12日の西武対日本ハムは、延長十二回を終えて3-3の引き分けだった。ただし、今回確認できた公式ページでは「レギュラーシーズンは何回を上限とするか」という規定本文そのものを特定できなかったため、上限はここでは断定しない。\n\n## 今日の試合で見るなら\n9回が終わって同点なら、「もう終わり」と席を立つ前に場内表示を確認するのだ。清宮幸太郎や山口航輝の一打で終盤に同点へ動けば、その先に追加の回が続く可能性がある。"}, "1-01": {"meta": {"id": "1-01", "title": "野球って何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-01-a", "1-01-b", "1-01-c", "1-01-d"], "related": ["1-03", "1-05", "1-06", "1-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球は、2チームが交代で「点を取りにいく側」と「止める側」になり、最後に得点の多いほうが勝つ競技なのだ。攻撃では打った人が一塁、二塁、三塁、本塁と進み、本塁まで戻ると1点になる。\n\n## しくみ\n試合は回（イニング：攻撃と守備を1度ずつ行う区切り）に分かれる。1回の表は先攻チーム、裏は後攻チームが攻撃し、これを基本的に9回まで繰り返すのだ。\n\n攻撃側は打者が順番に打席へ入る。ボールを打って塁に出たり、四球（フォアボール：ボール球が4つになって一塁へ進むこと）などで走者になったりして、本塁を目指す。\n\n守備側には9人がいて、投手が投げ、捕手や内野手、外野手が打球を処理する。3つアウトを取ると、その回の攻撃は終わる。だから野球は、「3アウトになる前に、何人を本塁へ帰せるか」を何度も比べる競技だと考えると分かりやすい。\n\nサッカーのように時計がゼロになって終わるのではない。アウトという区切りを積み重ねて進むので、試合時間は毎回変わるのだ。\n\n## おもしろエピソード\n同じ「1点」でも作り方はいろいろある。長打を重ねても、四球と小さな打球をつないでも、走者が本塁を踏めば得点は同じ1点なのだ。\n\n## 今日の試合で見るなら\n18時に始まる今日は、日本ハムが先攻、ロッテが後攻だ。最初は日本ハムの水野達稀らが打ち、ロッテ先発のアンドレ・ジャクソンと9人の守備が止めにいく。\n\nその攻撃で3アウトになると、今度はロッテの西川史礁や山口航輝が、日本ハム先発の福島蓮に向かう。まずは「どちらが攻撃中か」「走者はどの塁か」「アウトはいくつか」の3つだけ追えば、試合の骨組みが見えるのだ。"}, "1-02-a": {"meta": {"id": "1-02-a", "title": "日本に野球が来たのはいつ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-02", "1-02-b"], "sources": ["https://baseball-museum.or.jp/exhibitions/history/", "https://npb.jp/archives/japanesebaseball150th/history/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n日本にベースボールが伝わったのは1872年なのだ。アメリカ人教師ホーレス・ウィルソンが、学校の生徒に教えたのが始まりとされている。\n\n## しくみ\n当時の日本には、今のようなプロ野球も甲子園もなかった。まず学校で遊びや運動として広まり、その後に大学や地域のチームが増えていったのだ。\n\nつまり、日本の野球は最初から「観る興行」だったわけではない。先に自分たちでプレーする文化が育ち、あとから大きな大会やプロの試合が生まれたという順番なのだ。\n\n## 歴史・由来\n野球殿堂博物館は、1872年に第一大学区第一番中学の教師だったウィルソンが生徒へベースボールを伝えたと紹介している。翌年には学校の運動場が整い、試合ができるようになった。\n\n## 今日の試合で見るなら\n今日、ロッテのアンドレ・ジャクソンが日本ハムの清宮幸太郎に投げる場面があれば、その1球も1872年から続く日本野球の延長線上にある。154年前に学校で始まった競技を、あなたはいまZOZOマリンで観ているのだ。"}, "1-02-b": {"meta": {"id": "1-02-b", "title": "プロ野球はいつ始まった？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-02", "1-02-a"], "sources": ["https://npb.jp/slogan/2004/", "https://npb.jp/archives/japanesebaseball150th/history/", "https://npb.jp/bis/yearly/yakyuremmei_1936s.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今のNPBにつながる日本プロ野球の歴史は、1934年に始まったとNPBは位置づけている。全国的なリーグ戦が始まったのは1936年なのだ。\n\n## しくみ\n少しややこしいのは、「最初のプロチーム」と「今につながるプロ野球」が同じ年ではないことだ。日本初のプロチームは1920年に誕生したが、のちに解散した。\n\n1934年には大日本東京野球倶楽部が設立された。これが現在の読売ジャイアンツにつながる球団で、NPBはここを日本プロ野球の歴史の始まりとしている。\n\nさらに1936年、日本職業野球連盟が7球団で発足した。ここから公式のリーグ戦が始まり、現在のセ・リーグ、パ・リーグにつながっていくのだ。\n\n## 歴史・由来\n1936年の第1回リーグ戦には、東京巨人、大阪タイガース、阪急など7球団が参加した。球団名は変わっても、今のプロ野球へ続く土台がこの時代にできたのだ。\n\n## 今日の試合で見るなら\n今日の予告先発は、ロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。2人の勝敗や防御率が同じリーグの公式記録として並ぶのは、1936年から続く「リーグ戦」の仕組みがあるからなのだ。"}, "1-02-c": {"meta": {"id": "1-02-c", "title": "甲子園（高校野球）とプロの関係は？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-02", "1-02-b"], "sources": ["https://www.jhbf.or.jp/pro-aspiring/2026.html", "https://www.jhbf.or.jp/summary/proteam/rule_proteam.html", "https://draft.npb.jp/draft/2026/", "https://npb.jp/news/detail/20260819_01.html", "https://npb.jp/bis/players/41545136.html", "https://draft.npb.jp/draft/2017/draftlist_f.html"]}, "body": "## ひとことで\n甲子園とプロ野球は別の大会、別の組織なのだ。ただし高校生が卒業後にプロへ進む道があり、その入口がプロ野球志望届とドラフト（球団が新人選手との交渉権を得る会議）なのだ。\n\n## しくみ\n甲子園に出たから自動的にプロへ行けるわけではない。逆に、甲子園に出ていなくても、条件を満たしてプロ野球志望届を出せばドラフトの対象になりうる。\n\n高校野球部員がプロ球団との交渉や入団テストを希望する場合は、先にプロ野球志望届を提出する決まりがある。2026年も日本高野連が提出者を公表しており、NPBのドラフト会議は10月22日に予定されている。\n\n## 歴史・由来\n高校野球は学校の大会、NPBは職業として野球をするリーグだ。役割は別だが、高校で活躍した選手がドラフトを経てプロへ進むことで、観る側には物語がつながって見えるのだ。\n\n## 今日の試合で見るなら\n日本ハムの清宮幸太郎は早稲田実業から2017年ドラフト1位で入団した選手だ。今日、通算100本塁打まであと1本というところまで来ている。\n\n高校時代から名前を知っていた選手を、何年後もプロで追える。これが高校野球とプロ野球の大きなつながりのひとつなのだ。"}, "1-02-d": {"meta": {"id": "1-02-d", "title": "メジャーリーグ（大谷翔平など）とのつながりは？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-02", "1-02-c"], "sources": ["https://www.mlb.com/glossary/transactions/japanese-posting-system", "https://www.mlb.com/news/a-look-at-the-history-of-shohei-ohtani-c262589034", "https://www.mlb.com/press-release/mlb-clubs-ratify-new-posting-system-agreement-with-npb-262712102", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nNPBとMLB（アメリカ・カナダの最高峰リーグ）は別のリーグだが、選手は条件を満たせば移ることができる。大谷翔平も日本ハムでプレーしたあと、ポスティングという仕組みを使ってMLBへ進んだのだ。\n\n## しくみ\nNPBの選手がMLBへ行く道はいくつかある。そのひとつがポスティングで、所属するNPB球団が選手をMLB球団との交渉対象として出す仕組みだ。\n\nMLB公式によると、国際FA（一定の在籍期間を満たして海外球団とも自由に交渉できる資格）を得る前でも、所属球団が認めればポスティングを利用できる。交渉が成立すると、MLB球団から元のNPB球団へ譲渡金が支払われる。\n\n大谷は2012年に日本ハムからドラフト1位指名を受け、NPBで投手と打者の両方を続けた。2017年オフに日本ハムがポスティングし、MLBへ移ったのだ。\n\n## 今日の試合で見るなら\n今日の相手、日本ハムは大谷がNPB時代に所属した球団だ。福島蓮や清宮幸太郎が立つ同じチームのユニホームを、大谷も着ていたことになる。\n\nだからNPBとMLBは完全に別世界ではない。今日ZOZOマリンで見る選手たちも、同じ国際的な野球の流れの中でプレーしているのだ。"}, "1-02": {"meta": {"id": "1-02", "title": "野球ってなんで流行ったの？", "category": "1", "level": "1", "priority": "normal", "needs_check": false, "children": ["1-02-a", "1-02-b", "1-02-c", "1-02-d"], "related": ["1-01", "8-01"], "sources": ["https://npb.jp/archives/japanesebaseball150th/history/", "https://baseball-museum.or.jp/exhibitions/history/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n日本では、学校で広まり、全国大会とラジオで知られ、プロ野球で長く応援できる形になったのだ。ひとつの出来事で急に流行ったというより、見る場所と応援する相手が少しずつ増えた結果なのだ。\n\n## しくみ\n日本にベースボールが伝わったのは1872年だ。最初は学校で教えられたので、「自分でやるスポーツ」として若い人に広がりやすかった。\n\n1915年には、今の夏の甲子園につながる全国中等学校優勝野球大会が始まった。地元の学校を応援する理由ができ、野球は学校の外でも話題になっていったのだ。\n\n1927年には夏の大会がラジオで実況された。球場にいなくても試合を追えるようになり、その後はプロ野球も全国で楽しめる娯楽になっていった。\n\n1936年には、今のNPBにつながる日本職業野球連盟が7球団で発足した。学校、全国大会、放送、プロという入口が重なり、野球を「する人」だけでなく「見る人」も増えたというわけだ。\n\n## 歴史・由来\n1872年にアメリカ人教師ホーレス・ウィルソンが生徒へベースボールを教えたことが、日本の野球伝来として記録されている。その後、大学野球、高校野球、社会人野球、プロ野球へと舞台が増えていった。\n\n## おもしろエピソード\n夏の甲子園につながる大会は、プロ野球の全国リーグより約20年早く始まっている。日本では「高校野球の人気が先に育ち、その後にプロが大きくなった」という順番も覚えておくと見え方が変わるのだ。\n\n## 今日の試合で見るなら\n18時からは、ロッテのアンドレ・ジャクソンと日本ハムの福島蓮が先発予定だ。1872年に学校で始まった野球が、154年後には大きな球場でプロ同士の試合として続いている。\n\n清宮幸太郎は通算100本塁打まであと1本、山口航輝は今季32本塁打だ。選手の記録を追いながら応援する文化も、長い歴史の上に積み重なっているのだ。"}, "1-03-a": {"meta": {"id": "1-03-a", "title": "1打席ってどう進む？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "2-13", "2-14"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scoring/scoring_howto.pdf"]}, "body": "## ひとことで\n1打席は、1人の打者が投手と向き合い、アウトになるか塁へ出るなどして結果が決まるまでだ。投手の1球ごとに、ストライク、ボール、打球などの結果が積み重なる。\n\n## しくみ\n打者が振って空振りしたり、ストライクと判定されたりするとストライクが増える。3ストライクで三振となるのが基本だ。\n\nストライクゾーンを外れた球を打者が振らず、ボールと判定されるとボールが増える。4ボールなら四球（フォアボール：一塁を与えられること）になる。\n\n途中でフェアの打球を打てば、守備との勝負に移る。ヒットで出塁することも、ゴロやフライでアウトになることもあり、そこでその打席の結果が決まるのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は長打がある打者なので、福島蓮との対戦では最初の1、2球から勝負が動くことがある。まず「今は何ボール、何ストライクか」を追い、打球が飛んだ瞬間に塁とアウトを見ると、1打席の流れがつながるのだ。"}, "1-03-b": {"meta": {"id": "1-03-b", "title": "攻撃と守備が入れ替わるのはいつ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-05", "1-07-c"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n攻撃側が3つアウトを取られたら、攻撃と守備が入れ替わる。1回表が終われば1回裏、1回裏が終われば2回表へ進むのだ。\n\n## しくみ\nアウトは打者だけでなく、塁にいる走者が取られることもある。誰がアウトになったかに関係なく、その攻撃中の合計が3つになれば交代だ。\n\n交代の間には、守っていた選手がベンチへ戻り、攻撃していたチームの選手が守備位置へ向かう。次の投手は準備投球をするので、プレーが少し止まって見える。\n\nスコアボードの「O」が2なら、あと1アウトで交代だと分かる。初心者には、打球そのものより先にこの数字を見るのも有効なのだ。\n\n## 今日の試合で見るなら\n1回表は日本ハムが攻撃し、ロッテのアンドレ・ジャクソンが3アウトを取りにいく。3つ目が入った瞬間、今度はロッテの西川史礁らが打つ側へ回る。その切り替わりを1度見れば、以後も同じ繰り返しだ。"}, "1-03-c": {"meta": {"id": "1-03-c", "title": "試合が止まるのはどんなとき？（投手交代・リクエスト・雨）", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-01-c", "2-03-c", "2-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/npb/2020rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球は、選手交代や判定の確認、天候などでしばしば止まる。止まったから異常というより、次のプレーを安全かつ正しく始めるための時間なのだ。\n\n## しくみ\n投手交代では、新しい投手がマウンドへ来て準備する。その間は打者も待つので、継投（投手を次々に替えること）が多い終盤ほど停止時間も増えやすい。\n\nリクエストでは、監督が対象となる判定についてリプレー検証（映像で判定を確認すること）を求める。審判が映像を確認している間はプレーが止まるのだ。\n\n雨などで安全に試合を続けにくい場合も、審判やリーグの判断で中断や打ち切りがあり得る。2026年度の野球規則にも、天候状況による試合の打ち切りに関する規定がある。\n\n## 今日の試合で見るなら\n日本ハム先発の福島蓮は、9月は救援で登板してきた投手だ。早めに交代すれば、そのたびに試合はいったん止まる。\n\nまた、山口航輝の長打性の打球などで対象となる微妙な判定があれば、リプレー検証に入ることがある。今日は屋外のZOZOマリンで雨予報もあるので、グラウンド整備や天候による中断にも注意するとよいのだ。"}, "1-03": {"meta": {"id": "1-03", "title": "どんな感じで進むの？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-03-a", "1-03-b", "1-03-c"], "related": ["1-01", "1-04", "1-05", "1-07"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球は、「1球投げる→打者の結果が決まる→3アウトで攻守交代」を繰り返して進む。これを表と裏で1回（イニング：攻撃と守備のひと区切り）として、基本は9回まで続けるのだ。\n\n## しくみ\nまず投手が打者へ1球投げる。打者が打てば、打球を守備側が処理し、その間に打者や走者が塁を進む。打たなくても、ストライクやボールが数えられ、三振や四球につながる。\n\n1人の打者について結果が出るまでを打席という。打者がアウトになることもあれば、一塁へ出て走者になることもある。走者がいると、次の打者の一球で複数の人が同時に動くので、試合が急に忙しく見えるのだ。\n\n攻撃側が3アウトになると、表なら裏へ、裏なら次の回の表へ進む。ここで選手が守備位置へ走り、投手が準備投球をするので、少し間ができる。\n\n試合中には「タイム」がかかって動きが止まることもある。選手交代、けが、リプレー検証、天候など理由はさまざまだ。時計が動き続ける競技ではないので、止まっている時間も試合の一部なのだ。\n\n初心者のうちは、全部のルールを同時に追わなくてよい。「今は何回か」「どちらの攻撃か」「アウトはいくつか」「走者はどこか」の4点を見ると、かなり迷いにくくなる。\n\n## おもしろエピソード\n同じ1球でも、何も起きないこともあれば、一気に数点が入ることもある。満塁（すべての塁に走者がいる状態）で長打が出れば、球場の状況が数秒で大きく変わるわけだ。\n\n## 今日の試合で見るなら\n1回表は日本ハムの攻撃から始まる。予想では1番の水野達稀が、ロッテ先発のアンドレ・ジャクソンと最初の打席を作る。\n\n3アウトになればロッテの攻撃へ替わり、西川史礁や山口航輝が福島蓮と対戦する。まず最初の1回だけ、この流れを意識して見れば、その後の回も同じ骨組みで追えるのだ。"}, "1-04-a": {"meta": {"id": "1-04-a", "title": "なぜホームチームが後攻なの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-04-b", "1-04-c"], "sources": ["https://npb.jp/phoenix/2026/information.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球では、ホームチームを後攻にするのが基本の組み合わせだ。後攻には「相手の最後の攻撃を見てから、自分たちの最後の攻撃ができる」という特徴がある。\n\n## しくみ\n後攻は、各回の裏に攻撃する。特に9回では、表が終わった時点の点差を知ったうえで攻撃できる。何点必要かがはっきりしているので、1点を取りに行く作戦か、一気に長打を狙うかも考えやすい。\n\nNPBの開催要項でも「ホームチーム（後攻）」という組み合わせで扱われている。試合ごとにじゃんけんで決めるものではないのだ。\n\n## 今日の試合で見るなら\nZOZOマリンではロッテがホームなので後攻だ。9回表に清宮幸太郎ら日本ハムの攻撃を終えたあと、必要なら山口航輝らロッテ打線に最後の攻撃機会が回ってくる。"}, "1-04-b": {"meta": {"id": "1-04-b", "title": "9回ウラをやらない試合があるのはなぜ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-04-c", "1-05"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2025/0905/l-m-20/playbyplay.html"]}, "body": "## ひとことで\n9回表が終わった時点で後攻のホームチームが勝っていれば、9回裏はやらない。相手にはもう攻撃が残っていないので、点を追加する必要がないからだ。\n\n## しくみ\nたとえば8回終了でロッテが3対2でリードしているとする。9回表の日本ハムが無得点なら、3対2のままロッテの勝ちが確定する。\n\nこのときスコアボードのホーム側の9回には「×」が表示されることがある。「攻撃したが0点」ではなく、「攻撃そのものを行っていない」という意味だ。\n\n## 今日の試合で見るなら\nロッテがリードして9回表を迎え、清宮幸太郎ら日本ハム打線を抑え切れば、その瞬間に試合終了だ。山口航輝らロッテ打線の9回裏は回ってこない。"}, "1-04-c": {"meta": {"id": "1-04-c", "title": "サヨナラって？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-04", "1-04-b"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n「サヨナラ」は、9回裏や延長の裏にホームチームが勝ち越し、その得点が入った瞬間に試合が終わることだ。後攻だけに起こる終わり方なのだ。\n\n## しくみ\n同点の9回裏でロッテが1点取れば、日本ハムにはもう次の攻撃がない。だから3アウトまで続けず、勝ち越しの走者が本塁（ホームベース）を踏んだところで終了する。\n\n安打ならサヨナラ安打、本塁打ならサヨナラ本塁打と呼ぶ。四球や相手のミスなどで決勝点が入る場合もあるので、必ずヒットで終わるわけではない。\n\n## 今日の試合で見るなら\n9回裏が同点で、32本塁打の山口航輝が一発を打てば、それは33号のサヨナラ本塁打になる。今日のZOZOマリンでは9回表後に、条件がそろった場合だけ、球場全体でフラッグを振ってサヨナラ勝利を後押しする「GRAB THE WIN」も予定されている。"}, "1-04": {"meta": {"id": "1-04", "title": "オモテとウラって何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-04-a", "1-04-b", "1-04-c"], "related": ["1-05"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/phoenix/2026/information.html"]}, "body": "## ひとことで\n「オモテ」は先攻チームの攻撃、「ウラ」は後攻チームの攻撃だ。1回の中を前半と後半に分けた呼び方なのだ。\n\n## しくみ\n野球の1回（イニング：攻撃と守備を1度ずつ行うまとまり）は、まず「表」から始まる。表では先攻チームが打ち、後攻チームが守る。3アウトになると攻守が入れ替わり、「裏」になる。\n\n裏では後攻チームが打ち、先攻チームが守る。ここでも3アウトになれば、その回は終わりだ。次は2回表、2回裏という順番で進み、通常は9回まで行う。\n\nNPBではホームチームが後攻になる。今日なら、ビジターの日本ハムが表、ホームのロッテが裏だ。スコアボードで「1」「2」「3」と回数が並んでいても、その中では必ず表と裏の2つに分かれているわけだ。\n\nただし、9回裏は必ずあるわけではない。9回表が終わった時点でホームのロッテが勝っていれば、もう日本ハムが逆転する攻撃機会は残っていないので、その場で試合終了になる。\n\n## 今日の試合で見るなら\n1回表は、ロッテ先発のアンドレ・ジャクソンが清宮幸太郎ら日本ハム打線を相手にする。3アウトを取ったら1回裏へ移り、日本ハム先発の福島蓮が山口航輝らロッテ打線と対戦する。\n\n「表は日本ハム、裏はロッテ」と覚えておけば、途中から見てもどちらが攻撃中なのか迷いにくい。9回まで来たら、ロッテがリードしているかにも注目するといい。"}, "1-05-a": {"meta": {"id": "1-05-a", "title": "ラッキーセブンって？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-05"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n「ラッキーセブン」は7回の攻撃を特別に盛り上げる呼び方だ。7回だけ得点が増えるようなルールではなく、応援上の節目なのだ。\n\n## しくみ\n試合が終盤に入る7回は、球場の応援演出が大きくなることが多い。得点方法やアウトの数は1回や2回と同じで、3アウトになれば攻守交代する。\n\n今日のZOZOマリンでは、7回表終了後に「MARINES LUCKY 7」が予定されている。球団歌「WE LOVE MARINES」を歌い、タオルを掲げてロッテを応援する時間だ。\n\n## 今日の試合で見るなら\n7回表は日本ハムの攻撃なので、清宮幸太郎らをロッテ投手陣が抑えたあとが合図になる。その演出の直後、7回裏で山口航輝らロッテ打線の攻撃が始まる。"}, "1-05-b": {"meta": {"id": "1-05-b", "title": "雨で試合が終わる「コールド」って？", "category": "1", "level": "2", "priority": "normal", "needs_check": true, "related": ["1-05"], "sources": ["https://npb.jp/npb/2025rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nコールドゲーム（試合途中で打ち切られた試合）は、雨などで安全に続けられないと判断され、試合完了前に終了を命じられた試合だ。雨が降っただけで自動的に終わるわけではない。\n\n## しくみ\nNPBの公認野球規則では、球審またはリーグ事務局が天候やグラウンド状態などを理由に試合を中止できる。正式試合になった後なら、その時点の状況を基に結果を扱うのが原則だ。\n\nただし、NPBのセ・パ公式戦ではサスペンデッドゲーム（後日、途中から再開する試合）は採用されておらず、同点のまま打ち切れば引き分けになるのが一般的だ。途中の回でビジターチームが追いついた・逆転したままホーム側の攻撃が完了していない場合は、前の回が終わった時点のスコアで扱われる。正式試合になる前なら、ノーゲームになる場合もある。<!-- TODO: 確認（2026年セ・パ公式戦でサスペンデッド不採用・打ち切り時の扱いを定めた規定本文を公式ページで確認） -->\n\n## 今日の試合で見るなら\n今日のZOZOマリンは屋外で、NPB日程ページの予報は「くもり時々雨」だ。ジャクソンや福島蓮が投げている途中に雨が強まっても、すぐコールドとは限らない。審判団の中断・再開・打ち切りの判断を見る場面になる。"}, "1-05": {"meta": {"id": "1-05", "title": "1回2回（イニング）って何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-05-a", "1-05-b"], "related": ["1-04", "1-07-c"], "sources": ["https://npb.jp/scoring/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n1回、2回という数字は「イニング」と呼ばれる試合の区切りだ。1イニングは、先攻と後攻がそれぞれ1度ずつ攻撃するまとまりなのだ。\n\n## しくみ\n1回は「1回表」と「1回裏」に分かれる。表では先攻チームが攻撃し、3アウトになると裏へ移る。裏では後攻チームが攻撃し、3アウトになれば1回終了だ。\n\nそこから2回表、2回裏、3回表……と進んでいく。通常の試合は9回までなので、基本の流れはこの往復を9回繰り返すことになる。ただし、ホームチームが9回表終了時点で勝っていれば9回裏は行わない。同点なら延長戦に入る場合もある。\n\nイニングは「何分たったか」で区切るものではない。3アウトを取るまで攻撃は続くので、打者3人で短く終わる回もあれば、何人も出塁して長くなる回もある。\n\nスコアボードの「1 2 3 4…」は、このイニングごとの得点を並べたものだ。0が続いていても、その回に何も起きなかったとは限らない。走者を出しながら得点できなかった回も同じ0なのだ。\n\n## 今日の試合で見るなら\n1回表はロッテのアンドレ・ジャクソンが日本ハム打線を抑える側、1回裏は日本ハムの福島蓮がロッテ打線を抑える側になる。\n\n山口航輝の本塁打や清宮幸太郎の通算100号候補が出たら、「何回の表か裏か」も一緒に見ると試合の流れを覚えやすい。終盤の7回、8回、9回になるほど、残された攻撃回数も少なくなるわけだ。"}, "1-06-a": {"meta": {"id": "1-06-a", "title": "一塁・二塁・三塁・本塁はどこ？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n本塁から外野を見ると、右が一塁、正面奥が二塁、左が三塁なのだ。走者は本塁→一塁→二塁→三塁→本塁の順に進む。\n\n## しくみ\n打者が立つ場所のそばにある五角形の白い板が本塁（ホームベース）だ。そこから右前方が一塁、いちばん奥が二塁、左前方が三塁になる。\n\n進む向きはいつも同じだ。打ったあと、いきなり三塁へ走ることはできない。\n\n## 今日の試合で見るなら\nロッテの西川史礁が打って一塁へ走ったら、その次にどこまで進むかを追ってみよう。日本ハムの清宮幸太郎が長打を打てば、一塁を回って二塁まで進む場面もある。\n\n四つの塁の位置が分かるだけで、「今どこまで来たのか」がかなり見やすくなるのだ。"}, "1-06-b": {"meta": {"id": "1-06-b", "title": "満塁って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-09"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/pl/"]}, "body": "## ひとことで\n満塁は、一塁・二塁・三塁の全部に走者がいる状態なのだ。安打はもちろん、四球（フォアボール）でも1点が入ることがある、とても得点が動きやすい場面だ。\n\n## しくみ\n満塁で打者が四球になると、打者は一塁へ進む。一塁走者は二塁、二塁走者は三塁へ押し出され、三塁走者は本塁へ進むので1点になる。\n\nこれを押し出しという。逆に守備側は、どの塁にも次の走者が来るため、フォースアウト（走者より先に塁へ送球して取るアウト）を狙いやすい。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎の打席で三つの塁が埋まったら、球場の空気が一段変わるはずだ。一発なら大量点、四球でも1点という状況なので、打者だけでなく投手の制球にも注目するといい。\n\n満塁は「打者が打てるか」だけでなく、「投手がストライクを取れるか」まで重要になる場面なのだ。"}, "1-06-c": {"meta": {"id": "1-06-c", "title": "得点圏って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/pl/"]}, "body": "## ひとことで\n得点圏（とくてんけん）は、走者が二塁か三塁にいる状態を指す野球の言い方なのだ。安打1本で本塁まで帰り、得点できる可能性が高い位置だからそう呼ぶ。\n\n## しくみ\n一塁走者は、単打（シングルヒット）1本では三塁までしか進めないことも多い。二塁や三塁なら、外野へ安打が飛ぶだけで本塁を狙いやすくなる。\n\nだから「得点圏に走者がいる」は、「今は点が入りやすい場面」という目印になる。ルール上の特別な区域ではなく、試合を見るための便利な呼び方なのだ。\n\n## 今日の試合で見るなら\nロッテの西川史礁が二塁にいて山口航輝が打席に入ったら、まさに得点圏の場面だ。日本ハムなら、水野達稀が二塁にいて清宮幸太郎を迎える形も同じだ。\n\n打者の結果だけでなく、二塁走者が打球と同時にどこまで走るかを見ると、得点圏の意味がよく分かる。"}, "1-06-d": {"meta": {"id": "1-06-d", "title": "残塁って？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-06", "1-07-c"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n残塁（ざんるい）は、攻撃が終わったとき、得点にもアウトにもならず塁に残った走者のことなのだ。公式記録ではLOB（Left On Base）とも表す。\n\n## しくみ\nたとえば二死一・二塁で打者が三振すると、3アウトで攻撃終了になる。一塁と二塁の走者は本塁へ帰れないままなので、2残塁だ。\n\n残塁が多いことは、「走者は出したが得点に結びつかなかった」場面が多いということだ。ただし、残塁だけで攻撃の良し悪しを全部決める数字ではない。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎の前に走者がたまったのに、その回が0点で終わったら残塁が増える。反対に、そこで安打が出れば残塁になるはずだった走者が得点に変わるのだ。\n\nイニング終了時に塁を一度見るだけで、「チャンスを残したまま終わったか」が分かる。"}, "1-06": {"meta": {"id": "1-06", "title": "塁って？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-06-a", "1-06-b", "1-06-c", "1-06-d"], "related": ["1-08", "1-09"], "sources": ["https://npb.jp/npb/2026rules.html", "https://npb.jp/pl/"]}, "body": "## ひとことで\n塁（ベース）は、走者が順番に進んで得点を目指す「中継地点」なのだ。本塁から一塁、二塁、三塁と進み、最後に本塁へ戻ると1点になる。\n\n## しくみ\nグラウンドには、本塁・一塁・二塁・三塁の4つがひし形に並んでいる。打者はボールを打つなどして走者になると、まず一塁へ向かうのだ。\n\nそこから二塁、三塁、本塁の順に進む。途中の塁に触れながら一周するので、すごろくのマスを順番に進むイメージに近い。\n\n塁にいる走者は、次の打者の安打（ヒット）や四球（フォアボール：ボールが4つになること）などで進む。守備側は、その走者が安全に塁へ着く前にアウトを取ろうとするわけだ。\n\nだから野球を見るときは、打者だけでなく「今、どの塁に誰がいるか」を見ると分かりやすい。一塁だけならまだ本塁まで遠いが、二塁や三塁まで進むと、1本の安打で得点になる可能性が上がるのだ。\n\n## おもしろエピソード\n塁は、攻撃側にとっては休める場所であり、守備側にとっては次のアウトを取る目印でもある。同じ白いベースが、攻撃と守備でまったく違う意味を持っているのだ。\n\n## 今日の試合で見るなら\nロッテでは西川史礁や山口航輝、日本ハムでは水野達稀や清宮幸太郎の打席で、まず走者の位置を確認するといい。二塁や三塁に走者がいる場面では、外野への安打1本で得点まで動くことがある。\n\n球場の大型画面や一球速報だけでなく、実際の塁を見ると状況が早く読める。打球が飛んだ瞬間、打者だけでなく塁上の走者も動くところを見ると、野球が急に立体的に見えてくるのだ。"}, "1-07-a": {"meta": {"id": "1-07-a", "title": "カウントはどの順番で読む？（ボール→ストライク）", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "1-07-b"], "sources": ["https://www.marines.co.jp/stadium/application/baseball/howto.html", "https://npb.jp/scoring/officialrule_900.pdf"]}, "body": "## ひとことで\n今のカウントは「ボール→ストライク」の順で読むのだ。たとえばBが2、Sが1なら「2ボール1ストライク」になる。\n\n## しくみ\nBはBall（ボール）、SはStrike（ストライク）だ。0ボール2ストライクなら、投手はあと1ストライクで基本的に三振を取れる。\n\n反対に3ボール1ストライクなら、あと1ボールで四球（フォアボール：打者が一塁へ進めること）になる。数字の並びだけを見るなら「B-S」と覚えるのが早い。\n\n## 今日の試合で見るなら\nジャクソン対清宮幸太郎、福島蓮対山口航輝のような打席で、投球ごとにB-Sだけ追ってみよう。3-1なら投手はボールを出しにくく、0-2なら打者は三振まであと1つだ。\n\n同じ1球でも、カウントで意味が変わる。それが分かると配球（どの球をどこへ投げるか）の見え方も変わるのだ。"}, "1-07-b": {"meta": {"id": "1-07-b", "title": "フルカウントって？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "1-07-a"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/pl/"]}, "body": "## ひとことで\nフルカウントは、3ボール2ストライクの状態なのだ。次がボールなら四球、ストライクなら基本的に三振なので、1球の重みが大きい。\n\n## しくみ\nただし「次の1球で必ず決着」ではない。2ストライクのあとに普通のファウルを打っても、原則としてストライクは増えず、3ボール2ストライクのまま続くからだ。\n\nそのため、フルカウントから何球も粘る打席もある。投手は四球を避けたいが、甘い球を投げれば打たれる。このせめぎ合いが見どころなのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝の打席が3ボール2ストライクになったら、投手と打者の両方に注目するといい。長打のある打者に対して、ジャクソンや福島蓮がどこへ投げるかで勝負が動く。\n\n球場で「3-2」と表示されたら、それがフルカウントだ。"}, "1-07-c": {"meta": {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "category": "1", "level": "2", "priority": "normal", "needs_check": false, "related": ["1-07", "1-03-b"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_faq_20250901.html", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n野球は、攻撃側が3つアウトになると、その回の表または裏の攻撃が終わるルールなのだ。3アウトをひと区切りにして、両チームが交互に同じだけ攻撃する。\n\n## しくみ\nアウトは「打者3人で必ず交代」という意味ではない。安打や四球で塁に出ればアウトは増えないので、3アウトになるまで何人でも打席に立てる。\n\n逆に三者凡退（3人の打者が出塁せず3アウトになること）なら、最短の3人で攻撃終了だ。NPBの説明でも、各イニングの表・裏は3つのアウトなどで終了するとされている。\n\n## 今日の試合で見るなら\nOが2つ点いている場面では、次のアウトで攻守交代になる。たとえば二死で山口航輝や清宮幸太郎が打席に立てば、安打で攻撃を続けるか、アウトでその回が終わるかの分かれ目だ。\n\n「2アウトからの一打」が大きく感じるのは、この最後の1アウトをめぐる勝負だからなのだ。"}, "1-07": {"meta": {"id": "1-07", "title": "SBOや青・黄・赤に光るあれは何？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-07-a", "1-07-b", "1-07-c"], "related": ["1-03-a", "1-08"], "sources": ["https://www.marines.co.jp/stadium/application/baseball/howto.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nあれは、今の打者に対するボールとストライク、そしてその回のアウト数を示す表示なのだ。ZOZOマリンの公式施設案内では「BSO」と呼んでいる。\n\n## しくみ\nBはボール、Sはストライク、Oはアウトだ。見る順番は、まずB、次にS、最後にOと覚えるといい。\n\nボールは3つまで表示され、4つ目で四球（フォアボール：打者が一塁へ進めること）になる。ストライクは2つまで表示され、基本的には3つ目で三振になる。\n\nアウトも2つまで表示される。3つ目のアウトが成立すると、その回の表または裏が終わり、攻撃と守備が入れ替わるのだ。\n\n「SBO」という言い方を耳にすることもあるが、少なくともZOZOマリンの現在の施設案内はBSO表記だ。色は設備や見え方で迷うことがあるので、B・S・Oの文字と数で読むのが確実だ。\n\n## おもしろエピソード\n表示が「3ボール2ストライク」になるとフルカウントと呼ぶ。次の1球の意味が大きくなるので、観客の注目が一気に投手と打者へ集まりやすい場面だ。\n\nただし、2ストライクから普通のファウルを打っても、原則としてそのまま三振にはならない。だからフルカウントの勝負が何球も続くこともある。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソン、日本ハム先発の福島蓮が投げるたび、まずBSOを一度見ると試合を追いやすい。たとえばBが3なら、投手はあと1つボールを出すと四球になる。\n\n山口航輝や清宮幸太郎の打席でSが2になったら、投手は三振まであと1ストライクだ。Oが2なら、その打者の結果次第で攻守交代になる可能性がある。\n\nBSOは、今の1球がどれだけ重要かを教える小さな信号機なのだ。"}, "1-08-a": {"meta": {"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-08", "1-07"], "sources": ["https://npb.jp/news/detail/20180621_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n三振は、打者に3つ目のストライクが宣告されることだ。最後の球を振って当たらなければ空振り三振、振らずにストライクなら見逃し三振になるのだ。\n\n## しくみ\n空振りは、打者がバットを振ったのに球へ当てられないことだ。見逃しは、打者が振らず、球審がストライクと判定することだ。\n\nどちらも結果は三振だが、見え方は違う。空振りなら投手の球威や変化に打者が合わせられなかったと分かりやすい。見逃しなら、打者がボールだと思った球がストライクになった場合もあるのだ。\n\nなお、第3ストライクを捕手が正規に捕れなかった場合など、三振が記録されても打者がすぐアウトにならない例外がある。\n\n## 今日の試合で見るなら\nジャクソン対清宮幸太郎、福島蓮対山口航輝の打席で、2ストライクになった後を見てみるといい。最後に打者が振ったか、振らなかったかを見るだけで、「空振り三振」と「見逃し三振」をその場で区別できるのだ。"}, "1-08-b": {"meta": {"id": "1-08-b", "title": "フライとゴロって？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-08", "1-08-c"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nフライは空中に上がった打球、ゴロは地面を転がる打球だ。アウトの取り方がかなり違うので、打った瞬間の高さを見ると守備が分かりやすくなるのだ。\n\n## しくみ\nフライ（飛球）は、地面に落ちる前に守備側が正しく捕れば打者アウトだ。走者は捕球後なら次の塁を狙えるが、捕る前に進みすぎると元の塁へ戻る必要がある。\n\nゴロ（地面を転がる打球）は、捕っただけでは普通は打者アウトにならない。たとえば遊撃手が捕り、打者より先に一塁へ送球してアウトを完成させるのだ。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎が打った瞬間、まず「上か、下か」を見るといい。フライなら外野手の藤原恭大や万波中正が捕るまで、ゴロなら水野達稀や山縣秀ら内野手が捕ってどの塁へ投げるかまで追う。打球の種類で守備の動きが変わるのだ。"}, "1-08-c": {"meta": {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-08", "1-06"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nタッチアウトは、ボールを持った野手が走者の体に触れて取るアウトだ。フォースアウト（封殺）は、走者が進まなければならない塁を、守備側が先にボールを持って踏めば成立するのだ。\n\n## しくみ\nたとえば一塁に走者がいて打者がゴロを打つと、打者は一塁へ行くので、一塁走者は二塁へ進まなければならない。このとき二塁を先に踏めば、走者へ触らなくてもフォースアウトになる。\n\n反対に盗塁（投球の間などに次の塁を狙うこと）は、走者に進む義務がない。そこでアウトにするには、原則として走者へタッチする必要があるのだ。\n\n## 今日の試合で見るなら\n西川史礁が一塁にいる場面で山口航輝が内野ゴロを打ったら、日本ハム守備は二塁でフォースアウトを狙える。終盤に池田来翔が代走で出て盗塁を狙う場面なら、今度は田宮裕涼の送球を受けた野手が走者へタッチできるかを見ると違いがはっきりするのだ。"}, "1-08": {"meta": {"id": "1-08", "title": "アウトってどうやって取るの？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-08-a", "1-08-b", "1-08-c"], "related": ["1-07", "1-09"], "sources": ["https://npb.jp/news/detail/20180621_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nアウトは、守備側が攻撃側の選手を「そのプレーでは先へ進めない状態」にすることだ。基本は3アウトで攻守交代になるのだ。\n\n## しくみ\nよく見る取り方は、まず三振（ストライクを3つ取ること）だ。打者が振って空振りしても、見送ってストライクになっても、3つ目のストライクなら三振として記録される。\n\n打った後なら、フライ（地面に落ちる前の打球）を野手が捕れば打者はアウトだ。ゴロ（地面を転がる打球）なら、打者が一塁へ着く前に一塁手へ送球してアウトにする形が多い。\n\n走者をアウトにする方法もある。進まなければならない塁を先に守備側が押さえるフォースアウト（封殺）と、走者の体にボールを持ったグラブなどで触れるタッチアウトが代表例だ。\n\nつまり、アウトは「三振だけ」ではない。打球の高さ、走者の位置、どの塁へ送球するかを見れば、守備側が何を狙っているかが分かってくるのだ。\n\n## おもしろエピソード\n三振しても、必ず打者アウトになるとは限らない。第3ストライクを捕手が正規に捕れず、条件を満たすと打者が一塁へ走れる場合がある。いわゆる振り逃げで、NPBでは1イニングに4三振が記録された例もあるのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンが、清宮幸太郎や万波中正から三振を取る場面では、捕手が第3ストライクを捕ったところまで見てみるといい。\n\n反対に日本ハム先発の福島蓮が山口航輝や西川史礁に打たせたら、今度は打球を見る。高く上がればフライ、地面を転がればゴロだ。そこから野手がどの方法でアウトを完成させるかまで追うと、守備が一続きの動きに見えてくるのだ。"}, "1-09-a": {"meta": {"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-09", "1-08-c"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。走者が本塁を先に踏んでも、そのプレーの第3アウトがフォースアウト（進塁義務のある走者を封殺するアウト）などなら、得点が認められない場合があるのだ。\n\n## しくみ\n典型は一死満塁だ。打者がゴロを打ち、守備側が二塁と一塁でフォースの併殺（1プレーで2アウト）を完成させると、それで第3アウトになる。\n\nこのとき三塁走者が一塁でのアウトより先に本塁を踏んでいても、得点は0だ。第3アウトがフォースアウトだからなのだ。\n\n一方、第3アウトが走者へのタッチアウトなら、本塁到達とアウトのどちらが先かで得点が決まる場合がある。同じ「3アウト目」でも種類が大切なのだ。\n\n## 今日の試合で見るなら\n一死満塁で山口航輝が内野ゴロを打ち、日本ハムが二塁から一塁へ併殺を完成させる場面を想像すると分かりやすい。三塁走者の西川史礁が先に本塁へ滑り込んでも、最後がフォースの第3アウトなら点は入らないのだ。"}, "1-09-b": {"meta": {"id": "1-09-b", "title": "打点って？", "category": "1", "level": "2", "priority": "star", "needs_check": false, "related": ["1-09", "1-06-c"], "sources": ["https://npb.jp/news/detail/20180920_03.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n打点は、打者の打撃などによって味方の得点を生んだとき、その打者に付く記録だ。ホームを踏んだ走者に付く「得点」とは別物なのだ。\n\n## しくみ\nたとえば一塁走者がいて、打者が二塁打を打って走者が本塁へ帰れば、走者には1得点、打者には通常1打点が付く。\n\n打点はヒットだけで付くわけではない。犠牲フライ（フライアウトと引き換えに走者を返すこと）や内野ゴロでも、打者のプレーで走者が得点すれば打点になる場合がある。満塁で四球になり、押し出しで1点入った場合も打者に打点が付くのだ。\n\nただし、守備の失策（普通なら処理できる打球のミス）が得点の主な原因なら、打点が付かない場合もある。\n\n## 今日の試合で見るなら\n西川史礁が出塁した後、山口航輝の安打で西川が本塁へ帰れば、西川に「得点」、山口に「打点」が付く。日本ハムなら、水野達稀を清宮幸太郎が返す場面でも同じだ。スコア表示で「R」と「RBI」を見分ける土台になるのだ。"}, "1-09": {"meta": {"id": "1-09", "title": "点ってどうやって入るの？", "category": "1", "level": "1", "priority": "star", "needs_check": false, "children": ["1-09-a", "1-09-b"], "related": ["1-06", "1-08"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n攻撃側の走者が、一塁、二塁、三塁と進み、本塁へ正しく戻ると基本的に1点入る。1本のヒットで必ず点が入るわけではなく、走者を少しずつ進めても得点できるのだ。\n\n## しくみ\n打者は打った後、まず一塁を目指す。そこから二塁、三塁、本塁の順に進み、本塁へ戻れば得点になる。四球（ボール4つで一塁へ進むこと）、盗塁（投球の間などに次の塁を狙うこと）、相手のミスなどでも走者は進めるのだ。\n\n本塁打なら分かりやすい。走者がいなければ打者自身が一周して1点、走者がいればその人数分も加わる。けれど野球では、単打、ゴロ、犠牲フライ（外野フライのアウトと引き換えに走者を返すこと）をつないで1点を取る場面も多い。\n\n注意したいのは、「本塁を踏んだ瞬間に必ず得点確定」ではないことだ。第3アウトの種類によっては、その前に走者が本塁へ着いていても得点が認められない場合がある。ここが最初は少し不思議に見えるところなのだ。\n\n## おもしろエピソード\nNPBの2026年8月の記録員コラムでは、一死満塁で三塁走者が先に本塁を踏んでも、その後に守備側がフォースで併殺（1つのプレーで2アウト）を完成させて第3アウトを取れば、得点は認められない例が説明されている。野球は「誰が先に本塁へ着いたか」だけで決まらないのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝が本塁打を打てば、得点の仕組みは一番見やすい。打者と塁上の走者が順に本塁へ戻り、その人数だけ点が入るからだ。\n\n本塁打でなくても見る価値はある。西川史礁や水野達稀が出塁した後、次の打者の安打やゴロでどこまで進むかを追ってみよう。「打った人」より「すでに塁にいた人」が本塁へ帰って点になる場面が見えてくるのだ。"}, "2-01-a": {"meta": {"id": "2-01-a", "title": "1点差の試合ってどれくらいある？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-01", "2-09", "4-01"], "sources": ["https://pacificleague.com/news/2024/1/57720", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n1点差の試合は、かなり珍しいものではない。2023年のパ・リーグ球団の試合（交流戦を含む）483試合のうち157試合が1点差で決まり、約32.5％だったのだ。\n\n## しくみ\n約3試合に1試合が1点差だった計算になる。もちろん年によって割合は変わるが、「1点しか違わないまま終盤へ行く」のはプロ野球ではよくある展開だと分かる。\n\n1点差では、四球（ボール4つで打者が一塁へ進むこと）ひとつ、守備のミスひとつ、犠牲フライ（外野フライの間に三塁走者が生還するプレー）ひとつでも同点になる。だから終盤ほど、1つのアウトや1人の走者が重くなるのだ。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で2位西武を1.5ゲーム差で追っている。今日の1勝が重要な状況なので、もし1点差のまま終盤に入れば、ベンチの投手交代や代打にも注目するといい。\n\nアンドレ・ジャクソンや福島蓮が1点だけを守っている場面では、「あと1点」が試合全体の意味を変える。スコアの差が1なら、最後まで席を立ちにくい試合なのだ。"}, "2-01-b": {"meta": {"id": "2-01-b", "title": "大量点が入るのはどんなとき？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-01", "1-09", "2-03", "2-14"], "sources": ["https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n大量点は、走者がたまったところで長打が出たり、四球や守備のミスで攻撃が切れずに続いたりすると入りやすい。1本の大当たりだけでなく、「アウトを取れない時間」が続くことが大きいのだ。\n\n## しくみ\n野球の攻撃は3アウトになるまで続く。だからヒット、四球（ボール4つで一塁へ進むこと）、エラー（守備のミスとして記録されるプレー）が重なると、走者が次々にたまる。\n\nそこで二塁打やホームランが出れば、走者がまとめてホームへ帰る。さらに次の打者も出塁すれば攻撃は終わらないので、1イニング（攻撃1回分）だけで4点、5点と増えることもあるのだ。\n\n投手交代の直後も見どころだ。新しい投手が四球を出すのか、最初の打者をアウトにできるのかで、大量点になる流れを止められるかが変わる。\n\n## 今日の試合で見るなら\n山口航輝は今季32本塁打、清宮幸太郎は通算100本塁打まであと1本だ。2人の前に走者が何人いるかを見ると、同じホームランでも増える点数が違うと分かる。\n\n前日の試合はロッテが6対1で勝った。今日も走者が2人、3人とたまったら、次の1球でスコアが大きく動く場面だと考えればいいのだ。"}, "2-01": {"meta": {"id": "2-01", "title": "何点入ることが多いの？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-01-a", "2-01-b"], "related": ["1-09", "2-03", "4-01"], "sources": ["https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n今季のパ・リーグでは、1チームが1試合で取る点は平均すると約3.8点なのだ。だから3対2、4対3のようなスコアも自然だし、0点や10点近くになる日もある。\n\n## しくみ\n2026年9月27日終了時点で、パ・リーグ6球団は合計830「チーム試合」を戦い、合計3167得点している。3167÷830で、1チーム1試合あたり約3.82点だ。\n\n「チーム試合」というのは、1試合を両チームそれぞれ1回と数えたものだ。つまり両軍を合わせた平均なら、その約2倍になる。ただし野球は毎回同じ点数になる競技ではないので、平均は「4点くらいを中心に上下する」と考えるための目安なのだ。\n\n今季は日本ハムが141試合で580得点、1試合平均約4.11点。ロッテは134試合で473得点、約3.53点だ。数字だけ見ると差はあるが、今日の1試合で何点入るかを決めるものではない。\n\n## おもしろエピソード\n前日の9月27日はロッテが日本ハムに6対1で勝った。平均より点が入る試合も、かなり少ない試合も同じシーズンの中で普通に起こるのだ。\n\n## 今日の試合で見るなら\n序盤が0対0でも、「退屈な試合」とは限らない。ロッテ先発のアンドレ・ジャクソン、日本ハム先発の福島蓮が走者を出さずに抑えているなら、それ自体が試合の見どころだ。\n\n逆に走者がたまった場面で、山口航輝や清宮幸太郎のような長打のある打者に回ると、1球でスコアが大きく動く。まずはスコアボードの合計点を見ながら、「今は平均より少ないか、多いか」くらいで眺めると分かりやすいのだ。"}, "2-02-a": {"meta": {"id": "2-02-a", "title": "二塁打・三塁打って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-02", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/lb_2b_p.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html"]}, "body": "## ひとことで\n二塁打は、1本のヒットで打者が二塁まで進むこと。三塁打は三塁まで進むヒットだ。まとめて長打（1本で二つ以上の塁を取る安打）と呼ぶ。\n\n## しくみ\n外野手の間を抜けたり、フェンス近くまで転がったりすると、打者は一塁で止まらず先の塁を狙える。二塁打なら塁打は2、三塁打なら3として記録される。\n\n三塁打は二塁打より、打球の行き先と走る速さの両方が必要になりやすい。外野手がボールを取りに行く間に、打者は二塁を回って三塁へ向かうのだ。\n\n## おもしろエピソード\n前日9月27日は、ロッテの寺地隆成が初回に先制の適時二塁打を放った。二塁まで進めると、次の単打でも本塁へ帰りやすくなる。\n\n## 今日の試合で見るなら\nロッテの西川史礁は9月27日時点で二塁打28本。打球が外野の間を抜けたら、一塁で止まるか二塁まで走るかを見てみよう。二塁を蹴ってさらに三塁へ向かったら、球場の空気が一段変わるはずだ。"}, "2-02-b": {"meta": {"id": "2-02-b", "title": "内野安打って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-02", "2-04"], "sources": ["https://npb.jp/news/detail/20260701_02.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html"]}, "body": "## ひとことで\n内野安打は、内野に転がった打球なのに、守備側が一塁で打者をアウトにできずヒットになることだ。遠くへ飛ばさなくても、足で作れるヒットがある。\n\n## しくみ\nたとえば三遊間へのゴロを三塁手が捕って一塁へ投げても、打者の足が先ならセーフだ。守備の普通のプレーでアウトにできなかったと公式記録員が判断すれば、内野安打になる。\n\n一方、捕った野手の悪送球などが原因なら失策になることがある。見た目が同じ「一塁セーフ」でも、記録は違うわけだ。\n\n## おもしろエピソード\nNPBは2026年7月、ある打球の公式記録を「一塁野選」から「投手内野安打」へ訂正した。ヒットかどうかは、試合後に公式記録が見直されることもあるのだ。\n\n## 今日の試合で見るなら\n前日9月27日、ロッテの西川史礁は初回に内野安打で出塁した。今日も打球が内野に転がったら、ボールだけでなく打者と一塁送球の競争を見るとよい。"}, "2-02-c": {"meta": {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-02", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\n打率は「打数のうち、何割がヒットだったか」を表す数字だ。打率.300、つまり3割なら、10打数で約3本ヒットを打つ計算になる。\n\n## しくみ\nNPBの計算式は「安打数÷打数」だ。四球（フォアボール）や犠打などは、そもそも打数に入らないので、単純な「打席の3割」ではない。\n\n3割がすごいのは、プロでは7割近く打てなくても一流になれるほど、投手と守備が強いからだ。9月27日時点のパ・リーグで、規定打席に達して打率.300以上なのは4人だけ。3割は今季でもはっきり上位の水準なのだ。\n\n## 今日の試合で見るなら\nロッテの西川史礁は9月27日時点で打率.292でリーグ5位。3割まであと少しの位置にいる。今日4打数2安打のように複数安打を重ねれば打率は上がるし、4打数0安打なら下がる。打席ごとに数字が動く終盤戦なのだ。"}, "2-02": {"meta": {"id": "2-02", "title": "Hやヒットって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-02-a", "2-02-b", "2-02-c"], "related": ["2-04", "4-01", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\nヒットは安打（あんだ：打ったボールで安全に塁へ出る記録）のことだ。スコアボードの「H」は、チームが打ったヒットの合計を表す。\n\n## しくみ\n打者が打ったボールで一塁以上へ進み、守備側の失策（エラー：普通なら処理できる打球をミスすること）などによらず出塁すると、基本的にヒットになる。外野まで飛ばなくてもよい。内野に転がった打球でも、送球より先に一塁へ着けば内野安打になることがあるのだ。\n\nヒットには単打（シングル：一塁まで進む安打）、二塁打、三塁打、本塁打がある。NPBの記録では、長打率を計算するとき単打を1、二塁打を2、三塁打を3、本塁打を4の「塁打」として数える。\n\nただし、打った人が一塁へ着いたら全部ヒット、というわけではない。野手のミスなら失策、先の走者をアウトにしようとして打者が残った場合は野選（フィルダースチョイス：守備側が別の走者を狙った結果の出塁）になることがある。公式記録員がプレーを見て記録を決めるのだ。\n\n## おもしろエピソード\n前日の9月27日、ロッテの西川史礁は初回に内野安打で出塁し、そのあと先制のホームを踏んだ。強い打球だけがヒットではなく、足の速さも「H」を増やせるという例だ。\n\n## 今日の試合で見るなら\nロッテでは西川史礁が9月27日時点で打率.292。派手なホームランだけでなく、まず一塁へ生きる打球をどれだけ作れるかを見るとよい。\n\n日本ハムでは水野達稀や清宮幸太郎の打席で、スコアボードの「H」が増えるか確認してみよう。1本のヒットが次の打者につながり、得点の形ができていくのだ。"}, "2-03-a": {"meta": {"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-03", "1-06-b", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n名前の違いは、そのホームランで何点入るかだ。走者なしはソロで1点、1人いれば2ラン、2人いれば3ラン、満塁なら満塁ホームランで4点入る。\n\n## しくみ\nホームランでは、打者と塁上の走者が全員得点する。だから「塁にいる人数＋1」が、そのまま入る点になる。\n\nたとえば一塁に走者がいる時の本塁打は2点。満塁（すべての塁に走者がいる状態）なら、走者3人と打者の計4人が帰る。これを満塁ホームラン、またはグランドスラムという。\n\n## 今日の試合で見るなら\nロッテは1番の西川史礁が出塁し、2番の山口航輝に回れば、山口の一発は2ランになりうる。日本ハムも水野達稀や田宮裕涼が塁に出て清宮幸太郎を迎えると、通算100号が複数得点の一発になる可能性がある。\n\n打者を見る前に塁上の人数を数えると、「この一発なら何点か」がすぐ分かるのだ。"}, "2-03-b": {"meta": {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-03", "7-04", "7-04-b"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/31335151.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/11815138.html"]}, "body": "## ひとことで\n変わりうる。向かい風なら大きな打球が押し戻され、追い風なら伸び、横風なら左右へ流される。マリンでは風もプレーの一部なのだ。\n\n## しくみ\nZOZOマリンは球場に風速計があり、上空と地上の風速情報を自動表示している。球団公式も、海側からの風を前提に花火の打ち上げ位置を変えるほど、風向の影響を受ける球場だ。\n\nただし「海風なら必ずホームランが増える」とは言えない。大切なのは、その瞬間にどちら向きへ、どれくらい吹いているかだ。同じ角度の大飛球でも、風向次第でフェンス手前に落ちたり、逆にひと伸びしたりする。\n\n## 今日の試合で見るなら\n山口航輝は32本、井上広大は7本、清宮幸太郎は23本、万波中正は21本塁打で今日を迎える。4人の大きなフライが上がったら、風速表示も一緒に見てみよう。\n\n「打った瞬間は入ったように見えたのに失速した」「逆に最後まで伸びた」という差が出れば、マリンらしさを体感できる場面だ。"}, "2-03-c": {"meta": {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-03", "1-03-c", "2-18"], "sources": ["https://npb.jp/news/detail/20260611_02.html", "https://www.nikkansports.com/baseball/news/202609220001618.html", "https://www.daily.co.jp/baseball/2026/09/22/0020848833.shtml"]}, "body": "## ひとことで\nリクエストは、監督がプレーの判定について映像での確認を求める仕組みだ。審判が映像を見直し、元の判定を維持することも、覆すこともある。\n\n## しくみ\n一瞬のタッチやフェンス際の打球は、人の目だけでは判断が難しいことがある。そこで映像を使って確認する。検証中は試合が止まり、判定が出ると再開する。\n\n2026年6月には、盗塁のアウト判定に阪神がリクエストを使い、検証後もアウトのままだった例がある。NPBは、映像検証後の判定への異議申し立ては認められないと説明している。\n\n## おもしろエピソード\n9月22日のZOZOマリンでは、山口航輝の打球が最初は二塁打と判定された。サブロー監督がリクエストを出そうとする前に審判団が協議し、映像確認の結果、本塁打へ変更された。映像判定でも、必ずしも監督のリクエストから始まるとは限らないのだ。\n\n## 今日の試合で見るなら\n本塁や塁上のきわどいセーフ・アウト、フェンス際の大飛球で監督がベンチを出たら注目しよう。ビジョンに映像が出ても、最終的な判定は審判の発表を待つのがポイントだ。"}, "2-03": {"meta": {"id": "2-03", "title": "ホームランって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-03-a", "2-03-b", "2-03-c"], "related": ["1-09", "2-02-a", "4-03", "4-06"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/31335151.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.nikkansports.com/baseball/news/202609260001489.html", "https://www.daily.co.jp/baseball/2026/09/22/0020848833.shtml"]}, "body": "## ひとことで\nホームランは、打者が一気に本塁まで帰って得点できる安打だ。ふつうは、フェアの打球が外野フェンスを越えると本塁打になる。\n\n## しくみ\nフェンス越えの本塁打なら、打った本人だけでなく、その時に塁にいた走者も全員が本塁へ帰れる。走者なしなら1点、満塁なら一度に4点だ。だから同じ1本でも、塁上に何人いるかで試合への影響が大きく変わる。\n\n打者は一塁、二塁、三塁、本塁の順にすべての塁を踏む。守備側がボールを追ってアウトにする必要はなく、走者も基本的には落ち着いて一周できる。外野フェンスを越えず、守備がボールを処理する間に一周するランニングホームランもあるが、こちらはかなり珍しい。\n\nホームランはヒットの一種で、記録上は4塁打だ。1打席で最大4点を生み出せるので、試合の流れを一振りで変えやすい。\n\n## おもしろエピソード\nロッテの山口航輝は9月22日、いったん二塁打と判定された大飛球が映像確認で本塁打に変わり、今季32号になった。ホームランかどうかは、フェンス付近のほんの少しの違いで決まることもあるのだ。\n\n## 今日の試合で見るなら\n山口は9月27日時点で32本塁打。日本ハムの清宮幸太郎は9月26日に23号を放ち、通算100本塁打まであと1本で今日を迎える。\n\nさらにロッテの井上広大は今季7本、日本ハムの万波中正は21本。大きな打球が上がったら、まず外野手ではなく打球そのものを追い、フェンスを越えるかを見るとよい。今日もっとも分かりやすく球場全体が動く瞬間の一つだ。"}, "2-04-a": {"meta": {"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-04", "2-02"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/news/detail/20170425_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nヒットかエラーかを決めるのは、球場の公式記録員だ。審判のセーフ・アウト判定とは別の仕事なのだ。\n\n## しくみ\nまず審判がプレーを判定する。そのあと公式記録員が、「普通に守っても一塁でアウトにできなかった打球」なら安打、「普通ならアウトにできたのに守備のミスで生かした」なら失策、と記録する。\n\n判断が微妙なときは、規則上は打者に有利な記録を与える考え方がある。だから同じ「野手が触って一塁セーフ」でも、ヒットとエラーの両方があり得るのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎の速いゴロを遊撃の山崎剛が横っ飛びで触っただけなら、ヒットになることがある。逆に正面のゆるいゴロをはじいて一塁に投げられなければ、エラーになりやすい。\n\n球場ではプレー直後だけでなく、その後のスコアボードにも注目するといい。HかEかが表示されれば、公式記録員の判断が見えるのだ。"}, "2-04-b": {"meta": {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-04", "2-09-a"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。守備側がうまくいかなかったように見えても、野選（野手選択）、暴投、捕逸という別の記録になり、エラーがつかない場合があるのだ。\n\n## しくみ\n野選（野手選択：打者ではなく先の走者をアウトにしようとした結果、打者を一塁に生かすこと）は、送球先の選び方に関係する記録だ。たとえば一塁で打者をアウトにできそうなのに、二塁の走者を狙って両方セーフになれば、安打ではなく野選になる場合がある。\n\n暴投（ワイルドピッチ：捕手が普通には止めにくい投球で走者を進めること）は投手側の記録だ。捕逸（パスボール：普通なら捕れる投球を捕手が処理できず走者を進めること）は捕手側の記録で、どちらも失策とは別扱いなのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンと捕手の佐藤都志也の組み合わせで、走者がいる場面の低い変化球を見てみるといい。ボールが後ろへ抜けて走者が進んだとき、暴投か捕逸かは投球の難しさで分かれる。\n\n内野では山崎剛がゴロを捕ったあと、どの塁へ投げるかにも注目だ。捕る技術だけでなく、アウトを取りやすい場所を瞬時に選ぶのも守備なのだ。"}, "2-04": {"meta": {"id": "2-04", "title": "エラーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-04-a", "2-04-b"], "related": ["2-02", "4-01"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nエラー（失策：普通ならアウトにできた守備で、ミスによって走者を生かしたり進めたりした記録）とは、守備のミスにつく公式記録なのだ。見た目に失敗していても、必ずエラーになるわけではない。\n\n## しくみ\n大事なのは「その野手なら普通の守備で処理できたか」だ。ゴロをはじく、捕れるフライを落とす、アウトにできる送球を大きくそらす、といった場面では失策になることがある。\n\n逆に、強烈な打球に飛びついたが届かなかった、難しい体勢から送球して間に合わなかった、という場面は失策にならないことも多い。公認野球規則でも、判断だけの誤りは原則として失策にしないと定めている。\n\nだから、観客から見て「今のはミスでは？」と思っても、記録はヒットになることがあるのだ。スコアボードの「E」は、守備側の失策数を表している。\n\n## おもしろエピソード\nエラーかヒットかを決めるのは審判ではなく、公式記録員だ。公式記録員は試合を見ながら、安打・失策などの記録を独自に判断する役目を持っている。\n\n## 今日の試合で見るなら\nロッテの遊撃・山崎剛や二塁・小川龍成のところへ、日本ハムの清宮幸太郎が強いゴロを打った場面を見てみるといい。取り切れずに一塁がセーフでも、強烈な打球ならヒット、普通に処理できたと判断されればエラーになり得るのだ。\n\n外野では、海風のあるZOZOマリンで藤原恭大や髙部瑛斗がフライを追う。落球したから即エラー、ではなく、「普通の守備で捕れたか」が基準になるところが見どころだ。"}, "2-05-a": {"meta": {"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "4-01"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備位置には1〜9の番号がある。背番号ではなく、スコアを短く書くための「住所」のような番号なのだ。\n\n## しくみ\n番号は次の順番だ。\n\n- 1＝投手、2＝捕手、3＝一塁手\n- 4＝二塁手、5＝三塁手、6＝遊撃手\n- 7＝左翼手、8＝中堅手、9＝右翼手\n\nたとえば「6-3」なら、遊撃手がゴロを処理して一塁手へ送球し、アウトを取ったという意味になる。\n\n## 今日の試合で見るなら\nロッテの予想守備を番号にすると、アンドレ・ジャクソンが1、佐藤都志也が2、井上広大が3、小川龍成が4、寺地隆成が5、山崎剛が6、西川史礁が7、髙部瑛斗が8、藤原恭大が9だ。\n\n山崎から小川、井上へ渡る併殺が出れば「6-4-3」になる。スコア表示や実況で数字が出ても、誰が動いたかを頭の中でたどれるようになるのだ。"}, "2-05-b": {"meta": {"id": "2-05-b", "title": "内野と外野は何が違う？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n内野（4つの塁に近い範囲）は、ゴロを素早くアウトにする仕事が多い。外野（そのさらに奥の範囲）は、飛んだ打球を広く追い、長打を小さくする仕事が多いのだ。\n\n## しくみ\n内野手は一塁手・二塁手・三塁手・遊撃手の4人だ。打球を捕ってから一塁へ送るまでの時間が短いので、捕球から送球への速さが重要になる。\n\n外野手は左翼手・中堅手・右翼手の3人だ。守る面積が広く、頭上を越されると二塁打や三塁打になりやすい。フライの落下地点を読むことと、進塁を防ぐ返球が大切なのだ。\n\n## 今日の試合で見るなら\nロッテでは小川龍成と山崎剛が内野中央、髙部瑛斗と藤原恭大が外野の中心になる。日本ハムの万波中正が強い打球を放ったら、ゴロなら内野の速い処理、外野を抜く打球なら外野手の追い方と返球を見れば違いがわかりやすい。\n\nZOZOマリンでは風でフライの落下地点が変わることもある。内野と外野では、同じ「捕る」でも準備する距離と時間がかなり違うのだ。"}, "2-05-c": {"meta": {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05-a"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nシフト（打者の特徴に合わせて守る位置を変える作戦）とは、打球が来そうな場所へ先回りする守備なのだ。二塁手や遊撃手は、いつも同じ場所に立つわけではない。\n\n## しくみ\nたとえば引っ張る打球が多い打者なら、その方向を少し厚く守る。逆方向へ流す打球が多い打者なら、そちらへ寄ることもある。\n\n動かすのは左右だけではない。強い打球が多ければ少し深く、バントの可能性があれば前へ出るなど、走者やアウト数でも位置は変わる。2026年の規則改正で、NPBでも投球時に内野手4人が二塁ベースの両側に2人ずつ分かれていなければならなくなった。守備側はその範囲で配置を工夫するのだ。\n\n## 今日の試合で見るなら\n日本ハムの清宮幸太郎や田宮裕涼が打席に入る前、ロッテの二塁・小川龍成と遊撃・山崎剛の位置を見てみるといい。右打者の万波中正のときと比べると、立つ場所が変わるかもしれない。\n\n投球のたびに打球だけを見るのではなく、投げる直前の内野手を見る。数歩の移動にも「ここへ飛ぶ確率が高い」という守備側の読みが表れているのだ。"}, "2-05-d": {"meta": {"id": "2-05-d", "title": "中継プレーって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n中継プレー（遠い場所からの送球を途中の野手が受け、次の塁へつなぐ連携）は、外野から本塁などへ正確に速く返すための仕組みだ。\n\n## しくみ\n外野の深い場所から本塁までを一人で投げると、距離が長くなり、送球がそれやすい。そこで内野手が途中に入り、外野手の送球を受けて本塁や三塁へ投げ直す。\n\n中継に入る野手は、外野手と狙う塁を結ぶ線上に立つ。送球が十分強ければそのまま通し、弱かったり方向を変えたいときは捕って投げる。だから中継役は「ただ間に立つ人」ではないのだ。\n\n## 今日の試合で見るなら\n日本ハムの万波中正が右中間を破る長打を打った場面を想像するとわかりやすい。ロッテの藤原恭大や髙部瑛斗が打球を処理し、小川龍成や山崎剛が中継地点へ走り、最後は本塁の佐藤都志也へつなぐ。\n\nあなたはボールだけでなく、打球が外野へ飛んだ瞬間の内野手も見るといい。誰かが外野方向へ走り出したら、その選手が送球の道を作ろうとしている可能性が高いのだ。"}, "2-05": {"meta": {"id": "2-05", "title": "守備って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-05-a", "2-05-b", "2-05-c", "2-05-d"], "related": ["1-08", "2-06", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備とは、相手の打球や走塁を止めてアウトを取る側の仕事だ。グラウンドには投手と捕手を含めて9人が入り、それぞれ違う範囲と役割を受け持つ。\n\n## しくみ\n投手が投げ、打者が打った瞬間から、守備の9人は「どこに飛んだか」「走者がどこにいるか」「何アウトか」で動きを変える。ゴロなら内野手が捕って一塁へ、フライなら落下地点に近い野手が捕る、というのが基本だ。\n\nでも実際は、ボールを捕る人だけが守備をしているわけではない。ほかの野手も、送球を受ける塁へ入る、悪送球に備えて後ろを守る、中継に入る、といった動きを同時にしている。\n\nつまり守備は9人で行う連携なのだ。テレビでは打球だけを追いがちだが、球場ではボールから離れた選手の動きも見える。それが現地観戦のおもしろさの一つだ。\n\n## おもしろエピソード\nスコアブックでは守備位置を1〜9の数字で表す。たとえば「6-4-3」の併殺なら、遊撃手から二塁手、最後に一塁手へ送ったという意味になる。\n\n数字がわかると、スコアや実況の短い表現だけでプレーの流れを読めるようになるのだ。\n\n## 今日の試合で見るなら\nロッテの予想守備では、遊撃の山崎剛と二塁の小川龍成が内野の中央を守り、中堅の髙部瑛斗や右翼の藤原恭大が外野を受け持つ。日本ハムの水野達稀や清宮幸太郎が打席に入ったら、投球前から彼らの立ち位置を見ておくといい。\n\n打球が飛んだあと、捕った選手だけでなく、ほかの野手が塁や中継地点へ動くところまで追う。そうすると、守備が「一人の好プレー」ではなく、9人の配置と連携でできているのが見えてくるのだ。"}, "2-06-a": {"meta": {"id": "2-06-a", "title": "ゴールデングラブ賞って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/news/detail/20251112_02.html", "https://npb.jp/award/2022/glove.html", "https://npb.jp/bis/players/11215151.html"]}, "body": "## ひとことで\n三井ゴールデン・グラブ賞は、その年に守備で特に高く評価された選手を選ぶ表彰だ。いわば「守備のベストナイン」なのだ。\n\n## しくみ\n受賞者は、新聞社・通信社・テレビ局・ラジオ局のプロ野球担当記者による投票で決まる。投手、捕手、各内野手、外野手が選ばれ、セ・リーグとパ・リーグでそれぞれ表彰される。\n\nだから、単純にエラーが少ない選手を自動で選ぶ賞ではない。守備範囲、肩、捕球、送球などを含めて、記者がその年の守備を評価する賞なのだ。\n\n## おもしろエピソード\nロッテの髙部瑛斗は2022年、パ・リーグ外野手部門で初受賞した。\n\n## 今日の試合で見るなら\n予想どおり髙部が中堅に入ったら、過去の受賞歴を思い出しつつ、打球への一歩目を見てほしい。受賞歴があるから毎回好守になるわけではないが、「守備も見どころの選手」だと分かるのだ。"}, "2-06-b": {"meta": {"id": "2-06-b", "title": "どこを見るとファインプレーに気づける？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\n打球を捕る瞬間だけでなく、「打つ前の位置」と「打った直後の一歩目」を見ると、ファインプレーに気づきやすい。うまい守備ほど派手に見えないこともあるのだ。\n\n## しくみ\n見る順番は、位置取り→一歩目→捕球→送球でいい。外野手なら最短に近い道で落下点へ入れたか、内野手なら捕ったあとすぐ投げられる体勢だったかを見る。\n\nさらに走者がいる場面では、送球先も大事だ。ホームを狙う走者を止めたり、余計な進塁を防いだりする判断も好守なのだ。\n\n## 今日の試合で見るなら\nロッテの髙部瑛斗と藤原恭大に打球が飛んだら、ボールより先に2人の足を見てほしい。打った瞬間に迷わず動き、余裕を持って捕ったなら、その「余裕」自体がうまさの結果かもしれないのだ。"}, "2-06": {"meta": {"id": "2-06", "title": "ファインプレーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-06-a", "2-06-b"], "related": ["2-05", "2-04"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\nファインプレーは、普通ならヒットや進塁になりそうな打球を、守備のうまさでアウトに変えるような好プレーのことだ。派手に飛びつく場面だけがファインプレーではないのだ。\n\n## しくみ\n守備のうまさは、捕った瞬間だけでは決まらない。打球が飛ぶ前の位置取り、打った瞬間の一歩目、落下点までの走り方、捕ってから投げる速さまでが一続きなのだ。\n\nたとえば外野手が余裕を持ってフライを捕ると、簡単に見えることがある。けれど、最初から正しい方向へ走れていたから余裕が生まれたのかもしれない。逆に、飛びついて捕ったからといって、必ずしも最善の守備だったとは限らないのだ。\n\n内野なら、強いゴロに追いつくだけでなく、体勢が崩れても一塁へ正確に送れるかまで見るといい。走者がいるときは、ただアウトを取るだけでなく、次の塁へ進ませない判断も守備の価値になる。\n\n## おもしろエピソード\nロッテの髙部瑛斗は2022年に外野手として三井ゴールデン・グラブ賞を受賞している。賞の名前を知らなくても、守備で評価された選手だと分かれば、打球が飛んだときの見方が変わるのだ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは髙部瑛斗が中堅、藤原恭大が右翼に入る。外野へ打球が上がったら、ボールだけでなく、2人が打った瞬間にどちらへ動いたかを見てほしい。\n\n特にZOZOマリンの外野では、最後の捕球だけを追うより、落下点へ入るまでの動きに注目するとファインプレーに気づきやすいのだ。"}, "2-07-a": {"meta": {"id": "2-07-a", "title": "球種って？（ストレート・フォーク・チェンジアップなど）", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-13"], "sources": ["https://npb.jp/pl/", "https://pacificleague.com/news/2026/9/86605"]}, "body": "## ひとことで\n球種（速さや曲がり方の違う球）は、打者の予想を外すための道具だ。同じ腕の振りから違う球が来るほど、打つ側は対応しにくいのだ。\n\n## しくみ\n代表的なのは、ストレート（まっすぐに見える速い球）、フォーク（打者の手元で下に落ちる球）、チェンジアップ（速球に似たフォームから遅く投げる球）だ。スライダー（横や斜めに曲がる球）などもある。\n\n大事なのは「一番すごい球」ではなく組み合わせだ。速球を意識させて遅い球を投げれば、打者は早く振り始めてしまう。じゃんけんで同じ手だけを出さないのと似ているのだ。\n\n## 今日の試合で見るなら\nロッテ先発のA.ジャクソンは直球とチェンジアップ、日本ハム先発の福島蓮は直球とフォークが見どころだ。空振りしたとき、球が速すぎたのか、途中で落ちたのか、タイミングを外されたのかを見ると球種の違いがわかりやすい。"}, "2-07-b": {"meta": {"id": "2-07-b", "title": "何キロ出たら速い？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-07-a"], "sources": ["https://npb.jp/pl/", "https://npb.jp/announcement/roster/"]}, "body": "## ひとことで\n「何キロから速い」という公式の境目はない。ただ、観戦では150キロ前後が出ると「かなり速い球だ」と見る目安にしやすいのだ。\n\n## しくみ\n球速は球場表示で「152 km/h」のように出る。けれど、同じ150キロでも打者の感じ方は同じではない。投手の腕が見えにくい、球が伸びて見える、変化球との速度差が大きい、といった条件で打ちにくさは変わるからだ。\n\n逆に140キロ台でも、狙った場所へ投げ分ければ十分に抑えられる。速度計は「投手の強さそのもの」ではなく、投球を読む一つの数字なのだ。\n\n## 今日の試合で見るなら\n今日はA.ジャクソンと福島蓮の直球が表示されたら、まず球速を覚えておくとよい。その後のフォークやチェンジアップで打者の振りが遅れたり早まったりすれば、速さと速度差がセットで効いているのが見えてくる。"}, "2-07-c": {"meta": {"id": "2-07-c", "title": "何球くらい投げたら交代する？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-09"], "sources": ["https://www.nikkansports.com/baseball/news/202609120001034.html", "https://www.nikkansports.com/baseball/news/202607220001544.html", "https://www.nikkansports.com/baseball/news/202609270001159.html", "https://www.chunichi.co.jp/article/1317229", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\nプロ野球の先発投手に「○球で必ず交代」という決まりはない。100球前後は観戦の目安になるが、点差や内容、次に投げる投手まで含めて監督が決めるのだ。\n\n## しくみ\n同じ100球でも、5回で到達するのと7回で到達するのでは意味が違う。走者を何人も出して一球ごとの負担が大きければ早めに替えることもあるし、少ない球数でアウトを重ねていれば長く投げることもある。\n\n実際に今季も、101球や104球で先発が交代した試合がある。100はルールではなく、「そろそろ継投（投手を交代してつなぐこと）がありそうだ」と考える目盛りなのだ。\n\n## 今日の試合で見るなら\n特に福島蓮は、7月12日以来の先発だ。直前まで救援で投げ、先発予定だった加藤貴之の離脱を受けて前日に先発を告げられている。だから球数が100に届く前でも、内容や回数を見て早めに日本ハムの中継ぎへつなぐ展開は十分考えられるのだ。"}, "2-07-d": {"meta": {"id": "2-07-d", "title": "右投げと左投げで何が違う？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07", "2-07-a"], "sources": ["https://npb.jp/pl/", "https://npb.jp/announcement/roster/"]}, "body": "## ひとことで\n右投手と左投手では、打者から見えるボールの出どころと曲がる方向が変わる。同じ球速でも、対戦する打者の左右で打ちやすさが変わることがあるのだ。\n\n## しくみ\n右投手対右打者、左投手対左打者のような「同じ側」の対戦では、外へ逃げる変化球が使いやすい。反対側の打者には球の見え方が変わるので、投手は球種やコースを組み替える。\n\nまた左投手は一塁側を向いた姿勢から投げるため、一塁走者への牽制球（走者を塁へ戻す送球）も右投手とは見え方が違う。左右は単なる利き腕ではなく、作戦の材料なのだ。\n\n## 今日の試合で見るなら\n今日の先発A.ジャクソンと福島蓮はともに右腕だ。試合途中にロッテの左腕・坂本光士郎が出て、水野達稀や清宮幸太郎のような左打者と向き合えば「左対左」になる。交代した瞬間に打者との左右関係を見ると、継投の意図を考えやすい。"}, "2-07": {"meta": {"id": "2-07", "title": "ピッチャーって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-07-a", "2-07-b", "2-07-c", "2-07-d"], "related": ["2-08", "2-09", "2-13"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://pacificleague.com/news/2026/9/86605", "https://www.chunichi.co.jp/article/1317229"]}, "body": "## ひとことで\nピッチャー（投手：打者にボールを投げる守備の選手）は、毎回のプレーを始める役だ。速い球を投げるだけでなく、打者に強い打球を打たせないことが仕事なのだ。\n\n## しくみ\n投手はマウンド（内野の中央にある少し高い場所）から、キャッチャー（捕手：本塁の後ろで球を受ける選手）へ投げる。ストライクを3つ取れば三振だが、全部を三振にする必要はない。打ちにくいコースへ投げてゴロやフライにすれば、後ろの8人にアウトを取ってもらえるからだ。\n\nだから投球は、速さだけの勝負ではない。球種（速さや曲がり方の違う球）を混ぜ、同じフォームから違う軌道を見せる。さらにボール球も使い、打者が「次は何が来るか」を読み切れないようにするのだ。\n\n投手は守備にも参加する。自分の近くへ飛んだゴロを捕り、一塁へ送球することもあるし、走者がいるときは牽制球（走者を塁へ戻すための送球）も投げる。打者だけでなく、走者と守備全体を動かす役でもあるというわけだ。\n\n## 今日の試合で見るなら\n今日の先発（試合の最初から投げる投手）は、ロッテが右腕のA.ジャクソン、日本ハムが右腕の福島蓮だ。ジャクソンは今季9勝8敗、防御率3.44で、勝てば10勝目。福島は7月12日以来の先発で、それまでは救援（試合途中から投げる役）を続けていた。\n\n同じ右投げでも、投げ方と球種はかなり違う。ジャクソンは力のある直球とチェンジアップ、福島は角度のある直球とフォークが持ち味だ。球速表示だけでなく、打者の空振り方やゴロの増え方を見ると、投手の狙いが少し見えてくるのだ。"}, "2-08-a": {"meta": {"id": "2-08-a", "title": "サインって何を決めてるの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-08", "2-07"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\n捕手のサインは、主に「どの球種を、どこへ投げるか」を投手と共有する合図だ。1球ごとの小さな作戦会議だと思えばいい。\n\n## しくみ\n同じ打者でも、ストライクやボールの数、アウト数、走者の有無、直前に投げた球で狙いは変わる。こうした一連の組み立てを配球（はいきゅう：投げる球の順番や場所の組み立て）という。\n\n捕手が案を出しても、投手が違う球を選びたいことはある。大事なのは、投げる前に2人の考えが一致していることなのだ。\n\n## 今日の試合で見るなら\nロッテの佐藤都志也とジャクソン、日本ハムの田宮裕涼と福島蓮の組み合わせに注目してほしい。同じ打者にストレートを続けるのか、途中で変化球を混ぜるのかを見ると、サインの意味を想像しやすいのだ。"}, "2-08-b": {"meta": {"id": "2-08-b", "title": "盗塁を刺すってどういうこと？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-08", "2-11"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/71075151.html"]}, "body": "## ひとことで\n「盗塁を刺す」は、走者が次の塁を盗もうとしたとき、捕手が送球してアウトにすることだ。捕手の肩だけでなく、投手と内野手も関わる共同作業なのだ。\n\n## しくみ\nたとえば一塁走者が二塁へ走る。捕手は投球を受けたらすぐ持ち替えて二塁へ投げ、内野手がボールを受けて走者にタッチする。\n\n勝負はほんの短い時間で決まる。走者のスタート、投手が本塁へ投げる速さ、捕手の捕球と送球、内野手のタッチが全部つながっているのだ。\n\n記録では、盗塁を試みてアウトになった走者に盗塁刺が記録される。「捕手が刺した」は、その守備側から見た言い方だ。\n\n## 今日の試合で見るなら\n日本ハムの西川遥輝は9月27日終了時点で通算345盗塁だ。途中出場して一塁に出たら、ロッテの佐藤都志也が捕手なら、投球後すぐ二塁方向を見ると盗塁の攻防を追いやすいのだ。"}, "2-08": {"meta": {"id": "2-08", "title": "キャッチャーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-08-a", "2-08-b"], "related": ["2-07", "2-11"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\nキャッチャー（捕手）は、本塁の後ろで投手の球を受ける守備の中心だ。捕るだけでなく、投球の相談、走者への警戒、送球、ワンバウンドの処理まで担当するのだ。\n\n## しくみ\n投手が投げるたび、捕手は球を受ける。だから1試合の守備でボールに触れる回数がとても多く、投手と一緒に打者をどう打ち取るか考える役になる。\n\n投球前には、球種（ストレートや変化球の種類）や狙う場所を投手と共有する。走者がいるときは、盗塁を警戒しながら、ワンバウンドした球を体で止めて進塁を防ぐ仕事もある。\n\nさらに、打球が前へ転がれば素早く拾い、ファウルフライなら防具を着けたまま追う。本塁で走者と勝負する場面では、送球を受けてタッチする。投手の相棒であり、本塁周辺の守備をまとめる選手なのだ。\n\n## おもしろエピソード\n捕手は守備だけでなく打者としても出場する。今日の予想スタメンでは、ロッテの佐藤都志也、日本ハムの田宮裕涼はいずれも左打ちの捕手だ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは佐藤都志也がアンドレ・ジャクソン、日本ハムは田宮裕涼が福島蓮とバッテリーを組む。\n\n投手が投げる前、捕手は毎回ほぼ同じ場所に座っているようで、実は構えや要求が少しずつ変わる。投球だけでなく、その直前の捕手の動きを見ると、1球ごとの作戦が見えやすくなるのだ。"}, "2-09-a": {"meta": {"id": "2-09-a", "title": "勝ち投手・負け投手・セーブ・ホールドって？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-09"], "sources": ["https://npb.jp/npb/20050203stats.html", "https://npb.jp/news/detail/20190315_04.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nこれは「投手が試合のどの場面を担当したか」を表す記録だ。チームの勝敗と同じではなく、1試合の中で勝ち投手、セーブ、ホールドが別々の投手につくことがある。\n\n## しくみ\n勝ち投手は、勝ったチームで勝ちにつながる時点を担当した投手だ。先発は原則5回以上を投げ、リードしたまま降り、そのリードが最後まで続くと勝ち投手になる。5回未満で降りた場合は、救援投手の中から記録員が規則に沿って決める。\n\n負け投手は、相手が最後まで守ったリードにつながる走者を出した投手につくのが基本だ。セーブは、接戦の終盤を最後まで投げ切った救援投手につく記録。ホールドは、決められた接戦の場面でリードや同点を保って次へつないだ救援投手につく。\n\n## 今日の試合で見るなら\nA.ジャクソンは今日勝てば10勝目だ。一方、ロッテの横山陸人は今季33セーブ。ロッテが終盤に小差でリードし、中継ぎがつないで横山が最後を締めれば、1試合で「勝ち・ホールド・セーブ」が別々の投手につく流れを見られるかもしれない。"}, "2-09-b": {"meta": {"id": "2-09-b", "title": "先発はなぜ6日くらい空けて投げるの？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-07-c", "2-09"], "sources": ["https://www.nikkansports.com/baseball/news/202607270000480.html", "https://www.nikkansports.com/baseball/news/202606160001168.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0922/m-b-24/box.html", "https://pacificleague.com/news/2026/6/10051440"]}, "body": "## ひとことで\n先発は一度に何十球も強く腕を振るので、次の登板まで回復と準備の時間が必要だ。日本のプロ野球では「中6日」、つまり登板の間に6日間休んで次に投げる形がよく使われる。\n\n## しくみ\n月曜日に投げ、火曜から日曜まで6日空け、次の月曜日にまた投げる。これが中6日だ。休んでいるだけではなく、体を戻し、軽い投球やブルペン投球をはさみ、次の相手への準備をする。\n\n楽天の吉井理人監督も2026年、基本は中6日で回し、一定のリズムを作る考えを説明している。毎回同じ間隔なら、投手も「何日前に何をするか」を組み立てやすいのだ。\n\n## 今日の試合で見るなら\nロッテのA.ジャクソンは9月22日に登板し、今日はそこから中5日だ。必ず中6日でなければいけないわけではなく、日程やチーム事情で前後する。今日の投球では、間隔が少し短い中で何回まで球威を保てるかも見どころになる。"}, "2-09-c": {"meta": {"id": "2-09-c", "title": "ブルペンって？どこにある？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-09"], "sources": ["https://www.marines.co.jp/community/marineslinks/20250825-01.html", "https://www.marines.co.jp/community/marineslinks/20241105-01.html", "https://npb.jp/announcement/roster/", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nブルペンは、試合に出る前の投手が肩を作る投球練習場所だ。「ブルペン陣」と言うと、中継ぎや抑えの投手たち全体を指すこともある。\n\n## しくみ\n先発が苦しくなってから次の投手が準備を始めたのでは遅い。救援投手はブルペンで投げ、体と球の感覚を実戦に近づけてから登板する。だからベンチは、試合の少し先を読んで準備を進めるのだ。\n\nZOZOマリンには1塁側と3塁側にブルペンがあることが、ロッテ公式の記事でも確認できる。球場で「ブルペンが動いた」と聞こえたら、投手交代が近づいている合図だと考えるとよい。\n\n## 今日の試合で見るなら\nロッテは1塁側、日本ハムは3塁側だ。A.ジャクソンの球数が増えれば、中森俊介、八木彬、横山陸人ら救援陣の出番を考える時間になる。福島蓮は久しぶりの先発なので、日本ハム側はさらに早い回から次の投手を準備する展開もあり得るのだ。"}, "2-09": {"meta": {"id": "2-09", "title": "先発とか中継ぎとか抑えって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-09-a", "2-09-b", "2-09-c"], "related": ["2-07", "2-07-c"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/announcement/roster/", "https://pacificleague.com/news/2026/9/86605", "https://www.nikkansports.com/baseball/news/202609270001159.html", "https://www.chunichi.co.jp/article/1317229", "https://npb.jp/scores/2026/0925/l-m-22/box.html", "https://npb.jp/scores/2026/0926/l-m-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n投手は、一人で9回すべてを投げるとは限らない。最初に投げる先発、途中をつなぐ中継ぎ、最後を任される抑えに役割を分けて戦うのだ。\n\n## しくみ\n先発（試合の最初から投げる投手）は、できるだけ長い回を投げて試合を作る役だ。そこから中継ぎ（試合途中から短い回を受け持つ投手）がつなぐ。勝っている終盤には、セットアッパー（主に7、8回の重要な場面を任される投手）や抑え（最後の回を締める投手）が出てくる。\n\nこの交代の流れを継投（複数の投手で試合をつなぐこと）という。監督は点差、打者の左右、各投手の疲労、前日までの登板などを見て決める。同じ「7回」でも、毎日同じ投手が出るわけではないのだ。\n\nロッテでは今季、横山陸人が33セーブを挙げて抑えを担っている。中森俊介、八木彬、鈴木昭汰らも多くの救援登板を重ねてきた。先発が降りた後も、試合には別の勝負が始まるというわけだ。\n\n## 今日の試合で見るなら\nロッテ先発のA.ジャクソンは9勝目まで挙げており、まず何回まで投げるかがポイントだ。鈴木昭汰は9月25日から27日まで3日連続で登板しているため、今日の起用は負荷との相談になる。中森、八木、横山へどうつなぐかを見ると、ロッテの継投がわかりやすい。\n\n日本ハムの福島蓮は事情が違う。7月12日を最後に先発から離れ、その後は16試合に救援登板していたが、先発予定だった加藤貴之の離脱で前日に今日の先発を告げられた。長い回を当然のように任せる日ではなく、早めに中継ぎへつなぐ展開も想定して見ると、ベンチの動きが読みやすいのだ。"}, "2-10-a": {"meta": {"id": "2-10-a", "title": "ゲッツー（併殺打）って？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-10", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nゲッツーは、守備側が一つの流れで2つアウトを取る併殺（ダブルプレー）のことだ。併殺打は、その原因になった打者の打撃を示す記録なのだ。\n\n## しくみ\n典型は一塁走者がいる場面の内野ゴロだ。遊撃手や二塁手が二塁で走者をアウトにし、すぐ一塁へ送って打者走者もアウトにする。\n\n「併殺」と「併殺打」は完全に同じではない。たとえば三振と盗塁失敗が同じプレーで重なれば2アウトでも、打者の打球で起きたわけではないので併殺打ではない。\n\n## おもしろエピソード\n前日の9月27日、藤原恭大の打席にはNPB公式記録で「一併打」と付いた。一塁手が関わる併殺打だったと、記録だけでも読み取れるのだ。\n\n## 今日の試合で見るなら\nロッテの山崎剛と小川龍成、日本ハムの水野達稀と山縣秀が二遊間に入れば注目だ。一塁に走者がいてゴロが飛んだら、最初の送球先が二塁かどうかを見るとゲッツーを追いやすい。"}, "2-10-b": {"meta": {"id": "2-10-b", "title": "3つ一気に取るトリプルプレーは？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-10", "2-12"], "sources": ["https://npb.jp/history/2025/review_rec_f.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。三重殺（トリプルプレー：一つのプレーで3つアウトを取ること）という、とても珍しい守備なのだ。\n\n## しくみ\n起きやすい入口は、ノーアウトで走者が2人以上いる場面だ。たとえば一・二塁で内野への強いライナーを野手が捕り、飛び出していた走者を二塁、一塁で続けてアウトにすると3アウトになる。\n\nゴロでも、三塁、二塁、一塁と送って三つ取る形がある。条件も送球もそろわないと成立しないので、普通の併殺よりずっと珍しい。\n\n## おもしろエピソード\nNPBでは2025年7月13日にソフトバンクが楽天戦で三重殺を記録した。NPB公式によると、プロ野球で175度目だった。\n\n## 今日の試合で見るなら\nノーアウト一・二塁になったら少しだけ意識するといい。水野達稀や山崎剛の近くへ鋭い打球が飛び、走者が大きく飛び出していたら、二つ目だけでなく三つ目のアウトまで続く可能性があるのだ。"}, "2-10-c": {"meta": {"id": "2-10-c", "title": "ゲッツーを防ぐために走者は何をする？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-10", "2-11"], "sources": ["https://npb.jp/npb/2017rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n一塁走者は、まず二塁でセーフになるよう全力で走る。滑り込むなら**正しいスライディング（ベースへ滑り込むこと）**を使い、==野手にわざとぶつかって邪魔するのは反則なのだ。==\n\n## しくみ\n**併殺（ゲッツー：1つの打球で2つアウトを取ること）**は、一塁に走者がいて内野ゴロが出たときに起きやすい。走者が二塁でセーフになれば、そこで1つ目のアウトを取れないので、==ゲッツーそのものを防げる==。\n\n二塁でアウトになりそうでも、走者は正規の走路を走り、滑るならベースへ向かって滑る。NPBでは2017年に、併殺を防ぐため野手へ接触しようとする不正なスライディングは妨害になると明文化された。==「野手を倒して送球を止める」はしてはいけない==というわけだ。\n\n## 今日の試合で見るなら\nたとえばロッテの**西川史礁**が一塁に出て、次の**山口航輝**が遊撃手や二塁手へゴロを打った場面だ。==西川が二塁へどう走るかまで見ると、打者だけでなく走者もゲッツーと戦っている==のが分かるのだ。"}, "2-10": {"meta": {"id": "2-10", "title": "一気に2つアウトを取ることがあるの？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-10-a", "2-10-b"], "related": ["1-08", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。一つのプレーで2人をアウトにする併殺（ダブルプレー：一度に2つアウトを取ること）があるのだ。内野ゴロで「二塁アウト、すぐ一塁アウト」がいちばん見つけやすい形だ。\n\n## しくみ\nたとえばノーアウト一塁で、打者が遊撃手の近くへゴロを打ったとする。一塁走者は二塁へ進まなければならないので、守備側はまず二塁で走者をアウトにし、すぐ一塁へ送って打者走者もアウトにできる。\n\nこれでアウト数は0から2へ一気に増える。守る側には大きな得で、攻撃側には走者まで消える痛いプレーなのだ。\n\n二塁手や遊撃手は、捕ってから投げる速さだけでなく、次の送球がしやすい向きでボールを受ける。二塁ベース付近の動きが急に速くなったら、併殺を狙っている可能性が高い。\n\nただし、すでにツーアウトなら二つ目のアウトは取れない。最初の一つが三つ目のアウトになり、その瞬間に攻撃が終わるからだ。\n\n## おもしろエピソード\n前日の9月27日、ロッテの藤原恭大は一塁への打球で「一併打」と記録された。表示の「併」が、併殺打（打者の打球をきっかけに2つアウトになる打撃）の目印なのだ。\n\n## 今日の試合で見るなら\n予想どおりなら、ロッテは遊撃の山崎剛と二塁の小川龍成、日本ハムは遊撃の水野達稀と二塁の山縣秀が二遊間を組む。ノーアウトかワンナウトで一塁に走者が出たら、打球だけでなく二塁ベースも見るといい。\n\nゴロが二遊間へ飛んだ瞬間、野手が二塁、一塁へ続けて投げればゲッツーの場面だ。スコアボードのアウト表示が一気に二つ増えるので、初めてでも結果を確認しやすい。"}, "2-11-a": {"meta": {"id": "2-11-a", "title": "牽制球って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-11", "2-08"], "sources": ["https://npb.jp/bis/players/63165155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n牽制球（けんせいきゅう）は、投手が本塁ではなく走者のいる塁へ投げる球だ。走者をアウトにするか、塁から大きく離れにくくする狙いがあるのだ。\n\n## しくみ\n一塁走者は、次の塁へ進みやすくするため少し塁から離れる。離れすぎれば、投手が一塁へ素早く投げ、野手がタッチしてアウトを狙える。\n\nアウトにならなくても意味はある。走者を塁の近くへ戻せれば、盗塁のスタートが遅れやすくなるからだ。牽制は「走るな」と圧力をかける守備でもある。\n\n## 今日の試合で見るなら\n日本ハムの1番予想・水野達稀が一塁に出たら、ロッテ先発のジャクソンを見てほしい。本塁へ投げる前に一塁を見る回数や、実際に牽制を入れるかで、水野の足をどれだけ警戒しているかが見えやすいのだ。"}, "2-11-b": {"meta": {"id": "2-11-b", "title": "誰が走るの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-11", "2-17"], "sources": ["https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html"]}, "body": "## ひとことで\n盗塁するのは足が速い選手が中心だが、それだけでは決まらない。投手の動きを読む力、スタート、成功率、試合の状況まで含めて「走れる選手」になるのだ。\n\n## しくみ\n50メートル走が速くても、投手の動き出しを読めなければ出遅れる。逆に、最初の一歩がうまい選手は、純粋な足の速さ以上に盗塁で強みを出せる。\n\nさらに、相手捕手の送球や点差も関係する。1点が重要な場面では、アウトになる危険と、二塁へ進む価値を比べて走るか決めるのだ。\n\n## 今日の試合で見るなら\n日本ハムでは水野達稀が今季15盗塁。西川遥輝は通算345盗塁で、現役最多だ。\n\n水野が先発で出塁したとき、西川が途中から代走や代打で出て塁に残ったときは、打者だけを見ず一塁走者も見てほしい。投手が投げる直前の一歩に、走る選手の技術が出るのだ。"}, "2-11": {"meta": {"id": "2-11", "title": "盗塁ってなに？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-11-a", "2-11-b"], "related": ["2-08", "1-06"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html"]}, "body": "## ひとことで\n盗塁は、走者が打球を待たずに次の塁を狙って進むプレーだ。成功すればヒットがなくても塁を一つ進めるが、失敗するとアウトになるのだ。\n\n## しくみ\n代表的なのは、一塁走者が投手の投球動作に合わせて走り出し、二塁を狙う形だ。捕手は投球を受けると二塁へ送り、走者がタッチされる前に塁へ着けば成功になる。\n\nだから盗塁は、単純な足の速さだけの勝負ではない。投手がいつ本塁へ投げるかを読むこと、よいスタートを切ること、捕手の送球より先に着くことが必要なのだ。\n\n失敗すれば走者が一人減るので、いつでも走ればいいわけではない。アウト数、点差、打者、相手投手や捕手を見ながら、成功しやすい場面を選ぶ。\n\nまた、走者が進んでも必ず盗塁になるわけではない。守備側が進塁を止める動きをほとんど見せない場合などは、公式記録で盗塁が付かないことがあるのだ。\n\n## おもしろエピソード\n日本ハムの西川遥輝は、9月27日終了時点で通算345盗塁。現役選手では最多で、通算350盗塁まであと5に迫っている。\n\n## 今日の試合で見るなら\n予想スタメンの1番・水野達稀は今季15盗塁。まず初回、水野が出塁したら、打者だけでなく一塁走者にも注目してほしい。\n\n西川が途中出場して塁に出た場面も見逃せない。投手が本塁を向いている間に、西川のリード（塁から離れて取る準備距離）が少しずつ変わるところから、盗塁の駆け引きは始まっているのだ。"}, "2-12-a": {"meta": {"id": "2-12-a", "title": "犠牲フライって？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-12", "1-09"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n犠牲フライ（外野フライのアウトと引き換えに走者を生還させる打撃）は、ノーアウトかワンナウトで走者が得点したときに記録されるのだ。\n\n## しくみ\nたとえばワンナウト三塁。打者が外野へ深いフライを打ち、外野手が捕ると打者はアウトになる。\n\n三塁走者は捕球後に三塁からスタートし、本塁へ帰れば1点だ。これが典型的な犠牲フライで、打者には打点が付き、打数には数えない。\n\nツーアウトでは、フライを捕られた時点で3アウトなので犠牲フライにはならない。アウト数を見る理由がここにあるのだ。\n\n## 今日の試合で見るなら\n山口航輝や清宮幸太郎の打席で、ノーアウトかワンナウト三塁になったら外野の位置も見るといい。深いフライが上がったら、捕球だけで終わりではなく、三塁走者のスタートと本塁への返球までが一つの勝負なのだ。\n\n右翼に万波中正や藤原恭大が入れば、本塁へ投げる場面にも注目できる。"}, "2-12-b": {"meta": {"id": "2-12-b", "title": "ツーアウトからは全力で走るって本当？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "related": ["2-12", "1-09"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n本当だ。ツーアウトでは次のアウトで攻撃が終わるので、走者は打球が飛んだら先の塁を狙って強くスタートするのが基本なのだ。\n\n## しくみ\nフライなら、捕られた時点で3アウトになる。走者が元の塁で待っていても攻撃は終わるので、捕られなかった場合に備えて早く走るほうが得になる。\n\nゴロでも同じで、守備がアウトを取る前に少しでも先へ進みたい。ただし「何でも走れば点になる」わけではない。\n\n三つ目のアウトがフォースアウト（進塁義務のある走者を塁でアウトにすること）なら、その前に別の走者が本塁を踏んでも得点にならない場合がある。速さだけでなく、どこで3アウト目が成立したかも大事なのだ。\n\n## 今日の試合で見るなら\nツーアウトで髙部瑛斗や矢澤宏太が塁にいたら、打球が飛んだ瞬間のスタートを見るといい。外野の前に落ちる打球なら、一つ先ではなく一気に本塁まで狙う場面もあり得る。"}, "2-12-c": {"meta": {"id": "2-12-c", "title": "ツーアウト満塁が盛り上がるのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-12", "1-09", "2-14"], "sources": ["https://npb.jp/news/detail/20180920_03.html", "https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ツーアウト満塁（2人アウトで、一・二・三塁すべてに走者がいる状態）**は、==次のプレーで0点のまま攻撃終了にも、一気に複数点にもなりうる==。結果の振れ幅が大きいから、緊張感が高いのだ。\n\n## しくみ\nツーアウトでは、守備があと1つアウトを取ればその回は終わる。一方で満塁なら、安打が出れば複数の走者が帰る可能性があり、ホームランなら**4点**入る。==攻撃側は大得点、守備側は無失点終了が、同じ1球の先にある==わけだ。\n\nさらに満塁では、**四球（ボール4つで一塁へ進むこと）**や死球でも、三塁走者が押し出されて1点入る。逆に内野ゴロなら、走者が次の塁へ進まなければならない**フォースプレー（塁を踏めばアウトにできるプレー）**で3つ目のアウトを狙える。==打球だけでなく、投手がストライクを取れるかまで重要になる==のだ。\n\n## 今日の試合で見るなら\nたとえば日本ハムの**清宮幸太郎**がツーアウト満塁で打席に入った場面だ。==安打なら走者が一気に動き、四球でも1点、アウトならその回は終了==。スコアボードの「2 OUT」と満塁の表示を一緒に見ると、なぜ球場が注目する場面なのか分かりやすいのだ。"}, "2-12": {"meta": {"id": "2-12", "title": "ワンナウト、ツーアウトのちがいは？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "children": ["2-12-a", "2-12-b"], "related": ["1-08", "2-10"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nアウトは3つで攻守交代になる。だから同じ「走者三塁」でも、
