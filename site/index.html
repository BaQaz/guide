<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロッテ×日本ハム観戦ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f4f6f6; --ink:#08131a; --sub:#5d6a70; --line:#e2e7e9; --accent:#18917e; --accent-ink:#ffffff;
  --board:#0f1d19; --board-line:#26372f; --board-ink:#e9efe9; --led:#ffd449; --ball:#3fd26a; --strike:#ffd449; --out:#ff5a4f; --lamp-off:#2c3b35;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
header .meta{margin-left:auto;color:var(--sub);font-size:.78rem}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;line-height:1.5;margin:.2em 0 .5em;text-wrap:balance}
h2{font-size:1.2rem;line-height:1.5;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:1.4em 0 .3em}
p{margin:0 0 1.1em}
a{color:var(--accent)}
.lead{color:var(--sub);font-size:.88rem;line-height:1.7}
.eyebrow{font-size:.75rem;color:var(--sub);letter-spacing:.08em;margin:0 0 4px}
.back{display:inline-block;margin-bottom:14px;font-size:.88rem;color:var(--sub);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px}
.section-title{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:30px 0 10px}

/* ガイド切り替え（TOP上部） */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.guide{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);background:var(--bg)}
.guide b{font-size:.98rem;line-height:1.45}
.guide span{font-size:.75rem;color:var(--sub)}
.guide:hover,.q:hover{border-color:var(--accent)}
.guide.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}
.guide.wide span{margin-left:auto}

/* 質問ボタン（横2列） */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.5;font-weight:700}
.q small{font-weight:400;font-size:.72rem;color:var(--sub)}
.q.off{background:var(--surface);color:var(--sub);font-weight:400}
.q .mark{color:var(--accent);font-size:.72rem;font-weight:700}

/* 速報ボード */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.board .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.board .inning{font-family:"Roboto Mono",ui-monospace,monospace;color:var(--led);font-weight:700;font-size:1.05rem}
.board .status{font-size:.78rem;opacity:.8}
.board .upd{margin-left:auto;font-size:.72rem;opacity:.7}
.board a{color:var(--led)}
.ls{overflow-x:auto}
.ls table{border-collapse:collapse;width:100%;font-family:"Roboto Mono",ui-monospace,monospace}
.ls th,.ls td{border-bottom:1px solid var(--board-line);padding:5px 1px;text-align:center;font-size:.9rem}
.ls th{font-weight:500;opacity:.65;font-size:.75rem}
.ls td.team{font-size:.8rem;text-align:left;font-family:"Noto Sans JP",sans-serif;font-weight:700;white-space:nowrap;padding-right:8px}
.ls td.r{color:var(--led);font-weight:700}
.ls td.sum{border-left:1px solid var(--board-line)}
.sit{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lamps{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:.85rem}
.lamps button{all:unset;display:flex;gap:6px;cursor:pointer;padding:2px 0}
.lamps button:focus-visible,.bases button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.lamp{width:15px;height:15px;border-radius:50%;background:var(--lamp-off)}
.lamp.b{background:var(--ball)}.lamp.s{background:var(--strike)}.lamp.o{background:var(--out)}
.bases{position:relative;width:96px;height:78px;justify-self:end}
.bases button{all:unset;position:absolute;width:26px;height:26px;transform:rotate(45deg);border:2px solid var(--board-ink);opacity:.55;cursor:pointer}
.bases button.on{background:var(--led);border-color:var(--led);opacity:1}
.bases .b1{right:6px;top:30px}.bases .b2{left:35px;top:4px}.bases .b3{left:6px;top:30px}
.who{font-size:.82rem;line-height:1.6;opacity:.9;grid-column:1/-1}
.hint{font-size:.72rem;opacity:.65}

/* スタメン */
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-col{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.team-col h4{margin:0;padding:8px 10px;font-size:.85rem;background:var(--surface);display:flex;justify-content:space-between}
.team-col h4 small{font-weight:400;color:var(--sub)}
.team-col ol{list-style:none;margin:0;padding:0}
.team-col li{display:grid;grid-template-columns:1.3em 1.6em 1fr;gap:4px;padding:6px 10px;border-top:1px solid var(--line);font-size:.86rem;line-height:1.5;font-variant-numeric:tabular-nums}
.team-col li .n{color:var(--sub)}
.team-col li .pos{color:var(--sub);font-size:.78rem}
.team-col li a{color:var(--ink);text-decoration:none;font-weight:700}
.team-col li.p{background:var(--surface)}

/* 記事 */
.article h2{margin:2.2em 0 .6em}
.sec-head{display:flex;align-items:flex-start;gap:10px;margin:2.2em 0 .7em}
.sec-head h2{margin:0;flex:1}
.gpt{font:inherit;font-size:.74rem;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:7px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.gpt svg{width:12px;height:12px}
.gpt:hover{color:var(--accent);border-color:var(--accent)}
.gpt.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gpt:focus-visible,.q:focus-visible,.guide:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:.86rem;line-height:1.7;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.article table th,.article table td,.plain th,.plain td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
ul,ol{padding-left:1.3em;margin:0 0 1.1em}
li{margin:.2em 0}
.src{font-size:.78rem;color:var(--sub);word-break:break-all;line-height:1.7}
mark{background:linear-gradient(transparent 55%,#fff176 55%);color:inherit;padding:0 1px}
strong{font-weight:700}
figure{margin:20px 0}figure img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:8px;background:var(--surface)}
figcaption{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:6px}figcaption span{font-size:.72rem}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.btn{font:inherit;font-size:.9rem;border:0;border-radius:999px;padding:9px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin:4px 6px 4px 0}
.btn.sub{background:var(--surface);color:var(--ink)}
@media (max-width:380px){.lineup{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}, {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "check": false}]}, {"id": "1-08", "title": "アウトってどうやって取るの？", "star": true, "check": false, "children": [{"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "check": false}, {"id": "1-08-b", "title": "フライとゴロって？", "check": false}, {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "check": false}]}, {"id": "1-09", "title": "点ってどうやって入るの？", "star": true, "check": false, "children": [{"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "check": false}, {"id": "1-09-b", "title": "打点って？", "check": false}]}]}, {"no": "2", "title": "打つ・投げる・守る（プレーの仕組み）", "items": [{"id": "2-01", "title": "何点入ることが多いの？", "star": false, "check": false, "children": [{"id": "2-01-a", "title": "1点差の試合ってどれくらいある？", "check": false}, {"id": "2-01-b", "title": "大量点が入るのはどんなとき？", "check": false}]}, {"id": "2-02", "title": "Hやヒットって？", "star": true, "check": false, "children": [{"id": "2-02-a", "title": "二塁打・三塁打って？", "check": false}, {"id": "2-02-b", "title": "内野安打って？", "check": false}, {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "check": false}]}, {"id": "2-03", "title": "ホームランって？", "star": true, "check": false, "children": [{"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "check": false}, {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "check": false}, {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "check": false}]}, {"id": "2-04", "title": "エラーって？", "star": false, "check": false, "children": [{"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "check": false}, {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "check": false}]}, {"id": "2-05", "title": "守備って？", "star": false, "check": false, "children": [{"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "check": false}, {"id": "2-05-b", "title": "内野と外野は何が違う？", "check": false}, {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "check": false}, {"id": "2-05-d", "title": "中継プレーって？", "check": false}]}, {"id": "2-06", "title": "ファインプレーって？", "star": false, "check": false, "children": [{"id": "2-06-a", "title": "ゴールデングラブ賞って？", "check": : "7-02-a", "title": "何人入るの？", "check": false}, {"id": "7-02-b", "title": "ホームランラグーンって？", "check": false}]}, {"id": "7-03", "title": "スタジアムの名所、隠れ名所は？🔍", "star": false, "check": true, "children": []}, {"id": "7-04", "title": "スタジアムの特徴は？", "star": true, "check": false, "children": [{"id": "7-04-a", "title": "なぜ海風がすごいの？", "check": false}, {"id": "7-04-b", "title": "風がプレーにどう影響する？", "check": false}]}, {"id": "7-05", "title": "他にどんなスタジアムがあるの？どう違うの？", "star": false, "check": false, "children": [{"id": "7-05-a", "title": "ドームと屋外球場の違いは？", "check": false}, {"id": "7-05-b", "title": "日本ハムの本拠地エスコンフィールドとの違いは？", "check": false}]}, {"id": "7-06", "title": "ご飯はどういうのがあるの？🔍", "star": true, "check": true, "children": [{"id": "7-06-a", "title": "名物メニューは？", "check": false}, {"id": "7-06-b", "title": "選手コラボメニューは？", "check": false}, {"id": "7-06-c", "title": "モバイルオーダーは使える？", "check": false}]}, {"id": "7-07", "title": "いつのタイミングでどんなイベントがあるの？（9/28）🔍", "star": true, "check": true, "children": [{"id": "7-07-a", "title": "開場（16:00）から試合開始までに何がある？", "check": false}, {"id": "7-07-b", "title": "試合中（5回終了後・7回など）は？", "check": false}, {"id": "7-07-c", "title": "試合後は？", "check": false}, {"id": "7-07-d", "title": "今日の「秋の夜空にみんなで叫ぼう！特別招待」って？", "check": false}]}, {"id": "7-08", "title": "どうすると過ごしやすい？", "star": true, "check": false, "children": [{"id": "7-08-a", "title": "夜の海風対策は？（上着・ひざ掛け）", "check": false}, {"id": "7-08-b", "title": "雨の予報のときは？（傘の扱い）🔍", "check": true}]}, {"id": "7-09", "title": "観戦時の注意点は？🔍", "star": true, "check": true, "children": [{"id": "7-09-a", "title": "ファウルボールが飛んできたら？", "check": false}, {"id": "7-09-b", "title": "持ち込めないものは？", "check": false}, {"id": "7-09-c", "title": "再入場はできる？", "check": false}]}, {"id": "7-10", "title": "トイレにすぐ行くには？🔍", "star": true, "check": true, "children": [{"id": "7-10-a", "title": "混むタイミングはいつ？", "check": false}]}, {"id": "7-11", "title": "今日の席（1塁側・内野指定席B）から何が見える？🔍", "star": true, "check": true, "children": [{"id": "7-11-a", "title": "Cゲート（コアラゲート）からの行き方は？", "check": false}, {"id": "7-11-b", "title": "ブルペンやベンチは見える？", "check": false}]}, {"id": "7-12", "title": "帰りの混雑を避けるには？🔍", "star": false, "check": true, "children": []}]}, {"no": "8", "title": "もっと楽しむ（任意）", "items": [{"id": "8-01", "title": "野球をもっと知るには？", "star": false, "check": false, "children": [{"id": "8-01-a", "title": "テレビや配信で観るには？", "check": false}]}, {"id": "8-02", "title": "次はいつ観に行ける？", "star": false, "check": false, "children": [{"id": "8-02-a", "title": "CSや来季のチケットは？🔍", "check": true}]}]}], "articles": {"2-04-a": {"meta": {"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-04", "2-02"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/news/detail/20170425_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nヒットかエラーかを決めるのは、球場の公式記録員だ。審判のセーフ・アウト判定とは別の仕事なのだ。\n\n## しくみ\nまず審判がプレーを判定する。そのあと公式記録員が、「普通に守っても一塁でアウトにできなかった打球」なら安打、「普通ならアウトにできたのに守備のミスで生かした」なら失策、と記録する。\n\n判断が微妙なときは、規則上は打者に有利な記録を与える考え方がある。だから同じ「野手が触って一塁セーフ」でも、ヒットとエラーの両方があり得るのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎の速いゴロを遊撃の山崎剛が横っ飛びで触っただけなら、ヒットになることがある。逆に正面のゆるいゴロをはじいて一塁に投げられなければ、エラーになりやすい。\n\n球場ではプレー直後だけでなく、その後のスコアボードにも注目するといい。HかEかが表示されれば、公式記録員の判断が見えるのだ。"}, "2-04-b": {"meta": {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-04", "2-09-a"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nある。守備側がうまくいかなかったように見えても、野選（野手選択）、暴投、捕逸という別の記録になり、エラーがつかない場合があるのだ。\n\n## しくみ\n野選（野手選択：打者ではなく先の走者をアウトにしようとした結果、打者を一塁に生かすこと）は、送球先の選び方に関係する記録だ。たとえば一塁で打者をアウトにできそうなのに、二塁の走者を狙って両方セーフになれば、安打ではなく野選になる場合がある。\n\n暴投（ワイルドピッチ：捕手が普通には止めにくい投球で走者を進めること）は投手側の記録だ。捕逸（パスボール：普通なら捕れる投球を捕手が処理できず走者を進めること）は捕手側の記録で、どちらも失策とは別扱いなのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンと捕手の佐藤都志也の組み合わせで、走者がいる場面の低い変化球を見てみるといい。ボールが後ろへ抜けて走者が進んだとき、暴投か捕逸かは投球の難しさで分かれる。\n\n内野では山崎剛がゴロを捕ったあと、どの塁へ投げるかにも注目だ。捕る技術だけでなく、アウトを取りやすい場所を瞬時に選ぶのも守備なのだ。"}, "2-04": {"meta": {"id": "2-04", "title": "エラーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-04-a", "2-04-b"], "related": ["2-02", "4-01"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nエラー（失策：普通ならアウトにできた守備で、ミスによって走者を生かしたり進めたりした記録）とは、守備のミスにつく公式記録なのだ。見た目に失敗していても、必ずエラーになるわけではない。\n\n## しくみ\n大事なのは「その野手なら普通の守備で処理できたか」だ。ゴロをはじく、捕れるフライを落とす、アウトにできる送球を大きくそらす、といった場面では失策になることがある。\n\n逆に、強烈な打球に飛びついたが届かなかった、難しい体勢から送球して間に合わなかった、という場面は失策にならないことも多い。公認野球規則でも、判断だけの誤りは原則として失策にしないと定めている。\n\nだから、観客から見て「今のはミスでは？」と思っても、記録はヒットになることがあるのだ。スコアボードの「E」は、守備側の失策数を表している。\n\n## おもしろエピソード\nエラーかヒットかを決めるのは審判ではなく、公式記録員だ。公式記録員は試合を見ながら、安打・失策などの記録を独自に判断する役目を持っている。\n\n## 今日の試合で見るなら\nロッテの遊撃・山崎剛や二塁・小川龍成のところへ、日本ハムの清宮幸太郎が強いゴロを打った場面を見てみるといい。取り切れずに一塁がセーフでも、強烈な打球ならヒット、普通に処理できたと判断されればエラーになり得るのだ。\n\n外野では、海風のあるZOZOマリンで藤原恭大や髙部瑛斗がフライを追う。落球したから即エラー、ではなく、「普通の守備で捕れたか」が基準になるところが見どころだ。"}, "2-05-a": {"meta": {"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "4-01"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備位置には1〜9の番号がある。背番号ではなく、スコアを短く書くための「住所」のような番号なのだ。\n\n## しくみ\n番号は次の順番だ。\n\n- 1＝投手、2＝捕手、3＝一塁手\n- 4＝二塁手、5＝三塁手、6＝遊撃手\n- 7＝左翼手、8＝中堅手、9＝右翼手\n\nたとえば「6-3」なら、遊撃手がゴロを処理して一塁手へ送球し、アウトを取ったという意味になる。\n\n## 今日の試合で見るなら\nロッテの予想守備を番号にすると、アンドレ・ジャクソンが1、佐藤都志也が2、井上広大が3、小川龍成が4、寺地隆成が5、山崎剛が6、西川史礁が7、髙部瑛斗が8、藤原恭大が9だ。\n\n山崎から小川、井上へ渡る併殺が出れば「6-4-3」になる。スコア表示や実況で数字が出ても、誰が動いたかを頭の中でたどれるようになるのだ。"}, "2-05-b": {"meta": {"id": "2-05-b", "title": "内野と外野は何が違う？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n内野（4つの塁に近い範囲）は、ゴロを素早くアウトにする仕事が多い。外野（そのさらに奥の範囲）は、飛んだ打球を広く追い、長打を小さくする仕事が多いのだ。\n\n## しくみ\n内野手は一塁手・二塁手・三塁手・遊撃手の4人だ。打球を捕ってから一塁へ送るまでの時間が短いので、捕球から送球への速さが重要になる。\n\n外野手は左翼手・中堅手・右翼手の3人だ。守る面積が広く、頭上を越されると二塁打や三塁打になりやすい。フライの落下地点を読むことと、進塁を防ぐ返球が大切なのだ。\n\n## 今日の試合で見るなら\nロッテでは小川龍成と山崎剛が内野中央、髙部瑛斗と藤原恭大が外野の中心になる。日本ハムの万波中正が強い打球を放ったら、ゴロなら内野の速い処理、外野を抜く打球なら外野手の追い方と返球を見れば違いがわかりやすい。\n\nZOZOマリンでは風でフライの落下地点が変わることもある。内野と外野では、同じ「捕る」でも準備する距離と時間がかなり違うのだ。"}, "2-05-c": {"meta": {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05-a"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nシフト（打者の特徴に合わせて守る位置を変える作戦）とは、打球が来そうな場所へ先回りする守備なのだ。二塁手や遊撃手は、いつも同じ場所に立つわけではない。\n\n## しくみ\nたとえば引っ張る打球が多い打者なら、その方向を少し厚く守る。逆方向へ流す打球が多い打者なら、そちらへ寄ることもある。\n\n動かすのは左右だけではない。強い打球が多ければ少し深く、バントの可能性があれば前へ出るなど、走者やアウト数でも位置は変わる。2026年の規則改正で、NPBでも投球時に内野手4人が二塁ベースの両側に2人ずつ分かれていなければならなくなった。守備側はその範囲で配置を工夫するのだ。\n\n## 今日の試合で見るなら\n日本ハムの清宮幸太郎や田宮裕涼が打席に入る前、ロッテの二塁・小川龍成と遊撃・山崎剛の位置を見てみるといい。右打者の万波中正のときと比べると、立つ場所が変わるかもしれない。\n\n投球のたびに打球だけを見るのではなく、投げる直前の内野手を見る。数歩の移動にも「ここへ飛ぶ確率が高い」という守備側の読みが表れているのだ。"}, "2-05-d": {"meta": {"id": "2-05-d", "title": "中継プレーって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n中継プレー（遠い場所からの送球を途中の野手が受け、次の塁へつなぐ連携）は、外野から本塁などへ正確に速く返すための仕組みだ。\n\n## しくみ\n外野の深い場所から本塁までを一人で投げると、距離が長くなり、送球がそれやすい。そこで内野手が途中に入り、外野手の送球を受けて本塁や三塁へ投げ直す。\n\n中継に入る野手は、外野手と狙う塁を結ぶ線上に立つ。送球が十分強ければそのまま通し、弱かったり方向を変えたいときは捕って投げる。だから中継役は「ただ間に立つ人」ではないのだ。\n\n## 今日の試合で見るなら\n日本ハムの万波中正が右中間を破る長打を打った場面を想像するとわかりやすい。ロッテの藤原恭大や髙部瑛斗が打球を処理し、小川龍成や山崎剛が中継地点へ走り、最後は本塁の佐藤都志也へつなぐ。\n\nあなたはボールだけでなく、打球が外野へ飛んだ瞬間の内野手も見るといい。誰かが外野方向へ走り出したら、その選手が送球の道を作ろうとしている可能性が高いのだ。"}, "2-05": {"meta": {"id": "2-05", "title": "守備って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-05-a", "2-05-b", "2-05-c", "2-05-d"], "related": ["1-08", "2-06", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備とは、相手の打球や走塁を止めてアウトを取る側の仕事だ。グラウンドには投手と捕手を含めて9人が入り、それぞれ違う範囲と役割を受け持つ。\n\n## しくみ\n投手が投げ、打者が打った瞬間から、守備の9人は「どこに飛んだか」「走者がどこにいるか」「何アウトか」で動きを変える。ゴロなら内野手が捕って一塁へ、フライなら落下地点に近い野手が捕る、というのが基本だ。\n\nでも実際は、ボールを捕る人だけが守備をしているわけではない。ほかの野手も、送球を受ける塁へ入る、悪送球に備えて後ろを守る、中継に入る、といった動きを同時にしている。\n\nつまり守備は9人で行う連携なのだ。テレビでは打球だけを追いがちだが、球場ではボールから離れた選手の動きも見える。それが現地観戦のおもしろさの一つだ。\n\n## おもしろエピソード\nスコアブックでは守備位置を1〜9の数字で表す。たとえば「6-4-3」の併殺なら、遊撃手から二塁手、最後に一塁手へ送ったという意味になる。\n\n数字がわかると、スコアや実況の短い表現だけでプレーの流れを読めるようになるのだ。\n\n## 今日の試合で見るなら\nロッテの予想守備では、遊撃の山崎剛と二塁の小川龍成が内野の中央を守り、中堅の髙部瑛斗や右翼の藤原恭大が外野を受け持つ。日本ハムの水野達稀や清宮幸太郎が打席に入ったら、投球前から彼らの立ち位置を見ておくといい。\n\n打球が飛んだあと、捕った選手だけでなく、ほかの野手が塁や中継地点へ動くところまで追う。そうすると、守備が「一人の好プレー」ではなく、9人の配置と連携でできているのが見えてくるのだ。"}, "2-06-a": {"meta": {"id": "2-06-a", "title": "ゴールデングラブ賞って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/news/detail/20251112_02.html", "https://npb.jp/award/2022/glove.html", "https://npb.jp/bis/players/11215151.html"]}, "body": "## ひとことで\n三井ゴールデン・グラブ賞は、その年に守備で特に高く評価された選手を選ぶ表彰だ。いわば「守備のベストナイン」なのだ。\n\n## しくみ\n受賞者は、新聞社・通信社・テレビ局・ラジオ局のプロ野球担当記者による投票で決まる。投手、捕手、各内野手、外野手が選ばれ、セ・リーグとパ・リーグでそれぞれ表彰される。\n\nだから、単純にエラーが少ない選手を自動で選ぶ賞ではない。守備範囲、肩、捕球、送球などを含めて、記者がその年の守備を評価する賞なのだ。\n\n## おもしろエピソード\nロッテの髙部瑛斗は2022年、パ・リーグ外野手部門で初受賞した。\n\n## 今日の試合で見るなら\n予想どおり髙部が中堅に入ったら、過去の受賞歴を思い出しつつ、打球への一歩目を見てほしい。受賞歴があるから毎回好守になるわけではないが、「守備も見どころの選手」だと分かるのだ。"}, "2-06-b": {"meta": {"id": "2-06-b", "title": "どこを見るとファインプレーに気づける？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\n打球を捕る瞬間だけでなく、「打つ前の位置」と「打った直後の一歩目」を見ると、ファインプレーに気づきやすい。うまい守備ほど派手に見えないこともあるのだ。\n\n## しくみ\n見る順番は、位置取り→一歩目→捕球→送球でいい。外野手なら最短に近い道で落下点へ入れたか、内野手なら捕ったあとすぐ投げられる体勢だったかを見る。\n\nさらに走者がいる場面では、送球先も大事だ。ホームを狙う走者を止めたり、余計な進塁を防いだりする判断も好守なのだ。\n\n## 今日の試合で見るなら\nロッテの髙部瑛斗と藤原恭大に打球が飛んだら、ボールより先に2人の足を見てほしい。打った瞬間に迷わず動き、余裕を持って捕ったなら、その「余裕」自体がうまさの結果かもしれないのだ。"}, "2-06": {"meta": {"id": "2-06", "title": "ファインプレーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-06-a", "2-06-b"], "related": ["2-05", "2-04"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\nファインプレーは、普通ならヒットや進塁になりそうな打球を、守備のうまさでアウトに変えるような好プレーのことだ。派手に飛びつく場面だけがファインプレーではないのだ。\n\n## しくみ\n守備のうまさは、捕った瞬間だけでは決まらない。打球が飛ぶ前の位置取り、打った瞬間の一歩目、落下点までの走り方、捕ってから投げる速さまでが一続きなのだ。\n\nたとえば外野手が余裕を持ってフライを捕ると、簡単に見えることがある。けれど、最初から正しい方向へ走れていたから余裕が生まれたのかもしれない。逆に、飛びついて捕ったからといって、必ずしも最善の守備だったとは限らないのだ。\n\n内野なら、強いゴロに追いつくだけでなく、体勢が崩れても一塁へ正確に送れるかまで見るといい。走者がいるときは、ただアウトを取るだけでなく、次の塁へ進ませない判断も守備の価値になる。\n\n## おもしろエピソード\nロッテの髙部瑛斗は2022年に外野手として三井ゴールデン・グラブ賞を受賞している。賞の名前を知らなくても、守備で評価された選手だと分かれば、打球が飛んだときの見方が変わるのだ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは髙部瑛斗が中堅、藤原恭大が右翼に入る。外野へ打球が上がったら、ボールだけでなく、2人が打った瞬間にどちらへ動いたかを見てほしい。\n\n特にZOZOマリンの外野では、最後の捕球だけを追うより、落下点へ入るまでの動きに注目するとファインプレーに気づきやすいのだ。"}, "2-08-a": {"meta": {"id": "2-08-a", "title": "サインって何を決めてるの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-08", "2-07"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\n捕手のサインは、主に「どの球種を、どこへ投げるか」を投手と共有する合図だ。1球ごとの小さな作戦会議だと思えばいい。\n\n## しくみ\n同じ打者でも、ストライクやボールの数、アウト数、走者の有無、直前に投げた球で狙いは変わる。こうした一連の組み立てを配球（はいきゅう：投げる球の順番や場所の組み立て）という。\n\n捕手が案を出しても、投手が違う球を選びたいことはある。大事なのは、投げる前に2人の考えが一致していることなのだ。\n\n## 今日の試合で見るなら\nロッテの佐藤都志也とジャクソン、日本ハムの田宮裕涼と福島蓮の組み合わせに注目してほしい。同じ打者にストレートを続けるのか、途中で変化球を混ぜるのかを見ると、サインの意味を想像しやすいのだ。"}, "2-08-b": {"meta": {"id": "2-08-b", "title": "盗塁を刺すってどういうこと？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-08", "2-11"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/71075151.html"]}, "body": "## ひとことで\n「盗塁を刺す」は、走者が次の塁を盗もうとしたとき、捕手が送球してアウトにすることだ。捕手の肩だけでなく、投手と内野手も関わる共同作業なのだ。\n\n## しくみ\nたとえば一塁走者が二塁へ走る。捕手は投球を受けたらすぐ持ち替えて二塁へ投げ、内野手がボールを受けて走者にタッチする。\n\n勝負はほんの短い時間で決まる。走者のスタート、投手が本塁へ投げる速さ、捕手の捕球と送球、内野手のタッチが全部つながっているのだ。\n\n記録では、盗塁を試みてアウトになった走者に盗塁刺が記録される。「捕手が刺した」は、その守備側から見た言い方だ。\n\n## 今日の試合で見るなら\n日本ハムの西川遥輝は9月27日終了時点で通算345盗塁だ。途中出場して一塁に出たら、ロッテの佐藤都志也が捕手なら、投球後すぐ二塁方向を見ると盗塁の攻防を追いやすいのだ。"}, "2-08": {"meta": {"id": "2-08", "title": "キャッチャーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-08-a", "2-08-b"], "related": ["2-07", "2-11"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\nキャッチャー（捕手）は、本塁の後ろで投手の球を受ける守備の中心だ。捕るだけでなく、投球の相談、走者への警戒、送球、ワンバウンドの処理まで担当するのだ。\n\n## しくみ\n投手が投げるたび、捕手は球を受ける。だから1試合の守備でボールに触れる回数がとても多く、投手と一緒に打者をどう打ち取るか考える役になる。\n\n投球前には、球種（ストレートや変化球の種類）や狙う場所を投手と共有する。走者がいるときは、盗塁を警戒しながら、ワンバウンドした球を体で止めて進塁を防ぐ仕事もある。\n\nさらに、打球が前へ転がれば素早く拾い、ファウルフライなら防具を着けたまま追う。本塁で走者と勝負する場面では、送球を受けてタッチする。投手の相棒であり、本塁周辺の守備をまとめる選手なのだ。\n\n## おもしろエピソード\n捕手は守備だけでなく打者としても出場する。今日の予想スタメンでは、ロッテの佐藤都志也、日本ハムの田宮裕涼はいずれも左打ちの捕手だ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは佐藤都志也がアンドレ・ジャクソン、日本ハムは田宮裕涼が福島蓮とバッテリーを組む。\n\n投手が投げる前、捕手は毎回ほぼ同じ場所に座っているようで、実は構えや要求が少しずつ変わる。投球だけでなく、その直前の捕手の動きを見ると、1球ごとの作戦が見えやすくなるのだ。"}, "2-11-a": {"meta": {"id": "2-11-a", "title": "牽制球って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-11", "2-08"], "sources": ["https://npb.jp/bis/players/63165155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n牽制球（けんせいきゅう）は、投手が本塁ではなく走者のいる塁へ投げる球だ。走者をアウトにするか、塁から大きく離れにくくする狙いがあるのだ。\n\n## しくみ\n一塁走者は、次の塁へ進みやすくするため少し塁から離れる。離れすぎれば、投手が一塁へ素早く投げ、野手がタッチしてアウトを狙える。\n\nアウトにならなくても意味はある。走者を塁の近くへ戻せれば、盗塁のスタートが遅れやすくなるからだ。牽制は「走るな」と圧力をかける守備でもある。\n\n## 今日の試合で見るなら\n日本ハムの1番予想・水野達稀が一塁に出たら、ロッテ先発のジャクソンを見てほしい。本塁へ投げる前に一塁を見る回数や、実際に牽制を入れるかで、水野の足をどれだけ警戒しているかが見えやすいのだ。"}, "2-11-b": {"meta": {"id": "2-11-b", "title": "誰が走るの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-11", "2-17"], "sources": ["https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html"]}, "body": "## ひとことで\n盗塁するのは足が速い選手が中心だが、それだけでは決まらない。投手の動きを読む力、スタート、成功率、試合の状況まで含めて「走れる選手」になるのだ。\n\n## しくみ\n50メートル走が速くても、投手の動き出しを読めなければ出遅れる。逆に、最初の一歩がうまい選手は、純粋な足の速さ以上に盗塁で強みを出せる。\n\nさらに、相手捕手の送球や点差も関係する。1点が重要な場面では、アウトになる危険と、二塁へ進む価値を比べて走るか決めるのだ。\n\n## 今日の試合で見るなら\n日本ハムでは水野達稀が今季15盗塁。西川遥輝は通算345盗塁で、現役最多だ。\n\n水野が先発で出塁したとき、西川が途中から代走や代打で出て塁に残ったときは、打者だけを見ず一塁走者も見てほしい。投手が投げる直前の一歩に、走る選手の技術が出るのだ。"}, "2-11": {"meta": {"id": "2-11", "title": "盗塁ってなに？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-11-a", "2-11-b"], "related": ["2-08", "1-06"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html"]}, "body": "## ひとことで\n盗塁は、走者が打球を待たずに次の塁を狙って進むプレーだ。成功すればヒットがなくても塁を一つ進めるが、失敗するとアウトになるのだ。\n\n## しくみ\n代表的なのは、一塁走者が投手の投球動作に合わせて走り出し、二塁を狙う形だ。捕手は投球を受けると二塁へ送り、走者がタッチされる前に塁へ着けば成功になる。\n\nだから盗塁は、単純な足の速さだけの勝負ではない。投手がいつ本塁へ投げるかを読むこと、よいスタートを切ること、捕手の送球より先に着くことが必要なのだ。\n\n失敗すれば走者が一人減るので、いつでも走ればいいわけではない。アウト数、点差、打者、相手投手や捕手を見ながら、成功しやすい場面を選ぶ。\n\nまた、走者が進んでも必ず盗塁になるわけではない。守備側が進塁を止める動きをほとんど見せない場合などは、公式記録で盗塁が付かないことがあるのだ。\n\n## おもしろエピソード\n日本ハムの西川遥輝は、9月27日終了時点で通算345盗塁。現役選手では最多で、通算350盗塁まであと5に迫っている。\n\n## 今日の試合で見るなら\n予想スタメンの1番・水野達稀は今季15盗塁。まず初回、水野が出塁したら、打者だけでなく一塁走者にも注目してほしい。\n\n西川が途中出場して塁に出た場面も見逃せない。投手が本塁を向いている間に、西川のリード（塁から離れて取る準備距離）が少しずつ変わるところから、盗塁の駆け引きは始まっているのだ。"}, "2-13-a": {"meta": {"id": "2-13-a", "title": "打者有利・投手有利のカウントって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-13", "1-07-b"], "sources": ["https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/43745159.html"]}, "body": "## ひとことで\n一般に、ボールが先行すると打者有利、ストライクが先行すると投手有利なのだ。次の失敗で四球になるのか、三振になるのかで、余裕のある側が変わる。\n\n## しくみ\n3ボール1ストライクなら、投手はあと1球ボールを投げると四球になる。打者は甘い球を待ちやすいので、打者有利と考えやすい。\n\n反対に0ボール2ストライクなら、打者は次のストライクで三振だ。投手はストライクゾーンぎりぎりや、そこから外れる変化球も使いやすい。\n\nただし有利不利は目安だ。強打者なら投手が慎重になるし、走者や点差でも配球は変わる。\n\n## 今日の試合で見るなら\nジャクソンが山口航輝に3ボール1ストライクとしたら、山口が「打てる球だけ」に絞る場面になりやすい。逆に福島蓮が0ボール2ストライクまで追い込んだら、次にどこへ外してくるかを見ると、投手有利の意味が見えやすいのだ。"}, "2-13-b": {"meta": {"id": "2-13-b", "title": "エンドランって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-13", "2-11"], "sources": ["https://npb.jp/news/detail/20181023_02.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\nエンドラン（ヒットエンドラン）は、投手が投げるのに合わせて走者が次の塁へ走り、打者もその球を打ちにいく作戦だ。走るだけの盗塁とは違い、打者と走者がセットで動く。\n\n## しくみ\n一塁走者が先に走ると、一・二塁間を守る野手が動きやすい。そこへ打球を転がせれば、走者が一気に三塁まで進めることもある。\n\nただし打者は、普段なら見送るような球でも打たなければならない場合がある。空振りすれば走者は盗塁と同じ形になり、フライを捕られると戻れず併殺になる危険もあるのだ。\n\n## 今日の試合で見るなら\n日本ハムの1番・水野達稀が一塁に出て、2番・田宮裕涼の打席で水野が投球と同時に走ったら注目だ。田宮まで強く振りにいけば、単独の盗塁ではなくエンドランの可能性が見えてくる。"}, "2-13": {"meta": {"id": "2-13", "title": "ストライクやボールの数で何が変わるの？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-13-a", "2-13-b"], "related": ["1-07", "2-14"], "sources": ["https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\nカウント（その打席のボールとストライクの数）が変わると、打者と投手が「次の1球で何を避けたいか」が変わるのだ。3ボールなら投手は四球を避けたくなり、2ストライクなら打者は三振を避けたくなる。\n\n## しくみ\n打者は4ボールで四球（一塁へ進めること）、3ストライクで三振になる。だから同じ1球でも、0ボール0ストライクと3ボール2ストライクでは重みが違うのだ。\n\nたとえば3ボール0ストライクなら、投手は次をボールにすると四球になる。打者は無理に振らず、甘い球だけ待つこともできる。逆に0ボール2ストライクなら、打者は次のストライクで終わるので、きわどい球にも対応しやすくなる。\n\nただし「このカウントなら必ず直球」のような決まりはない。捕手と投手は、打者の得意不得意、走者、点差まで合わせて球種とコースを考える。カウントは、作戦の選択肢がどちらに多いかを見るための信号だと思えばよい。\n\n## おもしろエピソード\n投手が2ストライクまで追い込んだあと、すぐ勝負せずボール球を混ぜることがある。打者が三振を避けて振りやすくなるので、ストライクから外れる変化球で空振りを狙えるからだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは今季、四球が55ある。日本ハム打線が3ボールまで粘れた打席では、次の1球が甘くなるか、それでも厳しいコースを突くかを見ると面白い。\n\n反対に日本ハム先発の福島蓮が0ボール2ストライクまで先に追い込んだら、ロッテの山口航輝らがどこまできわどい球を見送れるかに注目だ。"}, "2-14-a": {"meta": {"id": "2-14-a", "title": "わざと歩かせる申告敬遠って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-14", "2-14-b"], "sources": ["https://npb.jp/news/detail/20180205_02.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n申告敬遠は、守備側の監督が「この打者を四球にする」と球審へ伝え、投手が4球投げなくても打者を一塁へ進ませる方法だ。強打者との勝負を避けたい場面で使われる。\n\n## しくみ\nNPBでは2018年から、故意四球（わざと与える四球）を申告で成立させられる。打席の途中から申告することもでき、従来どおり実際に球を投げて敬遠する方法も残っている。\n\n一塁が空いていれば、その塁を使って強打者を避け、次の打者と勝負する狙いがある。ただし走者を1人増やすので、次の打者に打たれれば失点が大きくなる。\n\n## 今日の試合で見るなら\n終盤にロッテの山口航輝や日本ハムの清宮幸太郎が、二塁または三塁に走者を置いて打席へ入った場面に注目だ。一塁が空いていれば、相手ベンチが申告敬遠を選ぶ可能性がある。"}, "2-14-b": {"meta": {"id": "2-14-b", "title": "押し出しって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-14", "1-06-b"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/91895138.html"]}, "body": "## ひとことで\n押し出しは、満塁で四球や死球などによって打者が一塁へ進み、三塁走者が押し出されるように本塁へ進んで1点入ることだ。打球が飛ばなくても得点になる。\n\n## しくみ\n満塁では一塁、二塁、三塁が全部埋まっている。打者に一塁が与えられると、一塁走者は二塁へ、二塁走者は三塁へ、三塁走者は本塁へ進まなければならない。\n\nこのように次の塁へ進む義務がある状態をフォース（押し出されて進む状態）という。四球だけでなく、死球でも同じように1点が入る。\n\n## 今日の試合で見るなら\nジャクソンが満塁で3ボールまで来たら、次の1球はそのまま1点につながりうる。反対に福島蓮が満塁で山口航輝と勝負する場面でも同じだ。満塁では「ボール球を見送ること」自体が得点になる場合があるのだ。"}, "2-14": {"meta": {"id": "2-14", "title": "四球（フォアボール）・死球（デッドボール）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-14-a", "2-14-b"], "related": ["1-07", "2-13"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/21625150.html"]}, "body": "## ひとことで\n四球（フォアボール）はボールが4つになって一塁へ進むこと、死球（デッドボール）は投球が打者の体などに当たり、規則上認められて一塁へ進むことだ。どちらもヒットを打たなくても走者になれる。\n\n## しくみ\n四球は、投手がストライクゾーンを外す「ボール」を4つ重ねると成立する。打者は一塁まで安全に進めるので、出塁という意味ではヒットと同じく攻撃のきっかけになるのだ。\n\n死球は、投球が打者の体や着衣に当たったときに宣告される。ただし、ストライクの球に当たった場合など、単に体に触れれば必ず死球になるわけではない。\n\n四球も死球も、公式記録では通常の「打数」には入らない。だから打率を下げずに出塁できる。一方、投手側から見ると、安打を打たれていなくても走者を増やしてしまう点が重い。\n\n## おもしろエピソード\n死球のときに審判が両手を上げてプレーを止めるのは、ボールデッド（いったんプレーが止まる状態）になるからだ。「デッドボール」という呼び名は、日本では死球そのものを指す言葉として定着している。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは今季55四球。日本ハム打線がボール球を見極めて四球を選べるかは、走者をためるうえで大事だ。\n\nロッテの西川史礁は今季11死球。内角の球が体の近くへ来たとき、避けたのか、当たったのか、その後に球審が一塁を示すかを見ると死球の仕組みがわかりやすい。"}, "2-15-a": {"meta": {"id": "2-15-a", "title": "送りバントとスクイズの違いは？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-15", "1-09"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/63165150.html"]}, "body": "## ひとことで\n送りバントは走者を次の塁へ進めるためのバント、スクイズは三塁走者を本塁へ返して1点を取るためのバントだ。どちらも強打より「進塁」を優先する。\n\n## しくみ\n無死一塁から一塁走者を二塁へ進めるのが、典型的な送りバントだ。打者自身はアウトになっても、次の打者がヒット1本で得点しやすい形を作る。\n\nスクイズは三塁に走者がいる場面で使う。打者がバントし、その間に三塁走者が本塁を狙うので、成功すれば安打なしでも1点を取りにいける。\n\nただし空振りや小フライになれば、三塁走者までアウトになる危険がある。守備側も三塁走者の動きを強く警戒する作戦なのだ。\n\n## 今日の試合で見るなら\n接戦の終盤、日本ハムが三塁に走者を置き、山縣秀のようにバントを使える打者が打席なら注目だ。バットを寝かせ、三塁走者も投球に合わせて動けば、スクイズの可能性が見えてくる。"}, "2-15": {"meta": {"id": "2-15", "title": "バントって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-15-a"], "related": ["2-10", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/63165150.html"]}, "body": "## ひとことで\nバントは、バットを大きく振らず、ボールに当てて近くへ転がす打ち方だ。自分がヒットになることより、走者を次の塁へ進める目的で使われることが多い。\n\n## しくみ\n普通の打撃は強く遠くへ飛ばすことを狙う。バントでは、バットを構えて球の勢いを弱め、投手や一塁手、三塁手の前へ転がす。\n\n代表的なのが犠牲バント（自分のアウトと引き換えに走者を進めるバント）だ。無死一塁なら、打者が一塁でアウトになる間に走者を二塁へ進め、1死二塁にするのが典型になる。\n\n成功すれば得点圏（二塁・三塁）へ走者を送りやすいが、アウトを1つ渡す作戦でもある。点差、回、次の打者の強さによって、使う価値は変わるのだ。\n\nまた2ストライク後のバントがファウルになると、通常のファウルと違って三振になる。追い込まれてからのバントは、それだけ失敗の重みが大きい。\n\n## おもしろエピソード\n公式記録では、走者を進める目的のバントが条件を満たすと犠打として記録され、打数には入らない。つまり「自分の打率を下げずに、アウト1つで仲間を進めた」と記録される場合がある。\n\n## 今日の試合で見るなら\n日本ハムの山縣秀は今季5犠打。終盤、山縣の前に走者がいて接戦なら、構えを変えてバントするかに注目だ。\n\n一方、ロッテの山口航輝のような長打力のある打者では、同じ無死一塁でも強く打たせる選択が十分ある。誰が打席にいるかで作戦が変わるのが、バントを見る面白さなのだ。"}, "2-16-a": {"meta": {"id": "2-16-a", "title": "なぜパ・リーグだけ？（セ・リーグも導入予定）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-16"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html", "https://npb.jp/news/detail/20260925_02.html"]}, "body": "## ひとことで\n2026年までは、パ・リーグがDH制、セ・リーグが投手も打席に立つ9人制なのだ。だがセ・リーグは2027年シーズンからDH制を採用すると正式決定している。\n\n## しくみ\nNPBによると、パ・リーグは1975年にDH制を採用した。一方のセ・リーグは、野球発祥から続く9人野球の伝統や、パ・リーグとは違う野球の価値を重視して、長く9人制を続けてきた。\n\nそのセ・リーグも2025年8月、2027年からのDH制採用を決定した。公式説明では、高校・大学でDH導入が進んだことや、国際的な流れ、セ・パのルール統一などが背景として挙げられている。2026年は導入準備のための猶予期間という位置づけだ。\n\n## 今日の試合で見るなら\n今日はロッテも日本ハムもパ・リーグなので、両チームがDHを使える。予想スタメンではロッテが山口航輝、日本ハムが清宮幸太郎をDHに置く。2026年のパ・リーグでは見慣れた形だが、来季からはセ・リーグの公式戦でも同じ仕組みが基本になるのだ。"}, "2-16": {"meta": {"id": "2-16", "title": "指名打者（DH）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-16-a"], "related": ["2-07", "4-02"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n指名打者（DH：投手の代わりに打つ専門の打者）は、守備では投手が投げ、攻撃では別の打者がその打順に入る制度だ。投手が打席に立たなくてもよくなる。\n\n## しくみ\n野球は基本的に、守備につく9人が攻撃でも打席に入る。ただしDH制では例外があり、投手の代わりに1人の打者を打線へ置ける。\n\nたとえば先発投手が9番目の打者になる代わりに、長打力のある野手をDHとして使える。その選手は打席には立つが、DHとして出ている間は守備位置を持たない。\n\nこの制度の大きな意味は、投手が投球に集中でき、打線には打撃を期待できる選手を1人多く置けることだ。ベンチは「守備には出さないが、打撃を生かしたい選手」を起用しやすくなる。\n\nDHは「代打」とは違う。代打は途中で別の打者に交代する方法だが、DHは試合開始時から打順の一つとして置ける制度なのだ。\n\n## おもしろエピソード\nパ・リーグでは1975年からDH制が使われてきた。長くセ・リーグとの大きなルール差だったが、セ・リーグも2027年シーズンからDH制を採用することが正式決定している。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの山口航輝が2番DH、日本ハムの清宮幸太郎が3番DHだ。2人とも長打力を期待される打者で、山口は32本塁打、清宮は23本塁打を記録している。\n\n守備の回に2人の姿がグラウンドになくても、交代したわけではない。攻撃になるとまた打順どおりに打席へ来る。そこがDHを見分けるいちばん簡単なポイントだ。"}, "2-17-a": {"meta": {"id": "2-17-a", "title": "一度交代した選手は戻れる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-17"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\nNPBでは、一度ほかの選手と交代して試合から退いた選手は、その試合には戻れないのだ。\n\n## しくみ\nたとえば山口航輝に代走を送れば、山口はそこで試合から退く。後で「やはり山口に打たせたい」と思っても、再び打席へ戻すことはできない。\n\nだから代打や代走は、強いカードを使う代わりに元の選手を手放す決断でもある。終盤に使われることが多いのは、この制約があるからなのだ。\n\n## 今日の試合で見るなら\nロッテが終盤に一塁走者の山口航輝へ池田来翔を代走で送ったら、その後の山口の打席はもうない。試合が延長になりそうな場面なら、サブロー監督がいつ交代を切るかも見どころになるのだ。"}, "2-17": {"meta": {"id": "2-17", "title": "代打・代走・守備固めって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-17-a"], "related": ["2-09", "2-05"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n代打（ピンチヒッター：打つ人の交代）、代走（ピンチランナー：走る人の交代）、守備固め（守備の得意な選手への交代）は、終盤の勝負を動かす交代策なのだ。\n\n## しくみ\n代打は、その打席だけ別の打者に任せたいときに使う。長打がほしい、右投手に左打者を当てたい、といった理由で選ばれることが多い。代打が打席に入ると、元の選手は試合から退くことになる。\n\n代走は、塁に出た走者を足の速い選手へ替える作戦だ。一つ先の塁へ進める確率を上げたい終盤で使われやすい。盗塁だけでなく、外野への安打で一塁から三塁へ進むような走塁も狙いなのだ。\n\n守備固めは、リードしている終盤に守備力を上げる交代だ。たとえば打撃型の選手を下げて、守備範囲の広い外野手や内野手を入れる。1点を取りにいく交代と、1点を守る交代は、目的が正反対というわけだ。\n\n交代はベンチの人数を使う。だから監督は、今の1点だけでなく、延長まで続く可能性も考える。早く切り札を使いすぎると、後で必要な場面に残っていないこともあるのだ。\n\n## おもしろエピソード\n同じ選手が、代走で出たあと守備に就くこともある。交代は一つの役割だけで終わらず、その後の守備位置まで含めて組み立てられているのだ。\n\n## 今日の試合で見るなら\nロッテは終盤の代打候補にソトや上田希由翔、代走候補に池田来翔がいる。接戦の7回以降、スタメンの打順で代打が告げられたら、「ここで1点を取りにいく」と考えると流れが見えやすい。\n\n反対にロッテがリードしていれば、松川虎生が捕手に入り、佐藤都志也が別の守備位置へ回るような動きにも注目だ。スコアだけでなく、誰がベンチから出てくるかを見ると、監督の狙いが読めるのだ。"}, "2-18-a": {"meta": {"id": "2-18-a", "title": "何人いて、誰が何を見てる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-18"], "sources": ["https://npb.jp/umpires/", "https://npb.jp/umpires/2026/roster_umpire.html"]}, "body": "## ひとことで\nNPBの公式戦では、基本は球審と一塁・二塁・三塁の塁審を合わせた4人で判定するのだ。\n\n## しくみ\n球審は本塁の後ろに立ち、投球のストライク・ボール、本塁でのセーフ・アウトなどを見る。三つの塁審は担当する塁の判定に加え、打球がフェアかファウルか、外野への大きな打球なども分担する。\n\n「一塁審は一塁だけ」というわけではない。打球と走者に合わせて位置を変え、別の審判と角度を分けて見るのだ。\n\n## 今日の試合で見るなら\n藤原恭大や万波中正のように足や肩が目立つ選手のプレーでは、一塁や三塁で際どい判定が出やすい。打球だけでなく、塁審がどこまで移動して判定しているかを見ると、仕事の分担が分かりやすいのだ。"}, "2-18-b": {"meta": {"id": "2-18-b", "title": "ボークって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "related": ["2-18", "2-11-a"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\nボークは、走者がいるときに投手がしてはいけない投球動作をした反則だ。原則として走者には一つ先の塁が与えられる。\n\n## しくみ\n投手は投球動作を始めたら、途中で不自然に止めたり、投げるふりから急に別の動作へ変えたりできない。走者をだます動きに制限を設け、スタートの条件を公平にするためなのだ。\n\n2026年の規則改正でも、投球に関連する動作を始めて両手を体の前で合わせた後は、投球以外へ変更できないことが明確にされた。違反すればボークになる。\n\n## 今日の試合で見るなら\n日本ハムに走者が出たとき、ロッテ先発のアンドレ・ジャクソンは打者だけでなく走者も警戒する。セットポジション（走者がいるときによく使う構え）からの動きが急に止まり、審判が両手を広げて試合を止めたら、ボークの可能性があるのだ。"}, "2-18": {"meta": {"id": "2-18", "title": "審判って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "children": ["2-18-a", "2-18-b"], "related": ["2-03-c", "1-08"], "sources": ["https://npb.jp/umpires/", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n審判は、ストライクやアウトだけでなく、走塁、フェアかファウルか、反則まで見て試合を進める人たちなのだ。\n\n## しくみ\nいちばん目につくのは、本塁の後ろにいる球審（きゅうしん：ホーム付近を担当する審判）だ。投球がストライクかボールか、打者が振ったか、ホームで走者がセーフかアウトかなどを判定する。\n\nほかの審判は一塁、二塁、三塁の近くで、走者が先に塁へ着いたか、野手がタッチしたか、打球がフェアかファウルかを分担して見る。打球や走者の位置に合わせて大きく移動するので、審判もかなり走っているのだ。\n\n判定には、人がその場で決めるものと、映像で確認できるものがある。NPBでは監督がリクエスト（映像による判定確認）を求められる場面もあるが、すべての判定が映像確認の対象ではない。\n\n審判はルール違反も見る。投手のボーク（走者がいるときの不正な投球動作）や、危険なプレーなどを見つければ、試合を止めて処置するのだ。\n\n## おもしろエピソード\n審判は同じ場所に立ち続けるわけではない。外野へ大きな打球が飛べば、より見やすい角度へ動く。テレビでは映りにくいが、球場では審判の移動もよく見えるのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは落差の大きいチェンジアップを使う。低い球がストライクかボールか際どい場面では、まず球審の右手や声を見ると判定が分かる。\n\n清宮幸太郎の通算100本塁打がかかる大飛球がポール際へ飛んだら、塁審の判定にも注目だ。ホームランかファウルかで試合の意味が大きく変わる場面なのだ。"}, "4-01-a": {"meta": {"id": "4-01-a", "title": "R・H・Eって？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-01", "1-09"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nRは得点、Hは安打（ヒット）、Eは失策（守備のミスとして記録されたもの）だ。3つとも、そのチームの試合全体の合計を見る数字なのだ。\n\n## しくみ\nRはRuns、HはHits、EはErrorsの頭文字だ。たとえば「R 3、H 8、E 1」なら、3点、8安打、1失策という意味になる。\n\nHが多いチームが必ず勝つわけではない。ヒットを何本打っても、走者がホームまで帰らなければRは増えないからだ。Eも、ミスがそのまま1点になる数字ではない。\n\n## 今日の試合で見るなら\nロッテと日本ハムのHが増えたのにRが動かない場面があれば、「走者は出たけれど点にはならなかった」と読める。逆に少ないHでRが増えれば、四球や長打をうまく得点につなげた可能性があるのだ。"}, "4-01-b": {"meta": {"id": "4-01-b", "title": "打率や球速の表示の見方は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-01", "4-03", "2-07-b"], "sources": ["https://npb.jp/bis/2026/stats/bat_p.html", "https://npb.jp/bis/2026/stats/pit_p.html"]}, "body": "## ひとことで\n「.291」は打率2割9分1厘、「151 km/h」のような表示はその1球の速さだ。打率は打者の積み重ね、球速は投手の1球ごとの数字と考えると分かりやすい。\n\n## しくみ\n打率は、打数（打率計算の対象になる打席）に対して何本ヒットを打ったかの割合だ。.300なら、おおまかには10打数で3安打のペースになる。\n\n球速は1球ごとに変わる。同じ投手でも、速い直球の次に遅い変化球を投げれば、打者はタイミングを合わせにくくなる。最高球速だけでなく、前の球との速さの差を見ると投球の狙いが見えやすいのだ。\n\n## 今日の試合で見るなら\n添付の予想スタメン表では、ロッテの西川史礁が打率.291、日本ハムの水野達稀が.285だ。まずは「3割にどれくらい近いか」と見るとよい。\n\nジャクソンは力強い直球とチェンジアップ、福島蓮は直球とフォークが持ち味だ。ビジョンに球速が出たら、速いか遅いかだけでなく、球種との組み合わせを見ると面白いのだ。"}, "4-01-c": {"meta": {"id": "4-01-c", "title": "ビジョンに出るそのほかの表示は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-01", "4-02"], "sources": ["https://www.marines.co.jp/stadium/application/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nビジョンは点数だけでなく、選手紹介や球場の情報を見る画面でもある。ZOZOマリンでは風速も自動表示されるので、海風まで「数字で見る」ことができるのだ。\n\n## しくみ\nZOZOマリンにはメイン、レフト、ライト、ネット裏のサブスクリーン、リボンビジョンがある。全部を追う必要はない。試合中はスコア、選手名、風の情報など、いま必要なものから見れば十分だ。\n\n球場公式では、上空と地上の風速情報を自動表示すると案内している。フライが上がったときに風速を見れば、守る選手がなぜ難しそうに追っているのか理解しやすい。\n\n## 今日の試合で見るなら\n公式イベント案内では、17:20ごろに「MARINES ROSTER」としてロッテのベンチ入り全選手を紹介する予定だ。17:30ごろのWarm Up Showでは、選手のプロフィール紹介も予定されている。\n\n試合が始まったら、強い海風の日は風速表示にも注目するとよい。山口航輝や清宮幸太郎の大きな打球が上がったとき、数字と打球の動きを一緒に見ると球場らしさが分かるのだ。"}, "4-01": {"meta": {"id": "4-01", "title": "スコアボードの見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "children": ["4-01-a", "4-01-b", "4-01-c"], "related": ["4-02", "1-07"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.marines.co.jp/stadium/application/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nスコアボードは、試合の「いま」をまとめた一覧表なのだ。まず左右に並ぶ1〜9回の得点と、右端の合計得点を見れば十分だ。\n\n## しくみ\n野球では、1回ごとの得点を横に足していく。上の段が先攻、下の段が後攻だ。今日なら日本ハムが上、ロッテが下になる。\n\nたとえば「1回表」に日本ハムが2点取れば、日本ハムの「1」の欄に2が入る。次の「1回裏」はロッテの攻撃だ。試合の途中で流れが分からなくなったら、右端の合計得点を先に見ると追いつきやすい。\n\n右側にはR・H・Eのようなまとめの数字も出る。Rは得点、Hは安打（ヒット）、Eは失策（守備のミスとして記録されたもの）だ。詳しくは「R・H・Eって？」を見るとよい。\n\nZOZOマリンでは、スコアボードのほかに複数のスクリーンやリボンビジョンがあり、風速計の情報も自動表示される。海風の強い球場なので、点数だけでなく風の数字も試合を見る手がかりになるのだ。\n\n## おもしろエピソード\n球場の公式施設案内では、メインスクリーンのほか、レフト・ライト、ネット裏のサブスクリーンまで案内されている。どこを見ればよいか迷ったら、まず大きなスコア表示に戻ればいいというわけだ。\n\n## 今日の試合で見るなら\n18:00開始のロッテ対日本ハムは、日本ハムが先攻、ロッテが後攻だ。最初は「1回表」の日本ハム、その次に「1回裏」のロッテと進む。\n\n予告先発はロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。試合中に話についていけなくなったら、合計得点、いま何回か、アウト数の順で確認すると状況を取り戻しやすいのだ。"}, "4-02-a": {"meta": {"id": "4-02-a", "title": "打順って？1番と4番は何が違う？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-02", "4-03"], "sources": ["https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\n打順は、9人が打つ順番だ。1番は試合で最も早く打席が回り、4番は前の打者が出塁した場面で回りやすいが、役割はチームごとに違うのだ。\n\n## しくみ\n1番は打席数が多くなりやすいので、出塁できる打者や足のある打者が置かれることが多い。4番は走者を返す長打力のある打者が入ることが多い。\n\nただし、これは決まりではない。最近は強打者を2番や3番に置き、少しでも多く打席を回す考え方もある。だから「4番＝いちばん強い」とだけ覚えると、実際の打線を読み違えることがあるのだ。\n\n## 今日の試合で見るなら\n予想ではロッテの1番が西川史礁、4番が佐藤都志也だ。一方、32本塁打の山口航輝は2番に入る。\n\n日本ハムは1番が水野達稀、3番に23本塁打の清宮幸太郎、4番に野村佑希の予想だ。上位4人をひとかたまりで見ると、どこで走者を出し、どこで返したい打線なのか見えやすいのだ。"}, "4-02-b": {"meta": {"id": "4-02-b", "title": "守備位置の表記（遊・中・指など）って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-02", "2-07"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/allstar/2026/fanballot.html"]}, "body": "## ひとことで\n守備位置は漢字1文字で短く書かれることが多い。「遊」は遊撃手（ショート）、「中」は中堅手（センター）、「指」は指名打者（DH）だ。\n\n## しくみ\n主な表記は、投＝投手、捕＝捕手、一＝一塁手、二＝二塁手、三＝三塁手、遊＝遊撃手、左＝左翼手、中＝中堅手、右＝右翼手だ。外野は左・中・右の3人に分かれる。\n\n「指」だけは守備位置ではない。指名打者（DH：投手の代わりに打つ専門の打者）を示す表記だ。パ・リーグでは、この枠を使って打線を組む。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの山口航輝が「指」、日本ハムの清宮幸太郎も「指」だ。2人とも打撃に集中する役になる。\n\n「遊」は日本ハムの水野達稀、「中」はロッテの髙部瑛斗と日本ハムの矢澤宏太の予想だ。略字が読めると、打者だけでなく守備の配置まで一気に見えるようになるのだ。"}, "4-02": {"meta": {"id": "4-02", "title": "スタメン表の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "children": ["4-02-a", "4-02-b"], "related": ["4-01", "5-07"], "sources": ["https://npb.jp/bis/2026/stats/bat_p.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nスタメン表は「誰が、何番目に打ち、どこを守るか」を並べた表だ。最初は打順、名前、守備位置の3つだけ読めれば観戦には十分なのだ。\n\n## しくみ\n見る順番は単純だ。\n\n- まず「1〜9」の打順を見る\n- 次に選手名を見る\n- かっこの「左翼」「遊撃」「指名」などで守る場所を見る\n- 余裕があれば打率や本塁打を見る\n\n添付の予想スタメン表なら、ロッテは1番・西川史礁（左翼）、2番・山口航輝（指名打者）、3番・藤原恭大（右翼）と続く。日本ハムは1番・水野達稀（遊撃）、2番・田宮裕涼（捕手）、3番・清宮幸太郎（指名打者）という予想だ。\n\n「指名打者」は守備につかず、打撃を担当する選手だ。今日の予想ではロッテの山口、日本ハムの清宮がここに入っている。\n\nこの表はあくまで予想で、正式なスタメン発表で入れ替わることがある。予想と実際の違いも、監督がどこを変えたかを見る材料になるのだ。\n\n## おもしろエピソード\n4番が必ずチーム最多本塁打という決まりはない。今日の予想では、ロッテで32本塁打の山口が2番、17本塁打の佐藤都志也が4番だ。打順は「強い順」ではなく、どう得点につなげるかで組まれるというわけだ。\n\n## 今日の試合で見るなら\nまず両チームの1〜4番だけ覚えるとよい。ロッテは西川史礁、山口、藤原、佐藤。日本ハムは水野、田宮、清宮、野村佑希の予想だ。\n\n打席に入った選手の名前が分からなくなったら、スタメン表の打順に戻れば次の打者も予想できる。守備位置の略字が気になったら「守備位置の表記って？」につなげればいいのだ。"}, "4-03-a": {"meta": {"id": "4-03-a", "title": "どれくらいならすごい？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-03"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/bat_p.html", "https://baseball.yahoo.co.jp/npb/stats/batter?gameKindId=2&type=ops"]}, "body": "## ひとことで\n年によって違うけれど、2026年のパ・リーグなら打率.300、30本塁打、100打点、OPS.900あたりは「リーグ上位級」と考えると分かりやすいのだ。\n\n## しくみ\n9月27日時点で、打率.300以上は4人、30本塁打以上は4人、100打点以上は2人、OPS.900以上は4人しかいない。だから、この線を超えていればかなり目立つ数字だと分かる。\n\nただし、毎年同じ基準ではない。投手が強い年は打撃成績が下がりやすく、逆もある。数字は「その年のリーグ内で比べる」のが基本なのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は32本塁打で、この目安ならすでに上位級だ。西川史礁の打率.292も.300に近い。数字を見たら、まず「リーグ全体でどの辺か」を考えると意味がつかみやすいのだ。"}, "4-03": {"meta": {"id": "4-03", "title": "打率・本塁打・打点・OPSって？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "children": ["4-03-a"], "related": ["4-01-b", "4-05"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/bat_p.html", "https://baseball.yahoo.co.jp/npb/stats/batter?gameKindId=2&type=ops"]}, "body": "## ひとことで\n打率は「ヒットを打つ割合」、本塁打はホームランの数、打点は打撃で生んだ得点の数だ。OPSは「出塁する力」と「長打を打つ力」を足して見る数字なのだ。\n\n## しくみ\n打率は、安打（ヒット）を打数で割った数字だ。.300なら「打数の約3割でヒット」という意味になる。四球や犠打などは打数に入らないため、単純に全打席の3割という意味ではない。\n\n本塁打は、そのままホームランを打った本数だ。打点は、打者の打撃によって走者をホームへ返した数を表す。たとえば満塁ホームランなら、一度に4打点がつく。\n\nOPS（オーピーエス）は、出塁率（ヒットや四球などで塁に出る割合）と長打率（1打数あたり、どれだけ多く塁を稼いだか）を足した数字だ。出塁率が高い選手と、二塁打や本塁打を多く打つ選手の両方を評価しやすい。\n\n4つの数字は役割が違う。打率が高くても本塁打は少ない選手がいるし、本塁打が多くても打率はそれほど高くない選手もいる。1つの数字だけで「打者の強さ全部」を決めるものではないのだ。\n\n## おもしろエピソード\n2026年9月27日時点のパ・リーグでは、打率1位は日本ハムのレイエスで.313、本塁打と打点の1位はソフトバンクの栗原陵矢で39本・117打点だ。OPS1位は近藤健介で.993。1位の顔ぶれが違うのは、数字ごとに測っている力が違うからだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は32本塁打、西川史礁は打率.292、日本ハムの清宮幸太郎は23本塁打だ。打席に入ったら、名前の横に出る数字を1つだけ見るのではなく、「当てる力なのか、長打なのか」と分けて見ると分かりやすい。\n\n山口が大きな当たりを打てば本塁打の数字に注目し、西川が出塁したら打率や出塁の力を思い出す。数字がプレーの特徴と結びつくと、スコアボードが急に読みやすくなるのだ。"}, "4-04": {"meta": {"id": "4-04", "title": "防御率・奪三振って？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["4-03", "4-05"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/pl/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n防御率は「9回投げたとすると、自分の責任で何点取られるペースか」を表す数字だ。奪三振は、投手が三振で取ったアウトの数なのだ。\n\n## しくみ\n防御率は、自責点（投手の責任として記録される失点）×9を投球回で割って出す。数字は小さいほどよい。防御率2.00なら、同じペースで9回投げたとき自責点が約2点という意味だ。\n\nここでいう自責点は、すべての失点と同じではない。守備の失策（エラー）が大きく関係した失点などは、投手の自責点にならないことがある。だから「失点した数」と「防御率に入る点」は一致しない場合があるのだ。\n\n奪三振は、打者を三振にした回数だ。三振なら打球が飛ばないので、守備のミスや風の影響を受けにくい。一方で、三振が少なくてもゴロやフライでアウトを重ねる投手はいる。\n\n防御率と奪三振は、見る角度が違う。防御率は「どれくらい点を防いだか」、奪三振は「どれくらい三振でアウトを取ったか」を見る数字だ。\n\n## おもしろエピソード\n2026年9月27日時点のパ・リーグでは、防御率1位は西武の平良海馬で1.36、奪三振1位は楽天の荘司康誠で163だ。同じ投手部門でも1位が違うので、投手の強みは1つの数字だけでは決まらないと分かる。\n\n## 今日の試合で見るなら\n予告先発はロッテのアンドレ・ジャクソンが防御率3.44、日本ハムの福島蓮が3.35だ。数字だけなら近いが、今日何点取られるかを予言する数字ではない。\n\n試合が始まったら、三振を取るたびに「K」として数えてみるとよい。三振が多いのか、打たせてアウトを取るのかを見ると、同じ防御率でも投球の中身が違って見えるのだ。"}, "4-05-a": {"meta": {"id": "4-05-a", "title": "今年のパ・リーグの争いは？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-05"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/2026/stats/lb_rbi_p.html", "https://npb.jp/bis/2026/stats/pit_p.html"]}, "body": "## ひとことで\n2026年9月27日終了時点では、打率はレイエス、本塁打と打点は栗原陵矢、防御率は平良海馬、奪三振は荘司康誠がトップだ。まだレギュラーシーズンが残っているため、最終結果は確定していない。\n\n## しくみ\n主な部門の先頭は次の通りだ。\n\n- 打率：レイエス .313。2位は近藤健介 .308\n- 本塁打：栗原陵矢 39本。レイエスと山口航輝が32本で2位タイ\n- 打点：栗原陵矢 117。2位は近藤健介 105\n- 防御率：平良海馬 1.36。2位は隅田知一郎 2.22\n- 奪三振：荘司康誠 163。2位は伊藤大海 159\n\n数字は残り試合で動く。タイトル争いを見るときは、「1位が誰か」だけでなく「2位との差」を見ると分かりやすいのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は32本塁打で2位タイだ。今日33号が出れば単独2位になる。打席の結果が、その場の得点とシーズン順位の両方を動かす場面なのだ。"}, "4-05": {"meta": {"id": "4-05", "title": "タイトルって？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "children": ["4-05-a"], "related": ["4-03", "4-04"], "sources": ["https://npb.jp/award/2025/pl.html", "https://npb.jp/bis/2026/stats/", "https://npb.jp/pl/"]}, "body": "## ひとことで\n「タイトル」は、シーズンを通して特定の成績でリーグ1位になった選手に与えられる表彰のことだ。首位打者、本塁打王、打点王、最優秀防御率、最多奪三振などがある。\n\n## しくみ\n打者の主なタイトルには、首位打者（打率1位）、最多本塁打者、最多打点者、最多安打者、最高出塁率者、最多盗塁者がある。投手には、最優秀防御率、最多勝利、勝率第1位、最多奪三振、最多セーブ、最優秀中継ぎなどがあるのだ。\n\n多くは、公式記録の数字で決まる。たとえば本塁打が一番多ければ最多本塁打者、奪三振が一番多ければ最多三振奪取投手になる。同じ数字で並べば、同時受賞になる場合もある。\n\n一方、MVP（最優秀選手）や新人王、ベストナインは記者投票で決まる表彰だ。数字の1位だけで自動的に決まるわけではない。会話ではまとめて「タイトル」と呼ばれることもあるが、決まり方は別なのだ。\n\n## おもしろエピソード\n2025年のパ・リーグでは、日本ハムのレイエスが32本塁打で最多本塁打者、90打点で最多打点者となり、2つの記録による表彰を同時に受けた。1人が複数部門のトップになることもあるというわけだ。\n\n## 今日の試合で見るなら\n2026年9月27日時点で、ロッテの山口航輝は32本塁打でパ・リーグ2位タイだ。今日33号を打てば、同じ32本のレイエスを抜いて単独2位になる。\n\nただし、現在の本塁打1位はソフトバンクの栗原陵矢で39本だ。終盤の1本は試合の得点だけでなく、シーズン全体の順位表にも数字を1つ足す。そこを見ると、9月の打席には別の意味が見えてくるのだ。"}, "4-06-a": {"meta": {"id": "4-06-a", "title": "今日かかっている記録は？（清宮の通算100号など）", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-06", "4-01"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/history/2026/milestones_p.html", "https://npb.jp/bis/history/ltp_sv.html"]}, "body": "## ひとことで\n今日いちばん分かりやすい節目は、清宮幸太郎の通算100本塁打まであと1本だ。ほかにも山口航輝の33号、西川遥輝の350盗塁へのカウントがある。\n\n## しくみ\n今日の試合データにある「記録・話題」は次の4つだ。\n\n- 清宮幸太郎は通算100本塁打まであと1本。初本塁打はルーキーだった2018年5月9日\n- 山口航輝は今季32本塁打でパ・リーグ2位タイ。33号なら単独2位\n- 西川遥輝は通算350盗塁まであと5\n- 益田直也は今季、通算250セーブと通算800試合登板をすでに達成\n\n山口は9月15日に30号へ到達し、球団の日本人選手では落合博満以来40年ぶりの30本塁打となった。この情報も今日の試合データにある話題の一つだ。\n\n## 今日の試合で見るなら\n清宮が打席に入ったら、まず「次の一発が100号」と覚えておけばよい。山口は一発が出れば本塁打順位が動く。\n\n西川遥輝が出場したら盗塁数、益田が登板したら今季達成済みの250セーブと800試合登板を思い出すとよい。同じ1プレーでも、積み重ねの数字があると見え方が変わるのだ。"}, "4-06": {"meta": {"id": "4-06", "title": "節目の記録って？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "children": ["4-06-a"], "related": ["4-01", "4-03", "4-04"], "sources": ["https://npb.jp/history/2026/milestones_b.html", "https://npb.jp/history/2026/milestones_p.html", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/history/ltp_sv.html"]}, "body": "## ひとことで\n「節目の記録」は、通算100本塁打や800試合登板のように、長い積み重ねが分かりやすい数字に届くことだ。1球や1打席が、その選手の何年分もの記録につながる瞬間なのだ。\n\n## しくみ\nまず「通算」と「シーズン」を分けると読みやすい。通算はプロ生活を通して積み上げた合計、シーズンは今年だけの数字だ。\n\nたとえば清宮幸太郎の「通算100本塁打まであと1本」は、過去のシーズンも全部足した本塁打数の話だ。一方、山口航輝の「今季32本塁打」は2026年だけの本数で、現在パ・リーグ2位タイという話になる。\n\n投手にも節目がある。セーブ（試合の最後を締めた投手につく記録）や登板試合数のように、役割を長く続けないと増えにくい数字もあるのだ。\n\n## おもしろエピソード\n節目は「丸い数字」だけとは限らない。山口は33号を打てば本塁打数で単独2位になる。順位が動く1本も、シーズン終盤では大きな意味を持つ。\n\nロッテの益田直也は今季、通算250セーブと通算800試合登板をすでに達成している。今日の試合で新しく達成する数字ではないが、長く積み上げた記録を知っていると、登場したときの見え方が変わるのだ。\n\n## 今日の試合で見るなら\nいちばん分かりやすいのは清宮だ。次の1本塁打が通算100号になる。\n\nロッテでは山口が32本塁打でリーグ2位タイ。33号なら単独2位だ。日本ハムの西川遥輝は通算350盗塁まであと5。こうした「あと○○」を覚えておくと、普通の打席や出塁にも別の意味が見えてくるのだ。"}, "5-01-a": {"meta": {"id": "5-01-a", "title": "日本ハムは何を懸けてる？（西武との2位争い）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n日本ハムは、西武との2位争いを続けるために勝ちたい試合だ。9月27日終了時点で西武が2位、日本ハムが3位、その差は1.5ゲームになっている。\n\n## しくみ\n日本ハムの残り試合は、今日と10月1日のロッテ戦だけだ。一方、西武は残り4試合ある。日本ハムが2連勝しても、西武が残り4試合で2勝すれば西武が2位になる。日本ハムは勝ち続けたうえで、西武が負けるのを待つ立場なのだ。\n\n2位と3位はどちらもCSに出られる。ただしファーストステージは、2026年も2位球団の本拠地で全試合を行う。さらに勝利数が同じなら2位球団が勝ち上がるので、2位にははっきりした利点があるのだ。\n\n## 今日の試合で見るなら\n日本ハム先発は福島蓮。7月12日以来の先発で、9月は救援7試合を無失点でつないできた。短いイニングで継投するのか、それとも福島を長く引っぱるのか。新庄監督の投手交代も、2位争いを背負った采配として見ると意味が分かりやすい。"}, "5-01-b": {"meta": {"id": "5-01-b", "title": "ロッテにとってはどんな試合？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-02-c", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nロッテは5位で、CS進出の可能性はもうない。それでも、選手の記録と来季につながる競争が残っている試合だ。\n\n## しくみ\nサブロー監督は就任1年目。順位だけを見れば消化試合（順位争いへの影響が小さくなった試合）に近いが、若い選手にとっては来季の役割をつかむ場でもある。\n\n西川史礁は打率3割を狙える位置にいて、山口航輝は32本塁打。先発ジャクソンは9勝で、今日勝てば10勝目だ。チーム順位が決まっても、個人の目標は終わっていないのだ。\n\n## 今日の試合で見るなら\n前日は井上広大が勝ち越し打、寺地隆成が3安打を記録した。今日もこの2人がスタメンなら、結果だけでなく「来季も使いたいと思わせる内容か」という見方ができる。終盤に若手が代打や守備で出てきたら、そこも見逃しにくい場面だ。"}, "5-01-c": {"meta": {"id": "5-01-c", "title": "今日の結果で何が決まりうる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-01-a", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n今日だけで日本ハムの2位が決まるわけではない。ただし日本ハムが負けて、同じ時間に楽天と戦う西武が勝つと、日本ハムの3位が確定する。\n\n## しくみ\n9月27日終了時点で、日本ハムは2位西武と1.5ゲーム差で、残り2試合だ。西武は残り4試合ある。日本ハムが今日負けると、2位の望みは「残り1試合に勝ち、西武が残り4試合すべてに負ける」場合だけになる。\n\n逆に今日勝てば、2位争いは10月1日のロッテ戦まで続く。NPBの2026年CS要項では、ファーストステージの球場はすべて2位球団の専用球場と決まっている。日本ハムのCS出場（3位以内）はすでに決まっているので、今日の1勝はCSの開催地を争う1勝なのだ。\n\n## 今日の試合で見るなら\n日本ハムが終盤でリードしていたら、継投が普段より細かくなる可能性がある。清宮幸太郎や万波中正の一発だけでなく、新庄監督が福島蓮から誰へつなぐかにも注目すると、試合の重さが見えやすい。"}, "5-01": {"meta": {"id": "5-01", "title": "今日はどんな試合なの？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-01-a", "5-01-b", "5-01-c"], "related": ["5-05", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n日本ハムには2位争いがかかった、かなり重い一戦だ。ロッテはCS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）には行けないが、記録や来季につながる見どころが多い。\n\n## しくみ\n9月27日終了時点で、パ・リーグはソフトバンクの優勝が決まっている。2位は西武、3位は日本ハムで、その差は1.5ゲームだ。日本ハムの残りは今日と10月1日のロッテ戦、2試合しかない。\n\nCSのファーストステージは2位と3位が戦う。2026年は全試合を2位球団の本拠地で行うので、2位になる意味は「順位が一つ上」だけではないのだ。ただし西武は残り4試合あり、日本ハムが2連勝しても西武が2勝すれば西武が2位だ。日本ハムは勝ち続けて、西武の負けを待つしかない。\n\n一方のロッテは5位で、CS進出の可能性はない。ただし、先発のジャクソンは勝てば10勝目。山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。勝敗とは別に、個人の節目がいくつも残っている試合なのだ。\n\n## おもしろエピソード\n前日の9月27日は、ロッテが日本ハムに6対1で勝った。日本ハムから見れば、2位争いの最中に連敗は避けたい。ロッテから見れば、順位が決まっていても上位争いの相手に簡単には譲らない、という構図になっている。\n\n## 今日の試合で見るなら\nまず日本ハムの3番候補・清宮幸太郎に注目だ。通算100本塁打まであと1本なので、1打席ごとに球場の空気が変わるかもしれない。\n\nロッテでは先発ジャクソンの10勝目と、山口の33号が分かりやすい見どころだ。試合の勝敗、順位争い、個人記録を同時に追うと、今日がただの「シーズン終盤の1試合」ではないことが見えてくる。"}, "5-02-a": {"meta": {"id": "5-02-a", "title": "球団の歴史は？（名前の変遷）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/corp/history/1955.html", "https://www.marines.co.jp/corp/history/1960.html", "https://www.marines.co.jp/corp/history/1965.html", "https://www.marines.co.jp/corp/history/1990.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\nいまの千葉ロッテは、1950年の「毎日オリオンズ」から続く球団だ。会社や本拠地の変化に合わせて名前を変え、1992年から「千葉ロッテマリーンズ」になった。\n\n## しくみ\n大きな流れはこうだ。毎日オリオンズから、大毎オリオンズ、東京オリオンズ、ロッテオリオンズへと変わり、千葉移転で現在の名前になった。\n\n1969年にロッテとの業務提携で「ロッテオリオンズ」が誕生。1991年に千葉への本拠地移転を決め、公募で「マリーンズ」という名前が選ばれた。1992年が千葉ロッテの最初のシーズンだ。\n\n## 今日の試合で見るなら\nZOZOマリンでロッテを応援していると「最初から千葉の球団」に見えるかもしれない。でも球団史は東京や川崎の時代まで続いている。今日サブロー監督や山口航輝を見るとき、その長い歴史の最新版だと思うと見え方が少し変わる。"}, "5-02-b": {"meta": {"id": "5-02-b", "title": "日本一の年は？（2005年・2010年の下剋上）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-05"], "sources": ["https://npb.jp/nippons/2005/index.html", "https://npb.jp/nippons/2010/", "https://www.marines.co.jp/corp/history/2005.html", "https://www.marines.co.jp/corp/history/2010.html"]}, "body": "## ひとことで\nロッテの日本一は1950年、1974年、2005年、2010年の4回だ。最近の2回は、レギュラーシーズン1位ではない位置から短期決戦を勝ち上がった。\n\n## しくみ\n2005年はレギュラーシーズン2位からプレーオフを勝ち抜き、リーグ優勝。日本シリーズでは阪神に4連勝し、31年ぶりの日本一になった。当時は現在と制度が違うので、今のCSと完全に同じではない。\n\n2010年はレギュラーシーズン3位からCSを突破。日本シリーズでは中日を4勝2敗1分で破り、5年ぶり4度目の日本一になった。3位から日本一まで進んだため、「下剋上」の象徴として語られる年だ。\n\n## 今日の試合で見るなら\n現在のサブロー監督は、2005年の日本一で主力だった選手だ。今日ベンチの監督を見たら、「この人はロッテが日本一になった時代をグラウンドで経験している」と覚えておくと、球団史が急に近くなる。"}, "5-02-c": {"meta": {"id": "5-02-c", "title": "今年のロッテは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01-b", "5-02", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n2026年のロッテは、9月27日終了時点でパ・リーグ5位。CS進出の可能性はなく、サブロー監督の1年目は上位争いに届かなかった。\n\n## しくみ\nチーム打率は.236で、得点を安定して作るのに苦しんだ。一方で山口航輝は32本塁打まで伸ばし、西川史礁も規定打席以上の打率でリーグ上位にいる。順位は低くても、打線の軸になりそうな選手は見えてきているのだ。\n\n終盤は若手や新戦力の評価も重要になる。前日の日本ハム戦では寺地隆成が3安打、井上広大が勝ち越し打を記録し、ロッテが6対1で勝った。\n\n## 今日の試合で見るなら\n山口の一発だけでなく、寺地、井上、西川史礁の打席を続けて見るといい。今日の結果が順位を大きく変えなくても、「来年の打線に誰が残るか」という視点では一打席ずつに意味がある。"}, "5-02-d": {"meta": {"id": "5-02-d", "title": "有名なOBは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1980.html", "https://www.marines.co.jp/corp/history/1985.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\nロッテの昔のスターなら、落合博満、村田兆治、有藤道世を知っておくと話がつながりやすい。打者、投手、生え抜きの象徴という三つの方向から球団史を見られる。\n\n## しくみ\n落合博満はロッテ時代に三冠王（打率・本塁打・打点の3部門すべて1位）を1982年、1985年、1986年の3度獲得した大打者だ。\n\n村田兆治は豪快な「マサカリ投法」で知られ、右肘の手術から復活。1989年に通算200勝を達成した。有藤道世は長くロッテ一筋でプレーし、1985年に2000安打を達成。「ミスター・ロッテ」と呼ばれた存在だ。\n\n## 今日の試合で見るなら\n山口航輝が30本塁打を超えたことで、球団の長打者の歴史がまた話題になっている。今日33号が出たら、昔の落合のような大打者と比べる材料が一つ増える。記録は、昔の選手と今の選手をつなぐ物差しなのだ。"}, "5-02": {"meta": {"id": "5-02", "title": "ロッテってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-02-a", "5-02-b", "5-02-c", "5-02-d"], "related": ["5-01", "5-06", "5-07"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/special/70th/history.html", "https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n千葉ロッテマリーンズは、1950年の毎日オリオンズを出発点に持つパ・リーグの球団だ。1992年から千葉を本拠地にし、いまの「マリーンズ」という名前になった。\n\n## しくみ\n球団の歴史はかなり長い。1950年に毎日オリオンズとして始まり、大毎オリオンズ、東京オリオンズ、ロッテオリオンズと名前を変え、1992年に千葉ロッテマリーンズになった。\n\n日本一は1950年、1974年、2005年、2010年の4回。特に2005年と2010年は、上位チームを短期決戦で倒して頂点まで進んだ年として記憶されている。2010年はレギュラーシーズン3位から日本一になった。\n\n2026年は9月27日終了時点で5位。CSには進めないが、山口航輝の長打力や、西川史礁ら若い打者の成長など、来季につながる材料を探す終盤になっている。\n\n## 歴史・由来\n「マリーンズ」は海に近い千葉を本拠地にすることと相性のよい名前だ。球団は1991年に千葉への移転を決め、公募で「マリーンズ」を採用。1992年から千葉ロッテマリーンズとしてスタートした。\n\n## おもしろエピソード\n1980年代には落合博満がロッテで三冠王を3度獲得した。1989年には村田兆治が通算200勝を達成している。いまのチームだけでなく、個性的な大打者や投手が何人もいた球団なのだ。\n\n## 今日の試合で見るなら\n2番候補の山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。1番候補の西川史礁は打率3割が見える位置だ。\n\nそして監督のサブローも、2005年の日本一メンバーだった。今日のベンチを見ると、球団の過去と現在が同じ場所につながっているのが分かる。"}, "5-03-a": {"meta": {"id": "5-03-a", "title": "東京から北海道へ移ったのはなぜ？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-03-b"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://www.fighters.co.jp/news/detail/00000742.html"]}, "body": "## ひとことで\n東京ドームを本拠地にしていた日本ハムは、2004年に北海道へ移った。大きく言えば、北海道に根を張る「地域密着の球団」へ転換するための移転だった。\n\n## しくみ\n東京時代は、東京ドームを巨人と分け合う形で16年間使っていた。球団は2002年7月、2004年から札幌ドームへ本拠地を移すことを正式決定した。\n\n北海道移転後は「Sports Community（スポーツを通じた地域づくり）」を企業理念に掲げ、北海道各地との活動を広げていった。単に試合をする場所を東京から札幌へ替えただけではなく、球団の土台そのものを北海道につくり直した、と考えるとわかりやすい。\n\n## 歴史・由来\n2004年は新庄剛志が加入した年でもある。移転3年目の2006年にはリーグ優勝、日本一まで進んだ。\n\n## 今日の試合で見るなら\n今日、日本ハムはビジターとしてZOZOマリンに来ている。ユニフォームの胸にある「FIGHTERS」は、22年前に北海道へ移り、地域と一緒に育ってきた球団の名前なのだ。"}, "5-03-b": {"meta": {"id": "5-03-b", "title": "エスコンフィールドって？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/00003788.html", "https://www.fighters.co.jp/news/detail/202500696362.html", "https://npb.jp/games/2026/info_cs.html", "https://prtimes.jp/main/html/rd/p/000000099.000079562.html"]}, "body": "## ひとことで\nエスコンフィールドHOKKAIDOは、2023年3月に北海道北広島市で開業した日本ハムの本拠地だ。開閉式の屋根と天然芝を組み合わせた球場で、約3万5000人を収容する。\n\n## しくみ\n正式には北海道ボールパークFビレッジの中心にある球場だ。大きなガラス壁、開閉式屋根、天然芝が特徴で、球場内には飲食店やホテル、温泉・サウナなどもある。\n\nつまり「野球を見るためだけの建物」というより、一日過ごせる街の中心に球場がある設計なのだ。\n\n## おもしろエピソード\n屋根は巨大な一枚屋根が移動して開閉する。2023年には、屋根を開けた状態で初めて公式戦も行われた。\n\n## 今日の試合で見るなら\n日本ハムが今季2位で終われば、10月10日からのCSファーストステージは2位球団の本拠地で行われる。つまり今日の勝利は、「エスコンでCSを開く」可能性を残すためにも必要なのだ。"}, "5-03-c": {"meta": {"id": "5-03-c", "title": "大谷翔平やダルビッシュがいたって本当？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-03-d"], "sources": ["https://www.fighters.co.jp/news/detail/00003549.html", "https://npb.jp/bis/players/61965110.html", "https://npb.jp/bis/players/01305137.html"]}, "body": "## ひとことで\n本当だ。ダルビッシュ有は2005〜2011年、大谷翔平は2013〜2017年に日本ハムでプレーした。二人とも、北海道移転後のファイターズを代表する選手なのだ。\n\n## しくみ\nダルビッシュは高校から入団し、日本ハムで7年間に93勝。2006年の日本一や2007年のリーグ連覇を支えるエースになった。\n\n大谷は2012年ドラフト1位で入り、2013年から投手と打者の「二刀流」に挑戦した。2016年には投打の両方で活躍し、チームの日本一に貢献している。\n\n二人はその後、米大リーグへ移った。だから日本ハムは、世界で知られる選手が日本で育った球団でもあるわけだ。\n\n## 今日の試合で見るなら\n今日の日本ハム先発は23歳の福島蓮だ。育成ドラフトから支配下を勝ち取った若い右腕で、5勝4敗、防御率3.35。ダルビッシュや大谷とはタイプも歩みも違うが、「若い投手が大舞台を任される」という日本ハムの歴史を思い出して見ると面白い。"}, "5-03-d": {"meta": {"id": "5-03-d", "title": "新庄監督ってどんな人？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/202500780959.html", "https://www.fighters.co.jp/news/detail/202600951850.html", "https://www.nikkansports.com/baseball/news/202609240001679.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n新庄剛志監督は、現役時代にも日本ハムでプレーした元外野手だ。2022年から監督を務め、選手起用や試合前後の発信まで含めて注目を集めるタイプなのだ。\n\n## しくみ\n現役では阪神から米大リーグへ渡り、2004年に日本ハムへ加入した。ちょうど球団が北海道へ移った年で、2006年の日本一を最後に引退している。\n\n監督には2022年に就任した。最初の2年は6位だったが、2024年、2025年は2年連続2位。2026年は9月27日終了時点で3位にいる。\n\n9月24日の本拠地最終戦後には、2027年も続投する意向を明らかにした。来季は監督6年目になる。\n\n## おもしろエピソード\n選手として北海道移転元年に加わり、今は監督としてエスコンフィールドのベンチにいる。日本ハムの北海道時代を、選手と監督の両方で知る人物なのだ。\n\n## 今日の試合で見るなら\n日本ハムが2位へ上がるには、残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日の先発は、9月に救援で7試合無失点だった福島蓮。約2カ月半ぶりの先発をどこまで投げさせ、どの投手につなぐかは、新庄監督の大きな判断になる。"}, "5-03": {"meta": {"id": "5-03", "title": "日本ハムってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-03-a", "5-03-b", "5-03-c", "5-03-d"], "related": ["5-01", "5-05", "5-06"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n北海道日本ハムファイターズは、2004年から北海道を本拠地にするパ・リーグの球団だ。北海道移転後は2006年と2016年に日本一になっている。\n\n## しくみ\nもともとは東京を本拠地にしていたが、2004年から札幌ドームへ移り、現在は北広島市のエスコンフィールドHOKKAIDOが本拠地だ。\n\n球団の特徴を一つに決めるのは難しい。けれど、ダルビッシュ有や大谷翔平のような若い選手が大きく育った歴史があり、今も清宮幸太郎、万波中正、水野達稀らが中心になっている。\n\n2026年は9月27日終了時点でパ・リーグ3位だ。2位の西武とは1.5ゲーム差で、残りはロッテとの2試合だけ。2位で終われば、クライマックスシリーズ（CS：日本シリーズ進出を争う短期決戦）の最初の舞台を自分たちの本拠地で戦える。\n\n## 歴史・由来\n球団は1974年に「日本ハムファイターズ」として発足した。2004年の北海道移転は大きな転換点で、2006年には44年ぶりの日本一を達成した。その後も北海道を代表する球団として歩み、2023年からエスコンフィールドを本拠地にしている。\n\n## おもしろエピソード\n北海道移転元年の2004年には、新庄剛志が選手として加入した。今、その新庄が監督としてベンチにいるのだ。球団の「北海道時代」の始まりと現在が、一人の人物でつながっている。\n\n## 今日の試合で見るなら\n日本ハムは今日を含む残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日負けて西武が勝てば、3位が確定する。予想スタメンでは清宮が3番の指名打者（守備につかず打撃を担当する選手）で、通算100本塁打まであと1本。まずは「日本ハムは順位を上げるために勝ちが必要な側」と覚えておけば、攻撃の一球ごとの重さが見えやすくなる。"}, "5-04-a": {"meta": {"id": "5-04-a", "title": "セ・リーグとの違いは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-04", "5-04-b"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html"]}, "body": "## ひとことで\n2026年の大きな違いは、パ・リーグには指名打者（DH：投手の代わりに打つ専門選手）がいて、セ・リーグでは投手も打席に立つことだ。ただし、この違いは2026年で終わる。\n\n## しくみ\nパ・リーグは1975年からDH制を使っている。投手は基本的に投げることへ集中し、打線には別の打者が1人入る。\n\nセ・リーグは長く「9人野球」を続けてきたが、2027年からDH制を採用すると正式決定した。だから2026年は、セ・リーグの投手が公式戦で普通に打席へ入る最後のシーズンなのだ。\n\n球の数やアウトの取り方など、野球の基本ルールが別物なわけではない。所属する6球団と、DHの扱いが主な違いだ。\n\n## 今日の試合で見るなら\n今日のロッテと日本ハムはどちらもパ・リーグなのでDHを使える。予想ではロッテの山口航輝、日本ハムの清宮幸太郎が指名打者。守備につかず、「打つ仕事」に集中する選手として見ればいい。"}, "5-04-b": {"meta": {"id": "5-04-b", "title": "交流戦って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-04", "5-04-a"], "sources": ["https://npb.jp/interleague/2026/schedule_note_il.html", "https://npb.jp/interleague/2026/"]}, "body": "## ひとことで\n交流戦は、普段は別リーグにいるセ・リーグとパ・リーグの球団が対戦する公式戦だ。2005年に始まり、2026年は各球団18試合を戦った。\n\n## しくみ\n各チームは、別リーグの6球団と3試合ずつ対戦する。合計18試合で、ホーム9試合、ビジター9試合だ。\n\n「特別なイベント試合」ではなく、勝敗はそのままシーズンの成績に入る。交流戦で大きく勝ち越せば、その後のリーグ順位にも効くというわけだ。\n\n2026年の交流戦は5月26日から行われた。\n\n## 歴史・由来\n交流戦が始まる前は、日本シリーズなどを除けば別リーグの球団が公式戦で当たる機会は少なかった。今は毎年、普段見ない組み合わせを楽しめる期間になっている。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは交流戦ではなく、パ・リーグ同士の試合だ。だから日本ハムの勝敗は、目の前の2位争いにそのまま響く。"}, "5-04": {"meta": {"id": "5-04", "title": "ロッテや日ハムがあるパ・リーグって？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "children": ["5-04-a", "5-04-b"], "related": ["5-03", "5-05"], "sources": ["https://npb.jp/news/detail/20260326_02.html", "https://npb.jp/games/2026/", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\nパ・リーグは、日本のプロ野球12球団を二つに分けたうちの一方だ。ロッテ、日本ハム、ソフトバンク、西武、オリックス、楽天の6球団が所属している。\n\n## しくみ\n正式にはパシフィック・リーグという。もう一方がセントラル・リーグ、略してセ・リーグだ。\n\n普段の公式戦では、同じリーグの6球団どうしで多く対戦する。2026年は1球団143試合で、そのうち125試合が同じリーグとの対戦、18試合がセ・パ交流戦（別リーグとの公式戦）だ。\n\nシーズン終了時の順位は、まずリーグ内で決まる。1位がリーグ優勝で、1〜3位がクライマックスシリーズ（CS）へ進む。そこから勝ち上がった1球団が、セ・リーグ側の勝者と日本シリーズで戦う。\n\n## 歴史・由来\nセ・リーグとパ・リーグの2リーグ制は1950年に始まった。長く大きな違いだったのが指名打者（DH：投手の代わりに打つ専門選手）の有無で、パ・リーグは1975年から採用している。\n\n## おもしろエピソード\n2026年は、長く続いた「パはDH、セは投手も打つ」という違いの最後の年だ。セ・リーグも2027年からDH制を採用することが決まっている。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは、同じパ・リーグ同士の公式戦だ。ロッテは5位でCS進出の可能性がなく、日本ハムは3位で2位西武を1.5ゲーム差で追っている。同じ1勝でも、今の両チームでは順位への意味が違うのだ。"}, "5-05-a": {"meta": {"id": "5-05-a", "title": "日本シリーズまでの流れは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-05", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/event/2026/", "https://npb.jp/nippons/2025/information.html"]}, "body": "## ひとことで\n道順は「レギュラーシーズン→CSファースト→CSファイナル→日本シリーズ」だ。セ・リーグとパ・リーグから1球団ずつが勝ち残り、最後に日本一を争う。\n\n## しくみ\nパ・リーグなら、まず2位と3位がCSファーストステージを戦う。その勝者が1位球団とファイナルステージで対戦し、勝った球団がパ・リーグ代表として日本シリーズへ進む。\n\nセ・リーグでも同じ流れで1球団を決める。最後の日本シリーズは最大7試合で、一方が4勝した時点で終了する。\n\n2026年の日本シリーズは10月24日に開幕予定だ。\n\n## 今日の試合で見るなら\n日本ハムにとって今日の先にある最短ルートは、まず2位を取りにいき、10月10日からのCSファーストステージを勝ち、リーグ1位のソフトバンクとのファイナルを突破することだ。今日のロッテ戦は、その長い階段の入口にある1試合なのだ。"}, "5-05": {"meta": {"id": "5-05", "title": "クライマックスシリーズ（CS）って？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-05-a"], "related": ["5-01", "5-03", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\nクライマックスシリーズ（CS）は、リーグ戦のあとに1〜3位が日本シリーズ進出を争う短期決戦だ。リーグ優勝そのものは1位の球団だが、CSを勝ち抜かないと日本シリーズには行けない。\n\n## しくみ\nまず「ファーストステージ」で2位と3位が対戦する。3試合制で先に2勝したほうが勝ち上がり、全試合を2位球団の本拠地で行う。同じ勝利数になった場合も、上位の2位球団が進む。\n\n次の「ファイナルステージ」は1位球団対ファーストステージ勝者だ。基本は1位球団に最初から1勝を与え、最大6試合で、アドバンテージ込みの4勝に先に届いた側が日本シリーズへ進む。\n\n2026年からは追加ルールができた。1位と勝ち上がり球団のレギュラーシーズンの差が10ゲーム以上、または勝ち上がり球団の勝率が5割未満なら、1位に2勝のアドバンテージを与え、最大7試合・5勝先取になる。\n\nつまり、レギュラーシーズンで上にいるほど有利に作られているのだ。\n\n## 歴史・由来\n今の形のCSは2007年から両リーグで行われている。2026年はファーストステージが10月10日、ファイナルステージが10月14日に始まる。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、2位西武とは1.5ゲーム差だ。西武は残り4試合あり、日本ハムは勝ち続けたうえで西武の負けを待つ立場だ。2位になればCSの最初の最大3試合をエスコンフィールドで戦えるので、CS出場はすでに決まっている日本ハムにとって、今日の1勝は「どこでCSを戦うか」に関わる。"}, "5-06-a": {"meta": {"id": "5-06-a", "title": "清宮幸太郎の100号って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/41545136.html", "https://www.nikkansports.com/baseball/news/202609260001489.html?mode=all"]}, "body": "## ひとことで\n「100号」は、清宮幸太郎がプロ野球の公式戦で打った通算100本目のホームランという意味だ。9月27日終了時点で99本なので、今日1本出れば到達するのだ。\n\n## しくみ\n通算本塁打は、その年だけではなくプロ入り後の本塁打を全部足した数字だ。清宮は2018年に7本を打ち、2026年はここまで23本。積み上げた合計が99本になっている。\n\n100という数字そのものに得点が増える特別ルールはない。ただ、長く一軍で長打を重ねたことが目に見える節目なのだ。\n\n## 今日の試合で見るなら\n清宮の打席では、打球が外野フェンスを越えるかだけを追えばいい。ジャクソンの失投を一振りで仕留めれば、その一発が通算100号になるのだ。"}, "5-06-b": {"meta": {"id": "5-06-b", "title": "山口航輝の「40年ぶり」って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/91895138.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/86265", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n山口航輝が今季30本塁打に到達したのが、ロッテの日本人選手では1986年の落合博満以来40年ぶりだった、という意味だ。\n\n## しくみ\n「30本」は1シーズンで打ったホームラン数の区切りだ。外国人選手を含めればロッテにも30本以上の例はあるが、日本人選手に限ると長い空白があったのだ。\n\n山口は9月15日の日本ハム戦で29号と30号を2打席連続で放った。30号は9回の決勝本塁打で、一発がそのまま試合の勝敗と40年ぶりの記録を動かした。\n\n## 今日の試合で見るなら\n今日の相手も日本ハムだ。山口は今季32本塁打まで伸ばしているので、打席では「もう30本を超えた長距離打者」として、外野へ上がる大きな打球に注目するといいのだ。"}, "5-06-c": {"meta": {"id": "5-06-c", "title": "ジャクソンの10勝目って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nアンドレ・ジャクソンは今季9勝8敗で、今日勝てばシーズン10勝目になる。2025年もDeNAで10勝しているので、達成すれば2年連続の2桁勝利なのだ。\n\n## しくみ\n投手の「勝ち」は、登板した試合でチームが勝てば自動で付くわけではない。先発投手（試合の最初から投げる投手）なら、基本は5回以上を投げ、交代したあとも味方がリードを守ると勝ち投手になる。\n\n「10勝」は1年で10試合の勝ち投手になった、という区切りだ。ジャクソンは今季ロッテで9勝しており、チーム内でも最多タイの勝ち星を持っている。\n\n## 今日の試合で見るなら\nロッテが先に点を取り、ジャクソンが5回以降までリードを守れるかを見るといい。そのままロッテが勝てば、今日が今季10勝目になる可能性があるのだ。"}, "5-06": {"meta": {"id": "5-06", "title": "今日の注目選手は？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-06-a", "5-06-b", "5-06-c"], "related": ["5-07"], "sources": ["https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/43745159.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n今日なら、日本ハムの清宮幸太郎、ロッテの山口航輝、ロッテ先発のアンドレ・ジャクソンを追うと分かりやすい。3人とも、きょう動くかもしれない節目を持っているのだ。\n\n## しくみ\n清宮は通算本塁打（プロ入り後に打ったホームランの合計）が99本で、あと1本で100号だ。これは今季だけの数字ではなく、2018年の1年目から積み上げた合計なのだ。\n\n山口は今季32本塁打。9月15日に30号へ到達し、ロッテの日本人選手では1986年の落合博満以来40年ぶりに、1シーズン30本へ乗せた。\n\nジャクソンは今季9勝8敗、防御率3.44。今日勝てば10勝目で、2025年の10勝に続く2年連続の2桁勝利になる。\n\n## おもしろエピソード\n山口の節目の30号は、今日と同じ日本ハム戦だった。9回に決勝本塁打を打ち、29号との2打席連続本塁打で一気に30本へ届いたのだ。\n\n## 今日の試合で見るなら\n日本ハムの攻撃では、清宮の打席で「あと1本」を思い出せばいい。ロッテの攻撃では山口の大きな打球、ロッテの守りではジャクソンが勝ち投手の権利を持って降板できる展開になるかを見ると、3つの節目を同時に追えるのだ。"}, "5-07-a": {"meta": {"id": "5-07-a", "title": "各スタメンのカード（18人）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n両チームの予想スタメン18人は、それぞれカードで特徴と見どころを確認できる。全員を先に覚える必要はないのだ。\n\n## しくみ\nスタメン（試合開始時に出る選手）は両チーム9人ずつだ。カードには、打つ特徴、守る場所、最近の調子など、観戦中に使いやすい情報をまとめている。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。まず1番打者、次に得点につながりやすい中軸（打線の中心になる打者）だけ見ておくと、試合の流れを追いやすいのだ。"}, "5-07-b": {"meta": {"id": "5-07-b", "title": "両先発投手のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n今日の予告先発（試合の最初から投げる予定の投手）は、ロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。2人とも右投手なのだ。\n\n## しくみ\n先発投手は、試合の最初の数回を任される投手だ。ジャクソンは今季9勝8敗、防御率3.44、福島は5勝4敗、防御率3.35。数字だけでなく、球種や最近の登板もカードで確認できる。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。ロッテの守りではジャクソン、日本ハムの守りでは福島のカードを開き、どんな球で打者を抑えようとしているかを見るといいのだ。"}, "5-07-c": {"meta": {"id": "5-07-c", "title": "スタメン候補・ブルペン・代打代走のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n試合はスタメン（試合開始時に出る選手）だけで終わらない。途中から出る選手を見ると、監督がどこで勝負をかけたか分かるのだ。\n\n## しくみ\nブルペンは、途中から投げる投手たちのことだ。代打は打つために交代で出る選手、代走は走るために交代で出る選手を指す。\n\nスタメン候補も含め、実際に誰が出るかは試合展開で変わる。だから先に全員を覚えるより、交代が告げられた時にカードを開く方が効率がいいのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。場内アナウンスで新しい名前が呼ばれたら、その選手だけ確認すれば十分なのだ。"}, "5-07-d": {"meta": {"id": "5-07-d", "title": "両監督のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://www.marines.co.jp/news/detail/202500743647.html", "https://www.fighters.co.jp/news/detail/202500796590.html"]}, "body": "## ひとことで\n今日の監督は、ロッテがサブロー、日本ハムが新庄剛志だ。選手交代や投手交代を決める、試合中の指揮役なのだ。\n\n## しくみ\n監督は、誰をスタメン（試合開始時に出す選手）にするか、いつ投手を代えるか、誰を代打や代走で送るかを決める。スコアだけでは見えないが、交代のタイミングには監督の考えが出やすいのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から両監督のカードが見られます。選手交代が続いた場面でカードを開くと、「なぜこの選手を今出したのか」を考える手がかりになるのだ。"}, "5-07": {"meta": {"id": "5-07", "title": "スタメン表（選手・監督カード）", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-07-a", "5-07-b", "5-07-c", "5-07-d"], "related": ["4-02", "5-06"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nスタメン（試合開始時に出る選手）は、打順と守る場所を見るための名簿だ。このガイドでは、選手名を覚えるより先にカードを開けば十分なのだ。\n\n## しくみ\n今日の予想スタメンは、ロッテ9人、日本ハム9人の計18人だ。これに両チームの先発投手（試合の最初から投げる投手）、途中から出る候補、両監督のカードがある。\n\n実際のスタメンは試合前の発表で変わることがある。予想と違う名前が出ても異常ではなく、その日の相手投手や選手の状態で入れ替わるのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られます。名前が分からなくなったら、打席に入った選手やマウンド（投手が投げる場所）にいる投手のカードだけ開けばいいのだ。"}, "6-01-a": {"meta": {"id": "6-01-a", "title": "1塁側の席で何をすればいい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "related": ["6-01", "6-01-c"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n1塁側の内野指定席Bなら、まず座ったまま手拍子で十分だ。慣れてきたら、選手名のコールや7回のタオル応援に加わればいいのだ。\n\n## しくみ\nロッテが攻撃すると、外野の応援団が演奏を始める。最初の1打席は周りを見て、同じタイミングで手をたたくだけでいい。\n\n選手名が繰り返し聞こえたら、その部分だけ声を出してもいい。応援ボードや小旗を使うなら、公式ルールでは自分の顔より下、自席の範囲内で使う決まりだ。\n\n内野指定席は、立ち上がって応援する前提の外野応援席とは別のエリアだ。後ろの人の視界をふさがないよう、基本は座ったまま楽しむのが分かりやすい。\n\n## 今日の試合で見るなら\n1回裏、1番予想の西川史礁の打席から試してみよう。手拍子だけで流れをつかみ、続く山口航輝では名前のコールまで加わる、くらいで十分だ。\n\n7回表が終わったら「MARINES LUCKY 7」だ。タオルがあれば掲げ、なければ手拍子だけでも参加できるのだ。"}, "6-01-b": {"meta": {"id": "6-01-b", "title": "選手ごとの応援歌って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "related": ["6-01", "6-01-a"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.marines.co.jp/news/detail/202600832194.html"]}, "body": "## ひとことで\n選手応援歌は、打者ごとに用意された短い応援曲だ。打席の間に何度も繰り返すので、最初は歌詞より名前と手拍子だけ拾えばいいのだ。\n\n## しくみ\n2026年の球団公式ページには、山口航輝、藤原恭大、佐藤都志也、小川龍成、寺地隆成などの個人応援歌が掲載されている。西川史礁と髙部瑛斗には新しい応援歌が加わった。\n\n全選手に必ず専用曲があるわけではない。公式ページには若手用、捕手用、その他の選手用といった共通テーマも載っている。だから知らない曲が始まっても、間違いではないのだ。\n\n歌詞を事前に全部覚える必要はない。外野の演奏を聞き、周囲が選手名を呼ぶところだけ合わせれば、1打席のうちにだいたい形が見えてくる。\n\n## 今日の試合で見るなら\n予想スタメンでは、西川史礁、山口航輝、藤原恭大、佐藤都志也、寺地隆成、小川龍成、髙部瑛斗に公式掲載の個人応援歌がある。最初の西川の打席で曲調を聞き、山口の打席で名前のコールに入ると分かりやすいのだ。"}, "6-01-c": {"meta": {"id": "6-01-c", "title": "ジャンプしたり叫んだりしていいの？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "related": ["6-01", "6-01-a"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/news/detail/00008263.html"]}, "body": "## ひとことで\n選手名を呼んだり応援歌を歌ったりするのはいい。ただし今日の内野指定席Bでは、立ち上がったりジャンプしたりせず、座席から声と手拍子で応援するのが基本だ。\n\n## しくみ\n現行のスタジアムルールは、ホーム・ビジターの外野応援指定席を「立ち上がっての応援が許可されているエリア」としている。2022年のルール変更時にも、立ち上がって応援できる席として両外野応援指定席が明記された。\n\n一方、あなたの内野指定席Bはそのエリアではない。周囲の視界や観戦を妨げないよう、座ったまま手拍子をし、選手名や応援歌を声に出すのが安全なのだ。\n\n球団は、ほかの観客の観戦を妨げる発言や行為があれば対応する場合があるとしている。声量も「自分だけが目立つ」より、周りの応援に合わせると考えれば分かりやすい。\n\n## 今日の試合で見るなら\n山口航輝が打席に入ったら、名前のコールは声に出していい。ただし33号を期待して盛り上がっても、内野席ではジャンプせず、座ったまま拍手と声で参加するのだ。"}, "6-01": {"meta": {"id": "6-01", "title": "ロッテの応援ってどんな感じ？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "children": ["6-01-a", "6-01-b", "6-01-c"], "related": ["6-02", "6-03"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nロッテの応援は、打者ごとの応援歌と手拍子、名前のコールが中心だ。全部覚えなくても、周りの手拍子に合わせるだけで十分参加できるのだ。\n\n## しくみ\nロッテの攻撃になると、外野の応援団が太鼓やトランペットで流れを作る。打者ごとの応援歌がある選手も多く、チャンスではチーム用の応援曲に切り替わるというわけだ。\n\n公式の応援歌ページには、山口航輝、西川史礁、藤原恭大、佐藤都志也、髙部瑛斗らの曲が載っている。専用曲がない選手には、若手用や捕手用などの共通テーマが使われる場合もある。\n\nあなたの席は1塁側の内野指定席Bだ。外野応援席ほど立って動く場所ではないので、座ったまま手拍子をし、分かるところだけ名前を呼べばいい。応援は「全部できる人だけのもの」ではないのだ。\n\n## おもしろエピソード\n2026年は西川史礁と髙部瑛斗に新しい個人応援歌が加わった。球団は選手応援歌グッズも販売しており、応援歌そのものが球場文化の一部になっている。\n\n7回表終了後には「MARINES LUCKY 7」があり、球団歌「WE LOVE MARINES」を歌いながらタオルを掲げる演出が予定されている。初観戦でも参加しやすい場面だ。\n\n## 今日の試合で見るなら\nロッテの攻撃では、まず2番予想の山口航輝に注目すると分かりやすい。32本塁打で、33号ならリーグ単独2位になる打者だ。打席に入ったら、外野の演奏と手拍子がどう変わるか聞いてみるといい。\n\n1番予想の西川史礁にも2026年の新応援歌がある。歌詞を知らなくても、周囲と同じ拍で手をたたけば自然に入れる。7回にはタオルを準備しておくと、応援の大きな区切りも体験できるのだ。"}, "6-02": {"meta": {"id": "6-02", "title": "日本ハムの応援は？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["6-01", "6-03"], "sources": ["https://www.fighters.co.jp/entertainment/cheer_player/", "https://www.fighters.co.jp/news/detail/202600836488.html", "https://www.marines.co.jp/stadium/rule", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n日本ハムにも選手ごとの応援歌があり、ビジター側の応援席から手拍子や演奏がまとまって聞こえてくる。ロッテの応援と交互に聞くと、攻守が切り替わったことも分かりやすいのだ。\n\n## しくみ\n日本ハムの公式サイトには、清宮幸太郎、田宮裕涼、万波中正、水野達稀らの選手応援歌が掲載されている。打者が変わるたびに曲も変わるので、選手紹介を見なくても「次の打者が来た」と耳で気づける。\n\n日本ハムの応援をまとめる全国闘将会は、応援歌の1回目をアカペラ（楽器を止めて声だけで歌うこと）で歌うとしている。その間はメガホンをたたかず、手拍子はよいという案内だ。声だけになった瞬間は、応援の輪郭がかなりはっきり聞こえる。\n\nZOZOマリンのビジター外野応援指定席は、立ち上がって応援できる専用エリアだ。一方、内野席はホーム・ビジター双方のファンが観戦できる。あなたの1塁側内野指定席Bでも、日本ハムの応援が聞こえてくるのは自然なことなのだ。\n\n## おもしろエピソード\n2026年には日本ハムも選手応援歌を使った公式グッズを販売している。応援歌は球場だけの掛け声ではなく、選手とファンを結ぶ定番の文化になっているというわけだ。\n\n## 今日の試合で見るなら\n日本ハムの3番予想・清宮幸太郎は、通算100本塁打まであと1本だ。打席に入ったとき、ロッテ側の応援が止まり、反対側から清宮の応援歌が聞こえてくる切り替わりに注目するといい。\n\n田宮裕涼や万波中正にも公式の個人応援歌がある。ロッテ攻撃時との音の違いを聞き比べると、球場全体が二つの応援チームでできていることが分かるのだ。"}, "6-03": {"meta": {"id": "6-03", "title": "ヒーローインタビューって？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["6-01", "6-02"], "sources": ["https://www.marines.co.jp/news/detail/202600800842.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nヒーローインタビューは、試合後に活躍した選手へ行う場内インタビューだ。今日のZOZOマリンでは、ロッテが勝つと「MARINES WINNING CEREMONY」の中で行われる予定なのだ。\n\n## しくみ\nヒーローになるのは、勝敗を大きく動かした選手が中心だ。決勝打を打った打者、好投した先発投手、終盤を締めた救援投手などが候補になる。ただし、誰が何人呼ばれるかは試合が終わるまで決まらない。\n\n2026年のZOZOマリンでは、ロッテ勝利時に球場を
