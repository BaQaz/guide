<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロッテ×日本ハム観戦ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f4f6f6; --ink:#08131a; --sub:#5d6a70; --line:#e2e7e9; --accent:#18917e; --accent-ink:#ffffff;
  --board:#0f1d19; --board-line:#26372f; --board-ink:#e9efe9; --led:#ffd449; --ball:#3fd26a; --strike:#ffd449; --out:#ff5a4f; --lamp-off:#2c3b35;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 "Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.02em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
header a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem}
header .meta{margin-left:auto;color:var(--sub);font-size:.78rem}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;line-height:1.5;margin:.2em 0 .5em;text-wrap:balance}
h2{font-size:1.2rem;line-height:1.5;margin:0;text-wrap:balance}
h3{font-size:1.02rem;margin:1.4em 0 .3em}
p{margin:0 0 1.1em}
a{color:var(--accent)}
.lead{color:var(--sub);font-size:.88rem;line-height:1.7}
.eyebrow{font-size:.75rem;color:var(--sub);letter-spacing:.08em;margin:0 0 4px}
.back{display:inline-block;margin-bottom:14px;font-size:.88rem;color:var(--sub);text-decoration:none}
.stack{display:flex;flex-direction:column;gap:14px}
.section-title{font-size:.8rem;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:30px 0 10px}

/* ガイド切り替え（TOP上部） */
.guides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.guide{display:flex;flex-direction:column;justify-content:space-between;min-height:84px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);background:var(--bg)}
.guide b{font-size:.98rem;line-height:1.45}
.guide span{font-size:.75rem;color:var(--sub)}
.guide:hover,.q:hover{border-color:var(--accent)}
.guide.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:10px}
.guide.wide span{margin-left:auto}

/* 質問ボタン（横2列） */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.5;font-weight:700}
.q small{font-weight:400;font-size:.72rem;color:var(--sub)}
.q.off{background:var(--surface);color:var(--sub);font-weight:400}
.q .mark{color:var(--accent);font-size:.72rem;font-weight:700}

/* 速報ボード */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.board .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.board .inning{font-family:"Roboto Mono",ui-monospace,monospace;color:var(--led);font-weight:700;font-size:1.05rem}
.board .status{font-size:.78rem;opacity:.8}
.board .upd{margin-left:auto;font-size:.72rem;opacity:.7}
.board a{color:var(--led)}
.ls{overflow-x:auto}
.ls table{border-collapse:collapse;width:100%;font-family:"Roboto Mono",ui-monospace,monospace}
.ls th,.ls td{border-bottom:1px solid var(--board-line);padding:5px 1px;text-align:center;font-size:.9rem}
.ls th{font-weight:500;opacity:.65;font-size:.75rem}
.ls td.team{font-size:.8rem;text-align:left;font-family:"Noto Sans JP",sans-serif;font-weight:700;white-space:nowrap;padding-right:8px}
.ls td.r{color:var(--led);font-weight:700}
.ls td.sum{border-left:1px solid var(--board-line)}
.sit{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lamps{display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;font-family:"Roboto Mono",ui-monospace,monospace;font-weight:700;font-size:.85rem}
.lamps button{all:unset;display:flex;gap:6px;cursor:pointer;padding:2px 0}
.lamps button:focus-visible,.bases button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.lamp{width:15px;height:15px;border-radius:50%;background:var(--lamp-off)}
.lamp.b{background:var(--ball)}.lamp.s{background:var(--strike)}.lamp.o{background:var(--out)}
.bases{position:relative;width:96px;height:78px;justify-self:end}
.bases button{all:unset;position:absolute;width:26px;height:26px;transform:rotate(45deg);border:2px solid var(--board-ink);opacity:.55;cursor:pointer}
.bases button.on{background:var(--led);border-color:var(--led);opacity:1}
.bases .b1{right:6px;top:30px}.bases .b2{left:35px;top:4px}.bases .b3{left:6px;top:30px}
.who{font-size:.82rem;line-height:1.6;opacity:.9;grid-column:1/-1}
.hint{font-size:.72rem;opacity:.65}

/* スタメン */
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-col{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.team-col h4{margin:0;padding:8px 10px;font-size:.85rem;background:var(--surface);display:flex;justify-content:space-between}
.team-col h4 small{font-weight:400;color:var(--sub)}
.team-col ol{list-style:none;margin:0;padding:0}
.team-col li{display:grid;grid-template-columns:1.3em 1.6em 1fr;gap:4px;padding:6px 10px;border-top:1px solid var(--line);font-size:.86rem;line-height:1.5;font-variant-numeric:tabular-nums}
.team-col li .n{color:var(--sub)}
.team-col li .pos{color:var(--sub);font-size:.78rem}
.team-col li a{color:var(--ink);text-decoration:none;font-weight:700}
.team-col li.p{background:var(--surface)}

/* 記事 */
.article h2{margin:2.2em 0 .6em}
.sec-head{display:flex;align-items:flex-start;gap:10px;margin:2.2em 0 .7em}
.sec-head h2{margin:0;flex:1}
.gpt{font:inherit;font-size:.74rem;line-height:1;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:7px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.gpt svg{width:12px;height:12px}
.gpt:hover{color:var(--accent);border-color:var(--accent)}
.gpt.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gpt:focus-visible,.q:focus-visible,.guide:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:.86rem;line-height:1.7;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.article table th,.article table td,.plain th,.plain td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
ul,ol{padding-left:1.3em;margin:0 0 1.1em}
li{margin:.2em 0}
.src{font-size:.78rem;color:var(--sub);word-break:break-all;line-height:1.7}
mark{background:linear-gradient(transparent 55%,#fff176 55%);color:inherit;padding:0 1px}
strong{font-weight:700}
figure{margin:20px 0}figure img{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:8px;background:var(--surface)}
figcaption{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:6px}figcaption span{font-size:.72rem}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
textarea{width:100%;min-height:140px;font:13px/1.5 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.btn{font:inherit;font-size:.9rem;border:0;border-radius:999px;padding:9px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;margin:4px 6px 4px 0}
.btn.sub{background:var(--surface);color:var(--ink)}
@media (max-width:380px){.lineup{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

}, {"id": "1-07-c", "title": "なぜ3アウトで交代なの？", "check": false}]}, {"id": "1-08", "title": "アウトってどうやって取るの？", "star": true, "check": false, "children": [{"id": "1-08-a", "title": "三振って？見逃しと空振りの違いは？", "check": false}, {"id": "1-08-b", "title": "フライとゴロって？", "check": false}, {"id": "1-08-c", "title": "タッチアウトとフォースアウトの違いは？", "check": false}]}, {"id": "1-09", "title": "点ってどうやって入るの？", "star": true, "check": false, "children": [{"id": "1-09-a", "title": "ホームを踏んでも点にならないことがあるの？", "check": false}, {"id": "1-09-b", "title": "打点って？", "check": false}]}]}, {"no": "2", "title": "打つ・投げる・守る（プレーの仕組み）", "items": [{"id": "2-01", "title": "何点入ることが多いの？", "star": false, "check": false, "children": [{"id": "2-01-a", "title": "1点差の試合ってどれくらいある？", "check": false}, {"id": "2-01-b", "title": "大量点が入るのはどんなとき？", "check": false}]}, {"id": "2-02", "title": "Hやヒットって？", "star": true, "check": false, "children": [{"id": "2-02-a", "title": "二塁打・三塁打って？", "check": false}, {"id": "2-02-b", "title": "内野安打って？", "check": false}, {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "check": false}]}, {"id": "2-03", "title": "ホームランって？", "star": true, "check": false, "children": [{"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "check": false}, {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "check": false}, {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "check": false}]}, {"id": "2-04", "title": "エラーって？", "star": false, "check": false, "children": [{"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "check": false}, {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "check": false}]}, {"id": "2-05", "title": "守備って？", "star": false, "check": false, "children": [{"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "check": false}, {"id": "2-05-b", "title": "内野と外野は何が違う？", "check": false}, {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "check": false}, {"id": "2-05-d", "title": "中継プレーって？", "check": false}]}, {"id": "2-06", "title": "ファインプレーって？", "star": false, "check": false, "children": [{"id": "2-06-a", "title": "ゴールデングラブ賞って？", "check": : "7-02-a", "title": "何人入るの？", "check": false}, {"id": "7-02-b", "title": "ホームランラグーンって？", "check": false}]}, {"id": "7-03", "title": "スタジアムの名所、隠れ名所は？🔍", "star": false, "check": true, "children": []}, {"id": "7-04", "title": "スタジアムの特徴は？", "star": true, "check": false, "children": [{"id": "7-04-a", "title": "なぜ海風がすごいの？", "check": false}, {"id": "7-04-b", "title": "風がプレーにどう影響する？", "check": false}]}, {"id": "7-05", "title": "他にどんなスタジアムがあるの？どう違うの？", "star": false, "check": false, "children": [{"id": "7-05-a", "title": "ドームと屋外球場の違いは？", "check": false}, {"id": "7-05-b", "title": "日本ハムの本拠地エスコンフィールドとの違いは？", "check": false}]}, {"id": "7-06", "title": "ご飯はどういうのがあるの？🔍", "star": true, "check": true, "children": [{"id": "7-06-a", "title": "名物メニューは？", "check": false}, {"id": "7-06-b", "title": "選手コラボメニューは？", "check": false}, {"id": "7-06-c", "title": "モバイルオーダーは使える？", "check": false}]}, {"id": "7-07", "title": "いつのタイミングでどんなイベントがあるの？（9/28）🔍", "star": true, "check": true, "children": [{"id": "7-07-a", "title": "開場（16:00）から試合開始までに何がある？", "check": false}, {"id": "7-07-b", "title": "試合中（5回終了後・7回など）は？", "check": false}, {"id": "7-07-c", "title": "試合後は？", "check": false}, {"id": "7-07-d", "title": "今日の「秋の夜空にみんなで叫ぼう！特別招待」って？", "check": false}]}, {"id": "7-08", "title": "どうすると過ごしやすい？", "star": true, "check": false, "children": [{"id": "7-08-a", "title": "夜の海風対策は？（上着・ひざ掛け）", "check": false}, {"id": "7-08-b", "title": "雨の予報のときは？（傘の扱い）🔍", "check": true}]}, {"id": "7-09", "title": "観戦時の注意点は？🔍", "star": true, "check": true, "children": [{"id": "7-09-a", "title": "ファウルボールが飛んできたら？", "check": false}, {"id": "7-09-b", "title": "持ち込めないものは？", "check": false}, {"id": "7-09-c", "title": "再入場はできる？", "check": false}]}, {"id": "7-10", "title": "トイレにすぐ行くには？🔍", "star": true, "check": true, "children": [{"id": "7-10-a", "title": "混むタイミングはいつ？", "check": false}]}, {"id": "7-11", "title": "今日の席（1塁側・内野指定席B）から何が見える？🔍", "star": true, "check": true, "children": [{"id": "7-11-a", "title": "Cゲート（コアラゲート）からの行き方は？", "check": false}, {"id": "7-11-b", "title": "ブルペンやベンチは見える？", "check": false}]}, {"id": "7-12", "title": "帰りの混雑を避けるには？🔍", "star": false, "check": true, "children": []}]}, {"no": "8", "title": "もっと楽しむ（任意）", "items": [{"id": "8-01", "title": "野球をもっと知るには？", "star": false, "check": false, "children": [{"id": "8-01-a", "title": "テレビや配信で観るには？", "check": false}]}, {"id": "8-02", "title": "次はいつ観に行ける？", "star": false, "check": false, "children": [{"id": "8-02-a", "title": "CSや来季のチケットは？🔍", "check": true}]}]}], "articles": {}, "players": [{"team": "監督", "section": "監督カード", "name": "サブロー", "title": "サブロー（本名・大村三郎、#86、ロッテ監督、50歳）", "body": "- 特徴：「昭和のキャンプ」を掲げる猛練習派で、就任会見では「甘さを取り除く」と宣言。一方で「伸び悩む若手は我慢して使わないと開花しない」と、起用は辛抱強いタイプです。<!-- TODO: 確認（原文「昨和のキャンプ」を「昭和のキャンプ」と推定） -->\n- 見どころ：消化試合でも若手（寺地・井上・西川）を並べるのか。前々日に逆転サヨナラを喫した横山を、接戦の9回にまた送るのかも注目です。\n- 出立ち：背番号86、50歳。現役引退会見で「マリーンズを愛しています」と泣いた熱血漢です。\n- プロまで：岡山出身。PL学園から1994年ドラフト1位。知り合いのいない東京で偶然入ったちゃんこ店の店主に「出世払いでいいよ」と子どものように可愛がられ、「東京の親父」と慕った話が有名です。\n- プロで：最初のキャンプで打撃投手の伊良部秀輝の球が前に飛ばず「とんでもない世界に入った」と頭を抱えたそうです。1軍定着まで5年。山本功児監督に抜擢され、「お前がマリーンズを引っ張れ」と言われ続けました。2005年は主力として日本一。一時巨人へ移籍後に戻り、2016年に引退しました。2軍監督、ヘッドコーチを経ています。\n- 直近1年：2軍監督時代に山本大斗・寺地・西川史礁らを鍛えました。昨年6月から1軍ヘッドになりましたが、チームは8年ぶりの最下位。吉井監督の辞任で昇格しました。就任1年目の今季は5位ですが、複数年契約で来季も続投。課題は先発投手と明言しています。\n- 直近数試合：9/17にBクラスが確定し、「僕が下手くそだったのもある」と発言。一方で「山口の30本は自信になる」「小川はセカンドとして十分」と、我慢の起用の手応えを語っています。チームは直近3試合2勝1敗です。"}, {"team": "監督", "section": "監督カード", "name": "新庄剛志", "title": "新庄剛志（#1、日本ハム監督、54歳）", "body": "- 特徴：大胆な起用と演出力。先発を多めに回すローテーション運用が評価されてきました。今季は進塁打を重視する「自己犠牲」がテーマです。\n- 見どころ：勝つしかない試合。水谷・レイエス不在の打線の組み方と、福島を何回で代えて左腕をどうつぎ込むかが腕の見せどころです。\n- 出立ち：背番号1、54歳。現役時代から派手な演出で知られ、試合前後の発言も話題になります。\n- プロまで：福岡出身。西日本短大付高から阪神へ。ロッテの小野郁は高校の後輩です。\n- プロで：阪神→メッツ・ジャイアンツ（2002年にワールドシリーズ出場）→日本ハム。北海道移転初年の2004年に加入し、2006年に日本一で引退。2022年に「ビッグボス」として監督に就任し、順位は6位・6位・2位・2位と伸ばしてきました。\n- 直近1年：開幕前に「ぶっちぎりの優勝」を公言。ところが4月末は最下位で、交流戦の9連勝で持ち直しました。ソフトバンク戦は5勝18敗2分と大きく負け越しています。7/2には史上初の「初回先頭から4者連続本塁打」を記録し、「甲子園の3連発と並ぶ記憶」と大喜びしました。3年連続Aクラスは確定済みです。\n- 直近数試合：9/24の本拠地最終戦後に来季の続投（6年目）を表明。骨折した水谷には「もう塩の上で寝てほしい」、インフルエンザの加藤貴には「流行りに乗らなくても」と語っています。チームは直近3試合1勝2敗、得点は0・2・1です。<!-- TODO: 確認（「塩の上で寝てほしい」は原文ママ。意味が取れないため公開前に出典で確認） -->"}, {"team": "ロッテ", "section": "先発投手", "name": "アンドレ・ジャクソン", "title": "アンドレ・ジャクソン（#42、先発、右投右打、30歳）", "body": "- 特徴：力強い直球と落差の大きいチェンジアップ。今季144回で133奪三振と空振りを取れる一方、四球は55個と多めです。\n- 見どころ：9勝8敗、防御率3.44でチーム最多勝。勝てば2年連続の2桁勝利で、ロッテでは今季初の10勝投手になります。強風のマリンでチェンジアップがどう変化するかも注目。獲得時にサブロー監督は「マリンの風を味方につければ、打たれることはなかなかない」と評しました。\n- 出立ち：190cm・95kg。たくましい顎髭と、トレードマークのもじゃもじゃヘア。\n- プロまで：米アリゾナ州出身、ユタ大学でプレーしました。\n- プロで：ドジャース傘下（2017〜23年）からメジャーに上がり、2023年はパイレーツ。2024年にDeNAへ来日し、8勝・防御率2.90でした。日本シリーズでは初戦に先発し、中4日で第5戦にも投げました。26年ぶりの日本一に貢献し、シリーズ優秀選手になっています。2025年は10勝7敗、防御率2.33。\n- 直近1年：DeNAの保留者名簿から外れ、昨年12月にロッテと契約。開幕投手候補でしたが、3月に家事中に右手の指を負傷し出遅れました。移籍初登板は4/1の日本ハム戦（エスコン）で、5回1安打無失点で初勝利。今日はその相手との再戦です。\n- 直近数試合：9/4のオリックス戦で敗戦。その後は家族の出産に立ち会うため一時帰国しました。復帰戦の9/22オリックス戦は5回77球3安打2失点。今日は中5日です。復帰戦の球数から考えると100球前後での交代が妥当で、横山につなぐまでの6〜8回を誰で埋めるかが論点です。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "西川史礁", "title": "西川史礁（#6、左翼・1番、右投右打、23歳）", "body": "- 特徴：広角に強い打球を飛ばす中距離打者。打率.291、144安打、28二塁打と、チームのヒットメーカーです。死球は10個で、内角を強く攻められています。\n- 見どころ：残り試合で打率3割に届くか。福島・右腕陣との右対右です。\n- 出立ち：182cm・88kgのがっしり型。\n- プロまで：和歌山・日高川町出身。龍谷大平安高から青山学院大へ進み、2024年ドラフト1位で入団しました。\n- プロで：1年目の昨季は序盤こそ苦しみましたが、規定打席に到達。打率.281、リーグ最多の27二塁打で新人王になりました。\n- 直近1年：2年目のジンクスはなく、126試合で打率・安打ともチームトップ。4月には3ランを含む4安打5打点の試合もありました。1番にも中軸にも入る打線の要です。\n- 直近数試合：9/25西武戦は4番で、1点を追う8回に中越えの逆転3ラン。9/26はノーヒット（死球1）、昨日は1番で初回に内野安打で出塁し先制のホームを踏みました。3試合で10打数3安打と状態は悪くありません。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "山口航輝", "title": "山口航輝（#51、指名打者・2番、右投右打、26歳）", "body": "- 特徴：フルスイングの長距離砲。今季は32本塁打、70打点、長打率.588。直球に絞って1球で仕留めるのが信条です。\n- 見どころ：33号が出ればレイエスを抜いて本塁打単独2位。記念の30号も日本ハム戦で打っています。\n- 出立ち：183cm・100kgの巨体。\n- プロまで：秋田・明桜高から2018年ドラフト4位。入団時の発表会で「30本以上打ってホームラン王を獲りたい」と宣言しました。\n- プロで：2021年のCSでは21歳で本塁打。2022年は3打席連続本塁打を含む16本でチーム最多でした。引退する井上晴哉から後を託され、「晴哉さんの24本と99打点を超えたい」と誓っています。\n- 直近1年：昨年8月にパ・リーグタイの4打席連続本塁打。1イニング2本塁打も記録しましたが、昨季は35試合出場にとどまりました。今季は開幕から量産し、8月には月間MVPを初受賞。9/15の日本ハム戦では29・30号を放ちました。30号は9回に守護神の柳川から打った決勝弾です。球団の日本人では1986年の落合博満以来40年ぶりの30本で、「僕の夢だった」と語りました。\n- 直近数試合：9/22に32号を放ちました。一度は二塁打でしたが、ビデオ判定で本塁打になっています。9/25は2安打2打点、9/26は5打数ノーヒット。9/27は2安打で、4回に2点適時打を放ちました。9月は打率が落ち気味ですが、単打でも得点に絡んでいます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "藤原恭大", "title": "藤原恭大（#1、右翼・3番、左投左打、26歳）", "body": "- 特徴：俊足・強肩の外野手。出塁率.355で12盗塁と、出塁してかき回すタイプです。右翼からのレーザービームで、レイエスの当たりを「ライトゴロ」にしたこともあります。\n- 見どころ：3試合連続ノーヒットから抜け出せるか。右翼の守備も見どころです。\n- 出立ち：181cm・80kgのスマートな体型。\n- プロまで：大阪桐蔭で2018年に春夏連覇を達成。根尾昂らと同期の黄金世代で、同年のドラフト1位で入団しました。\n- プロで：高卒で入団してから数年は、故障や伸び悩みが続きました。毎年「今年こそ」と言われてきた選手です。\n- 直近1年：今季は99試合で打率.264、8本塁打、40打点。死球は11個です。\n- 直近数試合：3試合で12打数ノーヒットと大ブレーキ中です。9/26は3三振、昨日は併殺打もありました。ただ四球は2つ選んでおり、選球眼までは崩れていません。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "佐藤都志也", "title": "佐藤都志也（#32、捕手・4番、右投左打、28歳）", "body": "- 特徴：「打てる捕手」。今季は自己最多の17本塁打、55打点で、四球を46個選んでいます。\n- 見どころ：四球の多いジャクソンをどうリードするか。打っては4番として当たりを取り戻せるかです。\n- 出立ち：181cm・91kg。\n- プロまで：聖光学院高から東洋大。2019年ドラフト2位で入団しました。\n- プロで：田村龍弘や松川との正捕手争いを勝ち抜き、2024年にブレイク。初めて規定打席に到達し、打率.278でベストナインを初受賞しました。大学時代に慣れ親しんだ神宮でのオールスターでは6打数5安打でMVP。球団35年ぶりの球宴MVPです。プレミア12の侍ジャパンにも選ばれました。\n- 直近1年：123試合で打率.233。打率は落としましたが、長打力を大きく伸ばしました。\n- 直近数試合：3試合で13打数1安打（二塁打）と低調です。昨日は終盤に一塁へ回り、松川がマスクをかぶりました。疲労を考えると、捕手松川・一塁佐藤という並びもあり得ます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "寺地隆成", "title": "寺地隆成（#65、三塁・5番、右投左打、21歳）", "body": "- 特徴：本職は捕手ですが、打撃を生かすため今季は三塁と兼任しています。解説のT-岡田氏から「素晴らしいスイング」と評された打撃が持ち味です。\n- 見どころ：長い不振からの復活途中。今の勢いが本物かどうかです。\n- 出立ち：177cm・82kg。\n- プロまで：明徳義塾高から2023年ドラフト5位で入団しました。\n- プロで：2軍でサブロー監督（当時は2軍監督）の指導を受けました。高卒2年目の昨季には規定打席に到達し、次世代の主力と期待されています。\n- 直近1年：開幕直後は打率3割超え。ところが5月は月間打率.095と落ち込み、6月と8月の2度、2軍へ落ちました。足を上げた後の間の取り方を変えて昇格し、「とにかく2割台に乗せたい」と語っていました。\n- 直近数試合：9/16に今季初の猛打賞。9/19には3試合連続複数安打で、約4カ月ぶりに打率2割台に戻しました。昨日は初回の先制タイムリー二塁打を含む3安打で、3試合で10打数4安打です。今、打線で最も当たっている一人です。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "小川龍成", "title": "小川龍成（#57、二塁・6番、右投左打、28歳）", "body": "- 特徴：守備と小技が武器。犠打11個と、打線をつなぐ役割を担っています。\n- 見どころ：二塁の守備と、チャンスでのバントやコース打ち。\n- 出立ち：171cm・74kgの小柄な内野手。\n- プロまで：前橋育英高から國學院大。2020年ドラフト3位で入団しました。\n- プロで：長く守備固めや控えの立場でした。一年を通してフルに出場したシーズンは、今季までありませんでした。\n- 直近1年：今季は131試合に出場し打率.262。初めて二塁のレギュラーをつかみ、サブロー監督に「セカンドとして十分な成績」と評されました。\n- 直近数試合：3試合で10打数1安打。打撃は下降気味ですが、昨日は犠打と四球で得点に絡みました。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "髙部瑛斗", "title": "髙部瑛斗（#0、中堅・7番、右投左打、28歳）", "body": "- 特徴：2022年の盗塁王（44盗塁）。俊足と中堅の守備が売りです。\n- 見どころ：今いちばん当たっている打者。復帰後の勢いが続くかです。\n- 出立ち：178cm・72kgの細身。\n- プロまで：東海大甲府高から国士舘大。2019年ドラフト3位で入団しました。\n- プロで：2022年に盗塁王とゴールデングラブ賞を獲得。その後は肩の故障や手術が続きました。2024年7月に月間MVP、2025年には侍ジャパンに選ばれています。\n- 直近1年：今季は打撃不振で6月に2軍落ち。さらに7月上旬、ファームで死球を受けて右肩甲骨を骨折しました。2カ月近く実戦を離れ、その間に打撃を全て見直したそうです。\n- 直近数試合：9/25に約3カ月ぶりに1軍復帰し、当日適時打。9/26は三塁打を含む2安打2打点、昨日は2点二塁打を含む3安打。3試合で計6安打5打点です。本人は「来年に向けたアピール」と語っています。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "井上広大", "title": "井上広大（#39、一塁・8番、右投右打、25歳）", "body": "- 特徴：長打力が売りの右の大砲です。打率.171と確実性は低いものの、当たれば一発です。\n- 見どころ：9月は14試合4本塁打と量産中。「伸び悩む若手は我慢して使う」というサブロー起用の象徴です。\n- 出立ち：189cm・100kgと、チームでも指折りの大柄。\n- プロまで：履正社高の4番として、2019年夏の甲子園で優勝。同年のドラフト2位で阪神に入りました。\n- プロで：阪神では1軍に定着できず、昨オフの現役ドラフトでロッテに移りました。\n- 直近1年：移籍1年目で出場機会が大幅に増え、初めて100打席を突破しました。本人は好調の秘訣を「誰にも負けない練習量」と語り、サブロー監督も「練習のたまもの」と評価しています。\n- 直近数試合：9/26は7回に一時逆転となる7号2ラン。9/27は4回に勝ち越しの適時打を放ち、「1点欲しいところで取れた」と語りました。2試合連続で得点に絡んでいます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "山崎剛", "title": "山崎剛（#38、遊撃・9番、右投左打、30歳）", "body": "- 特徴：内外野を守れるユーティリティです。打率.226ですが、守備で存在感を示しています。\n- 見どころ：戦力外からの再起物語と、遊撃の守備。\n- 出立ち：173cm・74kgと小柄です。\n- プロまで：福岡出身。日章学園高（甲子園出場なし）から國學院大へ。小川龍成と同じ大学です。2017年ドラフト3位で楽天に入りました。\n- プロで：楽天では2023年に遊撃中心に117試合に出場。その後は故障や自律神経の病気に苦しみ、昨年は左膝の手術で1軍出場なし。オフに戦力外になりました。それでも「やれる自信がある、育成でもかまわない」と現役続行を訴えました。\n- 直近1年：ロッテと育成契約し、「サブロー監督を男にする」と誓いました。6/5に支配下に復帰して背番号38に。「何回も戻れないかもと思った」と語り、6/13には3年ぶりの安打を放っています。今季は56試合に出場しました。\n- 直近数試合：9/26は2安打、9/27は犠打を決めました。宮崎竜成との遊撃争いで、直近は山崎が先発を引き寄せています。"}, {"team": "ロッテ", "section": "スタメン候補", "name": "安田尚憲", "title": "安田尚憲（#5、内野、右投左打、27歳）", "body": "- 特徴：左の長距離砲。今季は73試合で打率.262、6本塁打、16二塁打と、確実性も上がっています。\n- 見どころ：高校時代のライバル清宮が、今日通算100号に王手。同じ試合で安田の一発も見られるかです。\n- 出立ち：188cm・100kgの大柄。\n- プロまで：履正社高時代は「東の清宮、西の安田」と並び称されました。清宮と同じ2017年のドラフト1位で入団しています。\n- プロで：若くして4番を任された時期もありました。その後は三塁・一塁のレギュラー争いに揺れ、打撃フォームも試行錯誤を重ねてきました。\n- 直近1年：キャンプでは「ライバルに勝てるように」と競争に臨みました。寺地の三塁起用と並行して出番を分け合っています。\n- 直近数試合：9/25は7番一塁で先発し、3打数ノーヒット。9/26・27は井上が一塁に入り、出番はありませんでした。右投手の福島相手なら、左の安田が起用される可能性もあります。"}, {"team": "ロッテ", "section": "スタメン候補", "name": "松川虎生", "title": "松川虎生（#2、捕手、右投右打、22歳）", "body": "- 特徴：高卒ルーキーで開幕マスクをかぶった、落ち着きのあるリードの捕手です。打撃は打率.189と課題です。\n- 見どころ：リード時の守備固めで登場し、横山とのバッテリーで試合を締められるか。\n- 出立ち：178cm・98kgのがっしりした体格。\n- プロまで：市立和歌山高から2021年ドラフト1位で入団しました。\n- プロで：1年目の2022年に開幕マスク。同年には佐々木朗希の完全試合を、高卒ルーキーとしてリードしました。その後は佐藤の台頭で控えに回っています。\n- 直近1年：今季は44試合に出場。解説者からは「リードはまだまだ勉強」と指摘されるなど、成長途上です。\n- 直近数試合：昨日は終盤に佐藤からマスクを引き継ぎ、1打数ノーヒット（三振）。佐藤が低調なので、先発マスクもあり得ます。"}, {"team": "ロッテ", "section": "スタメン候補", "name": "宮崎竜成", "title": "宮崎竜成（#44、内野、右投左打、25歳）", "body": "- 特徴：走攻守の三拍子型で、広角に長打を打てる内野手。入団時に「将来はトリプルスリーを狙える選手に」と語っています。\n- 見どころ：遊撃での先発チャンスを生かせるか。\n- 出立ち：173cm・90kgの小柄なパワー型。\n- プロまで：徳島出身。母はアトランタ五輪のソフトボール日本代表、児玉千佳さんです。創志学園高で春夏の甲子園に出場しました。立命館大では指名漏れを経験しています。社会人のヤマハでは「他の人が遊びに行く時に休養し、寝る時間も決めた」という野球漬けの2年間を過ごしました。2024年ドラフト2位で入団。好きなロッテのお菓子はアーモンドチョコレートとクランキーだそうです。\n- プロで：1年目の昨季は2軍で6本塁打。1軍では7月にプロ初安打を放ちましたが、打率.194と壁に当たりました。\n- 直近1年：今季は41試合で打率.132、1本塁打。山崎剛の加入で遊撃の出番を争っています。\n- 直近数試合：9/25は8番遊撃で先発し、2打数2三振で途中交代。その後2試合は山崎が先発しています。"}, {"team": "ロッテ", "section": "ブルペン", "name": "横山陸人", "title": "横山陸人（#15、抑え、右投右打、25歳）", "body": "- 特徴：力強い直球で押すクローザー。52登板で33セーブ、防御率2.50です。\n- 見どころ：前々日の逆転サヨナラ負けから立ち直れるか。\n- 出立ち：180cm・90kg。\n- プロまで：千葉の専大松戸高から2019年ドラフト4位で入団しました。\n- プロで：中継ぎで頭角を現し、2024年には佐藤・鈴木とともにプレミア12の侍ジャパンに選ばれました。\n- 直近1年：今季は守護神に定着し、リーグ上位の33セーブ。\n- 直近数試合：9/25は1回無失点。9/26は2点リードの9回に4連打を浴び、1死も取れず逆転サヨナラ負けでした。昨日は登板なしです。"}, {"team": "ロッテ", "section": "ブルペン", "name": "鈴木昭汰", "title": "鈴木昭汰（#47、セットアッパー、左投左打、28歳）", "body": "- 特徴：横山と並ぶチーム最多の52登板、30ホールド、防御率2.54。左の勝ちパターンの柱です。\n- 見どころ：3連投中で、今日は休養が濃厚。登板すれば、それだけ勝負をかけた場面ということです。\n- 出立ち：175cm・80kg。\n- プロまで：常総学院高から法政大。2020年ドラフト1位で入団しました。\n- プロで：先発から救援に転じて開花。横山らと共にプレミア12の代表に選ばれました。\n- 直近1年：今季は救援で6勝も挙げています。\n- 直近数試合：9/23に敗戦投手。その後9/25〜27に3連投し、9/26は1失点でした。疲労が気になる時期です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "中森俊介", "title": "中森俊介（#56、勝ちパターン、右投左打、24歳）", "body": "- 特徴：救援で7勝1敗、16ホールド、防御率2.35。接戦の終盤を任され、味方の逆転を呼ぶ投手です。\n- 見どころ：鈴木が休むなら、7・8回の大事な場面は彼か八木です。\n- 出立ち：183cm・90kg。\n- プロまで：明石商高のエースとして2019年の甲子園で春夏ともベスト4。同期にはオリックスの来田涼斗がいます。2020年ドラフト2位で入団しました。\n- プロで：先発と中継ぎの両方を経験しながら、救援で居場所をつかみました。\n- 直近1年：今季は救援で勝ち星を重ね、9月だけで3勝。<!-- TODO: 確認（原文「勝利を呼ぶ変化で」を言い換え） -->\n- 直近数試合：9/9の楽天戦、9/15の日本ハム戦（山口の30号決勝弾）、9/25の西武戦で勝利投手。2日間の休養明けです。"}, {"team": "ロッテ", "section": "ブルペン", "name": "八木彬", "title": "八木彬（#33、勝ちパターン、右投右打、29歳）", "body": "- 特徴：150キロ前後の力強い直球。44登板で救援9勝1敗、11ホールド、防御率2.17と、キャリアハイの年です。\n- 見どころ：救援での2桁勝利まであと1。同点や僅差の場面で出てくると実現します。\n- 出立ち：180cm・94kgのがっしり型。\n- プロまで：和歌山出身。八戸学院光星高で甲子園に出場し、東北福祉大から社会人の三菱重工Westへ。都市対抗で151キロを記録し、2021年ドラフト5位で入団しました。\n- プロで：昨季は自己最多の27登板でしたが防御率5点台。終盤に7試合連続無失点と、手応えをつかみました。\n- 直近1年：4/15にプロ初勝利（記念グッズの名は「まさかこんな形で」）。4/29には球団史上8人目の「1球勝利」でハーラートップに並び、「日ごろの行いがいいんかな」と笑わせました。美馬学コーチの「しっかり勝負しよう」という助言で良くなったそうです。<!-- TODO: 確認（記念グッズ名） -->\n- 直近数試合：9/22のオリックス戦で今季初黒星を喫しています。その後は登板間隔が空いており、今日は待機濃厚です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "益田直也", "title": "益田直也（#52、ベテラン右腕、右投右打、36歳）", "body": "- 特徴：ルーキーからロッテ一筋で投げ続ける「幕張の鉄腕」。今季は36登板で防御率3.22。\n- 見どころ：節目を積み重ねるレジェンドの登板そのものが見どころです。\n- 出立ち：179cm・80kg。\n- プロまで：関西国際大から2011年ドラフト4位で入団しました。\n- プロで：中継ぎと抑えを行き来しながら、長年ロッテのブルペンを支えてきました。\n- 直近1年：今季は通算250セーブで名球会入り。「250は通過点」と語り、9月には通算800試合登板も達成しました。\n- 直近数試合：昨日は8回から登板し、1回1安打3奪三振で無失点と健在です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "小野郁", "title": "小野郁（#37、中継ぎ、右投右打、29歳）", "body": "- 特徴：剛速球とチェンジアップが武器。昨季は自己最速の159キロを記録しています。今季は38登板で防御率2.40。\n- 見どころ：新庄監督の高校の後輩が、先輩のチーム相手に投げる場面。\n- 出立ち：175cm・78kgと投手としては小柄です。\n- プロまで：福岡の西日本短大付高から2014年ドラフト2位で楽天へ。入団時には二刀流を打診されたこともありました。\n- プロで：楽天では1軍未勝利。鈴木大地のFA移籍の人的補償として2019年オフにロッテへ移り、中継ぎで開花しました。\n- 直近1年：昨季は47登板、10ホールド。今季も安定した数字を残しています。\n- 直近数試合：9/5に敗戦投手。直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "澤田圭佑", "title": "澤田圭佑（#54、中継ぎ、右投左打、32歳）", "body": "- 特徴：41登板、11ホールドのタフな右腕。四球が少なく、40回1/3で与四球は7です。\n- 見どころ：四球を出さない安定感で、走者を溜めた場面の火消しを担います。\n- 出立ち：178cm・96kgのがっしり型。\n- プロまで：大阪桐蔭高では藤浪晋太郎と同期で、2012年の春夏連覇を経験。立教大から2016年ドラフト8位でオリックスに入りました。\n- プロで：オリックスで戦力外になり、ロッテで育成から支配下に這い上がった苦労人です。\n- 直近1年：今季も中継ぎの一角として1年を投げ抜いています。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "坂本光士郎", "title": "坂本光士郎（#36、左の中継ぎ、左投左打、32歳）", "body": "- 特徴：球威のある直球が持ち味の左腕。33回2/3で39奪三振と、投球回を超える三振を奪っています。\n- 見どころ：清宮や水野、田宮といった日本ハムの左打者に当てるワンポイント起用。\n- 出立ち：179cm・80kg。\n- プロまで：広島出身。如水館高で甲子園に出場し、日本文理大、社会人の新日鉄住金広畑を経て、2018年ドラフト5位でヤクルトに入りました。\n- プロで：ヤクルトでは2021年に36登板し、リーグ優勝に貢献。プロ初勝利も挙げました。2022年7月に山本大貴とのトレードでロッテへ移籍しています。\n- 直近1年：昨季は8登板、防御率6点台と不振。今季は27登板で防御率3.21と復活し、交流戦では故郷の広島で好投しました。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "髙橋快秀", "title": "髙橋快秀（#93、若手右腕、右投右打、20歳）", "body": "- 特徴：最速154キロの伸びのある直球と、キレのあるスライダー。プロではフォークも磨いています。\n- 見どころ：育成出身ルーキーの成長。昨日のように勝ち試合でも起用され始めています。\n- 出立ち：178cm・82kg。支配下を目指す過程で体重が約3キロ増え、球速も上がったそうです。\n- プロまで：香川・多度津高から、大学の誘いを断って独立リーグの徳島インディゴソックスへ。「1年でも早くNPBに入りたかった」からだそうです。昨秋の育成ドラフト2位で入団しました。\n- プロで：1年目の今季、2軍で16試合に登板して防御率0.00。7/30に支配下を勝ち取りました。「同期の独立リーグ出身者の中で一番活躍したい」が原動力だそうです。\n- 直近1年：8/7の1軍デビュー戦では自己最速154キロを計測。フォークで来田から初奪三振を奪い、1回無失点でした。本人は「ファームでも投げたことのないくらい落ちた」と語っています。\n- 直近数試合：今季4登板で防御率9.00。ただ昨日は7回に1回無失点1奪三振で、ホールドを記録しました。"}, {"team": "ロッテ", "section": "ブルペン", "name": "宮﨑颯", "title": "宮﨑颯（#66、左腕、左投左打、26歳）", "body": "- 特徴：威力のある直球が武器のサウスポーです。\n- 見どころ：大差がついた場面での登板が中心。来季へのアピールの場です。\n- 出立ち：180cm・93kg。\n- プロまで：埼玉栄高から東京農大。2022年の育成ドラフト8位でソフトバンクに入りました。\n- プロで：1年目に左肘のトミー・ジョン手術。3年目の昨年7月に支配下となり、8/5のロッテ戦では藤原からプロ初奪三振。ところがオフに戦力外となりました。ソフトバンクからは育成再契約を打診されましたが、ロッテが支配下で獲得しています。\n- 直近1年：野球を始めた頃から書き続けるノートがホークス時代に18冊。それを携えて幕張に来ました。今季は10登板で防御率6.17です。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "ソト", "title": "ソト（#99、内野、右投右打、37歳）", "body": "- 特徴：経験豊富な助っ人スラッガー。今季は打率.222ながら17本塁打、47打点です。\n- 見どころ：終盤の勝負所での代打。一発で流れを変えられます。\n- 出立ち：185cm・97kg。\n- プロまで：プエルトリコ出身で、米国のマイナーでプレーした後に来日しました。\n- プロで：DeNA時代に2年連続で本塁打王。ロッテ移籍後も主軸を担ってきました。\n- 直近1年：6月の巨人戦でNPB通算200号。「NPBで200本打てるなんて…」と感慨を語りました。\n- 直近数試合：9/25は代打から一塁に入り、9回に中前打でチャンスを広げました。9/26・27は出番なしです。"}, {"team": "ロッテ", "section": "代打・代走", "name": "上田希由翔", "title": "上田希由翔（#10、内野、右投左打、25歳）", "body": "- 特徴：左の強打者。今季は57試合で打率.221、7本塁打です。\n- 見どころ：右投手相手の代打。山崎・小川の打席で送られる可能性があります。\n- 出立ち：183cm・96kg。\n- プロまで：愛産大三河高から明治大。2023年ドラフト1位で入団しました。\n- プロで：定位置はつかめていません。ドラフトでの指名順を指した自虐ネタのぼやきが、ファンの笑いを誘ったこともあります。\n- 直近1年：一塁・三塁で安田や寺地と競いながら、出場機会を増やしました。\n- 直近数試合：直近3試合の出場はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "池田来翔", "title": "池田来翔（#00、内野・代走、右投右打、26歳）", "body": "- 特徴：内野をどこでも守れるユーティリティ。今季は80試合出場で打席は88と、代走・守備固めが主な仕事です。\n- 見どころ：終盤に一塁走者が出たときの代走。\n- 出立ち：180cm・95kgと、代走要員にしてはがっしりした体格です。\n- プロまで：千葉出身で、小学時代はマリーンズジュニアに選ばれました。習志野高から国士舘大へ進み、「強打の二塁手」として2021年ドラフト2位で入団しました。\n- プロで：昨季は自己最多の83試合に出場し、5本塁打とパンチ力を見せました。\n- 直近1年：今季は打率.224、本塁打は0です。キャンプ地・都城市とのコラボメニューがZOZOマリンで販売されるなど、球場内での露出もあります。\n- 直近数試合：9/25・26と連日、終盤に一塁走者の代走で出場。打席はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "山本大斗", "title": "山本大斗（#61、外野、右投右打、24歳）", "body": "- 特徴：吉井前監督が「ダイナマイト」と命名した右の大砲。今季は打率.183、2本塁打と苦しんでいます。\n- 見どころ：左腕が出てきた場面の代打。山口とも仲が良く、ベンチの盛り上げ役です。\n- 出立ち：180cm・88kg。登場曲にはケンドリック・ラマーやサンボマスターを使っています。\n- プロまで：鳥取出身。島根の開星高から2020年の育成ドラフト3位で入団しました。\n- プロで：2022年途中に支配下。イースタンでタイトルを獲るなどし、2025年は4月にプロ初本塁打。6・7月は4番を打ち、オールスターにも初出場しました。107試合で11本塁打です。\n- 直近1年：今季は確実性を課題に挑みましたが、71試合で打率.183。7月にはファームで3試合連続複数安打を記録しました。\n- 直近数試合：直近3試合の出場はありません。"}, {"team": "日本ハム", "section": "先発投手", "name": "福島蓮", "title": "福島蓮（#45、先発、右投右打、23歳）", "body": "- 特徴：テイクバックの小さいフォーム。長身から角度のある直球とフォークが武器です。75回1/3で78奪三振と、投球回を超える三振を奪っています。\n- 見どころ：負けたらほぼ終わりの試合で、約2カ月半ぶりの先発。中継ぎからの転換で、何回まで持つか。調子の良い山口や西川史礁との右対右も注目です。\n- 出立ち：190cm・81kgの細身長身。登場曲は嵐で、嵐のラストライブに感動したと語っています。\n- プロまで：青森・八戸西高で、21世紀枠で創部初の甲子園に出場。「憧れは大谷翔平」と語り、2021年の育成ドラフト1位で入団しました。本人は「日本ハムからの指名はないかなと思っていた」そうです。\n- プロで：2024年3月に支配下契約。育成からのエース、ソフトバンクの千賀滉大を目指す「千賀2世」を掲げました。4月のデビュー戦は5回5奪三振2失点。昨季は春先の不調を乗り越え、8先発で5勝0敗、防御率2.25。クライマックスシリーズでも8回途中2失点10奪三振と好投しました。\n- 直近1年：背番号が94から45になり、ローテ定着と2桁勝利を目指したシーズン。前半は先発ローテーションに入り、後半は救援に回りました。「代理守護神」としてプロ初セーブも挙げ、「マウンドでハイタッチは初めて」と喜びました。今季は26登板で5勝4敗1S5H、防御率3.35。\n- 直近数試合：9月は救援7試合すべて無失点、3ホールド、1セーブです。状態の良さを買われての先発ですが、長いイニングは投げていません。球数は60〜80球、3〜5回での継投が濃厚です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "水野達稀", "title": "水野達稀（#43、遊撃・1番、右投左打、26歳）", "body": "- 特徴：今季大ブレイクした「打てる遊撃手」。打率.285、11本塁打、29二塁打、チーム最多の15盗塁です。積極的に打ちにいくスタイルで、三塁打も多く打っています。\n- 見どころ：初回の第1打席。出塁して清宮の前に走者を置けるかが、得点の鍵になります。\n- 出立ち：171cm・80kgの小柄でがっしり型。他球団から「近藤健介と重なる」と評されています。\n- プロまで：香川出身。丸亀城西高から社会人のJR四国を経て、2021年ドラフト3位で入団しました。\n- プロで：1・2年目は打率1割台。そこから打率.220、.247と毎年数字を上げ、2年連続で100試合に出場しました。\n- 直近1年：契約更改では「ボスを日本一監督にする」と誓いました。5月からはリードオフマンに定着し、一時は打率リーグ2位に。「ショートが打てるチームは強い」と語っています。7/2の史上初の「初回先頭から4者連続本塁打」では、2人目として勝ち越し弾を放ちました。\n- 直近数試合：3試合で10打数1安打と下降気味です。9/26は死球と犠打でつなぎ、昨日は初回に右前打。当たりが止まっているのが、打線の得点力低下につながっています。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "田宮裕涼", "title": "田宮裕涼（#64、捕手・2番、右投左打、26歳）", "body": "- 特徴：打てて走れる捕手。強肩の送球は「ゆあビーム」と呼ばれます。打率.266、三塁打4本です。\n- 見どころ：福島とのバッテリー、ロッテの走者への送球、そして地元千葉での凱旋打。\n- 出立ち：175cm・84kg。\n- プロまで：千葉・成田高から2018年ドラフト6位で入団しました。\n- プロで：下位指名から道を切り開き、プロ6年目の2024年に初スタメンからブレイク。一時はリーグトップの打率を残しました。\n- 直近1年：今季は93試合で打率.266、7本塁打。進藤と捕手を分け合い、新庄監督は試合途中に捕手を代える采配もよく見せます。\n- 直近数試合：9/24は代打で三振。9/26のオリックス戦は2番捕手で出場し、0-0の8回に決勝タイムリーを放ちました。昨日は出場なしで、今日は捕手で先発の番と見ています。<!-- TODO: 確認（原文「零行列の8回」を「0-0の8回」と推定） -->"}, {"team": "日本ハム", "section": "予想スタメン", "name": "清宮幸太郎", "title": "清宮幸太郎（#21、指名打者・3番、右投左打、27歳）", "body": "- 特徴：今季は23本塁打、65打点と長打力を発揮。四球を47個選んでいます。\n- 見どころ：通算100号まであと1本。今日最大の節目です。\n- 出立ち：184cm・95kg。\n- プロまで：早稲田実業で高校通算111本塁打。履正社の安田（現ロッテ）と「東の清宮、西の安田」と称されました。2017年ドラフトでは7球団が競合した超目玉です。\n- プロで：初本塁打はルーキーの2018年5月9日、オリックス戦でした。その後は故障や伸び悩みが長く、「ブレイク待ち」と言われ続けました。2018年のルーキーが、今日100本目を狙っています。\n- 直近1年：開幕直後のロッテ戦では1試合2本塁打。どちらもレイエスとの2者連続弾でした。シーズンを通して中軸を打ち、132試合に出場しています。\n- 直近数試合：9月は14安打のうち7本が本塁打という極端な当たり方。9/24はノーヒット、9/26は9回にダメ押しの23号ソロ。昨日は3打数ノーヒット（1四球）です。単打より一発に賭ける状態なので、ジャクソンの失投を一振りで仕留められるかが論点です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "野村佑希", "title": "野村佑希（#5、一塁・4番、右投右打、26歳）", "body": "- 特徴：右の中軸打者。今季は115試合で打率.260、17本塁打、60打点です。\n- 見どころ：レイエス不在の4番として、ジャクソンの直球を打てるか。\n- 出立ち：187cm・95kgの大柄。\n- プロまで：花咲徳栄高で夏の甲子園優勝を経験。2018年ドラフト2位で入団しました。\n- プロで：高卒数年で中軸を任された生え抜きです。三塁と一塁を行き来してきました。後輩の有薗は入団時に「目標は野村さん」と弟子入りを志願しています。\n- 直近1年：レイエス・清宮・万波と中軸を組み、チームの本塁打量産を支えました。レイエス離脱後は4番を担っています。\n- 直近数試合：9/24は3番指名打者で投手内野安打。9/26は途中から左翼に入り右前打。昨日は4番一塁で2三振の後、9回に左前打でした。3試合で9打数3安打と、打線では数少ない当たりが続いている打者です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "万波中正", "title": "万波中正（#66、右翼・5番、右投右打、26歳）", "body": "- 特徴：巨体からの長打と、右翼からの強肩。今季は21本塁打ですが、三振も109と多いです。\n- 見どころ：右翼からの返球と、海風に負けない一発。\n- 出立ち：192cm・102kgの大柄で、父はコンゴ出身です。\n- プロまで：横浜高から2018年ドラフト4位で入団。清宮の1学年下にあたります。\n- プロで：新庄監督の下で開花し、2023年には25本塁打で本塁打王争いを演じました。\n- 直近1年：春には「定位置の確約なし」と言われるほど外野の競争が激しかった年です。7/2の4者連続本塁打では4人目を担い、「ちょっと理解できない」と漏らしました。8/21に下半身の不調で離脱。ファーム復帰戦では4安打を放ち、9/15に1軍に戻りました。\n- 直近数試合：3試合で11打数1安打。昨日も2三振と、復帰後は調子が上がりきっていません。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "有薗直輝", "title": "有薗直輝（#39、三塁・6番、右投右打、23歳）", "body": "- 特徴：広角に長打を飛ばす右の長距離砲。肩の強さも売りです。\n- 見どころ：実は小6の時にマリーンズジュニアに選ばれた千葉育ち。ZOZOマリンでの一発なるかです。\n- 出立ち：185cm・104kgの巨体。\n- プロまで：マリーンズジュニア時代は、体育のバスケで右手中指を痛めて大会では控えでした。中学の佐倉シニアでは本塁打を量産するタイプではありませんでした。それが千葉学芸高で開花し、甲子園出場なしながら高校通算70本塁打。2021年ドラフト2位で入団しました。\n- プロで：1年目から新庄監督に「思い切りがいい」と評され、1軍に初昇格しました。昨季はイースタンで首位打者・本塁打王・最高出塁率の3冠。8月に1軍で待望のプロ初安打を放ちました。\n- 直近1年：「1軍でホームラン量産」を誓った今季は、32試合で打率.240、1本塁打。8月上旬には5試合連続安打も記録しました。\n- 直近数試合：3試合で9打数ノーヒット、5三振。昨日は途中で奈良間に交代しており、郡司や奈良間が三塁で先発する可能性もあります。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "山縣秀", "title": "山縣秀（#54、二塁・7番、右投右打、24歳）", "body": "- 特徴：「リアル殿馬」と呼ばれる守備職人。打率.222ですが、犠打やセーフティーバントもこなします。\n- 見どころ：二遊間で水野と組む守備。\n- 出立ち：176cm・82kg。特技はピアノで、起業にも関心がある文武両道型です。\n- プロまで：東京・国分寺出身。都内屈指の難関校、早大学院から早稲田大へ進みました。入学時の目標は「4年秋に守備固めでベンチ入り」でしたが、2年秋には遊撃のレギュラーに。小宮山悟監督に「六大学で一番うまいショートになる可能性がある」と言わしめました。4年春には打率.366でベストナインとリーグ優勝。大学日本代表でも世界大会優勝を経験し、2024年ドラフト5位で入団。同校出身のプロは66年ぶり2人目です。\n- プロで：指名時の目標は「何回でもゴールデングラブ賞を」。1年目の昨季は球団新人で一番乗りの1軍昇格を果たしました。初スタメン初打席初安打、6月にはプロ1号が決勝弾になりました。\n- 直近1年：2年目の今季は「二遊間に山縣がいなきゃいけない選手に」と誓いましたが、58試合の出場。ルーキーの大塚と二塁を分け合っています。推しは球団マスコットのポリーちゃんだそうです。\n- 直近数試合：9/24・26は大塚が先発しました。昨日は7番二塁で中前打を放ち、9回に西川遥輝が代打に出ました。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "矢澤宏太", "title": "矢澤宏太（#12、中堅・8番、左投左打、26歳）", "body": "- 特徴：身体能力が高く、走塁と守備が売りです。今季は三塁打4本。登録上は投手の二刀流です。\n- 見どころ：中堅の広い守備範囲と全力疾走。大差がつけば投手としての登板もゼロではありません。\n- 出立ち：173cm・72kgと、プロでは小柄な体格です。\n- プロまで：藤嶺藤沢高から日体大。大学3年で二刀流が開花し、「投手でも野手でも1位」と評されました。2022年ドラフト1位で入団しています。\n- プロで：入団後は二刀流に挑戦。昨季は外野に専念して自己最多の86試合に出場し、打率.247でした。CSでは「打球は1秒も見ず、歓声と三塁コーチの反応で走った」という全力疾走を見せています。\n- 直近1年：今季は「外野手でレギュラーを獲る。センターが固まれば強いチームになる」と宣言。ところが5/23のソフトバンク戦では、9点ビハインドの8回に2年ぶりに投手として登板しました。近藤を遊飛に打ち取り、場内を騒然とさせています。\n- 直近数試合：9/26は三塁打を含む3安打と大活躍。昨日は内野ゴロ3つでした。調子の波はありますが、今の打線では貴重な当たりです。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "宮崎一樹", "title": "宮崎一樹（#36、左翼・9番、右投右打、25歳）", "body": "- 特徴：パワーとスピードを兼ね備える外野手。今季の1軍は数試合で、昨日が抜擢でした。\n- 見どころ：水谷の骨折で回ってきたチャンスを生かせるか。昨日は2番で起用されました。\n- 出立ち：184cm・91kg。登場曲はMrs. GREEN APPLEの「Soranji」です。\n- プロまで：実家は東京・日野市のそば屋「増田屋」。山梨学院高ではレギュラーになれませんでしたが、臨時コーチの小倉清一郎氏が素質を見抜いていました。山梨学院大で開花し、3年秋は打率.600、5本塁打。日米大学野球の代表にも選ばれ、2023年ドラフト3位で入団しました。<!-- TODO: 確認（原文「謎屋」を「そば屋」と推定） -->\n- プロで：1年目の5月31日に初昇格し、新庄監督から「鎌ヶ谷だと思ってやれ」と声をかけられました。昨季は2軍で85試合に出場し、1軍ではプロ初タイムリーを放っています。\n- 直近1年：今季も多くの時間を2軍で過ごしました。1軍では昨日までに17打数2安打、1本塁打です。\n- 直近数試合：昨日は2番左翼で先発し、3回に右前打を放っています。実は高校時代の2019年センバツで、今のチームメイト進藤勇也がいた筑陽学園と対戦しています。"}], "lineup": [["1", "西川史礁（左翼）", ".291・8", "水野達稀（遊撃・左）", ".285・11"], ["2", "山口航輝（指名）", ".275・32", "田宮裕涼（捕手・左）", ".266・7"], ["3", "藤原恭大（右翼・左）", ".264・8", "清宮幸太郎（指名・左）", ".242・23"], ["4", "佐藤都志也（捕手・左）", ".233・17", "野村佑希（一塁）", ".260・17"], ["5", "寺地隆成（三塁・左）", ".204・5", "万波中正（右翼）", ".255・21"], ["6", "小川龍成（二塁・左）", ".262・2", "有薗直輝（三塁）", ".240・1"], ["7", "髙部瑛斗（中堅・左）", ".225・0", "山縣秀（二塁）", ".222・0"], ["8", "井上広大（一塁）", ".171・7", "矢澤宏太（中堅・左）", ".221・3"], ["9", "山崎剛（遊撃・左）", ".226・1", "宮崎一樹（左翼）", ".077・1"], ["投", "ジャクソン（右）9勝8敗・防御率3.44", "", "福島蓮（右）5勝4敗・防御率3.35", ""]], "today": "# 今日の試合の基本情報（2026/9/28 時点。記事執筆の前提）\n\n- 試合：千葉ロッテマリーンズ（ホーム・後攻・1塁側）vs 北海道日本ハムファイタ const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[^"])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
function md(src){
  src = src.replace(/<!--[\s\S]*?-->/g,'');
  const out=[]; let list=null, para=[], table=null;
  const flush=()=>{ if(para.length){out.push('<p>'+inline(para.join(''))+'</p>');para=[]}
    if(list){out.push('<ul>'+list.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>');list=null}
    if(table){out.push('<div class="scroll"><table>'+table.filter(r=>!/^\|\s*-/.test(r)).map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>i?'<td>'+inline(c.trim())+'</td>':'<th>'+inline(c.trim())+'</th>').join('')+'</tr>').join('')+'</table></div>');table=null} };
  for(const raw of src.split('\n')){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){flush();continue}
    if(l.startsWith('|')){ if(!table){flush();table=[]} table.push(l); continue }
    if((m=l.trim().match(/^!\[([^\]]*)\]\((https:\/\/[^\s)]+)(?:\s+"([^"]*)")?\)$/))){flush();out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy" onerror="this.closest('figure').hidden=true"><figcaption>${esc(m[1])}${m[3]?`<br><span>${esc(m[3])}</span>`:''}</figcaption></figure>`);continue}
    if((m=l.match(/^(#{1,4}) (.+)/))){flush();const n=Math.max(3,m[1].length);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue}
    if((m=l.match(/^\s*[-*] (.+)/))){ if(para.length||table)flush(); (list=list||[]).push(m[1]); continue }
    if(list){flush()} para.push(l.trim());
  }
  flush(); return out.join('');
}

const newPlayer = (name, team) => `${CTX}\n\n${team}の「${name}」選手が今日出ています。観戦ガイドにこの選手のカードがないので、次の7項目で教えてください。\n- 特徴：\n- 見どころ：\n- 出立ち：（体格・背番号・投打など）\n- プロまで：\n- プロで：\n- 直近1年：\n- 直近数試合：${RULES}${TODAY()}`;

/* ---- 疑問ツリーとガイド ---- */
const allQ = {}; D.tree.forEach(c=>c.items.forEach(i=>{allQ[i.id]={...i,cat:c};i.children.forEach(ch=>allQ[ch.id]={...ch,parent:i.id,cat:c})}));
const has = id => !!D.articles[id];
const GUIDES = {
  basics: {title:'野球初心者ガイド', desc:'ルール、プレーのしくみ、選手の考えていること', cats:['1','2','3','4','8']},
  game:   {title:'ロッテ対日本ハムを楽しむガイド', desc:'今日の試合の見どころ、両チーム、応援', cats:['5','6']},
  stadium:{title:'マリーンズスタジアムガイド', desc:'ZOZOマリンのご飯、イベント、過ごし方', cats:['7']},
};
const BOARD_QS = ['4-01','1-07','1-06','4-02','1-04','1-05','2-12','2-13','1-08','1-09','2-02','2-14','2-11','2-10','2-09','2-17','4-03','4-04','4-06','5-06'];
const clean = t => t.replace(/🔍/g,'').replace(/[（(]→[^）)]*[）)]/g,'').trim();
function qBtn(q){
  if(q.id==='5-07' && !has(q.id)) return `<a class="q" href="#/lineup">${esc(clean(q.title))}<small>スタメンと選手カード</small></a>`;
  return has(q.id) ? `<a class="q" href="#/q/${q.id}">${esc(clean(q.title))}</a>`
                   : `<a class="q off" href="#/q/${q.id}">${esc(clean(q.title))}<small>準備中・GPTに聞けます</small></a>`;
}

/* ---- ライブ（写真・タップで更新。この端末だけに保存） ---- */
function loadLive(){ try{ return JSON.parse(localStorage.getItem('live')||'{}') }catch(e){ return {} } }
function saveLive(v){ try{ localStorage.setItem('live', JSON.stringify(v)); return true }catch(e){ return false } }
const norm = x => String(x).replace(/[（(].*$/,'').replace(/\s/g,'').replace(/髙/g,'高').replace(/﨑/g,'崎');
function findP(cell){ const name = norm(cell); if(!name) return -1;
  return D.players.findIndex(p=>{ const n=norm(p.name); return n===name || n.endsWith(name) || (name.length>=2 && name.startsWith(n)) }) }
function pLink(cell, team){ const i = findP(cell);
  return i<0 ? esc(norm(cell))+(team?' '+gptBtn(newPlayer(norm(cell),team),'カード'):'') : `<a href="#/p/${i}">${esc(norm(cell))}</a>` }
const POS = {'左翼':'左','中堅':'中','右翼':'右','一塁':'一','二塁':'二','三塁':'三','遊撃':'遊','捕手':'捕','指名':'指','投手':'投'};
const posOf = cell => { const m=String(cell).match(/[（(]([^・）)]+)/); return m ? (POS[m[1]]||m[1]) : '' };

function lineScore(sc){
  sc = sc||{}; const n=Math.max(9,(sc.lotte||[]).length,(sc.fighters||[]).length), cols=[...Array(n)].map((_,i)=>i+1);
  const g=(o,k)=>o&&o[k]!=null?esc(o[k]):'';
  const row=(lab,arr,k)=>`<tr><td class="team">${lab}</td>${cols.map(i=>`<td>${arr&&arr[i-1]!=null?esc(arr[i-1]):''}</td>`).join('')}<td class="r sum">${g(sc.R,k)}</td><td>${g(sc.H,k)}</td><td>${g(sc.E,k)}</td></tr>`;
  return `<div class="ls"><table><tr><th></th>${cols.map(i=>`<th>${i}</th>`).join('')}<th class="sum">R</th><th>H</th><th>E</th></tr>`+
    row('日ハム',sc.fighters,'fighters')+row('ロッテ',sc.lotte,'lotte')+'</table></div>';
}
function board(){
  const v = loadLive(), sc = v.score||{}, st = {B:0,S:0,O:0,bases:[0,0,0],...(sc.count||{}),...(v.state||{})};
  if(sc.bases && !(v.state&&v.state.bases)) st.bases = sc.bases;
  const lamps = (k,n,cls)=>`<span>${k}</span><button data-k="${k}" aria-label="${k}を変更">${[...Array(n)].map((_,i)=>`<span class="lamp ${i<st[k]?cls:''}"></span>`).join('')}</button>`;
  const pre = !v.score;
  return `<div class="board">
    <div class="top"><span class="inning">${esc(sc.inning||'試合前')}</span><span class="status">${pre?'18:00 プレーボール（先攻 日本ハム／後攻 ロッテ）':esc(sc.memo||'')}</span><span class="upd">${sc.updated?esc(sc.updated)+' 更新':''}</span></div>
    ${lineScore(sc)}
    <div class="sit">
      <div class="lamps">${lamps('B',3,'b')}${lamps('S',2,'s')}${lamps('O',2,'o')}</div>
      <div class="bases">${[3,2,1].map(b=>`<button class="b${b} ${st.bases[b-1]?'on':''}" data-base="${b}" aria-label="${b}塁"></button>`).join('')}</div>
      <div class="who">${sc.pitcher?'投手 '+esc(sc.pitcher)+'　':''}${sc.batter?'打者 '+esc(sc.batter):''}
        <div class="hint">ランプと塁はタップで変えられます ・ <a href="#/live">写真からスコアとスタメンを更新</a></div></div>
    </div></div>`;
}
function bindBoard(){
  document.querySelectorAll('.lamps button').forEach(b=>b.onclick=()=>{ const v=loadLive(), k=b.dataset.k, max={B:3,S:2,O:2}[k];
    const cur = {B:0,S:0,O:0,bases:[0,0,0],...((v.score||{}).count||{}),...(v.state||{})}; cur[k]=(cur[k]+1)%(max+1); v.state=cur; saveLive(v); home() });
  document.querySelectorAll('.bases button').forEach(b=>b.onclick=()=>{ const v=loadLive(), i=+b.dataset.base-1;
    const cur = {B:0,S:0,O:0,bases:[0,0,0],...((v.score||{}).count||{}),...(v.state||{})}; cur.bases=[...cur.bases]; cur.bases[i]=cur.bases[i]?0:1; v.state=cur; saveLive(v); home() });
}
function lineupCols(){
  const L = loadLive().lineup, useLive = L && (L.lotte||L.fighters);
  const rows = D.lineup.filter(r=>r[0]!=='投'), pit = D.lineup.find(r=>r[0]==='投')||[];
  const col = (team, key, idx, pcell) => {
    let items;
    if(useLive && L[key]) items = L[key].map(x=>({n:x.order??'', pos:x.pos||'', name:x.name||''}));
    else items = rows.map(r=>({n:r[0], pos:posOf(r[idx]), name:r[idx]}));
    const p = useLive && L.pitchers && L.pitchers[key] ? L.pitchers[key] : pcell;
    return `<div class="team-col"><h4>${team}<small>${useLive?'発表':'予想'}</small></h4><ol>${items.map(x=>`<li><span class="n">${esc(x.n)}</span><span class="pos">${esc(x.pos)}</span><span>${pLink(x.name, useLive?team:'')}</span></li>`).join('')}
      <li class="p"><span class="n"></span><span class="pos">投</span><span>${p?pLink(p, useLive?team:''):''}</span></li></ol></div>`;
  };
  return `<div class="lineup">${col('日本ハム','fighters',3,pit[3])}${col('ロッテ','lotte',1,pit[1])}</div>`;
}

/* ---- ページ ---- */
function home(){
  PROMPTS.length = 0;
  let h = `<div class="guides">
    <a class="guide" href="#/g/basics"><b>野球初心者ガイド</b><span>ルールとしくみ</span></a>
    <a class="guide" href="#/g/game"><b>ロッテ対日本ハムを楽しむガイド</b><span>今日の見どころ</span></a></div>`;
  h += `<p class="eyebrow">速報</p>${board()}`;
  h += `<p class="section-title">スタメン</p>${lineupCols()}<p class="lead" style="margin-top:8px">名前を押すと選手カードが開きます。<a href="#/lineup">選手・監督カードの一覧</a></p>`;
  h += `<p class="section-title">この画面の見方がわからないとき</p><div class="qs">${BOARD_QS.filter(id=>allQ[id]).map(id=>qBtn(allQ[id])).join('')}</div>`;
  h += `<p class="section-title">球場のこと</p><div class="guides"><a class="guide wide" href="#/g/stadium"><b>マリーンズスタジアムガイド</b></a></div>`;
  $('#app').innerHTML = h; bindBoard();
}
function guide(key){
  const g = GUIDES[key]; if(!g) return home();
  let h = `<a class="back" href="#/">← トップ</a><h1>${esc(g.title)}</h1><p class="lead">${esc(g.desc)}</p>`;
  if(key==='game') h += `<div class="qs" style="margin-bottom:8px"><a class="q" href="#/lineup">スタメンと選手カード<small>両チームと監督</small></a><a class="q" href="#/today">今日の試合データ<small>順位・予告先発・記録</small></a></div>`;
  D.tree.filter(c=>g.cats.includes(c.no)).forEach(c=>{
    h += `<p class="section-title">${esc(c.title)}</p><div class="qs">${c.items.map(qBtn).join('')}</div>`;
  });
  $('#app').innerHTML = h;
}
function guideOf(q){ const no = q.cat&&q.cat.no; return Object.keys(GUIDES).find(k=>GUIDES[k].cats.includes(no)) }
function article(id){
  const q = allQ[id]||{title:id}, a = D.articles[id], title = clean(a&&a.meta.title||q.title);
  const back = q.parent ? `#/q/${q.parent}` : (guideOf(q) ? `#/g/${guideOf(q)}` : '#/');
  const backLabel = q.parent ? clean(allQ[q.parent].title) : (guideOf(q) ? GUIDES[guideOf(q)].title : 'トップ');
  let h = `<a class="back" href="${back}">← ${esc(backLabel)}</a><p class="eyebrow">${esc(q.cat?q.cat.title:'')}</p><h1>${esc(title)}</h1>`;
  if(!a){ h += `<div class="note">この記事はまだ準備中です。下のボタンを押すと、この疑問と、関係する記事・今日の試合データをまとめた質問文がコピーされます。ChatGPT に貼ると、ガイドと同じ形で答えてもらえます。</div>${gptBtn(askQ(q),'この疑問をGPTに聞く（プロンプトをコピー）')}` }
  else{
    if(a.meta.needs_check) h += '<div class="note">この記事には、まだ公式情報で確認できていない内容が含まれます。</div>';
    h += '<div class="article">';
    a.body.split(/^(?=## )/m).forEach(sec=>{ const m=sec.match(/^## (.+)\n?([\s\S]*)$/);
      h += m ? `<div class="sec-head"><h2>${inline(m[1])}</h2>${gptBtn(deepSec(id, m[1], m[2]),'ここを詳しく聞く')}</div>${md(m[2])}` : md(sec) });
    h += '</div>';
    const src = a.meta.sources||[]; if(src.length) h += `<hr><p class="eyebrow">出典</p><div class="src">${src.map(inline).join('<br>')}</div>`;
  }
  const kids = (q.children||[]).map(c=>allQ[c.id]);
  if(kids.length) h += `<p class="section-title">さらに気になる？</p><div class="qs">${kids.map(qBtn).join('')}</div>`;
  const rel = ((a&&a.meta.related)||[]).filter(r=>allQ[r]);
  if(rel.length) h += `<p class="section-title">関連する疑問</p><div class="qs">${rel.map(r=>qBtn(allQ[r])).join('')}</div>`;
  if(id.startsWith('5-07')||id.startsWith('4-02')) h += '<p style="margin-top:20px"><a href="#/lineup">スタメンと選手カードを見る</a></p>';
  $('#app').innerHTML = h;
}
function lineup(){
  let h = `<a class="back" href="#/">← トップ</a><h1>スタメンと選手カード</h1><p class="lead">予想スタメンは試合前の発表で変わります。発表後は<a href="#/live">写真から更新</a>できます。</p>${lineupCols()}`;
  let last='';
  D.players.forEach((p,i)=>{ const g=p.team+'｜'+p.section; if(g!==last){h+=(last?'</div>':'')+`<p class="section-title">${esc(g)}</p><div class="qs">`;last=g}
    h+=`<a class="q" href="#/p/${i}">${esc(p.name)}<small>${esc(p.title.replace(p.name,'').replace(/^[（(]|[）)]$/g,''))}</small></a>` });
  if(last) h += '</div>';
  $('#app').innerHTML = h;
}
function player(i){
  const p = D.players[i]; if(!p) return lineup();
  let h = `<a class="back" href="#/lineup">← スタメンと選手カード</a><p class="eyebrow">${esc(p.team)}｜${esc(p.section)}</p><h1>${esc(p.title)}</h1><p>${gptBtn(deepPlayer(p),'この選手をGPTで深掘り')}</p><div class="article">`;
  p.body.split(/^(?=### )/m).forEach(sec=>{ const m=sec.match(/^### (.+)\n?([\s\S]*)$/);
    h += m ? `<div class="sec-head"><h2>${inline(m[1])}</h2>${gptBtn(deepPlayerSec(p, m[1], m[2]),'ここを詳しく聞く')}</div>${md(m[2])}` : md(sec) });
  $('#app').innerHTML = h + '</div>';
}
const PHOTO_PROMPT = `${CTX}\n\n添付した写真（球場のビジョンのスタメン表、またはスコアボード）を読み取って、観戦ガイドに貼り付けるデータを作ってください。\n\n# 出力のしかた（厳守）\n- 次の形のJSONだけを、1つのコードブロックで出してください。説明はコードブロックの外に短く\n- 写っていない項目は省略してください（推測で埋めない）。読み取れない文字は「?」にしてください\n- 選手名はフルネームの漢字（外国人選手はカタカナ）。守備位置は「投 捕 一 二 三 遊 左 中 右 指」の1文字\n- fighters＝日本ハム（先攻）、lotte＝ロッテ（後攻）。取り違えないこと\n\n## スタメン表の写真のとき\n{"lineup": {"lotte": [{"order": 1, "pos": "左", "name": "西川史礁"}], "fighters": [{"order": 1, "pos": "遊", "name": "水野達稀"}], "pitchers": {"lotte": "ジャクソン", "fighters": "福島蓮"}}}\n（片方のチームしか写っていなければ、そのチームだけ）\n\n## スコアボードの写真のとき\n{"score": {"inning": "5回裏", "fighters": [0, 0, 1, 0, 0], "lotte": [0, 2, 0, 0], "R": {"fighters": 1, "lotte": 2}, "H": {"fighters": 4, "lotte": 6}, "E": {"fighters": 0, "lotte": 1}, "count": {"B": 1, "S": 2, "O": 1}, "bases": [1, 0, 0], "pitcher": "福島蓮", "batter": "山口航輝", "memo": "球速など、ボードに出ている情報を短く"}}\n（まだ攻撃していない回は配列に入れない。bases は1塁・2塁・3塁の順に、ランナーがいれば1）\n\n最後に、コードブロックの外で「この状況で初心者が見るポイント」を2〜3行で書いてください。`;
const SCORE_ASK = sc => `${CTX}\n\n今の試合状況は次のとおりです（fighters＝日本ハム・先攻、lotte＝ロッテ・後攻）。\n${JSON.stringify(sc)}\n\nこの状況を初心者向けに解説してください。どちらが有利か、次の見どころ、日本ハムの2位争い（西武との差）への影響を、ウェブ検索で今日の西武戦の途中経過も確認したうえで教えてください。${RULES}${TODAY()}`;
function live(){
  const v = loadLive();
  let h = `<a class="back" href="#/">← トップ</a><h1>写真から更新</h1><p class="lead">写真を ChatGPT に読んでもらい、返ってきた内容をここに貼ると、トップのスコアとスタメンが変わります。</p>
  <ol><li>ビジョンのスタメン表やスコアボードを写真に撮る</li><li>下のボタンでプロンプトをコピーし、ChatGPT に<b>写真と一緒に</b>送る</li><li>返ってきたコードブロックの中身（{ から } まで）をコピーして、下の欄に貼って「反映」</li></ol>
  <p>${gptBtn(PHOTO_PROMPT,'写真読み取りプロンプトをコピー')}</p>
  <textarea id="livein" placeholder='{"lineup": …} または {"score": …} を貼る'></textarea>
  <div><button class="btn" id="apply">反映</button><button class="btn sub" id="clear">全部消す</button></div><p id="msg" class="lead"></p>
  <div id="confirm" hidden class="note">写真から更新したスタメンとスコアを消します。<br><button class="btn" id="yes">消す</button><button class="btn sub" id="no">やめる</button></div>`;
  if(v.score) h += `<p class="section-title">いまの状況を解説してもらう</p><p>${gptBtn(SCORE_ASK(v.score),'この状況をGPTに解説してもらう')}</p>`;
  h += '<p class="lead">データはこの端末のこのブラウザにだけ保存されます。</p>';
  $('#app').innerHTML = h;
  $('#apply').onclick = ()=>{
    const t = $('#livein').value; let obj;
    try{ obj = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}')+1)) }catch(e){ $('#msg').textContent='JSON として読めませんでした。コードブロックの中身だけを貼ってください。'; return }
    if(!obj.lineup && !obj.score){ $('#msg').textContent='"lineup" か "score" が見つかりませんでした。'; return }
    const now = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); const cur = loadLive();
    if(obj.lineup){ cur.lineup = {...(cur.lineup||{}), ...obj.lineup, updated: now} }
    if(obj.score){ cur.score = {...obj.score, updated: now}; delete cur.state }
    $('#msg').textContent = saveLive(cur) ? '反映しました。トップに戻ると確認できます。' : '保存できませんでした（プライベートブラウズでは保存できないことがあります）。';
  };
  $('#clear').onclick = ()=>{ $('#confirm').hidden=false };
  $('#no').onclick = ()=>{ $('#confirm').hidden=true };
  $('#yes').onclick = ()=>{ saveLive({}); live() };
}
function route(){
  PROMPTS.length = 0;
  const h = location.hash.slice(2).split('/');
  if(h[0]==='q') article(h[1]); else if(h[0]==='g') guide(h[1]); else if(h[0]==='lineup') lineup(); else if(h[0]==='p') player(+h[1]); else if(h[0]==='live') live();
  else if(h[0]==='today') $('#app').innerHTML='<a class="back" href="#/g/game">← ロッテ対日本ハムを楽しむガイド</a><h1>今日の試合データ</h1><div class="article">'+md(D.today.replace(/^# .+\n/,''))+'</div>';
  else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
</script>
