/github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nベンチ前でバットを振る選手は、次の打者とは限らない。==**代打で呼ばれる可能性がある控え選手が、急な出番に備えて体を動かしていることもある**==のだ。\n\n## しくみ\n通常の次打者は、**ネクストバッターズサークル（次の打者が待つ円）**で準備する。一方、ベンチ付近で素振りを始めた控え選手は、監督から「出るかもしれない」と伝えられている場合がある。\n\n代打は、相手投手や走者の状況で直前に決まることもある。だから==いきなり打席へ行くのではなく、先に目と体を速い球へ合わせる==必要があるのだ。\n\nただし、素振りだけで交代が確定したとは言えない。相手が投手交代すれば、監督の選択も変わりうる。==「準備している」と「出場が決まった」は別==なのだ。\n\n## 今日の試合で見るなら\nロッテの**安田尚憲**がスタメン外なら、終盤にベンチ前でバットを持つか見てみよう。左の代打候補として準備を始めても、実際に出るとは限らない。\n\n==名前が場内放送される前の数分を見る==と、代打の気配を先に見つけられるのだ。"}, "3-09-b": {"meta": {"id": "3-09-b", "title": "声出しやガッツポーズの意味は？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-09", "6-01"], "sources": ["https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nベンチの声には、味方への情報伝達と応援の両方が混ざっている。==**ガッツポーズは得点や好プレーを共有する反応で、細かな声の意味は外から断定できない**==のだ。\n\n## しくみ\n守備中なら、アウトの数や走者の位置を確認する声が飛ぶことがある。攻撃中なら、走者や打者へ注意を促したり、良い打席を迎えたりする声が出る。\n\nただし、チームごとの短い言葉や動作には、その場だけの約束が含まれる場合がある。だから==観客が「この声は必ずこのサイン」と決めつけない方がいい==。\n\nガッツポーズも同じだ。大きな一打なら全員が立つこともあれば、淡々と迎えることもある。==反応の大きさは、点差や回と一緒に見ると意味が分かりやすい==のだ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**や日本ハムの**清宮幸太郎**が長打を放った場面では、打球だけでなく両ベンチを一度見よう。得点に直結すれば、控え選手まで前へ出て反応することがある。\n\n==ホームへ戻る選手と、迎えるベンチを同時に見る==と、テレビとは違う球場の情報量を感じやすいのだ。"}, "3-09": {"meta": {"id": "3-09", "title": "ベンチの選手は何をしてる？", "category": "3", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["3-09-a", "3-09-b"], "related": ["3-08", "3-10"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/bis/2026/games/gm20260928.html", "https://github.com/BaQaz/guide/blob/main/data/players/lotte.md", "https://github.com/BaQaz/guide/blob/main/data/players/fighters.md"]}, "body": "## ひとことで\nベンチにいる選手は、ただ試合を眺めて休んでいるわけではない。==**いつ呼ばれても出られる準備と、試合から情報を集める仕事を同時にしている**==のだ。\n\n## しくみ\n先発に入らなかった野手には、**代打**、**代走（走る役だけを交代すること）**、守備固め（守備を強くする交代）などの出番がある。いつ出るかは直前まで分からないので、体を冷やさず、相手投手の球や守備の動きを見ておく必要がある。\n\n打者なら、「直球が速い」「変化球が低く落ちる」といった情報を、実際の打席を見ながら更新する。走者になりそうな選手なら、投手のけん制（走者を塁へ戻そうとする送球）や捕手の送球も見る。==ベンチは、次に出る人のための観察席でもある==のだ。\n\n試合中に素振りを始める選手がいれば、出番が近い合図かもしれない。逆に座っていても、出番がないとは限らない。監督は点差や相手投手によって、直前に予定を変えるからだ。\n\n声を出すのも仕事の一部だ。味方へアウトの数を伝えたり、好プレーを迎えたり、失敗した選手を次のプレーへ戻したりする。==ベンチの反応を見ると、グラウンドだけでは見えない試合の温度が分かる==。\n\nNPBの規則でも、ベンチやブルペンに入れる選手・関係者が競技に出る準備をしていることを前提に、競技場へ出られる場面を定めている。ベンチは「待機場所」ではあるが、何もしない場所ではないのだ。\n\n## 今日の試合で見るなら\nロッテで**安田尚憲**や**松川虎生**がスタメン外なら、終盤の動きを見よう。安田なら代打、松川なら捕手交代や守備から出る可能性があるため、同じ控えでも準備の内容が違う。\n\n日本ハムでは、予想スタメンから外れた野手にも同じことが言える。==6回を過ぎたあたりから、ベンチ前で立つ選手や素振りを始める選手を探す==と、交代が発表される前から試合の次の一手が見えてくるのだ。"}, "3-10-a": {"meta": {"id": "3-10-a", "title": "サインの交換にかかる時間は？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-04-b", "3-10"], "sources": ["https://npb.jp/statistics/2016/pace.html", "https://npb.jp/bis/2026/games/gm20260928.html"]}, "body": "## ひとことで\n\nサイン交換だけに「何秒」と決められた時間はない。==**次の投球までの短い時間の中で、捕手と投手が答えを合わせる**のだ。==\n\n## しくみ\n\n捕手は指などで、**球種（ストレートや変化球の種類）**やコースを伝える。投手が納得すればうなずき、違う球にしたければ首を振って、別のサインを待つ。\n\nNPBの「PACE OF THE GAME」では、走者がいない場面は、投手がボールを受けてから**15秒以内**に投げることを求めている。==サイン交換は、その15秒の中に入っている作業の一つ==なのだ。\n\n走者がいると、投手は一塁や二塁の走者も確認する。だから同じ投手でも、==**走者なしのときより間が長く見えることがある**==というわけだ。\n\n## 今日の試合で見るなら\n\n先発の**ジャクソン**と**福島蓮**が投げるとき、捕手の手元と投手の顔を交互に見てみるといい。==投手がすぐうなずくか、首を振って考え直すか==で、サイン交換が見えてくるのだ。"}, "3-10-b": {"meta": {"id": "3-10-b", "title": "打者が打席を外すのはなぜ？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-01", "3-10"], "sources": ["https://npb.jp/statistics/2016/pace.html", "https://npb.jp/bis/2026/games/gm20260928.html"]}, "body": "## ひとことで\n\n打者が打席を外すのは、構えや気持ちを整え直して、次の1球に入り直すためだ。けれど、==**好きなだけ何度でも外してよいわけではない**==。\n\n## しくみ\n\n空振りやファウルのあと、打者が**バッターボックス（打つ人が立つ四角い場所）**から少し出ることがある。そこで握りを直したり、足元や構えを整えたりして、前の1球をいったん切るのだ。\n\n一方、NPBは打者に「思うままにバッターボックスを出入りする自由はない」と示している。投手のリズムを崩すことだけを目的にタイムを求めることも認められていない。==**間を取ること自体も、ルールの中で行うプレー**なのだ。==\n\nタイムが認められないまま外していると、その間に投球されることもある。==打者には「整えたい」と「早く構えなければ」の両方がある==というわけだ。\n\n## 今日の試合で見るなら\n\n**清宮幸太郎**やロッテの**山口航輝**が、空振りやファウルのあとにどう打席へ戻るかを見てみるといい。==一度外してすぐ戻るのか、構えを変えるのか==を見ると、次の球への準備が少し見えるのだ。"}, "3-10": {"meta": {"id": "3-10", "title": "★ 1球ごとの間（ま）に何が起きている？", "category": "3", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["3-10-a", "3-10-b"], "related": ["3-03", "3-04", "3-11"], "sources": ["https://npb.jp/statistics/2016/pace.html", "https://npb.jp/statistics/2026/time.html", "https://npb.jp/bis/2026/games/gm20260928.html"]}, "body": "## ひとことで\n\n1球が終わって次の1球が来るまで、選手は休んでいるわけではない。==**投手・捕手・打者が、次の勝負を数秒で組み立て直している時間**なのだ。==\n\n## しくみ\n\n投球が捕手のミットに収まると、まずボールが投手へ返る。投手は**次に何を投げるか**を考え、捕手は打者の反応を見て、球種やコースのサインを出す。==投手がうなずけば次の球へ進み、合わなければもう一度やり直す==、という流れだ。\n\n打者も同時に動いている。前の球が速かったのか、変化したのか、自分の振りが遅れたのかを整理し、バットの握りや立つ位置を整える。走者がいれば、投手はその動きも気にするので、==**「投手対打者」だけでなく「走者を含む読み合い」**になる==のだ。\n\nNPBが公表している「PACE OF THE GAME」では、走者がいない場面は、投手がボールを受けてから**15秒以内**に投げることを求めている。これはサイン交換だけの制限時間ではなく、次の投球までの全体の目安だ。==短い間の中に、確認することがかなり詰まっている==というわけだ。\n\n## 歴史・由来\n\nNPBは2016年から、試合をスピーディーに進めたチームや選手を表彰する**スピードアップ賞**を設けている。2026年の9回試合の平均時間は、9月24日時点で3時間4分だ。\n\nつまり野球では、プレーそのものだけでなく、==**プレーとプレーの間をどう使うか**も試合のテンポを作っている==のだ。\n\n## 今日の試合で見るなら\n\n先発はロッテが**アンドレ・ジャクソン**、日本ハムが**福島蓮**だ。==投げ終わった直後から次の投球まで、投手がどこを見るかを追ってみるといい==。\n\nたとえばジャクソンが**清宮幸太郎**を迎える場面では、捕手のサイン、投手のうなずき、清宮が構え直す動きが一度に見える。1球を投げる前から、もう次の勝負は始まっているのだ。"}, "3-11-a": {"meta": {"id": "3-11-a", "title": "何時に球場に来るの？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-11"], "sources": ["https://www.fighters.co.jp/ticket/2026/esconfield/option/exchange/", "https://npb.jp/bis/2026/games/gm20260928.html"]}, "body": "## ひとことで\n\n「全員が何時に到着する」と決まった公開時刻はない。==**ただし18時開始なら、少なくとも試合の数時間前には練習が始まっている例がある**==のだ。\n\n## しくみ\n\nファイターズ公式では、本拠地の18時開始試合で、試合前練習の見学を**15時00分〜15時20分**に設定している。つまり、その時刻にはすでに選手が球場で練習しているわけだ。\n\n到着時刻は選手やその日の役割で変わり、今日の個々の球場入り時刻も公表されていない。だから「14時に全員集合」のようには言えない。==確実に言えるのは、観客が見る本番よりかなり前から仕事が始まっていること==なのだ。\n\n## 今日の試合で見るなら\n\n今日のロッテ×日本ハムは**18時00分開始**だ。==ジャクソンや福島蓮が試合前に姿を見せた時点で、準備はすでに進んでいる==と考えるといい。\n\n球場入りの瞬間を見られなくても問題はない。あなたが見るウォームアップは、長い試合日の途中の一場面なのだ。"}, "3-11-b": {"meta": {"id": "3-11-b", "title": "登場曲って？", "category": "3", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["3-11"], "sources": ["https://www.marines.co.jp/fans/walkupsong/", "https://www.fighters.co.jp/team/music.html", "https://npb.jp/bis/2026/games/gm20260928.html"]}, "body": "## ひとことで\n\n**登場曲**は、打者が打席へ向かうときや投手が登板するときなどに流れる、その選手のテーマ曲のような音楽だ。==**名前を知らなくても「この曲＝この選手」と覚える入口になる**==。\n\n## しくみ\n\nロッテ公式は、登場曲を「選手自ら思い入れのある楽曲を選曲」する文化だと説明している。1人1曲とは限らず、==**打席ごとに曲を変える選手もいる**==のだ。\n\nたとえば**西川史礁**は、1打席目がSUPER EIGHTの「Re:LIVE」、2打席目が「凛」など、打席ごとに曲が分かれている。登場曲は途中で変更される場合もあるので、その日の球場で流れる曲が最終版だ。\n\n音楽が鳴ったら、スコアボードの名前も一緒に見ると覚えやすい。==曲、名前、背番号をセットにすると、初観戦でも選手を見失いにくい==というわけだ。\n\n## 今日の試合で見るなら\n\nロッテの**山口航輝**が打席に立ったら耳も使ってみるといい。公式の2026年登場曲一覧では、1・4打席目は「My Time」、2・5打席目は「Stronger」、3・6打席目は「後悔なき航海」だ。\n\n==**山口の打席は、ビジョンを見る前に曲で気づけるかもしれない**==。野球の選手名を覚える方法は、成績表だけではないのだ。"}, "3-11": {"meta": {"id": "3-11", "title": "選手は試合の日をどう過ごしてる？", "category": "3", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["3-11-a", "3-11-b"], "related": ["3-09", "3-10"], "sources": ["https://www.fighters.co.jp/ticket/2026/esconfield/option/exchange/", "https://www.marines.co.jp/team/player/detail/2026_00001182.html", "https://www.marines.co.jp/team/player/detail/2026_00001804.html", "https://npb.jp/bis/2026/games/gm20260928.html"]}, "body": "## ひとことで\n\nプロ野球選手の試合日は、18時の試合開始から始まるわけではない。==**数時間前から、練習と自分なりの準備を積み重ねて本番へ入る**のだ。==\n\n## しくみ\n\n全選手が同じ時刻に球場へ来る、という公開された決まりはない。けれど、ファイターズ公式の案内では、18時開始のホームゲームで**15時00分〜15時20分**に試合前練習の見学時間が設定されている。==試合の3時間前には、すでにグラウンドで準備が進んでいる例がある==ということだ。\n\nそこからウォームアップや打撃・守備の練習を行い、本番に向けて体と感覚を合わせていく。さらに選手ごとに**ルーティン（毎回ほぼ同じ順番で行う習慣）**もある。\n\nロッテ公式の2026年選手名鑑では、**西川史礁**は試合前のルーティンを「音楽を聴く」、先発の**アンドレ・ジャクソン**は「髪を洗う」と答えている。==同じ試合に出る選手でも、集中へ入る方法はかなり違う==のだ。\n\nこうした準備は、毎回まったく同じ結果を出すためではない。==**本番前に余計な迷いを減らし、いつもの状態へ近づける**ための手順==と考えるとわかりやすい。\n\n## 今日の試合で見るなら\n\n今日は18時開始で、ロッテの先発は**ジャクソン**だ。==試合前に選手がグラウンドへ出てきたら、「もう何時間も準備の流れの中にいる」と考えて見るといい==。\n\n**西川史礁**を見かけたら、公式名鑑では試合前に音楽を聴くと答えていることも思い出せる。あなたが最初に見る「アップ」は、選手にとっては準備の途中なのだ。"}, "4-01-a": {"meta": {"id": "4-01-a", "title": "R・H・Eって？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-01", "1-09"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nRは得点、Hは安打（ヒット）、Eは失策（守備のミスとして記録されたもの）だ。3つとも、そのチームの試合全体の合計を見る数字なのだ。\n\n## しくみ\nRはRuns、HはHits、EはErrorsの頭文字だ。たとえば「R 3、H 8、E 1」なら、3点、8安打、1失策という意味になる。\n\nHが多いチームが必ず勝つわけではない。ヒットを何本打っても、走者がホームまで帰らなければRは増えないからだ。Eも、ミスがそのまま1点になる数字ではない。\n\n## 今日の試合で見るなら\nロッテと日本ハムのHが増えたのにRが動かない場面があれば、「走者は出たけれど点にはならなかった」と読める。逆に少ないHでRが増えれば、四球（フォアボール：ボール球4つで一塁へ歩けること）や長打（二塁打以上の当たり）を、うまく得点につなげた可能性があるのだ。"}, "4-01-b": {"meta": {"id": "4-01-b", "title": "打率や球速の表示の見方は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-01", "4-03", "2-07-b"], "sources": ["https://npb.jp/bis/2026/stats/bat_p.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idb1_f.html"]}, "body": "## ひとことで\n「.292」は打率2割9分2厘、「151 km/h」のような表示はその1球の速さだ。打率は打者の積み重ね、球速は投手の1球ごとの数字と考えると分かりやすい。\n\n## しくみ\n打率は、打数（打率計算の対象になる打席）に対して何本ヒットを打ったかの割合だ。.300なら、おおまかには10打数で3安打のペースになる。\n\n球速は1球ごとに変わる。同じ投手でも、速い直球の次に遅い変化球を投げれば、打者はタイミングを合わせにくくなる。最高球速も目安になるが、1球前とどれだけ速さが違うかに注目すると、投球の狙いが見えやすいのだ。\n\n## 今日の試合で見るなら\n9月27日終了時点で、ロッテの西川史礁は打率.292、日本ハムの水野達稀は.285だ。まずは「3割にどれくらい近いか」と見るとよい。\n\nジャクソンは力強い直球（ストレート：まっすぐ進む速い球）とチェンジアップ（直球と同じ腕の振りで遅く届く球）、福島蓮は直球とフォーク（打者の手元で落ちる球）が持ち味だ。ビジョンに球速が出たら、その数字を球種と組み合わせて見ると面白いのだ。"}, "4-01-c": {"meta": {"id": "4-01-c", "title": "ビジョンに出るそのほかの表示は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-01", "4-02"], "sources": ["https://www.marines.co.jp/stadium/application/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nビジョン（球場の大型スクリーン）は、点数のほかに選手紹介や球場の情報も映す画面だ。ZOZOマリンでは風速も自動表示されるので、海風まで「数字で見られる」のだ。\n\n## しくみ\nZOZOマリンにはメイン、レフト、ライト、ネット裏のサブスクリーン、リボンビジョン（スタンドに沿って帯のように伸びる表示板）がある。全部を追う必要はない。試合中はスコア、選手名、風の情報など、いま必要なものから見れば十分だ。\n\n球場公式では、上空と地上の風速情報を自動表示すると案内している。フライ（高く打ち上がった打球）が上がったときに風速を見れば、守る選手がなぜ難しそうに追っているのか理解しやすい。\n\n## 今日の試合で見るなら\n公式イベント案内では、17:20ごろに「MARINES ROSTER」としてロッテのベンチ入り全選手を紹介する予定だ。17:30ごろのWarm Up Showでは、選手のプロフィール紹介も予定されている。\n\n試合が始まったら、強い海風の日は風速表示にも注目するとよい。山口航輝や清宮幸太郎の大きな打球が上がったとき、数字と打球の動きを一緒に見ると球場らしさが分かるのだ。"}, "4-01": {"meta": {"id": "4-01", "title": "スコアボードの見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "children": ["4-01-a", "4-01-b", "4-01-c"], "related": ["4-02", "1-07"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.marines.co.jp/stadium/application/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nスコアボードは、試合の「いま」をまとめた一覧表なのだ。まず左右に並ぶ1〜9回の得点と、右端の合計得点を見れば十分だ。\n\n## しくみ\n野球では、1回ごとの得点を横に足していく。上の段が先攻（先に攻撃するチーム）、下の段が後攻（あとから攻撃するチーム）だ。今日なら日本ハムが上、ロッテが下になる。\n\n各回の前半を「表」、後半を「裏」と呼ぶ。たとえば「1回表」に日本ハムが2点取れば、日本ハムの「1」の欄に2が入る。次の「1回裏」はロッテの攻撃だ。試合の途中で流れが分からなくなったら、右端の合計得点を先に見ると追いつきやすい。\n\n右側にはR・H・Eのようなまとめの数字も出る。Rは得点、Hは安打（ヒット）、Eは失策（守備のミスとして記録されたもの）だ。詳しくは「R・H・Eって？」を見るとよい。\n\nZOZOマリンでは、スコアボードのほかに複数のスクリーンやリボンビジョンがあり、風速計の情報も自動表示される。海風の強い球場なので、点数だけでなく風の数字も試合を見る手がかりになるのだ。\n\n## おもしろエピソード\n球場の公式施設案内では、メインスクリーンのほか、レフト・ライト、ネット裏のサブスクリーンまで案内されている。どこを見ればよいか迷ったら、まず大きなスコア表示に戻ればいいというわけだ。\n\n## 今日の試合で見るなら\n18:00開始のロッテ対日本ハムは、日本ハムが先攻、ロッテが後攻だ。最初は「1回表」の日本ハム、その次に「1回裏」のロッテと進む。\n\n予告先発はロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。試合中に話についていけなくなったら、合計得点、いま何回か、アウト数の順で確認すると状況を取り戻しやすいのだ。"}, "4-02-a": {"meta": {"id": "4-02-a", "title": "打順って？1番と4番は何が違う？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-02", "4-03"], "sources": ["https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\n打順は、9人が打つ順番だ。1番は試合で最も早く打席が回り、4番は前の打者が出塁した場面で回りやすいが、役割はチームごとに違うのだ。\n\n## しくみ\n1番は打席数が多くなりやすいので、出塁（ヒットや四球で塁に出ること）できる打者や足のある打者が置かれることが多い。4番は走者を返す長打力のある打者が入ることが多い。\n\nただし、これは決まりではない。最近は強打者を2番や3番に置き、少しでも多く打席を回す考え方もある。だから「4番＝いちばん強い」とだけ覚えると、実際の打線を読み違えることがあるのだ。\n\n## 今日の試合で見るなら\n予想ではロッテの1番が西川史礁、4番が佐藤都志也だ。一方、32本塁打の山口航輝は2番に入る。\n\n日本ハムは1番が水野達稀、3番に23本塁打の清宮幸太郎、4番に野村佑希の予想だ。上位4人をひとかたまりで見ると、どこで走者を出し、どこで返したい打線なのか見えやすいのだ。"}, "4-02-b": {"meta": {"id": "4-02-b", "title": "守備位置の表記（遊・中・指など）って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-02", "2-07"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/allstar/2026/fanballot.html"]}, "body": "## ひとことで\n守備位置は漢字1文字で短く書かれることが多い。「遊」は遊撃手（ショート）、「中」は中堅手（センター）、「指」は指名打者（DH）だ。\n\n## しくみ\n主な表記は次のとおりだ。\n\n- 投＝投手、捕＝捕手\n- 一＝一塁手、二＝二塁手、三＝三塁手、遊＝遊撃手\n- 左＝左翼手、中＝中堅手、右＝右翼手\n\n外野は左・中・右の3人に分かれる。\n\n「指」だけは守備位置ではない。指名打者（DH：投手の代わりに打つ専門の打者）を示す表記だ。パ・リーグでは、この枠を使って打線を組む。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの山口航輝が「指」、日本ハムの清宮幸太郎も「指」だ。2人とも打撃に集中する役になる。\n\n「遊」は日本ハムの水野達稀、「中」はロッテの髙部瑛斗と日本ハムの矢澤宏太の予想だ。略字が読めると、打者だけでなく守備の配置まで一気に見えるようになるのだ。"}, "4-02-c": {"meta": {"id": "4-02-c", "title": "「スタメン」と「ベンチ入り」の違いは？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-02", "2-17"], "sources": ["https://npb.jp/announcement/roster/", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n\n**スタメン（先発メンバー：試合開始から出る選手）**は、最初から守備や打席に入る顔ぶれだ。**ベンチ入り**は、その試合で出場できる選手全体を指す。==スタメンもベンチ入り選手の一部なのだ。==\n\n## しくみ\n\n試合前には、誰が何番を打ち、どこを守るかという**スタメン表**が決まる。一方、ベンチには途中から出る投手、代打、代走、守備固めなども控えている。==「先発しない＝今日は出ない」ではない==というわけだ。\n\n「出場選手登録」は、さらに別の言葉だ。これは一軍公式戦に出られる選手として登録されている状態で、==その中から当日のスタメンや控えが決まる==と考えると整理しやすい。\n\n## 今日の試合で見るなら\n\n予想スタメンでは、ロッテの**山口航輝**は2番・指名打者で先発する想定だ。一方、**安田尚憲**や**ソト**は入れ替え候補として挙がっている。==試合前の正式発表で「最初から出る人」と「途中から出るかもしれない人」を分けて見る==と、交代の意味が分かりやすいのだ。"}, "4-02": {"meta": {"id": "4-02", "title": "スタメン表の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "children": ["4-02-a", "4-02-b"], "related": ["4-01", "5-07"], "sources": ["https://npb.jp/bis/2026/stats/bat_p.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nスタメン表は「誰が、何番目に打ち、どこを守るか」を並べた表だ。最初は打順、名前、守備位置の3つだけ読めれば観戦には十分なのだ。\n\n## しくみ\n見る順番は単純だ。\n\n- まず「1〜9」の打順を見る\n- 次に選手名を見る\n- かっこの「左翼」「遊撃」「指名」などで守る場所を見る\n- 余裕があれば打率や本塁打を見る\n\nこのガイドの予想スタメンなら、ロッテは1番・西川史礁（左翼）、2番・山口航輝（指名打者）、3番・藤原恭大（右翼）と続く。日本ハムは1番・水野達稀（遊撃）、2番・田宮裕涼（捕手）、3番・清宮幸太郎（指名打者）という予想だ。\n\n「指名打者」は守備につかず、打撃を担当する選手だ。今日の予想ではロッテの山口、日本ハムの清宮がここに入っている。\n\nこの表はあくまで予想で、正式なスタメン発表で入れ替わることがある。予想と実際の違いも、監督がどこを変えたかを見る材料になるのだ。\n\n## おもしろエピソード\n4番が必ずチーム最多本塁打という決まりはない。今日の予想では、ロッテで32本塁打の山口が2番、17本塁打の佐藤都志也が4番だ。打順は「強い順」ではなく、どう得点につなげるかで組まれるというわけだ。\n\n## 今日の試合で見るなら\nまず両チームの1〜4番だけ覚えるとよい。ロッテは西川史礁、山口、藤原、佐藤。日本ハムは水野、田宮、清宮、野村佑希の予想だ。\n\n打席に入った選手の名前が分からなくなったら、スタメン表の打順に戻れば次の打者も予想できる。守備位置の略字が気になったら「守備位置の表記って？」につなげればいいのだ。"}, "4-03-a": {"meta": {"id": "4-03-a", "title": "どれくらいならすごい？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-03"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/bat_p.html", "https://baseball.yahoo.co.jp/npb/stats/batter?gameKindId=2&type=ops"]}, "body": "## ひとことで\n目安は年によって違う。2026年のパ・リーグなら、打率.300、30本塁打、100打点、OPS（出塁する力と長打力を合わせて見る数字）.900あたりを「リーグ上位級」と考えると分かりやすいのだ。\n\n## しくみ\n9月27日時点で、打率.300以上は4人、30本塁打以上は4人、100打点以上は2人、OPS.900以上は4人しかいない。だから、この線を超えていればかなり目立つ数字だと分かる。\n\nただし、毎年同じ基準ではない。投手が強い年は打撃成績が下がりやすく、逆もある。数字は「その年のリーグ内で比べる」のが基本なのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は32本塁打で、この目安ならすでに上位級だ。西川史礁の打率.292も.300に近い。数字を見たら、まず「リーグ全体でどの辺か」を考えると意味がつかみやすいのだ。"}, "4-03-b": {"meta": {"id": "4-03-b", "title": "OPSはなぜ大事なの？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-03", "4-03-c"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/news/detail/20210413_02.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n\n**OPS（オーピーエス）**は、**出塁率**と**長打率**を足した数字だ。==「塁に出る力」と「一度に大きく進む力」を1つで見られる==ので、打率だけより打撃の全体像をつかみやすいのだ。\n\n## しくみ\n\n打率は、主に「安打を打った割合」を見る数字だ。しかし四球で塁に出ることや、二塁打・本塁打の価値までは十分に表せない。OPSなら、その2つを別々の指標からまとめて見ることができる。\n\nただし、==OPSだけで選手の全部は分からない==。走塁や守備、どんな場面で打ったかまでは入っていないからだ。\n\n## 今日の試合で見るなら\n\nロッテの**山口航輝**は、9月27日時点で出塁率.332、長打率.596なので、OPSは**.928**になる。==32本塁打だけでなく、「出塁」と「長打」を合わせて見る==と、2番・指名打者で起用される狙いを考えやすいのだ。"}, "4-03-c": {"meta": {"id": "4-03-c", "title": "出塁率って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-03", "4-03-b"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n\n**出塁率**は、打者がヒットだけでなく、**四球（フォアボール）**や**死球（デッドボール）**でも塁に出れた割合を見る数字だ。==「アウトにならず、攻撃を次につないだか」を打率より広く見る==のだ。\n\n## しくみ\n\n基本の計算は、安打・四球・死球で出塁した回数を、打数・四球・死球・犠飛の合計で割る。失策で出た場合は出塁率の成功には数えない。==高いほど、ヒット以外の方法も含めて塁に残りやすい==と考えればいい。\n\n打率との違いが大事だ。四球を選んでも打率は上がらないが、==出塁率にはプラスになる==からだ。\n\n## 今日の試合で見るなら\n\nロッテの**山口航輝**は、9月27日時点で打率.279、出塁率.332だ。ヒットだけを見る数字より、塁に出る力を広く見ると差が出る。==山口が打たなくても四球で一塁へ出たら、それは出塁率が評価する仕事==なのだ。"}, "4-03": {"meta": {"id": "4-03", "title": "打率・本塁打・打点・OPSって？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "children": ["4-03-a"], "related": ["4-01-b", "4-05"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/bat_p.html", "https://baseball.yahoo.co.jp/npb/stats/batter?gameKindId=2&type=ops"]}, "body": "## ひとことで\n打率は「ヒットを打つ割合」、本塁打はホームランの数、打点は打撃で生んだ得点の数だ。OPSは「出塁する力」と「長打を打つ力」を足して見る数字なのだ。\n\n## しくみ\n打率は、安打（ヒット）を打数で割った数字だ。.300なら「打数の約3割でヒット」という意味になる。四球（フォアボール）や犠打（バントなど、自分がアウトになって走者を進める打撃）などは打数に入らないため、単純に全打席の3割という意味ではない。\n\n本塁打は、そのままホームランを打った本数だ。打点は、打者の打撃によって走者をホームへ返した数を表す。たとえば満塁（一塁・二塁・三塁すべてに走者がいる状態）ホームランなら、一度に4打点がつく。\n\nOPS（オーピーエス）は、出塁率（ヒットや四球などで塁に出る割合）と長打率（1打数あたり、どれだけ多く塁を稼いだか）を足した数字だ。出塁率が高い選手と、二塁打や本塁打を多く打つ選手の両方を評価しやすい。\n\n4つの数字は役割が違う。打率が高くても本塁打は少ない選手がいるし、本塁打が多くても打率はそれほど高くない選手もいる。1つの数字だけで「打者の強さ全部」を決めるものではないのだ。\n\n## おもしろエピソード\n2026年9月27日時点のパ・リーグでは、打率1位は日本ハムのレイエスで.313、本塁打と打点の1位はソフトバンクの栗原陵矢で39本・117打点だ。OPS1位は近藤健介で.993。1位の顔ぶれが違うのは、数字ごとに測っている力が違うからだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は32本塁打、西川史礁は打率.292、日本ハムの清宮幸太郎は23本塁打だ。打席に入ったら、名前の横に出る数字を1つだけ見るのではなく、「当てる力なのか、長打なのか」と分けて見ると分かりやすい。\n\n山口が大きな当たりを打てば本塁打の数字に注目し、西川が出塁したら打率や出塁の力を思い出す。数字がプレーの特徴と結びつくと、スコアボードが急に読みやすくなるのだ。"}, "4-04-a": {"meta": {"id": "4-04-a", "title": "防御率3点台はすごいの？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-04", "4-04-b"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\n\n**防御率**は、その投手が9回を投げたとしたら、自分の責任になる点を平均で何点取られるかを示す数字だ。==低いほど失点を抑えている==が、**3点台だから必ず「すごい」**とは決められないのだ。\n\n## しくみ\n\n防御率3.00なら、計算上は9回あたり自責点3点という意味だ。ただし、リーグ全体が打高か投高か、先発か救援かでも見え方は変わる。==同じ年、同じ役割の投手と比べる==のが基本だ。\n\n2026年パ・リーグでは、9月27日時点の規定投球回到達者で首位は1点台、上位には2点台も並ぶ。ロッテの**ジャクソン**は3.44で10位だ。==3点台という数字だけでなく、順位や周囲の数字も見る==と判断しやすい。\n\n## 今日の試合で見るなら\n\n予告先発は、ロッテの**ジャクソンが3.44**、日本ハムの**福島蓮が3.35**だ。数字は近いが、投球回や登板の使われ方は同じではない。==今日の1試合では「何点取られたか」と一緒に、何回まで投げたかを見る==と、防御率の意味がつかみやすいのだ。"}, "4-04-b": {"meta": {"id": "4-04-b", "title": "WHIP（1イニングあたりに出した走者）って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-04", "4-04-a"], "sources": ["https://full-count.jp/2019/12/01/post620493/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\n\n**WHIP（ウィップ）**は、投手が1イニングあたりに**被安打と与四球で何人の走者を出したか**を見る指標だ。==計算は「（被安打＋与四球）÷投球回」==で、低いほど走者を出しにくいのだ。\n\n## しくみ\n\n防御率は「点を取られたか」を見るが、WHIPはその前の「走者をためたか」を見る。走者が多ければ、長打1本で失点しやすくなるからだ。\n\nただし、死球や失策による走者は計算に入らない。==WHIPだけで投手のすべてを決める数字ではない==と覚えておけばいい。\n\n## 今日の試合で見るなら\n\nロッテの**ジャクソン**は9月27日時点で144回、被安打116、与四球55なので、WHIPは約**1.19**になる。日本ハムの**福島蓮**は75回1/3、被安打68、与四球24だ。==今日、四球とヒットで走者をためずに進められるかを見る==と、WHIPの感覚がその場で分かるのだ。"}, "4-04-c": {"meta": {"id": "4-04-c", "title": "球数と投球回ってどう数える？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-04", "4-04-b"], "sources": ["https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n\n**球数**は投手が投げたボールの数、**投球回**はその投手が取ったアウト数を「3アウト＝1回」で表したものだ。==同じ5回でも、何球使ったかで負担はかなり違う==のだ。\n\n## しくみ\n\n投球回の「.1」「.2」は小数ではない。**5.1回**なら5回と1アウト、**5.2回**なら5回と2アウト、つまり5回2/3という意味だ。==3アウト取ると次の1回に繰り上がる==。\n\n球数は、打者1人を1球で終えれば少なく、ファウルで粘られると増える。だから投手を見るときは、==「何回まで投げたか」と「何球か」をセットで見る==と分かりやすい。\n\n## 今日の試合で見るなら\n\n9月27日時点で、ロッテの**ジャクソン**は今季144回、日本ハムの**福島蓮**は75.1回を投げている。この**75.1回は75回1/3**の意味だ。==今日の序盤は、両先発が3アウトを取るまでに何球使うか比べる==と、数字が急に試合の流れとして見えてくるのだ。"}, "4-04": {"meta": {"id": "4-04", "title": "防御率・奪三振って？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["4-03", "4-05"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/pl/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n防御率は「9回投げたとすると、自分の責任で何点取られるペースか」を表す数字だ。奪三振は、投手が三振で取ったアウトの数なのだ。\n\n## しくみ\n防御率は、自責点（投手の責任として記録される失点）×9を、投球回（投手が投げたイニングの数）で割って出す。数字は小さいほどよい。防御率2.00なら、同じペースで9回投げたとき自責点が約2点という意味だ。\n\nここでいう自責点は、すべての失点と同じではない。守備の失策（エラー）が大きく関係した失点などは、投手の自責点にならないことがある。だから「失点した数」と「防御率に入る点」は一致しない場合があるのだ。\n\n奪三振は、打者を三振（ストライクを3つ取られてアウトになること）にした回数だ。三振なら打球が飛ばないので、守備のミスや風の影響を受けにくい。一方で、三振が少なくてもゴロやフライでアウトを重ねる投手はいる。\n\n防御率と奪三振は、見る角度が違う。防御率は「どれくらい点を防いだか」、奪三振は「どれくらい三振でアウトを取ったか」を見る数字だ。\n\n## おもしろエピソード\n2026年9月27日時点のパ・リーグでは、防御率1位は西武の平良海馬で1.36、奪三振1位は楽天の荘司康誠で163だ。同じ投手部門でも1位が違うので、投手の強みは1つの数字だけでは決まらないと分かる。\n\n## 今日の試合で見るなら\n予告先発はロッテのアンドレ・ジャクソンが防御率3.44、日本ハムの福島蓮が3.35だ。数字だけなら近いが、今日何点取られるかを予言する数字ではない。\n\n試合が始まったら、三振を取るたびに「K」として数えてみるとよい。三振が多いのか、打たせてアウトを取るのかを見ると、同じ防御率でも投球の中身が違って見えるのだ。"}, "4-05-a": {"meta": {"id": "4-05-a", "title": "今年のパ・リーグの争いは？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-05"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/2026/stats/lb_rbi_p.html", "https://npb.jp/bis/2026/stats/pit_p.html"]}, "body": "## ひとことで\n2026年9月27日終了時点では、打率はレイエス、本塁打と打点は栗原陵矢、防御率は平良海馬、奪三振は荘司康誠がトップだ。まだレギュラーシーズンが残っているため、最終結果は確定していない。\n\n## しくみ\n主な部門の先頭は次の通りだ。\n\n- 打率：レイエス .313。2位は近藤健介 .308\n- 本塁打：栗原陵矢 39本。レイエスと山口航輝が32本で2位タイ\n- 打点：栗原陵矢 117。2位は近藤健介 105\n- 防御率：平良海馬 1.36。2位は隅田知一郎 2.22\n- 奪三振：荘司康誠 163。2位は伊藤大海 159\n\n数字は残り試合で動く。タイトル争いを見るときは、「1位が誰か」だけでなく「2位との差」を見ると分かりやすいのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝は32本塁打で2位タイだ。今日33号が出れば単独2位になる。打席の結果が、その場の得点とシーズン順位の両方を動かす場面なのだ。"}, "4-05-b": {"meta": {"id": "4-05-b", "title": "首位打者・本塁打王・最多勝って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-03", "4-04", "4-05-a"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/yearly/pacificleague_2025.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\n**首位打者**は打率、**本塁打王**は本塁打数、**最多勝**は投手の勝利数でリーグ1位になった選手に贈られるタイトルだ。==何が1位なのかを知れば、数字の意味が一気に見やすくなるのだ。==\n\n## しくみ\n打率は「安打数÷打数」で計算する。首位打者は、必要な打席数を満たすなどの条件のもとで最も高い打率を残した打者だ。本塁打王はシーズンの本塁打数、最多勝は投手についた勝利数を比べる。==同じ1位が複数いれば、同じタイトルを受けることもある。==\n\n## おもしろエピソード\n2025年のパ・リーグ最多勝は、有原航平と伊藤大海がともに14勝で並んだ。つまり「王」は必ず1人とは限らないのだ。\n\n## 今日の試合で見るなら\n**山口航輝**は9月27日終了時点で32本塁打だ。今日1本打てば33本になるので、==ホームランのたびに「本塁打王で数える数字が1つ増えた」と見ればいい。==\n\n先発の**ジャクソン**は9勝8敗。今日、勝利投手になれば10勝目だ。==チームが勝つことと、その投手に「勝」が付くことは別なので、試合後の記録まで見ると理解しやすいのだ。=="}, "4-05-c": {"meta": {"id": "4-05-c", "title": "新人王やMVPはいつ決まる？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-05", "4-05-b"], "sources": ["https://npb.jp/award/2026/", "https://npb.jp/news/detail/20251126_01.html", "https://npb.jp/award/2025/voting_mvp.html", "https://npb.jp/award/2025/voting_rok.html"]}, "body": "## ひとことで\n**MVP（最優秀選手）**と**新人王（最優秀新人）**は、打率や本塁打のように数字だけで自動的に決まる賞ではない。==プロ野球担当記者の投票で選ばれ、シーズン後の年間表彰で発表されるのだ。==\n\n## しくみ\nMVPは各リーグで、その年に最も価値のある働きをした選手を選ぶ賞だ。新人王も各リーグで選ばれる。2025年は11月26日の「NPB AWARDS」で両賞が発表され、MVPは順位をつけた投票、新人王は1人を選ぶ投票の結果が公表された。\n\n==だから、レギュラーシーズン最終戦が終わった瞬間に名前が確定するわけではない。== 2026年9月28日現在、NPB公式の2026年表彰ページでは年間MVP・新人王はまだ発表されていない。\n\n## 今日の試合で見るなら\nロッテの**西川史礁**は2025年のパ・リーグ新人王だ。今日ビジョンや場内紹介で「新人王」と出たら、==昨季の記者投票で選ばれた年間表彰だと分かれば十分なのだ。==\n\n今年の受賞者はまだ決まっていない。今日の1試合も、投票で振り返られる2026年シーズンの一部になるというわけだ。"}, "4-05": {"meta": {"id": "4-05", "title": "タイトルって？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "children": ["4-05-a"], "related": ["4-03", "4-04"], "sources": ["https://npb.jp/award/2025/pl.html", "https://npb.jp/bis/2026/stats/", "https://npb.jp/pl/"]}, "body": "## ひとことで\n「タイトル」は、シーズンを通して特定の成績でリーグ1位になった選手に与えられる表彰のことだ。首位打者、本塁打王、打点王、最優秀防御率、最多奪三振などがある。\n\n## しくみ\n打者の主なタイトルには、首位打者（打率1位）、最多本塁打者、最多打点者、最多安打者、最高出塁率者、最多盗塁者がある。投手には、最優秀防御率、最多勝利、勝率第1位、最多奪三振、最多セーブ、最優秀中継ぎ（先発と抑えの間に投げる投手の表彰）などがあるのだ。\n\n多くは、公式記録の数字で決まる。たとえば本塁打が一番多ければ最多本塁打者、奪三振が一番多ければ最多三振奪取投手になる。同じ数字で並べば、同時受賞になる場合もある。\n\n一方、MVP（最優秀選手）や新人王、ベストナインは記者投票で決まる表彰だ。数字の1位だけで自動的に決まるわけではない。会話ではまとめて「タイトル」と呼ばれることもあるが、決まり方は別なのだ。\n\n## おもしろエピソード\n2025年のパ・リーグでは、日本ハムのレイエスが32本塁打で最多本塁打者、90打点で最多打点者となり、2つの記録による表彰を同時に受けた。1人が複数部門のトップになることもあるというわけだ。\n\n## 今日の試合で見るなら\n2026年9月27日時点で、ロッテの山口航輝は32本塁打でパ・リーグ2位タイだ。今日33号を打てば、同じ32本のレイエスを抜いて単独2位になる。\n\nただし、現在の本塁打1位はソフトバンクの栗原陵矢で39本だ。終盤の1本は試合の得点だけでなく、シーズン全体の順位表にも数字を1つ足す。そこを見ると、9月の打席には別の意味が見えてくるのだ。"}, "4-06-a": {"meta": {"id": "4-06-a", "title": "今日かかっている記録は？（清宮の通算100号など）", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "related": ["4-06", "4-01"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/history/2026/milestones_p.html", "https://npb.jp/bis/history/ltp_sv.html"]}, "body": "## ひとことで\n今日いちばん分かりやすい節目は、清宮幸太郎の通算100本塁打まであと1本だ。ほかにも山口航輝の33号、西川遥輝の350盗塁へのカウントがある。\n\n## しくみ\n今日の試合データにある「記録・話題」は次の4つだ。\n\n- 清宮幸太郎は通算100本塁打まであと1本。初本塁打はルーキーだった2018年5月9日\n- 山口航輝は今季32本塁打でパ・リーグ2位タイ。33号なら単独2位\n- 西川遥輝は通算350盗塁（盗塁：投球のすきに次の塁へ走って進むこと）まであと5\n- 益田直也は今季、通算250セーブ（セーブ：試合の最後を締めた投手につく記録）と通算800試合登板をすでに達成\n\n山口は9月15日に30号へ到達し、球団の日本人選手では落合博満以来40年ぶりの30本塁打となった。この情報も今日の試合データにある話題の一つだ。\n\n## 今日の試合で見るなら\n清宮が打席に入ったら、まず「次の一発が100号」と覚えておけばよい。山口は一発が出れば本塁打順位が動く。\n\n西川遥輝が出場したら盗塁数、益田が登板したら今季達成済みの250セーブと800試合登板を思い出すとよい。同じ1プレーでも、積み重ねの数字があると見え方が変わるのだ。"}, "4-06-b": {"meta": {"id": "4-06-b", "title": "名球会って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-06", "4-06-c"], "sources": ["https://meikyukai.jp/regulation/", "https://meikyukai.jp/news/info20260805/", "https://www.marines.co.jp/news/detail/202600934469.html"]}, "body": "## ひとことで\n\n**名球会（日本プロ野球名球会）**は、長い現役生活で大きな通算記録を残した選手・元選手の会だ。基本の目安は、==**200勝、250セーブ、2000安打**==のどれかを達成することなのだ。\n\n## しくみ\n\n投手は**通算200勝**または**通算250セーブ**、打者は**通算2000安打**が基本条件だ。日本での記録を起点に、メジャーリーグの成績を合算できる場合もある。さらに、基準に相当する選手を対象にした特例入会制度もある。\n\nつまり、1年だけの好成績では届かない。==何年も積み重ねた「通算」の重みを見るための目印==なのだ。\n\n## 今日の試合で見るなら\n\nロッテの**益田直也**は、2026年8月4日にNPB史上5人目の通算250セーブを達成し、名球会入りした。9月23日にはZOZOマリンでブレザー授与式も行われた。==今日もし益田が登板したら、「250セーブまで積み重ねた投手」という背景まで含めて見る==と、マウンドの意味が少し変わるのだ。"}, "4-06-c": {"meta": {"id": "4-06-c", "title": "通算記録と今季記録の違いは？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-06", "4-06-b"], "sources": ["https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\n**通算記録**はプロ入り後の成績を年をまたいで足したもの、**今季記録**は2026年シーズンだけの成績だ。==同じ「本塁打○本」でも、数えている期間が違う==のだ。\n\n## しくみ\n\n今季記録は、シーズンが変わればまた0から数え直す。通算記録は前年までの数字に今年の分を足し続ける。だから若い選手が今季だけ大きな数字を出していても、長く積み上げたベテランの通算記録とは意味が違う。\n\n見るときは、==「今年の調子を知りたいのか」「これまでのキャリアを知りたいのか」==を先に決めると迷わない。\n\n## 今日の試合で見るなら\n\n日本ハムの**清宮幸太郎**は、今日の話題が**通算100本塁打まであと1本**だ。一方、ロッテの**山口航輝**は**今季32本塁打**でパ・リーグ2位タイ。==清宮は「積み重ねの節目」、山口は「2026年の争い」==を見ている、と分ければいいのだ。"}, "4-06": {"meta": {"id": "4-06", "title": "節目の記録って？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "children": ["4-06-a"], "related": ["4-01", "4-03", "4-04"], "sources": ["https://npb.jp/history/2026/milestones_b.html", "https://npb.jp/history/2026/milestones_p.html", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/history/ltp_sv.html"]}, "body": "## ひとことで\n「節目の記録」は、通算100本塁打や800試合登板のように、長い積み重ねが分かりやすい数字に届くことだ。1球や1打席が、その選手の何年分もの記録につながる瞬間なのだ。\n\n## しくみ\nまず「通算」と「シーズン」を分けると読みやすい。通算はプロ生活を通して積み上げた合計、シーズンは今年だけの数字だ。\n\nたとえば清宮幸太郎の「通算100本塁打まであと1本」は、過去のシーズンも全部足した本塁打数の話だ。一方、山口航輝の「今季32本塁打」は2026年だけの本数で、現在パ・リーグ2位タイという話になる。\n\n投手にも節目がある。セーブ（試合の最後を締めた投手につく記録）や登板試合数のように、役割を長く続けないと増えにくい数字もあるのだ。\n\n## おもしろエピソード\n節目は「丸い数字」だけとは限らない。山口は33号を打てば本塁打数で単独2位になる。順位が動く1本も、シーズン終盤では大きな意味を持つ。\n\nロッテの益田直也は今季、通算250セーブと通算800試合登板をすでに達成している。今日の試合で新しく達成する数字ではないが、長く積み上げた記録を知っていると、登場したときの見え方が変わるのだ。\n\n## 今日の試合で見るなら\nいちばん分かりやすいのは清宮だ。次の1本塁打が通算100号になる。\n\nロッテでは山口が32本塁打でリーグ2位タイ。33号なら単独2位だ。日本ハムの西川遥輝は通算350盗塁（盗塁：投球のすきに次の塁へ走って進むこと）まであと5。こうした「あと○○」を覚えておくと、普通の打席や出塁にも別の意味が見えてくるのだ。"}, "4-07-a": {"meta": {"id": "4-07-a", "title": "背番号の意味は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-02", "4-07"], "sources": ["https://npb.jp/bis/teams/rst_m.html", "https://npb.jp/bis/teams/rst_f.html"]}, "body": "## ひとことで\n**背番号**は、ユニホームの背中などに付く選手の番号だ。==基本は「その選手を見分けるための名前札」と考えればいい。==\n\n## しくみ\n背番号だけを見ても、打順や守備位置は分からない。小さい番号ほど主力、大きい番号ほど控え、と決まっているわけでもないのだ。\n\n同じ選手でも移籍や球団事情で番号が変わることがあるので、==番号そのものを成績のように読む必要はない。== 観戦では、遠くにいる選手を見分ける道具として使うのがいちばん実用的だ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は51番、先発の**ジャクソン**は42番、日本ハムの**清宮幸太郎**は21番だ。名前を聞き逃しても、==背中の数字を見れば「いま誰を見ているか」を取り戻せるのだ。==\n\nたとえば51番が打席に入ったら山口だ。32本塁打の長打力に注目する、と選手カードの情報につなげればいい。"}, "4-07-b": {"meta": {"id": "4-07-b", "title": "打率・本塁打・打点の3つはどう読む？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-03", "4-07"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n打者の数字は、**打率＝ヒットの割合**、**本塁打＝ホームラン数**、**打点＝打撃で生んだ得点**と読む。==「当てる・飛ばす・返す」の3方向から打者を見る数字なのだ。==\n\n## しくみ\n打率は「安打数÷打数」だ。.278なら、打数に対して約27.8％がヒットだったという意味になる。本塁打と打点は割合ではなく、シーズン中に積み上げる個数だ。\n\n==本塁打が多い選手と、打率が高い選手は同じとは限らない。== だから3つを並べると、その選手が「確実に打つ型」か「長打で点を動かす型」かをつかみやすいのだ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は9月27日終了時点で**打率.278・32本塁打・72打点**だ。==まず32本という大きな長打の数字に目を向ければ、山口の特徴を一瞬でつかめる。==\n\nビジョンで数字が3つ並んでも、全部暗記する必要はない。山口なら「32本塁打」、そこから打率と打点を見る順で十分なのだ。"}, "4-07-c": {"meta": {"id": "4-07-c", "title": "投手の勝敗・防御率はどう読む？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-04", "4-07"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\n投手の**勝敗**はその投手に記録された勝ちと負け、**防御率**は9回あたり何点の自責点（投手の責任とされる失点）を許したかを表す数字だ。==防御率は基本的に小さいほど、点を取られにくかったと読めばいい。==\n\n## しくみ\n「9勝8敗」なら、今季その投手に9勝と8敗が記録されているという意味だ。ただし、チームが勝った試合すべてが先発投手の勝ちになるわけではない。\n\n防御率は「自責点×9÷投球回」で計算する。==3.44なら、9回を投げると平均3.44の自責点という見方なのだ。== 勝敗より、投球内容そのものを比べたいときに役立つ。\n\n## 今日の試合で見るなら\nロッテ先発の**ジャクソン**は9勝8敗・防御率3.44、日本ハム先発の**福島蓮**は5勝4敗・防御率3.35だ。数字だけなら防御率はかなり近い。\n\nジャクソンは今日、勝利投手になれば10勝目になる。==ビジョンでは「勝敗」と「防御率」を別の物差しとして見ると、先発投手の紹介が読みやすくなるのだ。=="}, "4-07": {"meta": {"id": "4-07", "title": "ビジョンの選手紹介の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["4-07-a", "4-07-b", "4-07-c"], "related": ["4-01", "4-02", "4-03", "4-04"], "sources": ["https://npb.jp/bis/teams/rst_m.html", "https://npb.jp/bis/teams/rst_f.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/scoring/calculation.html"]}, "body": "## ひとことで\nビジョンの選手紹介は、その選手の「短いプロフィールカード」だ。表示される項目は場面で変わるが、==まず**名前と背番号**、次に**今季成績**を見るだけで十分なのだ。==\n\n## しくみ\n打者なら、よく見る数字は**打率**、**本塁打**、**打点**だ。打率は「どれくらいヒットを打っているか」、本塁打は今季のホームラン数、打点は打撃でどれだけ得点を生んだかを見る数字だ。==3つを全部覚える必要はなく、「当てる・飛ばす・返す」の順に読むと分かりやすい。==\n\n投手なら、**勝敗**と**防御率**が入口になる。勝敗はその投手に記録された勝ちと負け、防御率は9回を投げたとき自責点（守備のミスなどを除き、投手の責任とされる失点）が平均いくつになるかを示す。==防御率は基本的に数字が小さいほど、点を取られにくかったという意味だ。==\n\n背番号は選手を見分ける番号で、打順や守備位置そのものを表す番号ではない。たとえばロッテの**山口航輝**は51番、先発の**ジャクソン**は42番だ。番号の大小から「強い・若い・4番打者」といった意味を読み取る必要はないのだ。\n\n## おもしろエピソード\n数字は、同じ選手でも一晩で変わる。山口は9月27日終了時点で32本塁打なので、今日ホームランを打てば次の紹介では33本になる。==ビジョンは「いまのシーズンが更新されていく画面」でもあるのだ。==\n\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**が出てきたら、本塁打の欄に注目するといい。9月27日終了時点で23本塁打、そして通算100本塁打まであと1本だ。今季の数字と通算記録は別物なので、そこを分けて見ると混乱しにくい。\n\n先発投手では、ロッテのジャクソンが**9勝8敗・防御率3.44**、日本ハムの**福島蓮**が**5勝4敗・防御率3.35**だ。==試合前の紹介でこの4つの数字を拾えれば、「今日はどんな投手同士なのか」がかなり見えてくるのだ。=="}, "4-08-a": {"meta": {"id": "4-08-a", "title": "150キロってどれくらい速い？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-08"], "sources": ["https://npb.jp/news/detail/20191220_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**150km/h**は秒速約41.7mだ。==投手板から本塁まで18.44mを、単純計算なら約0.44秒で進む速さ==なのだ。\n\n## しくみ\n0.44秒は、まばたきをしている間に近い短さだ。しかも打者は、ボールが来てから全部を考えるのではなく、投手の腕の振りや球の出方を見ながら先に判断し始める。\n\n実際の投球では、投手は投手板より前で球を離し、球速も途中で少し落ちる。だから==0.44秒は「距離÷速さ」で出した目安==と考えるとよい。\n\n## 今日の試合で見るなら\n**ジャクソン**や**福島蓮**の球速表示が150前後になったら、次は打者の反応を見るのだ。==差し込まれたファウルや空振りが増えるか==を見ると、「速い」が結果にどう効いたか分かりやすい。"}, "4-08-b": {"meta": {"id": "4-08-b", "title": "変化球は何キロくらい？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-08"], "sources": ["https://npb.jp/news/detail/20201125_03.html", "https://npb.jp/nippons/2017/dailyreport_1101.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**変化球**には「この球種なら何キロ」と決まった速さはない。==100km/h台から140km/h台まで、投手や球種によってかなり幅がある==のだ。\n\n## しくみ\nNPB公式の記事には、150km/h超の直球に**140km/h台の高速フォーク**と110km/h台のカーブを混ぜた例がある。別の日本シリーズでは、140km/h台の直球に120km/h台のチェンジアップを組み合わせた投手も紹介されている。\n\nつまり大事なのは絶対値より**球速差**だ。==150の後に120が来れば約30km/h差==なので、同じ腕の振りに見えるほど打者は合わせにくくなる。\n\n## 今日の試合で見るなら\n**ジャクソン**はチェンジアップ、**福島蓮**はフォークが持ち味として挙げられている。==直球の次に表示が何キロ下がるか==を見れば、緩急（速い球と遅い球の組み合わせ）が見えやすいのだ。"}, "4-08": {"meta": {"id": "4-08", "title": "球速表示の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["4-08-a", "4-08-b"], "related": ["4-01-b", "4-07-c"], "sources": ["https://npb.jp/news/detail/20191220_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**球速表示**は、投手が投げたボールの速さを「km/h」で示す数字だ。==数字が大きいほど速いが、速さだけで打ちにくさが決まるわけではない==のだ。\n\n## しくみ\nたとえば「150 km/h」は、1時間に150km進む速さという意味だ。秒速に直すと約41.7mで、投手板から本塁までの**18.44m**を同じ速さで進むと、単純計算では約0.44秒になる。\n\n実際は投手が投手板より前でボールを離し、球も飛んでいる間に少し減速する。だから0.44秒は厳密な到達時間ではなく、==「考える時間が半秒もない」ほど速い==と感じるための目安なのだ。\n\nただし、打者が困るのは速い直球だけではない。遅い球を見せた後に速い球を投げると、同じ150km/hでもさらに速く感じやすい。**緩急（速い球と遅い球を組み合わせること）**まで見ると、球速表示が急に面白くなる。\n\n## おもしろエピソード\n球速は同じでも、打者からの見え方は投手ごとに違う。投げ方や球の回転、どこからボールが出てくるかで、反応のしやすさが変わるからだ。\n\nだから==「150が出た＝絶対にすごい」「140台＝遅い」とは限らない==。数字は観戦の入口で、結果まで決める採点表ではないのだ。\n\n## 今日の試合で見るなら\n今日の予告先発はロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**だ。ビジョンに球速が出たら、1球だけでなく前後の数字を続けて見てほしい。\n\n==速い球の直後に遅い球が来たとき、打者のタイミングが合うか==が見どころだ。空振りや打ち損じが起きたら、球速差が効いた可能性も考えられるというわけだ。"}, "4-09-a": {"meta": {"id": "4-09-a", "title": "ゲーム差ってどう計算する？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-09"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\n**ゲーム差**は、2チームの勝ち数と負け数の差から出す。==「勝ち数の差＋負け数の差」を2で割る==と考えると分かりやすいのだ。\n\n## しくみ\n9月27日終了時点では、西武が**76勝59敗**、日本ハムが**76勝62敗**だ。勝ち数の差は0、負け数の差は3なので、（0＋3）÷2＝**1.5ゲーム差**になる。\n\n片方が勝って、もう片方が同じ日に負けると差は1.0動く。片方だけが試合をして勝敗がつくと0.5動く。だから==0.5刻みの表示が出る==のだ。\n\n## 今日の試合で見るなら\n**日本ハム**は今日ロッテ戦を戦う。==試合後に順位表の「差」がどう変わったか==を見れば、1勝の重さを数字で確認できるのだ。"}, "4-09-b": {"meta": {"id": "4-09-b", "title": "マジックナンバーって？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-09"], "sources": ["https://npb.jp/news/detail/20260917_04.html", "https://www.nikkansports.com/m/baseball/news/amp/202609130000253.html"]}, "body": "## ひとことで\n**マジックナンバー**は、==ほかのチームの結果に関係なく、あと何勝すれば優勝を決められるか==を表す目安だ。相手が負けても減ることがあるのだ。\n\n## しくみ\n「M2」なら、優勝へ必要な数字があと2という意味だ。自分のチームが勝つだけでなく、追うチームの敗戦でも条件が進む。\n\n2026年のパ・リーグでは、ソフトバンクが9月17日に**マジック2**だった。その日にソフトバンクが勝ち、2位西武が敗れたため、リーグ優勝が決まった。\n\n==ゲーム差とマジックは別の数字==だ。ゲーム差は現在地、マジックは優勝決定までの条件を見る数字と考えるとよい。\n\n## 今日の試合で見るなら\n今日はすでにソフトバンクのリーグ優勝が決まっている。**日本ハム**が争っているのは2位なので、==今日は優勝マジックより西武とのゲーム差を見る場面==なのだ。"}, "4-09": {"meta": {"id": "4-09", "title": "順位表とゲーム差の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["4-09-a", "4-09-b"], "related": ["4-05", "4-06"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/info_cs.html"]}, "body": "## ひとことで\n**順位表**は、各チームの勝敗と勝率を並べた表だ。**ゲーム差**は上のチームとどれくらい離れているかを見る目安で、==「1.5ゲーム差」なら1試合半ぶんの差==と読むのだ。\n\n## しくみ\nまず見るのは「勝・敗・分」と**勝率**だ。NPBの勝率は「勝ち÷（勝ち＋負け）」で計算し、引き分けは分母に入れない。\n\n9月27日終了時点のパ・リーグは、2位西武が**76勝59敗4分**、3位日本ハムが**76勝62敗3分**だ。勝ち数は同じでも、日本ハムのほうが負けが3つ多いので、西武が上になる。\n\nこの2チームの差は1.5ゲームだ。計算では「勝ち数の差」と「負け数の差」を足して半分にする。今回は勝ち数の差が0、負け数の差が3なので、==（0＋3）÷2＝1.5==というわけだ。\n\nただし、ゲーム差だけで順位が決まるわけではない。最終順位は勝率などリーグの規定で決まり、残り試合数が違えばゲーム差だけでは状況を読み切れないのだ。\n\n## おもしろエピソード\nゲーム差は、片方が勝ってもう片方が負けると**1.0**動く。片方だけ試合があり勝敗がつけば0.5動くので、==「0.5」「1.5」のような半端な数字が普通に出る==。\n\n## 今日の試合で見るなら\n今日は3位の**日本ハム**が5位のロッテと戦う。日本ハムは2位西武を1.5ゲーム差で追っており、残りは2試合だ。\n\n==日本ハムにとって今日の1勝は、CSファーストステージを本拠地で戦える2位へ近づくために必要な勝利==なのだ。ロッテ戦を見ながら、同時に西武の結果も確認すると順位表の数字が動く意味が分かりやすい。"}, "4-10-a": {"meta": {"id": "4-10-a", "title": "記号の読み方は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-10"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/"]}, "body": "## ひとことで\nNPB式のスコアは、**数字＝守った場所、英字＝プレーの種類**と考えると読みやすい。==まず「4-3」「F-9」「SO」の3つだけ覚えれば十分==なのだ。\n\n## しくみ\n**4-3**は二塁手が取り、一塁手へ送ってアウト。**F-9**は右翼手へのフライでアウトだ。数字は1投手、2捕手、3一塁、4二塁、5三塁、6遊撃、7左翼、8中堅、9右翼を表す。\n\nNPB式では普通の三振は**SO**と書く。**K**は第3ストライクを捕手が捕れず、打者が走者になれる状態の三振に使うので、==「K＝全部の三振」とは限らない==点に注意なのだ。\n\n## 今日の試合で見るなら\nたとえば**福島蓮**が**山口航輝**を普通の三振に取れば「SO」。右翼フライなら「F-9」だ。==打球がどこへ飛び、誰が処理したかを数字に置き換える==と、スコアが暗号ではなくなるのだ。"}, "4-10": {"meta": {"id": "4-10", "title": "スコアブックって？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["4-10-a"], "related": ["4-01", "4-02"], "sources": ["https://npb.jp/scoring/", "https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**スコアブック**は、試合で起きたことを打者ごとのマスに記録するノートだ。==「誰が、どう出塁し、どうアウトになり、どう得点したか」を後からたどれる==ようにするものなのだ。\n\n## しくみ\n野球は1球ごとの出来事が多いので、文章で全部を書くと長くなる。そこで、守備位置を**1〜9の数字**、プレーを短い記号で表す。\n\nNPB式では、1が投手、2が捕手、3が一塁手、4が二塁手、5が三塁手、6が遊撃手、7が左翼手、8が中堅手、9が右翼手だ。たとえば二塁手がゴロを取り、一塁手へ送ってアウトなら**4-3**と書く。\n\n1人の打者のマスには、その打席の結果だけでなく、走者になった後に二塁、三塁、本塁へどう進んだかも重ねて書ける。==1枚の表が「試合の履歴」になる==というわけだ。\n\nなお、スコアの付け方には複数の流儀がある。NPB公式記録員は慶応式を使い、一般には早稲田式も広く使われている。==記号が少し違っても、プレーを短く残す目的は同じ==なのだ。\n\n## おもしろエピソード\nNPBは公式サイトで、実際の公式記録員と同じ考え方の**NPB式スコアブック**の付け方を公開している。テレビの結果一覧より細かく、「どの野手からどの野手へ送球したか」まで残せる。\n\n## 今日の試合で見るなら\nたとえばロッテの**西川史礁**が二塁ゴロでアウトになれば「4-3」と書ける。**山口航輝**が普通の三振なら、NPB式では「SO」と記す。\n\n==最初から全部つける必要はない==。今日は「4-3」「F-9」「SO」の3つだけ探してみると、試合を見る目が少し細かくなるのだ。"}, "5-01-a": {"meta": {"id": "5-01-a", "title": "日本ハムは何を懸けてる？（西武との2位争い）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n日本ハムにとっては、西武との2位争いを続けるために勝ちたい試合だ。9月27日終了時点で西武が2位、日本ハムが3位、その差は1.5ゲーム（ゲーム差：勝ち数と負け数の開きを試合数で表したもの）になっている。\n\n## しくみ\n日本ハムの残り試合は、今日と10月1日のロッテ戦だけだ。一方、西武は残り4試合ある。日本ハムが2連勝しても、西武が残り4試合で2勝すれば西武が2位になる。日本ハムは勝ち続けたうえで、西武が負けるのを待つ立場なのだ。\n\n2位と3位はどちらもCS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）に出られる。ただしファーストステージは、2026年も2位球団の本拠地で全試合を行う。さらに勝利数が同じなら2位球団が勝ち上がるので、2位にははっきりした利点があるのだ。\n\n## 今日の試合で見るなら\n日本ハム先発は福島蓮。7月12日以来の先発で、9月は救援7試合を無失点でつないできた。短いイニング（回）で継投（投手を何人もつないで投げさせること）するのか、それとも福島を長く引っぱるのか。新庄監督の投手交代も、2位争いを背負った采配として見ると意味が分かりやすい。"}, "5-01-b": {"meta": {"id": "5-01-b", "title": "ロッテにとってはどんな試合？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-02-c", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nロッテは5位で、CS進出の可能性はもうない。それでも、選手の記録と来季につながる競争が残っている試合だ。\n\n## しくみ\nサブロー監督は就任1年目。順位だけを見れば消化試合（順位争いへの影響が小さくなった試合）に近いが、若い選手にとっては来季の役割をつかむ場でもある。\n\n西川史礁は打率3割を狙える位置にいて、山口航輝は32本塁打。先発ジャクソンは9勝で、今日勝てば10勝目だ。チーム順位が決まっても、個人の目標は終わっていないのだ。\n\n## 今日の試合で見るなら\n前日は井上広大が勝ち越し打、寺地隆成が3安打を記録した。今日もこの2人がスタメンなら、結果だけでなく「来季も使いたいと思わせる内容か」という見方ができる。終盤に若手が代打（打つためだけに交代で出る選手）や守備で出てきたら、そこも見逃したくない場面だ。"}, "5-01-c": {"meta": {"id": "5-01-c", "title": "今日の結果で何が決まりうる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01", "5-01-a", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n今日だけで日本ハムの2位が決まるわけではない。ただし日本ハムが負けて、同じ時間に楽天と戦う西武が勝つと、日本ハムの3位が確定する。\n\n## しくみ\n9月27日終了時点で、日本ハムは2位西武と1.5ゲーム差（勝ち数と負け数の開きを試合数で表したもの）で、残り2試合だ。西武は残り4試合ある。日本ハムが今日負けると、2位の望みは「残り1試合に勝ち、西武が残り4試合すべてに負ける」場合だけになる。\n\n逆に今日勝てば、2位争いは10月1日のロッテ戦まで続く。NPBの2026年CS要項では、ファーストステージの球場はすべて2位球団の専用球場と決まっている。日本ハムのCS出場（3位以内）はすでに決まっているので、今日の1勝はCSの開催地を争う1勝なのだ。\n\n## 今日の試合で見るなら\n日本ハムが終盤でリードしていたら、継投（投手を何人もつないで投げさせること）が普段より細かくなる可能性がある。清宮幸太郎や万波中正の一発だけでなく、新庄監督が福島蓮から誰へつなぐかにも注目すると、試合の重さが見えやすい。"}, "5-01": {"meta": {"id": "5-01", "title": "今日はどんな試合なの？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-01-a", "5-01-b", "5-01-c"], "related": ["5-05", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n日本ハムには2位争いがかかった、かなり重い一戦だ。ロッテはCS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）には行けないが、記録や来季につながる見どころが多い。\n\n## しくみ\n9月27日終了時点で、パ・リーグはソフトバンクの優勝が決まっている。2位は西武、3位は日本ハムで、その差は1.5ゲーム（ゲーム差：勝ち数と負け数の開きを試合数で表したもの）だ。日本ハムの残りは今日と10月1日のロッテ戦、2試合しかない。\n\nCSのファーストステージは2位と3位が戦う。2026年は全試合を2位球団の本拠地で行うので、2位になる意味は「順位が一つ上」だけではないのだ。ただし西武は残り4試合あり、日本ハムが2連勝しても西武が2勝すれば西武が2位だ。日本ハムは勝ち続けて、西武の負けを待つしかない。\n\n一方のロッテは5位で、CS進出の可能性はない。ただし、先発のジャクソンは勝てば10勝目。山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。勝敗とは別に、個人の節目がいくつも残っている試合なのだ。\n\n## おもしろエピソード\n前日の9月27日は、ロッテが日本ハムに6対1で勝った。日本ハムから見れば、2位争いの最中に連敗は避けたい。ロッテから見れば、順位が決まっていても上位争いの相手に簡単には譲らない、という構図になっている。\n\n## 今日の試合で見るなら\nまず日本ハムの3番候補・清宮幸太郎に注目だ。通算100本塁打まであと1本なので、1打席ごとに球場の空気が変わるかもしれない。\n\nロッテでは先発ジャクソンの10勝目と、山口の33号が分かりやすい見どころだ。試合の勝敗、順位争い、個人記録を同時に追うと、今日がただの「シーズン終盤の1試合」ではないことが見えてくる。"}, "5-02-a": {"meta": {"id": "5-02-a", "title": "球団の歴史は？（名前の変遷）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/corp/history/1955.html", "https://www.marines.co.jp/corp/history/1960.html", "https://www.marines.co.jp/corp/history/1965.html", "https://www.marines.co.jp/corp/history/1990.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\nいまの千葉ロッテは、1950年の「毎日オリオンズ」から続く球団だ。会社や本拠地の変化に合わせて名前を変え、1992年から「千葉ロッテマリーンズ」になった。\n\n## しくみ\n大きな流れはこうだ。毎日オリオンズから、大毎オリオンズ、東京オリオンズ、ロッテオリオンズへと変わり、千葉移転で現在の名前になった。\n\n1969年にロッテとの業務提携で「ロッテオリオンズ」が誕生。1991年に千葉への本拠地移転を決め、公募で「マリーンズ」という名前が選ばれた。1992年が千葉ロッテの最初のシーズンだ。\n\n## 今日の試合で見るなら\nZOZOマリンでロッテを応援していると「最初から千葉の球団」に見えるかもしれない。でも球団史をさかのぼると、東京や川崎の時代にたどり着く。今日サブロー監督や山口航輝を見るとき、その長い歴史のいちばん新しいページだと思うと、見え方が少し変わる。"}, "5-02-b": {"meta": {"id": "5-02-b", "title": "日本一の年は？（2005年・2010年の下剋上）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-05"], "sources": ["https://npb.jp/nippons/2005/index.html", "https://npb.jp/nippons/2010/", "https://www.marines.co.jp/corp/history/2005.html", "https://www.marines.co.jp/corp/history/2010.html"]}, "body": "## ひとことで\nロッテの日本一は1950年、1974年、2005年、2010年の4回だ。最近の2回は、レギュラーシーズン1位ではない位置から短期決戦を勝ち上がった。\n\n## しくみ\n2005年はレギュラーシーズン2位からプレーオフ（シーズン後に上位球団で行う短期決戦）を勝ち抜き、リーグ優勝。日本シリーズでは阪神に4連勝し、31年ぶりの日本一になった。当時は現在と制度が違うので、今のCSと完全に同じではない。\n\n2010年はレギュラーシーズン3位からCSを突破。日本シリーズでは中日を4勝2敗1分で破り、5年ぶり4度目の日本一になった。3位から日本一まで進んだため、「下剋上」の象徴として語られる年だ。\n\n## 今日の試合で見るなら\n現在のサブロー監督は、2005年の日本一で主力だった選手だ。今日ベンチの監督を見たら、「この人はロッテが日本一になった時代をグラウンドで経験している」と覚えておくと、球団史が急に近くなる。"}, "5-02-c": {"meta": {"id": "5-02-c", "title": "今年のロッテは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-01-b", "5-02", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n2026年のロッテは、9月27日終了時点でパ・リーグ5位。CS進出の可能性はなく、サブロー監督の1年目は上位争いに届かなかった。\n\n## しくみ\nチーム打率（打数のうちヒットになった割合）は.236で、得点を安定して作るのに苦しんだ。一方で山口航輝は32本塁打まで伸ばし、西川史礁も、規定打席（打率の順位に載るのに必要な打席数）に達した打者の中で打率がリーグ上位にいる。順位は低くても、打線の軸になりそうな選手は見えてきているのだ。\n\nシーズン終盤は、若手や新戦力を見きわめる時期でもある。前日の日本ハム戦では寺地隆成が3安打、井上広大が勝ち越し打を記録し、ロッテが6対1で勝った。\n\n## 今日の試合で見るなら\n山口の一発に加えて、寺地、井上、西川史礁の打席も続けて見るといい。今日の結果が順位を大きく変えなくても、「来年の打線に誰が残るか」という視点では一打席ずつに意味がある。"}, "5-02-d": {"meta": {"id": "5-02-d", "title": "有名なOBは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1980.html", "https://www.marines.co.jp/corp/history/1985.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\nロッテの昔のスターなら、落合博満、村田兆治、有藤道世を知っておくと話がつながりやすい。打者、投手、生え抜き（入団した球団で長くプレーし続けた選手）の象徴という三つの方向から球団史を見られる。\n\n## しくみ\n落合博満はロッテ時代に三冠王（打率・本塁打・打点の3部門すべて1位）を1982年、1985年、1986年の3度獲得した大打者だ。\n\n村田兆治は豪快な「マサカリ投法」で知られ、右肘の手術から復活。1989年に通算200勝を達成した。有藤道世は長くロッテ一筋でプレーし、1985年に2000安打を達成。「ミスター・ロッテ」と呼ばれた存在だ。\n\n## 今日の試合で見るなら\n山口航輝が30本塁打を超えたことで、球団の長打者の歴史がまた話題になっている。今日33号が出たら、昔の落合のような大打者と比べる材料が一つ増える。記録は、昔の選手と今の選手をつなぐ物差しなのだ。"}, "5-02": {"meta": {"id": "5-02", "title": "ロッテってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-02-a", "5-02-b", "5-02-c", "5-02-d"], "related": ["5-01", "5-06", "5-07"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/special/70th/history.html", "https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n千葉ロッテマリーンズは、1950年の毎日オリオンズを出発点に持つパ・リーグの球団だ。1992年から千葉を本拠地にし、いまの「マリーンズ」という名前になった。\n\n## しくみ\n球団の歴史はかなり長い。1950年に毎日オリオンズとして始まり、大毎オリオンズ、東京オリオンズ、ロッテオリオンズと名前を変え、1992年に千葉ロッテマリーンズになった。\n\n日本一は1950年、1974年、2005年、2010年の4回。特に2005年と2010年は、上位チームを短期決戦で倒して頂点まで進んだ年として記憶されている。2010年はレギュラーシーズン3位から日本一になった。\n\n2026年は9月27日終了時点で5位。CS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）には進めないが、山口航輝の長打力や、西川史礁ら若い打者の成長など、来季につながる材料を探す終盤になっている。\n\n## 歴史・由来\n「マリーンズ」は海に近い千葉を本拠地にすることと相性のよい名前だ。球団は1991年に千葉への移転を決め、公募で「マリーンズ」を採用。1992年から千葉ロッテマリーンズとしてスタートした。\n\n## おもしろエピソード\n1980年代には落合博満がロッテで三冠王を3度獲得した。1989年には村田兆治が通算200勝を達成している。昔から、個性の強い大打者や投手が何人もいた球団なのだ。\n\n## 今日の試合で見るなら\n2番候補の山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。1番候補の西川史礁は打率3割が見える位置だ。\n\nそして監督のサブローも、2005年の日本一メンバーだった。今日のベンチを見ると、球団の過去と現在が同じ場所につながっているのが分かる。"}, "5-03-a": {"meta": {"id": "5-03-a", "title": "東京から北海道へ移ったのはなぜ？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-03-b"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://www.fighters.co.jp/news/detail/00000742.html"]}, "body": "## ひとことで\n東京ドームを本拠地にしていた日本ハムは、2004年に北海道へ移った。大きく言えば、北海道に根を張る「地域密着の球団」へ転換するための移転だった。\n\n## しくみ\n東京時代は、東京ドームを巨人と分け合う形で16年間使っていた。球団は2002年7月、2004年から札幌ドームへ本拠地を移すことを正式決定した。\n\n北海道移転後は「Sports Community（スポーツを通じた地域づくり）」を企業理念に掲げ、北海道各地との活動を広げていった。単に試合をする場所を東京から札幌へ替えただけではなく、球団の土台そのものを北海道につくり直した、と考えるとわかりやすい。\n\n## 歴史・由来\n2004年は新庄剛志が加入した年でもある。移転3年目の2006年にはリーグ優勝、日本一まで進んだ。\n\n## 今日の試合で見るなら\n今日、日本ハムはビジター（相手の本拠地に出向いて戦う側）としてZOZOマリンに来ている。ユニフォームの胸にある「FIGHTERS」は、22年前に北海道へ移り、地域と一緒に育ってきた球団の名前なのだ。"}, "5-03-b": {"meta": {"id": "5-03-b", "title": "エスコンフィールドって？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/00003788.html", "https://www.fighters.co.jp/news/detail/202500696362.html", "https://npb.jp/games/2026/info_cs.html", "https://prtimes.jp/main/html/rd/p/000000099.000079562.html"]}, "body": "## ひとことで\nエスコンフィールドHOKKAIDOは、2023年3月に北海道北広島市で開業した日本ハムの本拠地だ。開閉式の屋根と天然芝を組み合わせた球場で、約3万5000人を収容する。\n\n## しくみ\n正式には北海道ボールパークFビレッジの中心にある球場だ。大きなガラス壁、開閉式屋根、天然芝が特徴で、球場内には飲食店やホテル、温泉・サウナなどもある。\n\nつまり「野球を見るためだけの建物」というより、一日過ごせる街の中心に球場がある設計なのだ。\n\n## おもしろエピソード\n屋根は巨大な一枚屋根が移動して開閉する。2023年には、屋根を開けた状態で初めて公式戦も行われた。\n\n## 今日の試合で見るなら\n日本ハムが今季2位で終われば、10月10日からのCSファーストステージは2位球団の本拠地で行われる。だから今日の勝利は、「エスコンでCSを開く」可能性を残すためにも必要なのだ。"}, "5-03-c": {"meta": {"id": "5-03-c", "title": "大谷翔平やダルビッシュがいたって本当？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-03-d"], "sources": ["https://www.fighters.co.jp/news/detail/00003549.html", "https://npb.jp/bis/players/61965110.html", "https://npb.jp/bis/players/01305137.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n本当だ。ダルビッシュ有は2005〜2011年、大谷翔平は2013〜2017年に日本ハムでプレーした。二人とも、北海道移転後のファイターズを代表する選手なのだ。\n\n## しくみ\nダルビッシュは高校から入団し、日本ハムで7年間に93勝。2006年の日本一や2007年のリーグ連覇を支えるエースになった。\n\n大谷は2012年ドラフト1位で入り、2013年から投手と打者の「二刀流」に挑戦した。2016年には投打の両方で活躍し、チームの日本一に貢献している。\n\n二人はその後、米大リーグへ移った。だから日本ハムは、世界で知られる選手を日本で育てた球団でもあるわけだ。\n\n## 今日の試合で見るなら\n今日の日本ハム先発は23歳の福島蓮だ。育成ドラフト（まず育成選手として契約する選手を選ぶドラフト）から入り、支配下（一軍の公式戦に出られる正式な選手枠）を勝ち取った若い右腕で、5勝4敗、防御率3.35。ダルビッシュや大谷とはタイプも歩みも違うが、「若い投手が大舞台を任される」という日本ハムの歴史を思い出して見ると面白い。"}, "5-03-d": {"meta": {"id": "5-03-d", "title": "新庄監督ってどんな人？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/202500780959.html", "https://www.fighters.co.jp/news/detail/202600951850.html", "https://www.nikkansports.com/baseball/news/202609240001679.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n新庄剛志監督は、現役時代にも日本ハムでプレーした元外野手だ。2022年から監督を務め、選手起用や試合前後の発信まで含めて注目を集めるタイプなのだ。\n\n## しくみ\n現役では阪神から米大リーグへ渡り、2004年に日本ハムへ加入した。ちょうど球団が北海道へ移った年で、2006年の日本一を最後に引退している。\n\n監督には2022年に就任した。最初の2年は6位だったが、2024年、2025年は2年連続2位。2026年は9月27日終了時点で3位にいる。\n\n9月24日、本拠地での最終戦のあとには、2027年も続投する意向を明らかにした。来季は監督6年目になる。\n\n## おもしろエピソード\n選手として北海道移転元年に加わり、今は監督としてエスコンフィールドのベンチにいる。日本ハムの北海道時代を、選手と監督の両方で知る人物なのだ。\n\n## 今日の試合で見るなら\n日本ハムが2位へ上がるには、残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日の先発は、9月に救援で7試合無失点だった福島蓮。約2カ月半ぶりの先発をどこまで投げさせ、どの投手につなぐかは、新庄監督の大きな判断になる。"}, "5-03": {"meta": {"id": "5-03", "title": "日本ハムってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-03-a", "5-03-b", "5-03-c", "5-03-d"], "related": ["5-01", "5-05", "5-06"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n北海道日本ハムファイターズは、2004年から北海道を本拠地にするパ・リーグの球団だ。北海道移転後は2006年と2016年に日本一になっている。\n\n## しくみ\nもともとは東京を本拠地にしていたが、2004年から札幌ドームへ移り、現在は北広島市のエスコンフィールドHOKKAIDOが本拠地だ。\n\n球団の特徴を一つに決めるのは難しい。けれど、ダルビッシュ有や大谷翔平のような若い選手が大きく育った歴史があり、今も清宮幸太郎、万波中正、水野達稀らが中心になっている。\n\n2026年は9月27日終了時点でパ・リーグ3位だ。2位の西武とは1.5ゲーム差（勝ち数と負け数の開きを試合数で表したもの）で、残りはロッテとの2試合だけ。2位で終われば、クライマックスシリーズ（CS：日本シリーズ進出を争う短期決戦）の最初の舞台を自分たちの本拠地で戦える。\n\n## 歴史・由来\n球団は1974年に「日本ハムファイターズ」として発足した。2004年の北海道移転は大きな転換点で、2006年には44年ぶりの日本一を達成した。その後も北海道を代表する球団として歩み、2023年からエスコンフィールドを本拠地にしている。\n\n## おもしろエピソード\n北海道移転元年の2004年には、新庄剛志が選手として加入した。今、その新庄が監督としてベンチにいるのだ。球団の「北海道時代」の始まりと現在が、一人の人物でつながっている。\n\n## 今日の試合で見るなら\n日本ハムは今日を含む残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日負けて西武が勝てば、3位が確定する。\n\n予想スタメンでは清宮が3番の指名打者（守備につかず打撃を担当する選手）で、通算100本塁打まであと1本。まずは「日本ハムは順位を上げるために勝ちが必要な側」と覚えておけば、攻撃の一球ごとの重さが見えやすくなる。"}, "5-04-a": {"meta": {"id": "5-04-a", "title": "セ・リーグとの違いは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-04", "5-04-b"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html"]}, "body": "## ひとことで\n2026年の大きな違いは、パ・リーグには指名打者（DH：投手の代わりに打つ専門選手）がいて、セ・リーグでは投手も打席に立つことだ。ただし、この違いは2026年で終わる。\n\n## しくみ\nパ・リーグは1975年からDH制を使っている。投手は基本的に投げることへ集中し、打線には別の打者が1人入る。\n\nセ・リーグは長く「9人野球」を続けてきたが、2027年からDH制を採用すると正式決定した。だから2026年は、セ・リーグの投手が公式戦で普通に打席へ入る最後のシーズンなのだ。\n\nボールカウントやアウトの取り方など、野球の基本ルールは両リーグで同じだ。所属する6球団と、DHの扱いが主な違いなのだ。\n\n## 今日の試合で見るなら\n今日のロッテと日本ハムはどちらもパ・リーグなのでDHを使える。予想ではロッテの山口航輝、日本ハムの清宮幸太郎が指名打者。守備につかず、「打つ仕事」に集中する選手として見ればいい。"}, "5-04-b": {"meta": {"id": "5-04-b", "title": "交流戦って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-04", "5-04-a"], "sources": ["https://npb.jp/interleague/2026/schedule_note_il.html", "https://npb.jp/interleague/2026/"]}, "body": "## ひとことで\n交流戦は、普段は別リーグにいるセ・リーグとパ・リーグの球団が対戦する公式戦だ。2005年に始まり、2026年は各球団18試合を戦った。\n\n## しくみ\n各チームは、別リーグの6球団と3試合ずつ対戦する。合計18試合で、ホーム9試合、ビジター9試合だ。\n\n「特別なイベント試合」ではなく、勝敗はそのままシーズンの成績に入る。交流戦で大きく勝ち越せば、その後のリーグ順位にも効くというわけだ。\n\n2026年の交流戦は5月26日から行われた。\n\n## 歴史・由来\n交流戦が始まる前は、日本シリーズなどを除けば別リーグの球団が公式戦で当たる機会は少なかった。今は毎年、普段見ない組み合わせを楽しめる期間になっている。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは交流戦ではなく、パ・リーグ同士の試合だ。だから日本ハムの勝敗は、目の前の2位争いにそのまま響く。"}, "5-04-c": {"meta": {"id": "5-04-c", "title": "パ・リーグの6球団は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-04", "5-02", "5-03"], "sources": ["https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/"]}, "body": "## ひとことで\nパ・リーグには**6球団**ある。==今日戦う千葉ロッテと北海道日本ハムも、同じパ・リーグの仲間だ。==\n\n## しくみ\n6球団は、**千葉ロッテマリーンズ**、**北海道日本ハムファイターズ**、福岡ソフトバンクホークス、埼玉西武ライオンズ、オリックス・バファローズ、東北楽天ゴールデンイーグルスだ。\n\n同じリーグなので、シーズン中はこの6球団どうしで何度も対戦する。今日のロッテ対日本ハムも、そのリーグ戦の一つというわけだ。\n\n==覚えるなら「ロッテ・日本ハム・ソフトバンク・西武・オリックス・楽天」の6つで十分だ。==\n\n## 今日の試合で見るなら\n今季のロッテ対日本ハムは、今日の試合前まで**日本ハムの13勝10敗**だ。==同じ相手と何度も戦うから、前の対戦の結果や相性も今日の作戦につながるのだ。=="}, "5-04": {"meta": {"id": "5-04", "title": "ロッテや日ハムがあるパ・リーグって？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "children": ["5-04-a", "5-04-b"], "related": ["5-03", "5-05"], "sources": ["https://npb.jp/news/detail/20260326_02.html", "https://npb.jp/games/2026/", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\nパ・リーグは、日本のプロ野球12球団を二つに分けたうちの一方だ。ロッテ、日本ハム、ソフトバンク、西武、オリックス、楽天の6球団が所属している。\n\n## しくみ\n正式にはパシフィック・リーグという。もう一方がセントラル・リーグ、略してセ・リーグだ。\n\n普段の公式戦では、同じリーグの6球団どうしで多く対戦する。2026年は1球団143試合で、そのうち125試合が同じリーグとの対戦、18試合がセ・パ交流戦（別リーグとの公式戦）だ。\n\nシーズン終了時の順位は、まずリーグ内で決まる。1位がリーグ優勝で、1〜3位がクライマックスシリーズ（CS：日本シリーズ進出を争う短期決戦）へ進む。そこから勝ち上がった1球団が、セ・リーグ側の勝者と日本シリーズで戦う。\n\n## 歴史・由来\nセ・リーグとパ・リーグの2リーグ制は1950年に始まった。長く大きな違いだったのが指名打者（DH：投手の代わりに打つ専門選手）の有無で、パ・リーグは1975年から採用している。\n\n## おもしろエピソード\n2026年は、長く続いた「パはDH、セは投手も打つ」という違いの最後の年だ。セ・リーグも2027年からDH制を採用することが決まっている。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは、同じパ・リーグ同士の公式戦だ。ロッテは5位でCS進出の可能性がなく、日本ハムは3位で2位西武を1.5ゲーム差（勝ち数と負け数の開きを試合数で表したもの）で追っている。同じ1勝でも、今の両チームでは順位への意味が違うのだ。"}, "5-05-a": {"meta": {"id": "5-05-a", "title": "日本シリーズまでの流れは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "related": ["5-05", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/event/2026/", "https://npb.jp/nippons/2025/information.html"]}, "body": "## ひとことで\n道順は「レギュラーシーズン→CSファースト→CSファイナル→日本シリーズ」だ。CSはクライマックスシリーズ（日本シリーズ進出を争う短期決戦）の略だ。セ・リーグとパ・リーグから1球団ずつが勝ち残り、最後に日本一を争う。\n\n## しくみ\nパ・リーグなら、まず2位と3位がCSファーストステージを戦う。その勝者が1位球団とファイナルステージで対戦し、勝った球団がパ・リーグ代表として日本シリーズへ進む。\n\nセ・リーグでも同じ流れで1球団を決める。最後の日本シリーズは最大7試合で、一方が4勝した時点で終了する。\n\n2026年の日本シリーズは10月24日に開幕予定だ。\n\n## 今日の試合で見るなら\n日本ハムにとって、今日の先にある最短ルートはこうだ。まず2位を取りにいき、10月10日からのCSファーストステージを勝つ。そのうえで、リーグ1位のソフトバンクとのファイナルを突破する。今日のロッテ戦は、その長い階段の入口にある1試合なのだ。"}, "5-05-b": {"meta": {"id": "5-05-b", "title": "CSのファーストステージとファイナルステージの違いは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-05", "5-05-c", "5-01"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html"]}, "body": "## ひとことで\n**ファーストステージ**は2位対3位、**ファイナルステージ**は1位対その勝者だ。==「まず挑戦者を決め、次にリーグ1位へ挑む」と考えるとわかりやすい。==\n\n## しくみ\nファーストは**3試合制**で、先に2勝した側が勝ち上がる。全試合が2位球団の本拠地で行われ、勝利数が同じなら2位球団が進む。\n\nファイナルは1位球団の本拠地で行う。基本は1位に**1勝のアドバンテージ**があり、最大6試合で先に4勝に届いた側が日本シリーズへ進む。2026年からは条件によって、1位に2勝を与える最大7試合制になる場合もある。\n\n==ファーストより、ファイナルのほうが1位球団に明確な有利さがあるのだ。==\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、2位西武と**1.5ゲーム差**だ。==2位になれば最初のCSを自分たちの本拠地で始められる。== 今日のロッテ戦は、その位置を争うための一戦なのだ。"}, "5-05-c": {"meta": {"id": "5-05-c", "title": "2位と3位で何が違う？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-05", "5-05-b", "5-01-a"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\nCSには2位も3位も出られるが、==**2位のほうがファーストステージでかなり有利**だ。== 本拠地で戦え、勝利数が並んだ場合も2位が勝ち上がる。\n\n## しくみ\nファーストステージは2位対3位の3試合制だ。**全試合を2位球団の本拠地**で行う。\n\nさらに、引き分けなどで両チームの勝利数が同じまま終われば、レギュラーシーズン上位の2位がファイナルへ進む。つまり3位は、基本的に==2位より多く勝たなければならない立場==なのだ。\n\n## 今日の試合で見るなら\n日本ハムは3位で、2位西武と**1.5ゲーム差**。残りは今日と10月1日のロッテ戦2試合で、今日の試合データでは**2連勝が最低条件**だ。\n\n==2位まで上がればCS最初の舞台が本拠地になる。== だから、すでにCS進出が決まっていても今日の1勝には大きな意味があるのだ。"}, "5-05": {"meta": {"id": "5-05", "title": "クライマックスシリーズ（CS）って？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-05-a"], "related": ["5-01", "5-03", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\nクライマックスシリーズ（CS）は、リーグ戦のあとに1〜3位が日本シリーズ進出を争う短期決戦だ。リーグ優勝そのものは1位の球団だが、CSを勝ち抜かないと日本シリーズには行けない。\n\n## しくみ\nまず「ファーストステージ」で2位と3位が対戦する。3試合制で先に2勝したほうが勝ち上がり、全試合を2位球団の本拠地で行う。同じ勝利数になった場合も、上位の2位球団が進む。\n\n次の「ファイナルステージ」は1位球団対ファーストステージ勝者だ。基本は1位球団に最初から1勝（アドバンテージ：あらかじめ与えられる有利な勝ち星）を与える。最大6試合で、その1勝も含めて先に4勝した側が日本シリーズへ進む。\n\n2026年からは追加ルールができた。1位と勝ち上がり球団のレギュラーシーズンの差が10ゲーム（ゲーム差：勝ち数と負け数の開きを試合数で表したもの）以上、または勝ち上がり球団の勝率が5割未満なら、1位に2勝のアドバンテージを与え、最大7試合・5勝先取になる。\n\nつまり、レギュラーシーズンで上にいるほど有利に作られているのだ。\n\n## 歴史・由来\n今の形のCSは2007年から両リーグで行われている。2026年はファーストステージが10月10日、ファイナルステージが10月14日に始まる。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、2位西武とは1.5ゲーム差だ。西武は残り4試合あり、日本ハムは勝ち続けたうえで西武の負けを待つ立場だ。2位になれば、CSの最初の最大3試合をエスコンフィールドで戦える。CS出場はすでに決まっている日本ハムにとって、今日の1勝は「どこでCSを戦うか」に関わるというわけだ。"}, "5-06-a": {"meta": {"id": "5-06-a", "title": "清宮幸太郎の100号って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/41545136.html", "https://www.nikkansports.com/baseball/news/202609260001489.html?mode=all"]}, "body": "## ひとことで\n「100号」は、清宮幸太郎がプロ野球の公式戦で打った通算100本目のホームランという意味だ。9月27日終了時点で99本なので、今日1本出れば到達する。\n\n## しくみ\n通算本塁打は、その年だけではなくプロ入り後の本塁打を全部足した数字だ。清宮は2018年に7本を打ち、2026年はここまで23本。積み上げた合計が99本になっている。\n\n100という数字そのものに得点が増える特別ルールはない。ただ、長く一軍で長打を重ねたことが目に見える節目なのだ。\n\n## 今日の試合で見るなら\n清宮の打席では、打球が外野フェンスを越えるかだけを追えばいい。ジャクソンの失投（投手が狙いを外した甘い球）を一振りで仕留めれば、その一発が通算100号になる。"}, "5-06-b": {"meta": {"id": "5-06-b", "title": "山口航輝の「40年ぶり」って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/91895138.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/86265", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n山口航輝が今季30本塁打に到達したのが、ロッテの日本人選手では1986年の落合博満以来40年ぶりだった、という意味だ。\n\n## しくみ\n「30本」は1シーズンで打ったホームラン数の区切りだ。外国人選手を含めればロッテにも30本以上の例はあるが、日本人選手に限ると長い空白があったのだ。\n\n山口は9月15日の日本ハム戦で29号と30号を2打席連続で放った。30号は9回の決勝本塁打で、その一発が試合の勝敗と40年ぶりの記録を同時に決めた。\n\n## 今日の試合で見るなら\n今日の相手も日本ハムだ。山口は今季32本塁打まで伸ばしているので、打席では「もう30本を超えた長距離打者」として、外野へ上がる大きな打球に注目するといい。"}, "5-06-c": {"meta": {"id": "5-06-c", "title": "ジャクソンの10勝目って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\nアンドレ・ジャクソンは今季9勝8敗で、今日勝てばシーズン10勝目になる。2025年もDeNAで10勝しているので、達成すれば2年連続の2桁勝利なのだ。\n\n## しくみ\n投手の「勝ち」は、登板した試合でチームが勝てば自動で付くわけではない。先発投手（試合の最初から投げる投手）なら、基本は5回以上を投げ、交代したあとも味方がリードを守ると勝ち投手になる。\n\n「10勝」は1年で10試合の勝ち投手になった、という区切りだ。ジャクソンは今季ロッテで9勝しており、チーム内でも最多タイの勝ち星を持っている。\n\n## 今日の試合で見るなら\nロッテが先に点を取り、ジャクソンが5回以降までリードを守れるかを見るといい。そのままロッテが勝てば、今日が今季10勝目になる可能性があるのだ。"}, "5-06": {"meta": {"id": "5-06", "title": "今日の注目選手は？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-06-a", "5-06-b", "5-06-c"], "related": ["5-07"], "sources": ["https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/43745159.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n今日なら、日本ハムの清宮幸太郎、ロッテの山口航輝、ロッテ先発のアンドレ・ジャクソンを追うと分かりやすい。3人とも、きょう動くかもしれない節目を持っているのだ。\n\n## しくみ\n清宮は通算本塁打（プロ入り後に打ったホームランの合計）が99本で、あと1本で100号だ。これは今季だけの数字ではなく、2018年の1年目から積み上げた合計なのだ。\n\n山口は今季32本塁打。9月15日に30号へ到達し、ロッテの日本人選手では1986年の落合博満以来40年ぶりに、1シーズン30本へ乗せた。\n\nジャクソンは今季9勝8敗、防御率3.44。今日勝てば10勝目で、2025年の10勝に続く2年連続の2桁勝利になる。\n\n## おもしろエピソード\n山口の節目の30号は、今日と同じ日本ハム戦だった。9回に決勝本塁打を打ち、29号との2打席連続本塁打で、一気に30本へ届いた。\n\n## 今日の試合で見るなら\n日本ハムの攻撃では、清宮の打席で「あと1本」を思い出せばいい。ロッテの攻撃では、山口の大きな打球を追う。\n\nロッテの守りでは、ジャクソンが勝ち投手の権利（リードした状態で5回以上を投げ終え、勝ち投手になれる資格）を持って降板できる展開になるかを見る。こう見ておけば、3つの節目を同時に追えるのだ。"}, "5-07-a": {"meta": {"id": "5-07-a", "title": "各スタメンのカード（18人）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n両チームの予想スタメン18人は、それぞれカードで特徴と見どころを確認できる。全員を先に覚える必要はないのだ。\n\n## しくみ\nスタメン（試合開始時に出る選手）は両チーム9人ずつだ。カードには、打つ特徴、守る場所、最近の調子など、観戦中に使いやすい情報をまとめている。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られる。まず1番打者、次に得点につながりやすい中軸（打線の中心になる打者）だけ見ておくと、試合の流れを追いやすい。"}, "5-07-b": {"meta": {"id": "5-07-b", "title": "両先発投手のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n今日の予告先発（試合の最初から投げる予定の投手）は、ロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。2人とも右投手なのだ。\n\n## しくみ\n先発投手は、試合の最初の数回を任される投手だ。ジャクソンは今季9勝8敗、防御率3.44、福島は5勝4敗、防御率3.35。数字だけでなく、球種や最近の登板もカードで確認できる。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られる。ロッテの守りではジャクソン、日本ハムの守りでは福島のカードを開き、どんな球で打者を抑えようとしているかを見るといい。"}, "5-07-c": {"meta": {"id": "5-07-c", "title": "スタメン候補・ブルペン・代打代走のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n試合はスタメン（試合開始時に出る選手）だけで終わらない。途中から出る選手を見ると、監督がどこで勝負をかけたか分かるのだ。\n\n## しくみ\nブルペンは、途中から投げる投手たちのことだ。代打は打つために交代で出る選手、代走は走るために交代で出る選手を指す。\n\nスタメン候補も含め、実際に誰が出るかは試合展開で変わる。だから先に全員を覚えるより、交代が告げられた時にカードを開く方が効率がいいというわけだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られる。場内アナウンスで新しい名前が呼ばれたら、その選手だけ確認すれば十分だ。"}, "5-07-d": {"meta": {"id": "5-07-d", "title": "両監督のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "sources": ["https://www.marines.co.jp/news/detail/202500743647.html", "https://www.fighters.co.jp/news/detail/202500796590.html"]}, "body": "## ひとことで\n今日の監督は、ロッテがサブロー、日本ハムが新庄剛志だ。選手交代や投手交代を決める、試合中の指揮役なのだ。\n\n## しくみ\n監督は、誰をスタメン（試合開始時に出す選手）にするか、いつ投手を代えるか、誰を代打や代走で送るかを決める。スコアだけでは見えないが、交代のタイミングには監督の考えが出やすい。\n\n## 今日の試合で見るなら\n上の「スタメン」から両監督のカードが見られる。選手交代が続いた場面でカードを開くと、「なぜこの選手を今出したのか」を考える手がかりになるのだ。"}, "5-07": {"meta": {"id": "5-07", "title": "スタメン表（選手・監督カード）", "category": "5", "level": "1", "priority": "star", "needs_check": false, "children": ["5-07-a", "5-07-b", "5-07-c", "5-07-d"], "related": ["4-02", "5-06"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\nスタメン（試合開始時に出る選手）は、打順と守る場所を見るための名簿だ。このガイドでは、選手名を覚えるより先にカードを開けば十分なのだ。\n\n## しくみ\n今日の予想スタメンは、ロッテ9人、日本ハム9人の計18人だ。これに両チームの先発投手（試合の最初から投げる投手）、途中から出る候補、両監督のカードがある。\n\n実際のスタメンは試合前の発表で変わることがある。予想と違う名前が出ても異常ではなく、その日の相手投手や選手の状態で入れ替わるのだ。\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られる。名前が分からなくなったら、打席に入った選手やマウンド（投手が投げる場所）にいる投手のカードだけ開けばいい。"}, "5-08-a": {"meta": {"id": "5-08-a", "title": "雨が降ったら試合はどうなる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-08", "7-09"], "sources": ["https://npb.jp/npb/2025rules.html", "https://www.marines.co.jp/ticket/faq/", "https://www.marines.co.jp/ticket/refund/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n屋外球場なので、雨が強ければ**開始を遅らせる、中断する、中止する**ことがある。==少し降っただけで必ず中止になるわけではなく、安全に続けられるかで決まるのだ。==\n\n## しくみ\n試合前なら開催を見合わせたり、中止にしたりする。始まったあとも、天候やグラウンド状態で安全な試合が難しければ中断や打ち切りがあり得る。公認野球規則でも、天候や球場状態などを理由に試合を延期・中止できる。\n\n雨天中止になったロッテ主催試合のチケットは、購入方法に応じて払い戻しの扱いが変わる。球団は原則、==中止翌日から2週間を払戻期間==として案内している。\n\n## 今日の試合で見るなら\nNPBの日程表示では、今日のZOZOマリンは**くもり時々雨**だ。==雨が来たら、まず場内アナウンスと球団公式の案内を見るのが確実だ。== ジャクソンや福島蓮が投げ始めたあとでも、中断はあり得るのだ。"}, "5-08-b": {"meta": {"id": "5-08-b", "title": "海風の強さは試合前にわかる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-08", "2-06-a"], "sources": ["https://sports.yahoo.co.jp/official/detail/2024051700070-spnaviow", "https://www.marines.co.jp/news/detail/00000651.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nだいたいは天気予報で見当をつけられるが、==球場に入ったら**バックスクリーンの風向・風速表示**を見るのがいちばんわかりやすい。== ZOZOマリンには、風を数字で見られる表示があるのだ。\n\n## しくみ\nZOZOマリンは海に近く、強い風が名物の球場だ。球場のバックスクリーンには**風向と風速**が表示されるので、試合前から「どちら向きに、どれくらい吹いているか」を確認できる。\n\n風は時間によって変わる。==予報だけで決めつけず、入場後の表示をもう一度見る==とよい。\n\n## 今日の試合で見るなら\nNPBの日程ページでは今日の天気は**くもり時々雨**だが、風速までは出ていない。==開場後にまず風向・風速表示を見ておこう。== **ジャクソン**の変化球や、**山口航輝・万波中正**の高い打球が風にどう動かされるかを見ると、マリンらしさがわかりやすいのだ。"}, "5-08": {"meta": {"id": "5-08", "title": "今日の天気と風は？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["7-04", "2-03-b"], "sources": ["https://www.data.jma.go.jp/yoho/data/jishin/met/kishoushien_Chiba_Chiba-shi.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html"]}, "body": "## ひとことで\n今日のZOZOマリンは、雨と風を意識して観る試合なのだ。気象庁の11時発表では、試合開始の18時ごろは雨、24℃、風速8m/sの予想になっている。\n\n## しくみ\n18時までの3時間雨量は5〜9mmの予想だ。21時も雨で、気温23℃、風速4m/sと見込まれている。試合中ずっと同じ降り方や風とは限らないので、空と球場の様子も合わせて見るとよい。\n\n野球では、風の影響を受けやすいのは高く上がった打球だ。空中にいる時間が長いほど、打球は風に押される時間も長くなる。逆に、速いゴロ（地面を転がる打球）は風の影響が比較的小さい。\n\nただし、気象庁の数字は千葉市付近の予報だ。球場内の風向や強さが、その数字と完全に同じとは限らない。外野の旗や選手のユニホーム、外野手が打球に合わせて動く方向を見ると、その瞬間の風がわかりやすいのだ。\n\n## おもしろエピソード\nZOZOマリンでは、球団が花火の打ち上げ場所を当日の風向で変えることがある。海側からの風では、ライトスタンド背面から打ち上げる場合もあるほど、風は球場運営にも関わる要素なのだ。\n\n## 今日の試合で見るなら\nロッテの山口航輝や日本ハムの清宮幸太郎が高い打球を上げたら、ボールだけでなく外野手も見てほしい。最初に落下地点へ走ったあと、途中で進路を変えたなら、風を読み直している可能性がある。\n\n特に18時前後は風速8m/sの予想だ。大きなフライ（高く上がった打球）が上がるたびに、旗の向きと外野手の動きをセットで見ると、今日のマリンらしい「風も守備の相手」という感覚がつかみやすいのだ。"}, "5-09-a": {"meta": {"id": "5-09-a", "title": "高野脩ってどんな投手？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-09", "5-12"], "sources": ["https://npb.jp/bis/players/31035157.html", "https://pacificleague.com/news/2026/9/86609"]}, "body": "## ひとことで\n前日の勝利投手、**高野脩汰**はロッテの左腕だ。==9月に先発へ回ってから安定し、前日は6回1失点で4勝目を挙げた。==\n\n## しくみ\n高野は184cm、88kgの**左投左打**。出雲商、関西大、日本通運を経て、2022年ドラフト4位でロッテに入った。\n\n9月27日の日本ハム戦は**6回99球、5安打、1四球、8奪三振、1失点**。3回に進藤勇也へ本塁打を打たれたが、その後は追加点を許さなかった。\n\nこの試合で==先発転向後4試合連続のQS==。先発に回ってからは3勝1敗、防御率1.67と好成績を残している。\n\n## 今日の試合で見るなら\n今日は高野ではなく**ジャクソン**がロッテの先発予定だ。==昨日は左腕、今日は右腕という違い==を、日本ハム打線がどう攻略するか比べるとおもしろいのだ。"}, "5-09-b": {"meta": {"id": "5-09-b", "title": "井上広大の決勝打って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-09", "5-10"], "sources": ["https://sports.yahoo.co.jp/official/detail/2026092700184-spnaviow", "https://baseball.yahoo.co.jp/npb/game/2021039466/top", "https://npb.jp/bis/players/31335151.html"]}, "body": "## ひとことで\n前日の**井上広大**の決勝打は、1-1の4回、1死一、三塁で放った左前への適時打だ。==この一打でロッテが2-1と勝ち越し、そのまま一度も追いつかれなかった。==\n\n## しくみ\n「決勝打」は、最終的に勝敗を分けるリードを生んだ一打のことだ。\n\n4回裏、ロッテは寺地隆成の安打、小川龍成の犠打、髙部瑛斗の安打で**1死一、三塁**。ここで8番の井上が三遊間を破り、三塁走者が生還した。\n\nその後、山口航輝の2点適時打も出て4-1。==井上の1点が、3点を奪う回の入口になったのだ。==\n\n## 今日の試合で見るなら\n井上は前々日の9月26日にも7号2ランを放ち、前日は決勝打だった。==今日も予想スタメンなら8番・一塁。== 上位打線が作った走者を返す場面で、もう一度打席が回るかに注目するとよいのだ。"}, "5-09": {"meta": {"id": "5-09", "title": "前日（9/27）の試合はどうだった？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-09-a", "5-09-b"], "related": ["5-01", "5-10", "5-11"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/bis/teams/results_m_index.html", "https://sports.yahoo.co.jp/official/detail/2026092700184-spnaviow", "https://baseball.yahoo.co.jp/npb/game/2021039466/top"]}, "body": "## ひとことで\n前日9月27日は、**ロッテが日本ハムに6-1で勝った**。==ロッテは同点にされたあと、4回に井上広大の一打で勝ち越し、そのまま突き放したのだ。==\n\n## しくみ\nロッテは1回、**寺地隆成**の適時二塁打（走者をホームへ返す二塁打）で先制した。日本ハムは3回、**進藤勇也**の8号ソロ本塁打で1-1に追いつく。\n\n流れが変わったのは4回裏だ。ロッテは1死一、三塁から**井上広大**が左前へ適時打を放ち、2-1と勝ち越した。さらに2死満塁で**山口航輝**が2点適時打。==この回だけで3点を取り、4-1に広げた。==\n\n8回には**髙部瑛斗**が2点適時二塁打を放ち、6-1。ロッテは10安打で6点を取った。\n\n投げては先発の**高野脩汰**が6回99球、5安打1四球、8奪三振、1失点。3回に本塁打を浴びたあとも崩れず、4勝目を挙げた。==日本ハムは6安打を放ったが、得点は進藤の本塁打による1点だけだった。==\n\n## おもしろエピソード\n高野は9月に先発へ回ってから、前日の試合で**4試合連続QS**（先発が6回以上を投げて3自責点以内）を達成した。中継ぎから先発へ役割が変わっても、安定して試合を作っているのだ。\n\n## 今日の試合で見るなら\n今日も同じZOZOマリンでロッテ対日本ハムだ。ロッテは前日に勝ち越し打を放った**井上広大**や、3安打2打点の**髙部瑛斗**がそのまま勢いを持ち込めるかが見どころになる。\n\n日本ハムは2位争いのため勝利が必要だ。==昨日1点に抑えられた打線が、今日は右腕**アンドレ・ジャクソン**から早い回に点を取れるか==を見ると、前日との違いがつかみやすいのだ。"}, "5-10-a": {"meta": {"id": "5-10-a", "title": "山口航輝の33号はありそう？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-06-b", "5-10", "5-12-a"], "sources": ["https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0922/m-b-24/", "https://npb.jp/scores/2026/0915/f-m-22/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n==**33号は十分にあり得るが、「出そう」と断言できるものではない**==。山口航輝は9月27日終了時点で**32本塁打**を放っており、1球の失投を本塁打にできる打者だからだ。\n\n## しくみ\n\n本塁打は、打者の調子だけで決まらない。投手の球種、コース、風、打席で何球見られるかでも変わる。山口は長打率.588で、単打より長打の価値が大きいタイプだ。\n\n9月22日には32号を放ち、9月27日も2安打している。さらに9月15日の日本ハム戦では**29号、30号を1試合で2本**打った。==今日の相手だから打てる、とまでは言えないが、実際にこの対戦で一発を出している==のは見どころになる。\n\n## 今日の試合で見るなら\n\n山口の打席では、まず日本ハム先発の**福島蓮**が初球から強く勝負するかを見るといい。福島の直球やフォークが甘く入れば、一振りで33号になる可能性がある。\n\n逆に四球でも失敗ではない。==山口を警戒して歩かせれば、それだけ次の打者に走者を置いて勝負することになる==。本塁打だけでなく、相手がどう警戒するかも見どころなのだ。"}, "5-10-b": {"meta": {"id": "5-10-b", "title": "西川史礁ってどんな選手？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-07-a", "5-10"], "sources": ["https://npb.jp/bis/players/21625150.html", "https://npb.jp/news/detail/20251126_01.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n\n**西川史礁**は、広角に強い打球を飛ばすロッテの若い外野手だ。==2025年のパ・リーグ新人王で、2年目の今季も打線の中心にいる==。\n\n## しくみ\n\n青山学院大から2024年ドラフト1位で入団した右打者だ。1年目の2025年は打率.281、27二塁打を記録し、新人王を受賞した。\n\n2026年9月27日終了時点では**打率.292、145安打、8本塁打**。本塁打だけを狙う大砲ではなく、強い打球を広い方向へ飛ばして安打を重ねるタイプだ。==「まず塁に出る人」と「長打もある人」を一人で兼ねられるのが強み==なのだ。\n\n## 今日の試合で見るなら\n\n予想では1番・左翼だ。最初の打席で出塁すると、すぐ後ろに**山口航輝**がいるため、日本ハム側は序盤から走者を背負うことになる。\n\n守備では左翼に飛んだ打球への一歩目も見てほしい。==打つだけでなく、1番打者として何回塁に出るか==を見ると、西川の価値が分かりやすい。"}, "5-10": {"meta": {"id": "5-10", "title": "今日のロッテ打線の見どころは？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-10-a", "5-10-b"], "related": ["5-06", "5-07", "5-12"], "sources": ["https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/", "https://npb.jp/scores/2026/0922/m-b-24/"]}, "body": "## ひとことで\n\n今日のロッテ打線は、==**山口航輝の一発**と、直近で当たっている下位打線がつながるか==が見どころだ。前日9月27日は6得点しており、上位だけでなく**井上広大**や**髙部瑛斗**も得点に絡んでいる。\n\n## しくみ\n\n打線は、1番から9番までが順番に打つ並びのことだ。強い打者が一人いても、その前に走者がいなければ本塁打は1点で終わる。逆に、前の打者が塁に出れば同じ長打でも2点、3点になりやすい。\n\nロッテで最も分かりやすい長打役が**山口航輝**だ。9月27日終了時点で**32本塁打**。ただし今日は山口だけを見ればいいわけではない。==**西川史礁が塁に出て、山口や中軸へ回せるか**==を見ると打線の形が分かりやすい。\n\nもう一つは下位打線だ。**髙部瑛斗**は9月25〜27日の3試合で計6安打5打点、**井上広大**も26日に7号2ラン、27日に勝ち越し適時打を放っている。下位から走者が出れば、次の回に1番へつながりやすくなるのだ。\n\n## おもしろエピソード\n\n山口は9月22日のオリックス戦で32号を放った。9月15日の日本ハム戦では29号と30号を同じ試合で打っており、30号は9回の決勝弾だった。\n\n西川史礁は前日の初回に内野安打で出塁し、先制のホームを踏んでいる。==**「誰が打ったか」だけでなく、「誰が塁に出て点になったか」まで見ると打線が立体的に見える**==。\n\n## 今日の試合で見るなら\n\n最初に見るのは**西川史礁→山口航輝**の流れだ。西川が出塁した直後に山口へ回れば、日本ハム先発の**福島蓮**は一発だけでなく走者も気にしなければならない。\n\nそして7〜9番で走者が出たら、次の1番まで目を離さないことだ。==下位打線が作った走者を、上位が返せるか==。そこを見ると、今日のロッテ打線がつながっているかが分かる。"}, "5-11-a": {"meta": {"id": "5-11-a", "title": "清宮・万波・野村の中軸って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-06-a", "5-11", "5-11-b"], "sources": ["https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n**中軸**とは、打線の中心になる3〜5番あたりの強打者のことだ。今日の日本ハムでは、==**清宮幸太郎・野村佑希・万波中正の長打力**==が得点の中心になる。\n\n## しくみ\n\n9月27日終了時点で、清宮は**23本塁打**、野村は**17本塁打**、万波は**21本塁打**。3人とも一打で二塁打や本塁打にできるため、走者がいる場面では特に怖い並びになる。\n\nただし役割は少し違う。清宮は左打ちで四球も選べる。野村は右打ちで直近3試合9打数3安打。万波は大きな一発と強肩が魅力だが、最近は安打が少ない。\n\n==**3人全員が本塁打を狙うのではなく、誰かが塁に出て次へつなぐことも大切**==なのだ。\n\n## 今日の試合で見るなら\n\nロッテ先発の**ジャクソン**がこの3人にどう投げ分けるかを見るといい。清宮には左打者への攻め、野村と万波には力勝負が増えるかもしれない。\n\n==走者ありでこの3人に回ったら、日本ハムの大きな得点チャンス==だ。打球が外野の頭を越えるかに注目すると分かりやすい。"}, "5-11-b": {"meta": {"id": "5-11-b", "title": "レイエスの離脱の影響は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-11", "5-11-a"], "sources": ["https://www.fighters.co.jp/en/news/detail/202600947378.html", "https://npb.jp/bis/2026/stats/idb1_f.html"]}, "body": "## ひとことで\n\n影響は大きい。**フランミル・レイエス**は9月16日に右ハムストリングス肉離れと診断され、==**32本塁打・82打点の打者を欠いた状態**==で終盤戦を戦っている。\n\n## しくみ\n\nレイエスは9月27日終了時点で打率.313、32本塁打、82打点。長打を打つだけでなく、多くの走者をホームへ返してきた打者だ。\n\nこういう打者が抜けると、相手投手は残った強打者をより厳しく攻めやすくなる。たとえば清宮を歩かせても、後ろにレイエスがいないため以前とは打線の圧力が変わる。\n\nそのため、**野村佑希**が4番を担い、**万波中正**や若手が得点を補う必要がある。==一人で穴を埋めるのではなく、複数人で打席をつなぐ形が必要==なのだ。\n\n## 今日の試合で見るなら\n\n清宮が四球で歩いた後の打者に注目してほしい。そこで野村や万波が返せれば、レイエス不在でも打線が機能していると言える。\n\n==「レイエスがいないから誰が4番か」より、「得点の仕事を誰が分担するか」==を見ると影響が分かりやすい。"}, "5-11": {"meta": {"id": "5-11", "title": "今日の日本ハム打線の見どころは？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-11-a", "5-11-b"], "related": ["5-06", "5-07", "5-12"], "sources": ["https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/bis/teams/index_f.html", "https://npb.jp/scores/2026/0927/m-f-23/", "https://www.fighters.co.jp/en/news/detail/202600947378.html"]}, "body": "## ひとことで\n\n今日の日本ハム打線は、==**水野達稀が塁に出て、清宮幸太郎・野村佑希・万波中正へ走者を残せるか**==がポイントだ。主砲の**レイエス**が離脱しているため、一人の一発より打線全体で穴を埋める必要がある。\n\n## しくみ\n\n日本ハムは直近3試合の得点が**0点、2点、1点**と少ない。打線が苦しいときは、長打だけでなく、四球や単打で走者をためることが重要になる。\n\n予想1番の**水野達稀**は、9月27日までに打率.285、11本塁打、15盗塁。先頭打者が出ると、投手は走者も気にしながら中軸と勝負しなければならない。==**1番が出塁できるかで、3〜5番の一打の価値が変わる**==のだ。\n\n中心になるのは**清宮幸太郎、野村佑希、万波中正**。清宮は23本塁打、野村は17本塁打、万波は21本塁打を記録している。一方で万波は直近3試合で11打数1安打と、復帰後の調子が上がりきっていない。\n\n## おもしろエピソード\n\n清宮は通算100本塁打まであと1本だ。記録がかかる打席では、相手投手も簡単な球を投げにくくなる。\n\n野村は前日の9回に左前打を放っており、直近3試合では9打数3安打。==打線全体が低調な中でも、野村は比較的安打が出ている==。\n\n## 今日の試合で見るなら\n\nロッテ先発は右腕の**アンドレ・ジャクソン**だ。まず1回表、水野が出塁して清宮まで走者を残せるかを見るといい。\n\nその後は清宮の100号だけを待つのではなく、**野村と万波がどう続くか**を見る。==レイエス不在でも中軸が3人で得点を作れるか==が、今日の日本ハム打線の見どころなのだ。"}, "5-12-a": {"meta": {"id": "5-12-a", "title": "福島蓮はどこまで投げそう？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-12", "5-10"], "sources": ["https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0915/f-m-22/"]}, "body": "## ひとことで\n\n目安は==**3〜5回、60〜80球くらいで次の投手へつなぐ展開**==だ。断定はできないが、**福島蓮**は最近まで救援で短いイニングを投げており、今日は約2カ月半ぶりの先発だからだ。\n\n## しくみ\n\n福島は今季26試合で5勝4敗1セーブ5ホールド、防御率3.35。9月は救援7試合で無失点と好調だが、救援は通常、先発より短い距離を全力で投げる役割だ。\n\n先発に戻ると、同じ投手でも必要な体力配分が変わる。1回から全力で飛ばせば、4回や5回で球数が増えることもある。==今日のポイントは「何点取られたか」だけでなく、「何球で何回まで行けたか」==なのだ。\n\n## 今日の試合で見るなら\n\n3回終了時点で球数が**50球前後**なら、次の回からブルペンが忙しくなる可能性がある。逆に少ない球数で抑えていれば、5回以降も続投しやすい。\n\nロッテの**山口航輝、西川史礁**らを相手に、==走者をためずに短い回で切れるか==を見ると、福島がどこまで投げられそうか予想しやすい。"}, "5-12-b": {"meta": {"id": "5-12-b", "title": "ロッテの勝ちパターン（中継ぎ・抑え）は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-12", "5-07-c"], "sources": ["https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/scores/2026/0925/l-m-22/", "https://npb.jp/scores/2026/0926/l-m-23/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n今日のロッテが終盤にリードしていたら、==**中森俊介か八木彬でつなぎ、9回は横山陸人**==が基本線だ。左の**鈴木昭汰**は9月25〜27日に3連投しており、今日は休養の可能性が高い。\n\n## しくみ\n\n**勝ちパターン**とは、リードしている試合の終盤に出す信頼度の高い救援投手の並びだ。ロッテでは中森が7勝1敗16ホールド、防御率2.35。八木は9勝1敗11ホールド、防御率2.17と安定している。\n\n最後を任される**横山陸人**は33セーブ、防御率2.50。9回に3点以内のリードなど、セーブが付く場面で出ることが多い。\n\nただし毎日同じ順番とは限らない。==連投している投手を休ませることも、長いシーズンでは大事な作戦==なのだ。\n\n## 今日の試合で見るなら\n\n7回以降にロッテが1〜3点リードしていたら、ブルペンから誰が出てくるかを見るといい。**中森、八木、横山**なら、勝ち切るための形に入ったと考えやすい。\n\nもし鈴木が4日連続で出てきたら、==それだけ監督がその場面を重要だと見ているサイン==になる。"}, "5-12": {"meta": {"id": "5-12", "title": "今日の継投はどうなりそう？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-12-a", "5-12-b"], "related": ["5-07", "5-10", "5-11"], "sources": ["https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/scores/2026/0925/l-m-22/", "https://npb.jp/scores/2026/0926/l-m-23/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n今日は両チームとも、==**先発を長く引っ張るより、試合の途中から救援投手を細かくつなぐ展開**==になりやすい。特に日本ハムは、約2カ月半ぶりに先発する**福島蓮**をどこで代えるかが最初の分岐点だ。\n\n## しくみ\n\n**継投**とは、先発投手から中継ぎ、抑えへ投手を交代しながら試合を進めることだ。投手は疲れるほど球速や制球が落ちやすいため、監督は「まだ投げられるか」だけでなく、次の打者との相性や翌日の予定も考える。\n\n日本ハムの福島は今季5勝4敗1セーブ5ホールド、防御率3.35。9月は救援で投げており、今日は7月12日以来の先発だ。==**先発用の長い投球を最近していないため、早めの継投を想定して見ると分かりやすい**==。\n\n日本ハムの後ろには左の**島本浩也、堀瑞輝**、右の**孫易磊**、最後には29セーブの**柳川大晟**がいる。ロッテは**中森俊介、八木彬、横山陸人**が終盤の軸になる。\n\nただしロッテの**鈴木昭汰**は9月25〜27日に3連投している。==今日もし登板すれば、それだけ重要な場面だと考えられる==。\n\n## おもしろエピソード\n\n中森は救援で7勝1敗、八木は9勝1敗。中継ぎ投手なのに勝ち星が多いのは、同点や僅差で登板した直後に味方が勝ち越す試合が多いからだ。\n\n抑えの横山は33セーブだが、9月26日は9回に逆転サヨナラ負けを喫した。投手は前の失敗をすぐ次の試合で取り返すこともある。\n\n## 今日の試合で見るなら\n\nまず**福島が何回まで投げるか**。4回や5回で交代したら、日本ハムはそこから複数の投手を使うことになる。\n\nロッテが終盤にリードしていたら、7〜9回の名前を覚えるといい。==中森か八木でつなぎ、最後に横山が出れば「勝ちパターン」らしい流れ==だ。反対に違う投手が出れば、連投や相性を考えた組み替えだと分かる。"}, "5-13-a": {"meta": {"id": "5-13-a", "title": "日本ハムの13勝10敗の中身は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-13", "5-09"], "sources": ["https://npb.jp/scores/2026/0915/f-m-22/", "https://npb.jp/scores/2026/0927/m-f-23/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n\n**13勝10敗**は、日本ハムが23試合で3勝多いという意味だ。==残り2試合をロッテが両方勝っても13勝12敗なので、日本ハムの今季勝ち越しはすでに確定している==。\n\n## しくみ\n\n13勝10敗を割合にすると、日本ハムの勝率はこのカードで約56.5％。数字だけ見ると日本ハム優勢だが、9月の2試合はロッテが連勝している。\n\n9月15日はロッテが7-6。9月27日は6-1だった。==シーズン全体では日本ハムが上でも、直近の直接対決ではロッテが勝っている==という、二つの見方が同時に成り立つのだ。\n\n残りは今日9月28日と10月1日の2試合。日本ハムが両方勝てば15勝10敗、ロッテが両方勝てば13勝12敗になる。\n\n## 今日の試合で見るなら\n\n前日ロッテが6-1で勝った直後なので、序盤の流れに注目だ。**日本ハムが先に点を取って流れを戻すか、ロッテが再び先手を取るか**で空気が変わる。\n\n==対戦成績は過去23試合の合計で、今日の1試合はそこへ新しく1つ数字を足す試合==と考えると分かりやすい。"}, "5-13": {"meta": {"id": "5-13", "title": "両チームの今季の対戦は？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["5-13-a"], "related": ["5-01", "5-09", "5-10", "5-11"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0915/f-m-22/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n9月27日終了時点の今季対戦は、==**日本ハムの13勝10敗**==だ。日本ハムが勝ち越しているが、差は3試合で、今日を含めてまだ2試合残っている。\n\n## しくみ\n\n同じリーグの球団は、シーズン中に何度も対戦する。そこで作られる「この相手には何勝何敗」という成績が**対戦成績**だ
