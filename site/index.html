**で途中交代だった。\n- エピソード：9月25日に遊撃で先発した翌日から2試合は、楽天から加入した山崎剛が遊撃で先発した。シーズン終盤でも若手に自動的に打席が与えられるわけではなく、1打席ずつが来季の競争にもつながる状況なのだ。\n- 調子：二軍では夏場に打率.300まで上げたが、一軍では今季**15三振／38打数**で、直近の先発でも2三振。==二軍で取り戻した速球対応を、一軍の球速・変化量で再現できるかが現在のいちばん分かりやすい調子の物差し==になる。\n- 分析・論点：打率.132だけを見ると苦戦しているが、39打席という小さい標本でもあるため、数字だけで能力を決めつける段階ではない。内野の複数ポジションを守れる価値がある一方、先発を増やすには打席で「次も使いたい」と思わせる内容が必要なのだ。\n- 今日の見どころ：スタメンなら、福島の直球系に対して引っ張り一辺倒にならず、持ち味の広角打撃が出るかを見る。途中出場なら、代打や守備からの1打席で結果を残せるかがポイントで、==出番の少なさそのものが今日の一打の重さを大きくしている==。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001302.html\n- https://www.marines.co.jp/team/player/detail/2025_00001183.html\n- https://npb.jp/bis/players/81885150.html\n- https://ja.wikipedia.org/wiki/%E5%AE%AE%E5%B4%8E%E7%AB%9C%E6%88%90\n- https://pacificleague.com/player/525099\n- https://pacificleague.com/news/2024/10/10034996\n- https://www.nikkansports.com/baseball/news/202410240001661.html\n- https://www.nikkansports.com/baseball/news/202410280001604.html\n- https://www.nikkansports.com/baseball/news/202412040001025.html\n- https://www.nikkansports.com/baseball/news/202501120000715.html\n- https://pacificleague.com/zh-CHT/news/2024/11/10035442\n- https://baseballking.jp/ns/460074/\n- https://column.sp.baseball.findfriends.jp/?id=103-20250804-07&pid=column_detail\n- https://sp.baseball.findfriends.jp/player/20000267/\n- https://baseball.omyutech.com/playerTop.action?playerId=2511092\n- https://news.mynavi.jp/article/20260922-5008083/\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://npb-meikan.jp/21961/\n- https://note.com/orions_marines/n/ndf19f0802a2c", "detail": true, "number": "44", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/c/c7/Ryusei_Miyazaki.jpg", "file": "https://commons.wikimedia.org/wiki/File:Ryusei_Miyazaki.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%AE%AE%E5%B4%8E%E7%AB%9C%E6%88%90", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Ryusei_Miyazaki.jpg/330px-Ryusei_Miyazaki.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "横山陸人", "title": "横山陸人（#15、抑え、右投右打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：右のサイドスローから**平均150.2km/h、最速155km/h**のストレートを投げ込み、2026年はその直球が投球の**55.9%**を占める。そこにシンカー、スライダー、カットボールを混ぜ、==横から来るのに球速まで速いという見えにくさが最大の武器==なのだ。\n- ユニークポイント：高校時代から横手投げで、専大松戸の先輩・高橋礼の身体の使い方も参考にしてきた。2026年から背番号を**60→15**に変更し、前任の美馬学と自分が同じ持丸修一監督の教え子である縁も背負って守護神を務めている。\n\n### 見どころ\n- 今日の試合で見るべき場面：ロッテが1〜3点ほどリードして9回を迎えたら、横山の出番がいちばん分かりやすい。**9月26日**は2点リードの9回に4連打を浴びて一死も取れず逆転サヨナラ負け、27日は登板しなかったため、==今日は「失敗の次のセーブ機会」をどう投げるかが最大の見どころ==なのだ。\n- 注目の数字・プレー：**9月26日時点で52試合、2勝3敗、33セーブ、7ホールド、防御率2.50**。33セーブはリーグ上位の数字で、投球を見るなら速い直球だけでなく、空振り率の高いシンカーとスライダーを決め球にできるかにも注目したい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム戦では**9月15日**に9回途中から登板して33セーブ目を挙げている。2024年の侍ジャパン取材では日本ハムの清宮幸太郎について「どうやって抑えようかいつも迷う」と答えており、通算100本塁打目前の清宮と終盤に当たれば、以前から意識してきた強打者との勝負になるのだ。\n\n### 出立ち\n- 身長・体重・体格：**180cm・90kg**。細身のサイドスローというより、下半身と肩回りに厚みがあり、横方向の腕の振りから強い球を押し込む体格なのだ。\n- 投打・フォームの特徴：右投右打のサイドスロー。2026年の球種割合はストレート**55.9%**、シンカー**25.6%**、スライダー**15.6%**、カットボール**3.0%**で、直球と沈む球を軸に横の角度を使う。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：マウンドでは右腕が地面に近い横の軌道を通るため、初心者でもフォームの違いを見つけやすい。球団公式Q&Aではチャームポイントを「**肩**」、試合前のルーティンを「少しだけ寝る」と答えている。\n- 背番号の由来・愛称・登場曲：2020〜2025年は**60**、2026年から**15**。15は引退した美馬学が着けていた番号で、横山は美馬と高校時代の恩師・持丸修一氏が同じという縁を挙げ、「この番号に恥じない選手に」と語った。愛称は「よこ」、登場曲はSHE'S「追い風」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：東京都江戸川区南篠崎町出身。南篠崎小3年のとき、兄の友人の影響で南篠崎ランチャーズに入り、最初は捕手として野球を始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：南篠崎小、上一色中、専大松戸高を経て高卒でロッテ入り。中学では軟式野球部で投手となり、3年時に全国大会**準優勝**、専大松戸では2年秋からエースを担い、2019年春の千葉県大会で準優勝した。\n- 野球のエピソード：中学の全国大会決勝で、星稜中の奥川恭伸と投げ合った経験がある。高校では最速**148km/h**の横手投げとして注目され、専大松戸OBの高橋礼が行っていた胸郭や股関節の柔軟性を高めるトレーニングも取り入れたのだ。\n- 野球以外のエピソード：江戸川区の選手紹介では趣味を「家でゆっくりすること」と答えている。2026年の球団公式Q&Aでも「少しだけ寝る」を試合前ルーティンに挙げ、苦手な食べ物はパクチーとするなど、休養を大事にする一面が見える。\n- 印象的な試合：中学3年の全国大会決勝は、のちにプロで活躍する奥川と同じ舞台で投げた試合として経歴上の大きな節目なのだ。高校では2019年春の千葉県大会で専大松戸を準優勝に導き、高卒ドラフト候補として評価を固めた。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学軟式の全国大会準優勝、高校では千葉県大会準優勝。高校時代に世代別代表経験はなかったが、プロ入り後に侍ジャパンまで上がることになる点がこの経歴の面白さなのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト4位**で千葉ロッテから指名され、契約金**4000万円**、年俸**560万円**（いずれも推定）で合意した。入団時は「一軍で1年間を通して勝ち続けられる投手」を目標に掲げた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年入団、2021年に一軍デビュー。2023年は**38試合**で1セーブ8ホールド、2024年は**43試合・防御率1.71**、2025年は**50試合・12セーブ・20ホールド・防御率2.08**と段階的に終盤の重要な役割へ上がり、2026年に守護神へ定着した。\n- 野球のエピソード：2023年のアジアプロ野球チャンピオンシップで初めてトップチームの侍ジャパンに選ばれ、その経験を接戦での投球に生かしたと語っている。2024年にはさらに球威を上げ、プレミア12代表にも選出されたのだ。\n- 野球以外のエピソード：2025年オフの背番号変更では、美馬学との「持丸監督つながり」に強く反応し、15番を着けることを「意気に感じる」と表現した。単なる若い番号への変更ではなく、先輩との系譜を意識して受け取った番号なのだ。\n- 印象的な試合：一軍初登板は**2021年5月26日の阪神戦（甲子園）**で、1回を投げて無失点。さらに2024年には本人が侍ジャパンの取材で、オリックス戦で奪った「三者連続三振」をその年の印象的なプレーに挙げている。\n- 実績（タイトル・表彰・通算記録・代表）：**2023年アジアプロ野球チャンピオンシップ**、**2024年プレミア12**の侍ジャパンに選出。9月26日終了時点のNPB通算は**194登板、9勝11敗、49セーブ、53ホールド、防御率2.95**で、タイトルはまだないが救援投手として実績を積み上げている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**52登板、2勝3敗、33セーブ、7ホールド、50回1/3、防御率2.50、34奪三振**。被安打42、与四球20で、圧倒的な奪三振型というより強い球と打たせる球を組み合わせて最後を締めている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年オフに背番号を**60から15**へ変え、2026年は開幕から9回を任される守護神へ役割が一段上がった。前年12セーブから今季33セーブまで伸ばし、チームの試合終盤の基準点になっている。\n- 野球のエピソード：2026年の球団公式Q&Aで「今年の俺のここに注目！」に「**強い球！**」と答えた通り、平均150km/hを超える直球を中心にしている。フォームの珍しさより、サイドスローでこの球速を出すことが今季の強さなのだ。\n- 野球以外のエピソード：愛称は「よこ」で、性格を「ちょっとだけ真面目」、自分へのご褒美を「好きなものを食べる」と答えている。==守護神という重い役割とは対照的に、公式プロフィールでは力の抜けた答えが多い==のも人柄の見えやすいところだ。\n- 印象的な試合：**9月15日の日本ハム戦**では7-6の9回途中から登板し、33セーブ目。対して**9月26日の西武戦**では4-2の9回に4連打を浴び、アウトを一つも取れず3失点で逆転サヨナラ負けとなり、守護神の明暗が短期間に両方出た。\n- 実績（今季の記録・表彰）：9月26日時点の**33セーブ**はパ・リーグ上位の数字で、前年の12セーブを大きく更新した。2026年オールスターの抑え投手部門ファン投票では**393,037票**で2位となり、ファンからの認知度も上がっている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。25日の西武戦は1回を**6球、無安打無失点**、26日は9回に4打者連続安打で**0回3失点・敗戦投手**、27日の日本ハム戦は登板しなかった。\n- エピソード：26日の逆転負け後、サブロー監督は横山について「横山で負けたんなら仕方ない」という趣旨で守護神への信頼を示しつつ、救援陣に責任を求めた。翌27日は6-1で勝ったためセーブ機会自体がなく、実戦での“やり直し”は今日以降へ持ち越しなのだ。\n- 調子：25日は6球で三者を片づけた直後、26日は一死も取れず4連打と振れ幅が大きい。1試合の炎上だけで長期不調とは断定できないが、==今日はストレートが高く浮かず、シンカーを低めに集められるかが立ち直りを測るポイント==になる。\n- 分析・論点：今季33セーブを挙げている事実と、直近のサヨナラ負けは両方見る必要がある。クローザーは失敗が目立ちやすい役割なので、27日に休養を挟んだことで、球威と制球が通常状態へ戻るかが論点なのだ。\n- 今日の見どころ：9回にリードしていれば登場そのものが見どころになる。特に清宮、万波、水野ら日本ハムの中軸・上位へ回る場面なら、==「強い球」で押すのか、シンカーやスライダーでタイミングを外すのかという配球まで見ると守護神の仕事が分かりやすい==。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001281.html\n- https://npb.jp/bis/players/23125151.html\n- https://ja.wikipedia.org/wiki/%E6%A8%AA%E5%B1%B1%E9%99%B8%E4%BA%BA\n- https://en.wikipedia.org/wiki/Rikuto_Yokoyama\n- https://baseball.yahoo.co.jp/npb/player/1900083/year\n- https://www.city.edogawa.tokyo.jp/e028/sports/sports/athlete/yokoyama_yakyuu.html\n- https://www.nikkansports.com/baseball/news/201911070000726.html\n- https://www.daily.co.jp/baseball/2019/11/08/0012858965.shtml\n- https://www.marines.co.jp/news/detail/00004962.html\n- https://www.japan-baseball.jp/jp/profile/202311005.html\n- https://www.japan-baseball.jp/jp/news/press/20231024_1.html\n- https://pacificleague.com/news/2024/10/10034514\n- https://www.jsports.co.jp/baseball/premier12/samuraijapan/rikuto_yokoyama/\n- https://www.marines.co.jp/news/detail/202500748420.html\n- https://www.nikkansports.com/baseball/news/202511250000410.html\n- https://npb.jp/allstar/2026/ballotresult.html\n- https://pacificleague.com/game/36546\n- https://news.mynavi.jp/article/20260915-4820298/\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.nikkansports.com/baseball/news/202609260001502.html\n- https://note.com/basebowyer/n/n5a8b774b7d4f", "detail": true, "number": "15", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/3/3f/Rikuto_Yokoyama_Marines_20230627.jpg", "file": "https://commons.wikimedia.org/wiki/File:Rikuto_Yokoyama_Marines_20230627.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E6%A8%AA%E5%B1%B1%E9%99%B8%E4%BA%BA", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Rikuto_Yokoyama_Marines_20230627.jpg/330px-Rikuto_Yokoyama_Marines_20230627.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "鈴木昭汰", "title": "鈴木昭汰（#47、セットアッパー、左投左打、28歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：左腕から強いストレートとスライダーを軸に、終盤の1イニングを任されるセットアッパーなのだ。2024年には**51試合、防御率0.73、27ホールド、5セーブ**まで伸び、==先発候補だった投手が救援転向で一気に代表クラスへ化けた==。\n- ユニークポイント：身長**175cm**と大柄ではないが、同じ左腕の松井裕樹との自主トレで「襲いかかってくるような真っすぐ」を体感し、直球の強さと内角攻めを磨いた。2026年は再びフル回転し、9月26日時点でチーム最多級の**52登板**に達している。\n\n### 見どころ\n- 今日の試合で見るべき場面：7〜8回の接戦で左打者を含む日本ハムの中軸に回る場面が本来の出番。ただし**9月25・26・27日に3連投**しているため、今日は休養する可能性も十分あり、==もし4日連続で登板するなら、それだけベンチが「ここを落とせない」と判断した局面==と考えるとよい。\n- 注目の数字・プレー：**9月26日時点で52試合、6勝3敗、1セーブ、30ホールド、防御率2.54**。翌27日の日本ハム戦も1回を9球で三者凡退に抑えて31ホールド目を挙げており、疲労の中でもストライク先行で短く終えられるかが重要なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハムには**8月21日**に延長10回を3者連続三振で抑えて勝利投手、**8月23日**には三者凡退で30ホールドポイント、直近の**9月27日**も三者凡退だった。今日も清宮幸太郎ら左の強打者へ回れば、左腕の鈴木が重要な選択肢になる。\n\n### 出立ち\n- 身長・体重・体格：**175cm・80kg**。投手としてはコンパクトな体格だが、下半身と体幹を使って左腕を鋭く振り、打者へ近いところで球を離すような力強さがある。\n- 投打・フォームの特徴：左投左打のオーバースロー系。2024年の飛躍時はストレートとスライダーを中心にツーシームも使い、速球で押しながら緩急と横変化を混ぜる救援スタイルを確立したのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「**笑顔**」と答える一方、マウンドでは打者へ強気に向かう表情が印象的。試合前のルーティンはヨガ・ピラティスで、最近買ってよかった物にも「ピラティスマシン」を挙げている。\n- 背番号の由来・愛称・登場曲：入団時は**35**で、2023年から**47**へ変更した。変更そのものは球団発表で確認できるが、**本人が47を選んだ理由については公開情報が見つかりませんでした**。愛称は「すずしょー」、2026年の登場曲は[Alexandros]「月色ホライズン」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：茨城県土浦市出身。2020年のロッテとの契約時には母・広江さんも会見に同席し、チョコレートを食べさせてもらう写真が報じられた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：土浦東小1年で美浦ブレーブス、3年から永国東ジャイアンツでプレーし、土浦第四中では土浦霞ヶ浦ボーイズへ。常総学院高、法政大を経てロッテ入りし、高校から大学まで左の本格派としてエース級の経験を積んだ。\n- 野球のエピソード：常総学院では1年秋からエース格となり、**2015年春、2016年春・夏**の3度甲子園へ出場。法政大では故障や登板機会の少ない時期もあったが、4年春の2020年東京六大学リーグで**4試合、防御率1.54**を残し、法大のリーグ優勝に貢献したのだ。\n- 野球以外のエピソード：大学時代からサウナや水風呂を好み、プロ入り後はヨガやピラティスもコンディショニングに取り入れている。球団公式Q&Aでは自分へのご褒美を「サウナ」、苦手な食べ物を「きゅうり」と答えている。\n- 印象的な試合：2015年春の選抜では米子北戦で**7回無失点**、今治西戦では**7回1/3を1安打無失点**と好投した。2016年夏は履正社などを破ってベスト8へ進み、高校野球の全国舞台で左腕として存在感を示したのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学時代に**U-15日本代表**を経験し、高校では甲子園3度、法大では東京六大学リーグ優勝を経験した。代表歴が中学からプロまでつながっているのが特徴である。\n- ドラフト・入団（年・順位・球団・契約）：**2020年ドラフト1位**でヤクルトとロッテが競合し、抽選の末にロッテが交渉権を獲得。契約金**1億円＋出来高5000万円**、年俸**1600万円**（推定）で契約し、常総学院元監督・木内幸男氏から教わった「準備の大切さ」をプロでも守ると語った。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年は先発中心で**23試合・1勝4敗・防御率4.08**、2022年は6試合にとどまり、2023年から救援へ比重を移した。2024年に51試合・防御率0.73で大ブレークし、2025年は29試合・防御率4.82と苦しんだが、2026年は再び勝ちパターンの左腕へ戻っている。\n- 野球のエピソード：2024年の飛躍前には松井裕樹との自主トレで、投球技術だけでなく身体の使い方、栄養、野球への考え方まで学んだ。==「ストレートの強さ」と「インコース」を磨いたことが、救援で打者を押し込む土台になった==のだ。\n- 野球以外のエピソード：2026年の球団公式では性格を「短気」、心に残る言葉を「不動心」と答えている。感情が動きやすい自覚と、それを抑える言葉が同居しているのが、終盤を任される投手らしい面白さでもある。\n- 印象的な試合：2024年、本人がプレミア12前の取材でシーズン一番のプレーに挙げたのは**無死満塁からの火消し**。走者を背負った状態から点を与えない救援の仕事を、自分でも転機として強く覚えている。\n- 実績（タイトル・表彰・通算記録・代表）：2024年は**オールスター初選出**、さらに侍ジャパンの**プレミア12代表**に選ばれた。シーズンでは27試合連続自責点0を記録し、51登板で防御率0.73という救援投手として突出した数字を残した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**52登板、6勝3敗、1セーブ、30ホールド、49回2/3、防御率2.54**。救援で6勝を挙げるのは、同点や僅差の場面を任され、その直後に味方が勝ち越した試合が多いということなのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は7月18日を最後に一軍登板がなく、コンディション不良が報じられて29試合で終えた。2026年はセットアッパーとしてシーズンを通して登板を重ね、前年の登板数を大きく上回っている。\n- 野球のエピソード：2025年秋には前年のフル回転の疲れも振り返り、2026年は「開幕を100%」で迎える準備を意識した。今季は9月下旬まで**50試合超**を投げており、復活が一時的ではなくシーズンを通したものになっている。\n- 野球以外のエピソード：2026年もヨガ・ピラティスをルーティンに挙げ、身体を整える方法そのものを趣味に近いレベルで続けている。疲労がたまる救援投手だからこそ、==球場外の「整える時間」までパフォーマンスの一部なのだ==。\n- 印象的な試合：**8月21日の日本ハム戦**では3-3の延長10回を3者連続三振に仕留め、その裏のサヨナラ勝ちで6勝目を挙げた。直球が良く「バッターに向かっていけた」と本人も振り返った、今季の強さが分かりやすい試合なのだ。\n- 実績（今季の記録・表彰）：**2026年オールスター**のパ・リーグ中継ぎ投手部門でファン投票**374,150票**を集めて選出され、2度目の球宴出場となった。9月26日時点で30ホールドに到達し、勝ちパターンの中心として数字を積み上げている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。25日西武戦は2/3回2安打無失点、26日西武戦は1回2安打1失点でホールド、27日日本ハム戦は**1回9球、三者凡退**で31ホールド目を挙げ、3日連続登板となった。\n- エピソード：3連投の中で26日は1点を失ったが、翌27日は日本ハム打線を9球で片づけた。疲労がある時期に長い回を投げず、短い球数で終えられたことは翌日の起用を考えるうえでも大きい。\n- 調子：27日は被安打・四死球ともに0で内容は良い。ただし救援投手は内容が良くても連投による疲労が別問題なので、==「調子が良い＝今日も投げる」とは限らないのがセットアッパーを見る面白さ==なのだ。\n- 分析・論点：25〜27日の3連投後で、今日投げれば4連投になる。シーズン終盤とはいえ無理をさせるか、横山・中森・八木ら他の救援へつなぐかはベンチの運用判断であり、登板の有無そのものが論点になる。\n- 今日の見どころ：ブルペンから姿を見せなければ休養と考えやすく、8回の重要場面で出てくれば勝負をかけたサインなのだ。登板した場合は、==最初の3人を少ない球数で終えられるか、特に左打者へ強い直球を内角に投げ切れるか==を見たい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001276.html\n- https://npb.jp/bis/players/71275153.html\n- https://ja.wikipedia.org/wiki/%E9%88%B4%E6%9C%A8%E6%98%AD%E6%B1%B0\n- https://en.wikipedia.org/wiki/Sh%C5%8Dta_Suzuki_%28baseball%2C_born_1998%29\n- https://pacificleague.com/player/521063\n- https://pacificleague.com/player/521063/stats\n- https://www.japan-baseball.jp/jp/profile/201302008.html\n- https://www.sponichi.co.jp/baseball/news/2020/12/05/articles/20201204s00001173735000c.html\n- https://www.nikkansports.com/m/baseball/news/amp/202012040000826.html\n- https://baseballking.jp/ns/463977\n- https://pacificleague.com/news/2024/12/10036296\n- https://www.jsports.co.jp/baseball/premier12/samuraijapan/shota_suzuki/\n- https://www.nikkansports.com/premium/baseball/news/202511280000655.html\n- https://pacificleague.com/news/2026/7/10053125\n- https://npb.jp/allstar/2026/ballotresult.html\n- https://npb.jp/allstar/2026/roster.html\n- https://www.nikkansports.com/m/baseball/news/amp/202608210001815.html\n- https://pacificleague.com/game/36628\n- https://npb.jp/scores/2026/0923/m-b-25/box.html\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://note.com/orions_marines/n/n9a10882ef55d\n- https://ringofred53.com/archives/17802515.html", "detail": true, "number": "47", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/f/fa/Shota_Suzuki_Marines_20230827.jpg", "file": "https://commons.wikimedia.org/wiki/File:Shota_Suzuki_Marines_20230827.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E9%88%B4%E6%9C%A8%E6%98%AD%E6%B1%B0", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Shota_Suzuki_Marines_20230827.jpg/330px-Shota_Suzuki_Marines_20230827.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "中森俊介", "title": "中森俊介（#56、勝ちパターン、右投左打、24歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最速**154km/h**級の直球にスライダー、チェンジアップ、カーブ、フォークを組み合わせる右腕で、直球自体もわずかに横へ動く「真っスラ」系の球質を持つ。2025年に救援へ定着して**防御率1.23**を残し、2026年は接戦の中盤〜終盤を任されているのだ。\n- ユニークポイント：高校では先発エースとして甲子園を何度も完投したのに、プロでは先発・中継ぎの両方を経験し、救援で居場所を広げた。==「甲子園のエース」から「プロの勝ちパターン」へ役割を変えながら伸びてきた投手==なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：鈴木昭汰が3連投明けのため、ロッテが6〜8回に1〜2点差でリード、または同点なら中森の出番が増えそうだ。9月25日から**2日間登板していない**ので、鈴木より休養が取れている点も起用を考える材料になる。\n- 注目の数字・プレー：**9月26日時点で39試合、7勝1敗、1セーブ、16ホールド、防御率2.35**。救援投手の7勝は「7回勝ち投手のように投げ切った」という意味ではなく、登板中や直後に味方が勝ち越して勝利投手になった試合が多いという数字なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：**9月15日の日本ハム戦**では1回を投げ、万波中正に同点本塁打を浴びながらも2奪三振、直後に山口航輝が勝ち越しの30号を放って中森に6勝目がついた。==最近の日本ハム戦で「抑え切れなかったのに勝利投手」という救援ならではの試合を経験している==ため、今日は内容にも注目したい。\n\n### 出立ち\n- 身長・体重・体格：球団公式では**183cm・90kg**。高校時代から長身の本格派だったが、プロ入り後に体を大きくし、救援でも連投に耐えられる土台を作ってきた。\n- 投打・フォームの特徴：右投左打のオーバースロー。真っすぐは打者の手元で少し横へ動く「真っスラ」と表現され、スライダー、チェンジアップ、カーブ、フォークまで使えるため、1イニングでも球種を絞らせにくいのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでチャームポイントは「**笑顔**」、性格は「冷静沈着」と答えている。試合前のルーティンは「歯磨き」で、マウンド上でも大きく感情を出すより淡々と投げる姿が見つけやすい。\n- 背番号の由来・愛称・登場曲：入団から背番号は**56**。**56を選んだ本人の理由については公開情報が見つかりませんでした**。愛称は「しゅんボー」、2026年の登場曲はback number「SISTER」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：兵庫県丹波篠山市出身。2020年の入団交渉では、築**42年**という実家を両親や兄弟のために建て替えたいと話し、プロで稼いで家族へ恩返しする夢を語った。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：福住小2年から多紀野球少年団で野球を始め、篠山東中の軟式野球部、3年夏から三田ボーイズで硬式を経験し、明石商へ進学。高校卒業後、**2020年ドラフト2位**でロッテ入りした。\n- 野球のエピソード：明石商では1年春からベンチ入りし、1年夏の2018年甲子園で救援登板。2年の2019年は春夏ともエース格で甲子園**ベスト4**へ進み、同学年の来田涼斗とチームを引っ張ったのだ。\n- 野球以外のエピソード：丹波篠山で山登りや木登りをして育ち、入団時には「中森俊介という名前を使って、もっと丹波篠山を有名にしたい」と故郷への思いを語った。ロッテ菓子では「パイの実」が好きで、後の球団インタビューでは「雪見だいふく」も好物に挙げている。\n- 印象的な試合：**2019年春の選抜準々決勝・智弁和歌山戦**では長い投球を任されて接戦を勝ち抜き、春の4強進出に貢献した。**2020年甲子園交流試合の桐生第一戦**では9回115球、5安打9奪三振2失点（自責1）で完投し、3-2の勝利をつかんだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2019年は春夏の甲子園で**連続ベスト4**。2020年は新型コロナ禍で通常の選抜・夏の大会が中止されたが、甲子園交流試合で完投勝利を記録し、高校野球の全国舞台で豊富な登板経験を残した。\n- ドラフト・入団（年・順位・球団・契約）：**2020年ドラフト2位**で千葉ロッテから指名され、契約金**6000万円**、年俸**720万円**（推定）で契約。入団時には「ピンチでも動じない強気の投球」を持ち味とし、1年目から15勝という高い目標を掲げたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年は体づくりを優先し、2022年は二軍で登板後に右肩の状態を整える時期を経験。2023年に一軍デビューして**13試合・3勝2敗・防御率3.54**、2024年は先発中心に5試合・防御率2.63、2025年は救援で25試合・防御率1.23と役割を変えて伸びた。\n- 野球のエピソード：2023年は一軍で救援と先発の両方を経験し、オフにはオーストラリアのシドニー・ブルーソックスでも登板した。異なる役割や海外の打者を経験し、2025年の救援専任に近い起用へつながっていったのだ。\n- 野球以外のエピソード：ロッテのインタビューでは、ゲームやドラマを始めると一気に最後まで進めるが、終わるとしばらく離れるという「熱しやすく冷めやすい」面を明かしている。憧れの松坂大輔と石垣島キャンプで話せたことを「最近一番うれしかったこと」と語った時期もある。\n- 印象的な試合：プロ初勝利は**2023年4月5日の日本ハム戦（ZOZOマリン）**で、2番手として1回1失点のあと味方が勝ち越した。高校時代の完投型とは違い、救援投手の勝ち星を初めて経験した試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2025年は**25登板、2勝2敗、5セーブ、10ホールド、防御率1.23**で、監督選抜により**オールスターへ初選出**された。タイトルはまだないが、救援1年目で球宴まで上がったことが大きな実績である。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**39登板、7勝1敗、1セーブ、16ホールド、38回1/3、35奪三振、防御率2.35**。与四球は**10**で、前年ほど極端な低防御率ではないものの、接戦の重要な回を継続して任されている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年に救援で定着し、2026年はセットアッパー手前から勝ちパターンまで担当する場面が増えた。鈴木や横山の前後をつなぎ、同点でもリードでも使われる「一番配置を動かしやすい重要投手」の一人なのだ。\n- 野球のエピソード：9月は**9日楽天戦、15日日本ハム戦、25日西武戦**で勝利投手となり、月だけで3勝を積んだ。ただし9月25日時点の9月成績は7回4失点で月間防御率**5.14**なので、==「3勝＝ずっと好投」ではない点が救援投手の数字を読む大事なところ==である。\n- 野球以外のエピソード：2026年の球団公式Q&Aでは自分へのご褒美を「美容治療」、最近買ってよかった物を「パジャマ」と答えている。心に残る言葉は「個を強く」で、苦手なことは「長距離走」なのだ。\n- 印象的な試合：**9月25日の西武戦**では1回12球、1安打1奪三振無失点で7勝目。1-2の終盤から西川史礁の3ランで逆転した試合で、勝ち越し直前の回を抑えた中森に勝利がついた。\n- 実績（今季の記録・表彰）：今季の**7勝**は自己最多で、16ホールドも前年の10を更新している。勝ち星だけでなく、39登板まで登板数を増やして勝ちパターンの一角を担っていることが今季の最大の実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。26日・27日は登板せず、最後の登板は25日の西武戦で**1回12球、1安打1奪三振無失点、勝利投手**となり7勝目を挙げた。\n- エピソード：その前の9月22日は1回2安打2四球2失点と苦しんだが、25日は無四球・無失点で修正した。救援は登板間隔が短いぶん、前回の失敗を数日で切り替えられるかが重要なのだ。\n- 調子：9月は3勝している一方、7回で4失点と内容には波がある。25日の投球は良かったため、==「勝ち星の勢い」よりも、直近で四球を出さずストライクゾーン内で勝負できた点を好材料として見る==のが正確である。\n- 分析・論点：鈴木が3連投、横山は26日に敗戦して27日休養というブルペン状況では、中森の2日休養が価値を持つ。7回か8回で誰を最初に切るかによって、サブロー監督が今日どの投手を最も信頼しているかも見えてくるのだ。\n- 今日の見どころ：日本ハム打線とは13日前の9月15日に対戦しており、万波に同点弾を浴びた記憶も新しい。==再戦するなら、直球を同じように長打されないために変化球をどう混ぜるか、そして四球を出さず1イニングを完結できるか==を見るとよい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001279.html\n- https://npb.jp/bis/players/31635153.html\n- https://ja.wikipedia.org/wiki/%E4%B8%AD%E6%A3%AE%E4%BF%8A%E4%BB%8B\n- https://pacificleague.com/player/521081\n- https://pacificleague.com/player/521081/stats\n- https://baseball.yahoo.co.jp/npb/player/2000088/\n- https://baseball.omyutech.com/playerTop.action?playerId=1075579\n- https://www.kokoshinro.com/school.php?name=%E6%98%8E%E7%9F%B3%E5%95%86\n- https://www.nikkansports.com/baseball/highschool/news/202008160000871.html\n- https://www.kobe-np.co.jp/news/sports/koya/news/202008/0013608650.shtml\n- https://sportiva.shueisha.co.jp/clm/baseball/hs_other/2019/12/17/155_split/\n- https://www.tv-tokyo.co.jp/sports/articles/2020/11/015286.html\n- https://www.nikkansports.com/baseball/news/202011260001275.html\n- https://www.daily.co.jp/baseball/2020/11/26/0013894383.shtml\n- https://column.sp.baseball.findfriends.jp/?id=097-20201126-110&pid=column_detail\n- https://baseballking.jp/ns/257824/\n- https://www.lotte.co.jp/entertainment/shallwelotte/interview/ureshii/nakamori-shunsuke/\n- https://npb.jp/bis/2025/stats/idp1_m.html\n- https://npb.jp/allstar/2025/roster.html\n- https://npb.jp/allstar/2025/roster_pl_pix.html\n- https://pacificleague.com/game/36546\n- https://news.mynavi.jp/article/20260915-4820298/\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.doshinsports.com/live-npb/?global_id=20262065&kd_page=game\n- https://note.com/orions_marines/n/n16884874febe", "detail": true, "number": "56", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/4/44/Shunsuke_Nakamori_Marines_20250615.jpg", "file": "https://commons.wikimedia.org/wiki/File:Shunsuke_Nakamori_Marines_20250615.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E4%B8%AD%E6%A3%AE%E4%BF%8A%E4%BB%8B", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Shunsuke_Nakamori_Marines_20250615.jpg/330px-Shunsuke_Nakamori_Marines_20250615.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "八木彬", "title": "八木彬（#33、勝ちパターン、右投右打、29歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最速**154km/h**の力強い直球と、打者の手元で落ちるフォークが軸なのだ。2024年ごろからツーシームも加え、2026年は**44登板・9勝1敗・11ホールド・防御率2.17**と、前年までとは一段違う安定感を見せている。\n- ユニークポイント：救援投手なのに**9勝**を挙げているのが異例なのだ。==同点や僅差で登板し、その直後に味方が勝ち越す展開を何度も引き寄せた「勝ち運」も今季の八木を象徴している==。\n\n### 見どころ\n- 今日の試合で見るべき場面：同点、あるいは1点差の**6～8回**で名前が呼ばれたら注目なのだ。先発ジャクソンから勝ちパターンへつなぐ役として、横山陸人や鈴木昭汰の前を任される可能性がある。\n- 注目の数字・プレー：9月26日時点で**58回・42奪三振・12四球**。三振だけを狙う投手ではなく、強い直球やツーシームで早いカウントから打たせ、フォークで空振りも取る組み立てを見ると分かりやすいのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハムは、八木が**2026年4月15日にプロ初勝利**を挙げた相手なのだ。その試合では万波中正にソロ本塁打を浴びた一方、2回を1失点でしのいだ。投手なので日本ハム先発・福島蓮との直接対決は基本的になく、今日も清宮幸太郎や万波ら打線との勝負が焦点になる。\n\n### 出立ち\n- 身長・体重・体格：**180cm・94kg**。下半身まで厚みのある、救援右腕らしいがっしりした体格なのだ。\n- 投打・フォームの特徴：右投右打。上から勢いよく腕を振り、直球とフォークを中心に、ツーシームやスライダーも交える。==球速だけで押すのではなく、2026年は「打者としっかり勝負する」意識でゾーン内の球を使えるようになったことが飛躍につながった==。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式の2026年選手名鑑では、外見や試合前ルーティンについて具体的な回答は載せていない。マウンドでは大きく感情を出すより、体格を生かして淡々と強い球を投げ込む姿が目印なのだ。\n- 背番号の由来・愛称・登場曲：プロ入りから背番号は**33**で、番号の由来について明確な公開説明は見つからなかった。愛称は球団公式で「**やぎ**」、2026年の登場曲はSkrillex & Damian \"Jr Gong\" Marleyの「**Make It Bun Dem**」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：**和歌山県和歌山市**出身。2026年のプロ初勝利後、ウイニングボールを「親とか親しい人に渡したい」と話しており、家族への思いものぞかせたのだ。家族構成の詳しい公開情報は見つからなかった。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：中学では**和歌山ボーイズ**でプレーし、青森の**八戸学院光星高**へ進学。**東北福祉大**を経て三菱重工名古屋に入り、野球部再編後は**三菱重工West**で投げたのだ。\n- 野球のエピソード：八戸学院光星高では2年夏の**2014年第96回全国高校野球選手権**で背番号10をつけ、準々決勝の敦賀気比戦に救援登板して**3回2/3**を投げた。大学では1年から登板したが、4年時は故障でリーグ戦登板がなく、社会人で救援投手として評価を上げ直したという道のりなのだ。\n- 野球以外のエピソード：球団公式の2026年Q&Aでは「最近買ってよかったもの」に、動画配信サービスの「**ダウンタウンプラスに加入したこと**」を挙げている。硬派な速球派という印象とは少し違う、日常の一面なのだ。\n- 印象的な試合：社会人最後の大舞台となった**2021年第92回都市対抗野球大会**では、三菱重工Westの救援として2試合に登板し無失点。東京ドームで**151km/h**を計測し、ドラフト直後に即戦力リリーフとしての力を示した。\n- 実績（甲子園・大学リーグ・代表・表彰など）：八戸学院光星高では**2014年夏の甲子園ベスト8**、2015年春のセンバツにもベンチ入りした。社会人では三菱重工Westの都市対抗出場に貢献した一方、大学日本代表などの代表歴について確実な公開情報は確認できなかった。\n- ドラフト・入団（年・順位・球団・契約）：**2021年ドラフト5位**で千葉ロッテから指名され、同年12月7日に契約。契約金**4000万円**、年俸**960万円**（いずれも推定）で合意し、背番号33で2022年からプロ生活を始めたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2022年に一軍初登板して**22試合・防御率3.63**。2023年は3試合、2024年は9試合でプロ初ホールド、2025年は自己最多だった**27試合・5ホールド**に登板し、9月の再昇格後は登板した5試合を無失点で終えたのだ。\n- 野球のエピソード：2024年には二軍で先発にも挑戦し、球種の幅を広げた。2026年には美馬学コーチから「しっかり打者と勝負しよう」という趣旨の助言を受け、打たれる場所を気にしすぎず腕を振る意識に変えたことを本人が振り返っている。\n- 野球以外のエピソード：2025年5月7日の楽天戦では一度「初勝利」と案内され、当時の吉井理人監督と記念写真まで撮った後に記録が訂正される珍事があった。翌年に本当の初勝利を挙げたため、本人にとっても笑って振り返れる前振りになったというわけだ。\n- 印象的な試合：**2026年4月29日楽天戦**では、5回1死から登板して最初の1球で併殺を完成させ、その裏に味方が勝ち越したため**1球勝利**となった。==NPB史上50人目・51度目、ロッテでは球団史上8人目の1球勝利==という珍しい記録なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：タイトルや日本代表歴はまだないが、2026年にプロ初勝利、初勝利から2日連続勝利、1球勝利を立て続けに記録した。9月26日時点の通算は**104登板・9勝1敗・18ホールド**で、今季だけでキャリアの勝利数を一気に積み上げている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**44登板、9勝1敗、11ホールド、防御率2.17、58回、42奪三振**。救援で9勝はチーム最多級の存在感で、前年の防御率5.96から大きく改善したのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：開幕は二軍だったが**4月9日に一軍昇格**。初勝利以降はロング救援だけでなく、同点や僅差を任される勝ちパターン寄りの役割へ比重が上がった。\n- 野球のエピソード：4月15日に日本ハム戦でプロ初勝利、翌16日も日本ハム戦で勝ち投手となった。初勝利から2日連続で白星を挙げるのはドラフト制後では珍しく、双方救援での達成はロッテ球団初とされるのだ。\n- 野球以外のエピソード：初勝利記念グッズは4月21日から球団公式で受注販売され、Tシャツやタオル、サイン入り商品などが作られた。元カードにあった「まさかこんな形で」は商品名ではなく、公式の商品名は「八木彬投手プロ入り初勝利記念グッズ」なのだ。\n- 印象的な試合：4月29日の楽天戦での**1球勝利**では、当時リーグトップタイの4勝目となり、「日ごろの行いがいいんかな」と笑った。偶然だけではなく、その後も登板を重ねて9勝まで伸ばしたことで、春だけの話題では終わらなかったのだ。\n- 実績（今季の記録・表彰）：**プロ初勝利、初勝利から2日連続勝利、1球勝利**をすべて今季に記録。==9勝目まで積み上げ、救援投手としてのキャリアハイを大幅に更新している==。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**、9/26西武戦と9/27日本ハム戦は登板なし。最後の登板は**9/22オリックス戦**で、6回に登板し**1/3回、6球、3安打、2失点**で今季初黒星を喫したのだ。\n- エピソード：9/22は来田涼斗に本塁打を浴びるなど、わずか6球で3安打を集められた。今季ずっと無敗だった八木に初めて「1敗」がついた試合だったのだ。\n- 調子：直近登板だけを見ると打ち込まれたが、シーズン全体では**防御率2.17**で、9/23以降は登板していない。==今日は中5日で、疲労面では比較的フレッシュな状態で待機できる==と考えられる。\n- 分析・論点：前回は早いカウントで連打を浴びたため、強い直球をゾーンへ投げながらも、フォークやツーシームを混ぜて打者の狙いを外せるかが論点なのだ。救援9勝という数字は味方の援護にも左右されるので、評価するときは**防御率2.17**や11ホールドも一緒に見ると実力が分かりやすい。\n- 今日の見どころ：==勝てば自身初の**2桁10勝**に到達する可能性がある==。同点の中盤で八木が出てきたら、「打者を抑える」ことに加えて、その直後にロッテ打線が勝ち越すかまで見ておくと今季らしい楽しみ方になるのだ。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001269.html\n- https://npb.jp/bis/players/23325155.html\n- https://npb.jp/bis/2026/stats/idp1_m.html\n- https://ja.wikipedia.org/wiki/%E5%85%AB%E6%9C%A8%E5%BD%AC\n- https://en.wikipedia.org/wiki/2021_Nippon_Professional_Baseball_draft\n- https://www.nikkansports.com/baseball/highschool/sensyuken/2014/score/2014082202.html\n- https://www.mhi.com/jp/company/sports/baseball/west/news/2021012.html\n- https://www.mhi.com/jp/company/sports/baseball/west/result/2021.html\n- https://www.nikkansports.com/baseball/news/202112070000364.html\n- https://www.sponichi.co.jp/baseball/news/2026/04/15/articles/20260415s00001173463000c.html\n- https://www.nikkansports.com/m/baseball/news/202604150001916_m.html\n- https://www.nikkansports.com/baseball/news/202604290001194.html\n- https://column.sp.baseball.findfriends.jp/?id=103-20260622-03&pid=column_detail\n- https://www.marines.co.jp/news/detail/202600822065.html\n- https://npb.jp/scores/2026/0922/m-b-24/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true, "number": "33", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/0/04/%E5%85%AB%E6%9C%A8%E5%BD%AC%E6%8A%95%E6%89%8B.jpg", "file": "https://commons.wikimedia.org/wiki/File:%E5%85%AB%E6%9C%A8%E5%BD%AC%E6%8A%95%E6%89%8B.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%85%AB%E6%9C%A8%E5%BD%AC", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/%E5%85%AB%E6%9C%A8%E5%BD%AC%E6%8A%95%E6%89%8B.jpg/330px-%E5%85%AB%E6%9C%A8%E5%BD%AC%E6%8A%95%E6%89%8B.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "益田直也", "title": "益田直也（#52、ベテラン右腕、右投右打、36歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：少し体をひねる独特のスリークォーター（斜め上から投げる腕の角度）から、直球、ツーシーム、シンカー、スライダーなどを操る右腕なのだ。若いころのように球速だけで押すのではなく、打者のタイミングと芯をずらしてアウトを重ねる技術が大きな武器になっている。\n- ユニークポイント：2012年の新人年からロッテ一筋で、先発登板は一度もない。==2026年8月4日に史上5人目の**通算250セーブ**、8月26日に史上9人目の**通算800試合登板**を達成した、文字どおり「救援だけで積み上げた」投手なのだ==。\n\n### 見どころ\n- 今日の試合で見るべき場面：現在は毎試合9回を任される専任クローザーではなく、中盤から終盤のさまざまな場面で登板するベテラン枠なのだ。点差が開いた場面でも、僅差でも、ブルペン全体の状況に応じて名前が呼ばれる。\n- 注目の数字・プレー：9月26日時点で今季**35登板・防御率3.31**、通算では**804登板・250セーブ**。登場した瞬間に、記録を積み続ける15年目の投手そのものを見ておく価値があるのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：今日の相手・日本ハムとは前日9月27日に対戦したばかりで、益田は9回を**1安打・3奪三振・無失点**に抑えている。投手なので先発・福島蓮との直接対決は基本なく、==前日に実際に封じた日本ハム打線へ、連日の登板があるか==が一番分かりやすい注目点なのだ。\n\n### 出立ち\n- 身長・体重・体格：**179cm・80kg**。極端な大型投手ではないが、長年の救援登板に耐えてきた締まった体つきなのだ。\n- 投打・フォームの特徴：右投右打。トルネード気味に上体をひねり、サイドスローに近いスリークォーターから投げるため、打者には球の出どころが一般的な右投手と少し違って見える。直球だけでなくツーシームやシンカーなど、沈んだり食い込んだりする球を混ぜるのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式2026年名鑑では試合前ルーティンの回答は公開されていない。一方、益田は若いころから走り込みや体幹を重視してきたことで知られ、独特のひねりのある投球動作が球場で最も見分けやすい特徴なのだ。\n- 背番号の由来・愛称・登場曲：入団時から一貫して背番号は**52**で、2011年の仮契約時に決まった。球団公式の愛称は「**ます**」、登場曲はDon Omarの「**Danza Kuduro ft. Lucenzo**」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：**和歌山県旧貴志川町（現在の紀の川市）**出身で、母子家庭で育った。プロ入り時には苦労して育ててくれた母に契約金を渡し、初勝利のウイニングボールも実家の母へ送ると話していたのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：西貴志小2年で野球を始め、貴志川中を経て**市立和歌山商高**へ。高校では主に控え遊撃手で、**関西国際大**進学後に本格的に投手へ転向したという、プロの名クローザーとしては珍しい経歴なのだ。\n- 野球のエピソード：高校1年時の健康診断で心臓の異常が分かり、身体への負担を考えて内野手へ回った時期があった。大学では投手に戻り、4年春に**4勝・防御率0.75、48回44奪三振**でベストナインに選ばれるまで成長した。\n- 野球以外のエピソード：自身が母子家庭で育った経験から、2013年からひとり親家庭の親子をロッテ主催試合へ招待する活動を続けてきた。2016年の球団発表時点で9度目の招待となり、本人も「同じような環境で頑張る子供たちのためにも頑張ろう」と語っている。\n- 印象的な試合：**2009年第58回全日本大学野球選手権**準決勝の法政大戦で、2番手として**3回2/3を1失点**に抑えた。これをきっかけに大学で中継ぎとしての位置を上げ、のちの救援一筋のプロ人生につながったのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：高校時代は甲子園出場なし。大学ではリーグ通算**6勝5敗・防御率1.16**、4年春にベストナインを獲得し、2009年大学選手権と2009・2010年の明治神宮大会に登板した。\n- ドラフト・入団（年・順位・球団・契約）：**2011年ドラフト4位**で千葉ロッテから指名。契約金**6000万円**、年俸**1200万円**（いずれも推定）で仮契約し、背番号52で2012年に入団したのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2012年は新人ながら**72登板・41ホールド・防御率1.67**で新人王。2013年に33セーブで初の最多セーブ、2021年には球団記録だった**38セーブ**で2度目の最多セーブを獲得し、以後もロッテ一筋で中継ぎと抑えを行き来してきた。\n- 野球のエピソード：プロ入り後は一度も先発しておらず、すべて救援登板なのだ。==800試合を超えるキャリアを「毎日投げる可能性がある」ブルペン投手として積み上げた耐久性は、数字以上に異例なのだ==。\n- 野球以外のエピソード：ひとり親家庭への招待活動など、球場外でも自身の経験を生かした支援を続けてきた。2026年9月の250セーブ表彰では、球団から家族で楽しめる韓国旅行などの記念品も贈られた。\n- 印象的な試合：**2026年8月4日西武戦**、5-3の9回をわずか**8球で三者凡退**に抑え、今季2セーブ目で通算250セーブに到達した。==先発登板ゼロの投手が250セーブへ到達したのはNPB史上初==なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：**2012年新人王**、最多セーブ投手**2回（2013、2021年）**。新人最多の**72登板**と**41ホールド**の記録を持ち、2026年には250セーブで名球会入会資格を満たし、800試合登板も達成した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**35登板、1勝0敗、2セーブ、2ホールド、防御率3.31、35回1/3、18奪三振**。9月27日の1回無失点・3奪三振を含める前の数字なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は下半身、のちに上半身のコンディション不良もあって自己最少の**22登板・5セーブ・防御率4.35**に終わり、オフに推定1億2000万円で契約更改。2026年は専任守護神ではなく幅広い救援場面を担いながら復調し、節目の記録へ到達した。\n- 野球のエピソード：2025年オフには「復活したと思ってもらえるような成績」を目標に掲げ、久しぶりの秋季キャンプや器具を使ったトレーニングにも取り組んだ。36歳のベテランがやり方を変えてシーズンに入った点も、今季の背景なのだ。\n- 野球以外のエピソード：**9月23日**のオリックス戦前に名球会ブレザー授与式が行われ、古田敦也からブレザー、井口資仁から花束を受け取った。本人は「ブレザーの重み」を感じたと話し、チームメート一人一人とも握手したのだ。\n- 印象的な試合：**8月26日ソフトバンク戦**で通算800試合登板。2点を追う8回に登板し、一死満塁のピンチを作りながら後続を断って**1回無失点**とし、史上9人目の大台を自ら無失点で飾った。\n- 実績（今季の記録・表彰）：8月4日に**通算250セーブ**、8月26日に**通算800試合登板**。9月23日には両記録のパ・リーグ連盟表彰と名球会ブレザー授与式が行われ、2026年は記録の年になったのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**、9/26西武戦は登板なし。**9/27日本ハム戦**では9回に登板し、**1回15球、1安打、3奪三振、無失点**だった。\n- エピソード：9月23日に名球会の式典を終えた直後の時期に、前日は日本ハム相手に3つのアウトをすべて三振で取った。36歳になっても、一試合だけ切り取れば力で押し切れることを示した登板なのだ。\n- 調子：今季防御率は9月26日時点で**3.31**だが、前日は無四球で3奪三振。==直近の球そのものは、少なくとも「節目を達成しただけのベテラン」ではなく戦力として通用している内容だった==。\n- 分析・論点：一方で今季は**5被本塁打**があり、全盛期より長打を避ける配球は重要になっている。直球の球速だけでなく、ツーシームやシンカーで打球をずらせるかを見ると現在地が分かりやすいのだ。\n- 今日の見どころ：前日15球を投げているため連投になるが、登板できれば**通算806試合目**になる。今日も日本ハム打線を相手に、前日のように三振を取るのか、それとも打たせて短い球数で終えるのかが見どころなのだ。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001278.html\n- https://npb.jp/bis/players/71675135.html\n- https://npb.jp/bis/2026/stats/idp1_m.html\n- https://ja.wikipedia.org/wiki/%E7%9B%8A%E7%94%B0%E7%9B%B4%E4%B9%9F\n- https://en.wikipedia.org/wiki/Naoya_Masuda\n- https://www.nikkansports.com/baseball/professional/draft/2011/news/f-bb-tp0-20111118-865305.html\n- https://www.daily.co.jp/baseball/2016/07/03/0009247363.shtml\n- https://www.sponichi.co.jp/baseball/news/2025/12/24/kiji/20251224s00001173141000c.html\n- https://www.nikkansports.com/baseball/news/202512240000418.html\n- https://npb.jp/news/detail/20260810_03.html\n- https://meikyukai.jp/news/info20260805/\n- https://www.marines.co.jp/news/detail/202600892354.html\n- https://pacificleague.com/news/2026/8/85726\n- https://www.marines.co.jp/news/detail/202600934469.html\n- https://www.nikkansports.com/baseball/news/202609230000961.html\n- https://pacificleague.com/news/2026/9/86470\n- https://npb.jp/scores/2026/0922/m-b-24/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true, "number": "52", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/a/af/Naoya-Masuda-20240430-Kobe_%28cropped%29.jpg", "file": "https://commons.wikimedia.org/wiki/File:Naoya-Masuda-20240430-Kobe_%28cropped%29.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E7%9B%8A%E7%94%B0%E7%9B%B4%E4%B9%9F", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Naoya-Masuda-20240430-Kobe_%28cropped%29.jpg/330px-Naoya-Masuda-20240430-Kobe_%28cropped%29.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "小野郁", "title": "小野郁（#37、中継ぎ、右投右打、29歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：自己最速**159km/h**の直球が最大の武器で、スライダーやチェンジアップを組み合わせる右腕なのだ。2026年は9月26日時点で**38登板・防御率2.40**と、速さだけでなく安定した結果も残している。\n- ユニークポイント：高校時代は投手だけでなく**高校通算25本塁打**の打力もあった「二刀流」だった。==プロでは救援一本に絞り、楽天で一軍未勝利だった投手が、人的補償でロッテへ移って中継ぎの主力になった==という経歴なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発から中継ぎへつなぐ**6～8回**、特に相手の流れを止めたい場面で出てきたら注目なのだ。走者を背負った途中登板でも、本人は「抑えればこっちに流れが来る」と考えて投げてきた。\n- 注目の数字・プレー：直球は2025年7月2日に自己最速の**159km/h**を記録。2026年も**41回1/3で37奪三振、11四球**なので、強い直球で押しながら大崩れを避けている点も見どころなのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：小野の母校・**西日本短大付高**は、日本ハムの新庄剛志監督と同じなのだ。==母校の大先輩が率いるチームを相手に、小野が強い直球で日本ハム打線を抑えられるか==という人間関係でも楽しめる。\n\n### 出立ち\n- 身長・体重・体格：**175cm・78kg**。プロ投手としては大柄ではないが、下半身を使って150km/h台後半の球を投げ込むのだ。\n- 投打・フォームの特徴：右投右打。オーバースローに近い腕の振りから速い直球を投げ、スライダーとチェンジアップを合わせる。本人もロッテ移籍時から「150キロを越える直球」を持ち味として挙げている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：2021年の球団名鑑では、試合前に**そばを食べる**ことをルーティンとして答えていた。2026年版ではルーティン欄は空欄で、最近買ってよかったものには「バック」と答えている。\n- 背番号の由来・愛称・登場曲：ロッテ移籍時に背番号**37**となり、本人は入団会見で「中継ぎなら37ホールド目指して」と番号に絡めて抱負を語った。球団公式の愛称は「**ふみや**」、登場曲は小久保直紀の「**Spark**」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：**福岡県久留米市**出身。家族構成については、公開情報が見つかりませんでした。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：南薫小2年で南薫エンゼルスに入り、捕手として野球を始めた。小学6年で**福岡ソフトバンクホークスジュニア**、櫛原中では久留米中央ボーイズに所属し、中2後半から投手へ転向、その後**西日本短大付高**へ進んだのだ。\n- 野球のエピソード：高校では1年夏からベンチ入りし、秋にはエースになった。3年夏の福岡大会は準々決勝まで進んだが九州国際大付に敗れ、甲子園出場はなく、同年6月に学校の階段で転倒して左手首を骨折したことを機に投手へ専念した。\n- 野球以外のエピソード：2025年の球団名鑑では趣味を**ゴルフ**、2026年版では自分へのご褒美を「買い物」、苦手なものを「きのこ類」と答えている。150km/h台後半を投げる姿とは違う、日常の素朴な一面なのだ。\n- 印象的な試合：中学3年夏の全国大会で、のちに日本ハムなどでプレーする立田将太と投げ合って敗れた経験を、球団の過去名鑑でも「中学時代、初めて全国大会に出た事」と思い出に挙げている。高校3年夏は福岡大会で初戦7回完封など好投を重ね、準々決勝まで進んだのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：小学6年で**2008年ホークスジュニア**に選出。高校では甲子園出場はないが、最速153km/h級の直球と高校通算25本塁打の打力でドラフト上位候補になった。\n- ドラフト・入団（年・順位・球団・契約）：**2014年ドラフト2位**で東北楽天から指名され、契約金**6000万円**、年俸**600万円**（いずれも推定）で仮契約。背番号15で入団し、当時は二刀流の可能性も注目されたが「最初は投手一本で勝負したい」と話したのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：楽天では2015～2019年に一軍通算**39登板・0勝1敗**。2018、2019年はイースタン・リーグで2年連続セーブ王となり、2019年オフに鈴木大地のFA移籍に伴う**人的補償**でロッテへ移籍した。\n- 野球のエピソード：ロッテ移籍1年目の2020年に**40登板・防御率3.23**、6月26日のオリックス戦でプロ初勝利を挙げた。楽天を離れる際に「千葉ロッテで初勝利を」と話しており、半年ほどで実現したというわけだ。\n- 野球以外のエピソード：2022年の球団名鑑ではマイブームに**TikTok**、2023年版では「プロ野球選手になって驚いたこと」に「みんな高級車に乗ってること」と答えている。球団公式Q&Aでは、飾らない短い答えが多い選手なのだ。\n- 印象的な試合：**2025年7月2日楽天戦**で堀内謙伍への7球目が自己最速の**159km/h**を計測した。==プロ11年目で自己最速を更新したことは、故障や不調を経験しても球威を伸ばせることを示す象徴的な一球だった==。\n- 実績（タイトル・表彰・通算記録・代表）：一軍タイトルや日本代表歴はないが、楽天時代に**イースタン・リーグ最多セーブを2年連続**で獲得。ロッテでは2020～2022年に3年連続40試合以上へ登板し、2025年も**47登板・10ホールド**と救援陣を支えた。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**38登板、2勝3敗、6ホールド、防御率2.40、41回1/3、37奪三振、11四球**。前年の47登板に続き、今季もブルペンの中心的な右腕として登板を重ねている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は開幕から一度も二軍へ落ちず、一軍を完走して47試合に登板。2026年も主に中継ぎとして起用され、勝ちパターン固定というより、同点・ビハインドを含む幅広い場面を任されている。\n- 野球のエピソード：2025年は5月31日から7月にかけて**12試合連続無失点**を記録し、その途中で159km/hも出した。本人は直球とスライダーを軸にしつつ、イニング途中でも「ただ抑えるだけ」と余計なことを考えない姿勢を語っている。\n- 野球以外のエピソード：2026年公式プロフィールでは、自分へのご褒美は**買い物**、最近買ってよかったものは「バック」と回答。オフの過ごし方などそれ以上の具体的な公開情報は多くない。\n- 印象的な試合：今季は**9月5日オリックス戦**で敗戦投手になった一方、その後も9月13日、17日、19日と登板を続けた。9月17日は宗山塁に本塁打を許したが、19日の西武戦では1回無失点と立て直したのだ。\n- 実績（今季の記録・表彰）：個人タイトルや月間表彰はないが、9月26日時点で**防御率2.40**。==12年目にしてなお150km/h台後半の球威を土台に、一軍救援陣で安定した防御率を残していること自体が今季の実績なのだ==。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**、9/26西武戦と9/27日本ハム戦は登板なし。最後の登板は**9/19西武戦**で、1回を**1安打・1奪三振・無失点**に抑えた。\n- エピソード：9月17日の楽天戦では宗山塁にソロ本塁打を浴びたが、次の9月19日は無失点。悪い結果を引きずらず、次の登板でゼロを並べたのだ。\n- 調子：9月は9月5日に黒星、17日に被本塁打があった一方、13日と19日は無失点。直近登板から**中8日**空いており、連投疲労よりも試合勘がどう出るかを見る場面なのだ。\n- 分析・論点：小野の良さは直球の数字が目立つが、速球だけを待たれると長打につながるため、スライダーやチェンジアップとの組み合わせが重要になる。==最初の数球で直球がストライクゾーンに入り、変化球を振らせられるかを見ると調子が分かりやすい==。\n- 今日の見どころ：日本ハムはCS本拠地開催を争う緊張した試合なので、中盤以降の1点が重い。母校の先輩・新庄監督が率いる打線に対し、小野が**159km/h級の直球**をどこまで見せるかに注目なのだ。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001273.html\n- https://www.marines.co.jp/team/player/detail/2025_00001140.html\n- https://www.marines.co.jp/team/player/detail/2021_00001605.html\n- https://npb.jp/bis/players/51555130.html\n- https://npb.jp/bis/2026/stats/idp1_m.html\n- https://ja.wikipedia.org/wiki/%E5%B0%8F%E9%87%8E%E9%83%81\n- https://en.wikipedia.org/wiki/Fumiya_Ono\n- https://npb.jp/junior/2014/obplayers.html\n- https://draft.npb.jp/draft/2014/draftlist_e.html\n- https://www.rakuteneagles.jp/team/draft/\n- https://www.rakuteneagles.jp/news/detail/00002671.html\n- https://www.marines.co.jp/news/detail/00005060.html\n- https://www.nikkansports.com/baseball/news/201912190000266.html\n- https://www.nikkansports.com/baseball/news/201912230000529.html\n- https://www.nikkansports.com/baseball/news/201912190000323.html\n- https://pacificleague.com/es/news/2025/7/10041692\n- https://pacificleague.com/ko/news/2025/10/10043638\n- https://sports.yahoo.co.jp/official/detail/202007080023-spnaviow\n- https://www.fighters.co.jp/news/detail/202500780959.html\n- https://npb.jp/scores/2026/0913/h-m-23/\n- https://npb.jp/scores/2026/0917/m-e-22/\n- https://npb.jp/scores/2026/0919/m-l-21/\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true, "number": "37", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b1/Marines_Ono_Fumiya_20211111.jpg", "file": "https://commons.wikimedia.org/wiki/File:Marines_Ono_Fumiya_20211111.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%B0%8F%E9%87%8E%E9%83%81", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Marines_Ono_Fumiya_20211111.jpg/330px-Marines_Ono_Fumiya_20211111.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "澤田圭佑", "title": "澤田圭佑（#54、中継ぎ、右投左打、32歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**178cm・96kg**の体から、力のある直球とスプリット系の落ちる球をテンポよく投げ込む右腕なのだ。2026年は9月26日時点で**41登板・11ホールド**、しかも**40回1/3で与四球7**と、走者を四球で増やしにくい。\n- ユニークポイント：右肘のトミー・ジョン手術（靱帯再建手術）後にオリックスを戦力外となり、ロッテへ**育成選手**として入り直して一軍の中継ぎへ戻った苦労人なのだ。==2026年は黒木知宏投手コーチの現役時代の番号「54」を自ら希望して背負い、「魂」の投球をテーマにしている==。\n\n### 見どころ\n- 今日の試合で見るべき場面：走者がいる**6～8回**や、1イニングを無駄な四球なしで切り抜けたい場面で出てきたら注目なのだ。ストライクを先行させ、相手に「待って四球」を選ばせにくいのが澤田の良さである。\n- 注目の数字・プレー：**40回1/3で37奪三振、与四球7**なので、奪三振と与四球の比率は5倍を超える。速球でファウルや空振りを取り、追い込んで落ちる球へつなぐ流れを見ると分かりやすいのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：2026年の日本ハム戦はここまで**4登板・4回・6失点、防御率13.50、3被本塁打**と、他球団戦より明確に苦しんでいる。==今日登板すれば、「四球を出さない安定感」と「日本ハムには長打を浴びている」という正反対のデータのどちらが出るかが大きな見どころなのだ==。\n\n### 出立ち\n- 身長・体重・体格：**178cm・96kg**。肩まわりと胴体に厚みのある、がっしりした体格なのだ。\n- 投打・フォームの特徴：右投左打。大きな体を使って勢いよく腕を振る右のオーバースローで、直球を軸にスプリット、スライダーなどを組み合わせる。派手な変則フォームではなく、強く腕を振ってストライクゾーンで勝負するタイプなのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：2026年の球団公式Q&Aではチャームポイントを「**気持ち**」、試合前ルーティンを「**体操**」と回答している。マウンドでも表情や腕の振りに気迫が出るので、本人が掲げる「魂」と合わせて見ると分かりやすい。\n- 背番号の由来・愛称・登場曲：2025年までの**66**から、2026年は**54**へ変更。黒木知宏投手コーチが現役時代につけた番号で、「ジョニーさんの魂が入っている番号。ぜひ付けたい」と本人が希望し、愛称は「**さわちゃん**」、登場曲はZARDの「**揺れる想い**」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：**愛媛県松山市**出身。野球は5歳のときに親に勧められて始めたことを大学日本代表の公式プロフィールで明かしているが、家族構成については、公開情報が見つかりませんでした。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：松山市立荏原小で**砥部リトル**、久谷中で**えひめ西シニア**に所属。中学時代の投球を大阪桐蔭・西谷浩一監督が視察したことをきっかけに**大阪桐蔭高**へ進み、その後**立教大**へ進学したのだ。\n- 野球のエピソード：大阪桐蔭では藤浪晋太郎と同期で、3年時は藤浪に次ぐ背番号10。2012年夏の甲子園3回戦・済々黌戦では「9番・投手」で先発し、**9回2失点で完投勝利**したうえ、のちにプロ入りする大竹耕太郎から本塁打まで打った。\n- 野球以外のエピソード：2016年のオリックスとの仮契約では、契約書の割り印を間違えて押し「メンタルをやられました」と苦笑いした。2026年の球団Q&Aではアクセサリー収集をご褒美に挙げ、最近買ってよかったものを「**ゴローズ**」、苦手なことを「ダイエット」と答えているのだ。\n- 印象的な試合：**2012年8月18日・夏の甲子園3回戦**で大阪桐蔭が済々黌に6-2で勝った試合なのだ。==エース藤浪ではなく澤田が完投し、自ら本塁打も放った一戦は、春夏連覇チームが藤浪一人だけではなかったことを示す試合だった==。\n- 実績（甲子園・大学リーグ・代表・表彰など）：大阪桐蔭で**2012年春夏甲子園連覇**を経験。立教大では東京六大学通算**69試合、22勝16敗、防御率2.24、225奪三振、300回**を記録し、2015年ユニバーシアード日本代表として金メダルを獲得した。\n- ドラフト・入団（年・順位・球団・契約）：**2016年ドラフト8位**でオリックスから指名され、契約金**2000万円**、年俸**700万円**（いずれも推定）で仮契約。背番号49で入団し、「驚くような球はない」と自己分析しつつ、長く活躍することを目標に掲げたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：オリックスで2017年に一軍デビューし、2018年は**47登板・5勝0敗・8ホールド・防御率2.54**、2019年は28登板で17ホールド。右肘を痛め、2022年6月にトミー・ジョン手術を受けた後に戦力外となり、2023年1月にロッテと育成契約を結んだ。\n- 野球のエピソード：ロッテでは背番号**132**から再出発し、2023年7月27日に支配下登録されて**66**へ変更。手術からのリハビリを経て一軍へ戻り、その年は17登板で防御率1.08と、復帰直後から結果を出したのだ。\n- 野球以外のエピソード：2026年公式プロフィールで性格を「**100か0どっちか**」、心に残る言葉を「最後は人間」と答えている。技術だけでなく気持ちを前面に出す本人像が、背番号54への思いともつながっているのだ。\n- 印象的な試合：**2023年8月12日西武戦**で、オリックス時代の2019年以来となる勝利を挙げた。右肘手術、戦力外、育成契約を経て一軍の勝利投手へ戻ったため、ロッテでの再出発を象徴する一戦なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：NPB一軍の個人タイトルはないが、2018年の**47登板・防御率2.54**、2019年の**17ホールド**がオリックス時代の代表的な数字。ロッテでは2023年に**17登板・2勝・6ホールド・2セーブ・防御率1.08**で復活を印象づけた。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**41登板、2勝1敗、11ホールド、防御率3.79、40回1/3、37奪三振、7四球**。登板数、ホールド数とも2025年の数字を上回り、ブルペンでの比重が増したのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は**29登板・1勝1敗1セーブ・防御率3.95**で、7月の一軍再合流後は防御率2.45と持ち直した。オフに背番号を66から54へ変え、2026年は開幕から一軍救援陣の一角として登板を重ねている。\n- 野球のエピソード：今季は四球を抑えながら、前年以上のペースで登板している。==40回1/3で与四球7という制球は、手術前後を知る32歳の投手が「球威だけではなく、ストライクを取る力」でも生き残っている証拠なのだ==。\n- 野球以外のエピソード：背番号54への変更時、黒木投手コーチの現役時代の映像を見て「改めて凄いなと感動しました」とコメント。自分も同じ番号で「気持ちのピッチング」を見せたいと語り、2026年公式Q&Aでも注目点を「魂」と一言で答えている。\n- 印象的な試合：今季は日本ハム戦で苦戦が目立ち、特に**7月8日**は1回で3安打、2本塁打、4失点を喫した。一方、直近の9月17日楽天戦では**1回12球、無安打、1奪三振、無失点**と締めている。\n- 実績（今季の記録・表彰）：個人タイトルや月間表彰はないが、9月26日時点で自己最多に迫る**41登板**、自己最多の**11ホールド**を記録。右肘手術後では最も多く一軍で投げるシーズンになっているのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**、9/26西武戦と9/27日本ハム戦は登板なし。最後の登板は**9/17楽天戦**で、1回を**12球、無安打、1奪三振、無四球、無失点**に抑えた。\n- エピソード：9月11日のソフトバンク戦では1回3安打1失点だったが、次の9月17日は三者で片づけた。登板ごとの波はあるものの、直近はきれいな無失点で終えているのだ。\n- 調子：最後の登板から**中10日**と間隔が空いている。直近登板の内容は良い一方、実戦間隔が長いため、最初の打者への直球がストライクに入るかが状態確認のポイントになる。\n- 分析・論点：今季全体では四球が非常に少ない一方、日本ハムには**4回で3本塁打**を許している。==今日の論点は「走者をためない」ことより、ストライクを取りにいった球を日本ハムの強打者に一発で仕留められないか、という長打対策なのだ==。\n- 今日の見どころ：清宮幸太郎ら長打のある打者に対し、直球一辺倒にならず落ちる球を低く使えるか。背番号54の「魂」を見せつつ、球数を少なく1イニングをゼロで終えられれば、前回日本ハム戦までの苦手データを塗り替える登板になるのだ。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001284.html\n- https://www.marines.co.jp/news/detail/202500752349.html\n- https://npb.jp/bis/players/01905134.html\n- https://npb.jp/bis/2026/stats/idp1_m.html\n- https://ja.wikipedia.org/wiki/%E6%BE%A4%E7%94%B0%E5%9C%AD%E4%BD%91\n- https://en.wikipedia.org/wiki/Keisuke_Sawada\n- https://koshien.hanshin.co.jp/highschool/summer2012/schedule_20120818.html\n- https://www.rikkyo.ac.jp/news/2016/10/18357.html\n- https://www.japan-baseball.jp/jp/team/univ/2015/universiade/sawada_keisuke.html\n- https://www.japan-baseball.jp/jp/profile/201504010.html\n- https://www.nikkansports.com/baseball/news/1745079.html\n- https://pacificleague.com/news/2023/1/10010966\n- https://pacificleague.com/news/2026/1/10045843\n- https://baseball.yahoo.co.jp/npb/player/1600157/top\n- https://baseball.yahoo.co.jp/npb/player/1600157/op\n- https://baseball.yahoo.co.jp/npb/player/1600157/year\n- https://npb.jp/scores/2026/0909/m-e-19/\n- https://npb.jp/scores/2026/0911/h-m-21/\n- https://npb.jp/scores/2026/0917/m-e-22/\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true, "number": "54", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e3/Keisuke_Sawada_Marines_20231004.jpg", "file": "https://commons.wikimedia.org/wiki/File:Keisuke_Sawada_Marines_20231004.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E6%BE%A4%E7%94%B0%E5%9C%AD%E4%BD%91", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Keisuke_Sawada_Marines_20231004.jpg/330px-Keisuke_Sawada_Marines_20231004.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "坂本光士郎", "title": "坂本光士郎（#36、左の中継ぎ、左投左打、32歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：左のスリークォーター（斜め横から出てくる腕の角度）から、球威のある直球とスライダー、カットボールを投げ込む左腕なのだ。2026年は9月26日時点で**33回2/3を投げて39奪三振**、奪三振率は**10.43**と、==投球回数より多く三振を奪っている==。\n- ユニークポイント：高校時代の最速は**135km/h**だったが、日本文理大で遠投を重ねて145km/h、社会人で148km/h、プロでは自己最速153km/hまで伸ばした。速い球を最初から持っていたのではなく、段階を踏んで球速を上げてきた投手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：日本ハムの清宮幸太郎や田宮裕涼ら左打者が並ぶ場面で、左の中継ぎとして名前が呼ばれるかに注目なのだ。特に清宮は通算100本塁打まであと1本なので、長打を防ぎたい場面なら坂本の役割が分かりやすい。\n- 注目の数字・プレー：今季は**27登板・防御率3.21・39奪三振**で、被本塁打は33回2/3で**1本**だけ。直球で押し込んでからスライダーやカットボールで空振りを取る形が出れば、坂本らしい投球なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：今季の日本ハム戦は条件別成績で**4試合・4回・1失点・6奪三振、防御率2.25**と抑えている。投手なので日本ハム先発・福島蓮との直接対決は基本的になく、==左打者を含む日本ハム打線から三振を取れるかが今日の焦点なのだ==。\n\n### 出立ち\n- 身長・体重・体格：**179cm・80kg**。極端な大型ではなく、細身すぎもしない標準的な投手体形なのだ。\n- 投打・フォームの特徴：左投左打。左のスリークォーターから直球、スライダー、カットボール、フォークなどを使い、2026年の球団公式プロフィールでは自ら「今年の俺のここに注目！」を**ストレート**と答えている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式でチャームポイントは「**えくぼ**」、試合前のルーティンは「**うどんを食べる**」と回答している。マウンド上では左腕の低めの腕の角度と、投げ終わりに一塁側へ体が流れる動きが見分けやすいのだ。\n- 背番号の由来・愛称・登場曲：ヤクルトでは**26**、2022年途中のロッテ移籍時は**27**、2023年から**36**。36への変更理由について本人が説明した公開情報が見つかりませんでした。愛称は「**こーしろー**」、登場曲は浜田省吾の「**愛の世代の前に**」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：**広島県三次市**出身。小学1年で野球を始め、2023年の球団公式Q&Aでは始めたきっかけを「**姉がやっていたから**」と答えているのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：小学1年で野球を始め、三次市立十日市中では軟式野球部、**如水館高**、**日本文理大**、社会人の**新日鐵住金広畑**へ進んだ。大学では4年春からエースとなり、社会人では1年目から主力投手として都市対抗と日本選手権のマウンドを経験した。\n- 野球のエピソード：如水館高2年夏の**2011年第93回全国高校野球選手権**で背番号11をつけ、チームはベスト8まで進出。大学では遠投で肩を鍛え、カットボールとツーシームも習得して、高校時代135km/hだった最速を145km/hまで伸ばしたのだ。\n- 野球以外のエピソード：プロ入り前の野球以外の具体的なエピソードは、公開情報が見つかりませんでした。\n- 印象的な試合：2018年の**社会人野球日本選手権**ではドラフト指名後に2試合へ登板し、計**8回2/3を無失点**。==プロ入り直前の全国大会で結果を残し、大会優秀選手にも選ばれた==。\n- 実績（甲子園・大学リーグ・代表・表彰など）：高校では2011年夏の甲子園**ベスト8**、大学4年時はリーグ戦で**2季連続MVP**を獲得し、全日本大学野球選手権と明治神宮大会に出場。社会人では**2018年アジア競技大会の社会人日本代表**にも選ばれ、日本選手権で優秀選手を受賞した。\n- ドラフト・入団（年・順位・球団・契約）：**2018年ドラフト5位**で東京ヤクルトから指名され、11月23日に仮契約。契約金**3500万円**、年俸**900万円**（いずれも推定）で、背番号26からプロ生活を始めたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2019年にヤクルトで一軍デビューし、2021年は**36登板・1勝2敗・7ホールド・防御率4.05**。2022年7月29日に山本大貴との交換トレードでロッテへ移り、2023年は自己最多の**51登板・16ホールド・防御率3.21**と飛躍した。\n- 野球のエピソード：**2021年4月24日中日戦**では1点を追う9回を三者凡退に抑え、その裏の逆転サヨナラでプロ初勝利を記録した。プロ3年目、通算30試合目でつかんだ白星に「長かった」と喜んだのだ。\n- 野球以外のエピソード：2025年の球団公式Q&Aでは趣味を「**ドライブ**」、好きな作品を「**ミナミの帝王**」、自分へのご褒美を「買い物」と答えている。2026年版では性格を「優柔不断」、苦手なものを「トマト」としており、球場外では柔らかい人柄が見えるのだ。\n- 印象的な試合：**2023年9月30日西武戦**、同点の9回1死満塁、しかも鈴木将平に2ボールとなった途中から登板。151km/hの直球で鈴木を、内角カットボールで外崎修汰を連続三振に仕留めて無失点で切り抜け、サヨナラ勝ちにつないだ。\n- 実績（タイトル・表彰・通算記録・代表）：NPBの個人タイトルや一軍表彰はないが、2023年に自己最多**51試合**へ登板し16ホールドを記録。==左打者だけのワンポイントではなく、満塁など厳しい場面を任される中継ぎとしてキャリアを築いてきた==。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**27登板、2勝1敗、1ホールド、防御率3.21、33回2/3、39奪三振、15四球**。2025年の8登板・防御率6.35から登板数も内容も大きく戻し、奪三振率は**10.43**なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は一軍8試合にとどまり、2026年は再び左の中継ぎとして登板を増やした。8月11日のソフトバンク戦で1回4失点した翌12日に登録抹消となったが、**8月29日に再登録**され、9月は一軍で投げ続けている。\n- 野球のエピソード：8月の再調整後、9月16日の楽天戦では**2回1安打3奪三振無失点**。直球を軸に長いイニングも処理できることを示し、左打者一人だけに投げる役割より広い使われ方をしているのだ。\n- 野球以外のエピソード：2026年の球団公式Q&Aでは、小学生の自分へ「漢字をとにかく覚えなさい」「今すぐ書道教室行きなさい」と助言したいと回答。本人の少し自虐的で親しみやすい一面なのだ。\n- 印象的な試合：**5月27日広島戦**では、故郷・広島県のマツダスタジアムで登板して**今季2勝目**を挙げた。1回1失点だったため「無失点の好投」ではないが、地元で勝利投手になったこと自体が印象的なのだ。\n- 実績（今季の記録・表彰）：個人表彰はないが、9月26日時点で前年の8登板から**27登板**まで復活し、防御率も**6.35から3.21**へ改善。==39奪三振は33回2/3という投球回数を上回り、三振を取れる左腕として存在感を取り戻したシーズンなのだ==。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**、9/26西武戦と9/27日本ハム戦は登板なし。最後の登板は**9/22オリックス戦**で、**2/3回・12球・1安打・1奪三振・無失点**だった。\n- エピソード：9月16日楽天戦は2回3奪三振無失点、9月19日西武戦は1回2奪三振無失点、9月22日も無失点。直近3登板を合わせると**3回2/3・2安打・6奪三振・1四球・無失点**なのだ。\n- 調子：==直近3登板は無失点で、6個のアウト以上を三振で奪うほど球の切れが出ている==。最後の登板から中5日空いているため、連投疲労もなく使いやすい状態と考えられる。\n- 分析・論点：今季は三振を奪える一方、**33回2/3で15四球**と制球には波もある。最初の打者にストライクを先行できれば直球とスライダーの威力が生きるので、「三振数」だけでなく「四球を出さないか」も一緒に見ると調子が分かりやすいのだ。\n- 今日の見どころ：日本ハム戦では今季4回で6奪三振と相性がよく、清宮ら左打者にぶつける場面が想定される。通算100本塁打に王手をかける清宮との対戦が実現すれば、坂本の強い直球と清宮の長打力がぶつかる分かりやすい勝負になるのだ。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001272.html\n- https://www.marines.co.jp/team/player/detail/2025_00001139.html\n- https://www.marines.co.jp/team/player/detail/2023_00001263.html\n- https://npb.jp/bis/players/41745138.html\n- https://npb.jp/bis/2026/stats/idp1_m.html\n- https://ja.wikipedia.org/wiki/%E5%9D%82%E6%9C%AC%E5%85%89%E5%A3%AB%E9%83%8E\n- https://en.wikipedia.org/wiki/Koshiro_Sakamoto\n- https://www.kokoshinro.com/school.php?name=%E5%A6%82%E6%B0%B4%E9%A4%A8\n- https://www.japan-baseball.jp/jp/profile/201807010.html\n- https://www.nikkansports.com/baseball/news/201810250000842.html\n- https://www.nikkansports.com/baseball/news/202104240001469.html\n- https://www.yakult-swallows.co.jp/news/detail/27510\n- https://www.marines.co.jp/news/detail/00008215.html\n- https://www.marines.co.jp/news/detail/00008600.html\n- https://baseballking.jp/ns/403611/\n- https://pacificleague.com/player/519037/video\n- https://pacificleague.com/game/35488\n- https://www.marines.co.jp/news/announce/entry/202608/\n- https://baseball.yahoo.co.jp/npb/player/1800037/op\n- https://baseballdata.jp/dashboard/20260916_1800037P.html\n- https://baseballdata.jp/dashboard/20260919_1800037P.html\n- https://npb.jp/scores/2026/0922/m-b-24/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true, "number": "36", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b1/Koshiro_Sakamoto_Chiba_Lotte_Marines_20220922.jpg", "file": "https://commons.wikimedia.org/wiki/File:Koshiro_Sakamoto_Chiba_Lotte_Marines_20220922.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%9D%82%E6%9C%AC%E5%85%89%E5%A3%AB%E9%83%8E", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Koshiro_Sakamoto_Chiba_Lotte_Marines_20220922.jpg/330px-Koshiro_Sakamoto_Chiba_Lotte_Marines_20220922.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "髙橋快秀", "title": "髙橋快秀（#93、投手・ブルペン、右投右打、20歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：一番の武器は**最速154km/h**の直球で、2026年9月26日までの一軍では投球の約7割を占めている。スライダーに加え、プロ入り後に磨いたフォークでも空振りを取れるようになってきた若い右腕なのだ。\n- ユニークポイント：高校卒業後に大学進学の誘いもあったが、「1年でも早くNPBに入りたい」と四国アイランドリーグplusの徳島インディゴソックスへ進んだ。==育成入団1年目の二軍で支配下登録前まで16試合・防御率0.00を続け、7月30日に背番号127から93へ上がった==急成長株なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：接戦の中盤以降に名前が呼ばれたら、まず直球が打者の手元でどれだけ押し込めるかを見るとよい。9月27日は**7回を1回無失点・1奪三振**でつなぎ、プロ初ホールド（リードを保って後ろへつないだ記録）を挙げたばかりなのだ。\n- 注目の数字・プレー：9月26日時点では一軍**4試合、5回、防御率9.00**だが、9月27日を終えると**5試合、6回、防御率7.50、1ホールド**となった。結果だけでなく、154km/h級の直球と落差のあるフォークで空振りを取れるかが成長を見るポイントなのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム打線との一軍対戦はまだ少なく、個々の打者との十分な相性データはない。だから今日は左右を問わず、清宮幸太郎ら長打のある打者にも直球でストライクを取り、フォークを低めに落とせるかを見るのがよいのだ。\n\n### 出立ち\n- 身長・体重・体格：**178cm・82kg**。徳島時代からプロ入り後にかけてトレーニングと食事を見直し、球速を伸ばしてきた比較的コンパクトな右腕なのだ。\n- 投打・フォームの特徴：右投右打。直球、スライダー、フォークが軸で、2026年一軍の直球平均は9月26日時点で**148.7km/h**、最速154km/hだった。本人は体の連動性とスピードを高めるトレーニングを続けている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでは試合前の決まった動作より、普段から「掃除」を大切にし、ゴミをそのままにすることが苦手だと答えている。20歳らしい若い顔立ちと、力感のある速球とのギャップも覚えやすいのだ。\n- 背番号の由来・愛称・登場曲：育成時代は**#127**、2026年7月30日の支配下登録で**#93**になった。愛称は球団公式で「かいしゅう」だが、**#93の由来と登場曲は公開情報が見つかりませんでした**。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：香川県出身。**7歳上の兄**の影響で8歳ごろに野球を始めたと徳島時代のインタビューで話している。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：香川県の多度津高から、2024年に徳島インディゴソックスへ入団し、2年間プレーした。大学には進まず、独立リーグからNPBを狙う道を選んだのだ。\n- 野球のエピソード：高校卒業時にもプロ志望届を出したが指名されず、それでも早期のNPB入りを目指して徳島へ進んだ。徳島では直球の伸びとキレのあるスライダーを磨き、1年目から球速を伸ばした。\n- 野球以外のエピソード：徳島入り後は食事の内容を見直し、たんぱく質や野菜を意識して自炊もしながら体づくりに取り組んだ。入団契約時には徳島の仲間へロッテの菓子「パイの実」を送りたいと話している。\n- 印象的な試合：2025年は徳島で**20試合、69回1/3、7勝2敗、防御率2.86、39奪三振**。先発として勝ち星を積み、NPBスカウトに成長を示したシーズンだったのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：甲子園出場や大学リーグ歴はないが、2025年の徳島で7勝を挙げ、チームの前期優勝にも加わった。独立リーグで結果を出して育成ドラフト指名につなげたことが最大のアマ実績なのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2025年育成ドラフト2位**で千葉ロッテから指名され、11月21日に入団契約。入団時の背番号は127で、推定支度金300万円・年俸280万円と報じられた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2026年に育成選手としてロッテへ入団し、二軍で無失点登板を重ねて**7月30日に支配下登録**。8月7日に一軍初登板を果たし、9月27日には初ホールドまで進んだ。\n- 野球のエピソード：プロ入り後はフォークを重点課題にし、二軍戦でも試行錯誤を続けた。直球だけでなく変化球で三振を取ることを成長テーマにしているのだ。\n- 野球以外のエピソード：球団公式Q&Aでは自分へのご褒美を「お菓子」とし、心に残る言葉に「飯食え」を挙げるなど、体づくり中の若手らしい答えをしている。\n- 印象的な試合：==2026年8月7日のオリックス戦で一軍デビューし、自己最速154km/hを計測して1回無失点==。来田涼斗からフォークでプロ初奪三振を取り、「ファームでも投げたことのないくらい落ちた」と振り返った。\n- 実績（タイトル・表彰・通算記録・代表）：一軍タイトルや代表歴はまだない。プロ1年目で育成から支配下、一軍デビュー、初奪三振、初ホールドまで到達したことが現時点の主な実績なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：一軍は**4試合、5回、0勝0敗0セーブ0ホールド、防御率9.00、2奪三振**。被安打6、与四球3で、まだ少ない登板数の中で一軍打者への適応を進めている段階なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：二軍で支配下登録前まで**16試合・防御率0.00**を記録し、7月30日に支配下へ。8月7日の一軍デビュー後は敗戦処理だけでなく、9月27日にはリード時の7回を任されるところまで役割が広がった。\n- 野球のエピソード：二軍ではフォークの再現性を上げるため、キャッチボール段階から直球・スライダーと同じように狙ったところへ投げることを意識した。支配下後の一軍でも「自分のスタイルを変えない」と話している。\n- 野球以外のエピソード：徳島時代の仲間や、同じ独立リーグ出身の先輩から連絡をもらうことが励みになっている。阪神の工藤泰成からも支配下登録時に激励を受けたと明かしている。\n- 印象的な試合：8月7日の一軍初登板と、9月27日の日本ハム戦が節目だ。==特に9月27日は3打者を15球で無失点に抑え、勝ち試合でプロ初ホールドを記録した==。\n- 実績（今季の記録・表彰）：今季の主な記録は**支配下登録、一軍初登板、初奪三振、初ホールド**。個人表彰はまだない。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの試合がなく、9月26日の西武戦は登板なし。9月27日の日本ハム戦で7回に登板し、**1回、15球、無安打、無四球、1奪三振、無失点**で初ホールドを挙げた。\n- エピソード：9月27日は前日まで防御率9.00だった若手を、6-1とリードした7回に起用した形だった。そこで走者を出さずに1イニングを終えたのは、次の起用につながる内容なのだ。\n- 調子：直近登板は三者で無失点と良く、少なくとも前回より安定した。登板数が少ないため断定はできないが、直球と変化球がまとまれば一軍でも短い回を任せられる兆しが出ている。\n- 分析・論点：9月26日時点では**奪三振率3.60、WHIP1.80**と、二軍での圧倒的な数字ほど一軍では空振りを取れていなかった。==9月27日のように四球を出さず、直球でカウントを作って変化球で仕留められるかが次の論点==なのだ。\n- 今日の見どころ：連投で9月28日もベンチ入りしていれば、前日に続いてリード時や中盤の一イニングを任されるかに注目したい。登場したら球速表示だけでなく、フォークが打者の手前で低く落ちているかを見ると成長が分かりやすい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001801.html\n- https://npb.jp/announcement/2026/pn_registered.html\n- https://npb.jp/bis/teams/rst_m.html\n- https://pacificleague.com/player/526060/stats\n- https://pacificleague.com/player/526060\n- https://pacificleague.com/news/2026/8/10053594\n- https://baseball.yahoo.co.jp/npb/player/2112140/top\n- https://indigo-socks.com/news/team/9874/\n- https://indigo-socks.com/draft/\n- https://note.com/tokushima_indigo/n/n92ffb7b28102\n- https://note.com/tokushima_indigo/n/n704024dd92d3\n- https://www.marines.co.jp/team/draft/\n- https://indigo-socks.com/news/team/10059/\n- https://pacificleague.com/news/2025/11/10044967\n- https://www.nikkansports.com/baseball/news/202607290000941.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/games/2026/schedule_09_detail.html", "detail": true, "number": "93", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/1/16/%E9%AB%99%E6%A9%8B%E5%BF%AB%E7%A7%80_%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_%E6%A5%BD%E5%A4%A9%E3%83%A2%E3%83%90%E3%82%A4%E3%83%AB%E6%9C%80%E5%BC%B7%E3%83%91%E3%83%BC%E3%82%AF%E5%AE%AE%E5%9F%8E_2026-08-19.jpg", "file": "https://commons.wikimedia.org/wiki/File:%E9%AB%99%E6%A9%8B%E5%BF%AB%E7%A7%80_%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_%E6%A5%BD%E5%A4%A9%E3%83%A2%E3%83%90%E3%82%A4%E3%83%AB%E6%9C%80%E5%BC%B7%E3%83%91%E3%83%BC%E3%82%AF%E5%AE%AE%E5%9F%8E_2026-08-19.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E9%AB%99%E6%A9%8B%E5%BF%AB%E7%A7%80", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/%E9%AB%99%E6%A9%8B%E5%BF%AB%E7%A7%80_%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_%E6%A5%BD%E5%A4%A9%E3%83%A2%E3%83%90%E3%82%A4%E3%83%AB%E6%9C%80%E5%BC%B7%E3%83%91%E3%83%BC%E3%82%AF%E5%AE%AE%E5%9F%8E_2026-08-19.jpg/330px-%E9%AB%99%E6%A9%8B%E5%BF%AB%E7%A7%80_%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_%E6%A5%BD%E5%A4%A9%E3%83%A2%E3%83%90%E3%82%A4%E3%83%AB%E6%9C%80%E5%BC%B7%E3%83%91%E3%83%BC%E3%82%AF%E5%AE%AE%E5%9F%8E_2026-08-19.jpg"}}, {"team": "ロッテ", "section": "ブルペン", "name": "宮﨑颯", "title": "宮﨑颯（#66、投手・ブルペン、左投左打、26歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：武器は左腕からの**力強い直球**と、球団公式でも本人が挙げる「投げっぷりの良さ」。打者に向かってしっかり腕を振るタイプで、短いイニングを力で押す救援左腕なのだ。\n- ユニークポイント：2023年1月に左肘のトミー・ジョン手術（靱帯再建手術）を受け、長いリハビリを経て2025年7月にソフトバンクで支配下登録を勝ち取った。==そのオフに戦力外となったあと、ロッテが支配下選手として獲得し、2026年は背番号66で一軍に投げている==という再出発の投手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：日本ハムの左打者が続く中盤以降に登板するかが第一の見どころ。走者がいない時もクイック気味（足を大きく上げず素早く投げる形）に投げるフォームを試しており、テンポよくストライクを先行できるかを見るとよい。\n- 注目の数字・プレー：9月26日時点で**10試合、11回2/3、防御率6.17**。ただし9月は5回2/3で2自責点、月間防御率は**3.18**なので、シーズン通算より直近は持ち直しているのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：左投手なので、清宮幸太郎、矢澤宏太ら日本ハムの左打者にぶつける起用が考えやすい。ただし今季の一軍対戦数は少なく、特定打者との相性を言えるほどの母数はないため、左対左で直球を内外に投げ分けられるかが焦点なのだ。\n\n### 出立ち\n- 身長・体重・体格：**180cm・93kg**。球団公式でチャームポイントを「太ももの太さ」と答える、下半身のしっかりした体格なのだ。\n- 投打・フォームの特徴：左投左打。力強い直球が軸で、2026年夏には「右足を上げて止まる」従来型と、走者がいなくてもクイック気味に投げる形を試し、自分に合うタイミングを探している。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：大きな太ももが本人公認の目印。試合前のルーティンは「早く寝てお風呂に浸かる」で、マウンドでは全力で腕を振る躍動感のある姿が特徴なのだ。\n- 背番号の由来・愛称・登場曲：ソフトバンク育成時代は**#165**、2025年の支配下登録後は**#85**、ロッテ移籍後は**#66**。愛称は「ざき」「ガンダム」「ざきさん」「ゴンサ」、登場曲は[Alexandros]の**「Kick & Spin」**なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：埼玉県出身。野球好きの祖父の影響で小学1年から南エンゼルスで野球を始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：原市南小、原市中から大宮シニアを経て埼玉栄高、東京農業大へ進んだ。高校では左肘を痛めて外野の控えを経験し、大学で本格的に投手へ戻った。\n- 野球のエピソード：大学では速球を武器に成長し、藤川球児のような「分かっていても打てない直球」を理想に掲げていた。最速147km/h前後まで伸ばし、スライダーやカットボールも使う左腕として評価を上げた。\n- 野球以外のエピソード：東京農業大では地域環境科学部造園科学科で学び、**剪定（せんてい）が得意**だと2025年の取材で明かしている。原市中はお笑いコンビ「ハライチ」の母校でもあるという土地柄のエピソードも紹介された。\n- 印象的な試合：2022年10月23日の東都大学2部・国士舘大戦では**5回1失点**。最終学年まで先発左腕として投げ、プロへの足場を作った試合の一つなのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：埼玉栄高では甲子園出場なし。==東京農業大3年秋の東都大学2部で最優秀防御率を獲得==し、大学球界での評価を高めた。\n- ドラフト・入団（年・順位・球団・契約）：**2022年育成ドラフト8位**で福岡ソフトバンクから指名され、育成選手として入団。背番号165でプロ生活を始めた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2023年1月に左肘のトミー・ジョン手術を受け、2024年までリハビリと復帰過程を過ごした。2025年7月25日にソフトバンクで支配下登録され、同年一軍2試合を無失点、オフの戦力外後にロッテへ移籍した。\n- 野球のエピソード：手術で周囲との差が開いた時期も「回復したら絶対にまくってやる」という気持ちでリハビリしたと支配下会見で語った。復帰後は直球の強さと腕の振りを前面に出している。\n- 野球以外のエピソード：2025年の支配下登録を告げられたのは夕食を作っている時で、知らせを受けてまず安堵したという。ロッテから獲得の連絡を受けた時には思わずガッツポーズしたと入団会見で明かしている。\n- 印象的な試合：2025年8月に一軍デビューし、シーズンは**2試合、2回、無失点**。故障から約2年半を経て一軍のマウンドにたどり着いたこと自体が大きな節目だったのだ。\n- 実績（タイトル・表彰・通算記録・代表）：一軍タイトルや代表歴はまだない。育成8位から左肘手術を乗り越えて支配下登録を勝ち取り、さらに別球団の支配下契約を得た粘り強いキャリアが実績なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：一軍**10試合、11回2/3、0勝0敗0セーブ0ホールド、防御率6.17、8奪三振**。被安打11、与四球4、与死球3で、制球を整えながら結果を残す段階なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：ロッテ移籍1年目は春季キャンプを一軍スタート。シーズン中に二軍降格を経験したが、5月26日から7月10日まで二軍で**7試合連続無失点**、8月にも3試合連続無失点を作って再昇格した。\n- 野球のエピソード：二軍降格中、力みでタイミングを失う課題を修正するため、福浦和也二軍投手コーチらと相談してクイック気味のフォームを試した。キャッチボールから一球ずつ丁寧に投げる意識も続けている。\n- 野球以外のエピソード：球団公式Q&Aでは性格を「真面目です」、自分へのご褒美を「漫画を買う」と答えている。苦手なことに「麺類を食べること」を挙げるのも覚えやすい一面なのだ。\n- 印象的な試合：9月22日の登板では**1回、無安打、1奪三振、2四球、無失点**。走者は出したが得点を許さず、これが9月28日を迎える時点での直近登板なのだ。\n- 実績（今季の記録・表彰）：今季の個人表彰はない。移籍1年目に一軍10試合へ登板し、==9月はシーズン防御率6.17に対して月間防御率3.18まで改善している==ことが直近の成果なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの試合がなく、9月26・27日は登板なし。最後の登板は**9月22日**で、1回無安打・1奪三振・2四球・無失点だった。\n- エピソード：再昇格後はフォームを固定し切らず、その日の状態やコーチとの相談で足の上げ方を変える試行錯誤をしている。単なる「勢いの左腕」ではなく、一軍に残るため投げ方そのものを調整している最中なのだ。\n- 調子：8月末の一軍登板で甘い球を痛打された反省から、9月は低めとコースを意識して失点を減らしている。9月の**5回2/3で2自責点**は、通算数字より状態が上向いている材料になる。\n- 分析・論点：四球や死球で自分から走者を増やすと長所の直球が生きにくい。==「全力で腕を振る」ことと、甘い高さを避ける制球を両立できるかが一軍定着の最大の論点==なのだ。\n- 今日の見どころ：左打者が続く場面や、点差のある中盤以降で登板機会が来るかに注目したい。登板したら投球前の足の上げ方と、直球が捕手のミットへ低く強く届くかを見ると、今取り組んでいる修正が見えやすい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001413.html\n- https://npb.jp/bis/players/73175157.html\n- https://pacificleague.com/player/523103/stats\n- https://pacificleague.com/news/2026/9/10054880\n- https://www.softbankhawks.co.jp/news/detail/202500831961.html\n- https://www.marines.co.jp/news/detail/202500752621.html\n- https://www.marines.co.jp/news/detail/202600764814.html\n- https://www.nikkansports.com/baseball/news/202507240001414.html\n- https://www.sponichi.co.jp/baseball/news/2025/07/25/kiji/20250724s00001173396000c.html\n- https://www.sponichi.co.jp/baseball/news/2022/07/19/kiji/20220718s00001000699000c.html\n- https://www.nodai.ac.jp/news/article/npb-1/\n- https://www.nodai.ac.jp/news/article/2022-31/\n- https://www.nodai.ac.jp/news/article/42022/\n- https://draft.npb.jp/draft/2022/draftlist_h.html\n- https://www.saitamasakae-h.ed.jp/news_h/2022/12/02/37228/\n- https://ja.wikipedia.org/wiki/%E5%AE%AE%EF%A8%91%E9%A2%AF\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://npb.jp/games/2026/schedule_09_detail.html", "detail": true, "number": "66", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a5/HAYATO_66.jpg", "file": "https://commons.wikimedia.org/wiki/File:HAYATO_66.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%AE%AE%EF%A8%91%E9%A2%AF", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/HAYATO_66.jpg/330px-HAYATO_66.jpg"}}, {"team": "ロッテ", "section": "代打・代走", "name": "ソト", "title": "ソト（#99、内野手・代打、右投右打、37歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最大の武器は一振りで得点を動かす長打力。==DeNA時代の2018・2019年に2年連続本塁打王、2019年には打点王も獲得し、2026年6月にはNPB通算200本塁打へ到達した==実績十分の右打者なのだ。\n- ユニークポイント：2026年はロッテのキャプテンに就任し、球団の外国人主将としては1998年のフリオ・フランコ以来**28年ぶり**。若手に打撃を教え、投手の小島和哉にも「打者心理」を伝えることから、チーム内では「ソト先生」と呼ばれているのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発を外れた場合は、終盤に走者を置いた代打で出てくる一打席が最大の見せ場。37歳でも**17本塁打**を打っており、甘い球を一球で外野席まで運べるので、名前がコールされた瞬間から見逃せないのだ。\n- 注目の数字・プレー：9月26日時点で**112試合、打率.222、17本塁打、47打点**。安打数よりも長打で価値を出すタイプなので、打球が上がった時の飛距離と、走者を返せるかに注目するとよい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発の福島蓮は右投手で、右打者のソトには左右の組み合わせ上の有利はない。先発を外れるなら、終盤に日本ハムが左投手へ継投した場面などで代打の切り札として使われる可能性があり、個別の対戦成績より一発の怖さがポイントなのだ。\n\n### 出立ち\n- 身長・体重・体格：**185cm・97kg**。一塁を守る大柄な体格で、強いスイングから長打を生む典型的なパワーヒッターなのだ。\n- 投打・フォームの特徴：右投右打。大きな体を使って強く振り切り、特に引っ張った打球だけでなく逆方向にも長打を出せるのが強み。MLB、マイナー、NPBと長くプレーしてきた経験で投手の配球を読む。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式でチャームポイントは「笑顔」。大柄な体格と穏やかな表情で見分けやすく、ベンチでは若手へ声をかける姿も多いベテランなのだ。\n- 背番号の由来・愛称・登場曲：背番号**#99**はDeNA時代からロッテでも着けているが、**#99を選んだ由来は公開情報が見つかりませんでした**。チーム内の愛称は「ソト先生」で、2026年の球団公式登場曲はMadiel Laraの**「Dios Nunca Falla」**なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：プエルトリコのマナティ出身。母親、妻ら家族の支えをたびたび語っており、2026年には母が4度目の来日、妻は多くのホームゲームをZOZOマリンで見守っていると球団通訳のコラムで紹介された。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：プエルトリコのColegio Marista de Guaynaboから、2007年MLBドラフト3巡目（全体109位）でシンシナティ・レッズ入り。傘下マイナーを経て2013年にMLBデビューし、その後ホワイトソックス、ナショナルズ傘下でもプレーした。\n- 野球のエピソード：2歳ごろには父の帰宅をプラスチックのバットを持って待ち、4歳から野球を始めたという。2011年にはレッズ傘下のAAとAAAで合計**31本塁打・80打点**を記録し、長打力で注目された。\n- 野球以外のエピソード：子どものころは野球だけでなくさまざまなスポーツが好きで、数学も得意な成績の良い子だったと母親が振り返っている。現在も家族と信仰を大切にしている。\n- 印象的な試合：MLBでは**2013年5月18日**にレッズで初出場。長いマイナー生活を経てメジャーの舞台に立ち、その後日本で大きく開花する土台になったのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：日本の甲子園や大学リーグ歴はない。プエルトリコ代表として**2023年ワールド・ベースボール・クラシック（WBC）**に出場した。\n- ドラフト・入団（年・順位・球団・契約）：**2007年MLBドラフト3巡目・全体109位**でレッズから指名され、契約金は27万9000ドルと記録されている。2017年11月にDeNAと契約し、2018年からNPBでプレーを始めた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2013～14年にレッズでMLB、2018～23年にDeNA、2024年からロッテ。DeNAで本塁打王2回など主砲として成功し、ロッテでも中軸を担ってきた。\n- 野球のエピソード：2018年に**41本塁打**で本塁打王、2019年も43本塁打で連覇し、同年は108打点で打点王も獲得。日本の投手への適応力と、失投を逃さない長打力を証明した。\n- 野球以外のエピソード：若手を食事へ連れて行き、打撃について助言する面倒見の良さが2026年の主将就任理由の一つになった。外国人選手という枠を越えて、チーム全体の相談役になっているのだ。\n- 印象的な試合：==2026年6月5日の巨人戦でNPB通算200号本塁打を放ち、史上116人目の200本塁打達成者になった==。NPB993試合目、37歳3か月での節目だった。\n- 実績（タイトル・表彰・通算記録・代表）：本塁打王**2回（2018、2019）**、打点王1回（2019）、ベストナイン2回（2018、2019）、月間MVPなど。2023年WBCプエルトリコ代表、NPB通算200本塁打も持つ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**112試合、333打数74安打、打率.222、17本塁打、47打点、出塁率.287、長打率.417**。全盛期より打率は低いが、17本塁打は代打でも怖い理由になる数字なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年は外国人選手として28年ぶりの球団キャプテンに就任。シーズン終盤は先発だけでなく代打待機の日もあり、経験と長打力を一打席に使う役割が増えている。\n- 野球のエピソード：若手へ打撃の考え方を伝えるだけでなく、投手にも打者目線を説明している。自分が打つだけでなく、チーム全体の攻守に経験を還元する立場なのだ。\n- 野球以外のエピソード：母親が2026年に来日した際、妻がホームゲームの多くを球場で見守っていることなど、家族に支えられて日本で長くプレーしている様子が紹介された。\n- 印象的な試合：6月5日の通算200号に加え、9月19日には代打で左中間へ**2ラン本塁打**を放った。==先発でなくても一振りで2点を取れることを、シーズン終盤にも示している==のだ。\n- 実績（今季の記録・表彰）：今季最大の記録は**NPB通算200本塁打**と**通算1000試合出場**。6月13日のDeNA戦で1000試合に到達し、日本球界での長い積み重ねを形にした。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの試合なし。9月26・27日は出場がなく、最後の出場は**9月25日の西武戦**で、7回に代打で中飛、守備で一塁に入り、9回に中前安打を放ってから池田来翔を代走に送られた。\n- エピソード：9月25日は最初の代打では凡退したが、もう一度回った打席で中前打を出した。代打から守備に残れば、延長や終盤でも再び打席が回ることがあると分かる例なのだ。\n- 調子：直近出場では安打が出ており、9月19日には代打本塁打もある。出場間隔は空いているが、ベンチから一打席で長打を狙う役割には十分な一発力を保っている。\n- 分析・論点：打率.222に対して17本塁打という成績は、「たくさん安打を積む」より「一打で大きく進める」打者だと示す。==終盤の走者ありで、相手がストライクを取りに来た一球を仕留められるかが代打ソトの価値そのもの==なのだ。\n- 今日の見どころ：代打で出れば、その一打席だけで球場の空気を変えられる。初球から振るのか、相手投手に球数を投げさせて甘い球を待つのか、ベテランらしい打席の組み立ても見てほしい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001301.html\n- https://www.marines.co.jp/team/player/detail/2026_00001301.html?lang=en\n- https://npb.jp/bis/players/03505136.html\n- https://ja.wikipedia.org/wiki/%E3%83%8D%E3%83%95%E3%82%BF%E3%83%AA%E3%83%BB%E3%82%BD%E3%83%88\n- https://en.wikipedia.org/wiki/Neftal%C3%AD_Soto_%28baseball%29\n- https://www.mlb.com/player/neftali-soto-519304\n- https://www.baseball-reference.com/draft/index.fcgi?draft_round=3&draft_type=junreg&query_type=year_round&year_ID=2007\n- https://npb.jp/award/2018/cl.html\n- https://npb.jp/award/2019/cl.html\n- https://www.wbc2023.jp/teams/389/1460193.html\n- https://pacificleague.com/news/2026/1/10046489\n- https://www.nikkansports.com/baseball/news/202601300001080.html\n- https://sports.yahoo.co.jp/official/detail/2026061800105-spnaviow\n- https://npb.jp/history/alltime/milestones_hr_200.html\n- https://www.marines.co.jp/news/detail/202600825406.html\n- https://www.marines.co.jp/news/detail/202600875813.html\n- https://pacificleague.com/player/518125\n- https://sports.yahoo.co.jp/official/detail/2026091900151-spnaviow\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://npb.jp/games/2026/schedule_09_detail.html", "detail": true, "number": "99", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/e/ee/Neftali_Soto_with_Chiba_Lotte_2.jpg", "file": "https://commons.wikimedia.org/wiki/File:Neftali_Soto_with_Chiba_Lotte_2.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E3%83%8D%E3%83%95%E3%82%BF%E3%83%AA%E3%83%BB%E3%82%BD%E3%83%88", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Neftali_Soto_with_Chiba_Lotte_2.jpg/330px-Neftali_Soto_with_Chiba_Lotte_2.jpg"}}, {"team": "ロッテ", "section": "代打・代走", "name": "上田希由翔", "title": "上田希由翔（#10、内野手・代打、右投左打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：左打席から強く振り切る打撃が持ち味で、一塁・三塁を守れる強打の内野手。ゆったり構えてから小さく足を上げ、内外角や緩急に対応するバットコントロールも評価されてきた。\n- ユニークポイント：名前の「希由翔（きゅうと）」は、父が生まれた息子を見て英語の**Cute（キュート）**から読みを決め、母が「希望に向かって自由に羽ばたいてほしい」と漢字に思いを込めた。愛称「カイリュー」も含め、名前を覚えやすい選手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：日本ハム先発・福島蓮は右投手なので、左打ちの上田は左右の組み合わせでは代打候補になりやすい。終盤に右投手が続く場面で呼ばれたら、長打を狙う強いスイングに注目したい。\n- 注目の数字・プレー：9月26日時点で**57試合、打率.221、7本塁打、15打点**。2025年の3本塁打から本塁打数を増やしており、少ない打席でも一発が出る打者へ近づいているのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：福島との十分な個人対戦データはなく、相性を断言できる材料は少ない。ただし左打者対右投手という組み合わせでは代打に選ばれやすい場面があり、甘く入った直球や変化球を一振りで仕留められるかが見どころなのだ。\n\n### 出立ち\n- 身長・体重・体格：**183cm・96kg**。球団公式で自分のチャームポイントを「丸い」と答える、厚みのある体格の左打者なのだ。\n- 投打・フォームの特徴：右投左打。ゆったりした構えから振り切るスイングで、小さな足の上げ幅を使いながら内外角や緩急に合わせる。強く振るだけでなく、バットコントロールと選球眼もアマ時代から評価された。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：がっしりした体格と丸みのある顔立ちが目印。試合前には**呼吸を整えること**をルーティンにしていると球団公式Q&Aで答えている。\n- 背番号の由来・愛称・登場曲：**#10**は明治大4年時と同じ番号で、「印象深い番号」と本人が説明している。愛称は「キューティー」「カイリュー」、2026年の登場曲は櫻坂46「何歳の頃に戻りたいのか？」、ベリーグッドマン「黎明」、BLACKPINK「JUMP」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：愛知県岡崎市出身。名前は父母がそれぞれ読みと漢字に思いを込めて付け、ドラフト入団時には父と一緒に好物のレディーボーデンを食べた思い出も紹介された。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：岡崎市立六ツ美北部小1年で野球を始め、南中では幸田ボーイズ。愛知産業大三河高から明治大へ進み、大学では1年秋から4番を任された。\n- 野球のエピソード：高校通算**46本塁打**。明治大では早くから中軸を担い、4年間の東京六大学リーグで**83試合、74打点**を記録し、ドラフト時点でリーグ歴代4位の打点数と報じられた。\n- 野球以外のエピソード：好物はアイスのレディーボーデンで、明治大の寮でも冷凍庫に入れていたという。球団公式では「ご褒美は食べ物」と答え、食への愛着が一貫しているのだ。\n- 印象的な試合：**2018年夏の甲子園**に愛産大三河の4番として出場し、1回戦の横浜戦で2安打を放ったが、チームは0-7で敗れた。全国の舞台を高校2年で経験した試合なのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：明治大では2022年に東京六大学春秋連覇と明治神宮大会優勝を経験し、2023年は主将として全日本大学野球選手権で準優勝。==2023年の日米大学野球選手権では大学日本代表としてシリーズ優勝を経験した==。\n- ドラフト・入団（年・順位・球団・契約）：==**2023年ドラフト1位**でロッテから指名され、11月26日に契約金1億円プラス出来高、年俸1600万円（いずれも推定）で合意==。背番号10で入団した。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2024年に一軍21試合、打率.259・0本塁打・7打点。2025年は66試合、打率.211・3本塁打・20打点と出場を増やし、2026年は9月26日時点で57試合・7本塁打まで長打を伸ばした。\n- 野球のエピソード：2025年7月17日のソフトバンク戦でプロ初本塁打になるはずの2ランを放ったが、降雨コールドでその回の攻撃ごと取り消される珍事を経験。8月2日の西武戦で與座海人から改めて「正真正銘」のプロ1号を打った。\n- 野球以外のエピソード：球団公式では自分の性格を「負けず嫌い」とし、心に残る言葉に**「have toではなくwant toで」**を挙げている。やらされるのではなく、自分から取り組む姿勢を大切にしているのだ。\n- 印象的な試合：2024年6月16日の中日戦では柳裕也から同点の右中間適時二塁打を放ち、チームの逆転勝利後にプロ初のお立ち台へ。初年度に一軍で勝利へ直接つながる一打を経験した。\n- 実績（タイトル・表彰・通算記録・代表）：プロでの個人タイトルはまだない。大学日本代表、東京六大学での74打点、明治神宮大会優勝など、アマ時代の実績が厚いドラフト1位選手なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**57試合、154打数34安打、打率.221、7本塁打、15打点、出塁率.273、長打率.396**。本塁打は自己最多を更新している。\n- 経歴（昇格・降格・故障・役割の変化・契約）：開幕一軍に入ったが出場機会がないまま3月29日に登録抹消。その後一軍へ戻り、一塁・三塁や代打で57試合に出場し、シーズン終盤はベンチからの一打も求められている。\n- 野球のエピソード：2026年は長打数を増やし、前年3本だった本塁打を**7本**まで伸ばした。一方で打率は.221なので、長打力を保ちながら安定して出塁できるかが次の課題なのだ。\n- 野球以外のエピソード：球団公式の愛称は「キューティー」「カイリュー」。同期やファンから親しまれる呼び名があり、ベンチから出てきた時も背番号10と合わせて覚えやすい。\n- 印象的な試合：2026年8月29日の日本ハム戦では明治大の先輩後輩対決となる場面で本塁打を放ち、今季の長打力を示した。大学時代から知る相手との対戦がプロで再現されるのも見どころなのだ。\n- 実績（今季の記録・表彰）：個人表彰はないが、**シーズン7本塁打は自己最多**。プロ3年目で一軍通算本塁打を二桁へ乗せ、長打で出場機会を広げている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの試合がなく、9月26・27日は出場なし。最後の出場は**9月23日**で3打数無安打1三振だった。9月22日も1打数無安打、9月19日は代打で二塁打を放っている。\n- エピソード：9月19日の二塁打以降は打席数が少なく、9月23日を最後に出場間隔が空いている。スタメンより代打で一打席を任される日が増えると、試合に入る準備そのものが重要になるのだ。\n- 調子：9月は**16打数3安打、打率.188**と数字上は低調。打席数が少ないため波は大きいが、シーズン7本塁打の長打力があるので、一球の失投で状態を変えられるタイプでもある。\n- 分析・論点：今季は長打が増えた一方、三振も多く、代打では追い込まれる前に自分の球を仕留めることが重要になる。==右投手相手に甘い球を一度で捉えられるかが、今夜の起用価値を左右する==のだ。\n- 今日の見どころ：福島や右の救援投手に対して代打で出れば、まず初球から振れる準備ができているかを見たい。左打席から右翼方向へ引っ張る強い打球が出れば、スタンドまで届く可能性がある。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001290.html\n- https://npb.jp/bis/players/71375159.html\n- https://pacificleague.com/player/524013/stats\n- https://pacificleague.com/player/524013/video\n- https://ja.wikipedia.org/wiki/%E4%B8%8A%E7%94%B0%E5%B8%8C%E7%94%B1%E7%BF%94\n- https://en.wikipedia.org/wiki/Kyuto_Ueda\n- https://www.aichi-kouyaren.com/past_record/past_record_other/entry-2305.html\n- https://www.meiji.ac.jp/koho/news/2023/mkmht000000dtv4k.html\n- https://www.japan-baseball.jp/jp/profile/202202020.html\n- https://www.japan-baseball.jp/jp/news/press/20230619_2.html\n- https://www.japan-baseball.jp/jp/team/univ/2023/univ_us_japan/overview.html\n- https://www.nikkansports.com/baseball/news/202311260000334.html\n- https://www.nikkansports.com/baseball/news/202311260001333.html\n- https://www.marines.co.jp/news/detail/202300420300.html\n- https://www.nikkansports.com/baseball/news/202312070001089.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://npb.jp/games/2026/schedule_09_detail.html", "detail": true, "number": "10", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/9/95/%E4%B8%8A%E7%94%B0%E5%B8%8C%E7%94%B1%E7%BF%94.jpg", "file": "https://commons.wikimedia.org/wiki/File:%E4%B8%8A%E7%94%B0%E5%B8%8C%E7%94%B1%E7%BF%94.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E4%B8%8A%E7%94%B0%E5%B8%8C%E7%94%B1%E7%BF%94", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/%E4%B8%8A%E7%94%B0%E5%B8%8C%E7%94%B1%E7%BF%94.jpg/330px-%E4%B8%8A%E7%94%B0%E5%B8%8C%E7%94%B1%E7%BF%94.jpg"}}, {"team": "ロッテ", "section": "代打・代走", "name": "池田来翔", "title": "池田来翔（#00、内野手・代走、右投右打、26歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：二塁や一塁など内野を守りながら、終盤は代走・守備固めで試合を締める便利な存在。2026年は**80試合出場に対して88打席**しかなく、数字そのものが「打つ以外の仕事で出場している」役割をよく表しているのだ。\n- ユニークポイント：小学生時代に**千葉ロッテマリーンズジュニア**へ選ばれ、2021年ドラフト2位で本家マリーンズへ入団した。==マリーンズジュニア出身者として初めてロッテに入団した選手==という、地元球団とのつながりがとても強いのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：終盤、ソトや井上広大のような長打型の打者が一塁へ出た時に代走で呼ばれる場面。打席がなくても、スタート、二塁への進塁、次の塁を狙う判断だけで試合へ影響できるのだ。\n- 注目の数字・プレー：9月26日時点で**4盗塁・盗塁死0**。盗塁数自体は多くないが、失敗なしなので、走る場面を厳選して確実に次の塁を取っているのが特徴なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発の福島蓮は右投手で、右打ちの池田に左右の有利はない。ただし池田の主な役割は代走なので、投手との打撃相性より、終盤の日本ハム投手・捕手が走者をどれだけ警戒するかの方が重要になる。\n\n### 出立ち\n- 身長・体重・体格：**180cm・95kg**。代走要員としてはかなりがっしりした体格で、もともとは「強打の二塁手」としてドラフト上位評価を受けた選手なのだ。\n- 投打・フォームの特徴：右投右打。2023年に打撃フォームを見直し、前年のオープンスタンス気味からスタンスを狭めて「無駄を省き、コンパクトに」したと説明している。強い打球を出す力と内野守備を両立するタイプだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：厚みのある体格が目印で、球団公式の試合前ルーティンは**昼寝**。ベンチから途中出場する機会が多いため、長い試合でも終盤へ状態を合わせる準備が大切なのだ。\n- 背番号の由来・愛称・登場曲：プロ入りから**#00**を着けているが、**#00を選んだ由来は公開情報が見つかりませんでした**。過去の球団公式では愛称「イケ」「イケさん」、2026年の登場曲はQueen「I Was Born To Love You」とKendrick Lamar「HUMBLE.」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：千葉県八千代市出身。父・正樹さんは報徳学園高、日本大、NTT関東で外野手としてプレーし、母は和美さん。父が右翼手だったことなどから「来翔（らいと）」の名前にも**ライト（右翼）**の縁が込められている。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：小6でマリーンズジュニア、八千代中から東都京葉ボーイズを経て習志野高へ。国士舘大では1年から三塁・二塁で出場し、のちにロッテで同僚となる髙部瑛斗ともプレーした。\n- 野球のエピソード：父の影響で野球を始め、習志野高では強打の内野手として中軸を担った。国士舘大でも左右へ長打を打てる二塁手として評価され、ドラフト2位まで順位を上げたのだ。\n- 野球以外のエピソード：高校時代の打席曲は習志野の応援で有名な「エル・クンバンチェロ」。これは父が社会人野球で応援に使われていた曲でもあり、本人が希望して受け継いだという家族と応援のつながりがある。\n- 印象的な試合：2017年夏の千葉大会準決勝・検見川戦で、==1回先頭打者として左翼席へ本塁打を放ち、習志野の7-2勝利を勢いづけた==。翌日の決勝は木更津総合に3-4で敗れ、甲子園にはあと一歩届かなかった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：高校では甲子園出場なしだが、2017年夏の千葉大会準優勝。小6では12球団ジュニアトーナメントにマリーンズジュニアとして出場し、大学では東都大学リーグでプレーした。\n- ドラフト・入団（年・順位・球団・契約）：**2021年ドラフト2位**で千葉ロッテから指名され、契約金7000万円・年俸1200万円（推定）で合意。背番号00で、憧れの井口資仁のような「大胆な内野手」を目標に掲げた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2022年は一軍11試合、2023年は40試合、2024年は21試合。2025年に**自己最多83試合、打率.238、5本塁打、20打点**と出場を伸ばし、2026年は80試合まで出場している。\n- 野球のエピソード：1年目に一軍投手の速球や小さな変化球へ対応できなかった反省から、2023年に打撃フォームをコンパクト化。長打型として入ったが、近年は守備・走塁でも一軍に残る幅を広げた。\n- 野球以外のエピソード：2026年の球場グルメでは池田の選手メニューとして、豆乳担々うどん、千葉県産豚の生姜焼き丼、エビを使ったメニューなどが展開されている。ファンが球場で名前に触れる機会もあるのだ。\n- 印象的な試合：プロ初安打は2022年4月3日の西武戦。高校時代から地元千葉で知られた選手が、ロッテの一軍で初めて結果を残した節目だった。\n- 実績（タイトル・表彰・通算記録・代表）：個人タイトルや代表歴はまだない。2025年の83試合・5本塁打がキャリアハイ級のシーズンで、2026年は別の役割で80試合に出場している。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**80試合、85打数19安打、打率.224、0本塁打、1打点、4盗塁、盗塁死0**。88打席しかないため、出場試合数との差が非常に大きいのが特徴なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：前年は打席に立って5本塁打を放ったが、今季は代走・守備固めの比重が大幅に増えた。打席がなくても一軍の終盤を任される役割へ変化している。\n- 野球のエピソード：代走で出たあと一塁守備へ入り、そのまま試合終了まで守る起用が多い。単に「足の速い人を代わりに出す」だけでなく、守備まで含めて一枠で二つの仕事をこなせるのが強みなのだ。\n- 野球以外のエピソード：2026年のZOZOマリンでは「池田の千葉県産いもぶたの生姜焼丼」「らいとのガリバタ海老ポテト」など、本人名義の選手コラボメニューが販売されている。途中出場が多くても、球場内ではファンが名前に触れやすい選手なのだ。\n- 印象的な試合：9月25日の西武戦では9回にソトの代走で出場し、後続打者の攻撃で生還して追加点につなげた。翌26日も井上広大の代走から一塁守備へ入り、==2日続けて「代走→守備」の仕事を任された==。\n- 実績（今季の記録・表彰）：個人表彰はない。**4盗塁・盗塁死0**と、成功率を保ちながら終盤の走塁要員として80試合に出場していることが今季の実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの試合なし。9月25日はソトの代走で出て一塁を守り、生還。**9月26日は井上広大の代走から一塁守備、打席なし**。9月27日は出場しなかった。\n- エピソード：2試合続けて長打型の一塁手に代わって走り、そのまま守備へ入った。池田の役割が「点を取りに行く走塁」と「リードを守る守備」のセットだと分かる起用なのだ。\n- 調子：打撃の調子は直近に打席がほとんどないため判断しにくい。一方、走塁では今季4盗塁0失敗で、終盤の代走役としては安定している。\n- 分析・論点：80試合で88打席という使われ方では、打率よりも「一度のスタート」「一度の守備」が評価に直結する。==出塁した走者の代わりに出た直後、相手バッテリーへプレッシャーをかけて一つ先の塁を奪えるかが最大の仕事==なのだ。\n- 今日の見どころ：7回以降にロッテの鈍足の打者が一塁へ出たら、ベンチ前で池田が準備していないかを見るとよい。代走で出たら盗塁だけでなく、外野への浅い打球で進むか止まるかという判断にも注目したい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001250.html\n- https://www.marines.co.jp/team/player/detail/2024_00001259.html\n- https://www.marines.co.jp/team/player/detail/2023_000012
