/team/draft/2025/\n- https://www.sponichi.co.jp/baseball/news/2025/11/22/articles/20251122s00001173037000c.html\n- https://big6scorebook.jp/member/20223003\n- https://baseball.omyutech.com/playerTop.action?playerId=1760900\n- https://www.nikkansports.com/baseball/news/202608290000691.html\n- https://www.nikkansports.com/baseball/news/202608290000612.html\n- https://www.fighters.co.jp/news/announce/entry/202608/\n- https://www.fighters.co.jp/news/announce/entry/202609/\n- https://npb.jp/scores/2026/0829/f-m-20/box.html\n- https://npb.jp/scores/2026/0923/f-e-24/box.html\n- https://npb.jp/scores/2026/0924/f-e-25/box.html\n- https://npb.jp/scores/2026/0926/b-f-25/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true}, {"team": "日本ハム", "section": "代打・代走", "name": "R.カストロ", "title": "R.カストロ（#6、内野・代打・代走、右投右打、27歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：右打席から一振りで長打にできるパワーが武器なのだ。9月26日時点で**71試合、8本塁打、24打点、長打率.365**で、打率.215でも代打で試合を動かせる怖さがある。\n- ユニークポイント：メジャーでは2021年に==「最初の5安打がすべて本塁打」という1901年以降のMLBで初の記録==を作った。日本ハムでは登録は内野手だが、中堅を守った経験もあり、球団も加入時に「ショート、セカンド、サードを主に守り、センター経験もある」と紹介したユーティリティー選手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：左投手への代打や、終盤に長打が欲しい場面でベンチから出てくるところなのだ。今季は**8本塁打**を放っているので、走者を置いた一打席で試合の景色を変えられる。\n- 注目の数字・プレー：今季は**200打数43安打、8本塁打、57三振**で、三振は少なくない一方、安打の約5本に1本が本塁打なのだ。==「当たるか、長打になるか」という振れ幅の大きさが観戦ポイントになる。==\n- 対戦相手との関係（今日の先発・打線との相性）：今日のロッテ先発アンドレ・ジャクソンとは右対右になる。8月29日の日本ハム―ロッテ戦ではジャクソンが4回6失点で降板したあとにカストロが守備から出場しており、この試合では直接対戦していないため、今日当たれば今季の分かりやすい初対戦機会になる。\n\n### 出立ち\n- 身長・体重・体格：**183cm・92kg**。内野手としては厚みのある体格で、長打力を想像しやすいシルエットなのだ。\n- 投打・フォームの特徴：**右投右打**。2024年まではスイッチヒッター（左右両打ち）だったが、球団の木田優夫GM代行によると2025年から右打ち一本に絞っており、強いスイングで引っ張るだけでなく逆方向にも長打を運べる。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：打席では183cm・92kgのがっしりした体格が目印になる。髪型やひげ、固定した試合前ルーティンについて、本人が継続的に説明した公開情報は確認できなかった。\n- 背番号の由来・愛称・登場曲：日本ハムでは背番号**6**で、応援歌では「**ルディ**」と呼ばれる。登場曲はCeky Viciny & Flow 28の「Oh Oh Oh」と、Tokischa & Ezzy Rの「TÚ NO ERE DE NA」で、背番号6を選んだ具体的な由来は公開情報で確認できなかった。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：ドミニカ共和国エリアス・ピーニャ州ロス・ジャノス出身。家族構成については、**公開情報が見つかりませんでした**。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：ビタリナ・モルダン・デ・クルス学校を経て、16歳だった2015年にピッツバーグ・パイレーツとインターナショナル・フリーエージェントとして契約した。日本の高校・大学野球を経ず、ドミニカから直接米国球界へ入った選手なのだ。\n- 野球のエピソード：パイレーツとはドラフトではなく国際FAで契約し、報道では契約金は**15万ドル**。2016年にドミニカン・サマーリーグでプロデビューし、10代からマイナー各階級を上がっていった。\n- 野球以外のエピソード：プロ契約前の学校生活や野球以外の活動について、具体的に裏づけられる**公開情報が見つかりませんでした**。\n- 印象的な試合：プロ入り前のアマチュア時代について、試合ごとの記録を確認できる**公開情報が見つかりませんでした**。16歳で国際FA契約したため、日本の甲子園や大学リーグのような公開試合記録が少ない経歴なのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：日本の甲子園・大学リーグに相当する大会実績や、プロ入り前の代表・表彰について確認できる**公開情報が見つかりませんでした**。\n- ドラフト・入団（年・順位・球団・契約）：MLBドラフト指名ではなく、2015年にパイレーツと国際FAでマイナー契約を結んだ。日本ハムには2026年1月14日に契約合意が発表され、背番号**6**でNPBへ移った。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2016年からパイレーツ傘下でプレーし、2021年4月21日にMLBデビュー。2023年8月にベイリー・ファルターとのトレードでフィリーズへ移り、2024年は右手親指の靱帯断裂でシーズン後半を欠場、2025年は3Aリーハイバレーで**133試合、19本塁打、82打点、18盗塁**を記録した。2025年11月にブルージェイズとマイナー契約後、2026年1月に自由となり、日本ハムへ加入した。\n- 野球のエピソード：2021年7月、MLBで記録した最初の5安打がすべて本塁打になった。==若手時代から「当たれば飛ぶ」を極端な形で証明した選手なのだ。==\n- 野球以外のエピソード：2022年8月9日のダイヤモンドバックス戦で三塁へヘッドスライディングした際、ズボンの後ろポケットから携帯電話が落ちた。本人は意図しないミスだったと謝罪し、MLBの電子機器規定違反で**1試合の出場停止と罰金**を受けた。\n- 印象的な試合：2021年7月11日のメッツ戦では2本塁打を放ち、5点を追う展開からの**6-5逆転勝利**に貢献した。若手カストロの長打力を一気に印象づけた試合だった。\n- 実績（タイトル・表彰・通算記録・代表）：MLBでは2021〜23年にパイレーツ、フィリーズで通算**22本塁打、59打点**。公式タイトルはないが、「MLB最初の5安打がすべて本塁打」は現代野球（1901年以降）で初の記録である。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**71試合、222打席、200打数43安打、8本塁打、24打点、4盗塁、打率.215、出塁率.279、長打率.365**なのだ。9月27日は出場していないため、NPBの27日終了時点でも数字は同じである。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年1月に日本ハムへ加入し、3月26日に開幕1軍登録。8月7日に出場選手登録を抹消され、その後再昇格し、9月下旬はスタメンよりベンチからの起用が中心になっている。\n- 野球のエピソード：3月28日のソフトバンク戦でNPB初出場し、==初安打・初本塁打・初打点を同じ試合で記録==した。来日直後から持ち味の長打で自己紹介した形なのだ。\n- 野球以外のエピソード：加入時には「野球への情熱であふれる日本でプレーできることを楽しみにしている」と球団を通じてコメントした。ドミニカ、米国を経て初めて日本球界へ挑む1年になっている。\n- 印象的な試合：NPBデビュー戦の3月28日ソフトバンク戦が象徴的で、初安打がそのまま本塁打になった。MLBで「最初の5安打が本塁打」だった選手らしいスタートなのだ。\n- 実績（今季の記録・表彰）：NPB初出場、初安打、初本塁打、初打点を3月28日に記録し、9月26日時点で**8本塁打**まで伸ばした。タイトル・月間表彰は確認できないが、来日1年目から一発を期待される右打者として戦力になっている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日の楽天戦、26日のオリックス戦、27日のロッテ戦はいずれも出場なし。最後の出場は9月23日の楽天戦で、中堅として先発し**5打数0安打、2三振**だった。\n- エピソード：9月23日は本職の内野ではなく中堅で先発しており、守備の選択肢を広げる起用だった。その後3試合はベンチ待機が続き、終盤の一打を求められる立場が強くなっている。\n- 調子：9月は23日までで**23打数3安打、打率.130、9三振**と当たりが落ちている。長打力は消えない一方、最近はボール球を追わずに自分のスイングができるかが重要なのだ。\n- 分析・論点：今季は57三振に対して14四球で、積極性が長打にも三振にもつながっている。==代打なら「初球から振るか」「追い込まれる前に甘い球を仕留められるか」が一番分かりやすい観察点になる。==\n- 今日の見どころ：終盤にロッテが左腕を投入した場面や、走者を置いて一発が欲しい場面で出番がありそうなのだ。直近3試合出場なしのため、久しぶりの打席で強いスイングを取り戻せるかに注目したい。\n\n### 出典\n- https://npb.jp/bis/players/43945152.html\n- https://media.fighters.co.jp/player/6/\n- https://www.fighters.co.jp/news/detail/202600814618.html\n- https://www.fighters.co.jp/news/announce/entry/202608/\n- https://npb.jp/scores/2026/0829/f-m-20/box.html\n- https://npb.jp/scores/2026/0923/f-e-24/box.html\n- https://npb.jp/scores/2026/0924/f-e-25/box.html\n- https://npb.jp/scores/2026/0926/b-f-25/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.mlb.com/player/rodolfo-castro-666801\n- https://www.mlb.com/yankees/video/rodolfo-castro-s-historic-run\n- https://www.mlb.com/news/rodolfo-castro-hits-two-homers-as-pirates-beat-mets\n- https://www.mlb.com/news/phone-falls-out-on-slide-by-rodolfo-castro\n- https://www.mlb.com/press-release/press-release-pittsburgh-s-castro-disciplined\n- https://www.milb.com/news/castro-named-triple-a-east-player-of-the-week\n- https://ja.wikipedia.org/wiki/%E3%83%AD%E3%83%89%E3%83%AB%E3%83%95%E3%82%A9%E3%83%BB%E3%82%AB%E3%82%B9%E3%83%88%E3%83%AD\n- https://en.wikipedia.org/wiki/Rodolfo_Castro", "detail": true}, {"team": "日本ハム", "section": "代打・代走", "name": "細川凌平", "title": "細川凌平（#56、内野・代走、右投左打、24歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：内野だけでなく外野も守れ、代走にも入れる器用さとスピードが強みなのだ。9月26日時点で**83試合、8盗塁、6犠打**と、打つ以外の仕事で出場機会を増やしている。\n- ユニークポイント：中学3年でボーイズリーグ日本代表として世界大会優勝を経験し、智弁和歌山では中堅手から遊撃手へ転向した。==「足の速い内野手」ではなく、内外野をまたいで試合の終盤を任せられるのが細川の価値なのだ。==\n\n### 見どころ\n- 今日の試合で見るべき場面：終盤に一塁走者の代走として出る場面、またはリード時の守備固めなのだ。左打者なので、右腕アンドレ・ジャクソンに対して代打で出れば右投手対左打者という組み合わせにも注目できる。\n- 注目の数字・プレー：今季は**83試合137打席**で、試合数に比べて打席が少ないのが役割をよく表している。**8盗塁・6犠打**もあり、==「打席に立たなくても勝負に参加している選手」だと考えると見つけやすい。==\n- 対戦相手との関係（今日の先発・打線との相性）：8月29日のロッテ戦では左翼の守備から途中出場したが、ジャクソン降板後だったため直接対戦はなかった。今日ジャクソンと打席で当たれば左打者の細川にとって対右腕の機会で、出塁後の走塁まで含めて持ち味を出したい場面になる。\n\n### 出立ち\n- 身長・体重・体格：球団公式では**174cm・81kg**。高校時代は50m**5秒8**の俊足で知られ、プロ入り後は体重を増やしながら機動力を保っている。\n- 投打・フォームの特徴：**右投左打**。高校時代から左打席で広角に打ち分ける技術とパンチ力を評価され、外野から遊撃へ移っても俊足を守備範囲に生かしてきた。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではユニホームを「上はダボダボ、下はピチピチ」に着るのがこだわりだと答えている。ルーティンは朝食を毎日ほぼ同じにし、球場に着いてから試合までの行動も同じ流れにそろえるタイプなのだ。\n- 背番号の由来・愛称・登場曲：入団から背番号は**56**。登場曲は矢沢永吉「サイコーな RockYou！」とNiziU「Take it」で、背番号56そのものの由来は本人による具体的な説明を確認できなかった。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：京都府京都市出身で、父は佳介さん、母は真理さん。実家は京都・嵐山で1919年創業の水上売店船「琴ヶ瀬茶屋」を営み、保津川下りの船に食事や飲み物を販売する家業なのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：小学2年で野球を始め、中学では京都東山ボーイズでプレーし、3年時にボーイズリーグ日本代表で世界一。智弁和歌山では1年から中堅手のレギュラー、2年から遊撃手へ移り、3年時は主将を務めた。\n- 野球のエピソード：小学生のころから「高卒でプロへ行く」と決め、プロ野球選手として結果を出した先に家業を継ぐ人生まで考えていたという。高校卒業直前には憧れていたイチローから母校で直接指導を受け、走塁ではスタートの重要性を教わった。\n- 野球以外のエピソード：家業は100年以上続き、新規参入が難しい特殊な仕事で、細川は幼いころから両親の働く姿を見て育った。球団公式でも京都のおすすめとして「嵐山・琴ヶ瀬茶屋（家業）」を挙げている。\n- 印象的な試合：2019年夏の甲子園3回戦・星稜戦は**延長14回、1-4**で敗れたが、奥川恭伸を相手にした全国屈指の投手戦だった。球団公式Q&Aでも、この試合を「野球人生で一番思い出に残っている試合」に挙げている。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学3年でボーイズリーグ日本代表として世界大会優勝。智弁和歌山では**1年夏、2年春、2年夏**に甲子園へ出場し、3年春のセンバツにも選出されたが新型コロナ禍で大会中止、同年夏は甲子園交流試合に出場した。\n- ドラフト・入団（年・順位・球団・契約）：2020年ドラフトで日本ハムから**4位指名**。同年11月30日に契約金**3500万円、年俸520万円**（いずれも推定）で仮契約し、背番号56で2021年に入団した。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年に高卒新人で1軍デビューし9試合、2022年20試合、2023年60試合、2024年51試合に出場。2025年は1軍16試合にとどまったが、2026年は9月26日時点で自己最多の**83試合**まで出場を伸ばしている。\n- 野球のエピソード：2021年10月18日の楽天戦で1軍初出場と初安打を同日に記録し、2023年9月26日のロッテ戦でプロ初本塁打。遊撃だけにこだわらず、二塁、一塁、外野、代走まで役割を広げて生き残ってきた。\n- 野球以外のエピソード：好きなアーティストはNiziUと矢沢永吉、好きな漫画は「ダイヤのA」。座右の銘は高校時代からの「志高心強」で、バッグやグラブにも刺しゅうを入れていた。\n- 印象的な試合：2025年5月24日の楽天戦では8回に代打で右前打を放ち、そのまま二盗を成功させた。==「代打で出塁→自分の足で次の塁へ」という、細川の仕事が一つの場面に詰まった試合なのだ。==\n- 実績（タイトル・表彰・通算記録・代表）：2023年にフレッシュオールスターへ出場。1軍通算では9月27日時点で**239試合、14盗塁、23犠打**を記録し、複数守備位置を担うユーティリティーとして出場を積み重ねている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**83試合、137打席、113打数25安打、打率.221、2本塁打、11打点、8盗塁、6犠打、出塁率.328**なのだ。9月27日は出場していないため、27日終了時点でも数字は同じである。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は1軍16試合だったが、2026年は代走・守備固め・途中出場を中心に1軍での役割を大きく増やした。二塁、一塁、外野など複数位置を守り、打席を多く与えられない試合でも起用されている。\n- 野球のエピソード：今季は**8盗塁**で自身の年間最多を更新し、犠打も6。打率だけでなく「次の1点を取る」「リードを守る」仕事でベンチの選択肢を増やしている。\n- 野球以外のエピソード：球団公式Q&Aでは、試合で気持ちを上げるためにイチローの現役時代のプレー動画を見ると答えている。プロ入り前に直接指導を受けた憧れの選手を、現在も準備の材料にしているわけだ。\n- 印象的な試合：今季は役割が分散しているため一試合の派手な数字より、代走や守備から勝負どころへ入る試合が多い。==83試合出場は過去最多だった2023年の60試合を大きく上回り、今季そのものが定着への一歩なのだ。==\n- 実績（今季の記録・表彰）：9月26日時点で自己最多の**83試合出場、8盗塁、2本塁打**。個人タイトルや月間表彰はないが、出場試合数・盗塁・本塁打はいずれも自己最多を更新している。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日の楽天戦で西川遥輝に代わって左翼へ入り、**1打数0安打**。9月26日のオリックス戦と27日のロッテ戦は出場していない。\n- エピソード：9月24日はスタメンではなく途中から左翼を守り、その後に打席が回ってきた。今季の細川らしい「まず守備で入り、必要なら打つ」という使われ方だった。\n- 調子：直近は打席自体が少なく、1試合の安打有無だけでは打撃状態を判断しにくい。むしろ代走でスタートを切れるか、守備で一歩目を速くできるかという、打席外のコンディションを見る方が役割に合っている。\n- 分析・論点：今季は**83試合で137打席**なので、先発固定選手とは評価軸が違う。==終盤に出てきたら「何のための交代か」を考えると、監督が守備・走塁・打席のどこを買っているかが見えてくる。==\n- 今日の見どころ：1点を争う終盤で日本ハムの走者が一塁に出たら、細川が代走候補になる。出場した瞬間から、盗塁だけでなくヒット1本で一つ余計に進塁できるか、次の守備位置まで含めて見てほしい選手なのだ。\n\n### 出典\n- https://npb.jp/bis/players/61865153.html\n- https://media.fighters.co.jp/player/56/\n- https://baseball.yahoo.co.jp/npb/player/2000082/base\n- https://www.sponichi.co.jp/baseball/news/2020/11/30/kiji/20201130s00001173398000c.html\n- https://www.nikkansports.com/baseball/highschool/news/201807050000160.html\n- https://www.nikkansports.com/baseball/highschool/news/202005180000055.html\n- https://www.nikkansports.com/premium/baseball/news/202404020000466.html\n- https://www.nikkansports.com/premium/baseball/news/202507110000739.html\n- https://number.bunshun.jp/articles/-/844704\n- https://number.bunshun.jp/articles/-/846661\n- https://number.bunshun.jp/articles/-/846836\n- https://bunshun.jp/articles/-/39845\n- https://npb.jp/scores/2026/0829/f-m-20/box.html\n- https://npb.jp/scores/2026/0924/f-e-25/box.html\n- https://npb.jp/scores/2026/0926/b-f-25/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://sp.baseball.findfriends.jp/?game_id=2025052404&pid=game_flash\n- https://ja.wikipedia.org/wiki/%E7%B4%B0%E5%B7%9D%E5%87%8C%E5%B9%B3", "detail": true}, {"team": "日本ハム", "section": "代打・代走", "name": "五十幡亮汰", "title": "五十幡亮汰（#50、外野・代走、右投左打、27歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：球界でも目立つ俊足が最大の武器で、盗塁だけでなく一塁から三塁、二塁から本塁を狙う走塁と広い外野守備に生きるのだ。9月26日時点で**99試合、13盗塁**、通算では**85盗塁**を記録している。\n- ユニークポイント：中学3年の2013年、全日本中学校陸上競技選手権で**100mを10秒92、200mを21秒81**で制し、100mではサニブラウン・アブデル・ハキームを破った。==陸上の全国王者になれる脚力を持ちながら、野球を選んでプロまで来た「本物のスプリンター」なのだ。==\n\n### 見どころ\n- 今日の試合で見るべき場面：終盤に一塁走者の代走として名前を呼ばれた瞬間が最大の見どころなのだ。盗塁をしなくても、投手が一塁へ何度もけん制するだけで打者への集中を削れるので、塁上にいるだけで試合が動く。\n- 注目の数字・プレー：今季は**99試合で124打席**しかなく、出場の多くが代走・守備からだと分かる。==打席数より試合数が大きく先行している数字そのものが、五十幡の特殊な役割を表している。==\n- 対戦相手との関係（今日の先発・打線との相性）：8月29日のロッテ戦は出場選手登録を外れていたため、先発アンドレ・ジャクソンとはその試合で対戦していない。今日打席が回れば左打者対右投手になるが、より大きな武器はジャクソン降板後も含めた終盤の走塁なのだ。\n\n### 出立ち\n- 身長・体重・体格：球団公式では**171cm・67kg**。大柄ではないが、中学時代から50m**5秒6**と紹介された瞬発力を持ち、低い重心から一気に加速する体格なのだ。\n- 投打・フォームの特徴：**右投左打**の外野手。打撃では一塁に近い左打席から俊足を生かし、守備では中堅を中心に広い範囲をカバーする。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでチャームポイントを「**笑顔**」と答えている。体格は細身で、塁に出ると投球前から小刻みに準備し、次の塁を狙う姿が一番の目印になる。\n- 背番号の由来・愛称・登場曲：背番号は入団以来**50**で、呼び名は「**イソ**」。登場曲はFLOW「ドリームエクスプレス」と川崎鷹也「幸せあれ」で、背番号50を選んだ具体的な由来は本人の説明を確認できなかった。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：埼玉県行田市出身。高校時代の記事では家族は父と姉と紹介されており、小学1年で地元の「行田東フェニックス」で野球を始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：行田東フェニックス、行田市立長野中・東京神宮リトルシニアを経て佐野日大高へ進み、その後は中央大法学部政治学科でプレーした。高校3年間は甲子園出場がなかったが、大学で外野手としてドラフト候補へ成長した。\n- 野球のエピソード：中学時代には侍ジャパンU-15にも選ばれ、当時から自分のアピールポイントを「走塁・守備」と答えていた。高校進学時には陸上強豪校からの誘いもあったが、甲子園とプロ野球を目指して野球を選んだ。\n- 野球以外のエピソード：中学3年の全国中学校陸上で**100m・200mの2冠**を達成した。100m決勝で後の世界的スプリンター、サニブラウンを上回ったことで「サニブラウンに勝った男」と呼ばれ続けたが、本人はそれを前向きな力に変えていた。\n- 印象的な試合：2020年3月、中央大がDeNA二軍と行ったプロアマ交流戦では初回に右中間三塁打を放ち、さらに**2盗塁**を記録した。複数球団のスカウトが見る前で、打球後の速さと盗塁の両方を見せた試合なのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：野球では2013年の**侍ジャパンU-15**に選出され、陸上では同年の全国中学校大会100m・200mで優勝。佐野日大高では甲子園出場はなかったが、中央大で東都大学野球を経験しプロ入りにつなげた。\n- ドラフト・入団（年・順位・球団・契約）：2020年ドラフトで日本ハムから**2位指名**。同年11月に契約金**7000万円、年俸1100万円**（いずれも推定）で仮契約し、「野球の五十幡として知ってもらえるようにしたい」と話して入団した。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年に1軍デビューして27試合・9盗塁、2022年は6試合、2023年は70試合・17盗塁、2024年は94試合・18盗塁と出場を増やした。2025年は自己最多の**118試合、25盗塁**、2026年も終盤の走塁・守備要員として1軍に定着している。\n- 野球のエピソード：2021年5月7日に1軍初出場、9日に初安打・初打点、23日の西武戦で初本塁打を記録した。打撃成績以上に、相手守備が急ぐことでミスを誘う走力と、中堅から左右へ追いつく守備範囲が出場機会を支えている。\n- 野球以外のエピソード：球団公式Q&Aでは休日に**ポケモンカード収集**をし、スニーカーも好きだと答えている。憧れの選手はイチローで、チーム内で仲が良い選手には細川凌平（「ホソ」）を挙げている。\n- 印象的な試合：2024年11月18日のプレミア12・ドミニカ共和国戦では、侍ジャパンの一員として左翼線へ**2点二塁打**を放った。俊足要員だけでなく、国際大会で打撃でも得点に絡んだ試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2024年の第3回WBSCプレミア12で侍ジャパントップチームに初選出され、2025年11月の日本―韓国強化試合でも代表入りした。9月27日時点のNPB通算は**414試合、85盗塁**である。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**99試合、124打席、113打数26安打、打率.230、3打点、13盗塁、7犠打、出塁率.256**なのだ。9月27日は出場していないため、27日終了時点でも数字は同じである。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は自己最多118試合で25盗塁を記録し、オフに推定年俸**4000万円**で契約更改。2026年は8月22日に出場選手登録を外れ、9月1日に再登録されており、再昇格後も先発と代走・守備固めを組み合わせて起用されている。\n- 野球のエピソード：今季は99試合に出ながら124打席で、前年の307打席から打席機会は大きく減っている。==それでも13盗塁を積み上げており、「一打席もない日の一走」で価値を出すシーズンなのだ。==\n- 野球以外のエピソード：2025年オフの契約更改では、年俸アップ分の使い道として札幌への引っ越し費用を挙げた。2年連続で1軍を完走したうえで生活拠点も北海道へ寄せ、よりチーム中心の生活にして2026年を迎えた。\n- 印象的な試合：2026年は代走中心のため、打撃の一試合だけでシーズンを代表させるより、終盤に走者として投入される場面の積み重ねが特徴である。先発した9月24日の楽天戦も2打数無安打だったが、中堅で試合に入り守備範囲を担った。\n- 実績（今季の記録・表彰）：9月26日時点で**13盗塁**を記録し、通算盗塁を85まで伸ばした。個人タイトルや月間表彰は確認できないが、100試合出場目前まで代走・守備を中心に起用されている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日の楽天戦は**9番・中堅で先発し2打数0安打、1三振**。9月26日のオリックス戦は野村佑希の打順に入り**中堅の守備**へ途中出場して打席なし（矢澤宏太が中堅から左翼へ移動）、9月27日のロッテ戦は出場しなかった。\n- エピソード：9月26日は打席がなくても、中堅守備を任されて2-0のリードを守る役割だった。添付の簡易カードでは「左翼」とされていたが、NPB公式記録では五十幡は**中堅**に入り、矢澤が左翼へ回っている。\n- 調子：直近の先発だった9月24日は無安打で、打撃だけなら上向きとは言いにくい。一方、代走・守備では一打席の結果に左右されにくいため、走塁でトップスピードまで滑らかに上がれているかが状態を見るポイントなのだ。\n- 分析・論点：今季の**99試合124打席**という数字は、スタメンより終盤起用が多いことを示す。==五十幡が一塁走者として出たら、ボールを見る前に「投手・捕手・内野手が走者をどれだけ気にしているか」を見ると俊足の価値が分かる。==\n- 今日の見どころ：1点差の終盤、日本ハムの鈍足の中軸打者が出塁した直後が出番の候補なのだ。盗塁そのものに加え、外野への単打で一気に三塁まで進めるか、守備に回ってZOZOマリンの風の中で広い中堅を守れるかにも注目したい。\n\n### 出典\n- https://npb.jp/bis/players/11315153.html\n- https://media.fighters.co.jp/player/50/\n- https://baseball.yahoo.co.jp/npb/player/2000080/\n- https://www.nikkansports.com/baseball/highschool/news/1750286.html\n- https://www.nikkansports.com/baseball/news/202011160000850.html\n- https://www.nikkansports.com/baseball/news/202512030000948.html\n- https://www.fighters.co.jp/news/detail/202500805430.html\n- https://www.fighters.co.jp/news/announce/entry/202608/\n- https://www.fighters.co.jp/news/announce/entry/202609/\n- https://www.chuo-u.ac.jp/activities/club/sports/news/2020/10/51544/\n- https://www.japan-baseball.jp/jp/profile/201302019.html\n- https://www.japan-baseball.jp/jp/team/topteam/score/20241118_1/\n- https://www.fighters.co.jp/news/detail/202400607294.html\n- https://npb.jp/scores/2026/0924/f-e-25/box.html\n- https://npb.jp/scores/2026/0926/b-f-25/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://ja.wikipedia.org/wiki/%E4%BA%94%E5%8D%81%E5%B9%A1%E4%BA%AE%E6%B1%B0\n- https://en.wikipedia.org/wiki/Ryota_Isobata", "detail": true}], "lineup": [["1", "西川史礁（左翼）", ".291・8", "水野達稀（遊撃・左）", ".285・11"], ["2", "山口航輝（指名）", ".275・32", "田宮裕涼（捕手・左）", ".266・7"], ["3", "藤原恭大（右翼・左）", ".264・8", "清宮幸太郎（指名・左）", ".242・23"], ["4", "佐藤都志也（捕手・左）", ".233・17", "野村佑希（一塁）", ".260・17"], ["5", "寺地隆成（三塁・左）", ".204・5", "万波中正（右翼）", ".255・21"], ["6", "小川龍成（二塁・左）", ".262・2", "有薗直輝（三塁）", ".240・1"], ["7", "髙部瑛斗（中堅・左）", ".225・0", "山縣秀（二塁）", ".222・0"], ["8", "井上広大（一塁）", ".171・7", "矢澤宏太（中堅・左）", ".221・3"], ["9", "山崎剛（遊撃・左）", ".226・1", "宮崎一樹（左翼）", ".077・1"], ["投", "ジャクソン（右）9勝8敗・防御率3.44", "", "福島蓮（右）5勝4敗・防御率3.35", ""]], "today": "# 今日の試合の基本情報（2026/9/28 時点。記事執筆の前提）\n\ const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[^"])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
function md(src){
  src = src.replace(/<!--[\s\S]*?-->/g,'');
  const out=[]; let list=null, para=[], table=null;
  const flush=()=>{ if(para.length){out.push('<p>'+inline(para.join(''))+'</p>');para=[]}
    if(list){out.push('<ul>'+list.map(i=>'<li>'+inline(i)+'</li>').join('')+'</ul>');list=null}
    if(table){out.push('<div class="scroll"><table>'+table.filter(r=>!/^\|\s*-/.test(r)).map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>i?'<td>'+inline(c.trim())+'</td>':'<th>'+inline(c.trim())+'</th>').join('')+'</tr>').join('')+'</table></div>');table=null} };
  for(const raw of src.split('\n')){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){flush();continue}
    if(l.startsWith('|')){ if(!table){flush();table=[]} table.push(l); continue }
    if((m=l.trim().match(/^!\[([^\]]*)\]\((https:\/\/[^\s)]+)(?:\s+"([^"]*)")?\)$/))){flush();out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy" onerror="this.closest('figure').hidden=true"><figcaption>${esc(m[1])}${m[3]?`<br><span>${esc(m[3])}</span>`:''}</figcaption></figure>`);continue}
    if((m=l.match(/^(#{1,4}) (.+)/))){flush();const n=Math.max(3,m[1].length);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue}
    if((m=l.match(/^\s*[-*] (.+)/))){ if(para.length||table)flush(); (list=list||[]).push(m[1]); continue }
    if(list){flush()} para.push(l.trim());
  }
  flush(); return out.join('');
}

const BOARD_QS = ['4-01','1-07','1-06','4-02','1-04','1-05','2-12','2-13','1-08','1-09','2-02','2-14','2-11','2-10','2-09','2-17','4-03','4-04','4-06','5-06'];
const clean = t => t.replace(/🔍/g,'').replace(/[（(]→[^）)]*[）)]/g,'').trim();
function qBtn(q){
  if(q.id==='5-07' && !has(q.id)) return `<a class="q" href="#/lineup">${esc(clean(q.title))}<small>スタメンと選手カード</small></a>`;
  return has(q.id) ? `<a class="q" href="#/q/${q.id}">${esc(clean(q.title))}</a>`
                   : `<a class="q off" href="#/q/${q.id}">${esc(clean(q.title))}<small>準備中・GPTに聞けます</small></a>`;
}

/* ---- ライブ（写真・タップで更新。この端末だけに保存） ---- */
function loadLive(){ try{ return JSON.parse(localStorage.getItem('live')||'{}') }catch(e){ return {} } }
function saveLive(v){ try{ localStorage.setItem('live', JSON.stringify(v)); return true }catch(e){ return false } }
const norm = x => String(x).replace(/[（(].*$/,'').replace(/\s/g,'').replace(/髙/g,'高').replace(/﨑/g,'崎');
function findP(cell){ const name = norm(cell); if(!name) return -1;
  return D.players.findIndex(p=>{ const n=norm(p.name); return n===name || n.endsWith(name) || (name.length>=2 && name.startsWith(n)) }) }
function pLink(cell, team){ const i = findP(cell);
  return i<0 ? esc(norm(cell))+(team?' '+gptBtn(newPlayer(norm(cell),team),'カード'):'') : `<a href="#/p/${i}">${esc(norm(cell))}</a>` }
const POS = {'左翼':'左','中堅':'中','右翼':'右','一塁':'一','二塁':'二','三塁':'三','遊撃':'遊','捕手':'捕','指名':'指','投手':'投'};
const posOf = cell => { const m=String(cell).match(/[（(]([^・）)]+)/); return m ? (POS[m[1]]||m[1]) : '' };

function lineScore(sc){
  sc = sc||{}; const n=Math.max(9,(sc.lotte||[]).length,(sc.fighters||[]).length), cols=[...Array(n)].map((_,i)=>i+1);
  const g=(o,k)=>o&&o[k]!=null?esc(o[k]):'';
  const row=(lab,arr,k)=>`<tr><td class="team">${lab}</td>${cols.map(i=>`<td>${arr&&arr[i-1]!=null?esc(arr[i-1]):''}</td>`).join('')}<td class="r sum">${g(sc.R,k)}</td><td>${g(sc.H,k)}</td><td>${g(sc.E,k)}</td></tr>`;
  return `<div class="ls"><table><tr><th></th>${cols.map(i=>`<th>${i}</th>`).join('')}<th class="sum">R</th><th>H</th><th>E</th></tr>`+
    row('日ハム',sc.fighters,'fighters')+row('ロッテ',sc.lotte,'lotte')+'</table></div>';
}
function board(){
  const v = loadLive(), sc = v.score||{}, st = {B:0,S:0,O:0,bases:[0,0,0],...(sc.count||{}),...(v.state||{})};
  if(sc.bases && !(v.state&&v.state.bases)) st.bases = sc.bases;
  const lamps = (k,n,cls)=>`<span>${k}</span><button data-k="${k}" aria-label="${k}を変更">${[...Array(n)].map((_,i)=>`<span class="lamp ${i<st[k]?cls:''}"></span>`).join('')}</button>`;
  const pre = !v.score;
  return `<div class="board">
    <div class="top"><span class="inning">${esc(sc.inning||'試合前')}</span><span class="status">${pre?'18:00 プレーボール（先攻 日本ハム／後攻 ロッテ）':esc(sc.memo||'')}</span><span class="upd">${sc.updated?esc(sc.updated)+' 更新':''}</span></div>
    ${lineScore(sc)}
    <div class="sit">
      <div class="lamps">${lamps('B',3,'b')}${lamps('S',2,'s')}${lamps('O',2,'o')}</div>
      <div class="bases">${[3,2,1].map(b=>`<button class="b${b} ${st.bases[b-1]?'on':''}" data-base="${b}" aria-label="${b}塁"></button>`).join('')}</div>
      <div class="who">${sc.pitcher?'投手 '+esc(sc.pitcher)+'　':''}${sc.batter?'打者 '+esc(sc.batter):''}
        <div class="hint">ランプと塁はタップで変えられます ・ <a href="#/live">写真からスコアとスタメンを更新</a></div></div>
    </div></div>`;
}
function bindBoard(){
  document.querySelectorAll('.lamps button').forEach(b=>b.onclick=()=>{ const v=loadLive(), k=b.dataset.k, max={B:3,S:2,O:2}[k];
    const cur = {B:0,S:0,O:0,bases:[0,0,0],...((v.score||{}).count||{}),...(v.state||{})}; cur[k]=(cur[k]+1)%(max+1); v.state=cur; saveLive(v); home() });
  document.querySelectorAll('.bases button').forEach(b=>b.onclick=()=>{ const v=loadLive(), i=+b.dataset.base-1;
    const cur = {B:0,S:0,O:0,bases:[0,0,0],...((v.score||{}).count||{}),...(v.state||{})}; cur.bases=[...cur.bases]; cur.bases[i]=cur.bases[i]?0:1; v.state=cur; saveLive(v); home() });
}
function lineupCols(){
  const L = loadLive().lineup, useLive = L && (L.lotte||L.fighters);
  const rows = D.lineup.filter(r=>r[0]!=='投'), pit = D.lineup.find(r=>r[0]==='投')||[];
  const col = (team, key, idx, pcell) => {
    let items;
    if(useLive && L[key]) items = L[key].map(x=>({n:x.order??'', pos:x.pos||'', name:x.name||''}));
    else items = rows.map(r=>({n:r[0], pos:posOf(r[idx]), name:r[idx]}));
    const p = useLive && L.pitchers && L.pitchers[key] ? L.pitchers[key] : pcell;
    return `<div class="team-col"><h4>${team}<small>${useLive?'発表':'予想'}</small></h4><ol>${items.map(x=>`<li><span class="n">${esc(x.n)}</span><span class="pos">${esc(x.pos)}</span><span>${pLink(x.name, useLive?team:'')}</span></li>`).join('')}
      <li class="p"><span class="n"></span><span class="pos">投</span><span>${p?pLink(p, useLive?team:''):''}</span></li></ol></div>`;
  };
  return `<div class="lineup">${col('日本ハム','fighters',3,pit[3])}${col('ロッテ','lotte',1,pit[1])}</div>`;
}

/* ---- ページ ---- */
function home(){
  PROMPTS.length = 0;
  let h = `<div class="guides">
    <a class="guide" href="#/g/basics"><b>野球初心者ガイド</b><span>ルールとしくみ</span></a>
    <a class="guide" href="#/g/game"><b>ロッテ対日本ハムを楽しむガイド</b><span>今日の見どころ</span></a></div>`;
  h += `<p class="eyebrow">速報</p>${board()}`;
  h += `<p class="section-title">スタメン</p>${lineupCols()}<p class="lead" style="margin-top:8px">名前を押すと選手カードが開きます。<a href="#/lineup">選手・監督カードの一覧</a></p>`;
  h += `<p class="section-title">この画面の見方がわからないとき</p><div class="qs">${BOARD_QS.filter(id=>allQ[id]).map(id=>qBtn(allQ[id])).join('')}</div>`;
  h += `<p class="section-title">球場のこと</p><div class="guides"><a class="guide wide" href="#/g/stadium"><b>マリーンズスタジアムガイド</b></a></div>`;
  $('#app').innerHTML = h; bindBoard();
}
function guide(key){
  const g = GUIDES[key]; if(!g) return home();
  let h = `<a class="back" href="#/">← トップ</a><h1>${esc(g.title)}</h1><p class="lead">${esc(g.desc)}</p>`;
  if(key==='game') h += `<div class="qs" style="margin-bottom:8px"><a class="q" href="#/lineup">スタメンと選手カード<small>両チームと監督</small></a><a class="q" href="#/today">今日の試合データ<small>順位・予告先発・記録</small></a></div>`;
  D.tree.filter(c=>g.cats.includes(c.no)).forEach(c=>{
    h += `<p class="section-title">${esc(c.title)}</p><div class="qs">${c.items.map(qBtn).join('')}</div>`;
  });
  $('#app').innerHTML = h;
}
function guideOf(q){ const no = q.cat&&q.cat.no; return Object.keys(GUIDES).find(k=>GUIDES[k].cats.includes(no)) }
function article(id){
  const q = allQ[id]||{title:id}, a = D.articles[id], title = clean(a&&a.meta.title||q.title);
  const back = q.parent ? `#/q/${q.parent}` : (guideOf(q) ? `#/g/${guideOf(q)}` : '#/');
  const backLabel = q.parent ? clean(allQ[q.parent].title) : (guideOf(q) ? GUIDES[guideOf(q)].title : 'トップ');
  let h = `<a class="back" href="${back}">← ${esc(backLabel)}</a><p class="eyebrow">${esc(q.cat?q.cat.title:'')}</p><h1>${esc(title)}</h1>`;
  if(!a){ h += `<div class="note">この記事はまだ準備中です。下のボタンを押すと、この疑問と、関係する記事・今日の試合データをまとめた質問文がコピーされます。ChatGPT に貼ると、ガイドと同じ形で答えてもらえます。</div>${gptBtn(askQ(q),'この疑問をGPTに聞く（プロンプトをコピー）')}` }
  else{
    if(a.meta.needs_check) h += '<div class="note">この記事には、まだ公式情報で確認できていない内容が含まれます。</div>';
    h += '<div class="article">';
    a.body.split(/^(?=## )/m).forEach(sec=>{ const m=sec.match(/^## (.+)\n?([\s\S]*)$/);
      h += m ? `<div class="sec-head"><h2>${inline(m[1])}</h2>${gptBtn(deepSec(id, m[1], m[2]),'ここを詳しく聞く')}</div>${md(m[2])}` : md(sec) });
    h += '</div>';
    const src = a.meta.sources||[]; if(src.length) h += `<hr><p class="eyebrow">出典</p><div class="src">${src.map(inline).join('<br>')}</div>`;
  }
  const kids = (q.children||[]).map(c=>allQ[c.id]);
  if(kids.length) h += `<p class="section-title">さらに気になる？</p><div class="qs">${kids.map(qBtn).join('')}</div>`;
  const rel = ((a&&a.meta.related)||[]).filter(r=>allQ[r]);
  if(rel.length) h += `<p class="section-title">関連する疑問</p><div class="qs">${rel.map(r=>qBtn(allQ[r])).join('')}</div>`;
  if(id.startsWith('5-07')||id.startsWith('4-02')) h += '<p style="margin-top:20px"><a href="#/lineup">スタメンと選手カードを見る</a></p>';
  $('#app').innerHTML = h;
}
function lineup(){
  let h = `<a class="back" href="#/">← トップ</a><h1>スタメンと選手カード</h1><p class="lead">予想スタメンは試合前の発表で変わります。発表後は<a href="#/live">写真から更新</a>できます。</p>${lineupCols()}`;
  let last='';
  D.players.forEach((p,i)=>{ const g=p.team+'｜'+p.section; if(g!==last){h+=(last?'</div>':'')+`<p class="section-title">${esc(g)}</p><div class="qs">`;last=g}
    h+=`<a class="q" href="#/p/${i}">${esc(p.name)}<small>${esc(p.title.replace(p.name,'').replace(/^[（(]|[）)]$/g,''))}</small></a>` });
  if(last) h += '</div>';
  $('#app').innerHTML = h;
}
function player(i){
  const p = D.players[i]; if(!p) return lineup();
  let h = `<a class="back" href="#/lineup">← スタメンと選手カード</a><p class="eyebrow">${esc(p.team)}｜${esc(p.section)}</p><h1>${esc(p.title)}</h1><p>${gptBtn(deepPlayer(p),'この選手をGPTで深掘り')}</p><div class="article">`;
  p.body.split(/^(?=### )/m).forEach(sec=>{ const m=sec.match(/^### (.+)\n?([\s\S]*)$/);
    h += m ? `<div class="sec-head"><h2>${inline(m[1])}</h2>${gptBtn(deepPlayerSec(p, m[1], m[2]),'ここを詳しく聞く')}</div>${md(m[2])}` : md(sec) });
  $('#app').innerHTML = h + '</div>';
}
const PHOTO_PROMPT = `${CTX}\n\n添付した写真（球場のビジョンのスタメン表、またはスコアボード）を読み取って、観戦ガイドに貼り付けるデータを作ってください。\n\n# 出力のしかた（厳守）\n- 次の形のJSONだけを、1つのコードブロックで出してください。説明はコードブロックの外に短く\n- 写っていない項目は省略してください（推測で埋めない）。読み取れない文字は「?」にしてください\n- 選手名はフルネームの漢字（外国人選手はカタカナ）。守備位置は「投 捕 一 二 三 遊 左 中 右 指」の1文字\n- fighters＝日本ハム（先攻）、lotte＝ロッテ（後攻）。取り違えないこと\n\n## スタメン表の写真のとき\n{"lineup": {"lotte": [{"order": 1, "pos": "左", "name": "西川史礁"}], "fighters": [{"order": 1, "pos": "遊", "name": "水野達稀"}], "pitchers": {"lotte": "ジャクソン", "fighters": "福島蓮"}}}\n（片方のチームしか写っていなければ、そのチームだけ）\n\n## スコアボードの写真のとき\n{"score": {"inning": "5回裏", "fighters": [0, 0, 1, 0, 0], "lotte": [0, 2, 0, 0], "R": {"fighters": 1, "lotte": 2}, "H": {"fighters": 4, "lotte": 6}, "E": {"fighters": 0, "lotte": 1}, "count": {"B": 1, "S": 2, "O": 1}, "bases": [1, 0, 0], "pitcher": "福島蓮", "batter": "山口航輝", "memo": "球速など、ボードに出ている情報を短く"}}\n（まだ攻撃していない回は配列に入れない。bases は1塁・2塁・3塁の順に、ランナーがいれば1）\n\n最後に、コードブロックの外で「この状況で初心者が見るポイント」を2〜3行で書いてください。`;
const SCORE_ASK = sc => `${CTX}\n\n今の試合状況は次のとおりです（fighters＝日本ハム・先攻、lotte＝ロッテ・後攻）。\n${JSON.stringify(sc)}\n\nこの状況を初心者向けに解説してください。どちらが有利か、次の見どころ、日本ハムの2位争い（西武との差）への影響を、ウェブ検索で今日の西武戦の途中経過も確認したうえで教えてください。${RULES}${TODAY()}`;
function live(){
  const v = loadLive();
  let h = `<a class="back" href="#/">← トップ</a><h1>写真から更新</h1><p class="lead">写真を ChatGPT に読んでもらい、返ってきた内容をここに貼ると、トップのスコアとスタメンが変わります。</p>
  <ol><li>ビジョンのスタメン表やスコアボードを写真に撮る</li><li>下のボタンでプロンプトをコピーし、ChatGPT に<b>写真と一緒に</b>送る</li><li>返ってきたコードブロックの中身（{ から } まで）をコピーして、下の欄に貼って「反映」</li></ol>
  <p>${gptBtn(PHOTO_PROMPT,'写真読み取りプロンプトをコピー')}</p>
  <textarea id="livein" placeholder='{"lineup": …} または {"score": …} を貼る'></textarea>
  <div><button class="btn" id="apply">反映</button><button class="btn sub" id="clear">全部消す</button></div><p id="msg" class="lead"></p>
  <div id="confirm" hidden class="note">写真から更新したスタメンとスコアを消します。<br><button class="btn" id="yes">消す</button><button class="btn sub" id="no">やめる</button></div>`;
  if(v.score) h += `<p class="section-title">いまの状況を解説してもらう</p><p>${gptBtn(SCORE_ASK(v.score),'この状況をGPTに解説してもらう')}</p>`;
  h += '<p class="lead">データはこの端末のこのブラウザにだけ保存されます。</p>';
  $('#app').innerHTML = h;
  $('#apply').onclick = ()=>{
    const t = $('#livein').value; let obj;
    try{ obj = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}')+1)) }catch(e){ $('#msg').textContent='JSON として読めませんでした。コードブロックの中身だけを貼ってください。'; return }
    if(!obj.lineup && !obj.score){ $('#msg').textContent='"lineup" か "score" が見つかりませんでした。'; return }
    const now = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); const cur = loadLive();
    if(obj.lineup){ cur.lineup = {...(cur.lineup||{}), ...obj.lineup, updated: now} }
    if(obj.score){ cur.score = {...obj.score, updated: now}; delete cur.state }
    $('#msg').textContent = saveLive(cur) ? '反映しました。トップに戻ると確認できます。' : '保存できませんでした（プライベートブラウズでは保存できないことがあります）。';
  };
  $('#clear').onclick = ()=>{ $('#confirm').hidden=false };
  $('#no').onclick = ()=>{ $('#confirm').hidden=true };
  $('#yes').onclick = ()=>{ saveLive({}); live() };
}
function route(){
  PROMPTS.length = 0;
  const h = location.hash.slice(2).split('/');
  if(h[0]==='q') article(h[1]); else if(h[0]==='g') guide(h[1]); else if(h[0]==='lineup') lineup(); else if(h[0]==='p') player(+h[1]); else if(h[0]==='live') live();
  else if(h[0]==='today') $('#app').innerHTML='<a class="back" href="#/g/game">← ロッテ対日本ハムを楽しむガイド</a><h1>今日の試合データ</h1><div class="article">'+md(D.today.replace(/^# .+\n/,''))+'</div>';
  else home();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
</script>
