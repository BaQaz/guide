 {"id": "4-06-a", "title": "今日かかっている記録は？（清宮の通算100号など）", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-06", "4-01"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/history/2026/milestones_p.html", "https://npb.jp/bis/history/ltp_sv.html"]}, "body": "## ひとことで\n==今日いちばん分かりやすい節目は、**清宮幸太郎**の**通算100本塁打まであと1本**だ。==ほかにも山口航輝の33号、西川遥輝の350盗塁へのカウントがある。\n\n\n![打者がバットを振り抜く場面](https://upload.wikimedia.org/wikipedia/commons/8/86/James_Loney_swinging_the_bat.jpg \"出典：Wikimedia Commons／Keith Allison／CC BY-SA 2.0\")\n\n## しくみ\n==今日の試合データにある「記録・話題」は次の4つだ。==\n\n- **清宮幸太郎**は**通算100本塁打まであと1本**。初本塁打はルーキーだった2018年5月9日\n- **山口航輝**は**今季32本塁打**でパ・リーグ2位タイ。33号なら単独2位\n- **西川遥輝**は**通算350盗塁**（盗塁：投球のすきに次の塁へ走って進むこと）まであと5\n- **益田直也**は今季、**通算250セーブ**（セーブ：試合の最後を締めた投手につく記録）と通算800試合登板をすでに達成\n\n==**山口**は**9月15日に30号**へ到達し、球団の日本人選手では**落合博満**以来**40年ぶりの30本塁打**となった。==この情報も今日の試合データにある話題の一つだ。\n\n## 今日の試合で見るなら\n==清宮が打席に入ったら、まず「次の一発が100号」と覚えておけばよい。==山口は一発が出れば本塁打順位が動く。\n\n西川遥輝が出場したら盗塁数、益田が登板したら今季達成済みの250セーブと800試合登板を思い出すとよい。==同じ1プレーでも、積み重ねの数字があると見え方が変わるのだ。=="}, "4-06-b": {"meta": {"id": "4-06-b", "title": "名球会って？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-06", "4-06-c"], "sources": ["https://meikyukai.jp/regulation/", "https://meikyukai.jp/news/info20260805/", "https://www.marines.co.jp/news/detail/202600934469.html"]}, "body": "## ひとことで\n\n**名球会（日本プロ野球名球会）**は、長い現役生活で大きな通算記録を残した選手・元選手の会だ。基本の目安は、==**200勝、250セーブ、2000安打**==のどれかを達成することなのだ。\n\n## しくみ\n\n投手は**通算200勝**または**通算250セーブ**、打者は**通算2000安打**が基本条件だ。日本での記録を起点に、メジャーリーグの成績を合算できる場合もある。さらに、基準に相当する選手を対象にした特例入会制度もある。\n\nつまり、1年だけの好成績では届かない。==何年も積み重ねた「通算」の重みを見るための目印==なのだ。\n\n## 今日の試合で見るなら\n\nロッテの**益田直也**は、2026年8月4日にNPB史上5人目の通算250セーブを達成し、名球会入りした。9月23日にはZOZOマリンでブレザー授与式も行われた。==今日もし益田が登板したら、「250セーブまで積み重ねた投手」という背景まで含めて見る==と、マウンドの意味が少し変わるのだ。"}, "4-06-c": {"meta": {"id": "4-06-c", "title": "通算記録と今季記録の違いは？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-06", "4-06-b"], "sources": ["https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\n**通算記録**はプロ入り後の成績を年をまたいで足したもの、**今季記録**は2026年シーズンだけの成績だ。==同じ「本塁打○本」でも、数えている期間が違う==のだ。\n\n## しくみ\n\n今季記録は、シーズンが変わればまた0から数え直す。通算記録は前年までの数字に今年の分を足し続ける。だから若い選手が今季だけ大きな数字を出していても、長く積み上げたベテランの通算記録とは意味が違う。\n\n見るときは、==「今年の調子を知りたいのか」「これまでのキャリアを知りたいのか」==を先に決めると迷わない。\n\n## 今日の試合で見るなら\n\n日本ハムの**清宮幸太郎**は、今日の話題が**通算100本塁打まであと1本**だ。一方、ロッテの**山口航輝**は**今季32本塁打**でパ・リーグ2位タイ。==清宮は「積み重ねの節目」、山口は「2026年の争い」==を見ている、と分ければいいのだ。"}, "4-06": {"meta": {"id": "4-06", "title": "節目の記録って？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["4-06-a"], "related": ["4-01", "4-03", "4-04"], "sources": ["https://npb.jp/history/2026/milestones_b.html", "https://npb.jp/history/2026/milestones_p.html", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/history/ltp_sv.html", "https://baseballhall.org/discover/inside-pitch/jeter-gets-3000th-hit-in-dramatic-fashion", "https://www.cbsnews.com/news/fan-gives-back-jeters-3000k-baseball/"], "episode": "v2"}, "body": "## ひとことで\n==**「節目の記録」**は、**通算100本塁打**や**800試合登板**のように、長い積み重ねが分かりやすい数字に届くことだ。==1球や1打席が、その選手の何年分もの記録につながる瞬間なのだ。\n\n\n![打者がバットを振り抜く場面](https://upload.wikimedia.org/wikipedia/commons/8/86/James_Loney_swinging_the_bat.jpg \"出典：Wikimedia Commons／Keith Allison／CC BY-SA 2.0\")\n\n## しくみ\n==まず**「通算」**と**「シーズン」**を分けると読みやすい。==通算はプロ生活を通して積み上げた合計、シーズンは今年だけの数字だ。\n\n==たとえば**清宮幸太郎**の「通算100本塁打まであと1本」は、過去のシーズンも全部足した本塁打数の話だ。==一方、**山口航輝**の**「今季32本塁打」**は2026年だけの本数で、現在パ・リーグ2位タイという話になる。\n\n投手にも節目がある。**セーブ（試合の最後を締めた投手につく記録）**や登板試合数のように、役割を長く続けないと増えにくい数字もあるのだ。\n\n## おもしろエピソード\n2011年、ヤンキースのデレク・ジーター（米大リーグを代表する遊撃手）は、本拠地で通算3000安打目をホームランにした。スタンドでその記念球をつかんだ23歳のクリスチャン・ロペスは、高値で売れる可能性があったのに、ジーターへ返すことを選んだ。\n\n球団はお礼に、その年の残りの本拠地戦の席や記念品を贈った。節目の一打は、打った本人だけでなく、ボールを拾った観客の物語にもなったのだ。\n\n## 今日の試合で見るなら\nいちばん分かりやすいのは清宮だ。次の1本塁打が通算100号になる。\n\nロッテでは山口が32本塁打でリーグ2位タイ。33号なら単独2位だ。日本ハムの西川遥輝は通算350盗塁（盗塁：投球のすきに次の塁へ走って進むこと）まであと5。こうした「あと○○」を覚えておくと、普通の打席や出塁にも別の意味が見えてくるのだ。"}, "4-07-a": {"meta": {"id": "4-07-a", "title": "背番号の意味は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-02", "4-07"], "sources": ["https://npb.jp/bis/teams/rst_m.html", "https://npb.jp/bis/teams/rst_f.html"]}, "body": "## ひとことで\n**背番号**は、ユニホームの背中などに付く選手の番号だ。==基本は「その選手を見分けるための名前札」と考えればいい。==\n\n## しくみ\n背番号だけを見ても、打順や守備位置は分からない。小さい番号ほど主力、大きい番号ほど控え、と決まっているわけでもないのだ。\n\n同じ選手でも移籍や球団事情で番号が変わることがあるので、==番号そのものを成績のように読む必要はない。== 観戦では、遠くにいる選手を見分ける道具として使うのがいちばん実用的だ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は51番、先発の**ジャクソン**は42番、日本ハムの**清宮幸太郎**は21番だ。名前を聞き逃しても、==背中の数字を見れば「いま誰を見ているか」を取り戻せるのだ。==\n\nたとえば51番が打席に入ったら山口だ。32本塁打の長打力に注目する、と選手カードの情報につなげればいい。"}, "4-07-b": {"meta": {"id": "4-07-b", "title": "打率・本塁打・打点の3つはどう読む？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-03", "4-07"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n打者の数字は、**打率＝ヒットの割合**、**本塁打＝ホームラン数**、**打点＝打撃で生んだ得点**と読む。==「当てる・飛ばす・返す」の3方向から打者を見る数字なのだ。==\n\n## しくみ\n打率は「安打数÷打数」だ。.278なら、打数に対して約27.8％がヒットだったという意味になる。本塁打と打点は割合ではなく、シーズン中に積み上げる個数だ。\n\n==本塁打が多い選手と、打率が高い選手は同じとは限らない。== だから3つを並べると、その選手が「確実に打つ型」か「長打で点を動かす型」かをつかみやすいのだ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は9月27日終了時点で**打率.278・32本塁打・72打点**だ。==まず32本という大きな長打の数字に目を向ければ、山口の特徴を一瞬でつかめる。==\n\nビジョンで数字が3つ並んでも、全部暗記する必要はない。山口なら「32本塁打」、そこから打率と打点を見る順で十分なのだ。"}, "4-07-c": {"meta": {"id": "4-07-c", "title": "投手の勝敗・防御率はどう読む？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-04", "4-07"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\n投手の**勝敗**はその投手に記録された勝ちと負け、**防御率**は9回あたり何点の自責点（投手の責任とされる失点）を許したかを表す数字だ。==防御率は基本的に小さいほど、点を取られにくかったと読めばいい。==\n\n## しくみ\n「9勝8敗」なら、今季その投手に9勝と8敗が記録されているという意味だ。ただし、チームが勝った試合すべてが先発投手の勝ちになるわけではない。\n\n防御率は「自責点×9÷投球回」で計算する。==3.44なら、9回を投げると平均3.44の自責点という見方なのだ。== 勝敗より、投球内容そのものを比べたいときに役立つ。\n\n## 今日の試合で見るなら\nロッテ先発の**ジャクソン**は9勝8敗・防御率3.44、日本ハム先発の**福島蓮**は5勝4敗・防御率3.35だ。数字だけなら防御率はかなり近い。\n\nジャクソンは今日、勝利投手になれば10勝目になる。==ビジョンでは「勝敗」と「防御率」を別の物差しとして見ると、先発投手の紹介が読みやすくなるのだ。=="}, "4-07": {"meta": {"id": "4-07", "title": "ビジョンの選手紹介の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "episode": "v2", "styled": true, "children": ["4-07-a", "4-07-b", "4-07-c"], "related": ["4-01", "4-02", "4-03", "4-04"], "sources": ["https://npb.jp/bis/teams/rst_m.html", "https://npb.jp/bis/teams/rst_f.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/scoring/calculation.html", "https://www.mlb.com/cut4/yasmani-grandal-s-home-run-hit-his-face-on-the-scoreboard-c196463406"]}, "body": "## ひとことで\nビジョンの選手紹介は、その選手の「短いプロフィールカード」だ。表示される項目は場面で変わるが、==まず**名前と背番号**、次に**今季成績**を見るだけで十分なのだ。==\n\n## しくみ\n打者なら、よく見る数字は**打率**、**本塁打**、**打点**だ。打率は「どれくらいヒットを打っているか」、本塁打は今季のホームラン数、打点は打撃でどれだけ得点を生んだかを見る数字だ。==3つを全部覚える必要はなく、「当てる・飛ばす・返す」の順に読むと分かりやすい。==\n\n投手なら、**勝敗**と**防御率**が入口になる。勝敗はその投手に記録された勝ちと負け、防御率は9回を投げたとき自責点（守備のミスなどを除き、投手の責任とされる失点）が平均いくつになるかを示す。==防御率は基本的に数字が小さいほど、点を取られにくかったという意味だ。==\n\n背番号は選手を見分ける番号で、打順や守備位置そのものを表す番号ではない。たとえばロッテの**山口航輝**は51番、先発の**ジャクソン**は42番だ。番号の大小から「強い・若い・4番打者」といった意味を読み取る必要はないのだ。\n\n## おもしろエピソード\n2016年、米大リーグのドジャースで捕手をしていた**ヤスマニ・グランダル**が、フィラデルフィアでホームランを打った。打球が飛び込んだ先は、ちょうど==大型ビジョンに自分の顔が映っていた場所==だった。\n\nつまり、打席の選手紹介に出ていた「自分の顔」を、自分のホームランで直撃したのだ。ビジョンは数字を見るだけでなく、時には打球の行き先まで含めて試合の一部になる。\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**が出てきたら、本塁打の欄に注目するといい。9月27日終了時点で23本塁打、そして通算100本塁打まであと1本だ。今季の数字と通算記録は別物なので、そこを分けて見ると混乱しにくい。\n\n先発投手では、ロッテのジャクソンが**9勝8敗・防御率3.44**、日本ハムの**福島蓮**が**5勝4敗・防御率3.35**だ。==試合前の紹介でこの4つの数字を拾えれば、「今日はどんな投手同士なのか」がかなり見えてくるのだ。=="}, "4-08-a": {"meta": {"id": "4-08-a", "title": "150キロってどれくらい速い？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-08"], "sources": ["https://npb.jp/news/detail/20191220_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**150km/h**は秒速約41.7mだ。==投手板から本塁まで18.44mを、単純計算なら約0.44秒で進む速さ==なのだ。\n\n## しくみ\n0.44秒は、まばたきをしている間に近い短さだ。しかも打者は、ボールが来てから全部を考えるのではなく、投手の腕の振りや球の出方を見ながら先に判断し始める。\n\n実際の投球では、投手は投手板より前で球を離し、球速も途中で少し落ちる。だから==0.44秒は「距離÷速さ」で出した目安==と考えるとよい。\n\n## 今日の試合で見るなら\n**ジャクソン**や**福島蓮**の球速表示が150前後になったら、次は打者の反応を見るのだ。==差し込まれたファウルや空振りが増えるか==を見ると、「速い」が結果にどう効いたか分かりやすい。"}, "4-08-b": {"meta": {"id": "4-08-b", "title": "変化球は何キロくらい？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-08"], "sources": ["https://npb.jp/news/detail/20201125_03.html", "https://npb.jp/nippons/2017/dailyreport_1101.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**変化球**には「この球種なら何キロ」と決まった速さはない。==100km/h台から140km/h台まで、投手や球種によってかなり幅がある==のだ。\n\n## しくみ\nNPB公式の記事には、150km/h超の直球に**140km/h台の高速フォーク**と110km/h台のカーブを混ぜた例がある。別の日本シリーズでは、140km/h台の直球に120km/h台のチェンジアップを組み合わせた投手も紹介されている。\n\nつまり大事なのは絶対値より**球速差**だ。==150の後に120が来れば約30km/h差==なので、同じ腕の振りに見えるほど打者は合わせにくくなる。\n\n## 今日の試合で見るなら\n**ジャクソン**はチェンジアップ、**福島蓮**はフォークが持ち味として挙げられている。==直球の次に表示が何キロ下がるか==を見れば、緩急（速い球と遅い球の組み合わせ）が見えやすいのだ。"}, "4-08": {"meta": {"id": "4-08", "title": "球速表示の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "episode": "v2", "styled": true, "children": ["4-08-a", "4-08-b"], "related": ["4-01-b", "4-07-c"], "sources": ["https://npb.jp/news/detail/20191220_02.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/news/aroldis-chapman-throws-a-pitch-105-1-mph-c190404910"]}, "body": "## ひとことで\n**球速表示**は、投手が投げたボールの速さを「km/h」で示す数字だ。==数字が大きいほど速いが、速さだけで打ちにくさが決まるわけではない==のだ。\n\n## しくみ\nたとえば「150 km/h」は、1時間に150km進む速さという意味だ。秒速に直すと約41.7mで、投手板から本塁までの**18.44m**を同じ速さで進むと、単純計算では約0.44秒になる。\n\n実際は投手が投手板より前でボールを離し、球も飛んでいる間に少し減速する。だから0.44秒は厳密な到達時間ではなく、==「考える時間が半秒もない」ほど速い==と感じるための目安なのだ。\n\nただし、打者が困るのは速い直球だけではない。遅い球を見せた後に速い球を投げると、同じ150km/hでもさらに速く感じやすい。**緩急（速い球と遅い球を組み合わせること）**まで見ると、球速表示が急に面白くなる。\n\n## おもしろエピソード\n2016年、ヤンキースの**アロルディス・チャップマン（剛速球で知られる救援投手）**が、オリオールズ戦で時速**105.1マイル（約169km/h）**を計測した。大歓声が起きたので、本人は投げたあとに振り返って球速表示を確認したという。\n\n捕手のブライアン・マッキャンは、104〜105マイルになると球がぼやけて見えるほどだと説明した。==球速表示は観客だけでなく、投げた本人や捕手まで気にしている数字==なのだ。\n## 今日の試合で見るなら\n今日の予告先発はロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**だ。ビジョンに球速が出たら、1球だけでなく前後の数字を続けて見てほしい。\n\n==速い球の直後に遅い球が来たとき、打者のタイミングが合うか==が見どころだ。空振りや打ち損じが起きたら、球速差が効いた可能性も考えられるというわけだ。"}, "4-09-a": {"meta": {"id": "4-09-a", "title": "ゲーム差ってどう計算する？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-09"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\n**ゲーム差**は、2チームの勝ち数と負け数の差から出す。==「勝ち数の差＋負け数の差」を2で割る==と考えると分かりやすいのだ。\n\n## しくみ\n9月27日終了時点では、西武が**76勝59敗**、日本ハムが**76勝62敗**だ。勝ち数の差は0、負け数の差は3なので、（0＋3）÷2＝**1.5ゲーム差**になる。\n\n片方が勝って、もう片方が同じ日に負けると差は1.0動く。片方だけが試合をして勝敗がつくと0.5動く。だから==0.5刻みの表示が出る==のだ。\n\n## 今日の試合で見るなら\n**日本ハム**は今日ロッテ戦を戦う。==試合後に順位表の「差」がどう変わったか==を見れば、1勝の重さを数字で確認できるのだ。"}, "4-09-b": {"meta": {"id": "4-09-b", "title": "マジックナンバーって？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-09"], "sources": ["https://npb.jp/news/detail/20260917_04.html", "https://www.nikkansports.com/m/baseball/news/amp/202609130000253.html"]}, "body": "## ひとことで\n**マジックナンバー**は、==ほかのチームの結果に関係なく、あと何勝すれば優勝を決められるか==を表す目安だ。相手が負けても減ることがあるのだ。\n\n## しくみ\n「M2」なら、優勝へ必要な数字があと2という意味だ。自分のチームが勝つだけでなく、追うチームの敗戦でも条件が進む。\n\n2026年のパ・リーグでは、ソフトバンクが9月17日に**マジック2**だった。その日にソフトバンクが勝ち、2位西武が敗れたため、リーグ優勝が決まった。\n\n==ゲーム差とマジックは別の数字==だ。ゲーム差は現在地、マジックは優勝決定までの条件を見る数字と考えるとよい。\n\n## 今日の試合で見るなら\n今日はすでにソフトバンクのリーグ優勝が決まっている。**日本ハム**が争っているのは2位なので、==今日は優勝マジックより西武とのゲーム差を見る場面==なのだ。"}, "4-09": {"meta": {"id": "4-09", "title": "順位表とゲーム差の見方は？", "category": "4", "level": "1", "priority": "star", "needs_check": false, "episode": "v2", "styled": true, "children": ["4-09-a", "4-09-b"], "related": ["4-05", "4-06"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/info_cs.html", "https://www.seibulions.jp/expansion/history/lions_classic/38.html", "https://column.sp.baseball.findfriends.jp/?id=097-20180827-01&pid=column_detail", "https://ja.wikipedia.org/wiki/1963%E5%B9%B4%E3%81%AE%E8%A5%BF%E9%89%84%E3%83%A9%E3%82%A4%E3%82%AA%E3%83%B3%E3%82%BA"]}, "body": "## ひとことで\n**順位表**は、各チームの勝敗と勝率を並べた表だ。**ゲーム差**は上のチームとどれくらい離れているかを見る目安で、==「1.5ゲーム差」なら1試合半ぶんの差==と読むのだ。\n\n## しくみ\nまず見るのは「勝・敗・分」と**勝率**だ。NPBの勝率は「勝ち÷（勝ち＋負け）」で計算し、引き分けは分母に入れない。\n\n9月27日終了時点のパ・リーグは、2位西武が**76勝59敗4分**、3位日本ハムが**76勝62敗3分**だ。勝ち数は同じでも、日本ハムのほうが負けが3つ多いので、西武が上になる。\n\nこの2チームの差は1.5ゲームだ。計算では「勝ち数の差」と「負け数の差」を足して半分にする。今回は勝ち数の差が0、負け数の差が3なので、==（0＋3）÷2＝1.5==というわけだ。\n\nただし、ゲーム差だけで順位が決まるわけではない。最終順位は勝率などリーグの規定で決まり、残り試合数が違えばゲーム差だけでは状況を読み切れないのだ。\n\n## おもしろエピソード\n1963年のパ・リーグでは、**西鉄ライオンズ（今の埼玉西武ライオンズにつながる球団）**が首位の南海ホークスに最大14.5ゲーム差をつけられた。それでも終盤に猛烈に追い上げ、最後は逆転してリーグ優勝した。\n\n監督兼選手だった**中西太（豪快な打撃で知られた強打者）**は体格が大きく、優勝が決まりそうになると選手たちは「胴上げで落とさないか」と心配したという。==ゲーム差が大きくても、残り試合が多ければ順位は本当にひっくり返る==のだ。\n## 今日の試合で見るなら\n今日は3位の**日本ハム**が5位のロッテと戦う。日本ハムは2位西武を1.5ゲーム差で追っており、残りは2試合だ。\n\n==日本ハムにとって今日の1勝は、CSファーストステージを本拠地で戦える2位へ近づくために必要な勝利==なのだ。ロッテ戦を見ながら、同時に西武の結果も確認すると順位表の数字が動く意味が分かりやすい。"}, "4-10-a": {"meta": {"id": "4-10-a", "title": "記号の読み方は？", "category": "4", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["4-10"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/"]}, "body": "## ひとことで\nNPB式のスコアは、**数字＝守った場所、英字＝プレーの種類**と考えると読みやすい。==まず「4-3」「F-9」「SO」の3つだけ覚えれば十分==なのだ。\n\n## しくみ\n**4-3**は二塁手が取り、一塁手へ送ってアウト。**F-9**は右翼手へのフライでアウトだ。数字は1投手、2捕手、3一塁、4二塁、5三塁、6遊撃、7左翼、8中堅、9右翼を表す。\n\nNPB式では普通の三振は**SO**と書く。**K**は第3ストライクを捕手が捕れず、打者が走者になれる状態の三振に使うので、==「K＝全部の三振」とは限らない==点に注意なのだ。\n\n## 今日の試合で見るなら\nたとえば**福島蓮**が**山口航輝**を普通の三振に取れば「SO」。右翼フライなら「F-9」だ。==打球がどこへ飛び、誰が処理したかを数字に置き換える==と、スコアが暗号ではなくなるのだ。"}, "4-10": {"meta": {"id": "4-10", "title": "スコアブックって？", "category": "4", "level": "1", "priority": "normal", "needs_check": false, "episode": "v2", "styled": true, "children": ["4-10-a"], "related": ["4-01", "4-02"], "sources": ["https://npb.jp/scoring/", "https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/glossary/idioms/k", "https://sabr.org/journal/article/henry-chadwick-the-father-of-baseball-was-a-sportswriter/", "https://baseballhall.org/discover-more/stories/baseball-history/henry-chadwick"]}, "body": "## ひとことで\n**スコアブック**は、試合で起きたことを打者ごとのマスに記録するノートだ。==「誰が、どう出塁し、どうアウトになり、どう得点したか」を後からたどれる==ようにするものなのだ。\n\n## しくみ\n野球は1球ごとの出来事が多いので、文章で全部を書くと長くなる。そこで、守備位置を**1〜9の数字**、プレーを短い記号で表す。\n\nNPB式では、1が投手、2が捕手、3が一塁手、4が二塁手、5が三塁手、6が遊撃手、7が左翼手、8が中堅手、9が右翼手だ。たとえば二塁手がゴロを取り、一塁手へ送ってアウトなら**4-3**と書く。\n\n1人の打者のマスには、その打席の結果だけでなく、走者になった後に二塁、三塁、本塁へどう進んだかも重ねて書ける。==1枚の表が「試合の履歴」になる==というわけだ。\n\nなお、スコアの付け方には複数の流儀がある。NPB公式記録員は慶応式を使い、一般には早稲田式も広く使われている。==記号が少し違っても、プレーを短く残す目的は同じ==なのだ。\n\n## おもしろエピソード\nスコアブックで三振を表す**「K」**を広めたのは、19世紀の米国で野球記事を書いた**ヘンリー・チャドウィック**だ。彼は試合を短い記号で記録する方法を整え、三振には「struck」の最後の音を目立たせるKを使った。\n\n150年以上たった今も、球場の三振表示やスコアブックにKが残っている。==観戦中に見る一文字が、野球を紙に残そうとした昔の記者の工夫から続いている==のだ。\n## 今日の試合で見るなら\nたとえばロッテの**西川史礁**が二塁ゴロでアウトになれば「4-3」と書ける。**山口航輝**が普通の三振なら、NPB式では「SO」と記す。\n\n==最初から全部つける必要はない==。今日は「4-3」「F-9」「SO」の3つだけ探してみると、試合を見る目が少し細かくなるのだ。"}, "5-01-a": {"meta": {"id": "5-01-a", "title": "日本ハムは何を懸けてる？（西武との**2位争い**）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-01", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n==日本ハムにとっては、西武との2位争いを続けるために勝ちたい試合だ。==9月27日終了時点で西武が2位、日本ハムが3位、その差は**1.5ゲーム**（ゲーム差：勝ち数と負け数の開きを試合数で表したもの）になっている。\n\n\n![投手の投球動作を連続写真で示した画像](https://upload.wikimedia.org/wikipedia/commons/e/e7/Baseball_pitching_motion_2004r.jpg \"出典：Wikimedia Commons／Rdikeman／CC BY-SA 3.0\")\n\n## しくみ\n==日本ハムの残り試合は、**今日と10月1日**のロッテ戦だけだ。==一方、西武は残り4試合ある。日本ハムが2連勝しても、西武が残り4試合で2勝すれば西武が2位になる。日本ハムは勝ち続けたうえで、西武が負けるのを待つ立場なのだ。\n\n==2位と3位はどちらも**CS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）**に出られる。==ただしファーストステージは、2026年も2位球団の本拠地で全試合を行う。さらに勝利数が同じなら2位球団が勝ち上がるので、2位にははっきりした利点があるのだ。\n\n## 今日の試合で見るなら\n==日本ハム先発は**福島蓮**。==7月12日以来の先発で、9月は救援7試合を無失点でつないできた。短いイニング（回）で**継投（投手を何人もつないで投げさせること）**するのか、それとも福島を長く引っぱるのか。==**新庄監督**の投手交代も、2位争いを背負った采配として見ると意味が分かりやすい。=="}, "5-01-b": {"meta": {"id": "5-01-b", "title": "ロッテにとってはどんな試合？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-01", "5-02-c", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n==ロッテは**5位**で、**CS進出**の可能性はもうない。==それでも、選手の記録と来季につながる競争が残っている試合だ。\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\nサブロー監督は就任1年目。順位だけを見れば**消化試合**（順位争いへの影響が小さくなった試合）に近いが、若い選手にとっては来季の役割をつかむ場でもある。\n\n**西川史礁**は打率3割を狙える位置にいて、**山口航輝**は32本塁打。==先発**ジャクソン**は**9勝**で、今日勝てば10勝目だ。==チーム順位が決まっても、個人の目標は終わっていないのだ。\n\n## 今日の試合で見るなら\n前日は**井上広大**が勝ち越し打、**寺地隆成**が3安打を記録した。==今日もこの2人がスタメンなら、結果だけでなく「来季も使いたいと思わせる内容か」という見方ができる。==終盤に若手が代打（打つためだけに交代で出る選手）や守備で出てきたら、そこも見逃したくない場面だ。"}, "5-01-c": {"meta": {"id": "5-01-c", "title": "今日の結果で何が決まりうる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-01", "5-01-a", "5-05"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html"]}, "body": "## ひとことで\n==今日だけで**日本ハム**の**2位**が決まるわけではない。====ただし日本ハムが負けて、同じ時間に楽天と戦う**西武**が勝つと、日本ハムの3位が確定する。==\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n9月27日終了時点で、日本ハムは2位西武と**1.5ゲーム差**（勝ち数と負け数の開きを試合数で表したもの）で、**残り2試合**だ。西武は残り4試合ある。==日本ハムが今日負けると、2位の望みは「残り1試合に勝ち、西武が残り4試合すべてに負ける」場合だけになる。==\n\n逆に今日勝てば、2位争いは10月1日のロッテ戦まで続く。NPBの2026年CS要項では、ファーストステージの球場はすべて2位球団の専用球場と決まっている。日本ハムの**CS出場**（3位以内）はすでに決まっているので、==今日の1勝はCSの開催地を争う1勝なのだ。==\n\n## 今日の試合で見るなら\n日本ハムが終盤でリードしていたら、継投（投手を何人もつないで投げさせること）が普段より細かくなる可能性がある。清宮幸太郎や万波中正の一発だけでなく、==**新庄監督**が**福島蓮**から誰へつなぐかにも注目すると、試合の重さが見えやすい。=="}, "5-01": {"meta": {"id": "5-01", "title": "今日はどんな試合なの？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-01-a", "5-01-b", "5-01-c"], "related": ["5-05", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/info_cs.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/schedule_10_detail.html", "https://npb.jp/news/detail/20230127_04.html", "https://www.nikkansports.com/baseball/news/201908240000564.html?mode=all", "https://ja.wikipedia.org/wiki/10.19"], "episode": "v2"}, "body": "## ひとことで\n==日本ハムには**2位争い**がかかった、かなり重い一戦だ。==ロッテは**CS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）**には行けないが、記録や来季につながる見どころが多い。\n\n\n![R・H・Eや選手名が表示された野球場のスコアボード](https://upload.wikimedia.org/wikipedia/commons/7/75/Kose_baseball_stadium_scoreboard_member%282012.8.11_Yokohama_DeNA_vs_Chunichi%29.JPG \"出典：Wikimedia Commons／OCIAG／CC BY-SA 3.0\")\n\n## しくみ\n9月27日終了時点で、パ・リーグはソフトバンクの優勝が決まっている。==2位は西武、3位は日本ハムで、その差は**1.5ゲーム**（ゲーム差：勝ち数と負け数の開きを試合数で表したもの）だ。==日本ハムの残りは今日と10月1日のロッテ戦、2試合しかない。\n\n==**CSのファーストステージ**は2位と3位が戦う。==2026年は全試合を2位球団の本拠地で行うので、2位になる意味は「順位が一つ上」だけではないのだ。ただし西武は残り4試合あり、日本ハムが2連勝しても西武が2勝すれば西武が2位だ。日本ハムは勝ち続けて、西武の負けを待つしかない。\n\n==一方のロッテは5位で、CS進出の可能性はない。==ただし、先発の**ジャクソン**は勝てば10勝目。**山口航輝**は**32本塁打**で、33号ならパ・リーグ単独2位になる。勝敗とは別に、個人の節目がいくつも残っている試合なのだ。\n\n## おもしろエピソード\n1988年10月19日、川崎球場でロッテと近鉄がダブルヘッダー（1日に2試合すること）を戦った。近鉄は2試合とも勝てばリーグ優勝という状況で、第1試合には勝ったが、第2試合は延長10回で**4対4の引き分け**になり、優勝を逃した。\n\nロッテは優勝争いの主役ではなかった。それでも目の前の一戦を譲らず、相手のシーズンの結末を変えたのだ。==順位が決まった側と、どうしても勝ちたい側の試合でも、結果は最後まで決まっていない==。\n\n## 今日の試合で見るなら\nまず日本ハムの3番候補・清宮幸太郎に注目だ。通算100本塁打まであと1本なので、1打席ごとに球場の空気が変わるかもしれない。\n\nロッテでは先発ジャクソンの10勝目と、山口の33号が分かりやすい見どころだ。試合の勝敗、順位争い、個人記録を同時に追うと、今日がただの「シーズン終盤の1試合」ではないことが見えてくる。"}, "5-02-a": {"meta": {"id": "5-02-a", "title": "球団の歴史は？（名前の変遷）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/corp/history/1955.html", "https://www.marines.co.jp/corp/history/1960.html", "https://www.marines.co.jp/corp/history/1965.html", "https://www.marines.co.jp/corp/history/1990.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\n==いまの**千葉ロッテ**は、**1950年**の「毎日オリオンズ」から続く球団だ。==会社や本拠地の変化に合わせて名前を変え、1992年から「千葉ロッテマリーンズ」になった。\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n大きな流れはこうだ。==**毎日オリオンズ**から、大毎オリオンズ、東京オリオンズ、**ロッテオリオンズ**へと変わり、千葉移転で現在の名前になった。==\n\n**1969年**にロッテとの業務提携で**「ロッテオリオンズ」**が誕生。1991年に千葉への本拠地移転を決め、公募で「マリーンズ」という名前が選ばれた。==**1992年**が千葉ロッテの最初のシーズンだ。==\n\n## 今日の試合で見るなら\nZOZOマリンでロッテを応援していると「最初から千葉の球団」に見えるかもしれない。でも球団史をさかのぼると、東京や川崎の時代にたどり着く。==今日**サブロー監督**や**山口航輝**を見るとき、その長い歴史のいちばん新しいページだと思うと、見え方が少し変わる。=="}, "5-02-b": {"meta": {"id": "5-02-b", "title": "日本一の年は？（2005年・2010年の下剋上）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-02", "5-05"], "sources": ["https://npb.jp/nippons/2005/index.html", "https://npb.jp/nippons/2010/", "https://www.marines.co.jp/corp/history/2005.html", "https://www.marines.co.jp/corp/history/2010.html"]}, "body": "## ひとことで\n==ロッテの日本一は**1950年、1974年、2005年、2010年の4回**だ。==最近の2回は、レギュラーシーズン1位ではない位置から短期決戦を勝ち上がった。\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n**2005年**はレギュラーシーズン2位から**プレーオフ**（シーズン後に上位球団で行う短期決戦）を勝ち抜き、リーグ優勝。==日本シリーズでは阪神に**4連勝**し、**31年ぶり**の日本一になった。==当時は現在と制度が違うので、今のCSと完全に同じではない。\n\n**2010年**はレギュラーシーズン3位から**CS**を突破。日本シリーズでは中日を4勝2敗1分で破り、5年ぶり4度目の日本一になった。==3位から日本一まで進んだため、**「下剋上」**の象徴として語られる年だ。==\n\n## 今日の試合で見るなら\n現在の**サブロー監督**は、**2005年**の日本一で主力だった選手だ。==今日ベンチの監督を見たら、「この人はロッテが日本一になった時代をグラウンドで経験している」と覚えておくと、球団史が急に近くなる。=="}, "5-02-c": {"meta": {"id": "5-02-c", "title": "今年のロッテは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-01-b", "5-02", "5-06"], "sources": ["https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/tmb_p.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n==**2026年**のロッテは、9月27日終了時点でパ・リーグ**5位**。==CS進出の可能性はなく、サブロー監督の1年目は上位争いに届かなかった。\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n**チーム打率**（打数のうちヒットになった割合）は**.236**で、得点を安定して作るのに苦しんだ。一方で**山口航輝**は32本塁打まで伸ばし、西川史礁も、規定打席（打率の順位に載るのに必要な打席数）に達した打者の中で打率がリーグ上位にいる。==順位は低くても、打線の軸になりそうな選手は見えてきているのだ。==\n\nシーズン終盤は、若手や新戦力を見きわめる時期でもある。前日の日本ハム戦では**寺地隆成**が3安打、**井上広大**が勝ち越し打を記録し、==ロッテが6対1で勝った。==\n\n## 今日の試合で見るなら\n**山口**の一発に加えて、**寺地**、井上、西川史礁の打席も続けて見るといい。==今日の結果が順位を大きく変えなくても、「来年の打線に誰が残るか」という視点では一打席ずつに意味がある。=="}, "5-02-d": {"meta": {"id": "5-02-d", "title": "有名なOBは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-02", "5-02-b"], "sources": ["https://www.marines.co.jp/corp/history/1980.html", "https://www.marines.co.jp/corp/history/1985.html", "https://www.marines.co.jp/special/70th/history.html"]}, "body": "## ひとことで\n==ロッテの昔のスターなら、**落合博満**、**村田兆治**、有藤道世を知っておくと話がつながりやすい。==打者、投手、生え抜き（入団した球団で長くプレーし続けた選手）の象徴という三つの方向から球団史を見られる。\n\n![落合博満](https://upload.wikimedia.org/wikipedia/commons/6/64/Hiromitsu_Ochiai.jpg \"出典：Wikimedia Commons／machu.・UCinternational／CC BY 2.0\")\n\n## しくみ\n**落合博満**はロッテ時代に**三冠王**（打率・本塁打・打点の3部門すべて1位）を1982年、1985年、1986年の3度獲得した大打者だ。\n\n**村田兆治**は豪快な**「マサカリ投法」**で知られ、右肘の手術から復活。==**1989年**に通算**200勝**を達成した。==**有藤道世**は長くロッテ一筋でプレーし、**1985年に2000安打**を達成。「ミスター・ロッテ」と呼ばれた存在だ。\n\n## 今日の試合で見るなら\n山口航輝が30本塁打を超えたことで、球団の長打者の歴史がまた話題になっている。==今日**33号**が出たら、昔の**落合**のような大打者と比べる材料が一つ増える。====記録は、昔の選手と今の選手をつなぐ物差しなのだ。=="}, "5-02": {"meta": {"id": "5-02", "title": "ロッテってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-02-a", "5-02-b", "5-02-c", "5-02-d"], "related": ["5-01", "5-06", "5-07"], "sources": ["https://www.marines.co.jp/corp/history/1950.html", "https://www.marines.co.jp/special/70th/history.html", "https://npb.jp/bis/2026/stats/", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://sportiva.shueisha.co.jp/clm/baseball/npb/2020/09/15/___split_171/?page=3", "https://www.nikkansports.com/baseball/news/p-bb-tp0-20080701-378333.html", "https://ja.wikipedia.org/wiki/%E5%B7%9D%E5%B4%8E%E7%90%83%E5%A0%B4"], "episode": "v2"}, "body": "## ひとことで\n==**千葉ロッテマリーンズ**は、**1950年**の毎日オリオンズを出発点に持つパ・リーグの球団だ。==1992年から千葉を本拠地にし、いまの「マリーンズ」という名前になった。\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n球団の歴史はかなり長い。1950年に**毎日オリオンズ**として始まり、大毎オリオンズ、東京オリオンズ、ロッテオリオンズと名前を変え、1992年に**千葉ロッテマリーンズ**になった。\n\n==日本一は**1950年、1974年、2005年、2010年の4回**。==特に2005年と2010年は、上位チームを短期決戦で倒して頂点まで進んだ年として記憶されている。==**2010年**はレギュラーシーズン**3位**から日本一になった。==\n\n2026年は9月27日終了時点で5位。**CS**（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）には進めないが、**山口航輝**の長打力や、西川史礁ら若い打者の成長など、来季につながる材料を探す終盤になっている。\n\n## 歴史・由来\n「マリーンズ」は海に近い千葉を本拠地にすることと相性のよい名前だ。球団は1991年に千葉への移転を決め、==公募で**「マリーンズ」**を採用。==1992年から千葉ロッテマリーンズとしてスタートした。\n\n## おもしろエピソード\n千葉へ移る前、ロッテは**川崎球場**を本拠地にしていた。元ロッテ応援団員の**横山健一**によると、空席の多いスタンドがテレビの珍プレー番組で有名になると、目立とうとした一部の客が麻雀卓や七輪を持ち込み、ついには**流しそうめん**まで始めたという。\n\n横山は、野球を見ずに遊ぶ客を注意する側だった。2008年にはロッテ球団自身が、昔の珍風景にちなんで千葉マリンで流しそうめん企画を検討したほどだ。==スタンドの珍事件が、球団の企画案にまでなった==のだ。\n\n## 今日の試合で見るなら\n2番候補の山口航輝は32本塁打で、33号ならパ・リーグ単独2位になる。1番候補の西川史礁は打率3割が見える位置だ。\n\nそして監督のサブローも、2005年の日本一メンバーだった。今日のベンチを見ると、球団の過去と現在が同じ場所につながっているのが分かる。"}, "5-03-a": {"meta": {"id": "5-03-a", "title": "東京から北海道へ移ったのはなぜ？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-03", "5-03-b"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://www.fighters.co.jp/news/detail/00000742.html"]}, "body": "## ひとことで\n==東京ドームを本拠地にしていた**日本ハム**は、**2004年**に北海道へ移った。==大きく言えば、北海道に根を張る「地域密着の球団」へ転換するための移転だった。\n\n![エスコンフィールドHOKKAIDOのバックネット裏からの全景](https://upload.wikimedia.org/wikipedia/commons/f/f8/%E3%82%A8%E3%82%B9%E3%82%B3%E3%83%B3%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E5%8C%97%E6%B5%B7%E9%81%93.jpg \"出典：Wikimedia Commons／高梨慎太郎／CC BY-SA 4.0\")\n\n## しくみ\n東京時代は、東京ドームを巨人と分け合う形で16年間使っていた。球団は**2002年7月**、**2004年**から札幌ドームへ本拠地を移すことを正式決定した。\n\n北海道移転後は**「Sports Community（スポーツを通じた地域づくり）」**を企業理念に掲げ、北海道各地との活動を広げていった。==単に試合をする場所を東京から札幌へ替えただけではなく、球団の土台そのものを北海道につくり直した、と考えるとわかりやすい。==\n\n## 歴史・由来\n**2004年**は**新庄剛志**が加入した年でもある。==移転3年目の**2006年**にはリーグ優勝、日本一まで進んだ。==\n\n## 今日の試合で見るなら\n今日、日本ハムはビジター（相手の本拠地に出向いて戦う側）としてZOZOマリンに来ている。==ユニフォームの胸にある**「FIGHTERS」**は、**22年前**に北海道へ移り、地域と一緒に育ってきた球団の名前なのだ。=="}, "5-03-b": {"meta": {"id": "5-03-b", "title": "エスコンフィールドって？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/00003788.html", "https://www.fighters.co.jp/news/detail/202500696362.html", "https://npb.jp/games/2026/info_cs.html", "https://prtimes.jp/main/html/rd/p/000000099.000079562.html", "https://www.fighters.co.jp/news/detail/202300463720.html", "https://ja.wikipedia.org/wiki/%E3%82%A8%E3%82%B9%E3%82%B3%E3%83%B3%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89HOKKAIDO", "https://www.fighters.co.jp/news/detail/00004510.html", "https://www.fighters.co.jp/news/detail/202300291965.html"], "episode": "v2"}, "body": "## ひとことで\n==**エスコンフィールドHOKKAIDO**は、**2023年3月**に北海道北広島市で開業した日本ハムの本拠地だ。==**開閉式の屋根**と**天然芝**を組み合わせた球場で、約3万5000人を収容する。\n\n![エスコンフィールドHOKKAIDOのバックネット裏からの全景](https://upload.wikimedia.org/wikipedia/commons/f/f8/%E3%82%A8%E3%82%B9%E3%82%B3%E3%83%B3%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E5%8C%97%E6%B5%B7%E9%81%93.jpg \"出典：Wikimedia Commons／高梨慎太郎／CC BY-SA 4.0\")\n\n## しくみ\n正式には北海道ボールパークFビレッジの中心にある球場だ。大きなガラス壁、**開閉式屋根**、**天然芝**が特徴で、球場内には飲食店やホテル、温泉・サウナなどもある。\n\n==つまり「野球を見るためだけの建物」というより、一日過ごせる街の中心に球場がある設計なのだ。==\n\n## おもしろエピソード\n開業を目前にした2022年11月、エスコンフィールドで思わぬ問題が見つかった。本塁からバックネットまでが約15.18mで、日本の公認野球規則が当時定めていた18.288m以上に、約3m足りなかったのだ。\n\n日本ハムはいったん改修する案を示したが、2023年3月、NPBと12球団はルール順守や野球振興への協力などを条件に、現状のまま使い続けることを認めた。新球場は、最初の公式戦より前に「球場そのもの」が大ニュースになったのだ。\n\n## 今日の試合で見るなら\n日本ハムが今季2位で終われば、10月10日からのCSファーストステージは2位球団の本拠地で行われる。だから今日の勝利は、「エスコンでCSを開く」可能性を残すためにも必要なのだ。"}, "5-03-c": {"meta": {"id": "5-03-c", "title": "大谷翔平やダルビッシュがいたって本当？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-03", "5-03-d"], "sources": ["https://www.fighters.co.jp/news/detail/00003549.html", "https://npb.jp/bis/players/61965110.html", "https://npb.jp/bis/players/01305137.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n==本当だ。**ダルビッシュ有**は**2005〜2011年**、大谷翔平は2013〜2017年に日本ハムでプレーした。==二人とも、北海道移転後のファイターズを代表する選手なのだ。\n\n![日本ハム時代のダルビッシュ有が投球する様子](https://upload.wikimedia.org/wikipedia/commons/0/02/Darvish_pitching1.jpg \"出典：Wikimedia Commons／ITA-ATU／CC BY-SA 3.0\")\n\n![日本ハム時代の大谷翔平が打席に立つ様子](https://upload.wikimedia.org/wikipedia/commons/8/8d/Fighters_ohtani_bat.jpg \"出典：Wikimedia Commons／Ship1231／CC BY-SA 3.0\")\n\n## しくみ\n**ダルビッシュ**は高校から入団し、日本ハムで**7年間に93勝**。2006年の日本一や2007年のリーグ連覇を支えるエースになった。\n\n**大谷**は2012年ドラフト1位で入り、2013年から投手と打者の**「二刀流」**に挑戦した。==**2016年**には投打の両方で活躍し、チームの日本一に貢献している。==\n\n==二人はその後、**米大リーグ**へ移った。==だから日本ハムは、世界で知られる選手を日本で育てた球団でもあるわけだ。\n\n## 今日の試合で見るなら\n今日の日本ハム先発は**23歳**の**福島蓮**だ。育成ドラフト（まず育成選手として契約する選手を選ぶドラフト）から入り、支配下（一軍の公式戦に出られる正式な選手枠）を勝ち取った若い右腕で、5勝4敗、防御率3.35。==ダルビッシュや大谷とはタイプも歩みも違うが、「若い投手が大舞台を任される」という日本ハムの歴史を思い出して見ると面白い。=="}, "5-03-d": {"meta": {"id": "5-03-d", "title": "新庄監督ってどんな人？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-03", "5-05"], "sources": ["https://www.fighters.co.jp/news/detail/202500780959.html", "https://www.fighters.co.jp/news/detail/202600951850.html", "https://www.nikkansports.com/baseball/news/202609240001679.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html", "https://ja.wikipedia.org/wiki/%E6%96%B0%E5%BA%84%E5%89%9B%E5%BF%97", "https://www.nikkansports.com/baseball/news/202112310000975.html", "https://column.sp.baseball.findfriends.jp/?id=097-20190612-10&pid=column_detail"], "episode": "v2"}, "body": "## ひとことで\n==**新庄剛志監督**は、現役時代にも日本ハムでプレーした元外野手だ。==2022年から監督を務め、選手起用や試合前後の発信まで含めて注目を集めるタイプなのだ。\n\n![北海道日本ハムファイターズの新庄剛志監督](https://upload.wikimedia.org/wikipedia/commons/0/0c/NF_TsuyoshiShinjo20250427.jpg \"出典：Wikimedia Commons／TSUBAME98／CC BY-SA 4.0\")\n\n## しくみ\n現役では阪神から米大リーグへ渡り、**2004年**に日本ハムへ加入した。ちょうど球団が北海道へ移った年で、**2006年**の日本一を最後に引退している。\n\n監督には**2022年**に就任した。最初の2年は6位だったが、==**2024年、2025年**は**2年連続2位**。==2026年は9月27日終了時点で3位にいる。\n\n9月24日、本拠地での最終戦のあとには、==**2027年**も続投する意向を明らかにした。==来季は監督6年目になる。\n\n## おもしろエピソード\n1999年、阪神の選手だった新庄剛志は甲子園の巨人戦で、延長12回一死一、三塁の打席に立った。巨人は敬遠（勝負を避けるため、打者から大きく外す球を投げて四球にする作戦）を選んだが、新庄はその外れた2球目に踏み込んで打ち、サヨナラ安打にしてしまった。\n\n思いつきではない。3日前にも敬遠されていた新庄は、打撃コーチに頼んで外れた球を5球投げてもらい、3球を打ち返していたという。奇策に見える一打を、本人は先に練習して準備していたのだ。\n\n## 今日の試合で見るなら\n日本ハムが2位へ上がるには、残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日の先発は、9月に救援で7試合無失点だった福島蓮。約2カ月半ぶりの先発をどこまで投げさせ、どの投手につなぐかは、新庄監督の大きな判断になる。"}, "5-03": {"meta": {"id": "5-03", "title": "日本ハムってどんなチーム？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-03-a", "5-03-b", "5-03-c", "5-03-d"], "related": ["5-01", "5-05", "5-06"], "sources": ["https://www.fighters.co.jp/expansion/50th/history.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html", "https://www.japantimes.co.jp/sports/2014/09/03/baseball/japanese-baseball/fan-favorite-inaba-jumping-sunset/", "https://pacificleague.com/news/2022/9/10005241"], "episode": "v2"}, "body": "## ひとことで\n==**北海道日本ハムファイターズ**は、**2004年**から北海道を本拠地にするパ・リーグの球団だ。==北海道移転後は2006年と2016年に日本一になっている。\n\n![エスコンフィールドHOKKAIDOのバックネット裏からの全景](https://upload.wikimedia.org/wikipedia/commons/f/f8/%E3%82%A8%E3%82%B9%E3%82%B3%E3%83%B3%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%E5%8C%97%E6%B5%B7%E9%81%93.jpg \"出典：Wikimedia Commons／高梨慎太郎／CC BY-SA 4.0\")\n\n## しくみ\nもともとは東京を本拠地にしていたが、2004年から札幌ドームへ移り、現在は北広島市の**エスコンフィールドHOKKAIDO**が本拠地だ。\n\n球団の特徴を一つに決めるのは難しい。けれど、**ダルビッシュ有**や**大谷翔平**のような若い選手が大きく育った歴史があり、今も清宮幸太郎、万波中正、水野達稀らが中心になっている。\n\n==**2026年**は9月27日終了時点でパ・リーグ**3位**だ。==2位の西武とは**1.5ゲーム差**（勝ち数と負け数の開きを試合数で表したもの）で、残りはロッテとの2試合だけ。2位で終われば、クライマックスシリーズ（CS：日本シリーズ進出を争う短期決戦）の最初の舞台を自分たちの本拠地で戦える。\n\n## 歴史・由来\n球団は1974年に「日本ハムファイターズ」として発足した。==**2004年**の北海道移転は大きな転換点で、**2006年には44年ぶりの日本一**を達成した。==その後も北海道を代表する球団として歩み、2023年からエスコンフィールドを本拠地にしている。\n\n## おもしろエピソード\n北海道移転後の札幌ドームでは、稲葉篤紀（2006年の日本一を支えた強打者）の打席で、観客が一斉に跳ぶ「稲葉ジャンプ」が名物になった。3万人規模のファンが跳ぶと、球場だけでなくテレビカメラの映像まで上下に揺れた。\n\n元同僚の小笠原道大は後年、ベンチ裏のモニターだけが激しく揺れ、「地震!?」と思ったと振り返っている。稲葉本人にも打席まで振動が伝わり、応援が静まるまで待とうとしたことがあったという。ファンの応援が、本当に球場を揺らしていたのだ。\n\n## 今日の試合で見るなら\n日本ハムは今日を含む残り2試合を勝ち続けたうえで、残り4試合の西武が負けるのを待つしかない。今日負けて西武が勝てば、3位が確定する。\n\n予想スタメンでは清宮が3番の指名打者（守備につかず打撃を担当する選手）で、通算100本塁打まであと1本。まずは「日本ハムは順位を上げるために勝ちが必要な側」と覚えておけば、攻撃の一球ごとの重さが見えやすくなる。"}, "5-04-a": {"meta": {"id": "5-04-a", "title": "セ・リーグとの違いは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-04", "5-04-b"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html"]}, "body": "## ひとことで\n==**2026年**の大きな違いは、パ・リーグには**指名打者**（DH：投手の代わりに打つ専門選手）がいて、セ・リーグでは投手も打席に立つことだ。==ただし、この違いは2026年で終わる。\n\n![日本ハム時代の大谷翔平が打席に立つ様子](https://upload.wikimedia.org/wikipedia/commons/8/8d/Fighters_ohtani_bat.jpg \"出典：Wikimedia Commons／Ship1231／CC BY-SA 3.0\")\n\n## しくみ\nパ・リーグは**1975年**から**DH制**を使っている。==投手は基本的に投げることへ集中し、打線には別の打者が1人入る。==\n\nセ・リーグは長く「9人野球」を続けてきたが、**2027年**から**DH制**を採用すると正式決定した。==だから**2026年**は、セ・リーグの投手が公式戦で普通に打席へ入る最後のシーズンなのだ。==\n\n==ボールカウントやアウトの取り方など、野球の基本ルールは両リーグで同じだ。==所属する6球団と、DHの扱いが主な違いなのだ。\n\n## 今日の試合で見るなら\n今日のロッテと日本ハムはどちらもパ・リーグなのでDHを使える。予想ではロッテの**山口航輝**、日本ハムの**清宮幸太郎**が指名打者。==守備につかず、「打つ仕事」に集中する選手として見ればいい。=="}, "5-04-b": {"meta": {"id": "5-04-b", "title": "交流戦って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-04", "5-04-a"], "sources": ["https://npb.jp/interleague/2026/schedule_note_il.html", "https://npb.jp/interleague/2026/"]}, "body": "## ひとことで\n==**交流戦**は、普段は別リーグにいるセ・リーグとパ・リーグの球団が対戦する公式戦だ。== 2005年に始まり、2026年は各球団**18試合**を戦った。\n\n## しくみ\n各チームは、別リーグの**6球団**と3試合ずつ対戦する。==合計**18試合**で、ホーム9試合、ビジター9試合だ。==\n\n「特別なイベント試合」ではなく、勝敗はそのまま**シーズンの成績**に入る。交流戦で大きく勝ち越せば、その後のリーグ順位にも効くというわけだ。\n\n**2026年の交流戦**は5月26日から行われた。\n\n## 歴史・由来\n交流戦が始まる前は、日本シリーズなどを除けば別リーグの球団が公式戦で当たる機会は少なかった。今は毎年、普段見ない組み合わせを楽しめる期間になっている。\n\n## 今日の試合で見るなら\n==今日の**ロッテ対日本ハム**は交流戦ではなく、パ・リーグ同士の試合だ。== だから日本ハムの勝敗は、目の前の**2位争い**にそのまま響く。"}, "5-04-c": {"meta": {"id": "5-04-c", "title": "パ・リーグの6球団は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-04", "5-02", "5-03"], "sources": ["https://npb.jp/bis/2026/stats/std_p.html", "https://npb.jp/games/2026/"]}, "body": "## ひとことで\nパ・リーグには**6球団**ある。==今日戦う千葉ロッテと北海道日本ハムも、同じパ・リーグの仲間だ。==\n\n## しくみ\n6球団は、**千葉ロッテマリーンズ**、**北海道日本ハムファイターズ**、福岡ソフトバンクホークス、埼玉西武ライオンズ、オリックス・バファローズ、東北楽天ゴールデンイーグルスだ。\n\n同じリーグなので、シーズン中はこの6球団どうしで何度も対戦する。今日のロッテ対日本ハムも、そのリーグ戦の一つというわけだ。\n\n==覚えるなら「ロッテ・日本ハム・ソフトバンク・西武・オリックス・楽天」の6つで十分だ。==\n\n## 今日の試合で見るなら\n今季のロッテ対日本ハムは、今日の試合前まで**日本ハムの13勝10敗**だ。==同じ相手と何度も戦うから、前の対戦の結果や相性も今日の作戦につながるのだ。=="}, "5-04": {"meta": {"id": "5-04", "title": "ロッテや日ハムがあるパ・リーグって？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["5-04-a", "5-04-b"], "related": ["5-03", "5-05"], "sources": ["https://npb.jp/news/detail/20260326_02.html", "https://npb.jp/games/2026/", "https://npb.jp/bis/2026/stats/std_p.html", "https://ja.wikipedia.org/wiki/%E3%83%89%E3%83%B3%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%AB%E3%82%B8%E3%83%BC", "https://npb.jp/pl/history.html", "https://column.sp.baseball.findfriends.jp/?id=097-20190529-10&pid=column_detail", "https://npb.jp/bis/players/93193881.html"], "episode": "v2"}, "body": "## ひとことで\n==**パ・リーグ**は、日本のプロ野球**12球団**を二つに分けたうちの一方だ。==ロッテ、日本ハム、ソフトバンク、西武、オリックス、楽天の6球団が所属している。\n\n![ZOZOマリンスタジアム（当時の千葉マリンスタジアム）の全景](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n正式には**パシフィック・リーグ**という。もう一方が**セントラル・リーグ**、略してセ・リーグだ。\n\n普段の公式戦では、同じリーグの6球団どうしで多く対戦する。==2026年は1球団**143試合**で、そのうち**125試合**が同じリーグとの対戦、18試合がセ・パ交流戦（別リーグとの公式戦）だ。==\n\nシーズン終了時の順位は、まずリーグ内で決まる。==**1位**がリーグ優勝で、**1〜3位**がクライマックスシリーズ（CS：日本シリーズ進出を争う短期決戦）へ進む。==そこから勝ち上がった1球団が、セ・リーグ側の勝者と日本シリーズで戦う。\n\n## 歴史・由来\n**セ・リーグとパ・リーグの2リーグ制**は**1950年**に始まった。長く大きな違いだったのが指名打者（DH：投手の代わりに打つ専門選手）の有無で、==パ・リーグは**1975年**から採用している。==\n\n## おもしろエピソード\nDH制のパ・リーグでも、投手が打って試合を決めたことがある。1991年、オリックス・ブルーウェーブ（今のオリックス）の救援投手ドン・シュルジーは、近鉄戦でDHが途中で消えたため、延長11回に来日初打席が回ってきた。\n\nすると初球を左中間の照明塔へ当てる決勝本塁打。その裏も投げて勝利投手になった。しかも日本で打席に立ったのは、これが最初で最後だった。1975年のDH制導入後、パ・リーグの投手として初の本塁打を、通算1打数1安打1本塁打で残したのだ。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムは、同じパ・リーグ同士の公式戦だ。ロッテは5位でCS進出の可能性がなく、日本ハムは3位で2位西武を1.5ゲーム差（勝ち数と負け数の開きを試合数で表したもの）で追っている。同じ1勝でも、今の両チームでは順位への意味が違うのだ。"}, "5-05-a": {"meta": {"id": "5-05-a", "title": "日本シリーズまでの流れは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-05", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/event/2026/", "https://npb.jp/nippons/2025/information.html"]}, "body": "## ひとことで\n==道順は「**レギュラーシーズン→CSファースト→CSファイナル→日本シリーズ**」だ。== **CS**はクライマックスシリーズ（日本シリーズ進出を争う短期決戦）の略だ。セ・リーグとパ・リーグから1球団ずつが勝ち残り、最後に日本一を争う。\n\n## しくみ\nパ・リーグなら、まず2位と3位が**CSファーストステージ**を戦う。その勝者が1位球団と**ファイナルステージ**で対戦し、勝った球団がパ・リーグ代表として日本シリーズへ進む。\n\nセ・リーグでも同じ流れで1球団を決める。==最後の**日本シリーズ**は最大7試合で、一方が4勝した時点で終了する。==\n\n**2026年の日本シリーズ**は10月24日に開幕予定だ。\n\n## 今日の試合で見るなら\n**日本ハム**にとって、今日の先にある最短ルートはこうだ。まず2位を取りにいき、10月10日からのCSファーストステージを勝つ。\n\nそのうえで、リーグ1位の**ソフトバンク**とのファイナルを突破する。==今日の**ロッテ戦**は、その長い階段の入口にある1試合なのだ。=="}, "5-05-b": {"meta": {"id": "5-05-b", "title": "CSのファーストステージとファイナルステージの違いは？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-05", "5-05-c", "5-01"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html"]}, "body": "## ひとことで\n**ファーストステージ**は2位対3位、**ファイナルステージ**は1位対その勝者だ。==「まず挑戦者を決め、次にリーグ1位へ挑む」と考えるとわかりやすい。==\n\n## しくみ\nファーストは**3試合制**で、先に2勝した側が勝ち上がる。全試合が2位球団の本拠地で行われ、勝利数が同じなら2位球団が進む。\n\nファイナルは1位球団の本拠地で行う。基本は1位に**1勝のアドバンテージ**があり、最大6試合で先に4勝に届いた側が日本シリーズへ進む。2026年からは条件によって、1位に2勝を与える最大7試合制になる場合もある。\n\n==ファーストより、ファイナルのほうが1位球団に明確な有利さがあるのだ。==\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、2位西武と**1.5ゲーム差**だ。==2位になれば最初のCSを自分たちの本拠地で始められる。== 今日のロッテ戦は、その位置を争うための一戦なのだ。"}, "5-05-c": {"meta": {"id": "5-05-c", "title": "2位と3位で何が違う？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-05", "5-05-b", "5-01-a"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/bis/2026/stats/std_p.html"]}, "body": "## ひとことで\nCSには2位も3位も出られるが、==**2位のほうがファーストステージでかなり有利**だ。== 本拠地で戦え、勝利数が並んだ場合も2位が勝ち上がる。\n\n## しくみ\nファーストステージは2位対3位の3試合制だ。**全試合を2位球団の本拠地**で行う。\n\nさらに、引き分けなどで両チームの勝利数が同じまま終われば、レギュラーシーズン上位の2位がファイナルへ進む。つまり3位は、基本的に==2位より多く勝たなければならない立場==なのだ。\n\n## 今日の試合で見るなら\n日本ハムは3位で、2位西武と**1.5ゲーム差**。残りは今日と10月1日のロッテ戦2試合で、今日の試合データでは**2連勝が最低条件**だ。\n\n==2位まで上がればCS最初の舞台が本拠地になる。== だから、すでにCS進出が決まっていても今日の1勝には大きな意味があるのだ。"}, "5-05": {"meta": {"id": "5-05", "title": "クライマックスシリーズ（CS）って？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-05-a"], "related": ["5-01", "5-03", "5-04"], "sources": ["https://npb.jp/games/2026/info_cs.html", "https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://news.yahoo.co.jp/articles/961405bccfdd1647c4482e9bc4af6b9557807045", "https://npb.jp/games/2026/schedule_10_detail.html", "https://www.nikkansports.com/baseball/news/201710160000020.html", "https://www.nikkansports.com/baseball/news/p-bb-tp0-20101020-692124.html", "https://npb.jp/nippons/2010/"], "episode": "v2"}, "body": "## ひとことで\n==**クライマックスシリーズ（CS）**は、リーグ戦のあとに1〜3位が日本シリーズ進出を争う短期決戦だ。== リーグ優勝そのものは1位の球団だが、CSを勝ち抜かないと**日本シリーズ**には行けない。\n\n## しくみ\nまず**ファーストステージ**で2位と3位が対戦する。3試合制で先に**2勝**したほうが勝ち上がり、==全試合を2位球団の本拠地で行う。== 同じ勝利数になった場合も、上位の2位球団が進む。\n\n次の**ファイナルステージ**は1位球団対ファーストステージ勝者だ。\n\n基本は1位球団に最初から**1勝**（アドバンテージ：あらかじめ与えられる有利な勝ち星）を与える。\n\n==最大6試合で、その1勝も含めて先に**4勝**した側が日本シリーズへ進む。==\n\n2026年からは追加ルールができた。1位と勝ち上がり球団のレギュラーシーズンの差が**10ゲーム**（ゲーム差：勝ち数と負け数の開きを試合数で表したもの）以上、または勝ち上がり球団の勝率が**5割未満**なら、1位に2勝のアドバンテージを与え、最大7試合・5勝先取になる。\n\nつまり、レギュラーシーズンで上にいるほど有利に作られているのだ。\n\n## 歴史・由来\n今の形のCSは**2007年**から両リーグで行われている。2026年はファーストステージが10月10日、ファイナルステージが10月14日に始まる。\n\n## おもしろエピソード\n2017年のCSファーストステージ、阪神タイガース対横浜DeNAベイスターズの第2戦は、甲子園球場が雨で泥だらけになった。**DeNAの筒香嘉智（当時の主将）**は、顔の近くへ来た球をよけて転び、ユニホームを泥だらけにして着替えるほどだった。\n\nそれでも7回、筒香は勝ち越しの安打（ヒット）を放ち、DeNAは負ければ敗退の試合を13対6で勝った。==雨の中で転んで着替えた主将が、その後に勝ち越し打を打ったのだ。==\n\n2010年には、**千葉ロッテマリーンズ**がレギュラーシーズン3位からCSへ進み、ファイナルステージで1位ソフトバンクにあと1敗で敗退というところから3連勝した。さらに日本シリーズ（その年の日本一を決める試合）まで制し、3位から日本一になった。\n\n## 今日の試合で見るなら\n日本ハムは9月27日終了時点で3位、2位西武とは1.5ゲーム差だ。西武は残り4試合あり、日本ハムは勝ち続けたうえで西武の負けを待つ立場だ。2位になれば、CSの最初の最大3試合をエスコンフィールドで戦える。CS出場はすでに決まっている日本ハムにとって、今日の1勝は「どこでCSを戦うか」に関わるというわけだ。"}, "5-06-a": {"meta": {"id": "5-06-a", "title": "清宮幸太郎の100号って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://npb.jp/bis/players/41545136.html", "https://www.nikkansports.com/baseball/news/202609260001489.html?mode=all"]}, "body": "## ひとことで\n==「**100号**」は、**清宮幸太郎**がプロ野球の公式戦で打った通算100本目のホームランという意味だ。== 9月27日終了時点で99本なので、今日1本出れば到達する。\n\n## しくみ\n**通算本塁打**は、その年だけではなくプロ入り後の本塁打を全部足した数字だ。清宮は2018年に7本を打ち、2026年はここまで23本。積み上げた合計が**99本**になっている。\n\n==100という数字そのものに得点が増える特別ルールはない。== ただ、長く一軍で長打を重ねたことが目に見える節目なのだ。\n\n![ホームランを打つ打者のスイング](https://upload.wikimedia.org/wikipedia/commons/c/cd/Reggie_Jackson_bats_at_Yankee_Stadium.jpg \"出典：Wikimedia Commons／Jim Accordino／Creative Commons Attribution 2.0 Generic\")\n\n## 今日の試合で見るなら\n==**清宮幸太郎**の打席では、打球が外野フェンスを越えるかだけを追えばいい。== **ジャクソン**の失投（投手が狙いを外した甘い球）を一振りで仕留めれば、その一発が通算100号になる。"}, "5-06-b": {"meta": {"id": "5-06-b", "title": "山口航輝の「40年ぶり」って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://npb.jp/bis/players/91895138.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/86265", "https://pacificleague.com/news/2026/9/10054909"]}, "body": "## ひとことで\n==**山口航輝**が今季30本塁打に到達したのが、ロッテの日本人選手では1986年の**落合博満**以来40年ぶりだった、という意味だ。==\n\n## しくみ\n「**30本**」は1シーズンで打ったホームラン数の区切りだ。外国人選手を含めればロッテにも30本以上の例はあるが、日本人選手に限ると長い空白があったのだ。\n\n山口は9月15日の日本ハム戦で**29号と30号**を2打席連続で放った。==30号は9回の決勝本塁打で、その一発が試合の勝敗と**40年ぶり**の記録を同時に決めた。==\n\n![ホームランを打つ打者のスイング](https://upload.wikimedia.org/wikipedia/commons/c/cd/Reggie_Jackson_bats_at_Yankee_Stadium.jpg \"出典：Wikimedia Commons／Jim Accordino／Creative Commons Attribution 2.0 Generic\")\n\n## 今日の試合で見るなら\n今日の相手も**日本ハム**だ。山口は今季**32本塁打**まで伸ばしているので、==打席では「もう30本を超えた長距離打者」として、外野へ上がる大きな打球に注目するといい。=="}, "5-06-c": {"meta": {"id": "5-06-c", "title": "ジャクソンの10勝目って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\n**アンドレ・ジャクソン**は今季9勝8敗で、==今日勝てばシーズン**10勝目**になる。== 2025年もDeNAで10勝しているので、達成すれば2年連続の2桁勝利なのだ。\n\n## しくみ\n投手の「**勝ち**」は、登板した試合でチームが勝てば自動で付くわけではない。**先発投手**（試合の最初から投げる投手）なら、==基本は5回以上を投げ、交代したあとも味方がリードを守ると勝ち投手になる。==\n\n「**10勝**」は1年で10試合の勝ち投手になった、という区切りだ。ジャクソンは今季ロッテで9勝しており、チーム内でも最多タイの勝ち星を持っている。\n\n![投手と打者が向き合う野球の試合](https://upload.wikimedia.org/wikipedia/commons/7/71/Typical_baseball_game.JPG \"出典：Wikimedia Commons／Imageman~commonswiki／Public domain\")\n\n## 今日の試合で見るなら\n==ロッテが先に点を取り、**ジャクソン**が5回以降までリードを守れるかを見るといい。== そのままロッテが勝てば、今日が今季10勝目になる可能性があるのだ。"}, "5-06": {"meta": {"id": "5-06", "title": "今日の注目選手は？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-06-a", "5-06-b", "5-06-c"], "related": ["5-07"], "sources": ["https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/43745159.html", "https://www.nikkansports.com/baseball/news/202609150001922.html", "https://pacificleague.com/news/2026/9/10054909", "https://www.mlb.com/news/hank-aaron-passes-babe-ruth", "https://baseballhall.org/discover/shortstops/the-other-side-of-715"], "episode": "v2"}, "body": "## ひとことで\n==今日なら、日本ハムの**清宮幸太郎**、ロッテの**山口航輝**をまず追うと分かりやすい。==\n\nロッテ先発の**アンドレ・ジャクソン**も含め、3人とも、きょう動くかもしれない節目を持っているのだ。\n\n## しくみ\n**清宮幸太郎**は通算本塁打（プロ入り後に打ったホームランの合計）が**99本**で、あと1本で100号だ。これは今季だけの数字ではなく、2018年の1年目から積み上げた合計なのだ。\n\n**山口航輝**は今季**32本塁打**。\n\n9月15日に30号へ到達し、==ロッテの日本人選手では1986年の**落合博満**以来40年ぶりに、1シーズン30本へ乗せた。==\n\n**アンドレ・ジャクソン**は今季9勝8敗、防御率3.44。==今日勝てば**10勝目**で、2025年の10勝に続く2年連続の2桁勝利になる。==\n\n![ホームランを打つ打者のスイング](https://upload.wikimedia.org/wikipedia/commons/c/cd/Reggie_Jackson_bats_at_Yankee_Stadium.jpg \"出典：Wikimedia Commons／Jim Accordino／Creative Commons Attribution 2.0 Generic\")\n\n## おもしろエピソード\n1974年4月8日、アメリカ大リーグの**ハンク・アーロン（歴代屈指の本塁打打者）**が通算715号を打ち、それまでの最多本塁打記録を更新した。アトランタの本拠地でベースを回っていると、興奮した17歳のファン2人が客席からグラウンドへ飛び出し、二塁と三塁の間で本人の横を走って祝った。\n\n2人はすぐに警備員に止められ、その夜は留置されたが、のちにアーロンと再会している。もちろん観客がグラウンドへ入ってはいけないが、==大記録の瞬間に、ファンまで「走者」のように並んで走った出来事なのだ。==\n\n## 今日の試合で見るなら\n日本ハムの攻撃では、清宮の打席で「あと1本」を思い出せばいい。ロッテの攻撃では、山口の大きな打球を追う。\n\nロッテの守りでは、ジャクソンが勝ち投手の権利（リードした状態で5回以上を投げ終え、勝ち投手になれる資格）を持って降板できる展開になるかを見る。こう見ておけば、3つの節目を同時に追えるのだ。"}, "5-07-a": {"meta": {"id": "5-07-a", "title": "各スタメンのカード（18人）", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html"]}, "body": "## ひとことで\n==両チームの予想スタメン**18人**は、それぞれカードで特徴と見どころを確認できる。== 全員を先に覚える必要はないのだ。\n\n## しくみ\n**スタメン**（試合開始時に出る選手）は両チーム9人ずつだ。カードには、打つ特徴、守る場所、最近の調子など、==観戦中に使いやすい情報をまとめている。==\n\n![球場のスコアボードに先発メンバーが表示されている様子](https://upload.wikimedia.org/wikipedia/commons/7/75/Kose_baseball_stadium_scoreboard_member%282012.8.11_Yokohama_DeNA_vs_Chunichi%29.JPG \"出典：Wikimedia Commons／OCIAG／Creative Commons Attribution-Share Alike 3.0 Unported\")\n\n## 今日の試合で見るなら\n上の「**スタメン**」から選手カードが見られる。==まず1番打者、次に得点につながりやすい**中軸**（打線の中心になる打者）だけ見ておくと、試合の流れを追いやすい。=="}, "5-07-b": {"meta": {"id": "5-07-b", "title": "両先発投手のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n==今日の**予告先発**（試合の最初から投げる予定の投手）は、ロッテが**アンドレ・ジャクソン**だ。==\n\n日本ハムは**福島蓮**で、2人とも右投手なのだ。\n\n## しくみ\n**先発投手**は、試合の最初の数回を任される投手だ。ジャクソンは今季9勝8敗、防御率3.44、福島は5勝4敗、防御率3.35。==数字だけでなく、球種や最近の登板もカードで確認できる。==\n\n![投手と打者が向き合う野球の試合](https://upload.wikimedia.org/wikipedia/commons/7/71/Typical_baseball_game.JPG \"出典：Wikimedia Commons／Imageman~commonswiki／Public domain\")\n\n## 今日の試合で見るなら\n上の「**スタメン**」から選手カードが見られる。\n\n==ロッテの守りでは**ジャクソン**、日本ハムの守りでは**福島蓮**のカードを開き、どんな球で打者を抑えようとしているかを見るといい。=="}, "5-07-c": {"meta": {"id": "5-07-c", "title": "スタメン候補・ブルペン・代打代走のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==試合は**スタメン**（試合開始時に出る選手）だけで終わらない。== 途中から出る選手を見ると、監督がどこで勝負をかけたか分かるのだ。\n\n## しくみ\n**ブルペン**は、途中から投げる投手たちのことだ。**代打**は打つために交代で出る選手、代走は走るために交代で出る選手を指す。\n\nスタメン候補も含め、実際に誰が出るかは試合展開で変わる。==だから先に全員を覚えるより、交代が告げられた時にカードを開く方が効率がいいというわけだ。==\n\n![ダッグアウトから試合を見る選手たち](https://upload.wikimedia.org/wikipedia/commons/5/57/2015_AAA_All-Star_Game_dugout.jpg \"出典：Wikimedia Commons／Minda Haas Kuhlmann／Creative Commons Attribution 2.0 Generic\")\n\n## 今日の試合で見るなら\n上の「**スタメン**」から選手カードが見られる。==場内アナウンスで新しい名前が呼ばれたら、その選手だけ確認すれば十分だ。=="}, "5-07-d": {"meta": {"id": "5-07-d", "title": "両監督のカード", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "sources": ["https://www.marines.co.jp/news/detail/202500743647.html", "https://www.fighters.co.jp/news/detail/202500796590.html"]}, "body": "## ひとことで\n==今日の監督は、ロッテが**サブロー**、日本ハムが**新庄剛志**だ。== 選手交代や投手交代を決める、試合中の指揮役なのだ。\n\n## しくみ\n**監督**は、誰をスタメン（試合開始時に出す選手）にするか、いつ投手を代えるか、誰を代打や代走で送るかを決める。==スコアだけでは見えないが、交代のタイミングには監督の考えが出やすい。==\n\n![ダッグアウトから試合を見る選手たち](https://upload.wikimedia.org/wikipedia/commons/5/57/2015_AAA_All-Star_Game_dugout.jpg \"出典：Wikimedia Commons／Minda Haas Kuhlmann／Creative Commons Attribution 2.0 Generic\")\n\n## 今日の試合で見るなら\n上の「**スタメン**」から両監督のカードが見られる。==選手交代が続いた場面でカードを開くと、「なぜこの選手を今出したのか」を考える手がかりになるのだ。=="}, "5-07": {"meta": {"id": "5-07", "title": "スタメン表（選手・監督カード）", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-07-a", "5-07-b", "5-07-c", "5-07-d"], "related": ["4-02", "5-06"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/news/detail/20180511_01.html"], "episode": "v2"}, "body": "## ひとことで\n==**スタメン**（試合開始時に出る選手）は、打順と守る場所を見るための名簿だ。== このガイドでは、選手名を覚えるより先にカードを開けば十分なのだ。\n\n## しくみ\n今日の**予想スタメン**は、ロッテ9人、日本ハム9人の計**18人**だ。これに両チームの先発投手（試合の最初から投げる投手）、途中から出る候補、両監督のカードがある。\n\n==実際のスタメンは試合前の発表で変わることがある。== 予想と違う名前が出ても異常ではなく、その日の相手投手や選手の状態で入れ替わるのだ。\n\n![球場のスコアボードに先発メンバーが表示されている様子](https://upload.wikimedia.org/wikipedia/commons/7/75/Kose_baseball_stadium_scoreboard_member%282012.8.11_Yokohama_DeNA_vs_Chunichi%29.JPG \"出典：Wikimedia Commons／OCIAG／Creative Commons Attribution-Share Alike 3.0 Unported\")\n\n## おもしろエピソード\n1966年5月22日、札幌円山球場で**東京オリオンズ（今のロッテ）**と**東映フライヤーズ（現在の日本ハムにつながる球団）**が対戦した。当時のスコアボードは選手名ではなく、守る場所を表す番号を打順に並べていた。\n\nところがこの日は、両チームとも9人分が「543789261」とまったく同じ並びになった。スタンドでは「表示の間違いでは？」と首をかしげる人が出たが、本当に偶然だったという。==ロッテと日本ハムにつながる2球団が、同じスタメンの並びを作った珍事なのだ。==\n\n## 今日の試合で見るなら\n上の「スタメン」から選手カードが見られる。名前が分からなくなったら、打席に入った選手やマウンド（投手が投げる場所）にいる投手のカードだけ開けばいい。"}, "5-08-a": {"meta": {"id": "5-08-a", "title": "雨が降ったら試合はどうなる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-08", "7-09"], "sources": ["https://npb.jp/npb/2025rules.html", "https://www.marines.co.jp/ticket/faq/", "https://www.marines.co.jp/ticket/refund/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n屋外球場なので、雨が強ければ**開始を遅らせる、中断する、中止する**ことがある。==少し降っただけで必ず中止になるわけではなく、安全に続けられるかで決まるのだ。==\n\n## しくみ\n試合前なら開催を見合わせたり、中止にしたりする。始まったあとも、天候やグラウンド状態で安全な試合が難しければ中断や打ち切りがあり得る。公認野球規則でも、天候や球場状態などを理由に試合を延期・中止できる。\n\n雨天中止になったロッテ主催試合のチケットは、購入方法に応じて払い戻しの扱いが変わる。球団は原則、==中止翌日から2週間を払戻期間==として案内している。\n\n## 今日の試合で見るなら\nNPBの日程表示では、今日のZOZOマリンは**くもり時々雨**だ。==雨が来たら、まず場内アナウンスと球団公式の案内を見るのが確実だ。== ジャクソンや福島蓮が投げ始めたあとでも、中断はあり得るのだ。"}, "5-08-b": {"meta": {"id": "5-08-b", "title": "海風の強さは試合前にわかる？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-08", "2-06-a"], "sources": ["https://sports.yahoo.co.jp/official/detail/2024051700070-spnaviow", "https://www.marines.co.jp/news/detail/00000651.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nだいたいは天気予報で見当をつけられるが、==球場に入ったら**バックスクリーンの風向・風速表示**を見るのがいちばんわかりやすい。== ZOZOマリンには、風を数字で見られる表示があるのだ。\n\n## しくみ\nZOZOマリンは海に近く、強い風が名物の球場だ。球場のバックスクリーンには**風向と風速**が表示されるので、試合前から「どちら向きに、どれくらい吹いているか」を確認できる。\n\n風は時間によって変わる。==予報だけで決めつけず、入場後の表示をもう一度見る==とよい。\n\n## 今日の試合で見るなら\nNPBの日程ページでは今日の天気は**くもり時々雨**だが、風速までは出ていない。==開場後にまず風向・風速表示を見ておこう。== **ジャクソン**の変化球や、**山口航輝・万波中正**の高い打球が風にどう動かされるかを見ると、マリンらしさがわかりやすいのだ。"}, "5-08": {"meta": {"id": "5-08", "title": "今日の天気と風は？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": [], "related": ["7-04", "2-03-b"], "sources": ["https://www.data.jma.go.jp/yoho/data/jishin/met/kishoushien_Chiba_Chiba-shi.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://weathernews.jp/soramagazine/201610/06/", "https://www.mlb.com/news/stu-miller-1961-all-star-game-defined-by-balk-c136097692"], "episode": "v2"}, "body": "## ひとことで\n==今日の**ZOZOマリン**は、雨と風を意識して観る試合なのだ。== 気象庁の11時発表では、試合開始の18時ごろは雨、**24℃、風速8m/s**の予想になっている。\n\n## しくみ\n18時までの3時間雨量は**5〜9mm**の予想だ。21時も雨で、気温23℃、風速4m/sと見込まれている。==試合中ずっと同じ降り方や風とは限らないので、空と球場の様子も合わせて見るとよい。==\n\n野球では、風の影響を受けやすいのは**高く上がった打球**だ。空中にいる時間が長いほど、打球は風に押される時間も長くなる。逆に、速い**ゴロ**（地面を転がる打球）は風の影響が比較的小さい。\n\nただし、気象庁の数字は千葉市付近の予報だ。球場内の風向や強さが、その数字と完全に同じとは限らない。==外野の旗や選手のユニホーム、外野手が打球に合わせて動く方向を見ると、その瞬間の風がわかりやすいのだ。==\n\n![スコアボード上部の旗が風を受けている野球場](https://upload.wikimedia.org/wikipedia/commons/7/75/Kose_baseball_stadium_scoreboard_member%282012.8.11_Yokohama_DeNA_vs_Chunichi%29.JPG \"出典：Wikimedia Commons／OCIAG／Creative Commons Attribution-Share Alike 3.0 Unported\")\n\n## おもしろエピソード\n2005年10月22日、千葉マリンスタジアム（今のZOZOマリン）で行われたロッテ対阪神の日本シリーズ第1戦は、7回に突然の濃霧に包まれた。外野まで見通しにくくなって試合は中断され、結局そのまま終了した。==日本シリーズの試合が霧で打ち切られるという、異例の出来事だったのだ。==\n\n風で有名になった投手もいる。1961年、サンフランシスコのキャンドルスティック・パークで行われた大リーグのオールスター戦で、**スチュ・ミラー（当時の投手）**は強風にあおられて体勢を崩し、ボーク（投手の反則動作）を取られた。「マウンドから吹き飛ばされた」と語り継がれたが、本人は後に、実際には数センチよろめいただけだと説明している。\n\n## 今日の試合で見るなら\nロッテの山口航輝や日本ハムの清宮幸太郎が高い打球を上げたら、ボールだけでなく外野手も見てほしい。最初に落下地点へ走ったあと、途中で進路を変えたなら、風を読み直している可能性がある。\n\n特に18時前後は風速8m/sの予想だ。大きなフライ（高く上がった打球）が上がるたびに、旗の向きと外野手の動きをセットで見ると、今日のマリンらしい「風も守備の相手」という感覚がつかみやすいのだ。"}, "5-09-a": {"meta": {"id": "5-09-a", "title": "高野脩ってどんな投手？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-09", "5-12"], "sources": ["https://npb.jp/bis/players/31035157.html", "https://pacificleague.com/news/2026/9/86609"]}, "body": "## ひとことで\n前日の勝利投手、**高野脩汰**はロッテの左腕だ。==9月に先発へ回ってから安定し、前日は6回1失点で4勝目を挙げた。==\n\n## しくみ\n高野は184cm、88kgの**左投左打**。出雲商、関西大、日本通運を経て、2022年ドラフト4位でロッテに入った。\n\n9月27日の日本ハム戦は**6回99球、5安打、1四球、8奪三振、1失点**。3回に進藤勇也へ本塁打を打たれたが、その後は追加点を許さなかった。\n\nこの試合で==先発転向後4試合連続のQS==。先発に回ってからは3勝1敗、防御率1.67と好成績を残している。\n\n## 今日の試合で見るなら\n今日は高野ではなく**ジャクソン**がロッテの先発予定だ。==昨日は左腕、今日は右腕という違い==を、日本ハム打線がどう攻略するか比べるとおもしろいのだ。"}, "5-09-b": {"meta": {"id": "5-09-b", "title": "井上広大の決勝打って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-09", "5-10"], "sources": ["https://sports.yahoo.co.jp/official/detail/2026092700184-spnaviow", "https://baseball.yahoo.co.jp/npb/game/2021039466/top", "https://npb.jp/bis/players/31335151.html"]}, "body": "## ひとことで\n前日の**井上広大**の決勝打は、1-1の4回、1死一、三塁で放った左前への適時打だ。==この一打でロッテが2-1と勝ち越し、そのまま一度も追いつかれなかった。==\n\n## しくみ\n「決勝打」は、最終的に勝敗を分けるリードを生んだ一打のことだ。\n\n4回裏、ロッテは寺地隆成の安打、小川龍成の犠打、髙部瑛斗の安打で**1死一、三塁**。ここで8番の井上が三遊間を破り、三塁走者が生還した。\n\nその後、山口航輝の2点適時打も出て4-1。==井上の1点が、3点を奪う回の入口になったのだ。==\n\n## 今日の試合で見るなら\n井上は前々日の9月26日にも7号2ランを放ち、前日は決勝打だった。==今日も予想スタメンなら8番・一塁。== 上位打線が作った走者を返す場面で、もう一度打席が回るかに注目するとよいのだ。"}, "5-09": {"meta": {"id": "5-09", "title": "前日（9/27）の試合はどうだった？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-09-a", "5-09-b"], "related": ["5-01", "5-10", "5-11"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/bis/teams/results_m_index.html", "https://sports.yahoo.co.jp/official/detail/2026092700184-spnaviow", "https://baseball.yahoo.co.jp/npb/game/2021039466/top"]}, "body": "## ひとことで\n前日9月27日は、**ロッテが日本ハムに6-1で勝った**。==ロッテは同点にされたあと、4回に井上広大の一打で勝ち越し、そのまま突き放したのだ。==\n\n## しくみ\nロッテは1回、**寺地隆成**の適時二塁打（走者をホームへ返す二塁打）で先制した。日本ハムは3回、**進藤勇也**の8号ソロ本塁打で1-1に追いつく。\n\n流れが変わったのは4回裏だ。ロッテは1死一、三塁から**井上広大**が左前へ適時打を放ち、2-1と勝ち越した。さらに2死満塁で**山口航輝**が2点適時打。==この回だけで3点を取り、4-1に広げた。==\n\n8回には**髙部瑛斗**が2点適時二塁打を放ち、6-1。ロッテは10安打で6点を取った。\n\n投げては先発の**高野脩汰**が6回99球、5安打1四球、8奪三振、1失点。3回に本塁打を浴びたあとも崩れず、4勝目を挙げた。==日本ハムは6安打を放ったが、得点は進藤の本塁打による1点だけだった。==\n\n## おもしろエピソード\n高野は9月に先発へ回ってから、前日の試合で**4試合連続QS**（先発が6回以上を投げて3自責点以内）を達成した。中継ぎから先発へ役割が変わっても、安定して試合を作っているのだ。\n\n## 今日の試合で見るなら\n今日も同じZOZOマリンでロッテ対日本ハムだ。ロッテは前日に勝ち越し打を放った**井上広大**や、3安打2打点の**髙部瑛斗**がそのまま勢いを持ち込めるかが見どころになる。\n\n日本ハムは2位争いのため勝利が必要だ。==昨日1点に抑えられた打線が、今日は右腕**アンドレ・ジャクソン**から早い回に点を取れるか==を見ると、前日との違いがつかみやすいのだ。"}, "5-10-a": {"meta": {"id": "5-10-a", "title": "山口航輝の33号はありそう？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-06-b", "5-10", "5-12-a"], "sources": ["https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0922/m-b-24/", "https://npb.jp/scores/2026/0915/f-m-22/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n==**33号は十分にあり得るが、「出そう」と断言できるものではない**==。山口航輝は9月27日終了時点で**32本塁打**を放っており、1球の失投を本塁打にできる打者だからだ。\n\n## しくみ\n\n本塁打は、打者の調子だけで決まらない。投手の球種、コース、風、打席で何球見られるかでも変わる。山口は長打率.588で、単打より長打の価値が大きいタイプだ。\n\n9月22日には32号を放ち、9月27日も2安打している。さらに9月15日の日本ハム戦では**29号、30号を1試合で2本**打った。==今日の相手だから打てる、とまでは言えないが、実際にこの対戦で一発を出している==のは見どころになる。\n\n## 今日の試合で見るなら\n\n山口の打席では、まず日本ハム先発の**福島蓮**が初球から強く勝負するかを見るといい。福島の直球やフォークが甘く入れば、一振りで33号になる可能性がある。\n\n逆に四球でも失敗ではない。==山口を警戒して歩かせれば、それだけ次の打者に走者を置いて勝負することになる==。本塁打だけでなく、相手がどう警戒するかも見どころなのだ。"}, "5-10-b": {"meta": {"id": "5-10-b", "title": "西川史礁ってどんな選手？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-07-a", "5-10"], "sources": ["https://npb.jp/bis/players/21625150.html", "https://npb.jp/news/detail/20251126_01.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n\n**西川史礁**は、広角に強い打球を飛ばすロッテの若い外野手だ。==2025年のパ・リーグ新人王で、2年目の今季も打線の中心にいる==。\n\n## しくみ\n\n青山学院大から2024年ドラフト1位で入団した右打者だ。1年目の2025年は打率.281、27二塁打を記録し、新人王を受賞した。\n\n2026年9月27日終了時点では**打率.292、145安打、8本塁打**。本塁打だけを狙う大砲ではなく、強い打球を広い方向へ飛ばして安打を重ねるタイプだ。==「まず塁に出る人」と「長打もある人」を一人で兼ねられるのが強み==なのだ。\n\n## 今日の試合で見るなら\n\n予想では1番・左翼だ。最初の打席で出塁すると、すぐ後ろに**山口航輝**がいるため、日本ハム側は序盤から走者を背負うことになる。\n\n守備では左翼に飛んだ打球への一歩目も見てほしい。==打つだけでなく、1番打者として何回塁に出るか==を見ると、西川の価値が分かりやすい。"}, "5-10": {"meta": {"id": "5-10", "title": "今日のロッテ打線の見どころは？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-10-a", "5-10-b"], "related": ["5-06", "5-07", "5-12"], "sources": ["https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/scores/2026/0927/m-f-23/", "https://npb.jp/scores/2026/0922/m-b-24/"]}, "body": "## ひとことで\n\n今日のロッテ打線は、==**山口航輝の一発**と、直近で当たっている下位打線がつながるか==が見どころだ。前日9月27日は6得点しており、上位だけでなく**井上広大**や**髙部瑛斗**も得点に絡んでいる。\n\n## しくみ\n\n打線は、1番から9番までが順番に打つ並びのことだ。強い打者が一人いても、その前に走者がいなければ本塁打は1点で終わる。逆に、前の打者が塁に出れば同じ長打でも2点、3点になりやすい。\n\nロッテで最も分かりやすい長打役が**山口航輝**だ。9月27日終了時点で**32本塁打**。ただし今日は山口だけを見ればいいわけではない。==**西川史礁が塁に出て、山口や中軸へ回せるか**==を見ると打線の形が分かりやすい。\n\nもう一つは下位打線だ。**髙部瑛斗**は9月25〜27日の3試合で計6安打5打点、**井上広大**も26日に7号2ラン、27日に勝ち越し適時打を放っている。下位から走者が出れば、次の回に1番へつながりやすくなるのだ。\n\n## おもしろエピソード\n\n山口は9月22日のオリックス戦で32号を放った。9月15日の日本ハム戦では29号と30号を同じ試合で打っており、30号は9回の決勝弾だった。\n\n西川史礁は前日の初回に内野安打で出塁し、先制のホームを踏んでいる。==**「誰が打ったか」だけでなく、「誰が塁に出て点になったか」まで見ると打線が立体的に見える**==。\n\n## 今日の試合で見るなら\n\n最初に見るのは**西川史礁→山口航輝**の流れだ。西川が出塁した直後に山口へ回れば、日本ハム先発の**福島蓮**は一発だけでなく走者も気にしなければならない。\n\nそして7〜9番で走者が出たら、次の1番まで目を離さないことだ。==下位打線が作った走者を、上位が返せるか==。そこを見ると、今日のロッテ打線がつながっているかが分かる。"}, "5-11-a": {"meta": {"id": "5-11-a", "title": "清宮・万波・野村の中軸って？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-06-a", "5-11", "5-11-b"], "sources": ["https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n**中軸**とは、打線の中心になる3〜5番あたりの強打者のことだ。今日の日本ハムでは、==**清宮幸太郎・野村佑希・万波中正の長打力**==が得点の中心になる。\n\n## しくみ\n\n9月27日終了時点で、清宮は**23本塁打**、野村は**17本塁打**、万波は**21本塁打**。3人とも一打で二塁打や本塁打にできるため、走者がいる場面では特に怖い並びになる。\n\nただし役割は少し違う。清宮は左打ちで四球も選べる。野村は右打ちで直近3試合9打数3安打。万波は大きな一発と強肩が魅力だが、最近は安打が少ない。\n\n==**3人全員が本塁打を狙うのではなく、誰かが塁に出て次へつなぐことも大切**==なのだ。\n\n## 今日の試合で見るなら\n\nロッテ先発の**ジャクソン**がこの3人にどう投げ分けるかを見るといい。清宮には左打者への攻め、野村と万波には力勝負が増えるかもしれない。\n\n==走者ありでこの3人に回ったら、日本ハムの大きな得点チャンス==だ。打球が外野の頭を越えるかに注目すると分かりやすい。"}, "5-11-b": {"meta": {"id": "5-11-b", "title": "レイエスの離脱の影響は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-11", "5-11-a"], "sources": ["https://www.fighters.co.jp/en/news/detail/202600947378.html", "https://npb.jp/bis/2026/stats/idb1_f.html"]}, "body": "## ひとことで\n\n影響は大きい。**フランミル・レイエス**は9月16日に右ハムストリングス肉離れと診断され、==**32本塁打・82打点の打者を欠いた状態**==で終盤戦を戦っている。\n\n## しくみ\n\nレイエスは9月27日終了時点で打率.313、32本塁打、82打点。長打を打つだけでなく、多くの走者をホームへ返してきた打者だ。\n\nこういう打者が抜けると、相手投手は残った強打者をより厳しく攻めやすくなる。たとえば清宮を歩かせても、後ろにレイエスがいないため以前とは打線の圧力が変わる。\n\nそのため、**野村佑希**が4番を担い、**万波中正**や若手が得点を補う必要がある。==一人で穴を埋めるのではなく、複数人で打席をつなぐ形が必要==なのだ。\n\n## 今日の試合で見るなら\n\n清宮が四球で歩いた後の打者に注目してほしい。そこで野村や万波が返せれば、レイエス不在でも打線が機能していると言える。\n\n==「レイエスがいないから誰が4番か」より、「得点の仕事を誰が分担するか」==を見ると影響が分かりやすい。"}, "5-11": {"meta": {"id": "5-11", "title": "今日の日本ハム打線の見どころは？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-11-a", "5-11-b"], "related": ["5-06", "5-07", "5-12"], "sources": ["https://npb.jp/bis/2026/stats/idb1_f.html", "https://npb.jp/bis/teams/index_f.html", "https://npb.jp/scores/2026/0927/m-f-23/", "https://www.fighters.co.jp/en/news/detail/202600947378.html"]}, "body": "## ひとことで\n\n今日の日本ハム打線は、==**水野達稀が塁に出て、清宮幸太郎・野村佑希・万波中正へ走者を残せるか**==がポイントだ。主砲の**レイエス**が離脱しているため、一人の一発より打線全体で穴を埋める必要がある。\n\n## しくみ\n\n日本ハムは直近3試合の得点が**0点、2点、1点**と少ない。打線が苦しいときは、長打だけでなく、四球や単打で走者をためることが重要になる。\n\n予想1番の**水野達稀**は、9月27日までに打率.285、11本塁打、15盗塁。先頭打者が出ると、投手は走者も気にしながら中軸と勝負しなければならない。==**1番が出塁できるかで、3〜5番の一打の価値が変わる**==のだ。\n\n中心になるのは**清宮幸太郎、野村佑希、万波中正**。清宮は23本塁打、野村は17本塁打、万波は21本塁打を記録している。一方で万波は直近3試合で11打数1安打と、復帰後の調子が上がりきっていない。\n\n## おもしろエピソード\n\n清宮は通算100本塁打まであと1本だ。記録がかかる打席では、相手投手も簡単な球を投げにくくなる。\n\n野村は前日の9回に左前打を放っており、直近3試合では9打数3安打。==打線全体が低調な中でも、野村は比較的安打が出ている==。\n\n## 今日の試合で見るなら\n\nロッテ先発は右腕の**アンドレ・ジャクソン**だ。まず1回表、水野が出塁して清宮まで走者を残せるかを見るといい。\n\nその後は清宮の100号だけを待つのではなく、**野村と万波がどう続くか**を見る。==レイエス不在でも中軸が3人で得点を作れるか==が、今日の日本ハム打線の見どころなのだ。"}, "5-12-a": {"meta": {"id": "5-12-a", "title": "福島蓮はどこまで投げそう？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-12", "5-10"], "sources": ["https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0915/f-m-22/"]}, "body": "## ひとことで\n\n目安は==**3〜5回、60〜80球くらいで次の投手へつなぐ展開**==だ。断定はできないが、**福島蓮**は最近まで救援で短いイニングを投げており、今日は約2カ月半ぶりの先発だからだ。\n\n## しくみ\n\n福島は今季26試合で5勝4敗1セーブ5ホールド、防御率3.35。9月は救援7試合で無失点と好調だが、救援は通常、先発より短い距離を全力で投げる役割だ。\n\n先発に戻ると、同じ投手でも必要な体力配分が変わる。1回から全力で飛ばせば、4回や5回で球数が増えることもある。==今日のポイントは「何点取られたか」だけでなく、「何球で何回まで行けたか」==なのだ。\n\n## 今日の試合で見るなら\n\n3回終了時点で球数が**50球前後**なら、次の回からブルペンが忙しくなる可能性がある。逆に少ない球数で抑えていれば、5回以降も続投しやすい。\n\nロッテの**山口航輝、西川史礁**らを相手に、==走者をためずに短い回で切れるか==を見ると、福島がどこまで投げられそうか予想しやすい。"}, "5-12-b": {"meta": {"id": "5-12-b", "title": "ロッテの勝ちパターン（中継ぎ・抑え）は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-12", "5-07-c"], "sources": ["https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/scores/2026/0925/l-m-22/", "https://npb.jp/scores/2026/0926/l-m-23/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n今日のロッテが終盤にリードしていたら、==**中森俊介か八木彬でつなぎ、9回は横山陸人**==が基本線だ。左の**鈴木昭汰**は9月25〜27日に3連投しており、今日は休養の可能性が高い。\n\n## しくみ\n\n**勝ちパターン**とは、リードしている試合の終盤に出す信頼度の高い救援投手の並びだ。ロッテでは中森が7勝1敗16ホールド、防御率2.35。八木は9勝1敗11ホールド、防御率2.17と安定している。\n\n最後を任される**横山陸人**は33セーブ、防御率2.50。9回に3点以内のリードなど、セーブが付く場面で出ることが多い。\n\nただし毎日同じ順番とは限らない。==連投している投手を休ませることも、長いシーズンでは大事な作戦==なのだ。\n\n## 今日の試合で見るなら\n\n7回以降にロッテが1〜3点リードしていたら、ブルペンから誰が出てくるかを見るといい。**中森、八木、横山**なら、勝ち切るための形に入ったと考えやすい。\n\nもし鈴木が4日連続で出てきたら、==それだけ監督がその場面を重要だと見ているサイン==になる。"}, "5-12": {"meta": {"id": "5-12", "title": "今日の継投はどうなりそう？", "category": "5", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["5-12-a", "5-12-b"], "related": ["5-07", "5-10", "5-11"], "sources": ["https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/scores/2026/0925/l-m-22/", "https://npb.jp/scores/2026/0926/l-m-23/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n今日は両チームとも、==**先発を長く引っ張るより、試合の途中から救援投手を細かくつなぐ展開**==になりやすい。特に日本ハムは、約2カ月半ぶりに先発する**福島蓮**をどこで代えるかが最初の分岐点だ。\n\n## しくみ\n\n**継投**とは、先発投手から中継ぎ、抑えへ投手を交代しながら試合を進めることだ。投手は疲れるほど球速や制球が落ちやすいため、監督は「まだ投げられるか」だけでなく、次の打者との相性や翌日の予定も考える。\n\n日本ハムの福島は今季5勝4敗1セーブ5ホールド、防御率3.35。9月は救援で投げており、今日は7月12日以来の先発だ。==**先発用の長い投球を最近していないため、早めの継投を想定して見ると分かりやすい**==。\n\n日本ハムの後ろには左の**島本浩也、堀瑞輝**、右の**孫易磊**、最後には29セーブの**柳川大晟**がいる。ロッテは**中森俊介、八木彬、横山陸人**が終盤の軸になる。\n\nただしロッテの**鈴木昭汰**は9月25〜27日に3連投している。==今日もし登板すれば、それだけ重要な場面だと考えられる==。\n\n## おもしろエピソード\n\n中森は救援で7勝1敗、八木は9勝1敗。中継ぎ投手なのに勝ち星が多いのは、同点や僅差で登板した直後に味方が勝ち越す試合が多いからだ。\n\n抑えの横山は33セーブだが、9月26日は9回に逆転サヨナラ負けを喫した。投手は前の失敗をすぐ次の試合で取り返すこともある。\n\n## 今日の試合で見るなら\n\nまず**福島が何回まで投げるか**。4回や5回で交代したら、日本ハムはそこから複数の投手を使うことになる。\n\nロッテが終盤にリードしていたら、7〜9回の名前を覚えるといい。==中森か八木でつなぎ、最後に横山が出れば「勝ちパターン」らしい流れ==だ。反対に違う投手が出れば、連投や相性を考えた組み替えだと分かる。"}, "5-13-a": {"meta": {"id": "5-13-a", "title": "日本ハムの13勝10敗の中身は？", "category": "5", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["5-13", "5-09"], "sources": ["https://npb.jp/scores/2026/0915/f-m-22/", "https://npb.jp/scores/2026/0927/m-f-23/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n\n**13勝10敗**は、日本ハムが23試合で3勝多いという意味だ。==残り2試合をロッテが両方勝っても13勝12敗なので、日本ハムの今季勝ち越しはすでに確定している==。\n\n## しくみ\n\n13勝10敗を割合にすると、日本ハムの勝率はこのカードで約56.5％。数字だけ見ると日本ハム優勢だが、9月の2試合はロッテが連勝している。\n\n9月15日はロッテが7-6。9月27日は6-1だった。==シーズン全体では日本ハムが上でも、直近の直接対決ではロッテが勝っている==という、二つの見方が同時に成り立つのだ。\n\n残りは今日9月28日と10月1日の2試合。日本ハムが両方勝てば15勝10敗、ロッテが両方勝てば13勝12敗になる。\n\n## 今日の試合で見るなら\n\n前日ロッテが6-1で勝った直後なので、序盤の流れに注目だ。**日本ハムが先に点を取って流れを戻すか、ロッテが再び先手を取るか**で空気が変わる。\n\n==対戦成績は過去23試合の合計で、今日の1試合はそこへ新しく1つ数字を足す試合==と考えると分かりやすい。"}, "5-13": {"meta": {"id": "5-13", "title": "両チームの今季の対戦は？", "category": "5", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["5-13-a"], "related": ["5-01", "5-09", "5-10", "5-11"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0915/f-m-22/", "https://npb.jp/scores/2026/0927/m-f-23/"]}, "body": "## ひとことで\n\n9月27日終了時点の今季対戦は、==**日本ハムの13勝10敗**==だ。日本ハムが勝ち越しているが、差は3試合で、今日を含めてまだ2試合残っている。\n\n## しくみ\n\n同じリーグの球団は、シーズン中に何度も対戦する。そこで作られる「この相手には何勝何敗」という成績が**対戦成績**だ。\n\nロッテと日本ハムはここまで23試合を戦い、日本ハム13勝、ロッテ10勝。割合にすると日本ハムは約56.5％を勝っている計算になる。==13勝10敗は「毎回一方的」ではなく、数試合の差が積み重なった数字==と考えるといい。\n\n9月に入ってからの直接対決では、ロッテが15日に7-6、27日に6-1で勝っている。特に15日は、**山口航輝**が29号と30号を放ち、9回の30号が決勝点になった。\n\n## おもしろエピソード\n\n9月15日の試合は、ロッテが7-6で勝利。日本ハムは11安打、ロッテは9安打だったが、最終的には本塁打を含む得点の取り方でロッテが上回った。\n\n前日の9月27日はロッテが6-1で勝利。==同じ対戦カードでも、接戦の日と大差の日がある==のが野球なのだ。\n\n## 今日の試合で見るなら\n\n今日が**24回戦**で、10月1日にも同じZOZOマリンで対戦予定だ。日本ハムはすでに今季のこのカードで勝ち越しを決めている。\n\nそれでも今日の意味は大きい。==日本ハムは2位争い、ロッテは目の前の勝利と若手の結果を懸けて戦う==。対戦成績だけで今日の勝敗が決まるわけではない。"}, "6-01-a": {"meta": {"id": "6-01-a", "title": "1塁側の席で何をすればいい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-01", "6-01-c"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n==**1塁側の内野指定席B**なら、まず座ったまま手拍子で十分だ。== 慣れてきたら、選手名のコールや7回のタオル応援に加わればいいのだ。\n\n## しくみ\nロッテが攻撃すると、外野の**応援団**が演奏を始める。最初の1打席は周りを見て、==同じタイミングで手をたたくだけでいい。==\n\n選手名が繰り返し聞こえたら、その部分だけ声を出してもいい。**応援ボードや小旗**を使うなら、公式ルールでは自分の顔より下、自席の範囲内で使う決まりだ。\n\n**内野指定席**は、立ち上がって応援する前提の外野応援席とは別のエリアだ。後ろの人の視界をふさがないよう、基本は座ったまま楽しめばいい。\n\n![日本の野球場で旗を振って応援する観客席](https://upload.wikimedia.org/wikipedia/commons/5/52/Hanshin_Cheering_Section_%283894073459%29.jpg \"出典：Wikimedia Commons／ElCapitanBSC／Creative Commons Attribution-Share Alike 2.0 Generic\")\n\n## 今日の試合で見るなら\n1回裏、1番予想の**西川史礁**の打席から試してみよう。まず手拍子だけで流れをつかむ。続く**山口航輝**の打席で名前のコールまで加われれば、それで十分だ。\n\n==7回表が終わったら「**MARINES LUCKY 7**」だ。== タオルがあれば掲げ、なければ手拍子だけでも参加できるのだ。"}, "6-01-b": {"meta": {"id": "6-01-b", "title": "選手ごとの応援歌って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-01", "6-01-a"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.marines.co.jp/news/detail/202600832194.html"]}, "body": "## ひとことで\n==**選手応援歌**は、打者ごとに用意された短い応援曲だ。== 打席の間に何度も繰り返すので、最初は歌詞より名前と手拍子だけ拾えばいいのだ。\n\n## しくみ\n2026年の球団公式ページには、**山口航輝**、藤原恭大、佐藤都志也、小川龍成、寺地隆成などの個人応援歌が掲載されている。**西川史礁**と髙部瑛斗には新しい応援歌が加わった。\n\n![ライトスタンドで応援するマリーンズファン](https://upload.wikimedia.org/wikipedia/commons/0/02/20080504marinesfans.JPG \"出典：Wikimedia Commons／Yansukun／Public domain\")\n\n==全選手に必ず専用曲があるわけではない。== 公式ページには若手用、捕手用、その他の選手用といった**共通テーマ**も載っている。だから知らない曲が始まっても、間違いではないのだ。\n\n歌詞を事前に全部覚える必要はない。外野の演奏を聞き、周囲が**選手名**を呼ぶところだけ合わせれば、1打席のうちにだいたい形が見えてくる。\n\n## 今日の試合で見るなら\n予想スタメン（試合前に予想される先発メンバー）のうち、公式ページに個人応援歌が載っているのは、**西川史礁**、山口航輝、藤原恭大、佐藤都志也、寺地隆成、小川龍成、髙部瑛斗だ。==最初の西川の打席で曲調を聞き、**山口航輝**の打席で名前のコールに入ると分かりやすいのだ。=="}, "6-01-c": {"meta": {"id": "6-01-c", "title": "ジャンプしたり叫んだりしていいの？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-01", "6-01-a"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/news/detail/00008263.html"]}, "body": "## ひとことで\n選手名を呼んだり応援歌を歌ったりするのはいい。==ただし今日の**内野指定席B**では、立ち上がったりジャンプしたりせず、座席から声と**手拍子**で応援するのが基本だ。==\n\n## しくみ\n現行のスタジアムルールは、ホーム（ロッテ側）とビジター（相手チーム側）の**外野応援指定席**を==「立ち上がっての応援が許可されているエリア」==としている。**2022年**のルール変更時にも、立ち上がって応援できる席として両外野応援指定席が明記された。\n\n![ライトスタンドで応援するマリーンズファン](https://upload.wikimedia.org/wikipedia/commons/0/02/20080504marinesfans.JPG \"出典：Wikimedia Commons／Yansukun／Public domain\")\n\n一方、あなたの**内野指定席B**はそのエリアではない。==周囲の視界や観戦を妨げないよう、座ったまま手拍子をし、選手名や応援歌を声に出すのが安全なのだ。==\n\n球団は、ほかの観客の観戦を妨げる発言や行為があれば対応する場合があるとしている。声の大きさも、自分だけが目立つことより、**周りの応援**に合わせることを考えればいい。\n\n## 今日の試合で見るなら\n**山口航輝**が打席に入ったら、名前のコールは声に出していい。==ただし**33号**（今季33本目の本塁打）を期待して盛り上がっても、内野席ではジャンプせず、座ったまま拍手と声で参加するのだ。=="}, "6-01": {"meta": {"id": "6-01", "title": "ロッテの応援ってどんな感じ？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["6-01-a", "6-01-b", "6-01-c"], "related": ["6-02", "6-03"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/corp/history/2000.html", "https://bunshun.jp/articles/-/65185?page=2"], "episode": "v2"}, "body": "## ひとことで\n==ロッテの応援は、打者ごとの**応援歌**と手拍子、名前のコールが中心だ。== 全部覚えなくても、周りの手拍子に合わせるだけで十分参加できるのだ。\n\n## しくみ\nロッテの攻撃になると、外野の**応援団**が太鼓やトランペットで流れを作る。打者ごとの応援歌がある選手も多く、チャンスになると、チーム用の応援曲に切り替わる。\n\n公式の応援歌ページには、**山口航輝**、**西川史礁**、藤原恭大、佐藤都志也、髙部瑛斗らの曲が載っている。専用曲がない選手には、若手用や捕手用などの共通テーマが使われる場合もある。\n\n==あなたの席は**1塁側の内野指定席B**だ。== 外野応援席ほど立って動く場所ではないので、座ったまま手拍子をし、分かるところだけ名前を呼べばいい。応援は「全部できる人だけのもの」ではないのだ。\n\n![日本の野球場でトランペットを使って応援する観客](https://upload.wikimedia.org/wikipedia/commons/4/46/Band_%282626003628%29.jpg \"出典：Wikimedia Commons／non-euclidean photography／Creative Commons Attribution 2.0 Generic\")\n\n## おもしろエピソード\n2002年、ロッテでは選手ではなく**「マリーンズファン」**が、毎日スポーツ人賞の文化賞を受賞した。独特の応援文化が評価されたもので、応援団は受け取った賞金100万円を、自分たちのために使わず大きな応援旗の制作費に回した。\n\n==「応援する側」が表彰され、その賞金がまた応援道具になったのだ。== 今も外野席に大きな旗が揺れるとき、その文化が選手だけで作られてきたものではないと分かる。\n\n![日本の野球場で旗を振って応援する観客席](https://upload.wikimedia.org/wikipedia/commons/5/52/Hanshin_Cheering_Section_%283894073459%29.jpg \"出典：Wikimedia Commons／ElCapitanBSC／Creative Commons Attribution-Share Alike 2.0 Generic\")\n\n## 今日の試合で見るなら\nロッテの攻撃では、まず2番予想の山口航輝に注目すると分かりやすい。今季32本塁打（ホームラン）を打っていて、33号ならリーグ単独2位になる打者だ。打席に入ったら、外野の演奏と手拍子がどう変わるか聞いてみるといい。\n\n1番予想の西川史礁にも2026年の新応援歌がある。歌詞を知らなくても、周囲と同じ拍で手をたたけば自然に入れる。7回にはタオルを準備しておくと、応援の大きな区切りも体験できるのだ。"}, "6-02-a": {"meta": {"id": "6-02-a", "title": "3塁側・レフトスタンドの日本ハムファンは何をしてる？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-02", "6-01"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.fighters.co.jp/entertainment/cheer_player/"]}, "body": "## ひとことで\n3塁側の**ビジター外野応援指定席**では、日本ハムファンが立って、手拍子や選手ごとの応援歌で打者を後押しする。==レフト側から大きな音が聞こえたら、日本ハムの攻撃が始まった合図だと思えばいい==のだ。\n\n## しくみ\nZOZOマリンのビジター外野応援指定席は、登録された応援団の大旗や鳴り物応援が認められ、一般の観客も立って応援できる場所だ。反対に、そのエリアでは相手球団への応援は禁止されている。\n\n日本ハムには**清宮幸太郎**や**万波中正**など、選手ごとの応援歌がある。公式案内では、応援歌の1回目はアカペラ（楽器を止めて声だけで歌うこと）にし、その間はメガホンをたたかず、手拍子はよいとされている。==急に楽器が止まり、声だけになったら、それも応援の一部なのだ==。\n\nあなたの席は1塁側の内野指定席Bなので、同じ動きをする必要はない。遠くのレフト側から聞こえる声と、ロッテ側の応援が攻守で入れ替わる様子を聞くだけでも十分だ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**万波中正**が打席に入ったら、レフト側の音を聞いてみよう。==最初の声だけの部分から演奏へ切り替わる瞬間が分かれば、日本ハムの応援の形がかなり見えてくる==のだ。"}, "6-02-b": {"meta": {"id": "6-02-b", "title": "「きつねダンス」って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-02", "6-04"], "sources": ["https://www.fighters.co.jp/news/detail/00004327.html", "https://www.fighters.co.jp/news/detail/202300314972.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://www.fighters.co.jp/entertainment/cheer_player/"]}, "body": "## ひとことで\n**きつねダンス**は、日本ハムの公式チアチーム「ファイターズガール」が、Ylvisの曲「The Fox」に合わせて踊る球場演出だ。==選手を直接応援する応援歌とは別の、イニング間などに楽しむエンタメなのだ==。\n\n## しくみ\n大きく広まったのは2022年だ。球団は同年に「きつねダンスDAY」を開き、原曲を歌うノルウェーの兄弟ユニット**Ylvis**も招いた。翌年には球団公式のコンピレーションCDにも「The Fox」が収録されている。\n\n動きは、きつねの耳や前足を思わせる手ぶりが特徴だ。全部覚えなくても、周りの人が踊っている場面なら、見よう見まねで十分楽しめる。\n\nただし、==日本ハム戦なら毎球場で必ず行われる演出ではない==。今日のZOZOマリン公式イベント案内には、きつねダンス実施の記載はないのだ。\n\n## 今日の試合で見るなら\n今日その場で確実に聞きやすいのは、きつねダンスより**選手応援歌**のほうだ。**清宮幸太郎**や**万波中正**の打席ではレフト側の応援を聞き、攻守交代では場内演出を見る、と分けると分かりやすい。\n\n==きつねダンスが流れなくても「見逃した」とは限らない==。今日はZOZOマリンの公式進行をそのまま楽しめばいいのだ。"}, "6-02-c": {"meta": {"id": "6-02-c", "title": "相手チームのファンとどう接すればいい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-02", "6-05"], "sources": ["https://www.marines.co.jp/stadium/rule"]}, "body": "## ひとことで\n相手チームのファンとは、==同じ試合を別の側から見ている人だと思えばいい==。自分のチームを応援しつつ、相手を挑発したり、相手の応援エリアへ入り込んだりしなければ大丈夫なのだ。\n\n## しくみ\nZOZOマリンのルールでは、ほかの観客の観戦を妨げる発言や行為をしないことが求められている。また、外野応援指定席では相手球団への応援が禁止され、ホーム応援エリアをビジターチームのユニホームや応援グッズ姿で通り抜けることにも制限がある。\n\nつまり、==「自分の席で、自分のチームを応援する」が基本==だ。相手が得点して喜んでいても、にらんだり言い返したりする必要はない。通路では互いに譲り合い、前を横切るときは視界をふさがないようにすればいい。\n\nあなたの1塁側内野指定席Bでは、近くに日本ハムを応援する人がいることもあり得る。応援の方向が違っても、それだけで問題ではないのだ。\n\n## 今日の試合で見るなら\n**山口航輝**が打ってロッテ側が沸く場面も、**清宮幸太郎**が打って日本ハム側が沸く場面もあり得る。==喜ぶときはグラウンドに向かって喜び、相手ファンへ向けて勝ち誇らない==。これだけ覚えておけば、かなり気楽に観戦できるのだ。"}, "6-02": {"meta": {"id": "6-02", "title": "日本ハムの応援は？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": [], "related": ["6-01", "6-03"], "sources": ["https://www.fighters.co.jp/entertainment/cheer_player/", "https://www.fighters.co.jp/news/detail/202600836488.html", "https://www.marines.co.jp/stadium/rule", "https://npb.jp/games/2026/schedule_09_detail.html", "https://pacificleague.com/news/2022/9/10005241", "https://www.fighters.co.jp/expansion/2022/sdhighlights/stories/", "https://www.japantimes.co.jp/sports/2014/09/03/baseball/japanese-baseball/fan-favorite-inaba-jumping-sunset/"], "episode": "v2"}, "body": "## ひとことで\n==日本ハムにも選手ごとの**応援歌**があり、**ビジター側**（相手チーム側）の応援席から手拍子や演奏がまとまって聞こえてくる。== ロッテの応援と交互に聞くと、攻守が切り替わったことも分かりやすいのだ。\n\n## しくみ\n日本ハムの公式サイトには、**清宮幸太郎**、田宮裕涼、万波中正、水野達稀らの選手応援歌が掲載されている。打者が変わるたびに曲も変わるので、選手紹介を見なくても「次の打者が来た」と耳で気づける。\n\n日本ハムの応援をまとめる全国闘将会は、応援歌の1回目を**アカペラ**（楽器を止めて声だけで歌うこと）で歌うとしている。その間はメガホンをたたかず、手拍子はよいという案内だ。==声だけになった瞬間は、応援の輪郭がかなりはっきり聞こえる。==\n\n**ZOZOマリン**のビジター外野応援指定席は、立ち上がって応援できる専用エリアだ。一方、内野席はホーム・ビジター双方のファンが観戦できる。==あなたの1塁側**内野指定席B**でも、日本ハムの応援が聞こえてくるのは自然なことなのだ。==\n\n## おもしろエピソード\n日本ハムで長く活躍した**稲葉篤紀（2000年代を代表する強打者）**の打席では、札幌ドームのファンが一斉に跳ぶ「稲葉ジャンプ」が名物になった。得点の好機で大勢が跳ぶと、ドーム全体が揺れ、テレビ中継の映像まで揺れて見えるほどだった。\n\n稲葉本人は、打席にも振動が伝わってきたため、==「揺れが静まるまでは打たないでおこう」と待ったことがあると振り返っている。== 応援が選手の耳だけでなく、足元まで届いた例なのだ。\n\n## 今日の試合で見るなら\n日本ハムの3番予想・清宮幸太郎は、通算100本塁打（ホームラン）まであと1本だ。打席に入ったとき、ロッテ側の応援が止まり、反対側から清宮の応援歌が聞こえてくる切り替わりに注目するといい。\n\n田宮裕涼や万波中正にも公式の個人応援歌がある。ロッテ攻撃時との音の違いを聞き比べると、球場全体が二つの応援チームでできていることが分かるのだ。"}, "6-03-a": {"meta": {"id": "6-03-a", "title": "ヒーローはどう選ばれる？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-03", "6-03-b"], "sources": ["https://www.daily.co.jp/baseball/2021/12/26/0014945093.shtml", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nヒーローは、安打数などの数字だけで自動的に決まるわけではない。==その日の勝敗を大きく動かした選手が選ばれる、と考えると分かりやすい==のだ。\n\n## しくみ\n決勝打（勝ち越しにつながった一打）を放った打者、長い回を好投した先発投手、終盤を抑えた救援投手などが候補になる。ただし、「3安打なら必ず選出」のようなNPB共通の公開された点数表はない。\n\n選出には球団側の判断も入る。デイリースポーツは、西武では**チーム広報**の業務にヒーローインタビューの選手選びが含まれると報じている。一方、ロッテが誰をどういう手順で選ぶかという詳細は公開資料で確認できないため、担当者までは断定しない。\n\n==大事なのは「いちばん目立った人」より、「勝ちに大きく関わった人」を探すこと==なのだ。\n\n## 今日の試合で見るなら\nロッテの**アンドレ・ジャクソン**が長い回を抑えて勝てば、投手の活躍が大きな材料になる。**山口航輝**が終盤に勝ち越し打を放てば、打者の活躍が強く残る。\n\n==試合の終盤に「今なら誰が呼ばれそうか」を一人決めておくと、ヒーロー発表が答え合わせになる==のだ。"}, "6-03-b": {"meta": {"id": "6-03-b", "title": "試合後まで残ると何がある？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-03", "6-03-a"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/202600800842.html"]}, "body": "## ひとことで\n今日ロッテが勝つと、試合後に**MARINES WINNING CEREMONY**が行われる。==最後のアウトのあとも、ハイライト映像とヒーローインタビューまでが観戦の続きなのだ==。\n\n## しくみ\nロッテ公式の9月28日イベント案内では、勝利時に球場を暗くし、試合のハイライト映像を流してヒーローインタビューを行う予定だ。**MARINESペンライト2026**が音楽に合わせて点滅し、ビジョンのQRコードを読み込むとスマートフォンのライトも連動する。\n\nこれは==ロッテが勝ったときだけの演出==だ。日本ハムが勝った場合、同じ「MARINES WINNING CEREMONY」は行われない。\n\nだから帰りの混雑を急いで避けるか、勝利演出まで見るかは、最後のアウトが近づいたところで決めればいい。初観戦なら、一度は残ると「試合が終わった後の球場」まで分かるのだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**が好投したり、**山口航輝**が勝敗を動かす一打を放ったりしてロッテが勝ったら、すぐ席を立たずグラウンドとビジョンを見よう。\n\n==誰がヒーローに呼ばれるかまで見届けると、その日の試合で何が重要だったかを整理しやすい==のだ。"}, "6-03": {"meta": {"id": "6-03", "title": "ヒーローインタビューって？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": [], "related": ["6-01", "6-02"], "sources": ["https://www.marines.co.jp/news/detail/202600800842.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://number.bunshun.jp/articles/-/821272", "https://full-count.jp/2022/12/28/post1322150/"], "episode": "v2"}, "body": "## ひとことで\n==**ヒーローインタビュー**は、試合後に活躍した選手へ行う場内インタビューだ。== 今日のZOZOマリンでは、ロッテが勝つと**「MARINES WINNING CEREMONY」**の中で行われる予定なのだ。\n\n## しくみ\nヒーローになるのは、勝敗を大きく動かした選手が中心だ。**決勝打**（勝ちを決めた一打）を打った打者、好投した先発投手、終盤を締めた**救援投手**（先発の後を継いで投げる投手）などが候補になる。==ただし、誰が何人呼ばれるかは試合が終わるまで決まらない。==\n\n**2026年**のZOZOマリンでは、ロッテ勝利時に球場を暗くし、試合のハイライト映像とヒーローインタビューを組み合わせた勝利演出を行っている。ペンライトに加え、ビジョンの**QRコード**を読み込んだスマートフォンのライトも音楽に合わせて光る仕組みだ。\n\n![本塁後方から見た千葉マリンスタジアムのグラウンドと客席](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\nだから、最後のアウトが決まってもすぐに席を立たないでほしい。==ロッテが勝った日は、試合終了が観戦の終わりではないのだ。== インタビューまで見ると、その試合で何が勝負を決めたのかを、選手本人の言葉で振り返れる。\n\n## おもしろエピソード\n2004年9月20日、日本ハムでプレーしていた**新庄剛志**は、ダイエー（今のソフトバンク）戦の9回裏2アウト満塁で、外野フェンスを越えるサヨナラ打を放った。ところが一塁走者の田中幸雄が喜んで二塁の手前まで迎えに行き、新庄と抱き合ったため、新庄は前の走者を追い越したとしてアウトになった。\n\n本塁打は取り消され、記録は「サヨナラの単打（シングルヒット）」になった。それでも勝利は成立し、新庄はヒーローインタビューで、==「今日のヒーローはぼくじゃありません……。みんなです！」==と答えた。大喜びしすぎて本塁打が消えた直後だからこその一言だったのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは、勝てば今季10勝目だ。山口航輝は33号本塁打なら本塁打数でリーグ単独2位になる。\n\nもしロッテが勝ち、この2人のどちらかが勝敗を動かす活躍をしたら、試合後まで残って誰がヒーロー
