そちらも9対7で勝った。== 平均点は目安でしかなく、ときどき野球は物差しごと壊すのだ。\n## 今日の試合で見るなら\n序盤が0対0でも、すぐ「動かない試合」と考えなくていい。ロッテ先発の**アンドレ・ジャクソン**と日本ハム先発の**福島蓮**が走者を出さずに抑えているなら、それ自体が見どころだ。\n\n走者がたまったところで**山口航輝**や**清宮幸太郎**に回れば、1球でスコアが大きく動く。==まずは「4点前後」を目安にしつつ、実際の試合がそこからどう外れるかを見ると分かりやすいのだ。=="}, "2-02-a": {"meta": {"id": "2-02-a", "title": "二塁打・三塁打って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-02", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/lb_2b_p.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html", "https://full-count.jp/2024/07/09/post1581768/", "https://www.mlb.com/news/bengie-molina-s-unlikely-cycle"], "episode": "v2"}, "body": "## ひとことで\n==**二塁打**は、1本のヒットで打者が二塁まで進むこと。**三塁打**は三塁まで進むヒットだ。== まとめて長打（1本で二つ以上の塁を取る安打）と呼ぶ。\n\n## しくみ\n==外野手の間を抜けたり、フェンス近くまで転がったりすると、打者は一塁で止まらず先の塁を狙える。== 記録では、ヒットで進んだ塁の数を**「塁打」**と数える。二塁打なら**2塁打**、三塁打なら3塁打だ。\n\n==三塁打は二塁打より、打球の行き先と走る速さの両方が必要になりやすい。== 外野手がボールを取りに行く間に、打者は二塁を回って三塁へ向かうのだ。\n\n![野球場の塁と内外野の配置を示した図](https://upload.wikimedia.org/wikipedia/commons/1/14/Baseball_field_overview.png \"出典：Wikimedia Commons／Robert Merkel／Public domain\")\n\n## おもしろエピソード\n2010年、テキサス・レンジャーズの**ベンジー・モリーナ**（メジャーリーグの捕手）は、ボストンの試合で単打、二塁打、満塁本塁打を打った。サイクルヒット（1試合で単打・二塁打・三塁打・本塁打を全部打つこと）まで、残るは三塁打だけだった。\n\nモリーナは足の速さで知られる選手ではなく、自分でも「世界でいちばん遅い選手の一人」と話すほどだった。それでも8回、外野の深い場所へ飛んだ打球で三塁まで走り切り、サイクルヒットを完成させた。実況が「ボストンで豚が空を飛んだ」と驚くほど、意外な三塁打だったのだ。\n\n## 今日の試合で見るなら\nロッテの西川史礁は9月27日時点で二塁打28本。打球が外野の間を抜けたら、一塁で止まるか二塁まで走るかを見てみよう。二塁を蹴ってさらに三塁へ向かったら、球場の空気が一段変わるはずだ。"}, "2-02-b": {"meta": {"id": "2-02-b", "title": "内野安打って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-02", "2-04"], "sources": ["https://npb.jp/news/detail/20260701_02.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html", "https://www.mlb.com/cut4/marlins-j-t-riddle-s-check-swing-single-on-a-pitch-that-bounced-is-one-of-the-we", "https://www.mlb.com/news/weird-broken-bat-single-in-minor-league-game"], "episode": "v2"}, "body": "## ひとことで\n==**内野安打**は、内野に転がった打球なのに、守備側が一塁で打者をアウトにできずヒットになることだ。== 遠くへ飛ばさなくても、足で作れるヒットがある。\n\n## しくみ\nたとえば**三遊間**（三塁手と遊撃手の間）へのゴロを三塁手が捕って一塁へ投げても、打者の足が先なら**セーフ**だ。==守備の普通のプレーでアウトにできなかったと公式記録員が判断すれば、内野安打になる。==\n\n一方、捕った野手の悪送球などが原因なら**失策**（エラー）になることがある。==見た目が同じ「一塁セーフ」でも、記録は違うわけだ。==\n\n![打者が打って一塁へ走り出す野球の試合場面](https://upload.wikimedia.org/wikipedia/commons/3/34/Ichiro_gets_a_hit.jpg \"出典：Wikimedia Commons／Ted Johnson／CC BY 2.0\")\n\n## おもしろエピソード\n2025年、メジャーリーグ傘下の**2A**（メジャーを目指す選手が戦う育成リーグ）で、コロンバスのチャンドラー・シーグルがゴロを打った。その瞬間にバットが折れ、打球とバットの破片が一緒に内野を転がった。\n\n遊撃手が捕ろうとした直前、==打球が折れたバットにもう一度当たり、反対方向へ跳ねた==。野手は処理できず、記録は内野安打。45年間実況していたアナウンサーも「見たことがない」と驚いたプレーだった。\n\n## 今日の試合で見るなら\n前日9月27日、ロッテの西川史礁は初回に内野安打で出塁した。今日も打球が内野に転がったら、ボールだけでなく打者と一塁送球の競争を見るとよい。"}, "2-02-c": {"meta": {"id": "2-02-c", "title": "打率って？3割がすごいのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-02", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\n**打率**は「打数のうち、何割がヒットだったか」を表す数字だ。==打率.300、つまり**3割**なら、10打数で約3本ヒットを打つ計算になる。==\n\n![打者が打球を放つ瞬間](https://upload.wikimedia.org/wikipedia/commons/1/1b/Chase_Utley_Home_Run.jpg \"出典：Wikimedia Commons／Googie Man／CC BY-SA 3.0\")\n\n## しくみ\nNPBの計算式は「**安打数÷打数**」だ。==四球（フォアボール）や犠打（バントで走者を進める打撃など）は、そもそも打数に入らない。==だから、単純な「打席の3割」ではない。\n\n3割がすごいのは、投手と守備が強いからだ。プロでは10打数のうち7本近くヒットにならなくても、一流と呼ばれる。9月27日時点のパ・リーグで、**規定打席**（打率ランキングに載るのに必要な打席数）に達して打率.300以上なのは**4人だけ**。==3割は今季でもはっきり上位の水準なのだ。==\n\n## 今日の試合で見るなら\nロッテの**西川史礁**は9月27日時点で打率**.292**でリーグ5位。3割まであと少しの位置にいる。今日4打数2安打のように複数安打を重ねれば打率は上がるし、4打数0安打なら下がる。==打席ごとに数字が動く終盤戦なのだ。=="}, "2-02": {"meta": {"id": "2-02", "title": "Hやヒットって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["2-02-a", "2-02-b", "2-02-c"], "related": ["2-04", "4-01", "4-03"], "sources": ["https://npb.jp/scoring/calculation.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/playbyplay.html", "https://npb.jp/bis/2026/stats/bat_p.html", "https://www.mlb.com/news/weirdest-mlb-home-runs-of-all-time"], "episode": "v2"}, "body": "## ひとことで\n==**ヒット**は安打（あんだ：打ったボールで安全に塁へ出る記録）のことだ。== スコアボードの**「H」**は、チームが打ったヒットの合計を表す。\n\n## しくみ\n打者が打ったボールで一塁以上へ進み、守備側の**失策**（エラー：普通なら処理できる打球をミスすること）などによらず出塁すると、基本的にヒットになる。==外野まで飛ばなくてもよい。== 内野に転がった打球でも、送球より先に一塁へ着けば**内野安打**になることがあるのだ。\n\nヒットには**単打**（シングル：一塁まで進む安打）、**二塁打**、三塁打、本塁打がある。NPBの記録では、長打率（1打数あたりに進んだ塁の多さ）を計算するとき単打を1、二塁打を2、三塁打を3、本塁打を4の「塁打」として数える。\n\n==ただし、打った人が一塁へ着いたら全部ヒット、というわけではない。== 野手のミスなら**失策**、先の走者をアウトにしようとして打者が残った場合は**野選**（フィルダースチョイス：守備側が別の走者を狙った結果の出塁）になることがある。公式記録員がプレーを見て記録を決めるのだ。\n\n![打者が打って一塁へ走り出す野球の試合場面](https://upload.wikimedia.org/wikipedia/commons/3/34/Ichiro_gets_a_hit.jpg \"出典：Wikimedia Commons／Ted Johnson／CC BY 2.0\")\n\n## おもしろエピソード\n1993年、MLBのクリーブランド・インディアンス（今のガーディアンズ）の**カルロス・マルティネス**が右翼へ大きな打球を飛ばした。テキサス・レンジャーズの外野手**ホセ・カンセコ**はフェンス際まで追ったが、打球を見失った。\n\nボールはカンセコの**頭に当たって跳ね、そのまま外野フェンスの向こうへ**。記録はマルティネスの本塁打になった。\n\nヒットは「きれいな打球」だけではない。守備側が追いつきかけても、ボールが地面に落ちる前に捕れず、その結果フェンスを越えれば、本塁打という最も大きな「H」になることもあるのだ。\n\n## 今日の試合で見るなら\nロッテでは西川史礁が9月27日時点で打率.292。派手なホームランだけでなく、まず一塁へ生きる打球をどれだけ作れるかを見るとよい。\n\n日本ハムでは水野達稀や清宮幸太郎の打席で、スコアボードの「H」が増えるか確認してみよう。1本のヒットが次の打者につながり、得点の形ができていくのだ。"}, "2-03-a": {"meta": {"id": "2-03-a", "title": "ソロ・2ラン・3ラン・満塁ホームランって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-03", "1-06-b", "1-09"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n==名前の違いは、そのホームランで何点入るかだ。==走者なしは**ソロで1点**、1人いれば**2ラン**、2人いれば3ラン、満塁なら満塁ホームランで4点入る。\n\n![ホームランを打つ瞬間の打者](https://upload.wikimedia.org/wikipedia/commons/1/1b/Chase_Utley_Home_Run.jpg \"出典：Wikimedia Commons／Googie Man／CC BY-SA 3.0\")\n\n## しくみ\nホームランでは、打者と塁上の走者が全員得点する。==だから「**塁にいる人数＋1**」が、そのまま入る点になる。==\n\nたとえば一塁に走者がいる時の本塁打は**2点**。満塁（すべての塁に走者がいる状態）なら、走者3人と打者の計**4人**が帰る。==これを満塁ホームラン、または**グランドスラム**という。==\n\n## 今日の試合で見るなら\nロッテは1番の**西川史礁**が出塁し、2番の**山口航輝**に回れば、山口の一発は2ランになりうる。日本ハムも水野達稀や田宮裕涼が塁に出て清宮幸太郎を迎えると、通算100号が2点以上入る一発になるかもしれない。\n\n==打者を見る前に塁上の人数を数えると、「この一発なら何点か」がすぐ分かるのだ。=="}, "2-03-b": {"meta": {"id": "2-03-b", "title": "マリンの海風でホームランは変わる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-03", "7-04", "7-04-b"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/31335151.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/bis/players/11815138.html"]}, "body": "## ひとことで\n==変わりうる。==向かい風なら大きな打球が押し戻され、追い風なら伸び、横風なら左右へ流される。**マリン**では風もプレーの一部なのだ。\n\n![千葉マリンスタジアムの外観](https://upload.wikimedia.org/wikipedia/commons/2/2d/Chiba_Marine_Stadium.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## しくみ\n**ZOZOマリン**は球場に風速計があり、上空と地上の風速情報を自動表示している。球団公式も、海側からの風を前提に花火の打ち上げ位置を変えている。==それほど風向きの影響を受ける球場なのだ。==\n\nただし「海風なら必ずホームランが増える」とは言えない。==見るべきなのは、その瞬間にどちら向きへ、どれくらい吹いているかだ。==同じ角度の大飛球でも、風向次第でフェンス手前に落ちたり、逆にひと伸びしたりする。\n\n## 今日の試合で見るなら\n**山口航輝**は32本、井上広大は7本、清宮幸太郎は23本、**万波中正**は21本塁打で今日を迎える。4人の大きなフライが上がったら、風速表示も一緒に見てみよう。\n\n==「打った瞬間は入ったように見えたのに失速した」「逆に最後まで伸びた」という差が出れば、マリンらしさを体感できる場面だ。=="}, "2-03-c": {"meta": {"id": "2-03-c", "title": "ビデオ判定（リクエスト）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-03", "1-03-c", "2-18"], "sources": ["https://npb.jp/news/detail/20260611_02.html", "https://www.nikkansports.com/baseball/news/202609220001618.html", "https://www.daily.co.jp/baseball/2026/09/22/0020848833.shtml", "https://www.mlb.com/news/weirdest-mlb-home-runs-of-all-time", "https://www.mlb.com/cut4/armando-galarraga-threw-a-one-hit-perfect-game-5-years-ago/c-127909514", "https://www.mlb.com/tigers/video/galarraga-joyce-at-the-plate-c8633629"], "episode": "v2"}, "body": "## ひとことで\n==**リクエスト**は、監督がプレーの判定について映像での確認を求める仕組みだ。==審判が映像を見直し、元の判定を維持することも、覆すこともある。\n\n![野球の映像判定を行う審判員](https://upload.wikimedia.org/wikipedia/commons/0/0e/Instantreplaymlb.jpg \"出典：Wikimedia Commons／Johnmaxmena2／CC BY-SA 3.0\")\n\n## しくみ\n一瞬の**タッチ**やフェンス際の打球は、人の目だけでは判断が難しいことがある。そこで映像を使って確認する。==検証中は試合が止まり、判定が出ると再開する。==\n\n2026年6月には、盗塁のアウト判定に**阪神**がリクエストを使い、検証後もアウトのままだった例がある。==NPBは、映像検証後の判定への異議申し立ては認められないと説明している。==\n\n## おもしろエピソード\n2010年、デトロイト・タイガースの投手**アーマンド・ガララーガ**は、完全試合（相手を一人も塁に出さず終える試合）まであと1人に迫った。最後になるはずの打者のゴロで一塁をカバーし、送球も走者より先に届いたように見えた。\n\nところが一塁塁審の**ジム・ジョイス**はセーフと判定した。当時はこのプレーを映像で覆す制度がなく、試合後に映像を見たジョイスは誤りを認めてガララーガへ謝った。\n\n翌日の試合前、ガララーガは自らメンバー表をジョイスへ届け、涙をぬぐうジョイスと握手した。映像判定がなかった時代の大誤審は、二人のスポーツマンシップまで含めて語り継がれる出来事になったのだ。\n\n## 今日の試合で見るなら\n9月22日のZOZOマリンでは、山口航輝の大飛球が審判団の映像確認で二塁打から本塁打へ変更された。本塁や塁上のきわどいセーフ・アウト、フェンス際の大飛球で監督がベンチを出たら注目しよう。ビジョンに映像が出ても、最終的な判定は審判の発表を待つのがポイントだ。"}, "2-03": {"meta": {"id": "2-03", "title": "ホームランって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["2-03-a", "2-03-b", "2-03-c"], "related": ["1-09", "2-02-a", "4-03", "4-06"], "sources": ["https://npb.jp/bis/2026/stats/lb_hr_p.html", "https://npb.jp/bis/players/31335151.html", "https://npb.jp/bis/players/41545136.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.nikkansports.com/baseball/news/202609260001489.html", "https://www.daily.co.jp/baseball/2026/09/22/0020848833.shtml", "https://www.mlb.com/news/weirdest-mlb-home-runs-of-all-time"], "episode": "v2"}, "body": "## ひとことで\n==**ホームラン**は、打者が一気に本塁まで帰って得点できる安打だ。==ふつうは、フェアの打球が外野フェンスを越えると**本塁打**になる。\n\n![ホームランを打つ瞬間の打者](https://upload.wikimedia.org/wikipedia/commons/1/1b/Chase_Utley_Home_Run.jpg \"出典：Wikimedia Commons／Googie Man／CC BY-SA 3.0\")\n\n## しくみ\nフェンス越えの本塁打なら、打った本人だけでなく、その時に塁にいた走者も全員が本塁へ帰れる。走者なしなら**1点**、満塁なら一度に**4点**だ。==だから同じ1本でも、塁上に何人いるかで試合への影響が大きく変わる。==\n\n打者は一塁、二塁、三塁、本塁の順にすべての塁を踏む。守備側がボールを追ってアウトにする必要はなく、走者も基本的には落ち着いて一周できる。外野フェンスを越えず、守備がボールを処理する間に一周する**ランニングホームラン**もあるが、こちらはかなり珍しい。\n\nホームランはヒットの一種で、記録上は**4塁打**（ヒットで進んだ塁の数が4）だ。==1打席で最大4点を生み出せるので、試合の流れを一振りで変えやすい。==\n\n## おもしろエピソード\n1993年、クリーブランドで**カルロス・マルティネス**が右翼へ大きな打球を飛ばした。追ったのはテキサス・レンジャーズの外野手ホセ・カンセコだ。\n\nカンセコはフェンス際で捕ろうとしたが、ボールはグラブではなく、なんと**頭のてっぺんに当たってそのままフェンスの向こうへ**。記録はマルティネスの本塁打になった。近くにいた味方選手まで笑い、カンセコ本人もあとにはこの珍プレーを笑えるようになったという。\n\n## 今日の試合で見るなら\n山口は9月27日時点で32本塁打。日本ハムの清宮幸太郎は9月26日に23号を放ち、通算100本塁打まであと1本で今日を迎える。\n\nさらにロッテの井上広大は今季7本、日本ハムの万波中正は21本。大きな打球が上がったら、まず外野手ではなく打球そのものを追い、フェンスを越えるかを見るとよい。今日もっとも分かりやすく球場全体が動く瞬間の一つだ。"}, "2-04-a": {"meta": {"id": "2-04-a", "title": "ヒットとエラーは誰がどう決める？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-04", "2-02"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/news/detail/20170425_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==ヒットかエラーかを決めるのは、球場の**公式記録員**だ。==審判のセーフ・アウト判定とは別の仕事なのだ。\n\n## しくみ\nまず**審判**がプレーを判定する。そのあと公式記録員が、「普通に守っても一塁でアウトにできなかった打球」なら安打、「普通ならアウトにできたのに守備のミスで生かした」なら失策、と記録する。\n\n判断が微妙なときは、規則上は打者に有利な記録を与える考え方がある。==だから同じ「野手が触って一塁セーフ」でも、**ヒット**と**エラー**の両方があり得るのだ。==\n\n## 今日の試合で見るなら\n**清宮幸太郎**の速いゴロを遊撃（ショート：二塁と三塁の間を守る内野手）の**山崎剛**が横っ飛びで触っただけなら、ヒットになることがある。逆に正面のゆるいゴロをはじいて一塁に投げられなければ、エラーになりやすい。\n\n==球場ではプレー直後だけでなく、その後のスコアボードにも注目するといい。==HかEかが表示されれば、公式記録員の判断が見えるのだ。"}, "2-04-b": {"meta": {"id": "2-04-b", "title": "エラーがつかないミスもある？（野選・暴投・捕逸）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-04", "2-09-a"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==ある。==守備側がうまくいかなかったように見えても、**野選（野手選択）**、暴投、捕逸という別の記録になり、エラーがつかない場合があるのだ。\n\n## しくみ\n**野選（野手選択：打者ではなく先の走者をアウトにしようとした結果、打者を一塁に生かすこと）**は、送球先の選び方に関係する記録だ。==たとえば一塁で打者をアウトにできそうなのに、二塁の走者を狙って両方セーフになれば、安打ではなく野選になる場合がある。==\n\n**暴投（ワイルドピッチ：捕手が普通には止めにくい投球で走者を進めること）**は投手側の記録だ。**捕逸（パスボール：普通なら捕れる投球を捕手が処理できず走者を進めること）**は捕手側の記録で、==どちらも失策とは別扱いなのだ。==\n\n## 今日の試合で見るなら\n走者がいる場面では、ロッテ先発の**アンドレ・ジャクソン**が投げる低い変化球と、それを受ける捕手の**佐藤都志也**を見てみるといい。ボールが後ろへ抜けて走者が進んだとき、暴投か捕逸かは投球の難しさで分かれる。\n\n内野では**山崎剛**がゴロを捕ったあと、どの塁へ投げるかにも注目だ。==捕る技術だけでなく、アウトを取りやすい場所を瞬時に選ぶのも守備なのだ。=="}, "2-04-c": {"meta": {"id": "2-04-c", "title": "エラーした選手はどうなる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-04", "2-04-a", "4-01"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scoring/calculation.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nエラー（失策：守備のミスとして記録されるプレー）をしても、その選手が自動的に退場したり、交代させられたりするわけではない。==まず起きるのは、公式記録に**失策1**がつくことなのだ。==\n\n## しくみ\n失策は個人とチームの守備記録に残る。**守備率**は「刺殺＋補殺」を「刺殺＋補殺＋失策」で割るので、失策が増えると数字にも反映される。\n\nただし、1回の失策で試合に出られなくなる規則はない。そのまま守備を続けることもあり、交代させるかどうかは監督の選手起用の判断になる。\n\n失策のあとに走者が得点した場合は、投手の**自責点**（投手が責任を負う失点）にならないこともある。==「点は入ったが、投手の自責点ではない」という記録が起こるのだ。==\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**や日本ハム先発の**福島蓮**の後ろでエラーが出たら、スコアボードの「E」に注目するといい。\n\n==その走者があとでホームへ帰ったら、「この失点は投手の自責点になるのか」まで見ると、エラーが記録にどう影響するかが分かるのだ。== 選手が次の守備機会でどうプレーするかも、そのまま見続けられる。"}, "2-04": {"meta": {"id": "2-04", "title": "エラーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-04-a", "2-04-b"], "related": ["2-02", "4-01"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20170411_01.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.nikkansports.com/baseball/news/202005130000349.html", "https://www.mlb.com/news/oscar-gonzalez-helps-guardians-win-after-funny-moment"], "episode": "v2"}, "body": "## ひとことで\n==**エラー（失策：普通ならアウトにできた守備で、ミスによって走者を生かしたり進めたりした記録）**とは、守備のミスにつく公式記録なのだ。==見た目に失敗していても、必ずエラーになるわけではない。\n\n![野手がゴロを捕球しようとする場面](https://upload.wikimedia.org/wikipedia/commons/1/1c/Outfielder_fielding_a_groundball.jpg \"出典：Wikimedia Commons／KC Gale／CC BY-SA 2.0\")\n\n## しくみ\n基準は「**その野手なら普通の守備で処理できたか**」だ。ゴロをはじく、捕れるフライを落とす、アウトにできる送球を大きくそらす、といった場面では失策になることがある。\n\n逆に、強烈な打球に飛びついたが届かなかった、難しい体勢から送球して間に合わなかった、という場面は失策にならないことも多い。==公認野球規則でも、判断だけの誤りは原則として失策にしないと定めている。==\n\nだから、観客から見て「今のはミスでは？」と思っても、記録はヒットになることがあるのだ。スコアボードの「**E**」は、守備側の失策数を表している。\n\n## おもしろエピソード\n2022年、クリーブランド・ガーディアンズの新人外野手**オスカー・ゴンザレス**は、ロイヤルズ戦でフライを捕った。ところが、それは3アウト目ではなく**2アウト目**だった。\n\nゴンザレスは攻守交代だと思い、捕ったボールをそのまま観客席へ投げてしまった。一塁走者はルールで三塁まで進み、ゴンザレスには失策が記録された。\n\n幸い失点にはならず、試合後に監督のテリー・フランコーナは「しばらく3Aに行ってないけど、あそこも3アウト必要なんだよね？」と笑わせた。エラーは捕り損ねだけでなく、==アウトの数を勘違いしても起きる==のだ。\n\n## 今日の試合で見るなら\nロッテの遊撃・山崎剛や二塁・小川龍成のところへ、日本ハムの清宮幸太郎が強いゴロを打った場面を見てみるといい。取り切れずに一塁がセーフでも、強烈な打球ならヒット、普通に処理できたと判断されればエラーになり得るのだ。\n\n外野では、海風のあるZOZOマリンで藤原恭大や髙部瑛斗がフライを追う。落球したから即エラー、ではなく、「普通の守備で捕れたか」が基準になるところが見どころだ。"}, "2-05-a": {"meta": {"id": "2-05-a", "title": "ポジション番号（1〜9）って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-05", "4-01"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n守備位置には**1〜9の番号**がある。==背番号ではなく、スコアを短く書くための「住所」のような番号なのだ。==\n\n![野球の守備位置とポジション番号の図](https://upload.wikimedia.org/wikipedia/commons/6/6c/Baseball_positions_numbered_en.svg \"出典：Wikimedia Commons／Michael J・Bait30／CC BY-SA 4.0\")\n\n## しくみ\n番号は次の順番だ。\n\n- **1＝投手、2＝捕手、3＝一塁手**\n- **4＝二塁手、5＝三塁手、6＝遊撃手**\n- **7＝左翼手、8＝中堅手、9＝右翼手**\n\n==たとえば「**6-3**」なら、遊撃手がゴロを処理して一塁手へ送球し、アウトを取ったという意味になる。==\n\n## 今日の試合で見るなら\nロッテの予想守備を番号にすると、**アンドレ・ジャクソン**が1、佐藤都志也が2、井上広大が3、小川龍成が4、寺地隆成が5、山崎剛が6、西川史礁が7、髙部瑛斗が8、藤原恭大が9だ。\n\n山崎から小川、井上へ渡る**併殺（ゲッツー：一度に2つアウトを取ること）**が出れば「**6-4-3**」になる。==スコア表示や実況で数字が出ても、誰が動いたかを頭の中でたどれるようになるのだ。=="}, "2-05-b": {"meta": {"id": "2-05-b", "title": "内野と外野は何が違う？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**内野**（4つの塁に近い範囲）は、ゴロを素早くアウトにする仕事が多い。==**外野**（そのさらに奥の範囲）は、飛んだ打球を広く追い、長打の被害を小さくする仕事が多いのだ。==\n\n![野球の守備位置とポジション番号の図](https://upload.wikimedia.org/wikipedia/commons/6/6c/Baseball_positions_numbered_en.svg \"出典：Wikimedia Commons／Michael J・Bait30／CC BY-SA 4.0\")\n\n## しくみ\n内野手は**一塁手・二塁手・三塁手・遊撃手**の4人だ。==打球を捕ってから一塁へ送るまでの時間が短いので、捕球から送球への速さが重要になる。==\n\n外野手は**左翼手・中堅手・右翼手**の3人だ。守る面積が広く、頭上を越されると二塁打や三塁打になりやすい。==フライの落下地点を読むことと、進塁を防ぐ返球が大切なのだ。==\n\n## 今日の試合で見るなら\nロッテでは**小川龍成**と**山崎剛**が内野中央、髙部瑛斗と藤原恭大が外野の中心になる。日本ハムの万波中正が強い打球を放ったら、ゴロなら内野の速い処理、外野を抜く打球なら外野手の追い方と返球を見れば違いがわかりやすい。\n\nZOZOマリンでは風でフライの落下地点が変わることもある。==内野と外野では、同じ「捕る」でも準備する距離と時間がかなり違うのだ。=="}, "2-05-c": {"meta": {"id": "2-05-c", "title": "守備位置を動かす「シフト」って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-05", "3-05-a"], "sources": ["https://npb.jp/npb/2024rules.html", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==**シフト（打者の特徴に合わせて守る位置を変える作戦）**とは、打球が来そうな場所へ先回りする守備なのだ。==二塁手や遊撃手は、いつも同じ場所に立つわけではない。\n\n## しくみ\nたとえば引っ張る打球が多い打者なら、その方向を少し厚く守る。==逆方向へ流す打球が多い打者なら、そちらへ寄ることもある。==\n\n動かすのは左右だけではない。強い打球が多ければ少し深く、バントの可能性があれば前へ出るなど、走者やアウト数でも位置は変わる。2026年の規則改正で、NPBでも投球時に**内野手4人**が二塁ベースの両側に**2人ずつ**分かれていなければならなくなった。==守備側はその範囲で配置を工夫するのだ。==\n\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**や**田宮裕涼**が打席に入る前、ロッテの二塁・小川龍成と遊撃・山崎剛の位置を見てみるといい。右打者の万波中正のときと比べると、立つ場所が変わるかもしれない。\n\n==投球のたびに打球だけを見るのではなく、投げる直前の内野手を見る。==数歩の移動にも「ここへ飛ぶ確率が高い」という守備側の読みが表れているのだ。"}, "2-05-d": {"meta": {"id": "2-05-d", "title": "中継プレーって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-05", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==**中継プレー（遠い場所からの送球を途中の野手が受け、次の塁へつなぐ連携）**は、外野から本塁などへ正確に速く返すための仕組みだ。==\n\n![本塁で中継送球を待つ捕手と本塁へ進む走者](https://upload.wikimedia.org/wikipedia/commons/7/7e/Roy_Campanella_and_Lou_Klein_1949.jpg \"出典：Wikimedia Commons／作者不詳／Public domain\")\n\n## しくみ\n外野の深い場所から本塁までを一人で投げると、距離が長くなり、送球がそれやすい。==そこで**内野手**が途中に入り、外野手の送球を受けて本塁や三塁へ投げ直す。==\n\n中継に入る野手は、外野手と狙う塁を結ぶ線上に立つ。送球が十分強ければそのまま通し、弱かったり方向を変えたいときは捕って投げる。==だから中継役は「ただ間に立つ人」ではないのだ。==\n\n## 今日の試合で見るなら\n日本ハムの**万波中正**が右中間（右翼手と中堅手の間）を破る長打を打った場面を想像するとわかりやすい。ロッテの**藤原恭大**や髙部瑛斗が打球を処理し、小川龍成や山崎剛が中継地点へ走り、最後は本塁の佐藤都志也へつなぐ。\n\n==あなたはボールだけでなく、打球が外野へ飛んだ瞬間の内野手も見るといい。==誰かが外野方向へ走り出したら、その選手が送球の道を作ろうとしている可能性が高いのだ。"}, "2-05": {"meta": {"id": "2-05", "title": "守備って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "children": ["2-05-a", "2-05-b", "2-05-c", "2-05-d"], "related": ["1-08", "2-06", "3-05", "3-06"], "sources": ["https://npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/news/featured/oberlin-college-baseball-team-and-the-infield-shift", "https://www.mlb.com/cut4/mike-lowells-hidden-ball-trick-in-2005-was-a-classic/c-142127970"], "episode": "v2"}, "body": "## ひとことで\n==**守備**とは、相手の打球や走塁を止めてアウトを取る側の仕事だ。==グラウンドには投手と捕手を含めて**9人**が入り、それぞれ違う範囲と役割を受け持つ。\n\n![野球の守備位置とポジション番号の図](https://upload.wikimedia.org/wikipedia/commons/6/6c/Baseball_positions_numbered_en.svg \"出典：Wikimedia Commons／Michael J・Bait30／CC BY-SA 4.0\")\n\n## しくみ\n投手が投げ、打者が打った瞬間から、守備の9人は「どこに飛んだか」「走者がどこにいるか」「何アウトか」で動きを変える。ゴロなら**内野手**が捕って一塁へ、フライなら落下地点に近い**野手**が捕る、というのが基本だ。\n\nでも実際は、==ボールを捕る人だけが守備をしているわけではない。==ほかの野手も、送球を受ける塁へ入る、悪送球に備えて後ろを守る、中継に入る、といった動きを同時にしている。\n\n==つまり守備は**9人で行う連携**なのだ。==テレビでは打球だけを追いがちだが、球場ではボールから離れた選手の動きも見える。それが現地観戦のおもしろさの一つだ。\n\n## おもしろエピソード\n2005年、フロリダ・マーリンズ（今のマイアミ・マーリンズ）の三塁手**マイク・ローウェル**は、ダイヤモンドバックス戦で「隠し球」を成功させた。\n\n8回、1点差で三塁には同点の走者ルイス・テレーロがいた。外野から返ってきたボールをローウェルは投手へ返さず、グラブの中に隠したままにしたのだ。\n\nテレーロが次の塁を狙って三塁から少し離れた瞬間、ローウェルがそっとタッチしてアウト。==守備は、ボールを持っていないように見える選手まで含めて続いている==と分かる珍プレーだ。\n\n## 今日の試合で見るなら\nロッテの予想守備では、遊撃の山崎剛と二塁の小川龍成が内野の中央を守り、中堅の髙部瑛斗や右翼の藤原恭大が外野を受け持つ。日本ハムの水野達稀や清宮幸太郎が打席に入ったら、投球前から彼らの立ち位置を見ておくといい。\n\n打球が飛んだあと、捕った選手だけでなく、ほかの野手が塁や中継地点へ動くところまで追う。そうすると、守備が「一人の好プレー」ではなく、9人の配置と連携でできているのが見えてくるのだ。"}, "2-06-a": {"meta": {"id": "2-06-a", "title": "ゴールデングラブ賞って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-06", "2-05"], "sources": ["https://npb.jp/news/detail/20251112_02.html", "https://npb.jp/award/2022/glove.html", "https://npb.jp/bis/players/11215151.html", "https://assets.espn.go.com/mlb/news/1999/1109/161388.html", "https://sabr.org/journal/article/deconstructing-the-midas-touch-gold-glove-award-voting-1965-2004/", "https://www.mlb.com/awards/gold-glove"], "episode": "v2"}, "body": "## ひとことで\n==**三井ゴールデン・グラブ賞**は、その年に守備で特に高く評価された選手を選ぶ表彰だ。==いわば守備版の「**ベストナイン**」（ポジションごとの優秀選手を選ぶ表彰）なのだ。\n\n![岡本和真に贈られた三井ゴールデン・グラブ賞のトロフィー](https://upload.wikimedia.org/wikipedia/commons/a/a3/Gold_Glove_Award.jpg \"出典：Wikimedia Commons／H.Yama1／CC BY-SA 4.0\")\n\n## しくみ\n受賞者は、新聞社・通信社・テレビ局・ラジオ局の**プロ野球担当記者**による投票で決まる。投手、捕手、各内野手、外野手が選ばれ、==セ・リーグとパ・リーグでそれぞれ表彰される。==\n\nだから、単純にエラーが少ない選手を自動で選ぶ賞ではない。==守備範囲、肩、捕球、送球などを含めて、記者がその年の守備を評価する賞なのだ。==\n\n## おもしろエピソード\n1999年、メジャーリーグの一塁手**ラファエル・パルメイロ**はゴールドグラブ賞を受賞した。ところが、その年に一塁を守ったのは**28試合だけ**。多くの試合では指名打者（守備につかず打撃を担当する選手）だった。\n\n守備の賞なのに、守備機会が少ない選手が選ばれたことで、この受賞は今でも投票の不思議な例として語られている。==ゴールドグラブ賞は「エラーが一番少ない人」を機械的に決める賞ではなく、人が投票して決める賞==だとよく分かる出来事なのだ。\n\n## 今日の試合で見るなら\n予想どおり髙部が中堅に入ったら、2022年にこの賞を初受賞したことを思い出しつつ、打球への一歩目を見てほしい。受賞歴があるから毎回好守になるわけではないが、「守備も見どころの選手」だと分かるのだ。"}, "2-06-b": {"meta": {"id": "2-06-b", "title": "どこを見ると**ファインプレー**に気づける？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-06", "2-05"], "sources": ["https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\n==打球を捕る瞬間だけでなく、「打つ前の位置」と「打った直後の一歩目」を見ると、ファインプレーに気づきやすい。==うまい守備ほど派手に見えないこともあるのだ。\n\n## しくみ\n==見る順番は、**位置取り→一歩目→捕球→送球**でいい。==外野手なら最短に近い道で落下点へ入れたか、内野手なら捕ったあとすぐ投げられる体勢だったかを見る。\n\nさらに**走者**がいる場面では、送球先も大事だ。ホームを狙う走者を止めたり、余計な進塁を防いだりする判断も好守なのだ。\n\n![二塁付近で併殺を狙う守備](https://upload.wikimedia.org/wikipedia/commons/4/47/Double_play.jpg \"出典：Wikimedia Commons／Rdikeman／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n==**ロッテの髙部瑛斗と藤原恭大**に打球が飛んだら、ボールより先に2人の足を見てほしい。==打った瞬間に迷わず動き、余裕を持って捕ったなら、その「余裕」自体がうまさの結果かもしれないのだ。"}, "2-06-c": {"meta": {"id": "2-06-c", "title": "ダイビングキャッチってどれくらい難しい？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-06", "2-05"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html"]}, "body": "## ひとことで\n**ダイビングキャッチ（走った勢いのまま飛び込んで捕ること）**は、届くかどうかの判断と捕球を一瞬で両立する難しい守備だ。==飛び込めばすごいのではなく、飛び込む必要がある打球をアウトにするのがすごい==のだ。\n\n## しくみ\n外野手は、打球の高さや速さを見ながら落下点へ走る。普通に追いつけないと判断した最後の一歩で体を投げ出し、グラブを球の進路へ合わせる。\n\n失敗すると、球が後ろへ抜けて長打になることもある。だから==「届きそうだから飛ぶ」ではなく、「飛ばないと届かないが、抜けてもよいか」まで含めた判断==が必要なのだ。\n\n## おもしろエピソード\nうまい外野手ほど、最初の一歩や走る角度がよく、派手に飛ばずに捕ることも多い。==ダイビングの前にある数秒の走り方==もファインプレーの一部なのだ。\n\n## 今日の試合で見るなら\n予想どおりならロッテ外野には**髙部瑛斗**や**藤原恭大**が入る。外野へ浅い打球が飛んだら、==捕る瞬間だけでなく、打った直後の一歩目から見る==と難しさが分かりやすいのだ。"}, "2-06": {"meta": {"id": "2-06", "title": "ファインプレーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "children": ["2-06-a", "2-06-b"], "related": ["2-05", "2-04"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/bis/players/31635138.html", "https://www.mlb.com/news/kevin-mitchell-barehanded-catch"], "episode": "v2"}, "body": "## ひとことで\n==**ファインプレー**は、普通ならヒットや進塁になりそうな打球を、守備のうまさでアウトに変えるような好プレーのことだ。==派手に飛びつく場面だけがファインプレーではないのだ。\n\n![外野手がダイビングキャッチを試みる場面](https://upload.wikimedia.org/wikipedia/commons/a/aa/Tucupita_Marcano_%2851505771748%29_%28cropped%29.jpg \"出典：Wikimedia Commons／Minda Haas Kuhlmann／CC BY 2.0\")\n\n## しくみ\n守備のうまさは、捕った瞬間だけでは決まらない。==打球が飛ぶ前の**位置取り**、打った瞬間の**一歩目**、落下点までの走り方、捕ってから投げる速さまでが一続きになっている。==\n\nたとえば外野手が余裕を持ってフライを捕ると、簡単に見えることがある。けれど、最初から正しい方向へ走れていたから余裕が生まれたのかもしれない。==逆に、飛びついて捕ったからといって、必ずしも最善の守備だったとは限らないのだ。==\n\n内野なら、強いゴロに追いつくだけでなく、体勢が崩れても一塁へ正確に送れるかまで見るといい。走者がいるときは、ただアウトを取るだけでなく、**次の塁へ進ませない判断**も守備の価値になる。\n\n## おもしろエピソード\n1989年、サンフランシスコ・ジャイアンツの外野手**ケビン・ミッチェル**は、カージナルスのオジー・スミスが左翼線へ打ち上げたフライを追った。ところが打球の曲がり方を読み違え、ボールを追い越してしまった。\n\nもうグラブを戻す時間がない。そこでミッチェルは、==背中側へ素手を伸ばし、そのまま右手だけでボールをつかんだ==。味方は驚きすぎて最初は無言になり、その後笑い出したという。\n\nさらに、名外野手として知られる**ウィリー・メイズ**から電話が来て、「そんな捕り方は教えていない」と言われた。ミッチェル自身は「優雅じゃなくても、アウトにできた」と振り返っている。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは髙部瑛斗が中堅、藤原恭大が右翼に入る。髙部は2022年に外野手として三井ゴールデン・グラブ賞を受賞している。外野へ打球が上がったら、ボールだけでなく、2人が打った瞬間にどちらへ動いたかを見てほしい。\n\n特にZOZOマリンの外野では、最後の捕球だけを追うより、落下点へ入るまでの動きに注目するとファインプレーに気づきやすいのだ。"}, "2-07-a": {"meta": {"id": "2-07-a", "title": "球種って？（ストレート・フォーク・チェンジアップなど）", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "images": "v2", "related": ["2-07", "2-13"], "sources": ["https://npb.jp/pl/", "https://pacificleague.com/news/2026/9/86605"]}, "body": "## ひとことで\n**球種（速さや曲がり方の違う球）**は、打者の予想を外すための道具だ。==同じ腕の振りから違う球が来るほど、打つ側は対応しにくいのだ。==\n\n## しくみ\n代表的なのは、**ストレート（まっすぐに見える速い球）**、**フォーク（打者の手元で下に落ちる球）**、チェンジアップ（速球に似たフォームから遅く投げる球）だ。スライダー（横や斜めに曲がる球）などもある。\n\n==打者を抑えるカギは、「一番すごい球」より組み合わせにある。==速球を意識させて遅い球を投げれば、打者は早く振り始めてしまう。じゃんけんで同じ手だけを出さないのと似ているのだ。\n\n## 今日の試合で見るなら\n==ロッテ先発の**A.ジャクソン**は直球とチェンジアップ、日本ハム先発の**福島蓮**は直球とフォークが見どころだ。==空振りしたとき、球が速すぎたのか、途中で落ちたのか、タイミングを外されたのかを見ると球種の違いがわかりやすい。"}, "2-07-b": {"meta": {"id": "2-07-b", "title": "何キロ出たら速い？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "images": "v2", "related": ["2-07", "2-07-a"], "sources": ["https://npb.jp/pl/", "https://npb.jp/announcement/roster/"]}, "body": "## ひとことで\n「何キロから速い」という公式の境目はない。ただ、==観戦では**150キロ前後**が出ると「かなり速い球だ」と見る目安にしやすいのだ。==\n\n## しくみ\n球速は球場表示で**「152 km/h」**のように出る。けれど、同じ150キロでも打者の感じ方は同じではない。投手の腕が見えにくい、球が伸びて見える、変化球との速度差が大きい、といった条件で打ちにくさは変わるからだ。\n\n逆に140キロ台でも、狙った場所へ投げ分ければ十分に抑えられる。==速度計は「投手の強さそのもの」ではなく、投球を読む一つの数字なのだ。==\n\n## 今日の試合で見るなら\n==今日は**A.ジャクソン**や**福島蓮**が直球を投げたら、まず表示された球速を覚えておくとよい。==その後のフォークやチェンジアップで打者の振りが遅れたり早まったりすれば、速さと速度差がセットで効いているのが見えてくる。"}, "2-07-c": {"meta": {"id": "2-07-c", "title": "何球くらい投げたら交代する？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "images": "v2", "related": ["2-07", "2-09"], "sources": ["https://www.nikkansports.com/baseball/news/202609120001034.html", "https://www.nikkansports.com/baseball/news/202607220001544.html", "https://www.nikkansports.com/baseball/news/202609270001159.html", "https://www.chunichi.co.jp/article/1317229", "https://npb.jp/bis/2026/stats/idp1_f.html"]}, "body": "## ひとことで\nプロ野球の先発投手に「○球で必ず交代」という決まりはない。==**100球前後**は観戦の目安になるが、点差や内容、次に投げる投手まで含めて監督が決めるのだ。==\n\n## しくみ\n同じ**100球**でも、**5回**で到達するのと7回で到達するのでは意味が違う。走者を何人も出して一球ごとの負担が大きければ早めに替えることもあるし、少ない球数でアウトを重ねていれば長く投げることもある。\n\n実際に今季も、101球や104球で先発が交代した試合がある。==100はルールではなく、「そろそろ**継投（投手を交代してつなぐこと）**がありそうだ」と考える目盛りなのだ。==\n\n## 今日の試合で見るなら\n==特に**福島蓮**は、**7月12日以来**の先発だ。==直前まで救援で投げ、先発予定だった加藤貴之の離脱を受けて前日に先発を告げられている。だから球数が100に届く前でも、内容や回数を見て早めに日本ハムの中継ぎ（先発のあとを受けて投げる投手）へつなぐ展開は十分考えられるのだ。"}, "2-07-d": {"meta": {"id": "2-07-d", "title": "右投げと左投げで何が違う？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "images": "v2", "related": ["2-07", "2-07-a"], "sources": ["https://npb.jp/pl/", "https://npb.jp/announcement/roster/"]}, "body": "## ひとことで\n==**右投手と左投手**では、打者から見えるボールの出どころと曲がる方向が変わる。==同じ球速でも、対戦する打者の左右で打ちやすさが変わることがあるのだ。\n\n## しくみ\n==右投手と右打者、左投手と左打者のような**「同じ側」**の対戦では、外へ逃げる変化球が使いやすい。==反対側の打者には球の見え方が変わるので、投手は球種やコースを組み替える。\n\nまた**左投手**は一塁側を向いた姿勢から投げるため、一塁走者への**牽制球（走者を塁へ戻す送球）**も右投手とは見え方が違う。左右は単なる利き腕ではなく、作戦の材料なのだ。\n\n## 今日の試合で見るなら\n==今日の先発**A.ジャクソン**と**福島蓮**はともに右腕だ。==試合途中にロッテの左腕・坂本光士郎が出て、水野達稀や清宮幸太郎のような左打者と向き合えば「左対左」になる。交代した瞬間に打者との左右関係を見ると、継投（投手を交代してつなぐこと）の意図を考えやすい。"}, "2-07": {"meta": {"id": "2-07", "title": "ピッチャーって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "images": "v2", "children": ["2-07-a", "2-07-b", "2-07-c", "2-07-d"], "related": ["2-08", "2-09", "2-13"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://pacificleague.com/news/2026/9/86605", "https://www.chunichi.co.jp/article/1317229", "https://www.mlb.com/history/negro-leagues/players/satchel-paige", "https://www.mlb.com/amp/cut4/video-ted-williams-hits-asg-walk-off-home-run-c135270768.html"], "episode": "v2"}, "body": "## ひとことで\n**ピッチャー（投手：打者にボールを投げる守備の選手）**は、毎回のプレーを始める役だ。==速い球を投げるだけでなく、打者に強い打球を打たせないことが仕事なのだ。==\n\n## しくみ\n投手は**マウンド（内野の中央にある少し高い場所）**から、**キャッチャー（捕手：本塁の後ろで球を受ける選手）**へ投げる。ストライクを3つ取れば三振だが、全部を三振にする必要はない。打ちにくいコースへ投げてゴロやフライにすれば、後ろの8人にアウトを取ってもらえるからだ。\n\n==だから投球は、速さだけの勝負ではない。==球種（速さや曲がり方の違う球）を混ぜ、同じフォームから違う軌道を見せる。さらにボール球も使い、打者が「次は何が来るか」を読み切れないようにするのだ。\n\n投手は守備にも参加する。自分の近くへ飛んだゴロを捕り、一塁へ送球することもあるし、走者がいるときは牽制球（走者を塁へ戻すための送球）も投げる。打者だけでなく、走者と守備全体を動かす役でもあるというわけだ。\n\n![マウンドから投球する投手](https://upload.wikimedia.org/wikipedia/commons/0/08/Felix_Hernandez_pitching-1.JPG \"出典：Wikimedia Commons／BlueCanoe／CC BY-SA 3.0\")\n\n## おもしろエピソード\n1997年のメジャーリーグ・オールスター戦で、強烈な速球で知られた左腕**ランディ・ジョンソン**が、ラリー・ウォーカーの頭上近くへ速球を投げた。ウォーカーは思わず身をかがめてよけた。\n\nすると次の球を待つ前に、ウォーカーはヘルメットを後ろ前にかぶり直し、普段とは逆の**右打席**へ移った。「もう左側には立ちたくない」とでも言うような冗談に、球場は笑いに包まれたのだ。\n\nその後ウォーカーは元の打ち方に戻り、結局は四球で出塁した。投手の球威は、打者の構えそのものを変えてしまうほどの圧力になることがある。\n\n## 今日の試合で見るなら\n今日の先発（試合の最初から投げる投手）は、ロッテが右腕のA.ジャクソン、日本ハムが右腕の福島蓮だ。ジャクソンは今季9勝8敗、防御率（9回を投げたとして何点取られるかの目安）3.44で、勝てば10勝目。福島は7月12日以来の先発で、それまでは救援（試合途中から投げる役）を続けていた。\n\n同じ右投げでも、投げ方と球種はかなり違う。ジャクソンは力のある直球とチェンジアップ、福島は角度のある直球とフォークが持ち味だ。球速表示だけでなく、打者の空振り方やゴロの増え方を見ると、投手の狙いが少し見えてくるのだ。"}, "2-08-a": {"meta": {"id": "2-08-a", "title": "サインって何を決めてるの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-08", "2-07"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html"]}, "body": "## ひとことで\n==**捕手のサイン**は、主に「どの球種を、どこへ投げるか」を投手と共有する合図だ。==1球ごとの小さな作戦会議だと思えばいい。\n\n## しくみ\n同じ打者でも、ストライクやボールの数、アウト数、走者の有無、直前に投げた球で狙いは変わる。こうした一連の組み立てを**配球（はいきゅう：投げる球の順番や場所の組み立て）**という。\n\n捕手が案を出しても、投手が違う球を選びたいことはある。==サインで確かめたいのは、投げる前に2人の考えが一致しているかどうかなのだ。==\n\n![本塁後方で構える捕手](https://upload.wikimedia.org/wikipedia/commons/4/45/Baseball_Catcher.JPG \"出典：Wikimedia Commons／Jyothis／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n==ロッテの**佐藤都志也**と**ジャクソン**、日本ハムの田宮裕涼と福島蓮の組み合わせに注目してほしい。==同じ打者にストレートを続けるのか、途中で変化球を混ぜるのかを見ると、サインの意味を想像しやすいのだ。"}, "2-08-b": {"meta": {"id": "2-08-b", "title": "盗塁を刺すってどういうこと？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-08", "2-11"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/71075151.html"]}, "body": "## ひとことで\n==**「盗塁を刺す」**は、走者が次の塁を盗もうとしたとき、捕手が送球してアウトにすることだ。====捕手の肩だけでなく、投手と内野手も関わる共同作業なのだ。==\n\n## しくみ\nたとえば一塁走者が二塁へ走る。捕手は投球を受けたらすぐ持ち替えて二塁へ投げ、内野手がボールを受けて走者にタッチする。\n\n勝負はほんの短い時間で決まる。走者のスタート、投手が本塁へ投げる速さ、捕手の捕球と送球、内野手のタッチが全部つながっているのだ。\n\n記録では、盗塁を試みてアウトになった走者に**盗塁刺**が記録される。「捕手が刺した」は、その守備側から見た言い方だ。\n\n![本塁後方で構える捕手](https://upload.wikimedia.org/wikipedia/commons/4/45/Baseball_Catcher.JPG \"出典：Wikimedia Commons／Jyothis／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n==日本ハムの**西川遥輝**は**9月27日終了時点で通算345盗塁**だ。==途中出場して一塁に出たとき、ロッテの捕手が佐藤都志也なら、投球後すぐ二塁方向を見るとよい。盗塁の攻防を追いやすいのだ。"}, "2-08-c": {"meta": {"id": "2-08-c", "title": "キャッチャーが立ち上がって構えるのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-08", "2-11"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html", "https://npb.jp/scores/2026/0927/m-f-23/roster.html"]}, "body": "## ひとことで\n**キャッチャー（捕手）**が立って構えるのは、走者の盗塁を強く警戒し、捕ってすぐ送球しやすくしたい場面などだ。==いつもの低い姿勢と違うなら、走者への警戒が強まった合図として見られる==のだ。\n\n## しくみ\n座った姿勢から二塁へ投げるには、捕球して立ち、足を送球方向へ運ぶ必要がある。最初から高く構えれば、その動きを短くできる。\n\nまた、投手に高めや外側へ外す球を要求し、走者を刺す準備をすることもある。ただし、==立っただけで必ず盗塁が来ると決まったわけではない==のだ。\n\n## 今日の試合で見るなら\n9月27日の同カードでは、ロッテは**佐藤都志也**、日本ハムは**田宮裕涼**がベンチ入りしていた。今日も出場し、一塁に走者がいる場面で捕手が急に立ったら、==打者だけでなく一塁走者にも目を移す==と次のプレーを追いやすいのだ。"}, "2-08": {"meta": {"id": "2-08", "title": "キャッチャーって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-08-a", "2-08-b"], "related": ["2-07", "2-11"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/bis/players/71075151.html", "https://npb.jp/bis/players/51055138.html", "https://sabr.org/journal/article/the-evolution-of-catchers-equipment/", "https://www.mlb.com/news/don-larsens-perfect-game-had-yogis-touch/c-151171602", "https://baseballhall.org/discover/inside-pitch/larsen-perfect-game"], "episode": "v2"}, "body": "## ひとことで\n**キャッチャー（捕手）**は、本塁の後ろで投手の球を受ける守備の中心だ。==捕るだけでなく、投球の相談、走者への警戒、送球、ワンバウンドの処理まで担当するのだ。==\n\n## しくみ\n投手が投げるたび、捕手は球を受ける。だから1試合の守備でボールに触れる回数がとても多く、投手と一緒に打者をどう打ち取るか考える役になる。\n\n投球前には、**球種（ストレートや変化球の種類）**や狙う場所を投手と共有する。走者がいるときは、盗塁を警戒しながら、ワンバウンドした球を体で止めて進塁を防ぐ仕事もある。\n\nさらに、打球が前へ転がれば素早く拾い、ファウルフライなら防具を着けたまま追う。本塁で走者と勝負する場面では、送球を受けてタッチする。==投手の相棒であり、本塁周辺の守備をまとめる選手なのだ。==\n\n![本塁後方で構える捕手](https://upload.wikimedia.org/wikipedia/commons/4/45/Baseball_Catcher.JPG \"出典：Wikimedia Commons／Jyothis／CC BY-SA 3.0\")\n\n## おもしろエピソード\n1956年のワールドシリーズ（メジャーリーグの年間王者を決めるシリーズ）第5戦で、ヤンキースの投手**ドン・ラーセン**は、相手を一人も塁に出さない完全試合を達成した。ワールドシリーズでは史上初だった。\n\n最後の打者を三振にすると、捕手の**ヨギ・ベラ**は本塁から走り出し、そのままラーセンの腕の中へ飛びついた。この写真は野球史を代表する一枚になった。\n\nラーセンは後に、緊張で頭が回らず「ヨギに考えてもらった」と振り返っている。==捕手は球を受けるだけでなく、投手と一緒に27個のアウトを組み立てる相棒==なのだ。\n\n## 今日の試合で見るなら\n予想スタメンどおりなら、ロッテは佐藤都志也がアンドレ・ジャクソン、日本ハムは田宮裕涼が福島蓮とバッテリーを組む。\n\n投手が投げる前、捕手は毎回ほぼ同じ場所に座っているようで、実は構えや要求が少しずつ変わる。投球だけでなく、その直前の捕手の動きを見ると、1球ごとの作戦が見えやすくなるのだ。"}, "2-09-a": {"meta": {"id": "2-09-a", "title": "勝ち投手・負け投手・セーブ・ホールドって？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-09"], "sources": ["https://npb.jp/npb/20050203stats.html", "https://npb.jp/news/detail/20190315_04.html", "https://npb.jp/bis/2026/stats/pit_p.html", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\n==これは「投手が試合のどの場面を担当したか」を表す記録だ。==チームの勝敗と同じではなく、1試合の中で勝ち投手、セーブ、ホールドが別々の投手につくことがある。\n\n## しくみ\n勝ち投手は、勝ったチームで勝ちにつながる時点を担当した投手だ。**先発（試合の最初から投げる投手）**は原則**5回以上**を投げ、リードしたまま降り、そのリードが最後まで続くと勝ち投手になる。5回未満で降りた場合は、救援投手（途中から出てくる投手）の中から記録員が規則に沿って決める。\n\n負け投手は、相手が最後まで守ったリードにつながる走者を出した投手につくのが基本だ。==**セーブ**は、接戦の終盤を最後まで投げ切った救援投手につく記録。==**ホールド**は、決められた接戦の場面でリードや同点を保って次へつないだ救援投手につく。\n\n![マウンドから投球する投手](https://upload.wikimedia.org/wikipedia/commons/0/08/Felix_Hernandez_pitching-1.JPG \"出典：Wikimedia Commons／BlueCanoe／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n==**A.ジャクソン**は今日勝てば**10勝目**だ。==一方、ロッテの**横山陸人**は今季**33セーブ**。ロッテが終盤に小差でリードし、中継ぎがつないで横山が最後を締めれば、1試合で「勝ち・ホールド・セーブ」が別々の投手につく流れを見られるかもしれない。"}, "2-09-b": {"meta": {"id": "2-09-b", "title": "先発はなぜ6日くらい空けて投げるの？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-07-c", "2-09"], "sources": ["https://www.nikkansports.com/baseball/news/202607270000480.html", "https://www.nikkansports.com/baseball/news/202606160001168.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0922/m-b-24/box.html", "https://pacificleague.com/news/2026/6/10051440"]}, "body": "## ひとことで\n先発は一度に何十球も強く腕を振るので、次の登板まで回復と準備の時間が必要だ。==日本のプロ野球では**「中6日」**、つまり登板の間に**6日間**休んで次に投げる形がよく使われる。==\n\n## しくみ\n==月曜日に投げ、火曜から日曜まで6日空け、次の月曜日にまた投げる。これが中6日だ。==その間はただ休むわけでもない。体を戻し、軽い投球や**ブルペン（投球練習場）**での投球をはさみ、次の相手への準備をする。\n\n楽天の**吉井理人監督**も**2026年**、基本は中6日で回し、一定のリズムを作る考えを説明している。毎回同じ間隔なら、投手も「何日前に何をするか」を組み立てやすいのだ。\n\n![マウンドから投球する投手](https://upload.wikimedia.org/wikipedia/commons/0/08/Felix_Hernandez_pitching-1.JPG \"出典：Wikimedia Commons／BlueCanoe／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n==ロッテの**A.ジャクソン**は**9月22日**に登板し、今日はそこから**中5日**だ。==中6日は目安であって、日程やチーム事情で前後する。今日の投球では、間隔が少し短い中で何回まで球威を保てるかも見どころになる。"}, "2-09-c": {"meta": {"id": "2-09-c", "title": "ブルペンって？どこにある？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-09"], "sources": ["https://www.marines.co.jp/community/marineslinks/20250825-01.html", "https://www.marines.co.jp/community/marineslinks/20241105-01.html", "https://npb.jp/announcement/roster/", "https://npb.jp/bis/2026/stats/idp1_m.html"]}, "body": "## ひとことで\n==**ブルペン**は、試合に出る前の投手が**肩を作る（投げられる状態まで体を温める）**ための投球練習場所だ。==「ブルペン陣」と言うと、中継ぎや抑えの投手たち全体を指すこともある。\n\n## しくみ\n先発が苦しくなってから次の投手が準備を始めたのでは遅い。**救援投手（途中から出てくる投手）**はブルペンで投げ、体と球の感覚を実戦に近づけてから登板する。だからベンチは、試合の少し先を読んで準備を進めるのだ。\n\n**ZOZOマリン**には**1塁側と3塁側**にブルペンがあることが、ロッテ公式の記事でも確認できる。==球場で「ブルペンが動いた」と聞こえたら、投手交代が近づいている合図だと考えるとよい。==\n\n![野球場のブルペン](https://upload.wikimedia.org/wikipedia/commons/e/e1/Parc_Henri-Casault%2C_terrain_de_baseball_1%2C_enclos_des_releveurs.jpg \"出典：Wikimedia Commons／Ptaff／CC0 1.0\")\n\n## 今日の試合で見るなら\n==ロッテは**1塁側**、日本ハムは**3塁側**だ。==A.ジャクソンの球数が増えれば、中森俊介、八木彬、横山陸人ら救援陣の出番を考える時間になる。福島蓮は久しぶりの先発なので、日本ハム側はさらに早い回から次の投手を準備する展開もあり得るのだ。"}, "2-09": {"meta": {"id": "2-09", "title": "先発とか中継ぎとか抑えって？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["2-09-a", "2-09-b", "2-09-c"], "related": ["2-07", "2-07-c"], "sources": ["https://npb.jp/pl/", "https://npb.jp/bis/2026/stats/idp1_m.html", "https://npb.jp/bis/2026/stats/idp1_f.html", "https://npb.jp/announcement/roster/", "https://pacificleague.com/news/2026/9/86605", "https://www.nikkansports.com/baseball/news/202609270001159.html", "https://www.chunichi.co.jp/article/1317229", "https://npb.jp/scores/2026/0925/l-m-22/box.html", "https://npb.jp/scores/2026/0926/l-m-23/box.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.mlb.com/amp/news/how-sparky-lyle-launched-closer-entrance-music-c272813672.html", "https://www.mlb.com/news/randy-johnson-top-career-moments"], "episode": "v2"}, "body": "## ひとことで\n投手は、一人で9回すべてを投げるとは限らない。==最初に投げる**先発**、途中をつなぐ**中継ぎ**、最後を任される抑えに役割を分けて戦うのだ。==\n\n## しくみ\n先発（試合の最初から投げる投手）は、できるだけ長い回を投げて試合を作る役だ。そこから中継ぎ（試合途中から短い回を受け持つ投手）がつなぐ。勝っている終盤には、セットアッパー（主に7、8回の重要な場面を任される投手）や抑え（最後の回を締める投手）が出てくる。\n\nこの交代の流れを**継投（複数の投手で試合をつなぐこと）**という。監督は点差、打者の左右、各投手の疲労、前日までの登板などを見て決める。同じ「7回」でも、毎日同じ投手が出るわけではないのだ。\n\nロッテでは今季、横山陸人が33セーブを挙げて抑えを担っている。中森俊介、八木彬、鈴木昭汰らも多くの救援登板を重ねてきた。==先発が降りた後も、試合では別の勝負が始まるというわけだ。==\n\n![野球場のブルペン](https://upload.wikimedia.org/wikipedia/commons/e/e1/Parc_Henri-Casault%2C_terrain_de_baseball_1%2C_enclos_des_releveurs.jpg \"出典：Wikimedia Commons／Ptaff／CC0 1.0\")\n\n## おもしろエピソード\n2001年のワールドシリーズで、アリゾナ・ダイヤモンドバックスの**ランディ・ジョンソン**は、第6戦に先発して7回を投げた。普通なら翌日は休むほどの仕事量だ。\n\nところが翌日の最終第7戦、チームが1点負けている8回途中に、ジョンソンは今度は**中継ぎとして登板**した。前日に先発した投手が、翌日に救援で出てきたのだ。\n\nジョンソンは8回の最後の打者を抑え、9回も三者凡退。その裏に味方が逆転サヨナラ勝ちし、ジョンソンが勝利投手になった。==「先発」「中継ぎ」は固定された肩書きではなく、大一番では役割を越えて投げることもある==という例だ。\n\n## 今日の試合で見るなら\nロッテ先発のA.ジャクソンは9勝目まで挙げており、まず何回まで投げるかがポイントだ。鈴木昭汰は9月25日から27日まで3日連続で登板しているため、今日の起用は負荷との相談になる。中森、八木、横山へどうつなぐかを見ると、ロッテの継投がわかりやすい。\n\n日本ハムの福島蓮は事情が違う。7月12日を最後に先発から離れ、その後は16試合に救援登板していたが、先発予定だった加藤貴之の離脱で前日に今日の先発を告げられた。長い回を当然のように任せる日ではなく、早めに中継ぎへつなぐ展開も想定して見ると、ベンチの動きが読みやすいのだ。"}, "2-10-a": {"meta": {"id": "2-10-a", "title": "ゲッツー（併殺打）って？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-10", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.mlb.com/milb/news/oklahoma-city-comets-turn-unusual-double-play"], "episode": "v2"}, "body": "## ひとことで\n==**ゲッツー**は、守備側が一つの流れで**2つアウト**を取る併殺（ダブルプレー）のことだ。== **併殺打**は、その原因になった打者の打撃を示す記録なのだ。\n\n![二塁で走者をアウトにして一塁へ送球する野手](https://upload.wikimedia.org/wikipedia/commons/5/53/Max_Moroff_in_2017_%2834361189243%29.jpg \"出典：Wikimedia Commons／Keith Allison／CC BY-SA 2.0\")\n\n## しくみ\n==典型は一塁走者がいる場面の**内野ゴロ（内野に転がる打球）**だ。== **遊撃手（ショート）**や二塁手が二塁で走者をアウトにし、すぐ一塁へ送って打者走者（打って一塁へ走る打者）もアウトにする。\n\n==「併殺」と「併殺打」は完全に同じではない。== たとえば三振と盗塁失敗が同じプレーで重なれば、アウトは一度に**2つ**増える。それでも打者の打球から起きたプレーではないので、併殺打には数えないのだ。\n\n## おもしろエピソード\n2026年6月、ドジャース傘下の**3Aオクラホマシティ（メジャー直下のチーム）**で、かなり変わったゲッツーが起きた。左翼手の**ジャック・スウィンスキー**が浅いフライへ滑り込んだが、ボールはグラブから上へ飛び出したのだ。\n\nそこへ走り込んでいた三塁手の**ノア・ミラー**が、地面に落ちる前にそのボールをキャッチした。さらに一塁へ投げ、飛び出していた走者までアウトにした。==「落とした」と見えた一瞬が、左翼→三塁→一塁の「7-5-3」という珍しいゲッツーになった==のだ。\n\n## 今日の試合で見るなら\nロッテの山崎剛と小川龍成、日本ハムの水野達稀と山縣秀が二遊間（二塁手と遊撃手のコンビ）に入れば注目だ。一塁に走者がいてゴロが飛んだら、最初の送球先が二塁かどうかを見るとゲッツーを追いやすい。"}, "2-10-b": {"meta": {"id": "2-10-b", "title": "3つ一気に取るトリプルプレーは？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-10", "2-12"], "sources": ["https://npb.jp/history/2025/review_rec_f.html", "https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html", "https://sabr.org/gamesproj/game/october-10-1920-a-game-of-world-series-firsts-unassisted-triple-play-and-grand-slam/"], "episode": "v2"}, "body": "## ひとことで\n==ある。**三重殺（トリプルプレー：一つのプレーで3つアウトを取ること）**という、とても珍しい守備なのだ。==\n\n![二塁で走者をアウトにして一塁へ送球する連続守備](https://upload.wikimedia.org/wikipedia/commons/5/53/Max_Moroff_in_2017_%2834361189243%29.jpg \"出典：Wikimedia Commons／Keith Allison／CC BY-SA 2.0\")\n\n## しくみ\n==起きやすい入口は、**ノーアウト**で走者が**2人以上**いる場面だ。== たとえば一・二塁で内野への強いライナー（地面につかずに飛ぶ打球）を野手が捕り、飛び出していた走者を二塁、一塁で続けてアウトにすると3アウトになる。\n\nゴロでも、三塁、二塁、一塁と送って三つ取る形がある。==条件も送球もそろわないと成立しないので、普通の**併殺**よりずっと珍しい。==\n\n## おもしろエピソード\n1920年のワールドシリーズ第5戦で、クリーブランド・インディアンス（今のガーディアンズ）の二塁手**ビル・ワムズガンス**は、1人で3つのアウトを取った。\n\n無死一・二塁でライナーを捕ると、そのまま二塁を踏んで飛び出していた二塁走者をアウトにし、さらに一塁から走ってきた走者へタッチした。==送球は一度もなく、ワムズガンス1人だけで三重殺が完成した==のだ。\n\nあまりに突然だったので、球場はまず静まり返った。観客が何が起きたか理解すると歓声が上がった。このプレーは、ワールドシリーズで記録された唯一の無補殺三重殺（1人で完成させるトリプルプレー）として残っている。\n\n## 今日の試合で見るなら\nノーアウト一・二塁になったら少しだけ意識するといい。水野達稀や山崎剛の近くへ鋭い打球が飛び、走者が大きく飛び出していたら、二つ目だけでなく三つ目のアウトまで続く可能性があるのだ。"}, "2-10-c": {"meta": {"id": "2-10-c", "title": "ゲッツーを防ぐために走者は何をする？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-10", "2-11"], "sources": ["https://npb.jp/npb/2017rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n一塁走者は、まず二塁でセーフになるよう全力で走る。滑り込むなら**正しいスライディング（ベースへ滑り込むこと）**を使い、==野手にわざとぶつかって邪魔するのは反則なのだ。==\n\n## しくみ\n**併殺（ゲッツー：1つの打球で2つアウトを取ること）**は、一塁に走者がいて内野ゴロが出たときに起きやすい。走者が二塁でセーフになれば、そこで1つ目のアウトを取れないので、==ゲッツーそのものを防げる==。\n\n二塁でアウトになりそうでも、走者は正規の走路を走り、滑るならベースへ向かって滑る。NPBでは2017年に、併殺を防ぐため野手へ接触しようとする不正なスライディングは妨害になると明文化された。==「野手を倒して送球を止める」はしてはいけない==というわけだ。\n\n## 今日の試合で見るなら\nたとえばロッテの**西川史礁**が一塁に出て、次の**山口航輝**が遊撃手や二塁手へゴロを打った場面だ。==西川が二塁へどう走るかまで見ると、打者だけでなく走者もゲッツーと戦っている==のが分かるのだ。"}, "2-10": {"meta": {"id": "2-10", "title": "一気に2つアウトを取ることがあるの？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["2-10-a", "2-10-b"], "related": ["1-08", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://baseballhall.org/hall-of-famers/tinker-joe"], "episode": "v2"}, "body": "## ひとことで\nある。==一つのプレーで**2人をアウト**にする**併殺（ダブルプレー：一度に2つアウトを取ること）**があるのだ。==内野ゴロで「二塁アウト、すぐ一塁アウト」がいちばん見つけやすい形だ。\n\n## しくみ\nたとえばノーアウト一塁で、打者が遊撃手（ショート：二塁と三塁の間を守る選手）の近くへゴロを打ったとする。一塁走者は二塁へ進まなければならないので、守備側はまず二塁で走者をアウトにし、すぐ一塁へ送って打者走者（打って一塁へ走る打者）もアウトにできる。\n\n==これでアウト数は**0から2**へ一気に増える。==守る側には大きな得で、攻撃側には走者まで消える痛いプレーなのだ。\n\n二塁手や遊撃手が気にするのは、捕ってから投げる速さだけではない。次の送球がしやすい向きでボールを受けることも大事にしている。==二塁ベース付近の動きが急に速くなったら、併殺を狙っている可能性が高い。==\n\nただし、すでにツーアウトなら二つ目のアウトは取れない。最初の一つが三つ目のアウトになり、その瞬間に攻撃が終わるからだ。\n\n![二塁付近で併殺を狙う守備](https://upload.wikimedia.org/wikipedia/commons/4/47/Double_play.jpg \"出典：Wikimedia Commons／Rdikeman／CC BY-SA 3.0\")\n\n## おもしろエピソード\n1900年代初めのシカゴ・カブスには、**ジョー・ティンカー（遊撃手）**、**ジョニー・エバース（二塁手）**、**フランク・チャンス（一塁手）**という名内野陣がいた。3人の併殺は1910年の新聞の詩に「Tinker to Evers to Chance」と詠まれ、名前の並びだけでゲッツーを連想させるほど有名になった。\n\nところが、ティンカーとエバースは私生活では長いあいだ口をきかなかった。==話さない2人が、試合では息を合わせて二つのアウトを取っていた==のだ。2人が公の場で仲直りしたのは、引退後の1938年ワールドシリーズで同じラジオ席に座ったときだった。\n\n## 今日の試合で見るなら\n予想どおりなら、ロッテは遊撃の山崎剛と二塁の小川龍成、日本ハムは遊撃の水野達稀と二塁の山縣秀が二遊間（二塁手と遊撃手のコンビ）を組む。ノーアウトかワンナウトで一塁に走者が出たら、打球だけでなく二塁ベースも見るといい。\n\nゴロが二遊間へ飛んだ瞬間、野手が二塁、一塁へ続けて投げればゲッツーの場面だ。スコアボードのアウト表示が一気に二つ増えるので、初めてでも結果を確認しやすい。"}, "2-11-a": {"meta": {"id": "2-11-a", "title": "牽制球って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-11", "2-08"], "sources": ["https://npb.jp/bis/players/63165155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==**牽制球（けんせいきゅう）**は、投手が本塁ではなく走者のいる塁へ投げる球だ。== 走者をアウトにするか、塁から大きく離れにくくする狙いがあるのだ。\n\n![次の塁を狙って滑り込む走者](https://upload.wikimedia.org/wikipedia/commons/b/b3/Granderson-20th_stolen_base_2007.jpg \"出典：Wikimedia Commons／Kevin.Ward／CC BY-SA 2.0\")\n\n## しくみ\n一塁走者は、次の塁へ進みやすくするため少し塁から離れる。離れすぎれば、投手が一塁へ素早く投げ、野手が**タッチ**してアウトを狙える。\n\nアウトにならなくても意味はある。走者を塁の近くへ戻せれば、**盗塁（投球の間に次の塁へ走ること）**のスタートが遅れやすくなるからだ。==牽制は「走るな」と圧力をかける守備でもある。==\n\n## 今日の試合で見るなら\n日本ハムの1番予想・**水野達稀**が一塁に出たら、ロッテ先発の**ジャクソン**を見てほしい。==本塁へ投げる前に一塁を見る回数や、実際に牽制を入れるかで、水野の足をどれだけ警戒しているかが見えやすいのだ。=="}, "2-11-b": {"meta": {"id": "2-11-b", "title": "誰が走るの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-11", "2-17"], "sources": ["https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html"]}, "body": "## ひとことで\n==盗塁するのは**足が速い選手**が中心だが、それだけでは決まらない。== 投手の動きを読む力、スタート、成功率、試合の状況まで含めて「走れる選手」になるのだ。\n\n![二塁への盗塁で滑り込む走者](https://upload.wikimedia.org/wikipedia/commons/b/b3/Granderson-20th_stolen_base_2007.jpg \"出典：Wikimedia Commons／Kevin.Ward／CC BY-SA 2.0\")\n\n## しくみ\n**50メートル走**が速くても、投手の動き出しを読めなければ出遅れる。==逆に、最初の一歩がうまい選手は、純粋な足の速さ以上に盗塁で強みを出せる。==\n\nさらに、相手捕手の送球や点差も関係する。**1点**が重要な場面では、アウトになる危険と、二塁へ進む価値を比べて走るか決めるのだ。\n\n## 今日の試合で見るなら\n日本ハムでは**水野達稀**が今季**15盗塁**。西川遥輝は通算345盗塁で、現役最多だ。\n\n水野が先発で出塁したとき、**西川遥輝**が途中から代走（走者の代わり）や代打（打者の代わり）で出て塁に残ったときは、打者だけを見ず一塁走者も見てほしい。==投手が投げる直前の一歩に、走る選手の技術が出るのだ。=="}, "2-11-c": {"meta": {"id": "2-11-c", "title": "盗塁が成功しやすいのはどんなとき？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-11", "2-08"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n盗塁は足の速さだけで決まらない。==投手が本塁へ投げる瞬間を読んで、よいスタートを切れたとき==に成功しやすくなるのだ。\n\n## しくみ\n走者は**リード（塁から少し離れて取る準備距離）**を取り、投手の動きを見る。投手が牽制球（一塁へ投げて走者を戻す球）ではなく本塁へ投げると読めれば、早く走り出せる。\n\n捕手がワンバウンド気味の球を処理したり、投球が外れたりすると送球が遅れることもある。逆に投手が素早く投げ、捕手が捕りやすい球なら盗塁側は苦しい。==盗塁は「走者対捕手」ではなく、投手も含めた時間の競争==なのだ。\n\n## 今日の試合で見るなら\n日本ハムの**西川遥輝**は通算350盗塁まであと5だ。今日、出塁したら一塁上の動きを見てほしい。==投手が投げる前の数秒から、盗塁の勝負は始まっている==のだ。"}, "2-11": {"meta": {"id": "2-11", "title": "盗塁ってなに？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "episode": "v2", "children": ["2-11-a", "2-11-b"], "related": ["2-08", "1-06"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/history/acb_sb.html", "https://npb.jp/bis/players/21225133.html", "https://npb.jp/bis/players/63165155.html", "https://ja.wikipedia.org/wiki/福本豊", "https://ja.wikipedia.org/wiki/クイックモーション", "https://en.wikipedia.org/wiki/Rickey_Henderson"]}, "body": "## ひとことで\n==**盗塁**は、走者が打球を待たずに次の塁を狙って進むプレーだ。== 成功すればヒットがなくても塁を一つ進めるが、失敗するとアウトになるのだ。\n\n## しくみ\n代表的なのは、一塁走者が投手の投球動作に合わせて走り出し、**二塁**を狙う形だ。捕手は投球を受けると二塁へ送り、走者がタッチされる前に塁へ着けば成功になる。\n\n==だから盗塁は、単純な足の速さだけの勝負ではない。== 投手がいつ本塁へ投げるかを読むこと、よいスタートを切ること、捕手の送球より先に着くことが必要なのだ。\n\n失敗すれば走者が一人減るので、いつでも走ればいいわけではない。**アウト数**、点差、打者、相手投手や捕手を見ながら、成功しやすい場面を選ぶ。\n\nまた、走者が進んでも必ず盗塁になるわけではない。守備側が進塁を止める動きをほとんど見せない場合などは、公式記録で盗塁が付かないことがあるのだ。\n\n![三塁へ盗塁する走者とタッチする野手](https://upload.wikimedia.org/wikipedia/commons/8/81/Baseball_steal.jpg \"出典：Wikimedia Commons／Rick Dikeman／CC BY-SA 3.0\")\n\n## おもしろエピソード\n盗塁は「塁を盗む」と書く。この言葉を、本当にやってしまった選手がいるのだ。\n\nメジャーリーグで通算**1406盗塁**という、今も破られていない記録を持つ**リッキー・ヘンダーソン**だ。1991年、彼は三塁への盗塁で歴代最多記録を塗り替えた。すると、その場で三塁ベースを地面から**引っこ抜き**、両手で頭の上に高く掲げてみせたのだ。\n\n==盗んだ塁を、文字どおり持ち上げてしまった==わけだ。ちなみにベースは、差し込み式で地面に留めてあるので、力を入れれば抜けるのだ。\n\nもう一つ。走者が一塁にいると、投手は足をあまり上げずに素早く投げる（**クイックモーション**）。この投げ方は、1970年代に阪急ブレーブス（今のオリックス）の**福本豊**という、とにかく盗塁ばかり決める選手を止めるために広まったと言われている。1人の足の速い選手が、世の中の投手全員の投げ方を変えてしまったのだ。\n\n## 今日の試合で見るなら\n予想スタメンの1番・**水野達稀**は今季**15盗塁**。まず初回、水野が出塁したら、打者だけでなく一塁走者にも注目してほしい。==そのときジャクソンが足を上げずに素早く投げていたら、それがクイックモーション==なのだ。\n\n日本ハムの**西川遥輝**は、9月27日終了時点で通算345盗塁。現役選手では最多で、==通算350盗塁まであと5==だ。途中出場して塁に出た場面は見逃せない。投手が本塁を向いている間に、西川のリード（塁から離れて取る準備距離）が少しずつ変わるところから、盗塁の駆け引きは始まっているのだ。"}, "2-12-a": {"meta": {"id": "2-12-a", "title": "犠牲フライって？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-12", "1-09"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==**犠牲フライ（外野フライのアウトと引き換えに走者を生還させる打撃）**は、ノーアウトかワンナウトで走者が得点したときに記録されるのだ。==\n\n![外野でフライを捕ろうとする野手](https://upload.wikimedia.org/wikipedia/commons/d/d7/Matsui_catching_fly_ball.jpg \"出典：Wikimedia Commons／Terren Peterson／CC BY 2.0\")\n\n## しくみ\nたとえば**ワンナウト三塁**。打者が外野へ深いフライを打ち、外野手が捕ると打者はアウトになる。\n\n==三塁走者は捕球後に三塁からスタートし、本塁へ帰れば**1点**だ。== これが典型的な犠牲フライで、打者には打点（ヒットなどで走者を帰した数）が付き、打率の計算に使う打数には数えない。\n\n==ツーアウトでは、フライを捕られた時点で**3アウト**なので犠牲フライにはならない。== アウト数を見る理由がここにあるのだ。\n\n## 今日の試合で見るなら\n**山口航輝**や**清宮幸太郎**の打席で、ノーアウトかワンナウト三塁になったら外野の位置も見るといい。==深いフライが上がったら、捕球だけで終わりではなく、三塁走者のスタートと本塁への返球までが一つの勝負なのだ。==\n\n右翼（ライト）に**万波中正**や**藤原恭大**が入れば、本塁へ投げる場面にも注目できる。"}, "2-12-b": {"meta": {"id": "2-12-b", "title": "ツーアウトからは全力で走るって本当？", "category": "2", "level": "2", "priority": "star", "needs_check": false, "styled": true, "related": ["2-12", "1-09"], "sources": ["https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==本当だ。**ツーアウト**では次のアウトで攻撃が終わるので、走者は打球が飛んだら先の塁を狙って強くスタートするのが基本なのだ。==\n\n![ボール・ストライク・アウト数が表示された野球場のスコアボード](https://upload.wikimedia.org/wikipedia/commons/1/1b/Kamagaya-stadium-scoreboard.png \"出典：Wikimedia Commons／Pingguopomme／CC0 1.0\")\n\n## しくみ\n==フライなら、捕られた時点で**3アウト**になる。== 走者が元の塁で待っていても攻撃は終わるので、捕られなかった場合に備えて早く走るほうが得になる。\n\nゴロでも同じで、守備がアウトを取る前に少しでも先へ進みたい。ただし==「何でも走れば点になる」わけではない。==\n\n三つ目のアウトが**フォースアウト（進塁義務のある走者を塁でアウトにすること）**なら、その前に別の走者が本塁を踏んでも得点にならない場合がある。速さだけでなく、どこで3アウト目が成立したかも大事なのだ。\n\n## 今日の試合で見るなら\nツーアウトで**髙部瑛斗**や**矢澤宏太**が塁にいたら、==打球が飛んだ瞬間のスタートを見るといい。== 外野の前に落ちる打球なら、一つ先ではなく一気に本塁まで狙う場面もあり得る。"}, "2-12-c": {"meta": {"id": "2-12-c", "title": "ツーアウト満塁が盛り上がるのはなぜ？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-12", "1-09", "2-14"], "sources": ["https://npb.jp/news/detail/20180920_03.html", "https://npb.jp/news/detail/20260807_02.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ツーアウト満塁（2人アウトで、一・二・三塁すべてに走者がいる状態）**は、==次のプレーで0点のまま攻撃終了にも、一気に複数点にもなりうる==。結果の振れ幅が大きいから、緊張感が高いのだ。\n\n## しくみ\nツーアウトでは、守備があと1つアウトを取ればその回は終わる。一方で満塁なら、安打が出れば複数の走者が帰る可能性があり、ホームランなら**4点**入る。==攻撃側は大得点、守備側は無失点終了が、同じ1球の先にある==わけだ。\n\nさらに満塁では、**四球（ボール4つで一塁へ進むこと）**や死球（投球が体に当たること）でも、三塁走者が押し出されて1点入る。逆に内野ゴロなら、走者が次の塁へ進まなければならない**フォースプレー（塁を踏めばアウトにできるプレー）**で3つ目のアウトを狙える。==打球だけでなく、投手がストライクを取れるかまで重要になる==のだ。\n\n## 今日の試合で見るなら\nたとえば日本ハムの**清宮幸太郎**がツーアウト満塁で打席に入った場面だ。==安打なら走者が一気に動き、四球でも1点、アウトならその回は終了==。スコアボードの「2 OUT」と満塁の表示を一緒に見ると、なぜ球場が注目する場面なのか分かりやすいのだ。"}, "2-12": {"meta": {"id": "2-12", "title": "ワンナウト、ツーアウトのちがいは？", "category": "2", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["2-12-a", "2-12-b"], "related": ["1-08", "2-10"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/games/2026/schedule_09_detail.html", "https://npb.jp/scores/2026/0927/m-f-23/box.html", "https://www.mlb.com/news/greatest-baseball-bloopers"], "episode": "v2"}, "body": "## ひとことで\n==アウトは**3つ**で**攻守交代**になる。== だから同じ「走者三塁」でも、ノーアウト、ワンナウト、ツーアウトでは攻撃の選び方がかなり変わるのだ。\n\n![ボール・ストライク・アウト数が表示された野球場のスコアボード](https://upload.wikimedia.org/wikipedia/commons/1/1b/Kamagaya-stadium-scoreboard.png \"出典：Wikimedia Commons／Pingguopomme／CC0 1.0\")\n\n## しくみ\nノーアウトなら、まだ**3つのアウト**を使える。打者がアウトになっても走者を進めれば、次の打者で点を取る余地が残る。\n\nワンナウトなら、残りは**2つ**だ。==三塁に走者がいると、外野フライを打って捕られても、走者が本塁へ帰れば**犠牲フライ（アウトと引き換えに点を取るフライ）**になることがある。==\n\n==ツーアウトでは次のアウトで攻撃終了だ。== フライを捕られればその瞬間に終わるので、犠牲フライは成立しない。逆に走者は、打球が抜けたときに少しでも先へ行けるよう、打った瞬間から強く走る意味が大きくなる。\n\n守る側も考え方が変わる。ワンナウト一塁なら**併殺（一度に2つアウトを取ること）**で一気にチェンジ（攻守交代）を狙えるが、ツーアウトならまず一つアウトを取れば十分なのだ。\n\n## おもしろエピソード\n1908年9月、ニューヨーク・ジャイアンツ（今のサンフランシスコ・ジャイアンツ）とカブスは、優勝争いの大事な試合をしていた。9回裏、2アウト一・三塁で打者が安打を放ち、三塁走者が本塁へ帰ったので、ジャイアンツのサヨナラ勝ちに見えた。\n\nところが一塁走者の**フレッド・マークル（19歳の新人）**は、観客がグラウンドへなだれ込むのを見て、二塁を踏まずに引き揚げてしまった。カブスの二塁手**ジョニー・エバース**がそこに気づき、二塁でフォースアウト（進まなければならない走者を塁でアウトにすること）を取った。==それが「3つ目のアウト」になり、入ったはずの決勝点は認められなかった==のだ。\n\n当時は観客が試合終了と同時にグラウンドへ入ることも多く、マークルだけが特別に変な行動をしたわけではない。それでも試合は後日やり直され、カブスが勝ってリーグ優勝を決めた。\n\n## 今日の試合で見るなら\n予想打順では、ロッテの山口航輝は2番、日本ハムの清宮幸太郎は3番に入る見込みだ。どちらも走者を置いて打席が回る可能性が高い。\n\nワンナウト三塁なら、強い打球だけでなく外野への深いフライも得点につながる。一方、ツーアウトで髙部瑛斗や水野達稀が塁にいたら、打球と同時にどこまで走るかを見ると、アウト数の意味がよく見えるのだ。"}, "2-13-a": {"meta": {"id": "2-13-a", "title": "打者有利・投手有利のカウントって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-13", "1-07-b"], "sources": ["https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/43745159.html"]}, "body": "## ひとことで\n==一般に、**ボールが先行すると打者有利**、**ストライクが先行すると投手有利**なのだ。== 次の失敗で四球になるのか、三振になるのかで、余裕のある側が変わる。\n\n![ボール・ストライク・アウト数が表示された野球場のスコアボード](https://upload.wikimedia.org/wikipedia/commons/1/1b/Kamagaya-stadium-scoreboard.png \"出典：Wikimedia Commons／Pingguopomme／CC0 1.0\")\n\n## しくみ\n==**3ボール1ストライク**なら、投手はあと1球ボールを投げると四球（ボール4つで一塁へ進むこと）になる。== 打者は甘い球を待ちやすいので、打者有利と考えやすい。\n\n==反対に**0ボール2ストライク**なら、打者は次のストライクで三振だ。== 投手はストライクゾーンぎりぎりや、そこから外れる変化球も使いやすい。\n\nただし有利不利は目安だ。強打者なら投手が慎重になるし、走者や点差でも**配球（どの球をどこへ投げるかの組み立て）**は変わる。\n\n## 今日の試合で見るなら\n**ジャクソン**が山口航輝に3ボール1ストライクとしたら、山口が「打てる球だけ」に絞る場面になりやすい。逆に**福島蓮**が0ボール2ストライクまで追い込んだら、==次にどこへ外してくるかを見ると、投手有利の意味が見えやすいのだ。=="}, "2-13-b": {"meta": {"id": "2-13-b", "title": "エンドランって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-13", "2-11"], "sources": ["https://npb.jp/news/detail/20181023_02.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n==**エンドラン（ヒットエンドラン）**は、投手が投げるのに合わせて走者が次の塁へ走り、打者もその球を打ちにいく作戦だ。== 走るだけの盗塁とは違い、打者と走者がセットで動く。\n\n![二塁への盗塁で滑り込む走者](https://upload.wikimedia.org/wikipedia/commons/b/b3/Granderson-20th_stolen_base_2007.jpg \"出典：Wikimedia Commons／Kevin.Ward／CC BY-SA 2.0\")\n\n## しくみ\n一塁走者が先に走ると、**一・二塁間**を守る野手が動きやすい。==そこへ打球を転がせれば、走者が一気に**三塁**まで進めることもある。==\n\nただし打者は、普段なら見送るような球でも打たなければならない場合がある。==空振りすれば走者は盗塁と同じ形になり、フライを捕られると戻れず**併殺（一度に2つアウト）**になる危険もあるのだ。==\n\n## 今日の試合で見るなら\n日本ハムの1番・**水野達稀**が一塁に出て、2番・**田宮裕涼**の打席で水野が投球と同時に走ったら注目だ。==田宮まで強く振りにいけば、単独の盗塁ではなくエンドランの可能性が見えてくる。=="}, "2-13-c": {"meta": {"id": "2-13-c", "title": "ファウルで粘るってどういうこと？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-13", "2-19"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html"]}, "body": "## ひとことで\n**ファウル（打球が一・三塁線の外側などへ出ること）**で粘るとは、2ストライク後に難しい球をファウルにして打席を続けることだ。==普通のファウルなら、2ストライクから三振にはならない==のだ。\n\n## しくみ\n追い込まれた打者は、見逃せばストライクになりそうな球を簡単には捨てられない。強く前へ飛ばせなくても、バットに当ててファウルにできれば次の球へ進める。\n\nその間に投手は投球数が増え、打者は球筋を見る機会も増える。ただし、**バント（バットを振らずに当てる打ち方）**を2ストライク後にファウルすると三振になる。==「何でもファウルなら続く」わけではない==のだ。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**や日本ハム先発の**福島蓮**が2ストライクまで追い込んだあとに注目だ。打者が難しい球を何球もファウルにしたら、==三振を避けながら次の甘い球を待っている==と考えると分かりやすいのだ。"}, "2-13": {"meta": {"id": "2-13", "title": "ストライクやボールの数で何が変わるの？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-13-a", "2-13-b"], "related": ["1-07", "2-14"], "sources": ["https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html", "https://www.mlb.com/news/tatis-grand-slam-on-3-0-pitch-irks-rangers"], "episode": "v2"}, "body": "## ひとことで\n==**カウント（その打席のボールとストライクの数）**が変わると、打者と投手が「次の1球で何を避けたいか」が変わるのだ。== **3ボール**なら投手は四球を避けたくなり、**2ストライク**なら打者は三振を避けたくなる。\n\n![ボール・ストライク・アウト数が表示された野球場のスコアボード](https://upload.wikimedia.org/wikipedia/commons/1/1b/Kamagaya-stadium-scoreboard.png \"出典：Wikimedia Commons／Pingguopomme／CC0 1.0\")\n\n## しくみ\n==打者は**4ボール**で四球（一塁へ進めること）、**3ストライク**で三振になる。== だから同じ1球でも、0ボール0ストライクと3ボール2ストライクでは重みが違うのだ。\n\nたとえば**3ボール0ストライク**なら、投手は次をボールにすると四球になる。打者は無理に振らず、甘い球だけ待つこともできる。逆に**0ボール2ストライク**なら、打者は次のストライクで三振になるので、きわどい球にも手を出さなければならなくなる。\n\nただし「このカウントなら必ず直球」のような決まりはない。捕手と投手は、打者の得意不得意、走者、点差まで合わせて球種とコースを考える。==カウントは、作戦の選択肢がどちらに多いかを見るための信号だと思えばよい。==\n\n## おもしろエピソード\n2020年8月、パドレスの**フェルナンド・タティスJr.（当時21歳の遊撃手）**は、レンジャーズ戦の8回に満塁で打席へ入った。10対3と大きくリードし、カウントは3ボール0ストライクだった。\n\nベンチは「次の球は見送る」というサインを出していたが、タティスJr.はそれに気づかず、真ん中へ来た速球を振った。打球はそのまま満塁本塁打になったのだ。==「打者がいちばん待てる3ボール0ストライク」で振った一球が、大きな議論を呼ぶ一発になった==。\n\n相手監督は、大差の終盤で3ボール0ストライクから振るのは好ましくないという当時の「暗黙の了解」に不満を示した。一方で、その考え方自体を見直す議論も起きた。カウントには、ルールだけでなく作戦や野球観まで表れることがあるのだ。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは今季、四球が55ある。日本ハム打線が3ボールまで粘れた打席では、次の1球が甘くなるか、それでも厳しいコースを突くかを見ると面白い。\n\n反対に日本ハム先発の福島蓮が0ボール2ストライクまで先に追い込んだら、ロッテの山口航輝らがどこまできわどい球を見送れるかに注目だ。"}, "2-14-a": {"meta": {"id": "2-14-a", "title": "わざと歩かせる申告敬遠って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-14", "2-14-b"], "sources": ["https://npb.jp/news/detail/20180205_02.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n==**申告敬遠**は、守備側の監督が「この打者を四球にする」と球審（捕手の後ろに立つ審判）へ伝え、投手が**4球**投げなくても打者を一塁へ進ませる方法だ。== 強打者との勝負を避けたい場面で使われる。\n\n![捕手が投手に敬遠の合図を出す場面](https://upload.wikimedia.org/wikipedia/commons/b/bb/Catcher_signals_for_intentional_walk_2014.jpg \"出典：Wikimedia Commons／EricEnfermero／CC BY-SA 3.0\")\n\n## しくみ\nNPBでは**2018年**から、**故意四球（わざと与える四球）**を申告で成立させられる。==打席の途中から申告することもでき、従来どおり実際に球を投げて敬遠する方法も残っている。==\n\n==一塁が空いていれば、その塁を使って強打者を避け、次の打者と勝負する狙いがある。== ただし走者を**1人**増やすので、次の打者に打たれれば失点が大きくなる。\n\n## 今日の試合で見るなら\n終盤にロッテの**山口航輝**や日本ハムの**清宮幸太郎**が、二塁または三塁に走者を置いて打席へ入った場面に注目だ。==一塁が空いていれば、相手ベンチが申告敬遠を選ぶ可能性がある。=="}, "2-14-b": {"meta": {"id": "2-14-b", "title": "押し出しって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-14", "1-06-b"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/91895138.html"]}, "body": "## ひとことで\n==**押し出し**は、満塁で四球や死球などによって打者が一塁へ進み、三塁走者が押し出されるように本塁へ進んで**1点**入ることだ。== 打球が飛ばなくても得点になる。\n\n![投球が体に当たる打者](https://upload.wikimedia.org/wikipedia/commons/3/3b/Hit_by_pitch_joe_crede.JPG \"出典：Wikimedia Commons／Albert Yau／CC BY 2.0\")\n\n## しくみ\n満塁では**一塁、二塁、三塁**が全部埋まっている。==打者に一塁が与えられると、一塁走者は二塁へ、二塁走者は三塁へ、三塁走者は本塁へ進まなければならない。==\n\n次の塁へ進む義務があるこの状態を、**フォース（押し出されて進む状態）**という。==死球でも、四球と同じように**1点**が入る。==\n\n## 今日の試合で見るなら\n**ジャクソン**が満塁で3ボールまで来たら、次の1球はそのまま1点につながりうる。反対に**福島蓮**が満塁で山口航輝と勝負する場面でも同じだ。==満塁では「ボール球を見送ること」自体が得点になる場合があるのだ。=="}, "2-14-c": {"meta": {"id": "2-14-c", "title": "死球（デッドボール）のあと何が起きる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-14", "1-06"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/81685155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**死球（デッドボール：投球が打者の体などに当たり、一塁が与えられること）**が認められると、プレーはいったん止まり、打者は一塁へ進む。==走者がいる場合は、押し出される走者だけが必要な分だけ進む==のだ。\n\n## しくみ\nたとえば一塁に走者がいれば、打者が一塁へ行くため、その走者は二塁へ進む。満塁なら全員が押し出され、三塁走者が本塁へ進んで1点になる。\n\n一方、二塁だけに走者がいるなら、その走者は自動では三塁へ進まない。==「死球なら全員が一つ進む」ではない==のだ。\n\n強く当たったときは、トレーナーなどが状態を確認するため試合が止まることもある。\n\n## 今日の試合で見るなら\n日本ハム先発の**福島蓮**の球がロッテ打者の体に当たる場面があれば、球審の合図と走者の動きを見てほしい。==打者が一塁へ行ったあと、どの走者が進むのか==を見るとルールがすぐ分かるのだ。"}, "2-14": {"meta": {"id": "2-14", "title": "四球（フォアボール）・死球（デッドボール）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-14-a", "2-14-b"], "related": ["1-07", "2-13"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/21625150.html", "https://www.mlb.com/cut4/a-short-story-about-eddie-gaedel/c-23387672", "https://www.mlb.com/cut4/barry-bonds-is-intentionally-walked-with-bases-loaded/c-127075262"], "episode": "v2"}, "body": "## ひとことで\n==**四球（フォアボール）**はボールが**4つ**になって一塁へ進むこと、**死球（デッドボール）**は投球が打者の体などに当たり、規則上認められて一塁へ進むことだ。== どちらもヒットを打たなくても走者になれる。\n\n![投球が体に当たる打者](https://upload.wikimedia.org/wikipedia/commons/3/3b/Hit_by_pitch_joe_crede.JPG \"出典：Wikimedia Commons／Albert Yau／CC BY 2.0\")\n\n## しくみ\n==四球は、投手が**ストライクゾーン（ストライクになる範囲）**を外す「ボール」を4つ重ねると成立する。== 打者は一塁まで安全に進めるので、出塁という意味ではヒットと同じく攻撃のきっかけになるのだ。\n\n**死球**は、投球が打者の体や着衣に当たったときに宣告される。==ただし、ストライクの球に当たった場合など、単に体に触れれば必ず死球になるわけではない。==\n\n四球も死球も、公式記録では通常の**「打数」**（打率の計算に使う打席の数）には入らない。だから打率を下げずに出塁できる。一方、投手側から見ると、安打を打たれていなくても走者を増やしてしまう点が重い。\n\n## おもしろエピソード\n1951年、セントルイス・ブラウンズ（のちに移転して現在のオリオールズになった球団）のオーナー、**ビル・ベック**は、身長約109センチの**エディ・ゲーデル**を代打に送った。背番号は「1/8」だった。\n\n審判は本当に出場できる選手なのか契約書まで確認した。ゲーデルは4球すべてボールで四球になり、一塁へ歩くと代走と交代した。==メジャー史上もっとも小柄な打者の唯一の打席は、一度もバットを振らない四球だった==。観客は立ち上がって拍手を送った。\n\nもう一つは1998年。ダイヤモンドバックスの**バック・ショーウォルター監督**は、9回2アウト満塁でジャイアンツの強打者**バリー・ボンズ**を迎えると、なんと敬遠（最初から四球にして勝負を避けること）を選んだ。1点を相手に与えてでも、次の打者と勝負する方を選んだのだ。次の打者はアウトになり、ダイヤモンドバックスは8対7で逃げ切った。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは今季55四球。日本ハム打線がボール球を見極めて四球を選べるかは、走者をためるうえで大事だ。\n\nロッテの西川史礁は今季11死球。内角（打者の体に近い側）の球が体の近くへ来たとき、避けたのか、当たったのか、その後に球審が一塁を示すかを見ると死球の仕組みがわかりやすい。"}, "2-15-a": {"meta": {"id": "2-15-a", "title": "送りバントとスクイズの違いは？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-15", "1-09"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/63165150.html"]}, "body": "## ひとことで\n==**送りバント**は走者を次の塁へ進めるためのバント、**スクイズ**は三塁走者を本塁へ返して1点を取るためのバントだ。==どちらも強打より「進塁」を優先する。\n\n![打者がバントの構えで投球を迎えている](https://upload.wikimedia.org/wikipedia/commons/7/7a/The_bunt.jpg \"出典：Wikimedia Commons／Ed Schipul／CC BY-SA 2.0\")\n\n## しくみ\n**無死（ノーアウト）一塁**から一塁走者を二塁へ進めるのが、典型的な送りバントだ。打者自身はアウトになっても、次の打者がヒット1本で得点しやすい形を作る。\n\nスクイズは**三塁に走者がいる場面**で使う。打者がバントし、その間に三塁走者が本塁を狙うので、==成功すれば安打なしでも1点を取りにいける。==\n\nただし空振りや**小フライ**になれば、三塁走者までアウトになる危険がある。==守備側も三塁走者の動きを強く警戒する作戦なのだ。==\n\n## 今日の試合で見るなら\n接戦の終盤、日本ハムが三塁に走者を置き、**山縣秀**のようにバントを使える打者が打席なら注目だ。==バットを寝かせ、三塁走者も投球に合わせて動けば、スクイズの可能性が見えてくる。=="}, "2-15-b": {"meta": {"id": "2-15-b", "title": "バントの構えから打つ「バスター」って？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-15", "2-05"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/63165150.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**バスター**は、最初はバントの構えを見せ、投球に合わせて普通の打撃へ切り替える作戦だ。==守備が「バントだ」と前へ動いたところを逆に打つ==狙いがあるのだ。\n\n## しくみ\n走者がいると守備側は、送りバントを警戒して一塁手や三塁手が前進することがある。そこで打者がバントの構えをやめて振れば、野手が動いて空いた場所へ打球が飛ぶ可能性がある。\n\nただし構えを変えてから打つので、普通に最初から振るより準備時間は短い。==相手を驚かせる代わりに、自分の打撃も難しくなる作戦==なのだ。\n\n## 今日の試合で見るなら\n日本ハムの**山縣秀**は今季、送りバントを使う場面がある選手だ。走者がいるときに一度バントの構えを見せ、その後バットを引いて振ったら、==守備の前進を利用するバスターかどうか==を見てみるといいのだ。"}, "2-15-c": {"meta": {"id": "2-15-c", "title": "セーフティバントって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-15", "2-02"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/bis/players/11215151.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**セーフティバント（自分も一塁でセーフになることを狙うバント）**は、送りバントと違い、打者自身が走者になるのが目的だ。==弱い打球をわざと転がし、守備が一塁へ投げる時間を足りなくする==のだ。\n\n## しくみ\n成功には、打球を投手・一塁手・三塁手の取りにくい場所へ転がす技術と、一塁まで走り切る速さが必要になる。強く転がしすぎれば普通のゴロになり、弱すぎれば捕手にすぐ拾われる。\n\n守備位置が深いときほど、前へ出て捕ってから送球する距離が増える。==打球の強さと置き場所を細かく調整する作戦==なのだ。\n\n## 今日の試合で見るなら\nロッテの**髙部瑛斗**が打席で急にバントの構えを見せたら、一塁までの競争にも注目してほしい。==走者を送るのではなく自分が生きようとしているなら、セーフティバント==と考えればよいのだ。"}, "2-15": {"meta": {"id": "2-15", "title": "バントって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-15-a"], "related": ["2-10", "2-12"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://c.npb.jp/scoring/scoring_howto.pdf", "https://npb.jp/bis/players/63165150.html", "https://sabr.org/bioproj/person/dickey-pearce/"], "episode": "v2"}, "body": "## ひとことで\n==**バント**は、バットを大きく振らず、ボールに当てて近くへ転がす打ち方だ。== 自分がヒットになることより、走者を次の塁へ進める目的で使われることが多い。\n\n![バットを構えてバントする打者](https://upload.wikimedia.org/wikipedia/commons/7/7a/The_bunt.jpg \"出典：Wikimedia Commons／Ed Schipul／CC BY-SA 2.0\")\n\n## しくみ\n普通の打撃は強く遠くへ飛ばすことを狙う。バントでは、バットを構えて球の勢いを弱め、**投手や一塁手、三塁手**の前へ転がす。\n\n代表的なのが**犠牲バント（自分のアウトと引き換えに走者を進めるバント）**だ。==無死（ノーアウト）一塁なら、打者が一塁でアウトになる間に走者を二塁へ進め、**1死（ワンアウト）二塁**にするのが典型になる。==\n\n成功すれば**得点圏（二塁・三塁）**へ走者を送りやすいが、アウトを1つ渡す作戦でもある。点差、回、次の打者の強さによって、使う価値は変わるのだ。\n\n==また**2ストライク**後のバントがファウルになると、通常のファウルと違って三振になる。== 追い込まれてからのバントは、それだけ失敗の重みが大きい。\n\n## おもしろエピソード\nバントの初期には、今ではできない「ひっかけ技」のような使い方があった。1860年代、ブルックリン・アトランティックス（プロ野球リーグ成立前の強豪）の**ディッキー・ピアース**は、ボールを弱く当てる打ち方を工夫した選手として知られている。\n\n当時のルールでは、いったんフェアゾーンに落ちた球がすぐファウル側へ転がっても、そのまま打球として扱われた。ピアースはボールの上側をたたき、==フェアに落としてから強い回転でファウル側へ逃がす==打ち方を使った。野手が追いかける間に一塁を狙ったのだ。\n\nこの「フェア・ファウル」の抜け道は1877年にふさがれたが、ピアースが広めた弱く転がす打ち方は、やがてバントという作戦として残っていった。\n\n## 今日の試合で見るなら\n日本ハムの山縣秀は今季5犠打。終盤、山縣の前に走者がいて接戦なら、構えを変えてバントするかに注目だ。\n\n一方、ロッテの山口航輝のような長打力のある打者では、同じ無死一塁でも強く打たせる選択が十分ある。誰が打席にいるかで作戦が変わるのが、バントを見る面白さなのだ。"}, "2-16-a": {"meta": {"id": "2-16-a", "title": "なぜパ・リーグだけ？（セ・リーグも導入予定）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-16"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/news/detail/20250804_06.html", "https://npb.jp/news/detail/20260925_02.html"]}, "body": "## ひとことで\n==**2026年までは**、パ・リーグが**DH制（投手の代わりに打つ専門の打者を置く制度）**、セ・リーグが投手も打席に立つ9人制なのだ。==だがセ・リーグは**2027年シーズン**からDH制を採用すると正式決定している。\n\n![打者がスイングしている](https://upload.wikimedia.org/wikipedia/commons/6/6d/Baseball_swing.jpg \"出典：Wikimedia Commons／Danny Meyer／Public domain（U.S. Air Force work）\")\n\n## しくみ\nNPBによると、パ・リーグは**1975年**にDH制を採用した。一方のセ・リーグは、野球発祥から続く9人野球の伝統や、パ・リーグとは違う野球の価値を重視して、長く9人制を続けてきた。\n\nそのセ・リーグも**2025年8月**、2027年からのDH制採用を決定した。公式説明では、高校・大学でDH導入が進んだことや、国際的な流れ、セ・パのルール統一などが背景として挙げられている。==2026年は導入準備のための猶予期間という位置づけだ。==\n\n## 今日の試合で見るなら\n今日はロッテも日本ハムも**パ・リーグ**なので、両チームがDHを使える。予想スタメンではロッテが**山口航輝**、日本ハムが**清宮幸太郎**をDHに置く。==2026年のパ・リーグでは見慣れた形だが、来季からはセ・リーグの公式戦でも同じ仕組みが基本になるのだ。=="}, "2-16-b": {"meta": {"id": "2-16-b", "title": "指名打者はどんな選手がなる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-16", "4-02"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html"]}, "body": "## ひとことで\n**指名打者（DH：投手の代わりに打つ打者）**には、打撃を特に生かしたい選手が入ることが多い。==守備に就かなくても、その打力を打線へ置ける==のがDHの強みなのだ。\n\n## しくみ\n長打を期待される選手だけがDHになるわけではない。守備の負担を減らしたい日や、複数の守備位置を回す都合でDHに入ることもある。\n\nつまりDHは「守れない人の席」ではない。==その日の9人の守備と打順を組み合わせた結果、打撃を優先する場所==と考えるとよいのだ。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの**山口航輝**、日本ハムの**清宮幸太郎**がDHに入る想定だ。2人の名前が打順表にあって守備位置に見当たらなければ、==攻撃に専念するDHとして出ている==と分かるのだ。"}, "2-16-c": {"meta": {"id": "2-16-c", "title": "投手が打席に立たないと何が変わる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-16", "2-09"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/43745159.html", "https://npb.jp/bis/players/81685155.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nDH制では、投手の打順を別の打者が担当する。だから==投手交代を「次の打席が来るから」という理由で考えなくてよくなり、投球と打撃の判断を分けやすい==のだ。\n\n## しくみ\nDHがない試合では、好投している投手でも次の攻撃で得点を狙うため代打を送る選択がある。DH制なら投手のところに代打を出す必要がなく、投手は守備だけに集中できる。\n\n打線側も、投手の代わりに専門の打者を一人置ける。==9人すべての打順で打撃を期待できる形にしやすい==というわけだ。\n\n## 今日の試合で見るなら\n予告先発はロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**だ。パ・リーグのDH制を使う今日の試合では、2人が打席へ向かわなくても不思議ではない。==投手の名前は守備側の「投」にだけ出る==ところをスタメン表で確認すると分かりやすいのだ。"}, "2-16": {"meta": {"id": "2-16", "title": "指名打者（DH）って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-16-a"], "related": ["2-07", "4-02"], "sources": ["https://npb.jp/news/detail/20250804_05.html", "https://npb.jp/bis/players/91895138.html", "https://npb.jp/bis/players/41545136.html", "https://www.mlb.com/news/ron-blomberg-first-mlb-designated-hitter"], "episode": "v2"}, "body": "## ひとことで\n==**指名打者（DH：投手の代わりに打つ専門の打者）**は、守備では投手が投げ、攻撃では別の打者がその打順に入る制度だ。==投手が打席に立たなくてもよくなる。\n\n![打者がスイングしている](https://upload.wikimedia.org/wikipedia/commons/6/6d/Baseball_swing.jpg \"出典：Wikimedia Commons／Danny Meyer／Public domain（U.S. Air Force work）\")\n\n## しくみ\n野球は基本的に、守備につく**9人**が攻撃でも打席に入る。ただし**DH制**では例外があり、投手の代わりに1人の打者を打線へ置ける。\n\nたとえば先発投手が9番目の打者になる代わりに、長打力のある野手をDHとして使える。その選手は打席には立つが、==DHとして出ている間は守備位置を持たない。==\n\nこの制度の大きな意味は、投手が投球に集中でき、打線には打撃を期待できる選手を**1人多く**置けることだ。ベンチは「守備には出さないが、打撃を生かしたい選手」を起用しやすくなる。\n\nDHは**「代打」**とは違う。代打は途中で別の打者に交代する方法だが、==DHは試合開始時から打順の一つとして置ける制度なのだ。==\n\n## おもしろエピソード\nメジャーリーグでDHが初めて使われた1973年4月6日、ヤンキースの**ロン・ブロンバーグ**が史上最初のDHになった。しかも本人は前日まで制度をよく分かっておらず、監督に「何をすればいいのか」と尋ねていたという。\n\n歴史的な第1打席は、2アウト満塁で回ってきた。ところがブロンバーグは一度もバットを振らず、4球で四球。押し出しで1点が入った。==「打つ専門」の初代DHが、最初の打席では一度も打たずに仕事をした==のだ。\n\nその打席で使われるはずだったバットは、ボールに一度も触れないまま野球殿堂博物館へ収蔵された。\n\n## 今日の試合で見るなら\n予想スタメンでは、ロッテの山口航輝が2番DH、日本ハムの清宮幸太郎が3番DHだ。2人とも長打力を期待される打者で、山口は32本塁打、清宮は23本塁打を記録している。\n\n守備の回に2人の姿がグラウンドになくても、交代したわけではない。攻撃になるとまた打順どおりに打席へ来る。そこがDHを見分けるいちばん簡単なポイントだ。"}, "2-17-a": {"meta": {"id": "2-17-a", "title": "一度交代した選手は戻れる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-17"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n==NPBでは、**一度ほかの選手と交代して試合から退いた選手**は、その試合には戻れないのだ。==\n\n![代走として塁に立つ選手](https://upload.wikimedia.org/wikipedia/commons/5/57/Luis_Garcia_pinch_runner_from_Nationals_vs._Braves_at_Nationals_Park%2C_April_6th%2C_2021_%28All-Pro_Reels_Photography%29_%2851101809163%29_%28cropped%29.png \"出典：Wikimedia Commons／All-Pro Reels／CC BY-SA 2.0\")\n\n## しくみ\nたとえば**山口航輝**に**代走（走る役だけの交代選手）**を送れば、山口はそこで試合から退く。==後で「やはり山口に打たせたい」と思っても、もう打席へは戻せない。==\n\nだから代打や代走は、強いカードを使う代わりに元の選手を手放す決断でもある。==終盤に使われることが多いのは、この制約があるからなのだ。==\n\n## 今日の試合で見るなら\nロッテが終盤に一塁走者の**山口航輝**へ**池田来翔**を代走で送ったら、その後の山口の打席はもうない。試合が**延長（9回で決着しないときに続ける回）**になりそうな場面なら、==サブロー監督がいつ交代を切るかも見どころになるのだ。=="}, "2-17-b": {"meta": {"id": "2-17-b", "title": "代走に出る選手はどんな人？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-17", "2-11"], "sources": ["https://npb.jp/bis/players/21225133.html", "https://npb.jp/scores/2026/0927/m-f-23/roster.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**代走（塁にいる走者と交代して走る選手）**には、足の速さだけでなく、スタートや次の塁へ進む判断がうまい選手が選ばれる。==「一つ先へ進める確率を上げたい」ときの交代==なのだ。\n\n## しくみ\n代走は盗塁だけを狙う役ではない。外野へのヒットで一塁から三塁へ行く、浅いフライでタッチアップする、といった走塁でも差が出る。\n\nまた交代後は元の選手に戻せないので、そのまま守備に入れるかも重要だ。==速さと、その後の守備まで含めて選ばれる==というわけだ。\n\n## 今日の試合で見るなら\n日本ハムの**西川遥輝**は通算350盗塁まであと5だ。今日、途中出場で走者になったら、==打者より先に一塁上の西川を見る==と代走や盗塁の狙いが見えやすい。9月27日の同カードでは西川もベンチ入りしていたのだ。"}, "2-17-c": {"meta": {"id": "2-17-c", "title": "ベンチ入りは何人まで？", "category": "2", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["2-17", "4-02"], "sources": ["https://npb.jp/scores/2026/0927/m-f-23/roster.html", "https://npb.jp/announcement/2026/", "https://npb.jp/farmchamp/2026/information.html"]}, "body": "## ひとことで\n9月27日の同カードでは、NPB公式の**ベンチ入り選手**はロッテ、日本ハムとも**26人**だった。==ただし、2026年の一軍レギュラーシーズンで「最大26人」と明記した公開規定は今回確認できていない==のだ。\n\n<!-- TODO: 2026年一軍レギュラーシーズンのベンチ入り選手上限が26人であることを、NPB公式の当該年度規定で確認 -->\n\n## しくみ\n**出場選手登録（一軍で試合に出られる選手の登録）**と、その日のベンチ入りは同じものではない。チームは登録選手の中から、その試合で使う投手、捕手、野手をベンチに入れる。\n\n2026年ファーム日本選手権の開催要項では、ベンチ入り選手は26名と公式に明記されている。一方、今日の一軍公式戦については、==前日の実際の名簿が26人ずつだったことまでは確認済み==という状態だ。\n\n## 今日の試合で見るなら\n今日のベンチ入り一覧がNPB公式で出たら、先発の**福島蓮**や**アンドレ・ジャクソン**以外に、代打・代走・救援で誰が待機しているかを見るとよい。==終盤の交代策は、ベンチに残っている選手の顔ぶれで選択肢が変わる==のだ。"}, "2-17": {"meta": {"id": "2-17", "title": "代打・代走・守備固めって？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-17-a"], "related": ["2-09", "2-05"], "sources": ["https://npb.jp/npb/2026rules.html", "https://baseballhall.org/discover-more/stories/card-corner/pinch-run-herb-washington"], "episode": "v2"}, "body": "## ひとことで\n==**代打（ピンチヒッター：打つ人の交代）**、**代走（ピンチランナー：走る人の交代）**、**守備固め（守備の得意な選手への交代）**は、終盤の勝負を動かす交代策なのだ。==\n\n![代走として塁に立つ選手](https://upload.wikimedia.org/wikipedia/commons/5/57/Luis_Garcia_pinch_runner_from_Nationals_vs._Braves_at_Nationals_Park%2C_April_6th%2C_2021_%28All-Pro_Reels_Photography%29_%2851101809163%29_%28cropped%29.png \"出典：Wikimedia Commons／All-Pro Reels／CC BY-SA 2.0\")\n\n## しくみ\n代打は、その打席だけ別の打者に任せたいときに使う。長打がほしい、右投手に左打者を当てたい、といった理由で選ばれることが多い。==代打が打席に入ると、元の選手は試合から退くことになる。==\n\n代走は、塁に出た走者を**足の速い選手**へ替える作戦だ。一つ先の塁へ進める確率を上げたい終盤で使われやすい。盗塁だけでなく、外野への安打で一塁から三塁へ進むような走塁も狙いなのだ。\n\n守備固めは、リードしている終盤に**守備力**を上げる交代だ。たとえば打撃型の選手を下げて、守備範囲の広い外野手や内野手を入れる。==1点を取りにいく交代と、1点を守る交代は、目的が正反対というわけだ。==\n\n交代は**ベンチの人数**を使う。だから監督は、今の1点に加えて、**延長（9回で決着しないときに続ける回）**まで続く可能性も考える。早く切り札を使いすぎると、後で必要な場面に残っていないこともあるのだ。\n\n## おもしろエピソード\n1974年、オークランド・アスレチックスは、世界級の短距離選手**ハーブ・ワシントン**を「代走専門」として入団させた。高校以来ほとんど野球をしておらず、打席にも守備にも就かず、走るためだけにベンチへ入った選手なのだ。\n\n野球経験が少なかったので、ある試合では監督に「二塁へ盗塁しますか」と確認したところ、監督は内野を指した。==すでに二塁には味方の走者がいた==のだ。\n\nそれでもワシントンはワールドシリーズにも代走で出た。第2戦の9回、同点の走者として一塁に入ったが、ドジャースの投手**マイク・マーシャル**の素早い牽制に刺されてアウトになった。アスレチックスはその試合を落としたが、その後3連勝して世界一になった。\n\n## 今日の試合で見るなら\nロッテは終盤の代打候補にソトや上田希由翔、代走候補に池田来翔がいる。接戦の7回以降、スタメンの打順で代打が告げられたら、「ここで1点を取りにいく」と考えると流れが見えやすい。\n\n反対にロッテがリードしていれば、松川虎生が捕手に入り、佐藤都志也が別の守備位置へ回るような動きにも注目だ。スコアだけでなく、誰がベンチから出てくるかを見ると、監督の狙いが読めるのだ。"}, "2-18-a": {"meta": {"id": "2-18-a", "title": "何人いて、誰が何を見てる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-18"], "sources": ["https://npb.jp/umpires/", "https://npb.jp/umpires/2026/roster_umpire.html"]}, "body": "## ひとことで\n==NPBの公式戦では、基本は**球審**と一塁・二塁・三塁の**塁審（塁の近くで判定する審判）**を合わせた**4人**で判定するのだ。==\n\n![本塁で走者にセーフの判定を示す審判](https://upload.wikimedia.org/wikipedia/commons/c/c8/A_baseball_player_slides_into_home_base_while_an_umpire_calls_safe.jpg \"出典：Wikimedia Commons／Paul Thompson／Public domain\")\n\n## しくみ\n球審は本塁の後ろに立ち、投球の**ストライク・ボール**、本塁での**セーフ・アウト**などを見る。三つの塁審は担当する塁の判定に加え、打球がフェアかファウルか、外野への大きな打球なども分担する。\n\n==「一塁審は一塁だけ」というわけではない。==打球と走者に合わせて位置を変え、別の審判と角度を分けて見るのだ。\n\n## 今日の試合で見るなら\n**藤原恭大**や**万波中正**のように足や肩が目立つ選手のプレーでは、一塁や三塁で際どい判定が出やすい。==打球だけでなく、塁審がどこまで移動して判定しているかを見ると、仕事の分担が分かりやすいのだ。=="}, "2-18-b": {"meta": {"id": "2-18-b", "title": "ボークって？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["2-18", "2-11-a"], "sources": ["https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n==**ボーク**は、走者がいるときに投手がしてはいけない投球動作をした反則だ。==原則として走者には**一つ先の塁**が与えられる。\n\n## しくみ\n投手は投球動作を始めたら、途中で不自然に止めたり、投げるふりから急に別の動作へ変えたりできない。==走者をだます動きに制限を設け、スタートの条件を公平にするためなのだ。==\n\n**2026年の規則改正**でも、投球に関連する動作を始めて両手を体の前で合わせた後は、投球以外へ変更できないことが明確にされた。==違反すればボークになる。==\n\n## 今日の試合で見るなら\n日本ハムに走者が出たとき、ロッテ先発の**アンドレ・ジャクソン**は打者だけでなく走者も警戒する。**セットポジション（走者がいるときによく使う構え）**からの動きが急に止まり、==審判が両手を広げて試合を止めたら、ボークの可能性があるのだ。=="}, "2-18-c": {"meta": {"id": "2-18-c", "title": "審判のジェスチャーの意味は？（アウト・セーフ・ファウル）", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["1-08", "2-19"], "sources": ["https://npb.jp/news/detail/20260409_01.html", "https://npb.jp/npb/2026rules.html"]}, "body": "## ひとことで\n\n審判は声だけでなく、腕や手の形でも判定を伝える。==**アウトは右手を握って上げる、セーフは両腕を横へ広げる、ファウルは両腕を上げる**==、と覚えると見やすいのだ。\n\n## しくみ\n\n**アウト**では、審判が右手を握り、はっきり上げて判定を示す。**セーフ**では両腕を左右へ広げる。遠い席でも、声より先に腕の動きが見えることがあるのだ。\n\n**ファウル（打球が規定の範囲の外へ出たこと）**では、両腕を上げてプレーを止める合図をする。==打球そのものを追うだけでなく、打球の近くにいる審判を見ると結果が早く分かる==というわけだ。\n\nNPBは2026年、初心者向けに審判の基本動作を紹介する公式動画も公開している。判定の形を一度映像で見ておくと、球場ではかなり読みやすくなる。\n\n## 今日の試合で見るなら\n\n**山口航輝**が内野ゴロを打って一塁へ走る場面が来たら、一塁手だけでなく一塁塁審も見るといい。==送球と走者がほぼ同時なら、塁審の「アウト／セーフ」の腕が答えになる==のだ。\n\n**福島蓮**が投げた球を打者が三塁線や一塁線へ打ったときは、近くの審判のファウル合図も探してみよう。"}, "2-18-d": {"meta": {"id": "2-18-d", "title": "審判に抗議するとどうなる？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-18-c", "2-03-c"], "sources": ["https://npb.jp/npb/2019rules.html", "https://npb.jp/npb/2026rules.html", "https://content.mlb.com/documents/2/2/4/305750224/2019_Official_Baseball_Rules_FINAL_.pdf"]}, "body": "## ひとことで\n\n審判の**アウト・セーフなどの判断そのもの**は、基本的にその場の最終判断だ。==監督が出てきても、「強く言えば判定が変わる」という仕組みではない==のだ。\n\n## しくみ\n\n野球では、フェアかファウルか、セーフかアウトかなど、審判の判断で決める判定がある。公認野球規則では、こうした判断は最終的なものとされ、選手や監督が異議を述べ続けることは認められていない。\n\n一方で、**ルールの適用を間違えていないか**を確認するため、監督が審判に説明を求める場面はある。判定への質問と、ルールの適用確認は別物なのだ。\n\n審判には試合の秩序を保つ権限があり、判定への執拗な抗議や侮辱的な言動などには**退場**を命じることができる。==監督がベンチを出たら、まず「何の説明を求めているのか」を見ると分かりやすい==。\n\n## 今日の試合で見るなら\n\nたとえば**清宮幸太郎**が一塁で際どい判定になり、監督が審判のところへ出てきたら、その時点で「判定が覆る」とは限らない。==落ち着いて話しているなら、判定やルールの確認をしている可能性がある==のだ。\n\n試合が再開したら、最終的に審判が示した判定を基準に次のプレーを見ればいい。"}, "2-18": {"meta": {"id": "2-18", "title": "審判って？", "category": "2", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["2-18-a", "2-18-b"], "related": ["2-03-c", "1-08"], "sources": ["https://npb.jp/umpires/", "https://npb.jp/npb/2026rules.html", "https://www.mlb.com/amp/news/adrian-beltre-ejection-on-deck-circle.html", "https://baseballhall.org/perfect-sportsmen"], "episode": "v2"}, "body": "## ひとことで\n==**審判**は、ストライクやアウトだけでなく、走塁、フェアかファウルか、反則まで見て試合を進める人たちなのだ。==\n\n![本塁で走者にセーフの判定を示す審判](https://upload.wikimedia.org/wikipedia/commons/c/c8/A_baseball_player_slides_into_home_base_while_an_umpire_calls_safe.jpg \"出典：Wikimedia Commons／Paul Thompson／Public domain\")\n\n## しくみ\nいちばん目につくのは、本塁の後ろにいる**球審（きゅうしん：ホーム付近を担当する審判）**だ。投球がストライクかボールか、打者が振ったか、ホームで走者がセーフかアウトかなどを判定する。\n\nほかの審判は**一塁、二塁、三塁**の近くで、走者が先に塁へ着いたか、野手がタッチしたか、打球がフェアかファウルかを分担して見る。==打球や走者の位置に合わせて大きく移動するので、審判もかなり走っているのだ。==\n\n判定には、人がその場で決めるものと、映像で確認できるものがある。NPBでは監督が**リクエスト（映像による判定確認）**を求められる場面もあるが、==すべての判定が映像確認の対象ではない。==\n\n審判はルール違反も見る。投手の**ボーク（走者がいるときの不正な投球動作）**や、危険なプレーなどを見つければ、試合を止めて処置するのだ。\n\n## おもしろエピソード\n2017年、レンジャーズの**エイドリアン・ベルトレ（長くメジャーで活躍した三塁手）**は、次の打者が待つネクストバッターズサークルからかなり離れて素振りをしていた。二塁塁審の**ジェリー・デービス**が「サークルへ戻るように」と指示した。\n\nするとベルトレは自分が戻るのではなく、==地面に置かれたサークルのマットを持ち上げ、自分のいる場所まで動かした==。デービスはその場で退場を宣告した。後にデービス自身も、審判としては退場にせざるを得なかったが、出来事そのものはとてもおかしかったと振り返っている。\n\nもう一つは2010年。タイガースの投手**アルマンド・ガララーガ**は、9回2アウトまで相手を1人も塁に出さない完全試合を続けていた。最後になるはずの一塁のプレーで、塁審**ジム・ジョイス**はセーフと判定したが、映像ではアウトだった。\n\n当時はその判定を映像で覆せず、記録は完全試合にならなかった。ジョイスは試合後に自分の誤審を認めて涙ながらに謝罪し、ガララーガは受け入れた。翌日、ガララーガがメンバー表を球審のジョイスへ届け、2人は本塁で握手した。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは落差の大きいチェンジアップ（直球に近い腕の振りで遅く落ちる球）を使う。低い球がストライクかボールか際どい場面では、まず球審の右手や声を見ると判定が分かる。\n\n清宮幸太郎の通算100本塁打がかかる大飛球がポール（フェアとファウルの境目に立つ柱）際へ飛んだら、塁審の判定にも注目だ。ホームランかファウルかで試合の意味が大きく変わる場面なのだ。"}, "2-19-a": {"meta": {"id": "2-19-a", "title": "ファウルとフェアの境目は？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-19", "2-03"], "sources": ["https://npb.jp/npb/2013rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**ファウルライン（本塁から一塁・三塁へ伸びる境界線）**の内側がフェア地域、外側がファウル地域だ。==線そのものと一塁・三塁のベースはフェア側に入る==。\n\n## しくみ\nいちばん分かりやすいのは、外野へ飛んだ打球だ。ポール（外野の境界に立つ柱）の内側ならフェア、外側ならファウルになる。\n\nやや難しいのは内野のゴロだ。本塁と一塁・三塁の間では、打球がいったんファウル側へ転がっても、ベースを過ぎる前にフェア側へ戻ればフェアになることがある。\n\n反対に、一塁や三塁を越えるゴロは、==ベースを通過するときにフェア地域かファウル地域か==が大きな基準になる。見た目だけで即断しにくいので、審判のジェスチャーを見るのが確実なのだ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**山口航輝**の強い打球が一塁線、三塁線ぎりぎりへ飛んだら注目だ。長打になりそうでも、ほんの少し外ならファウルになる。\n\n==「白線に触れたらファウル」ではなく、「白線はフェア」==と覚えておくと、球場で迷いにくいのだ。"}, "2-19-b": {"meta": {"id": "2-19-b", "title": "ファウルは何回でも打てるの？", "category": "2", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["2-19", "2-13-c"], "sources": ["https://npb.jp/scoring/officialrule_900.pdf", "https://npb.jp/news/detail/20260213_01.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n普通のファウルなら、**2ストライクの後は何回続いてもそれだけでは三振にならない**。==ファウルを打てる回数そのものに上限はない==のだ。\n\n## しくみ\n0ストライクや1ストライクでファウルを打つと、ストライクが1つ増える。しかし2ストライクになった後は、普通のファウルを打ってもカウントは2ストライクのまま続く。\n\nそのため打者は、すぐヒットにできない難しい球をファウルにして打席を続けることがある。これを**粘る（アウトにならず投手に次の球を投げさせ続けること）**という。\n\nただし、==2ストライク後のバントがファウルになると打者はアウト==だ。また、ファウル方向の飛球を野手が地面に落ちる前に捕れば、通常のフライと同じくアウトになる。\n\n## 今日の試合で見るなら\n**福島蓮**が**山口航輝**を2ストライクに追い込んでも、そこで
