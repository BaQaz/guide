に呼ばれるか見てみよう。別の選手が呼ばれたなら、「今日いちばん大きかったプレーは何だったか」を考える答え合わせにもなるのだ。"}, "6-04-a": {"meta": {"id": "6-04-a", "title": "マーくんって？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-04", "6-04-b"], "sources": ["https://www.marines.co.jp/fans/mascot/"]}, "body": "## ひとことで\n**マーくん**は、千葉ロッテマリーンズの公式マスコットの中心になるカモメの男の子だ。==大きな顔と白黒のユニホームを見たら、まずマーくんだと思えばいい==のだ。\n\n## しくみ\n球団公式プロフィールでは、マーくんは**幕張の浜出身**で、平和主義の優しい性格とされている。得意なことは「みんなを笑顔にすること」で、アピールポイントは大きな顔だ。\n\n仲間には、ガールフレンドの**リーンちゃん**と、弟の**ズーちゃん**がいる。3羽ともカモメなので、見分けるときは顔や服装を見ると分かりやすい。\n\nマスコットは選手ではなく、試合前や攻守交代などで球場を盛り上げる役だ。==プレー中の主役が選手なら、止まっている時間の案内役がマスコットなのだ==。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**の打席など、プレー中はまず試合を見よう。攻守交代になったらグラウンド脇やビジョンへ目を移し、カモメのキャラクターが出ていないか探すといい。\n\n==大きな顔の男の子ならマーくん、ポニーテールならリーンちゃん、オーバーオール姿ならズーちゃん==。この3つを覚えれば十分なのだ。"}, "6-04-b": {"meta": {"id": "6-04-b", "title": "謎の魚って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-04", "6-04-a"], "sources": ["https://www.marines.co.jp/news/detail/00006422.html", "https://www.marines.co.jp/news/detail/00007278.html", "https://www.marines.co.jp/fans/mascot/"]}, "body": "## ひとことで\n**謎の魚**は、かつてロッテにいた変わったマスコットだ。==今の現役マスコットではなく、2021年に引退した存在なのだ==。\n\n## しくみ\n球団公式によると、謎の魚は**2017年に初登場**した。魚の姿から骨が飛び出すなど、姿を変える「進化」が特徴で、2021年には最終形態まで到達した。\n\nその後、球団は2021年12月に引退を発表し、12月17日にZOZOマリンで引退セレモニー「THE LAST MYSTERY」を実施した。だから、昔のロッテ映像やグッズで見かけても、今のマーくんたちと同じ現役メンバーだと思わないほうがいい。\n\n現在の球団公式マスコットページに載っているのは**マーくん、リーンちゃん、ズーちゃん**だ。==「魚も今いるの？」への答えは、いない、なのだ==。\n\n## 今日の試合で見るなら\n**清宮幸太郎**の打席などプレー中は試合を見て、攻守交代になったらグラウンド脇やビジョンを見よう。マスコットが登場したら、まず現在の3羽かを確かめればいい。\n\n==今日、謎の魚を探して待つ必要はない==。見かけるとすれば、過去を紹介する映像やデザインなどとして考えるのが自然なのだ。"}, "6-04": {"meta": {"id": "6-04", "title": "マスコットは誰？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": [], "related": ["6-01", "6-02"], "sources": ["https://www.marines.co.jp/fans/mascot/", "https://www.marines.co.jp/news/detail/00007406.html", "https://www.marines.co.jp/news/detail/202600791115.html", "https://www.yakult-swallows.co.jp/news/detail/26684"], "episode": "v2"}, "body": "## ひとことで\n==ロッテの公式マスコットは、カモメの**「マーくん」「リーンちゃん」「ズーちゃん」**だ。== 3羽とも幕張の浜出身という設定で、球場や地域イベントでチームを盛り上げているのだ。\n\n## しくみ\n中心になるのは**マーくん**だ。公式プロフィールでは、平和主義で優しい男の子で、みんなを笑顔にすることが得意とされている。\n\n**リーンちゃん**はマーくんのガールフレンドで、しっかり者の女の子だ。得意なことはダンス。**ズーちゃん**はマーくんの弟で、天真爛漫な男の子という設定になっている。\n\n==3羽とも種類は**カモメ**だ。== 海沿いのZOZOマリンらしい組み合わせだと覚えると見分けやすい。\n\n![ダッグアウト奥に見えるマーくんとリーンちゃん](https://upload.wikimedia.org/wikipedia/commons/b/b8/202309241752_DSCN4613.jpg \"出典：Wikimedia Commons／ウィ貴公子／CC BY-SA 4.0\")\n\n## 歴史・由来\n==3羽の名前は「マリーンズ」というチーム名から取られている。== 公式発表によると、マーくんは**1992年**、リーンちゃんは**1993年**、ズーちゃんは1998年にデビューした。\n\n**2022年**には3羽のイラストが**約20年ぶり**にリニューアルされ、白と黒のチームカラーとピンストライプを着た現在のデザインになった。\n\n## おもしろエピソード\n2022年1月、ヤクルトの鳥のマスコット**つば九郎**は、球団とまるで選手のように「契約更改」を行った。前年にFA宣言（所属先を自由に選べる制度をまねた演出）をしていたため、監督や選手から残留を願う映像まで流された。\n\nさらに、中日ドラゴンズのコアラ型マスコット**ドアラ**が「代理人」として会見に登場した。つば九郎は年俸5万円と「ヤクルト1000飲み放題」などの条件で残留し、==球団公式の記事はこの一連を本物の契約発表のように報じたのだ。==\n\n## 今日の試合で見るなら\n試合前やイニング間にカモメのマスコットを見かけたら、まず3羽のどれかを見分けてみよう。大きな顔の男の子がマーくん、ポニーテールの女の子がリーンちゃん、オーバーオール姿の男の子がズーちゃんだ。\n\n今日の相手は日本ハムだが、公開されている2026年の交流予定では9月28日にビジターマスコット来場の記載はない。誰かが出てくると決めつけず、場内演出を見て確認するのが確実なのだ。"}, "6-05-a": {"meta": {"id": "6-05-a", "title": "立って応援していい席は？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-05", "6-01"], "sources": ["https://www.marines.co.jp/stadium/rule/"]}, "body": "## ひとことで\nZOZOマリンで**立ち上がっての応援が許可されている**と公式に明記されているのは、ホーム外野応援指定席とビジター外野応援指定席だ。==今日の内野指定席Bは、外野応援席と同じ感覚で立ち続ける席ではない==のだ。\n\n## しくみ\n外野応援指定席は、応援団の鳴り物や大旗も使われる「応援するためのエリア」だ。そのため、座ったままだと前の人で試合が見えにくくなる場合があることも公式に案内されている。\n\n一方、内野指定席はホーム・ビジター双方のファンが観戦できる通常の観戦エリアだ。==内野ではまず座って観戦し、声や手拍子で参加する==と考えるのが安全だ。特別な演出時も、周囲の視界を確かめよう。\n\n## 今日の試合で見るなら\nあなたは**1塁側・内野指定席B**から見る。**山口航輝**の打席で周囲が一気に盛り上がっても、まずは手拍子で合わせれば十分だ。\n\n==前の人が立ったから自分も立つ、ではなく、係員の案内と周囲の見え方を優先する==。それがこの席で迷いにくい基準なのだ。"}, "6-05-b": {"meta": {"id": "6-05-b", "title": "相手チームへのヤジはOK？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-05", "6-02-c"], "sources": ["https://npb.jp/npb/kansen_yakkan.html", "https://www.marines.co.jp/stadium/rule/"]}, "body": "## ひとことで\n相手への声かけが全部禁止というわけではないが、**侮辱・威嚇・誹謗中傷になるヤジはだめ**だ。==迷ったら、相手を下げるより自分のチームを応援する==のが一番簡単なのだ。\n\n## しくみ\nNPBの試合観戦契約約款は、選手や観客などへの威嚇、誹謗中傷、その他の迷惑行為を禁止している。ZOZOマリンのルールも、他の観客の観戦を妨げる発言や行為があれば、応援禁止や退場などの措置を取る場合があるとしている。\n\nだから「打ってくれ」「抑えてくれ」という味方への応援はわかりやすい。反対に、相手選手の人格を傷つける言葉や、近くの日本ハムファンに向けた攻撃的な言葉は避けるべきなのだ。\n\n## 今日の試合で見るなら\n日本ハム先発の**福島蓮**が好投しても、選手本人を傷つける言葉を投げる必要はない。ロッテの**山口航輝**に「一本！」と声を送るほうが、応援としても伝わりやすい。\n\n==相手の好プレーを見ても、自分の応援を続ければいい==。それだけで十分に球場らしい応援になるのだ。"}, "6-05-c": {"meta": {"id": "6-05-c", "title": "旗やタオルは使っていい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-05", "6-07-b"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n小さな**応援旗**や球団公式のタオルは使えるが、使い方には制限がある。==後ろの人の視界をふさがず、自分の席の範囲で使う==のが基本なのだ。\n\n## しくみ\nZOZOマリンでは、竿が1本の応援旗・応援小旗は原則として多くの席で使える。ただし頭の上に掲げず、自席の範囲内で、顔より下の位置で使うよう公式に定められている。インプレー中（ボールが動いて試合が進んでいる間）は使用を断られる場合もある。\n\n2本の竿で広げる**ゲートフラッグ**は別物で、使えるのはホーム外野応援席とビジター外野応援指定席だけだ。公式グッズも、周囲の視界を遮る使い方なら使用を止められることがある。\n\n## 今日の試合で見るなら\n今日の7回表終了後は、公式イベントで**「WE LOVE MARINES」を歌いながらタオルを掲げる**案内が出ている。==内野指定席Bでは、場内の合図に合わせ、隣や後ろの人にぶつからない幅で使う==と参加しやすい。\n\n**佐藤都志也**や**山口航輝**のタオルを持っているなら、打席前の応援にも使える。ただし大きく振る前に、まず後ろの人の視界を確認するのだ。"}, "6-05": {"meta": {"id": "6-05", "title": "応援のマナーって？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["6-05-a", "6-05-b", "6-05-c"], "related": ["6-01", "6-02", "6-06"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://npb.jp/npb/kansen_yakkan.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n応援は大声を出すことより、**周りの人も同じ試合を見られる状態を守ること**が先なのだ。==自分の席の範囲で、視界や通路をふさがず、相手や周囲を傷つけない==。これだけ押さえれば初観戦でも困りにくい。\n\n## しくみ\nZOZOマリンには球場独自の**スタジアムルール**があり、席によって応援のしかたが違う。外野応援指定席は立って応援できる一方、内野指定席は同じ扱いではない。指定された席以外で観戦したり、通路や階段に立ち止まったりするのも避ける必要があるのだ。\n\n応援グッズにも決まりがある。旗やボードは、自席の範囲や高さに制限があるものがあり、公式グッズでも周囲の視界を遮る使い方は断られることがある。==「持っているから自由に使える」ではなく、「周りが見える使い方か」で考える==とわかりやすい。\n\n言葉も同じだ。NPBの試合観戦契約約款では、選手や観客への威嚇、誹謗中傷、迷惑行為などが禁止されている。応援は味方を後押しするためのもので、相手を傷つけるためのものではないのだ。\n\n## おもしろエピソード\nロッテの応援は声や手拍子が大きくそろうことで知られているが、全員が同じ動きをする必要はない。初めてなら、まず手拍子だけでも十分参加できる。\n\n今日の公式イベントでは、7回表終了後の**MARINES LUCKY 7**で球団歌「WE LOVE MARINES」に合わせてタオルを掲げる案内が出ている。==場内演出に合わせれば、初心者でも自然に参加しやすい==というわけだ。\n\n## 今日の試合で見るなら\nあなたの観戦場所は**1塁側の内野指定席B**だ。外野応援指定席のように立ち続ける前提の席ではないので、まず座って見て、手拍子や声で応援するのがわかりやすい。\n\n**山口航輝**や**佐藤都志也**の打席で周囲の手拍子が強くなっても、前の人の視界をふさがないことを優先しよう。==盛り上がったときほど、自分の席の範囲を守れば安心して楽しめる==のだ。"}, "6-06-a": {"meta": {"id": "6-06-a", "title": "どんなときに流れる？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-06", "1-09"], "sources": ["https://www.fighters.co.jp/expansion/entertainment/", "https://www.marines.co.jp/fans/supportersong/"]}, "body": "## ひとことで\n目安は、**二塁や三塁にランナーがいて、ヒット1本で点が入りそうなとき**だ。==「次の一打で試合が動きそう」と感じたら、チャンステーマが来るか耳を澄ませる==といい。\n\n## しくみ\n日本ハムの公式応援ガイドは、ランナーが二塁や三塁へ進んだときをチャンステーマの登場タイミングとして案内している。野球では二塁・三塁を**得点圏（点につながりやすい位置）**と呼ぶ。\n\nただし、曲を流す条件が審判のルールで決まっているわけではない。ロッテにも複数のチャンステーマがあり、どれを使うかは応援側が試合の流れに合わせる。==満塁だけが「チャンス」ではない==のだ。\n\n## 今日の試合で見るなら\nたとえばロッテで**藤原恭大**が二塁に出て、**山口航輝**の打席になった場面を想像するとわかりやすい。一本で先制点や追加点が入りそうなら、応援の音量が変わるかもしれない。\n\n日本ハムなら、走者を置いて**清宮幸太郎**に回る場面も同じだ。==走者の位置と応援の変化を一緒に見ると、「なぜ急に盛り上がったのか」がわかる==のだ。"}, "6-06-b": {"meta": {"id": "6-06-b", "title": "一緒に歌うには？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-06", "6-01-a"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.fighters.co.jp/entertainment/cheer_player/other/"]}, "body": "## ひとことで\n歌詞を全部覚える必要はない。==最初は手拍子、次に「オイ！」などの短い声、最後に選手名のコール==という順で入れば簡単なのだ。\n\n## しくみ\nロッテの公式応援歌ページには、チャンステーマごとの音源と歌詞が用意されている。球場では応援団の太鼓やトランペット、周囲の声が合図になるので、まず1周聞くとリズムがつかみやすい。\n\n日本ハム側も、選手名を入れる部分や手拍子の位置を公式応援ガイドで案内している。==知らない曲で無理に先回りせず、周囲の動きを見てから合わせる==のがいちばん失敗しにくい。\n\n## 今日の試合で見るなら\n**山口航輝**の打席でロッテのチャンステーマが始まったら、最初は拍手だけでいい。周囲が同じところで名前を呼んでいるとわかったら、次から「山口」と合わせれば参加できる。\n\n1塁側内野指定席Bでは、立ち上がらなくても声と手拍子で十分だ。==歌詞を完璧にするより、試合を見失わずに一緒にリズムを取る==ほうが初観戦では楽しみやすいのだ。"}, "6-06": {"meta": {"id": "6-06", "title": "チャンステーマって？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["6-06-a", "6-06-b"], "related": ["6-01", "6-02", "6-05"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.fighters.co.jp/expansion/entertainment/", "https://www.fighters.co.jp/entertainment/cheer_player/other/", "https://npb.jp/npb/kansen_yakkan.html"]}, "body": "## ひとことで\n**チャンステーマ**は、点が入りそうな場面で普段より大きく盛り上げるための応援曲だ。==ランナーがたまり、一本出れば点になりそうなときに聞こえたら「いま勝負どころなんだ」と考えればいい==のだ。\n\n## しくみ\n野球では、二塁や三塁に走者がいるとヒット1本で点になりやすい。こうした場面を**得点圏（点につながりやすい二塁・三塁）**という。日本ハムの公式応援ガイドも、ランナーが二塁や三塁へ進んだときにチャンステーマで盛り上がると説明している。\n\nロッテにも複数のチャンステーマがあり、公式応援歌ページには「チャンステーマ1・3・5・6」などが載っている。ただし、==どの曲がいつ始まるかは機械的に決まっているわけではない==。応援団が試合の流れに合わせて選ぶので、同じ一死二塁でも毎回同じ曲とは限らないのだ。\n\nNPBでは、太鼓やトランペットを使って集団を統率する応援は許可制になっている。客席から聞こえるまとまったコールは、そうした応援団が中心になって作っている。\n\n## おもしろエピソード\nチャンステーマは「曲を知っている人だけのもの」ではない。歌詞がわからなくても、手拍子や選手名のコールだけで混ざれる。==最初は周囲を1回見て、2回目から合わせれば十分==なのだ。\n\n日本ハムには「ジンギスカン」「チキチキバンバン」など複数のチャンステーマが公式に紹介されている。球団ごとに曲が違うので、攻撃する側が変わるとスタンドの音も大きく変わる。\n\n## 今日の試合で見るなら\nロッテの攻撃で、**山口航輝**や**佐藤都志也**の前に走者が二塁や三塁へ進んだら、応援が一段大きくなるか聞いてみよう。==通常の個人応援歌から別の大きな曲に切り替わったら、チャンスが来た合図だ==。\n\n逆に日本ハムの攻撃で**清宮幸太郎**や**万波中正**に好機が回れば、3塁側やレフト側の応援が急に厚くなることがある。スコアだけでなく「音の変化」を聞くと、試合の山場が見つけやすいのだ。"}, "6-07-a": {"meta": {"id": "6-07-a", "title": "7回に風船を飛ばすの？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-07", "6-07-b"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n少なくとも**今日9月28日のZOZOマリン**では、7回の公式案内はジェット風船ではない。==「WE LOVE MARINES」を歌いながらタオルを掲げるのが、今日のMARINES LUCKY 7だ==。\n\n## しくみ\n野球場によっては、7回に細長い風船を飛ばす応援を見たことがあるかもしれない。ただ、応援方法は球場や時期によって違うので、「7回なら必ず風船」とは考えないほうがいい。\n\n今日の千葉ロッテ公式イベント表には、7回表終了後に**MARINES LUCKY 7**を実施し、球団歌に合わせてタオルを掲げると明記されている。==今日参加するなら、風船ではなく場内のタオル演出に合わせればいい==のだ。\n\n## 今日の試合で見るなら\n7回表で**清宮幸太郎**や**万波中正**ら日本ハムの攻撃が終わったあとが合図だ。ビジョンと場内音楽を見聞きして、周囲がタオルを掲げたら一緒に参加できる。\n\nタオルを持っていなくても問題はない。==歌を聞く、手拍子をする、それだけでもラッキーセブンを楽しめる==のだ。"}, "6-07-b": {"meta": {"id": "6-07-b", "title": "マリンの7回は何をする？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-07", "6-05-c"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/00007594.html"]}, "body": "## ひとことで\n今日のZOZOマリンでは、**7回表が終わったあと**に「MARINES LUCKY 7」が入る。==球団歌「WE LOVE MARINES」に合わせてタオルを掲げ、7回裏のロッテの攻撃へつなぐ==のだ。\n\n## しくみ\nタイミングは「7回表後」なので、日本ハムの攻撃が3アウトで終わった直後だ。選手交代などをする**攻守交代（攻撃と守備が入れ替わる時間）**の間に、場内演出が始まる。\n\n曲が終われば、ロッテの7回裏が始まる。==演出だけ見て席を離れると、その直後の先頭打者を見逃しやすい==ので注意するといい。\n\n## 今日の試合で見るなら\n公式案内どおり、ビジョンと音楽に合わせてタオルを掲げれば参加できる。1塁側内野指定席Bでは、周囲にぶつけないよう自分の幅で扱おう。\n\n7回裏に**山口航輝**、**藤原恭大**、**佐藤都志也**らへ打順が回る可能性もある。==ラッキー7はイベントの終わりではなく、終盤のロッテ攻撃のスタート合図==と覚えるとわかりやすいのだ。"}, "6-07": {"meta": {"id": "6-07", "title": "ラッキーセブンの応援は？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["6-07-a", "6-07-b"], "related": ["6-05-c", "6-06"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/00007594.html"]}, "body": "## ひとことで\n**ラッキーセブン**は、7回の攻撃を前にチームの歌や応援で客席を盛り上げる時間だ。今日のZOZOマリンでは、==7回表終了後に「MARINES LUCKY 7」があり、「WE LOVE MARINES」に合わせてタオルを掲げる==のだ。\n\n## しくみ\n野球は9回までなので、7回は終盤に入るところだ。まだ逆転の時間は残っているが、残りの攻撃回数は少ない。そこで「ここからもう一段応援しよう」という区切りとして、7回に特別な応援を入れる球場が多いのだ。\n\nロッテでは球団歌**「WE LOVE MARINES」**がラッキーセブン演出に使われている。球団は2022年のリニューアル時にも、この曲を7回表終了後のラッキー7で流すと案内している。\n\n==大事なのは「7回になった瞬間」ではなく、ホームのロッテなら7回裏の攻撃直前に行うこと==だ。今日の公式イベント表も、7回表が終わったあとに実施するとしている。\n\n## 歴史・由来\nロッテは2015年からラッキー7の曲を「WE LOVE MARINES」に変更した。2022年には千葉移転30周年に合わせて編曲を新しくし、歌詞とメロディーはそのまま受け継いでいる。\n\n## おもしろエピソード\nラッキーセブンは、応援歌を知らなくても参加しやすい。今日の案内はタオルを掲げる形なので、歌えなくても動きだけ合わせられる。\n\n==試合が接戦なら、7回裏は「残り3回のうちの1回」という重みがある==。演出の直後に打席へ入る選手を見ると、応援と試合がつながって感じられるのだ。\n\n## 今日の試合で見るなら\n7回表で日本ハムの攻撃が終わったら、席を立って売店へ向かう前に少し待ってみよう。**MARINES LUCKY 7**が始まり、スタンドでタオルが上がる。\n\nそのあと7回裏に**山口航輝**や**佐藤都志也**へ打順が回れば、終盤の大事な打席になる。==タオルの演出が終わったら、すぐグラウンドへ視線を戻す==と流れを見逃さないのだ。"}, "7-01-a": {"meta": {"id": "7-01-a", "title": "名前の変遷は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-01", "7-02"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/18406.html", "https://www.marines.co.jp/news/detail/202600873928.html"]}, "body": "## ひとことで\n==同じ球場が**「千葉マリンスタジアム」**→「QVCマリンフィールド」→**「ZOZOマリンスタジアム」**と名前を変えてきたのだ。==\n\n## しくみ\n最初の名称は一般公募から選ばれた「千葉マリンスタジアム」だ。**2011年3月1日**からQVCジャパンが**施設命名権**（企業が施設名を付ける権利）を取得し、「QVCマリンフィールド」になった。\n\n==**2016年12月1日**からは「ZOZOマリンスタジアム」。== 2026年6月には契約更新が発表され、名称は**2033年11月30日**まで引き続き使われる予定だ。\n\n==建物そのものが三つあるわけではない。同じ球場を、時代によって別の名前で呼んでいるということだ。==\n\n![現在のZOZOマリンスタジアムの外観](https://upload.wikimedia.org/wikipedia/commons/1/10/%E3%80%90%E3%83%91%E3%83%BC%E3%82%BD%E3%83%AB_%E3%83%91%E3%83%BB%E3%83%AA%E3%83%BC%E3%82%B0%E5%85%AC%E5%BC%8F%E6%88%A6%E3%80%91%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_vs_%E3%82%AA%E3%83%AA%E3%83%83%E3%82%AF%E3%82%B9%E3%83%BB%E3%83%90%E3%83%95%E3%82%A1%E3%83%AD%E3%83%BC%E3%82%BA_12%E5%9B%9E%E6%88%A6_ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_2026%E5%B9%B47%E6%9C%8810%E6%97%A5%E3%81%AE%E5%8D%83%E8%91%89%E5%B8%82_202607101320_IMG_8421.jpg \"出典：Wikimedia Commons／ウィ貴公子／CC BY-SA 4.0\")\n\n## 今日の試合で見るなら\n昔の写真に「千葉マリン」や「QVCマリン」と書かれていても、今日**アンドレ・ジャクソン**が投げる**マウンド**（投手が立つ小高い場所）と同じ場所だ。==過去の記事を見るときは、名前の年代を手がかりにすると迷いにくい。=="}, "7-01-b": {"meta": {"id": "7-01-b", "title": "ここで起きた名場面は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-01", "5-01"], "sources": ["https://npb.jp/bis/scores/nipponseries/linescore2005.html", "https://www.marines.co.jp/news/detail/00003169.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/news/detail/20220412_01.html", "https://www.nikkansports.com/baseball/news/202204100000763.html"], "episode": "v2"}, "body": "## ひとことで\n==代表的なのは、**2005年日本シリーズ**の大勝と、2018年の**福浦和也**の通算2000安打だ。== どちらもこの球場に残る大きな節目なのだ。\n\n## おもしろエピソード\n2022年4月10日、このZOZOマリンで**佐々木朗希（当時20歳のロッテ投手）**が完全試合（相手を1人も塁に出さずに終える試合）を達成した。その投球を受けていたのは、プロ入りしたばかりの**松川虎生（当時18歳の新人捕手）**だった。\n\n佐々木は27人の打者を1人も出塁させず、最後も三振で試合を終えた。試合後には「最後まで松川を信じて投げました」と話した。==20歳の投手と18歳の捕手が組み、この球場で完全試合を完成させたのだ。==\n\n![本塁後方から見た千葉マリンスタジアムのグラウンドと客席](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n今日も節目候補がある。山口航輝は32本塁打（ホームラン）で、33号ならパ・リーグ単独2位になる可能性がある。記録が動く打席では、打球だけでなく直後の場内表示や拍手にも注目するとよい。"}, "7-01-c": {"meta": {"id": "7-01-c", "title": "ロッテが千葉に来たのはいつ？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-01"], "sources": ["https://www.marines.co.jp/corp/history/1990.html", "https://www.marines.co.jp/special/70th/history.html", "https://www.marines.co.jp/news/detail/00007569.html", "https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nロッテが本拠地を千葉へ移したのは**1992年**だ。==この年から「千葉ロッテマリーンズ」としてスタートした==のだ。\n\n## しくみ\nそれまでは**ロッテオリオンズ**という名前で、川崎を本拠地にしていた。球団公式の歴史では、1991年に千葉への本拠地移転を決め、愛称も「オリオンズ」から公募で決まった「マリーンズ」へ変更したとされている。\n\nそして1992年、千葉で新しいシーズンが始まった。==現在のZOZOマリンスタジアムにあたる千葉マリンスタジアムも、1992年からマリーンズの本拠地になった==のだ。\n\n## おもしろエピソード\n1992年は、ピンク色を基調にしたユニフォームで戦い、前半戦の勢いが**「ピンク旋風」**と呼ばれた。==今の白と黒のイメージとはかなり違う時代から、千葉での歴史が続いている==のだ。\n\n## 今日の試合で見るなら\n今日、**山口航輝**たちが「千葉ロッテマリーンズ」としてZOZOマリンで戦うのは、この1992年の移転から続く流れだ。==球場名や選手は変わっても、「千葉のロッテ」という土台は30年以上続いている==と覚えるといい。"}, "7-01": {"meta": {"id": "7-01", "title": "スタジアムの歴史やエピソードは？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["7-01-a", "7-01-b"], "related": ["7-02", "7-05"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/00006829.html", "https://npb.jp/bis/scores/nipponseries/linescore2005.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://www.nikkansports.com/baseball/news/202209200001207.html", "https://full-count.jp/2022/09/20/post1283906/"], "episode": "v2"}, "body": "## ひとことで\n==ZOZOマリンスタジアムは**1990年**に完成し、ロッテが**1992年**から本拠地にしている球場だ。== 名前は変わっても、幕張でマリーンズを見続けてきた場所なのだ。\n\n## しくみ\n球場が完成したのは**1990年2月22日**だ。ロッテがここで初めて公式戦をしたのは**1991年7月31日**の西武戦だった。\n\n当時のロッテはまだ川崎を本拠地にしていた。==1992年から千葉へ移り、この球場を本拠地として使い始めたという流れだ。==\n\n現在のグラウンドは両翼（本塁から左右の外野フェンスまで）**99.5m**、センター（本塁から中堅の一番奥まで）**122.0m**。人工芝の屋外球場なので、風や空の変化まで観戦の一部になる。\n\n![本塁後方から見た千葉マリンスタジアムのグラウンドと客席](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## 歴史・由来\nもとの正式名称は**「千葉マリンスタジアム」**だ。その後、施設命名権（企業が球場名を付ける権利）によって「QVCマリンフィールド」、さらに**「ZOZOマリンスタジアム」**へ変わった。\n\n## おもしろエピソード\n2022年9月20日のロッテ対オリックス戦では、6回に**鳥の大群**がZOZOマリンのグラウンドへ入り込み、試合が約20分止まった。球場は照明を落とし、ワシの鳴き声やバズーカ音まで流したが、鳥はなかなか去らなかった。\n\nそこでロッテの**角中勝也（ベテラン外野手）**がバットを持ってグラウンドへ出て、鳥の群れに向かって走った。すると鳥は飛び去り、スタンドから大きな拍手が起きて試合が再開した。==この球場では、選手がバットで打球ではなく鳥を追ったこともあるのだ。==\n\n## 今日の試合で見るなら\n今日の山口航輝は今季32本塁打（ホームラン）。もし33号が出れば、あなたが見ている球場の歴史にまた一つ新しい場面が加わる。古い名場面も、最初は目の前の一球だったというわけだ。"}, "7-02-a": {"meta": {"id": "7-02-a", "title": "何人入るの？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-02", "7-11"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==球団公式の施設概要では、ZOZOマリンスタジアムの収容人数は**29,645人**だ。==\n\n## しくみ\n**「収容人数」**は、球場に入れる観客の規模を示す数字だ。==ZOZOマリンは**約3万人**なので、満員に近づくと一つの小さな町のような人数が同じ場所に集まる。==\n\nただし、実際の入場者数は試合ごとに違う。==収容人数は「毎試合この人数が来る」という意味ではないのだ。==\n\n![本塁後方から見た千葉マリンスタジアムのグラウンドと客席](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## 今日の試合で見るなら\n今日の日本ハム戦では、**山口航輝**や**清宮幸太郎**の打席で場内の声がどれだけ広がるか聞いてみるとよい。==約3万人規模の客席が一斉に反応すると、テレビとは違う球場の大きさを体で感じやすい。=="}, "7-02-b": {"meta": {"id": "7-02-b", "title": "ホームランラグーンって？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-02", "2-03", "7-11"], "sources": ["https://www.marines.co.jp/news/detail/00003086.html", "https://www.marines.co.jp/news/detail/00003818.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\n==**ホームランラグーン**は、**2019年**に外野へせり出す形で作られた観客席だ。== **ライト側151席、レフト側151席**が設けられた。\n\n## しくみ\nそれまで選手がプレーしていた外野の一部に客席を作り、フェンスをホーム側へ近づけた形だ。==だから「外野席のさらに前で見る席」と考えると分かりやすい。==\n\n球団は、**ホームランボール**を捕れるかもしれない位置にいることを特徴として案内している。==打球が飛んできたときは観戦より安全確保が先なのだ。==\n\n## 今日の試合で見るなら\n**山口航輝**は32本塁打、**清宮幸太郎**は23本塁打で今日を迎える。==二人の大きな打球が外野へ上がったら、通常の外野席より前に張り出したホームランラグーンの位置まで届くかを見るとよい。=="}, "7-02-c": {"meta": {"id": "7-02-c", "title": "座席の種類は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-02", "7-11"], "sources": ["https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/news/detail/202500721662.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンの席は、**バックネット裏・内野・外野**を基本に、グラウンドに近い席やテーブル付きの席などへ細かく分かれている。==席名は「どこから見るか」を表す地図のようなものなのだ。==\n\n## しくみ\n2026年の球団公式価格表では、バックネット裏にGⅠ・VS・SS、内野のフロア2にフィールドウイングやS・A系、フロア4にパノラマカウンター・シートや**内野指定席B**などがある。外野にはホーム側とビジター側の応援指定席がある。\n\nさらに、2026年はピクニックボックスのリニューアルや、フィールドウイングエリアのグループ席新設なども行われた。==同じ球場でも「近さ」「高さ」「応援の雰囲気」で体験が変わる==というわけだ。\n\n## 今日の試合で見るなら\n今日の席は**1塁側の内野指定席B**で、公式価格表ではフロア4の内野席に分類される。==まず自分の席が「内野・フロア4」だと分かれば、案内表示を追いやすい。==\n\n18時に試合が始まったら、ロッテ先発の**アンドレ・ジャクソン**と日本ハム先発の**福島蓮**を、同じ座席からじっくり見比べればよい。"}, "7-02": {"meta": {"id": "7-02", "title": "スタジアムの施設概要は？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["7-02-a", "7-02-b"], "related": ["7-01", "7-03", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/00003818.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.nikkansports.com/baseball/news/201903100000706.html"], "episode": "v2"}, "body": "## ひとことで\n==ZOZOマリンは、**約3万人**が入る屋外の**人工芝球場**だ。== 海に近く、グラウンドと客席の距離を縮める席も増やされてきたのだ。\n\n## しくみ\n球団公式の施設概要では、収容人数は**29,645人**。グラウンドは両翼（本塁から左右の外野フェンスまで）**99.5m**、センター（本塁から中堅の一番奥まで）122.0mで、透水性（水を通しやすい性質）の人工芝が使われている。\n\n==屋根で全体を覆うドームではない。== 空が開いているため、雨や風の影響を受ける一方、夕方から夜へ変わる空や海風もそのまま感じる球場だ。\n\n大きな映像装置は、バックスクリーンのメインスクリーンに加え、レフト・ライト側にもある。上空と地上の風速を表示する**風速計**も設置されているので、プレーと風を結びつけて見られるのが特徴だ。\n\n![本塁後方から見た千葉マリンスタジアムのグラウンドと客席](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n**2019年**には、観客がグラウンドに近づける新しい席が増えた。==その一つが外野の**「ホームランラグーン」**で、従来は選手がプレーしていた区域の一部を観客席にしたものだ。==\n\n## 歴史・由来\n完成は**1990年**。本拠地として使い始めた1992年から改修を重ね、**2018年**には野球専用の人工芝へ張り替え、2019年には新席種を増設した。\n\n## おもしろエピソード\n2019年3月10日、新設された**ホームランラグーン**に最初の本塁打を飛び込ませたのは、ロッテの江村直也だった。当時9年目の捕手で、公式戦では通算192試合に出ながら本塁打が0本。しかも、その打球は前年までの外野席の位置なら届かなかったという。\n\nベンチの仲間は、本塁打を打った選手を最初だけ無視してから祝う「サイレントトリートメント」を始めた。ところが江村のときは最後まで誰も騒がず、本人も笑って「サイレント・サイレントでした」と話した。==新しい席の最初の一発を、公式戦0本塁打だった選手が打ったのだ。==\n\n## 今日の試合で見るなら\n先発のアンドレ・ジャクソンと福島蓮が投げるときは、ビジョンだけでなく風速表示も見てみるとよい。山口航輝や清宮幸太郎の大きな打球が上がったら、外野フェンスとホームランラグーンまでの距離感も観察すると、この球場の形がよく分かる。"}, "7-03-a": {"meta": {"id": "7-03-a", "title": "球場の外の広場には何がある？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-03", "7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/202600934314.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日の球場外周には、**キッチンカー、TEAM26ブース、ボールパークステージ**などがある。==入場前の待ち時間も、外周を一周すると小さなイベント会場のように使えるのだ。==\n\n## しくみ\n9月28日の球団公式案内では、**15:00**に外周ケータリングカーとTEAM26ブースが営業開始。さらに==16:20からボールパークステージ==、16:30からM☆Splash!!のダンスショーが予定されている。\n\nこの日は外周グルメエリアにPOP UPキッチンカーも出店する。球場の外なので、席へ向かう前に食事やイベントを見てから入場する流れを作りやすいのだ。\n\n## 今日の試合で見るなら\n==16:00の開場前後は、外周と入場のどちらに時間を使うか決めておく==と動きやすい。18:00からは**アンドレ・ジャクソン**と**福島蓮**の先発で試合が始まるので、外周を楽しむなら開始前に席へ移ればよい。"}, "7-03-b": {"meta": {"id": "7-03-b", "title": "海が見える場所は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-03", "7-04"], "sources": ["https://www.city.chiba.jp/bayside/makuhari-hama.html", "https://www.city.chiba.jp/sogoseisaku/miraitoshi/makuhari/makuharisintoshin_enjoy.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n海そのものを見たいなら、ZOZOマリンに隣接する**幕張の浜**が公式情報で確認できる場所だ。==球場内の特定の座席から海が見える、と公式に保証された案内は確認できない。==\n\n## しくみ\n千葉市は、幕張の浜を**幕張海浜公園やZOZOマリンスタジアムに隣り合う海辺**として案内している。幕張海浜公園の前面にある人工海浜で、散策できる場所なのだ。\n\nだから「海を見たい」という目的なら、==座席から見えることを期待するより、外にいる時間に幕張の浜へ行く方が確実==だ。なお、幕張の浜は遊泳禁止なので、海水浴をする場所ではない。\n\n## 今日の試合で見るなら\n今日は**16:00開場、18:00試合開始**だ。==海を見るなら入場前など球場の外にいる時間に回し、試合開始までには席へ戻る==とよい。\n\n席に着いたら、通算100本塁打まであと1本の**清宮幸太郎**の打席に注目すると、今日ならではの見どころにつながるのだ。"}, "7-03": {"meta": {"id": "7-03", "title": "スタジアムの名所、隠れ名所は？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": [], "related": ["7-01", "7-02", "7-06"], "sources": ["https://www.marines.co.jp/stadium/stadiuminquiry/", "https://www.marines.co.jp/special/70th/event.html", "https://shop.marines.co.jp/shop/detail?real_shop_id=1", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.sponichi.co.jp/baseball/news/2022/09/20/articles/20220920s00001173480000c.html", "https://full-count.jp/2024/07/11/post1582112/"], "episode": "v2"}, "body": "## ひとことで\n==初めてなら、球場外周の**「6冠モニュメント」**と**「マリーンズストア ミュージアム店」**を見ておくとよい。== どちらも球団公式で現在の案内を確認できる場所だ。\n\n## しくみ\n**6冠モニュメント**は球場外周にある。==球団公式のインフォメーション案内でも「外周 6冠モニュメント付近」と場所の目印に使われているので、待ち合わせの基準にもなる。==\n\n「6冠」は、ロッテが**2005年**に日本一を含む**六つのタイトル**を獲得したシーズンに由来する。球団の70周年企画でも、このモニュメントを2005年の歴史を振り返る場所として扱っている。\n\nもう一つは、スタジアム外の大型グッズ店**「マリーンズストア ミュージアム店」**だ。**2026年9月28日**は13時から、試合終了30分後まで営業予定で、最長でも22時までと公式に案内されている。\n\n==名前に「ミュージアム」とあるが、現在の公式案内では大型グッズショップとして紹介されている。== 昔の展示施設だと思い込まず、「球場の外にある大きな公式ショップ」と考えるのが正確だ。\n\n![試合日ににぎわうZOZOマリンスタジアム外周](https://upload.wikimedia.org/wikipedia/commons/f/ff/%E3%80%90%E6%97%A5%E6%9C%AC%E7%94%9F%E5%91%BD%E3%82%BB%E3%83%BB%E3%83%91%E4%BA%A4%E6%B5%81%E6%88%A6%E3%80%91%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_vs_%E6%A8%AA%E6%B5%9CDeNA%E3%83%99%E3%82%A4%E3%82%B9%E3%82%BF%E3%83%BC%E3%82%BA_2%E5%9B%9E%E6%88%A6_ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_2026%E5%B9%B46%E6%9C%8813%E6%97%A5%E3%81%AE%E5%8D%83%E8%91%89%E5%B8%82_202606131254_IMG_0604.jpg \"出典：Wikimedia Commons／ウィ貴公子／CC BY-SA 4.0\")\n\n## おもしろエピソード\n2022年9月20日のロッテ対オリックス戦では、6回に**鳥の大群**がグラウンドへ入り、試合が止まった。球場は照明を消し、ワシの鳴き声やバズーカの音まで流したが、鳥はなかなか動かなかった。\n\nそこで現れたのが、ロッテのベテラン外野手**角中勝也**だ。バットを手に鳥へ向かって走ると、群れが飛び立ち、==約20分ぶりに試合が再開した==。同じ海辺の球場では、ときどき野球以外の「珍客」まで主役になるのだ。\n\nもう一つは、球場ができたばかりの1990年3月24日。巨人対ロッテのオープン戦で、当時まだ川崎球場を本拠地にしていたロッテの**初芝清**が、この球場の第1号本塁打を放って賞金を受け取った。\n\nその2年後、ロッテは本当にこの球場へ本拠地を移した。==未来のホーム球場で最初の本塁打を打ったとき、初芝はまだ「ビジター側」の選手だった==のだ。\n\n## 今日の試合で見るなら\n山口航輝の33号や清宮幸太郎の通算100号（プロ入りから数えて100本目の本塁打）候補を見届ける前に時間があるなら、外周を一周して6冠モニュメントを確認しておくとよい。今日の一打も、将来こうした球場の歴史として語られる可能性がある。"}, "7-04-a": {"meta": {"id": "7-04-a", "title": "なぜ海風がすごいの？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-04", "7-04-b"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://www.jma.go.jp/jma/kishou/know/yougo_hp/kaze.html", "https://www.data.jma.go.jp/haneda-airport/weather_topics/wt_wind.html"]}, "body": "## ひとことで\n\n==ZOZOマリンは海に近い屋外球場で、海と陸の温度差から生まれる**海風**の影響を受けやすいのだ。== ただし、毎日必ず強風になるわけではない。\n\n## しくみ\n\n陸は海より温まりやすく、日中は陸側の気温が上がりやすい。==気象庁によると、この温度差で気圧の差ができると、海から陸へ**「海風」**が吹く。==\n\nZOZOマリンの海側には**幕張の浜**がある。球団公式も花火の案内で「海側からの風」を想定しており、==風向によって打ち上げ位置を変えている。==\n\nもちろん、風の強さは海風だけで決まらない。**天気全体の風**が重なれば強くなるし、弱い日もあるというわけだ。\n\n![現在のZOZOマリンスタジアムの外観](https://upload.wikimedia.org/wikipedia/commons/1/10/%E3%80%90%E3%83%91%E3%83%BC%E3%82%BD%E3%83%AB_%E3%83%91%E3%83%BB%E3%83%AA%E3%83%BC%E3%82%B0%E5%85%AC%E5%BC%8F%E6%88%A6%E3%80%91%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_vs_%E3%82%AA%E3%83%AA%E3%83%83%E3%82%AF%E3%82%B9%E3%83%BB%E3%83%90%E3%83%95%E3%82%A1%E3%83%AD%E3%83%BC%E3%82%BA_12%E5%9B%9E%E6%88%A6_ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_2026%E5%B9%B47%E6%9C%8810%E6%97%A5%E3%81%AE%E5%8D%83%E8%91%89%E5%B8%82_202607101320_IMG_8421.jpg \"出典：Wikimedia Commons／ウィ貴公子／CC BY-SA 4.0\")\n\n## 今日の試合で見るなら\n\n今日の先発はロッテが**ジャクソン**、日本ハムが**福島蓮**だ。==試合前に旗や選手のユニホームの揺れ方を見ておくと、投球が始まる前から「今日は風が強い日か」をつかみやすい。=="}, "7-04-b": {"meta": {"id": "7-04-b", "title": "風がプレーにどう影響する？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-04", "2-03-b"], "sources": ["https://www.daily.co.jp/baseball/2026/05/01/0020307867.shtml", "https://npb.jp/news/detail/20230725_02.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\n==いちばん分かりやすく影響を受けるのは、高く上がった打球なのだ。==風で**フライ**が横へ流れたり、伸びたり、逆に押し戻されたりする。\n\n## しくみ\n\n==打球が空中にいる時間が長いほど、風を受ける時間も長くなる。==ZOZOマリンでは、**2026年5月1日**の西武戦で上空で**風速19m/s**（1秒に19メートル進む速さの風）を記録し、打者が構えを保てずタイムを取ったり、選手の帽子が飛ばされたりする様子も報じられている。\n\nホームラン級の打球でも安心はできない。**山口航輝**は**2023年**、ZOZOマリンで本塁打を打ったあと、高い弾道だったので「風で戻されると思った」という趣旨のコメントを残している。\n\n==だから外野手が一直線に走らず、細かく位置を直していたら、風を計算している可能性が高いのだ。==\n\n## 今日の試合で見るなら\n\n**山口航輝**は今日、**32本塁打**でリーグ2位タイだ。==33号を狙える大きな打球が上がったら、ボールと一緒に外野手の足取りも見るといい。==風が一打の結果を変える瞬間が見えるかもしれない。"}, "7-04-c": {"meta": {"id": "7-04-c", "title": "なぜ人工芝なの？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/00002091.html", "https://www.marines.co.jp/news/detail/00000786.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nZOZOマリンは**人工芝**の球場だ。==2018年に、天然芝に近い感覚を目指した野球専用の人工芝へ張り替えられた==のだ。\n\n## しくみ\n球団公式によると、この人工芝は「MSCraft BaseballTurf」。芝葉に特殊な加工をして、選手の足元の横ぶれを抑え、プレーを安定させる設計なのだ。芝の表面で光を散らし、照り返しも減らしている。\n\n2017年に球団と千葉市が張り替えを計画したときは、**選手のダイナミックなプレー**と、観戦をより楽しめることが目的に挙げられた。==「人工芝だから管理が楽」という説明を球団公式はしていないので、そこは理由として決めつけない==のだ。\n\n![ZOZOマリンスタジアムの人工芝グラウンド](https://upload.wikimedia.org/wikipedia/commons/5/57/ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_%E5%86%85%E6%99%AF.jpg \"出典：Wikimedia Commons／Stantonharuka／CC BY-SA 4.0\")\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**や**福島蓮**が打たせたゴロでは、野手が人工芝の上でどう踏ん張って捕り、送球するかを見るといい。==打球だけでなく、捕る直前の足運びまで見ると、この球場の人工芝が「プレーする場所」だと実感しやすい==のだ。"}, "7-04": {"meta": {"id": "7-04", "title": "スタジアムの特徴は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-04-a", "7-04-b"], "related": ["7-02", "7-08"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://www.jma.go.jp/jma/kishou/know/yougo_hp/kaze.html", "https://npb.jp/bis/2026/stats/llb_p.html", "https://full-count.jp/2020/06/11/post798246/", "https://www.mlb.com/news/the-big-impact-of-wind-on-baseball-outcomes"], "episode": "v2"}, "body": "## ひとことで\n\n==**ZOZOマリンスタジアム**は、屋外で海の近くにあり、**風**を強く意識する球場なのだ。== 人工芝のグラウンドと海風が重なり、打球の行方まで観戦の見どころになる。\n\n## しくみ\n\n球団公式によると、マリーンズは**1992年**からこの球場を本拠地にしている。グラウンドは人工芝で、**2018年**に野球専用の人工芝へ張り替えられた。\n\nもう一つの大きな特徴が風だ。球場の海側には**幕張の浜**があり、球団も花火の打ち上げ場所を決めるときに「海側からの風」を考慮している。==海沿いの屋外球場なので、風は背景ではなく試合の条件の一つなのだ。==\n\n==気象庁の説明では、**海風**（昼間に海から陸へ吹く風）は、海と陸の温まり方の差で生まれる。== ただし、いつも同じ向き・強さで吹くわけではない。その日の広い範囲の風や天気でも変わる。\n\n![本塁後方から見た千葉マリンスタジアムのグラウンドと客席](https://upload.wikimedia.org/wikipedia/commons/a/af/Chiba_Marine_Stadium_Complete_View.jpg \"出典：Wikimedia Commons／ROG／CC BY-SA 3.0\")\n\n## おもしろエピソード\n\n2020年6月11日、ZOZOマリンでロッテと中日が練習試合をした日は、風速10メートルを超える強風だった。3回、ロッテの捕手**柿沼友哉**がファウルフライ（打ち上がったファウルの打球）を追ってヘルメットを外すと、置いたはずのヘルメットが風でころころ転がり始めた。\n\n柿沼だけでなく、一塁手の**井上晴哉**、投手の**小島和哉**まで追いかけることになった。==最後は選手たちも笑ってしまうほど、風そのものが一つのプレーのようになった==のだ。\n\n海風で有名な球場は海外にもある。1961年、サンフランシスコ・ジャイアンツが当時使っていたキャンドルスティック・パークのオールスター戦で、投手**ステュ・ミラー**が突風にあおられて体勢を崩した。\n\nその動きがボーク（投手の反則動作）と判定された。後年「風にマウンドから吹き飛ばされた」と大げさに語られることもあるが、MLBの検証では、実際には投球を続けたうえでボークを宣告されたとされている。==風が笑い話だけでなく、判定にまで関わった試合だった==のだ。\n\n## 今日の試合で見るなら\n\n今日はロッテの山口航輝が32本塁打（ホームラン）でパ・リーグ2位タイ（2位に並んでいる状態）にいる。大きな打球が上がったら、打った瞬間から、風に押されるのか伸びるのかまで見ておくといい。\n\n守る側も同じだ。高いフライ（高く打ち上げた打球）が上がったとき、野手が早めに落下地点へ入れるかを見ると、ZOZOマリンらしさが分かりやすい。"}, "7-05-a": {"meta": {"id": "7-05-a", "title": "ドームと屋外球場の違いは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["7-05", "7-04", "7-08"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.tokyo-dome.co.jp/dome/about/"]}, "body": "## ひとことで\n==いちばん大きな違いは、空と天候をそのまま受けるかどうかだ。==**ZOZOマリン**は屋外、**東京ドーム**は屋根に覆われた全天候型なのだ。\n\n## しくみ\n==**屋外球場**では、雨、風、気温、日差しが試合に入り込む。==ZOZOマリンでは**風速計**まで設置されていて、風が観戦の重要な情報になる。\n\n![ZOZOマリンスタジアムの内景](https://upload.wikimedia.org/wikipedia/commons/5/57/ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_%E5%86%85%E6%99%AF.jpg \"出典：Wikimedia Commons／Stantonharuka／CC BY-SA 4.0\")\n\n**東京ドーム**は屋根で覆われ、公式にも「**全天候型**」と案内されている。天候の影響を受けにくい一方、屋外球場のように空の色や自然の風をそのまま感じる場所ではない。\n\n![東京ドームの外観](https://upload.wikimedia.org/wikipedia/commons/c/c8/TokyoDomeExteriorNight.JPG \"出典：Wikimedia Commons／ClarkSui／CC BY-SA 3.0\")\n\n==なお、「ドームなら人工芝」「屋外なら天然芝」と決まっているわけではない。==屋根と芝は別の条件だ。\n\n## 今日の試合で見るなら\n今日、**山口航輝**や**清宮幸太郎**が高いフライを打ったら、打球だけでなく風速表示も見てみるとよい。==ドームなら意識しにくい「風もプレーの条件」という感覚が、ZOZOマリンでは分かりやすい。=="}, "7-05-b": {"meta": {"id": "7-05-b", "title": "日本ハムの本拠地エスコンフィールドとの違いは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["7-05", "7-02", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.hkdballpark.com/about/esconfield/"]}, "body": "## ひとことで\n**ZOZOマリン**は屋外・人工芝。**エスコンフィールドHOKKAIDO**は開閉式屋根・天然芝だ。==日本ハムの選手は、今日は普段とかなり違う環境で戦うのだ。==\n\n## しくみ\n**エスコンフィールド**は**2023年**に開業し、収容人数は3万5000人。==公式には「日本初の開閉式屋根付き天然芝球場」と案内されている。==\n\n![エスコンフィールドHOKKAIDOの空中写真](https://upload.wikimedia.org/wikipedia/commons/7/7c/ES_CON_field_Hokkaido_aerial_photograph_2025.jpg \"出典：Wikimedia Commons／国土地理院／CC BY 4.0\")\n\nZOZOマリンは収容**29,645人**で、屋根のない**人工芝球場**だ。海風が直接入り、上空と地上の風速表示もある。\n\n![ZOZOマリンスタジアムの内景](https://upload.wikimedia.org/wikipedia/commons/5/57/ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_%E5%86%85%E6%99%AF.jpg \"出典：Wikimedia Commons／Stantonharuka／CC BY-SA 4.0\")\n\n==エスコンは屋根を閉じられるので、天候への対応方法が違う。==天然芝を育てるため、南側には**大きなガラス壁**も設けられている。\n\n## 今日の試合で見るなら\n**福島蓮**、**清宮幸太郎**、万波中正たち日本ハム勢は、今日はエスコンではなくZOZOマリンでプレーする。==外野フライや長打が上がったとき、海風のある屋外での守備や打球の伸び方に注目すると違いが見えやすい。=="}, "7-05-c": {"meta": {"id": "7-05-c", "title": "12球団の本拠地はどこ？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-05"], "sources": ["https://npb.jp/stadium/franchise.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nプロ野球12球団には、それぞれ基本となる**本拠地球場**がある。==今日のZOZOマリンはロッテの本拠地で、日本ハムは北海道から来るビジターチームなのだ。==\n\n## しくみ\n2026年のNPB公式一覧では、本拠地は次の通りだ。\n\n- 日本ハム：**エスコンフィールドHOKKAIDO**\n- 楽天：楽天モバイル 最強パーク宮城\n- 西武：ベルーナドーム\n- ロッテ：**ZOZOマリンスタジアム**\n- オリックス：京セラドーム大阪\n- ソフトバンク：みずほPayPayドーム福岡\n- 巨人：東京ドーム\n- ヤクルト：明治神宮野球場\n- DeNA：横浜スタジアム\n- 中日：バンテリンドーム ナゴヤ\n- 阪神：阪神甲子園球場\n- 広島：MAZDA Zoom-Zoom スタジアム広島\n\n==「ホーム」は、その球団が主催する側だと考えると分かりやすい。==\n\n## 今日の試合で見るなら\n今日は**ロッテがホームで1塁側、日本ハムがビジターで3塁側**だ。==球場がロッテ色なのは、ここがロッテの本拠地だからなのだ。==\n\n日本ハムの**福島蓮**にとっては、普段のエスコンフィールドHOKKAIDOではなくZOZOマリンで投げる試合になる。"}, "7-05": {"meta": {"id": "7-05", "title": "他にどんなスタジアムがあるの？どう違うの？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "children": ["7-05-a", "7-05-b"], "related": ["7-02", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.tokyo-dome.co.jp/dome/about/", "https://www.hkdballpark.com/about/esconfield/", "https://koshien.hanshin.co.jp/stadium_guide/seat.html", "https://www.mlb.com/cut4/dave-kingman-fly-ball-against-twins-goes-into-metrodome-roof-c227649908"], "episode": "v2"}, "body": "## ひとことで\nプロ野球の球場は、**屋根の有無**、**芝の種類**、客席とグラウンドの距離などがかなり違う。==同じ野球でも、球場が変わると見え方や音、天候の影響まで変わるのだ。==\n\n## しくみ\n==**ZOZOマリン**は屋外・人工芝で、収容人数は**29,645人**。==海に近く、風や雨の影響を受ける球場だ。\n\n![ZOZOマリンスタジアムの内景](https://upload.wikimedia.org/wikipedia/commons/5/57/ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_%E5%86%85%E6%99%AF.jpg \"出典：Wikimedia Commons／Stantonharuka／CC BY-SA 4.0\")\n\n一方、**東京ドーム**は屋根で覆われた全天候型で、**2026年**に人工芝を更新している。雨天でも屋根の下で試合を行えるのが大きな違いだ。\n\n![東京ドームの外観](https://upload.wikimedia.org/wikipedia/commons/c/c8/TokyoDomeExteriorNight.JPG \"出典：Wikimedia Commons／ClarkSui／CC BY-SA 3.0\")\n\n**阪神甲子園球場**のように屋外で長い歴史を持つ球場もある。さらに、日本ハムの**エスコンフィールドHOKKAIDO**は開閉式屋根と天然芝を組み合わせている。\n\n![エスコンフィールドHOKKAIDOの空中写真](https://upload.wikimedia.org/wikipedia/commons/7/7c/ES_CON_field_Hokkaido_aerial_photograph_2025.jpg \"出典：Wikimedia Commons／国土地理院／CC BY 4.0\")\n\n==つまり、「ドームか屋外か」の二つに分けるだけでは足りない。==屋根が開く球場、**人工芝**の球場、**天然芝**の球場など、設計の組み合わせが違うのだ。\n\n## おもしろエピソード\n1984年、ミネソタ・ツインズが使っていた屋内球場**メトロドーム**で、打者**デーブ・キングマン**が高いフライを打った。ところがボールは、白い屋根の排水用の穴へ入ったまま、いつまで待っても落ちてこなかった。\n\n審判もすぐには判定できない。そこでツインズの一塁手**ミッキー・ハッチャー**は、審判用の予備球をこっそりつかみ、==「屋根から落ちてきた球」のように見せてキングマンへタッチしようとした==。もちろん審判には通じず、キングマンには二塁打が与えられた。\n\n翌日、球場職員が屋根に残った本物のボールを回収した。球場の形が違うと、打球の行方だけでなく、選手がとっさに考えることまで変わってしまうのだ。\n\n## 今日の試合で見るなら\n福島蓮たち日本ハムの選手は、普段はエスコンフィールドHOKKAIDOを本拠地としている。今日は屋外のZOZOマリンだ。福島の投球や外野フライが海風の中でどう見えるかを意識すると、「球場が変わる」意味が分かりやすい。"}, "7-06-a": {"meta": {"id": "7-06-a", "title": "名物メニューは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-06", "7-06-b"], "sources": ["https://www.marines.co.jp/gourmet/regular/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\n==まず見るなら、球団が「**ZOZOマリンスタジアム定番メニュー**」として紹介している料理が分かりやすい。==今日は**マリンクリームセウ**やマリンチーズステーキドッグが公式イベントページにも載っている。\n\n## しくみ\n\n**マリンクリームセウ**は、えびを使った球場グルメで**1,300円**。SHRIMP STAND 203で販売されている。マリンチーズステーキドッグは、今日の公式案内では1,200円だ。\n\n==「名物」といっても一つだけではない。==球団公式の**定番メニュー一覧**から、丼、麺、軽食など、そのとき食べたいものを選ぶのが実用的なのだ。\n\n## 今日の試合で見るなら\n\n**山口航輝**の**33号**を見逃したくないなら、打席が始まってから売店へ動くのは避けたい。==16:00の開場後、試合開始前に定番メニューを確保しておけば、18:00からはグラウンドに集中しやすい。=="}, "7-06-b": {"meta": {"id": "7-06-b", "title": "選手コラボメニューは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-06", "7-06-a"], "sources": ["https://www.marines.co.jp/gourmet/players_menu/", "https://www.marines.co.jp/gourmet/players_menu/player51.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\nマリーンズの選手名や好み、プレースタイルに合わせた**「PLAYERS COLLAB MENU」**がある。==食べ物をきっかけに、知らなかった選手の名前を覚えられる仕組みなのだ。==\n\n## しくみ\n\n==球団公式では、**選手へのアンケート**をもとに、好きな食べ物やこだわりを反映したメニューを販売している。==\n\n**山口航輝**なら、公式ページに次のようなメニューが載っている。\n\n- **「ぐっさんの豪快おろしぶっかけうどん」1,100円**\n- **「ぐっさんの炙りチャーシュー丼」1,700円**\n- **「山口航輝の豪快3ランHRグリル」1,300円**\n\nほかにもメニューがあり、公式ページでは名前と一緒に販売店も確認できる。\n\n## 今日の試合で見るなら\n\n山口は**32本塁打**でパ・リーグ2位タイ。**33号**が出れば単独2位になる。==先に「豪快3ランHRグリル」を食べてから本人の打席を見ると、メニュー名とプレーがそのままつながるというわけだ。=="}, "7-06-c": {"meta": {"id": "7-06-c", "title": "モバイルオーダーは使える？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-06", "7-06-a"], "sources": ["https://www.marines.co.jp/gourmet/mobileorder/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\n==使える。会員登録や専用アプリは不要で、スマホから注文と決済を済ませ、完成通知が来たら対応店舗へ受け取りに行く仕組みなのだ。==\n\n## しくみ\n\n注文ページは**MARINES APP**、**TEAM26マイページ**、球場内ポスターのQRコードなどから開ける。通知にはメールアドレス、LINEアカウント、電話番号のどれか一つを使う。\n\n支払いは各種クレジットカードと**PayPay**に対応している。==公式案内の営業時間は**開場20分前から8回裏終了まで**。==ただし、混雑時は新規注文を一時停止する場合がある。\n\n==全部の店が対象ではないので、注文ページに出る**対応店舗と商品**から選ぶことになる。==\n\n## 今日の試合で見るなら\n\n**山口航輝**の打席をなるべく見逃したくないなら、売店の列に並ぶ時間を減らせるのは便利だ。==完成通知が来てから受け取りへ動けば、試合の流れに合わせて席を立ちやすい。=="}, "7-06": {"meta": {"id": "7-06", "title": "ご飯はどういうのがあるの？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-06-a", "7-06-b", "7-06-c"], "related": ["7-06-a", "7-06-b", "7-06-c"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/gourmet/", "https://www.marines.co.jp/gourmet/regular/", "https://www.marines.co.jp/news/detail/202600934314.html", "https://baseballhall.org/discover/pop-ups/take-me-out-to-the-ballgame", "https://www.mlb.com/amp/news/history-of-iconic-mlb-ballpark-food-explained.html"], "episode": "v2"}, "body": "## ひとことで\n\n**ZOZOマリン**のご飯は、**定番の球場グルメ**、選手コラボ、球場外周のキッチンカーまでかなり幅が広いのだ。==今日は日本ハム戦だけのPOP UPグルメもある。==\n\n## しくみ\n\n球団公式のグルメ案内には、丼、麺、肉料理、軽食、スイーツ、ドリンクなど多くの店が載っている。球場内だけでなく外周グルメエリアにも店があるので、「席に入ってから探す」より、先に食べたいものを決めておくほうが分かりやすい。\n\n**9月28日**の公式イベントページで紹介されている定番は、**マリンチーズステーキドッグ1,200円**、マリンクリームセウ1,300円、マリーンズビール950円だ。\n\n==さらに今日は、**9月27・28日**の日本ハム戦限定で外周に**POP UPキッチンカー**が出る。==球団公式の案内では、日本ハムの「シャウエッセンキッチンカー」が田宮裕涼選手にちなんだチーズドッグ（1,000円）、「IZAKAYAとぽす」が万波中正選手にちなんだカレー（1,380円）、「甲子園カレー by CURRY STAND 極」が甲子園カレー（900円）を売る。\n\n==外周ケータリングカーの営業開始は**15:00**、開場は**16:00**だ。==球場に着く時間によって、外で先に食べるか、入場後に球場内で買うかを選べるというわけだ。\n\n## おもしろエピソード\n\nアメリカの球場でよく歌われる「**Take Me Out to the Ball Game**」には、「ピーナツとクラッカー・ジャックを買って」という歌詞がある。ところが1908年に詞を書いた**ジャック・ノーワース**と曲を付けた**アルバート・フォン・ティルザー**は、==この歌を作った時点では二人ともメジャーリーグの試合を見たことがなかった==。\n\nノーワースは地下鉄の広告を見て歌詞を思いついたとされる。その後、この歌は7回途中の休憩で歌う球場の定番になり、歌詞に登場する菓子まで「野球らしい食べ物」として知られるようになったのだ。\n\nもう一つ、今では定番の**ナチョス**にも球場ならではの工夫がある。1976年、テキサス・レンジャーズの球場で販売を始めた**フランク・リベルト**は、長く保存できるチーズソースとポンプ式の機械を使い、注文が来たらすぐチップスへかけられる仕組みを作った。\n\n==「大勢に短時間で出せること」が、球場の名物を生んだ==のだ。味だけでなく、イニングの合間に買いやすいかどうかも、球場グルメでは大切だったというわけだ。\n\n## 今日の試合で見るなら\n\n今日は山口航輝の33号本塁打がかかる試合だ。打席を見逃したくないなら、試合開始直前よりも早めに食事を確保しておくと動きやすい。\n\n18:00の試合開始までに食べるなら、15:00からの外周キッチンカーか、16:00の開場後の球場内グルメを使うと流れを作りやすい。"}, "7-07-a": {"meta": {"id": "7-07-a", "title": "開場（16:00）から試合開始までに何がある？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n==**16:00**の開場後は、**16:20**のステージ開始から17:55頃の選手登場まで、だんだん試合モードに切り替わっていくのだ。==\n\n## しくみ\n球団公式の今日の予定では、**16:20**にボールパークステージが始まり、**16:30**からM☆Splash!!のダンスショーがある。\n\n場内では**17:20頃**に「**MARINES ROSTER**」でベンチ入り選手を紹介。17:25頃にDJ、17:30頃に観戦ポイントなどを紹介する「Warm Up Show」が続く。\n\n==**17:45頃**には**山口航輝**の8月度月間MVP表彰式、17:55頃には照明や映像を使った選手登場とスタメン紹介があり、18:00に試合開始だ。==\n\n## 今日の試合で見るなら\n==山口の表彰式を見たいなら**17:45より前**に着席しておくとよい。==山口は今日**33号本塁打（ホームラン）**が出れば、リーグ単独2位になる。その山口をまず表彰式で見て、それから試合へ入る流れになるのだ。"}, "7-07-b": {"meta": {"id": "7-07-b", "title": "試合中（5回終了後・7回など）は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n==試合中のイベントは、**攻守交代**の短い時間に次々入る。==特に**5回前後と7回表後**を覚えておけば、初心者でも流れをつかみやすいのだ。\n\n## しくみ\n今日は**2回表後**（2回表の攻撃が終わったあと）にバズーカ、3回表後にキャップシャッフル、4回表後に**36秒チャレンジ**が予定されている。\n\n**5回表後**は「**スマドリ乾杯タイム**」。5回裏後は一斉水分補給タイムと「オドロッテ」、6回表後は「DASHMAN RACE」だ。\n\n==**7回表後**は「**MARINES LUCKY 7**」で、球団歌「WE LOVE MARINES」に合わせてタオルを掲げる。==8回表後は電子トレカの番号発表、9回表後は条件が合う場合だけ「GRAB THE WIN」が行われる。\n\n## 今日の試合で見るなら\n**清宮幸太郎**の**通算100本塁打**や山口航輝の33号が出るかを追いながら、攻守交代になったらビジョンを見るとよい。==5回と7回は、試合そのものとは別の球場らしさが分かりやすく出る時間なのだ。=="}, "7-07-c": {"meta": {"id": "7-07-c", "title": "試合後は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n==今日、ロッテが勝った場合は**「MARINES WINNING CEREMONY」**がある。==敗戦時に同じ内容を行うとは公式ページに書かれていないのだ。\n\n## しくみ\n勝利時の**セレモニー**では、球場を暗くして試合のハイライト映像を流し、**ヒーローインタビュー**を行う。\n\n**「MARINESペンライト2026」**は音楽に合わせて点滅する。さらにビジョンの**QRコード**を読み込むと、スマートフォンのライトも音楽に合わせて点滅する案内になっている。\n\n==つまり、最後のアウトで終わりではない。==ロッテが勝った日は、そこから数分間「勝った試合を振り返る時間」が続くのだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**が勝てば**10勝目**だ。山口航輝が決勝打（勝ちを決めた一打）を打つような展開なら、==試合後のヒーローインタビューまで残るとよい。==その日の物語が一続きで見えるというわけだ。"}, "7-07-d": {"meta": {"id": "7-07-d", "title": "今日の「秋の夜空にみんなで叫ぼう！特別招待」って？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-07"], "sources": ["https://m-ticket-rsv.marines.co.jp/2026akinoyozora/"]}, "body": "## ひとことで\n==**「2026 秋の夜空にみんなで叫ぼう！特別招待」**は、試合中に行う特別イベントの名前ではなく、対象試合の観戦チケットを抽選で招待する企画だ。==\n\n## しくみ\n公式の申込ページでは、**マリーンズID1つにつき1試合まで**申し込め、1回の申込は**2枚**。対象席は「内野指定席（フロア4）」で、招待価格は0円と案内されている。\n\n座席の細かな位置は**抽選申込時には指定できない**。==つまり「特別招待」という言葉は、特別な観戦席で何かを叫ぶ催しではなく、通常の試合観戦へ招待する仕組みを指しているのだ。==\n\n## 今日の試合で見るなら\n==今日の**ロッテ対日本ハム**もこの企画の対象だ。==席に着いた後のイベント内容は、ほかの観客と同じ今日のタイムテーブルに沿って進む。**17:45頃**の山口航輝の表彰式や、7回表後のラッキー7もそのまま楽しめるのだ。"}, "7-07": {"meta": {"id": "7-07", "title": "いつのタイミングでどんなイベントがあるの？（9/28）", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-07-a", "7-07-b", "7-07-c", "7-07-d"], "related": ["7-08"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.mlb.com/news/brewers-sausage-race-history", "https://www.history.com/articles/baseball-seventh-inning-stretch-origin"], "episode": "v2"}, "body": "## ひとことで\n==今日は、**16:00**の開場後から試合前のステージや選手紹介が続き、試合中は**イニングの切れ目**ごとに短いイベントが入る。==ロッテが勝った場合は、試合後にも勝利セレモニーがあるのだ。\n\n## しくみ\n==イベントは、基本的にプレーが止まる**「イニング間（攻守交代の時間）」**に組まれている。==だから、打者が打っている最中に突然ショーが始まるわけではない。\n\n**16:20**から外周のボールパークステージが始まり、**17:20頃**からは場内でベンチ入り選手紹介、DJ、観戦ポイント紹介と続く。17:55頃には映像や照明とともにロッテの選手が守備につき、スタメンが紹介され、18:00に試合開始だ。\n\n試合中は2回表後から9回表後まで、バズーカ、ゲーム、乾杯、水分補給、ダンス、レース、ラッキー7などが予定されている。7回表後の「MARINES LUCKY 7」では球団歌「WE LOVE MARINES」に合わせてタオルを掲げる。\n\n## おもしろエピソード\n試合途中のイベントが、球団の名物に育つこともある。1993年6月27日、ミルウォーキー・ブルワーズというメジャーリーグ球団の試合で、6回裏が終わると左翼側の扉から**巨大なソーセージ姿の3人**が飛び出し、ホームベースへ向かって走った。\n\nそれまでは大型ビジョンのアニメだった「ソーセージ・レース」を、初めて人が本当に走ったのだ。しかも選手や審判には事前にほとんど知らされておらず、突然の光景に球場は大騒ぎになった。==一度のイニング間イベントが評判になり、今では球団を代表する恒例行事になっている==。\n\n7回途中に観客が立って体を伸ばす**セブンス・イニング・ストレッチ**にも有名な逸話がある。1910年、観戦中のアメリカ大統領**ウィリアム・タフト**が7回に立ち上がり、周囲もつられて立ったのが始まり、という話だ。\n\nただし、1869年にはすでに「7回に観客が立って体を伸ばす」という手紙が残っている。==有名な大統領の話より前から、その習慣は存在していた==のだ。球場のイベントには、由来が一つに決められないものもある。\n\n## 今日の試合で見るなら\n山口の表彰を見たいなら、17:45より前には席に着いておくとよい。その後17:55頃の選手登場から、そのままアンドレ・ジャクソンの先発する試合へつながる。\n\n試合中は5回表後の乾杯、7回表後のラッキー7が大きな目印だ。ロッテが勝てば、試合後の「MARINES WINNING CEREMONY」でハイライト映像やヒーローインタビューまで続くのだ。"}, "7-08-a": {"meta": {"id": "7-08-a", "title": "夜の海風対策は？（上着・ひざ掛け）", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-08"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/news/detail/00000651.html"]}, "body": "## ひとことで\n==風を止める**上着を1枚**持ち、座って寒くなったら**ひざ掛け**を足すのが簡単だ。==今日は雨の可能性もあるので、「ぬれないこと」も防寒になるのだ。\n\n## しくみ\n**ZOZOマリン**は球団が「**ベイエリア特有の強風**」を名物として紹介してきた屋外球場だ。夜は日差しがなくなり、観戦中は長く座るので、風が続くと体が冷えやすい。\n\n==おすすめは、**薄手の服**の上に**風を通しにくい上着**を重ねること。==暑ければ脱げるし、寒ければ閉じればよい。ひざ掛けは動かない脚を保温する役目だ。\n\n==今日は**NPB公式**の日程表示で**「くもり時々雨」**。==ぬれた服に風が当たるとさらに冷えるので、雨具と着替えやすい重ね着を組み合わせるとよい。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**と**福島蓮**の先発で18:00開始だ。==山口航輝や清宮幸太郎の一発を終盤まで待つ展開でも、寒さで席を立たずに済むよう、上着はバッグの奥ではなく取り出しやすい場所に入れておくとよい。=="}, "7-08-b": {"meta": {"id": "7-08-b", "title": "雨の予報のときは？（傘の扱い）", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "images": "v2", "related": ["7-08"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/news/detail/202600768522.html", "https://www.marines.co.jp/news/detail/202300231437.html"]}, "body": "## ひとことで\n==席では傘をささず、**ポンチョやレインコート**で観戦する。==今日のように雨の可能性がある日は、試合が始まる前に雨具を出しておくと慌てないのだ。\n\n## しくみ\n球団は2023年の観戦ルール変更で、**「傘をさしての観戦」**を原則禁止とした。<!-- TODO: 確認（2026年の現行観戦ルールページに傘の記載が見当たらない。当日も有効か公式で確認） -->その際の説明で、傘は周囲の視界を遮り、**ファウルボール**などによる事故の危険もあるため、雨天時はポンチョや雨合羽を使うよう案内している。\n\n==雨が降ってから狭い席で大きく荷物を広げるより、入場後に雨具の場所を確認しておくとよい。==フード付きなら両手も空き、打球への注意もしやすい。\n\n\n## 今日の試合で見るなら\nNPB公式の日程表示は**「くもり時々雨」**だ。==**ジャクソン**が投げている途中で降り始めても、傘を開かず雨具へ切り替えられるようにしておくと、プレーを見失いにくいのだ。=="}, "7-08-c": {"meta": {"id": "7-08-c", "title": "何時に着くのがいい？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-08"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/stadium/access/"]}, "body": "## ひとことで\n初観戦なら、==**17:00ごろまでに入場**できると落ち着いて準備しやすい==。今日は16:00開場、18:00試合開始なのだ。\n\n## しくみ\n球団公式の今日の予定では、17:20ごろにベンチ入り選手紹介、17:30ごろに観戦案内、17:55ごろにロッテのスタメン紹介がある。席・トイレ・飲み物の場所を先に確認するなら、試合開始ぎりぎりより早い方が動きやすい。\n\n海浜幕張駅から球場までは公式案内で**徒歩約15分**、バスなら約6分だ。==駅に着く時刻ではなく、「球場に着く時刻」で逆算する==と迷いにくいのだ。\n\n## 今日の試合で見るなら\n今日は17:45ごろに**山口航輝**の月間MVP表彰式も予定されている。==表彰式とスタメン紹介まで見たいなら、17:20より前に席へ着いておく==と流れを追いやすい。\n\n野球だけを見たいなら18:00に間に合えばよいが、初めてなら少し余白を作る方が安心なのだ。"}, "7-08": {"meta": {"id": "7-08", "title": "どうすると過ごしやすい？", "category": "7", "level": "1", "priority": "star", "needs_check": true, "styled": true, "children": ["7-08-a", "7-08-b"], "related": ["7-07"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/news/detail/00000651.html", "https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/news/detail/202300231437.html", "https://www.mlb.com/cut4/a-s-mark-canha-has-worn-good-luck-ski-mask-all-week-c272813320"], "episode": "v2"}, "body": "## ひとことで\n今日は**「くもり時々雨」**の**屋外ナイター**だ。==風を通しにくい上着と雨具を用意し、座って冷えてきたらひざ掛けを足す、という二段構えが過ごしやすいのだ。==\n\n## しくみ\n**ZOZOマリン**は球団自身が「**ベイエリア特有の強風**」を名物として紹介してきた球場だ。風があると、同じ気温でも体の表面から熱が逃げやすい。さらに服がぬれると冷えやすくなる。\n\nそこで、厚手の1枚だけに頼るより、薄手の服に風を通しにくい上着を重ねるほうが調整しやすい。座っている時間が長いので、ひざ掛けがあると脚の冷えも減らせる。\n\n==雨対策は傘ではなく、**ポンチョやレインコート**が基本だ。==球団は**2023年**の観戦ルール変更で「傘をさしての観戦」を原則禁止としている。<!-- TODO: 確認（2026年の現行観戦ルールページに傘の記載が見当たらない。当日も有効か公式で確認） -->\n\n## おもしろエピソード\n2018年4月、オークランド・アスレチックスというメジャーリーグ球団の**マーク・カナ**は、寒さ対策で顔まで覆う黒い防寒用マスクを着けて試合に出た。見た目はかなり大げさだったが、その格好で打撃が好調になった。\n\nすると翌日は気温が上がったのに、カナは「縁起がいい」とマスクを外さなかった。その日も本塁打を放ち、==寒さ対策だった服が、そのまま本人のラッキーアイテムになった==のだ。\n\n屋外球場では、選手も観客も天候に合わせて服装を変える。最初から完璧な一枚を選ぶより、暑ければ脱ぎ、冷えたら足せる格好のほうが使いやすいということだ。\n\n## 今日の試合で見るなら\n17:45頃の山口航輝の表彰式から試合終了まで残るなら、屋外にいる時間はかなり長い。アンドレ・ジャクソンの10勝目や清宮幸太郎の通算100号が終盤まで持ち越されても集中できるよう、上着と雨具を先に手元へ出しておくとよい。"}, "7-09-a": {"meta": {"id": "7-09-a", "title": "ファウルボールが飛んできたら？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["7-09"], "sources": ["https://www.marines.co.jp/stadium/rule/fulltext.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==打球が上がったら、まず**最後まで行方を見る**のだ。==ボールを取りに動き回るより、自分と周囲の安全を優先する。\n\n## しくみ\n球団の観戦契約では、練習中の球、本塁打、**ファウルボール**（打った球のうち、決められた範囲の外へ飛んだもの）などについて、観客自身が行方に注意するよう定めている。\n\nさらに、ボールを追いかけるなど、ほかの観客に危険を及ぼす行動は禁止されている。==スマホや飲食物に目を向けていても、打者が構えたら一度グラウンドへ視線を戻すと安全につながるのだ。==\n\n\n## 今日の試合で見るなら\n==**清宮幸太郎**や**山口航輝**の打席で打球が上がったら、ホームランかどうかを判断する前に行方を追おう。==スタンド方向へ来たときほど、ボールを取りに急いで動かないことが大切だ。"}, "7-09-b": {"meta": {"id": "7-09-b", "title": "持ち込めないものは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-09"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/stadium/rule/mintext.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==外で買った飲食物は、球団が認める一部を除いて持ち込めない。==危険物や**ビン・缶**、大型のクーラーボックスやスーツケースなどにも制限があるのだ。\n\n## しくみ\n飲み物で認められている主な例は、**750ml以下**のアルコールを除くペットボトル、水筒、紙パックだ。==球場外周で販売された飲食物、乳幼児用の食事、中学生以下向けの適量のお菓子なども例外として案内されている。==\n\n一方、**クーラーボックスやスーツケース**などの大型荷物は持ち込めない。入場時には**手荷物検査**があるので、迷う物があるなら入場前に公式ルールを確認するのが確実だ。\n\n## 今日の試合で見るなら\n==**18:00**の試合開始直前に入口で荷物を整理することになると、**アンドレ・ジャクソン**の立ち上がりを見逃しかねない。==Cゲートへ向かう前に、飲み物や大きな荷物だけでも確認しておくといいのだ。"}, "7-09-c": {"meta": {"id": "7-09-c", "title": "再入場はできる？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-09"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==**再入場**はできる。==ただし、退場するときに手の甲へ**専用スタンプ**を押してもらい、戻るときにチケットとスタンプの両方を確認してもらう必要があるのだ。\n\n## しくみ\n球場の外へ出たいときは、出口で再入場のための手続きをする。球団公式では、==退場時に手の甲へ専用スタンプを押し、再入場時に**チケットとスタンプ**の印を確認すると案内している。==\n\nつまり、いったん出るならチケットを持ったままにし、退場するときは必ずスタンプを押してもらうことだ。戻る予定があることを出口で意識しておけば迷いにくい。\n\n## 今日の試合で見るなら\n今日は**16:00開場、18:00試合開始**だ。==入場後に外へ出るならこの手続きを使い、**福島蓮**がロッテ打線に投げる1回裏（ロッテの最初の攻撃）までに戻りたい場合は、再入場の確認時間も見込んで動くといいのだ。=="}, "7-09": {"meta": {"id": "7-09", "title": "観戦時の注意点は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "images": "v2", "children": ["7-09-a", "7-09-b", "7-09-c"], "related": ["7-10", "7-11"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/stadium/rule/fulltext.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/cut4/fan-catches-consecutive-foul-balls/c-280704068"], "episode": "v2"}, "body": "## ひとことで\n==大事なのは、**打球から目を切らないこと**、持ち込みルールを守ること、再入場の手順を知っておくことだ。==どれも球場で安心して過ごすための基本なのだ。\n\n## しくみ\nまず注意したいのが**ファウルボール**（打った球のうち、決められた範囲の外へ飛んだもの）だ。球団の観戦契約では、練習中や試合中の打球の行方に気を配り、けがを避けるため十分に注意するよう定めている。==ボールを追って、ほかの観客に危険が及ぶ行動をすることも禁止されている。==\n\n\n持ち込みにも決まりがある。**ZOZOマリンスタジアム**では、衛生管理やトラブル防止のため、飲食物は一部の例外を除いて持ち込めない。認められているものには、**750ml以下**のアルコールを除くペットボトル、水筒、紙パックなどがある。\n\n大きな荷物にも注意が必要だ。**クーラーボックス、スーツケース**などの大型荷物は持ち込めず、外周のコインロッカー利用が案内されている。入場時には**手荷物検査**があり、拒否すると入場できない場合があるのだ。\n\nいったん外へ出る場合も、そのまま戻れるわけではない。退場時に手の甲へ**専用スタンプ**を押してもらい、再入場時にチケットとスタンプを確認してもらう仕組みだ。==戻る予定があるなら、退場時のスタンプを忘れないことが大切なのだ。==\n\n## おもしろエピソード\n2018年6月、オークランド・アスレチックスの試合を観ていた**ビルという男性**の席へ、打者**チャド・ピンダー**のファウルボールが飛んできた。ビルはそれを素手でつかんだ。本人にとって、生まれて初めて球場でつかんだファウルボールだった。\n\nところが約22秒後、同じ打者の次のファウルが、==またほとんど同じ場所へ飛んできた==。一つ目をしまい終えたばかりのビルは、今度もその球をつかんだ。\n\n広い球場でも、同じ席へ続けて打球が来ることはある。だからファウルになった直後も、==次の投球が始まったらもう一度ボールを見る==のが安全なのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝の打席では、打球が上がったら最後まで行方を追うといい。アンドレ・ジャクソンや福島蓮の立ち上がりを見逃したくないなら、入場前に荷物を整理し、再入場する予定があるなら手順も先に覚えておくと迷いにくいのだ。"}, "7-10-a": {"meta": {"id": "7-10-a", "title": "混むタイミングはいつ？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-10"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==「何回のあとが最も混む」といった具体的な**混雑時間**は、確認した球団公式情報には明記されていない。==だから、経験則で空いている時間を断定しないのだ。\n\n<!-- TODO: 球団公式でトイレの具体的な混雑タイミングの明示を確認 -->\n\n## しくみ\n公式球場MAPでは**トイレ**などの施設位置を確認できる。また、フロア4の**インフォメーション**は、試合日に開場から7回裏終了まで案内を行っている。\n\n==混雑の山が公式に示されていない以上、「この回なら空いている」と決め打ちするのは避けたい。==先に場所を把握し、必要になったときに迷わず動けるようにしておくほうが確実だ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**山口航輝**の打席を見たいなら、特定の回が空くとは決めつけないほうがいい。==**16:00の開場後**、試合開始までにフロア4のトイレ位置だけ先に確認しておくといいのだ。=="}, "7-10-b": {"meta": {"id": "7-10-b", "title": "内野指定席Bに近いトイレは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-10"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n今日の**内野指定席B**はフロア4の席種だ。==席に着いたら、公式球場MAPでフロア4のトイレを一つ先に確認しておく==のが確実なのだ。\n\n## しくみ\n球団公式の価格表では、内野指定席Bは**フロア4**に分類されている。公式球場MAPにもフロア4の男女トイレが表示されているので、まず自分が出入りする通路と近い表示を見ればいい。\n\nただし「内野指定席B」だけでは座る位置に幅があり、最寄りを一か所に決められない。==座席の列や番号を使わずに案内するなら、現地の通路表示と球場MAPで選ぶのが正確==なのだ。\n\n迷った場合、球団公式では**フロア4の408通路付近**にインフォメーションブースがあり、開場から7回裏終了まで案内している。\n\n## 今日の試合で見るなら\n18:00に**アンドレ・ジャクソン**が投げ始める前に、席から最寄りのトイレと戻る通路を一度だけ確認しておこう。==「行くときに探す」のではなく「最初に場所だけ覚える」==と、試合中に席を立つ時間を短くしやすいのだ。"}, "7-10-c": {"meta": {"id": "7-10-c", "title": "試合中にトイレに行くならいつがいい？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-10"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nロッテの攻撃をなるべく見たいなら、**表（ビジターが攻撃する半分）**の途中が候補だ。==今日は回と回の間にイベントが多いので、「○回表が終わった瞬間」は避けると見逃しを減らせる==のだ。\n\n## しくみ\n野球の**イニング（攻守1組の区切り）**は、表にビジター、裏にホームが攻撃する。今日は日本ハムが先攻、ロッテが後攻なので、表は日本ハム、裏はロッテの攻撃だ。\n\n球団公式の進行予定では、2〜9回の表終了後に演出が入る回が多い。5回表後には「スマドリ乾杯タイム」、7回表後には「MARINES LUCKY 7」が予定されている。==イベントも見たいなら、回が終わる前に席を立つより、表の途中で用を済ませて戻る方が組み立てやすい==のだ。\n\n## 今日の試合で見るなら\n表では**アンドレ・ジャクソン**が日本ハム打線に投げる。==ロッテの打席を優先するなら、ジャクソンが投げている表の途中を候補にし、裏が始まる前に戻る==と分かりやすい。\n\nただし、我慢する必要はない。行きたくなったときは試合展開より体を優先するのだ。"}, "7-10": {"meta": {"id": "7-10", "title": "トイレにすぐ行くには？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-10-a"], "related": ["7-09", "7-11"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/news/coliseum-quirk-puts-rays-closer-in-lockdown/c-59151054"], "episode": "v2"}, "body": "## ひとことで\n==いちばん確実なのは、試合が始まる前に**フロア4の公式球場MAP**でトイレの位置を確認しておくことだ。==今日の具体的な座席から「ここが最短」とまでは、公式情報だけでは決められないのだ。\n\n## しくみ\n**ZOZOマリンスタジアム**の公式球場MAPには、フロアごとの施設が掲載されている。あなたの席は**1塁側の内野指定席B、フロア4**なので、まずフロア4の表示だけを見ると探す範囲を狭くできる。\n\n==席に着いたら、最寄りのトイレを一度MAPで確認しておくといい。==試合中に初めて探すより、「席を出る方向」と「戻る方向」を先に覚えておくほうが迷いにくいというわけだ。\n\n場所が分からなくなった場合は、球団公式がフロア4にも**インフォメーション**を設けている。試合日は**開場から7回裏終了まで**案内しているので、場内施設について確認できるのだ。\n\nただし、公式サイトでは各トイレまでの所要時間を座席別には示していない。列や座席番号を前提にした近道はここでは決めず、その場の案内表示と公式MAPを使うのが確実だ。\n\n## おもしろエピソード\n2013年8月30日、タンパベイ・レイズというメジャーリーグ球団の**フェルナンド・ロドニー**は、試合終盤にベンチ裏のトイレへ入った。ロドニーは、リードしている試合の最後を任されることが多い「抑え投手」だった。\n\nところがドアが故障し、==中から出られなくなった==。8回に味方が反撃している間も、ロドニーは歓声を聞くだけ。約15分後、球場スタッフたちがドアノブを壊して、ようやく救出した。\n\nレイズの**ジョー・マドン監督**は、閉じ込められている間に打線が点を取ったので、「そのまま中にいてもらえばよかった」と冗談を言った。結局レイズは試合に敗れ、ロドニーが登板する場面は来なかったのだ。\n\n## 今日の試合で見るなら\n今日は18:00開始なので、アンドレ・ジャクソンと福島蓮が投げ始める前に位置を確認しておくといい。清宮幸太郎や山口航輝の打席で急に席を立つことにならないよう、入場後の待ち時間を下見に使うと動きやすいのだ。"}, "7-11-a": {"meta": {"id": "7-11-a", "title": "Cゲート（コアラゲート）からの行き方は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["7-11"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/ticket/season2026/owner.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==**Cゲート**（公式名称は「C コアラのマーチ ゲート」）から入場したら、場内表示で**フロア4**を目指す。==2026年の公式価格表では、内野指定席Bはフロア4の席種として載っているのだ。\n\n## しくみ\nまずCゲートで入場し、場内の**「フロア4」**の案内を追う。フロア4へ着いたら、球場MAPと場内の席案内を見て、自分のチケットに合う方向へ進めばいい。\n\n==公式の公開情報だけでは、今日の座席まで使う階段や経路を一つに特定できない。==だから「この階段が最短」とは決めず、現地表示に従うのが確実なのだ。\n\n\n## 今日の試合で見るなら\n**18:00**になると、まず**アンドレ・ジャクソン**が日本ハム打線に投げ、1回裏には福島蓮がロッテ打線に投げる。==最初から見たいなら、開場後に一度フロア4まで上がり、席への流れを確認しておくといいのだ。=="}, "7-11-b": {"meta": {"id": "7-11-b", "title": "ブルペンやベンチは見える？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "images": "v2", "related": ["7-11"], "sources": ["https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n==今日の**1塁側・内野指定席B**から、**ブルペン**（登板前の投手が投球練習する場所）やベンチ（試合中の選手が待機する場所）がどの程度見えるかは、現在の球団公式情報だけでは断定できないのだ。==\n\n<!-- TODO: 2026シーズンの1塁側・内野指定席Bからブルペン・ベンチへの実際の視界を球団公式で確認 -->\n\n## しくみ\n2026年の公式価格表で確認できるのは、**内野指定席Bがフロア4**の席種だというところまでだ。==公式の席種案内には全体を見渡せる席という説明があるが、そのページは2025シーズン情報と明記されている。==\n\n球場MAPには施設配置が載っていても、座席ごとの視線や**死角**までは示されていない。したがって、ブルペンやベンチが「よく見える」とは書かず、席に着いて実際の視界を確認するのが確実だ。\n\n\n## 今日の試合で見るなら\n==**益田直也**が登板する展開になっても、準備中の姿を席から見られるとは断定しない。==マウンドへ出てきた場面から注目すれば、登板そのものは試合の流れとして追えるのだ。"}, "7-11-c": {"meta": {"id": "7-11-c", "title": "1塁側から見やすいプレーは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-11"], "sources": ["https://www.marines.co.jp/ticket/seat/genelal/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式は**内野指定席B**を、フロア4から「球場とプレーの全体を見渡せる」席として案内している。==まずは、内野全体が動くゴロのプレーを追うと分かりやすい==のだ。\n\n## しくみ\n**ゴロ（地面を転がる打球）**では、打った人が一塁へ走り、内野手が捕って一塁へ送る場面が多い。1塁側なら、==「打球が転がる→野手が捕る→一塁へ送る」という流れを一続きのプレーとして意識する==と野球の動きが見えてくる。\n\n内野指定席Bについて、公式が説明しているのはフロア4から全体を見渡せることまでだ。席ごとの細かな角度や距離は公開情報だけでは決められないので、==「このプレーが必ず一番近い」とは断定しない==のだ。\n\n## 今日の試合で見るなら\n**福島蓮**がロッテ打線に投げるとき、内野ゴロが出たら一塁まで視線を動かしてみよう。**アンドレ・ジャクソン**の投球でも同じだ。\n\n==アウトになるか、打者が先に一塁を踏むかまで見る==と、ひとつのゴロが最後までつながって見えるのだ。"}, "7-11": {"meta": {"id": "7-11", "title": "今日の席（1塁側・内野指定席B）から何が見える？", "category": "7", "level": "1", "priority": "star", "needs_check": true, "styled": true, "images": "v2", "children": ["7-11-a", "7-11-b"], "related": ["7-09", "7-10"], "sources": ["https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/news/fan-catches-two-home-run-balls-in-one-inning-fenway-park"], "episode": "v2"}, "body": "## ひとことで\n今日の**1塁側・内野指定席B**は、2026年の公式価格表で**フロア4**の席種と確認できる。==球団の席種案内では「球場とプレーの全体を見渡せる」席と紹介されている。==ただし、その案内本文は2025シーズン表記なので、今日の細かな死角までは断定しないのだ。\n\n<!-- TODO: 2026シーズンの1塁側・内野指定席Bからの実景と死角を球団公式で確認 -->\n\n## しくみ\nフロア4は、グラウンドに近い席で選手の表情だけを見るというより、投手、打者、**走者**（塁に出ている攻撃側の選手）、守備の動きをまとめて追う見方と相性がいい。==野球は一球ごとに複数の選手が動くので、全体を見ると「なぜ次のプレーが起きたか」が分かりやすくなるのだ。==\n\nたとえば、投手が投げる前に走者がどこにいるか、**内野手**がどこを守っているかを見ておく。そのあと打球が飛ぶと、守備側がどこへ動き、走者がどの塁を狙ったかまで一続きで追いやすい。\n\n\nただし、座席から**ベンチやブルペン**がどの程度見えるか、手すりなどでどこが隠れるかは、現在公開されている公式情報だけでは確認できない。そこは「見えるはず」と決めつけず、実際に席へ着いてから確かめる範囲なのだ。\n\n## おもしろエピソード\n2022年5月、ボストン・レッドソックスの本拠地**フェンウェイ・パーク**で、外野席の一人の観客がとんでもない幸運に出会った。ヒューストン・アストロズの**ジェレミー・ペーニャ**が本塁打を打つと、そのボールを観客席でキャッチしたのだ。\n\n驚くのはそのあとだ。同じイニングに**ユリ・グリエル**も本塁打を放ち、==二つ目の本塁打球まで同じ観客のところへ飛んできた==。一晩で二つのホームランボールを手にすることになった。\n\n席は「試合を見る場所」だが、ときには打球が届くプレーの一部にもなる。今日の内野席でも、打球がこちらへ飛んできたら、周囲とボールの両方を見ることが大切なのだ。\n\n## 今日の試合で見るなら\nアンドレ・ジャクソン対清宮幸太郎、福島蓮対山口航輝というように、まず投手と打者を見る。打球が出たら視線を少し広げ、守る選手と走者まで追うと、フロア4から試合全体を見る面白さが分かりやすいのだ。"}, "7-12-a": {"meta": {"id": "7-12-a", "title": "海浜幕張駅までどれくらい？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-12", "7-13"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式の目安では、**海浜幕張駅からZOZOマリンまで徒歩約15分**だ。==帰りも同じ区間なので、駅まで歩く時間の基準は約15分と考えればよい。==\n\n## しくみ\n公式の徒歩ルートは、海浜幕張駅の**南口**からプレナ幕張方面へ進み、歩道橋を使って球場へ向かう道だ。信号待ちを減らせる歩道橋も案内されている。\n\nただし、==「約15分」は歩行そのものの目安で、試合後の人の流れや駅での待ち時間までは含まれない==。終了直後は時間に余裕を持つ方が安全なのだ。\n\n## 今日の試合で見るなら\n今日の試合は**18:00開始**だ。==清宮幸太郎や山口航輝の終盤の打席まで見たうえで帰るなら、「試合終了＋徒歩約15分」を最低限の移動目安にする==とよい。\n\n駅に着いてから電車に乗るまでの時間は、その場の混雑で変わるのだ。"}, "7-12-b": {"meta": {"id": "7-12-b", "title": "バスやタクシーは使える？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-12", "7-13"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**バスは使える**。2026年の球団公式案内では、海浜幕張駅・幕張本郷駅とZOZOマリンを結ぶシャトルバスが案内されている。==タクシーは、球団公式で試合後の乗り場や運用を確認できないため、ここでは使えると断定しない。==\n<!-- TODO: 9/28試合後のタクシー乗り場・配車可否を球団またはスタジアム公式で確認 -->\n\n## しくみ\n今日9月28日は、球団公式タイムテーブルで**16:00から海浜幕張駅発の直通バス**が運行開始となっている。通常の公式アクセスでは、海浜幕張駅から球場までバス約6分の案内だ。\n\n試合後は海浜幕張駅行きと幕張本郷駅行きのシャトルバスがある。==2026年は、試合終了が21:35までなら終了45分後、21:35以降なら22:20が乗車受付終了時刻==と案内されている。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**と**福島蓮**の投げ合いを最後まで見ても、試合後バスという選択肢はある。==帰る直前に場内ビジョンで乗車受付終了時刻を確認する==のが確実だ。"}, "7-12": {"meta": {"id": "7-12", "title": "帰りの混雑を避けるには？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "children": [], "related": ["7-09", "7-10"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://npb.jp/games/2026/schedule_09_detail.html", "https://www.mlb.com/news/twenty-five-years-later-kirk-gibsons-dramatic-homer-still-resonates/c-62953016"], "episode": "v2"}, "body": "## ひとことで\n==帰り道は**海浜幕張駅**だけではない。==球団公式が案内している徒歩・シャトルバスの複数ルートを先に知っておくと、試合後に一つの列だけへ集中せず動けるのだ。\n\n## しくみ\n公式アクセスでは、JR京葉線の**海浜幕張駅は徒歩約15分**。**幕張豊砂駅は徒歩約30分**で、こちらへ行くバス運行はない。\n\nバスは海浜幕張駅行きに加え、**幕張本郷駅行き**もある。幕張本郷駅行きは海浜幕張駅を経由しない。試合後にはJR津田沼駅行きやJR稲毛駅行きの案内もあるが、台数には限りがある。\n\n==海浜幕張駅・幕張本郷駅行きのシャトルバスは、試合終了が21時35分までなら試合終了45分後が乗車受付終了。==**21時35分以降**に終わった場合は**22時20分**が受付終了だ。\n\n球団公式は「どの経路が必ず空いている」とは案内していない。だから混雑の少ない道を断定せず、徒歩と複数のバス行き先を候補として持つのが安全だ。\n\n![JR京葉線・海浜幕張駅の改札口](https://upload.wikimedia.org/wikipedia/commons/9/95/JR_Keiyo-Line_Kaihimmakuhari_Station_Gates.jpg \"出典：Wikimedia Commons／Mister0124／CC BY-SA 4.0\")\n\n## おもしろエピソード\n1988年のワールドシリーズ（メジャーリーグの年間王者を決めるシリーズ）第1戦。ロサンゼルス・ドジャースの**カーク・ギブソン**は両脚を痛めていて、先発出場できない状態だった。\n\n9回裏、2点を追う場面で代打として登場すると、足を引きずりながら打席に立ち、逆転サヨナラ本塁打を放った。映像には、==試合が終わる前に球場を出た車の赤いテールランプが、外野の向こうに列を作る様子==まで映っている。\n\n早めに帰った観客の中には、車のラジオでその本塁打を知った人もいたとMLBは振り返っている。混雑を避けるために早く出るか、最後まで見るか。その選択が語り草になるほど大きな一打が、最後の最後に出ることもあるのだ。\n\n## 今日の試合で見るなら\n今日の試合は18時開始だ。清宮幸太郎の通算100号候補や山口航輝の一発を最後まで見たいなら、途中で帰る前提にしなくてもよい。試合終了後にビジョンへ出るシャトルバスの乗車受付終了時刻を確認し、自分が使える駅をその場で選ぶと動きやすい。"}, "7-13-a": {"meta": {"id": "7-13-a", "title": "海浜幕張駅から歩いて何分？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-13", "7-12-a"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式では、**海浜幕張駅からZOZOマリンまで徒歩約15分**だ。==初めて行くなら「駅を出て15分」が移動時間の基準になる。==\n\n## しくみ\n海浜幕張駅では**南口**を出て、プレナ幕張方面へ進む。公式の徒歩ルートは歩道橋を使い、球場方向へ向かう道だ。\n\n==約15分は駅から球場まで歩く時間の目安で、入場にかかる時間は別==だ。試合開始直前に駅へ着く計画なら、15分だけでは足りない場合があると考えておくとよい。\n\n## 今日の試合で見るなら\n今日は**18:00試合開始**だ。==アンドレ・ジャクソンと福島蓮の最初の投球から見たいなら、徒歩約15分に入場までの時間も足して逆算する==のだ。\n\n16:00には開場しているので、早めに着けば試合前の球場内も見られる。"}, "7-13-b": {"meta": {"id": "7-13-b", "title": "何時ごろ混む？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-13", "7-08"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式では、今日の**時間帯ごとの混雑ピーク**までは公表されていない。==「17時半が一番混む」など、特定の時刻を混雑のピークとは断定できないのだ。==\n<!-- TODO: 9/28の時間帯別の駅・徒歩ルート・入場口の混雑状況を球団またはスタジアム公式で確認 -->\n\n## しくみ\n今日わかっている時刻は、**15:00**に外周ケータリングカーなどが営業開始、16:00に開場し、海浜幕張駅発の直通バスも運行開始、18:00に試合開始という流れだ。\n\nまた、2026年の球団公式案内は、バスには台数の限りがあり、**多客時は乗れない場合がある**としている。==混雑の正確なピークではなく、この公式タイムラインを基準に予定を組む==のが安全だ。\n\n## 今日の試合で見るなら\n18:00から**アンドレ・ジャクソン**と**福島蓮**の先発で始まる予定だ。==最初の1球から見たいなら、海浜幕張駅からの徒歩約15分に、入場までの時間を上乗せして考える==とよい。"}, "7-13": {"meta": {"id": "7-13", "title": "球場への行き方は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-13-a", "7-13-b"], "related": ["7-12", "7-08"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n電車で来るなら、まず**JR京葉線・海浜幕張駅**を目印にすると分かりやすい。==駅の南口からZOZOマリンまでは、球団公式で徒歩約15分だ。==\n\n## しくみ\n海浜幕張駅では南口を出て、プレナ幕張方面へ進む。球団公式の徒歩ルートは、歩道橋を使って球場へ向かう道を案内している。信号を避けられる歩道橋もあるので、==初めてなら公式ルートの案内表示を追うのが基本==なのだ。\n\n歩かずに向かう方法もある。海浜幕張駅から球場までは、公式案内で**バス約6分**。今日9月28日は、球団公式タイムテーブルで16:00から海浜幕張駅発の直通バス運行開始となっている。\n\n別の入口として、JR総武線・京成線の**幕張本郷駅**からバス約21分という案内もある。==「海浜幕張から徒歩」だけが唯一の行き方ではない==というわけだ。\n\nなお、バスは乗れる人数に限りがあり、球団公式も多客時は乗れない場合があると案内している。時間が読みにくいときは、==徒歩約15分という基準を持っておくと計画を立てやすい==。\n\n## 今日の試合で見るなら\n今日は**16:00開場、18:00試合開始**だ。18時になると、ロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**が先発する予定だ。\n\n==最初の1球から見たいなら、駅からの移動時間に入場までの時間も足して考える==とよい。公式は「何時が必ず空いている」とは案内していないので、特定の時刻なら混まないとは決めつけないのだ。"}, "7-14-a": {"meta": {"id": "7-14-a", "title": "初めてなら何を買う？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-14", "6-01"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://shop.marines.co.jp/shop/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n初観戦なら、まずは**選手フェイスタオル**のような小さめの応援グッズが使いやすい。==高い物から買う必要はない==のだ。\n\n## しくみ\n今日の公式ページでは、**2026年選手フェイスタオル HOMEが1,700円**、レプリカキャップが3,500円、レプリカユニホーム HOMEが12,000円と案内されている。\n\nタオルなら手に持って応援でき、試合後も持ち帰りやすい。ユニホームは「この先も着たい」と思ってから選んでも遅くない。==最初は「今日使えるか」で決めると失敗しにくい==のだ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は33号なら本塁打数で単独2位になる。誰のグッズにするか迷ったら、==今日の記録がかかった選手を一人選ぶ==と、打席を見る理由も増えるのだ。"}, "7-14-b": {"meta": {"id": "7-14-b", "title": "ユニフォームを着ていく人が多いのはなぜ？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-14", "6-01"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://shop.marines.co.jp/shop/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nユニフォームは、**どのチームや選手を応援しているか**を見た目で示しやすい。==着ることは必須ではなく、普段着のままでも観戦できる==のだ。\n\n## しくみ\n球団公式は今日のグッズとして**レプリカユニホーム HOME**を案内している。背番号や選手名のある物なら、「この選手を見ている」という目印にもなる。\n\n同じ服を着ると、応援の動きを合わせやすく、写真にも観戦日の雰囲気が残る。ただし、ルールを覚えてから着る物ではない。==応援の参加証のように使える服、と考えるとわかりやすい==のだ。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**は勝てば10勝目だ。ユニフォームを着ていてもいなくても、==選手名が呼ばれたときに拍手するだけで十分に応援になる==のだ。"}, "7-14": {"meta": {"id": "7-14", "title": "グッズはどこで買える？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-14-a", "7-14-b"], "related": ["6-01", "7-13"], "sources": ["https://shop.marines.co.jp/shop/", "https://shop.marines.co.jp/shop/detail?real_shop_id=1", "https://shop.marines.co.jp/shop/detail?real_shop_id=5", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンスタジアムでは、球場周辺と場内の**マリーンズストア**でグッズを買える。==今日なら、入場前に球場外の店を見る方法がわかりやすい==のだ。\n\n## しくみ\n公式ストア一覧には、球場の**ミュージアム店、スタジアム店、サードベースサイド店、メインエントランス店**などが載っている。店によって場所と営業時間が違うため、同じ「球場のグッズ店」でも使うタイミングが違うのだ。\n\n今日9月28日は、球場外にある**ミュージアム店が13:00から試合終了30分後まで**営業し、最大22:00までとなっている。**メインエントランス店は14:00〜19:00**だ。==16:00の開場前に買いたいなら、この2店を先に見る手がある==。\n\n今日の球団公式イベントページでは、**レプリカユニホーム HOME 12,000円、レプリカキャップ3,500円、選手フェイスタオル1,700円**が紹介されている。初観戦で全部そろえる必要はなく、使い方が想像できる物から選べばよいのだ。\n\n## おもしろエピソード\nミュージアム店は、球団公式が「スタジアム外にある大型グッズショップ」と案内している店だ。ユニホームだけでなく、観戦グッズ、お土産、選手グッズまで扱う。==試合を見る前に「誰を応援するか」を決める場所にもなる==というわけだ。\n\n## 今日の試合で見るなら\n今日のロッテでは、**山口航輝**が32本塁打でリーグ2位タイ、**アンドレ・ジャクソン**は10勝目がかかっている。選手名入りのタオルなどを選ぶなら、==「今日気になる選手」を一人決めてから店を見る==と、初心者でも選びやすいのだ。"}, "7-15-a": {"meta": {"id": "7-15-a", "title": "ビールの売り子さんって？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-15"], "sources": ["https://www.marines.co.jp/gourmet/uriko/", "https://www.marines.co.jp/news/detail/202600781576.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**売り子**は、客席エリアを回りながらビールやソフトドリンクなどを販売するスタッフだ。==売店まで行かずに飲み物を買える仕組み==なのだ。\n\n## しくみ\n球団公式の売り子ページには、ビール、ハイボール、チューハイ、日本酒、**ソフトドリンク**まで載っている。2026年は売り子から購入するときの決済方法も拡大された。\n\n売り子へのカメラやスマートフォンでの撮影は禁止されている。==飲み物を買う相手であって、撮影対象ではない==というルールなのだ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**の100号候補や**山口航輝**の一発を見たいなら、打席の直前はグラウンドに集中したい。==買うなら攻守交代など、プレーが切れた時間を使う==と見逃しにくいのだ。"}, "7-15-b": {"meta": {"id": "7-15-b", "title": "席で飲み食いしていい？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-15", "7-06"], "sources": ["https://www.marines.co.jp/gourmet/uriko/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/rule/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式は、場内で買った飲食物を**球場内で食べる**よう案内している。座席によっては「飲食を楽しみながら観戦」と明記されているが、==今日の内野指定席Bそのものについては同じ明記を確認できていない==のだ。\n\n## しくみ\n公式の一般シート案内では、内野指定席Bの1段上にある**パノラマカウンター・シート**は、飲食しながら観戦できると明記されている。売り子ページにも、場内で買った飲食物は球場内で早めに食べるよう案内がある。\n\nただし、内野指定席Bの説明には「座席で飲食可」という文言までは見つからない。<!-- TODO: 確認 --> ==今日の席での扱いを断定せず、現地クルーの案内を優先する==のだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**の10勝目がかかる試合だ。==飲食するときも、打球が飛んでくる間はグラウンドから目を切らない==ことを優先するとよいのだ。"}, "7-15": {"meta": {"id": "7-15", "title": "飲み物やお酒は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-15-a", "7-15-b"], "related": ["7-06", "7-09"], "sources": ["https://www.marines.co.jp/gourmet/uriko/", "https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンでは、場内の売店と**売り子（客席を回って飲み物を売るスタッフ）**から飲み物を買える。==アルコールだけでなく、ソフトドリンクもある==のだ。\n\n## しくみ\n球団公式の売り子ページでは、ビールは主に**900円**、ハイボールは800円、チューハイ類は750円、コカ・コーラなどのソフトドリンクは350円と案内されている。商品は日によって入荷がなかったり、売り切れたりする場合がある。\n\n今日9月28日の公式イベントページには、売店メニューとして**マリーンズビール950円**も掲載されている。これは売り子ページの一般的なビール価格とは別の商品なので、==「ビールは全部同じ値段」ではない==と考えるとよいのだ。\n\n持ち込みは自由ではない。2026年改定の球場ルールでは、アルコールの持ち込みは認められていない。一方、**750ml以下のアルコールを除くペットボトル、水筒、紙パック**などは持ち込み可能だ。==飲み物を持参するなら、容器と中身の両方を確認する==のだ。\n\n20歳未満の飲酒と飲酒運転は法律で禁止されている。球団公式も売り子ページで明記しているので、年齢や帰りの運転予定に合わせて選ぶ必要がある。\n\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**には通算100本塁打、ロッテの**山口航輝**には33号本塁打がかかっている。==気になる打者の打席が近いなら、飲み物はその前に用意しておく==と、大事な一球を見逃しにくいのだ。"}, "7-16-a": {"meta": {"id": "7-16-a", "title": "雨で中止になったらチケットは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-16"], "sources": ["https://m-ticket-rsv.marines.co.jp/2026akinoyozora/", "https://www.marines.co.jp/ticket/refund/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日の**「2026 秋の夜空にみんなで叫ぼう！特別招待」**は、公式ページに中止時の払い戻し案内がある。==試合が中止・不成立になったら、まず球団公式の払い戻し案内を確認する==のだ。\n\n## しくみ\n特別招待ページでは、天候などで試合が中止・不成立になった場合、**払戻期間内に購入店舗で払い戻し**と案内している。一般の公式案内では、期間は==中止試合日の翌日から2週間==だ。\n\nただし、実際の手続きは購入方法や発券方法で違う。Mチケットオンラインのクレジットカード・PayPay決済でQR発券なら、利用者の手続きなしで返金処理される例もある。==自分の受取方法に合う欄を見る==のだ。\n\n## 今日の試合で見るなら\n今日は18:00開始で、NPB公式表示はくもり時々雨だ。**福島蓮**と**アンドレ・ジャクソン**の投げ合いを待つ間も、==中止の発表が出たら自己判断ではなく公式案内を確認する==とよいのだ。"}, "7-16-b": {"meta": {"id": "7-16-b", "title": "屋根のある場所は？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-16", "7-11"], "sources": ["https://www.marines.co.jp/ticket/seat/special/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/rule/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n公式に**屋根付き**と明記されている観戦席はある。たとえば3塁側フロア4のシーニック・ボックスとシーガル・ボックスだ。ただし、==今日の内野指定席Bが屋根で覆われるかは公式説明で確認できていない==のだ。\n\n## しくみ\nシーニック・ボックスは、球団公式が**フロア4・3塁側の屋根付きエリア**と案内している。シーガル・ボックスも「屋根のあるエリアで、雨天時にも安心して観戦可能」と明記されている。\n\n一方、今日の**内野指定席B**はフロア4のバックネット裏エリアだが、公式の座席説明には屋根の記載がない。<!-- TODO: 確認 --> 共用の雨よけ場所として誰でも使える屋根付きエリアも、公式テキストでは確認できていない。\n\n指定された座席以外で観戦することはスタジアムルールで禁止されている。==屋根付きの別席へ勝手に移って観戦しない==のだ。\n\n## 今日の試合で見るなら\n**山口航輝**や**清宮幸太郎**の打席を待つ間に雨が強まる可能性もある。==屋根を当てにせず、今日の席では雨に対応できる服装を基本にする==とよいのだ。"}, "7-16": {"meta": {"id": "7-16", "title": "雨や寒さで困ったら？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["7-16-a", "7-16-b"], "related": ["7-08", "7-09"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://www.marines.co.jp/ticket/refund/", "https://m-ticket-rsv.marines.co.jp/2026akinoyozora/", "https://www.marines.co.jp/ticket/seat/special/"]}, "body": "## ひとことで\nZOZOマリンは屋外球場なので、雨と夜の冷え込みは自分で調整する場面がある。==雨にぬれにくい上着と、重ね着できる防寒着を用意しておく==と対応しやすいのだ。\n\n## しくみ\n今日9月28日のNPB公式日程ページは、ZOZOマリンの天気を**くもり時々雨**と表示している。試合は18:00開始なので、日が落ちてからも観戦が続く。雨で服がぬれると体感温度も下がりやすいため、雨対策と寒さ対策を別々に考えるより、一緒に準備したほうがよいのだ。\n\n困ったときは**インフォメーションブース**を使える。球団公式では、フロア4の408通路付近のブースが開場から7回裏終了まで、フロア2のC・Dゲート間は開場から試合終了30分後まで営業すると案内している。==今日の席もフロア4なので、場所だけ先に覚えておくとよい==。\n\n雨で試合自体が中止になった場合は、チケットの扱いが変わる。今日の特別招待ページにも中止時の払い戻し案内があり、一般の払戻受付期間は**中止試合日の翌日から2週間**だ。手続きは購入・発券方法によって違う。\n\n屋根付きと公式に明記された観戦席もあるが、誰でも移動して観戦できるわけではない。スタジアムルールでは、自分の観戦エリアや指定席以外での観戦は禁止されている。==「雨だから空いている屋根席へ移る」はしない==のだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**は勝てば10勝目、**清宮幸太郎**は通算100本塁打まであと1本だ。==雨が強くなったら、無理に席に残るより体調と安全を優先する==。戻ったときにまた試合を追えばよいのだ。"}, "8-01-a": {"meta": {"id": "8-01-a", "title": "テレビや配信で観るには？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "related": ["8-01"], "sources": ["https://www.marines.co.jp/news/broadcast/202609/index.html", "https://pacificleague.com/ptv"]}, "body": "## ひとことで\n==いちばん確実なのは、試合ごとに球団公式の**「放映スケジュール」**を見ることだ。==テレビとネット配信は、同じカードでも日によって変わる。\n\n## しくみ\n千葉ロッテ公式サイトには、**テレビ、BS・CS、ネット、ラジオ**の放映予定が試合ごとに載る。ネットではDAZN、ベースボールLIVE、**Rakuten パ・リーグ Special**などが使われる試合がある。\n\n**パーソル パ・リーグTV**は、パ・リーグ球団主催の一軍公式戦などを配信する公式サービスだ。==スマホやPCだけでなく、対応テレビでも見られる。==\n\n\n## 今日の試合で見るなら\n**9月28日のロッテ対日本ハム**は、球団公式の放映予定では、**BS12 トゥエルビが17時30分から**だ。Rakuten パ・リーグ Special、ベースボールLIVE、DAZNの3つは、17時45分から試合終了までとなっている。\n\n==球場で**清宮幸太郎**の通算100本塁打が出たのに打球の角度を見逃した、というときは、帰宅後に中継映像で見直せる。==現地では全体、映像ではアップとリプレーを見る、と使い分けると理解しやすいのだ。"}, "8-01-b": {"meta": {"id": "8-01-b", "title": "初心者におすすめの本・漫画・動画は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-01-c", "2-18-c"], "sources": ["https://www.seibidoshuppan.co.jp/search/result?c3=1102", "https://www.kodansha.co.jp/comic/products/0000030251", "https://npb.jp/news/detail/20260409_01.html"]}, "body": "## ひとことで\n\n最初から全部覚える必要はない。==**ルール本で調べる、漫画で試合の考え方を知る、短い動画で動きを見る**==の3つを使い分けると楽なのだ。\n\n## しくみ\n\n本なら、成美堂出版の**『わかりやすい野球のルール』**が2026年版として出ている。A6判の小さめの本なので、「今のプレーは何だった？」を後から調べる辞書のように使いやすい。\n\n漫画なら、ひぐちアサの**『おおきく振りかぶって』**は、投手と捕手の役割や、打者ごとに考え方が変わる様子が細かく描かれる。ルール暗記よりも、「選手はこんなことを考えているのか」を知りたい人向きだ。\n\n動画なら、NPBが2026年に公開した**「野球の審判 超・初級編」**のような公式の初心者向け動画が入りやすい。==分からなかった場面を1つだけ選び、帰宅後に5分調べるくらいで十分==なのだ。\n\n## 今日の試合で見るなら\n\n今日、**福島蓮**の投球を見て「捕手はなぜそこに構えた？」と思ったら漫画や解説へ、**山口航輝**の打球で判定が分からなければルール本や公式動画へ進むといい。\n\n==球場で生まれた「なぜ？」を1個だけ持ち帰る==と、次の観戦では見えるものが増えるのだ。"}, "8-01-c": {"meta": {"id": "8-01-c", "title": "野球のゲームで覚える方法は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-01-b", "1-03"], "sources": ["https://www.konami.com/games/prospi/2026/jp/ja/", "https://www.konami.com/games/prospi/2026/jp/ja/products"]}, "body": "## ひとことで\n\n野球ゲームは、ルールを暗記するより**自分で1球ずつ選ぶ練習**に向いている。==まず「3アウトで交代」「走者をどこへ進めるか」「投手は何を投げるか」の3つだけ意識すればいい==のだ。\n\n## しくみ\n\nKONAMIの**『プロ野球スピリッツ2026』**は、2026年7月16日発売で、2026年のプロ野球データを収録している。対戦やペナントレースなどのモードがあり、実在球団を使って試合の流れを追える。\n\n初心者なら、勝つことより「なぜ今アウトになったか」を止めて考えるのがおすすめだ。ゴロならどの塁へ投げるか、走者がいたら次の塁へ行けるか、投手ならストライクを取りに行くか。==ゲームは同じ場面を何度も試せるので、球場では一瞬で終わる判断をゆっくり確認できる==。\n\n最初は難しい守備操作や細かな配球まで覚えなくていい。1試合全部ではなく、1〜3イニングだけでも十分だ。\n\n## 今日の試合で見るなら\n\n今日の**福島蓮**や**アンドレ・ジャクソン**を見たあと、ゲームで投手を操作すると「球種を選ぶ→コースを決める→打者の反応を見る」という順番が分かりやすい。\n\n==実際の試合で見た場面をゲームで再現する==と、次に球場へ来たときの理解が速くなるのだ。"}, "8-01": {"meta": {"id": "8-01", "title": "野球をもっと知るには？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "children": ["8-01-a"], "related": ["8-02", "4-01"], "sources": ["https://npb.jp/games/2026/", "https://pacificleague.com/ptv", "https://npb.jp/bis/players/43745159.html", "https://www.mlb.com/press-release/transcript-from-vin-scully-conference-call-on-9-19-16-202215664", "https://www.latimes.com/archives/la-xpm-1985-10-13-tm-15521-story.html"], "episode": "v2"}, "body": "## ひとことで\n==一度に全部覚えなくていい。次の試合で「**一つだけ見るテーマ**」を決めると、野球はかなり分かりやすくなるのだ。==\n\n## しくみ\n最初は**スコア、アウト数、走者の位置**だけで十分だ。その次に、投手なら球種、打者なら**狙い球**（打者が待っている球種やコース）、守備なら位置取りというように、見る対象を一つずつ増やすといい。\n\n試合後に結果を確認すると、球場で見えなかった部分もつながる。**NPB公式**には日程、順位、個人成績、試合の投打成績が残るので、==「あの場面は何だったのか」を後から確認できる。==\n\n映像で見返すのも有効だ。球場では全体が見える一方、**配信やテレビ**では投手の握り、打者の表情、リプレーなどを近くから見られる。現地と映像では、同じ野球でも見える情報が違うのだ。\n\n![野球場で試合を撮影するテレビ中継用カメラ](https://upload.wikimedia.org/wikipedia/commons/4/4a/Thomson_Grass_Valley_LDK4000_camera_of_Videoland_at_Tainan_Municipal_Baseball_Stadium_20150725.jpg \"出典：Wikimedia Commons／Chi-Hung Lin／CC BY-SA 2.0\")\n\nおすすめは、自分の気になる**選手を一人**決めることだ。毎打席、毎守備を見るだけで、打順、交代、**左右の相性**（投手と打者の利き腕の組み合わせによる向き不向き）、記録などが自然につながってくる。\n\n## おもしろエピソード\nドジャースの実況を**67年間**担当した名アナウンサー、**ビン・スカリー**にも「野球をもっと知りたい」と思うきっかけがあった。1936年10月2日、まだ9歳になる前のスカリーは、街の店先でヤンキース18―4ジャイアンツという大差の途中経過を見た。\n\n子どものスカリーは、負けているジャイアンツがかわいそうになり、その日から応援するようになった。80年後の2016年10月2日、==彼の最後の実況は偶然にも、そのジャイアンツの試合だった==のだ。\n\n少年時代に球場へ通ううち、スカリーはもう一つ不思議に気づいた。遠い外野席では、打者がボールを打つのが見えてから、少し遅れて「カーン」という音が届く。\n\n隣の観客に尋ねると、「光は音より速いからだ」と教えられた。スカリーは後に、==野球場で受けた最初の物理の授業だった==と振り返っている。一つの「なぜ？」を追うだけでも、野球の外側まで知識が広がっていくのだ。\n\n## 今日の試合で見るなら\n今日は山口航輝なら33号本塁打、清宮幸太郎なら通算100本塁打、アンドレ・ジャクソンなら10勝目がかかっている。三人のうち一人だけ追ってみると、試合後の記事や成績表も急に読みやすくなる。\n\nたとえば清宮の全打席を見て、「どんな球で勝負されたか」を覚えておく。帰宅後に映像や試合結果を見返せば、今日の観戦が次の観戦の予習になるのだ。"}, "8-02-a": {"meta": {"id": "8-02-a", "title": "CSや来季のチケットは？", "category": "8", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "images": "v2", "related": ["8-02"], "sources": ["https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/games/2026/info_cs.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://www.marines.co.jp/ticket/season2027/index.html"]}, "body": "## ひとことで\n**2026年パ・リーグのCS**（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）は**10月10日**から始まる。==ロッテはCS進出がない。だから今季、ZOZOマリンでロッテのCSを観る機会はないのだ。==\n\n## しくみ\n**ファーストステージ**（CSの最初の段階）は10月10〜12日で、2位と3位が対戦する。球場は2位球団の本拠地だ。==今日の日本ハムは3位で、2位西武を追っているため、この試合の結果はCSの開催地にも関わる。==\n\n2027年について球団公式で発表済みなのは、まず年間予約席の**「シーズンシート」**だ。継続受付は**10月7日13時**、新規受付は10月14日13時からとなっている。\n\n1試合ずつ買う2027年の**一般チケット販売日程**は、9月28日時点では球団公式で確認できていない。<!-- TODO: 2027年一般チケットの販売開始日を球団公式で確認 -->\n\n\n## 今日の試合で見るなら\n日本ハムにとっては、今日と10月1日のロッテ戦に連勝することが2位争いの最低条件になっている。**清宮幸太郎**の通算100本塁打や**福島蓮**の先発も見どころだ。==そこに「日本ハムが2位へ近づけるか」という見方を足すと、10月10日のCSにつながる試合だと分かるというわけだ。=="}, "8-02-b": {"meta": {"id": "8-02-b", "title": "残りのロッテ×日本ハム（10/1）は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-02-c", "1-13"], "sources": ["https://npb.jp/bis/2026/games/gm20261001.html", "https://npb.jp/games/2026/schedule_10_detail.html", "https://www.marines.co.jp/game/calendar/202610"]}, "body": "## ひとことで\n\n今日の次にあるロッテ×日本ハムは、**2026年10月1日（木）18:00、ZOZOマリンスタジアム**だ。==同じ球場で、もう一度このカー
