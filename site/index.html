。\n\nロッテと日本ハムはここまで23試合を戦い、日本ハム13勝、ロッテ10勝。割合にすると日本ハムは約56.5％を勝っている計算になる。==13勝10敗は「毎回一方的」ではなく、数試合の差が積み重なった数字==と考えるといい。\n\n9月に入ってからの直接対決では、ロッテが15日に7-6、27日に6-1で勝っている。特に15日は、**山口航輝**が29号と30号を放ち、9回の30号が決勝点になった。\n\n## おもしろエピソード\n\n9月15日の試合は、ロッテが7-6で勝利。日本ハムは11安打、ロッテは9安打だったが、最終的には本塁打を含む得点の取り方でロッテが上回った。\n\n前日の9月27日はロッテが6-1で勝利。==同じ対戦カードでも、接戦の日と大差の日がある==のが野球なのだ。\n\n## 今日の試合で見るなら\n\n今日が**24回戦**で、10月1日にも同じZOZOマリンで対戦予定だ。日本ハムはすでに今季のこのカードで勝ち越しを決めている。\n\nそれでも今日の意味は大きい。==日本ハムは2位争い、ロッテは目の前の勝利と若手の結果を懸けて戦う==。対戦成績だけで今日の勝敗が決まるわけではない。"}, "6-01-a": {"meta": {"id": "6-01-a", "title": "1塁側の席で何をすればいい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "related": ["6-01", "6-01-c"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n1塁側の内野指定席Bなら、まず座ったまま手拍子で十分だ。慣れてきたら、選手名のコールや7回のタオル応援に加わればいいのだ。\n\n## しくみ\nロッテが攻撃すると、外野の応援団が演奏を始める。最初の1打席は周りを見て、同じタイミングで手をたたくだけでいい。\n\n選手名が繰り返し聞こえたら、その部分だけ声を出してもいい。応援ボードや小旗を使うなら、公式ルールでは自分の顔より下、自席の範囲内で使う決まりだ。\n\n内野指定席は、立ち上がって応援する前提の外野応援席とは別のエリアだ。後ろの人の視界をふさがないよう、基本は座ったまま楽しめばいい。\n\n## 今日の試合で見るなら\n1回裏、1番予想の西川史礁の打席から試してみよう。まず手拍子だけで流れをつかむ。続く山口航輝の打席で名前のコールまで加われれば、それで十分だ。\n\n7回表が終わったら「MARINES LUCKY 7」だ。タオルがあれば掲げ、なければ手拍子だけでも参加できるのだ。"}, "6-01-b": {"meta": {"id": "6-01-b", "title": "選手ごとの応援歌って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "related": ["6-01", "6-01-a"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.marines.co.jp/news/detail/202600832194.html"]}, "body": "## ひとことで\n選手応援歌は、打者ごとに用意された短い応援曲だ。打席の間に何度も繰り返すので、最初は歌詞より名前と手拍子だけ拾えばいいのだ。\n\n## しくみ\n2026年の球団公式ページには、山口航輝、藤原恭大、佐藤都志也、小川龍成、寺地隆成などの個人応援歌が掲載されている。西川史礁と髙部瑛斗には新しい応援歌が加わった。\n\n全選手に必ず専用曲があるわけではない。公式ページには若手用、捕手用、その他の選手用といった共通テーマも載っている。だから知らない曲が始まっても、間違いではないのだ。\n\n歌詞を事前に全部覚える必要はない。外野の演奏を聞き、周囲が選手名を呼ぶところだけ合わせれば、1打席のうちにだいたい形が見えてくる。\n\n## 今日の試合で見るなら\n予想スタメン（試合前に予想される先発メンバー）のうち、公式ページに個人応援歌が載っているのは、西川史礁、山口航輝、藤原恭大、佐藤都志也、寺地隆成、小川龍成、髙部瑛斗だ。最初の西川の打席で曲調を聞き、山口の打席で名前のコールに入ると分かりやすいのだ。"}, "6-01-c": {"meta": {"id": "6-01-c", "title": "ジャンプしたり叫んだりしていいの？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "related": ["6-01", "6-01-a"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/news/detail/00008263.html"]}, "body": "## ひとことで\n選手名を呼んだり応援歌を歌ったりするのはいい。ただし今日の内野指定席Bでは、立ち上がったりジャンプしたりせず、座席から声と手拍子で応援するのが基本だ。\n\n## しくみ\n現行のスタジアムルールは、ホーム（ロッテ側）とビジター（相手チーム側）の外野応援指定席を「立ち上がっての応援が許可されているエリア」としている。2022年のルール変更時にも、立ち上がって応援できる席として両外野応援指定席が明記された。\n\n一方、あなたの内野指定席Bはそのエリアではない。周囲の視界や観戦を妨げないよう、座ったまま手拍子をし、選手名や応援歌を声に出すのが安全なのだ。\n\n球団は、ほかの観客の観戦を妨げる発言や行為があれば対応する場合があるとしている。声の大きさも、自分だけが目立つことより、周りの応援に合わせることを考えればいい。\n\n## 今日の試合で見るなら\n山口航輝が打席に入ったら、名前のコールは声に出していい。ただし33号（今季33本目の本塁打）を期待して盛り上がっても、内野席ではジャンプせず、座ったまま拍手と声で参加するのだ。"}, "6-01": {"meta": {"id": "6-01", "title": "ロッテの応援ってどんな感じ？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "children": ["6-01-a", "6-01-b", "6-01-c"], "related": ["6-02", "6-03"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nロッテの応援は、打者ごとの応援歌と手拍子、名前のコールが中心だ。全部覚えなくても、周りの手拍子に合わせるだけで十分参加できるのだ。\n\n## しくみ\nロッテの攻撃になると、外野の応援団が太鼓やトランペットで流れを作る。打者ごとの応援歌がある選手も多く、チャンスになると、チーム用の応援曲に切り替わる。\n\n公式の応援歌ページには、山口航輝、西川史礁、藤原恭大、佐藤都志也、髙部瑛斗らの曲が載っている。専用曲がない選手には、若手用や捕手用などの共通テーマが使われる場合もある。\n\nあなたの席は1塁側の内野指定席Bだ。外野応援席ほど立って動く場所ではないので、座ったまま手拍子をし、分かるところだけ名前を呼べばいい。応援は「全部できる人だけのもの」ではないのだ。\n\n## おもしろエピソード\n2026年は西川史礁と髙部瑛斗に新しい個人応援歌が加わった。球団は選手応援歌グッズも販売しており、応援歌そのものが球場文化の一部になっている。\n\n7回表終了後には「MARINES LUCKY 7」があり、球団歌「WE LOVE MARINES」を歌いながらタオルを掲げる演出が予定されている。初観戦でも参加しやすい場面だ。\n\n## 今日の試合で見るなら\nロッテの攻撃では、まず2番予想の山口航輝に注目すると分かりやすい。今季32本塁打（ホームラン）を打っていて、33号ならリーグ単独2位になる打者だ。打席に入ったら、外野の演奏と手拍子がどう変わるか聞いてみるといい。\n\n1番予想の西川史礁にも2026年の新応援歌がある。歌詞を知らなくても、周囲と同じ拍で手をたたけば自然に入れる。7回にはタオルを準備しておくと、応援の大きな区切りも体験できるのだ。"}, "6-02-a": {"meta": {"id": "6-02-a", "title": "3塁側・レフトスタンドの日本ハムファンは何をしてる？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-02", "6-01"], "sources": ["https://www.marines.co.jp/stadium/rule", "https://www.fighters.co.jp/entertainment/cheer_player/"]}, "body": "## ひとことで\n3塁側の**ビジター外野応援指定席**では、日本ハムファンが立って、手拍子や選手ごとの応援歌で打者を後押しする。==レフト側から大きな音が聞こえたら、日本ハムの攻撃が始まった合図だと思えばいい==のだ。\n\n## しくみ\nZOZOマリンのビジター外野応援指定席は、登録された応援団の大旗や鳴り物応援が認められ、一般の観客も立って応援できる場所だ。反対に、そのエリアでは相手球団への応援は禁止されている。\n\n日本ハムには**清宮幸太郎**や**万波中正**など、選手ごとの応援歌がある。公式案内では、応援歌の1回目はアカペラ（楽器を止めて声だけで歌うこと）にし、その間はメガホンをたたかず、手拍子はよいとされている。==急に楽器が止まり、声だけになったら、それも応援の一部なのだ==。\n\nあなたの席は1塁側の内野指定席Bなので、同じ動きをする必要はない。遠くのレフト側から聞こえる声と、ロッテ側の応援が攻守で入れ替わる様子を聞くだけでも十分だ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**万波中正**が打席に入ったら、レフト側の音を聞いてみよう。==最初の声だけの部分から演奏へ切り替わる瞬間が分かれば、日本ハムの応援の形がかなり見えてくる==のだ。"}, "6-02-b": {"meta": {"id": "6-02-b", "title": "「きつねダンス」って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-02", "6-04"], "sources": ["https://www.fighters.co.jp/news/detail/00004327.html", "https://www.fighters.co.jp/news/detail/202300314972.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://www.fighters.co.jp/entertainment/cheer_player/"]}, "body": "## ひとことで\n**きつねダンス**は、日本ハムの公式チアチーム「ファイターズガール」が、Ylvisの曲「The Fox」に合わせて踊る球場演出だ。==選手を直接応援する応援歌とは別の、イニング間などに楽しむエンタメなのだ==。\n\n## しくみ\n大きく広まったのは2022年だ。球団は同年に「きつねダンスDAY」を開き、原曲を歌うノルウェーの兄弟ユニット**Ylvis**も招いた。翌年には球団公式のコンピレーションCDにも「The Fox」が収録されている。\n\n動きは、きつねの耳や前足を思わせる手ぶりが特徴だ。全部覚えなくても、周りの人が踊っている場面なら、見よう見まねで十分楽しめる。\n\nただし、==日本ハム戦なら毎球場で必ず行われる演出ではない==。今日のZOZOマリン公式イベント案内には、きつねダンス実施の記載はないのだ。\n\n## 今日の試合で見るなら\n今日その場で確実に聞きやすいのは、きつねダンスより**選手応援歌**のほうだ。**清宮幸太郎**や**万波中正**の打席ではレフト側の応援を聞き、攻守交代では場内演出を見る、と分けると分かりやすい。\n\n==きつねダンスが流れなくても「見逃した」とは限らない==。今日はZOZOマリンの公式進行をそのまま楽しめばいいのだ。"}, "6-02-c": {"meta": {"id": "6-02-c", "title": "相手チームのファンとどう接すればいい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-02", "6-05"], "sources": ["https://www.marines.co.jp/stadium/rule"]}, "body": "## ひとことで\n相手チームのファンとは、==同じ試合を別の側から見ている人だと思えばいい==。自分のチームを応援しつつ、相手を挑発したり、相手の応援エリアへ入り込んだりしなければ大丈夫なのだ。\n\n## しくみ\nZOZOマリンのルールでは、ほかの観客の観戦を妨げる発言や行為をしないことが求められている。また、外野応援指定席では相手球団への応援が禁止され、ホーム応援エリアをビジターチームのユニホームや応援グッズ姿で通り抜けることにも制限がある。\n\nつまり、==「自分の席で、自分のチームを応援する」が基本==だ。相手が得点して喜んでいても、にらんだり言い返したりする必要はない。通路では互いに譲り合い、前を横切るときは視界をふさがないようにすればいい。\n\nあなたの1塁側内野指定席Bでは、近くに日本ハムを応援する人がいることもあり得る。応援の方向が違っても、それだけで問題ではないのだ。\n\n## 今日の試合で見るなら\n**山口航輝**が打ってロッテ側が沸く場面も、**清宮幸太郎**が打って日本ハム側が沸く場面もあり得る。==喜ぶときはグラウンドに向かって喜び、相手ファンへ向けて勝ち誇らない==。これだけ覚えておけば、かなり気楽に観戦できるのだ。"}, "6-02": {"meta": {"id": "6-02", "title": "日本ハムの応援は？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["6-01", "6-03"], "sources": ["https://www.fighters.co.jp/entertainment/cheer_player/", "https://www.fighters.co.jp/news/detail/202600836488.html", "https://www.marines.co.jp/stadium/rule", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n日本ハムにも選手ごとの応援歌があり、ビジター側（相手チーム側）の応援席から手拍子や演奏がまとまって聞こえてくる。ロッテの応援と交互に聞くと、攻守が切り替わったことも分かりやすいのだ。\n\n## しくみ\n日本ハムの公式サイトには、清宮幸太郎、田宮裕涼、万波中正、水野達稀らの選手応援歌が掲載されている。打者が変わるたびに曲も変わるので、選手紹介を見なくても「次の打者が来た」と耳で気づける。\n\n日本ハムの応援をまとめる全国闘将会は、応援歌の1回目をアカペラ（楽器を止めて声だけで歌うこと）で歌うとしている。その間はメガホンをたたかず、手拍子はよいという案内だ。声だけになった瞬間は、応援の輪郭がかなりはっきり聞こえる。\n\nZOZOマリンのビジター外野応援指定席は、立ち上がって応援できる専用エリアだ。一方、内野席はホーム・ビジター双方のファンが観戦できる。あなたの1塁側内野指定席Bでも、日本ハムの応援が聞こえてくるのは自然なことなのだ。\n\n## おもしろエピソード\n2026年には日本ハムも選手応援歌を使った公式グッズを販売している。応援歌は球場だけの掛け声ではなく、選手とファンを結ぶ定番の文化になっているというわけだ。\n\n## 今日の試合で見るなら\n日本ハムの3番予想・清宮幸太郎は、通算100本塁打（ホームラン）まであと1本だ。打席に入ったとき、ロッテ側の応援が止まり、反対側から清宮の応援歌が聞こえてくる切り替わりに注目するといい。\n\n田宮裕涼や万波中正にも公式の個人応援歌がある。ロッテ攻撃時との音の違いを聞き比べると、球場全体が二つの応援チームでできていることが分かるのだ。"}, "6-03-a": {"meta": {"id": "6-03-a", "title": "ヒーローはどう選ばれる？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-03", "6-03-b"], "sources": ["https://www.daily.co.jp/baseball/2021/12/26/0014945093.shtml", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nヒーローは、安打数などの数字だけで自動的に決まるわけではない。==その日の勝敗を大きく動かした選手が選ばれる、と考えると分かりやすい==のだ。\n\n## しくみ\n決勝打（勝ち越しにつながった一打）を放った打者、長い回を好投した先発投手、終盤を抑えた救援投手などが候補になる。ただし、「3安打なら必ず選出」のようなNPB共通の公開された点数表はない。\n\n選出には球団側の判断も入る。デイリースポーツは、西武では**チーム広報**の業務にヒーローインタビューの選手選びが含まれると報じている。一方、ロッテが誰をどういう手順で選ぶかという詳細は公開資料で確認できないため、担当者までは断定しない。\n\n==大事なのは「いちばん目立った人」より、「勝ちに大きく関わった人」を探すこと==なのだ。\n\n## 今日の試合で見るなら\nロッテの**アンドレ・ジャクソン**が長い回を抑えて勝てば、投手の活躍が大きな材料になる。**山口航輝**が終盤に勝ち越し打を放てば、打者の活躍が強く残る。\n\n==試合の終盤に「今なら誰が呼ばれそうか」を一人決めておくと、ヒーロー発表が答え合わせになる==のだ。"}, "6-03-b": {"meta": {"id": "6-03-b", "title": "試合後まで残ると何がある？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-03", "6-03-a"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/202600800842.html"]}, "body": "## ひとことで\n今日ロッテが勝つと、試合後に**MARINES WINNING CEREMONY**が行われる。==最後のアウトのあとも、ハイライト映像とヒーローインタビューまでが観戦の続きなのだ==。\n\n## しくみ\nロッテ公式の9月28日イベント案内では、勝利時に球場を暗くし、試合のハイライト映像を流してヒーローインタビューを行う予定だ。**MARINESペンライト2026**が音楽に合わせて点滅し、ビジョンのQRコードを読み込むとスマートフォンのライトも連動する。\n\nこれは==ロッテが勝ったときだけの演出==だ。日本ハムが勝った場合、同じ「MARINES WINNING CEREMONY」は行われない。\n\nだから帰りの混雑を急いで避けるか、勝利演出まで見るかは、最後のアウトが近づいたところで決めればいい。初観戦なら、一度は残ると「試合が終わった後の球場」まで分かるのだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**が好投したり、**山口航輝**が勝敗を動かす一打を放ったりしてロッテが勝ったら、すぐ席を立たずグラウンドとビジョンを見よう。\n\n==誰がヒーローに呼ばれるかまで見届けると、その日の試合で何が重要だったかを整理しやすい==のだ。"}, "6-03": {"meta": {"id": "6-03", "title": "ヒーローインタビューって？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["6-01", "6-02"], "sources": ["https://www.marines.co.jp/news/detail/202600800842.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nヒーローインタビューは、試合後に活躍した選手へ行う場内インタビューだ。今日のZOZOマリンでは、ロッテが勝つと「MARINES WINNING CEREMONY」の中で行われる予定なのだ。\n\n## しくみ\nヒーローになるのは、勝敗を大きく動かした選手が中心だ。決勝打（勝ちを決めた一打）を打った打者、好投した先発投手、終盤を締めた救援投手（先発の後を継いで投げる投手）などが候補になる。ただし、誰が何人呼ばれるかは試合が終わるまで決まらない。\n\n2026年のZOZOマリンでは、ロッテ勝利時に球場を暗くし、試合のハイライト映像とヒーローインタビューを組み合わせた勝利演出を行っている。ペンライトに加え、ビジョンのQRコードを読み込んだスマートフォンのライトも音楽に合わせて光る仕組みだ。\n\nだから、最後のアウトが決まってもすぐに席を立たないでほしい。ロッテが勝った日は、試合終了が観戦の終わりではないのだ。インタビューまで見ると、その試合で何が勝負を決めたのかを、選手本人の言葉で振り返れる。\n\n## おもしろエピソード\n同じ本塁打でも、点差が大きい場面の一発より、終盤の同点や逆転の一打のほうが「試合を決めた」と見られやすい。ヒーローを予想しながら終盤を見ると、初心者でも試合の重要場面を整理しやすくなる。\n\n## 今日の試合で見るなら\nロッテ先発のアンドレ・ジャクソンは、勝てば今季10勝目だ。山口航輝は33号本塁打なら本塁打数でリーグ単独2位になる。\n\nもしロッテが勝ち、この2人のどちらかが勝敗を動かす活躍をしたら、試合後まで残って誰がヒーローに呼ばれるか見てみよう。別の選手が呼ばれたなら、「今日いちばん大きかったプレーは何だったか」を考える答え合わせにもなるのだ。"}, "6-04-a": {"meta": {"id": "6-04-a", "title": "マーくんって？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-04", "6-04-b"], "sources": ["https://www.marines.co.jp/fans/mascot/"]}, "body": "## ひとことで\n**マーくん**は、千葉ロッテマリーンズの公式マスコットの中心になるカモメの男の子だ。==大きな顔と白黒のユニホームを見たら、まずマーくんだと思えばいい==のだ。\n\n## しくみ\n球団公式プロフィールでは、マーくんは**幕張の浜出身**で、平和主義の優しい性格とされている。得意なことは「みんなを笑顔にすること」で、アピールポイントは大きな顔だ。\n\n仲間には、ガールフレンドの**リーンちゃん**と、弟の**ズーちゃん**がいる。3羽ともカモメなので、見分けるときは顔や服装を見ると分かりやすい。\n\nマスコットは選手ではなく、試合前や攻守交代などで球場を盛り上げる役だ。==プレー中の主役が選手なら、止まっている時間の案内役がマスコットなのだ==。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**の打席など、プレー中はまず試合を見よう。攻守交代になったらグラウンド脇やビジョンへ目を移し、カモメのキャラクターが出ていないか探すといい。\n\n==大きな顔の男の子ならマーくん、ポニーテールならリーンちゃん、オーバーオール姿ならズーちゃん==。この3つを覚えれば十分なのだ。"}, "6-04-b": {"meta": {"id": "6-04-b", "title": "謎の魚って？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-04", "6-04-a"], "sources": ["https://www.marines.co.jp/news/detail/00006422.html", "https://www.marines.co.jp/news/detail/00007278.html", "https://www.marines.co.jp/fans/mascot/"]}, "body": "## ひとことで\n**謎の魚**は、かつてロッテにいた変わったマスコットだ。==今の現役マスコットではなく、2021年に引退した存在なのだ==。\n\n## しくみ\n球団公式によると、謎の魚は**2017年に初登場**した。魚の姿から骨が飛び出すなど、姿を変える「進化」が特徴で、2021年には最終形態まで到達した。\n\nその後、球団は2021年12月に引退を発表し、12月17日にZOZOマリンで引退セレモニー「THE LAST MYSTERY」を実施した。だから、昔のロッテ映像やグッズで見かけても、今のマーくんたちと同じ現役メンバーだと思わないほうがいい。\n\n現在の球団公式マスコットページに載っているのは**マーくん、リーンちゃん、ズーちゃん**だ。==「魚も今いるの？」への答えは、いない、なのだ==。\n\n## 今日の試合で見るなら\n**清宮幸太郎**の打席などプレー中は試合を見て、攻守交代になったらグラウンド脇やビジョンを見よう。マスコットが登場したら、まず現在の3羽かを確かめればいい。\n\n==今日、謎の魚を探して待つ必要はない==。見かけるとすれば、過去を紹介する映像やデザインなどとして考えるのが自然なのだ。"}, "6-04": {"meta": {"id": "6-04", "title": "マスコットは誰？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["6-01", "6-02"], "sources": ["https://www.marines.co.jp/fans/mascot/", "https://www.marines.co.jp/news/detail/00007406.html", "https://www.marines.co.jp/news/detail/202600791115.html"]}, "body": "## ひとことで\nロッテの公式マスコットは、カモメの「マーくん」「リーンちゃん」「ズーちゃん」だ。3羽とも幕張の浜出身という設定で、球場や地域イベントでチームを盛り上げているのだ。\n\n## しくみ\n中心になるのはマーくんだ。公式プロフィールでは、平和主義で優しい男の子で、みんなを笑顔にすることが得意とされている。\n\nリーンちゃんはマーくんのガールフレンドで、しっかり者の女の子だ。得意なことはダンス。ズーちゃんはマーくんの弟で、天真爛漫な男の子という設定になっている。\n\n3羽とも種類はカモメだ。海沿いのZOZOマリンらしい組み合わせだと覚えると見分けやすい。\n\n## 歴史・由来\n3羽の名前は「マリーンズ」というチーム名から取られている。公式発表によると、マーくんは1992年、リーンちゃんは1993年、ズーちゃんは1998年にデビューした。\n\n2022年には3羽のイラストが約20年ぶりにリニューアルされ、白と黒のチームカラーとピンストライプを着た現在のデザインになった。\n\n## おもしろエピソード\n公式プロフィールでは、マーくんの好きな色は黒、リーンちゃんは白、ズーちゃんはグレーだ。3羽を並べると、そのままマリーンズらしい無彩色の組み合わせになる。\n\n2026年は他球団とのマスコット・チア交流も行われている。日本ハム側のフレップとファイターズガールがZOZOマリンへ来る予定日は8月22日・23日と公式に案内されており、9月28日はその交流日としては掲載されていない。\n\n## 今日の試合で見るなら\n試合前やイニング間にカモメのマスコットを見かけたら、まず3羽のどれかを見分けてみよう。大きな顔の男の子がマーくん、ポニーテールの女の子がリーンちゃん、オーバーオール姿の男の子がズーちゃんだ。\n\n今日の相手は日本ハムだが、公開されている2026年の交流予定では9月28日にビジターマスコット来場の記載はない。誰かが出てくると決めつけず、場内演出を見て確認するのが確実なのだ。"}, "6-05-a": {"meta": {"id": "6-05-a", "title": "立って応援していい席は？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-05", "6-01"], "sources": ["https://www.marines.co.jp/stadium/rule/"]}, "body": "## ひとことで\nZOZOマリンで**立ち上がっての応援が許可されている**と公式に明記されているのは、ホーム外野応援指定席とビジター外野応援指定席だ。==今日の内野指定席Bは、外野応援席と同じ感覚で立ち続ける席ではない==のだ。\n\n## しくみ\n外野応援指定席は、応援団の鳴り物や大旗も使われる「応援するためのエリア」だ。そのため、座ったままだと前の人で試合が見えにくくなる場合があることも公式に案内されている。\n\n一方、内野指定席はホーム・ビジター双方のファンが観戦できる通常の観戦エリアだ。==内野ではまず座って観戦し、声や手拍子で参加する==と考えるのが安全だ。特別な演出時も、周囲の視界を確かめよう。\n\n## 今日の試合で見るなら\nあなたは**1塁側・内野指定席B**から見る。**山口航輝**の打席で周囲が一気に盛り上がっても、まずは手拍子で合わせれば十分だ。\n\n==前の人が立ったから自分も立つ、ではなく、係員の案内と周囲の見え方を優先する==。それがこの席で迷いにくい基準なのだ。"}, "6-05-b": {"meta": {"id": "6-05-b", "title": "相手チームへのヤジはOK？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-05", "6-02-c"], "sources": ["https://npb.jp/npb/kansen_yakkan.html", "https://www.marines.co.jp/stadium/rule/"]}, "body": "## ひとことで\n相手への声かけが全部禁止というわけではないが、**侮辱・威嚇・誹謗中傷になるヤジはだめ**だ。==迷ったら、相手を下げるより自分のチームを応援する==のが一番簡単なのだ。\n\n## しくみ\nNPBの試合観戦契約約款は、選手や観客などへの威嚇、誹謗中傷、その他の迷惑行為を禁止している。ZOZOマリンのルールも、他の観客の観戦を妨げる発言や行為があれば、応援禁止や退場などの措置を取る場合があるとしている。\n\nだから「打ってくれ」「抑えてくれ」という味方への応援はわかりやすい。反対に、相手選手の人格を傷つける言葉や、近くの日本ハムファンに向けた攻撃的な言葉は避けるべきなのだ。\n\n## 今日の試合で見るなら\n日本ハム先発の**福島蓮**が好投しても、選手本人を傷つける言葉を投げる必要はない。ロッテの**山口航輝**に「一本！」と声を送るほうが、応援としても伝わりやすい。\n\n==相手の好プレーを見ても、自分の応援を続ければいい==。それだけで十分に球場らしい応援になるのだ。"}, "6-05-c": {"meta": {"id": "6-05-c", "title": "旗やタオルは使っていい？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-05", "6-07-b"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n小さな**応援旗**や球団公式のタオルは使えるが、使い方には制限がある。==後ろの人の視界をふさがず、自分の席の範囲で使う==のが基本なのだ。\n\n## しくみ\nZOZOマリンでは、竿が1本の応援旗・応援小旗は原則として多くの席で使える。ただし頭の上に掲げず、自席の範囲内で、顔より下の位置で使うよう公式に定められている。インプレー中（ボールが動いて試合が進んでいる間）は使用を断られる場合もある。\n\n2本の竿で広げる**ゲートフラッグ**は別物で、使えるのはホーム外野応援席とビジター外野応援指定席だけだ。公式グッズも、周囲の視界を遮る使い方なら使用を止められることがある。\n\n## 今日の試合で見るなら\n今日の7回表終了後は、公式イベントで**「WE LOVE MARINES」を歌いながらタオルを掲げる**案内が出ている。==内野指定席Bでは、場内の合図に合わせ、隣や後ろの人にぶつからない幅で使う==と参加しやすい。\n\n**佐藤都志也**や**山口航輝**のタオルを持っているなら、打席前の応援にも使える。ただし大きく振る前に、まず後ろの人の視界を確認するのだ。"}, "6-05": {"meta": {"id": "6-05", "title": "応援のマナーって？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["6-05-a", "6-05-b", "6-05-c"], "related": ["6-01", "6-02", "6-06"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://npb.jp/npb/kansen_yakkan.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n応援は大声を出すことより、**周りの人も同じ試合を見られる状態を守ること**が先なのだ。==自分の席の範囲で、視界や通路をふさがず、相手や周囲を傷つけない==。これだけ押さえれば初観戦でも困りにくい。\n\n## しくみ\nZOZOマリンには球場独自の**スタジアムルール**があり、席によって応援のしかたが違う。外野応援指定席は立って応援できる一方、内野指定席は同じ扱いではない。指定された席以外で観戦したり、通路や階段に立ち止まったりするのも避ける必要があるのだ。\n\n応援グッズにも決まりがある。旗やボードは、自席の範囲や高さに制限があるものがあり、公式グッズでも周囲の視界を遮る使い方は断られることがある。==「持っているから自由に使える」ではなく、「周りが見える使い方か」で考える==とわかりやすい。\n\n言葉も同じだ。NPBの試合観戦契約約款では、選手や観客への威嚇、誹謗中傷、迷惑行為などが禁止されている。応援は味方を後押しするためのもので、相手を傷つけるためのものではないのだ。\n\n## おもしろエピソード\nロッテの応援は声や手拍子が大きくそろうことで知られているが、全員が同じ動きをする必要はない。初めてなら、まず手拍子だけでも十分参加できる。\n\n今日の公式イベントでは、7回表終了後の**MARINES LUCKY 7**で球団歌「WE LOVE MARINES」に合わせてタオルを掲げる案内が出ている。==場内演出に合わせれば、初心者でも自然に参加しやすい==というわけだ。\n\n## 今日の試合で見るなら\nあなたの観戦場所は**1塁側の内野指定席B**だ。外野応援指定席のように立ち続ける前提の席ではないので、まず座って見て、手拍子や声で応援するのがわかりやすい。\n\n**山口航輝**や**佐藤都志也**の打席で周囲の手拍子が強くなっても、前の人の視界をふさがないことを優先しよう。==盛り上がったときほど、自分の席の範囲を守れば安心して楽しめる==のだ。"}, "6-06-a": {"meta": {"id": "6-06-a", "title": "どんなときに流れる？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-06", "1-09"], "sources": ["https://www.fighters.co.jp/expansion/entertainment/", "https://www.marines.co.jp/fans/supportersong/"]}, "body": "## ひとことで\n目安は、**二塁や三塁にランナーがいて、ヒット1本で点が入りそうなとき**だ。==「次の一打で試合が動きそう」と感じたら、チャンステーマが来るか耳を澄ませる==といい。\n\n## しくみ\n日本ハムの公式応援ガイドは、ランナーが二塁や三塁へ進んだときをチャンステーマの登場タイミングとして案内している。野球では二塁・三塁を**得点圏（点につながりやすい位置）**と呼ぶ。\n\nただし、曲を流す条件が審判のルールで決まっているわけではない。ロッテにも複数のチャンステーマがあり、どれを使うかは応援側が試合の流れに合わせる。==満塁だけが「チャンス」ではない==のだ。\n\n## 今日の試合で見るなら\nたとえばロッテで**藤原恭大**が二塁に出て、**山口航輝**の打席になった場面を想像するとわかりやすい。一本で先制点や追加点が入りそうなら、応援の音量が変わるかもしれない。\n\n日本ハムなら、走者を置いて**清宮幸太郎**に回る場面も同じだ。==走者の位置と応援の変化を一緒に見ると、「なぜ急に盛り上がったのか」がわかる==のだ。"}, "6-06-b": {"meta": {"id": "6-06-b", "title": "一緒に歌うには？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-06", "6-01-a"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.fighters.co.jp/entertainment/cheer_player/other/"]}, "body": "## ひとことで\n歌詞を全部覚える必要はない。==最初は手拍子、次に「オイ！」などの短い声、最後に選手名のコール==という順で入れば簡単なのだ。\n\n## しくみ\nロッテの公式応援歌ページには、チャンステーマごとの音源と歌詞が用意されている。球場では応援団の太鼓やトランペット、周囲の声が合図になるので、まず1周聞くとリズムがつかみやすい。\n\n日本ハム側も、選手名を入れる部分や手拍子の位置を公式応援ガイドで案内している。==知らない曲で無理に先回りせず、周囲の動きを見てから合わせる==のがいちばん失敗しにくい。\n\n## 今日の試合で見るなら\n**山口航輝**の打席でロッテのチャンステーマが始まったら、最初は拍手だけでいい。周囲が同じところで名前を呼んでいるとわかったら、次から「山口」と合わせれば参加できる。\n\n1塁側内野指定席Bでは、立ち上がらなくても声と手拍子で十分だ。==歌詞を完璧にするより、試合を見失わずに一緒にリズムを取る==ほうが初観戦では楽しみやすいのだ。"}, "6-06": {"meta": {"id": "6-06", "title": "チャンステーマって？", "category": "6", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["6-06-a", "6-06-b"], "related": ["6-01", "6-02", "6-05"], "sources": ["https://www.marines.co.jp/fans/supportersong/", "https://www.fighters.co.jp/expansion/entertainment/", "https://www.fighters.co.jp/entertainment/cheer_player/other/", "https://npb.jp/npb/kansen_yakkan.html"]}, "body": "## ひとことで\n**チャンステーマ**は、点が入りそうな場面で普段より大きく盛り上げるための応援曲だ。==ランナーがたまり、一本出れば点になりそうなときに聞こえたら「いま勝負どころなんだ」と考えればいい==のだ。\n\n## しくみ\n野球では、二塁や三塁に走者がいるとヒット1本で点になりやすい。こうした場面を**得点圏（点につながりやすい二塁・三塁）**という。日本ハムの公式応援ガイドも、ランナーが二塁や三塁へ進んだときにチャンステーマで盛り上がると説明している。\n\nロッテにも複数のチャンステーマがあり、公式応援歌ページには「チャンステーマ1・3・5・6」などが載っている。ただし、==どの曲がいつ始まるかは機械的に決まっているわけではない==。応援団が試合の流れに合わせて選ぶので、同じ一死二塁でも毎回同じ曲とは限らないのだ。\n\nNPBでは、太鼓やトランペットを使って集団を統率する応援は許可制になっている。客席から聞こえるまとまったコールは、そうした応援団が中心になって作っている。\n\n## おもしろエピソード\nチャンステーマは「曲を知っている人だけのもの」ではない。歌詞がわからなくても、手拍子や選手名のコールだけで混ざれる。==最初は周囲を1回見て、2回目から合わせれば十分==なのだ。\n\n日本ハムには「ジンギスカン」「チキチキバンバン」など複数のチャンステーマが公式に紹介されている。球団ごとに曲が違うので、攻撃する側が変わるとスタンドの音も大きく変わる。\n\n## 今日の試合で見るなら\nロッテの攻撃で、**山口航輝**や**佐藤都志也**の前に走者が二塁や三塁へ進んだら、応援が一段大きくなるか聞いてみよう。==通常の個人応援歌から別の大きな曲に切り替わったら、チャンスが来た合図だ==。\n\n逆に日本ハムの攻撃で**清宮幸太郎**や**万波中正**に好機が回れば、3塁側やレフト側の応援が急に厚くなることがある。スコアだけでなく「音の変化」を聞くと、試合の山場が見つけやすいのだ。"}, "6-07-a": {"meta": {"id": "6-07-a", "title": "7回に風船を飛ばすの？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-07", "6-07-b"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n少なくとも**今日9月28日のZOZOマリン**では、7回の公式案内はジェット風船ではない。==「WE LOVE MARINES」を歌いながらタオルを掲げるのが、今日のMARINES LUCKY 7だ==。\n\n## しくみ\n野球場によっては、7回に細長い風船を飛ばす応援を見たことがあるかもしれない。ただ、応援方法は球場や時期によって違うので、「7回なら必ず風船」とは考えないほうがいい。\n\n今日の千葉ロッテ公式イベント表には、7回表終了後に**MARINES LUCKY 7**を実施し、球団歌に合わせてタオルを掲げると明記されている。==今日参加するなら、風船ではなく場内のタオル演出に合わせればいい==のだ。\n\n## 今日の試合で見るなら\n7回表で**清宮幸太郎**や**万波中正**ら日本ハムの攻撃が終わったあとが合図だ。ビジョンと場内音楽を見聞きして、周囲がタオルを掲げたら一緒に参加できる。\n\nタオルを持っていなくても問題はない。==歌を聞く、手拍子をする、それだけでもラッキーセブンを楽しめる==のだ。"}, "6-07-b": {"meta": {"id": "6-07-b", "title": "マリンの7回は何をする？", "category": "6", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["6-07", "6-05-c"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/00007594.html"]}, "body": "## ひとことで\n今日のZOZOマリンでは、**7回表が終わったあと**に「MARINES LUCKY 7」が入る。==球団歌「WE LOVE MARINES」に合わせてタオルを掲げ、7回裏のロッテの攻撃へつなぐ==のだ。\n\n## しくみ\nタイミングは「7回表後」なので、日本ハムの攻撃が3アウトで終わった直後だ。選手交代などをする**攻守交代（攻撃と守備が入れ替わる時間）**の間に、場内演出が始まる。\n\n曲が終われば、ロッテの7回裏が始まる。==演出だけ見て席を離れると、その直後の先頭打者を見逃しやすい==ので注意するといい。\n\n## 今日の試合で見るなら\n公式案内どおり、ビジョンと音楽に合わせてタオルを掲げれば参加できる。1塁側内野指定席Bでは、周囲にぶつけないよう自分の幅で扱おう。\n\n7回裏に**山口航輝**、**藤原恭大**、**佐藤都志也**らへ打順が回る可能性もある。==ラッキー7はイベントの終わりではなく、終盤のロッテ攻撃のスタート合図==と覚えるとわかりやすいのだ。"}, "6-07": {"meta": {"id": "6-07", "title": "ラッキーセブンの応援は？", "category": "6", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["6-07-a", "6-07-b"], "related": ["6-05-c", "6-06"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/00007594.html"]}, "body": "## ひとことで\n**ラッキーセブン**は、7回の攻撃を前にチームの歌や応援で客席を盛り上げる時間だ。今日のZOZOマリンでは、==7回表終了後に「MARINES LUCKY 7」があり、「WE LOVE MARINES」に合わせてタオルを掲げる==のだ。\n\n## しくみ\n野球は9回までなので、7回は終盤に入るところだ。まだ逆転の時間は残っているが、残りの攻撃回数は少ない。そこで「ここからもう一段応援しよう」という区切りとして、7回に特別な応援を入れる球場が多いのだ。\n\nロッテでは球団歌**「WE LOVE MARINES」**がラッキーセブン演出に使われている。球団は2022年のリニューアル時にも、この曲を7回表終了後のラッキー7で流すと案内している。\n\n==大事なのは「7回になった瞬間」ではなく、ホームのロッテなら7回裏の攻撃直前に行うこと==だ。今日の公式イベント表も、7回表が終わったあとに実施するとしている。\n\n## 歴史・由来\nロッテは2015年からラッキー7の曲を「WE LOVE MARINES」に変更した。2022年には千葉移転30周年に合わせて編曲を新しくし、歌詞とメロディーはそのまま受け継いでいる。\n\n## おもしろエピソード\nラッキーセブンは、応援歌を知らなくても参加しやすい。今日の案内はタオルを掲げる形なので、歌えなくても動きだけ合わせられる。\n\n==試合が接戦なら、7回裏は「残り3回のうちの1回」という重みがある==。演出の直後に打席へ入る選手を見ると、応援と試合がつながって感じられるのだ。\n\n## 今日の試合で見るなら\n7回表で日本ハムの攻撃が終わったら、席を立って売店へ向かう前に少し待ってみよう。**MARINES LUCKY 7**が始まり、スタンドでタオルが上がる。\n\nそのあと7回裏に**山口航輝**や**佐藤都志也**へ打順が回れば、終盤の大事な打席になる。==タオルの演出が終わったら、すぐグラウンドへ視線を戻す==と流れを見逃さないのだ。"}, "7-01-a": {"meta": {"id": "7-01-a", "title": "名前の変遷は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-01", "7-02"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/18406.html", "https://www.marines.co.jp/news/detail/202600873928.html"]}, "body": "## ひとことで\n同じ球場が「千葉マリンスタジアム」→「QVCマリンフィールド」→「ZOZOマリンスタジアム」と名前を変えてきたのだ。\n\n## しくみ\n最初の名称は一般公募から選ばれた「千葉マリンスタジアム」だ。2011年3月1日からQVCジャパンが施設命名権（企業が施設名を付ける権利）を取得し、「QVCマリンフィールド」になった。\n\n2016年12月1日からは「ZOZOマリンスタジアム」。2026年6月には契約更新が発表され、名称は2033年11月30日まで引き続き使われる予定だ。\n\n建物そのものが三つあるわけではない。同じ球場を、時代によって別の名前で呼んでいるということだ。\n\n## 今日の試合で見るなら\n昔の写真に「千葉マリン」や「QVCマリン」と書かれていても、今日アンドレ・ジャクソンが投げるマウンド（投手が立つ小高い場所）と同じ場所だ。過去の記事を見るときは、名前の年代を手がかりにすると迷いにくい。"}, "7-01-b": {"meta": {"id": "7-01-b", "title": "ここで起きた名場面は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-01", "5-01"], "sources": ["https://npb.jp/bis/scores/nipponseries/linescore2005.html", "https://www.marines.co.jp/news/detail/00003169.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\n代表的なのは、2005年日本シリーズの大勝と、2018年の福浦和也の通算2000安打だ。どちらもこの球場に残る大きな節目なのだ。\n\n## おもしろエピソード\n2005年日本シリーズでは、ロッテが本拠地の第1戦を10対1、第2戦を10対0で勝利した。シリーズはそのまま4連勝で終わり、31年ぶりの日本一になった。\n\n2018年9月22日には、福浦和也が西武戦でNPB史上52人目の通算2000安打（ヒット）を達成した。長く応援された生え抜き（入団からずっと同じ球団にいること）の選手が、本拠地で大台に届いた場面だ。\n\n## 今日の試合で見るなら\n今日も節目候補がある。山口航輝は32本塁打（ホームラン）で、33号ならパ・リーグ単独2位になる可能性がある。記録が動く打席では、打球だけでなく直後の場内表示や拍手にも注目するとよい。"}, "7-01-c": {"meta": {"id": "7-01-c", "title": "ロッテが千葉に来たのはいつ？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-01"], "sources": ["https://www.marines.co.jp/corp/history/1990.html", "https://www.marines.co.jp/special/70th/history.html", "https://www.marines.co.jp/news/detail/00007569.html", "https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nロッテが本拠地を千葉へ移したのは**1992年**だ。==この年から「千葉ロッテマリーンズ」としてスタートした==のだ。\n\n## しくみ\nそれまでは**ロッテオリオンズ**という名前で、川崎を本拠地にしていた。球団公式の歴史では、1991年に千葉への本拠地移転を決め、愛称も「オリオンズ」から公募で決まった「マリーンズ」へ変更したとされている。\n\nそして1992年、千葉で新しいシーズンが始まった。==現在のZOZOマリンスタジアムにあたる千葉マリンスタジアムも、1992年からマリーンズの本拠地になった==のだ。\n\n## おもしろエピソード\n1992年は、ピンク色を基調にしたユニフォームで戦い、前半戦の勢いが**「ピンク旋風」**と呼ばれた。==今の白と黒のイメージとはかなり違う時代から、千葉での歴史が続いている==のだ。\n\n## 今日の試合で見るなら\n今日、**山口航輝**たちが「千葉ロッテマリーンズ」としてZOZOマリンで戦うのは、この1992年の移転から続く流れだ。==球場名や選手は変わっても、「千葉のロッテ」という土台は30年以上続いている==と覚えるといい。"}, "7-01": {"meta": {"id": "7-01", "title": "スタジアムの歴史やエピソードは？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "children": ["7-01-a", "7-01-b"], "related": ["7-02", "7-05"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/00006829.html", "https://npb.jp/bis/scores/nipponseries/linescore2005.html", "https://npb.jp/bis/2026/stats/idb1_m.html"]}, "body": "## ひとことで\nZOZOマリンスタジアムは1990年に完成し、ロッテが1992年から本拠地にしている球場だ。名前は変わっても、幕張でマリーンズを見続けてきた場所なのだ。\n\n## しくみ\n球場が完成したのは1990年2月22日だ。ロッテがここで初めて公式戦をしたのは1991年7月31日の西武戦だった。\n\n当時のロッテはまだ川崎を本拠地にしていた。1992年から千葉へ移り、この球場を本拠地として使い始めたという流れだ。\n\n現在のグラウンドは両翼（本塁から左右の外野フェンスまで）99.5m、センター（本塁から中堅の一番奥まで）122.0m。人工芝の屋外球場なので、風や空の変化まで観戦の一部になる。\n\n## 歴史・由来\nもとの正式名称は「千葉マリンスタジアム」だ。その後、施設命名権（企業が球場名を付ける権利）によって「QVCマリンフィールド」、さらに「ZOZOマリンスタジアム」へ変わった。\n\n## おもしろエピソード\n2005年の日本シリーズ（その年の日本一を決める試合）では、千葉マリンで行われた第1戦をロッテが10対1、第2戦を10対0で勝った。そのまま4連勝し、31年ぶりの日本一になっている。\n\n2021年8月31日には、この球場でのロッテ通算1000勝も達成した。長く使われているからこそ、節目の記録が同じ場所に積み重なっているのだ。\n\n## 今日の試合で見るなら\n今日の山口航輝は今季32本塁打（ホームラン）。もし33号が出れば、あなたが見ている球場の歴史にまた一つ新しい場面が加わる。古い名場面も、最初は目の前の一球だったというわけだ。"}, "7-02-a": {"meta": {"id": "7-02-a", "title": "何人入るの？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-02", "7-11"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式の施設概要では、ZOZOマリンスタジアムの収容人数は29,645人だ。\n\n## しくみ\n「収容人数」は、球場に入れる観客の規模を示す数字だ。ZOZOマリンは約3万人なので、満員に近づくと一つの小さな町のような人数が同じ場所に集まる。\n\nただし、実際の入場者数は試合ごとに違う。収容人数は「毎試合この人数が来る」という意味ではないのだ。\n\n## 今日の試合で見るなら\n今日の日本ハム戦では、山口航輝や清宮幸太郎の打席で場内の声がどれだけ広がるか聞いてみるとよい。約3万人規模の客席が一斉に反応すると、テレビとは違う球場の大きさを体で感じやすい。"}, "7-02-b": {"meta": {"id": "7-02-b", "title": "ホームランラグーンって？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-02", "2-03", "7-11"], "sources": ["https://www.marines.co.jp/news/detail/00003086.html", "https://www.marines.co.jp/news/detail/00003818.html", "https://npb.jp/bis/2026/stats/idb1_m.html", "https://npb.jp/bis/2026/stats/bat_p.html"]}, "body": "## ひとことで\nホームランラグーンは、2019年に外野へせり出す形で作られた観客席だ。ライト側151席、レフト側151席が設けられた。\n\n## しくみ\nそれまで選手がプレーしていた外野の一部に客席を作り、フェンスをホーム側へ近づけた形だ。だから「外野席のさらに前で見る席」と考えると分かりやすい。\n\n球団は、ホームランボールを捕れるかもしれない位置にいることを特徴として案内している。打球が飛んできたときは観戦より安全確保が先なのだ。\n\n## 今日の試合で見るなら\n山口航輝は32本塁打、清宮幸太郎は23本塁打で今日を迎える。二人の大きな打球が外野へ上がったら、通常の外野席より前に張り出したホームランラグーンの位置まで届くかを見るとよい。"}, "7-02-c": {"meta": {"id": "7-02-c", "title": "座席の種類は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-02", "7-11"], "sources": ["https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/news/detail/202500721662.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンの席は、**バックネット裏・内野・外野**を基本に、グラウンドに近い席やテーブル付きの席などへ細かく分かれている。==席名は「どこから見るか」を表す地図のようなものなのだ。==\n\n## しくみ\n2026年の球団公式価格表では、バックネット裏にGⅠ・VS・SS、内野のフロア2にフィールドウイングやS・A系、フロア4にパノラマカウンター・シートや**内野指定席B**などがある。外野にはホーム側とビジター側の応援指定席がある。\n\nさらに、2026年はピクニックボックスのリニューアルや、フィールドウイングエリアのグループ席新設なども行われた。==同じ球場でも「近さ」「高さ」「応援の雰囲気」で体験が変わる==というわけだ。\n\n## 今日の試合で見るなら\n今日の席は**1塁側の内野指定席B**で、公式価格表ではフロア4の内野席に分類される。==まず自分の席が「内野・フロア4」だと分かれば、案内表示を追いやすい。==\n\n18時に試合が始まったら、ロッテ先発の**アンドレ・ジャクソン**と日本ハム先発の**福島蓮**を、同じ座席からじっくり見比べればよい。"}, "7-02": {"meta": {"id": "7-02", "title": "スタジアムの施設概要は？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "children": ["7-02-a", "7-02-b"], "related": ["7-01", "7-03", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/00003818.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンは、約3万人が入る屋外の人工芝球場だ。海に近く、グラウンドと客席の距離を縮める席も増やされてきたのだ。\n\n## しくみ\n球団公式の施設概要では、収容人数は29,645人。グラウンドは両翼（本塁から左右の外野フェンスまで）99.5m、センター（本塁から中堅の一番奥まで）122.0mで、透水性（水を通しやすい性質）の人工芝が使われている。\n\n屋根で全体を覆うドームではない。空が開いているため、雨や風の影響を受ける一方、夕方から夜へ変わる空や海風もそのまま感じる球場だ。\n\n大きな映像装置は、バックスクリーンのメインスクリーンに加え、レフト・ライト側にもある。上空と地上の風速を表示する風速計も設置されているので、プレーと風を結びつけて見られるのが特徴だ。\n\n2019年には、観客がグラウンドに近づける新しい席が増えた。その一つが外野の「ホームランラグーン」で、従来は選手がプレーしていた区域の一部を観客席にしたものだ。\n\n## 歴史・由来\n完成は1990年。本拠地として使い始めた1992年から改修を重ね、2018年には野球専用の人工芝へ張り替え、2019年には新席種を増設した。\n\n## 今日の試合で見るなら\n先発のアンドレ・ジャクソンと福島蓮が投げるときは、ビジョンだけでなく風速表示も見てみるとよい。山口航輝や清宮幸太郎の大きな打球が上がったら、外野フェンスとホームランラグーンまでの距離感も観察すると、この球場の形がよく分かる。"}, "7-03-a": {"meta": {"id": "7-03-a", "title": "球場の外の広場には何がある？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-03", "7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/news/detail/202600934314.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日の球場外周には、**キッチンカー、TEAM26ブース、ボールパークステージ**などがある。==入場前の待ち時間も、外周を一周すると小さなイベント会場のように使えるのだ。==\n\n## しくみ\n9月28日の球団公式案内では、**15:00**に外周ケータリングカーとTEAM26ブースが営業開始。さらに==16:20からボールパークステージ==、16:30からM☆Splash!!のダンスショーが予定されている。\n\nこの日は外周グルメエリアにPOP UPキッチンカーも出店する。球場の外なので、席へ向かう前に食事やイベントを見てから入場する流れを作りやすいのだ。\n\n## 今日の試合で見るなら\n==16:00の開場前後は、外周と入場のどちらに時間を使うか決めておく==と動きやすい。18:00からは**アンドレ・ジャクソン**と**福島蓮**の先発で試合が始まるので、外周を楽しむなら開始前に席へ移ればよい。"}, "7-03-b": {"meta": {"id": "7-03-b", "title": "海が見える場所は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-03", "7-04"], "sources": ["https://www.city.chiba.jp/bayside/makuhari-hama.html", "https://www.city.chiba.jp/sogoseisaku/miraitoshi/makuhari/makuharisintoshin_enjoy.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n海そのものを見たいなら、ZOZOマリンに隣接する**幕張の浜**が公式情報で確認できる場所だ。==球場内の特定の座席から海が見える、と公式に保証された案内は確認できない。==\n\n## しくみ\n千葉市は、幕張の浜を**幕張海浜公園やZOZOマリンスタジアムに隣り合う海辺**として案内している。幕張海浜公園の前面にある人工海浜で、散策できる場所なのだ。\n\nだから「海を見たい」という目的なら、==座席から見えることを期待するより、外にいる時間に幕張の浜へ行く方が確実==だ。なお、幕張の浜は遊泳禁止なので、海水浴をする場所ではない。\n\n## 今日の試合で見るなら\n今日は**16:00開場、18:00試合開始**だ。==海を見るなら入場前など球場の外にいる時間に回し、試合開始までには席へ戻る==とよい。\n\n席に着いたら、通算100本塁打まであと1本の**清宮幸太郎**の打席に注目すると、今日ならではの見どころにつながるのだ。"}, "7-03": {"meta": {"id": "7-03", "title": "スタジアムの名所、隠れ名所は？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["7-01", "7-02", "7-06"], "sources": ["https://www.marines.co.jp/stadium/stadiuminquiry/", "https://www.marines.co.jp/special/70th/event.html", "https://shop.marines.co.jp/shop/detail?real_shop_id=1", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n初めてなら、球場外周の「6冠モニュメント」と「マリーンズストア ミュージアム店」を見ておくとよい。どちらも球団公式で現在の案内を確認できる場所だ。\n\n## しくみ\n6冠モニュメントは球場外周にある。球団公式のインフォメーション案内でも「外周 6冠モニュメント付近」と場所の目印に使われているので、待ち合わせの基準にもなる。\n\n「6冠」は、ロッテが2005年に日本一を含む六つのタイトルを獲得したシーズンに由来する。球団の70周年企画でも、このモニュメントを2005年の歴史を振り返る場所として扱っている。\n\nもう一つは、スタジアム外の大型グッズ店「マリーンズストア ミュージアム店」だ。2026年9月28日は13時から、試合終了30分後まで営業予定で、最長でも22時までと公式に案内されている。\n\n名前に「ミュージアム」とあるが、現在の公式案内では大型グッズショップとして紹介されている。昔の展示施設だと思い込まず、「球場の外にある大きな公式ショップ」と考えるのが正確だ。\n\n## おもしろエピソード\n2005年は、31年ぶりの日本一を含む「6冠」の年だった。いま球場へ来ると、そのシーズンの記憶が外周の名前として残っているわけだ。\n\n## 今日の試合で見るなら\n山口航輝の33号や清宮幸太郎の通算100号（プロ入りから数えて100本目の本塁打）候補を見届ける前に時間があるなら、外周を一周して6冠モニュメントを確認しておくとよい。今日の一打も、将来こうした球場の歴史として語られる可能性がある。"}, "7-04-a": {"meta": {"id": "7-04-a", "title": "なぜ海風がすごいの？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-04", "7-04-b"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://www.jma.go.jp/jma/kishou/know/yougo_hp/kaze.html", "https://www.data.jma.go.jp/haneda-airport/weather_topics/wt_wind.html"]}, "body": "## ひとことで\n\nZOZOマリンは海に近い屋外球場で、海と陸の温度差から生まれる海風の影響を受けやすいのだ。ただし、毎日必ず強風になるわけではない。\n\n## しくみ\n\n陸は海より温まりやすく、日中は陸側の気温が上がりやすい。気象庁によると、この温度差で気圧の差ができると、海から陸へ「海風」が吹く。\n\nZOZOマリンの海側には幕張の浜がある。球団公式も花火の案内で「海側からの風」を想定しており、風向によって打ち上げ位置を変えている。\n\nもちろん、風の強さは海風だけで決まらない。天気全体の風が重なれば強くなるし、弱い日もあるというわけだ。\n\n## 今日の試合で見るなら\n\n今日の先発はロッテがジャクソン、日本ハムが福島蓮だ。試合前に旗や選手のユニホームの揺れ方を見ておくと、投球が始まる前から「今日は風が強い日か」をつかみやすい。"}, "7-04-b": {"meta": {"id": "7-04-b", "title": "風がプレーにどう影響する？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-04", "2-03-b"], "sources": ["https://www.daily.co.jp/baseball/2026/05/01/0020307867.shtml", "https://npb.jp/news/detail/20230725_02.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\nいちばん分かりやすく影響を受けるのは、高く上がった打球なのだ。風でフライが横へ流れたり、伸びたり、逆に押し戻されたりする。\n\n## しくみ\n\n打球が空中にいる時間が長いほど、風を受ける時間も長くなる。ZOZOマリンでは、2026年5月1日の西武戦で上空で風速19m/s（1秒に19メートル進む速さの風）を記録し、打者が構えを保てずタイムを取ったり、選手の帽子が飛ばされたりする様子も報じられている。\n\nホームラン級の打球でも安心はできない。山口航輝は2023年、ZOZOマリンで本塁打を打ったあと、高い弾道だったので「風で戻されると思った」という趣旨のコメントを残している。\n\nだから外野手が一直線に走らず、細かく位置を直していたら、風を計算している可能性が高いのだ。\n\n## 今日の試合で見るなら\n\n山口航輝は今日、32本塁打でリーグ2位タイだ。33号を狙える大きな打球が上がったら、ボールと一緒に外野手の足取りも見るといい。風が一打の結果を変える瞬間が見えるかもしれない。"}, "7-04-c": {"meta": {"id": "7-04-c", "title": "なぜ人工芝なの？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/news/detail/00002091.html", "https://www.marines.co.jp/news/detail/00000786.html", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nZOZOマリンは**人工芝**の球場だ。==2018年に、天然芝に近い感覚を目指した野球専用の人工芝へ張り替えられた==のだ。\n\n## しくみ\n球団公式によると、この人工芝は「MSCraft BaseballTurf」。芝葉に特殊な加工をして、選手の足元の横ぶれを抑え、プレーを安定させる設計なのだ。芝の表面で光を散らし、照り返しも減らしている。\n\n2017年に球団と千葉市が張り替えを計画したときは、**選手のダイナミックなプレー**と、観戦をより楽しめることが目的に挙げられた。==「人工芝だから管理が楽」という説明を球団公式はしていないので、そこは理由として決めつけない==のだ。\n\n![ZOZOマリンスタジアムの人工芝グラウンド](https://upload.wikimedia.org/wikipedia/commons/5/57/ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_%E5%86%85%E6%99%AF.jpg \"出典：Wikimedia Commons／Stantonharuka／CC BY-SA 4.0\")\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**や**福島蓮**が打たせたゴロでは、野手が人工芝の上でどう踏ん張って捕り、送球するかを見るといい。==打球だけでなく、捕る直前の足運びまで見ると、この球場の人工芝が「プレーする場所」だと実感しやすい==のだ。"}, "7-04": {"meta": {"id": "7-04", "title": "スタジアムの特徴は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "children": ["7-04-a", "7-04-b"], "related": ["7-02", "7-08"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.marines.co.jp/stadium/ballpark/guideline_fire.html", "https://www.jma.go.jp/jma/kishou/know/yougo_hp/kaze.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\nZOZOマリンスタジアムは、屋外で海の近くにあり、風を強く意識する球場なのだ。人工芝のグラウンドと海風が重なり、打球の行方まで観戦の見どころになる。\n\n## しくみ\n\n球団公式によると、マリーンズは1992年からこの球場を本拠地にしている。グラウンドは人工芝で、2018年に野球専用の人工芝へ張り替えられた。\n\nもう一つの大きな特徴が風だ。球場の海側には幕張の浜があり、球団も花火の打ち上げ場所を決めるときに「海側からの風」を考慮している。海沿いの屋外球場なので、風は背景ではなく試合の条件の一つなのだ。\n\n気象庁の説明では、海風（昼間に海から陸へ吹く風）は、海と陸の温まり方の差で生まれる。ただし、いつも同じ向き・強さで吹くわけではない。その日の広い範囲の風や天気でも変わる。\n\n## おもしろエピソード\n\nZOZOマリンでは、花火さえ風向きの影響を受ける。球団公式では、海側から風が吹く場合、打ち上げ位置を変えることがあるとしている。グラウンドだけでなく、演出まで風と付き合っている球場なのだ。\n\n## 今日の試合で見るなら\n\n今日はロッテの山口航輝が32本塁打（ホームラン）でパ・リーグ2位タイ（2位に並んでいる状態）にいる。大きな打球が上がったら、打った瞬間から、風に押されるのか伸びるのかまで見ておくといい。\n\n守る側も同じだ。高いフライ（高く打ち上げた打球）が上がったとき、野手が早めに落下地点へ入れるかを見ると、ZOZOマリンらしさが分かりやすい。"}, "7-05-a": {"meta": {"id": "7-05-a", "title": "ドームと屋外球場の違いは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-05", "7-04", "7-08"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.tokyo-dome.co.jp/dome/about/"]}, "body": "## ひとことで\nいちばん大きな違いは、空と天候をそのまま受けるかどうかだ。ZOZOマリンは屋外、東京ドームは屋根に覆われた全天候型なのだ。\n\n## しくみ\n屋外球場では、雨、風、気温、日差しが試合に入り込む。ZOZOマリンでは風速計まで設置されていて、風が観戦の重要な情報になる。\n\n東京ドームは屋根で覆われ、公式にも「全天候型」と案内されている。天候の影響を受けにくい一方、屋外球場のように空の色や自然の風をそのまま感じる場所ではない。\n\nなお、「ドームなら人工芝」「屋外なら天然芝」と決まっているわけではない。屋根と芝は別の条件だ。\n\n## 今日の試合で見るなら\n今日、山口航輝や清宮幸太郎が高いフライを打ったら、打球だけでなく風速表示も見てみるとよい。ドームなら意識しにくい「風もプレーの条件」という感覚が、ZOZOマリンでは分かりやすい。"}, "7-05-b": {"meta": {"id": "7-05-b", "title": "日本ハムの本拠地エスコンフィールドとの違いは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-05", "7-02", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.hkdballpark.com/about/esconfield/"]}, "body": "## ひとことで\nZOZOマリンは屋外・人工芝。エスコンフィールドHOKKAIDOは開閉式屋根・天然芝だ。日本ハムの選手は、今日は普段とかなり違う環境で戦うのだ。\n\n## しくみ\nエスコンフィールドは2023年に開業し、収容人数は3万5000人。公式には「日本初の開閉式屋根付き天然芝球場」と案内されている。\n\nZOZOマリンは収容29,645人で、屋根のない人工芝球場だ。海風が直接入り、上空と地上の風速表示もある。\n\nエスコンは屋根を閉じられるので、天候への対応方法が違う。天然芝を育てるため、南側には大きなガラス壁も設けられている。\n\n## 今日の試合で見るなら\n福島蓮、清宮幸太郎、万波中正たち日本ハム勢は、今日はエスコンではなくZOZOマリンでプレーする。外野フライや長打が上がったとき、海風のある屋外での守備や打球の伸び方に注目すると違いが見えやすい。"}, "7-05-c": {"meta": {"id": "7-05-c", "title": "12球団の本拠地はどこ？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-05"], "sources": ["https://npb.jp/stadium/franchise.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nプロ野球12球団には、それぞれ基本となる**本拠地球場**がある。==今日のZOZOマリンはロッテの本拠地で、日本ハムは北海道から来るビジターチームなのだ。==\n\n## しくみ\n2026年のNPB公式一覧では、本拠地は次の通りだ。\n\n- 日本ハム：**エスコンフィールドHOKKAIDO**\n- 楽天：楽天モバイル 最強パーク宮城\n- 西武：ベルーナドーム\n- ロッテ：**ZOZOマリンスタジアム**\n- オリックス：京セラドーム大阪\n- ソフトバンク：みずほPayPayドーム福岡\n- 巨人：東京ドーム\n- ヤクルト：明治神宮野球場\n- DeNA：横浜スタジアム\n- 中日：バンテリンドーム ナゴヤ\n- 阪神：阪神甲子園球場\n- 広島：MAZDA Zoom-Zoom スタジアム広島\n\n==「ホーム」は、その球団が主催する側だと考えると分かりやすい。==\n\n## 今日の試合で見るなら\n今日は**ロッテがホームで1塁側、日本ハムがビジターで3塁側**だ。==球場がロッテ色なのは、ここがロッテの本拠地だからなのだ。==\n\n日本ハムの**福島蓮**にとっては、普段のエスコンフィールドHOKKAIDOではなくZOZOマリンで投げる試合になる。"}, "7-05": {"meta": {"id": "7-05", "title": "他にどんなスタジアムがあるの？どう違うの？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "children": ["7-05-a", "7-05-b"], "related": ["7-02", "7-04"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guide.html", "https://www.tokyo-dome.co.jp/dome/about/", "https://www.hkdballpark.com/about/esconfield/", "https://koshien.hanshin.co.jp/stadium_guide/seat.html"]}, "body": "## ひとことで\nプロ野球の球場は、屋根の有無、芝の種類、客席とグラウンドの距離などがかなり違う。同じ野球でも、球場が変わると見え方や音、天候の影響まで変わるのだ。\n\n## しくみ\nZOZOマリンは屋外・人工芝で、収容人数は29,645人。海に近く、風や雨の影響を受ける球場だ。\n\n一方、東京ドームは屋根で覆われた全天候型で、2026年に人工芝を更新している。雨天でも屋根の下で試合を行えるのが大きな違いだ。\n\n阪神甲子園球場のように屋外で長い歴史を持つ球場もある。さらに、日本ハムのエスコンフィールドHOKKAIDOは開閉式屋根と天然芝を組み合わせている。\n\nつまり、「ドームか屋外か」の二つに分けるだけでは足りない。屋根が開く球場、人工芝の球場、天然芝の球場など、設計の組み合わせが違うのだ。\n\n## おもしろエピソード\n球場の違いは、選手のプレーにも観客の体験にも出る。屋外なら風向きを読む場面があり、屋根付きなら天候の影響を抑えやすい。天然芝と人工芝では、見た目や打球の転がり方の感覚も変わる。\n\n## 今日の試合で見るなら\n福島蓮たち日本ハムの選手は、普段はエスコンフィールドHOKKAIDOを本拠地としている。今日は屋外のZOZOマリンだ。福島の投球や外野フライが海風の中でどう見えるかを意識すると、「球場が変わる」意味が分かりやすい。"}, "7-06-a": {"meta": {"id": "7-06-a", "title": "名物メニューは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-06", "7-06-b"], "sources": ["https://www.marines.co.jp/gourmet/regular/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\nまず見るなら、球団が「ZOZOマリンスタジアム定番メニュー」として紹介している料理が分かりやすい。今日はマリンクリームセウやマリンチーズステーキドッグが公式イベントページにも載っている。\n\n## しくみ\n\nマリンクリームセウは、えびを使った球場グルメで1,300円。SHRIMP STAND 203で販売されている。マリンチーズステーキドッグは、今日の公式案内では1,200円だ。\n\n「名物」といっても一つだけではない。球団公式の定番メニュー一覧から、丼、麺、軽食など、そのとき食べたいものを選ぶのが実用的なのだ。\n\n## 今日の試合で見るなら\n\n山口航輝の33号を見逃したくないなら、打席が始まってから売店へ動くのは避けたい。16:00の開場後、試合開始前に定番メニューを確保しておけば、18:00からはグラウンドに集中しやすい。"}, "7-06-b": {"meta": {"id": "7-06-b", "title": "選手コラボメニューは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-06", "7-06-a"], "sources": ["https://www.marines.co.jp/gourmet/players_menu/", "https://www.marines.co.jp/gourmet/players_menu/player51.html", "https://npb.jp/bis/2026/stats/llb_p.html"]}, "body": "## ひとことで\n\nマリーンズの選手名や好み、プレースタイルに合わせた「PLAYERS COLLAB MENU」がある。食べ物をきっかけに、知らなかった選手の名前を覚えられる仕組みなのだ。\n\n## しくみ\n\n球団公式では、選手へのアンケートをもとに、好きな食べ物やこだわりを反映したメニューを販売している。\n\n山口航輝なら、公式ページに次のようなメニューが載っている。\n\n- 「ぐっさんの豪快おろしぶっかけうどん」1,100円\n- 「ぐっさんの炙りチャーシュー丼」1,700円\n- 「山口航輝の豪快3ランHRグリル」1,300円\n\nほかにもメニューがあり、公式ページでは名前と一緒に販売店も確認できる。\n\n## 今日の試合で見るなら\n\n山口は32本塁打でパ・リーグ2位タイ。33号が出れば単独2位になる。先に「豪快3ランHRグリル」を食べてから本人の打席を見ると、メニュー名とプレーがそのままつながるというわけだ。"}, "7-06-c": {"meta": {"id": "7-06-c", "title": "モバイルオーダーは使える？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-06", "7-06-a"], "sources": ["https://www.marines.co.jp/gourmet/mobileorder/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n\n使える。会員登録や専用アプリは不要で、スマホから注文と決済を済ませ、完成通知が来たら対応店舗へ受け取りに行く仕組みなのだ。\n\n## しくみ\n\n注文ページはMARINES APP、TEAM26マイページ、球場内ポスターのQRコードなどから開ける。通知にはメールアドレス、LINEアカウント、電話番号のどれか一つを使う。\n\n支払いは各種クレジットカードとPayPayに対応している。公式案内の営業時間は開場20分前から8回裏終了まで。ただし、混雑時は新規注文を一時停止する場合がある。\n\n全部の店が対象ではないので、注文ページに出る対応店舗と商品から選ぶことになる。\n\n## 今日の試合で見るなら\n\n山口航輝の打席をなるべく見逃したくないなら、売店の列に並ぶ時間を減らせるのは便利だ。完成通知が来てから受け取りへ動けば、試合の流れに合わせて席を立ちやすい。"}, "7-06": {"meta": {"id": "7-06", "title": "ご飯はどういうのがあるの？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "children": ["7-06-a", "7-06-b", "7-06-c"], "related": ["7-06-a", "7-06-b", "7-06-c"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/gourmet/", "https://www.marines.co.jp/gourmet/regular/", "https://www.marines.co.jp/news/detail/202600934314.html"]}, "body": "## ひとことで\n\nZOZOマリンのご飯は、定番の球場グルメ、選手コラボ、球場外周のキッチンカーまでかなり幅が広いのだ。今日は日本ハム戦だけのPOP UPグルメもある。\n\n## しくみ\n\n球団公式のグルメ案内には、丼、麺、肉料理、軽食、スイーツ、ドリンクなど多くの店が載っている。球場内だけでなく外周グルメエリアにも店があるので、「席に入ってから探す」より、先に食べたいものを決めておくほうが分かりやすい。\n\n9月28日の公式イベントページで紹介されている定番は、マリンチーズステーキドッグ1,200円、マリンクリームセウ1,300円、マリーンズビール950円だ。\n\nさらに今日は、9月27・28日の日本ハム戦限定で外周にPOP UPキッチンカーが出る。球団公式の案内では、日本ハムの「シャウエッセンキッチンカー」が田宮裕涼選手にちなんだチーズドッグ（1,000円）、「IZAKAYAとぽす」が万波中正選手にちなんだカレー（1,380円）、「甲子園カレー by CURRY STAND 極」が甲子園カレー（900円）を売る。\n\n外周ケータリングカーの営業開始は15:00、開場は16:00だ。球場に着く時間によって、外で先に食べるか、入場後に球場内で買うかを選べるというわけだ。\n\n## おもしろエピソード\n\n相手が日本ハムだからこそ、日本ハムの「シャウエッセンキッチンカー」がZOZOマリンに来る。ホーム球場の料理だけでなく、対戦相手側の味まで楽しめる日なのだ。\n\n## 今日の試合で見るなら\n\n今日は山口航輝の33号本塁打がかかる試合だ。打席を見逃したくないなら、試合開始直前よりも早めに食事を確保しておくと動きやすい。\n\n18:00の試合開始までに食べるなら、15:00からの外周キッチンカーか、16:00の開場後の球場内グルメを使うと流れを作りやすい。"}, "7-07-a": {"meta": {"id": "7-07-a", "title": "開場（16:00）から試合開始までに何がある？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n16:00の開場後は、16:20のステージ開始から17:55頃の選手登場まで、だんだん試合モードに切り替わっていくのだ。\n\n## しくみ\n球団公式の今日の予定では、16:20にボールパークステージが始まり、16:30からM☆Splash!!のダンスショーがある。\n\n場内では17:20頃に「MARINES ROSTER」でベンチ入り選手を紹介。17:25頃にDJ、17:30頃に観戦ポイントなどを紹介する「Warm Up Show」が続く。\n\n17:45頃には山口航輝の8月度月間MVP表彰式、17:55頃には照明や映像を使った選手登場とスタメン紹介があり、18:00に試合開始だ。\n\n## 今日の試合で見るなら\n山口の表彰式を見たいなら17:45より前に着席しておくとよい。山口は今日33号本塁打（ホームラン）が出れば、リーグ単独2位になる。その山口をまず表彰式で見て、それから試合へ入る流れになるのだ。"}, "7-07-b": {"meta": {"id": "7-07-b", "title": "試合中（5回終了後・7回など）は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n試合中のイベントは、攻守交代の短い時間に次々入る。特に5回前後と7回表後を覚えておけば、初心者でも流れをつかみやすいのだ。\n\n## しくみ\n今日は2回表後（2回表の攻撃が終わったあと）にバズーカ、3回表後にキャップシャッフル、4回表後に36秒チャレンジが予定されている。\n\n5回表後は「スマドリ乾杯タイム」。5回裏後は一斉水分補給タイムと「オドロッテ」、6回表後は「DASHMAN RACE」だ。\n\n7回表後は「MARINES LUCKY 7」で、球団歌「WE LOVE MARINES」に合わせてタオルを掲げる。8回表後は電子トレカの番号発表、9回表後は条件が合う場合だけ「GRAB THE WIN」が行われる。\n\n## 今日の試合で見るなら\n清宮幸太郎の通算100本塁打や山口航輝の33号が出るかを追いながら、攻守交代になったらビジョンを見るとよい。5回と7回は、試合そのものとは別の球場らしさが分かりやすく出る時間なのだ。"}, "7-07-c": {"meta": {"id": "7-07-c", "title": "試合後は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-07"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n今日、ロッテが勝った場合は「MARINES WINNING CEREMONY」がある。敗戦時に同じ内容を行うとは公式ページに書かれていないのだ。\n\n## しくみ\n勝利時のセレモニーでは、球場を暗くして試合のハイライト映像を流し、ヒーローインタビューを行う。\n\n「MARINESペンライト2026」は音楽に合わせて点滅する。さらにビジョンのQRコードを読み込むと、スマートフォンのライトも音楽に合わせて点滅する案内になっている。\n\nつまり、最後のアウトで終わりではない。ロッテが勝った日は、そこから数分間「勝った試合を振り返る時間」が続くのだ。\n\n## 今日の試合で見るなら\nアンドレ・ジャクソンが勝てば10勝目だ。山口航輝が決勝打（勝ちを決めた一打）を打つような展開なら、試合後のヒーローインタビューまで残るとよい。その日の物語が一続きで見えるというわけだ。"}, "7-07-d": {"meta": {"id": "7-07-d", "title": "今日の「秋の夜空にみんなで叫ぼう！特別招待」って？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-07"], "sources": ["https://m-ticket-rsv.marines.co.jp/2026akinoyozora/"]}, "body": "## ひとことで\n「2026 秋の夜空にみんなで叫ぼう！特別招待」は、試合中に行う特別イベントの名前ではなく、対象試合の観戦チケットを抽選で招待する企画だ。\n\n## しくみ\n公式の申込ページでは、マリーンズID1つにつき1試合まで申し込め、1回の申込は2枚。対象席は「内野指定席（フロア4）」で、招待価格は0円と案内されている。\n\n座席の細かな位置は抽選申込時には指定できない。つまり「特別招待」という言葉は、特別な観戦席で何かを叫ぶ催しではなく、通常の試合観戦へ招待する仕組みを指しているのだ。\n\n## 今日の試合で見るなら\n今日のロッテ対日本ハムもこの企画の対象だ。席に着いた後のイベント内容は、ほかの観客と同じ今日のタイムテーブルに沿って進む。17:45頃の山口航輝の表彰式や、7回表後のラッキー7もそのまま楽しめるのだ。"}, "7-07": {"meta": {"id": "7-07", "title": "いつのタイミングでどんなイベントがあるの？（9/28）", "category": "7", "level": "1", "priority": "star", "needs_check": false, "children": ["7-07-a", "7-07-b", "7-07-c", "7-07-d"], "related": ["7-08"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n今日は、16:00の開場後から試合前のステージや選手紹介が続き、試合中はイニングの切れ目ごとに短いイベントが入る。ロッテが勝った場合は、試合後にも勝利セレモニーがあるのだ。\n\n## しくみ\nイベントは、基本的にプレーが止まる「イニング間（攻守交代の時間）」に組まれている。だから、打者が打っている最中に突然ショーが始まるわけではない。\n\n16:20から外周のボールパークステージが始まり、17:20頃からは場内でベンチ入り選手紹介、DJ、観戦ポイント紹介と続く。17:55頃には映像や照明とともにロッテの選手が守備につき、スタメンが紹介され、18:00に試合開始だ。\n\n試合中は2回表後から9回表後まで、バズーカ、ゲーム、乾杯、水分補給、ダンス、レース、ラッキー7などが予定されている。7回表後の「MARINES LUCKY 7」では球団歌「WE LOVE MARINES」に合わせてタオルを掲げる。\n\n## おもしろエピソード\n今日は17:45頃に、山口航輝の2026年8月度「大樹生命月間MVP賞」表彰式もある。試合とは別に、今季32本塁打まで伸ばした打者が表彰される場面を見られるのだ。\n\n## 今日の試合で見るなら\n山口の表彰を見たいなら、17:45より前には席に着いておくとよい。その後17:55頃の選手登場から、そのままアンドレ・ジャクソンの先発する試合へつながる。\n\n試合中は5回表後の乾杯、7回表後のラッキー7が大きな目印だ。ロッテが勝てば、試合後の「MARINES WINNING CEREMONY」でハイライト映像やヒーローインタビューまで続くのだ。"}, "7-08-a": {"meta": {"id": "7-08-a", "title": "夜の海風対策は？（上着・ひざ掛け）", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-08"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/news/detail/00000651.html"]}, "body": "## ひとことで\n風を止める上着を1枚持ち、座って寒くなったらひざ掛けを足すのが簡単だ。今日は雨の可能性もあるので、「ぬれないこと」も防寒になるのだ。\n\n## しくみ\nZOZOマリンは球団が「ベイエリア特有の強風」を名物として紹介してきた屋外球場だ。夜は日差しがなくなり、観戦中は長く座るので、風が続くと体が冷えやすい。\n\nおすすめは、薄手の服の上に風を通しにくい上着を重ねること。暑ければ脱げるし、寒ければ閉じればよい。ひざ掛けは動かない脚を保温する役目だ。\n\n今日はNPB公式の日程表示で「くもり時々雨」。ぬれた服に風が当たるとさらに冷えるので、雨具と着替えやすい重ね着を組み合わせるとよい。\n\n## 今日の試合で見るなら\nアンドレ・ジャクソンと福島蓮の先発で18:00開始だ。山口航輝や清宮幸太郎の一発を終盤まで待つ展開でも、寒さで席を立たずに済むよう、上着はバッグの奥ではなく取り出しやすい場所に入れておくとよい。"}, "7-08-b": {"meta": {"id": "7-08-b", "title": "雨の予報のときは？（傘の扱い）", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "related": ["7-08"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/news/detail/202600768522.html", "https://www.marines.co.jp/news/detail/202300231437.html"]}, "body": "## ひとことで\n席では傘をささず、ポンチョやレインコートで観戦する。今日のように雨の可能性がある日は、試合が始まる前に雨具を出しておくと慌てないのだ。\n\n## しくみ\n球団は2023年の観戦ルール変更で、「傘をさしての観戦」を原則禁止とした。<!-- TODO: 確認（2026年の現行観戦ルールページに傘の記載が見当たらない。当日も有効か公式で確認） -->その際の説明で、傘は周囲の視界を遮り、ファウルボールなどによる事故の危険もあるため、雨天時はポンチョや雨合羽を使うよう案内している。\n\nだから、雨が降ってから狭い席で大きく荷物を広げるより、入場後に雨具の場所を確認しておくとよい。フード付きなら両手も空き、打球への注意もしやすい。\n\n## 今日の試合で見るなら\nNPB公式の日程表示は「くもり時々雨」だ。ジャクソンが投げている途中で降り始めても、傘を開かず雨具へ切り替えられるようにしておくと、プレーを見失いにくいのだ。"}, "7-08-c": {"meta": {"id": "7-08-c", "title": "何時に着くのがいい？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-08"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://www.marines.co.jp/stadium/access/"]}, "body": "## ひとことで\n初観戦なら、==**17:00ごろまでに入場**できると落ち着いて準備しやすい==。今日は16:00開場、18:00試合開始なのだ。\n\n## しくみ\n球団公式の今日の予定では、17:20ごろにベンチ入り選手紹介、17:30ごろに観戦案内、17:55ごろにロッテのスタメン紹介がある。席・トイレ・飲み物の場所を先に確認するなら、試合開始ぎりぎりより早い方が動きやすい。\n\n海浜幕張駅から球場までは公式案内で**徒歩約15分**、バスなら約6分だ。==駅に着く時刻ではなく、「球場に着く時刻」で逆算する==と迷いにくいのだ。\n\n## 今日の試合で見るなら\n今日は17:45ごろに**山口航輝**の月間MVP表彰式も予定されている。==表彰式とスタメン紹介まで見たいなら、17:20より前に席へ着いておく==と流れを追いやすい。\n\n野球だけを見たいなら18:00に間に合えばよいが、初めてなら少し余白を作る方が安心なのだ。"}, "7-08": {"meta": {"id": "7-08", "title": "どうすると過ごしやすい？", "category": "7", "level": "1", "priority": "star", "needs_check": true, "children": ["7-08-a", "7-08-b"], "related": ["7-07"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/news/detail/00000651.html", "https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/news/detail/202300231437.html"]}, "body": "## ひとことで\n今日は「くもり時々雨」の屋外ナイターだ。風を通しにくい上着と雨具を用意し、座って冷えてきたらひざ掛けを足す、という二段構えが過ごしやすいのだ。\n\n## しくみ\nZOZOマリンは球団自身が「ベイエリア特有の強風」を名物として紹介してきた球場だ。風があると、同じ気温でも体の表面から熱が逃げやすい。さらに服がぬれると冷えやすくなる。\n\nそこで、厚手の1枚だけに頼るより、薄手の服に風を通しにくい上着を重ねるほうが調整しやすい。座っている時間が長いので、ひざ掛けがあると脚の冷えも減らせる。\n\n雨対策は傘ではなく、ポンチョやレインコートが基本だ。球団は2023年の観戦ルール変更で「傘をさしての観戦」を原則禁止としている。<!-- TODO: 確認（2026年の現行観戦ルールページに傘の記載が見当たらない。当日も有効か公式で確認） -->\n\n## おもしろエピソード\n2017年には、球団が最大風速17mの試合を題材に「強風うちわ」を販売したこともある。風は困りものでもあり、ZOZOマリンらしさの一部でもあるのだ。\n\n## 今日の試合で見るなら\n17:45頃の山口航輝の表彰式から試合終了まで残るなら、屋外にいる時間はかなり長い。アンドレ・ジャクソンの10勝目や清宮幸太郎の通算100号が終盤まで持ち越されても集中できるよう、上着と雨具を先に手元へ出しておくとよい。"}, "7-09-a": {"meta": {"id": "7-09-a", "title": "ファウルボールが飛んできたら？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-09"], "sources": ["https://www.marines.co.jp/stadium/rule/fulltext.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n打球が上がったら、まず最後まで行方を見るのだ。ボールを取りに動き回るより、自分と周囲の安全を優先する。\n\n## しくみ\n球団の観戦契約では、練習中の球、本塁打、ファウルボール（打った球のうち、決められた範囲の外へ飛んだもの）などについて、観客自身が行方に注意するよう定めている。\n\nさらに、ボールを追いかけるなど、ほかの観客に危険を及ぼす行動は禁止されている。スマホや飲食物に目を向けていても、打者が構えたら一度グラウンドへ視線を戻すと安全につながるのだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝の打席で打球が上がったら、ホームランかどうかを判断する前に行方を追おう。スタンド方向へ来たときほど、ボールを取りに急いで動かないことが大切だ。"}, "7-09-b": {"meta": {"id": "7-09-b", "title": "持ち込めないものは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-09"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/stadium/rule/mintext.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n外で買った飲食物は、球団が認める一部を除いて持ち込めない。危険物やビン・缶、大型のクーラーボックスやスーツケースなどにも制限があるのだ。\n\n## しくみ\n飲み物で認められている主な例は、750ml以下のアルコールを除くペットボトル、水筒、紙パックだ。球場外周で販売された飲食物、乳幼児用の食事、中学生以下向けの適量のお菓子なども例外として案内されている。\n\n一方、クーラーボックスやスーツケースなどの大型荷物は持ち込めない。入場時には手荷物検査があるので、迷う物があるなら入場前に公式ルールを確認するのが確実だ。\n\n## 今日の試合で見るなら\n18:00の試合開始直前に入口で荷物を整理することになると、アンドレ・ジャクソンの立ち上がりを見逃しかねない。Cゲートへ向かう前に、飲み物や大きな荷物だけでも確認しておくといいのだ。"}, "7-09-c": {"meta": {"id": "7-09-c", "title": "再入場はできる？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-09"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n再入場はできる。ただし、退場するときに手の甲へ専用スタンプを押してもらい、戻るときにチケットとスタンプの両方を確認してもらう必要があるのだ。\n\n## しくみ\n球場の外へ出たいときは、出口で再入場のための手続きをする。球団公式では、退場時に手の甲へ専用スタンプを押し、再入場時にチケットとスタンプの印を確認すると案内している。\n\nつまり、いったん出るならチケットを持ったままにし、退場するときは必ずスタンプを押してもらうことだ。戻る予定があることを出口で意識しておけば迷いにくい。\n\n## 今日の試合で見るなら\n今日は16:00開場、18:00試合開始だ。入場後に外へ出るならこの手続きを使い、福島蓮がロッテ打線に投げる1回裏（ロッテの最初の攻撃）までに戻りたい場合は、再入場の確認時間も見込んで動くといいのだ。"}, "7-09": {"meta": {"id": "7-09", "title": "観戦時の注意点は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "children": ["7-09-a", "7-09-b", "7-09-c"], "related": ["7-10", "7-11"], "sources": ["https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/stadium/rule/fulltext.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n大事なのは、打球から目を切らないこと、持ち込みルールを守ること、再入場の手順を知っておくことだ。どれも球場で安心して過ごすための基本なのだ。\n\n## しくみ\nまず注意したいのがファウルボール（打った球のうち、決められた範囲の外へ飛んだもの）だ。球団の観戦契約では、練習中や試合中の打球の行方に気を配り、けがを避けるため十分に注意するよう定めている。ボールを追って、ほかの観客に危険が及ぶ行動をすることも禁止されている。\n\n持ち込みにも決まりがある。ZOZOマリンスタジアムでは、衛生管理やトラブル防止のため、飲食物は一部の例外を除いて持ち込めない。認められているものには、球場外周で購入した飲食物や、750ml以下のアルコールを除くペットボトル、水筒、紙パックなどがある。\n\n大きな荷物にも注意が必要だ。クーラーボックス、スーツケースなどの大型荷物は持ち込めず、外周のコインロッカー利用が案内されている。入場時には手荷物検査があり、拒否すると入場できない場合があるのだ。\n\nいったん外へ出る場合も、そのまま戻れるわけではない。退場時に手の甲へ専用スタンプを押してもらい、再入場時にチケットとスタンプを確認してもらう仕組みだ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝の打席では、打球が上がったら最後まで行方を追うといい。アンドレ・ジャクソンや福島蓮の立ち上がりを見逃したくないなら、入場前に荷物を整理し、再入場する予定があるなら手順も先に覚えておくと迷いにくいのだ。"}, "7-10-a": {"meta": {"id": "7-10-a", "title": "混むタイミングはいつ？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "related": ["7-10"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n「何回のあとが最も混む」といった具体的な混雑時間は、確認した球団公式情報には明記されていない。だから、経験則で空いている時間を断定しないのだ。\n\n<!-- TODO: 球団公式でトイレの具体的な混雑タイミングの明示を確認 -->\n\n## しくみ\n公式球場MAPではトイレなどの施設位置を確認できる。また、フロア4のインフォメーションは、試合日に開場から7回裏終了まで案内を行っている。\n\n混雑の山が公式に示されていない以上、「この回なら空いている」と決め打ちするのは避けたい。先に場所を把握し、必要になったときに迷わず動けるようにしておくほうが確実だ。\n\n## 今日の試合で見るなら\n清宮幸太郎や山口航輝の打席を見たいなら、特定の回が空くとは決めつけないほうがいい。16:00の開場後、試合開始までにフロア4のトイレ位置だけ先に確認しておくといいのだ。"}, "7-10-b": {"meta": {"id": "7-10-b", "title": "内野指定席Bに近いトイレは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-10"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\n今日の**内野指定席B**はフロア4の席種だ。==席に着いたら、公式球場MAPでフロア4のトイレを一つ先に確認しておく==のが確実なのだ。\n\n## しくみ\n球団公式の価格表では、内野指定席Bは**フロア4**に分類されている。公式球場MAPにもフロア4の男女トイレが表示されているので、まず自分が出入りする通路と近い表示を見ればいい。\n\nただし「内野指定席B」だけでは座る位置に幅があり、最寄りを一か所に決められない。==座席の列や番号を使わずに案内するなら、現地の通路表示と球場MAPで選ぶのが正確==なのだ。\n\n迷った場合、球団公式では**フロア4の408通路付近**にインフォメーションブースがあり、開場から7回裏終了まで案内している。\n\n## 今日の試合で見るなら\n18:00に**アンドレ・ジャクソン**が投げ始める前に、席から最寄りのトイレと戻る通路を一度だけ確認しておこう。==「行くときに探す」のではなく「最初に場所だけ覚える」==と、試合中に席を立つ時間を短くしやすいのだ。"}, "7-10-c": {"meta": {"id": "7-10-c", "title": "試合中にトイレに行くならいつがいい？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-10"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html"]}, "body": "## ひとことで\nロッテの攻撃をなるべく見たいなら、**表（ビジターが攻撃する半分）**の途中が候補だ。==今日は回と回の間にイベントが多いので、「○回表が終わった瞬間」は避けると見逃しを減らせる==のだ。\n\n## しくみ\n野球の**イニング（攻守1組の区切り）**は、表にビジター、裏にホームが攻撃する。今日は日本ハムが先攻、ロッテが後攻なので、表は日本ハム、裏はロッテの攻撃だ。\n\n球団公式の進行予定では、2〜9回の表終了後に演出が入る回が多い。5回表後には「スマドリ乾杯タイム」、7回表後には「MARINES LUCKY 7」が予定されている。==イベントも見たいなら、回が終わる前に席を立つより、表の途中で用を済ませて戻る方が組み立てやすい==のだ。\n\n## 今日の試合で見るなら\n表では**アンドレ・ジャクソン**が日本ハム打線に投げる。==ロッテの打席を優先するなら、ジャクソンが投げている表の途中を候補にし、裏が始まる前に戻る==と分かりやすい。\n\nただし、我慢する必要はない。行きたくなったときは試合展開より体を優先するのだ。"}, "7-10": {"meta": {"id": "7-10", "title": "トイレにすぐ行くには？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "children": ["7-10-a"], "related": ["7-09", "7-11"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nいちばん確実なのは、試合が始まる前にフロア4の公式球場MAPでトイレの位置を確認しておくことだ。今日の具体的な座席から「ここが最短」とまでは、公式情報だけでは決められないのだ。\n\n## しくみ\nZOZOマリンスタジアムの公式球場MAPには、フロアごとの施設が掲載されている。あなたの席は1塁側の内野指定席B、フロア4なので、まずフロア4の表示だけを見ると探す範囲を狭くできる。\n\n席に着いたら、最寄りのトイレを一度MAPで確認しておくといい。試合中に初めて探すより、「席を出る方向」と「戻る方向」を先に覚えておくほうが迷いにくいというわけだ。\n\n場所が分からなくなった場合は、球団公式がフロア4にもインフォメーションを設けている。試合日は開場から7回裏終了まで案内しているので、場内施設について確認できるのだ。\n\nただし、公式サイトでは各トイレまでの所要時間を座席別には示していない。列や座席番号を前提にした近道はここでは決めず、その場の案内表示と公式MAPを使うのが確実だ。\n\n## 今日の試合で見るなら\n今日は18:00開始なので、アンドレ・ジャクソンと福島蓮が投げ始める前に位置を確認しておくといい。清宮幸太郎や山口航輝の打席で急に席を立つことにならないよう、入場後の待ち時間を下見に使うと動きやすいのだ。"}, "7-11-a": {"meta": {"id": "7-11-a", "title": "Cゲート（コアラゲート）からの行き方は？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "related": ["7-11"], "sources": ["https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/ticket/season2026/owner.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nCゲート（公式名称は「C コアラのマーチ ゲート」）から入場したら、場内表示でフロア4を目指す。2026年の公式価格表では、内野指定席Bはフロア4の席種として載っているのだ。\n\n## しくみ\nまずCゲートで入場し、場内の「フロア4」の案内を追う。フロア4へ着いたら、球場MAPと場内の席案内を見て、自分のチケットに合う方向へ進めばいい。\n\n公式の公開情報だけでは、今日の座席まで使う階段や経路を一つに特定できない。だから「この階段が最短」とは決めず、現地表示に従うのが確実なのだ。\n\n## 今日の試合で見るなら\n18:00になると、まずアンドレ・ジャクソンが日本ハム打線に投げ、1回裏には福島蓮がロッテ打線に投げる。最初から見たいなら、開場後に一度フロア4まで上がり、席への流れを確認しておくといいのだ。"}, "7-11-b": {"meta": {"id": "7-11-b", "title": "ブルペンやベンチは見える？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "related": ["7-11"], "sources": ["https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日の1塁側・内野指定席Bから、ブルペン（登板前の投手が投球練習する場所）やベンチ（試合中の選手が待機する場所）がどの程度見えるかは、現在の球団公式情報だけでは断定できないのだ。\n\n<!-- TODO: 2026シーズンの1塁側・内野指定席Bからブルペン・ベンチへの実際の視界を球団公式で確認 -->\n\n## しくみ\n2026年の公式価格表で確認できるのは、内野指定席Bがフロア4の席種だというところまでだ。公式の席種案内には全体を見渡せる席という説明があるが、そのページは2025シーズン情報と明記されている。\n\n球場MAPには施設配置が載っていても、座席ごとの視線や死角までは示されていない。したがって、ブルペンやベンチが「よく見える」とは書かず、席に着いて実際の視界を確認するのが確実だ。\n\n## 今日の試合で見るなら\n益田直也が登板する展開になっても、準備中の姿を席から見られるとは断定しない。マウンドへ出てきた場面から注目すれば、登板そのものは試合の流れとして追えるのだ。"}, "7-11-c": {"meta": {"id": "7-11-c", "title": "1塁側から見やすいプレーは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-11"], "sources": ["https://www.marines.co.jp/ticket/seat/genelal/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式は**内野指定席B**を、フロア4から「球場とプレーの全体を見渡せる」席として案内している。==まずは、内野全体が動くゴロのプレーを追うと分かりやすい==のだ。\n\n## しくみ\n**ゴロ（地面を転がる打球）**では、打った人が一塁へ走り、内野手が捕って一塁へ送る場面が多い。1塁側なら、==「打球が転がる→野手が捕る→一塁へ送る」という流れを一続きのプレーとして意識する==と野球の動きが見えてくる。\n\n内野指定席Bについて、公式が説明しているのはフロア4から全体を見渡せることまでだ。席ごとの細かな角度や距離は公開情報だけでは決められないので、==「このプレーが必ず一番近い」とは断定しない==のだ。\n\n## 今日の試合で見るなら\n**福島蓮**がロッテ打線に投げるとき、内野ゴロが出たら一塁まで視線を動かしてみよう。**アンドレ・ジャクソン**の投球でも同じだ。\n\n==アウトになるか、打者が先に一塁を踏むかまで見る==と、ひとつのゴロが最後までつながって見えるのだ。"}, "7-11": {"meta": {"id": "7-11", "title": "今日の席（1塁側・内野指定席B）から何が見える？", "category": "7", "level": "1", "priority": "star", "needs_check": true, "children": ["7-11-a", "7-11-b"], "related": ["7-09", "7-10"], "sources": ["https://www.marines.co.jp/ticket/price/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/ballpark/guidemap.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日の1塁側・内野指定席Bは、2026年の公式価格表でフロア4の席種と確認できる。球団の席種案内では「球場とプレーの全体を見渡せる」席と紹介されている。ただし、その案内本文は2025シーズン表記なので、今日の細かな死角までは断定しないのだ。\n\n<!-- TODO: 2026シーズンの1塁側・内野指定席Bからの実景と死角を球団公式で確認 -->\n\n## しくみ\nフロア4は、グラウンドに近い席で選手の表情だけを見るというより、投手、打者、走者（塁に出ている攻撃側の選手）、守備の動きをまとめて追う見方と相性がいい。野球は一球ごとに複数の選手が動くので、全体を見ると「なぜ次のプレーが起きたか」が分かりやすくなるのだ。\n\nたとえば、投手が投げる前に走者がどこにいるか、内野手がどこを守っているかを見ておく。そのあと打球が飛ぶと、守備側がどこへ動き、走者がどの塁を狙ったかまで一続きで追いやすい。\n\nただし、座席からベンチやブルペンがどの程度見えるか、手すりなどでどこが隠れるかは、現在公開されている公式情報だけでは確認できない。そこは「見えるはず」と決めつけず、実際に席へ着いてから確かめる範囲なのだ。\n\n## 今日の試合で見るなら\nアンドレ・ジャクソン対清宮幸太郎、福島蓮対山口航輝というように、まず投手と打者を見る。打球が出たら視線を少し広げ、守る選手と走者まで追うと、フロア4から試合全体を見る面白さが分かりやすいのだ。"}, "7-12-a": {"meta": {"id": "7-12-a", "title": "海浜幕張駅までどれくらい？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-12", "7-13"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式の目安では、**海浜幕張駅からZOZOマリンまで徒歩約15分**だ。==帰りも同じ区間なので、駅まで歩く時間の基準は約15分と考えればよい。==\n\n## しくみ\n公式の徒歩ルートは、海浜幕張駅の**南口**からプレナ幕張方面へ進み、歩道橋を使って球場へ向かう道だ。信号待ちを減らせる歩道橋も案内されている。\n\nただし、==「約15分」は歩行そのものの目安で、試合後の人の流れや駅での待ち時間までは含まれない==。終了直後は時間に余裕を持つ方が安全なのだ。\n\n## 今日の試合で見るなら\n今日の試合は**18:00開始**だ。==清宮幸太郎や山口航輝の終盤の打席まで見たうえで帰るなら、「試合終了＋徒歩約15分」を最低限の移動目安にする==とよい。\n\n駅に着いてから電車に乗るまでの時間は、その場の混雑で変わるのだ。"}, "7-12-b": {"meta": {"id": "7-12-b", "title": "バスやタクシーは使える？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-12", "7-13"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**バスは使える**。2026年の球団公式案内では、海浜幕張駅・幕張本郷駅とZOZOマリンを結ぶシャトルバスが案内されている。==タクシーは、球団公式で試合後の乗り場や運用を確認できないため、ここでは使えると断定しない。==\n<!-- TODO: 9/28試合後のタクシー乗り場・配車可否を球団またはスタジアム公式で確認 -->\n\n## しくみ\n今日9月28日は、球団公式タイムテーブルで**16:00から海浜幕張駅発の直通バス**が運行開始となっている。通常の公式アクセスでは、海浜幕張駅から球場までバス約6分の案内だ。\n\n試合後は海浜幕張駅行きと幕張本郷駅行きのシャトルバスがある。==2026年は、試合終了が21:35までなら終了45分後、21:35以降なら22:20が乗車受付終了時刻==と案内されている。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**と**福島蓮**の投げ合いを最後まで見ても、試合後バスという選択肢はある。==帰る直前に場内ビジョンで乗車受付終了時刻を確認する==のが確実だ。"}, "7-12": {"meta": {"id": "7-12", "title": "帰りの混雑を避けるには？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "children": [], "related": ["7-09", "7-10"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n帰り道は海浜幕張駅だけではない。球団公式が案内している徒歩・シャトルバスの複数ルートを先に知っておくと、試合後に一つの列だけへ集中せず動けるのだ。\n\n## しくみ\n公式アクセスでは、JR京葉線の海浜幕張駅は徒歩約15分。幕張豊砂駅は徒歩約30分で、こちらへ行くバス運行はない。\n\nバスは海浜幕張駅行きに加え、幕張本郷駅行きもある。幕張本郷駅行きは海浜幕張駅を経由しない。試合後にはJR津田沼駅行きやJR稲毛駅行きの案内もあるが、台数には限りがある。\n\n海浜幕張駅・幕張本郷駅行きのシャトルバスは、試合終了が21時35分までなら試合終了45分後が乗車受付終了。21時35分以降に終わった場合は22時20分が受付終了だ。\n\n球団公式は「どの経路が必ず空いている」とは案内していない。だから混雑の少ない道を断定せず、徒歩と複数のバス行き先を候補として持つのが安全だ。\n\n## 今日の試合で見るなら\n今日の試合は18時開始だ。清宮幸太郎の通算100号候補や山口航輝の一発を最後まで見たいなら、途中で帰る前提にしなくてもよい。試合終了後にビジョンへ出るシャトルバスの乗車受付終了時刻を確認し、自分が使える駅をその場で選ぶと動きやすい。"}, "7-13-a": {"meta": {"id": "7-13-a", "title": "海浜幕張駅から歩いて何分？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-13", "7-12-a"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式では、**海浜幕張駅からZOZOマリンまで徒歩約15分**だ。==初めて行くなら「駅を出て15分」が移動時間の基準になる。==\n\n## しくみ\n海浜幕張駅では**南口**を出て、プレナ幕張方面へ進む。公式の徒歩ルートは歩道橋を使い、球場方向へ向かう道だ。\n\n==約15分は駅から球場まで歩く時間の目安で、入場にかかる時間は別==だ。試合開始直前に駅へ着く計画なら、15分だけでは足りない場合があると考えておくとよい。\n\n## 今日の試合で見るなら\n今日は**18:00試合開始**だ。==アンドレ・ジャクソンと福島蓮の最初の投球から見たいなら、徒歩約15分に入場までの時間も足して逆算する==のだ。\n\n16:00には開場しているので、早めに着けば試合前の球場内も見られる。"}, "7-13-b": {"meta": {"id": "7-13-b", "title": "何時ごろ混む？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-13", "7-08"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式では、今日の**時間帯ごとの混雑ピーク**までは公表されていない。==「17時半が一番混む」など、特定の時刻を混雑のピークとは断定できないのだ。==\n<!-- TODO: 9/28の時間帯別の駅・徒歩ルート・入場口の混雑状況を球団またはスタジアム公式で確認 -->\n\n## しくみ\n今日わかっている時刻は、**15:00**に外周ケータリングカーなどが営業開始、16:00に開場し、海浜幕張駅発の直通バスも運行開始、18:00に試合開始という流れだ。\n\nまた、2026年の球団公式案内は、バスには台数の限りがあり、**多客時は乗れない場合がある**としている。==混雑の正確なピークではなく、この公式タイムラインを基準に予定を組む==のが安全だ。\n\n## 今日の試合で見るなら\n18:00から**アンドレ・ジャクソン**と**福島蓮**の先発で始まる予定だ。==最初の1球から見たいなら、海浜幕張駅からの徒歩約15分に、入場までの時間を上乗せして考える==とよい。"}, "7-13": {"meta": {"id": "7-13", "title": "球場への行き方は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-13-a", "7-13-b"], "related": ["7-12", "7-08"], "sources": ["https://www.marines.co.jp/stadium/access/", "https://www.marines.co.jp/news/detail/202600775376.html", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n電車で来るなら、まず**JR京葉線・海浜幕張駅**を目印にすると分かりやすい。==駅の南口からZOZOマリンまでは、球団公式で徒歩約15分だ。==\n\n## しくみ\n海浜幕張駅では南口を出て、プレナ幕張方面へ進む。球団公式の徒歩ルートは、歩道橋を使って球場へ向かう道を案内している。信号を避けられる歩道橋もあるので、==初めてなら公式ルートの案内表示を追うのが基本==なのだ。\n\n歩かずに向かう方法もある。海浜幕張駅から球場までは、公式案内で**バス約6分**。今日9月28日は、球団公式タイムテーブルで16:00から海浜幕張駅発の直通バス運行開始となっている。\n\n別の入口として、JR総武線・京成線の**幕張本郷駅**からバス約21分という案内もある。==「海浜幕張から徒歩」だけが唯一の行き方ではない==というわけだ。\n\nなお、バスは乗れる人数に限りがあり、球団公式も多客時は乗れない場合があると案内している。時間が読みにくいときは、==徒歩約15分という基準を持っておくと計画を立てやすい==。\n\n## 今日の試合で見るなら\n今日は**16:00開場、18:00試合開始**だ。18時になると、ロッテの**アンドレ・ジャクソン**と日本ハムの**福島蓮**が先発する予定だ。\n\n==最初の1球から見たいなら、駅からの移動時間に入場までの時間も足して考える==とよい。公式は「何時が必ず空いている」とは案内していないので、特定の時刻なら混まないとは決めつけないのだ。"}, "7-14-a": {"meta": {"id": "7-14-a", "title": "初めてなら何を買う？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-14", "6-01"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://shop.marines.co.jp/shop/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n初観戦なら、まずは**選手フェイスタオル**のような小さめの応援グッズが使いやすい。==高い物から買う必要はない==のだ。\n\n## しくみ\n今日の公式ページでは、**2026年選手フェイスタオル HOMEが1,700円**、レプリカキャップが3,500円、レプリカユニホーム HOMEが12,000円と案内されている。\n\nタオルなら手に持って応援でき、試合後も持ち帰りやすい。ユニホームは「この先も着たい」と思ってから選んでも遅くない。==最初は「今日使えるか」で決めると失敗しにくい==のだ。\n\n## 今日の試合で見るなら\nロッテの**山口航輝**は33号なら本塁打数で単独2位になる。誰のグッズにするか迷ったら、==今日の記録がかかった選手を一人選ぶ==と、打席を見る理由も増えるのだ。"}, "7-14-b": {"meta": {"id": "7-14-b", "title": "ユニフォームを着ていく人が多いのはなぜ？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-14", "6-01"], "sources": ["https://www.marines.co.jp/event/daily/20260928.html", "https://shop.marines.co.jp/shop/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nユニフォームは、**どのチームや選手を応援しているか**を見た目で示しやすい。==着ることは必須ではなく、普段着のままでも観戦できる==のだ。\n\n## しくみ\n球団公式は今日のグッズとして**レプリカユニホーム HOME**を案内している。背番号や選手名のある物なら、「この選手を見ている」という目印にもなる。\n\n同じ服を着ると、応援の動きを合わせやすく、写真にも観戦日の雰囲気が残る。ただし、ルールを覚えてから着る物ではない。==応援の参加証のように使える服、と考えるとわかりやすい==のだ。\n\n## 今日の試合で見るなら\nロッテ先発の**アンドレ・ジャクソン**は勝てば10勝目だ。ユニフォームを着ていてもいなくても、==選手名が呼ばれたときに拍手するだけで十分に応援になる==のだ。"}, "7-14": {"meta": {"id": "7-14", "title": "グッズはどこで買える？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-14-a", "7-14-b"], "related": ["6-01", "7-13"], "sources": ["https://shop.marines.co.jp/shop/", "https://shop.marines.co.jp/shop/detail?real_shop_id=1", "https://shop.marines.co.jp/shop/detail?real_shop_id=5", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンスタジアムでは、球場周辺と場内の**マリーンズストア**でグッズを買える。==今日なら、入場前に球場外の店を見る方法がわかりやすい==のだ。\n\n## しくみ\n公式ストア一覧には、球場の**ミュージアム店、スタジアム店、サードベースサイド店、メインエントランス店**などが載っている。店によって場所と営業時間が違うため、同じ「球場のグッズ店」でも使うタイミングが違うのだ。\n\n今日9月28日は、球場外にある**ミュージアム店が13:00から試合終了30分後まで**営業し、最大22:00までとなっている。**メインエントランス店は14:00〜19:00**だ。==16:00の開場前に買いたいなら、この2店を先に見る手がある==。\n\n今日の球団公式イベントページでは、**レプリカユニホーム HOME 12,000円、レプリカキャップ3,500円、選手フェイスタオル1,700円**が紹介されている。初観戦で全部そろえる必要はなく、使い方が想像できる物から選べばよいのだ。\n\n## おもしろエピソード\nミュージアム店は、球団公式が「スタジアム外にある大型グッズショップ」と案内している店だ。ユニホームだけでなく、観戦グッズ、お土産、選手グッズまで扱う。==試合を見る前に「誰を応援するか」を決める場所にもなる==というわけだ。\n\n## 今日の試合で見るなら\n今日のロッテでは、**山口航輝**が32本塁打でリーグ2位タイ、**アンドレ・ジャクソン**は10勝目がかかっている。選手名入りのタオルなどを選ぶなら、==「今日気になる選手」を一人決めてから店を見る==と、初心者でも選びやすいのだ。"}, "7-15-a": {"meta": {"id": "7-15-a", "title": "ビールの売り子さんって？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-15"], "sources": ["https://www.marines.co.jp/gourmet/uriko/", "https://www.marines.co.jp/news/detail/202600781576.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**売り子**は、客席エリアを回りながらビールやソフトドリンクなどを販売するスタッフだ。==売店まで行かずに飲み物を買える仕組み==なのだ。\n\n## しくみ\n球団公式の売り子ページには、ビール、ハイボール、チューハイ、日本酒、**ソフトドリンク**まで載っている。2026年は売り子から購入するときの決済方法も拡大された。\n\n売り子へのカメラやスマートフォンでの撮影は禁止されている。==飲み物を買う相手であって、撮影対象ではない==というルールなのだ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**の100号候補や**山口航輝**の一発を見たいなら、打席の直前はグラウンドに集中したい。==買うなら攻守交代など、プレーが切れた時間を使う==と見逃しにくいのだ。"}, "7-15-b": {"meta": {"id": "7-15-b", "title": "席で飲み食いしていい？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-15", "7-06"], "sources": ["https://www.marines.co.jp/gourmet/uriko/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/rule/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n球団公式は、場内で買った飲食物を**球場内で食べる**よう案内している。座席によっては「飲食を楽しみながら観戦」と明記されているが、==今日の内野指定席Bそのものについては同じ明記を確認できていない==のだ。\n\n## しくみ\n公式の一般シート案内では、内野指定席Bの1段上にある**パノラマカウンター・シート**は、飲食しながら観戦できると明記されている。売り子ページにも、場内で買った飲食物は球場内で早めに食べるよう案内がある。\n\nただし、内野指定席Bの説明には「座席で飲食可」という文言までは見つからない。<!-- TODO: 確認 --> ==今日の席での扱いを断定せず、現地クルーの案内を優先する==のだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**の10勝目がかかる試合だ。==飲食するときも、打球が飛んでくる間はグラウンドから目を切らない==ことを優先するとよいのだ。"}, "7-15": {"meta": {"id": "7-15", "title": "飲み物やお酒は？", "category": "7", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["7-15-a", "7-15-b"], "related": ["7-06", "7-09"], "sources": ["https://www.marines.co.jp/gourmet/uriko/", "https://www.marines.co.jp/stadium/rule/", "https://www.marines.co.jp/event/daily/20260928.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nZOZOマリンでは、場内の売店と**売り子（客席を回って飲み物を売るスタッフ）**から飲み物を買える。==アルコールだけでなく、ソフトドリンクもある==のだ。\n\n## しくみ\n球団公式の売り子ページでは、ビールは主に**900円**、ハイボールは800円、チューハイ類は750円、コカ・コーラなどのソフトドリンクは350円と案内されている。商品は日によって入荷がなかったり、売り切れたりする場合がある。\n\n今日9月28日の公式イベントページには、売店メニューとして**マリーンズビール950円**も掲載されている。これは売り子ページの一般的なビール価格とは別の商品なので、==「ビールは全部同じ値段」ではない==と考えるとよいのだ。\n\n持ち込みは自由ではない。2026年改定の球場ルールでは、アルコールの持ち込みは認められていない。一方、**750ml以下のアルコールを除くペットボトル、水筒、紙パック**などは持ち込み可能だ。==飲み物を持参するなら、容器と中身の両方を確認する==のだ。\n\n20歳未満の飲酒と飲酒運転は法律で禁止されている。球団公式も売り子ページで明記しているので、年齢や帰りの運転予定に合わせて選ぶ必要がある。\n\n## 今日の試合で見るなら\n日本ハムの**清宮幸太郎**には通算100本塁打、ロッテの**山口航輝**には33号本塁打がかかっている。==気になる打者の打席が近いなら、飲み物はその前に用意しておく==と、大事な一球を見逃しにくいのだ。"}, "7-16-a": {"meta": {"id": "7-16-a", "title": "雨で中止になったらチケットは？", "category": "7", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["7-16"], "sources": ["https://m-ticket-rsv.marines.co.jp/2026akinoyozora/", "https://www.marines.co.jp/ticket/refund/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n今日の**「2026 秋の夜空にみんなで叫ぼう！特別招待」**は、公式ページに中止時の払い戻し案内がある。==試合が中止・不成立になったら、まず球団公式の払い戻し案内を確認する==のだ。\n\n## しくみ\n特別招待ページでは、天候などで試合が中止・不成立になった場合、**払戻期間内に購入店舗で払い戻し**と案内している。一般の公式案内では、期間は==中止試合日の翌日から2週間==だ。\n\nただし、実際の手続きは購入方法や発券方法で違う。Mチケットオンラインのクレジットカード・PayPay決済でQR発券なら、利用者の手続きなしで返金処理される例もある。==自分の受取方法に合う欄を見る==のだ。\n\n## 今日の試合で見るなら\n今日は18:00開始で、NPB公式表示はくもり時々雨だ。**福島蓮**と**アンドレ・ジャクソン**の投げ合いを待つ間も、==中止の発表が出たら自己判断ではなく公式案内を確認する==とよいのだ。"}, "7-16-b": {"meta": {"id": "7-16-b", "title": "屋根のある場所は？", "category": "7", "level": "2", "priority": "normal", "needs_check": true, "styled": true, "related": ["7-16", "7-11"], "sources": ["https://www.marines.co.jp/ticket/seat/special/", "https://www.marines.co.jp/ticket/seat/genelal/", "https://www.marines.co.jp/stadium/rule/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n公式に**屋根付き**と明記されている観戦席はある。たとえば3塁側フロア4のシーニック・ボックスとシーガル・ボックスだ。ただし、==今日の内野指定席Bが屋根で覆われるかは公式説明で確認できていない==のだ。\n\n## しくみ\nシーニック・ボックスは、球団公式が**フロア4・3塁側の屋根付きエリア**と案内している。シーガル・ボックスも「屋根のあるエリアで、雨天時にも安心して観戦可能」と明記されている。\n\n一方、今日の**内野指定席B**はフロア4のバックネット裏エリアだが、公式の座席説明には屋根の記載がない。<!-- TODO: 確認 --> 共用の雨よけ場所として誰でも使える屋根付きエリアも、公式テキストでは確認できていない。\n\n指定された座席以外で観戦することはスタジアムルールで禁止されている。==屋根付きの別席へ勝手に移って観戦しない==のだ。\n\n## 今日の試合で見るなら\n**山口航輝**や**清宮幸太郎**の打席を待つ間に雨が強まる可能性もある。==屋根を当てにせず、今日の席では雨に対応できる服装を基本にする==とよいのだ。"}, "7-16": {"meta": {"id": "7-16", "title": "雨や寒さで困ったら？", "category": "7", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["7-16-a", "7-16-b"], "related": ["7-08", "7-09"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html", "https://www.marines.co.jp/stadium/stadiuminquiry/", "https://www.marines.co.jp/ticket/refund/", "https://m-ticket-rsv.marines.co.jp/2026akinoyozora/", "https://www.marines.co.jp/ticket/seat/special/"]}, "body": "## ひとことで\nZOZOマリンは屋外球場なので、雨と夜の冷え込みは自分で調整する場面がある。==雨にぬれにくい上着と、重ね着できる防寒着を用意しておく==と対応しやすいのだ。\n\n## しくみ\n今日9月28日のNPB公式日程ページは、ZOZOマリンの天気を**くもり時々雨**と表示している。試合は18:00開始なので、日が落ちてからも観戦が続く。雨で服がぬれると体感温度も下がりやすいため、雨対策と寒さ対策を別々に考えるより、一緒に準備したほうがよいのだ。\n\n困ったときは**インフォメーションブース**を使える。球団公式では、フロア4の408通路付近のブースが開場から7回裏終了まで、フロア2のC・Dゲート間は開場から試合終了30分後まで営業すると案内している。==今日の席もフロア4なので、場所だけ先に覚えておくとよい==。\n\n雨で試合自体が中止になった場合は、チケットの扱いが変わる。今日の特別招待ページにも中止時の払い戻し案内があり、一般の払戻受付期間は**中止試合日の翌日から2週間**だ。手続きは購入・発券方法によって違う。\n\n屋根付きと公式に明記された観戦席もあるが、誰でも移動して観戦できるわけではない。スタジアムルールでは、自分の観戦エリアや指定席以外での観戦は禁止されている。==「雨だから空いている屋根席へ移る」はしない==のだ。\n\n## 今日の試合で見るなら\n**アンドレ・ジャクソン**は勝てば10勝目、**清宮幸太郎**は通算100本塁打まであと1本だ。==雨が強くなったら、無理に席に残るより体調と安全を優先する==。戻ったときにまた試合を追えばよいのだ。"}, "8-01-a": {"meta": {"id": "8-01-a", "title": "テレビや配信で観るには？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "related": ["8-01"], "sources": ["https://www.marines.co.jp/news/broadcast/202609/index.html", "https://pacificleague.com/ptv"]}, "body": "## ひとことで\nいちばん確実なのは、試合ごとに球団公式の「放映スケジュール」を見ることだ。テレビとネット配信は、同じカードでも日によって変わる。\n\n## しくみ\n千葉ロッテ公式サイトには、テレビ、BS・CS、ネット、ラジオの放映予定が試合ごとに載る。ネットではDAZN、ベースボールLIVE、Rakuten パ・リーグ Specialなどが使われる試合がある。\n\nパーソル パ・リーグTVは、パ・リーグ球団主催の一軍公式戦などを配信する公式サービスだ。スマホやPCだけでなく、対応テレビでも見られる。\n\n## 今日の試合で見るなら\n9月28日のロッテ対日本ハムは、球団公式の放映予定では、BS12 トゥエルビが17時30分からだ。Rakuten パ・リーグ Special、ベースボールLIVE、DAZNの3つは、17時45分から試合終了までとなっている。\n\n球場で清宮幸太郎の通算100本塁打が出たのに打球の角度を見逃した、というときは、帰宅後に中継映像で見直せる。現地では全体、映像ではアップとリプレーを見る、と使い分けると理解しやすいのだ。"}, "8-01-b": {"meta": {"id": "8-01-b", "title": "初心者におすすめの本・漫画・動画は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-01-c", "2-18-c"], "sources": ["https://www.seibidoshuppan.co.jp/search/result?c3=1102", "https://www.kodansha.co.jp/comic/products/0000030251", "https://npb.jp/news/detail/20260409_01.html"]}, "body": "## ひとことで\n\n最初から全部覚える必要はない。==**ルール本で調べる、漫画で試合の考え方を知る、短い動画で動きを見る**==の3つを使い分けると楽なのだ。\n\n## しくみ\n\n本なら、成美堂出版の**『わかりやすい野球のルール』**が2026年版として出ている。A6判の小さめの本なので、「今のプレーは何だった？」を後から調べる辞書のように使いやすい。\n\n漫画なら、ひぐちアサの**『おおきく振りかぶって』**は、投手と捕手の役割や、打者ごとに考え方が変わる様子が細かく描かれる。ルール暗記よりも、「選手はこんなことを考えているのか」を知りたい人向きだ。\n\n動画なら、NPBが2026年に公開した**「野球の審判 超・初級編」**のような公式の初心者向け動画が入りやすい。==分からなかった場面を1つだけ選び、帰宅後に5分調べるくらいで十分==なのだ。\n\n## 今日の試合で見るなら\n\n今日、**福島蓮**の投球を見て「捕手はなぜそこに構えた？」と思ったら漫画や解説へ、**山口航輝**の打球で判定が分からなければルール本や公式動画へ進むといい。\n\n==球場で生まれた「なぜ？」を1個だけ持ち帰る==と、次の観戦では見えるものが増えるのだ。"}, "8-01-c": {"meta": {"id": "8-01-c", "title": "野球のゲームで覚える方法は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-01-b", "1-03"], "sources": ["https://www.konami.com/games/prospi/2026/jp/ja/", "https://www.konami.com/games/prospi/2026/jp/ja/products"]}, "body": "## ひとことで\n\n野球ゲームは、ルールを暗記するより**自分で1球ずつ選ぶ練習**に向いている。==まず「3アウトで交代」「走者をどこへ進めるか」「投手は何を投げるか」の3つだけ意識すればいい==のだ。\n\n## しくみ\n\nKONAMIの**『プロ野球スピリッツ2026』**は、2026年7月16日発売で、2026年のプロ野球データを収録している。対戦やペナントレースなどのモードがあり、実在球団を使って試合の流れを追える。\n\n初心者なら、勝つことより「なぜ今アウトになったか」を止めて考えるのがおすすめだ。ゴロならどの塁へ投げるか、走者がいたら次の塁へ行けるか、投手ならストライクを取りに行くか。==ゲームは同じ場面を何度も試せるので、球場では一瞬で終わる判断をゆっくり確認できる==。\n\n最初は難しい守備操作や細かな配球まで覚えなくていい。1試合全部ではなく、1〜3イニングだけでも十分だ。\n\n## 今日の試合で見るなら\n\n今日の**福島蓮**や**アンドレ・ジャクソン**を見たあと、ゲームで投手を操作すると「球種を選ぶ→コースを決める→打者の反応を見る」という順番が分かりやすい。\n\n==実際の試合で見た場面をゲームで再現する==と、次に球場へ来たときの理解が速くなるのだ。"}, "8-01": {"meta": {"id": "8-01", "title": "野球をもっと知るには？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "children": ["8-01-a"], "related": ["8-02", "4-01"], "sources": ["https://npb.jp/games/2026/", "https://pacificleague.com/ptv", "https://npb.jp/bis/players/43745159.html"]}, "body": "## ひとことで\n一度に全部覚えなくていい。次の試合で「一つだけ見るテーマ」を決めると、野球はかなり分かりやすくなるのだ。\n\n## しくみ\n最初はスコア、アウト数、走者の位置だけで十分だ。その次に、投手なら球種、打者なら狙い球（打者が待っている球種やコース）、守備なら位置取りというように、見る対象を一つずつ増やすといい。\n\n試合後に結果を確認すると、球場で見えなかった部分もつながる。NPB公式には日程、順位、個人成績、試合の投打成績が残るので、「あの場面は何だったのか」を後から確認できる。\n\n映像で見返すのも有効だ。球場では全体が見える一方、配信やテレビでは投手の握り、打者の表情、リプレーなどを近くから見られる。現地と映像では、同じ野球でも見える情報が違うのだ。\n\nおすすめは、自分の気になる選手を一人決めることだ。毎打席、毎守備を見るだけで、打順、交代、左右の相性（投手と打者の利き腕の組み合わせによる向き不向き）、記録などが自然につながってくる。\n\n## おもしろエピソード\n数字も、最初から全部覚える必要はない。打率なら「どれくらい安打を打つか」、防御率なら「投手がどれくらい点を取られにくいか」と大まかにつかみ、気になった数字だけ後で調べればいいのだ。\n\n## 今日の試合で見るなら\n今日は山口航輝なら33号本塁打、清宮幸太郎なら通算100本塁打、アンドレ・ジャクソンなら10勝目がかかっている。三人のうち一人だけ追ってみると、試合後の記事や成績表も急に読みやすくなる。\n\nたとえば清宮の全打席を見て、「どんな球で勝負されたか」を覚えておく。帰宅後に映像や試合結果を見返せば、今日の観戦が次の観戦の予習になるのだ。"}, "8-02-a": {"meta": {"id": "8-02-a", "title": "CSや来季のチケットは？", "category": "8", "level": "2", "priority": "normal", "needs_check": true, "related": ["8-02"], "sources": ["https://npb.jp/games/2026/schedule_climax_pl.html", "https://npb.jp/games/2026/info_cs.html", "https://npb.jp/bis/2026/stats/std_p.html", "https://www.marines.co.jp/ticket/season2027/index.html"]}, "body": "## ひとことで\n2026年パ・リーグのCS（クライマックスシリーズ：日本シリーズ進出を争う短期決戦）は10月10日から始まる。ロッテはCS進出がない。だから今季、ZOZOマリンでロッテのCSを観る機会はないのだ。\n\n## しくみ\nファーストステージ（CSの最初の段階）は10月10〜12日で、2位と3位が対戦する。球場は2位球団の本拠地だ。今日の日本ハムは3位で、2位西武を追っているため、この試合の結果はCSの開催地にも関わる。\n\n2027年について球団公式で発表済みなのは、まず年間予約席の「シーズンシート」だ。継続受付は10月7日13時、新規受付は10月14日13時からとなっている。\n\n1試合ずつ買う2027年の一般チケット販売日程は、9月28日時点では球団公式で確認できていない。<!-- TODO: 2027年一般チケットの販売開始日を球団公式で確認 -->\n\n## 今日の試合で見るなら\n日本ハムにとっては、今日と10月1日のロッテ戦に連勝することが2位争いの最低条件になっている。清宮幸太郎の通算100本塁打や福島蓮の先発も見どころだ。そこに「日本ハムが2位へ近づけるか」という見方を足すと、10月10日のCSにつながる試合だと分かるというわけだ。"}, "8-02-b": {"meta": {"id": "8-02-b", "title": "残りのロッテ×日本ハム（10/1）は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-02-c", "1-13"], "sources": ["https://npb.jp/bis/2026/games/gm20261001.html", "https://npb.jp/games/2026/schedule_10_detail.html", "https://www.marines.co.jp/game/calendar/202610"]}, "body": "## ひとことで\n\n今日の次にあるロッテ×日本ハムは、**2026年10月1日（木）18:00、ZOZOマリンスタジアム**だ。==同じ球場で、もう一度このカードを見られる==のだ。\n\n## しくみ\n\nNPB公式日程では、10月1日に**千葉ロッテ対北海道日本ハム**がZOZOマリンで18:00開始と発表されている。ロッテ球団公式カレンダーでもホームゲームとして確認できる。\n\nただし、今日の9月28日から3日後なので、順位や記録の状況は今日の結果で変わる。先発投手や当日のスタメンも、現時点では今日と同じとは限らない。\n\n==「今日気になった選手をもう一度見る」という目的で次戦を選ぶと、2回目の観戦はかなり見やすい==。同じ球場なので、入場や座席までの感覚も一度経験済みになるからだ。\n\n## 今日の試合で見るなら\n\n今日、**清宮幸太郎**の通算100本塁打挑戦や、**山口航輝**の長打が気になったら、10月1日の出場情報も当日に確認してみよう。\n\n==今日の「誰を見ればいいか分からない」が、次回は「この選手を見たい」に変われば十分==なのだ。"}, "8-02-c": {"meta": {"id": "8-02-c", "title": "二軍や独立リーグの試合も観られる？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-02-b", "8-04"], "sources": ["https://npb.jp/farm/2026/", "https://npb.jp/campaign/2026/farm/", "https://npb.jp/news/detail/20260927_01.html", "https://npb.jp/farmchamp/2026/", "https://bc-l.jp/operating.php"]}, "body": "## ひとことで\n\n観られる。**NPBのファーム（二軍）**も、NPBとは別組織の**独立リーグ**も一般向けの試合を行っている。==一軍より選手との距離が近い球場もあり、若手を覚える入口になる==のだ。\n\n## しくみ\n\n2026年のNPBファームは、従来の2リーグ制から**1リーグ3地区制**へ変わった。ロッテと日本ハムはともに東地区で、日本ハムは2026年の東地区優勝。ファーム公式戦のレギュラーシーズンは9月27日に全日程を終えている。\n\nその後は、10月3日・4日に静岡で**ファーム日本選手権2026**が行われる。つまり、今日9月28日の時点では通常のファーム公式戦は終わっているが、若手中心の公式戦を見る機会はまだ残っているのだ。\n\n独立リーグでは、たとえば**ルートインBCリーグ**が2026年も公式戦を開催し、千葉スカイセイラーズなどが参加している。==日程・球場は各リーグ公式サイトで確認するのが確実==だ。\n\n## 今日の試合で見るなら\n\n今日の先発**福島蓮**のような若い投手が気になったら、次はファームの選手一覧や成績を追ってみるといい。\n\n==一軍で名前を覚え、ファームや独立リーグで「次に上がってきそうな選手」を探す==と、観戦の楽しみ方が一段増えるのだ。"}, "8-02": {"meta": {"id": "8-02", "title": "次はいつ観に行ける？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "children": ["8-02-a"], "related": ["8-01"], "sources": ["https://npb.jp/games/2026/schedule_10_detail.html", "https://www.marines.co.jp/ticket/"]}, "body": "## ひとことで\n今日の次にZOZOマリンでロッテを観られる公式戦は、10月1日（木）18時の日本ハム戦だ。9月でシーズンが終わるわけではないのだ。\n\n## しくみ\nNPBの10月日程では、ロッテは10月1日から6日までZOZOマリンで主催試合（自分たちが本拠地で開く試合）が続く。次の予定はこうなっている。\n\n- 10月1日（木）18時　日本ハム戦\n- 10月2日（金）18時　ソフトバンク戦\n- 10月3日（土）18時　ソフトバンク戦\n- 10月4日（日）18時　楽天戦\n- 10月5日（月）18時　西武戦\n- 10月6日（火）18時　西武戦\n\nチケットは千葉ロッテ公式のチケットページから試合を選んで確認する。残席や価格は変わるので、行きたい日を決めたらその時点の表示を見るのが確実だ。\n\n同じ相手でも、先発投手や順位の状況で試合の見え方は変わる。今日覚えたルールを、数日後にもう一度球場で確かめると理解が早いのだ。\n\n## おもしろエピソード\n次の10月1日も相手は日本ハムだ。今日と同じカードなので、打順や継投（投手を交代させながら試合をつなぐこと）がどう変わるかを比べやすい。\n\n## 今日の試合で見るなら\n今日の先発はロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。次回10月1日に来るなら、今日の打者がどの投手にどう対応したかを一
