つだけ覚えておくといい。\n\n山口航輝や清宮幸太郎のような長打者が、数日後に同じ球場でどう攻められるかを比べるだけでも、2回目の観戦はかなり違って見えるのだ。"}, "8-03-a": {"meta": {"id": "8-03-a", "title": "写真や動画は撮っていい？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-03"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_text.html", "https://npb.jp/npb/satsuei_haisin_kitei_20250901.html", "https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/news/detail/202600768522.html"]}, "body": "## ひとことで\nルールを守れば、球場で**写真や動画を撮ること自体はできる**。ただし、==撮影できることと、SNSなどへ公開できることは別のルールなのだ。==\n\n## しくみ\nNPBの現行規程では、三脚などの大型機材、フラッシュ、通路に居座る撮影、周囲の観戦を妨げる撮り方は禁止されている。ZOZOマリンの2026年ルールでは、クルーや売り子への撮影も禁止だ。\n\nSNSへの写真投稿は、禁止された方法で撮ったものなどを除けば可能だ。動画は条件が細かい。**イニング中のグラウンド内動画**は未編集で60秒以内、1人につき1試合1回までで、試合後に投稿できる。\n\nグラウンド外やイニング中以外のグラウンド内動画は、140秒以内なら投稿できる。==試合映像や音声のライブ配信、リアルタイムの試合データ配信はできない==ので注意が必要なのだ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**山口航輝**の打席を撮りたくなっても、まず周りの人の視界をふさがないことが先だ。==スマホを高く掲げ続けず、自分の席から短く撮る==くらいが分かりやすい目安になるのだ。"}, "8-03-b": {"meta": {"id": "8-03-b", "title": "チケットの半券やスコアを残すには？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-03", "4-01"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n紙のチケットが残るなら半券と一緒に、**日付・対戦カード・最終スコア**を残すと振り返りやすい。==電子チケットでも、試合の記録を自分のメモに残せば同じ役目を果たすのだ。==\n\n## しくみ\nいちばん簡単なのは、写真アルバムやメモに「2026年9月28日、ロッテ対日本ハム」と書き、試合後に最終スコアを加える方法だ。紙の半券があるなら、小さな封筒やカード用の袋に入れて一緒に保管できる。\n\nさらに一言だけ感想を添えると、その日の記憶が戻りやすい。「**福島蓮**の初回が印象に残った」「外野への大きな打球で立ち上がった」くらいで十分だ。==細かいスコアを全部書かなくても、自分が覚えておきたい場面が1つあればいい==のだ。\n\n## 今日の試合で見るなら\n試合が終わったら、スコアボードの結果と、気になった選手を1人だけ記録してみよう。**アンドレ・ジャクソン**、**福島蓮**、**清宮幸太郎**など、名前を1つ残すだけでも今日の試合を思い出す手がかりになる。\n\n公開用の写真を作るなら、==チケットに表示される個人情報は写さない==ようにしておくと安心だ。"}, "8-03": {"meta": {"id": "8-03", "title": "今日の思い出を残すには？", "category": "8", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["8-03-a", "8-03-b"], "related": ["8-04", "7-04"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_text.html", "https://www.marines.co.jp/stadium/rule", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n観戦の思い出は、**写真・短いメモ・試合結果**の3つを残すと振り返りやすい。==全部を撮ろうとせず、「自分が気になった瞬間」を少し残すだけで十分なのだ。==\n\n## しくみ\n写真なら、試合前の球場全体、スコアボード、応援の景色などを数枚残すと、その日の空気を思い出しやすい。プレー中も撮影はできるが、NPBには撮影方法やSNS投稿についての規程がある。三脚やフラッシュ、周囲の観戦を妨げる撮り方などは禁止されている。\n\n次に、スマホのメモへ「初めて分かったこと」を1つだけ書く。たとえば「フォークは落ちる球だった」「二死から全員が走った」のような短文でいい。==記録というより、自分の目がどこで止まったかを残す==と、その試合だけの思い出になる。\n\n最後に、日付、対戦カード、最終スコアを残す。紙のチケットが手元に残るなら一緒に保管できるし、電子チケットでも日付と試合名を書いたメモがあれば十分だ。公開する写真には、個人情報が写り込まないよう注意する。\n\n## おもしろエピソード\n野球は、1球ごとに少し間がある。そのため「今の球は何だった？」と話したり、次の打者を確認したりしながら記録を残しやすい。==観戦しながら全部メモする必要はなく、回と回の間に一言だけ残せばいい==のだ。\n\n## 今日の試合で見るなら\n試合前なら、**アンドレ・ジャクソン**と**福島蓮**の先発表示を1枚残すと今日らしさが出る。試合中に**清宮幸太郎**の節目の一発や、**山口航輝**の本塁打が出たなら、写真そのものだけでなく「何回だったか」もメモしておくと後から追いやすい。\n\n==今日の一枚を決めるなら、結果が出たあとのスコアボードでもいい。==勝敗だけでなく、あなたが初めて球場で野球を見た日の景色まで一緒に残るというわけだ。"}, "8-04-a": {"meta": {"id": "8-04-a", "title": "選手のSNSや球団の動画は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-04", "8-01-a"], "sources": ["https://www.fighters.co.jp/entertainment/sns/", "https://www.marines.co.jp/sponsor/index.html", "https://pacificleague.com/"]}, "body": "## ひとことで\n選手をもっと知りたいなら、まず**球団公式SNSや公式動画**から入ると分かりやすい。==本人かどうか分からないアカウントを探すより、公式の案内からたどる方が確実なのだ。==\n\n## しくみ\n日本ハムは公式サイトにSNS一覧があり、X、YouTube、Instagramなどへの入口をまとめている。ロッテも公式サイトでX、YouTube、Instagram、TikTok、Facebookを案内している。\n\n選手個人のSNSは、全員が使っているとは限らない。名前だけで検索すると同姓同名や非公式アカウントも出るので、==球団公式から紹介されているか、本人と確認できる表示があるかを確かめる==といい。\n\n球団やリーグの動画は、顔と名前を覚えるのにも向いている。試合映像だけでなく、選手名を見ながら動画を見ると、次の観戦で見つけやすくなるのだ。\n\n## 今日の試合で見るなら\n今日気になった**福島蓮**、**清宮幸太郎**、**山口航輝**などの名前を1人だけ覚えておこう。==帰宅後にまず球団公式のサイトや動画からその名前を探す==と、次に見るときの入口になるのだ。"}, "8-04": {"meta": {"id": "8-04", "title": "推しの選手を見つけるには？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["8-04-a"], "related": ["4-07", "8-01"], "sources": ["https://npb.jp/pl/", "https://pacificleague.com/news/2026/9/86605", "https://www.nikkansports.com/baseball/news/202609260001729.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**推しの選手**は、詳しい成績を全部覚えてから決めるものではない。==「この人が出てくると少し見たくなる」という引っかかりを探せばいいのだ。==\n\n## しくみ\n探し方は、大きく3つある。まずはプレーの特徴だ。強い打球を飛ばす、足が速い、守備範囲が広い、球が速いなど、見た瞬間に分かる特徴から入ると覚えやすい。\n\n次は役割だ。先発投手、4番打者、抑え、代走など、選手には試合の中で任される仕事がある。==「何をする人なのか」が分かると、その選手が出た理由まで見える==ようになる。\n\n最後は、その日にかかっている記録や流れだ。ロッテの**山口航輝**は9月27日時点で32本塁打。日本ハムの**清宮幸太郎**は通算100本塁打まであと1本と報じられている。日本ハム先発の**福島蓮**は7月12日以来の先発だ。\n\n数字だけで決める必要はない。構え方、登場曲、守る位置、走り方など、気になった理由は何でもいい。==最初の推しは「説明できるほど好き」ではなく、「もう一度見たい」で十分なのだ。==\n\n## おもしろエピソード\n同じ選手でも、打つ日、守る日、ベンチから出てくる日で印象は変わる。だから1試合で決めきれなくても問題ない。次に観たとき、また自然に目で追っていたら、それが推しの始まりかもしれないのだ。\n\n## 今日の試合で見るなら\n長打が好きなら**山口航輝**や**清宮幸太郎**、投手を見たいなら**福島蓮**から追うと入りやすい。走塁なら**西川遥輝**が塁に出たあとを見る方法もある。\n\n==1人だけ「打席や登板が来たら画面から目を離さない選手」を決めてみよう。==その選手を軸にすると、初めての試合でも流れを追いやすくなるのだ。"}, "8-05-a": {"meta": {"id": "8-05-a", "title": "サッカー観戦との違いは？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-05", "1-03"], "sources": ["https://www.jleague.jp/a-to-z/game_time/", "https://www.jleague.jp/outline/j1/", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nサッカーは**90分の流れを追う**競技で、野球は**1球ずつ場面が区切られる**競技だ。==初めて野球を見るなら、ずっと集中し続けるより「投手が投げる瞬間」に目を戻せばいいのだ。==\n\n## しくみ\nJリーグの試合は前後半45分ずつが基本で、時計はほぼ動き続ける。野球には同じ形の試合時計がなく、3アウトになるまで攻撃が続く。\n\nだから観客の見方も変わる。サッカーではボールと選手の移動を連続して追う。野球では投球前に止まり、投球、打球、走塁が短いまとまりで起きる。==途中でスコアボードを確認しても、次の1球から戻りやすい==のだ。\n\n## 今日の試合で見るなら\n**福島蓮**や**アンドレ・ジャクソン**が投球動作に入ったらグラウンドを見る。プレーが止まったらアウト数や走者を確認する。==この繰り返しだけでも、初観戦では十分に試合を追える==のだ。"}, "8-05": {"meta": {"id": "8-05", "title": "ほかのスポーツ観戦と何が違う？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["8-05-a"], "related": ["1-03", "1-05", "6-01"], "sources": ["https://npb.jp/pl/", "https://npb.jp/npb/2026rules.html", "https://www.jleague.jp/a-to-z/game_time/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球の大きな特徴は、**時計ではなくアウトで区切って進む**ことだ。==1球ごとに止まり、次の作戦を考える時間があるので、「間」まで含めて観るスポーツなのだ。==\n\n## しくみ\nサッカーは前後半45分ずつの計90分が基本で、プレーが止まっても時計は動き続ける。野球はそうではない。攻撃側が3アウトになるまで1回の半分が続き、9回まで積み重ねていく。\n\nそのため、同じ「1試合」でも時間の感覚がかなり違う。野球では投手が1球投げるたびに、打者、捕手、走者、守備が次の動きを考える。==何も起きていないように見える数秒にも、次のプレーの準備が入っている==のだ。\n\n見る対象も切り替わりやすい。投球前は走者、投げた瞬間は打者、打球が飛べば守備、プレーが止まればスコアボードを見る。ずっとボールだけを追うより、場面ごとに見る場所を変えると分かりやすい。\n\n応援にも区切りがある。打者ごとの応援や、得点機に使われる応援など、試合の状況に合わせて空気が変わる。==「今は何の場面か」が分かるほど、球場の音の変化にも気づける==というわけだ。\n\n## 今日の試合で見るなら\n2026年のパ・リーグは、9月27日時点で9回試合の平均時間が**3時間3分**だ。今日も18時開始だが、決まった時刻に必ず終わるわけではない。\n\n**アンドレ・ジャクソン**と**福島蓮**が1球投げるたびに、次の投球まで少し間ができる。==その間に「走者はいるか」「アウトはいくつか」だけ確認する==と、野球独特のテンポをつかみやすいのだ。"}}, "players": [{"team": "監督", "section": "監督カード", "name": "サブロー", "title": "サブロー（本名・大村三郎、#86、ロッテ監督、50歳）", "body": "- 特徴：「昭和のキャンプ」を掲げる猛練習派で、就任会見では「甘さを取り除く」と宣言。一方で「伸び悩む若手は我慢して使わないと開花しない」と、起用は辛抱強いタイプです。<!-- TODO: 確認（原文「昨和のキャンプ」を「昭和のキャンプ」と推定） -->\n- 見どころ：消化試合でも若手（寺地・井上・西川）を並べるのか。前々日に逆転サヨナラを喫した横山を、接戦の9回にまた送るのかも注目です。\n- 出立ち：背番号86、50歳。現役引退会見で「マリーンズを愛しています」と泣いた熱血漢です。\n- プロまで：岡山出身。PL学園から1994年ドラフト1位。知り合いのいない東京で偶然入ったちゃんこ店の店主に「出世払いでいいよ」と子どものように可愛がられ、「東京の親父」と慕った話が有名です。\n- プロで：最初のキャンプで打撃投手の伊良部秀輝の球が前に飛ばず「とんでもない世界に入った」と頭を抱えたそうです。1軍定着まで5年。山本功児監督に抜擢され、「お前がマリーンズを引っ張れ」と言われ続けました。2005年は主力として日本一。一時巨人へ移籍後に戻り、2016年に引退しました。2軍監督、ヘッドコーチを経ています。\n- 直近1年：2軍監督時代に山本大斗・寺地・西川史礁らを鍛えました。昨年6月から1軍ヘッドになりましたが、チームは8年ぶりの最下位。吉井監督の辞任で昇格しました。就任1年目の今季は5位ですが、複数年契約で来季も続投。課題は先発投手と明言しています。\n- 直近数試合：9/17にBクラスが確定し、「僕が下手くそだったのもある」と発言。一方で「山口の30本は自信になる」「小川はセカンドとして十分」と、我慢の起用の手応えを語っています。チームは直近3試合2勝1敗です。"}, {"team": "監督", "section": "監督カード", "name": "新庄剛志", "title": "新庄剛志（#1、日本ハム監督、54歳）", "body": "- 特徴：大胆な起用と演出力。先発を多めに回すローテーション運用が評価されてきました。今季は進塁打を重視する「自己犠牲」がテーマです。\n- 見どころ：勝つしかない試合。水谷・レイエス不在の打線の組み方と、福島を何回で代えて左腕をどうつぎ込むかが腕の見せどころです。\n- 出立ち：背番号1、54歳。現役時代から派手な演出で知られ、試合前後の発言も話題になります。\n- プロまで：福岡出身。西日本短大付高から阪神へ。ロッテの小野郁は高校の後輩です。\n- プロで：阪神→メッツ・ジャイアンツ（2002年にワールドシリーズ出場）→日本ハム。北海道移転初年の2004年に加入し、2006年に日本一で引退。2022年に「ビッグボス」として監督に就任し、順位は6位・6位・2位・2位と伸ばしてきました。\n- 直近1年：開幕前に「ぶっちぎりの優勝」を公言。ところが4月末は最下位で、交流戦の9連勝で持ち直しました。ソフトバンク戦は5勝18敗2分と大きく負け越しています。7/2には史上初の「初回先頭から4者連続本塁打」を記録し、「甲子園の3連発と並ぶ記憶」と大喜びしました。3年連続Aクラスは確定済みです。\n- 直近数試合：9/24の本拠地最終戦後に来季の続投（6年目）を表明。骨折した水谷には「もう塩の上で寝てほしい」、インフルエンザの加藤貴には「流行りに乗らなくても」と語っています。チームは直近3試合1勝2敗、得点は0・2・1です。<!-- TODO: 確認（「塩の上で寝てほしい」は原文ママ。意味が取れないため公開前に出典で確認） -->"}, {"team": "ロッテ", "section": "先発投手", "name": "アンドレ・ジャクソン", "title": "アンドレ・ジャクソン（#42、先発、右投右打、30歳）", "body": "- 特徴：力強い直球と落差の大きいチェンジアップ。今季144回で133奪三振と空振りを取れる一方、四球は55個と多めです。\n- 見どころ：9勝8敗、防御率3.44でチーム最多勝。勝てば2年連続の2桁勝利で、ロッテでは今季初の10勝投手になります。強風のマリンでチェンジアップがどう変化するかも注目。獲得時にサブロー監督は「マリンの風を味方につければ、打たれることはなかなかない」と評しました。\n- 出立ち：190cm・95kg。たくましい顎髭と、トレードマークのもじゃもじゃヘア。\n- プロまで：米アリゾナ州出身、ユタ大学でプレーしました。\n- プロで：ドジャース傘下（2017〜23年）からメジャーに上がり、2023年はパイレーツ。2024年にDeNAへ来日し、8勝・防御率2.90でした。日本シリーズでは初戦に先発し、中4日で第5戦にも投げました。26年ぶりの日本一に貢献し、シリーズ優秀選手になっています。2025年は10勝7敗、防御率2.33。\n- 直近1年：DeNAの保留者名簿から外れ、昨年12月にロッテと契約。開幕投手候補でしたが、3月に家事中に右手の指を負傷し出遅れました。移籍初登板は4/1の日本ハム戦（エスコン）で、5回1安打無失点で初勝利。今日はその相手との再戦です。\n- 直近数試合：9/4のオリックス戦で敗戦。その後は家族の出産に立ち会うため一時帰国しました。復帰戦の9/22オリックス戦は5回77球3安打2失点。今日は中5日です。復帰戦の球数から考えると100球前後での交代が妥当で、横山につなぐまでの6〜8回を誰で埋めるかが論点です。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "西川史礁", "title": "西川史礁（#6、左翼・1番、右投右打、23歳）", "body": "- 特徴：広角に強い打球を飛ばす中距離打者。打率.291、144安打、28二塁打と、チームのヒットメーカーです。死球は10個で、内角を強く攻められています。\n- 見どころ：残り試合で打率3割に届くか。福島・右腕陣との右対右です。\n- 出立ち：182cm・88kgのがっしり型。\n- プロまで：和歌山・日高川町出身。龍谷大平安高から青山学院大へ進み、2024年ドラフト1位で入団しました。\n- プロで：1年目の昨季は序盤こそ苦しみましたが、規定打席に到達。打率.281、リーグ最多の27二塁打で新人王になりました。\n- 直近1年：2年目のジンクスはなく、126試合で打率・安打ともチームトップ。4月には3ランを含む4安打5打点の試合もありました。1番にも中軸にも入る打線の要です。\n- 直近数試合：9/25西武戦は4番で、1点を追う8回に中越えの逆転3ラン。9/26はノーヒット（死球1）、昨日は1番で初回に内野安打で出塁し先制のホームを踏みました。3試合で10打数3安打と状態は悪くありません。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "山口航輝", "title": "山口航輝（#51、指名打者・2番、右投右打、26歳）", "body": "- 特徴：フルスイングの長距離砲。今季は32本塁打、70打点、長打率.588。直球に絞って1球で仕留めるのが信条です。\n- 見どころ：33号が出ればレイエスを抜いて本塁打単独2位。記念の30号も日本ハム戦で打っています。\n- 出立ち：183cm・100kgの巨体。\n- プロまで：秋田・明桜高から2018年ドラフト4位。入団時の発表会で「30本以上打ってホームラン王を獲りたい」と宣言しました。\n- プロで：2021年のCSでは21歳で本塁打。2022年は3打席連続本塁打を含む16本でチーム最多でした。引退する井上晴哉から後を託され、「晴哉さんの24本と99打点を超えたい」と誓っています。\n- 直近1年：昨年8月にパ・リーグタイの4打席連続本塁打。1イニング2本塁打も記録しましたが、昨季は35試合出場にとどまりました。今季は開幕から量産し、8月には月間MVPを初受賞。9/15の日本ハム戦では29・30号を放ちました。30号は9回に守護神の柳川から打った決勝弾です。球団の日本人では1986年の落合博満以来40年ぶりの30本で、「僕の夢だった」と語りました。\n- 直近数試合：9/22に32号を放ちました。一度は二塁打でしたが、ビデオ判定で本塁打になっています。9/25は2安打2打点、9/26は5打数ノーヒット。9/27は2安打で、4回に2点適時打を放ちました。9月は打率が落ち気味ですが、単打でも得点に絡んでいます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "藤原恭大", "title": "藤原恭大（#1、右翼・3番、左投左打、26歳）", "body": "- 特徴：俊足・強肩の外野手。出塁率.355で12盗塁と、出塁してかき回すタイプです。右翼からのレーザービームで、レイエスの当たりを「ライトゴロ」にしたこともあります。\n- 見どころ：3試合連続ノーヒットから抜け出せるか。右翼の守備も見どころです。\n- 出立ち：181cm・80kgのスマートな体型。\n- プロまで：大阪桐蔭で2018年に春夏連覇を達成。根尾昂らと同期の黄金世代で、同年のドラフト1位で入団しました。\n- プロで：高卒で入団してから数年は、故障や伸び悩みが続きました。毎年「今年こそ」と言われてきた選手です。\n- 直近1年：今季は99試合で打率.264、8本塁打、40打点。死球は11個です。\n- 直近数試合：3試合で12打数ノーヒットと大ブレーキ中です。9/26は3三振、昨日は併殺打もありました。ただ四球は2つ選んでおり、選球眼までは崩れていません。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "佐藤都志也", "title": "佐藤都志也（#32、捕手・4番、右投左打、28歳）", "body": "- 特徴：「打てる捕手」。今季は自己最多の17本塁打、55打点で、四球を46個選んでいます。\n- 見どころ：四球の多いジャクソンをどうリードするか。打っては4番として当たりを取り戻せるかです。\n- 出立ち：181cm・91kg。\n- プロまで：聖光学院高から東洋大。2019年ドラフト2位で入団しました。\n- プロで：田村龍弘や松川との正捕手争いを勝ち抜き、2024年にブレイク。初めて規定打席に到達し、打率.278でベストナインを初受賞しました。大学時代に慣れ親しんだ神宮でのオールスターでは6打数5安打でMVP。球団35年ぶりの球宴MVPです。プレミア12の侍ジャパンにも選ばれました。\n- 直近1年：123試合で打率.233。打率は落としましたが、長打力を大きく伸ばしました。\n- 直近数試合：3試合で13打数1安打（二塁打）と低調です。昨日は終盤に一塁へ回り、松川がマスクをかぶりました。疲労を考えると、捕手松川・一塁佐藤という並びもあり得ます。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "寺地隆成", "title": "寺地隆成（#65、三塁・5番、右投左打、21歳）", "body": "- 特徴：本職は捕手ですが、打撃を生かすため今季は三塁と兼任しています。解説のT-岡田氏から「素晴らしいスイング」と評された打撃が持ち味です。\n- 見どころ：長い不振からの復活途中。今の勢いが本物かどうかです。\n- 出立ち：177cm・82kg。\n- プロまで：明徳義塾高から2023年ドラフト5位で入団しました。\n- プロで：2軍でサブロー監督（当時は2軍監督）の指導を受けました。高卒2年目の昨季には規定打席に到達し、次世代の主力と期待されています。\n- 直近1年：開幕直後は打率3割超え。ところが5月は月間打率.095と落ち込み、6月と8月の2度、2軍へ落ちました。足を上げた後の間の取り方を変えて昇格し、「とにかく2割台に乗せたい」と語っていました。\n- 直近数試合：9/16に今季初の猛打賞。9/19には3試合連続複数安打で、約4カ月ぶりに打率2割台に戻しました。昨日は初回の先制タイムリー二塁打を含む3安打で、3試合で10打数4安打です。今、打線で最も当たっている一人です。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "小川龍成", "title": "小川龍成（#57、二塁・6番、右投左打、28歳）", "body": "- 特徴：守備と小技が武器。犠打11個と、打線をつなぐ役割を担っています。\n- 見どころ：二塁の守備と、チャンスでのバントやコース打ち。\n- 出立ち：171cm・74kgの小柄な内野手。\n- プロまで：前橋育英高から國學院大。2020年ドラフト3位で入団しました。\n- プロで：長く守備固めや控えの立場でした。一年を通してフルに出場したシーズンは、今季までありませんでした。\n- 直近1年：今季は131試合に出場し打率.262。初めて二塁のレギュラーをつかみ、サブロー監督に「セカンドとして十分な成績」と評されました。\n- 直近数試合：3試合で10打数1安打。打撃は下降気味ですが、昨日は犠打と四球で得点に絡みました。"}, {"team": "ロッテ", "section": "予想スタメン", "name": "髙部瑛斗", "title": "髙部瑛斗（#0、中堅・7番、右投左打、28歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最大の武器は一歩目の速さと加速力なのだ。**2022年に44盗塁で盗塁王**となり、中堅守備でも広い範囲をカバーして同年にゴールデングラブ賞を受賞している。\n- ユニークポイント：大学では東都大学2部で通算**129安打**を積み上げ、当時の2部リーグ最多安打記録を更新した巧打者なのだ。==長打より、足とコンタクトで相手守備を揺さぶるタイプだと覚えると見やすい==。\n\n### 見どころ\n- 今日の試合で見るべき場面：復帰後3試合で**11打数6安打、5打点**と当たっているため、7番から塁に出て下位打線を動かせるかが見どころなのだ。塁に出たら、投手が打者だけでなく髙部のスタートも警戒する様子を見るとよい。\n- 注目の数字・プレー：9月26日は内野安打と2点三塁打、27日は3安打で2点二塁打を放った。==骨折離脱から戻った直後に、単打・三塁打・二塁打と違う形の安打を重ねている==のが面白いところなのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発の右腕・福島蓮に対し、2026年の打者別対戦成績は**2打数1安打（.500）**。サンプルは小さいが、左打者の髙部が出塁して福島に走者を意識させられるかに注目なのだ。\n\n### 出立ち\n- 身長・体重・体格：**178cm・72kg**で、外野手としては細身の体格なのだ。スピードを生かした走塁と守備が持ち味なので、体の大きさより動きの軽さが目につく選手だ。\n- 投打・フォームの特徴：右投げ左打ち。小学4年から通った松永浩美ベースボールアカデミーで左打ちに転向し、現在も左打席から俊足を生かす打撃を続けている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでは試合前のルーティンを「睡眠」と答えている。プレーでは打球後すぐトップスピードに乗る走り方が見分けやすいのだ。\n- 背番号の由来・愛称・登場曲：現在の背番号は**0**、球団公式のニックネームは「べー」。登場曲は寿君の「Believe in myself」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：神奈川県高座郡寒川町出身。父に「運動会の100m走で最下位なら野球を始めなさい」と言われ、本当に最下位になったことが野球を始めるきっかけになったという。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：鶴ヶ島エンゼルスで野球を始め、毛呂山中では越生ボーイズ、東海大甲府高、国士舘大へ進んだ。大学では1年春から外野のレギュラーだったのだ。\n- 野球のエピソード：小4から中学卒業まで松永浩美ベースボールアカデミーに通い、そこで左打ちへ転向した。国士舘大では4年春に東都2部通算100安打へ到達し、最終的に**129安打**まで伸ばした。\n- 野球以外のエピソード：3人兄弟で、弟を2016年に急性白血病で亡くしている。家族への思いを胸に競技を続けてきたことが複数の取材で紹介されている。\n- 印象的な試合：東海大甲府高3年夏の**第97回全国高校野球選手権**に「1番・中堅」で出場し、3回戦で清宮幸太郎を擁する早稲田実に敗れた。甲子園では3試合で**13打数4安打1打点**だった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：甲子園出場に加え、国士舘大で東都2部通算129安打。大学リーグで安打を積み続けた確実性が、プロ入り時の大きな評価材料になったのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト3位**でロッテから指名され、推定契約金6000万円、年俸1000万円で合意。入団時の背番号は38だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年に一軍デビューし、2022年に137試合へ出場してレギュラー定着。2023年は肩の故障で一軍出場がなく、2024年に復帰して打率.300、2025年は111試合で打率.286、20盗塁を記録した。\n- 野球のエピソード：2022年は**44盗塁**を決め、盗塁王と外野手のゴールデングラブ賞を同時に獲得した。==「塁に出た後」と「打球が飛んだ時」の両方で価値を出す外野手なのだ==。\n- 野球以外のエピソード：球団公式Q&Aでは性格を「自由」、自分へのご褒美を「買い物」と回答している。苦手なものとしてトマト、ナス、人混みも挙げている。\n- 印象的な試合：2024年7月は打率.405、月間33安打などの好成績でパ・リーグ野手部門の月間MVPを受賞。長期離脱から戻り、打撃でも大きく存在感を示した時期なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：**2022年盗塁王、2022年ゴールデングラブ賞、2024年7月度月間MVP**。2025年には侍ジャパントップチームにも選出された。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**46試合、129打数29安打、打率.225、0本塁打、5打点、3盗塁**。9月27日の3安打を加える前の数字なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：6月12日に一軍登録を外れ、その後ファームで死球を受けて右肩甲骨を骨折し、1か月以上離脱した。9月25日に約3か月ぶりに一軍へ戻った。\n- 野球のエピソード：故障で実戦を離れた期間に打撃を「全部見直した」と話し、さまざまな打ち方や感覚を試したという。復帰時には来季へ向けて結果でアピールする意識を口にしていた。\n- 野球以外のエピソード：長期離脱中は、打てない時期と故障を受けて考えを整理する時間に充てたと語っている。競技から離れた時間も、自分の状態を見直す期間にしたというわけだ。\n- 印象的な試合：9月26日の西武戦で**3打数2安打2打点**、8回に左中間へ2点三塁打。復帰2戦目で長打まで出たことで、復帰直後の好調を強く印象づけた。\n- 実績（今季の記録・表彰）：今季のタイトル・月間表彰はない。==ただし9月25日の一軍復帰から3試合連続安打で、計6安打5打点==と短期間で大きな結果を残している。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦がなく、25日の復帰戦は安打と打点を記録。26日は**3打数2安打2打点**、27日は**4打数3安打2打点**で、8回に2点二塁打を放った。\n- エピソード：9月25日の昇格時に「来年に向けたアピール」を口にした直後から結果が続いている。言葉どおり、残り試合を来季への競争として戦っているのだ。\n- 調子：復帰後3試合は**11打数6安打、打率.545、5打点**。打球の種類も内野安打、三塁打、二塁打と幅があり、直近だけを見れば非常に当たっている。\n- 分析・論点：3試合だけなので長期的な復調と断定はできないが、骨折明けでタイミングを取り直しながら結果が続いている点は大きい。特に下位打線で出塁すると、1番へつながる前に相手守備へ走塁の圧力をかけられる。\n- 今日の見どころ：==「打って出る」だけでなく、「出てから走る」「中堅で広く守る」の3点を見ると髙部らしさが分かる==。福島から塁に出た場面では、リード（塁から離れて次の塁を狙う準備）の大きさにも注目なのだ。\n\n### 出典\n- https://npb.jp/bis/players/11215151.html\n- https://www.marines.co.jp/team/player/detail/2026_00001274.html\n- https://ja.wikipedia.org/wiki/%E9%AB%99%E9%83%A8%E7%91%9B%E6%96%97\n- https://en.wikipedia.org/wiki/Akito_Takabe\n- https://npb.jp/bis/2022/stats/lb_sb_p.html\n- https://npb.jp/award/2022/pl.html\n- https://npb.jp/award/2024/month/win_pl7.html\n- https://www.japan-baseball.jp/jp/profile/202501011.html\n- https://www.nikkansports.com/baseball/news/202609250001261.html?mode=all\n- https://www.nikkansports.com/baseball/news/202609260001502.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true}, {"team": "ロッテ", "section": "予想スタメン", "name": "井上広大", "title": "井上広大（#39、一塁・8番、右投右打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**189cm・100kg**の体格から生まれる長打力が最大の武器なのだ。2026年は9月26日時点で安打19本のうち本塁打が**7本**あり、少ない安打数でも一振りで得点を動かせる。\n- ユニークポイント：履正社高3年夏の甲子園決勝で、春の選抜で抑え込まれた星稜・奥川恭伸から逆転3ランを放った打者なのだ。==「相手のエースを長打でひっくり返した」高校時代の一打が、今の打者像にもつながっている==。\n\n### 見どころ\n- 今日の試合で見るべき場面：8番で走者を置いて打席が回った場面なのだ。9月は26日までに**4本塁打**しており、下位打線でも一発で試合を動かせる。\n- 注目の数字・プレー：9月26日の西武戦で**7号2ラン**を放ち、前の打席で満塁機を逃した後に逆転弾で取り返した。==打率は低くても、長打が出ると得点への影響が大きい打者==として見ると分かりやすい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮の2026年打者別対戦表には井上の打席が掲載されておらず、少なくとも同表で確認できる今季対戦実績はない。右対右なので、福島の直球や変化球をどこまで強く引っ張れるかが焦点なのだ。\n\n### 出立ち\n- 身長・体重・体格：**189cm・100kg**で、チームでも目立つ大柄な体格なのだ。球団公式Q&Aでもチャームポイントを「手足が長い」と答えている。\n- 投打・フォームの特徴：右投げ右打ち。大きな体を使って強く振り切るタイプで、2026年は長打率が打率を大きく上回る成績になっている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：長い手足と大柄なシルエットが見分けやすい。試合前の決まったルーティンは「その日のコンディション次第」と球団公式Q&Aで答えている。\n- 背番号の由来・愛称・登場曲：ロッテでの背番号は**39**、愛称は「コーディー」。登場曲は打席ごとに寿君「Butterfly Effect」など複数曲を使っている。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府大東市出身。家族構成の詳しい公開情報は限られるが、小学2年から地元の「ANTブルージェイズ」でソフトボールを始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：大東市立南郷小から南郷中へ進み、中学では東大阪シニアで野球に転向して主に捕手を務めた。履正社高では外野手となり、2年秋から4番を担った。\n- 野球のエピソード：3年春の選抜では星稜・奥川恭伸に**4打数0安打2三振**だったが、夏の甲子園決勝で同じ奥川から逆転3ランを放った。高校通算は**49本塁打**なのだ。\n- 野球以外のエピソード：ドラフト後の2019年11月、下校途中に駅の階段で後ろからぶつかられて右足首を捻挫したことが報じられた。入団直前に思わぬアクシデントに見舞われたのだ。\n- 印象的な試合：**2019年夏の甲子園決勝・星稜戦**が代表的なのだ。3回に奥川のスライダーを捉えて逆転3ランを放ち、履正社の春夏通じて初の全国制覇に大きく貢献した。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2019年夏の甲子園で**26打数10安打、3本塁打、14打点、打率.385**。履正社高の全国優勝メンバーで、大学・社会人を経ずにプロ入りした。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト2位**で阪神から指名され、推定契約金6000万円、年俸720万円で仮契約。背番号は32だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年に阪神で一軍デビューし、2024年は23試合で3本塁打。2025年は一軍1試合にとどまり、同年の現役ドラフトでロッテに移籍して2026年から背番号39となった。\n- 野球のエピソード：ルーキーの2020年はウエスタン・リーグで**9本塁打、36打点**を記録し、高卒新人ながら二軍の中軸を任された。一軍では初安打・初打点を適時二塁打で記録している。\n- 野球以外のエピソード：ロッテ公式Q&Aでは自分へのご褒美を「アイス」、最近買ってよかったものを「牧秀悟さんと同じ香水」と回答している。「一喜一憂をしない」を心に残る言葉として挙げているのだ。\n- 印象的な試合：2020年10月16日のヤクルト戦で代打からプロ初安打・初打点となる中越え適時二塁打を放った。阪神の高卒新人野手として久しぶりの一軍打点となった一打だった。\n- 実績（タイトル・表彰・通算記録・代表）：一軍のタイトルや代表歴はないが、2020年のウエスタン・リーグで優秀選手賞、新人賞、努力賞を受賞した。2024年に一軍自己最多の**3本塁打**を放ち、2026年はそれを大きく更新している。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**46試合、111打数19安打、打率.171、7本塁打、12打点**。安打のうち7本が本塁打で、確実性より長打が目立つ数字なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年12月の現役ドラフトで阪神からロッテへ移籍。2026年は一塁や外野で出場機会が増え、初めて一軍で100打席を超えた。\n- 野球のエピソード：9月26日の試合後、本人は好結果につなげるため「誰にも負けないような練習量」を意識していると話した。サブロー監督も「彼が一番バットを振ってると思う」と練習量を評価している。\n- 野球以外のエピソード：球団公式Q&Aでは性格を一言で「静」と回答し、苦手な食べ物はピーマンとしている。後輩の松川虎生について「面倒見がいい」と答えているのも人間関係が見える小ネタなのだ。\n- 印象的な試合：9月26日の西武戦で1点を追う7回、佐藤隼輔の初球チェンジアップを左中間へ運んで**7号逆転2ラン**。==満塁機で凡退した後の次打席で試合をひっくり返した==。\n- 実績（今季の記録・表彰）：9月26日までにシーズン自己最多の**7本塁打**へ伸ばし、9月だけで4本塁打。大きな個人タイトルはないが、一軍での出場機会と長打数は過去最高水準なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦なし。26日は**3打数2安打2打点、1本塁打、1四球**、27日は**3打数1安打1打点**で4回に左前適時打を放った。\n- エピソード：26日は一時逆転の本塁打、27日は勝ち越しにつながる適時打と、2試合続けて得点に直結する打撃を見せた。長打だけでなく単打でも走者を返しているのだ。\n- 調子：9月は26日までに4本塁打を放ち、直近2試合では**6打数3安打3打点**。==シーズン打率.171という全体像より、直近の打席内容は明らかに上向いている==。\n- 分析・論点：課題は三振の多さで、9月27日終了時点では114打数で40三振。反面、当たった時の長打力は下位打線として大きな武器なので、追い込まれる前に甘い球を仕留められるかが論点なのだ。\n- 今日の見どころ：==福島の球を最初から強く振りにいくか、追い込まれるまで見極めるか==を観察するとよい。走者がいる場面なら、一塁側スタンドからは大きなスイングと打球方向が分かりやすい。\n\n### 出典\n- https://npb.jp/bis/players/31335151.html\n- https://www.marines.co.jp/team/player/detail/2026_00001793.html\n- https://ja.wikipedia.org/wiki/%E4%BA%95%E4%B8%8A%E5%BA%83%E5%A4%A7\n- https://en.wikipedia.org/wiki/Kouta_Inoue\n- https://npb.jp/m/draft/2019/draftlist_t.html\n- https://c.npb.jp/geneki_draft/2025/\n- https://npb.jp/announcement/2026/registered_m.html\n- https://www.daily.co.jp/baseball/2019/08/22/0012630303.shtml\n- https://www.nikkansports.com/baseball/news/202609260001502.html\n- https://www.daily.co.jp/baseball/2026/09/26/0020863468.shtml\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true}, {"team": "ロッテ", "section": "予想スタメン", "name": "山崎剛", "title": "山崎剛（#38、遊撃・9番、右投左打、30歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**50m5秒8**とされる俊足と、遊撃・二塁・三塁をこなせる守備力が強みなのだ。楽天時代には中堅で先発した経験もあり、試合途中の配置転換にも対応できる。\n- ユニークポイント：2025年は左膝手術で一軍出場がなく楽天を戦力外になったが、ロッテと育成契約し、2026年6月に支配下へ戻った。==一度支配下の枠を失ってから、背番号38で一軍の遊撃争いまで戻ってきた選手なのだ==。\n\n### 見どころ\n- 今日の試合で見るべき場面：9番・遊撃で先発するなら、まず守備で二遊間の打球をどこまで処理できるかを見るとよい。打席では出塁して1番へつなげる役割と、バントで走者を進める場面が見どころになる。\n- 注目の数字・プレー：9月26日時点で**56試合、打率.226、3盗塁**。派手な数字ではないが、26日は2安打、27日は犠打を決めており、==下位打線で「打つ・送る・走る」を使い分ける役目==なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮には2026年の対戦で**3打数0安打、2三振**。左打者でもまだ結果が出ていないため、低めの変化球を見極めて出塁できるかが焦点になる。\n\n### 出立ち\n- 身長・体重・体格：**173cm・74kg**で、プロ野球選手としては小柄な部類なのだ。大きさより俊足と身のこなしで勝負するタイプだ。\n- 投打・フォームの特徴：右投げ左打ち。打撃では初球から振れる積極性が持ち味で、走力を生かして内野安打や次の塁を狙える。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「目の茶色さ」、試合前のルーティンを「風呂入る」と回答している。小柄な体格と素早い守備の動きで見分けやすい。\n- 背番号の由来・愛称・登場曲：ロッテでは育成入団時に**138**、2026年6月の支配下復帰で**38**になった。愛称は「つよし」で、球団公式の2026年選手ページには登場曲の掲載がない。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：福岡県福岡市早良区出身。家族について詳しい公開情報は多くないが、小学3年から田隈ジュニアで野球を始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：飯倉小では田隈ジュニア、原中では城南サンボーイズ、日章学園高、國學院大へ進んだ。高校は甲子園出場がなかったが、大学で一気に評価を上げたのだ。\n- 野球のエピソード：國學院大2年春に**打率.400で首位打者**となり、2年春と3年春に二塁手のベストナイン。4年秋には東都大学1部で史上24人目、國學院大では初の通算100安打を達成した。\n- 野球以外のエピソード：國學院大の取材では、野球部が練習だけでなく日常生活の姿勢まで重視する文化を語っている。大学では副主将としてチームを引っ張る立場でもあった。\n- 印象的な試合：2017年10月11日の東都大学リーグ・東洋大戦で、初回に中前打を放って通算**100安打**へ到達。チームも1-0で勝ち、節目の一打が勝利につながった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：東都大学1部通算**103安打、打率.328、28盗塁**、ベストナイン2回。2016年には第40回日米大学野球選手権の日本代表に選ばれた。\n- ドラフト・入団（年・順位・球団・契約）：**2017年ドラフト3位**で楽天から指名され、推定契約金5000万円、年俸1000万円で合意。入団時の背番号は34だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2018年に楽天で一軍デビューし、2021年から出場機会を増やした。2023年は自己最多の**117試合**、2024年は体調不良で出遅れて5試合、2025年は左膝手術で一軍出場なしとなり、オフに楽天を戦力外となってロッテへ育成入団した。\n- 野球のエピソード：2020年から出場機会を増やすため外野守備にも取り組み、実際に中堅で先発した。2022年には自己最多**15盗塁**を記録し、俊足を一軍で形にしたのだ。\n- 野球以外のエピソード：2020年だけ登録名を「山﨑幹史」に変更した。「体幹を強くしたい」と「幹」の字を入れ、親に相談せず決めたため後に怒られ、翌年から本名へ戻したという独特のエピソードがある。\n- 印象的な試合：2023年4月22日の日本ハム戦で、9回無死満塁から田中正義を打って**サヨナラ安打**。楽天でのキャリアを代表する一打の一つなのだ。\n- 実績（タイトル・表彰・通算記録・代表）：一軍タイトルはないが、2023年に117試合、2022年に15盗塁を記録。複数ポジションを守りながら、代走・守備固め・先発のすべてを経験してきた。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**56試合、146打数33安打、打率.226、1本塁打、7打点、3盗塁**。前年一軍出場ゼロから、50試合以上に出るところまで戻した。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年3月に左膝の自家骨軟骨柱移植術を受け、復帰見込みは約6か月とされた。同年11月にロッテと育成契約し、2026年6月5日に支配下契約へ移行、背番号38で一軍に合流した。\n- 野球のエピソード：支配下復帰時までにファームで**55打数17安打、打率.309**。6月13日のDeNA戦では途中出場から2安打を放ち、ロッテ移籍後初安打を記録した。\n- 野球以外のエピソード：球団公式Q&Aでは自分へのご褒美を「スタバ」、最近買ってよかったものを「ソファー」と回答。苦手なのは「じっとしとくこと」で、本人らしい動き続ける性格がうかがえる。\n- 印象的な試合：8月12日のソフトバンク戦で上沢直之のフォークを捉え、右翼ホームランテラスへ**移籍後1号の2ラン**。==育成契約から支配下へ戻ったシーズンに、一軍で本塁打まで取り戻した==。\n- 実績（今季の記録・表彰）：6月5日に支配下復帰し、9月26日までに56試合へ出場。個人表彰はないが、前年一軍出場なしから遊撃の先発候補まで役割を広げたこと自体が今季の大きな実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦なし。26日の西武戦は**4打数2安打**、27日の日本ハム戦は**3打数0安打**だったが4回に送りバントを成功させた。\n- エピソード：26日は2安打しながら盗塁を試みて失敗、翌27日は安打が出なくても犠打で仕事をした。数字に残りにくい役割を担う場面が多いのだ。\n- 調子：26日にマルチ安打（1試合2安打以上）が出た一方、27日は無安打。直近1試合だけで好不調を決めにくいが、9月には古巣・楽天との3連戦で**9打数6安打**を記録するなど上向く時期もあった。\n- 分析・論点：遊撃は打撃だけでなく守備の安定が起用に直結するポジションなのだ。福島には今季3打数0安打2三振なので、下位から四球や内野安打でも出塁し、上位へ回すことが価値になる。\n- 今日の見どころ：==一番分かりやすいのは遊撃守備で、打球への最初の一歩と一塁への送球を追うこと==。打席では9番から1番へつなぐ「第二の1番」のような役割を果たせるかを見るとよい。\n\n### 出典\n- https://npb.jp/bis/players/73175136.html\n- https://www.marines.co.jp/team/player/detail/2026_00001803.html\n- https://ja.wikipedia.org/wiki/%E5%B1%B1%EF%A8%91%E5%89%9B_(%E5%86%85%E9%87%8E%E6%89%8B)\n- https://en.wikipedia.org/wiki/Tsuyoshi_Yamasaki\n- https://www.kokugakuin.ac.jp/article/20726\n- https://www.kokugakuin.ac.jp/news/39146\n- https://www.nissho.ac.jp/topix/baseball/%E5%B1%B1%E5%B4%8E%E5%89%9B%E9%81%B8%E6%89%8B%E3%81%8C%E3%83%97%E3%83%AD%E9%87%8E%E7%90%83%E3%83%89%E3%83%A9%E3%83%95%E3%83%88%E4%BC%9A%E8%AD%B0%E3%81%AB%E3%81%A6%E6%9D%B1%E5%8C%97%E6%A5%BD%E5%A4%A9/\n- https://www.rakuteneagles.jp/news/detail/202500777448.html\n- https://www.marines.co.jp/news/detail/202500746071.html\n- https://www.marines.co.jp/news/detail/202600857269.html\n- https://www.nikkansports.com/baseball/news/202606050001138.html\n- https://www.nikkansports.com/baseball/news/202608120001468.html\n- https://www.sponichi.co.jp/baseball/news/2025/11/14/kiji/20251114s00001173080000c.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true}, {"team": "ロッテ", "section": "スタメン候補", "name": "安田尚憲", "title": "安田尚憲（#5、内野、右投左打、27歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**188cm・100kg**の大きな体を生かした左の長打力が持ち味なのだ。2026年は9月26日時点で**打率.262、6本塁打、16二塁打**と、本塁打だけでなく二塁打でも長打を増やしている。\n- ユニークポイント：履正社高時代に高校通算**65本塁打**を放ち、早稲田実の清宮幸太郎と同学年の強打者として注目された。==2017年ドラフトでは清宮の抽選を外した3球団が安田を1位指名し、ロッテが交渉権を得た==という経緯がある。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発なら一塁または指名打者で、右投手の福島蓮に対して左打席から強い打球を飛ばせるかが見どころなのだ。代打なら、走者を置いた一打席で長打を狙う場面に注目するとよい。\n- 注目の数字・プレー：9月26日時点で**210打数55安打、打率.262、6本塁打、29打点**。2024、2025年は一軍で本塁打が0本だったため、==今季は長打力を数字として取り戻しているシーズン==なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：福島蓮とは2026年に**3打数1安打、打率.333**。対戦数は少ないが、右投手に対する左打者という組み合わせなので、外角球を左方向へ運ぶか、内角を引っ張るかを見ると面白い。\n\n### 出立ち\n- 身長・体重・体格：**188cm・100kg**で、打席に立つとかなり大きく見える内野手なのだ。球団公式Q&Aでも自身のチャームポイントを「身体が大きいところ」と答えている。\n- 投打・フォームの特徴：右投げ左打ち。大柄ながらバットを大きく振り回すだけではなく、2026年は二塁打を**16本**放つなど、強いライナーで外野の間を抜く打撃も目立つ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：大柄な体格と背番号5が最も見分けやすい。球団公式の2026年Q&Aでは髪型やひげの固定した特徴、試合前ルーティンについて具体的な回答は掲載されていない。\n- 背番号の由来・愛称・登場曲：入団以来の背番号は**5**で、球団公式のニックネームは「ヤス」。登場曲はMr.Childrenの「Worlds end」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府吹田市出身。**6歳**のとき、兄が野球をしていたことに影響されて競技を始めたと侍ジャパン公式プロフィールに記されている。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：吹田市立豊津第一小で豊津東少年野球団と阪神タイガースジュニア、豊津中ではレッドスターベースボールクラブに所属し、履正社高へ進んだ。高校卒業後は大学・社会人を経ずにプロ入りした。\n- 野球のエピソード：履正社では1年秋からレギュラーとなり、高校通算**65本塁打**。3年春の選抜準決勝・報徳学園戦では右翼へ本塁打を放ち、チームの決勝進出に貢献した。\n- 野球以外のエピソード：侍ジャパンの高校時代Q&Aでは、好きな野球漫画として「ダイヤのA」を挙げている。プロ入り時には「周りの目も意識して、しっかりした行動を取りたい」と話し、18歳で社会人になる自覚を語っていた。\n- 印象的な試合：2017年の**第89回選抜高校野球大会準決勝・報徳学園戦**では2打数2安打1本塁打1打点、3四球。履正社は勝って決勝へ進み、安田は全国大会の大舞台で長打力を示したのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2017年春の選抜で準優勝し、同年のU-18ワールドカップ日本代表にも選出された。U-18のオーストラリア戦では延長11回にサヨナラ適時打を放ち、プロ1年目の2018年にはU-23ワールドカップで**大会MVP**を受賞した。\n- ドラフト・入団（年・順位・球団・契約）：**2017年ドラフト1位**でロッテに入団。推定**契約金1億円、年俸1240万円**で契約し、背番号5を与えられた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2018年に一軍デビューし、2020年から主力として113試合、2021年115試合、2022年119試合、2023年122試合に出場。2024年は55試合、2025年は93試合と出場数が減ったが、三塁・一塁などで競争を続けてきた。\n- 野球のエピソード：2020年には若くして4番を任され、**54打点**を記録した。打撃フォームの試行錯誤を重ねながら、長打だけでなく出塁や逆方向への打撃も求められてきた選手なのだ。\n- 野球以外のエピソード：2019年オフにはプエルトリコのウインターリーグへ派遣され、異なる環境で生活しながら実戦経験を積んだ。球団公式Q&Aでは自分へのご褒美を「買い物」と答えている。\n- 印象的な試合：2018年10月のU-23ワールドカップでは日本代表の一塁手として出場し、大会を通じた活躍でMVPを受賞した。プロ1年目に国際大会で個人表彰を得たことは、若手時代の代表的な実績なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：NPB一軍の個人タイトルはまだないが、2018年U-23ワールドカップで**大会MVP**。一軍では2020～2023年に4年連続100試合以上へ出場した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**73試合、210打数55安打、打率.262、6本塁打、29打点、16二塁打**。出場数はフルシーズンのレギュラー級ではないが、打率と長打は前年より上向いている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年は三塁・一塁・指名打者の候補として出場し、7月下旬には**5試合連続で4番**を任された時期もあった。9月下旬は井上広大らとの一塁の出場争いで、ベンチスタートの日も増えている。\n- 野球のエピソード：7月26日のオリックス戦でも「4番・指名打者」で先発し、サブロー監督から中軸を託された。==固定された立場ではなく、結果を出しながら打順と守備位置を取り戻すシーズンになっている==。\n- 野球以外のエピソード：球団公式Q&Aではニックネームを「ヤス」、チャームポイントを「身体が大きいところ」と回答している。自分へのご褒美は「買い物」としており、短い回答ながら素顔がうかがえる。\n- 印象的な試合：今季は複数本塁打を放ち、9月26日時点で**6本塁打**まで伸ばしている。2024年と2025年は一軍で本塁打0本だったため、今季の本塁打復活そのものが大きな変化なのだ。\n- 実績（今季の記録・表彰）：今季の個人タイトル・月間表彰はない。==9月26日時点の打率.262は、規定打席未到達ながら自身の一軍シーズン打率として高い水準==にある。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦がなく、25日の西武戦に**7番・一塁**で先発して3打数0安打1三振。26日と27日は出場せず、これが直近の出場試合なのだ。\n- エピソード：25日に先発した後、26・27日は井上広大が一塁で先発し、安田は出場機会がなかった。下位打線で長打を量産している井上との競争が、今日の起用にも関わる。\n- 調子：直近の出場は3打数無安打で、その後2試合出番がないため、短期の打撃状態は判断材料が少ない。シーズン全体では**打率.262、長打率.424**と、打撃成績は一定の水準を保っている。\n- 分析・論点：福島には今季3打数1安打で、右投手相手に左の安田を起用する理由はある一方、井上が9月に長打を重ねている。スタメンなら「左打者をぶつける選択」、代打なら「一発のある左の切り札」という起用意図が見えやすい。\n- 今日の見どころ：==清宮幸太郎と同学年の高校時代から注目された安田が、同じ試合でどんな打席を見せるかも物語の一つ==。出番が来たら、初球から振るのか、球を見極めて甘い球を待つのかに注目なのだ。\n\n### 出典\n- https://npb.jp/bis/players/81885136.html\n- https://www.marines.co.jp/team/player/detail/2026_00001255.html\n- https://ja.wikipedia.org/wiki/%E5%AE%89%E7%94%B0%E5%B0%9A%E6%86%B2\n- https://en.wikipedia.org/wiki/Hisanori_Yasuda\n- https://www.japan-baseball.jp/jp/profile/201705013.html\n- https://www.japan-baseball.jp/jp/news/press/20170907_5.html\n- https://www.japan-baseball.jp/jp/news/press/20181029_2.html\n- https://www.nikkansports.com/baseball/highschool/senbatsu/2017/score/2017033001.html\n- https://www.nikkansports.com/baseball/professional/draft/history/history2017.html\n- https://www.nikkansports.com/baseball/news/201711250000642.html\n- https://www.nikkansports.com/baseball/news/202607260000409.html\n- https://www.nikkansports.com/baseball/professional/score/2026/2026092501/0001.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true}, {"team": "ロッテ", "section": "スタメン候補", "name": "松川虎生", "title": "松川虎生（#2、捕手、右投右打、22歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**178cm・98kg**のがっしりした体格と強肩、投手と会話しながら組み立てる捕手としての守備が強みなのだ。2026年春のキャンプでは送球時の右足の使い方を課題にし、スローイングの切れを磨いていた。\n- ユニークポイント：高卒1年目の2022年に開幕戦で先発マスクをかぶり、4月10日には佐々木朗希の完全試合を最後まで受けた。==18歳の新人捕手が、27人を一人も塁に出さない完全試合の配球を担った==という、非常に珍しい経歴を持つ。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発なら、ロッテ先発のアンドレ・ジャクソンにどの球種を要求するかを追うとよい。途中出場なら、リードしている終盤に守備を固め、救援投手をどう落ち着かせるかが見どころなのだ。\n- 注目の数字・プレー：9月26日時点で**44試合、打率.189、6打点**。打撃はまだ課題だが、捕手は打つだけでなく配球、ワンバウンド処理、盗塁阻止など守備の仕事が多いため、==ボールを受けてから次のサインを出すまでの動きにも注目すると面白い==。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮には2026年に**1打数0安打1三振**。対戦数は1打席だけなので相性を語れるほどではなく、先発出場するなら打撃よりも日本ハム打線に対する配球が大きな焦点になる。\n\n### 出立ち\n- 身長・体重・体格：**178cm・98kg**で、下半身がどっしりした捕手らしい体格なのだ。高校時代には遠投110m、スクワット190kgという数値も紹介されていた。\n- 投打・フォームの特徴：右投げ右打ち。捕手としては二塁送球が1秒8台と評された強肩があり、打撃では高校通算**43本塁打**を記録したパワーを持つ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでチャームポイントを「笑顔」と答えている。試合前は音楽を聴くのがルーティンで、マスクを外したときの大きな体格と丸い表情が見分けやすい。\n- 背番号の由来・愛称・登場曲：入団以来の背番号は**2**、愛称は「まっちゃん」「こう」。登場曲はBANTY FOOT feat. EXPRESSの「交差点」などを使っている。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府阪南市出身。名前の「虎生」は、阪神ファンだった祖父が、阪神がリーグ優勝した**2003年**に生まれたことにちなみ付けたと本人が明かしている。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：東鳥取小1年でワンワンスポーツクラブから野球を始め、泉佐野リトルリーグを経て、鳥取東中では貝塚ヤングに所属。市立和歌山高では1年春から三塁手でベンチ入りし、1年秋から正捕手となった。\n- 野球のエピソード：中学の貝塚ヤングで小園健太とバッテリーを組み、3年夏に全国大会優勝。市立和歌山高でも小園とバッテリーを組み続け、2021年春の選抜に出場した。\n- 野球以外のエピソード：祖父に小さいころから甲子園へよく連れて行ってもらったと話している。また小園との新春対談では、虫が苦手で「ダンゴムシくらい」なら大丈夫、アニメや漫画が好きとも明かした。\n- 印象的な試合：2021年春の**第93回選抜高校野球大会**で、市立和歌山の主将・捕手として甲子園に出場した。高校最後の夏は和歌山大会決勝で智弁和歌山に敗れ、夏の甲子園出場は届かなかった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学3年時に貝塚ヤングで全国制覇し、高校では2021年春の選抜へ出場。高校通算**43本塁打**を放ち、強打の捕手としてドラフト1位候補になった。\n- ドラフト・入団（年・順位・球団・契約）：**2021年ドラフト1位**でロッテが単独指名し、推定**契約金1億円、年俸1300万円**で契約。同じ市立和歌山の小園健太もDeNAから1位指名され、同一高校のバッテリーがそろってドラフト1位となる史上初の例になった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2022年は高卒新人ながら**76試合**に出場し、開幕戦から先発捕手を務めた。2023年9試合、2024年2試合、2025年6試合と一軍出場は減ったが、2026年は再び出場機会を増やしている。\n- 野球のエピソード：2022年4月10日のオリックス戦では佐々木朗希とバッテリーを組み、佐々木の**完全試合、13者連続奪三振、1試合19奪三振**を支えた。松川自身も6回に3点適時二塁打を放ち、攻守で勝利に貢献したのだ。\n- 野球以外のエピソード：2022年オフには、中学時代の恩師・川端末吉監督の息子であるヤクルト川端慎吾らとの自主トレに参加した。球団公式Q&Aでは自分へのご褒美を「雪見だいふく」と答えている。\n- 印象的な試合：==2022年4月10日の佐々木朗希完全試合は、松川を語るうえで外せない一戦==なのだ。NPB公式も、高卒新人ながら大胆さと繊細さを併せ持つ配球で完全試合を演出したと紹介している。\n- 実績（タイトル・表彰・通算記録・代表）：個人タイトルやトップ代表歴はないが、高卒新人捕手として史上3人目の開幕戦先発マスクを経験。2022年の76試合出場と完全試合の捕手という実績が、若くして積んだ大きな財産なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**44試合、95打数18安打、打率.189、0本塁打、6打点、4犠打**。前年の6試合から大きく出場機会を増やした一方、打撃では27三振と課題も残っている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：春季キャンプから一軍定着を目標に争い、3月27日の開幕戦では毛利海大と組んで**開幕マスク**を任された。シーズン後半は佐藤都志也らが先発捕手を務める試合も増え、松川は先発と途中出場の両方で役割を担っている。\n- 野球のエピソード：2月のキャンプでは「まずはピッチャーからの信頼が大事」と話し、ブロッキングと送球を重点的に練習。3月27日の開幕戦では先発・毛利をリードし、自身も**2安打2打点**で3-1の勝利に貢献した。\n- 野球以外のエピソード：オフにはドジャースへ移った佐々木朗希と食事に行き、「もうちょっと打てるやろ」と励まされたと明かしている。かつて完全試合を組んだ先輩との交流を、打撃向上への刺激にしているのだ。\n- 印象的な試合：3月27日の西武との開幕戦で「9番・捕手」として先発し、2回に先制中前打、4回にも適時打を放った。==前年一軍無安打だった捕手が、開幕戦で2安打2打点を挙げた==のは今季の象徴的なスタートだった。\n- 実績（今季の記録・表彰）：今季の個人表彰はないが、9月26日時点で**44試合**に出場し、2023～2025年の3年間合計17試合を大きく上回った。開幕マスクを取り戻したことも今季の大きな実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦がなく、26日の西武戦はベンチ入りしたが出場なし。27日の日本ハム戦は8回から捕手として途中出場し、**1打数0安打1三振**だった。\n- エピソード：27日は井上広大に代わって捕手へ入り、それまで捕手だった佐藤都志也が一塁へ移った。捕手を交代しながら守備位置も動かす終盤の起用で、松川の「守備から入れる捕手」という役割が分かる場面だった。\n- 調子：9月27日の1打席は三振で、9月26日時点のシーズン打率も**.189**なので、打撃が好調とは言いにくい。一方、捕手としては途中出場でも試合を受け持てるため、打率だけで起用価値を判断しにくい選手なのだ。\n- 分析・論点：先発起用の論点は「打撃をどこまで期待するか」と「投手との組み合わせをどうするか」の両方にある。福島との対戦は1打数0安打1三振なので、打撃の相性より、ジャクソンや救援陣をどうリードするかの方が今日の価値を左右しやすい。\n- 今日の見どころ：==松川が出たら、打席だけでなく「ミットをどこに構えるか」「ワンバウンドを体で止めるか」「走者が出た時に二塁へ投げる準備をするか」を見ると捕手の仕事が分かる==。終盤に登場した場合は、若い捕手が僅差を締められるかに注目なのだ。\n\n### 出典\n- https://npb.jp/bis/players/53155155.html\n- https://www.marines.co.jp/team/player/detail/2026_00001252.html\n- https://ja.wikipedia.org/wiki/%E6%9D%BE%E5%B7%9D%E8%99%8E%E7%94%9F\n- https://en.wikipedia.org/wiki/Ko_Matsukawa\n- https://www.sponichi.co.jp/baseball/news/2021/03/29/kiji/20210329s00001002360000c.html?page=1\n- https://www.sponichi.co.jp/baseball/news/2021/10/11/kiji/20211011s00001000513000c.html?page=1\n- https://www.sponichi.co.jp/baseball/news/2021/10/11/kiji/20211006s00001728544000c.html?page=1\n- https://www.nikkansports.com/baseball/highschool/news/202101290000363.html\n- https://www.nikkansports.com/baseball/news/202111240000996.html\n- https://www.daily.co.jp/baseball/2021/11/24/0014866108.shtml\n- https://npb.jp/news/detail/20220412_01.html\n- https://www.nikkansports.com/baseball/news/202204100001208.html\n- https://www.nikkansports.com/baseball/news/202211270001101.html\n- https://www.nikkansports.com/baseball/news/202602170001596.html\n- https://www.sponichi.co.jp/baseball/news/2026/03/27/kiji/20260327s00001173438000c.html\n- https://www.sponichi.co.jp/baseball/news/2026/03/27/kiji/20260327s00001173291000c.html\n- https://www.daily.co.jp/baseball/2026/09/27/0020867128.shtml\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true}, {"team": "ロッテ", "section": "スタメン候補", "name": "宮崎竜成", "title": "宮崎竜成（#44、内野・スタメン候補、右投左打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**173cm・90kg**の低い重心から振り切る左打ちで、社会人時代から「走・攻・守の三拍子」と広角への長打力を評価されてきた内野手なのだ。本人も入団時に、打撃を評価されている一方で守備を課題に挙げており、二塁・三塁・遊撃をこなして出番を広げている。\n- ユニークポイント：母の児玉千佳さんは**1996年アトランタ五輪**ソフトボール日本代表の三塁手、父の茂夫さんも丸亀商（現・丸亀城西）で**1987年春の甲子園**に出場した野球一家なのだ。==両親とも大舞台を知る家庭から、ドラフト2位のプロ野球選手が出たという経歴が大きな個性==である。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発なら、打席だけでなく遊撃など内野での一歩目を見ると分かりやすい。**9月25日**は「8番・遊撃」で先発し、26日と27日は山崎剛が遊撃で先発したため、今日はスタメンを取り返せるかが最初の見どころなのだ。\n- 注目の数字・プレー：**9月26日時点で41試合、打率.132、1本塁打、1打点**。一軍ではまだ結果が細い一方、7月の二軍降格後から9月11日の再昇格までに二軍で**33試合・打率.300（90打数27安打）・3本塁打・19打点**と打ち直しており、速球への対応を修正してきた点に注目したい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発の福島蓮は右投手で、宮崎は左打者なのだ。ただし今季の一軍打席は**39打席**と少なく、福島との直接対戦だけで相性を断定できる材料は乏しいため、まずは150km/h前後の速球に振り負けないかを見るのがよい。\n\n### 出立ち\n- 身長・体重・体格：**173cm・90kg**。プロ野球選手としては背が高い方ではないが、胸・下半身に厚みがあるパワー型で、低い重心を生かして強く振る体格なのだ。\n- 投打・フォームの特徴：右投左打。打撃では逆方向にも強い打球を飛ばすことを意識し、2025年にはMLBのフランシスコ・リンドーアやジャズ・チザムJr.のスイングも研究していた。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「**目**」、愛称を「ウーパールーパー」と答えている。2025年版では試合前のルーティンに「腹式呼吸」を挙げており、==細い目を自分でもキャラクターとして生かしている選手==なのだ。\n- 背番号の由来・愛称・登場曲：背番号は入団時から**44**で、入団交渉時には希望番号を聞かれて一度「21」と答え、当時の吉井理人監督の番号だと知って驚いたという話がある。**44を実際に与えられた理由については公開情報が見つかりませんでした**。愛称は「ウーパールーパー」、2026年の登場曲にはBLACKPINK「GO」、モーニング娘。「LOVEマシーン」、GLAY「流星のHowl」、ベリーグッドマン「雑草」を登録している。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：徳島県板野郡北島町出身。母・児玉千佳さんはアトランタ五輪ソフトボール日本代表、父・茂夫さんは甲子園出場経験者で、父はアトランタ五輪日本選手団のトレーナーも務めたのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：北島南小3年で軟式野球を始め、北島中ではヤング徳島ホークス、創志学園高、立命館大、社会人のヤマハを経てロッテへ。創志学園では**2017年春・2018年夏の甲子園**に出場し、立命館大では1年秋からリーグ戦に出場、4年時に主将を務めた。\n- 野球のエピソード：大学4年の2022年はドラフト指名を待ったが指名されず、卒業後は野球をやめるつもりだったところをヤマハから誘われて続行した。ヤマハでは「プロへ行くなら2年」と期限を決め、他の選手が遊びに行く時間も休養や読書に回す生活を徹底し、2024年に二塁のレギュラーをつかんだのだ。\n- 野球以外のエピソード：ヤマハ時代に睡眠・食事・自己啓発・野球の本を読む習慣がつき、休日は一人でサウナにも行くと週刊ベースボールの取材で語っている。入団交渉時に好きなロッテ菓子として**アーモンドチョコレートとクランキーチョコレート**を挙げた。\n- 印象的な試合：高校3年夏の**2018年甲子園**では創志学園の一員として2試合を経験した。社会人2年目の2024年には都市対抗や日本選手権に出場し、プロのスカウトに二塁手としての打撃と身体能力を示したのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：甲子園は春夏合わせて出場経験があり、立命館大では主将、ヤマハでは2024年に二塁の主力となった。社会人時代は遠投**110m**、50m走**5秒9**と紹介され、長打だけではない身体能力も評価材料になった。\n- ドラフト・入団（年・順位・球団・契約）：**2024年ドラフト2位**で千葉ロッテから指名され、同年11月14日に契約金**8000万円**、年俸**1400万円**（いずれも推定）で契約した。指名時には将来像として「トリプルスリー（打率3割・30本塁打・30盗塁）」やゴールデングラブ賞を目標に掲げたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2025年にロッテでプロ入りし、5月に初昇格。1年目は一軍**39試合、打率.194、3打点、1盗塁**で、2026年は一軍と二軍を行き来しながら内野の複数ポジションで起用されている。\n- 野球のエピソード：2025年1月にはMLBの打者の動画を見て、強い打球を逆方向へ運ぶスイングを研究していると語った。二塁だけでなく三塁の練習も行い、==「打つだけ」でなく守備位置を増やして一軍の席を取ろうとしてきた選手==なのだ。\n- 野球以外のエピソード：新人発表会ではロッテ菓子になぞらえて自分を売り込むなど、取材では柔らかな受け答えを見せる。球団公式Q&Aでは「自分へのご褒美＝睡眠」、趣味にゲームや読書を挙げており、社会人時代から休養を重視する姿勢が続いている。\n- 印象的な試合：**2025年7月9日の日本ハム戦**で山﨑福也からプロ初安打を記録した。初球のカットボールを中前へ運んだ一打で、プロでの「0」を一つ消した試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：個人タイトルや一軍表彰はまだない。2025年終了時点では一軍39試合出場、2026年9月26日時点では通算**80試合、24安打、1本塁打、4打点**となっている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**41試合、39打席、38打数5安打、打率.132、1本塁打、1打点、出塁率.154、長打率.237**。三振は**15**で、少ない打席の中で一軍投手の速球にどう対応するかが課題として数字にも表れている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年7月9日に出場選手登録を外れ、その後は二軍で打撃を作り直し、**9月11日**に一軍再登録された。再昇格後は遊撃でも先発しており、二塁中心だったアマ時代から守備範囲を広げている。\n- 野球のエピソード：二軍で「自分の一番の持ち味は打つこと」と再確認し、特に速球を打つことをテーマにした。7月10日のくふうハヤテ戦で三塁打、7月19日の巨人戦では**144km/h**の直球を3ランにするなど、修正の手応えを積み上げたのだ。\n- 野球以外のエピソード：球団公式Q&Aでは2026年も愛称「ウーパールーパー」を継続し、登場曲を4曲登録している。派手な私生活の話よりも、睡眠・読書・サウナなどコンディショニング寄りの公開エピソードが多い選手なのだ。\n- 印象的な試合：9月11日の再昇格後に一軍で出番を得たこと自体が、二軍での**打率.300**の取り組みが評価された結果である。直近の9月25日には遊撃で先発し、打撃では2打数無安打2三振だった。\n- 実績（今季の記録・表彰）：今季は一軍で**プロ通算初本塁打となる1本**を記録している。一方、打率は.132で、表彰よりも「二軍で修正して一軍へ戻った」ことが今季の現在地なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。9月26日・27日は出場せず、最後の出場は9月25日の西武戦で「8番・遊撃」先発、**2打数0安打2三振**で途中交代だった。\n- エピソード：9月25日に遊撃で先発した翌日から2試合は、楽天から加入した山崎剛が遊撃で先発した。シーズン終盤でも若手に自動的に打席が与えられるわけではなく、1打席ずつが来季の競争にもつながる状況なのだ。\n- 調子：二軍では夏場に打率.300まで上げたが、一軍では今季**15三振／38打数**で、直近の先発でも2三振。==二軍で取り戻した速球対応を、一軍の球速・変化量で再現できるかが現在のいちばん分かりやすい調子の物差し==になる。\n- 分析・論点：打率.132だけを見ると苦戦しているが、39打席という小さい標本でもあるため、数字だけで能力を決めつける段階ではない。内野の複数ポジションを守れる価値がある一方、先発を増やすには打席で「次も使いたい」と思わせる内容が必要なのだ。\n- 今日の見どころ：スタメンなら、福島の直球系に対して引っ張り一辺倒にならず、持ち味の広角打撃が出るかを見る。途中出場なら、代打や守備からの1打席で結果を残せるかがポイントで、==出番の少なさそのものが今日の一打の重さを大きくしている==。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001302.html\n- https://www.marines.co.jp/team/player/detail/2025_00001183.html\n- https://npb.jp/bis/players/81885150.html\n- https://ja.wikipedia.org/wiki/%E5%AE%AE%E5%B4%8E%E7%AB%9C%E6%88%90\n- https://pacificleague.com/player/525099\n- https://pacificleague.com/news/2024/10/10034996\n- https://www.nikkansports.com/baseball/news/202410240001661.html\n- https://www.nikkansports.com/baseball/news/202410280001604.html\n- https://www.nikkansports.com/baseball/news/202412040001025.html\n- https://www.nikkansports.com/baseball/news/202501120000715.html\n- https://pacificleague.com/zh-CHT/news/2024/11/10035442\n- https://baseballking.jp/ns/460074/\n- https://column.sp.baseball.findfriends.jp/?id=103-20250804-07&pid=column_detail\n- https://sp.baseball.findfriends.jp/player/20000267/\n- https://baseball.omyutech.com/playerTop.action?playerId=2511092\n- https://news.mynavi.jp/article/20260922-5008083/\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://npb-meikan.jp/21961/\n- https://note.com/orions_marines/n/ndf19f0802a2c", "detail": true}, {"team": "ロッテ", "section": "ブルペン", "name": "横山陸人", "title": "横山陸人（#15、抑え、右投右打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：右のサイドスローから**平均150.2km/h、最速155km/h**のストレートを投げ込み、2026年はその直球が投球の**55.9%**を占める。そこにシンカー、スライダー、カットボールを混ぜ、==横から来るのに球速まで速いという見えにくさが最大の武器==なのだ。\n- ユニークポイント：高校時代から横手投げで、専大松戸の先輩・高橋礼の身体の使い方も参考にしてきた。2026年から背番号を**60→15**に変更し、前任の美馬学と自分が同じ持丸修一監督の教え子である縁も背負って守護神を務めている。\n\n### 見どころ\n- 今日の試合で見るべき場面：ロッテが1〜3点ほどリードして9回を迎えたら、横山の出番がいちばん分かりやすい。**9月26日**は2点リードの9回に4連打を浴びて一死も取れず逆転サヨナラ負け、27日は登板しなかったため、==今日は「失敗の次のセーブ機会」をどう投げるかが最大の見どころ==なのだ。\n- 注目の数字・プレー：**9月26日時点で52試合、2勝3敗、33セーブ、7ホールド、防御率2.50**。33セーブはリーグ上位の数字で、投球を見るなら速い直球だけでなく、空振り率の高いシンカーとスライダーを決め球にできるかにも注目したい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム戦では**9月15日**に9回途中から登板して33セーブ目を挙げている。2024年の侍ジャパン取材では日本ハムの清宮幸太郎について「どうやって抑えようかいつも迷う」と答えており、通算100本塁打目前の清宮と終盤に当たれば、以前から意識してきた強打者との勝負になるのだ。\n\n### 出立ち\n- 身長・体重・体格：**180cm・90kg**。細身のサイドスローというより、下半身と肩回りに厚みがあり、横方向の腕の振りから強い球を押し込む体格なのだ。\n- 投打・フォームの特徴：右投右打のサイドスロー。2026年の球種割合はストレート**55.9%**、シンカー**25.6%**、スライダー**15.6%**、カットボール**3.0%**で、直球と沈む球を軸に横の角度を使う。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：マウンドでは右腕が地面に近い横の軌道を通るため、初心者でもフォームの違いを見つけやすい。球団公式Q&Aではチャームポイントを「**肩**」、試合前のルーティンを「少しだけ寝る」と答えている。\n- 背番号の由来・愛称・登場曲：2020〜2025年は**60**、2026年から**15**。15は引退した美馬学が着けていた番号で、横山は美馬と高校時代の恩師・持丸修一氏が同じという縁を挙げ、「この番号に恥じない選手に」と語った。愛称は「よこ」、登場曲はSHE'S「追い風」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：東京都江戸川区南篠崎町出身。南篠崎小3年のとき、兄の友人の影響で南篠崎ランチャーズに入り、最初は捕手として野球を始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：南篠崎小、上一色中、専大松戸高を経て高卒でロッテ入り。中学では軟式野球部で投手となり、3年時に全国大会**準優勝**、専大松戸では2年秋からエースを担い、2019年春の千葉県大会で準優勝した。\n- 野球のエピソード：中学の全国大会決勝で、星稜中の奥川恭伸と投げ合った経験がある。高校では最速**148km/h**の横手投げとして注目され、専大松戸OBの高橋礼が行っていた胸郭や股関節の柔軟性を高めるトレーニングも取り入れたのだ。\n- 野球以外のエピソード：江戸川区の選手紹介では趣味を「家でゆっくりすること」と答えている。2026年の球団公式Q&Aでも「少しだけ寝る」を試合前ルーティンに挙げ、苦手な食べ物はパクチーとするなど、休養を大事にする一面が見える。\n- 印象的な試合：中学3年の全国大会決勝は、のちにプロで活躍する奥川と同じ舞台で投げた試合として経歴上の大きな節目なのだ。高校では2019年春の千葉県大会で専大松戸を準優勝に導き、高卒ドラフト候補として評価を固めた。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学軟式の全国大会準優勝、高校では千葉県大会準優勝。高校時代に世代別代表経験はなかったが、プロ入り後に侍ジャパンまで上がることになる点がこの経歴の面白さなのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト4位**で千葉ロッテから指名され、契約金**4000万円**、年俸**560万円**（いずれも推定）で合意した。入団時は「一軍で1年間を通して勝ち続けられる投手」を目標に掲げた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年入団、2021年に一軍デビュー。2023年は**38試合**で1セーブ8ホールド、2024年は**43試合・防御率1.71**、2025年は**50試合・12セーブ・20ホールド・防御率2.08**と段階的に終盤の重要な役割へ上がり、2026年に守護神へ定着した。\n- 野球のエピソード：2023年のアジアプロ野球チャンピオンシップで初めてトップチームの侍ジャパンに選ばれ、その経験を接戦での投球に生かしたと語っている。2024年にはさらに球威を上げ、プレミア12代表にも選出されたのだ。\n- 野球以外のエピソード：2025年オフの背番号変更では、美馬学との「持丸監督つながり」に強く反応し、15番を着けることを「意気に感じる」と表現した。単なる若い番号への変更ではなく、先輩との系譜を意識して受け取った番号なのだ。\n- 印象的な試合：一軍初登板は**2021年5月26日の阪神戦（甲子園）**で、1回を投げて無失点。さらに2024年には本人が侍ジャパンの取材で、オリックス戦で奪った「三者連続三振」をその年の印象的なプレーに挙げている。\n- 実績（タイトル・表彰・通算記録・代表）：**2023年アジアプロ野球チャンピオンシップ**、**2024年プレミア12**の侍ジャパンに選出。9月26日終了時点のNPB通算は**194登板、9勝11敗、49セーブ、53ホールド、防御率2.95**で、タイトルはまだないが救援投手として実績を積み上げている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**52登板、2勝3敗、33セーブ、7ホールド、50回1/3、防御率2.50、34奪三振**。被安打42、与四球20で、圧倒的な奪三振型というより強い球と打たせる球を組み合わせて最後を締めている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年オフに背番号を**60から15**へ変え、2026年は開幕から9回を任される守護神へ役割が一段上がった。前年12セーブから今季33セーブまで伸ばし、チームの試合終盤の基準点になっている。\n- 野球のエピソード：2026年の球団公式Q&Aで「今年の俺のここに注目！」に「**強い球！**」と答えた通り、平均150km/hを超える直球を中心にしている。フォームの珍しさより、サイドスローでこの球速を出すことが今季の強さなのだ。\n- 野球以外のエピソード：愛称は「よこ」で、性格を「ちょっとだけ真面目」、自分へのご褒美を「好きなものを食べる」と答えている。==守護神という重い役割とは対照的に、公式プロフィールでは力の抜けた答えが多い==のも人柄の見えやすいところだ。\n- 印象的な試合：**9月15日の日本ハム戦**では7-6の9回途中から登板し、33セーブ目。対して**9月26日の西武戦**では4-2の9回に4連打を浴び、アウトを一つも取れず3失点で逆転サヨナラ負けとなり、守護神の明暗が短期間に両方出た。\n- 実績（今季の記録・表彰）：9月26日時点の**33セーブ**はパ・リーグ上位の数字で、前年の12セーブを大きく更新した。2026年オールスターの抑え投手部門ファン投票では**393,037票**で2位となり、ファンからの認知度も上がっている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。25日の西武戦は1回を**6球、無安打無失点**、26日は9回に4打者連続安打で**0回3失点・敗戦投手**、27日の日本ハム戦は登板しなかった。\n- エピソード：26日の逆転負け後、サブロー監督は横山について「横山で負けたんなら仕方ない」という趣旨で守護神への信頼を示しつつ、救援陣に責任を求めた。翌27日は6-1で勝ったためセーブ機会自体がなく、実戦での“やり直し”は今日以降へ持ち越しなのだ。\n- 調子：25日は6球で三者を片づけた直後、26日は一死も取れず4連打と振れ幅が大きい。1試合の炎上だけで長期不調とは断定できないが、==今日はストレートが高く浮かず、シンカーを低めに集められるかが立ち直りを測るポイント==になる。\n- 分析・論点：今季33セーブを挙げている事実と、直近のサヨナラ負けは両方見る必要がある。クローザーは失敗が目立ちやすい役割なので、27日に休養を挟んだことで、球威と制球が通常状態へ戻るかが論点なのだ。\n- 今日の見どころ：9回にリードしていれば登場そのものが見どころになる。特に清宮、万波、水野ら日本ハムの中軸・上位へ回る場面なら、==「強い球」で押すのか、シンカーやスライダーでタイミングを外すのかという配球まで見ると守護神の仕事が分かりやすい==。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001281.html\n- https://npb.jp/bis/players/23125151.html\n- https://ja.wikipedia.org/wiki/%E6%A8%AA%E5%B1%B1%E9%99%B8%E4%BA%BA\n- https://en.wikipedia.org/wiki/Rikuto_Yokoyama\n- https://baseball.yahoo.co.jp/npb/player/1900083/year\n- https://www.city.edogawa.tokyo.jp/e028/sports/sports/athlete/yokoyama_yakyuu.html\n- https://www.nikkansports.com/baseball/news/201911070000726.html\n- https://www.daily.co.jp/baseball/2019/11/08/0012858965.shtml\n- https://www.marines.co.jp/news/detail/00004962.html\n- https://www.japan-baseball.jp/jp/profile/202311005.html\n- https://www.japan-baseball.jp/jp/news/press/20231024_1.html\n- https://pacificleague.com/news/2024/10/10034514\n- https://www.jsports.co.jp/baseball/premier12/samuraijapan/rikuto_yokoyama/\n- https://www.marines.co.jp/news/detail/202500748420.html\n- https://www.nikkansports.com/baseball/news/202511250000410.html\n- https://npb.jp/allstar/2026/ballotresult.html\n- https://pacificleague.com/game/36546\n- https://news.mynavi.jp/article/20260915-4820298/\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.nikkansports.com/baseball/news/202609260001502.html\n- https://note.com/basebowyer/n/n5a8b774b7d4f", "detail": true}, {"team": "ロッテ", "section": "ブルペン", "name": "鈴木昭汰", "title": "鈴木昭汰（#47、セットアッパー、左投左打、28歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：左腕から強いストレートとスライダーを軸に、終盤の1イニングを任されるセットアッパーなのだ。2024年には**51試合、防御率0.73、27ホールド、5セーブ**まで伸び、==先発候補だった投手が救援転向で一気に代表クラスへ化けた==。\n- ユニークポイント：身長**175cm**と大柄ではないが、同じ左腕の松井裕樹との自主トレで「襲いかかってくるような真っすぐ」を体感し、直球の強さと内角攻めを磨いた。2026年は再びフル回転し、9月26日時点でチーム最多級の**52登板**に達している。\n\n### 見どころ\n- 今日の試合で見るべき場面：7〜8回の接戦で左打者を含む日本ハムの中軸に回る場面が本来の出番。ただし**9月25・26・27日に3連投**しているため、今日は休養する可能性も十分あり、==もし4日連続で登板するなら、それだけベンチが「ここを落とせない」と判断した局面==と考えるとよい。\n- 注目の数字・プレー：**9月26日時点で52試合、6勝3敗、1セーブ、30ホールド、防御率2.54**。翌27日の日本ハム戦も1回を9球で三者凡退に抑えて31ホールド目を挙げており、疲労の中でもストライク先行で短く終えられるかが重要なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハムには**8月21日**に延長10回を3者連続三振で抑えて勝利投手、**8月23日**には三者凡退で30ホールドポイント、直近の**9月27日**も三者凡退だった。今日も清宮幸太郎ら左の強打者へ回れば、左腕の鈴木が重要な選択肢になる。\n\n### 出立ち\n- 身長・体重・体格：**175cm・80kg**。投手としてはコンパクトな体格だが、下半身と体幹を使って左腕を鋭く振り、打者へ近いところで球を離すような力強さがある。\n- 投打・フォームの特徴：左投左打のオーバースロー系。2024年の飛躍時はストレートとスライダーを中心にツーシームも使い、速球で押しながら緩急と横変化を混ぜる救援スタイルを確立したのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「**笑顔**」と答える一方、マウンドでは打者へ強気に向かう表情が印象的。試合前のルーティンはヨガ・ピラティスで、最近買ってよかった物にも「ピラティスマシン」を挙げている。\n- 背番号の由来・愛称・登場曲：入団時は**35**で、2023年から**47**へ変更した。変更そのものは球団発表で確認できるが、**本人が47を選んだ理由については公開情報が見つかりませんでした**。愛称は「すずしょー」、2026年の登場曲は[Alexandros]「月色ホライズン」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：茨城県土浦市出身。2020年のロッテとの契約時には母・広江さんも会見に同席し、チョコレートを食べさせてもらう写真が報じられた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：土浦東小1年で美浦ブレーブス、3年から永国東ジャイアンツでプレーし、土浦第四中では土浦霞ヶ浦ボーイズへ。常総学院高、法政大を経てロッテ入りし、高校から大学まで左の本格派としてエース級の経験を積んだ。\n- 野球のエピソード：常総学院では1年秋からエース格となり、**2015年春、2016年春・夏**の3度甲子園へ出場。法政大では故障や登板機会の少ない時期もあったが、4年春の2020年東京六大学リーグで**4試合、防御率1.54**を残し、法大のリーグ優勝に貢献したのだ。\n- 野球以外のエピソード：大学時代からサウナや水風呂を好み、プロ入り後はヨガやピラティスもコンディショニングに取り入れている。球団公式Q&Aでは自分へのご褒美を「サウナ」、苦手な食べ物を「きゅうり」と答えている。\n- 印象的な試合：2015年春の選抜では米子北戦で**7回無失点**、今治西戦では**7回1/3を1安打無失点**と好投した。2016年夏は履正社などを破ってベスト8へ進み、高校野球の全国舞台で左腕として存在感を示したのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学時代に**U-15日本代表**を経験し、高校では甲子園3度、法大では東京六大学リーグ優勝を経験した。代表歴が中学からプロまでつながっているのが特徴である。\n- ドラフト・入団（年・順位・球団・契約）：**2020年ドラフト1位**でヤクルトとロッテが競合し、抽選の末にロッテが交渉権を獲得。契約金**1億円＋出来高5000万円**、年俸**1600万円**（推定）で契約し、常総学院元監督・木内幸男氏から教わった「準備の大切さ」をプロでも守ると語った。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年は先発中心で**23試合・1勝4敗・防御率4.08**、2022年は6試合にとどまり、2023年から救援へ比重を移した。2024年に51試合・防御率0.73で大ブレークし、2025年は29試合・防御率4.82と苦しんだが、2026年は再び勝ちパターンの左腕へ戻っている。\n- 野球のエピソード：2024年の飛躍前には松井裕樹との自主トレで、投球技術だけでなく身体の使い方、栄養、野球への考え方まで学んだ。==「ストレートの強さ」と「インコース」を磨いたことが、救援で打者を押し込む土台になった==のだ。\n- 野球以外のエピソード：2026年の球団公式では性格を「短気」、心に残る言葉を「不動心」と答えている。感情が動きやすい自覚と、それを抑える言葉が同居しているのが、終盤を任される投手らしい面白さでもある。\n- 印象的な試合：2024年、本人がプレミア12前の取材でシーズン一番のプレーに挙げたのは**無死満塁からの火消し**。走者を背負った状態から点を与えない救援の仕事を、自分でも転機として強く覚えている。\n- 実績（タイトル・表彰・通算記録・代表）：2024年は**オールスター初選出**、さらに侍ジャパンの**プレミア12代表**に選ばれた。シーズンでは27試合連続自責点0を記録し、51登板で防御率0.73という救援投手として突出した数字を残した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**52登板、6勝3敗、1セーブ、30ホールド、49回2/3、防御率2.54**。救援で6勝を挙げるのは、同点や僅差の場面を任され、その直後に味方が勝ち越した試合が多いということなのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年は7月18日を最後に一軍登板がなく、コンディション不良が報じられて29試合で終えた。2026年はセットアッパーとしてシーズンを通して登板を重ね、前年の登板数を大きく上回っている。\n- 野球のエピソード：2025年秋には前年のフル回転の疲れも振り返り、2026年は「開幕を100%」で迎える準備を意識した。今季は9月下旬まで**50試合超**を投げており、復活が一時的ではなくシーズンを通したものになっている。\n- 野球以外のエピソード：2026年もヨガ・ピラティスをルーティンに挙げ、身体を整える方法そのものを趣味に近いレベルで続けている。疲労がたまる救援投手だからこそ、==球場外の「整える時間」までパフォーマンスの一部なのだ==。\n- 印象的な試合：**8月21日の日本ハム戦**では3-3の延長10回を3者連続三振に仕留め、その裏のサヨナラ勝ちで6勝目を挙げた。直球が良く「バッターに向かっていけた」と本人も振り返った、今季の強さが分かりやすい試合なのだ。\n- 実績（今季の記録・表彰）：**2026年オールスター**のパ・リーグ中継ぎ投手部門でファン投票**374,150票**を集めて選出され、2度目の球宴出場となった。9月26日時点で30ホールドに到達し、勝ちパターンの中心として数字を積み上げている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。25日西武戦は2/3回2安打無失点、26日西武戦は1回2安打1失点でホールド、27日日本ハム戦は**1回9球、三者凡退**で31ホールド目を挙げ、3日連続登板となった。\n- エピソード：3連投の中で26日は1点を失ったが、翌27日は日本ハム打線を9球で片づけた。疲労がある時期に長い回を投げず、短い球数で終えられたことは翌日の起用を考えるうえでも大きい。\n- 調子：27日は被安打・四死球ともに0で内容は良い。ただし救援投手は内容が良くても連投による疲労が別問題なので、==「調子が良い＝今日も投げる」とは限らないのがセットアッパーを見る面白さ==なのだ。\n- 分析・論点：25〜27日の3連投後で、今日投げれば4連投になる。シーズン終盤とはいえ無理をさせるか、横山・中森・八木ら他の救援へつなぐかはベンチの運用判断であり、登板の有無そのものが論点になる。\n- 今日の見どころ：ブルペンから姿を見せなければ休養と考えやすく、8回の重要場面で出てくれば勝負をかけたサインなのだ。登板した場合は、==最初の3人を少ない球数で終えられるか、特に左打者へ強い直球を内角に投げ切れるか==を見たい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001276.html\n- https://npb.jp/bis/players/71275153.html\n- https://ja.wikipedia.org/wiki/%E9%88%B4%E6%9C%A8%E6%98%AD%E6%B1%B0\n- https://en.wikipedia.org/wiki/Sh%C5%8Dta_Suzuki_%28baseball%2C_born_1998%29\n- https://pacificleague.com/player/521063\n- https://pacificleague.com/player/521063/stats\n- https://www.japan-baseball.jp/jp/profile/201302008.html\n- https://www.sponichi.co.jp/baseball/news/2020/12/05/articles/20201204s00001173735000c.html\n- https://www.nikkansports.com/m/baseball/news/amp/202012040000826.html\n- https://baseballking.jp/ns/463977\n- https://pacificleague.com/news/2024/12/10036296\n- https://www.jsports.co.jp/baseball/premier12/samuraijapan/shota_suzuki/\n- https://www.nikkansports.com/premium/baseball/news/202511280000655.html\n- https://pacificleague.com/news/2026/7/10053125\n- https://npb.jp/allstar/2026/ballotresult.html\n- https://npb.jp/allstar/2026/roster.html\n- https://www.nikkansports.com/m/baseball/news/amp/202608210001815.html\n- https://pacificleague.com/game/36628\n- https://npb.jp/scores/2026/0923/m-b-25/box.html\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://note.com/orions_marines/n/n9a10882ef55d\n- https://ringofred53.com/archives/17802515.html", "detail": true}, {"team": "ロッテ", "section": "ブルペン", "name": "中森俊介", "title": "中森俊介（#56、勝ちパターン、右投左打、24歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最速**154km/h**級の直球にスライダー、チェンジアップ、カーブ、フォークを組み合わせる右腕で、直球自体もわずかに横へ動く「真っスラ」系の球質を持つ。2025年に救援へ定着して**防御率1.23**を残し、2026年は接戦の中盤〜終盤を任されているのだ。\n- ユニークポイント：高校では先発エースとして甲子園を何度も完投したのに、プロでは先発・中継ぎの両方を経験し、救援で居場所を広げた。==「甲子園のエース」から「プロの勝ちパターン」へ役割を変えながら伸びてきた投手==なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：鈴木昭汰が3連投明けのため、ロッテが6〜8回に1〜2点差でリード、または同点なら中森の出番が増えそうだ。9月25日から**2日間登板していない**ので、鈴木より休養が取れている点も起用を考える材料になる。\n- 注目の数字・プレー：**9月26日時点で39試合、7勝1敗、1セーブ、16ホールド、防御率2.35**。救援投手の7勝は「7回勝ち投手のように投げ切った」という意味ではなく、登板中や直後に味方が勝ち越して勝利投手になった試合が多いという数字なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：**9月15日の日本ハム戦**では1回を投げ、万波中正に同点本塁打を浴びながらも2奪三振、直後に山口航輝が勝ち越しの30号を放って中森に6勝目がついた。==最近の日本ハム戦で「抑え切れなかったのに勝利投手」という救援ならではの試合を経験している==ため、今日は内容にも注目したい。\n\n### 出立ち\n- 身長・体重・体格：球団公式では**183cm・90kg**。高校時代から長身の本格派だったが、プロ入り後に体を大きくし、救援でも連投に耐えられる土台を作ってきた。\n- 投打・フォームの特徴：右投左打のオーバースロー。真っすぐは打者の手元で少し横へ動く「真っスラ」と表現され、スライダー、チェンジアップ、カーブ、フォークまで使えるため、1イニングでも球種を絞らせにくいのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでチャームポイントは「**笑顔**」、性格は「冷静沈着」と答えている。試合前のルーティンは「歯磨き」で、マウンド上でも大きく感情を出すより淡々と投げる姿が見つけやすい。\n- 背番号の由来・愛称・登場曲：入団から背番号は**56**。**56を選んだ本人の理由については公開情報が見つかりませんでした**。愛称は「しゅんボー」、2026年の登場曲はback number「SISTER」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：兵庫県丹波篠山市出身。2020年の入団交渉では、築**42年**という実家を両親や兄弟のために建て替えたいと話し、プロで稼いで家族へ恩返しする夢を語った。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：福住小2年から多紀野球少年団で野球を始め、篠山東中の軟式野球部、3年夏から三田ボーイズで硬式を経験し、明石商へ進学。高校卒業後、**2020年ドラフト2位**でロッテ入りした。\n- 野球のエピソード：明石商では1年春からベンチ入りし、1年夏の2018年甲子園で救援登板。2年の2019年は春夏ともエース格で甲子園**ベスト4**へ進み、同学年の来田涼斗とチームを引っ張ったのだ。\n- 野球以外のエピソード：丹波篠山で山登りや木登りをして育ち、入団時には「中森俊介という名前を使って、もっと丹波篠山を有名にしたい」と故郷への思いを語った。ロッテ菓子では「パイの実」が好きで、後の球団インタビューでは「雪見だいふく」も好物に挙げている。\n- 印象的な試合：**2019年春の選抜準々決勝・智弁和歌山戦**では長い投球を任されて接戦を勝ち抜き、春の4強進出に貢献した。**2020年甲子園交流試合の桐生第一戦**では9回115球、5安打9奪三振2失点（自責1）で完投し、3-2の勝利をつかんだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2019年は春夏の甲子園で**連続ベスト4**。2020年は新型コロナ禍で通常の選抜・夏の大会が中止されたが、甲子園交流試合で完投勝利を記録し、高校野球の全国舞台で豊富な登板経験を残した。\n- ドラフト・入団（年・順位・球団・契約）：**2020年ドラフト2位**で千葉ロッテから指名され、契約金**6000万円**、年俸**720万円**（推定）で契約。入団時には「ピンチでも動じない強気の投球」を持ち味とし、1年目から15勝という高い目標を掲げたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年は体づくりを優先し、2022年は二軍で登板後に右肩の状態を整える時期を経験。2023年に一軍デビューして**13試合・3勝2敗・防御率3.54**、2024年は先発中心に5試合・防御率2.63、2025年は救援で25試合・防御率1.23と役割を変えて伸びた。\n- 野球のエピソード：2023年は一軍で救援と先発の両方を経験し、オフにはオーストラリアのシドニー・ブルーソックスでも登板した。異なる役割や海外の打者を経験し、2025年の救援専任に近い起用へつながっていったのだ。\n- 野球以外のエピソード：ロッテのインタビューでは、ゲームやドラマを始めると一気に最後まで進めるが、終わるとしばらく離れるという「熱しやすく冷めやすい」面を明かしている。憧れの松坂大輔と石垣島キャンプで話せたことを「最近一番うれしかったこと」と語った時期もある。\n- 印象的な試合：プロ初勝利は**2023年4月5日の日本ハム戦（ZOZOマリン）**で、2番手として1回1失点のあと味方が勝ち越した。高校時代の完投型とは違い、救援投手の勝ち星を初めて経験した試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2025年は**25登板、2勝2敗、5セーブ、10ホールド、防御率1.23**で、監督選抜により**オールスターへ初選出**された。タイトルはまだないが、救援1年目で球宴まで上がったことが大きな実績である。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**39登板、7勝1敗、1セーブ、16ホールド、38回1/3、35奪三振、防御率2.35**。与四球は**10**で、前年ほど極端な低防御率ではないものの、接戦の重要な回を継続して任されている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年に救援で定着し、2026年はセットアッパー手前から勝ちパターンまで担当する場面が増えた。鈴木や横山の前後をつなぎ、同点でもリードでも使われる「一番配置を動かしやすい重要投手」の一人なのだ。\n- 野球のエピソード：9月は**9日楽天戦、15日日本ハム戦、25日西武戦**で勝利投手となり、月だけで3勝を積んだ。ただし9月25日時点の9月成績は7回4失点で月間防御率**5.14**なので、==「3勝＝ずっと好投」ではない点が救援投手の数字を読む大事なところ==である。\n- 野球以外のエピソード：2026年の球団公式Q&Aでは自分へのご褒美を「美容治療」、最近買ってよかった物を「パジャマ」と答えている。心に残る言葉は「個を強く」で、苦手なことは「長距離走」なのだ。\n- 印象的な試合：**9月25日の西武戦**では1回12球、1安打1奪三振無失点で7勝目。1-2の終盤から西川史礁の3ランで逆転した試合で、勝ち越し直前の回を抑えた中森に勝利がついた。\n- 実績（今季の記録・表彰）：今季の**7勝**は自己最多で、16ホールドも前年の10を更新している。勝ち星だけでなく、39登板まで登板数を増やして勝ちパターンの一角を担っていることが今季の最大の実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。26日・27日は登板せず、最後の登板は25日の西武戦で**1回12球、1安打1奪三振無失点、勝利投手**となり7勝目を挙げた。\n- エピソード：その前の9月22日は1回2安打2四球2失点と苦しんだが、25日は無四球・無失点で修正した。救援は登板間隔が短いぶん、前回の失敗を数日で切り替えられるかが重要なのだ。\n- 調子：9月は3勝している一方、7回で4失点と内容には波がある。25日の投球は良かったため、==「勝ち星の勢い」よりも、直近で四球を出さずストライクゾーン内で勝負できた点を好材料として見る==のが正確である。\n- 分析・論点：鈴木が3連投、横山は26日に敗戦して27日休養というブルペン状況では、中森の2日休養が価値を持つ。7回か8回で誰を最初に切るかによって、サブロー監督が今日どの投手を最も信頼しているかも見えてくるのだ。\n- 今日の見どころ：日本ハム打線とは13日前の9月15日に対戦しており、万波に同点弾を浴びた記憶も新しい。==再戦するなら、直球を同じように長打されないために変化球をどう混ぜるか、そして四球を出さず1イニングを完結できるか==を見るとよい。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001279.html\n- https://npb.jp/bis/players/31635153.html\n- https://ja.wikipedia.org/wiki/%E4%B8%AD%E6%A3%AE%E4%BF%8A%E4%BB%8B\n- https://pacificleague.com/player/521081\n- https://pacificleague.com/player/521081/stats\n- https://baseball.yahoo.co.jp/npb/player/2000088/\n- https://baseball.omyutech.com/playerTop.action?playerId=1075579\n- https://www.kokoshinro.com/school.php?name=%E6%98%8E%E7%9F%B3%E5%95%86\n- https://www.nikkansports.com/baseball/highschool/news/202008160000871.html\n- https://www.kobe-np.co.jp/news/sports/koya/news/202008/0013608650.shtml\n- https://sportiva.shueisha.co.jp/clm/baseball/hs_other/2019/12/17/155_split/\n- https://www.tv-tokyo.co.jp/sports/articles/2020/11/015286.html\n- https://www.nikkansports.com/baseball/news/202011260001275.html\n- https://www.daily.co.jp/baseball/2020/11/26/0013894383.shtml\n- https://column.sp.baseball.findfriends.jp/?id=097-20201126-110&pid=column_detail\n- https://baseballking.jp/ns/257824/\n- https://www.lotte.co.jp/entertainment/shallwelotte/interview/ureshii/nakamori-shunsuke/\n- https://npb.jp/bis/2025/stats/idp1_m.html\n- https://npb.jp/allstar/2025/roster.html\n- https://npb.jp/allstar/2025/roster_pl_pix.html\n- https://pacificleague.com/game/36546\n- https://news.mynavi.jp/article/20260915-4820298/\n- https://npb.jp/scores/2026/0925/l-m-22/box.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.doshinsports.com/live-npb/?global_id=20262065&kd_page=game\n- https://note.com/orions_marines/n/n16884874febe", "detail": true}, {"team": "ロッテ", "section": "ブルペン", "name": "八木彬", "title": "八木彬（#33、勝ちパターン、右投右打、29歳）", "body": "- 特徴：150キロ前後の力強い直球。44登板で救援9勝1敗、11ホールド、防御率2.17と、キャリアハイの年です。\n- 見どころ：救援での2桁勝利まであと1。同点や僅差の場面で出てくると実現します。\n- 出立ち：180cm・94kgのがっしり型。\n- プロまで：和歌山出身。八戸学院光星高で甲子園に出場し、東北福祉大から社会人の三菱重工Westへ。都市対抗で151キロを記録し、2021年ドラフト5位で入団しました。\n- プロで：昨季は自己最多の27登板でしたが防御率5点台。終盤に7試合連続無失点と、手応えをつかみました。\n- 直近1年：4/15にプロ初勝利（記念グッズの名は「まさかこんな形で」）。4/29には球団史上8人目の「1球勝利」でハーラートップに並び、「日ごろの行いがいいんかな」と笑わせました。美馬学コーチの「しっかり勝負しよう」という助言で良くなったそうです。<!-- TODO: 確認（記念グッズ名） -->\n- 直近数試合：9/22のオリックス戦で今季初黒星を喫しています。その後は登板間隔が空いており、今日は待機濃厚です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "益田直也", "title": "益田直也（#52、ベテラン右腕、右投右打、36歳）", "body": "- 特徴：ルーキーからロッテ一筋で投げ続ける「幕張の鉄腕」。今季は36登板で防御率3.22。\n- 見どころ：節目を積み重ねるレジェンドの登板そのものが見どころです。\n- 出立ち：179cm・80kg。\n- プロまで：関西国際大から2011年ドラフト4位で入団しました。\n- プロで：中継ぎと抑えを行き来しながら、長年ロッテのブルペンを支えてきました。\n- 直近1年：今季は通算250セーブで名球会入り。「250は通過点」と語り、9月には通算800試合登板も達成しました。\n- 直近数試合：昨日は8回から登板し、1回1安打3奪三振で無失点と健在です。"}, {"team": "ロッテ", "section": "ブルペン", "name": "小野郁", "title": "小野郁（#37、中継ぎ、右投右打、29歳）", "body": "- 特徴：剛速球とチェンジアップが武器。昨季は自己最速の159キロを記録しています。今季は38登板で防御率2.40。\n- 見どころ：新庄監督の高校の後輩が、先輩のチーム相手に投げる場面。\n- 出立ち：175cm・78kgと投手としては小柄です。\n- プロまで：福岡の西日本短大付高から2014年ドラフト2位で楽天へ。入団時には二刀流を打診されたこともありました。\n- プロで：楽天では1軍未勝利。鈴木大地のFA移籍の人的補償として2019年オフにロッテへ移り、中継ぎで開花しました。\n- 直近1年：昨季は47登板、10ホールド。今季も安定した数字を残しています。\n- 直近数試合：9/5に敗戦投手。直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "澤田圭佑", "title": "澤田圭佑（#54、中継ぎ、右投左打、32歳）", "body": "- 特徴：41登板、11ホールドのタフな右腕。四球が少なく、40回1/3で与四球は7です。\n- 見どころ：四球を出さない安定感で、走者を溜めた場面の火消しを担います。\n- 出立ち：178cm・96kgのがっしり型。\n- プロまで：大阪桐蔭高では藤浪晋太郎と同期で、2012年の春夏連覇を経験。立教大から2016年ドラフト8位でオリックスに入りました。\n- プロで：オリックスで戦力外になり、ロッテで育成から支配下に這い上がった苦労人です。\n- 直近1年：今季も中継ぎの一角として1年を投げ抜いています。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "坂本光士郎", "title": "坂本光士郎（#36、左の中継ぎ、左投左打、32歳）", "body": "- 特徴：球威のある直球が持ち味の左腕。33回2/3で39奪三振と、投球回を超える三振を奪っています。\n- 見どころ：清宮や水野、田宮といった日本ハムの左打者に当てるワンポイント起用。\n- 出立ち：179cm・80kg。\n- プロまで：広島出身。如水館高で甲子園に出場し、日本文理大、社会人の新日鉄住金広畑を経て、2018年ドラフト5位でヤクルトに入りました。\n- プロで：ヤクルトでは2021年に36登板し、リーグ優勝に貢献。プロ初勝利も挙げました。2022年7月に山本大貴とのトレードでロッテへ移籍しています。\n- 直近1年：昨季は8登板、防御率6点台と不振。今季は27登板で防御率3.21と復活し、交流戦では故郷の広島で好投しました。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "ブルペン", "name": "髙橋快秀", "title": "髙橋快秀（#93、若手右腕、右投右打、20歳）", "body": "- 特徴：最速154キロの伸びのある直球と、キレのあるスライダー。プロではフォークも磨いています。\n- 見どころ：育成出身ルーキーの成長。昨日のように勝ち試合でも起用され始めています。\n- 出立ち：178cm・82kg。支配下を目指す過程で体重が約3キロ増え、球速も上がったそうです。\n- プロまで：香川・多度津高から、大学の誘いを断って独立リーグの徳島インディゴソックスへ。「1年でも早くNPBに入りたかった」からだそうです。昨秋の育成ドラフト2位で入団しました。\n- プロで：1年目の今季、2軍で16試合に登板して防御率0.00。7/30に支配下を勝ち取りました。「同期の独立リーグ出身者の中で一番活躍したい」が原動力だそうです。\n- 直近1年：8/7の1軍デビュー戦では自己最速154キロを計測。フォークで来田から初奪三振を奪い、1回無失点でした。本人は「ファームでも投げたことのないくらい落ちた」と語っています。\n- 直近数試合：今季4登板で防御率9.00。ただ昨日は7回に1回無失点1奪三振で、ホールドを記録しました。"}, {"team": "ロッテ", "section": "ブルペン", "name": "宮﨑颯", "title": "宮﨑颯（#66、左腕、左投左打、26歳）", "body": "- 特徴：威力のある直球が武器のサウスポーです。\n- 見どころ：大差がついた場面での登板が中心。来季へのアピールの場です。\n- 出立ち：180cm・93kg。\n- プロまで：埼玉栄高から東京農大。2022年の育成ドラフト8位でソフトバンクに入りました。\n- プロで：1年目に左肘のトミー・ジョン手術。3年目の昨年7月に支配下となり、8/5のロッテ戦では藤原からプロ初奪三振。ところがオフに戦力外となりました。ソフトバンクからは育成再契約を打診されましたが、ロッテが支配下で獲得しています。\n- 直近1年：野球を始めた頃から書き続けるノートがホークス時代に18冊。それを携えて幕張に来ました。今季は10登板で防御率6.17です。\n- 直近数試合：直近3試合の登板はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "ソト", "title": "ソト（#99、内野、右投右打、37歳）", "body": "- 特徴：経験豊富な助っ人スラッガー。今季は打率.222ながら17本塁打、47打点です。\n- 見どころ：終盤の勝負所での代打。一発で流れを変えられます。\n- 出立ち：185cm・97kg。\n- プロまで：プエルトリコ出身で、米国のマイナーでプレーした後に来日しました。\n- プロで：DeNA時代に2年連続で本塁打王。ロッテ移籍後も主軸を担ってきました。\n- 直近1年：6月の巨人戦でNPB通算200号。「NPBで200本打てるなんて…」と感慨を語りました。\n- 直近数試合：9/25は代打から一塁に入り、9回に中前打でチャンスを広げました。9/26・27は出番なしです。"}, {"team": "ロッテ", "section": "代打・代走", "name": "上田希由翔", "title": "上田希由翔（#10、内野、右投左打、25歳）", "body": "- 特徴：左の強打者。今季は57試合で打率.221、7本塁打です。\n- 見どころ：右投手相手の代打。山崎・小川の打席で送られる可能性があります。\n- 出立ち：183cm・96kg。\n- プロまで：愛産大三河高から明治大。2023年ドラフト1位で入団しました。\n- プロで：定位置はつかめていません。ドラフトでの指名順を指した自虐ネタのぼやきが、ファンの笑いを誘ったこともあります。\n- 直近1年：一塁・三塁で安田や寺地と競いながら、出場機会を増やしました。\n- 直近数試合：直近3試合の出場はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "池田来翔", "title": "池田来翔（#00、内野・代走、右投右打、26歳）", "body": "- 特徴：内野をどこでも守れるユーティリティ。今季は80試合出場で打席は88と、代走・守備固めが主な仕事です。\n- 見どころ：終盤に一塁走者が出たときの代走。\n- 出立ち：180cm・95kgと、代走要員にしてはがっしりした体格です。\n- プロまで：千葉出身で、小学時代はマリーンズジュニアに選ばれました。習志野高から国士舘大へ進み、「強打の二塁手」として2021年ドラフト2位で入団しました。\n- プロで：昨季は自己最多の83試合に出場し、5本塁打とパンチ力を見せました。\n- 直近1年：今季は打率.224、本塁打は0です。キャンプ地・都城市とのコラボメニューがZOZOマリンで販売されるなど、球場内での露出もあります。\n- 直近数試合：9/25・26と連日、終盤に一塁走者の代走で出場。打席はありません。"}, {"team": "ロッテ", "section": "代打・代走", "name": "山本大斗", "title": "山本大斗（#61、外野、右投右打、24歳）", "body": "- 特徴：吉井前監督が「ダイナマイト」と命名した右の大砲。今季は打率.183、2本塁打と苦しんでいます。\n- 見どころ：左腕が出てきた場面の代打。山口とも仲が良く、ベンチの盛り上げ役です。\n- 出立ち：180cm・88kg。登場曲にはケンドリック・ラマーやサンボマスターを使っています。\n- プロまで：鳥取出身。島根の開星高から2020年の育成ドラフト3位で入団しました。\n- プロで：2022年途中に支配下。イースタンでタイトルを獲るなどし、2025年は4月にプロ初本塁打。6・7月は4番を打ち、オールスターにも初出場しました。107試合で11本塁打です。\n- 直近1年：今季は確実性を課題に挑みましたが、71試合で打率.183。7月にはファームで3試合連続複数安打を記録しました。\n- 直近数試合：直近3試合の出場はありません。"}, {"team": "日本ハム", "section": "先発投手", "name": "福島蓮", "title": "福島蓮（#45、先発、右投右打、23歳）", "body": "- 特徴：テイクバックの小さいフォーム。長身から角度のある直球とフォークが武器です。75回1/3で78奪三振と、投球回を超える三振を奪っています。\n- 見どころ：負けたらほぼ終わりの試合で、約2カ月半ぶりの先発。中継ぎからの転換で、何回まで持つか。調子の良い山口や西川史礁との右対右も注目です。\n- 出立ち：190cm・81kgの細身長身。登場曲は嵐で、嵐のラストライブに感動したと語っています。\n- プロまで：青森・八戸西高で、21世紀枠で創部初の甲子園に出場。「憧れは大谷翔平」と語り、2021年の育成ドラフト1位で入団しました。本人は「日本ハムからの指名はないかなと思っていた」そうです。\n- プロで：2024年3月に支配下契約。育成からのエース、ソフトバンクの千賀滉大を目指す「千賀2世」を掲げました。4月のデビュー戦は5回5奪三振2失点。昨季は春先の不調を乗り越え、8先発で5勝0敗、防御率2.25。クライマックスシリーズでも8回途中2失点10奪三振と好投しました。\n- 直近1年：背番号が94から45になり、ローテ定着と2桁勝利を目指したシーズン。前半は先発ローテーションに入り、後半は救援に回りました。「代理守護神」としてプロ初セーブも挙げ、「マウンドでハイタッチは初めて」と喜びました。今季は26登板で5勝4敗1S5H、防御率3.35。\n- 直近数試合：9月は救援7試合すべて無失点、3ホールド、1セーブです。状態の良さを買われての先発ですが、長いイニングは投げていません。球数は60〜80球、3〜5回での継投が濃厚です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "水野達稀", "title": "水野達稀（#43、遊撃・1番、右投左打、26歳）", "body": "- 特徴：今季大ブレイクした「打てる遊撃手」。打率.285、11本塁打、29二塁打、チーム最多の15盗塁です。積極的に打ちにいくスタイルで、三塁打も多く打っています。\n- 見どころ：初回の第1打席。出塁して清宮の前に走者を置けるかが、得点の鍵になります。\n- 出立ち：171cm・80kgの小柄でがっしり型。他球団から「近藤健介と重なる」と評されています。\n- プロまで：香川出身。丸亀城西高から社会人のJR四国を経て、2021年ドラフト3位で入団しました。\n- プロで：1・2年目は打率1割台。そこから打率.220、.247と毎年数字を上げ、2年連続で100試合に出場しました。\n- 直近1年：契約更改では「ボスを日本一監督にする」と誓いました。5月からはリードオフマンに定着し、一時は打率リーグ2位に。「ショートが打てるチームは強い」と語っています。7/2の史上初の「初回先頭から4者連続本塁打」では、2人目として勝ち越し弾を放ちました。\n- 直近数試合：3試合で10打数1安打と下降気味です。9/26は死球と犠打でつなぎ、昨日は初回に右前打。当たりが止まっているのが、打線の得点力低下につながっています。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "田宮裕涼", "title": "田宮裕涼（#64、捕手・2番、右投左打、26歳）", "body": "- 特徴：打てて走れる捕手。強肩の送球は「ゆあビーム」と呼ばれます。打率.266、三塁打4本です。\n- 見どころ：福島とのバッテリー、ロッテの走者への送球、そして地元千葉での凱旋打。\n- 出立ち：175cm・84kg。\n- プロまで：千葉・成田高から2018年ドラフト6位で入団しました。\n- プロで：下位指名から道を切り開き、プロ6年目の2024年に初スタメンからブレイク。一時はリーグトップの打率を残しました。\n- 直近1年：今季は93試合で打率.266、7本塁打。進藤と捕手を分け合い、新庄監督は試合途中に捕手を代える采配もよく見せます。\n- 直近数試合：9/24は代打で三振。9/26のオリックス戦は2番捕手で出場し、0-0の8回に決勝タイムリーを放ちました。昨日は出場なしで、今日は捕手で先発の番と見ています。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "清宮幸太郎", "title": "清宮幸太郎（#21、指名打者・3番、右投左打、27歳）", "body": "- 特徴：今季は23本塁打、65打点と長打力を発揮。四球を47個選んでいます。\n- 見どころ：通算100号まであと1本。今日最大の節目です。\n- 出立ち：184cm・95kg。\n- プロまで：早稲田実業で高校通算111本塁打。履正社の安田（現ロッテ）と「東の清宮、西の安田」と称されました。2017年ドラフトでは7球団が競合した超目玉です。\n- プロで：初本塁打はルーキーの2018年5月9日、オリックス戦でした。その後は故障や伸び悩みが長く、「ブレイク待ち」と言われ続けました。2018年のルーキーが、今日100本目を狙っています。\n- 直近1年：開幕直後のロッテ戦では1試合2本塁打。どちらもレイエスとの2者連続弾でした。シーズンを通して中軸を打ち、132試合に出場しています。\n- 直近数試合：9月は14安打のうち7本が本塁打という極端な当たり方。9/24はノーヒット、9/26は9回にダメ押しの23号ソロ。昨日は3打数ノーヒット（1四球）です。単打より一発に賭ける状態なので、ジャクソンの失投を一振りで仕留められるかが論点です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "野村佑希", "title": "野村佑希（#5、一塁・4番、右投右打、26歳）", "body": "- 特徴：右の中軸打者。今季は115試合で打率.260、17本塁打、60打点です。\n- 見どころ：レイエス不在の4番として、ジャクソンの直球を打てるか。\n- 出立ち：187cm・95kgの大柄。\n- プロまで：花咲徳栄高で夏の甲子園優勝を経験。2018年ドラフト2位で入団しました。\n- プロで：高卒数年で中軸を任された生え抜きです。三塁と一塁を行き来してきました。後輩の有薗は入団時に「目標は野村さん」と弟子入りを志願しています。\n- 直近1年：レイエス・清宮・万波と中軸を組み、チームの本塁打量産を支えました。レイエス離脱後は4番を担っています。\n- 直近数試合：9/24は3番指名打者で投手内野安打。9/26は途中から左翼に入り右前打。昨日は4番一塁で2三振の後、9回に左前打でした。3試合で9打数3安打と、打線では数少ない当たりが続いている打者です。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "万波中正", "title": "万波中正（#66、右翼・5番、右投右打、26歳）", "body": "- 特徴：巨体からの長打と、右翼からの強肩。今季は21本塁打ですが、三振も109と多いです。\n- 見どころ：右翼からの返球と、海風に負けない一発。\n- 出立ち：192cm・102kgの大柄で、父はコンゴ出身です。\n- プロまで：横浜高から2018年ドラフト4位で入団。清宮の1学年下にあたります。\n- プロで：新庄監督の下で開花し、2023年には25本塁打で本塁打王争いを演じました。\n- 直近1年：春には「定位置の確約なし」と言われるほど外野の競争が激しかった年です。7/2の4者連続本塁打では4人目を担い、「ちょっと理解できない」と漏らしました。8/21に下半身の不調で離脱。ファーム復帰戦では4安打を放ち、9/15に1軍に戻りました。\n- 直近数試合：3試合で11打数1安打。昨日も2三振と、復帰後は調子が上がりきっていません。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "有薗直輝", "title": "有薗直輝（#39、三塁・6番、右投右打、23歳）", "body": "- 特徴：広角に長打を飛ばす右の長距離砲。肩の強さも売りです。\n- 見どころ：実は小6の時にマリーンズジュニアに選ばれた千葉育ち。ZOZOマリンでの一発なるかです。\n- 出立ち：185cm・104kgの巨体。\n- プロまで：マリーンズジュニア時代は、体育のバスケで右手中指を痛めて大会では控えでした。中学の佐倉シニアでは本塁打を量産するタイプではありませんでした。それが千葉学芸高で開花し、甲子園出場なしながら高校通算70本塁打。2021年ドラフト2位で入団しました。\n- プロで：1年目から新庄監督に「思い切りがいい」と評され、1軍に初昇格しました。昨季はイースタンで首位打者・本塁打王・最高出塁率の3冠。8月に1軍で待望のプロ初安打を放ちました。\n- 直近1年：「1軍でホームラン量産」を誓った今季は、32試合で打率.240、1本塁打。8月上旬には5試合連続安打も記録しました。\n- 直近数試合：3試合で9打数ノーヒット、5三振。昨日は途中で奈良間に交代しており、郡司や奈良間が三塁で先発する可能性もあります。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "山縣秀", "title": "山縣秀（#54、二塁・7番、右投右打、24歳）", "body": "- 特徴：「リアル殿馬」と呼ばれる守備職人。打率.222ですが、犠打やセーフティーバントもこなします。\n- 見どころ：二遊間で水野と組む守備。\n- 出立ち：176cm・82kg。特技はピアノで、起業にも関心がある文武両道型です。\n- プロまで：東京・国分寺出身。都内屈指の難関校、早大学院から早稲田大へ進みました。入学時の目標は「4年秋に守備固めでベンチ入り」でしたが、2年秋には遊撃のレギュラーに。小宮山悟監督に「六大学で一番うまいショートになる可能性がある」と言わしめました。4年春には打率.366でベストナインとリーグ優勝。大学日本代表でも世界大会優勝を経験し、2024年ドラフト5位で入団。同校出身のプロは66年ぶり2人目です。\n- プロで：指名時の目標は「何回でもゴールデングラブ賞を」。1年目の昨季は球団新人で一番乗りの1軍昇格を果たしました。初スタメン初打席初安打、6月にはプロ1号が決勝弾になりました。\n- 直近1年：2年目の今季は「二遊間に山縣がいなきゃいけない選手に」と誓いましたが、58試合の出場。ルーキーの大塚と二塁を分け合っています。推しは球団マスコットのポリーちゃんだそうです。\n- 直近数試合：9/24・26は大塚が先発しました。昨日は7番二塁で中前打を放ち、9回に西川遥輝が代打に出ました。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "矢澤宏太", "title": "矢澤宏太（#12、中堅・8番、左投左打、26歳）", "body": "- 特徴：身体能力が高く、走塁と守備が売りです。今季は三塁打4本。登録上は投手の二刀流です。\n- 見どころ：中堅の広い守備範囲と全力疾走。大差がつけば投手としての登板もゼロではありません。\n- 出立ち：173cm・72kgと、プロでは小柄な体格です。\n- プロまで：藤嶺藤沢高から日体大。大学3年で二刀流が開花し、「投手でも野手でも1位」と評されました。2022年ドラフト1位で入団しています。\n- プロで：入団後は二刀流に挑戦。昨季は外野に専念して自己最多の86試合に出場し、打率.247でした。CSでは「打球は1秒も見ず、歓声と三塁コーチの反応で走った」という全力疾走を見せています。\n- 直近1年：今季は「外野手でレギュラーを獲る。センターが固まれば強いチームになる」と宣言。ところが5/23のソフトバンク戦では、9点ビハインドの8回に2年ぶりに投手として登板しました。近藤を遊飛に打ち取り、場内を騒然とさせています。\n- 直近数試合：9/26は三塁打を含む3安打と大活躍。昨日は内野ゴロ3つでした。調子の波はありますが、今の打線では貴重な当たりです。"}, {"team": "日本ハム", "section": "予想スタメン", "name": "宮崎一樹", "title": "宮崎一樹（#36、左翼・9番、右投右打、25歳）", "body": "- 特徴：パワーとスピードを兼ね備える外野手。今季の1軍は数試合で、昨日が抜擢でした。\n- 見どころ：水谷の骨折で回ってきたチャンスを生かせるか。昨日は2番で起用されました。\n- 出立ち：184cm・91kg。登場曲はMrs. GREEN APPLEの「Soranji」です。\n- プロまで：実家は東京・日野市のそば屋「増田屋」。山梨学院高ではレギュラーになれませんでしたが、臨時コーチの小倉清一郎氏が素質を見抜いていました。山梨学院大で開花し、3年秋は打率.600、5本塁打。日米大学野球の代表にも選ばれ、2023年ドラフト3位で入団しました。\n- プロで：1年目の5月31日に初昇格し、新庄監督から「鎌ヶ谷だと思ってやれ」と声をかけられました。昨季は2軍で85試合に出場し、1軍ではプロ初タイムリーを放っています。\n- 直近1年：今季も多くの時間を2軍で過ごしました。1軍では昨日までに17打数2安打、1本塁打です。\n- 直近数試合：昨日は2番左翼で先発し、3回に右前打を放っています。実は高校時代の2019年センバツで、今のチームメイト進藤勇也がいた筑陽学園と対戦しています。"}, {"team": "日本ハム", "section": "スタメン候補", "name": "進藤勇也", "title": "進藤勇也（#33、捕手、右投右打、24歳）", "body": "- 特徴：強肩と長打力を備える若手捕手。9/26時点で64試合、打率.215、7本塁打。田宮とマスクを分け合っています。\n- 見どころ：前日に8号ソロを放ったばかり。福島とのバッテリーを任されるか、田宮に代わって途中出場するかに注目です。\n- 出立ち：182cm・95kgのがっしりした捕手です。\n- プロまで：福岡・筑陽学園高から上武大へ進み、2023年ドラフト2位で入団しました。\n- プロで：1年目は2試合、2年目は13試合の出場でしたが、3年目の今季は出場機会を大きく増やしました。\n- 直近1年：昨季は26打数2安打でしたが、今季は9/26までに29安打、7本塁打。守備だけでなく一発も期待できる捕手になっています。\n- 直近数試合：9/24は2打数ノーヒット、9/26は出場なし。昨日9/27は3打数1安打で、5回にチーム唯一の得点となる8号ソロを放ちました。"}, {"team": "日本ハム", "section": "スタメン候補", "name": "郡司裕也", "title": "郡司裕也（#3、一塁・三塁・捕手、右投右打、28歳）", "body": "- 特徴：捕手登録ながら一塁、三塁、外野もこなす右打者。9/26時点で打率.245、6本塁打、出塁率.350です。\n- 見どころ：野村の一塁、有薗の三塁、田宮・進藤の捕手と、複数の場所でスタメンに入れるのが強み。右投手ジャクソン相手でも中軸候補です。\n- 出立ち：180cm・90kg。捕手としては厚みがあり、内野も守る体格です。\n- プロまで：仙台育英高から慶応大へ進み、2019年ドラフト4位で中日に入りました。\n- プロで：2023年途中にトレードで日本ハムへ移籍。出場機会を増やし、2024年は127試合、昨季は111試合で打率.297、10本塁打でした。\n- 直近1年：今季は一時2軍調整も経験し、7月に1軍復帰。8月には約1年ぶりに先発マスクをかぶり、本塁打と好リードで勝利に貢献しました。\n- 直近数試合：9/24は出場なし。9/26は4番一塁で4打数ノーヒット、昨日は出場しませんでした。前々日の右投手相手では先発しており、今日も起用候補です。"}, {"team": "日本ハム", "section": "スタメン候補", "name": "大塚瑠晏", "title": "大塚瑠晏（#49、二塁、右投左打、22歳）", "body": "- 特徴：169cmの小柄な左打者ですが、パンチ力があります。ルーキーながら9/26時点で6本塁打を放っています。\n- 見どころ：山縣との二塁争い。左打ちなので、右腕ジャクソン相手なら先発に戻る可能性があります。\n- 出立ち：169cm・69kg。内野手としては小柄で、軽快な動きが持ち味です。\n- プロまで：東海大相模高から東海大へ進み、2025年ドラフト3位で入団しました。\n- プロで：1年目から1軍に定着し、9/26時点で59試合、打率.185、6本塁打。6月には2試合連続本塁打とプロ初の猛打賞を記録しました。\n- 直近1年：大学から入った新人が、二塁のスタメン争いに割って入りました。打率は低めですが、135打数で6本塁打と長打があります。\n- 直近数試合：9/24と9/26はいずれも二塁で先発し、計6打数ノーヒット。昨日は山縣が先発し、大塚の出場はありませんでした。"}, {"team": "日本ハム", "section": "スタメン候補", "name": "奈良間大己", "title": "奈良間大己（#58、内野、右投右打、26歳）", "body": "- 特徴：二遊間を中心に守れる右打ちの内野手。9/26時点で打率.248、5本塁打、7盗塁と、守備要員だけではない数字です。\n- 見どころ：有薗の三塁や山縣の二塁に代わって出る可能性があります。終盤の守備固めでも出番が多い選手です。\n- 出立ち：172cm・75kgの小柄な内野手です。\n- プロまで：常葉大菊川高から立正大へ進み、2022年ドラフト5位で入団しました。\n- プロで：1年目から65試合に出場。昨季まで内野の控えとして経験を積み、今季は9/26までに自己最多の114試合に出場しています。\n- 直近1年：今季は打撃でも存在感を増し、9/13には5号先制ソロ。6月には9回の勝ち越し適時二塁打も放っています。\n- 直近数試合：9/24は出場なし。9/26は終盤に三塁の守備へ入り打席なし。昨日は有薗に代わって三塁に入り、2打数ノーヒットでした。"}, {"team": "日本ハム", "section": "スタメン候補", "name": "西川遥輝", "title": "西川遥輝（#7、外野、右投左打、34歳）", "body": "- 特徴：4度の盗塁王に輝いたベテラン。9/26時点で通算345盗塁で、350盗塁まであと5です。\n- 見どころ：先発なら左翼、ベンチなら代打・代走の切り札。1本出て塁に出れば、盗塁の節目も視野に入ります。\n- 出立ち：181cm・82kg。細身ながら長く俊足を武器にしてきました。\n- プロまで：智弁和歌山高から2010年ドラフト2位で日本ハムに入団しました。\n- プロで：日本ハムで4度の盗塁王。楽天、ヤクルトを経て、今季5年ぶりに古巣へ復帰し、背番号7を再び着けています。\n- 直近1年：9/26時点で24試合、打率.197、1本塁打、2盗塁。長く2軍調整が続きましたが、9/15に約5カ月ぶりに1軍へ戻り、復帰初戦で盗塁を決めました。\n- 直近数試合：9/24は1番左翼で3打数ノーヒット。9/26は出場なし。昨日は9回に山縣の代打で出て空振り三振でした。"}, {"team": "日本ハム", "section": "ブルペン", "name": "柳川大晟", "title": "柳川大晟（#47、抑え、右投右打、23歳）", "body": "- 特徴：191cmの長身から投げ下ろす守護神。9/26時点で52登板、29セーブ、防御率1.59、51回で57奪三振です。\n- 見どころ：日本ハムがリードして9回を迎えれば最有力。前々日にセーブを挙げており、今日も最後を締める役目です。\n- 出立ち：191cm・96kg。ブルペンでも目立つ大型右腕です。\n- プロまで：九州国際大付高から2021年育成ドラフト3位で入団しました。\n- プロで：育成からはい上がり、2024年に8セーブ、昨季は11セーブ。今季は本格的に抑えを任され、数字を大きく伸ばしました。\n- 直近1年：今季は52試合で4勝1敗29セーブ。被安打23に対して57奪三振と、走者を出しても三振で切れるのが強みです。\n- 直近数試合：9/24は登板なし。9/26は2点リードの9回を1回無失点、2奪三振で29セーブ目。昨日は登板せず、今日は連投ではありません。"}, {"team": "日本ハム", "section": "ブルペン", "name": "島本浩也", "title": "島本浩也（#40、左の勝ちパターン、左投左打、33歳）", "body": "- 特徴：経験豊富な左のリリーフ。9/26時点で45登板、22ホールド、防御率2.43です。\n- 見どころ：藤原、佐藤、寺地、小川、髙部らロッテの左打者が続く場面。中盤から終盤の火消し役として出てくる可能性があります。\n- 出立ち：176cm・73kg。細身のベテラン左腕です。\n- プロまで：福知山成美高から2010年育成ドラフト2位で阪神に入りました。\n- プロで：阪神では2019年に63試合、防御率1.67。長く左の中継ぎを担い、昨年11月に伏見寅威とのトレードで日本ハムへ移りました。\n- 直近1年：移籍1年目から45試合に登板し、2勝3敗2セーブ22ホールド。新天地でも接戦の左腕として定着しています。\n- 直近数試合：9/24、26、27の3試合はいずれも登板なし。間隔が空いており、今日は使いやすい状態です。"}, {"team": "日本ハム", "section": "ブルペン", "name": "堀瑞輝", "title": "堀瑞輝（#34、左の中継ぎ、左投左打、28歳）", "body": "- 特徴：奪三振力の高い左腕。9/26時点で42登板、防御率2.41。33回2/3で50三振を奪っています。\n- 見どころ：左打者が並ぶロッテ打線にぶつけやすい投手。島本とともに、6〜8回のどこで出てくるかがポイントです。\n- 出立ち：177cm・91kg。がっしりした体格のサウスポーです。\n- プロまで：広島新庄高から2016年ドラフト1位で入団しました。\n- プロで：2019〜22年は毎年40試合以上に登板。近年は登板数を落としていましたが、今季は再び1軍のブルペンに戻っています。\n- 直近1年：昨季は2登板、防御率16.20でしたが、今季は42登板で4勝1敗1セーブ18ホールド。復活を印象づけるシーズンです。\n- 直近数試合：9/24、26、27の3試合はいずれも登板なし。島本と同じく、今日は十分に休養があります。"}, {"team": "日本ハム", "section": "ブルペン", "name": "孫易磊", "title": "孫易磊（#96、中継ぎ、右投左打、21歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最大の武器は力のある直球なのだ。2025年の支配下登録時には平均球速が前年の**145〜146km/h**から**148〜150km/h**へ上がったと話しており、2026年6月11日のDeNA戦では自己最速の**158km/h**を計測しながら**6回無失点・8奪三振**で来日初勝利を挙げた。\n- ユニークポイント：台湾から育成契約で入り、**#196→#96**と支配下へ駆け上がった21歳なのだ。高校では打者中心の時期もあったが投手として急成長し、2026年はWBCのチャイニーズ・タイペイ代表にも選ばれている。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発の福島蓮が早めに降りたときの複数イニング、または接戦の中盤で出てくる場面なのだ。==先発でも救援でも投げられるため、「何回から任され、何人をつなぐか」を見ると役割が分かりやすい。==\n- 注目の数字・プレー：9月26日時点で**20登板、2勝1敗、6ホールド、防御率2.83、28回2/3で26奪三振**なのだ。直球で押し込みつつ、2025年に習得を進めたカーブや磨いたスライダーで空振りを取れるかに注目したい。\n- 対戦相手との関係（今日の先発・打線との相性）：ロッテとは8月29日に救援で対戦し、**2回1安打無失点**で今季2勝目を挙げている。今日も藤原恭大、山口航輝、佐藤都志也ら長打のある打者に対し、四球を増やさず直球をゾーン内へ投げ込めるかが焦点なのだ。\n\n### 出立ち\n- 身長・体重・体格：球団公式では**183cm・96kg**。2025年5月の支配下契約時は93kgだったため、その後も体を大きくしていることが分かる。\n- 投打・フォームの特徴：**右投左打**の右腕で、速い直球を軸にする本格派なのだ。支配下昇格時に本人が「メンタルと直球の質」に自信があると話し、2025年にはフォームが安定してカーブ、スライダーにも手応えを得ていた。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「**目がきれい**」と答えている。休日はゴルフやゲームをして過ごすという、21歳らしい一面もある。\n- 背番号の由来・愛称・登場曲：育成時代は**196**、2025年5月22日の支配下登録で**96**になったのだ。呼び名は「イーレイ」、登場曲は伍佰（ウー・バイ）の「衝衝衝」である。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：台湾・台北市出身。中国語版Wikipediaでは阿美族のルーツを持ち、兄の孫易伸も野球選手と紹介されている。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：台北市の東園国小、重慶国中を経て穀保家商でプレーし、中国文化大へ進んだ。大学在学中の2023年に日本ハムと契約し、日本でプロ生活を始めた。\n- 野球のエピソード：高校1年時は打者としての出場が多く、2年時は投打の両方、3年時に投手中心へ移ったという経歴なのだ。==「ずっと投手一筋」ではなく、短期間で国際大会級の右腕へ伸びたのが大きな特徴である。==\n- 野球以外のエピソード：プロ入り前の学校生活や趣味について、具体的に裏づけられる公開情報が見つかりませんでした。\n- 印象的な試合：2023年のU-18ワールドカップでは米国戦の救援で自己最速だった**155km/h**（中継表示では156km/h）を計測した。この大会での投球が、日本ハムが獲得を進める大きな材料になった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2017年U-12ワールドカップで台湾代表として準優勝を経験し、2023年にはU-18台湾代表で世界大会に出場した。甲子園や日本の大学リーグでの実績ではなく、台湾代表歴がプロ入り前の軸なのだ。\n- ドラフト・入団（年・順位・球団・契約）：NPBドラフトを経ず、2023年10月に日本ハムと**4年の育成契約**を結んだ。中央社は契約総額を推定**9000万円**と報じ、当初の背番号は196だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2024年から育成選手として日本ハムに所属し、2025年5月22日に支配下登録された。2025年は1軍で**9登板、1セーブ、4ホールド、防御率5.11**、2026年は先発も救援も経験している。\n- 野球のエピソード：2025年5月5日のイースタン・ヤクルト戦では先発して**6回無安打無失点**、継投ノーヒットノーランの一員となり、同月の支配下昇格につなげた。新庄剛志監督は昇格時、まず中継ぎを経験させ、将来的には先発へ戻す構想を語っていた。\n- 野球以外のエピソード：球団公式Q&Aでは、休日はゴルフとゲーム、好きな食べ物は焼肉、憧れの選手はサッカーのクリスティアーノ・ロナウドと答えている。競技の枠を越えてCR7を目標像にしているわけだ。\n- 印象的な試合：2026年6月11日のDeNA戦がプロで最大の転機なのだ。**6回2安打無失点、8奪三振**、4回まで完全投球で、自己最速158km/hも出して来日初勝利を手にした。\n- 実績（タイトル・表彰・通算記録・代表）：2025年5月22日に1軍初登板と初ホールド、同27日に初セーブ、2026年6月11日に初勝利を記録した。さらに**2026 WORLD BASEBALL CLASSIC™チャイニーズ・タイペイ代表**に選出されている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**20登板、2勝1敗、6ホールド、防御率2.83、28回2/3、22被安打、13四球、26奪三振**なのだ。9月27日は登板していないため、NPBの9月27日終了時点の通算値も同じである。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年は支配下2年目として1軍で先発と救援の両方を任されている。6月11日は先発で初勝利、8月29日はロッテ戦で中継ぎとして2勝目を挙げ、役割を固定せず起用されてきた。\n- 野球のエピソード：8月29日のロッテ戦では、大川慈英の後を受けた上原健太が無死で3点を失ったあとに登板し、**2回1安打無失点**で流れを止めた。日本ハムが9-7で勝ち、孫に勝ち星が付いた。\n- 野球以外のエピソード：2026年版の球団Q&Aでは性格を「おもしろい」、MBTIをINFJ、仲の良いチームメートを「大和」と答えている。日本での生活に溶け込みながら、プロフィールでは日本語の回答も増えている。\n- 印象的な試合：やはり6月11日のDeNA戦で、==「6回無失点・8奪三振・158km/h」で来日初勝利==という内容は今季の象徴なのだ。単なる若手救援ではなく、長い回を抑えられることを示した。\n- 実績（今季の記録・表彰）：今季はNPB初勝利を記録し、9月26日時点で防御率**2.83**を維持している。加えてWBC台湾代表という国際舞台も経験したシーズンなのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日の楽天戦で8回途中から登板し、**1/3回、1安打、1四球、1奪三振、2失点**。9月26日のオリックス戦と9月27日のロッテ戦は登板していない。\n- エピソード：直近のロッテ戦での登板は8月29日で、2回無失点で勝利投手になっている。今日と同じ相手に一度「火消し」を成功させているのは見逃せない材料なのだ。\n- 調子：シーズン防御率2.83と全体では安定している一方、最後の登板だった9月24日は3打者に対して2走者を出し、2点を失った。直近1試合だけを見れば、球威よりもストライクを先行できるかを確かめたい状態である。\n- 分析・論点：28回2/3で**26奪三振**と空振りを取る力はあるが、**13四球**もある。==球が速いかだけでなく、最初の1〜2球でストライクを取れているかを見ると、その日の出来が分かりやすい。==\n- 今日の見どころ：日本ハムは残り試合が少なく、接戦なら1点の重みが大きい。孫が出てきたら、ロッテの中軸を直球で押し込めるか、そして9月24日の乱れをすぐ修正できているかを見たい。\n\n### 出典\n- https://npb.jp/bis/players/83785159.html\n- https://media.fighters.co.jp/player/96/\n- https://www.fighters.co.jp/news/detail/202300430869.html\n- https://www.fighters.co.jp/news/detail/202300435908.html\n- https://www.fighters.co.jp/news/detail/202500714987.html\n- https://npb.jp/announcement/2025/pn_registered.html\n- https://www.cna.com.tw/news/aspt/202310160190.aspx\n- https://www.cna.com.tw/news/aspt/202310300168.aspx\n- https://zh.wikipedia.org/wiki/%E5%AD%AB%E6%98%93%E7%A3%8A\n- https://www.nikkansports.com/baseball/news/202505220000508.html\n- https://www.nikkansports.com/baseball/news/202606110001638.html\n- https://npb.jp/scores/2026/0829/f-m-20/box.html\n- https://npb.jp/scores/2026/0924/f-e-25/box.html\n- https://npb.jp/scores/2026/0926/b-f-25/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html", "detail": true}, {"team": "日本ハム", "section": "ブルペン", "name": "大川慈英", "title": "大川慈英（#27、中継ぎ、右投左打、22歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最速**155km/h**の力強い直球が軸で、球団はドラフト時に「球速以上に威圧感のあるストレート」と評価したのだ。大学4年間はすべて救援登板で、内角を大胆に攻めながら変化球も組み合わせて三振を取ってきた。\n- ユニークポイント：2025年ドラフト1位の新人でありながら、1年目から救援だけでなく先発も経験している。==大学では全34登板が救援だった投手が、プロ1年目に先発へ挑んでいるところが面白い。==\n\n### 見どころ\n- 今日の試合で見るべき場面：前日9月27日にロッテ戦で**2/3回無失点・1奪三振**と抑えており、連投で使われるか、それとも福島蓮が早く降りたときの長めの救援に回るかが見どころなのだ。新人なので、点差のある場面から経験を積ませる起用も考えられる。\n- 注目の数字・プレー：9月26日時点では**4登板、5回2/3、防御率9.53、2奪三振**。翌27日の無失点登板を加えると5登板・防御率8.53になるため、==今日見るべきは「数字の悪さ」より、最近の投球が改善しているかどうかなのだ。==\n- 対戦相手との関係（今日の先発・打線との相性）：ロッテとは8月29日にプロ初先発し、**4回4失点**で佐藤都志也に3ラン、上田希由翔にソロを浴びた。一方で9月27日は同じロッテに救援で無失点だったので、今日登板すれば短期間での再々戦になる。\n\n### 出立ち\n- 身長・体重・体格：球団公式では**178cm・70kg**。細身の体から150km/h台の直球を投げるタイプなのだ。\n- 投打・フォームの特徴：**右投左打**で、直球を中心に打者の内角へ強く投げ込むのが持ち味。大学時代から救援で短いイニングを全力で投げる経験が多く、プロでもまずはその強さを生かす形になっている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでは「ゲン担ぎもルーティンも、あえてしない」と答えている。決まった儀式で気持ちを作るより、その場の勝負に集中するタイプというわけだ。\n- 背番号の由来・愛称・登場曲：背番号は新人から**27**で、登場曲はYOASOBIの「祝福」。背番号27を選んだ本人の具体的な由来説明は確認できなかった。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：神奈川県出身。家族構成については、公開情報が見つかりませんでした。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：常総学院高から明治大へ進み、東京六大学で4年間プレーした。明治大では国際日本学部に在籍し、投手としてリーグ戦に**34試合**登板した。\n- 野球のエピソード：東京六大学では4年間の**34登板がすべて救援**で、通算52回2/3を投げて62奪三振、防御率2.91だった。最終学年の2025年秋は9試合12回で10奪三振、四死球1、防御率**0.75**と安定していた。\n- 野球以外のエピソード：大学4年時には「機動戦士ガンダム」に夢中になり、特にシャア・アズナブルを気に入ったとスポニチに話している。好きな音楽はSlipknotで、2026年の球団Q&Aではヘビーメタルを聴いて気分を上げると答えた。\n- 印象的な試合：常総学院高3年の2021年センバツでは甲子園のマウンドを経験した。大会では2試合に登板し計**9回**を投げて自責点1で、高校時代から全国舞台で救援力を示している。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2021年春の甲子園に常総学院の投手として出場し、大学では東京六大学通算**34試合、3勝1敗、防御率2.91、62奪三振**。4年秋の防御率0.75がドラフト直前の強いアピールになった。\n- ドラフト・入団（年・順位・球団・契約）：2025年10月23日のドラフトで日本ハムから**1位指名**を受けた。11月に契約金**1億円＋出来高払い、年俸1300万円**（いずれも推定）で仮契約し、2026年から背番号27で入団した。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2026年4月19日の西武戦で1軍初登板。4月の最初の2登板はいずれも1アウトで降板する苦しいスタートだったが、二軍で先発調整も行い、8月29日のロッテ戦で1軍初先発、9月には再び救援へ戻った。\n- 野球のエピソード：8月29日の初先発では2回まで無安打無失点だったが、3回に連続四球から佐藤都志也の3ランを浴びた。本人は「ホームランより、四球で自分の首を絞めたことが悔しい」と振り返り、ゾーン内で勝負することを課題に挙げた。\n- 野球以外のエピソード：好きな映画・アニメは「機動戦士ガンダム」、座右の銘はシャアの言葉として知られる「身構えている時には、死神は来ないものだ」。遠征にはノートを必ず持っていくという一面も球団公式で明かしている。\n- 印象的な試合：プロ初先発の8月29日ロッテ戦は**4回4安打4失点、2奪三振、4四死球**だった。打線が直後に逆転して黒星は付かず、先発として「2回までは無安打」という手応えと、四球から崩れた課題の両方が出た試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2026年フレッシュオールスターゲームに選出された。1軍では9月27日終了時点で**5登板、1ホールド**を記録している。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**4登板、0勝0敗、1ホールド、5回2/3、9被安打、5四球、2奪三振、防御率9.53**なのだ。9月27日に2/3回無失点を加え、同日終了時点では5登板、6回1/3、防御率8.53となった。\n- 経歴（昇格・降格・故障・役割の変化・契約）：4月に1軍デビュー後は二軍で経験を積み、8月29日に1軍登録されて初先発、翌30日に抹消された。9月23日に再登録され、今度は救援としてブルペンに入っている。\n- 野球のエピソード：二軍では先発にも挑戦し、8月21日のロッテ戦では**6回1失点・6奪三振**で勝利投手になった。その8日後に同じロッテを相手に1軍初先発しており、短期間で相手のレベルが二軍から一軍へ変わったのだ。\n- 野球以外のエピソード：球団公式Q&Aでは好きな食べ物をうなぎ、好きなアーティストをSlipknotと答えている。ルーティンをあえて作らない一方、音楽で気持ちを高めるのが大川流なのだ。\n- 印象的な試合：9月23日の楽天戦では再昇格当日に**1回1安打無失点**でプロ初ホールドを記録した。8月の初先発で出た課題から、短い救援で結果を残す形へ戻している。\n- 実績（今季の記録・表彰）：プロ初登板、プロ初先発、プロ初ホールドをすべて新人年に経験し、フレッシュオールスターにも出場した。==1年で「救援→先発→救援」と役割を変えながら学んでいること自体が今季の大きな実績なのだ。==\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日の楽天戦と9月26日のオリックス戦は登板なし。9月27日のロッテ戦では8回途中から登板し、**2/3回、5球、無安打無四球、1奪三振、無失点**だった。\n- エピソード：その前の登板は9月23日の楽天戦で、1回無失点のホールドだった。再昇格後は**2登板で計1回2/3無失点**と、4月や8月の登板より結果がまとまっている。\n- 調子：通算防御率はまだ8点台だが、直近2登板は無失点で、27日はわずか5球で2アウトを取った。小さなサンプルながら、ストライク先行で早く打者を片づけられた点は良い材料なのだ。\n- 分析・論点：8月29日のロッテ戦では四球が失点のきっかけになった一方、9月27日は無四球だった。==大川を見るときは球速だけでなく、「先頭打者にボールが続いていないか」を見ると成長が分かりやすい。==\n- 今日の見どころ：前日に同じロッテ打線を抑えた直後なので、もし連投するなら対応力が試される。佐藤都志也や上田希由翔など8月に本塁打を浴びた相手と再び当たれば、リベンジの分かりやすい場面になるのだ。\n\n### 出典\n- https://npb.jp/bis/players/61365152.html\n- https://media.fighters.co.jp/player/27/\n- https://www.fighters.co.jp
