ドを見られる==のだ。\n\n## しくみ\n\nNPB公式日程では、10月1日に**千葉ロッテ対北海道日本ハム**がZOZOマリンで18:00開始と発表されている。ロッテ球団公式カレンダーでもホームゲームとして確認できる。\n\nただし、今日の9月28日から3日後なので、順位や記録の状況は今日の結果で変わる。先発投手や当日のスタメンも、現時点では今日と同じとは限らない。\n\n==「今日気になった選手をもう一度見る」という目的で次戦を選ぶと、2回目の観戦はかなり見やすい==。同じ球場なので、入場や座席までの感覚も一度経験済みになるからだ。\n\n## 今日の試合で見るなら\n\n今日、**清宮幸太郎**の通算100本塁打挑戦や、**山口航輝**の長打が気になったら、10月1日の出場情報も当日に確認してみよう。\n\n==今日の「誰を見ればいいか分からない」が、次回は「この選手を見たい」に変われば十分==なのだ。"}, "8-02-c": {"meta": {"id": "8-02-c", "title": "二軍や独立リーグの試合も観られる？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-02-b", "8-04"], "sources": ["https://npb.jp/farm/2026/", "https://npb.jp/campaign/2026/farm/", "https://npb.jp/news/detail/20260927_01.html", "https://npb.jp/farmchamp/2026/", "https://bc-l.jp/operating.php"]}, "body": "## ひとことで\n\n観られる。**NPBのファーム（二軍）**も、NPBとは別組織の**独立リーグ**も一般向けの試合を行っている。==一軍より選手との距離が近い球場もあり、若手を覚える入口になる==のだ。\n\n## しくみ\n\n2026年のNPBファームは、従来の2リーグ制から**1リーグ3地区制**へ変わった。ロッテと日本ハムはともに東地区で、日本ハムは2026年の東地区優勝。ファーム公式戦のレギュラーシーズンは9月27日に全日程を終えている。\n\nその後は、10月3日・4日に静岡で**ファーム日本選手権2026**が行われる。つまり、今日9月28日の時点では通常のファーム公式戦は終わっているが、若手中心の公式戦を見る機会はまだ残っているのだ。\n\n独立リーグでは、たとえば**ルートインBCリーグ**が2026年も公式戦を開催し、千葉スカイセイラーズなどが参加している。==日程・球場は各リーグ公式サイトで確認するのが確実==だ。\n\n## 今日の試合で見るなら\n\n今日の先発**福島蓮**のような若い投手が気になったら、次はファームの選手一覧や成績を追ってみるといい。\n\n==一軍で名前を覚え、ファームや独立リーグで「次に上がってきそうな選手」を探す==と、観戦の楽しみ方が一段増えるのだ。"}, "8-02": {"meta": {"id": "8-02", "title": "次はいつ観に行ける？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "images": "v2", "children": ["8-02-a"], "related": ["8-01"], "sources": ["https://npb.jp/games/2026/schedule_10_detail.html", "https://www.marines.co.jp/ticket/", "https://www.mlb.com/news/mike-king-casiano-10000-baseball-games"], "episode": "v2"}, "body": "## ひとことで\n==今日の次に**ZOZOマリン**でロッテを観られる公式戦は、**10月1日（木）18時**の日本ハム戦だ。==9月でシーズンが終わるわけではないのだ。\n\n## しくみ\nNPBの10月日程では、ロッテは**10月1日から6日まで**ZOZOマリンで**主催試合**（自分たちが本拠地で開く試合）が続く。次の予定はこうなっている。\n\n- 10月1日（木）18時　日本ハム戦\n- 10月2日（金）18時　ソフトバンク戦\n- 10月3日（土）18時　ソフトバンク戦\n- 10月4日（日）18時　楽天戦\n- 10月5日（月）18時　西武戦\n- 10月6日（火）18時　西武戦\n\n==チケットは千葉ロッテ公式のチケットページから試合を選んで確認する。==残席や価格は変わるので、行きたい日を決めたらその時点の表示を見るのが確実だ。\n\n\n同じ相手でも、**先発投手や順位**の状況で試合の見え方は変わる。今日覚えたルールを、数日後にもう一度球場で確かめると理解が早いのだ。\n\n## おもしろエピソード\n2026年4月26日、ニューヨーク・メッツの本拠地シティ・フィールドで、**マイク・“キング”・カシアーノ**という73歳のファンが、プロ野球観戦**1万試合目**を迎えた。\n\n最初の1試合は、1963年に10歳だったカシアーノが父親に連れて行ってもらったヤンキー・スタジアムだった。その後、メッツの本拠地へ通うようになり、1989年からは短縮シーズンなどを除いて毎年200試合以上を見る生活になった。\n\n==1日に3試合を見たことも20回あり、試合の記録は手書きのノートに残し続けた==。1万試合の日も、祝福の映像が大型ビジョンに出たあと、カシアーノはいつもの席でノートを開き、次の一球を書き留めていた。\n\n## 今日の試合で見るなら\n今日の先発はロッテがアンドレ・ジャクソン、日本ハムが福島蓮だ。次回10月1日に来るなら、今日の打者がどの投手にどう対応したかを一つだけ覚えておくといい。\n\n山口航輝や清宮幸太郎のような長打者が、数日後に同じ球場でどう攻められるかを比べるだけでも、2回目の観戦はかなり違って見えるのだ。"}, "8-03-a": {"meta": {"id": "8-03-a", "title": "写真や動画は撮っていい？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-03"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_text.html", "https://npb.jp/npb/satsuei_haisin_kitei_20250901.html", "https://www.marines.co.jp/stadium/rule", "https://www.marines.co.jp/news/detail/202600768522.html"]}, "body": "## ひとことで\nルールを守れば、球場で**写真や動画を撮ること自体はできる**。ただし、==撮影できることと、SNSなどへ公開できることは別のルールなのだ。==\n\n## しくみ\nNPBの現行規程では、三脚などの大型機材、フラッシュ、通路に居座る撮影、周囲の観戦を妨げる撮り方は禁止されている。ZOZOマリンの2026年ルールでは、クルーや売り子への撮影も禁止だ。\n\nSNSへの写真投稿は、禁止された方法で撮ったものなどを除けば可能だ。動画は条件が細かい。**イニング中のグラウンド内動画**は未編集で60秒以内、1人につき1試合1回までで、試合後に投稿できる。\n\nグラウンド外やイニング中以外のグラウンド内動画は、140秒以内なら投稿できる。==試合映像や音声のライブ配信、リアルタイムの試合データ配信はできない==ので注意が必要なのだ。\n\n## 今日の試合で見るなら\n**清宮幸太郎**や**山口航輝**の打席を撮りたくなっても、まず周りの人の視界をふさがないことが先だ。==スマホを高く掲げ続けず、自分の席から短く撮る==くらいが分かりやすい目安になるのだ。"}, "8-03-b": {"meta": {"id": "8-03-b", "title": "チケットの半券やスコアを残すには？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-03", "4-01"], "sources": ["https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n紙のチケットが残るなら半券と一緒に、**日付・対戦カード・最終スコア**を残すと振り返りやすい。==電子チケットでも、試合の記録を自分のメモに残せば同じ役目を果たすのだ。==\n\n## しくみ\nいちばん簡単なのは、写真アルバムやメモに「2026年9月28日、ロッテ対日本ハム」と書き、試合後に最終スコアを加える方法だ。紙の半券があるなら、小さな封筒やカード用の袋に入れて一緒に保管できる。\n\nさらに一言だけ感想を添えると、その日の記憶が戻りやすい。「**福島蓮**の初回が印象に残った」「外野への大きな打球で立ち上がった」くらいで十分だ。==細かいスコアを全部書かなくても、自分が覚えておきたい場面が1つあればいい==のだ。\n\n## 今日の試合で見るなら\n試合が終わったら、スコアボードの結果と、気になった選手を1人だけ記録してみよう。**アンドレ・ジャクソン**、**福島蓮**、**清宮幸太郎**など、名前を1つ残すだけでも今日の試合を思い出す手がかりになる。\n\n公開用の写真を作るなら、==チケットに表示される個人情報は写さない==ようにしておくと安心だ。"}, "8-03": {"meta": {"id": "8-03", "title": "今日の思い出を残すには？", "category": "8", "level": "1", "priority": "star", "needs_check": false, "styled": true, "children": ["8-03-a", "8-03-b"], "related": ["8-04", "7-04"], "sources": ["https://npb.jp/npb/satsuei_haisin_kitei_text.html", "https://www.marines.co.jp/stadium/rule", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n観戦の思い出は、**写真・短いメモ・試合結果**の3つを残すと振り返りやすい。==全部を撮ろうとせず、「自分が気になった瞬間」を少し残すだけで十分なのだ。==\n\n## しくみ\n写真なら、試合前の球場全体、スコアボード、応援の景色などを数枚残すと、その日の空気を思い出しやすい。プレー中も撮影はできるが、NPBには撮影方法やSNS投稿についての規程がある。三脚やフラッシュ、周囲の観戦を妨げる撮り方などは禁止されている。\n\n次に、スマホのメモへ「初めて分かったこと」を1つだけ書く。たとえば「フォークは落ちる球だった」「二死から全員が走った」のような短文でいい。==記録というより、自分の目がどこで止まったかを残す==と、その試合だけの思い出になる。\n\n最後に、日付、対戦カード、最終スコアを残す。紙のチケットが手元に残るなら一緒に保管できるし、電子チケットでも日付と試合名を書いたメモがあれば十分だ。公開する写真には、個人情報が写り込まないよう注意する。\n\n## おもしろエピソード\n野球は、1球ごとに少し間がある。そのため「今の球は何だった？」と話したり、次の打者を確認したりしながら記録を残しやすい。==観戦しながら全部メモする必要はなく、回と回の間に一言だけ残せばいい==のだ。\n\n## 今日の試合で見るなら\n試合前なら、**アンドレ・ジャクソン**と**福島蓮**の先発表示を1枚残すと今日らしさが出る。試合中に**清宮幸太郎**の節目の一発や、**山口航輝**の本塁打が出たなら、写真そのものだけでなく「何回だったか」もメモしておくと後から追いやすい。\n\n==今日の一枚を決めるなら、結果が出たあとのスコアボードでもいい。==勝敗だけでなく、あなたが初めて球場で野球を見た日の景色まで一緒に残るというわけだ。"}, "8-04-a": {"meta": {"id": "8-04-a", "title": "選手のSNSや球団の動画は？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-04", "8-01-a"], "sources": ["https://www.fighters.co.jp/entertainment/sns/", "https://www.marines.co.jp/sponsor/index.html", "https://pacificleague.com/"]}, "body": "## ひとことで\n選手をもっと知りたいなら、まず**球団公式SNSや公式動画**から入ると分かりやすい。==本人かどうか分からないアカウントを探すより、公式の案内からたどる方が確実なのだ。==\n\n## しくみ\n日本ハムは公式サイトにSNS一覧があり、X、YouTube、Instagramなどへの入口をまとめている。ロッテも公式サイトでX、YouTube、Instagram、TikTok、Facebookを案内している。\n\n選手個人のSNSは、全員が使っているとは限らない。名前だけで検索すると同姓同名や非公式アカウントも出るので、==球団公式から紹介されているか、本人と確認できる表示があるかを確かめる==といい。\n\n球団やリーグの動画は、顔と名前を覚えるのにも向いている。試合映像だけでなく、選手名を見ながら動画を見ると、次の観戦で見つけやすくなるのだ。\n\n## 今日の試合で見るなら\n今日気になった**福島蓮**、**清宮幸太郎**、**山口航輝**などの名前を1人だけ覚えておこう。==帰宅後にまず球団公式のサイトや動画からその名前を探す==と、次に見るときの入口になるのだ。"}, "8-04": {"meta": {"id": "8-04", "title": "推しの選手を見つけるには？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["8-04-a"], "related": ["4-07", "8-01"], "sources": ["https://npb.jp/pl/", "https://pacificleague.com/news/2026/9/86605", "https://www.nikkansports.com/baseball/news/202609260001729.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n**推しの選手**は、詳しい成績を全部覚えてから決めるものではない。==「この人が出てくると少し見たくなる」という引っかかりを探せばいいのだ。==\n\n## しくみ\n探し方は、大きく3つある。まずはプレーの特徴だ。強い打球を飛ばす、足が速い、守備範囲が広い、球が速いなど、見た瞬間に分かる特徴から入ると覚えやすい。\n\n次は役割だ。先発投手、4番打者、抑え、代走など、選手には試合の中で任される仕事がある。==「何をする人なのか」が分かると、その選手が出た理由まで見える==ようになる。\n\n最後は、その日にかかっている記録や流れだ。ロッテの**山口航輝**は9月27日時点で32本塁打。日本ハムの**清宮幸太郎**は通算100本塁打まであと1本と報じられている。日本ハム先発の**福島蓮**は7月12日以来の先発だ。\n\n数字だけで決める必要はない。構え方、登場曲、守る位置、走り方など、気になった理由は何でもいい。==最初の推しは「説明できるほど好き」ではなく、「もう一度見たい」で十分なのだ。==\n\n## おもしろエピソード\n同じ選手でも、打つ日、守る日、ベンチから出てくる日で印象は変わる。だから1試合で決めきれなくても問題ない。次に観たとき、また自然に目で追っていたら、それが推しの始まりかもしれないのだ。\n\n## 今日の試合で見るなら\n長打が好きなら**山口航輝**や**清宮幸太郎**、投手を見たいなら**福島蓮**から追うと入りやすい。走塁なら**西川遥輝**が塁に出たあとを見る方法もある。\n\n==1人だけ「打席や登板が来たら画面から目を離さない選手」を決めてみよう。==その選手を軸にすると、初めての試合でも流れを追いやすくなるのだ。"}, "8-05-a": {"meta": {"id": "8-05-a", "title": "サッカー観戦との違いは？", "category": "8", "level": "2", "priority": "normal", "needs_check": false, "styled": true, "related": ["8-05", "1-03"], "sources": ["https://www.jleague.jp/a-to-z/game_time/", "https://www.jleague.jp/outline/j1/", "https://npb.jp/npb/2026rules.html", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\nサッカーは**90分の流れを追う**競技で、野球は**1球ずつ場面が区切られる**競技だ。==初めて野球を見るなら、ずっと集中し続けるより「投手が投げる瞬間」に目を戻せばいいのだ。==\n\n## しくみ\nJリーグの試合は前後半45分ずつが基本で、時計はほぼ動き続ける。野球には同じ形の試合時計がなく、3アウトになるまで攻撃が続く。\n\nだから観客の見方も変わる。サッカーではボールと選手の移動を連続して追う。野球では投球前に止まり、投球、打球、走塁が短いまとまりで起きる。==途中でスコアボードを確認しても、次の1球から戻りやすい==のだ。\n\n## 今日の試合で見るなら\n**福島蓮**や**アンドレ・ジャクソン**が投球動作に入ったらグラウンドを見る。プレーが止まったらアウト数や走者を確認する。==この繰り返しだけでも、初観戦では十分に試合を追える==のだ。"}, "8-05": {"meta": {"id": "8-05", "title": "ほかのスポーツ観戦と何が違う？", "category": "8", "level": "1", "priority": "normal", "needs_check": false, "styled": true, "children": ["8-05-a"], "related": ["1-03", "1-05", "6-01"], "sources": ["https://npb.jp/pl/", "https://npb.jp/npb/2026rules.html", "https://www.jleague.jp/a-to-z/game_time/", "https://npb.jp/games/2026/schedule_09_detail.html"]}, "body": "## ひとことで\n野球の大きな特徴は、**時計ではなくアウトで区切って進む**ことだ。==1球ごとに止まり、次の作戦を考える時間があるので、「間」まで含めて観るスポーツなのだ。==\n\n## しくみ\nサッカーは前後半45分ずつの計90分が基本で、プレーが止まっても時計は動き続ける。野球はそうではない。攻撃側が3アウトになるまで1回の半分が続き、9回まで積み重ねていく。\n\nそのため、同じ「1試合」でも時間の感覚がかなり違う。野球では投手が1球投げるたびに、打者、捕手、走者、守備が次の動きを考える。==何も起きていないように見える数秒にも、次のプレーの準備が入っている==のだ。\n\n見る対象も切り替わりやすい。投球前は走者、投げた瞬間は打者、打球が飛べば守備、プレーが止まればスコアボードを見る。ずっとボールだけを追うより、場面ごとに見る場所を変えると分かりやすい。\n\n応援にも区切りがある。打者ごとの応援や、得点機に使われる応援など、試合の状況に合わせて空気が変わる。==「今は何の場面か」が分かるほど、球場の音の変化にも気づける==というわけだ。\n\n## 今日の試合で見るなら\n2026年のパ・リーグは、9月27日時点で9回試合の平均時間が**3時間3分**だ。今日も18時開始だが、決まった時刻に必ず終わるわけではない。\n\n**アンドレ・ジャクソン**と**福島蓮**が1球投げるたびに、次の投球まで少し間ができる。==その間に「走者はいるか」「アウトはいくつか」だけ確認する==と、野球独特のテンポをつかみやすいのだ。"}, "maker": {"meta": {"id": "maker", "title": "製作者のエピソード", "needs_check": false, "related": ["1-14", "1-02-c", "5-03", "5-03-c", "5-03-d", "5-06-a", "7-04", "7-01-b", "2-07-d", "2-11"], "sources": ["https://news.yahoo.co.jp/expert/articles/6ac92ea9ebcca06ebee8795275f72efd1cffa52a", "https://www.baseball-station.com/memories/2013%E5%B9%B4%E5%A4%8F-%E7%94%B2%E5%AD%90%E5%9C%921%E5%9B%9E%E6%88%A6-%E4%BB%99%E5%8F%B0%E8%82%B2%E8%8B%B1vs%E6%B5%A6%E5%92%8C%E5%AD%A6%E9%99%A2/", "https://ja.wikipedia.org/wiki/2004%E5%B9%B4%E3%81%AE%E3%82%AA%E3%83%BC%E3%83%AB%E3%82%B9%E3%82%BF%E3%83%BC%E3%82%B2%E3%83%BC%E3%83%A0_(%E6%97%A5%E6%9C%AC%E3%83%97%E3%83%AD%E9%87%8E%E7%90%83)", "https://spaia.jp/column/baseball/npb/8094", "https://ja.wikipedia.org/wiki/%E6%96%B0%E5%BA%84%E5%8A%87%E5%A0%B4", "https://number.bunshun.jp/articles/-/851073?page=2", "https://ja.wikipedia.org/wiki/%E6%B8%A1%E8%BE%BA%E4%BF%8A%E4%BB%8B"]}, "body": "## 製作者と野球\nこのガイドを作った人は、もともと**巨人**（セ・リーグの読売ジャイアンツ）が好きだった。東京ドームが歩いて行ける距離にあり、テレビでもよく巨人戦が放送されていたからだ。\n\nただ、実際によく球場へ行ったのは**神宮球場**（ヤクルトの本拠地）だった。親戚がチケットを持っていたので、ヤクルトファンの友だち（このガイドを読んでいるあなたも知っている人）と一緒に、ヤクルト戦をよく観ていたのだ。\n\nほかにも、横浜スタジアム（DeNA）、京セラドーム（オリックス）、マツダスタジアム（広島）へ行ったことがある。マツダスタジアムでは、==試合が**夜中の0時を過ぎても**終わらない==という、なかなかない一夜も体験した。\n\n## 高校野球を追っていたころ\n製作者は、甲子園の**高校野球**を追っていた時期がある。そのころ見ていた選手が、今日の試合にも出ている。\n\n- **西川遥輝**（日本ハム）：智弁和歌山で、珍しく**1年生のころから**試合に出ていたので印象に残っている。プロでも活躍していて、うれしい選手なのだ\n- **清宮幸太郎**（日本ハム）：東京の早稲田実業の選手で、==中学生のころから「大物になりそう」と有名==だった。プロに入ってしばらくは苦戦したが、今は活躍していて、今日は[通算100号](#/q/5-06-a)に王手をかけている\n\n## 日本ハム：甲子園のスターが集まるチーム\n日本ハムは、高校野球で活躍したスターを[ドラフト](#/q/1-14)（プロ球団が新人選手を選ぶ会議）で取ることが多い。だから、==高校時代からの物語をそのまま追いかけられる==、製作者にとって楽しいチームなのだ。\n\nたとえば**大谷翔平**（花巻東）、**斎藤佑樹**（早稲田実業。「ハンカチ王子」と呼ばれた）、**中田翔**（大阪桐蔭）、**杉谷拳士**（帝京）。斎藤佑樹や杉谷拳士は、引退後の**セカンドキャリア**（選手をやめたあとの仕事）も面白く、球団が応援しているイメージがあるそうだ。→ [大谷翔平やダルビッシュがいたって本当？](#/q/5-03-c)\n\n## 小島和哉と、受験生を甲子園に引き戻した試合\nロッテでは、今の投手・**小島和哉**や外野手・**藤原恭大**（大阪桐蔭で春夏連覇）を少し追っていた。なかでも忘れられないのが、2013年夏の甲子園1回戦、**浦和学院（埼玉）対 仙台育英（宮城）**だ。\n\n浦和学院はその春のセンバツ（春の甲子園）で優勝したばかりで、2年生エースの小島は「夏も優勝候補」と言われていた。相手の仙台育英も強打のチーム。前評判どおり、試合は点を取っては取られる**大乱打戦**になった。\n\n10対10で迎えた9回。小島は満塁のピンチを3者連続三振で切り抜けるなど粘ったが、球数は180球を超えていた。9回2死から安打を打たれ、監督が交代を告げても、小島はマウンドを降りたがらなかったという。==代わった2番手投手がサヨナラ打を浴び、11対10で仙台育英が勝った==のだ。\n\n製作者は受験期で、「1試合だけ、ちょっとだけ」と見始めた。ところがあまりの展開に、==受験期なのに高校野球を見ずにはいられなくなった、元凶のような試合==だそうだ。\n\n## 新庄剛志という人\n今日の日本ハム監督・[新庄剛志](#/q/5-03-d)は、とにかく**エンターテイナー**だ。\n\n- **オールスター**（ファン投票などで選ばれた両リーグのスターが集まる、夏のお祭り試合）では、2004年に「MVPは僕がもらいます」と予告。本当に、捕手が投手へボールを返すすきに三塁から本塁へ走り込む==**単独ホームスチール**（打球なしで、走者が1人で本塁を盗むこと。成功はめったにない）==を、オールスター史上初めて決めて、MVPを取った\n- 2004年には、映画『スパイダーマン2』にちなんだスパイダーマンの**被り物**や、ゴレンジャーの被り物で登場したこともある\n- 2006年6月には、札幌ドームの天井近く（約50m）から、小さなゴンドラに乗って**上空から降りてくる**という登場もした\n- 引退も型破りで、2006年の**4月**、シーズンが始まったばかりの時期に「今年で引退する」と宣言した。そのまま主力として戦い、チームは**日本一**に。レギュラーのまま、頂点でユニホームを脱いだのだ\n\nこの年の日本ハムは、とにかく華のあるチームだった。製作者はこの1年だけは日本ハムファンで、日本シリーズの新庄の最後の打席では、==テレビの前で「シンジョー！」と叫びながら号泣していた==そうだ。\n\n## ZOZOマリン（千葉マリン）の思い出\n今日の球場は、昔は**千葉マリンスタジアム**と呼ばれていた。[海風](#/q/7-04)の影響もあるのか、印象に残る試合がいくつもある。\n\n- **渡辺俊介**：ふつう投手は上や斜めから投げるが、渡辺は==地面に手がつきそうなほど低い位置から投げる「サブマリン」（アンダースロー）==の投手だった。この球場で、ノーヒットノーラン（相手に安打も得点も許さず勝つこと）まであと少し、という試合を見た <!-- TODO: 確認（試合の日付と、何回に安打が出たか） -->\n- **佐々木朗希**：2022年4月10日、この球場で**完全試合**（1人も塁に出さずに勝つこと）を達成。27個のアウトのうち**19個が三振**、13者連続三振という日本記録つきだった。しかも次の登板でも8回まで1人も塁に出さなかった。==とにかく投げるフォームが芸術だった==と製作者は言う\n\nもうひとつ、製作者が面白いと思っているのが、選手を呼び込む場内アナウンスだ。女性のアナウンサーは昔から**「ウグイス嬢」**と呼ばれる。声がウグイスのように美しい、という意味なのだ。マリンでは、選手の呼び方（ペニーなど）にも独特の味があるそうだ。<!-- TODO: 確認（呼び方の具体例） -->\n\n足の速い選手が多いのも、製作者がロッテを「選手単位で好き」な理由だ。ただ、**西岡剛**や**荻野貴司**のように、俊足の人気選手ほどけがに泣かされがちなのが、ちょっと悲しいところなのだ。\n\n## 今日の試合で見るなら\n- **清宮幸太郎**の打席：高校時代から追いかけてきた「大物」が、[通算100号](#/q/5-06-a)まであと1本\n- **西川遥輝**が出てきたら：1年生から甲子園に出ていた選手が、[通算350盗塁](#/q/2-11)まであと5\n- **新庄監督**の動き：ベンチでの表情や、選手交代の演出にも注目\n- **藤原恭大**：大阪桐蔭で春夏連覇した外野手。ライトからの送球が見どころ"}}, "players": [{"team": "監督", "section": "監督カード", "name": "サブロー", "title": "サブロー（#86、監督、右投右打、50歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：現役時代は外野守備と勝負強い打撃で長く主力を務め、監督としては守備、粘る攻撃、走塁を軸に据えるタイプなのだ。就任会見では「甘さを取り除いて厳しい練習を」と宣言しながら、2026年9月には若手を**1年半**我慢して起用した成長にも手応えを語っている。\n- ユニークポイント：==「昭和のキャンプ」と呼ぶ猛練習と、伸びる途中の若手を辛抱して使う姿勢が同居している==のが特徴なのだ。背番号**86**も、現役時代に自分を鍛えた元監督・山本功児への敬意から受け継いだ番号である。\n\n### 見どころ\n- 今日の試合で見るべき場面：CS進出のない**5位**ロッテが、若手をどこまで先発で使い続けるかを見ると、サブロー監督の「育てながら勝つ」考えが見えやすいのだ。特に9月26日に4-2の9回から逆転サヨナラ負けを喫した救援陣を、接戦の終盤でどう並べ直すかに注目したい。\n- 注目の数字・プレー：9月26日終了時点のチーム成績は**59勝71敗3分**。監督に打率や防御率はないので、バント、代打、継投（投手交代）のタイミングを「監督のプレー」として見ると分かりやすいのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：今季の日本ハム戦は9月27日終了時点で**10勝13敗**と負け越している一方、前日は6-1で勝っている。今日の日本ハム先発は福島蓮なので、前日に機能した打順をどこまで残すかも見どころなのだ。\n\n### 出立ち\n- 身長・体重・体格：球団名鑑では**181cm・90kg**。現役時代は外野手としてプレーした、がっしりした体格なのだ。\n- 投打・フォームの特徴：**右投右打**で、現役時代は強い外野守備と右打ちの勝負強さで一軍に定着した。監督の今は自分が打席に立たないので、フォームよりもベンチでのサインや選手交代が観戦ポイントになる。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：現在は球団帽とユニホーム姿でベンチ前に出ることが多く、背中の**86**が最も確実な目印なのだ。固定した髪型・ひげ・試合前ルーティンについて、球団公式や主要紙で継続的に確認できる公開情報は見つからなかった。\n- 背番号の由来・愛称・登場曲：背番号**86**は、ロッテで監督を務めた恩師・山本功児が着けていた番号。現役初期の背番号**36**は本名「三郎」の語呂合わせで、登録名「サブロー」はイチローの登録名変更にも刺激を受けて本人が希望したものなのだ。監督なので現在は打者用の登場曲を使う立場ではない。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：岡山県出身で、岡山市立岡輝中からPL学園高へ進んだ。2000年にタレントの中嶋ミチヨと結婚している。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：岡山リトルシニアを経てPL学園高へ進み、大学・社会人を挟まず高校からプロ入りした。PL学園では**1番・中堅手**として1994年春のセンバツに出場したのだ。\n- 野球のエピソード：PL学園では2学年上に今岡真訪、1学年上に松井稼頭央、1学年下に福留孝介がいた世代で、高いレベルの競争の中で外野手として育った。3年夏の大阪大会は、金城龍彦を擁する近大付に準々決勝で延長10回サヨナラ負けしている。\n- 野球以外のエピソード：公開情報が見つかりませんでした。\n- 印象的な試合：1994年センバツ準決勝の智弁和歌山戦では**1番・中堅**で出場し、PL学園は終盤に追い上げたものの**4-5**で敗れた。==高校最後の甲子園はベスト4==だったというわけだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：1994年の第66回選抜高校野球大会でPL学園の**ベスト4**進出に貢献した。大学リーグや社会人、アマ日本代表の経歴はない。\n- ドラフト・入団（年・順位・球団・契約）：**1994年ドラフト1位**で千葉ロッテに指名され、1995年に入団。契約金は当時資料で**8000万円**とされ、背番号は36から始まったのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：1995年にロッテでプロ入りし、1999年ごろから一軍に定着。2011年途中に巨人へ移籍し、同年オフにFAでロッテへ戻り、2016年に引退した。その後はロッテのスペシャルアシスタント、楽天のファームディレクター・スカウティングアドバイザー、ロッテ二軍監督などを経て、2025年6月に一軍ヘッドコーチ、同年10月に一軍監督となった。\n- 野球のエピソード：新人時代、キャンプで打撃投手を務めた伊良部秀輝の球がほとんど前に飛ばず、「とんでもない世界に入った」と感じたという。山本功児の長い指導を受け、のちにその背番号**86**を自分の指導者番号に選んだのだ。\n- 野球以外のエピソード：プロ1年目の1995年、知り合いの少ない東京で偶然入ったちゃんこ店の店主に「出世払いでいい」と食事を支えてもらい、その人を「東京の親父」と慕った。==華やかなプロ生活の裏に、18歳の新人を支えた街の恩人がいた==のだ。\n- 印象的な試合：2005年は「つなぎの4番」として打率**.313、14本塁打、50打点**を残し、ロッテの日本一に貢献した。引退した2016年の最終打席ではオリックス平野佳寿の速球を右中間への二塁打にし、現役最後の安打を記録している。\n- 実績（タイトル・表彰・通算記録・代表）：通算**1782試合、1363安打、127本塁打、655打点、打率.265**。ゴールデングラブ賞を**2005年、2007年**、月間MVPを2007年6月に受賞し、2005年と2010年の日本一を経験した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：監督なので個人打撃成績はなく、チームは9月26日終了時点で**59勝71敗3分、5位**。CS進出の可能性は9月17日に消滅している。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年10月に一軍監督へ就任し、球団発表では複数年契約。2026年9月17日には来季も続投する見通しが報じられ、就任2年目へチーム作りを続けることになった。\n- 野球のエピソード：9月17日、Bクラス確定を受けて「僕が下手くそだったのもある」と采配の反省を口にしつつ、山口航輝の30本塁打や小川龍成の成長を例に「我慢強く使えた」と振り返った。課題には先発投手を挙げている。\n- 野球以外のエピソード：2026年1月の球団公式コラムで、亡くなった「東京の親父」への感謝を改めて語り、支えてくれた人のように選手へ言葉を掛けられる存在でありたいと話している。\n- 印象的な試合：9月26日の西武戦は、4-2で迎えた9回に横山陸人が追いつかれ、最後は代打・中村剛也にサヨナラ打を許して**4-5**。翌27日は日本ハムに**6-1**で勝っており、==終盤の投手運用をどう立て直すかが今日につながる==のだ。\n- 実績（今季の記録・表彰）：監督就任1年目でCS進出には届かなかったが、若手の継続起用と成長を本人がシーズン終盤の収穫に挙げている。個人タイトルを競う立場ではなく、チーム再建そのものが今季の評価対象なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：ロッテは**9/24は試合なし**。9/26は西武に4-5の逆転サヨナラ負け、9/27は日本ハムに6-1で勝利した。\n- エピソード：9/26は9回に2点リードを守れず敗れたが、翌日は高野脩が6回1失点、打線も10安打6得点で快勝した。監督目線では「前日の失敗をどこまで翌日に引きずらないか」が表れた2日間なのだ。\n- 調子：選手のような打撃の「調子」はないが、チームは9/25からの3試合を**2勝1敗**。ただし9/26に救援で落とした内容は、接戦の終盤運用にまだ論点が残る。\n- 分析・論点：サブロー監督はシーズン課題を先発投手と明言した一方、今日の先発ジャクソンはチーム最多の**9勝**。==ジャクソンをどこまで引っ張り、そこから誰へ渡すかが最も監督色の出る場面==なのだ。\n- 今日の見どころ：若手を使う姿勢、前日に機能した打順、そして9回の投手選択の3点を追うとよい。野球初心者でも「誰をいつ代えるか」だけを見れば、監督の仕事がかなり見えてくるのだ。\n\n### 出典\n- https://www.marines.co.jp/team/player/detail/2026_00001233.html\n- https://www.marines.co.jp/news/detail/202500737127.html\n- https://www.nikkansports.com/baseball/news/202510080001407.html\n- https://www.nikkansports.com/baseball/news/202609170002074.html?mode=all\n- https://sports.yahoo.co.jp/official/detail/2026010900051-spnaviow\n- https://www2.myjcom.jp/npb/column/20251017.shtml\n- https://npb.jp/bis/players/41143880.html\n- https://sp.baseball.findfriends.jp/player/19760001/\n- https://smart.asahi.com/v/koshien/stats/spring/y1994.php\n- https://rojiura.sakura.ne.jp/menue/data_base/score_book/90s_ks/94_h_05.htm\n- https://ja.wikipedia.org/wiki/%E3%82%B5%E3%83%96%E3%83%AD%E3%83%BC\n- https://en.wikipedia.org/wiki/Saburo_Omura\n- https://www.gurazeni.com/player/802\n- https://sp.baseball.findfriends.jp/?game_id=2026092603&pid=game_flash_info\n- https://baseball.yahoo.co.jp/npb/game/2021039466/top", "detail": true, "number": "86", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/9/94/Saburo_Ohmura_2010.jpg", "file": "https://commons.wikimedia.org/wiki/File:Saburo_Ohmura_2010.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E3%82%B5%E3%83%96%E3%83%AD%E3%83%BC", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Saburo_Ohmura_2010.jpg/330px-Saburo_Ohmura_2010.jpg"}}, {"team": "監督", "section": "監督カード", "name": "新庄剛志", "title": "新庄剛志（#1、監督、右投右打、54歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：現役時代から強肩と広い外野守備で知られ、監督としては固定観念に縛られない起用と、選手の役割をはっきり示すマネジメントが特徴なのだ。2026年は「自己犠牲」をテーマに、走者を進めるゴロなど、個人成績より1点を取りに行く打撃を重視している。\n- ユニークポイント：==派手な演出で注目を集めながら、今季は「進塁させる打撃」を細かく求めている==ところが新庄監督らしい。2022年は登録名を「BIGBOSS」にし、監督就任から**6位、6位、2位、2位**とチーム順位を押し上げてきた。\n\n### 見どころ\n- 今日の試合で見るべき場面：日本ハムは2位西武を追う**3位**で、残り2試合を勝たなければ2位浮上の可能性がなくなる状況なのだ。レイエスが右ハムストリング肉離れ、水谷瞬が左第二中手骨骨折で離脱しているため、限られた打線をどう組み替えるかが最大の見どころになる。\n- 注目の数字・プレー：9月26日終了時点でチームは**76勝61敗3分**。今季掲げた「自己犠牲」が、無死または1死で走者がいる場面の進塁打、バント、代走などとして表れるかを見るとよい。\n- 対戦相手との関係（今日の先発・打線との相性）：ロッテ先発ジャクソンとは4月1日に対戦し、日本ハム打線は**5回1安打無得点**に抑えられている。==今日はいきなり「前回ほぼ打てなかった投手をどう攻略するか」という監督の宿題がある==のだ。\n\n### 出立ち\n- 身長・体重・体格：球団名鑑では**182cm・76kg**。現役時代は俊足と強肩を生かした外野手で、細身ながら非常に運動能力の高いタイプだった。\n- 投打・フォームの特徴：**右投右打**。外野からの強い返球が代名詞で、高校時代から肩の強さは突出していた。監督の現在は自分が投打をしないため、フォームではなくベンチからのサインや守備位置変更を見るのが分かりやすい。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：現役時代から髪色や用具、登場演出まで含めて見せ方にこだわり、監督就任時も鮮やかな服装や「BIGBOSS」の演出で話題になった。現在は背番号**1**の監督用ユニホームが一番見つけやすい目印なのだ。\n- 背番号の由来・愛称・登場曲：監督就任時に「スター候補が育って1番を着けるまでは僕が」と話し、現役日本ハム時代と同じ**#1**を選んだ。愛称は「BIGBOSS」で、2022年には登録名にも使用。現在は監督なので打者としての登場曲はない。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：長崎県対馬市の母方実家で生まれ、福岡市南区で育った。造園業を営む家庭の第2子で、姉が1人いる。2000年から2007年まではタレントの大河内志保と結婚していた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：福岡市立長丘小、長丘中を経て西日本短大付高へ進み、大学や社会人を経ずにプロ入りした。高校では**1番・中堅手**を務めたが、3年間で甲子園出場はなかった。\n- 野球のエピソード：高校1年時、ホーム付近から約**120m**先の木製バックスクリーンへ送球を直撃させ、一部を壊したと当時の同級生が証言している。==プロ入り前から「肩を見るだけで特別」と分かる選手だった==のだ。\n- 野球以外のエピソード：高校の寮では、同級生が驚くほど部屋をきれいに整えていたという証言が残る。派手なイメージとは逆に、身の回りを整える几帳面さも高校時代からあったのだ。\n- 印象的な試合：高校3年の**1989年夏・福岡大会決勝**で福岡大大濠と対戦し、新庄は4安打でサイクル安打を達成。それでも西日本短大付は**4-6**で敗れ、甲子園まであと1勝で届かなかった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：甲子園出場や大学・社会人野球の実績はない。一方、1989年福岡大会決勝のサイクル安打と強肩がスカウト評価につながり、高卒で指名を受けた。\n- ドラフト・入団（年・順位・球団・契約）：**1989年ドラフト5位**で阪神に指名され、1990年入団。契約金**3700万円、年俸360万円**とされる（金額は推定）ほか、入団時の背番号は63だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：阪神で1991年に一軍デビューし、2001年にメッツへ移籍。2002年はジャイアンツ、2003年は再びメッツ、2004～2006年は日本ハムでプレーした。引退後はバリ島移住やタレント・実業活動などを経て、2022年から日本ハム監督なのだ。\n- 野球のエピソード：2001年に日本生まれの野手としてナ・リーグでプレーし、2002年にはジャイアンツで==日本生まれの選手として初めてワールドシリーズに出場==した。MLB3年間では**303試合、20本塁打、打率.245**を記録している。\n- 野球以外のエピソード：引退後はインドネシア・バリ島へ移住し、絵画、タレント、実業など野球以外の活動も続けた。2019年には再び現役復帰を目指し、2020年の12球団合同トライアウトにも参加した。\n- 印象的な試合：2004年オールスター第2戦では三塁から捕手の返球の隙を突いて**単独ホームスチール（本盗）**を決め、MVPを獲得。2006年10月26日の日本シリーズ第5戦では涙を流しながら現役最後の打席に立ち、その試合で日本ハムが日本一を決めた。\n- 実績（タイトル・表彰・通算記録・代表）：NPBではベストナイン**3回**、ゴールデングラブ賞**10回**、月間MVP2回。MLBでは2002年ワールドシリーズに出場し、NPBでは2006年に日本一を経験した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：監督なので個人の打率や防御率はなく、日本ハムは9月26日終了時点で**76勝61敗3分、3位**。すでに3年連続Aクラス（3位以上）を確定させている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年10月に球団と契約を更新して2026年が監督5年目。9月24日の本拠地最終戦後、球団からの要請を受けて**2027年も続投し、監督6年目**に入ると明言した。\n- 野球のエピソード：春季キャンプでは「チームが勝つために自分が犠牲になる」という自己犠牲を繰り返し求め、走者三塁で意図的に遊撃方向へゴロを打つようなサインまで例に挙げた。前年までの育成重視から、今季はより勝利優先へ寄せたのだ。\n- 野球以外のエピソード：試合後のコメントでも独特の言葉選びは健在で、9月27日には今季2度目の左手骨折となった水谷瞬に「もう塩の上で寝てほしい」と表現しつつ、復帰を気遣った。笑いを交えながら選手へのメッセージを発するのも新庄流なのだ。\n- 印象的な試合：7月2日のオリックス戦では、水谷、水野、レイエス、万波が==初回先頭から4者連続本塁打というプロ野球新記録==を達成。新庄監督は1985年阪神の「バックスクリーン3連発」と並ぶような記憶に残る場面として喜んだ。\n- 実績（今季の記録・表彰）：チームは3年連続でCS進出圏のAクラスを確定。7月2日の「初回先頭から4者連続本塁打」はNPB新記録で、監督5年目を象徴するチーム記録の一つになった。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：日本ハムは**9/24楽天戦0-6敗戦、9/26オリックス戦2-0勝利、9/27ロッテ戦1-6敗戦**。3試合の得点は0、2、1と打線が苦しんでいる。\n- エピソード：9/24の本拠地最終戦後に来季続投を発表し、9/27には水谷の骨折、加藤貴之のインフルエンザ離脱にも対応する状況になった。シーズン最終盤に戦力を欠きながら順位争いを続けているのだ。\n- 調子：チームは直近3試合で**1勝2敗、計3得点**。レイエスと水谷という長打を期待できる打者を欠き、打線全体は好調とは言いにくい。\n- 分析・論点：前日にロッテへ1-6で敗れ、2位西武との差が**1.5ゲーム**に広がった。残り2試合しかないため、今日は「育成のために試す」より「目の前の1点を取る」采配が強く出やすく、今季掲げた自己犠牲が最も見えやすい試合なのだ。\n- 今日の見どころ：4月に5回1安打に封じられたジャクソンへ、初回から走者をどう動かすかに注目したい。==代打・代走・バントを早めに使うのか、それとも長打を待つのかが、新庄監督の今日の答え==になる。\n\n### 出典\n- https://media.fighters.co.jp/player/1/\n- https://www.fighters.co.jp/news/detail/202500780959.html\n- https://www.fighters.co.jp/news/detail/00003636.html\n- https://www.sponichi.co.jp/baseball/news/2021/11/18/kiji/20211118s00001173329000c.html\n- https://www.nikkansports.com/baseball/news/202609240001679.html\n- https://www.daily.co.jp/baseball/2026/02/01/0019971774.shtml\n- https://www.daily.co.jp/baseball/2026/09/27/0020867258.shtml\n- https://www.fighters.co.jp/en/news/detail/202600947378.html\n- https://www.fighters.co.jp/zh-cn/news/detail/202600952435.html\n- https://npb.jp/bis/players/01903881.html\n- https://bis.npb.or.jp/history/2026/review_rec_b.html\n- https://www.nikkansports.com/baseball/news/202607020001807.html\n- https://www.nikkansports.com/baseball/news/202005050000096.html\n- https://column.sp.baseball.findfriends.jp/?id=001-20260629-82&pid=column_detail\n- https://www.mlb.com/news/tsuyoshi-shinjo-making-comeback\n- https://www.mlb.com/news/tsuyoshi-shinjo-makes-an-entrance-at-opening-day-in-japan\n- https://number.bunshun.jp/articles/-/851294\n- https://www.sponichi.co.jp/baseball/news/2024/07/25/kiji/20240725s00001002081000c.html\n- https://ja.wikipedia.org/wiki/%E6%96%B0%E5%BA%84%E5%89%9B%E5%BF%97\n- https://en.wikipedia.org/wiki/Tsuyoshi_Shinjo\n- https://www.nikkansports.com/baseball/news/202604010001684.html\n- https://www.nikkansports.com/baseball/news/202609270002137.html", "detail": true, "number": "1", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0c/NF_TsuyoshiShinjo20250427.jpg", "file": "https://commons.wikimedia.org/wiki/File:NF_TsuyoshiShinjo20250427.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E6%96%B0%E5%BA%84%E5%89%9B%E5%BF%97", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/NF_TsuyoshiShinjo20250427.jpg/330px-NF_TsuyoshiShinjo20250427.jpg"}}, {"team": "ロッテ", "section": "先発投手", "name": "アンドレ・ジャクソン", "title": "アンドレ・ジャクソン（#42、先発投手、右投右打、30歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**190cm・95kg**の体から投げる力のある直球と、落差の大きいチェンジアップが武器なのだ。サブロー監督も入団時に「空振りがとれる威力のあるストレート」と「変化も非常に大きいチェンジアップ」を評価しており、2026年は**144回で133奪三振**を記録している。\n- ユニークポイント：==大学では外野手兼投手の二刀流で、トミー・ジョン手術を経て投手としてMLBまで上がった遅咲きの右腕==なのだ。球団公式Q&Aでは心に残る言葉に「Underrated（過小評価）」を挙げている。\n\n### 見どころ\n- 今日の試合で見るべき場面：今日は**9勝8敗**で迎える先発で、勝てば2年連続の**10勝**となる。==ロッテ移籍1年目でチーム初の2桁勝利へ届くかが、最も分かりやすい見どころ==なのだ。\n- 注目の数字・プレー：9月26日時点で**防御率3.44、144回、133奪三振、55四球**。三振を奪える一方で四球も少なくないので、初心者は「2ストライクから空振りを取れるか」と「3ボールまで増やさず投げ切れるか」を見ると調子が分かりやすい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハムには4月1日に**5回1安打無失点**で移籍初勝利、8月23日にも**6回3安打2失点**で勝利した一方、8月29日は**4回5安打6失点**と打ち込まれた。今季だけでも好投と炎上の両方があり、今日の相性を一方向には決めつけられないのだ。\n\n### 出立ち\n- 身長・体重・体格：**190cm・95kg**。長い手足を生かす大型右腕で、マウンド上ではかなり大きく見える体格なのだ。\n- 投打・フォームの特徴：**右投右打**で、上から強く投げ込む直球にチェンジアップなどの変化球を組み合わせる。サブロー監督はZOZOマリン特有の風も変化球の味方になる可能性を入団時に挙げている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：長めの巻き毛とあごひげが目印で、球団公式Q&Aでは試合前のルーティンを「**髪を洗う**」と答えている。遠くの席からなら背番号42と大きなシルエットで見つけやすい。\n- 背番号の由来・愛称・登場曲：愛称は球団公式で「**ドレー**」。2026年1月に背番号42と発表されたが、42を選んだ理由は**公開情報が見つかりませんでした**。また球団公式の2026年選手登場曲一覧には#42の掲載がない。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：米国アリゾナ州ベイル生まれで、ツーソンのシエネガ高からユタ大へ進んだ。現在は家族がおり、ロッテ入団時には「私と家族にとって日本で過ごせる日々は大きな恵み」とコメントしている。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：シエネガ高では外野手としても活躍し、最終学年は**26試合で打率.444、4本塁打、22打点**。ユタ大でも外野手兼投手で、2016年は打者として**打率.299、20打点**、投手として11試合に救援登板した。\n- 野球のエピソード：2014年にレンジャーズからドラフト**32巡目**で指名されたが契約せず大学へ進学した。2016年オフに右肘のトミー・ジョン手術を受け、2017年シーズンを全休したことが、投手としての育成へ大きく舵を切る転機になったのだ。\n- 野球以外のエピソード：ユタ大では**Communication（コミュニケーション学）**の学士号を取得した。現在の球団Q&Aでは「最近買ってよかったもの」にマイホーム、「苦手なこと」に家族と離れることを挙げている。\n- 印象的な試合：2016年5月28日のワシントン大戦では、7回に同点へ追いつく適時打を放ち、ユタ大がPac-12タイトルの少なくとも同率首位を確定する勝利につなげた。翌29日には同校がPac-12優勝とNCAAトーナメント出場を決めている。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2016年にユタ大の**Pac-12カンファレンス優勝**とNCAAトーナメント進出を経験した。高校時代はアリゾナ州のセカンドチーム・オールステートにも選ばれている。\n- ドラフト・入団（年・順位・球団・契約）：2017年MLBドラフトでドジャースから**12巡目・全体370位**指名を受け、報道ベースで契約金**24万7500ドル**で契約した。2014年のレンジャーズ32巡目指名では契約しなかったため、2度目のドラフトでプロ入りしたというわけだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：ドジャース傘下で投手として育成され、2021年8月16日にMLBデビュー。2023年途中にパイレーツへ移り、MLB通算は**26試合、1勝4敗、防御率4.25**。2024年にDeNAへ来日し、2026年からロッテに加入した。\n- 野球のエピソード：2024年はDeNAで**8勝7敗、防御率2.90**、2025年は**10勝7敗、防御率2.33**と2年続けて先発ローテーションを守った。米国では制球に苦しんだ時期もあったが、日本では2年間で293回2/3を投げ、先発としての安定感を示したのだ。\n- 野球以外のエピソード：2025年12月のロッテ入団コメントでは、日本での生活を家族と楽しんでいることと、千葉でチームメートやファンとの絆を築くことを楽しみにしていると語った。球団公式Q&Aでは「良い音楽の感性」を自分のチャームポイントに挙げている。\n- 印象的な試合：==2024年日本シリーズ第5戦で中4日先発し、ソフトバンクを7回3安打無失点、8奪三振に抑えて7-0の勝利投手になった==。第1戦では4回2/3で降板していたため、同じ相手への中4日での修正が強く印象に残る試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2024年日本シリーズでDeNAの**26年ぶり日本一**に貢献し、シリーズの優秀選手賞を受賞。MLBでは2021年にオールスター・フューチャーズゲーム選出、NPBでは2025年に自身初の2桁となる10勝を挙げた。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**24試合、9勝8敗、防御率3.44、144回、116被安打、15被本塁打、55四球、133奪三振**。チームの先発陣で最多の9勝を挙げている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年12月にDeNAからロッテへ移籍。2026年3月に家事中のナイフで右手人さし指を切って開幕から少し出遅れたが、4月1日の日本ハム戦で移籍後初登板・初勝利を挙げ、その後は先発の軸を担っている。\n- 野球のエピソード：4月1日の日本ハム戦では前日に9得点した打線を**5回1安打無失点**に封じた。8月23日の同カードでも6回1死まで無安打に抑え、新庄監督から「毎回いい」と評されたのだ。\n- 野球以外のエピソード：9月7日に==家族の出産に立ち会うため米国へ一時帰国==し、9月15日に再来日、16日からチームへ再合流した。選手名鑑でも「家族と離れ離れになること」を苦手なことに挙げており、家族を大切にする一面が見える。\n- 印象的な試合：8月23日の日本ハム戦は6回1死までノーヒットで、最後はレイエスに同点2ランを浴びたものの**6回3安打2失点**で9勝目を挙げた。今日と同じZOZOマリン、日本ハム相手での好投実績なのだ。\n- 実績（今季の記録・表彰）：9月26日時点でチーム最多の**9勝**。8月8日オリックス戦と8月23日日本ハム戦では球団が「ベストシーン」グッズを発売するヒーローとなっている。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテに試合がなく、9月26・27日も登板していない。最後の登板は**9月22日オリックス戦**で、5回77球、3安打2失点、勝敗は付かなかった。\n- エピソード：9月22日は一時帰国からの復帰登板で、14日間実戦が空いていたため、サブロー監督は試合前から上限を「いっても95球」と想定していた。1点リードで降板した後に救援陣が追いつかれ、2年連続10勝は持ち越しになった。\n- 調子：復帰戦は2本塁打を浴びたものの、**5回3安打2失点**で試合を作った。球数77で終えたのは不調による早期降板ではなく、間隔が空いたことを考慮した予定通りの運用だったと監督が説明している。\n- 分析・論点：前回は登板間隔が空いたため球数制限があったが、今日はそこから**中5日**で通常ローテーションに戻る。==133奪三振の決め球を生かしつつ、55四球で余計な走者を出さないことが長い回を投げる鍵==なのだ。\n- 今日の見どころ：日本ハムには今季、5回無失点、6回2失点、4回6失点と内容に幅がある。まず初回の直球でストライクを先行できるか、そこからチェンジアップで空振りを取れるか、そして10勝目まで何回を投げられるかを追うと面白い。\n\n### 出典\n- https://www.marines.co.jp/team/player 発・福島蓮とは今季**6打数1安打、打率.167**だが、その1安打は本塁打なのだ。母数は小さいので「苦手」と断定はできず、むしろ一発を打ったことがある組み合わせとして見るとよい。\n\n### 出立ち\n- 身長・体重・体格：**183cm・100kg**。ロッテ打線の中でもひと目で分かる厚みのある体格で、強い打球を生む土台になっているのだ。\n- 投打・フォームの特徴：右投げ右打ち。大きく振り切るフルスイングが持ち味で、単打を積み重ねるというより、甘い球を一度で長打にする打撃が魅力なのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「笑顔」と回答している。試合前には**バットを磨く**のがルーティンで、打席だけでなくネクストバッターズサークルでの準備にも注目すると分かりやすい。\n- 背番号の由来・愛称・登場曲：背番号は入団以来の**51**で、愛称は「ぐっち」「ぐっさん」。登場曲は打席ごとに「My Time」「Stronger」「後悔なき航海」を使い分けており、「ぐっさん」は中学時代のコーチが呼び始めた愛称なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府大阪市平野区出身。2023年に元AKB48・HKT48の多田愛佳さんと結婚し、2024年9月に長女が誕生しているのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：大阪市立加美北小で「平野エンゼルス」に入り、大阪市立加美中では硬式の「ナガセボーイズ」でプレー。その後は秋田の明桜高へ進み、投手兼内野手として主軸を務めたのだ。\n- 野球のエピソード：2017年夏の秋田大会決勝では金足農の吉田輝星と投げ合って勝ったが、けん制で一塁へ戻った際に右肩を亜脱臼し、甲子園では登板できなかった。翌2018年は高校通算**25本塁打**まで伸ばし、「プロでは野手」で勝負する道を選んだのだ。\n- 野球以外のエピソード：球団公式Q&Aでは自分へのご褒美を「スイーツ」、最近買ってよかったものを「RIZINのチケット」と回答している。野球だけを追わなくても、格闘技好きという素顔が見える選手なのだ。\n- 印象的な試合：2017年夏の秋田大会決勝・金足農戦が大きな分岐点なのだ。吉田輝星に投げ勝って甲子園出場を決めた一方、その試合で負った右肩のけがが、のちに野手一本へ進む流れにつながった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：明桜高2年の**2017年夏の甲子園**に出場。3年夏は秋田大会決勝で金足農に敗れて連続出場は逃したが、高校通算25本塁打の長打力がプロから評価されたのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2018年ドラフト4位**で千葉ロッテから指名された。契約金4000万円、年俸560万円（金額はいずれも推定）で入団し、背番号51を背負ったのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2019、20年は二軍で経験を積み、2021年に一軍デビュー。2022年は16本塁打でチーム最多、2023年は初めて規定打席に到達し、2024年は51試合、2025年は35試合の出場から、2026年に一気に主砲へ飛躍したのだ。\n- 野球のエピソード：2021年のクライマックスシリーズでは楽天・安樂智大から本塁打を放ち、当時**21歳**で大舞台の一発を記録した。2025年8月20～21日にはパ・リーグタイの4打席連続本塁打を達成し、その途中の21日4回には1イニング2本塁打まで記録したのだ。\n- 野球以外のエピソード：2023年の結婚後は契約更改会見で家族を持った「自覚」を口にした。球団公式では心に残る言葉として「夢なき者に成功なし」を挙げており、長打目標を明確に掲げてきた選手なのだ。\n- 印象的な試合：2022年9月22日のオリックス戦では**3本塁打**を含む4安打8打点と大爆発した。2025年8月21日の楽天戦も、4打席連続本塁打と1イニング2本塁打というNPB記録級の出来事が重なった忘れにくい試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2026年8月に**大樹生命月間MVP賞**のパ・リーグ打者部門を初受賞し、同月の**スカパー！サヨナラ賞**も初受賞した。2025年の4打席連続本塁打はパ・リーグタイ記録なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**103試合、打率.275、32本塁打、70打点、長打率.588**。本塁打はリーグ2位タイで、==昨季35試合出場から今季は中心打者へ立場を一変させた==のだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：今季序盤には一度二軍調整を経験したが、復帰後に長打を量産。夏以降は中軸・指名打者を中心に起用され、9月28日は2番DHでの出場が予想されているのだ。\n- 野球のエピソード：8月は**24試合で打率.302、10本塁打、17打点**を記録し、本塁打はリーグトップだった。8月21日に日本ハム戦で自身初のサヨナラ打、26日にはソフトバンク戦でサヨナラ本塁打を放ち、勝負どころの一打も増えたのだ。\n- 野球以外のエピソード：球団公式Q&Aでは2026年の注目点に「ホームラン時のヒロヤポーズ」を挙げている。本塁打が出たら、ベンチへ戻った後のポーズまで見ると球場観戦ならではの楽しみになるのだ。\n- 印象的な試合：9月15日の日本ハム戦で**2打席連続本塁打**を放ち、9回の30号で7-6の勝ち越し。==「30本」は本人がプロ入り時から掲げてきた大きな目標で、それを日本ハム戦で突破した==のだ。\n- 実績（今季の記録・表彰）：8月度月間MVPと8月度サヨナラ賞をともに初受賞。9月15日に球団日本人40年ぶりの30本塁打、かつ26歳シーズンで球団最年少の30号到達となったのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**。9/25西武戦は5打数2安打2打点、9/26西武戦は5打数無安打、9/27日本ハム戦は3打数2安打2打点1四球で、4回に2点適時打を放ったのだ。\n- エピソード：9月は本塁打だけでなく、9/25と9/27には単打で走者を返している。長距離砲でも「ホームランが出なければ何もできない」状態ではないのだ。\n- 調子：9/26は無安打だったが、前後の9/25と9/27はいずれも2安打。==直近3試合で12打数4安打4打点==なので、本塁打待ちだけでなく打点を生む打撃は続いている。\n- 分析・論点：福島には今季6打数1安打と数字だけなら低いが、その1本が本塁打。サンプルが小さいため相性を決めつけるより、福島の甘い球を長打にできるか、そして追い込まれる前に振れるかを見るのがよい。\n- 今日の見どころ：一番分かりやすいのは**33号**が出るかどうか。2番に入る予想なので初回から打席が回る可能性が高く、球場到着がぎりぎりでも最初の打席を逃さないようにしたい選手なのだ。\n\n### 出典\n- https://npb.jp/bis/players/91895138.html\n- https://npb.jp/bis/eng/players/91895138.html\n- https://www.marines.co.jp/team/player/detail/2026_00001277.html\n- https://ja.wikipedia.org/wiki/山口航輝\n- https://en.wikipedia.org/wiki/Koki_Yamaguchi\n- https://www.nikkansports.com/baseball/highschool/news/201809290000257.html\n- https://npb.jp/history/2025/review_rec_b.html\n- https://www.marines.co.jp/news/detail/202600922711.html\n- https://npb.jp/news/detail/20260909_01.html\n- https://bis.npb.or.jp/award/2026/sayonara/win_8.html\n- https://www.nikkansports.com/baseball/news/202609150001922.html\n- https://www.nikkansports.com/baseball/news/202311200001146.html\n- https://www.sponichi.co.jp/entertainment/news/2024/10/05/kiji/20241005s00041000209000c.html\n- https://column.sp.baseball.findfriends.jp/?id=046-20200210-03&pid=column_detail\n- https://www.baseballdata.jp/playerP/2100027_5.html\n- https:// %82%A1%E3%83%AD%E3%83%BC%E3%82%BA_12%E5%9B%9E%E6%88%A6_ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_2026%E5%B9%B47%E6%9C%8810%E6%97%A5%E3%81%AE%E5%8D%83%E8%91%89%E5%B8%82_202607101741_DSCN5325.jpg/330px-%E5%B1%B1%E5%8F%A3%E8%88%AA%E8%BC%9D%E3%80%90%E3%83%91%E3%83%BC%E3%82%BD%E3%83%AB_%E3%83%91%E3%83%BB%E3%83%AA%E3%83%BC%E3%82%B0%E5%85%AC%E5%BC%8F%E6%88%A6%E3%80%91%E5%8D%83%E8%91%89%E3%83%AD%E3%83%83%E3%83%86%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%B3%E3%82%BA_vs_%E3%82%AA%E3%83%AA%E3%83%83%E3%82%AF%E3%82%B9%E3%83%BB%E3%83%90%E3%83%95%E3%82%A1%E3%83%AD%E3%83%BC%E3%82%BA_12%E5%9B%9E%E6%88%A6_ZOZO%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%BF%E3%82%B8%E3%82%A2%E3%83%A0_2026%E5%B9%B47%E6%9C%8810%E6%97%A5%E3%81%AE%E5%8D%83%E8%91%89%E5%B8%82_202607101741_DSCN5325.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "藤原恭大", "title": "藤原恭大（#1、右翼・3番、左投左打、26歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：俊足と強い送球を生かせる外野手で、打っては左打席から広角に運び、走っては次の塁を狙えるのだ。9月26日時点で**打率.264、出塁率.355、12盗塁**と、==塁に出てからも得点のきっかけを作れる3番打者==になっている。\n- ユニークポイント：大阪桐蔭で根尾昂らとともに**2018年の甲子園春夏連覇**を経験した、同世代を代表する高校球児だった。高卒1年目の2019年から一軍を経験しながら、故障や不振を何度も挟んで現在のレギュラー格までたどり着いた選手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：まずは3試合続いている無安打を止められるか。打席だけでなく、右翼へ飛球が上がった時に落下点へ入る速さと、走者がいる場面での返球を見ると藤原の良さが分かりやすいのだ。\n- 注目の数字・プレー：今季は9月26日時点で**99試合、8本塁打、40打点、12盗塁**。四球44に加えて死球も11あり、==ヒットが出ない日でも出塁できるのが今季の強み==なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：今日の先発・福島蓮との今季対戦は**1打席で四球1、公式打数0**だけ。数字から相性は判断できないため、左打者の藤原が福島の球をどこまで見極めて出塁できるかが焦点なのだ。\n\n### 出立ち\n- 身長・体重・体格：**181cm・80kg**。長身ながら比較的すっきりした体格で、外野を大きく動く走力型の選手なのだ。\n- 投打・フォームの特徴：左投げ左打ち。左打席から一塁までの距離が短い利点と脚力を持ち、強く引っ張るだけでなく逆方向へ運んで出塁する打撃もできるのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：背番号**1**と細身のシルエットが見分けやすい。2026年の球団公式Q&Aでは試合前ルーティンの回答はないが、2021年の公式Q&Aでは「寝ること」を挙げていたのだ。\n- 背番号の由来・愛称・登場曲：愛称は「きょうた」。入団時は背番号**2**で、2022年から**1**に変更しており、登場曲は「Symphony」「If I Can't Have You」「There's Nothing Holdin' Me Back」を打席ごとに使い分けているのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府豊中市出身。球団公式Q&Aで、野球を始めたきっかけは「兄が始めたのがきっかけ」と答えており、兄の影響で野球に入ったのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：小学生から野球を始め、中学時代は硬式の枚方ボーイズでプレーし、のちに広島へ入る小園海斗らと同じチームだった。その後は大阪桐蔭高へ進み、下級生から外野の主力になったのだ。\n- 野球のエピソード：高校3年の2018年夏、大阪桐蔭の4番として北大阪大会決勝で**6打席連続安打・6打点**を記録。甲子園でも長打力と脚力を見せ、根尾昂らと強力打線を作ったのだ。\n- 野球以外のエピソード：2025年の球団公式Q&Aでは趣味・特技を「ゲーム、漫画、腕相撲」、好きな漫画・アニメとして「ワンピース」を挙げている。球場では鋭いプレーを見せる一方、オフの過ごし方はかなりインドア寄りなのだ。\n- 印象的な試合：2018年夏の甲子園決勝で大阪桐蔭は金足農に**13-2**で勝利。==史上初となる2度目の甲子園春夏連覇==を完成させ、藤原も高校野球の歴史に残るチームの中心選手になったのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：大阪桐蔭で2018年春のセンバツと夏の選手権を制覇し、同年のU-18日本代表にも選出された。甲子園では根尾らとともに「春夏連覇世代」の代表格としてプロ入りしたのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2018年ドラフト1位**。楽天、阪神、ロッテの3球団が競合し、抽選でロッテが交渉権を獲得した。契約金1億円、出来高5000万円、年俸1500万円（金額はいずれも推定）で入団したのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2019年に高卒新人で一軍デビューし、2020年は26試合、2021年は78試合に出場。2023年に初めて100試合を超え、2024年は打率.290、2025年は107試合で打率.271、15盗塁と、徐々に一軍での土台を作ってきたのだ。\n- 野球のエピソード：2021年は開幕後の不振で二軍降格を経験したが、7月3日に再昇格すると24試合で打率.348、5本塁打、5盗塁。==7、8月度の月間MVPを初受賞する急上昇==を見せたのだ。\n- 野球以外のエピソード：漫画とゲームが趣味で、球団公式では長年ニックネームを「きょうた」としている。高校時代から知名度が高いが、本人の公式Q&Aは短い回答が多く、プレーで見せるタイプでもあるのだ。\n- 印象的な試合：2019年3月29日の楽天との開幕戦で、高卒新人ながら「1番・中堅」でプロ初出場。高卒外野手としていきなり開幕スタメンに入った経験は、その後の長いレギュラー争いの出発点なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：**2021年7、8月度月間MVP**を受賞。2026年3、4月度には、自身初のサヨナラ安打で**スカパー！サヨナラ賞**も初受賞しているのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**99試合、打率.264、8本塁打、40打点、12盗塁、出塁率.355**。四球44、死球11もあり、打率以上に塁へ出る回数を作れているのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：5月10日のソフトバンク戦で右翼フェンスに激突し、**右肩関節前方亜脱臼**と診断されて離脱。6月30日に一軍登録され、現在は外野の主力へ戻っているのだ。\n- 野球のエピソード：負傷前の5月10日時点では35試合で打率.297と好調で、4月15日から19試合連続で1番を任されていた。約7週間の離脱後に戻ってからも出場を積み、9月時点で100試合近くまで伸ばしたのだ。\n- 野球以外のエピソード：2026年の球団公式Q&Aで「今年の俺のここに注目！」には端的に「打撃」と回答している。高校時代から走攻守で評価された選手が、今季は打撃での安定を自分でもテーマにしているわけだ。\n- 印象的な試合：今季序盤に自身初のサヨナラ安打を放ち、その一打が3、4月度サヨナラ賞に選ばれた。本人は「この試合を通して直球で攻められていたので、直球に対して行こうと考えた」と振り返っているのだ。\n- 実績（今季の記録・表彰）：==2026年3、4月度スカパー！サヨナラ賞を初受賞==。大きな故障を挟みながらも、9月26日時点で自己最多の**8本塁打・40打点**まで伸ばしているのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**。9/25西武戦は4打数無安打1四球、9/26西武戦は5打数無安打3三振、9/27日本ハム戦は3打数無安打1四球で、併殺打も1つあったのだ。\n- エピソード：9/25～27の3試合は**12打数無安打**だが、四球を2つ選んでいる。ヒットが止まっても完全に出塁手段を失ってはいないのだ。\n- 調子：打球が安打にならず、9/26には3三振したため、打撃結果だけを見れば下降気味。ただし四球を選べているため、==「何でも振って崩れている」という状態ではない==のが救いなのだ。\n- 分析・論点：福島とは今季1打席だけで四球なので、対戦データはほぼない。直近の課題は投手との過去相性より、自分のタイミングで強い打球を取り戻せるかどうかなのだ。\n- 今日の見どころ：最初の安打がどんな形で出るかに注目したい。内野安打でも逆方向の単打でも1本出れば流れが変わりやすく、守備では==右翼から三塁・本塁へ投げる場面があれば強肩も見逃せない==のだ。\n\n### 出典\n- https://npb.jp/bis/players/31635138.html\n- https://npb.jp/bis/eng/players/31635138.html\n- https://www.marines.co.jp/team/player/detail/2026_00001251.html\n- https://www.marines.co.jp/team/player/detail/2025_00001114.html\n- https://www.marines.co.jp/team/player/detail/2023_00001240.html\n- https://ja.wikipedia.org/wiki/藤原恭大\n- https://en.wikipedia.org/wiki/Kyota_Fujiwara\n- https://www.nikkansports.com/baseball/highschool/news/201807300000546.html\n- https://www.nikkansports.com/baseball/highschool/news/201808060000130.html\n- https://www.nikkansports.com/baseball/news/201810250000012.html\n- https://npb.jp/award/2021/month/win_pl8.html\n- https://www.marines.co.jp/news/detail/00007032.html\n- https://www.marines.co.jp/news/detail/202600838733.html\n- https://www.sponichi.co.jp/baseball/news/2026/05/10/kiji/20260510s00001173400000c.html\n- https://www.marines.co.jp/news/announce/entry/202606/\n- https://www.marines.co.jp/news/detail/202600841597.html\n- https://npb.jp/award/2026/sayonara.html\n- https://www.baseballdata.jp/playerP/2100027_5.html\n- https://www.marines.co.jp/game/calendar/202609/\n- https://www.marines.co.jp/gamelive/stats/2026092501/\n- https://www.nikkansports.com/baseball/professional/score/2026/2026092601/0001.html\n- https://www.marines.co.jp/gamelive/stats/2026092701/", "detail": true, "number": "1", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/0/07/KyotaFujiwara202408.jpg", "file": "https://commons.wikimedia.org/wiki/File:KyotaFujiwara202408.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E8%97%A4%E5%8E%9F%E6%81%AD%E5%A4%A7", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/KyotaFujiwara202408.jpg/330px-KyotaFujiwara202408.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "佐藤都志也", "title": "佐藤都志也（#32、捕手・4番、右投左打、28歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：捕手として守備の中心を担いながら、左打席で長打も出せる「打てる捕手」なのだ。9月26日時点で**17本塁打・55打点・46四球**を記録し、==本塁打は自己最多を大きく更新している==。\n- ユニークポイント：大学時代は捕手だけでなく一塁でも日本代表の4番を任されるほど打力と運動能力を評価されていた。プロでも捕手に加えて一塁を守れるため、打力を残したまま守備の負担を調整できる選手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：捕手として先発するなら、ロッテ先発アンドレ・ジャクソンの球をどこへ要求するかを見ると面白い。打っては4番なので、走者を置いた場面で長打か四球か、どちらで好機を広げるかが見どころなのだ。\n- 注目の数字・プレー：9月26日時点で**17本塁打、55打点**。2024年の5本塁打から長打力が大きく伸びており、==「捕手なのに中軸を打つ」という珍しさが初心者にも分かりやすい==選手なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮には今季**8打数3安打、打率.375、1本塁打**。対戦数は少ないが、この5人の中では福島から実際に長打と本塁打を記録している打者なのだ。\n\n### 出立ち\n- 身長・体重・体格：**181cm・91kg**。捕手らしい厚みのある体格で、2024年の86kgから現在は球団登録で91kgとなっているのだ。\n- 投打・フォームの特徴：右投げ左打ち。捕手としては強い肩と動ける身体能力が持ち味で、打撃では左打席から強く引っ張るだけでなく逆方向にも運べるのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでチャームポイントは「目」。2026年は試合前に**決まった時間に球場へ来ること**をルーティンとしており、準備の時間を一定にするタイプなのだ。\n- 背番号の由来・愛称・登場曲：背番号は入団から**32**、愛称は「トシ」。2026年の登場曲は「Wasted Nights」「流星」「Clock Strikes」で、ONE OK ROCKの曲を長く使ってきたのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：福島県いわき市出身。侍ジャパン公式Q&Aでは、**10歳**の時に祖父とテレビで野球を見たりキャッチボールをしたりしたことが、野球を始めるきっかけだったと答えているのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：いわき市内で野球を始め、聖光学院高へ進学。その後は東洋大でプレーし、捕手・一塁手として東都大学リーグと大学日本代表の中心打者になったのだ。\n- 野球のエピソード：高校3年時にプロ志望届を出したが**2015年ドラフトでは指名漏れ**。東洋大で4年間鍛え直し、上茶谷大河、甲斐野央、梅津晃大ら後のプロ投手とバッテリーを組んで評価を上げたのだ。\n- 野球以外のエピソード：2025年の球団公式Q&Aでは趣味・特技を「釣り、ゴルフ」と回答し、2026年は自分へのご褒美を「美味しいお寿司」としている。試合では重い役割を担う捕手だが、オフは屋外の趣味も楽しむタイプなのだ。\n- 印象的な試合：高校時代の指名漏れそのものが、その後の進路を大きく変えた出来事なのだ。4年後の2019年ドラフトでロッテから2位指名を受けた際には「4年前の雪辱を果たせた」と語った。\n- 実績（甲子園・大学リーグ・代表・表彰など）：聖光学院で甲子園に出場し、東洋大では東都大学リーグで打撃力を磨いた。2018年と2019年に大学日本代表へ入り、2019年の日米大学野球では==日本の3大会ぶり19回目の優勝メンバー==になったのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト2位**で千葉ロッテから指名。契約金7000万円、年俸1200万円（金額はいずれも推定）で入団し、背番号32を与えられたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年に一軍デビューし60試合に出場。2022年は118試合、2023年は103試合と出番を増やし、2024年に116試合で初めて規定打席へ到達、2025年は68試合と出場を減らした後、2026年に再び主力として起用されているのだ。\n- 野球のエピソード：2024年は**打率.278**でパ・リーグ4位。捕手として規定打席に届き、田村龍弘や松川虎生らとの競争の中で正捕手格へ進んだのだ。\n- 野球以外のエピソード：球団公式Q&Aでは「負けず嫌い」、心に残る言葉は「不動心」と回答している。捕手は投手や審判とのやり取りが多い役割なので、感情を整えるという言葉も人物像につながるのだ。\n- 印象的な試合：2024年7月24日のオールスター第2戦・神宮で**6打数5安打**を記録しMVP。単打、二塁打、三塁打をそろえて本塁打だけ届かずサイクル安打は逃したが、==ロッテ選手として35年ぶりの球宴MVP==となったのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2024年に捕手部門で**ベストナイン初受賞**。同年はオールスターMVPに加え、侍ジャパンとしてプレミア12にも出場し、日本は準優勝したのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**123試合、打率.233、17本塁打、55打点、46四球**。打率は2024年より低いが、==本塁打は自己最多で「長打を打つ捕手」へ性格が変わったシーズン==なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：今季は捕手を中心に一塁でも起用され、打線では中軸を任される試合が増えた。9月27日も先発捕手から終盤に一塁へ移り、松川虎生がマスクをかぶる形で出場を続けたのだ。\n- 野球のエピソード：四球が**46**と多く、長打狙いだけでなくボール球を見送って出塁する役割も果たしている。捕手で守備の負担がありながら、9月26日時点で123試合出場とチームでも多くの試合に出ているのだ。\n- 野球以外のエピソード：2026年の球団公式Q&Aでは「最近買ってよかったもの」は時計、「苦手なこと」は高所と回答。長いシーズンでは決まった時間に球場へ来るルーティンも続けており、生活のリズムを大切にしているのだ。\n- 印象的な試合：今季は一発の数が増え、9月までに**17本塁打**へ到達。2024年の自己最多5本から3倍以上に増えており、捕手としての守備に加えて4番を任せられる理由が数字に表れているのだ。\n- 実績（今季の記録・表彰）：9月26日時点の**17本塁打・55打点**はいずれも自己最多。個人タイトルの受賞はまだないが、打撃面ではキャリアの新しい形を作った年なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**。9/25西武戦は4打数無安打、9/26西武戦は5打数1安打でその1本が二塁打、9/27日本ハム戦は4打数無安打だったのだ。\n- エピソード：9/27は打撃では無安打だったが、守備では終盤に捕手から一塁へ移った。捕手だけを見るつもりでいると見失いやすいので、守備位置変更の場内表示も確認するとよい。\n- 調子：9/25～27は**13打数1安打**で、その1安打が二塁打。==長打の形は残っているものの、直近の打撃結果は明確に低調==なのだ。\n- 分析・論点：福島には8打数3安打1本塁打と結果を出しているため、直近不振から抜ける相手としては材料がある。ただし8打数だけなので、「得意」と断定するより最初の打席でタイミングが合うかを見るべきなのだ。\n- 今日の見どころ：打者としては4番で走者を返せるか、捕手としてはジャクソンをどう導くかという==攻守2つの仕事を同時に見られる選手==。打てなくても守備で試合に関与し続けるのが捕手というポジションなのだ。\n\n### 出典\n- https://npb.jp/bis/players/71075151.html\n- https://npb.jp/bis/eng/players/71075151.html\n- https://www.marines.co.jp/team/player/detail/2026_00001268.html\n- https://www.marines.co.jp/team/player/detail/2025_00001135.html\n- https://ja.wikipedia.org/wiki/佐藤都志也\n- https://en.wikipedia.org/wiki/Toshiya_Satoh\n- https://www.japan-baseball.jp/jp/profile/201803010.html\n- https://www.japan-baseball.jp/jp/team/univ/2019/univ_us_japan/overview.html\n- https://www.japan-baseball.jp/jp/news/press/20191019_2.html\n- https://www.nikkansports.com/baseball/news/201910170000633.html\n- https://www.nikkansports.com/m/baseball/news/amp/201910160000798.html\n- https://npb.jp/bis/2024/stats/bat_p.html\n- https://www.nikkansports.com/baseball/news/202407240001963.html\n- https://full-count.jp/2024/08/01/post1592956/\n- https://www.marines.co.jp/news/detail/202400536965.html\n- https://npb.jp/award/2024/pl.html\n- https://www.marines.co.jp/news/detail/202400579111.html\n- https://www.japan-baseball.jp/jp/games/2024premier12/player.html\n- https://www.baseballdata.jp/playerP/2100027_5.html\n- https://npb.jp/games/2026/schedule_09_detail.html\n- https://www.marines.co.jp/game/calendar/202609/\n- https://www.marines.co.jp/gamelive/stats/2026092501/\n- https://www.nikkansports.com/baseball/professional/score/2026/2026092601/0001.html\n- https://www.marines.co.jp/gamelive/stats/2026092701/", "detail": true, "number": "32", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/9/9e/Toshiya_Sato.jpg", "file": "https://commons.wikimedia.org/wiki/File:Toshiya_Sato.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E4%BD%90%E8%97%A4%E9%83%BD%E5%BF%97%E4%B9%9F", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Toshiya_Sato.jpg/330px-Toshiya_Sato.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "寺地隆成", "title": "寺地隆成（#65、三塁・5番、右投左打、21歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：本職は捕手だが、打撃を生かすため今季は三塁でも起用される左打者なのだ。ボールを引きつけて左右へ返す打撃が持ち味で、==21歳で一軍の中軸候補として打席を与えられている==。\n- ユニークポイント：高校時代のU-18日本代表では捕手登録ながら主に**1番・一塁**で世界一に貢献し、プロでは捕手から三塁へ守備範囲を広げている。ポジションを固定せず「打てる場所を作る」ことで出場機会を増やしている選手なのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：長い不振から9月に打球が戻っており、まず左打席から強いライナーが出るかに注目したい。三塁では一、三塁線の速いゴロを処理する機会が多く、本職捕手との動きの違いも見どころなのだ。\n- 注目の数字・プレー：9月26日時点では打率**.204**まで戻しており、9月16日に今季初の3安打、19日には**3試合連続複数安打**を達成。==一時1割6分台だった打率を約4カ月ぶりに2割台へ戻した==のだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮には今季**5打数1安打、打率.200**。対戦数は少ないため相性より、二軍で修正したタイミングの取り方を福島の球速・変化球に合わせられるかが大事なのだ。\n\n### 出立ち\n- 身長・体重・体格：**177cm・82kg**。捕手としては大柄すぎず、三塁を守るにも動きやすい体格なのだ。\n- 投打・フォームの特徴：右投げ左打ち。不振時には足でタイミングを取った後、バットを体の近くに通す感覚を二軍で修正しており、本人も「一番はタイミング」と説明しているのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでチャームポイントを「色白なとこ」、性格を「シャイ」と回答。試合前は**音楽を聴く**のがルーティンで、背番号65と左打席を目印にすると見つけやすい。\n- 背番号の由来・愛称・登場曲：背番号は入団から**65**、愛称は「てち」「てらっち」。2026年は奇数打席に尾崎豊「僕が僕であるために」、偶数打席に少女時代「Genie」が流れるのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：東京都出身で、兄が2人いる。侍ジャパン公式Q&Aでは**7歳ごろ**、兄2人が野球をする姿に憧れて始めたと答えており、2025年のプロ初本塁打球は「両親に渡そうかな」と話しているのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：小学生時代は足立リトル、中学では城東ボーイズでプレーし、中学3年の途中に明徳義塾中へ転校。そのまま明徳義塾高へ進み、三塁と捕手を経験しながら打力を伸ばしたのだ。\n- 野球のエピソード：侍ジャパンU-18の自己紹介では、捕手だけでなく三塁経験があり「左右に返す打撃力」がアピールポイントと答えていた。高校時代から今の「複数ポジション＋打撃」という特徴がすでにできていたわけだ。\n- 野球以外のエピソード：球団公式ではご褒美を「スイーツ、甘いもの」、最近買ってよかったものを「甥っ子に買った自転車」と回答。2025年版では趣味・特技に**水泳**、好きな映画に「ボヘミアン・ラプソディ」を挙げているのだ。\n- 印象的な試合：2023年9月10日のU-18ワールドカップ決勝・チャイニーズ・タイペイ戦で**1番・一塁**として先発し、2四球で出塁。日本は2-1で勝ち、==U-18ワールドカップ初優勝==を成し遂げたのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：明徳義塾高2年夏の**2022年甲子園**に出場し、3打数2安打。2023年はU-18日本代表として世界一を経験し、高校最後の国際大会を1番打者として戦ったのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2023年ドラフト5位**で千葉ロッテから指名。契約金3000万円、年俸500万円（金額はいずれも推定）で契約し、背番号65でプロ入りしたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2024年は二軍104試合で打率.290を残し、10月3日に一軍初スタメン・初安打。2025年は高卒2年目で**116試合、106安打、打率.256、5本塁打**と一気に一軍へ定着し、2026年は三塁での起用が増えたのだ。\n- 野球のエピソード：2024年7月は二軍16試合で**打率.356、21安打、9打点**を記録し、イースタン・リーグのファーム月間MVPを受賞。試合中に打撃を修正できるようになったことを本人も収穫に挙げたのだ。\n- 野球以外のエピソード：球団公式では心に残る言葉を「人間的成長なくして技術の進歩なし」としている。人前で話すことを苦手と答える一方、プレーでは高卒直後から一軍・代表で大きな舞台を経験しているのだ。\n- 印象的な試合：2025年4月18日の楽天戦で早川隆久からプロ1号を放ち、さらに同じ試合で2本目も記録。**19歳7カ月**での1試合2本塁打は、10代捕手として史上4人目だったのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2024年7月度ファーム月間MVP、2025年に高卒2年目で規定打席へ到達。2025年の106安打は、球団の21世紀以降の高卒2年目選手では最多だったのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**95試合、打率.204、5本塁打、28打点**。開幕直後は打率3割台だったが大きく落ち込み、それでも9月に2割台まで戻してきたのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：5月は月間打率**.095**まで落ち、6月10日に今季初の登録抹消、6月30日に再昇格。8月3日に再び抹消され、8月19日に再昇格してからは三塁での起用を中心に打席を重ねているのだ。\n- 野球のエピソード：二軍では下半身と上半身の連動、特に「足でタイミングを取る」ことを福浦和也二軍監督らと修正。8月19日の再昇格後はすぐ**5試合連続安打**を記録し、修正の成果を一軍へ持ち込んだのだ。\n- 野球以外のエピソード：2026年の公式Q&Aでは自分の性格を「シャイ」、苦手を「人前で喋ること」としている一方、甥への自転車を「最近買ってよかったもの」に挙げている。若手らしい家族思いの一面も見えるのだ。\n- 印象的な試合：9月16日の楽天戦で今季初の**猛打賞（3安打）**。続く試合でも安打が重なり、19日には3試合連続複数安打として、約4カ月ぶりに打率2割台へ戻したのだ。\n- 実績（今季の記録・表彰）：今季の個人表彰はないが、二度の二軍調整を経て9月に一軍で打率を回復。==「不振からどう戻すか」を実戦で見せている最中==なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**。9/25西武戦は3打数無安打1四球、9/26西武戦は3打数1安打1四球、9/27日本ハム戦は4打数3安打1打点で、初回に先制の適時二塁打を放ったのだ。\n- エピソード：9/27は一回の適時二塁打に加え、単打2本も放って3安打。大きい当たりだけでなくコースへ運ぶヒットが出ており、高校時代からの「左右に返す」持ち味が結果に出たのだ。\n- 調子：9/25～27は**10打数4安打**で、直近は明確に上向き。==長い不振の底を抜けて、今はロッテ打線で当たっている側の打者==と見てよい。\n- 分析・論点：今季は好不調の波が大きく、9月の復調が来季以降にもつながる再現性のある打撃かが論点。福島には5打数1安打なので、対戦相性より「足でタイミングを取る修正版」が今日も崩れないかを見たいのだ。\n- 今日の見どころ：昨日3安打の勢いを持ち込めるかが一番分かりやすい。5番なら山口、藤原、佐藤が作った走者を返す場面が来やすく、==若い打者が中軸で得点を完成させる瞬間==を期待できるのだ。\n\n### 出典\n- https://npb.jp/bis/players/51455159.html\n- https://npb.jp/bis/eng/players/51455159.html\n- https://www.marines.co.jp/team/player/detail/2026_00001294.html\n- https://www.marines.co.jp/team/player/detail/2025_00001169.html\n- https://ja.wikipedia.org/wiki/寺地隆成\n- https://en.wikipedia.org/wiki/Ryusei_Terachi\n- https://www.japan-baseball.jp/jp/profile/202310012.html\n- https://www.japan-baseball.jp/jp/news/press/20230904_2.html\n- https://www.japan-baseball.jp/jp/team/18u/score/20230910_1/\n- https://www.nikkansports.com/m/baseball/news/amp/202311200000987.html\n- https://npb.jp/award/2024/farm/win_7.html\n- https://www.marines.co.jp/news/detail/202400544487.html\n- https://www.nikkansports.com/baseball/news/202410030000892.html\n- https://www.nikkansports.com/m/baseball/news/202504180001721_m.html\n- https://pacificleague.com/news/2026/7/10052509\n- https://pacificleague.com/news/2026/8/10054225\n- https://www.marines.co.jp/news/announce/entry/202606/\n- https://www.marines.co.jp/news/announce/entry/202608/\n- https://www.nikkansports.com/baseball/news/202609160001704.html\n- https://www.nikkansports.com/baseball/news/202609190001560.html\n- https://www.baseballdata.jp/playerP/2100027_5.html\n- https://www.marines.co.jp/game/calendar/202609/\n- https://www.marines.co.jp/gamelive/stats/2026092501/\n- https://www.nikkansports.com/baseball/professional/score/2026/2026092601/0001.html\n- https://www.marines.co.jp/gamelive/stats/2026092701/", "detail": true, "number": "65", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/f/ff/Ryusei_Terachi.jpg", "file": "https://commons.wikimedia.org/wiki/File:Ryusei_Terachi.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%AF%BA%E5%9C%B0%E9%9A%86%E6%88%90", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Ryusei_Terachi.jpg/330px-Ryusei_Terachi.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "小川龍成", "title": "小川龍成（#57、二塁・6番、右投左打、28歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：守備範囲の広さと、バントや進塁打で打線をつなぐ技術が持ち味なのだ。9月26日時点で**131試合、打率.262、11犠打、8盗塁**と、==長打ではなく「次の塁を作る」仕事で価値を出す二塁手==になっている。\n- ユニークポイント：171cmと小柄で、本塁打を量産するタイプではないが、相手守備の位置を見てセーフティーバントまで選べる。2024年にはその判断でサヨナラ安打を決め、年間の「ドラマティック・サヨナラ賞」まで受賞したのだ。\n\n### 見どころ\n- 今日の試合で見るべき場面：二塁方向へゴロが飛んだ時の一歩目と、走者が一塁にいる場面でバントの構えをするかに注目すると分かりやすい。6番なので、上位打線が作った走者を進める役目と、自分が出塁して下位打線へつなぐ役目の両方があるのだ。\n- 注目の数字・プレー：9月27日終了時点で二塁を**125試合**守り、失策は**4、守備率.994**。打撃では派手さがなくても、==「普通のゴロを確実にアウトにする」回数の多さがレギュラーの土台==なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮には今季**5打数3安打、打率.600**。5打数だけなので相性を断定はできないが、今日の予想スタメン5人の中では福島から最も高い打率を残しているのだ。\n\n### 出立ち\n- 身長・体重・体格：**171cm・74kg**。一軍の内野手としては小柄な部類で、低い姿勢から素早く動ける体格なのだ。\n- 投打・フォームの特徴：右投げ左打ち。大学日本代表時代から「長打はなかなか出ない分、相手の嫌がる打撃」を意識しており、左打席からゴロやライナーを打ち分け、必要ならバントも使うのだ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「目のしわ」と回答。試合前は**仮眠をとる**のがルーティンで、背番号57と小柄な体格を目印にすると見つけやすいのだ。\n- 背番号の由来・愛称・登場曲：背番号は入団から**57**で、愛称は「がーりゅー」。登場曲は三代目 J SOUL BROTHERS from EXILE TRIBEの「R.Y.U.S.E.I.」で、自分の名前「龍成」にも重なる選曲なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：群馬県館林市出身。父と兄が野球をしていた影響で**6歳**から始め、兄の駿輝さんは前橋育英高で髙橋光成とバッテリーを組み、2013年夏の甲子園優勝を経験した捕手なのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：館林市立第八小の多々良クラブ、館林ボーイズを経て前橋育英高へ進学し、その後は國學院大へ進んだ。大学では遊撃手として評価を高め、2019年には大学日本代表に選ばれたのだ。\n- 野球のエピソード：2019年の日米大学野球前の練習試合ではチーム最多の**3安打**を放ち、三塁手の位置を見てバント安打も決めた。「長打はなかなか出ない分、相手の嫌がる打撃」を口にしており、今の小技中心のスタイルは大学時代から一貫しているのだ。\n- 野球以外のエピソード：侍ジャパンのプロフィールでは、憧れの選手に同じ遊撃手の源田壮亮を挙げている。2026年の球団公式Q&Aでは苦手なものを「ピーマン」、自分へのご褒美を「好きなものを食べる」と答えているのだ。\n- 印象的な試合：2019年7月の日米大学野球では第1戦で先制のホームを踏み、日本が**3-0**で勝利。シリーズも日本が3勝2敗で制し、3大会ぶり19回目の優勝を果たしたのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：前橋育英高3年の**2016年夏の甲子園**に出場。國學院大では2019年に大学日本代表へ選ばれ、日米大学野球の優勝メンバーになったのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2020年ドラフト3位**で千葉ロッテから指名された。契約金6000万円、年俸1000万円（金額はいずれも推定）で入団し、「大学No.1遊撃手」として守備力と走力を評価されたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2021年に一軍デビューし、2022年は68試合、2023年は52試合と主に守備固めや代走で出場。2024年は119試合まで出番を増やし、2025年は87試合、2026年は二塁のレギュラーとして初めて130試合を超えたのだ。\n- 野球のエピソード：2024年7月30日の西武戦、6-6の9回2死満塁で三塁手の守備位置を見て**セーフティーバント**を選択し、サヨナラ内野安打にした。本人は打席に入る前から「95％バント」と決めていたと振り返っており、==パワーではなく観察と判断で勝負を決めた代表的な一打==なのだ。\n- 野球以外のエピソード：球団公式Q&Aでは性格を「負けず嫌い」と答え、2026年に注目してほしい点を「全力プレー」としている。控え期間が長かった選手らしく、走塁や守備でも手を抜かない姿が持ち味なのだ。\n- 印象的な試合：2024年7月30日の西武戦がプロで最も象徴的な試合の一つ。ロッテはその勝利で開幕から西武戦**12連勝**とし、小川自身も初のサヨナラ打を記録したのだ。\n- 実績（タイトル・表彰・通算記録・代表）：2024年7月度の**スカパー！サヨナラ賞**を初受賞し、そのセーフティーバントは同年の「スカパー！ドラマティック・サヨナラ賞 年間大賞」にも選ばれた。派手な本塁打ではなくバント安打が年間大賞になった珍しい例なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**131試合、打率.262、2本塁打、23打点、8盗塁、11犠打**。これまでの自己最多119試合を更新し、==初めてシーズンを通して二塁のレギュラーを担っている==。\n- 経歴（昇格・降格・故障・役割の変化・契約）：今季は開幕から二塁で出場を重ね、守備固め中心だった過去から先発中心へ役割が変わった。9月26日時点で131試合に出場しており、一軍で最も長く働いたシーズンになっているのだ。\n- 野球のエピソード：二塁では9月27日終了時点で**守備率.994**と安定し、併殺（2つのアウトを一度に取る守備）にも69回関わっている。打撃だけでなく、二遊間でアウトを積み重ねることが出場を支えているのだ。\n- 野球以外のエピソード：2026年の公式Q&Aでは試合前に仮眠をとると答え、子どものころの自分へ「いっぱい寝て身長伸ばせ」と言いたいとも回答している。171cmという体格を本人も明るくネタにしているのだ。\n- 印象的な試合：今季は**マイナビオールスターゲーム2026**に二塁手として初出場。控え中心だった時期を経て、ファン投票で選ばれるレギュラーへ立場を変えたことが最も分かりやすく表れた舞台なのだ。\n- 実績（今季の記録・表彰）：オールスターのファン投票ではパ・リーグ二塁手部門で**468,100票**を集めて1位となり、初選出された。==「守備と小技の選手」がファン投票1位まで評価を広げたシーズン==なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9/24はロッテの試合なし**。9/25西武戦は4打数1安打、9/26西武戦は4打数無安打、9/27日本ハム戦は2打数無安打1四球1犠打で、四球後に得点も記録したのだ。\n- エピソード：9/27は安打こそなかったが、送りバントで走者を進め、自分も四球で出塁してホームを踏んだ。小川を見る時は「ヒットを打ったか」だけでなく、==アウト1つと引き換えに走者を進めたか、四球でつないだか==も見ると役割が分かるのだ。\n- 調子：9/25～27は**10打数1安打**で、打撃は下降気味。ただし9/27は四球と犠打があり、打てない日にも打線を切らさない仕事はできているのだ。\n- 分析・論点：福島には今季5打数3安打と結果を残しているため、直近の打撃不振を抜けるきっかけになるかが論点。ただしサンプルは小さく、無理に長打を狙わず、いつものようにセンター方向や逆方向へ運べるかを見るのがよい。\n- 今日の見どころ：6番で走者がいれば、ヒットだけでなく送りバントや右方向への打球が作戦になる。守備では二塁へのゴロ、攻撃では小技という、==初心者が「派手ではないけれど試合を動かすプレー」を知るのに最適な選手==なのだ。\n\n### 出典\n- https://npb.jp/bis/players/11715153.html\n- https://npb.jp/bis/eng/players/11715153.html\n- https://www.marines.co.jp/team/player/detail/2026_00001280.html\n- https://ja.wikipedia.org/wiki/小川龍成\n- https://en.wikipedia.org/wiki/Ryusei_Ogawa\n- https://www.japan-baseball.jp/jp/profile/201902008.html\n- https://www.japan-baseball.jp/jp/news/press/20190711_2.html\n- https://www.japan-baseball.jp/jp/news/press/20190716_3.html\n- https://www.japan-baseball.jp/jp/news/press/20190722_2.html\n- https://www.nikkansports.com/baseball/news/202011300000609.html\n- https://npb.jp/award/2024/sayonara/win_7.html\n- https://npb.jp/award/2024/sayonara/win_y.html\n- https://www.marines.co.jp/news/detail/202400579346.html\n- https://www.nikkansports.com/baseball/news/202407300002042.html\n- https://npb.jp/allstar/2026/ballotresult.html\n- https://npb.jp/bis/2026/stats/idf1_m.html\n- https://www.baseballdata.jp/playerP/2100027_5.html\n- https://www.marines.co.jp/game/calendar/202609/\n- https://www.marines.co.jp/gamelive/stats/2026092501/\n- https://www.nikkansports.com/baseball/professional/score/2026/2026092601/0001.html\n- https://www.marines.co.jp/gamelive/stats/2026092701/", "detail": true, "number": "57", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e3/CHIBA_LOTTE_RYUSEI_OGAWA_20220423.jpg", "file": "https://commons.wikimedia.org/wiki/File:CHIBA_LOTTE_RYUSEI_OGAWA_20220423.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E5%B0%8F%E5%B7%9D%E9%BE%8D%E6%88%90", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/CHIBA_LOTTE_RYUSEI_OGAWA_20220423.jpg/330px-CHIBA_LOTTE_RYUSEI_OGAWA_20220423.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "髙部瑛斗", "title": "髙部瑛斗（#0、中堅・7番、右投左打、28歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：最大の武器は一歩目の速さと加速力なのだ。**2022年に44盗塁で盗塁王**となり、中堅守備でも広い範囲をカバーして同年にゴールデングラブ賞を受賞している。\n- ユニークポイント：大学では東都大学2部で通算**129安打**を積み上げ、当時の2部リーグ最多安打記録を更新した巧打者なのだ。==長打より、足とコンタクトで相手守備を揺さぶるタイプだと覚えると見やすい==。\n\n### 見どころ\n- 今日の試合で見るべき場面：復帰後3試合で**11打数6安打、5打点**と当たっているため、7番から塁に出て下位打線を動かせるかが見どころなのだ。塁に出たら、投手が打者だけでなく髙部のスタートも警戒する様子を見るとよい。\n- 注目の数字・プレー：9月26日は内野安打と2点三塁打、27日は3安打で2点二塁打を放った。==骨折離脱から戻った直後に、単打・三塁打・二塁打と違う形の安打を重ねている==のが面白いところなのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発の右腕・福島蓮に対し、2026年の打者別対戦成績は**2打数1安打（.500）**。サンプルは小さいが、左打者の髙部が出塁して福島に走者を意識させられるかに注目なのだ。\n\n### 出立ち\n- 身長・体重・体格：**178cm・72kg**で、外野手としては細身の体格なのだ。スピードを生かした走塁と守備が持ち味なので、体の大きさより動きの軽さが目につく選手だ。\n- 投打・フォームの特徴：右投げ左打ち。小学4年から通った松永浩美ベースボールアカデミーで左打ちに転向し、現在も左打席から俊足を生かす打撃を続けている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aでは試合前のルーティンを「睡眠」と答えている。プレーでは打球後すぐトップスピードに乗る走り方が見分けやすいのだ。\n- 背番号の由来・愛称・登場曲：現在の背番号は**0**、球団公式のニックネームは「べー」。登場曲は寿君の「Believe in myself」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：神奈川県高座郡寒川町出身。父に「運動会の100m走で最下位なら野球を始めなさい」と言われ、本当に最下位になったことが野球を始めるきっかけになったという。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：鶴ヶ島エンゼルスで野球を始め、毛呂山中では越生ボーイズ、東海大甲府高、国士舘大へ進んだ。大学では1年春から外野のレギュラーだったのだ。\n- 野球のエピソード：小4から中学卒業まで松永浩美ベースボールアカデミーに通い、そこで左打ちへ転向した。国士舘大では4年春に東都2部通算100安打へ到達し、最終的に**129安打**まで伸ばした。\n- 野球以外のエピソード：3人兄弟で、弟を2016年に急性白血病で亡くしている。家族への思いを胸に競技を続けてきたことが複数の取材で紹介されている。\n- 印象的な試合：東海大甲府高3年夏の**第97回全国高校野球選手権**に「1番・中堅」で出場し、3回戦で清宮幸太郎を擁する早稲田実に敗れた。甲子園では3試合で**13打数4安打1打点**だった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：甲子園出場に加え、国士舘大で東都2部通算129安打。大学リーグで安打を積み続けた確実性が、プロ入り時の大きな評価材料になったのだ。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト3位**でロッテから指名され、推定契約金6000万円、年俸1000万円で合意。入団時の背番号は38だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年に一軍デビューし、2022年に137試合へ出場してレギュラー定着。2023年は肩の故障で一軍出場がなく、2024年に復帰して打率.300、2025年は111試合で打率.286、20盗塁を記録した。\n- 野球のエピソード：2022年は**44盗塁**を決め、盗塁王と外野手のゴールデングラブ賞を同時に獲得した。==「塁に出た後」と「打球が飛んだ時」の両方で価値を出す外野手なのだ==。\n- 野球以外のエピソード：球団公式Q&Aでは性格を「自由」、自分へのご褒美を「買い物」と回答している。苦手なものとしてトマト、ナス、人混みも挙げている。\n- 印象的な試合：2024年7月は打率.405、月間33安打などの好成績でパ・リーグ野手部門の月間MVPを受賞。長期離脱から戻り、打撃でも大きく存在感を示した時期なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：**2022年盗塁王、2022年ゴールデングラブ賞、2024年7月度月間MVP**。2025年には侍ジャパントップチームにも選出された。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**46試合、129打数29安打、打率.225、0本塁打、5打点、3盗塁**。9月27日の3安打を加える前の数字なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：6月12日に一軍登録を外れ、その後ファームで死球を受けて右肩甲骨を骨折し、1か月以上離脱した。9月25日に約3か月ぶりに一軍へ戻った。\n- 野球のエピソード：故障で実戦を離れた期間に打撃を「全部見直した」と話し、さまざまな打ち方や感覚を試したという。復帰時には来季へ向けて結果でアピールする意識を口にしていた。\n- 野球以外のエピソード：長期離脱中は、打てない時期と故障を受けて考えを整理する時間に充てたと語っている。競技から離れた時間も、自分の状態を見直す期間にしたというわけだ。\n- 印象的な試合：9月26日の西武戦で**3打数2安打2打点**、8回に左中間へ2点三塁打。復帰2戦目で長打まで出たことで、復帰直後の好調を強く印象づけた。\n- 実績（今季の記録・表彰）：今季のタイトル・月間表彰はない。==ただし9月25日の一軍復帰から3試合連続安打で、計6安打5打点==と短期間で大きな結果を残している。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦がなく、25日の復帰戦は安打と打点を記録。26日は**3打数2安打2打点**、27日は**4打数3安打2打点**で、8回に2点二塁打を放った。\n- エピソード：9月25日の昇格時に「来年に向けたアピール」を口にした直後から結果が続いている。言葉どおり、残り試合を来季への競争として戦っているのだ。\n- 調子：復帰後3試合は**11打数6安打、打率.545、5打点**。打球の種類も内野安打、三塁打、二塁打と幅があり、直近だけを見れば非常に当たっている。\n- 分析・論点：3試合だけなので長期的な復調と断定はできないが、骨折明けでタイミングを取り直しながら結果が続いている点は大きい。特に下位打線で出塁すると、1番へつながる前に相手守備へ走塁の圧力をかけられる。\n- 今日の見どころ：==「打って出る」だけでなく、「出てから走る」「中堅で広く守る」の3点を見ると髙部らしさが分かる==。福島から塁に出た場面では、リード（塁から離れて次の塁を狙う準備）の大きさにも注目なのだ。\n\n### 出典\n- https://npb.jp/bis/players/11215151.html\n- https://www.marines.co.jp/team/player/detail/2026_00001274.html\n- https://ja.wikipedia.org/wiki/%E9%AB%99%E9%83%A8%E7%91%9B%E6%96%97\n- https://en.wikipedia.org/wiki/Akito_Takabe\n- https://npb.jp/bis/2022/stats/lb_sb_p.html\n- https://npb.jp/award/2022/pl.html\n- https://npb.jp/award/2024/month/win_pl7.html\n- https://www.japan-baseball.jp/jp/profile/202501011.html\n- https://www.nikkansports.com/baseball/news/202609250001261.html?mode=all\n- https://www.nikkansports.com/baseball/news/202609260001502.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true, "number": "0", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/2/2b/Takabe.2022.jpg", "file": "https://commons.wikimedia.org/wiki/File:Takabe.2022.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E9%AB%99%E9%83%A8%E7%91%9B%E6%96%97", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Takabe.2022.jpg/330px-Takabe.2022.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "井上広大", "title": "井上広大（#39、一塁・8番、右投右打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**189cm・100kg**の体格から生まれる長打力が最大の武器なのだ。2026年は9月26日時点で安打19本のうち本塁打が**7本**あり、少ない安打数でも一振りで得点を動かせる。\n- ユニークポイント：履正社高3年夏の甲子園決勝で、春の選抜で抑え込まれた星稜・奥川恭伸から逆転3ランを放った打者なのだ。==「相手のエースを長打でひっくり返した」高校時代の一打が、今の打者像にもつながっている==。\n\n### 見どころ\n- 今日の試合で見るべき場面：8番で走者を置いて打席が回った場面なのだ。9月は26日までに**4本塁打**しており、下位打線でも一発で試合を動かせる。\n- 注目の数字・プレー：9月26日の西武戦で**7号2ラン**を放ち、前の打席で満塁機を逃した後に逆転弾で取り返した。==打率は低くても、長打が出ると得点への影響が大きい打者==として見ると分かりやすい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮の2026年打者別対戦表には井上の打席が掲載されておらず、少なくとも同表で確認できる今季対戦実績はない。右対右なので、福島の直球や変化球をどこまで強く引っ張れるかが焦点なのだ。\n\n### 出立ち\n- 身長・体重・体格：**189cm・100kg**で、チームでも目立つ大柄な体格なのだ。球団公式Q&Aでもチャームポイントを「手足が長い」と答えている。\n- 投打・フォームの特徴：右投げ右打ち。大きな体を使って強く振り切るタイプで、2026年は長打率が打率を大きく上回る成績になっている。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：長い手足と大柄なシルエットが見分けやすい。試合前の決まったルーティンは「その日のコンディション次第」と球団公式Q&Aで答えている。\n- 背番号の由来・愛称・登場曲：ロッテでの背番号は**39**、愛称は「コーディー」。登場曲は打席ごとに寿君「Butterfly Effect」など複数曲を使っている。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府大東市出身。家族構成の詳しい公開情報は限られるが、小学2年から地元の「ANTブルージェイズ」でソフトボールを始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：大東市立南郷小から南郷中へ進み、中学では東大阪シニアで野球に転向して主に捕手を務めた。履正社高では外野手となり、2年秋から4番を担った。\n- 野球のエピソード：3年春の選抜では星稜・奥川恭伸に**4打数0安打2三振**だったが、夏の甲子園決勝で同じ奥川から逆転3ランを放った。高校通算は**49本塁打**なのだ。\n- 野球以外のエピソード：ドラフト後の2019年11月、下校途中に駅の階段で後ろからぶつかられて右足首を捻挫したことが報じられた。入団直前に思わぬアクシデントに見舞われたのだ。\n- 印象的な試合：**2019年夏の甲子園決勝・星稜戦**が代表的なのだ。3回に奥川のスライダーを捉えて逆転3ランを放ち、履正社の春夏通じて初の全国制覇に大きく貢献した。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2019年夏の甲子園で**26打数10安打、3本塁打、14打点、打率.385**。履正社高の全国優勝メンバーで、大学・社会人を経ずにプロ入りした。\n- ドラフト・入団（年・順位・球団・契約）：**2019年ドラフト2位**で阪神から指名され、推定契約金6000万円、年俸720万円で仮契約。背番号は32だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2020年に阪神で一軍デビューし、2024年は23試合で3本塁打。2025年は一軍1試合にとどまり、同年の現役ドラフトでロッテに移籍して2026年から背番号39となった。\n- 野球のエピソード：ルーキーの2020年はウエスタン・リーグで**9本塁打、36打点**を記録し、高卒新人ながら二軍の中軸を任された。一軍では初安打・初打点を適時二塁打で記録している。\n- 野球以外のエピソード：ロッテ公式Q&Aでは自分へのご褒美を「アイス」、最近買ってよかったものを「牧秀悟さんと同じ香水」と回答している。「一喜一憂をしない」を心に残る言葉として挙げているのだ。\n- 印象的な試合：2020年10月16日のヤクルト戦で代打からプロ初安打・初打点となる中越え適時二塁打を放った。阪神の高卒新人野手として久しぶりの一軍打点となった一打だった。\n- 実績（タイトル・表彰・通算記録・代表）：一軍のタイトルや代表歴はないが、2020年のウエスタン・リーグで優秀選手賞、新人賞、努力賞を受賞した。2024年に一軍自己最多の**3本塁打**を放ち、2026年はそれを大きく更新している。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**46試合、111打数19安打、打率.171、7本塁打、12打点**。安打のうち7本が本塁打で、確実性より長打が目立つ数字なのだ。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年12月の現役ドラフトで阪神からロッテへ移籍。2026年は一塁や外野で出場機会が増え、初めて一軍で100打席を超えた。\n- 野球のエピソード：9月26日の試合後、本人は好結果につなげるため「誰にも負けないような練習量」を意識していると話した。サブロー監督も「彼が一番バットを振ってると思う」と練習量を評価している。\n- 野球以外のエピソード：球団公式Q&Aでは性格を一言で「静」と回答し、苦手な食べ物はピーマンとしている。後輩の松川虎生について「面倒見がいい」と答えているのも人間関係が見える小ネタなのだ。\n- 印象的な試合：9月26日の西武戦で1点を追う7回、佐藤隼輔の初球チェンジアップを左中間へ運んで**7号逆転2ラン**。==満塁機で凡退した後の次打席で試合をひっくり返した==。\n- 実績（今季の記録・表彰）：9月26日までにシーズン自己最多の**7本塁打**へ伸ばし、9月だけで4本塁打。大きな個人タイトルはないが、一軍での出場機会と長打数は過去最高水準なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦なし。26日は**3打数2安打2打点、1本塁打、1四球**、27日は**3打数1安打1打点**で4回に左前適時打を放った。\n- エピソード：26日は一時逆転の本塁打、27日は勝ち越しにつながる適時打と、2試合続けて得点に直結する打撃を見せた。長打だけでなく単打でも走者を返しているのだ。\n- 調子：9月は26日までに4本塁打を放ち、直近2試合では**6打数3安打3打点**。==シーズン打率.171という全体像より、直近の打席内容は明らかに上向いている==。\n- 分析・論点：課題は三振の多さで、9月27日終了時点では114打数で40三振。反面、当たった時の長打力は下位打線として大きな武器なので、追い込まれる前に甘い球を仕留められるかが論点なのだ。\n- 今日の見どころ：==福島の球を最初から強く振りにいくか、追い込まれるまで見極めるか==を観察するとよい。走者がいる場面なら、一塁側スタンドからは大きなスイングと打球方向が分かりやすい。\n\n### 出典\n- https://npb.jp/bis/players/31335151.html\n- https://www.marines.co.jp/team/player/detail/2026_00001793.html\n- https://ja.wikipedia.org/wiki/%E4%BA%95%E4%B8%8A%E5%BA%83%E5%A4%A7\n- https://en.wikipedia.org/wiki/Kouta_Inoue\n- https://npb.jp/m/draft/2019/draftlist_t.html\n- https://c.npb.jp/geneki_draft/2025/\n- https://npb.jp/announcement/2026/registered_m.html\n- https://www.daily.co.jp/baseball/2019/08/22/0012630303.shtml\n- https://www.nikkansports.com/baseball/news/202609260001502.html\n- https://www.daily.co.jp/baseball/2026/09/26/0020863468.shtml\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true, "number": "39", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/3/33/Kouta_Inoue_Hanshin_Tigers_20230307.jpg", "file": "https://commons.wikimedia.org/wiki/File:Kouta_Inoue_Hanshin_Tigers_20230307.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E4%BA%95%E4%B8%8A%E5%BA%83%E5%A4%A7", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Kouta_Inoue_Hanshin_Tigers_20230307.jpg/330px-Kouta_Inoue_Hanshin_Tigers_20230307.jpg"}}, {"team": "ロッテ", "section": "予想スタメン", "name": "山崎剛", "title": "山崎剛（#38、遊撃・9番、右投左打、30歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**50m5秒8**とされる俊足と、遊撃・二塁・三塁をこなせる守備力が強みなのだ。楽天時代には中堅で先発した経験もあり、試合途中の配置転換にも対応できる。\n- ユニークポイント：2025年は左膝手術で一軍出場がなく楽天を戦力外になったが、ロッテと育成契約し、2026年6月に支配下へ戻った。==一度支配下の枠を失ってから、背番号38で一軍の遊撃争いまで戻ってきた選手なのだ==。\n\n### 見どころ\n- 今日の試合で見るべき場面：9番・遊撃で先発するなら、まず守備で二遊間の打球をどこまで処理できるかを見るとよい。打席では出塁して1番へつなげる役割と、バントで走者を進める場面が見どころになる。\n- 注目の数字・プレー：9月26日時点で**56試合、打率.226、3盗塁**。派手な数字ではないが、26日は2安打、27日は犠打を決めており、==下位打線で「打つ・送る・走る」を使い分ける役目==なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発・福島蓮には2026年の対戦で**3打数0安打、2三振**。左打者でもまだ結果が出ていないため、低めの変化球を見極めて出塁できるかが焦点になる。\n\n### 出立ち\n- 身長・体重・体格：**173cm・74kg**で、プロ野球選手としては小柄な部類なのだ。大きさより俊足と身のこなしで勝負するタイプだ。\n- 投打・フォームの特徴：右投げ左打ち。打撃では初球から振れる積極性が持ち味で、走力を生かして内野安打や次の塁を狙える。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「目の茶色さ」、試合前のルーティンを「風呂入る」と回答している。小柄な体格と素早い守備の動きで見分けやすい。\n- 背番号の由来・愛称・登場曲：ロッテでは育成入団時に**138**、2026年6月の支配下復帰で**38**になった。愛称は「つよし」で、球団公式の2026年選手ページには登場曲の掲載がない。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：福岡県福岡市早良区出身。家族について詳しい公開情報は多くないが、小学3年から田隈ジュニアで野球を始めた。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：飯倉小では田隈ジュニア、原中では城南サンボーイズ、日章学園高、國學院大へ進んだ。高校は甲子園出場がなかったが、大学で一気に評価を上げたのだ。\n- 野球のエピソード：國學院大2年春に**打率.400で首位打者**となり、2年春と3年春に二塁手のベストナイン。4年秋には東都大学1部で史上24人目、國學院大では初の通算100安打を達成した。\n- 野球以外のエピソード：國學院大の取材では、野球部が練習だけでなく日常生活の姿勢まで重視する文化を語っている。大学では副主将としてチームを引っ張る立場でもあった。\n- 印象的な試合：2017年10月11日の東都大学リーグ・東洋大戦で、初回に中前打を放って通算**100安打**へ到達。チームも1-0で勝ち、節目の一打が勝利につながった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：東都大学1部通算**103安打、打率.328、28盗塁**、ベストナイン2回。2016年には第40回日米大学野球選手権の日本代表に選ばれた。\n- ドラフト・入団（年・順位・球団・契約）：**2017年ドラフト3位**で楽天から指名され、推定契約金5000万円、年俸1000万円で合意。入団時の背番号は34だった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2018年に楽天で一軍デビューし、2021年から出場機会を増やした。2023年は自己最多の**117試合**、2024年は体調不良で出遅れて5試合、2025年は左膝手術で一軍出場なしとなり、オフに楽天を戦力外となってロッテへ育成入団した。\n- 野球のエピソード：2020年から出場機会を増やすため外野守備にも取り組み、実際に中堅で先発した。2022年には自己最多**15盗塁**を記録し、俊足を一軍で形にしたのだ。\n- 野球以外のエピソード：2020年だけ登録名を「山﨑幹史」に変更した。「体幹を強くしたい」と「幹」の字を入れ、親に相談せず決めたため後に怒られ、翌年から本名へ戻したという独特のエピソードがある。\n- 印象的な試合：2023年4月22日の日本ハム戦で、9回無死満塁から田中正義を打って**サヨナラ安打**。楽天でのキャリアを代表する一打の一つなのだ。\n- 実績（タイトル・表彰・通算記録・代表）：一軍タイトルはないが、2023年に117試合、2022年に15盗塁を記録。複数ポジションを守りながら、代走・守備固め・先発のすべてを経験してきた。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**56試合、146打数33安打、打率.226、1本塁打、7打点、3盗塁**。前年一軍出場ゼロから、50試合以上に出るところまで戻した。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2025年3月に左膝の自家骨軟骨柱移植術を受け、復帰見込みは約6か月とされた。同年11月にロッテと育成契約し、2026年6月5日に支配下契約へ移行、背番号38で一軍に合流した。\n- 野球のエピソード：支配下復帰時までにファームで**55打数17安打、打率.309**。6月13日のDeNA戦では途中出場から2安打を放ち、ロッテ移籍後初安打を記録した。\n- 野球以外のエピソード：球団公式Q&Aでは自分へのご褒美を「スタバ」、最近買ってよかったものを「ソファー」と回答。苦手なのは「じっとしとくこと」で、本人らしい動き続ける性格がうかがえる。\n- 印象的な試合：8月12日のソフトバンク戦で上沢直之のフォークを捉え、右翼ホームランテラスへ**移籍後1号の2ラン**。==育成契約から支配下へ戻ったシーズンに、一軍で本塁打まで取り戻した==。\n- 実績（今季の記録・表彰）：6月5日に支配下復帰し、9月26日までに56試合へ出場。個人表彰はないが、前年一軍出場なしから遊撃の先発候補まで役割を広げたこと自体が今季の大きな実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦なし。26日の西武戦は**4打数2安打**、27日の日本ハム戦は**3打数0安打**だったが4回に送りバントを成功させた。\n- エピソード：26日は2安打しながら盗塁を試みて失敗、翌27日は安打が出なくても犠打で仕事をした。数字に残りにくい役割を担う場面が多いのだ。\n- 調子：26日にマルチ安打（1試合2安打以上）が出た一方、27日は無安打。直近1試合だけで好不調を決めにくいが、9月には古巣・楽天との3連戦で**9打数6安打**を記録するなど上向く時期もあった。\n- 分析・論点：遊撃は打撃だけでなく守備の安定が起用に直結するポジションなのだ。福島には今季3打数0安打2三振なので、下位から四球や内野安打でも出塁し、上位へ回すことが価値になる。\n- 今日の見どころ：==一番分かりやすいのは遊撃守備で、打球への最初の一歩と一塁への送球を追うこと==。打席では9番から1番へつなぐ「第二の1番」のような役割を果たせるかを見るとよい。\n\n### 出典\n- https://npb.jp/bis/players/73175136.html\n- https://www.marines.co.jp/team/player/detail/2026_00001803.html\n- https://ja.wikipedia.org/wiki/%E5%B1%B1%EF%A8%91%E5%89%9B_(%E5%86%85%E9%87%8E%E6%89%8B)\n- https://en.wikipedia.org/wiki/Tsuyoshi_Yamasaki\n- https://www.kokugakuin.ac.jp/article/20726\n- https://www.kokugakuin.ac.jp/news/39146\n- https://www.nissho.ac.jp/topix/baseball/%E5%B1%B1%E5%B4%8E%E5%89%9B%E9%81%B8%E6%89%8B%E3%81%8C%E3%83%97%E3%83%AD%E9%87%8E%E7%90%83%E3%83%89%E3%83%A9%E3%83%95%E3%83%88%E4%BC%9A%E8%AD%B0%E3%81%AB%E3%81%A6%E6%9D%B1%E5%8C%97%E6%A5%BD%E5%A4%A9/\n- https://www.rakuteneagles.jp/news/detail/202500777448.html\n- https://www.marines.co.jp/news/detail/202500746071.html\n- https://www.marines.co.jp/news/detail/202600857269.html\n- https://www.nikkansports.com/baseball/news/202606050001138.html\n- https://www.nikkansports.com/baseball/news/202608120001468.html\n- https://www.sponichi.co.jp/baseball/news/2025/11/14/kiji/20251114s00001173080000c.html\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true, "number": "38"}, {"team": "ロッテ", "section": "スタメン候補", "name": "安田尚憲", "title": "安田尚憲（#5、内野、右投左打、27歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**188cm・100kg**の大きな体を生かした左の長打力が持ち味なのだ。2026年は9月26日時点で**打率.262、6本塁打、16二塁打**と、本塁打だけでなく二塁打でも長打を増やしている。\n- ユニークポイント：履正社高時代に高校通算**65本塁打**を放ち、早稲田実の清宮幸太郎と同学年の強打者として注目された。==2017年ドラフトでは清宮の抽選を外した3球団が安田を1位指名し、ロッテが交渉権を得た==という経緯がある。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発なら一塁または指名打者で、右投手の福島蓮に対して左打席から強い打球を飛ばせるかが見どころなのだ。代打なら、走者を置いた一打席で長打を狙う場面に注目するとよい。\n- 注目の数字・プレー：9月26日時点で**210打数55安打、打率.262、6本塁打、29打点**。2024、2025年は一軍で本塁打が0本だったため、==今季は長打力を数字として取り戻しているシーズン==なのだ。\n- 対戦相手との関係（今日の先発・打線との相性）：福島蓮とは2026年に**3打数1安打、打率.333**。対戦数は少ないが、右投手に対する左打者という組み合わせなので、外角球を左方向へ運ぶか、内角を引っ張るかを見ると面白い。\n\n### 出立ち\n- 身長・体重・体格：**188cm・100kg**で、打席に立つとかなり大きく見える内野手なのだ。球団公式Q&Aでも自身のチャームポイントを「身体が大きいところ」と答えている。\n- 投打・フォームの特徴：右投げ左打ち。大柄ながらバットを大きく振り回すだけではなく、2026年は二塁打を**16本**放つなど、強いライナーで外野の間を抜く打撃も目立つ。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：大柄な体格と背番号5が最も見分けやすい。球団公式の2026年Q&Aでは髪型やひげの固定した特徴、試合前ルーティンについて具体的な回答は掲載されていない。\n- 背番号の由来・愛称・登場曲：入団以来の背番号は**5**で、球団公式のニックネームは「ヤス」。登場曲はMr.Childrenの「Worlds end」なのだ。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：大阪府吹田市出身。**6歳**のとき、兄が野球をしていたことに影響されて競技を始めたと侍ジャパン公式プロフィールに記されている。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：吹田市立豊津第一小で豊津東少年野球団と阪神タイガースジュニア、豊津中ではレッドスターベースボールクラブに所属し、履正社高へ進んだ。高校卒業後は大学・社会人を経ずにプロ入りした。\n- 野球のエピソード：履正社では1年秋からレギュラーとなり、高校通算**65本塁打**。3年春の選抜準決勝・報徳学園戦では右翼へ本塁打を放ち、チームの決勝進出に貢献した。\n- 野球以外のエピソード：侍ジャパンの高校時代Q&Aでは、好きな野球漫画として「ダイヤのA」を挙げている。プロ入り時には「周りの目も意識して、しっかりした行動を取りたい」と話し、18歳で社会人になる自覚を語っていた。\n- 印象的な試合：2017年の**第89回選抜高校野球大会準決勝・報徳学園戦**では2打数2安打1本塁打1打点、3四球。履正社は勝って決勝へ進み、安田は全国大会の大舞台で長打力を示したのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：2017年春の選抜で準優勝し、同年のU-18ワールドカップ日本代表にも選出された。U-18のオーストラリア戦では延長11回にサヨナラ適時打を放ち、プロ1年目の2018年にはU-23ワールドカップで**大会MVP**を受賞した。\n- ドラフト・入団（年・順位・球団・契約）：**2017年ドラフト1位**でロッテに入団。推定**契約金1億円、年俸1240万円**で契約し、背番号5を与えられた。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2018年に一軍デビューし、2020年から主力として113試合、2021年115試合、2022年119試合、2023年122試合に出場。2024年は55試合、2025年は93試合と出場数が減ったが、三塁・一塁などで競争を続けてきた。\n- 野球のエピソード：2020年には若くして4番を任され、**54打点**を記録した。打撃フォームの試行錯誤を重ねながら、長打だけでなく出塁や逆方向への打撃も求められてきた選手なのだ。\n- 野球以外のエピソード：2019年オフにはプエルトリコのウインターリーグへ派遣され、異なる環境で生活しながら実戦経験を積んだ。球団公式Q&Aでは自分へのご褒美を「買い物」と答えている。\n- 印象的な試合：2018年10月のU-23ワールドカップでは日本代表の一塁手として出場し、大会を通じた活躍でMVPを受賞した。プロ1年目に国際大会で個人表彰を得たことは、若手時代の代表的な実績なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：NPB一軍の個人タイトルはまだないが、2018年U-23ワールドカップで**大会MVP**。一軍では2020～2023年に4年連続100試合以上へ出場した。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**73試合、210打数55安打、打率.262、6本塁打、29打点、16二塁打**。出場数はフルシーズンのレギュラー級ではないが、打率と長打は前年より上向いている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年は三塁・一塁・指名打者の候補として出場し、7月下旬には**5試合連続で4番**を任された時期もあった。9月下旬は井上広大らとの一塁の出場争いで、ベンチスタートの日も増えている。\n- 野球のエピソード：7月26日のオリックス戦でも「4番・指名打者」で先発し、サブロー監督から中軸を託された。==固定された立場ではなく、結果を出しながら打順と守備位置を取り戻すシーズンになっている==。\n- 野球以外のエピソード：球団公式Q&Aではニックネームを「ヤス」、チャームポイントを「身体が大きいところ」と回答している。自分へのご褒美は「買い物」としており、短い回答ながら素顔がうかがえる。\n- 印象的な試合：今季は複数本塁打を放ち、9月26日時点で**6本塁打**まで伸ばしている。2024年と2025年は一軍で本塁打0本だったため、今季の本塁打復活そのものが大きな変化なのだ。\n- 実績（今季の記録・表彰）：今季の個人タイトル・月間表彰はない。==9月26日時点の打率.262は、規定打席未到達ながら自身の一軍シーズン打率として高い水準==にある。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦がなく、25日の西武戦に**7番・一塁**で先発して3打数0安打1三振。26日と27日は出場せず、これが直近の出場試合なのだ。\n- エピソード：25日に先発した後、26・27日は井上広大が一塁で先発し、安田は出場機会がなかった。下位打線で長打を量産している井上との競争が、今日の起用にも関わる。\n- 調子：直近の出場は3打数無安打で、その後2試合出番がないため、短期の打撃状態は判断材料が少ない。シーズン全体では**打率.262、長打率.424**と、打撃成績は一定の水準を保っている。\n- 分析・論点：福島には今季3打数1安打で、右投手相手に左の安田を起用する理由はある一方、井上が9月に長打を重ねている。スタメンなら「左打者をぶつける選択」、代打なら「一発のある左の切り札」という起用意図が見えやすい。\n- 今日の見どころ：==清宮幸太郎と同学年の高校時代から注目された安田が、同じ試合でどんな打席を見せるかも物語の一つ==。出番が来たら、初球から振るのか、球を見極めて甘い球を待つのかに注目なのだ。\n\n### 出典\n- https://npb.jp/bis/players/81885136.html\n- https://www.marines.co.jp/team/player/detail/2026_00001255.html\n- https://ja.wikipedia.org/wiki/%E5%AE%89%E7%94%B0%E5%B0%9A%E6%86%B2\n- https://en.wikipedia.org/wiki/Hisanori_Yasuda\n- https://www.japan-baseball.jp/jp/profile/201705013.html\n- https://www.japan-baseball.jp/jp/news/press/20170907_5.html\n- https://www.japan-baseball.jp/jp/news/press/20181029_2.html\n- https://www.nikkansports.com/baseball/highschool/senbatsu/2017/score/2017033001.html\n- https://www.nikkansports.com/baseball/professional/draft/history/history2017.html\n- https://www.nikkansports.com/baseball/news/201711250000642.html\n- https: では貝塚ヤングに所属。市立和歌山高では1年春から三塁手でベンチ入りし、1年秋から正捕手となった。\n- 野球のエピソード：中学の貝塚ヤングで小園健太とバッテリーを組み、3年夏に全国大会優勝。市立和歌山高でも小園とバッテリーを組み続け、2021年春の選抜に出場した。\n- 野球以外のエピソード：祖父に小さいころから甲子園へよく連れて行ってもらったと話している。また小園との新春対談では、虫が苦手で「ダンゴムシくらい」なら大丈夫、アニメや漫画が好きとも明かした。\n- 印象的な試合：2021年春の**第93回選抜高校野球大会**で、市立和歌山の主将・捕手として甲子園に出場した。高校最後の夏は和歌山大会決勝で智弁和歌山に敗れ、夏の甲子園出場は届かなかった。\n- 実績（甲子園・大学リーグ・代表・表彰など）：中学3年時に貝塚ヤングで全国制覇し、高校では2021年春の選抜へ出場。高校通算**43本塁打**を放ち、強打の捕手としてドラフト1位候補になった。\n- ドラフト・入団（年・順位・球団・契約）：**2021年ドラフト1位**でロッテが単独指名し、推定**契約金1億円、年俸1300万円**で契約。同じ市立和歌山の小園健太もDeNAから1位指名され、同一高校のバッテリーがそろってドラフト1位となる史上初の例になった。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2022年は高卒新人ながら**76試合**に出場し、開幕戦から先発捕手を務めた。2023年9試合、2024年2試合、2025年6試合と一軍出場は減ったが、2026年は再び出場機会を増やしている。\n- 野球のエピソード：2022年4月10日のオリックス戦では佐々木朗希とバッテリーを組み、佐々木の**完全試合、13者連続奪三振、1試合19奪三振**を支えた。松川自身も6回に3点適時二塁打を放ち、攻守で勝利に貢献したのだ。\n- 野球以外のエピソード：2022年オフには、中学時代の恩師・川端末吉監督の息子であるヤクルト川端慎吾らとの自主トレに参加した。球団公式Q&Aでは自分へのご褒美を「雪見だいふく」と答えている。\n- 印象的な試合：==2022年4月10日の佐々木朗希完全試合は、松川を語るうえで外せない一戦==なのだ。NPB公式も、高卒新人ながら大胆さと繊細さを併せ持つ配球で完全試合を演出したと紹介している。\n- 実績（タイトル・表彰・通算記録・代表）：個人タイトルやトップ代表歴はないが、高卒新人捕手として史上3人目の開幕戦先発マスクを経験。2022年の76試合出場と完全試合の捕手という実績が、若くして積んだ大きな財産なのだ。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**44試合、95打数18安打、打率.189、0本塁打、6打点、4犠打**。前年の6試合から大きく出場機会を増やした一方、打撃では27三振と課題も残っている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：春季キャンプから一軍定着を目標に争い、3月27日の開幕戦では毛利海大と組んで**開幕マスク**を任された。シーズン後半は佐藤都志也らが先発捕手を務める試合も増え、松川は先発と途中出場の両方で役割を担っている。\n- 野球のエピソード：2月のキャンプでは「まずはピッチャーからの信頼が大事」と話し、ブロッキングと送球を重点的に練習。3月27日の開幕戦では先発・毛利をリードし、自身も**2安打2打点**で3-1の勝利に貢献した。\n- 野球以外のエピソード：オフにはドジャースへ移った佐々木朗希と食事に行き、「もうちょっと打てるやろ」と励まされたと明かしている。かつて完全試合を組んだ先輩との交流を、打撃向上への刺激にしているのだ。\n- 印象的な試合：3月27日の西武との開幕戦で「9番・捕手」として先発し、2回に先制中前打、4回にも適時打を放った。==前年一軍無安打だった捕手が、開幕戦で2安打2打点を挙げた==のは今季の象徴的なスタートだった。\n- 実績（今季の記録・表彰）：今季の個人表彰はないが、9月26日時点で**44試合**に出場し、2023～2025年の3年間合計17試合を大きく上回った。開幕マスクを取り戻したことも今季の大きな実績なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：9月24日はロッテの一軍公式戦がなく、26日の西武戦はベンチ入りしたが出場なし。27日の日本ハム戦は8回から捕手として途中出場し、**1打数0安打1三振**だった。\n- エピソード：27日は井上広大に代わって捕手へ入り、それまで捕手だった佐藤都志也が一塁へ移った。捕手を交代しながら守備位置も動かす終盤の起用で、松川の「守備から入れる捕手」という役割が分かる場面だった。\n- 調子：9月27日の1打席は三振で、9月26日時点のシーズン打率も**.189**なので、打撃が好調とは言いにくい。一方、捕手としては途中出場でも試合を受け持てるため、打率だけで起用価値を判断しにくい選手なのだ。\n- 分析・論点：先発起用の論点は「打撃をどこまで期待するか」と「投手との組み合わせをどうするか」の両方にある。福島との対戦は1打数0安打1三振なので、打撃の相性より、ジャクソンや救援陣をどうリードするかの方が今日の価値を左右しやすい。\n- 今日の見どころ：==松川が出たら、打席だけでなく「ミットをどこに構えるか」「ワンバウンドを体で止めるか」「走者が出た時に二塁へ投げる準備をするか」を見ると捕手の仕事が分かる==。終盤に登場した場合は、若い捕手が僅差を締められるかに注目なのだ。\n\n### 出典\n- https://npb.jp/bis/players/53155155.html\n- https://www.marines.co.jp/team/player/detail/2026_00001252.html\n- https://ja.wikipedia.org/wiki/%E6%9D%BE%E5%B7%9D%E8%99%8E%E7%94%9F\n- https://en.wikipedia.org/wiki/Ko_Matsukawa\n- https://www.sponichi.co.jp/baseball/news/2021/03/29/kiji/20210329s00001002360000c.html?page=1\n- https://www.sponichi.co.jp/baseball/news/2021/10/11/kiji/20211011s00001000513000c.html?page=1\n- https://www.sponichi.co.jp/baseball/news/2021/10/11/kiji/20211006s00001728544000c.html?page=1\n- https://www.nikkansports.com/baseball/highschool/news/202101290000363.html\n- https://www.nikkansports.com/baseball/news/202111240000996.html\n- https://www.daily.co.jp/baseball/2021/11/24/0014866108.shtml\n- https://npb.jp/news/detail/20220412_01.html\n- https://www.nikkansports.com/baseball/news/202204100001208.html\n- https://www.nikkansports.com/baseball/news/202211270001101.html\n- https://www.nikkansports.com/baseball/news/202602170001596.html\n- https://www.sponichi.co.jp/baseball/news/2026/03/27/kiji/20260327s00001173438000c.html\n- https://www.sponichi.co.jp/baseball/news/2026/03/27/kiji/20260327s00001173291000c.html\n- https://www.daily.co.jp/baseball/2026/09/27/0020867128.shtml\n- https://npb.jp/scores/2026/0926/l-m-23/box.html\n- https://npb.jp/scores/2026/0927/m-f-23/box.html\n- https://www.baseballdata.jp/playerP/2100027_5.html", "detail": true, "number": "2", "photo": {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d8/Matukawa.2022.jpg", "file": "https://commons.wikimedia.org/wiki/File:Matukawa.2022.jpg", "wikipedia": "https://ja.wikipedia.org/wiki/%E6%9D%BE%E5%B7%9D%E8%99%8E%E7%94%9F", "thumb": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Matukawa.2022.jpg/330px-Matukawa.2022.jpg"}}, {"team": "ロッテ", "section": "スタメン候補", "name": "宮崎竜成", "title": "宮崎竜成（#44、内野・スタメン候補、右投左打、25歳）", "body": "### 特徴（強み、ユニークポイント）\n- 強み：**173cm・90kg**の低い重心から振り切る左打ちで、社会人時代から「走・攻・守の三拍子」と広角への長打力を評価されてきた内野手なのだ。本人も入団時に、打撃を評価されている一方で守備を課題に挙げており、二塁・三塁・遊撃をこなして出番を広げている。\n- ユニークポイント：母の児玉千佳さんは**1996年アトランタ五輪**ソフトボール日本代表の三塁手、父の茂夫さんも丸亀商（現・丸亀城西）で**1987年春の甲子園**に出場した野球一家なのだ。==両親とも大舞台を知る家庭から、ドラフト2位のプロ野球選手が出たという経歴が大きな個性==である。\n\n### 見どころ\n- 今日の試合で見るべき場面：先発なら、打席だけでなく遊撃など内野での一歩目を見ると分かりやすい。**9月25日**は「8番・遊撃」で先発し、26日と27日は山崎剛が遊撃で先発したため、今日はスタメンを取り返せるかが最初の見どころなのだ。\n- 注目の数字・プレー：**9月26日時点で41試合、打率.132、1本塁打、1打点**。一軍ではまだ結果が細い一方、7月の二軍降格後から9月11日の再昇格までに二軍で**33試合・打率.300（90打数27安打）・3本塁打・19打点**と打ち直しており、速球への対応を修正してきた点に注目したい。\n- 対戦相手との関係（今日の先発・打線との相性）：日本ハム先発の福島蓮は右投手で、宮崎は左打者なのだ。ただし今季の一軍打席は**39打席**と少なく、福島との直接対戦だけで相性を断定できる材料は乏しいため、まずは150km/h前後の速球に振り負けないかを見るのがよい。\n\n### 出立ち\n- 身長・体重・体格：**173cm・90kg**。プロ野球選手としては背が高い方ではないが、胸・下半身に厚みがあるパワー型で、低い重心を生かして強く振る体格なのだ。\n- 投打・フォームの特徴：右投左打。打撃では逆方向にも強い打球を飛ばすことを意識し、2025年にはMLBのフランシスコ・リンドーアやジャズ・チザムJr.のスイングも研究していた。\n- 見た目の特徴（髪型・ひげ・ルーティンなど）：球団公式Q&Aではチャームポイントを「**目**」、愛称を「ウーパールーパー」と答えている。2025年版では試合前のルーティンに「腹式呼吸」を挙げており、==細い目を自分でもキャラクターとして生かしている選手==なのだ。\n- 背番号の由来・愛称・登場曲：背番号は入団時から**44**で、入団交渉時には希望番号を聞かれて一度「21」と答え、当時の吉井理人監督の番号だと知って驚いたという話がある。**44を実際に与えられた理由については公開情報が見つかりませんでした**。愛称は「ウーパールーパー」、2026年の登場曲にはBLACKPINK「GO」、モーニング娘。「LOVEマシーン」、GLAY「流星のHowl」、ベリーグッドマン「雑草」を登録している。\n\n### プロまでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 出身地・家族：徳島県板野郡北島町出身。母・児玉千佳さんはアトランタ五輪ソフトボール日本代表、父・茂夫さんは甲子園出場経験者で、父はアトランタ五輪日本選手団のトレーナーも務めたのだ。\n- 経歴（小学校・中学・高校・大学・社会人／独立リーグ・海外）：北島南小3年で軟式野球を始め、北島中ではヤング徳島ホークス、創志学園高、立命館大、社会人のヤマハを経てロッテへ。創志学園では**2017年春・2018年夏の甲子園**に出場し、立命館大では1年秋からリーグ戦に出場、4年時に主将を務めた。\n- 野球のエピソード：大学4年の2022年はドラフト指名を待ったが指名されず、卒業後は野球をやめるつもりだったところをヤマハから誘われて続行した。ヤマハでは「プロへ行くなら2年」と期限を決め、他の選手が遊びに行く時間も休養や読書に回す生活を徹底し、2024年に二塁のレギュラーをつかんだのだ。\n- 野球以外のエピソード：ヤマハ時代に睡眠・食事・自己啓発・野球の本を読む習慣がつき、休日は一人でサウナにも行くと週刊ベースボールの取材で語っている。入団交渉時に好きなロッテ菓子として**アーモンドチョコレートとクランキーチョコレート**を挙げた。\n- 印象的な試合：高校3年夏の**2018年甲子園**では創志学園の一員として2試合を経験した。社会人2年目の2024年には都市対抗や日本選手権に出場し、プロのスカウトに二塁手としての打撃と身体能力を示したのだ。\n- 実績（甲子園・大学リーグ・代表・表彰など）：甲子園は春夏合わせて出場経験があり、立命館大では主将、ヤマハでは2024年に二塁の主力となった。社会人時代は遠投**110m**、50m走**5秒9**と紹介され、長打だけではない身体能力も評価材料になった。\n- ドラフト・入団（年・順位・球団・契約）：**2024年ドラフト2位**で千葉ロッテから指名され、同年11月14日に契約金**8000万円**、年俸**1400万円**（いずれも推定）で契約した。指名時には将来像として「トリプルスリー（打率3割・30本塁打・30盗塁）」やゴールデングラブ賞を目標に掲げたのだ。\n\n### プロでの経歴やエピソード（野球内外）、印象的な試合、実績\n- 経歴（年ごとの主な出来事・移籍）：2025年にロッテでプロ入りし、5月に初昇格。1年目は一軍**39試合、打率.194、3打点、1盗塁**で、2026年は一軍と二軍を行き来しながら内野の複数ポジションで起用されている。\n- 野球のエピソード：2025年1月にはMLBの打者の動画を見て、強い打球を逆方向へ運ぶスイングを研究していると語った。二塁だけでなく三塁の練習も行い、==「打つだけ」でなく守備位置を増やして一軍の席を取ろうとしてきた選手==なのだ。\n- 野球以外のエピソード：新人発表会ではロッテ菓子になぞらえて自分を売り込むなど、取材では柔らかな受け答えを見せる。球団公式Q&Aでは「自分へのご褒美＝睡眠」、趣味にゲームや読書を挙げており、社会人時代から休養を重視する姿勢が続いている。\n- 印象的な試合：**2025年7月9日の日本ハム戦**で山﨑福也からプロ初安打を記録した。初球のカットボールを中前へ運んだ一打で、プロでの「0」を一つ消した試合なのだ。\n- 実績（タイトル・表彰・通算記録・代表）：個人タイトルや一軍表彰はまだない。2025年終了時点では一軍39試合出場、2026年9月26日時点では通算**80試合、24安打、1本塁打、4打点**となっている。\n\n### 直近1年での経歴やエピソード（野球内外）、印象的な試合、実績\n- 今季の成績（9/26時点）：**41試合、39打席、38打数5安打、打率.132、1本塁打、1打点、出塁率.154、長打率.237**。三振は**15**で、少ない打席の中で一軍投手の速球にどう対応するかが課題として数字にも表れている。\n- 経歴（昇格・降格・故障・役割の変化・契約）：2026年7月9日に出場選手登録を外れ、その後は二軍で打撃を作り直し、**9月11日**に一軍再登録された。再昇格後は遊撃でも先発しており、二塁中心だったアマ時代から守備範囲を広げている。\n- 野球のエピソード：二軍で「自分の一番の持ち味は打つこと」と再確認し、特に速球を打つことをテーマにした。7月10日のくふうハヤテ戦で三塁打、7月19日の巨人戦では**144km/h**の直球を3ランにするなど、修正の手応えを積み上げたのだ。\n- 野球以外のエピソード：球団公式Q&Aでは2026年も愛称「ウーパールーパー」を継続し、登場曲を4曲登録している。派手な私生活の話よりも、睡眠・読書・サウナなどコンディショニング寄りの公開エピソードが多い選手なのだ。\n- 印象的な試合：9月11日の再昇格後に一軍で出番を得たこと自体が、二軍での**打率.300**の取り組みが評価された結果である。直近の9月25日には遊撃で先発し、打撃では2打数無安打2三振だった。\n- 実績（今季の記録・表彰）：今季は一軍で**プロ通算初本塁打となる1本**を記録している。一方、打率は.132で、表彰よりも「二軍で修正して一軍へ戻った」ことが今季の現在地なのだ。\n\n### 直近数試合の実績やエピソード、調子やそれを踏まえた分析や論点、見どころ\n- 直近の試合結果（9/24・9/26・9/27。出場していなければ最後に出た試合）：**9月24日はロッテに試合なし**。9月26日・27日は出場せず、最後の出場は9月25日の西武戦で「8番・遊撃」先発、**2打数0安打2三振
